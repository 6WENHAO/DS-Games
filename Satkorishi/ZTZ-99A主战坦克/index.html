<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZTZ-99A 主战坦克 · 组成结构演示模型</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <!-- 左上信息区 -->
    <div id="hud">
      <div class="hud-title">
        <b>ZTZ-99A</b><span>主战坦克 · 组成结构演示模型</span>
      </div>
      <div class="hud-stats" id="hudStats">正在装配模型…</div>
      <div class="hud-sel" id="hudSel" hidden>
        <span class="dot"></span><b id="hudSelName"></b>
        <em id="hudSelCat"></em>
      </div>
      <div class="hud-tip">
        鼠标左键旋转 · 滚轮缩放 · 右键平移 · 点击车体零件可直接选中 ·
        <kbd>空格</kbd> 开火 · <kbd>R</kbd> 复位 · <kbd>X</kbd> 透视 · <kbd>H</kbd> 收起面板
      </div>
    </div>

    <!-- 右侧设置面板 -->
    <button id="panelToggle" title="收起 / 展开面板 (H)">☰</button>
    <aside id="panel" aria-label="设置面板"></aside>

    <!-- 载入遮罩 -->
    <div id="loading">
      <div class="ld-box">
        <div class="ld-ring"></div>
        <div class="ld-txt">正在生成 99A 结构模型…</div>
        <div class="ld-sub" id="ldSub">初始化渲染器</div>
      </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="./src/main.js"></script>
    <noscript>本页面需要启用 JavaScript 与 WebGL2。</noscript>
  </body>
</html>
