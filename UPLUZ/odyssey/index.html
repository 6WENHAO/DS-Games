<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>CLOUDROAD — risk slice</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9f2f5; }
    body { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; }

    #gate {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: linear-gradient(170deg, #8fc4e8 0%, #e9f2f5 52%, #e4eec0 100%);
      transition: opacity 1.1s ease; z-index: 10; cursor: default;
    }
    #gate.ready { cursor: pointer; }
    #gate.gone { opacity: 0; pointer-events: none; }
    #gate .inner { text-align: center; color: #2e4a54; }
    #gate h1 {
      margin: 0; font-size: clamp(34px, 7vw, 76px); font-weight: 300;
      letter-spacing: 0.34em; text-indent: 0.34em;
    }
    #gate p.sub {
      margin: 14px 0 0; font-size: 13px; letter-spacing: 0.24em;
      text-transform: uppercase; opacity: 0.55;
    }
    #gate-note {
      margin-top: 46px; font-size: 12px; letter-spacing: 0.16em;
      opacity: 0.45; transition: opacity .4s;
    }

    .perf {
      position: fixed; top: 12px; left: 12px; z-index: 5;
      font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #2e4a54; background: rgba(251, 247, 238, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(46, 74, 84, 0.12); border-radius: 8px;
      padding: 9px 12px; min-width: 226px; pointer-events: none;
    }
    .perf .row { display: flex; justify-content: space-between; gap: 14px; }
    .perf .row span { opacity: 0.5; }
    .perf b { font-weight: 600; }
    .perf b.ok { color: #3f7a5e; }
    .perf b.warn { color: #b1791f; }
    .perf b.bad { color: #b1472f; }
    .perf i { opacity: 0.4; font-style: normal; }
    .perf .hint {
      margin-top: 7px; padding-top: 6px; opacity: 0.42;
      border-top: 1px solid rgba(46, 74, 84, 0.12); font-size: 10px;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="gate">
    <div class="inner">
      <h1>CLOUDROAD</h1>
      <p class="sub">a very long walk toward something beautiful</p>
      <div id="gate-note">warming shaders…</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
