<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多级倒立摆与无穷维连续体控制实验室</title>
<style>
:root{
  --bg:#0a0e13; --panel:#111823; --panel2:#0d141d; --line:#1e2b3a; --line2:#2b3d52;
  --fg:#dce6f2; --dim:#8ca0b8; --dim2:#6b7f96;
  --acc:#4db6ff; --acc2:#7c5cff; --ok:#35d68a; --warn:#ffc94d; --bad:#ff6b6b;
  --c1:#4db6ff; --c2:#ffc94d; --c3:#35d68a; --c4:#ff7ad9; --c5:#ff8a5c;
  --fs:13px; --fsm:12px; --pw:392px; --gap:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:var(--fs);overflow:hidden}
#app{display:grid;grid-template-columns:1fr var(--pw);grid-template-rows:auto 1fr;
  height:100vh;width:100vw;gap:var(--gap);padding:var(--gap)}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(90deg,#111a26,#0d141d);border:1px solid var(--line);border-radius:6px;padding:7px 11px}
#top .ttl{font-size:15px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
#top .ttl span{font-size:var(--fsm);font-weight:400;color:var(--dim);margin-left:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:#16202c;border:1px solid var(--line2);color:var(--dim);border-radius:4px;
  padding:4px 9px;cursor:pointer;font-size:var(--fsm);white-space:nowrap}
.tab:hover{color:var(--fg);border-color:var(--acc)}
.tab.on{background:#153048;border-color:var(--acc);color:#eaf6ff;box-shadow:0 0 0 1px rgba(77,182,255,.25) inset}
#topStat{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:var(--fsm);
  font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
#topStat b{font-weight:600}
.pill{border:1px solid var(--line2);border-radius:10px;padding:2px 8px;background:#0f1620;color:var(--dim)}
.pill.ok{color:var(--ok);border-color:#1d4a35}
.pill.bad{color:var(--bad);border-color:#5a2530}
.pill.warn{color:var(--warn);border-color:#5a4a20}
#left{display:grid;grid-template-rows:minmax(240px,45fr) minmax(200px,55fr);gap:var(--gap);min-width:0;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;position:relative;min-height:0;min-width:0;overflow:hidden}
.card>canvas{display:block;width:100%;height:100%}
.cardTag{position:absolute;left:8px;top:6px;font-size:11px;color:var(--dim2);pointer-events:none;letter-spacing:.4px}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-y:auto;overflow-x:hidden;padding:8px 9px 40px}
#panel::-webkit-scrollbar{width:9px}
#panel::-webkit-scrollbar-thumb{background:#243244;border-radius:5px}
#panel::-webkit-scrollbar-track{background:#0d131b}
details.sec{border:1px solid var(--line);border-radius:5px;margin-bottom:7px;background:var(--panel2)}
details.sec>summary{cursor:pointer;padding:6px 8px;font-weight:600;font-size:var(--fsm);
  color:#cfe0f2;background:#141d29;border-radius:4px;list-style:none;display:flex;align-items:center;gap:6px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--acc);font-size:10px}
details.sec[open]>summary::before{content:"▾"}
details.sec>div.body{padding:7px 8px 9px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.row>label{color:var(--dim);font-size:var(--fsm);min-width:96px;flex:0 0 auto}
.row.tight>label{min-width:74px}
.grp{display:flex;gap:3px;flex-wrap:wrap}
button{background:#17222f;border:1px solid var(--line2);color:var(--fg);border-radius:4px;
  padding:4px 8px;cursor:pointer;font-size:var(--fsm);font-family:inherit}
button:hover:not(:disabled){border-color:var(--acc);background:#1a2836}
button:active:not(:disabled){background:#22364a}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:#153048;border-color:var(--acc);color:#eaf6ff}
button.go{background:#14352a;border-color:#2b6b4d;color:#bdf3d6}
button.go:hover{border-color:var(--ok)}
button.dz{background:#33201f;border-color:#6b3030;color:#ffc9c9}
input[type=number],input[type=text],select{background:#0c131c;border:1px solid var(--line2);color:var(--fg);
  border-radius:3px;padding:3px 5px;font-size:var(--fsm);font-family:inherit;width:74px;
  font-variant-numeric:tabular-nums}
input[type=number]:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=range]{width:120px;accent-color:var(--acc);height:16px}
input[type=checkbox]{accent-color:var(--acc)}
.val{color:var(--acc);font-variant-numeric:tabular-nums;font-size:var(--fsm);min-width:52px;display:inline-block}
.hint{color:var(--dim2);font-size:11px;line-height:1.55;margin:4px 0}
.hint b{color:var(--dim)}
table.kv{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
table.kv td{padding:2px 3px;border-bottom:1px solid #16202c;vertical-align:top}
table.kv td:first-child{color:var(--dim);white-space:nowrap;width:47%}
table.kv td:last-child{color:var(--fg);text-align:right;font-family:Consolas,monospace}
table.dat{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
table.dat th,table.dat td{border:1px solid #1a2532;padding:2px 4px;text-align:right;font-family:Consolas,monospace}
table.dat th{background:#141d29;color:var(--dim);font-weight:600;text-align:center;font-family:inherit}
table.dat td:first-child,table.dat th:first-child{text-align:left}
table.dat tr.fail td{background:#2a1518}
table.dat tr.pass td{background:#0f1a15}
table.dat tr.info td{background:#131c26}
.tag{display:inline-block;padding:0 4px;border-radius:3px;font-size:10px;font-weight:600}
.tag.p{background:#14402c;color:#8ff0bd}
.tag.f{background:#4a1a20;color:#ffb3b3}
.tag.i{background:#183045;color:#a9d9ff}
pre.mono{margin:3px 0;padding:6px;background:#080d13;border:1px solid var(--line);border-radius:4px;
  font-size:10.5px;line-height:1.45;color:#b9cde3;max-height:210px;overflow:auto;white-space:pre;font-family:Consolas,monospace}
.doc{font-size:11.5px;line-height:1.68;color:#b6c8dc}
.doc h4{margin:9px 0 3px;font-size:12px;color:var(--acc)}
.doc code{background:#0b1219;padding:0 3px;border-radius:2px;color:#ffd9a0;font-family:Consolas,monospace}
.doc ul{margin:3px 0 3px 16px;padding:0}
.doc li{margin:2px 0}
.warnbox{border:1px solid #5a4a20;background:#1d1809;color:#ffdf9b;padding:5px 7px;border-radius:4px;font-size:11px;line-height:1.5;margin:5px 0}
.badbox{border:1px solid #5a2530;background:#1e0f12;color:#ffc0c0;padding:5px 7px;border-radius:4px;font-size:11px;line-height:1.5;margin:5px 0}
.okbox{border:1px solid #1d4a35;background:#0c1a14;color:#b6f0d2;padding:5px 7px;border-radius:4px;font-size:11px;line-height:1.5;margin:5px 0}
#fatal{position:fixed;inset:0;background:#0a0e13ee;z-index:99;display:none;align-items:center;justify-content:center;padding:40px}
#fatal.show{display:flex}
#fatal[hidden]{display:none!important}
#fatal>div{max-width:880px;border:1px solid #5a2530;background:#140a0c;border-radius:8px;padding:18px 22px}
#fatal h2{margin:0 0 8px;color:var(--bad);font-size:17px}
#fatal pre{white-space:pre-wrap;font-size:12px;color:#ffc0c0;font-family:Consolas,monospace;max-height:44vh;overflow:auto}
#fatal .acts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#errBar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:98;max-width:min(1100px,92vw);
  border:1px solid #5a4a20;background:#1d1809f2;color:#ffdf9b;border-radius:6px;padding:7px 10px;font-size:12px;
  display:none;align-items:center;gap:10px;box-shadow:0 4px 18px #0008}
#errBar.show{display:flex}
#errBar span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace}
#legend{position:absolute;right:8px;top:6px;font-size:10.5px;color:var(--dim2);text-align:right;pointer-events:none;line-height:1.5}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.linkTab{width:100%;border-collapse:collapse;font-size:11px}
.linkTab th{color:var(--dim);font-weight:500;font-size:10.5px;padding:1px 2px}
.linkTab td{padding:1px 2px}
.linkTab input{width:100%;min-width:0;padding:2px 3px;font-size:10.5px}
@media (min-width:2400px){
  :root{--fs:16px;--fsm:14.5px;--pw:520px;--gap:11px}
  input[type=number],input[type=text],select{width:92px}
  input[type=range]{width:160px}
  table.kv{font-size:13.5px} table.dat{font-size:13px} .hint{font-size:13px} .doc{font-size:13.5px}
  pre.mono{font-size:12.5px;max-height:300px}
  #top .ttl{font-size:19px}
}
@media (max-width:1100px){ :root{--pw:340px} }
</style>

<body>
<div id="app">
  <header id="top">
    <div class="ttl">多级倒立摆与无穷维连续体控制实验室<span id="ttlSub">单小车水平力驱动 · 欠驱动系统</span></div>
    <div class="tabs" id="modeTabs"></div>
    <div id="topStat"></div>
  </header>
  <section id="left">
    <div class="card" id="stageCard">
      <canvas id="stage"></canvas>

      <div id="legend"></div>
    </div>

  <aside id="panel"></aside>
</div>
<div id="fatal" hidden><div><h2 id="fatalTitle">页面初始化失败</h2><pre id="fatalMsg"></pre>

  <span style="color:#8ca0b8;font-size:11.5px">若为初始化失败，页面功能可能不完整；请把上面的文字反馈给开发者。</span></div></div></div>
<div id="errBar"><span id="errBarMsg"></span><button id="errBarShow">详情</button><button id="errBarHide">忽略</button></div>

<script>
"use strict";
/* =======================================================================================
   多级倒立摆与无穷维连续体控制实验室  ——  物理 / 数值 / 控制核心（无 DOM 依赖）
   ---------------------------------------------------------------------------------------
   本脚本只包含数学与物理，可在 Node 中直接提取运行 PIP.runSelfTests()。
   单位：m, kg, s, rad, N, N·m²(EI), N·m·s(η)。角度 θ_i 为第 i 根连杆相对竖直向上的绝对角。
   ======================================================================================= */
var PIP = (function () {

const MEPS = 2.220446049250313e-16;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const isFin = (v) => typeof v === "number" && Number.isFinite(v);
function allFinite(arr) { for (let i = 0; i < arr.length; i++) if (!Number.isFinite(arr[i])) return false; return true; }

/* ------------------------------------------------------------------ 可复现随机数 */
function makeRng(seed) {
  let s = (seed | 0) || 1;
  const r = {
    seed: s >>> 0,
    _s: (s >>> 0),
    next() { // mulberry32
      r._s = (r._s + 0x6D2B79F5) >>> 0;
      let t = r._s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    uni(a, b) { return a + (b - a) * r.next(); },
    _spare: null,
    gauss() { // Box-Muller，带缓存
      if (r._spare !== null) { const v = r._spare; r._spare = null; return v; }
      let u = 0, v = 0, s2 = 0;
      do { u = 2 * r.next() - 1; v = 2 * r.next() - 1; s2 = u * u + v * v; } while (s2 >= 1 || s2 === 0);
      const f = Math.sqrt(-2 * Math.log(s2) / s2);
      r._spare = v * f; return u * f;
    },
    reset(sd) { r.seed = (sd === undefined ? r.seed : (sd >>> 0)); r._s = r.seed; r._spare = null; }
  };
  return r;
}

/* ================================================================================
   1. 线性代数：矩阵以 {r,c,a} 行主序存储；不提供显式 inverse 用于动力学求解。
   ================================================================================ */
function mat(r, c) { return { r: r, c: c, a: new Float64Array(r * c) }; }
function matFrom(r, c, src) { const m = mat(r, c); m.a.set(src); return m; }
function eye(n, s) { const m = mat(n, n); const v = (s === undefined ? 1 : s); for (let i = 0; i < n; i++) m.a[i * n + i] = v; return m; }
function mcopy(A) { return { r: A.r, c: A.c, a: Float64Array.from(A.a) }; }
function mget(A, i, j) { return A.a[i * A.c + j]; }
function mset(A, i, j, v) { A.a[i * A.c + j] = v; }
function madd(A, i, j, v) { A.a[i * A.c + j] += v; }
function tr(A) { const T = mat(A.c, A.r); for (let i = 0; i < A.r; i++) for (let j = 0; j < A.c; j++) T.a[j * A.r + i] = A.a[i * A.c + j]; return T; }
function mmul(A, B, out) {
  const r = A.r, k = A.c, c = B.c, a = A.a, b = B.a;
  const o = (out && out.r === r && out.c === c) ? out : mat(r, c);
  o.a.fill(0);
  const oa = o.a;
  for (let i = 0; i < r; i++) {
    const ir = i * k, io = i * c;
    for (let p = 0; p < k; p++) {
      const v = a[ir + p]; if (v === 0) continue;
      const bp = p * c;
      for (let j = 0; j < c; j++) oa[io + j] += v * b[bp + j];
    }
  }
  return o;
}
function mmulTA(A, B) { // AᵀB
  const r = A.c, k = A.r, c = B.c, o = mat(r, c), a = A.a, b = B.a, oa = o.a;
  for (let p = 0; p < k; p++) {
    const ap = p * r, bp = p * c;
    for (let i = 0; i < r; i++) {
      const v = a[ap + i]; if (v === 0) continue;
      const io = i * c;
      for (let j = 0; j < c; j++) oa[io + j] += v * b[bp + j];
    }
  }
  return o;
}
function mmulTB(A, B) { // ABᵀ
  const r = A.r, k = A.c, c = B.r, o = mat(r, c), a = A.a, b = B.a;
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) {
    let s = 0; const ir = i * k, jr = j * k;
    for (let p = 0; p < k; p++) s += a[ir + p] * b[jr + p];
    o.a[i * c + j] = s;
  }
  return o;
}
function mlin(A, B, ca, cb) { // ca*A + cb*B
  const o = mat(A.r, A.c);
  for (let i = 0; i < o.a.length; i++) o.a[i] = ca * A.a[i] + cb * B.a[i];
  return o;
}
function mscale(A, s) { const o = mcopy(A); for (let i = 0; i < o.a.length; i++) o.a[i] *= s; return o; }
function mvec(A, x, out) {
  const r = A.r, c = A.c, o = out || new Float64Array(r);
  for (let i = 0; i < r; i++) { let s = 0; const ir = i * c; for (let j = 0; j < c; j++) s += A.a[ir + j] * x[j]; o[i] = s; }
  return o;
}
function normF(A) { let s = 0; for (let i = 0; i < A.a.length; i++) s += A.a[i] * A.a[i]; return Math.sqrt(s); }
function maxAbs(A) { let s = 0; const a = A.a || A; for (let i = 0; i < a.length; i++) { const v = Math.abs(a[i]); if (v > s) s = v; } return s; }
function norm1(A) { let m = 0; for (let j = 0; j < A.c; j++) { let s = 0; for (let i = 0; i < A.r; i++) s += Math.abs(A.a[i * A.c + j]); if (s > m) m = s; } return m; }
function vnorm(x) { let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * x[i]; return Math.sqrt(s); }
function vmaxAbs(x) { let s = 0; for (let i = 0; i < x.length; i++) { const v = Math.abs(x[i]); if (v > s) s = v; } return s; }
function symmetrize(A) { const n = A.r, o = mat(n, n); for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) o.a[i * n + j] = 0.5 * (A.a[i * n + j] + A.a[j * n + i]); return o; }
function symDefect(A) { // 最大非对称度（相对）
  const n = A.r; let d = 0, s = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    d = Math.max(d, Math.abs(A.a[i * n + j] - A.a[j * n + i]));
    s = Math.max(s, Math.abs(A.a[i * n + j]));
  }
  return s > 0 ? d / s : 0;
}

/* ---- 带部分主元的 LU 分解；动力学求解与所有线性方程都走这里，不做显式求逆 ---- */
function luFactor(Ain) {
  const n = Ain.r, a = Float64Array.from(Ain.a), piv = new Int32Array(n);
  let sign = 1, ok = true, minPiv = Infinity, maxPiv = 0;
  for (let i = 0; i < n; i++) piv[i] = i;
  for (let k = 0; k < n; k++) {
    let p = k, mx = Math.abs(a[k * n + k]);
    for (let i = k + 1; i < n; i++) { const v = Math.abs(a[i * n + k]); if (v > mx) { mx = v; p = i; } }
    if (!(mx > 0) || !Number.isFinite(mx)) { ok = false; minPiv = 0; continue; }
    if (p !== k) {
      for (let j = 0; j < n; j++) { const t = a[k * n + j]; a[k * n + j] = a[p * n + j]; a[p * n + j] = t; }
      const t = piv[k]; piv[k] = piv[p]; piv[p] = t; sign = -sign;
    }
    const d = a[k * n + k];
    if (Math.abs(d) < minPiv) minPiv = Math.abs(d);
    if (Math.abs(d) > maxPiv) maxPiv = Math.abs(d);
    for (let i = k + 1; i < n; i++) {
      const f = a[i * n + k] / d; a[i * n + k] = f;
      if (f !== 0) for (let j = k + 1; j < n; j++) a[i * n + j] -= f * a[k * n + j];
    }
  }
  return { n: n, a: a, piv: piv, sign: sign, ok: ok, pivRatio: (maxPiv > 0 ? minPiv / maxPiv : 0) };
}
function luSolveVec(d, b, out) {
  const n = d.n, a = d.a, x = out || new Float64Array(n);
  for (let i = 0; i < n; i++) x[i] = b[d.piv[i]];
  for (let i = 1; i < n; i++) { let s = x[i]; const ir = i * n; for (let j = 0; j < i; j++) s -= a[ir + j] * x[j]; x[i] = s; }
  for (let i = n - 1; i >= 0; i--) {
    let s = x[i]; const ir = i * n;
    for (let j = i + 1; j < n; j++) s -= a[ir + j] * x[j];
    x[i] = s / a[ir + i];
  }
  return x;
}
function luSolveMat(d, B) {
  const n = d.n, c = B.c, X = mat(n, c), col = new Float64Array(n), res = new Float64Array(n);
  for (let j = 0; j < c; j++) {
    for (let i = 0; i < n; i++) col[i] = B.a[i * c + j];
    luSolveVec(d, col, res);
    for (let i = 0; i < n; i++) X.a[i * c + j] = res[i];
  }
  return X;
}
function solveMat(A, B) { const d = luFactor(A); return d.ok ? luSolveMat(d, B) : null; }
function condEst1(A) { // 1-范数条件数（n 较小时用显式求逆，仅用于诊断显示，不参与动力学）
  const d = luFactor(A); if (!d.ok) return Infinity;
  const Inv = luSolveMat(d, eye(A.r));
  if (!allFinite(Inv.a)) return Infinity;
  return norm1(A) * norm1(Inv);
}
function cholFactor(A) { // 返回下三角 L 使 A = L Lᵀ；A 非正定返回 null
  const n = A.r, L = mat(n, n);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let s = A.a[i * n + j];
      for (let k = 0; k < j; k++) s -= L.a[i * n + k] * L.a[j * n + k];
      if (i === j) { if (!(s > 0) || !Number.isFinite(s)) return null; L.a[i * n + i] = Math.sqrt(s); }
      else L.a[i * n + j] = s / L.a[j * n + j];
    }
  }

  return { N: N, jx: new Float64Array(N + 1), jy: new Float64Array(N + 1), cx: new Float64Array(N + 1), cy: new Float64Array(N + 1), tipx: 0, tipy: 0 };

/* ================================================================================
   5. 数值线性化
      推荐路径：对与仿真完全相同的 RK4 单步（控制周期内 nSub 个子步、u 零阶保持）

  s[nq] = 0.5;                                 // 小车速度 [m/s]

/* ================================================================================

      · 秩与 PBH 都在连续时间对 (A,B) 上做：采样周期很小时离散对 (A_d,B_d) 的
        可控性矩阵会额外病态（A_d≈I+A·T_c），那属于采样带来的数值假象。

function drawCharts() {

  const rows = Math.ceil(defs.length / cols);

  for (let i = 0; i < defs.length; i++) {
    const rx = (i % cols) * cw, ry = Math.floor(i / cols) * ch;

function drawChart(ctx, def, r) {
  const T_WIN = 18;

  ctx.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
  const padL = 46, padB = 14, padT = 15, padR = 6;
  const px = r.x + padL, py = r.y + padT, pw = Math.max(10, r.w - padL - padR), ph = Math.max(10, r.h - padT - padB);

  const tStart = Math.max(0, tEnd - T_WIN);
  // 数据范围
  let lo = Infinity, hi = -Infinity, any = false;
  const gather = [];
  def.s.forEach(se => {
    const ring = se.sim && se.sim.ring;
    if (!ring || !ring.d[se.key]) { gather.push(null); return; }
    const arr = ring.d[se.key], ta = ring.d.t, n = ring.n;
    const pts = [];
    const step = Math.max(1, Math.floor(n / Math.max(60, pw)));
    for (let j = 0; j < n; j += step) {
      const pos = P.ringPos(ring, j), t = ta[pos];
      if (t < tStart - 1e-9) continue;
      const v = arr[pos] * (se.mul || 1);
      if (!Number.isFinite(v)) continue;
      pts.push(t, v);
      if (v < lo) lo = v; if (v > hi) hi = v; any = true;
    }
    gather.push(pts);

  if (def.href !== undefined) { lo = Math.min(lo, def.href); hi = Math.max(hi, def.href); }
  if (hi - lo < 1e-12) { hi += 1e-6; lo -= 1e-6; }

  const YY = (v) => py + ph - (v - lo) / (hi - lo) * ph;

    const sm = def.s[0].sim, ring = sm && sm.ring;

      }

  if (lo < 0 && hi > 0) ctx.fillText("0", px - 4, YY(0) + 3);
  ctx.textAlign = "left";
  ctx.fillText(tStart.toFixed(1) + "s", px + 1, py + ph + 11);
  ctx.textAlign = "right";
  ctx.fillText(tEnd.toFixed(1) + "s", px + pw, py + ph + 11);
  ctx.textAlign = "left";

  ctx.font = "10px Consolas,monospace";
  for (let k = 0; k < def.s.length && k < 8; k++) {
    const lb = def.s[k].lb;
    ctx.fillStyle = def.s[k].c;
    ctx.fillRect(lx, py + 2, 7, 7);
    ctx.fillStyle = "#8ca0b8";
    ctx.fillText(lb, lx + 10, py + 9);
    lx += 12 + ctx.measureText(lb).width + 8;
  }

const DOC_HTML = `
<h4>为什么多级倒立摆是欠驱动系统</h4>
系统有 N+1 个广义坐标 <code>q=[x,θ₁…θ_N]</code>，但只有 1 个执行器（小车水平力 u），输入矩阵 <code>B=[1,0,…,0]ᵀ</code>。
执行器数 1 &lt; 自由度数 N+1，因此是欠驱动系统：不能独立指令每个角度，只能借助动力学耦合（质量矩阵的非对角项）间接控制摆角。
本页面<b>没有任何关节电机</b>，也没有对每根连杆单独做 PID。
<h4>为什么二级倒立摆不是"二阶系统"</h4>
"二级"指连杆根数 N=2，不是系统阶数。二级系统的广义坐标为 3 个（x,θ₁,θ₂），一阶状态变量为 <code>2(N+1)=6</code> 个。
五级倒立摆是 6 个广义坐标、<b>12 维状态</b>的系统。页面顶部与诊断面板始终显示这两个数字。
<h4>非线性动力学结构</h4>
由质心位置的解析 Jacobian 建立动能，得到标准机械系统形式
<code>M(q)q̈ + C(q,q̇)q̇ + G(q) + D(q̇) = Bu</code>。
其中 <code>M</code> 由 <code>Σmᵢ JᵢᵀJᵢ + Iᵢ</code> 构成（对称正定），离心/科氏项由拉格朗日方程解析化简为
<code>h₀=−Σβ_k sinθ_k θ̇_k²</code>、<code>h_j=Σ_k S_jk sin(θ_j−θ_k) θ̇_k²</code>，自检中用 Christoffel 符号独立复算校验。
求 <code>q̈</code> 时解线性方程 <code>M q̈ = Bu−h−G−D</code>（带主元 LU），<b>不显式求 M⁻¹</b>。
<code>θ=0</code> 是最高势能点，直立不稳定是模型自然结果，不是代码把角度锁成零。
<h4>线性化的意义与做法</h4>
LQR 需要线性模型。这里<b>不</b>另建简化模型，而是对与仿真完全相同的 RK4 单步映射（控制周期内 n 个子步、u 零阶保持）做逐变量中心差分，
直接得到离散模型 <code>A_d、B_d</code>，从而保证"控制器模型 = 积分器实际实现"。差分步长按各状态量纲缩放。
连续体模式的对象本身就是线性时不变的，直接用矩阵指数做精确 ZOH 离散化（自检中与积分器的有限差分互相验证）。
<h4>可控性与数值病态的区别</h4>
"可控"是代数性质；"数值可控"受浮点精度限制。多级倒立摆的可控性矩阵条件数随 N 迅速恶化（面板给出实测值），
直接对未缩放的 <code>[B AB A²B …]</code> 用固定阈值判秩会得到虚假的"不可控"。本页面同时使用：状态缩放后的 SVD 数值秩、
QR（Arnoldi）逐步正交化秩、PBH 检验 <code>σ_min([λI−A, B])</code>、有限时间可控 Gramian 特征值，并显示所用阈值。
结果接近浮点精度极限时显示"<b>数值上高度病态</b>"，而不是断言完全不可控或完全良态。
<h4>LQR 的 Q 与 R</h4>
<code>Q</code> 惩罚状态偏差（分别可调小车位置、各摆角、小车速度、各角速度权重），<code>R</code> 惩罚控制力。
增益 <code>K=(R+BᵀPB)⁻¹BᵀPA</code> 由当前 <code>A_d,B_d,Q,R</code> <b>在线求解</b>离散 Riccati 方程得到（值迭代 / 倍增 SDA + 对角缩放），
并检查残差、<code>R+BᵀPB</code> 可逆性、有限性、P 正定性、闭环谱半径。<b>没有任何硬编码增益</b>。
<h4>为什么 LQR 只保证局部稳定</h4>
LQR 是对直立点线性化模型的最优控制，只在小偏差范围内有效。初始角度越大、连杆数越多、力限制与轨道越紧，稳定域越小。
默认任务是<b>直立附近的小扰动稳定</b>，不保证从自然下垂状态起摆（本页面未实现起摆控制，因此也不会把"重置到直立"称为起摆成功）。
<h4>为什么饱和会破坏线性稳定结论</h4>
线性最优性依赖 <code>u=−Kz</code> 精确成立。一旦 <code>|u|&gt;u_max</code> 被截断，实际闭环不再是设计好的线性系统，
Lyapunov 递减性质随之失效。本页面把<b>未饱和指令</b>与<b>实际施加力</b>同时画出，标出饱和区间与占空比，
饱和后的力真实进入动力学，绝不"图表显示受限、仿真使用无限力"。
<h4>为什么连杆数增加后控制越来越困难</h4>
总长固定时 l=L/N 变小，高阶"锯齿"模态的不稳定增长率约按 <code>√(g·β/I)</code> 增大（面板显示实测最大开环增长率），
同时单一输入对高阶模态的耦合越来越弱、可控性越来越病态，所需增益与带宽迅速增加，在固定力限制下稳定域急剧缩小。
<h4>模态截断与控制溢出</h4>
把完整离散对象的模态按 <code>K_θθφ=λM_θθφ</code> 排序，只保留前 r 阶做 Galerkin 降阶设计（控制器内部模型 2(r+1) 维），
再把控制器施加到完整 2(N+1) 维对象上仿真。被忽略的高阶模态仍然真实存在：
面板给出被截断模态能量 <code>E_high=½Σ_{k&gt;r}(η̇²+|λ_k|η²)</code>、输入到被截断模态的耦合比例，以及溢出功率 <code>Σ_{k&gt;r} g_k u η̇_k</code>。
若降阶模型稳定而完整对象失稳，页面明确显示"降阶控制器稳定了设计模型，但未稳定完整离散对象，出现高阶模态溢出"。
<h4>为什么有限 N 不等于真正的无穷维</h4>
${P.infiniteLimitNote()} 因此页面把"当前最大离散阶数"和"理论无穷维极限"分开显示，并提供收敛分析：
固定 L、M_p、ρA、EI、η、M_c、力限制与初始形状，比较 N=8/16/32/64 的前几个特征值、杆端位移、小车位移、控制力、能量、
高阶模态能量与相邻阶数响应差 <code>E_N=‖y_{2N}−y_N‖₂/max(‖y_{2N}‖₂,ε)</code>。只有这些量呈现合理收敛趋势，才能说有限模型正在逼近连续体。
<h4>为什么柔性杆需要正确的刚度缩放</h4>
若离散弯曲势能不按 <code>EI/h</code>（阻尼不按 <code>η/h</code>）缩放，仅仅"把连杆画得更密"，那么 N 增大时离散模型收敛到的
不是同一个连续体，特征值和响应都不会收敛。自检第 36、37 项直接检查这两个缩放律。
<h4>本实现的真实近似与限制</h4>
平面运动、理想刚性连杆与理想无摩擦转动关节、小车点接触无侧倾、全状态反馈（无观测器）、LQR 仅局部有效；
N=2…5 使用完整非线性模型实时仿真，连续体模式（模型 A 的 N&gt;5 与模型 B）使用<b>直立平衡附近的线性模型</b>；
未实现起摆控制；未考虑执行器动力学/齿隙/离散量化；<b>有限 N 永远不是真正的无穷阶</b>。
`;

function renderLinkTables() {
  const c = UI.cfg, sim = activeSim(), box = $("#linkTab"), qbox = $("#linkQ");
  if (!box || !qbox) return;
  const ks = $("#dKickI");
  if (ks && sim) {
    let o = "";
    for (let i = 1; i <= sim.N; i++) o += `<option value="${i}"${i === sim.N ? " selected" : ""}>连杆 #${i}${i === sim.N ? "（顶端）" : ""}</option>`;
    ks.innerHTML = o;
  }
  const single = (modeDef().kind === "rigid") && sim;
  if (!single) {
    box.innerHTML = `<div class="hint">当前模式使用<b>均匀连杆</b>（l=L/N, m=M_p/N）；逐连杆参数编辑仅在单系统模式（二/三/四/五级）可用。</div>`;
    qbox.innerHTML = `<div class="hint">当前模式对所有摆角/模态使用统一权重。</div>`;
    return;
  }
  const N = sim.N, u = P.uniformLinks(N, c.L, c.Mp);
  const L = (c.links && c.links.length === N) ? c.links : u.l.map((v, i) => ({ l: v, m: u.m[i] }));
  let h = `<table class="linkTab"><tr><th>连杆</th><th>长度 l [m]</th><th>质量 m [kg]</th></tr>`;
  for (let i = 0; i < N; i++) h += `<tr><td style="color:${COLORS[i % COLORS.length]}">#${i + 1}</td>

  box.innerHTML = h;
  const Q = (c.perQ && c.perQ.length === N) ? c.perQ : null;
  let q = `<table class="linkTab"><tr><th>连杆</th><th>Q_θ 倍数</th><th>Q_ω 倍数</th></tr>`;
  for (let i = 0; i < N; i++) q += `<tr><td style="color:${COLORS[i % COLORS.length]}">#${i + 1}</td>

function matText() {
  const sim = activeSim(), ct = sim && sim.ctrl;
  if (!ct || !ct.K) return "当前没有可显示的控制器（开环/手动模式，或 Riccati 求解失败）。";
  const K = ct.K, dim = K.c, nq = sim.mode === "rigid" ? sim.plant.nq : sim.ls.nq;
  const names = [];
  if (sim.mode === "rigid") {
    names.push("x");
    for (let i = 1; i < nq; i++) names.push("θ" + i);
    names.push("ẋ");
    for (let i = 1; i < nq; i++) names.push("ω" + i);
  } else {
    names.push("x");
    for (let i = 1; i <= sim.r; i++) names.push("η" + i);

    for (let i = 1; i <= sim.r; i++) names.push("η̇" + i);

  for (let i = 0; i < dim; i++) s += "  K[" + (names[i] || i) + "] = " + K.a[i].toExponential(6) + "\n";
  s += "\nQ 对角 = [" + Array.from({ length: ct.Q.r }, (_, i) => fx(ct.Q.a[i * ct.Q.r + i], 3)).join(", ") + "]\n";
  s += "R = " + fx(ct.R.a[0], 6) + "\n";
  s += "Riccati 残差 = " + eS(ct.residual, 4) + "（严格阈值 " + eS(ct.resTol, 0) + "，可用阈值 " + eS(ct.resUse, 0) + "）\n";
  s += "求解方法 = " + (ct.method || "—") + "，迭代 " + (ct.iters === undefined ? "—" : ct.iters) + " 次，P 正定 = " + (ct.pdP ? "是" : "否") + "\n";
  s += "闭环谱半径 = " + fS(ct.rho, 8) + "\n\n闭环离散极点 λ（|λ|）：\n";

  }
  const ol = sim.mode === "rigid" ? sim.olEigC : sim.fullEig;
  if (ol) {
    s += "\n开环连续特征值（Re>0 为不稳定）：\n";
    const idx = Array.from({ length: ol.re.length }, (_, i) => i).sort((a, b) => ol.re[b] - ol.re[a]);
    idx.slice(0, 16).forEach(i => {
      s += "  " + ol.re[i].toFixed(5) + (ol.im[i] >= 0 ? " + " : " − ") + Math.abs(ol.im[i]).toFixed(5) + "i\n";

}

function miniPlot(ctx, r, p) {
  ctx.strokeStyle = "#1a2532"; ctx.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
  ctx.font = "9.5px Consolas,monospace"; ctx.fillStyle = "#8ca0b8";
  ctx.fillText(p.t, r.x + 4, r.y + 10);
  const px = r.x + 34, py = r.y + 15, pw = r.w - 40, ph = r.h - 28;
  const xs = p.xs.map(v => Math.log2(v));
  let ys = p.ys.slice();
  if (p.log) ys = ys.map(v => Math.log10(Math.max(Math.abs(v), 1e-300)));
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  let y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  if (x1 - x0 < 1e-9) { x0 -= .5; x1 += .5; }
  if (y1 - y0 < 1e-12) { y0 -= 1; y1 += 1; }
  const my = (y1 - y0) * 0.12; y0 -= my; y1 += my;
  const X = (v) => px + (v - x0) / (x1 - x0) * pw, Y = (v) => py + ph - (v - y0) / (y1 - y0) * ph;
  ctx.strokeStyle = p.c; ctx.lineWidth = 1.5; ctx.beginPath();
  xs.forEach((v, i) => { const xx = X(v), yy = Y(ys[i]); if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy); });
  ctx.stroke();
  ctx.fillStyle = p.c;
  xs.forEach((v, i) => { ctx.beginPath(); ctx.arc(X(v), Y(ys[i]), 2.4, 0, 7); ctx.fill(); });
  ctx.fillStyle = "#6b7f96"; ctx.textAlign = "right";
  ctx.fillText(p.log ? "1e" + y1.toFixed(1) : fmtAxis(y1), px - 3, py + 7);
  ctx.fillText(p.log ? "1e" + y0.toFixed(1) : fmtAxis(y0), px - 3, py + ph);
  ctx.textAlign = "left";
  ctx.fillText("N=" + p.xs[0], px, py + ph + 10);
  ctx.textAlign = "right";
  ctx.fillText("N=" + p.xs[p.xs.length - 1], px + pw, py + ph + 10);
  ctx.textAlign = "left";
}

function wireCont() {
  const cn = $("#contN"), cr = $("#contR"), chn = $("#chainN"), chr = $("#chainR");
  if (cn) cn.addEventListener("change", () => { UI.cfg.contN = parseInt(cn.value, 10); withBusy("构建 N=" + UI.cfg.contN + " 柔性模型…", () => { buildSims(); renderModes(); }); });
  if (cr) cr.addEventListener("change", () => { UI.cfg.contR = parseInt(cr.value, 10); withBusy("重新设计降阶控制器…", () => { buildSims(); renderModes(); }); });
  if (chn) chn.addEventListener("change", () => { UI.cfg.chainN = parseInt(chn.value, 10); withBusy("构建 N=" + UI.cfg.chainN + " 链条模型（含 Riccati 求解）…", () => { buildSims(); }); });
  if (chr) chr.addEventListener("change", () => { UI.cfg.chainR = parseInt(chr.value, 10); withBusy("重新设计控制器…", () => { buildSims(); }); });
  const ei = $("#pEI"), et = $("#pEta");
  if (ei) num("#pEI", "EI", 0, 1e4, () => withBusy("重建柔性模型…", () => { buildSims(); renderModes(); }));
  if (et) num("#pEta", "eta", 0, 1e3, () => withBusy("重建柔性模型…", () => { buildSims(); renderModes(); }));
  const bm = $("#btnModes");
  if (bm) bm.addEventListener("click", () => renderModes());
  const bs = $("#btnSpill");
  if (bs) bs.addEventListener("click", () => {
    UI.cfg.EI = 0.05; UI.cfg.eta = 0.02; UI.cfg.contN = 32; UI.cfg.contR = 2;
    withBusy("加载溢出演示参数…", () => {
      buildSims();
      $("#contWrap").innerHTML = contWrapHTML(); wireCont(); renderModes();
      UI.conv = null; renderConv();
    });
  });
  const bc = $("#btnConv");
  if (bc) bc.addEventListener("click", () => withBusy("连续体收敛分析（N=8/16/32/64）…", () => {
    UI.conv = P.analyzeConvergence(UI.cfg, [8, 16, 32, 64], UI.cfg.contR, 3.0);
    renderConv();
  }));
  const bcs = $("#btnChainSweep");
  if (bcs) bcs.addEventListener("click", () => withBusy("链条阶数扫描（N=5/10/20/40，含 Riccati 求解）…", () => {
    UI.chain = { rows: P.analyzeChain(UI.cfg, [5, 10, 20, 40], 3.0, UI.cfg.chainR) };
    renderChainSweep();
  }));
  renderChainSweep(); renderConv(); renderModes();
}
function buildTabs() {
  const box = $("#modeTabs");
  box.innerHTML = MODES.map(m => `<button class="tab${m.id === UI.mode ? " on" : ""}" data-mode="${m.id}">${m.label}</button>`).join("");
  $$("#modeTabs .tab").forEach(b => b.addEventListener("click", () => {
    const id = b.getAttribute("data-mode");
    if (id === UI.mode) return;
    UI.mode = id;
    $$("#modeTabs .tab").forEach(x => x.classList.toggle("on", x === b));
    withBusy("切换模式并重建模型…", () => {
      UI.cfg.links = null; UI.cfg.perQ = null;
      buildSims();
      $("#contWrap").innerHTML = contWrapHTML();
      wireCont(); renderLinkTables();
      $("#chartTag").textContent = "实时曲线（固定长度环形缓冲 " + P.RING_CAP + " 点 / 系统）";
    });
  }));
}

/* ---------------------------------------------------------------- 主循环 */
function frameBody(ts) {
  UI.frames++;
  const now = (typeof ts === "number" ? ts : performance.now());
  let dtReal = UI.last ? (now - UI.last) / 1000 : 1 / 60;
  UI.last = now;
  if (!(dtReal > 0)) dtReal = 1 / 60;
  const dtRaw = dtReal;
  if (dtReal > 0.05) dtReal = 0.05;            // 限制单帧补算量（后台恢复/长帧保护）
  UI.fpsAcc += dtReal; UI.fpsN++;
  if (UI.fpsAcc > 0.4) { UI.fps = UI.fpsN / UI.fpsAcc; UI.fpsAcc = 0; UI.fpsN = 0; }
  if (UI.running && !UI.busy && UI.sims.length) {
    const c = UI.cfg, h = c.hInt;
    UI.acc += dtReal * c.rate;
    const t0 = performance.now();
    let steps = 0;
    while (UI.acc >= h) {
      let any = false;
      for (let i = 0; i < UI.sims.length; i++) if (P.simStep(UI.sims[i], h)) any = true;
      UI.acc -= h; steps++;
      if (!any) { UI.acc = 0; break; }
      if (performance.now() - t0 > 12) break;   // 墙钟预算，避免长帧卡死
    }
    if (UI.acc > 0.25) UI.acc = 0;              // 丢弃过量积压
    UI.stepsPerFrame = steps;
    UI.physMs = performance.now() - t0;
    // 实际倍率（模拟时间推进 / 未截断的真实帧间隔）：受单帧补算上限或墙钟预算限制时会低于设定倍率
    UI.rateActual = UI.rateActual * 0.9 + (steps * h / dtRaw) * 0.1;
    if (!anyAlive()) { UI.running = false; UI.autoPaused = true; }  // 失稳后停在失稳状态，不做静默复位
  }
  drawStage();
  if (now - UI.chartT > 33) { UI.chartT = now; drawCharts(); }
  if (now - UI.panelT > 250) { UI.panelT = now; renderDiag(); renderMatBox(); renderTop(); }
}
/* 渲染/推进异常不应让页面失去响应：同一消息只提示一次，循环始终继续（每帧只调度一次） */
const REPORTED = {};
function frame(ts) {
  try { frameBody(ts); }
  catch (e) {
    const k = String(e && e.message);
    if (!REPORTED[k]) { REPORTED[k] = 1; fatal("帧循环异常：" + k + "\n" + (e && e.stack)); }
  }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- 启动 */
function boot() {
  wireErrUI();
  try {
    if (!P) { fatal("物理核心 PIP 未加载（第一个 script 块执行失败）。", "init"); return; }
    const cv = document.createElement("canvas");
    if (!cv.getContext || !cv.getContext("2d")) { fatal("当前浏览器不支持 Canvas 2D，无法运行本页面。", "init"); return; }
    $("#panel").innerHTML = panelHTML();
    $("#docBox").innerHTML = DOC_HTML;
    buildTabs();
    buildSims();
    $("#contWrap").innerHTML = contWrapHTML();
    wire();
    renderLinkTables();
    $("#chartTag").textContent = "实时曲线（固定长度环形缓冲 " + P.RING_CAP + " 点 / 系统）";
    $("#ttlSub").textContent = "单小车水平力驱动 · 欠驱动系统 · " + MODES.length + " 种模式 · 无隐藏关节电机";
    try { UI.selfTest = P.runSelfTests({}); } catch (e) { console.error(e); fatal("自检运行异常：" + (e && e.message)); }
    renderSelfTest();
    renderPanelDynamic();
    renderStress();
    window.addEventListener("resize", () => { try { drawStage(); drawCharts(); drawConvPlots(); } catch (e) { fatal("重绘失败：" + (e && e.message)); } });
    document.addEventListener("visibilitychange", () => { UI.last = 0; UI.acc = 0; });
    window.APP = {
      UI: UI, P: P, sims: () => UI.sims, cfg: () => UI.cfg, selfTest: () => UI.selfTest, errors: () => ERRLOG.slice(),
      setMode: (m) => { UI.mode = m; buildTabs(); buildSims(); $("#contWrap").innerHTML = contWrapHTML(); wireCont(); renderLinkTables(); renderPanelDynamic(); },
      run: (b) => { UI.running = b; UI.last = 0; },
      step: (n) => { for (let i = 0; i < (n || 1); i++) UI.sims.forEach(s => P.simStep(s, UI.cfg.hInt)); },
      reset: resetAll, rebuild: buildSims, chain: () => UI.chain, conv: () => UI.conv, stress: () => UI.stress,
      analyzeChain: () => { UI.chain = { rows: P.analyzeChain(UI.cfg, [5, 10, 20, 40], 3.0, UI.cfg.chainR) }; renderChainSweep(); return UI.chain; },
      analyzeConv: () => { UI.conv = P.analyzeConvergence(UI.cfg, [8, 16, 32, 64], UI.cfg.contR, 3.0); renderConv(); return UI.conv; },
      analyzeStress: () => { UI.stress = P.analyzeStress(UI.cfg, [2, 3, 4, 5], 8.0, UI.cfg.stressScale); renderStress(); return UI.stress; },
      frames: () => UI.frames
    };
    booted = true;
    requestAnimationFrame(frame);
  } catch (e) {
    fatal("初始化异常：" + (e && e.message) + "\n" + (e && e.stack), "init");
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
</body>
