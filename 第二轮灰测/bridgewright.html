<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桥匠 BRIDGEWRIGHT · 桥梁一生 3D 物理模拟（自写引擎）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#06080b;color:#c3cfdb;font:12px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
     -webkit-font-smoothing:antialiased;}
button,input,select{font:inherit;color:inherit;}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a0e13}
::-webkit-scrollbar-thumb{background:#1e2833;border:1px solid #0a0e13}
::-webkit-scrollbar-thumb:hover{background:#2b3a4a}
.mono{font-family:Consolas,"Cascadia Mono",monospace}

#hdr{position:fixed;left:0;top:0;right:0;height:44px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(#0d131a,#0a0f14);border-bottom:1px solid #1d2833;padding:0 10px;z-index:30;white-space:nowrap}
#hdr .brand{font-weight:700;font-size:14px;letter-spacing:3px;color:#eaf2fa}
#hdr .brand b{color:#37b6ff}
#hdr .sub{font-size:10px;color:#6d7f90;letter-spacing:1px}
#hdr select{background:#111922;border:1px solid #22303d;padding:4px 6px;max-width:210px}
#hdr .st{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:10px;color:#7f8f9f}
#hdr .st b{color:#cfe0ee;font-weight:600}
#dot{width:8px;height:8px;background:#35d78f;border:1px solid #000;border-radius:50%}
#dot.warn{background:#ffc247}#dot.bad{background:#ff5757}

#main{position:fixed;left:0;top:44px;right:0;bottom:0;display:flex}
#side{width:322px;flex:0 0 322px;background:#0a0f14;border-right:1px solid #1d2833;overflow-y:auto;padding:8px 8px 40px}
#view{flex:1;position:relative;min-width:0;background:#0b1016}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

.sec{border:1px solid #1d2833;background:#0c1218;margin-bottom:7px}
.sec>h3{font-size:10.5px;font-weight:700;letter-spacing:2px;color:#37b6ff;background:#101822;
  border-bottom:1px solid #1d2833;padding:5px 7px;cursor:pointer;display:flex;justify-content:space-between}
.sec>h3 span{color:#5d7385;font-weight:400;letter-spacing:0}
.sec>.bd{padding:7px}
.sec.collapsed>.bd{display:none}
.row{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.row>button{flex:1 1 auto;min-width:52px}
button{background:#131c26;border:1px solid #26333f;padding:5px 7px;font-size:10.5px;letter-spacing:.5px;cursor:pointer;color:#b9c8d6}
button:hover{border-color:#37b6ff;color:#8fd6ff}
button.on{background:#0d4a66;border-color:#37b6ff;color:#bfe9ff}
button.warn{background:#3a2410;border-color:#a56a1e;color:#ffcf8a}
button.bad{background:#3a1414;border-color:#a52020;color:#ff9b9b}
button.big{width:100%;padding:8px;font-size:12px;letter-spacing:2px;background:#0d3d52;border-color:#2a86b5;color:#cdeeff}
button.big:hover{background:#12546f}
button:disabled{opacity:.4;cursor:default;border-color:#26333f;color:#5d7385}
.ctl{display:grid;grid-template-columns:92px 1fr 58px;gap:5px;align-items:center;margin:5px 0}
.ctl label{font-size:10px;color:#7f8f9f;letter-spacing:.5px}
.ctl .v{font-size:10.5px;color:#e6f1fa;text-align:right;font-family:Consolas,monospace}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:#111922;border:1px solid #26333f;outline:none;cursor:ew-resize}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:12px;background:#37b6ff;border:1px solid #06080b}
input[type=range]::-moz-range-thumb{width:9px;height:12px;background:#37b6ff;border:1px solid #06080b}
.hint{font-size:9.5px;color:#5d7385;letter-spacing:.3px;margin:3px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:1px 6px;font-size:10.5px}
.kv .k{color:#7f8f9f}.kv .v{color:#dbe8f4;text-align:right;font-family:Consolas,monospace}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.tag{font-size:9.5px;padding:1px 5px;border:1px solid #26333f;background:#101822;color:#8ba0b2}
.tag.g{border-color:#1f6b45;color:#6fdca2;background:#0c1c15}
.tag.y{border-color:#7a5c17;color:#ffd479;background:#1c1608}
.tag.r{border-color:#7a1f1f;color:#ff9b9b;background:#1c0c0c}
ul.li{margin:3px 0 3px 14px;font-size:10.5px;color:#a8bacb}
ul.li li{margin:2px 0}
.warnbox{border:1px solid #7a5c17;background:#1a1408;color:#ffd479;padding:5px 6px;font-size:10px;margin:4px 0}
.badbox{border:1px solid #7a1f1f;background:#1a0b0b;color:#ff9b9b;padding:5px 6px;font-size:10px;margin:4px 0}
.okbox{border:1px solid #1f6b45;background:#0b1a12;color:#6fdca2;padding:5px 6px;font-size:10px;margin:4px 0}

/* HUD */
.hud{position:absolute;pointer-events:none;font-size:10.5px}
#hudTL{left:8px;top:8px;background:rgba(8,12,17,.82);border:1px solid #1d2833;padding:5px 7px;font-family:Consolas,monospace;line-height:1.55;white-space:pre;color:#a9dcff}
#hudTR{right:8px;top:8px;width:264px}
#hudTR .card{background:rgba(8,12,17,.85);border:1px solid #1d2833;margin-bottom:5px;padding:4px 6px}
#hudTR .card h4{font-size:9.5px;color:#37b6ff;letter-spacing:1.5px;font-weight:700;margin-bottom:2px}
#cbar{position:absolute;left:8px;bottom:8px;background:rgba(8,12,17,.85);border:1px solid #1d2833;padding:4px 6px}
#cbarG{width:196px;height:9px;border:1px solid #26333f}
#cbar .lab{display:flex;justify-content:space-between;font-size:9px;color:#7f8f9f;margin-top:2px}
#log{position:absolute;right:8px;bottom:8px;width:392px;max-height:184px;overflow:hidden;background:rgba(8,12,17,.85);
  border:1px solid #1d2833;padding:4px 6px;font-family:Consolas,monospace;font-size:10px;line-height:1.5}
#log .l0{color:#7f8f9f}#log .l1{color:#8fd6ff}#log .l2{color:#ffc247}#log .l3{color:#ff6b6b}
#plots{position:absolute;left:8px;bottom:44px;pointer-events:none}
canvas.plot{display:block;background:rgba(8,12,17,.82);border:1px solid #1d2833;margin-bottom:4px}
#replay{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:min(560px,60%);
  background:rgba(8,12,17,.9);border:1px solid #1d2833;padding:5px 8px;display:none;pointer-events:auto}
#replay .r1{display:flex;gap:6px;align-items:center}
#replay input[type=range]{flex:1}
#tip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,12,17,.9);
  border:1px solid #2a86b5;color:#bfe9ff;padding:4px 10px;font-size:11px;display:none}

/* 文档层 */
#doc{position:fixed;inset:44px 0 0 0;background:rgba(5,8,11,.97);z-index:40;display:none;flex-direction:column}
#docTabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid #1d2833;flex-wrap:wrap}
#docTabs button{border-bottom:none}
#docBody{flex:1;overflow-y:auto;padding:12px 18px 40px;font-size:12px;line-height:1.72;color:#b8c8d7}
#docBody h2{font-size:15px;color:#eaf2fa;letter-spacing:2px;margin:14px 0 6px;border-left:3px solid #37b6ff;padding-left:8px}
#docBody h3{font-size:12.5px;color:#8fd6ff;margin:12px 0 4px;letter-spacing:1px}
#docBody p{margin:4px 0}
#docBody table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:11px}
#docBody th,#docBody td{border:1px solid #1d2833;padding:3px 6px;text-align:left;vertical-align:top}
#docBody th{background:#101822;color:#8fd6ff;font-weight:600;white-space:nowrap}
#docBody td.n{text-align:right;font-family:Consolas,monospace;white-space:nowrap}
#docBody tr.pass td:first-child{border-left:3px solid #1f6b45}
#docBody tr.fail td:first-child{border-left:3px solid #a52020}
#docBody .f{font-family:Consolas,monospace;color:#9fd4ef}
#docBody .note{color:#7f8f9f;font-size:10.5px}
#docBody ul{margin:4px 0 8px 20px}
#docBody li{margin:2px 0}
#docBody code{font-family:Consolas,monospace;background:#101822;border:1px solid #1d2833;padding:0 3px;color:#9fd4ef}
#docClose{position:absolute;right:10px;top:-38px}
#boot{position:fixed;inset:0;background:#06080b;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#boot .t{font-size:22px;letter-spacing:6px;color:#eaf2fa}
#boot .t b{color:#37b6ff}
#boot .s{font-size:11px;color:#6d7f90;letter-spacing:1px}
#boot .bar{width:320px;height:6px;border:1px solid #26333f;background:#0c1218}
#boot .bar i{display:block;height:100%;width:0;background:#37b6ff}
@media (max-width:1100px){#side{width:270px;flex:0 0 270px}#log{width:300px}#hudTR{width:210px}}
</style>

<body>
<div id="hdr">
  <div class="brand">桥<b>匠</b> BRIDGE<b>WRIGHT</b></div>
  <div class="sub">自写 3D 物理引擎 · 结构+地基+环境耦合</div>
  <select id="selSc" title="场景"></select>
  <select id="selTp" title="桥型"></select>
  <button id="btnBuild" title="按当前场景与桥型重新建造">重新建造</button>
  <button id="btnDoc">技术文档 / 验证 / 造价</button>
  <div class="st">
    <span>Δt <b id="stDt">—</b></span><span>子步 <b id="stSub">—</b></span>
    <span>实时率 <b id="stRtf">—</b></span><span>自由度 <b id="stDof">—</b></span>
    <span>FPS <b id="stFps">—</b></span><span id="dot"></span>
  </div>
</div>

<div id="main">
  <div id="side"></div>
  <div id="view">
    <canvas id="gl"></canvas>
    <div class="hud" id="hudTL"></div>
    <div class="hud" id="hudTR"></div>
    <div class="hud" id="plots"></div>
    <div class="hud" id="cbar"><canvas id="cbarG" width="196" height="9"></canvas><div class="lab"><span id="cbL">—</span><span id="cbM">—</span><span id="cbR">—</span></div></div>
    <div class="hud" id="log"></div>
    <div id="replay">
      <div class="r1"><button id="rpPlay">▶</button><input type="range" id="rpSlider" min="0" max="100" value="100"><span class="mono" id="rpT" style="width:74px;text-align:right">—</span><button id="rpExit">退出回放</button></div>
    </div>
    <div id="tip"></div>
  </div>
</div>

<div id="doc"><div style="position:relative"><button id="docClose">关闭 ✕</button></div><div id="docTabs"></div><div id="docBody"></div></div>
<div id="boot"><div class="t">桥<b>匠</b> BRIDGEWRIGHT</div><div class="s" id="bootS">正在初始化引擎…</div><div class="bar"><i id="bootB"></i></div></div>

<script>
(function(){
'use strict';
var BR = {};
/* ===== 10-core.js ===== */
/* =============================================================================
 * 桥匠 BRIDGEWRIGHT · 10-core.js
 * 数值内核：向量、随机数、FFT/PSD、雨流计数、多项式求根、SDOF 反应谱、色标
 * 无外部依赖。所有单位：SI（m, kg, s, N, Pa, K）除注明外。
 * ========================================================================== */
'use strict';
var BR = (typeof BR !== 'undefined') ? BR : {};

/* ---------- 基础标量 ---------- */
BR.clamp = function (x, a, b) { return x < a ? a : (x > b ? b : x); };
BR.lerp = function (a, b, t) { return a + (b - a) * t; };
BR.smoothstep = function (e0, e1, x) { var t = BR.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
BR.sign = function (x) { return x < 0 ? -1 : (x > 0 ? 1 : 0); };
BR.hypot3 = function (x, y, z) { return Math.sqrt(x * x + y * y + z * z); };
BR.deg = function (r) { return r * 180 / Math.PI; };
BR.rad = function (d) { return d * Math.PI / 180; };
BR.fmt = function (x, n) {
  if (!isFinite(x)) return '—';
  n = (n === undefined) ? 3 : n;
  var ax = Math.abs(x);
  if (ax !== 0 && (ax >= 1e6 || ax < 1e-3)) return x.toExponential(2);
  return x.toFixed(n);
};
BR.si = function (x, unit, n) { // 带工程量级
  if (!isFinite(x)) return '—';
  var a = Math.abs(x), s = '', v = x;
  if (a >= 1e9) { v = x / 1e9; s = 'G'; }
  else if (a >= 1e6) { v = x / 1e6; s = 'M'; }
  else if (a >= 1e3) { v = x / 1e3; s = 'k'; }
  return v.toFixed(n === undefined ? 2 : n) + ' ' + s + (unit || '');
};

/* ---------- 伪随机（可复现：所有算例种子化） ---------- */
BR.rng = function (seed) {
  var s = (seed >>> 0) || 1;
  var f = function () { // mulberry32
    s |= 0; s = s + 0x6D2B79F5 | 0;
    var t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  f.norm = function () { // Box-Muller
    var u = 0, v = 0;
    while (u === 0) u = f();
    while (v === 0) v = f();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  f.range = function (a, b) { return a + (b - a) * f(); };
  return f;
};

/* ---------- 统计 ---------- */
BR.stat = {
  mean: function (a) { var s = 0, i; for (i = 0; i < a.length; i++) s += a[i]; return s / a.length; },
  rms: function (a) { var s = 0, i; for (i = 0; i < a.length; i++) s += a[i] * a[i]; return Math.sqrt(s / a.length); },
  std: function (a) { var m = BR.stat.mean(a), s = 0, i; for (i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m); return Math.sqrt(s / Math.max(1, a.length - 1)); },
  max: function (a) { var m = -Infinity, i; for (i = 0; i < a.length; i++) if (a[i] > m) m = a[i]; return m; },
  min: function (a) { var m = Infinity, i; for (i = 0; i < a.length; i++) if (a[i] < m) m = a[i]; return m; },
  absmax: function (a) { var m = 0, i; for (i = 0; i < a.length; i++) if (Math.abs(a[i]) > m) m = Math.abs(a[i]); return m; }
};

/* ---------- FFT（基-2，就地）与单边 PSD ---------- */
BR.fft = function (re, im, inverse) {
  var n = re.length, i, j, k, m, len, ang, wr, wi, ur, ui, vr, vi;
  for (i = 1, j = 0; i < n; i++) {
    var bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { var t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (len = 2; len <= n; len <<= 1) {
    ang = 2 * Math.PI / len * (inverse ? 1 : -1);
    wr = Math.cos(ang); wi = Math.sin(ang);
    for (i = 0; i < n; i += len) {
      var cr = 1, ci = 0;
      for (k = 0; k < len / 2; k++) {
        ur = re[i + k]; ui = im[i + k];
        vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
        vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        var ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
  if (inverse) for (i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
};

/** 单边功率谱密度 S(f) [unit^2/Hz]，Hann 窗 + 归一化。返回 {f:[],S:[]} */
BR.psd = function (x, dt) {
  var n = 1; while (n * 2 <= x.length) n *= 2;
  var re = new Float64Array(n), im = new Float64Array(n), i;
  var mean = 0; for (i = 0; i < n; i++) mean += x[i]; mean /= n;
  var wsum2 = 0;
  for (i = 0; i < n; i++) {
    var w = 0.5 * (1 - Math.cos(2 * Math.PI * i / (n - 1)));
    re[i] = (x[i] - mean) * w; wsum2 += w * w;
  }
  BR.fft(re, im, false);
  var nf = n / 2, f = new Float64Array(nf), S = new Float64Array(nf);
  var norm = 2 * dt / wsum2;
  for (i = 0; i < nf; i++) { f[i] = i / (n * dt); S[i] = (re[i] * re[i] + im[i] * im[i]) * norm; }
  return { f: f, S: S, df: 1 / (n * dt) };
};

/** 谱峰识别（用于自由振动模态识别）：返回按能量排序的 {f,S} 峰列表 */
BR.spectralPeaks = function (sig, dt, nmax) {
  var p = BR.psd(sig, dt), out = [], i;
  for (i = 2; i < p.f.length - 1; i++) {
    if (p.S[i] > p.S[i - 1] && p.S[i] >= p.S[i + 1] && p.S[i] > 0) {
      // 抛物线插值提高频率分辨率（峰处 a-2b+c<0）
      var a = p.S[i - 1], b = p.S[i], c = p.S[i + 1];
      var den = a - 2 * b + c;
      var d = (Math.abs(den) < 1e-300) ? 0 : BR.clamp(0.5 * (a - c) / den, -0.5, 0.5);
      out.push({ f: p.f[i] + d * p.df, S: b });
    }
  }
  out.sort(function (u, v) { return v.S - u.S; });
  return out.slice(0, nmax || 6);
};

/* ---------- 雨流计数（ASTM E1049 三点法，简化在线版） ---------- */
BR.Rainflow = function () {
  this.stack = [];      // 峰谷栈
  this.cycles = [];     // {range, mean, n}
  this.last = null; this.dir = 0; this.pending = null;
};
BR.Rainflow.prototype.push = function (v) {
  // 峰谷提取
  if (this.last === null) { this.last = v; return; }
  var d = v - this.last;
  if (this.dir === 0) { if (d !== 0) { this.dir = BR.sign(d); this.last = v; } return; }
  if (BR.sign(d) === this.dir || d === 0) { this.last = v; return; }
  this._extremum(this.last);
  this.dir = BR.sign(d); this.last = v;
};
BR.Rainflow.prototype._extremum = function (e) {
  var s = this.stack; s.push(e);
  while (s.length >= 3) {
    var n = s.length;
    var r1 = Math.abs(s[n - 2] - s[n - 3]), r2 = Math.abs(s[n - 1] - s[n - 2]);
    if (r2 >= r1 && r1 > 0) {
      this.cycles.push({ range: r1, mean: 0.5 * (s[n - 2] + s[n - 3]), n: 1 });
      s.splice(n - 3, 2);
    } else break;
  }
};
BR.Rainflow.prototype.residual = function () { // 半循环处理（保守：计为整循环）
  var out = [], s = this.stack, i;
  for (i = 0; i + 1 < s.length; i++) out.push({ range: Math.abs(s[i + 1] - s[i]), mean: 0.5 * (s[i] + s[i + 1]), n: 0.5 });
  return out;
};

/* ---------- 多项式复根（Durand–Kerner）：用于颤振/稳定性特征值 ---------- */
/** coefs: [a_n, ..., a_1, a_0]（降幂，实系数）。返回 [{re,im}] */
BR.polyRoots = function (coefs) {
  var a = coefs.slice(), n;
  while (a.length > 1 && Math.abs(a[0]) < 1e-300) a.shift();
  n = a.length - 1;
  if (n < 1) return [];
  var i, k, j;
  for (i = 0; i <= n; i++) a[i] /= a[0];
  var zr = new Float64Array(n), zi = new Float64Array(n);
  for (i = 0; i < n; i++) { var t = 0.4 + 0.9 * i; zr[i] = Math.cos(t) * (1 + 0.3 * i); zi[i] = Math.sin(t) * (1 + 0.3 * i); }
  for (k = 0; k < 600; k++) {
    var moved = 0;
    for (i = 0; i < n; i++) {
      // p(z)
      var pr = 1, pi = 0;
      for (j = 1; j <= n; j++) {
        var nr = pr * zr[i] - pi * zi[i] + a[j];
        var ni = pr * zi[i] + pi * zr[i];
        pr = nr; pi = ni;
      }
      // prod (z_i - z_j)
      var dr = 1, di = 0;
      for (j = 0; j < n; j++) {
        if (j === i) continue;
        var ar = zr[i] - zr[j], ai = zi[i] - zi[j];
        var mr = dr * ar - di * ai, mi = dr * ai + di * ar;
        dr = mr; di = mi;
      }
      var den = dr * dr + di * di;
      if (den < 1e-300) continue;
      var qr = (pr * dr + pi * di) / den, qi = (pi * dr - pr * di) / den;
      zr[i] -= qr; zi[i] -= qi;
      if (Math.abs(qr) + Math.abs(qi) > 1e-13) moved = 1;
    }
    if (!moved) break;
  }
  var out = [];
  for (i = 0; i < n; i++) out.push({ re: zr[i], im: zi[i] });
  return out;
};

/** 一般实矩阵（小尺寸）特征值：特征多项式（Faddeev–LeVerrier）+ Durand–Kerner
 *  仅用于 n<=6 的稳定性分析（颤振 4x4）。
 *  M₁=I, c₁=−tr(A·M₁); M_k=A·M_{k−1}+c_{k−1}I, c_k=−tr(A·M_k)/k
 *  → p(λ)=λⁿ+c₁λⁿ⁻¹+…+c_n  */
BR.eigReal = function (A, n) {
  var i, j, k, t;
  var Mk = [], AM = [];
  for (i = 0; i < n; i++) { Mk.push(new Float64Array(n)); Mk[i][i] = 1; AM.push(new Float64Array(n)); }
  var c = new Float64Array(n + 1); c[0] = 1;
  for (k = 1; k <= n; k++) {
    if (k > 1) {
      // AM = A·Mk + c_{k-1} I
      for (i = 0; i < n; i++) for (j = 0; j < n; j++) {
        var s = 0; for (t = 0; t < n; t++) s += A[i][t] * Mk[t][j];
        AM[i][j] = s + (i === j ? c[k - 1] : 0);
      }
      for (i = 0; i < n; i++) for (j = 0; j < n; j++) Mk[i][j] = AM[i][j];
    }
    var tr = 0;
    for (i = 0; i < n; i++) { var s2 = 0; for (j = 0; j < n; j++) s2 += A[i][j] * Mk[j][i]; tr += s2; }
    c[k] = -tr / k;
  }
  var coefs = [];
  for (k = 0; k <= n; k++) coefs.push(c[k]);
  return BR.polyRoots(coefs);
};

/** 单模态频率：下行过零点线性插值（比 FFT 分辨率高得多） */
BR.freqFromZeroCross = function (sig, dt, skip) {
  var i, cross = [], n = sig.length, s0 = skip || 0;
  var mean = 0; for (i = s0; i < n; i++) mean += sig[i]; mean /= (n - s0);
  for (i = s0 + 1; i < n; i++) {
    var a = sig[i - 1] - mean, b = sig[i] - mean;
    if (a > 0 && b <= 0) cross.push((i - 1 + a / (a - b)) * dt);
  }
  if (cross.length < 2) return 0;
  return (cross.length - 1) / (cross[cross.length - 1] - cross[0]);
};

/* ---------- SDOF 时程 / 反应谱（Newmark 平均加速度法，无条件稳定） ---------- */
/** 输入地面加速度 ag[]（m/s²），返回 SDOF 相对位移峰值等 */
BR.sdofResponse = function (ag, dt, T, zeta) {
  var w = 2 * Math.PI / T, n = ag.length;
  var m = 1, c = 2 * zeta * w, k = w * w;
  var g = 0.5, b = 0.25;
  var a1 = m / (b * dt * dt) + c * g / (b * dt), a2 = m / (b * dt) + c * (g / b - 1), a3 = m * (1 / (2 * b) - 1) + c * dt * (g / (2 * b) - 1);
  var kh = k + a1;
  var u = 0, v = 0, a = -ag[0];
  var umax = 0, vmax = 0, amax = 0;
  for (var i = 1; i < n; i++) {
    var p = -m * ag[i] + a1 * u + a2 * v + a3 * a;
    var un = p / kh;
    var vn = g / (b * dt) * (un - u) - (g / b - 1) * v - dt * (g / (2 * b) - 1) * a;
    var an = (un - u) / (b * dt * dt) - v / (b * dt) - (1 / (2 * b) - 1) * a;
    u = un; v = vn; a = an;
    if (Math.abs(u) > umax) umax = Math.abs(u);
    if (Math.abs(v) > vmax) vmax = Math.abs(v);
    var at = a + ag[i]; if (Math.abs(at) > amax) amax = Math.abs(at);
  }
  return { Sd: umax, Sv: vmax, Sa: amax, PSa: umax * w * w };
};

BR.responseSpectrum = function (ag, dt, zeta, Ts) {
  var out = [];
  for (var i = 0; i < Ts.length; i++) {
    var r = BR.sdofResponse(ag, dt, Ts[i], zeta);
    out.push({ T: Ts[i], Sa: r.Sa, Sd: r.Sd });
  }
  return out;
};

/* ---------- 波浪色散：ω²=gk·tanh(kd) 求 k（Newton + 初值 Guo 显式解） ---------- */
BR.waveNumber = function (T, d) {
  var g = 9.80665, w = 2 * Math.PI / T;
  var x = w * Math.sqrt(d / g);
  var y = x * x / Math.pow(1 - Math.exp(-Math.pow(x, 2.4908)), 0.4015); // Guo(2002) 近似
  var k = y / d;
  for (var i = 0; i < 40; i++) {
    var th = Math.tanh(k * d);
    var f = g * k * th - w * w;
    var df = g * th + g * k * d * (1 - th * th);
    var dk = f / df;
    k -= dk;
    if (Math.abs(dk) < 1e-14 * Math.max(1e-6, k)) break;
  }
  return k;
};

/* ---------- 色标 ---------- */
BR.turbo = function (t) { // Google Turbo 近似多项式
  t = BR.clamp(t, 0, 1);
  var r = 0.13572138 + t * (4.61539260 + t * (-42.66032258 + t * (132.13108234 + t * (-152.94239396 + t * 59.28637943))));
  var g = 0.09140261 + t * (2.19418839 + t * (4.84296658 + t * (-14.18503333 + t * (4.27729857 + t * 2.82956604))));
  var b = 0.10667330 + t * (12.64194608 + t * (-60.58204836 + t * (110.36276771 + t * (-89.90310912 + t * 27.34824973))));
  return [BR.clamp(r, 0, 1), BR.clamp(g, 0, 1), BR.clamp(b, 0, 1)];
};
/** 应力双极色标：压=蓝，拉=红，零=灰白 */
BR.stressColor = function (r) { // r in [-1,1]
  r = BR.clamp(r, -1, 1);
  var a = Math.abs(r);
  if (r >= 0) return [0.62 + 0.38 * a, 0.66 - 0.50 * a, 0.70 - 0.62 * a];
  return [0.62 - 0.52 * a, 0.66 - 0.20 * a, 0.70 + 0.28 * a];
};

/* ---------- 简易线性代数（小密集系统，用于标定与限平衡） ---------- */
BR.solveLin = function (A, b, n) { // 高斯消元（就地修改 A,b），返回 x
  var i, j, k;
  for (i = 0; i < n; i++) {
    var p = i;
    for (j = i + 1; j < n; j++) if (Math.abs(A[j][i]) > Math.abs(A[p][i])) p = j;
    var t = A[i]; A[i] = A[p]; A[p] = t; var tb = b[i]; b[i] = b[p]; b[p] = tb;
    if (Math.abs(A[i][i]) < 1e-300) continue;
    for (j = i + 1; j < n; j++) {
      var f = A[j][i] / A[i][i];
      if (f === 0) continue;
      for (k = i; k < n; k++) A[j][k] -= f * A[i][k];
      b[j] -= f * b[i];
    }
  }
  var x = new Float64Array(n);
  for (i = n - 1; i >= 0; i--) {
    var s = b[i];
    for (j = i + 1; j < n; j++) s -= A[i][j] * x[j];
    x[i] = Math.abs(A[i][i]) < 1e-300 ? 0 : s / A[i][i];
  }
  return x;
};

/* ---------- 悬链线 / 抛物线索形（初始几何与解析校验共用） ---------- */
/** 均布荷载抛物线索：跨 L、垂度 d、单重 w → 水平张力 H=wL²/(8d) */
BR.parabolicCable = function (L, d, w) {
  var H = w * L * L / (8 * d);
  return {
    H: H,
    Tmax: H * Math.sqrt(1 + Math.pow(4 * d / L, 2)),
    y: function (x) { return 4 * d * (x / L) * (1 - x / L); }, // 下垂量（正值向下）
    len: L * (1 + 8 / 3 * Math.pow(d / L, 2) - 32 / 5 * Math.pow(d / L, 4))
  };
};
/** 悬链线：自重沿弧长均布，H 已知 → y = (H/w)(cosh(wx/H)-1) */
BR.catenary = function (L, d, w) {
  // 由垂度反解 H：d=(H/w)(cosh(wL/(2H))-1)
  var H = w * L * L / (8 * d), i;
  for (i = 0; i < 100; i++) {
    var a = H / w, u = w * L / (2 * H);
    var f = a * (Math.cosh(u) - 1) - d;
    var df = (Math.cosh(u) - 1) / w - (L / (2 * H)) * Math.sinh(u);
    var dH = f / df; H -= dH;
    if (Math.abs(dH) < 1e-10 * H) break;
  }
  var a2 = H / w;
  return {
    H: H, a: a2,
    y: function (x) { return a2 * (Math.cosh((x - L / 2) / a2) - Math.cosh(L / (2 * a2))) + d; },
    len: 2 * a2 * Math.sinh(L / (2 * a2)),
    Tmax: H * Math.cosh(L / (2 * a2))
  };
};

/* ---------- 事件/日志环形缓冲 ---------- */
BR.Log = function (cap) { this.cap = cap || 4000; this.items = []; };
BR.Log.prototype.add = function (t, level, tag, msg) {

};

/* ---------- 时程记录（用于 HUD 曲线与导出） ---------- */
BR.Trace = function (cap) { this.cap = cap || 1800; this.t = []; this.map = {}; };
BR.Trace.prototype.rec = function (t, obj) {
  this.t.push(t);
  for (var k in obj) {
    if (!this.map[k]) this.map[k] = [];
    while (this.map[k].length < this.t.length - 1) this.map[k].push(NaN);
    this.map[k].push(obj[k]);
  }
  if (this.t.length > this.cap) {
    this.t.shift();
    for (var kk in this.map) this.map[kk].shift();
  }
};
BR.Trace.prototype.clear = function () { this.t.length = 0; this.map = {}; };
BR.Trace.prototype.csv = function () {
  var keys = Object.keys(this.map), lines = ['t,' + keys.join(',')], i, j;
  for (i = 0; i < this.t.length; i++) {
    var row = [this.t[i].toFixed(4)];
    for (j = 0; j < keys.length; j++) { var v = this.map[keys[j]][i]; row.push(isFinite(v) ? v.toPrecision(6) : ''); }
    lines.push(row.join(','));
  }
  return lines.join('\n');
};

  /** 欧拉/规范折减柱压杆稳定承载力（Perry-Robertson 形式，含初弯曲） */
  buckling: function (E, fy, A, I, L, K) {
    K = K || 1.0;
    var Pcr = Math.PI * Math.PI * E * I / Math.pow(K * L, 2);

    var alpha = 0.34;                          // 缺陷系数（焊接箱型 b 类）
    var phi = 0.5 * (1 + alpha * (lam - 0.2) + lam * lam);
    var chi = Math.min(1, 1 / (phi + Math.sqrt(Math.max(1e-9, phi * phi - lam * lam))));
    return { Pcr: Pcr, Py: Py, lam: lam, chi: chi, Pu: chi * Py };
  }
};

BR.World.prototype.updateActive = function () {

/** 节点集中质量：单元质量二等分 + 附加质量；仅计入已建成单元 */

/** 临界步长 + 选择性质量缩放（加质量上限 massScaleLimit） */

/* ------------------------------ 内力 ------------------------------ */
BR.World.prototype.forcesInternal = function (dt) {

      }
    }
    // 应变率阻尼（单元层次）
    var rel = (vx[b] - vx[a]) * ux + (vy[b] - vy[a]) * uy + (vz[b] - vz[a]) * uz;
    var Fd = this.cdmp[i] * rel;
    this.diss.damp += Math.abs(Fd * rel) * dt;
    var N = s * A + Fd;
    if (isCable && N < 0) N = 0;
    this.sig[i] = s; this.Nf[i] = N;
    if (s > this.sigMax[i]) this.sigMax[i] = s;
    if (s < this.sigMin[i]) this.sigMin[i] = s;
    var fyl = this.mFy[mi];
    this.util[i] = isCable ? Math.abs(s) / (this.mFu[mi] / (BR.MAT[this.matKeys[mi]].sfd || 2.5)) : Math.abs(s) / fyl;
    var Fxx = N * ux, Fyy = N * uy, Fzz = N * uz;
    fx[a] += Fxx; fy[a] += Fyy; fz[a] += Fzz;
    fx[b] -= Fxx; fy[b] -= Fyy; fz[b] -= Fzz;
    eSt += 0.5 * s * s / E * A * Lr;
    if (brokeNow) this.breakElem(i, isCable ? '索/杆达极限应变' : '构件断裂');
  }
  this.strainEnergy = eSt;

  // ---------- 弯曲铰 ----------
  for (i = 0; i < this.nH; i++) {
    if (!this.hact[i]) continue;
    var A1 = this.ha_[i], B1 = this.hb_[i], C1 = this.hc_[i];
    var e1x = x[B1] - x[A1], e1y = y[B1] - y[A1], e1z = z[B1] - z[A1];
    var e2x = x[C1] - x[B1], e2y = y[C1] - y[B1], e2z = z[C1] - z[B1];
    var L1 = BR.hypot3(e1x, e1y, e1z), L2 = BR.hypot3(e2x, e2y, e2z);
    if (L1 < 1e-9 || L2 < 1e-9) continue;
    var crx = e1y * e2z - e1z * e2y, cry = e1z * e2x - e1x * e2z, crz = e1x * e2y - e1y * e2x;
    var sn = BR.hypot3(crx, cry, crz), dt2 = e1x * e2x + e1y * e2y + e1z * e2z;
    var th = Math.atan2(sn, dt2);
    var kth = this.hK[i], th0 = this.hT0[i];
    var Mv = kth * (th - th0 - this.hThp[i]);
    // ---- 塑性铰（N-M 相关）：墩/塔/拱肋的延性机制 ----
    var Mp = this.hMp[i];
    if (Mp > 0) {
      var Mpe = Mp;
      var rf = this.hRefA[i];
      if (rf >= 0 && this.hNu[i] > 0) {
        var nAx = BR.clamp(-this.Nf[rf] / this.hNu[i], 0, 1);   // 压为正
        // RC/CFST：适度轴压提高抗弯；钢：轴压降低抗弯
        Mpe = this.hKd[i] === 1 ? Mp * (1 + 1.4 * nAx - 2.4 * nAx * nAx) : Mp * (1 - nAx * nAx);
        if (Mpe < 0.05 * Mp) Mpe = 0.05 * Mp;
      }
      if (Math.abs(Mv) > Mpe) {
        var dthp = (Math.abs(Mv) - Mpe) / kth * BR.sign(Mv);
        this.hThp[i] += dthp;
        this.diss.plastic += Math.abs(dthp * Mpe);
        Mv = BR.sign(Mv) * Mpe;
        if (Math.abs(this.hThp[i]) > this.hThuA[i]) {
          if (!this.noFail) {
            this.hSt[i] = 2; this.hact[i] = 0;
            this.log.add(this.t, 3, 'HINGE', '塑性铰转角超限（θp=' + (this.hThp[i] * 1000).toFixed(1) +
              ' mrad > ' + (this.hThuA[i] * 1000).toFixed(0) + ' mrad）→ 截面破坏，抗弯能力丧失');
            this.eventCount++;
          }
        }
      }
      this.hUtil[i] = Math.abs(Mv) / Mpe;
    }
    var scale;
    if (sn > 1e-10 * L1 * L2) scale = Mv / sn;
    else scale = kth * (1 - 0) / (L1 * L2);   // θ0=0 且未塑性时的光滑极限
    var wx = crx * scale, wy = cry * scale, wz = crz * scale;
    var t1x = e1x / L1, t1y = e1y / L1, t1z = e1z / L1;
    var t2x = e2x / L2, t2y = e2y / L2, t2z = e2z / L2;
    var FaX = -(wy * t1z - wz * t1y) / L1, FaY = -(wz * t1x - wx * t1z) / L1, FaZ = -(wx * t1y - wy * t1x) / L1;
    var FcX = -(wy * t2z - wz * t2y) / L2, FcY = -(wz * t2x - wx * t2z) / L2, FcZ = -(wx * t2y - wy * t2x) / L2;
    // ---------- 预弯构件的「弯曲方向」约束 ----------
    // 标量角铰只惩罚转角大小：对 θ0≠0 的预弯构件（拱肋等），面外弯曲只使 |θ| 产生
    // 四阶小量变化 → 面外摆动几乎是零能模态，会导致拱肋非物理垮塌。
    // 故补充方向项：U₂ = kθ·θ·θ₀·(1 − b̂·b̂₀ʀ)，其中 b̂₀ʀ 为初始弯曲方向按
    // 「切向最小旋转」共旋后的结果（共旋近似：求梯度时视 b̂₀ʀ 为常量）。
    // 恒等式：|Θ−Θ₀|² = (θ−θ₀)² + 2θθ₀(1−b̂·b̂₀)，故两项合起来即矢量弯曲能。
    if (th0 > 0.02 && sn > 1e-9) {
      var bx = crx / sn, by = cry / sn, bz2 = crz / sn;
      var i3 = 3 * i;
      var b0x = this.hB0[i3], b0y = this.hB0[i3 + 1], b0z = this.hB0[i3 + 2];
      // 共旋：把 b̂₀ 用「t1₀→t1 的最小旋转」旋转（Rodrigues）
      var q0x = this.hT10[i3], q0y = this.hT10[i3 + 1], q0z = this.hT10[i3 + 2];
      var vx2 = q0y * t1z - q0z * t1y, vy2 = q0z * t1x - q0x * t1z, vz2 = q0x * t1y - q0y * t1x;
      var cc = q0x * t1x + q0y * t1y + q0z * t1z;
      if (cc > -0.999) {
        var vb = vx2 * b0x + vy2 * b0y + vz2 * b0z, k1 = vb / (1 + cc);
        var rx = b0x * cc + (vy2 * b0z - vz2 * b0y) + k1 * vx2;
        var ry = b0y * cc + (vz2 * b0x - vx2 * b0z) + k1 * vy2;
        var rz = b0z * cc + (vx2 * b0y - vy2 * b0x) + k1 * vz2;
        var rn = BR.hypot3(rx, ry, rz);
        if (rn > 1e-9) { b0x = rx / rn; b0y = ry / rn; b0z = rz / rn; }
      }
      var dot = bx * b0x + by * b0y + bz2 * b0z;
      if (dot < 0) { b0x = -b0x; b0y = -b0y; b0z = -b0z; dot = -dot; }
      if (dot < 0.99999) {
        var kdir = kth * th0;
        // P = b̂₀ʀ − (b̂·b̂₀ʀ)·b̂  （b̂₀ʀ 在垂直于 b̂ 方向的分量）
        var Px = b0x - dot * bx, Py = b0y - dot * by, Pz = b0z - dot * bz2;
        // ∂(b̂·b̂₀)/∂e1 = (e2×P)/s ,  ∂(b̂·b̂₀)/∂e2 = −(e1×P)/s
        var g1x = (e2y * Pz - e2z * Py) / sn, g1y = (e2z * Px - e2x * Pz) / sn, g1z = (e2x * Py - e2y * Px) / sn;
        var g2x = -(e1y * Pz - e1z * Py) / sn, g2y = -(e1z * Px - e1x * Pz) / sn, g2z = -(e1x * Py - e1y * Px) / sn;
        // ∂U₂/∂e = kθθ₀(1−dot)·∂θ/∂e − kθ·θ·θ₀·∂dot/∂e
        var cf1 = kdir * (1 - dot);
        var gtx1 = (t1y * bz2 - t1z * by) / L1, gty1 = (t1z * bx - t1x * bz2) / L1, gtz1 = (t1x * by - t1y * bx) / L1;
        var gtx2 = (by * t2z - bz2 * t2y) / L2, gty2 = (bz2 * t2x - bx * t2z) / L2, gtz2 = (bx * t2y - by * t2x) / L2;
        var d1x = cf1 * gtx1 - kdir * th * g1x, d1y = cf1 * gty1 - kdir * th * g1y, d1z = cf1 * gtz1 - kdir * th * g1z;
        var d2x = cf1 * gtx2 - kdir * th * g2x, d2y = cf1 * gty2 - kdir * th * g2y, d2z = cf1 * gtz2 - kdir * th * g2z;
        // e1 = xb−xa, e2 = xc−xb  → 力 = −∂U/∂x
        FaX += d1x; FaY += d1y; FaZ += d1z;
        FcX -= d2x; FcY -= d2y; FcZ -= d2z;
        this.strainEnergy += kdir * th * (1 - dot);
      }
    }
    fx[A1] += FaX; fy[A1] += FaY; fz[A1] += FaZ;
    fx[C1] += FcX; fy[C1] += FcY; fz[C1] += FcZ;
    fx[B1] -= FaX + FcX; fy[B1] -= FaY + FcY; fz[B1] -= FaZ + FcZ;
    this.hM[i] = Mv;
    this.strainEnergy += 0.5 * Mv * Mv / kth;
  }
};

BR.World.prototype.breakElem = function (i, why) {
  if (this.st[i] === BR.ST.BROKEN) return;
  if (this.noFail) return;
  this.st[i] = BR.ST.BROKEN; this.act[i] = 0; this.brokenCount++;
  this.diss.fracture += 0.5 * Math.abs(this.sig[i]) * this.Ar[i] * this.L0[i] * 0.02;
  this.free[this.a_[i]] = 1; this.free[this.b_[i]] = 1;
  this.log.add(this.t, 2, 'FRACTURE', '#' + i + ' ' + (this.eName[i] || this.eMat[i]) + ' ' + why +
    '（σ=' + (this.sig[i] / 1e6).toFixed(0) + ' MPa, N=' + (this.Nf[i] / 1e3).toFixed(0) + ' kN）');
  this.eventCount++;
  this.needRecompile = 1;
};

/* ------------------------------ 支座 ------------------------------ */
BR.World.prototype.forcesBearing = function (dt) {
  for (var i = 0; i < this.bearings.length; i++) {
    var B = this.bearings[i];
    if (B.lost) continue;
    var d = B.nd, p = B.np;
    var pxs = p >= 0 ? this.x[p] : B.gx, pys = p >= 0 ? this.y[p] : B.gy, pzs = p >= 0 ? this.z[p] : B.gz;
    var pvx = p >= 0 ? this.vx[p] : 0, pvy = p >= 0 ? this.vy[p] : 0, pvz = p >= 0 ? this.vz[p] : 0;
    var dy = this.y[d] - pys - B.h0;
    var Fv = 0;
    if (dy < 0 || B.tie) {
      var cv = 2 * 0.25 * Math.sqrt(B.kv * Math.max(1e-6, this.m[d]));
      Fv = -B.kv * dy - cv * (this.vy[d] - pvy);
      if (!B.tie && Fv < 0) Fv = 0;
      // 拉压支座（抗上拔）：超过抗拔能力则拉杆断裂，退化为仅受压
      if (B.tie && Fv < -B.tieF && !this.noFail) {
        B.tie = 0;
        this.log.add(this.t, 2, 'BEARING', '#' + i + ' 拉压支座抗拔件拉断（F=' + (-Fv / 1e6).toFixed(1) +
          ' MN > ' + (B.tieF / 1e6).toFixed(1) + ' MN）→ 退化为仅受压支座');
        this.eventCount++;
      }
    }
    B.Fz = Fv;
    // 水平（X 顺桥向，Z 横桥向）
    var ux = this.x[d] - pxs - B.x0, uz = this.z[d] - pzs - B.z0;
    B.u = ux; B.w = uz;
    var au = Math.sqrt(ux * ux + uz * uz);
    if (au > B.maxU) B.maxU = au;
    var Fhx = 0, Fhz = 0;
    if (B.type === 'fixed' && !B.keyBroken) {
      Fhx = -B.kh * ux - 0.02 * B.kh * dt * (this.vx[d] - pvx);
      Fhz = -B.kh * uz - 0.02 * B.kh * dt * (this.vz[d] - pvz);
      if (B.keyF > 0 && Math.sqrt(Fhx * Fhx + Fhz * Fhz) > B.keyF && !this.noFail) {
        B.keyBroken = 1;
        this.log.add(this.t, 2, 'BEARING', '#' + i + ' 固定支座挡块剪断（F=' + (Math.sqrt(Fhx * Fhx + Fhz * Fhz) / 1e3).toFixed(0) + ' kN）→ 转为滑动');
        this.eventCount++;
      }
    } else if (B.type === 'lrb') {
      // 铅芯橡胶双线性：F = Kd·u + Qd·sign(滑移)
      var ky = B.Kd;
      Fhx = -(ky * ux + B.Qd * Math.tanh((this.vx[d] - pvx) / 0.005));
      Fhz = -(ky * uz + B.Qd * Math.tanh((this.vz[d] - pvz) / 0.005));
      this.diss.damp += Math.abs(B.Qd * (this.vx[d] - pvx)) * dt;
    } else {
      // 滑动摩擦（弹性-滑移正则化）
      var mu = B.mu, Ncap = mu * Fv;
      var kst = B.kh * 0.25;
      var exx = ux - B.slip, ezz = uz - B.slipZ;
      var Fs = kst * Math.sqrt(exx * exx + ezz * ezz);
      if (Fs > Ncap && Fs > 0) {
        var f = (Fs - Ncap) / Fs;
        B.slip += exx * f; B.slipZ += ezz * f;
        exx = ux - B.slip; ezz = uz - B.slipZ;
        this.diss.damp += Ncap * Math.sqrt((exx * f) * (exx * f)) ;
      }
      Fhx = -kst * exx; Fhz = -kst * ezz;
      // 行程止挡
      if (Math.abs(ux) > B.travel) Fhx += -B.kh * 2 * (ux - BR.sign(ux) * B.travel);
      if (Math.abs(uz) > B.travelZ) Fhz += -B.kh * 2 * (uz - BR.sign(uz) * B.travelZ);
    }
    B.Fh = Math.sqrt(Fhx * Fhx + Fhz * Fhz);
    this.fy[d] += Fv; this.fx[d] += Fhx; this.fz[d] += Fhz;
    if (p >= 0) { this.fy[p] -= Fv; this.fx[p] -= Fhx; this.fz[p] -= Fhz; }
    // 落梁判定（找形阶段不判定）
    if (au > B.seat && !this.noFail) {
      B.lost = 1;
      this.free[d] = 1;
      this.log.add(this.t, 3, 'UNSEAT', '#' + i + ' 支座相对位移 ' + au.toFixed(2) + ' m 超过支承长度 ' + B.seat.toFixed(2) + ' m → 落梁！');
      this.eventCount++;
    }
  }
};

/* ------------------------------ 土弹簧 ------------------------------ */
/** 双曲本构：F = Fult·tanh(k0·δ/Fult)，卸载按初始刚度（Masing 简化） */
BR.World.prototype.forcesSoil = function (dt) {
  var g = 9.80665;
  for (var i = 0; i < this.soil.length; i++) {
    var S = this.soil[i];
    if (!S.alive) continue;
    var nd = S.node;
    var deg = Math.max(0.02, Math.pow(1 - S.ru, 1.4));   // 液化退化（p-y 乘子）
    var kv = S.kv * deg, kh = S.kh * deg;
    var Qv = S.Qv * deg, Ph = S.Ph * Math.max(0.02, Math.pow(1 - S.ru, 1.0));
    // 相对位移（含地面运动）
    var dyy = (this.y[nd] - this.Y0[nd]) - S.gy;
    var dxx = (this.x[nd] - this.X0[nd]) - S.gx;
    var dzz = (this.z[nd] - this.Z0[nd]) - S.gz;
    var Fy = -Qv * Math.tanh(kv * dyy / Math.max(1e3, Qv));
    if (dyy > 0) Fy = -S.Qup * deg * Math.tanh(kv * dyy / Math.max(1e3, S.Qup * deg));  // 上拔仅侧阻
    var Fx = -Ph * Math.tanh(kh * dxx / Math.max(1e3, Ph));
    var Fz = -Ph * Math.tanh(kh * dzz / Math.max(1e3, Ph));
    // 辐射阻尼（半无限地基能量外逸，简化为 20% 临界）
    var cv = 0.4 * Math.sqrt(Math.max(1e-9, kv * this.m[nd]));
    Fy -= cv * this.vy[nd] * 0.5; Fx -= cv * this.vx[nd] * 0.5; Fz -= cv * this.vz[nd] * 0.5;
    this.fy[nd] += Fy; this.fx[nd] += Fx; this.fz[nd] += Fz;
    S.Fy = Fy; S.Fx = Fx; S.Fz = Fz;
    S.mob = Math.max(Math.abs(Fy) / Math.max(1, Qv), Math.hypot(Fx, Fz) / Math.max(1, Ph));
  }
};

/* ------------------------------ 接触 ------------------------------ */
/** 标记「初始即位于地面以下」的节点（承台/桩/锚碇）：这些节点的土-结构作用由
 *  土弹簧承担，不得再施加地形罚函数接触，否则会产生巨大的虚假上抬力。 */
BR.World.prototype.markBuried = function () {
  this.noContact = new Uint8Array(this.N);
  if (!this.env) return;
  for (var i = 0; i < this.N; i++) {
    var gy = this.env.terrainY(this.X0[i], this.Z0[i]);
    if (this.Y0[i] < gy + this.contRa[i] + 0.05) this.noContact[i] = 1;
  }
  for (var s = 0; s < this.soil.length; s++) this.noContact[this.soil[s].node] = 1;
};

BR.World.prototype.forcesContact = function (dt) {
  var i, n = this.N, terr = this.env ? this.env.terrainY.bind(this.env) : null;
  if (!terr) return;
  var nc = this.noContact;
  // 地形高程每 8 个子步刷新一次（地形随冲刷/滑坡缓慢变化，节点位移在此期间很小）
  if (!this.gyC) { this.gyC = new Float64Array(n); this.gyStamp = -999; }
  var refresh = (this.step - this.gyStamp) >= 8;
  if (refresh) this.gyStamp = this.step;
  for (i = 0; i < n; i++) {
    if (this.fixA[i] === 7 || (nc && nc[i])) continue;
    if (refresh) this.gyC[i] = terr(this.x[i], this.z[i]);
    var gy = this.gyC[i];
    var r = this.contRa[i];
    var pen = (gy + r) - this.y[i];
    if (pen > 0) {
      if (pen > 3 * r + 2) pen = 3 * r + 2;      // 限制罚函数深度，避免数值爆炸
      var mm = this.m[i];
      var kc = mm * 2600;             // ≈8 Hz 接触频率
      var cc = 2 * 0.55 * Math.sqrt(kc * mm);
      var Fn = kc * pen - cc * this.vy[i];
      if (Fn < 0) Fn = 0;
      this.fy[i] += Fn;
      // 摩擦（μ=0.6 土/碎石）
      var vt = Math.hypot(this.vx[i], this.vz[i]);
      if (vt > 1e-6) {
        var Ft = Math.min(0.6 * Fn, mm * vt / dt * 0.5);
        this.fx[i] -= Ft * this.vx[i] / vt; this.fz[i] -= Ft * this.vz[i] / vt;
        this.diss.contact += Ft * vt * dt;
      }
      this.diss.contact += Fn * Math.max(0, -this.vy[i]) * dt;
    }
  }
  // 碎块自接触（仅自由节点，空间哈希）
  var nf = 0, list = [];
  for (i = 0; i < n; i++) if (this.free[i] && this.fixA[i] !== 7) { list.push(i); nf++; }
  if (nf > 1 && nf < 4000) {
    var cell = 2.0, map = this.hash.map; map.clear();
    for (i = 0; i < list.length; i++) {
      var q = list[i];
      var key = (Math.floor(this.x[q] / cell) * 73856093) ^ (Math.floor(this.y[q] / cell) * 19349663) ^ (Math.floor(this.z[q] / cell) * 83492791);
      var arr = map.get(key); if (!arr) { arr = []; map.set(key, arr); }
      arr.push(q);
    }
    map.forEach(function (arr, key) {
      for (var u = 0; u < arr.length; u++) for (var v = u + 1; v < arr.length; v++) {
        var p = arr[u], q2 = arr[v];
        var dx = this.x[q2] - this.x[p], dy = this.y[q2] - this.y[p], dz = this.z[q2] - this.z[p];
        var d2 = dx * dx + dy * dy + dz * dz;
        var rr = this.contRa[p] + this.contRa[q2];
        if (d2 < rr * rr && d2 > 1e-9) {
          var d = Math.sqrt(d2), pen2 = rr - d;
          var mm2 = 0.5 * (this.m[p] + this.m[q2]);
          var kc2 = mm2 * 1800, F = kc2 * pen2;
          var nx = dx / d, ny = dy / d, nz = dz / d;
          var vr = (this.vx[q2] - this.vx[p]) * nx + (this.vy[q2] - this.vy[p]) * ny + (this.vz[q2] - this.vz[p]) * nz;
          F -= 2 * 0.4 * Math.sqrt(kc2 * mm2) * vr * 0.5;
          if (F < 0) F = 0;
          this.fx[p] -= F * nx; this.fy[p] -= F * ny; this.fz[p] -= F * nz;
          this.fx[q2] += F * nx; this.fy[q2] += F * ny; this.fz[q2] += F * nz;
        }
      }
    }, this);
  }
};

/* ------------------------------ 浮力 ------------------------------ */
BR.World.prototype.forcesBuoyancy = function (dt) {
  var i, rho = 1025, g = 9.80665;
  if (!this.env) return;
  for (i = 0; i < this.pontoons.length; i++) {
    var P = this.pontoons[i];
    var nn = P.nodes.length, Aw = P.Aw / nn, Vh = P.V / nn;
    for (var j = 0; j < nn; j++) {
      var nd = P.nodes[j];
      var wl = this.env.waterY(this.x[nd], this.z[nd], this.t);
      var draft = wl - (this.y[nd] - P.depth * 0.5);
      var fill = BR.clamp(draft / P.depth, 0, 1);
      var Vsub = Vh * fill * (1 - (P.flood || 0));
      var Fb = rho * g * Vsub;
      // 垂荡阻尼（辐射+粘性，取 15% 临界）
      var kw = rho * g * Aw;
      var cw = 2 * 0.15 * Math.sqrt(kw * Math.max(1e-6, this.m[nd]));
      var vw = this.env.waterVy ? this.env.waterVy(this.x[nd], this.z[nd], this.t) : 0;
      Fb -= cw * (this.vy[nd] - vw);
      this.fy[nd] += Fb;
      P.draft = draft;
      // 进水（压载）
      if (P.flood) this.fy[nd] -= rho * g * Vh * P.flood * 0.35;
    }
  }
};

/* ------------------------------ 主步进 ------------------------------ */
BR.World.prototype.substep = function (dt) {
  var i, n = this.N;
  var fx = this.fx, fy = this.fy, fz = this.fz;
  for (i = 0; i < n; i++) { fx[i] = 0; fy[i] = 0; fz[i] = 0; }
  // 重力（用「荷载质量」mLoad，与惯性质量 m 分离，便于动力松弛使用虚拟质量）
  var g = this.gravity * this.loadScale;
  var ml = this.mLoad || this.m;
  for (i = 0; i < n; i++) fy[i] += ml[i] * g;
  // 外载（风/波/车/施灾，由 env 每帧填入 fext）
  var ls = this.loadScale;
  if (this.fext) for (i = 0; i < n; i++) { fx[i] += this.fext[3 * i] * ls; fy[i] += this.fext[3 * i + 1] * ls; fz[i] += this.fext[3 * i + 2] * ls; }
  this.forcesInternal(dt);
  this.forcesBearing(dt);
  this.forcesSoil(dt);
  this.forcesBuoyancy(dt);
  if (this.env && this.env.perSubstep) this.env.perSubstep(this, dt);
  this.forcesContact(dt);
  // 质量比例阻尼（α·m·v；α=2ζω₁）
  var al = this.alphaDamp;
  if (al > 0) for (i = 0; i < n; i++) {
    var dmp = al * this.m[i];
    fx[i] -= dmp * this.vx[i]; fy[i] -= dmp * this.vy[i]; fz[i] -= dmp * this.vz[i];
  }
  // 积分（中心差分 / 半隐式）
  var KE = 0;
  for (i = 0; i < n; i++) {
    var fxa = this.fixA[i];
    if (fxa === 7) { this.vx[i] = 0; this.vy[i] = 0; this.vz[i] = 0; continue; }
    var im = this.invm[i];
    if (!(fxa & 1)) this.vx[i] += fx[i] * im * dt; else this.vx[i] = 0;
    if (!(fxa & 2)) this.vy[i] += fy[i] * im * dt; else this.vy[i] = 0;
    if (!(fxa & 4)) this.vz[i] += fz[i] * im * dt; else this.vz[i] = 0;
    // 速度上限（数值保护，1000 m/s）
    var sp = Math.abs(this.vx[i]) + Math.abs(this.vy[i]) + Math.abs(this.vz[i]);
    if (sp > 1500) { var sc = 1500 / sp; this.vx[i] *= sc; this.vy[i] *= sc; this.vz[i] *= sc; }
    this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt; this.z[i] += this.vz[i] * dt;
    KE += 0.5 * this.m[i] * (this.vx[i] * this.vx[i] + this.vy[i] * this.vy[i] + this.vz[i] * this.vz[i]);
  }
  this.KE = KE;
  this.t += dt; this.step++;
  if (this.step % 512 === 0) {
    if (!isFinite(this.x[0] + this.y[0] + this.KE)) { this.nanFlag = true; }
  }
};

/** 推进 wall-clock 一帧对应的仿真时间 */
BR.World.prototype.advance = function (simTime, maxSub) {
  var nsub = Math.max(1, Math.min(maxSub || 240, Math.round(simTime / this.dt)));
  var dt = simTime / nsub;
  if (dt > this.dt * 1.05) { nsub = Math.ceil(simTime / this.dt); dt = simTime / nsub; }
  if (nsub > (maxSub || 240)) { nsub = maxSub || 240; dt = this.dt; }
  for (var s = 0; s < nsub; s++) this.substep(dt);
  this.lastSub = nsub; this.lastDt = dt;
  if (this.needRecompile) { this.needRecompile = 0; this.computeMass(); for (var i = 0; i < this.N; i++) this.invm[i] = 1 / this.m[i]; }
  return nsub * dt;
};

/* ------------------------------ 诊断 ------------------------------ */
BR.World.prototype.energy = function () {
  var i, PE = 0;
  for (i = 0; i < this.N; i++) PE += this.m[i] * 9.80665 * this.y[i];
  return { KE: this.KE || 0, SE: this.strainEnergy || 0, PE: PE, diss: this.diss };
};

BR.World.prototype.maxUtil = function (tagFilter) {
  var mx = 0, arg = -1;
  for (var i = 0; i < this.nE; i++) {
    if (!this.act[i]) continue;
    if (tagFilter && this.eName[i].indexOf(tagFilter) < 0) continue;
    if (this.util[i] > mx) { mx = this.util[i]; arg = i; }
  }
  return { u: mx, e: arg };
};

BR.World.prototype.nodeDisp = function (i) {
  return BR.hypot3(this.x[i] - this.X0[i], this.y[i] - this.Y0[i], this.z[i] - this.Z0[i]);
};

/** 自由衰减模态识别：给指定节点脉冲，记录响应并做谱峰识别 */
BR.World.prototype.modalID = function (opts) {
  opts = opts || {};
  var probe = opts.probe, dirs = opts.dirs || [1];
  var T = opts.T || 40, dt = this.dt;
  var nstep = Math.floor(T / dt), i, k;
  var sigs = [];
  for (k = 0; k < probe.length; k++) sigs.push(new Float64Array(nstep));
  // 施加初速度
  for (k = 0; k < probe.length; k++) {
    if (dirs[k] === 1) this.vy[probe[k]] += opts.amp || 0.05;
    if (dirs[k] === 2) this.vz[probe[k]] += opts.amp || 0.05;
    if (dirs[k] === -1) this.vy[probe[k]] -= opts.amp || 0.05;
  }
  var save = this.alphaDamp; this.alphaDamp = opts.damp === undefined ? 0.002 : opts.damp;
  for (i = 0; i < nstep; i++) {
    this.substep(dt);
    for (k = 0; k < probe.length; k++) sigs[k][i] = this.y[probe[k]] - this.Y0[probe[k]];
  }
  this.alphaDamp = save;
  var out = [];
  for (k = 0; k < probe.length; k++) out.push(BR.spectralPeaks(sigs[k], dt, 5));
  return { peaks: out, sigs: sigs, dt: dt };
};

/* 状态快照（回放） */
BR.World.prototype.snapshot = function () {
  var n = this.N, buf = new Float32Array(n * 3), i;
  for (i = 0; i < n; i++) { buf[3 * i] = this.x[i]; buf[3 * i + 1] = this.y[i]; buf[3 * i + 2] = this.z[i]; }
  var stt = new Uint8Array(this.nE);
  for (i = 0; i < this.nE; i++) stt[i] = this.st[i];
  var ut = new Uint8Array(this.nE);
  for (i = 0; i < this.nE; i++) ut[i] = BR.clamp(Math.round((this.sig[i] / Math.max(1e5, this.mFy[this.mid[i]])) * 127 + 128), 0, 255);
  return { t: this.t, pos: buf, st: stt, u: ut };
};
BR.World.prototype.restore = function (sn) {
  var n = this.N, i;
  for (i = 0; i < n; i++) { this.x[i] = sn.pos[3 * i]; this.y[i] = sn.pos[3 * i + 1]; this.z[i] = sn.pos[3 * i + 2]; }
};


/* ===== 40-env.js ===== */
/* =============================================================================
 * 桥匠 BRIDGEWRIGHT · 40-env.js
 * 环境与地基耦合：风场/准定常气动弹性/涡振 · Airy 波+Morison · 潮流+HEC-18 冲刷
 *   近断层地震合成 + 1D 场地反应 + 液化孔压 + 侧向流动 · Newmark 滑块 · 冻土活动层
 *   船撞/浮冰/泥石流/海啸/落石 · 车流（含悬架动力与路面不平度）
 * ========================================================================== */
'use strict';
var BR = (typeof BR !== 'undefined') ? BR : {};

BR.RHO_A = 1.225;      // 空气密度 kg/m³（15℃，海平面；高原场景按气压折减）
BR.RHO_W = 1025;       // 海水
BR.RHO_FW = 1000;      // 淡水
BR.G = 9.80665;

/* ============================ 风场 ============================ */
/** 谐波叠加法生成脉动风（Kaimal 谱），冻结湍流对流延迟近似空间相关性 */
BR.WindField = function (o) {
  this.U10 = o.U10 || 25; this.alpha = o.alpha || 0.16; this.Iu = o.Iu || 0.14;
  this.zref = 10; this.nh = o.nh || 96; this.seed = o.seed || 12345;
  this.Lu = o.Lu || 120;            // 湍流积分尺度 m
  this.speedup = o.speedup || 1.0;  // 地形加速比（峡谷/山脊）
  this.dir = o.dir === undefined ? 90 : o.dir;   // deg，90=正横桥向
  this.gust = 1;                    // 阵风倍数（可临时放大）
  this.Uconv = Math.max(5, this.U10);
  var rng = BR.rng(this.seed), i;
  this.f = new Float64Array(this.nh); this.au = new Float64Array(this.nh);
  this.aw = new Float64Array(this.nh); this.ph = new Float64Array(this.nh);
  this.ph2 = new Float64Array(this.nh);
  var f1 = 0.004, f2 = 6.0;         // Hz 频段
  var lr = Math.log(f2 / f1) / this.nh;
  for (i = 0; i < this.nh; i++) {
    var fa = f1 * Math.exp(lr * i), fb = f1 * Math.exp(lr * (i + 1));
    var fc = Math.sqrt(fa * fb), df = fb - fa;
    this.f[i] = fc;
    var sigu = this.Iu * this.U10, sigw = 0.5 * sigu;
    var fr = fc * 30 / Math.max(2, this.U10);            // z=30m 参考
    var Su = sigu * sigu * 200 * (fr / fc) / Math.pow(1 + 50 * fr, 5 / 3);
    var Sw = sigw * sigw * 3.36 * (fr / fc) / (1 + 10 * Math.pow(fr, 5 / 3));
    this.au[i] = Math.sqrt(2 * Math.max(0, Su) * df);
    this.aw[i] = Math.sqrt(2 * Math.max(0, Sw) * df);
    this.ph[i] = rng() * 2 * Math.PI; this.ph2[i] = rng() * 2 * Math.PI;
  }
  this.targetSpec = function (fq) {                       // 供验证页对比
    var sigu = this.Iu * this.U10, fr = fq * 30 / Math.max(2, this.U10);
    return sigu * sigu * 200 * (fr / fq) / Math.pow(1 + 50 * fr, 5 / 3);
  };
};
BR.WindField.prototype.mean = function (y) {
  var z = Math.max(2, y);
  return this.U10 * Math.pow(z / this.zref, this.alpha) * this.speedup;
};
/** 返回 {U, u, w}：U 平均 + u 顺风脉动 + w 竖向脉动（x 为顺桥向坐标，用于对流延迟） */
BR.WindField.prototype.at = function (x, y, t) {
  var tt = t - x / this.Uconv, u = 0, w = 0, i;
  for (i = 0; i < this.nh; i++) {
    var a = 2 * Math.PI * this.f[i] * tt;
    u += this.au[i] * Math.cos(a + this.ph[i]);
    w += this.aw[i] * Math.cos(a + this.ph2[i]);
  }
  var Um = this.mean(y);
  var prof = Math.pow(Math.max(2, y) / this.zref, this.alpha) * this.speedup;
  return { Um: Um, u: u * prof * this.gust, w: w * prof * this.gust, U: Um + u * prof * this.gust };
};

/* ---- 断面气动参数（等效准定常气动导数，按断面类型标定） ---- */
BR.AERO = {
  box_stream: { CD: 0.55, CL1: 3.4, CM1: 0.14, ra: 0.25, rm: 0.05, St: 0.11, CL0: 0.02, CM0: 0.0, name: '流线型闭口箱梁（带风嘴+导流板）' },
  box_open: { CD: 0.95, CL1: 2.8, CM1: 0.30, ra: 0.25, rm: 0.05, St: 0.13, CL0: 0.03, CM0: 0.01, name: '开口/分体箱梁' },
  truss: { CD: 1.30, CL1: 2.2, CM1: 0.35, ra: 0.25, rm: 0.05, St: 0.15, CL0: 0.00, CM0: 0.0, name: '钢桁架加劲梁（含格栅桥面）' },
  plate_girder: { CD: 1.60, CL1: 2.0, CM1: 0.65, ra: 0.25, rm: 0.05, St: 0.15, CL0: 0.0, CM0: 0.0, name: '实腹板梁（Tacoma 型，气动极差）' },
  timber_cov: { CD: 1.45, CL1: 1.6, CM1: 0.55, ra: 0.22, rm: 0.05, St: 0.16, CL0: 0.05, CM0: 0.0, name: '廊屋木拱（高侧向挡风面）' },
  pontoon: { CD: 1.10, CL1: 1.2, CM1: 0.20, ra: 0.20, rm: 0.05, St: 0.14, CL0: 0.0, CM0: 0.0, name: '浮桥低干舷桥面' }
};
/* 标定说明（重要：属"模型标定"，不是第一性原理预测）：
 *  ① 本引擎用准定常气动力（无频率依赖），两种失稳机制同时存在：
 *     · 单自由度扭转颤振：U_cr = 4ζ·I·ω_t /(ρB³·CM1·rm)（α̇ 项负气动阻尼）
 *     · 弯扭耦合颤振：由 ∂L/∂α（CL1）与 ∂M/∂ḣ（CM1/U）交叉耦合驱动
 *     真实钝体断面的气动导数随折减风速变化（Scanlan A*, H*），准定常会高估失稳，
 *     故把 CL1/CM1/rm 视作"等效导数"，用实桥颤振风速反标定。
 *  ② 标定锚点（验证页给出误差表）：
 *     · Tacoma Narrows 旧桥 B=11.9 m, I=1.78e5 kg·m²/m, f_t=0.20, f_h=0.13, ζ=0.5%
 *       → 实测扭转发散 ≈19 m/s（1940-11-07）
 *     · 大带东桥级流线型箱梁 B=31 m, I=2.47e6, f_t=0.278, f_h=0.10 → 风洞 ≈70 m/s
 *     · 明石海峡级桁架梁 B=35.5 m, I=1.1e7, f_t=0.19, f_h=0.065 → 风洞 ≈78 m/s
 *  ③ 未建模：气动导数的折减风速依赖、气动导纳与空间相关性、三维模态耦合颤振、
 *     颤振后大幅极限环。替代处理：常数等效导数 + 断面类型分档 + ±30% 敏感性提示。*/

/* ============================ 场景环境 ============================ */
BR.Env = function (sc) {
  this.sc = sc;
  this.t = 0;
  // 初始为「常遇风」（约 0.3 倍设计风速），设计/台风风速由考验台施加。
  // 若把 100 年重现期风速当作日常工况，长周期大跨桥在开局就可能进入涡振/颤振。
  this.wind = new BR.WindField({
    U10: Math.max(6, sc.wind.U10 * 0.30), alpha: sc.wind.alpha, Iu: sc.wind.Iu,
    speedup: sc.wind.speedup, seed: sc.seed || 7, Lu: sc.wind.Lu || 120
  });
  this.rhoA = BR.RHO_A * (sc.airDensityFactor || 1);
  this.rhoW = sc.water.fresh ? BR.RHO_FW : BR.RHO_W;
  this.waterLevel = sc.water.level;
  this.tideAmp = sc.water.tide || 0;
  this.tideT = (sc.water.tideT || 12.42) * 3600;
  this.wave = { Hs: sc.water.Hs || 0, Tp: sc.water.Tp || 8, dir: 90, comp: [] };
  this.current = sc.water.current || 0;
  this.floodRise = 0; this.floodVel = 0; this.surge = 0;
  this.scour = [];               // {x,z,D,ys,yseq,type}
  this.quake = null;
  this.ru = 0;                   // 代表性砂层孔压比
  this.liqSettle = 0; this.spread = 0;
  this.slide = { u: 0, v: 0, FS: 2, ky: 0.3, active: 0, toeCut: 0 };
  this.frost = { heave: 0, thaw: 0, activeLayer: sc.permafrost ? sc.permafrost.Za0 : 0, years: 0, jack: 0 };
  this.corrosionYears = 0;
  this.impulses = [];            // 瞬时冲击（船撞/浮冰/落石/漂流物）
  this.tsunami = null; this.debrisFlow = null;
  this.rng = BR.rng((sc.seed || 7) + 991);
  this.makeWave();
  this.hazard = {};
  this.viv = [];
  this.windLoadScale = 1;
  this.time_years = 0;
};

BR.Env.prototype.makeWave = function () {
  // JONSWAP 简化离散：5 个分量覆盖谱峰
  var Hs = this.wave.Hs, Tp = this.wave.Tp, i, comp = [];
  if (Hs > 0.01) {
    var fp = 1 / Tp, fr = [0.7, 0.85, 1.0, 1.2, 1.45], wt = [0.10, 0.22, 0.36, 0.22, 0.10];
    for (i = 0; i < 5; i++) {
      var f = fp * fr[i], T = 1 / f;
      var H = Hs * Math.sqrt(wt[i]) * 1.0;
      comp.push({ H: H, T: T, k: BR.waveNumber(T, Math.max(3, this.sc.water.depth)), ph: this.rng() * 6.283, w: 2 * Math.PI * f });
    }
  }
  this.wave.comp = comp;
};

BR.Env.prototype.setWave = function (Hs, Tp) { this.wave.Hs = Hs; this.wave.Tp = Tp; this.makeWave(); };

/* ---- 地形 ---- */
BR.Env.prototype.terrainY = function (x, z) {
  var y = this.sc.ground(x, z);
  // 冲刷坑（局部下切，锥形）
  for (var i = 0; i < this.scour.length; i++) {
    var S = this.scour[i];
    var d = Math.hypot(x - S.x, z - S.z);
    var R = 2.5 * S.D + S.ys * 1.5;
    if (d < R) y -= S.ys * Math.pow(1 - d / R, 1.6);
  }
  // 滑坡体位移（把滑动块整体下移/外移的视觉与接触效果）
  if (this.slide.u > 0.01 && this.sc.slideZone) {
    var w = this.sc.slideZone(x, z);
    if (w > 0) y -= this.slide.u * 0.35 * w;
  }
  return y;
};
BR.Env.prototype.waterY = function (x, z, t) {
  var lvl = this.waterLevel + this.floodRise + this.surge +
    (this.tideAmp ? this.tideAmp * Math.sin(2 * Math.PI * t / this.tideT) : 0);
  var eta = 0;
  for (var i = 0; i < this.wave.comp.length; i++) {
    var C = this.wave.comp[i];
    eta += 0.5 * C.H * Math.cos(C.k * z - C.w * t + C.ph);
  }
  if (this.tsunami) eta += this.tsunami.eta(x, z, t);
  return lvl + eta;
};
BR.Env.prototype.waterVy = function (x, z, t) {
  var vy = 0;
  for (var i = 0; i < this.wave.comp.length; i++) {
    var C = this.wave.comp[i];
    vy += 0.5 * C.H * C.w * Math.sin(C.k * z - C.w * t + C.ph);
  }
  return vy;
};
/** 水粒子速度/加速度（Airy，含潮流/洪水流；z 向为波传播方向） */
BR.Env.prototype.waterKin = function (x, y, z, t) {
  var d = Math.max(3, this.sc.water.depth + this.floodRise);
  var wl = this.waterLevel + this.floodRise + this.surge;
  var uz = 0, uy = 0, az = 0, ay = 0;
  var zz = BR.clamp(y - wl, -d, 0);
  for (var i = 0; i < this.wave.comp.length; i++) {
    var C = this.wave.comp[i], kd = C.k * d;
    var ch = Math.cosh(C.k * (zz + d)) / Math.max(1e-6, Math.sinh(kd));
    var sh = Math.sinh(C.k * (zz + d)) / Math.max(1e-6, Math.sinh(kd));
    var ph = C.k * z - C.w * t + C.ph, a = 0.5 * C.H * C.w;
    uz += a * ch * Math.cos(ph); uy += a * sh * Math.sin(ph);
    az += a * C.w * ch * Math.sin(ph); ay += -a * C.w * sh * Math.cos(ph);
  }
  var cur = this.currentNow(t);
  return { uz: uz + cur, uy: uy, az: az, ay: ay, wl: wl };
};
BR.Env.prototype.currentNow = function (t) {
  var c = this.current;
  if (this.sc.water.reversing) c = this.current * Math.sin(2 * Math.PI * t / this.tideT);
  return c + this.floodVel;
};

/* ============================ 地震 ============================ */
/** 近断层脉冲（Mavroeidis–Papageorgiou 小波）+ 宽频（Kanai-Tajimi 滤波白噪 + Jennings 包线） */
BR.Env.prototype.makeQuake = function (o) {
  var dt = 0.005, dur = o.dur || 40, n = Math.round(dur / dt), i;
  var rng = BR.rng(o.seed || 2024);
  var ag = [new Float64Array(n), new Float64Array(n), new Float64Array(n)];
  // 宽频分量：二阶滤波白噪
  var wg = 2 * Math.PI * (o.fg || 2.2), zg = o.zg || 0.6;
  for (var c = 0; c < 3; c++) {
    var y1 = 0, y2 = 0;
    for (i = 0; i < n; i++) {
      var t = i * dt;
      var env = (t < 3 ? Math.pow(t / 3, 2) : (t < 0.45 * dur ? 1 : Math.exp(-0.22 * (t - 0.45 * dur))));
      var wn = rng.norm();
      var acc = wn * 1.0;
      var y2d = acc - 2 * zg * wg * y2 - wg * wg * y1;
      y2 += y2d * dt; y1 += y2 * dt;
      ag[c][i] = y2 * env * (c === 1 ? 0.62 : 1.0);   // 竖向取 2/3
    }
  }
  // 近断层速度脉冲（仅主要水平向）
  if (o.pulse) {
    var fp = 1 / (o.Tp || 4), gam = o.gamma || 1.8, nu = o.nu || Math.PI / 2, t0 = o.t0 || 0.35 * dur;
    var Ap = o.Ap || 1.0;
    for (i = 0; i < n; i++) {
      var t2 = i * dt - t0;
      if (Math.abs(t2) <= gam / (2 * fp)) {
        // v(t) 的二阶导 → 加速度（解析）
        var w = 2 * Math.PI * fp, W = w / gam;
        var v = 0.5 * Ap * (1 + Math.cos(W * t2)) * Math.cos(w * t2 + nu);
        var dv = 0.5 * Ap * (-W * Math.sin(W * t2) * Math.cos(w * t2 + nu) - w * (1 + Math.cos(W * t2)) * Math.sin(w * t2 + nu));
        ag[0][i] += dv;
        ag[2][i] += 0.55 * dv;
      }
    }
  }
  // 基线校正 + 缩放到目标 PGA
  for (c = 0; c < 3; c++) {
    var mean = 0; for (i = 0; i < n; i++) mean += ag[c][i]; mean /= n;
    var mx = 0; for (i = 0; i < n; i++) { ag[c][i] -= mean; if (Math.abs(ag[c][i]) > mx) mx = Math.abs(ag[c][i]); }
    var tgt = (c === 1 ? o.pgaV || o.pga * 0.65 : o.pga) * BR.G;
    var sc2 = mx > 0 ? tgt / mx : 0;
    for (i = 0; i < n; i++) ag[c][i] *= sc2;
  }
  // 1D 场地放大
  var site = this.sc.site;
  var out = ag;
  if (site && site.layers && site.layers.length) {
    out = [this.siteResponse(ag[0], dt, site), ag[1], this.siteResponse(ag[2], dt, site)];
  }
  // 积分得速度/位移（含高通去漂移）
  var vg = [], ug = [];
  for (c = 0; c < 3; c++) {
    var v = new Float64Array(n), u = new Float64Array(n), vv = 0, uu = 0;
    for (i = 0; i < n; i++) { vv += out[c][i] * dt; vv *= 0.9995; v[i] = vv; uu += vv * dt; uu *= 0.9995; u[i] = uu; }
    vg.push(v); ug.push(u);
  }
  this.quake = {
    dt: dt, n: n, ag: out, agRock: ag, vg: vg, ug: ug, t0: this.t, dur: dur,
    pga: o.pga, apparentV: o.apparentV || 1800, name: o.name || '合成地震动',
    active: true, Tp: o.Tp, pulse: !!o.pulse, mw: o.mw || 7.0
  };
  this.ru = 0; this.liqSettle = 0; this.spread = 0;
  return this.quake;
};

/** 1D 剪切梁场地反应（显式有限差分，等效线性）
 *  阻尼：单元应变率（刚度比例 Rayleigh，c_e=2ζk_e/ω₁），避免用绝对速度阻尼
 *  造成对整体模态的过阻尼；基底为刚性基岩位移输入。返回地表绝对加速度。 */
BR.Env.prototype.siteResponse = function (aRock, dt, site) {
  var L = site.layers, i, j, e;
  var hh = [], G = [], rho = [], zt = [];
  var Htot = 0, travel = 0;
  for (i = 0; i < L.length; i++) {
    var ne = Math.max(1, Math.round(L[i].h / 3));
    var vs = L[i].vs * (site.degrade || 1);
    for (j = 0; j < ne; j++) {
      hh.push(L[i].h / ne); G.push(L[i].rho * vs * vs); rho.push(L[i].rho); zt.push(L[i].zeta || 0.05);
    }
    Htot += L[i].h; travel += L[i].h / vs;
  }
  var nel = hh.length, nn = nel + 1;
  var w1 = 2 * Math.PI / (4 * travel);           // 场地基频圆频率 = 2π·Vs̄/4H
  var ke = new Float64Array(nel), ce = new Float64Array(nel), mn = new Float64Array(nn);
  for (e = 0; e < nel; e++) {
    ke[e] = G[e] / hh[e];
    ce[e] = 2 * zt[e] * ke[e] / w1;
    var me = rho[e] * hh[e];
    mn[e] += 0.5 * me; mn[e + 1] += 0.5 * me;
  }
  var n = aRock.length;
  var u = new Float64Array(nn), v = new Float64Array(nn), fn = new Float64Array(nn);
  var out = new Float64Array(n);
  // 稳定步长：波动 + 阻尼双重限制
  var hmax = 1e9;
  for (e = 0; e < nel; e++) {
    var mmin = Math.min(mn[e], mn[e + 1]);
    hmax = Math.min(hmax, 0.4 * Math.sqrt(mmin / ke[e]), 0.5 * mmin / Math.max(1e-9, ce[e]));
  }
  var sub = Math.max(1, Math.ceil(dt / hmax)), h = dt / sub;
  var ub = 0, vb = 0, base = nn - 1;
  for (var s = 0; s < n; s++) {
    var a0 = aRock[s], a1 = aRock[Math.min(n - 1, s + 1)];
    for (var k = 0; k < sub; k++) {
      var ai = a0 + (a1 - a0) * (k / sub);
      vb += ai * h; ub += vb * h;
      u[base] = ub; v[base] = vb;
      for (i = 0; i < nn; i++) fn[i] = 0;
      for (e = 0; e < nel; e++) {
        var F = ke[e] * (u[e + 1] - u[e]) + ce[e] * (v[e + 1] - v[e]);
        fn[e] += F; fn[e + 1] -= F;
      }
      for (i = 0; i < base; i++) { var acc = fn[i] / mn[i]; v[i] += acc * h; }
      for (i = 0; i < base; i++) u[i] += v[i] * h;
    }
    out[s] = fn[0] / mn[0];      // 地表绝对加速度
  }
  return out;
};

/** 解析检验用：单层弹性场地传递函数 |H(f)| = 1/|cos(ωH/Vs) + i·ζ...| */
BR.Env.siteTF = function (f, H, Vs, zeta) {
  var w = 2 * Math.PI * f;
  var ks = w * H / Vs;
  var re = Math.cos(ks), im = zeta * ks * Math.sin(ks);
  return 1 / Math.sqrt(re * re + im * im);
};

/* ============================ 液化 ============================ */
/** NCEER/Youd(2001) CRR + Seed 孔压增长；返回 ru 增量 */
BR.Env.prototype.updateLiquefaction = function (dt, amax) {
  var sd = this.sc.liq;
  if (!sd || !sd.enable) return;
  var sv = sd.gamma * sd.depth, svp = sv - 9.81e3 * Math.max(0, sd.depth - sd.gwl);
  var rd = 1 - 0.00765 * sd.depth;
  var CSR = 0.65 * (amax / BR.G) * (sv / Math.max(1e3, svp)) * rd;
  var N = sd.N160;
  var CRR = Math.exp(N / 14.1 + Math.pow(N / 126, 2) - Math.pow(N / 23.6, 3) + Math.pow(N / 25.4, 4) - 2.8);
  var MSF = Math.pow(this.quake ? (this.quake.mw / 7.5) : 1, -2.56);
  var FS = CRR * MSF / Math.max(1e-6, CSR);
  this.liqFS = FS; this.liqCSR = CSR; this.liqCRR = CRR;
  if (CSR < 0.03) return;
  // 等效循环数：以峰值加速度包线的过零率估计
  var f0 = 1.5;                                  // 主频估计 Hz
  var Nl = 15 * Math.pow(Math.max(0.2, FS), 1 / 0.34);   // CSR-N 曲线（b=0.34）
  var dN = f0 * dt;
  this.liqN = (this.liqN || 0) + dN;
  var r = Math.min(1, this.liqN / Math.max(0.5, Nl));
  var th = 0.7;
  var ruNew = (2 / Math.PI) * Math.asin(Math.pow(BR.clamp(r, 0, 1), 1 / (2 * th)));
  if (ruNew > this.ru) this.ru = ruNew;
  // 液化后体积应变（Ishihara–Yoshimine 简化）与侧向流动（Youd 经验式思想）
  if (this.ru > 0.85) {
    var epsv = BR.clamp(0.06 * (1.2 - Math.min(1.2, FS)) * (1 - N / 40), 0, 0.05);
    this.liqSettle = Math.min(sd.H * epsv, this.liqSettle + sd.H * epsv * dt * 0.4);
    if (sd.freeFace) this.spread = Math.min(sd.spreadMax || 1.2, this.spread + 0.25 * dt);
  }
};

/* ============================ 冲刷 ============================ */
/** HEC-18 局部冲刷 + Laursen 收缩冲刷；Melville–Chiew 时间发展 */
BR.Env.prototype.addPier = function (x, z, D, y1) {
  this.scour.push({ x: x, z: z, D: D, ys: 0, yseq: 0, y1: y1 || 8, t: 0, K1: 1.0, K2: 1.0, K3: 1.1 });
  return this.scour.length - 1;
};
BR.Env.prototype.updateScour = function (dt) {
  var V = Math.abs(this.currentNow(this.t));
  for (var i = 0; i < this.scour.length; i++) {
    var S = this.scour[i];
    var y1 = Math.max(0.5, this.sc.water.depth + this.floodRise);
    var Fr = V / Math.sqrt(BR.G * y1);
    var yseq = 2.0 * S.K1 * S.K2 * S.K3 * Math.pow(S.D, 0.65) * Math.pow(y1, 0.35) * Math.pow(Math.max(1e-3, Fr), 0.43);
    // 反复流（潮汐）折减 0.85；清水冲刷时间尺度（Melville & Chiew 1999）
    if (this.sc.water.reversing) yseq *= 0.85;
    S.yseq = yseq;
    var te = 30 * 86400 * Math.pow(Math.max(0.1, S.D / Math.max(0.2, V)), 0.25) / 8;
    var rate = (yseq - S.ys) / Math.max(60, te) * 1.0;
    S.ys += Math.max(0, rate) * dt;
    if (S.ys > yseq) S.ys = yseq;
  }
};
/** 收缩冲刷（Laursen 活动床） */
BR.Env.prototype.contractionScour = function (Q1, Q2, W1, W2, y1) {
  return y1 * Math.pow(Q2 / Q1, 6 / 7) * Math.pow(W1 / W2, 0.59) - y1;
};

/* ============================ 斜坡（Newmark 滑块） ============================ */
BR.Env.prototype.updateSlope = function (dt, kh) {
  var S = this.sc.slope;
  if (!S) return;
  var beta = BR.rad(S.beta), phi = BR.rad(S.phi);
  var H = S.H, gam = S.gamma, c = S.c;
  // 平面滑动楔体：单位宽度
  var Lslip = H / Math.sin(beta);
  var W = 0.5 * gam * H * H / Math.tan(beta) * (1 - this.slide.toeCut * 0.9);
  var U = S.ru_static * gam * H * Lslip * 0.5;     // 孔压折减
  var Wn = W * Math.cos(beta), Wt = W * Math.sin(beta);
  var res = c * Lslip + Math.max(0, Wn - U - kh * W * Math.sin(beta)) * Math.tan(phi);
  var drv = Wt + kh * W * Math.cos(beta);
  var FS = res / Math.max(1e-3, drv);
  this.slide.FS = FS;
  // 临界加速度（Newmark）
  var ky = Math.max(0, (FS - 1)) * Math.sin(beta) * 1.0;
  this.slide.ky = ky;
  if (FS < 1) {
    var an = (1 - FS) * BR.G * Math.sin(beta);
    this.slide.v += an * dt; this.slide.u += this.slide.v * dt;
    this.slide.active = 1;
  } else if (this.slide.v > 0) {
    var ad = (FS - 1) * BR.G * Math.sin(beta);
    this.slide.v = Math.max(0, this.slide.v - ad * dt);
    this.slide.u += this.slide.v * dt;
  } else if (kh > ky && ky >= 0) {
    var an2 = (kh - ky) * BR.G;
    this.slide.v += an2 * dt; this.slide.u += this.slide.v * dt;
    this.slide.active = 1;
  }
};
/** 崖脚淘蚀：由波浪能量累积 */
BR.Env.prototype.updateToeErosion = function (dt) {
  var S = this.sc.slope;
  if (!S || !S.toeErodible) return;
  var Hs = this.wave.Hs, wl = this.waterLevel + this.surge + this.floodRise;
  if (Hs < 0.2) return;
  var P = this.rhoW * BR.G * BR.G * Hs * Hs * this.wave.Tp / (64 * Math.PI) / 1000;  // kW/m
  var rate = S.erodeK * P * dt / 86400;      // m/天 → m
  this.slide.toeCut = Math.min(0.95, this.slide.toeCut + rate);
};

/* ============================ 冻土 ============================ */
BR.Env.prototype.updateFrost = function (dtYears) {
  var P = this.sc.permafrost;
  if (!P) return;
  var F = this.frost;
  F.years += dtYears;
  var warm = P.warmRate * F.years;                        // ℃
  // Stefan 解：Za = sqrt(2·k·It/L)  → 用融化指数正比关系简化
  var It = P.thawIndex * (1 + warm / Math.max(0.5, P.thawIndex / 300));
  F.activeLayer = P.Za0 * Math.sqrt(Math.max(0.2, It / P.thawIndex));
  var dZ = Math.max(0, F.activeLayer - P.Za0);
  F.thaw = dZ * P.excessIce;                              // 融沉（永久）
  var season = Math.sin(2 * Math.PI * (F.years % 1));
  F.heave = P.heaveRatio * F.activeLayer * Math.max(0, -season);   // 冬季冻胀
  F.jack = P.tauFrost * Math.PI * (P.anchorD || 1.5) * F.activeLayer * Math.max(0, -season);  // 冻拔力 N
};

/* ============================ 冲击类灾害 ============================ */
BR.Env.prototype.impulse = function (o) {
  // o: {node|nodes, F:[fx,fy,fz], dur, t0, name}
  this.impulses.push(Object.assign({ t0: this.t, dur: 0.8, done: 0 }, o));
};
BR.Env.prototype.shipImpact = function (world, node, DWT, V) {
  var P = BR.CRIT.shipImpact(DWT, V);
  var dur = BR.clamp(0.25 + 0.0000025 * DWT, 0.3, 2.2);
  this.impulse({ nodes: [node], F: [0, 0, P], dur: dur, name: '船撞 ' + (DWT / 1000).toFixed(0) + 'kDWT@' + V.toFixed(1) + 'm/s → P=' + (P / 1e6).toFixed(1) + ' MN' });
  return { P: P, dur: dur };
};
BR.Env.prototype.iceImpact = function (world, node, b, h, sigc) {
  var F = BR.CRIT.iceForce(b, h, sigc);
  this.impulse({ nodes: [node], F: [0, 0, F], dur: 0.5, name: '浮冰挤压 F=' + (F / 1e6).toFixed(2) + ' MN' });
  return F;
};

/* ============================ 主更新 ============================ */
/** 每帧：更新环境状态，并把「慢变」外载写入 world.fext */
BR.Env.prototype.prepFrame = function (world, dtSim) {
  var i, n = world.N;
  this.t = world.t;
  var fe = world.fext;
  for (i = 0; i < 3 * n; i++) fe[i] = 0;

  // --- 冲刷 ---
  if (Math.abs(this.currentNow(this.t)) > 0.05) this.updateScour(dtSim * (this.timeAccel || 1));
  // --- 崖脚淘蚀 & 斜坡 ---
  this.updateToeErosion(dtSim * (this.timeAccel || 1));
  var kh = 0;
  if (this.quake && this.quake.active) {
    var idx = Math.floor((this.t - this.quake.t0) / this.quake.dt);
    if (idx >= 0 && idx < this.quake.n) kh = Math.abs(this.quake.ag[0][idx]) / BR.G * 0.65;
    else if (idx >= this.quake.n) this.quake.active = false;
  }
  this.updateSlope(dtSim, kh);
  // --- 液化 ---
  if (this.quake && this.quake.active) {
    var id2 = Math.floor((this.t - this.quake.t0) / this.quake.dt);
    var amax = (id2 >= 0 && id2 < this.quake.n) ? Math.abs(this.quake.ag[0][id2]) : 0;
    this.updateLiquefaction(dtSim, Math.max(amax, 0.05 * BR.G));
  }

  // --- 地基弹簧的地面运动（地震 + 滑坡 + 冻胀融沉 + 液化沉降/侧移 + 冲刷退化）---
  for (i = 0; i < world.soil.length; i++) {
    var S = world.soil[i];
    var gx = 0, gy = 0, gz = 0;
    if (this.quake) {
      var lag = (world.x[S.node] || 0) / this.quake.apparentV;   // 行波效应
      var k2 = Math.floor((this.t - this.quake.t0 - lag) / this.quake.dt);
      if (k2 >= 0 && k2 < this.quake.n) {
        gx = this.quake.ug[0][k2]; gy = this.quake.ug[1][k2]; gz = this.quake.ug[2][k2];
      }
    }
    if (this.sc.slideZone) {
      var w = this.sc.slideZone(world.X0[S.node], world.Z0[S.node]);
      if (w > 0) { gx += this.slide.u * w * Math.cos(BR.rad(this.sc.slope ? this.sc.slope.beta : 30)); gy -= this.slide.u * w * Math.sin(BR.rad(this.sc.slope ? this.sc.slope.beta : 30)); }
    }
    if (this.sc.permafrost && S.frostSens) {
      gy += this.frost.heave - this.frost.thaw;
    }
    if (this.sc.liq && this.sc.liq.enable && S.liqSens) {
      gy -= this.liqSettle; gz += this.spread * (S.spreadDir || 1);
      S.ru = this.ru * (S.liqSens || 1);
    }
    S.gx = gx; S.gy = gy; S.gz = gz;
    // 冲刷造成的埋深损失 → 弹簧失效
    if (S.scourRef !== undefined && this.scour[S.scourRef]) {
      var ys = this.scour[S.scourRef].ys;
      S.alive = (S.depth > ys) ? 1 : 0;
      if (!S.alive && !S.reported) { S.reported = 1; world.log.add(this.t, 1, 'SCOUR', '桩侧土弹簧失效：冲刷深度 ' + ys.toFixed(2) + ' m > 该层埋深 ' + S.depth.toFixed(2) + ' m'); }
    }
    // 冻拔（上拔力直接加载）
    if (this.sc.permafrost && S.frostSens && this.frost.jack > 0) {
      fe[3 * S.node + 1] += this.frost.jack * (S.jackShare || 0.0);
    }
  }

  // --- 水动力（Morison + 浮力已在 solver 中）---
  var anyWater = this.sc.water.depth > 0 || this.floodRise > 0;
  if (anyWater) {
    for (i = 0; i < world.hydroNodes.length; i++) {
      var H = world.hydroNodes[i];
      var nd = H.n, yy = world.y[nd];
      var wl = this.waterY(world.x[nd], world.z[nd], this.t);
      if (yy > wl) continue;
      var kin = this.waterKin(world.x[nd], yy, world.z[nd], this.t);
      var urz = kin.uz - world.vz[nd], ury = kin.uy - world.vy[nd];
      var D = H.D, L = H.L, Cd = H.Cd || 1.0, Cm = H.Cm || 2.0;
      var sub = BR.clamp((wl - (yy - L / 2)) / L, 0, 1);
      var Ad = D * L * sub, Vv = Math.PI * D * D / 4 * L * sub;
      var Fz = 0.5 * this.rhoW * Cd * Ad * Math.abs(urz) * urz + this.rhoW * Cm * Vv * kin.az;
      var Fy = 0.5 * this.rhoW * Cd * Ad * Math.abs(ury) * ury * 0.5;
      // 浮力
      var Fb = this.rhoW * BR.G * Vv * (H.buoy === undefined ? 1 : H.buoy);
      fe[3 * nd + 2] += Fz; fe[3 * nd + 1] += Fy + Fb;
      H.F = Fz;
    }
  }

  // --- 冲击事件 ---
  for (i = this.impulses.length - 1; i >= 0; i--) {
    var P = this.impulses[i];
    var tt = this.t - P.t0;
    if (tt < 0) continue;
    if (tt > P.dur) { this.impulses.splice(i, 1); continue; }
    var sh = Math.sin(Math.PI * tt / P.dur);
    var nn = P.nodes.length;
    for (var j = 0; j < nn; j++) {
      fe[3 * P.nodes[j]] += P.F[0] * sh / nn;
      fe[3 * P.nodes[j] + 1] += P.F[1] * sh / nn;
      fe[3 * P.nodes[j] + 2] += P.F[2] * sh / nn;
    }
  }

  // --- 海啸 ---
  if (this.tsunami) this.tsunami.apply(world, this, fe);
  // --- 泥石流 ---
  if (this.debrisFlow) this.debrisFlow.apply(world, this, fe);

  // --- 车流 ---
  if (world.traffic) world.traffic.apply(world, this, fe, dtSim);

  // --- 风：湍流采样缓存（每帧一次）---
  this.windCache = [];
  for (i = 0; i < world.deckStations.length; i++) {
    var st = world.deckStations[i];
    var W = this.wind.at(st.x, world.y[st.nA], this.t);
    this.windCache.push(W);
  }
  // 塔/索/桥墩节点风（准定常阻力，每帧）
  for (i = 0; i < world.windNodes.length; i++) {
    var WN = world.windNodes[i];
    var wy = world.y[WN.n];
    if (this.sc.water.depth > 0 && wy < this.waterY(world.x[WN.n], world.z[WN.n], this.t)) continue;
    var Wv = this.wind.at(world.x[WN.n], wy, this.t);
    var Urel = Wv.U * this.windLoadScale - world.vz[WN.n];
    var q = 0.5 * this.rhoA * Urel * Math.abs(Urel);
    fe[3 * WN.n + 2] += q * WN.A * WN.Cd;
    fe[3 * WN.n + 1] += 0.5 * this.rhoA * Wv.w * Math.abs(Wv.w) * WN.A * 0.4;
  }
};

/** 每子步：桥面准定常气动力（升力/阻力/扭矩 + 涡振尾流振子） */
BR.Env.prototype.perSubstep = function (world, dt) {
  var sts = world.deckStations;
  if (!sts.length || !this.windCache) return;
  var rho = this.rhoA, sc = this.windLoadScale;
  for (var i = 0; i < sts.length; i++) {
    var st = sts[i];
    var a = st.nA, b = st.nB;   // A=上风侧, B=下风侧
    var W = this.windCache[i];
    if (!W) continue;
    var U = (W.Um + W.u) * sc;
    if (U < 0.2) continue;
    var B = st.B, h = st.h, Lt = st.L, A = st.aero;
    // 结构运动
    var vyA = world.vy[a], vyB = world.vy[b];
    var vy = 0.5 * (vyA + vyB);
    var alpha = Math.atan2(world.y[a] - world.y[b], B) + (st.alpha0 || 0);
    var adot = (vyA - vyB) / B;
    // 有效攻角（准定常，含 α̇ 气动力臂）
    var ae = alpha + (W.w * sc - vy) / U + A.ra * B * adot / U;
    var aeM = alpha + (W.w * sc - vy) / U + A.rm * B * adot / U;
    var q = 0.5 * rho * U * U;
    var Lift = q * B * (A.CL0 + A.CL1 * ae) * Lt;
    var Drag = q * h * A.CD * Lt;
    var Mom = q * B * B * (A.CM0 + A.CM1 * aeM) * Lt;
    // 涡振（van der Pol 尾流振子）
    if (st.viv) {
      var ws = 2 * Math.PI * A.St * U / h;
      var vv = st.viv;
      var qq = vv.q, qd = vv.qd;
      var acc = (world.fy[a] + world.fy[b]) / Math.max(1e-6, world.m[a] + world.m[b]);
      var qdd = -0.3 * ws * (qq * qq - 1) * qd - ws * ws * qq + 12 * acc / h;
      vv.qd += qdd * dt; vv.q += vv.qd * dt;
      if (Math.abs(vv.q) > 8) { vv.q *= 0.9; vv.qd *= 0.9; }
      Lift += q * h * 0.32 * vv.q * Lt;
    }
    // 分配到两侧弦杆（力偶等效扭矩）
    var fA = 0.5 * Lift + Mom / B, fB = 0.5 * Lift - Mom / B;
    world.fy[a] += fA; world.fy[b] += fB;
    world.fz[a] += 0.5 * Drag; world.fz[b] += 0.5 * Drag;
    st.Lift = Lift; st.Mom = Mom; st.alpha = alpha; st.U = U;
  }
};

/* ============================ 海啸 / 泥石流 ============================ */
BR.Tsunami = function (o) {
  this.h = o.h || 8; this.u = o.u || 8; this.t0 = o.t0 || 0; this.dur = o.dur || 60;
  this.front = o.front || -400; this.c = Math.sqrt(BR.G * (o.depth || 20));
};
BR.Tsunami.prototype.eta = function (x, z, t) {
  var tt = t - this.t0; if (tt < 0) return 0;
  var pos = this.front + this.c * tt;
  var d = z - pos;
  if (d > 0) return 0;
  return this.h * BR.smoothstep(-60, 0, d) * Math.exp(-Math.max(0, -d) / 800);
};
BR.Tsunami.prototype.apply = function (world, env, fe) {
  var tt = env.t - this.t0; if (tt < 0 || tt > this.dur) return;
  var pos = this.front + this.c * tt;
  var wl0 = env.waterLevel;
  for (var i = 0; i < world.hydroNodes.length; i++) {
    var H = world.hydroNodes[i], nd = H.n;
    if (world.z[nd] > pos) continue;
    var hh = this.h;
    var top = wl0 + hh;
    if (world.y[nd] > top) continue;
    var Ad = H.D * H.L;
    var Fd = 0.5 * env.rhoW * 2.0 * Ad * this.u * this.u;
    fe[3 * nd + 2] += Fd;
  }
  // 桥面上举与漂浮（越浪）
  for (var s = 0; s < world.deckStations.length; s++) {
    var st = world.deckStations[s];
    var y = world.y[st.nA];
    if (y < wl0 + this.h && world.z[st.nA] <= pos + 1e9) {
      var sub = BR.clamp((wl0 + this.h - y) / Math.max(0.5, st.h), 0, 1);
      var Fu = env.rhoW * BR.G * st.B * st.h * st.L * sub * 0.55;   // 浮托（含气室封闭效应折减）
      var Fdz = 0.5 * env.rhoW * 2.2 * st.h * st.L * this.u * this.u;
      fe[3 * st.nA + 1] += Fu * 0.5; fe[3 * st.nB + 1] += Fu * 0.5;
      fe[3 * st.nA + 2] += Fdz * 0.5; fe[3 * st.nB + 2] += Fdz * 0.5;
    }
  }
};

BR.DebrisFlow = function (o) {
  this.rho = o.rho || 2000; this.v = o.v || 9; this.h = o.h || 4;
  this.t0 = o.t0 || 0; this.dur = o.dur || 20; this.target = o.target || [];
  this.lam = o.lam || 1.33; this.boulder = o.boulder || 0;

BR.DebrisFlow.prototype.apply = function (world, env, fe) {
  var tt = env.t - this.t0; if (tt < 0 || tt > this.dur) return;
  var pulse = 0.6 + 0.4 * Math.sin(tt * 3.1) * Math.sin(tt * 0.7);
  for (var i = 0; i < this.target.length; i++) {

    if (this.boulder > 0 && Math.abs(Math.sin(tt * 2.3)) > 0.985) F += this.boulder;

  }
};

/* ============================ 车流 ============================ */
BR.Traffic = function (o) {
  o = o || {};
  this.veh = [];
  this.aadt = o.aadt || 40000; this.truckPct = o.truckPct || 0.22;
  this.speed = o.speed || 22;         // m/s
  this.lanes = o.lanes || 4;
  this.overload = 1;
  this.jam = 0;
  this.enabled = true;
  this.roughClass = o.rough || 3e-6;  // ISO 8608 Gd(n0)：B/C 级
  this.rng = BR.rng(o.seed || 77);
  this.spawnAcc = 0;
  this.marching = 0;
  this.maxVeh = o.maxVeh || 90;
  this.stat = { count: 0, maxDAF: 1, totalAxleLoad: 0 };
};
BR.Traffic.prototype.spawn = function (world, env) {
  var isTruck = this.rng() < this.truckPct;
  var lane = Math.floor(this.rng() * this.lanes);
  var half = (this.lanes - 1) / 2;
  var zoff = (lane - half) * 3.75;
  var dir = lane < this.lanes / 2 ? 1 : -1;
  var m = isTruck ? (18000 + this.rng() * 37000) : (1300 + this.rng() * 900);
  if (this.lightOnly) m = 900 + this.rng() * 1400;      // 人行/轻车桥：仅小型车
  m *= this.overload;
  var L = isTruck ? 14 : 4.6;
  var v0 = this.speed * (0.85 + 0.3 * this.rng()) * (this.jam ? 0.25 : 1);
  var span = world.deckSpanX;
  this.veh.push({
    s: dir > 0 ? span[0] - L : span[1] + L, z: zoff, dir: dir, m: m, L: L, truck: isTruck,
    v: v0, us: 0, vs: 0, ks: m * 9.81 / 0.10, cs: 2 * 0.25 * Math.sqrt(m * (m * 9.81 / 0.10)),
    W: isTruck ? 2.6 : 1.85, rough: 0, F: m * 9.81, Fst: m * 9.81, daf: 1
  });
  this.stat.count++;
};
BR.Traffic.prototype.apply = function (world, env, fe, dt) {
  if (!world.deckStations.length) return;
  var span = world.deckSpanX, i, j;
  if (this.enabled) {
    var rate = this.aadt / 86400 * (this.jam ? 3.5 : 1);
    this.spawnAcc += rate * dt;
    while (this.spawnAcc > 1 && this.veh.length < this.maxVeh) { this.spawnAcc -= 1; this.spawn(world, env); }
  }
  var sts = world.deckStations, ns = sts.length;
  var x0 = sts[0].x, x1 = sts[ns - 1].x, dx = (x1 - x0) / (ns - 1);
  for (i = this.veh.length - 1; i >= 0; i--) {
    var V = this.veh[i];
    V.s += V.v * V.dir * dt;
    if (V.s < span[0] - 30 || V.s > span[1] + 30) { this.veh.splice(i, 1); continue; }
    var fi = (V.s - x0) / dx;
    if (fi < 0 || fi > ns - 1) continue;
    var i0 = Math.floor(fi), fr = fi - i0, i1 = Math.min(ns - 1, i0 + 1);
    var sA = sts[i0], sB = sts[i1];
    // 桥面高程与速度（横向按车道插值）
    var wz = BR.clamp(0.5 + V.z / Math.max(1e-3, sA.B), 0, 1);
    var yA = world.y[sA.nA] * (1 - wz) + world.y[sA.nB] * wz;
    var yB = world.y[sB.nA] * (1 - wz) + world.y[sB.nB] * wz;
    var vyA = world.vy[sA.nA] * (1 - wz) + world.vy[sA.nB] * wz;
    var vyB = world.vy[sB.nA] * (1 - wz) + world.vy[sB.nB] * wz;
    var yd = yA * (1 - fr) + yB * fr, vd = vyA * (1 - fr) + vyB * fr;
    // 路面不平度（一次滤波随机）
    V.rough += (this.rng() - 0.5) * 2 * Math.sqrt(this.roughClass * V.v) * 30 * dt;
    V.rough *= 0.985;
    var ydr = yd + V.rough;
    // 悬架 1-DOF
    var acc = (-V.ks * (V.us - ydr) - V.cs * (V.vs - vd)) / V.m;
    V.vs += acc * dt; V.us += V.vs * dt;
    var Fdyn = -V.ks * (V.us - ydr) - V.cs * (V.vs - vd);
    var F = V.m * 9.81 - Fdyn;
    if (F < 0) F = 0;                 // 跳离桥面
    V.F = F; V.daf = F / Math.max(1, V.Fst);
    if (V.daf > this.stat.maxDAF) this.stat.maxDAF = V.daf;
    // 分配到 4 个角点
    var wA0 = (1 - fr) * (1 - wz), wB0 = (1 - fr) * wz, wA1 = fr * (1 - wz), wB1 = fr * wz;
    fe[3 * sA.nA + 1] -= F * wA0; fe[3 * sA.nB + 1] -= F * wB0;
    fe[3 * sB.nA + 1] -= F * wA1; fe[3 * sB.nB + 1] -= F * wB1;
    V.y = yd;
  }
  // 行人/军队同步步行共振（可选激励）
  if (this.marching > 0) {
    var fw = 2.0, amp = this.marching;
    for (j = 0; j < sts.length; j++) {
      var f = amp * Math.sin(2 * Math.PI * fw * env.t) * sts[j].L;
      fe[3 * sts[j].nA + 1] -= f * 0.5; fe[3 * sts[j].nB + 1] -= f * 0.5;
    }
  }
};
