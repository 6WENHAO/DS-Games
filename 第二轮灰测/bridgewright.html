/* ===== 60-bridges.js ===== */
/* =============================================================================
 * 桥匠 BRIDGEWRIGHT · 60-bridges.js
 * 六类桥型参数化模板：几何生成 + 实配设计计算 + 材料用量 + 造价 + 破坏模式
 * 结构理想化：四弦空间桁架（等效箱梁）/ 真实桁架 / 链式拱肋+塑性铰 / 索单元
 * ========================================================================== */
'use strict';
var BR = (typeof BR !== 'undefined') ? BR : {};

BR.GEO = {};

/* ---------- 等效箱梁截面（由桥宽/梁高/单位面积用钢量反算） ----------
 * 约束：回转半径 r=√(I/A) 必须 ≤ H/2（材料不可能超出截面外缘），取 k=0.72 即
 *       Iy = 0.72·A·(H/2)²，对应 r=0.85·(H/2)，是翼缘集中型钢箱梁的现实上限。*/
BR.GEO.boxSection = function (B, H, kgm2, mat) {
  var rho = BR.MAT[mat].rho;
  var A = B * kgm2 / rho;                       // 钢截面面积 m²
  var Iy = 0.72 * A * (H / 2) * (H / 2);
  var Iz = 0.085 * A * B * B;
  var Wy = Iy / (H / 2), Wz = Iz / (B / 2);
  var J = 0.55 * Iy * Math.pow(B / H, 1.1);     // 闭口箱梁 4A²/∮(ds/t) 的量级近似
  return { A: A, Iy: Iy, Iz: Iz, J: J, Wy: Wy, Wz: Wz, H: H, B: B, steelPerM: A * rho, mat: mat };
};

/** 杆件截面惯矩的现实取值：由面积反推箱型/H 型构件的高度与惯矩
 *  d ≈ 2.2√A（限 0.35~2.2 m），I ≈ 0.40·A·(d/2)²  → 回转半径 r≈0.32d
 *  这是压杆稳定判定的关键输入：若 I 取得过小，弦杆会在远低于屈服的荷载下"数值屈曲"。*/
BR.GEO.memberI = function (A) {
  var d = BR.clamp(2.2 * Math.sqrt(Math.max(1e-6, A)), 0.35, 2.2);
  return 0.40 * A * d * d / 4;
};

/* ---------- 四弦空间桁架桥面（等效箱梁 / 真实桁架共用） ----------
 * o: {x0,x1,nseg,yFn,B,H,mat,aero,sec,fyScale,pave(kg/m),build(t0,t1),
 *     order:'center'|'edge'|'cantilever', hangEvery, name}
 * 返回 {stations:[{x,nA,nB,nAb,nBb}], nodes, chordTop:[], ...}                */
BR.GEO.deck = function (w, o) {
  var i, sts = [], dx = (o.x1 - o.x0) / o.nseg;
  var sec = o.sec, mat = o.mat, B = o.B, H = o.H;
  var Ac = Math.max(0.02, sec.Iy / (H * H));          // 单弦等效面积（竖弯刚度等效）
  var Nc_yield = 1.05 * sec.Wy * BR.MAT[mat].fy / (2 * H);
  var fyScale = Math.max(0.05, Nc_yield / (Ac * BR.MAT[mat].fy));
  if (o.realTruss) { Ac = o.Ac; fyScale = 1; }
  var Acr = Math.max(0.012, sec.Iz / (B * B) * 1.0);  // 横弯由弦杆间距提供
  var Ax = o.realTruss ? Ac : Math.max(Ac, Acr);
  var Ibr = BR.GEO.memberI(Ax);
  var mExtra = (o.pave || 0) * dx / 4;                 // 二期恒载分配到 4 个弦
  var tl = [], tr = [], bl = [], br = [];
  var bo = function (t) { return o.build ? o.build(t) : 0; };
  var e0 = w.eA.length;
  var EI_loc = BR.MAT[mat].E * Ibr;
  for (i = 0; i <= o.nseg; i++) {
    var x = o.x0 + i * dx, y = o.yFn(x), t = i / o.nseg;
    tl.push(w.node(x, y, -B / 2, 'deckT', { m: mExtra, r: 0.6, grp: 1 }));
    tr.push(w.node(x, y, B / 2, 'deckT', { m: mExtra, r: 0.6, grp: 1 }));
    bl.push(w.node(x, y - H, -B / 2 * 0.72, 'deckB', { m: mExtra, r: 0.6, grp: 1 }));
    br.push(w.node(x, y - H, B / 2 * 0.72, 'deckB', { m: mExtra, r: 0.6, grp: 1 }));
  }
  for (i = 0; i < o.nseg; i++) {
    var t2 = (i + 0.5) / o.nseg, b2 = bo(t2);
    var ep = { I: Ibr, build: b2, fyScale: fyScale, detail: 'D100', name: o.name + '弦杆', grad: 0 };
    w.elem(tl[i], tl[i + 1], mat, Ax, BR.ET.BAR, Object.assign({}, ep, { grad: 1 }));
    w.elem(tr[i], tr[i + 1], mat, Ax, BR.ET.BAR, Object.assign({}, ep, { grad: 1 }));
    w.elem(bl[i], bl[i + 1], mat, Ax, BR.ET.BAR, ep);
    w.elem(br[i], br[i + 1], mat, Ax, BR.ET.BAR, ep);
    // 腹杆（竖平面斜撑）+ 平面支撑
    // 腹杆按剪力需求实配（而非弦杆面积的固定比例）：
    // V ≈ 0.65·(g+q)·L_shear/2，两个竖平面分担，斜腹杆轴力 = V/(2 sinθ)
    // L_shear 为该桥面实际支承间距（吊索/斜拉索间距、桁架跨径、立柱间距…）
    var Lsh = o.shearSpan || (dx * 2);
    var qtot = ((o.pave || 0) + sec.steelPerM) * 9.80665 + (o.qLive || 0);
    var sinTd = H / Math.hypot(dx, H);
    var Vmax = 0.65 * qtot * Lsh / 2;
    var AdReq = Vmax / (2 * Math.max(0.25, sinTd)) / (0.45 * BR.MAT[mat].fy);
    var Ad = Math.max(Ax * 0.32, AdReq, 0.012), Ap2 = Math.max(Ax * 0.30, AdReq * 0.5, 0.010);
    var ad = { I: BR.GEO.memberI(Ad), build: b2, detail: 'D71', name: o.name + '腹杆' };
    w.elem(tl[i], bl[i + 1], mat, Ad, BR.ET.BAR, ad);
    w.elem(tr[i], br[i + 1], mat, Ad, BR.ET.BAR, ad);
    w.elem(bl[i], tl[i + 1], mat, Ad, BR.ET.BAR, ad);
    w.elem(br[i], tr[i + 1], mat, Ad, BR.ET.BAR, ad);
    var apl = { I: BR.GEO.memberI(Ap2), build: b2, detail: 'D71', name: o.name + '平联' };
    w.elem(tl[i], tr[i + 1], mat, Ap2, BR.ET.BAR, apl);
    w.elem(tr[i], tl[i + 1], mat, Ap2, BR.ET.BAR, apl);
    w.elem(bl[i], br[i + 1], mat, Ap2, BR.ET.BAR, apl);
  }
  for (i = 0; i <= o.nseg; i++) {
    var t3 = i / o.nseg, b3 = bo(t3);
    // 横向斜撑（A4）决定箱梁/桁架的等效抗扭刚度 → 直接决定扭弯频率比与颤振风速
    var flo = function (a) { return Math.max(a, 0.012); };   // 次构件面积下限（避免出现不现实的细杆）
    var A1 = flo(Math.max(Ax * 0.50, AdReq * 0.8)), A2 = flo(Math.max(Ax * 0.40, AdReq * 0.6)),
      A3 = flo(Math.max(Ax * 0.60, AdReq * 0.9)), A4 = flo(Math.max(Ax * 0.40, AdReq * 0.5));
    w.elem(tl[i], tr[i], mat, A1, BR.ET.BAR, { I: BR.GEO.memberI(A1), build: b3, detail: 'D80', name: o.name + '横梁' });
    w.elem(bl[i], br[i], mat, A2, BR.ET.BAR, { I: BR.GEO.memberI(A2), build: b3, detail: 'D80', name: o.name + '横梁' });
    w.elem(tl[i], bl[i], mat, A3, BR.ET.BAR, { I: BR.GEO.memberI(A3), build: b3, detail: 'D80', name: o.name + '竖杆' });
    w.elem(tr[i], br[i], mat, A3, BR.ET.BAR, { I: BR.GEO.memberI(A3), build: b3, detail: 'D80', name: o.name + '竖杆' });
    w.elem(tl[i], br[i], mat, A4, BR.ET.BAR, { I: BR.GEO.memberI(A4), build: b3, detail: 'D80', name: o.name + '横向斜撑' });
    w.elem(tr[i], bl[i], mat, A4, BR.ET.BAR, { I: BR.GEO.memberI(A4), build: b3, detail: 'D80', name: o.name + '横向斜撑' });
  }
  // ---- 质量标定：等效桁架的杆件体积 ≠ 真实截面钢量 ----
  // 刚度由等效面积保证，质量/惯性由折算密度保证（两者独立标定），并使造价工程量取真实钢量
  var e1 = w.eA.length, Vm = 0, ee;
  for (ee = e0; ee < e1; ee++) Vm += w.eArea[ee] * w.eL0[ee];
  var targetMass = (o.massPerM !== undefined ? o.massPerM : sec.steelPerM) * (o.x1 - o.x0);
  var rs = (targetMass > 0 && Vm > 0) ? targetMass / (BR.MAT[mat].rho * Vm) : 1;
  for (ee = e0; ee < e1; ee++) w.eRhoS[ee] = rs;
  // 弦杆弯曲铰（局部刚度，防零能模态；全局竖弯由桁架轴力承担）
  for (i = 1; i < o.nseg; i++) {
    var b4 = bo(i / o.nseg);
    w.hinge(tl[i - 1], tl[i], tl[i + 1], EI_loc, { build: b4 });
    w.hinge(tr[i - 1], tr[i], tr[i + 1], EI_loc, { build: b4 });
    w.hinge(bl[i - 1], bl[i], bl[i + 1], EI_loc, { build: b4 });
    w.hinge(br[i - 1], br[i], br[i + 1], EI_loc, { build: b4 });
  }
  for (i = 0; i <= o.nseg; i++) {
    var xx = o.x0 + i * dx;
    var Lt = (i === 0 || i === o.nseg) ? dx / 2 : dx;
    sts.push({
      x: xx, nA: tl[i], nB: tr[i], nAb: bl[i], nBb: br[i], L: Lt, B: B, h: H + 1.2,
      aero: o.aero, viv: { q: 0.01, qd: 0 }, alpha0: 0, i: i
    });
  }
    return { st: sts, tl: tl, tr: tr, bl: bl, br: br, Ac: Ax, fyScale: fyScale, dx: dx, sec: sec, rhoScale: rs };
};

/* ---------- 桩基础（4 根等效桩代表 n 根实际桩） ---------- */
BR.GEO.found = function (w, o) {
  var sc = o.sc, i, j;
  var capB = o.capB, capL = o.capL, capH = o.capH || 5;
  var yc = o.yCap, x = o.x, z = o.z || 0;
  var scourRef = o.scourRef;
  if (o.hydro && scourRef === undefined) {
    scourRef = w.scourSites.length;
    w.scourSites.push({ x: x, z: z, D: Math.max(o.D * 2, capB * 0.6), y1: Math.max(1, sc.water.level - sc.ground(x, z)) });
  }
  var top = [], bot = [];
  var cm = 'RIGID';
  var capA = 18;                          // 近刚性连接（RIGID 材料，质量另计）
  var capVol = capB * capL * capH;         // 真实承台混凝土体积
  var capM = capVol * 2400;                // 真实承台质量（按节点集中）
  var sx = [-1, 1, 1, -1], sz = [-1, -1, 1, 1];
  for (i = 0; i < 4; i++) {
    top.push(w.node(x + sx[i] * capL / 2, yc, z + sz[i] * capB / 2, 'cap', { r: 1.2, m: capM / 8 }));
    bot.push(w.node(x + sx[i] * capL / 2, yc - capH, z + sz[i] * capB / 2, 'cap', { r: 1.2, m: capM / 8 }));
  }
  var ce = { I: capA * capA, build: o.build || 0, name: '承台' };
  for (i = 0; i < 4; i++) {
    var k = (i + 1) % 4;
    w.elem(top[i], top[k], cm, capA, BR.ET.BAR, ce);
    w.elem(bot[i], bot[k], cm, capA, BR.ET.BAR, ce);
    w.elem(top[i], bot[i], cm, capA, BR.ET.BAR, ce);
    w.elem(top[i], bot[k], cm, capA * 0.5, BR.ET.BAR, ce);
  }
  w.elem(top[0], top[2], cm, capA * 0.6, BR.ET.BAR, ce);
  w.elem(top[1], top[3], cm, capA * 0.6, BR.ET.BAR, ce);
  w.elem(bot[0], bot[2], cm, capA * 0.6, BR.ET.BAR, ce);
  w.capVol = (w.capVol || 0) + capVol;
  // ---- 桩 ----
  var D = o.D, Lp = o.Lp, nreal = o.nPile, nseg = Math.max(3, Math.round(Lp / 9));
  var Ap = Math.PI * D * D / 4, Ip = Math.PI * Math.pow(D, 4) / 64;
  var groupFac = nreal / 4;                // 每根等效桩代表 nreal/4 根实桩
  var piles = [];
  var gy0 = sc.ground(x, z);
  for (i = 0; i < 4; i++) {
    var chain = [bot[i]];
    for (j = 1; j <= nseg; j++) {
      var yy = yc - capH - Lp * j / nseg;
      var nd = w.node(x + sx[i] * capL / 2, yy, z + sz[i] * capB / 2, 'pile', { r: 1.0 });
      chain.push(nd);
      w.elem(chain[j - 1], nd, 'C30', Ap * groupFac, BR.ET.BAR, {
        I: Ip * groupFac, build: o.build || 0, name: '钻孔桩', cc: 'pile', K: 0.7
      });
      if (j >= 2) w.hinge(chain[j - 2], chain[j - 1], chain[j], 3.0e10 * Ip * groupFac * 0.6, {
        build: o.build || 0, Mp: 0.32 * Ap * groupFac * D * 12e6, Nu: Ap * groupFac * 20e6, kind: 1, thu: 0.03, ref: -1
      });
      // 土弹簧
      var depth = gy0 - yy;
      if (depth > 0) {
        var lay = BR.GEO.layerAt(sc, depth), trib = Lp / nseg;
        var Es = 2.6 * lay.gamma / 9.81 * lay.vs * lay.vs;
        var kh = Math.max(1e6, 1.0 * Es * trib) * groupFac;
        var pu = (lay.c > 5e3 ? 9 * (lay.su || lay.c) * D : 3 * Math.pow(Math.tan(BR.rad(45 + lay.phi / 2)), 2) * lay.gamma * depth * D);
        var Ph = Math.max(5e4, pu * trib) * groupFac;
        var Qv = lay.qs * Math.PI * D * trib * groupFac;
        if (j === nseg) Qv += lay.qb * Ap * groupFac;
        var kv = Qv / (0.006 * D);
        w.soilSpring({
          node: nd, depth: depth, D: D, kv: kv, kh: kh, Qv: Qv, Ph: Ph, Qup: 0.65 * Qv,
          layer: lay.idx, scourRef: scourRef, liqSens: lay.liq ? 1 : 0, frostSens: lay.frost ? 1 : 0,
          spreadDir: o.spreadDir || 1, jackShare: lay.frost ? 0.25 : 0
        });
      }
      // 水动力
      if (o.hydro && yy < sc.water.level) w.hydroNodes.push({ n: nd, D: D * 1.4, L: Lp / nseg, Cd: 1.1, Cm: 2.0, buoy: 0 });
    }
    piles.push(chain);
  }
  return { top: top, bot: bot, piles: piles, capA: capA, nPile: nreal, D: D, Lp: Lp, nseg: nseg };
};

BR.GEO.layerAt = function (sc, depth) {
  var acc = 0;
  for (var i = 0; i < sc.soil.length; i++) {
    acc += sc.soil[i].h;
    if (depth <= acc || i === sc.soil.length - 1) { var L = sc.soil[i]; L.idx = i; return L; }
  }
  return sc.soil[sc.soil.length - 1];
};

/** 在承台形心正上方建墩底节点，并与承台顶/底 8 个节点刚性相连
 *  （必须连到不共面的节点，否则该节点竖向/转动约束缺失） */
BR.GEO.capBase = function (w, f, x, y, z, build, tag) {
  var nb = w.node(x, y, z || 0, tag || 'pier', { r: 1.5 });
  for (var i = 0; i < 4; i++) {
    w.elem(nb, f.top[i], 'RIGID', 5.0, BR.ET.BAR, { I: 3.0, build: build || 0, name: '墩座' });
    w.elem(nb, f.bot[i], 'RIGID', 5.0, BR.ET.BAR, { I: 3.0, build: build || 0, name: '墩座' });
  }
  return nb;
};

/* ---------- 桥墩（空心矩形 RC 墩，含塑性铰） ---------- */
BR.GEO.pier = function (w, o) {
  var sc = o.sc, Hp = Math.max(0.5, o.yTop - o.yBase);
  // 单元长度下限 2.5 m：过短的单元会把临界步长压到不可用的量级
  var nseg = Math.max(1, Math.min(Math.round(Hp / 9), Math.floor(Hp / 2.5)));
  var bx = o.bx, bz = o.bz, tw = o.tw || 0.7;
  var A = bx * bz - (bx - 2 * tw) * (bz - 2 * tw);
  var I = (bx * Math.pow(bz, 3) - (bx - 2 * tw) * Math.pow(bz - 2 * tw, 3)) / 12;
  var Iz = (bz * Math.pow(bx, 3) - (bz - 2 * tw) * Math.pow(bx - 2 * tw, 3)) / 12;
  var mat = 'C50';
  var fck = BR.MAT.C50.fy;
  var Mp = 0.42 * A * bz * fck * 0.55;   // 含纵筋贡献的塑性弯矩估算
  var Nu = A * fck;
  var ch = [o.nBase], i;
  for (i = 1; i <= nseg; i++) {
    var y = o.yBase + (o.yTop - o.yBase) * i / nseg;
    var nd = w.node(o.x, y, o.z || 0, 'pier', { r: 1.5 });
    ch.push(nd);
    var e = w.elem(ch[i - 1], nd, mat, A, BR.ET.BAR, { I: I, build: o.build || 0, name: '桥墩', K: 1.4 });
    if (i >= 2) w.hinge(ch[i - 2], ch[i - 1], ch[i], BR.MAT.C50.E * I * 0.62, {
      build: o.build || 0, Mp: Mp, Nu: Nu, kind: 1, thu: o.thu || 0.035, ref: e - 1, W: I / (bz / 2)
    });
    if (y < sc.water.level + 3) w.hydroNodes.push({ n: nd, D: bz, L: (o.yTop - o.yBase) / nseg, Cd: 1.5, Cm: 2.0, buoy: 0 });
    else w.windNodes.push({ n: nd, A: bz * (o.yTop - o.yBase) / nseg, Cd: 1.4 });
  }
  return { chain: ch, top: ch[nseg], A: A, I: I, Mp: Mp, Nu: Nu, bx: bx, bz: bz };
};

/* ---------- 桥塔（A 形/门形，钢或混凝土） ---------- */
BR.GEO.tower = function (w, o) {
  var nseg = Math.max(5, Math.round((o.yTop - o.yBase) / 8));
  var mat = o.mat || 'C50', E = BR.MAT[mat].E, fy = BR.MAT[mat].fy;
  var A = o.A, I = o.I, legs = [[], []], i, s;
  var spreadB = o.spreadBase, spreadT = o.spreadTop;
  for (s = 0; s < 2; s++) {
    var sz = s === 0 ? -1 : 1;
    legs[s].push(o.nBase[s]);
    for (i = 1; i <= nseg; i++) {
      var t = i / nseg;
      var y = o.yBase + (o.yTop - o.yBase) * t;
      var zz = (o.z || 0) + sz * (spreadB + (spreadT - spreadB) * t) / 2;
      var Ai = A * (1 - 0.35 * t);
      var nd = w.node(o.x, y, zz, 'tower', { r: 1.6 });
      legs[s].push(nd);
      var e = w.elem(legs[s][i - 1], nd, mat, Ai, BR.ET.BAR, { I: I * (1 - 0.4 * t), build: o.build || 0, name: '塔柱', K: 1.8 });
      if (i >= 2) w.hinge(legs[s][i - 2], legs[s][i - 1], legs[s][i], E * I * (1 - 0.4 * t) * 0.65, {
        build: o.build || 0, Mp: o.Mp * (1 - 0.35 * t), Nu: A * fy, kind: mat === 'C50' ? 1 : 0, thu: 0.03, ref: e - 1
      });
      w.windNodes.push({ n: nd, A: o.bz * (o.yTop - o.yBase) / nseg, Cd: 1.5 });
    }
  }
  // 横撑
  var nx = [];
  for (i = 1; i <= nseg; i++) {
    if (i % Math.max(2, Math.round(nseg / 3)) === 0 || i === nseg) {
      w.elem(legs[0][i], legs[1][i], mat, A * 0.55, BR.ET.BAR, { I: I * 0.4, build: o.build || 0, name: '塔横梁' });
      nx.push(i);
    }
  }
  return { legs: legs, top: [legs[0][nseg], legs[1][nseg]], nseg: nseg, xbeams: nx };
};

/* ---------- 工程量与造价统计 ---------- */
BR.takeoff = function (w, meta, sc) {
  var q = { steel: 0, steel_lt: 0, cable: 0, stay: 0, hanger: 0, moor: 0, conc: 0, cfst: 0,
            glulam: 0, pile_m: 0, hull: 0, rebar: 0, masonry: 0, rock_anchor: 0 };
  var i;
  for (i = 0; i < w.nE; i++) {
    var mk = w.matKeys[w.mid[i]], M = BR.MAT[mk];
    var vol = w.A0[i] * w.L0[i] * (w.rhoS[i] || 1);      // 折算体积（与真实钢量一致）
    var ton = vol * M.rho / 1000;
    var cc = w.eCC[i];
    if (M.kind === 'rigid') continue;                                        // 数值刚性连接不计量
    if (cc === 'pile') { q.pile_m += w.L0[i] * (meta.pileGroupFac || 1); q.conc += vol; q.rebar += vol * 0.11; continue; }
    if (cc === 'masonry') { q.masonry += vol; continue; }
    if (cc === 'rock_anchor') { q.rock_anchor += w.L0[i] * 4; continue; }   // 每处 4 束
    if (mk === 'CABLE') q.cable += ton;
    else if (mk === 'STAY') q.stay += ton;
    else if (mk === 'HANGER') q.hanger += ton;
    else if (mk === 'MOOR') q.moor += w.L0[i];
    else if (mk === 'CFST') q.cfst += ton;
    else if (mk === 'GLULAM') q.glulam += vol;
    else if (mk === 'STEEL_HULL') q.hull += ton;
    else if (M.kind === 'concrete') { q.conc += vol; q.rebar += vol * 0.13; }
    else if (mk === 'Q345_LT') q.steel_lt += ton;
    else q.steel += ton;
  }
  q.conc += (w.capVol || 0) + (w.anchorVol || 0);
  q.rebar += ((w.capVol || 0) * 0.13 + (w.anchorVol || 0) * 0.05);
  return q;
};

BR.costEstimate = function (w, meta, sc) {
  var q = BR.takeoff(w, meta, sc), U = BR.COST.unit, rows = [], i;
  var add = function (key, qty, note, mul) {
    if (qty <= 0) return;
    var u = U[key];
    var c = u.p * qty * (mul === undefined ? 1 : mul);
    rows.push({ cat: '主体', item: u.name, unit: u.u, qty: qty, price: u.p, cost: c, note: note || u.bd || '' });
  };
  add('steel_fab', q.steel, '由模型单元体积×密度统计');
  add('steel_fab_lt', q.steel_lt, '低温钢（冻土场景）');
  add('main_cable', q.cable, 'PPWS 主缆含索股架设与缠丝防护');
  add('stay_cable', q.stay, '含锚具/护套/减振器/调索');
  add('hanger', q.hanger, '含索夹与锚头');
  add('cfst', q.cfst, '钢管+管内混凝土顶升');
  add('glulam', q.glulam, '胶合木+金属节点');
  add('hull', q.hull, '钢浮箱分段建造');
  add('conc_c30', q.conc, '承台/锚碇/桩身混凝土');
  add('rebar', q.rebar * 7.85, '按含钢率 110~130 kg/m³');
  add('masonry', q.masonry, '石砌拱座/桥台');
  add('rock_anchor', q.rock_anchor, '预应力岩锚索总长');
  if (q.pile_m > 0) {
    var key = sc.water.depth > 4 ? 'pile_water' : (BR.GEO.layerAt(sc, 8).vs > 600 ? 'pile_rock' : 'pile_land');
    add(key, q.pile_m, '桩长合计（含群桩折算 ' + (meta.pileGroupFac || 1).toFixed(1) + ' 倍）');
  }
  if (q.moor > 0) add('moor_chain', q.moor, '系泊链总长');
  // 附属工程
  var dl = meta.design.deckLen, B = meta.design.deckB;
  rows.push({ cat: '附属', item: U.pave.name, unit: 'm²', qty: dl * B, price: U.pave.p, cost: dl * B * U.pave.p, note: '桥面面积 ' + (dl * B).toFixed(0) + ' m²' });
  rows.push({ cat: '附属', item: U.railing.name, unit: 'm', qty: dl, price: U.railing.p, cost: dl * U.railing.p, note: '' });
  if (meta.design.nBearing) rows.push({ cat: '附属', item: U.bearing.name, unit: '个', qty: meta.design.nBearing, price: U.bearing.p, cost: meta.design.nBearing * U.bearing.p, note: '含减隔震支座' });
  if (meta.design.jointM) rows.push({ cat: '附属', item: U.expjoint.name, unit: 'm', qty: meta.design.jointM, price: U.expjoint.p, cost: meta.design.jointM * U.expjoint.p, note: '大位移模数式' });
  // 措施与专项
  (meta.measures || []).forEach(function (m) {
    var u = U[m.key];
    rows.push({ cat: '措施', item: u.name, unit: u.u, qty: m.qty, price: u.p, cost: u.p * m.qty, note: m.note || '' });
  });
  var sub = 0; rows.forEach(function (r) { sub += r.cost; });
  var kf = sc.costFactor || 1;
  var siteAdj = sub * (kf - 1);
  rows.push({ cat: '调整', item: '场地/施工难度综合系数 ×' + kf.toFixed(2), unit: '项', qty: 1, price: siteAdj, cost: siteAdj, note: sc.costNote || '' });
  var direct = sub + siteAdj;
  var other = direct * 0.16;
  rows.push({ cat: '调整', item: '间接费+设计监理+税费+预备费（16%）', unit: '项', qty: 1, price: other, cost: other, note: '按国内公路工程概算构成经验比例' });
  var total = direct + other;
  var life = sc.criteria.life || 100;
  var paintArea = (q.steel + q.steel_lt) * 1000 / 7850 * 55;   // 钢结构涂装面积经验值 ~55 m²/m³
  var lcc = BR.COST.lifecycle(total, life, {
    disc: 0.03, annualRate: meta.omRate || 0.006, overhaulEvery: 25, overhaulRate: 0.08,
    paintArea: (q.steel + q.steel_lt) > 0 ? paintArea : 0, paintEvery: 25
  });
  return {
    rows: rows, total: total, direct: direct, sub: sub, q: q, lcc: lcc,
    perM2: total / (dl * B), perM: total / dl, life: life
  };
};

BR.TEMPLATES.push({

  },
  build: function (w, sc, P) {
    P = P || {};
    var L = Math.max(300, P.span || sc.span);
    var side = P.side === undefined ? Math.round(L * 0.22) : P.side;
    var sag = L / (P.sagRatio || 10);

BR.templateById = function (id) {
  for (var i = 0; i < BR.TEMPLATES.length; i++) if (BR.TEMPLATES[i].id === id) return BR.TEMPLATES[i];
  return BR.TEMPLATES[0];
};

BR.buildBridge = function (scId, typeId, params) {
  var sc = BR.scenarioById(scId), tpl = BR.templateById(typeId);
  var w = new BR.World();
  w.gravity = -9.80665;
  var meta = tpl.build(w, sc, params || {});
  meta.id = tpl.id; meta.name = tpl.name; meta.short = tpl.short; meta.scenarioId = sc.id;
  var env = new BR.Env(sc);
  w.env = env;
  // 注册冲刷点（顺序与 scourRef 一致）
  for (var i = 0; i < w.scourSites.length; i++) {
    var S = w.scourSites[i];
    env.addPier(S.x, S.z, S.D, S.y1);
  }
  // 木廊桥定位为人行/轻车（4.5 kPa），不能按干线公路重车谱通车 —— 否则 55 t 卡车会直接压断木构件
  var light = meta.id === 'timber';
  w.traffic = new BR.Traffic({
    aadt: (params && params.aadt || 42000) * (light ? 0.10 : 1), truckPct: light ? 0.0 : 0.22,
    lanes: meta.design.lanes || 4, speed: light ? 8 : 22, seed: sc.seed + 7, rough: 4e-6,
    maxVeh: light ? 24 : 90
  });
  if (light) w.traffic.lightOnly = 1;
  w.compile({ limit: 0.02 });
  w.markBuried();
  // 结构阻尼：α = 2ζω₁，ω₁ 由跨径经验式估计
  var f1 = BR.clamp(120 / Math.max(60, meta.design.mainSpan), 0.08, 2.5);
  meta.f1est = f1;
  w.alphaDamp = 2 * (params && params.zeta || 0.01) * 2 * Math.PI * f1;
  meta.suit = tpl.suit(sc);
  meta.cost = BR.costEstimate(w, meta, sc);
  meta.stats = {
    nodes: w.N, elems: w.nE, hinges: w.nH, dof: 3 * w.N, dt: w.dt,
    massScale: w.massScaleAdded, mass: w.massTotal, soil: w.soil.length,
    bearings: w.bearings.length, hydro: w.hydroNodes.length, wind: w.windNodes.length,
    stations: w.deckStations.length, pontoons: w.pontoons.length
  };
  meta.criteria = BR.criteriaFor(sc, meta);
  return { world: w, env: env, meta: meta, sc: sc };
};


/* ===== 70-validate.js ===== */
/* =============================================================================
 * 桥匠 BRIDGEWRIGHT · 70-validate.js
 * 引擎验证：经典解析解 + 经验公式 + 收敛性 + 能量守恒
 * 每项给出：参考值、数值解、相对误差、判定阈值、所校验的实现路径
 * 结构：BR.VTESTS 为可增量执行的测试列表（页面内分帧运行，避免卡顿）
 * ========================================================================== */
'use strict';
var BR = (typeof BR !== 'undefined') ? BR : {};

/* ---------------- 动力松弛（找形/静力解） ----------------
 * 动能阻尼（kinetic damping）+ 可选「虚拟质量」：
 *   静力解与质量分布无关 → 令 mᵢ = 4·kᵢ·Δt² 使全部节点的临界步长一致，
 *   把 M⁻¹K 的谱宽（悬索桥可达 10⁶）压到 O(1)，收敛步数下降 1~2 个数量级。
 *   重力荷载仍用真实质量 mLoad，故静力解严格不变。（Otter/Day 动力松弛法）
 */
BR.relax = function (w, o) {
  o = o || {};
  var steps = o.steps || 40000, tol = o.tol || 2e-4;
  var saveA = w.alphaDamp;
  w.alphaDamp = o.alpha === undefined ? 0.6 : o.alpha;
  var i, ref = o.ref || 0, savedM = null, savedIM = null;
  if (o.fict) {
    var kk = w.nodalStiffness();
    savedM = Float64Array.from(w.m); savedIM = Float64Array.from(w.invm);
    var dt2 = w.dt * w.dt;
    for (i = 0; i < w.N; i++) {
      var mf = 4 * kk[i] * dt2;
      if (mf < 1e-6) mf = 1e-6;
      w.m[i] = mf; w.invm[i] = 1 / mf;
    }
  }
  if (!ref) {
    for (i = 0; i < w.N; i++) {
      var l = Math.abs((w.mLoad ? w.mLoad[i] : w.m[i]) * w.gravity) +
        (w.fext ? BR.hypot3(w.fext[3 * i], w.fext[3 * i + 1], w.fext[3 * i + 2]) : 0);
      if (l > ref) ref = l;
    }
  }
  ref = Math.max(ref, 1e-6);
  var keOld = 0, resets = 0, k, resid = 1;
  for (k = 0; k < steps; k++) {
    w.substep(w.dt);
    if (o.kinetic !== false) {
      if (w.KE < keOld) {
        for (i = 0; i < w.N; i++) { w.vx[i] *= 0.04; w.vy[i] *= 0.04; w.vz[i] *= 0.04; }
        resets++; keOld = 0;
      } else keOld = w.KE;
    }
    if (k % 100 === 99) {
      var mx = 0;
      for (i = 0; i < w.N; i++) {
        var fxa = w.fixA[i];
        if (fxa === 7) continue;
        var f2 = 0;
        if (!(fxa & 1)) f2 += w.fx[i] * w.fx[i];
        if (!(fxa & 2)) f2 += w.fy[i] * w.fy[i];
        if (!(fxa & 4)) f2 += w.fz[i] * w.fz[i];
        if (f2 > mx) mx = f2;
      }
      resid = Math.sqrt(mx) / ref;
      if (resid < tol) break;
    }
  }
  if (savedM) { w.m.set(savedM); w.invm.set(savedIM); }
  w.alphaDamp = saveA;
  return { iters: k, resets: resets, KE: w.KE, resid: resid };
};

/* ---------------- 成桥找形（恒载状态） ----------------
 * ① 禁止断裂（找形是数值过程，不是物理加载）
 * ② 重力/外载由 0 渐加到 1（模拟逐级加载，抑制冲击）
 * ③ 动能阻尼松弛到静力平衡
 * ④ 记录成桥线形作为后续变形与内力的参考基准
 */
BR.formFind = function (w, o) {
  o = o || {};
  var i, saveA = w.alphaDamp;
  w.noFail = 1;
  var ramp = o.ramp || 5000, passes = o.tune === undefined ? 2 : o.tune;
  var r = null;
  for (var pass = 0; pass <= passes; pass++) {
    if (pass > 0) {
      // ---- 无应力长度迭代（索力优化）+ 超应力索面积增配（设计迭代）----
      // ① 目标：使「目标几何」成为平衡态。取当前索力 N₁，令无应力长度 = L_target/(1+N₁/EA)
      // ② 若某索应力超过容许值，按实际索力重新配面积（只增不减，避免振荡），
      //    这等价于工程上的「按实际索力复核并加大索规格」，最终造价按调整后用量计。
      for (i = 0; i < w.nE; i++) {
        if (w.typ[i] !== BR.ET.CABLE) continue;
        if (w.epre[i] === 0) continue;                  // 无初张力的索（如系泊）不调
        var mi = w.mid[i], E = w.mE[mi], A = w.Ar[i];
        var M = BR.MAT[w.matKeys[mi]];
        var sfd = M.sfd || 2.5;
        var Nn = Math.abs(w.Nf[i]);
        var need = Nn * sfd * 1.06 / M.fu;
        if (need > A * 1.02) { A = Math.min(need, A * 2.5); w.Ar[i] = A; w.A0[i] = A; w.Pu[i] = 0; }
        var eps = Nn / (E * A);
        if (eps > 0) w.epre[i] = -eps;
      }
      for (i = 0; i < w.N; i++) {
        w.x[i] = w.X0[i]; w.y[i] = w.Y0[i]; w.z[i] = w.Z0[i];
        w.vx[i] = 0; w.vy[i] = 0; w.vz[i] = 0;
      }
      for (i = 0; i < w.nE; i++) { w.epsP[i] = 0; w.st[i] = 0; }
      for (i = 0; i < w.nH; i++) { w.hThp[i] = 0; w.hSt[i] = 0; }
      for (i = 0; i < w.bearings.length; i++) {
        var Bg = w.bearings[i];
        Bg.lost = 0; Bg.keyBroken = 0; Bg.slip = 0; Bg.slipZ = 0; Bg.maxU = 0;
      }
      w.brokenCount = 0;
      w.updateActive(); w.computeMass();
      for (i = 0; i < w.N; i++) w.invm[i] = 1 / w.m[i];
      ramp = Math.max(1200, Math.round(ramp * 0.6));
    }
    w.alphaDamp = o.alpha === undefined ? 1.4 : o.alpha;
    for (var k = 0; k < ramp; k++) { w.loadScale = (k + 1) / ramp; w.substep(w.dt); }
    w.loadScale = 1;
    r = BR.relax(w, {
      steps: o.steps || 8000, alpha: o.alpha2 === undefined ? 0.25 : o.alpha2,
      tol: o.tol || 2e-4, fict: o.fict === undefined ? true : o.fict
    });
  }
  for (i = 0; i < w.N; i++) { w.vx[i] = 0; w.vy[i] = 0; w.vz[i] = 0; }
  // 统计归零，记录成桥基准
  w.diss = { plastic: 0, damp: 0, fracture: 0, contact: 0, soil: 0 };
  for (i = 0; i < w.nE; i++) { w.sigMax[i] = w.sig[i]; w.sigMin[i] = w.sig[i]; }
  w.Yb = Float64Array.from(w.y); w.Xb = Float64Array.from(w.x); w.Zb = Float64Array.from(w.z);
  w.N0 = Float64Array.from(w.Nf); w.sig0 = Float64Array.from(w.sig);
  w.t = 0; w.step = 0; w.noFail = 0; w.alphaDamp = saveA;
  w.eventCount = 0; w.log.clear();
  var mx = 0, arg = -1;
  for (i = 0; i < w.nE; i++) if (w.act[i] && w.util[i] > mx) { mx = w.util[i]; arg = i; }
  r.maxUtil = mx; r.maxUtilElem = arg;
  return r;
};
/* ---------------- 测试用简单结构 ---------------- */
BR.testBeam = function (o) {
  var L = o.L, N = o.N, EI = o.EI, EA = o.EA, mbar = o.mbar || 0;
  var w = new BR.World();
  var dx = L / N, i;
  BR.MAT.__TEST = { name: 'test', E: 2.06e11, fy: o.fy || 1e13, fu: 1e13, rho: 7850, al: 1.2e-5, epu: 10, Eh: 1e9, zeta: 0, kind: 'steel' };
  var A = EA / BR.MAT.__TEST.E;
  var extra = Math.max(0, mbar - BR.MAT.__TEST.rho * A) * dx;
  for (i = 0; i <= N; i++) w.node(i * dx, 0, 0, 'beam', { m: extra, r: 0 });
  for (i = 0; i < N; i++) w.elem(i, i + 1, '__TEST', A, BR.ET.BAR, { I: EI / BR.MAT.__TEST.E, K: 1 });
  for (i = 1; i < N; i++) w.hinge(i - 1, i, i + 1, EI);
  w.gravity = 0;
  return w;
};

V('数值方法', function (add) {

/* ---- 7 欧拉屈曲（Southwell 图外推） ---- */
V('稳定', function (add) {
  var L = 20, N = 20, I = 2e-4, EI = E0 * I;
  var Pth = Math.PI * Math.PI * EI / (L * L);
  var q = 200;  // 固定横向扰动力（不随 P 变化）
  var run = function (fac) {
    var w = BR.testBeam({ L: L, N: N, EI: EI, EA: E0 * 0.01 });
    w.compile({ limit: 0 });
    w.fixA[0] = 7; w.fixA[N] = 6;                 // 两端铰（N 端可沿 x 滑动）
    w.fext[3 * N] = -fac * Pth;
    for (var i = 1; i < N; i++) w.fext[3 * i + 1] = -q * Math.sin(Math.PI * i / N);
    BR.relax(w, { steps: 50000, alpha: 1.0, tol: 1e-5, ref: q });
    return Math.abs(w.y[N / 2]);
  };
  var fs = [0.2, 0.4, 0.6], xs = [], ys = [];
  for (var i = 0; i < fs.length; i++) { xs.push(fs[i] * Pth); ys.push(1 / run(fs[i])); }
  // 最小二乘 1/δ = a − b·P → Pcr = a/b
  var n = xs.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; sxx += xs[i] * xs[i]; sxy += xs[i] * ys[i]; }
  var b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n;
  add('两端铰支压杆屈曲荷载 Pcr', Pth, -a / b, 0.03, 'N', 'Pcr = π²EI/(KL)²',
    'Southwell 法：δ=δ₀/(1−P/Pcr) → 1/δ 对 P 线性外推（3 个荷载级最小二乘）');
});

/* ---- 11 阻尼：对数衰减率 ---- */
V('阻尼', function (add) {
  BR.MAT.__DP = { name: 'd', E: 2.06e11, fy: 1e13, fu: 1e13, rho: 1e-6, al: 0, epu: 10, Eh: 1e9, zeta: 0, kind: 'steel' };
  var w = new BR.World();
  var a = w.node(0, 0, 0, 'b', { r: 0 }), b = w.node(0, 1, 0, 'b', { m: 1000, r: 0 });
  var A = 1e-4, k = 2.06e11 * A / 1, wn = Math.sqrt(k / 1000);
  w.elem(a, b, '__DP', A, BR.ET.BAR, { I: 1e-3 });
  w.gravity = 0; w.compile({ limit: 0 });
  w.fixA[a] = 7; w.fixA[b] = 5;
  w.dt = w.dt / 6;                       // 提高每周期采样点数以精确取峰
  var alpha = 1.0; w.alphaDamp = alpha;
  w.y[b] += 0.01;
  var nstep = Math.floor(12 / w.dt), sig = new Float64Array(nstep), i;
  for (i = 0; i < nstep; i++) { w.substep(w.dt); sig[i] = w.y[b] - 1; }
  var pk = [];
  for (i = 1; i < nstep - 1; i++) if (sig[i] > sig[i - 1] && sig[i] >= sig[i + 1] && sig[i] > 0) pk.push(sig[i]);
  // ln(peak) 对循环序号最小二乘 → 对数衰减率 δ
  var m = Math.min(pk.length, 80), sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (i = 0; i < m; i++) { var lv = Math.log(pk[i]); sx += i; sy += lv; sxx += i * i; sxy += i * lv; }
  var slope = (m * sxy - sx * sy) / (m * sxx - sx * sx), dl = -slope;
  var zeta = dl / Math.sqrt(4 * Math.PI * Math.PI + dl * dl);
  add('对数衰减率反算阻尼比', alpha / (2 * wn), zeta, 0.03, '', 'ζ = α/(2ω)（质量比例阻尼）',
    'ω=' + wn.toFixed(2) + ' rad/s，α=1.0；对 ' + m + ' 个峰值做 ln 线性回归');
});

/* ---- 13 能量守恒（无长期漂移） ---- */
V('数值方法', function (add) {
  var L = 40, N = 20, I = 0.02, EI = E0 * I;
  var w = BR.testBeam({ L: L, N: N, EI: EI, EA: E0 * 0.05, mbar: 6000 });
  w.compile({ limit: 0 });
  w.fixA[0] = 3; w.fixA[N] = 2;
  w.alphaDamp = 0;
  var i, n = w.N;
  // 一阶模态初速度（不瞬时拉伸单元）
  for (i = 1; i < N; i++) w.vy[i] = 0.05 * Math.sin(Math.PI * i / N);
  var pvx = new Float64Array(n), pvy = new Float64Array(n), pvz = new Float64Array(n);
  var nstep = Math.floor(20 / w.dt), Es = [];
  for (var k = 0; k < nstep; k++) {
    pvx.set(w.vx); pvy.set(w.vy); pvz.set(w.vz);
    w.substep(w.dt);
    // KE 用整步速度 (v_{n-1/2}+v_{n+1/2})/2，与 x_n 处的应变能同步
    var KE = 0;
    for (i = 0; i < n; i++) {
      var ax = 0.5 * (pvx[i] + w.vx[i]), ay = 0.5 * (pvy[i] + w.vy[i]), az = 0.5 * (pvz[i] + w.vz[i]);
      KE += 0.5 * w.m[i] * (ax * ax + ay * ay + az * az);
    }
    Es.push(KE + w.strainEnergy);
  }
  var q = Math.floor(nstep * 0.15);
  var e1 = BR.stat.mean(Es.slice(0, q)), e2 = BR.stat.mean(Es.slice(nstep - q));
  var fluct = (BR.stat.max(Es) - BR.stat.min(Es)) / e1;
  add('总能量漂移（20 s，无阻尼）', 0, Math.abs(e2 - e1) / e1, 0.01, '', 'E = KE + SE = const',
    '辛式显式积分；KE 取整步速度（(v_{n−½}+v_{n+½})/2）与应变能同步。有界振荡幅度 ' +
    (fluct * 100).toFixed(2) + '%（O(Δt²)），无单调漂移');
});

/* ---------------- 运行器 ---------------- */
BR.runValidation = function (opts) {
  opts = opts || {};
  var R = [], t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  var cur = '';
  var add = function (name, ref, num, tol, unit, formula, note) {
    var err = (ref === 0) ? Math.abs(num) : Math.abs((num - ref) / ref);
    R.push({ group: cur, name: name, ref: ref, num: num, err: err, tol: tol, pass: err <= tol, unit: unit || '', formula: formula || '', note: note || '' });
  };
  for (var i = 0; i < BR.VTESTS.length; i++) {
    cur = BR.VTESTS[i].group;
    if (opts.only !== undefined && opts.only !== i) continue;
    try { BR.VTESTS[i].fn(add); }
    catch (e) { R.push({ group: cur, name: '测试 #' + i + ' 异常', ref: 0, num: 1, err: 1, tol: 0, pass: false, formula: '', note: String(e && e.message) }); }
  }
  var ms = (typeof performance !== 'undefined' ? performance.now() : Date.now()) - t0;
  return { items: R, pass: R.filter(function (r) { return r.pass; }).length, total: R.length, ms: ms };
};

/* ---------------- 2 自由度颤振特征值分析 ---------------- */
/** 与时域求解器同一套准定常气动力的线性稳定性分析（4×4 状态矩阵）
 *  升力  L = q·B·(CL0 + CL1·αe),   αe  = α − ḣ/U + ra·B·α̇/U
 *  弯矩  M = q·B²·(CM0 + CM1·αeM), αeM = α − ḣ/U + rm·B·α̇/U
 *  h 向上为正，α 抬头为正，q=½ρU² */
BR.flutter2DOF = function (o) {
  var B = o.B, m = o.m, I = o.I, rho = o.rho || 1.225, A = o.aero;
  var wh = 2 * Math.PI * o.fh, wt = 2 * Math.PI * o.ft, z = o.zeta;
  var ev1 = function (U) {
    var q = 0.5 * rho * U * U;
    var Lh = -q * B * A.CL1 / U, La = q * B * A.CL1, Lad = q * B * A.CL1 * A.ra * B / U;
    var Mh = -q * B * B * A.CM1 / U, Ma = q * B * B * A.CM1, Mad = q * B * B * A.CM1 * A.rm * B / U;
    var kh = m * wh * wh, kt = I * wt * wt, ch = 2 * z * m * wh, ct = 2 * z * I * wt;
    var Am = [
      [0, 0, 1, 0],
      [0, 0, 0, 1],
      [-kh / m, La / m, (-ch + Lh) / m, Lad / m],
      [0, (-kt + Ma) / I, Mh / I, (-ct + Mad) / I]
    ];
    var ev = BR.eigReal(Am, 4), mx = -1e30, k;
    for (k = 0; k < ev.length; k++) if (ev[k].re > mx) mx = ev[k].re;
    return { maxRe: mx, ev: ev };
  };
  var lo = 0.2, hi = 400, i;
  if (ev1(hi).maxRe < 0) return { U: Infinity, f: 0, note: '400 m/s 内无颤振' };
  if (ev1(lo).maxRe > 0) return { U: 0, f: 0, note: '低风速已不稳定（结构阻尼过低或气动导数异常）' };
  for (i = 0; i < 60; i++) { var mid = 0.5 * (lo + hi); if (ev1(mid).maxRe > 0) hi = mid; else lo = mid; }
  var U = 0.5 * (lo + hi), e = ev1(U), fF = 0, best = -1e30;
  for (var j = 0; j < e.ev.length; j++) if (e.ev[j].re > best && e.ev[j].im > 0) { best = e.ev[j].re; fF = e.ev[j].im; }
  return { U: U, f: fF / (2 * Math.PI), ev: e.ev };
};

/** 扭转发散风速 */
BR.divergence = function (o) {
  var kt = o.I * Math.pow(2 * Math.PI * o.ft, 2);
  return Math.sqrt(2 * kt / ((o.rho || 1.225) * o.B * o.B * o.aero.CM1));
};


/* ===== 80-render.js ===== */
/* =============================================================================
 * 桥匠 BRIDGEWRIGHT · 80-render.js
 * 极简 WebGL2 渲染器（无外部依赖）
 *   ① 地形网格（含冲刷坑/滑坡的实时高程）② 水面（与物理同一 Airy 波）
 *   ③ 构件：圆柱状 impostor 带（按应力/利用率着色）④ 车辆 ⑤ 碎块 ⑥ 粒子

'use strict';
var BR = (typeof BR !== 'undefined') ? BR : {};

BR.GL = function (canvas) {
  var gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  this.ok = !!gl;
  if (!gl) return;
  this.gl = gl; this.canvas = canvas;
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  this.progs = {};
  this._initShaders();
  this.cam = { tx: 0, ty: 0, tz: 0, dist: 900, yaw: 0.9, pitch: 0.28, fov: 45 };
  this.view = new Float32Array(16); this.proj = new Float32Array(16); this.vp = new Float32Array(16);
  this.eye = [0, 0, 0];
  this.sun = [0.45, 0.78, 0.44];
  this.fog = [0.62, 0.71, 0.82];
  this.buf = {};
};

/* ------------------------------ 着色器 ------------------------------ */
BR.GL.prototype._initShaders = function () {
  var gl = this.gl;
  var mk = function (vs, fs, name) {
    var v = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(v, vs); gl.compileShader(v);
    if (!gl.getShaderParameter(v, gl.COMPILE_STATUS)) throw new Error(name + ' VS: ' + gl.getShaderInfoLog(v));
    var f = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f, fs); gl.compileShader(f);
    if (!gl.getShaderParameter(f, gl.COMPILE_STATUS)) throw new Error(name + ' FS: ' + gl.getShaderInfoLog(f));
    var p = gl.createProgram(); gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ' LINK: ' + gl.getProgramInfoLog(p));
    return p;
  };
  // ---- 地形/一般三角面 ----
  this.progs.mesh = mk(
    '#version 300 es\n' +
    'layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm; layout(location=2) in vec3 aCol;\n' +
    'uniform mat4 uVP; out vec3 vN; out vec3 vC; out vec3 vP;\n' +
    'void main(){ vN=aNrm; vC=aCol; vP=aPos; gl_Position=uVP*vec4(aPos,1.0); }',
    '#version 300 es\nprecision highp float;\n' +
    'in vec3 vN; in vec3 vC; in vec3 vP; uniform vec3 uSun; uniform vec3 uEye; uniform vec3 uFog;\n' +
    'uniform float uFogD; out vec4 o;\n' +
    'void main(){ vec3 n=normalize(vN); float d=max(dot(n,normalize(uSun)),0.0);\n' +
    ' vec3 c=vC*(0.34+0.72*d);\n' +
    ' float f=1.0-exp(-length(vP-uEye)/uFogD); o=vec4(mix(c,uFog,clamp(f,0.0,0.9)),1.0); }', 'mesh');
  // ---- 构件（圆柱 impostor：CPU 端展开为四边形带）----
  this.progs.tube = mk(
    '#version 300 es\n' +
    'layout(location=0) in vec3 aA; layout(location=1) in vec3 aB; layout(location=2) in vec2 aSide;\n' +
    'layout(location=3) in vec4 aCol; layout(location=4) in float aR;\n' +
    'uniform mat4 uVP; uniform vec3 uEye; out vec4 vC; out vec3 vN; out vec3 vP;\n' +
    'void main(){\n' +
    ' vec3 p = mix(aA,aB,aSide.x);\n' +
    ' vec3 dir = normalize(aB-aA+vec3(1e-6));\n' +
    ' vec3 vd = normalize(p-uEye);\n' +
    ' vec3 side = normalize(cross(dir,vd));\n' +
    ' vec3 nrm = normalize(cross(side,dir));\n' +
    ' p += side*aR*aSide.y;\n' +
    ' vN = normalize(nrm*0.55 + side*aSide.y*0.85);\n' +
    ' vC = aCol; vP = p; gl_Position = uVP*vec4(p,1.0); }',
    '#version 300 es\nprecision highp float;\n' +
    'in vec4 vC; in vec3 vN; in vec3 vP; uniform vec3 uSun; uniform vec3 uEye; uniform vec3 uFog;\n' +
    'uniform float uFogD; out vec4 o;\n' +
    'void main(){ vec3 n=normalize(vN); float d=max(dot(n,normalize(uSun)),0.0);\n' +
    ' float sp=pow(max(dot(reflect(-normalize(uSun),n),-normalize(vP-uEye)),0.0),18.0);\n' +
    ' vec3 c=vC.rgb*(0.40+0.68*d)+vec3(0.55)*sp*0.35;\n' +
    ' float f=1.0-exp(-length(vP-uEye)/uFogD); o=vec4(mix(c,uFog,clamp(f,0.0,0.88)),vC.a); }', 'tube');

    '#version 300 es\n' +
    'layout(location=0) in vec2 aXZ; uniform mat4 uVP; uniform float uT; uniform vec4 uW1; uniform vec4 uW2;\n' +
    'uniform float uLevel; out vec3 vP; out float vH;\n' +

    ' h += uW1.x*sin(uW1.y*aXZ.y - uW1.z*uT);\n' +
    ' h += uW2.x*sin(uW2.y*aXZ.y - uW2.z*uT + 1.7);\n' +
    ' h += 0.18*sin(aXZ.x*0.05 + uT*0.8);\n' +
    ' vec3 p=vec3(aXZ.x,uLevel+h,aXZ.y); vP=p; vH=h; gl_Position=uVP*vec4(p,1.0); }',

    'out vec4 o;\n' +

    ' float f=1.0-exp(-length(vP-uEye)/uFogD); o=vec4(mix(c,uFog,clamp(f,0.0,0.85)),0.90); }', 'water');

    '#version 300 es\n' +
    'layout(location=0) in vec3 aPos; layout(location=1) in vec4 aCol; layout(location=2) in float aSz;\n' +
    'uniform mat4 uVP; out vec4 vC;\n' +
    'void main(){ vC=aCol; gl_Position=uVP*vec4(aPos,1.0); gl_PointSize=aSz/max(0.1,gl_Position.w)*600.0; }',

/* ------------------------------ 数学 ------------------------------ */
BR.GL.prototype._mul = function (out, a, b) {
  for (var i = 0; i < 4; i++) for (var j = 0; j < 4; j++) {
    var s = 0; for (var k = 0; k < 4; k++) s += a[i * 4 + k] * b[k * 4 + j];

};
BR.GL.prototype.setCamera = function (w, h) {
  var c = this.cam;
  var cp = Math.cos(c.pitch), sp = Math.sin(c.pitch), cy = Math.cos(c.yaw), sy = Math.sin(c.yaw);
  var ex = c.tx + c.dist * cp * sy, ey = c.ty + c.dist * sp, ez = c.tz + c.dist * cp * cy;
  this.eye = [ex, ey, ez];
  var f = [c.tx - ex, c.ty - ey, c.tz - ez];
  var fl = Math.hypot(f[0], f[1], f[2]); f = [f[0] / fl, f[1] / fl, f[2] / fl];
  var up = [0, 1, 0];
  var s = [f[1] * up[2] - f[2] * up[1], f[2] * up[0] - f[0] * up[2], f[0] * up[1] - f[1] * up[0]];
  var sl = Math.hypot(s[0], s[1], s[2]); s = [s[0] / sl, s[1] / sl, s[2] / sl];
  var u = [s[1] * f[2] - s[2] * f[1], s[2] * f[0] - s[0] * f[2], s[0] * f[1] - s[1] * f[0]];
  var V = this.view;
  V[0] = s[0]; V[1] = u[0]; V[2] = -f[0]; V[3] = 0;
  V[4] = s[1]; V[5] = u[1]; V[6] = -f[1]; V[7] = 0;
  V[8] = s[2]; V[9] = u[2]; V[10] = -f[2]; V[11] = 0;
  V[12] = -(s[0] * ex + s[1] * ey + s[2] * ez);
  V[13] = -(u[0] * ex + u[1] * ey + u[2] * ez);
  V[14] = (f[0] * ex + f[1] * ey + f[2] * ez);
  V[15] = 1;

/* ------------------------------ 缓冲工具 ------------------------------ */
BR.GL.prototype._vbo = function (name, data, usage) {

/* ------------------------------ 地形 ------------------------------ */
BR.GL.prototype.buildTerrain = function (env, sc, opts) {
  opts = opts || {};

BR.GL.prototype.updateTerrain = function (env, sc) {

      var dz = (env.terrainY(x, z + 6) - env.terrainY(x, z - 6)) / 12;

      var snow = (sc.snowLine && y > sc.snowLine) ? BR.clamp((y - sc.snowLine) / 260, 0, 1) : 0;
      var r = base[0] * (0.72 + 0.5 * t), g = base[1] * (0.72 + 0.5 * t), b2 = base[2] * (0.72 + 0.5 * t);

BR.GL.prototype.drawTerrain = function () {
  if (!this.terr) return;

/* ------------------------------ 水面 ------------------------------ */
BR.GL.prototype.buildWater = function (x0, x1, z0, z1) {

/* ------------------------------ 构件 ------------------------------ */
/** 每根构件 4 顶点（两端各 2），CPU 端填装；着色模式：
 *  0 应力（压蓝/拉红）1 利用率（turbo）2 材料 3 疲劳损伤 4 施工阶段 */
BR.GL.prototype.buildMembers = function (w) {
  var n = w.nE;

  this.mC = new Float32Array(n * 4 * 4);

  for (i = 0; i < n; i++) {
    var o = i * 8;
    this.mS[o] = 0; this.mS[o + 1] = -1;
    this.mS[o + 2] = 0; this.mS[o + 3] = 1;
    this.mS[o + 4] = 1; this.mS[o + 5] = -1;
    this.mS[o + 6] = 1; this.mS[o + 7] = 1;
  }
  var idx = [];
  for (i = 0; i < n; i++) { var b = i * 4; idx.push(b, b + 1, b + 2, b + 2, b + 1, b + 3); }
  this.mIdx = new Uint32Array(idx);
  var gl = this.gl;
  this.mIBO = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.mIBO);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, this.mIdx, gl.STATIC_DRAW);
  this._vbo('ms', this.mS, gl.STATIC_DRAW);

};

BR.GL.prototype.updateMembers = function (w, mode, opts) {
  opts = opts || {};

    if (w.bo[i] > (opts.reveal === undefined ? 1 : opts.reveal)) continue;

    for (var q = 0; q < 4; q++) {
      A[o + q * 3] = w.x[a]; A[o + q * 3 + 1] = w.y[a]; A[o + q * 3 + 2] = w.z[a];

BR.GL.prototype.drawMembers = function () {
  if (!this.mCount) return;
  var gl = this.gl, p = this.progs.tube;
  gl.useProgram(p);
  gl.uniformMatrix4fv(gl.getUniformLocation(p, 'uVP'), false, this.vp);
  gl.uniform3fv(gl.getUniformLocation(p, 'uSun'), this.sun);
  gl.uniform3fv(gl.getUniformLocation(p, 'uEye'), this.eye);
  gl.uniform3fv(gl.getUniformLocation(p, 'uFog'), this.fog);
  gl.uniform1f(gl.getUniformLocation(p, 'uFogD'), this.fogD);
  var bind = function (name, loc, sz) {
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf[name]);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, sz, gl.FLOAT, false, 0, 0);
  }.bind(this);
  bind('ma', 0, 3); bind('mb', 1, 3); bind('ms', 2, 2); bind('mc', 3, 4); bind('mr', 4, 1);

/* ---------- 车辆与浮箱等盒体（用 tube 程序画成短粗杆，够用且极省） ---------- */
BR.GL.prototype.drawBoxes = function (list) {
  if (!list.length) return;

    C = new Float32Array(n * 16), R = new Float32Array(n * 4);

    for (var q = 0; q < 4; q++) {
      A[o + q * 3] = b.x0; A[o + q * 3 + 1] = b.y0; A[o + q * 3 + 2] = b.z0;
      B[o + q * 3] = b.x1; B[o + q * 3 + 1] = b.y1; B[o + q * 3 + 2] = b.z1;
      C[o2 + q * 4] = b.c[0]; C[o2 + q * 4 + 1] = b.c[1]; C[o2 + q * 4 + 2] = b.c[2]; C[o2 + q * 4 + 3] = 1;

  gl.uniform3fv(gl.getUniformLocation(p, 'uSun'), this.sun);
  gl.uniform3fv(gl.getUniformLocation(p, 'uEye'), this.eye);
  gl.uniform3fv(gl.getUniformLocation(p, 'uFog'), this.fog);
  gl.uniform1f(gl.getUniformLocation(p, 'uFogD'), this.fogD);
  this._vbo('ba', A); this._vbo('bb', B); this._vbo('bs', S); this._vbo('bc', C); this._vbo('br', R);
  var bind = function (name, loc, sz) {
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf[name]);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, sz, gl.FLOAT, false, 0, 0);
  }.bind(this);
  bind('ba', 0, 3); bind('bb', 1, 3); bind('bs', 2, 2); bind('bc', 3, 4); bind('br', 4, 1);
  if (!this.bIBO) this.bIBO = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.bIBO);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.DYNAMIC_DRAW);
  gl.disable(gl.CULL_FACE);
  gl.drawElements(gl.TRIANGLES, n * 6, gl.UNSIGNED_INT, 0);
  gl.enable(gl.CULL_FACE);
};

/* ---------- 粒子 ---------- */

BR.Particles.prototype.spawn = function (x, y, z, vx, vy, vz, col, size, life) {
  var i = this.n < this.cap ? this.n++ : Math.floor(Math.random() * this.cap);

      $('bootS').textContent = '施工中 ' + (A.st.reveal * 100).toFixed(0) + '%　·　' + stg + '　·　成桥找形迭代中…';
      $('bootB').style.width = (A.st.reveal * 100).toFixed(0) + '%';
      A.draw(dtw);
      A.hud();
      return;
    }
    if ($('boot').style.display !== 'none') { $('boot').style.display = 'none'; }
    if (A.st.replay.on) { A.replayFrame(dtw); A.draw(dtw); A.hud(); return; }
    if (A.st.running) {
      var ts = A.st.timeScale * (A.st.collapsed ? A.st.slowmo : 1);
      // 帧率无关性：把一帧的仿真时间切成 ≤20 ms 的小块，环境荷载（风/波/车）每块都刷新一次。
      // 否则在低帧率机器上，风/车荷载会以 16 Hz 保持恒定跨越 90 个子步，
      // 车辆悬架与气动反馈的更新过疏会引起非物理的响应放大。
      var simDt = Math.min(0.05, dtw) * ts;
      var nch = Math.max(1, Math.ceil(simDt / 0.02));
      var cdt = simDt / nch, adv = 0;
      var t0 = performance.now();
      var subBudget = Math.max(8, Math.round(A.st.maxSub / nch));
      for (var ci = 0; ci < nch; ci++) {
        A.preStep(cdt);
        adv += w.advance(cdt, subBudget);
        A.postStep(cdt);
      }
      A.st.solveMs = performance.now() - t0;
      A.st.rtf = adv / Math.max(1e-6, dtw);
    }
    A.draw(dtw);
    A.hud();
  };

  A.preStep = function (simDt) {
    var w = A.world, env = A.env;
    // 风速斜坡（颤振试验）
    if (A.st.windRamp) {
      env.wind.U10 += A.st.windRamp * simDt;
      if (env.wind.U10 > 120) A.st.windRamp = 0;
      $('vWind') && ($('vWind').textContent = env.wind.U10.toFixed(1));
      $('sWind') && ($('sWind').value = env.wind.U10);
    }
    // 时间加速（疲劳/腐蚀/徐变/冻融）
    if (A.st.yearRate) {
      var dy = A.st.yearRate * simDt;
      A.st.years += dy;
      A.applyAging(dy);
    }
    env.prepFrame(w, simDt);
  };

  A.postStep = function (adv) {
    var w = A.world, env = A.env, st = A.st;
    // 记录峰值与曲线
    var sts = w.deckStations, mid = sts.length ? sts[Math.floor(sts.length / 2)] : null;
    var defl = 0, tw = 0, acc = 0;
    if (mid && w.Yb) {
      defl = 0.5 * (w.y[mid.nA] + w.y[mid.nB]) - 0.5 * (w.Yb[mid.nA] + w.Yb[mid.nB]);
      tw = BR.deg(Math.atan2(w.y[mid.nA] - w.y[mid.nB], A.meta.design.deckB) -
        Math.atan2(w.Yb[mid.nA] - w.Yb[mid.nB], A.meta.design.deckB));
      acc = Math.abs((w.fy[mid.nA] + w.fy[mid.nB]) / Math.max(1e-6, w.m[mid.nA] + w.m[mid.nB]));
    }
    var mu = 0, mue = -1, cablemax = 0;
    for (var i = 0; i < w.nE; i++) {
      if (!w.act[i] || w.mKind[w.mid[i]] === 'rigid') continue;
      if (w.util[i] > mu) { mu = w.util[i]; mue = i; }
      if (w.typ[i] === BR.ET.CABLE && Math.abs(w.Nf[i]) > cablemax) cablemax = Math.abs(w.Nf[i]);
    }
    st.peak.defl = Math.max(st.peak.defl || 0, Math.abs(defl));
    st.peak.twist = Math.max(st.peak.twist || 0, Math.abs(tw));
    st.peak.util = Math.max(st.peak.util || 0, mu);
    st.peak.acc = Math.max(st.peak.acc || 0, acc);
    st.peak.cable = Math.max(st.peak.cable || 0, cablemax);
    st.cur = { defl: defl, twist: tw, util: mu, utilE: mue, cable: cablemax, acc: acc };
    // 支座/落梁/塑性铰统计
    var lost = 0, keyb = 0, ph = 0, phmax = 0, mub = 0;
    for (i = 0; i < w.bearings.length; i++) { if (w.bearings[i].lost) lost++; if (w.bearings[i].keyBroken) keyb++; mub = Math.max(mub, w.bearings[i].maxU); }
    for (i = 0; i < w.nH; i++) if (Math.abs(w.hThp[i]) > 1e-6) { ph++; phmax = Math.max(phmax, Math.abs(w.hThp[i])); }
    st.cur.lost = lost; st.cur.keyb = keyb; st.cur.ph = ph; st.cur.phmax = phmax; st.cur.maxBearU = mub;
    // 疲劳（在线雨流，仅监测高应力单元子集）
    A.fatigueTick(adv);
    // 首个破坏
    if (!st.firstFail && w.brokenCount > 0) {
      for (i = 0; i < w.nE; i++) if (w.st[i] === BR.ST.BROKEN) {
        st.firstFail = { e: i, t: w.t, name: w.eName[i], mat: w.matKeys[w.mid[i]], sig: w.sigMax[i], util: w.util[i] };
        break;
      }
    }
    // 垮塌判定
    if (!st.collapsed) {
      var frac = w.brokenCount / Math.max(1, w.nE);
      if ((Math.abs(defl) > Math.max(6, A.meta.design.mainSpan / 45) && w.brokenCount > 6) || frac > 0.10 || lost > 0 && frac > 0.02) {
        st.collapsed = true; st.collapseT = w.t; st.slowmo = 0.35;
        A.log(3, 'COLLAPSE', '★ 判定为垮塌：断裂单元 ' + w.brokenCount + '（' + (frac * 100).toFixed(1) +
          '%），跨中位移 ' + defl.toFixed(2) + ' m，落梁支座 ' + lost + ' 处');
        A.makeReport();
        A.renderDoc();
      }
    }
    // 曲线
    if (w.step % 6 === 0) {
      A.trace.rec(w.t, {
        defl: defl, twist: tw, util: mu, wind: env.wind.U10, cable: cablemax / 1e6,
        ru: env.ru, scour: env.scour.length ? env.scour[0].ys : 0, slide: env.slide.u,
        acc: acc, broken: w.brokenCount
      });
    }
    // 碎屑粒子
    if (w.brokenCount > (A.st.lastBroken || 0)) {
      var nb = w.brokenCount - (A.st.lastBroken || 0);
      for (i = 0; i < w.nE && nb > 0; i++) {
        if (w.st[i] === BR.ST.BROKEN && !w.pdone) { }
      }
      A.st.lastBroken = w.brokenCount;
    }
    // 回放录制
    var rp = A.st.replay;
    if (!rp.on && (++rp.cnt % rp.every === 0)) {
      rp.frames.push(w.snapshot());
      if (rp.frames.length > rp.cap) rp.frames.shift();
    }
  };

  A.applyAging = function (dy) {
    var w = A.world, i;
    var rate = A.sc.water.fresh ? BR.DURA.corrRate.rural : BR.DURA.corrRate.marine;
    if (A.st.corrOn) {
      for (i = 0; i < w.nE; i++) {
        var kind = w.mKind[w.mid[i]];
        if (kind !== 'steel' && kind !== 'cable') continue;
        var d = Math.sqrt(Math.max(1e-6, w.A0[i]) / Math.PI) * 2;
        var loss = BR.DURA.steelLoss(A.st.years, rate * (w.tag[w.a_[i]] === 'pier' ? 2 : 1), 4 / Math.max(0.02, d), 25);
        w.Ar[i] = w.A0[i] * (1 - BR.clamp(loss, 0, 0.85));
      }
    }
    if (A.st.creepOn) {
      var phi = BR.DURA.creepPhi(Math.max(28, A.st.years * 365), 28, 70, 400, 58);
      for (i = 0; i < w.nE; i++) if (w.mKind[w.mid[i]] === 'concrete' || w.mKind[w.mid[i]] === 'cfst') {
        var sig = w.sig0 ? w.sig0[i] : 0;
        w.eps0[i] = (sig < 0 ? sig / w.mE[w.mid[i]] * phi : 0) - 2.2e-4 * BR.clamp(A.st.years / 30, 0, 1);
      }
    }
    if (A.sc.permafrost && A.st.frostOn) A.env.updateFrost(dy);
  };

  A.fatigueTick = function (adv) {
    var w = A.world;
    if (!w.mon) {
      var arr = [], i;
      for (i = 0; i < w.nE; i++) if (w.act[i] && w.mKind[w.mid[i]] !== 'rigid') arr.push({ i: i, u: w.util[i] });
      arr.sort(function (a, b) { return b.u - a.u; });
      w.mon = arr.slice(0, 48).map(function (o) { return o.i; });
      w.monRF = w.mon.map(function () { return new BR.Rainflow(); });
    }
    for (var k = 0; k < w.mon.length; k++) {
      var e = w.mon[k];
      w.monRF[k].push(w.sig[e]);
      var cy = w.monRF[k].cycles;
      if (cy.length) {
        var dsc = BR.FATIGUE.detail[w.eDetail[e]] ? BR.FATIGUE.detail[w.eDetail[e]].dsc : 80e6;
        var D = 0;
        for (var q = 0; q < cy.length; q++) D += cy[q].n / BR.FATIGUE.N(cy[q].range, dsc);
        w.dmg[e] = Math.max(w.dmg[e], D * (A.st.fatigueMult || 1));
        if (w.dmg[e] >= 1 && w.act[e] && A.st.fatigueBreak) w.breakElem(e, '疲劳损伤 D≥1（' + w.eDetail[e] + ' 细节）');
      }
    }
  };

  /* ============================ 渲染 ============================ */
  A.draw = function (dtw) {
    var g = A.gl, w = A.world, env = A.env;
    var cw = A.canvas.clientWidth, ch = A.canvas.clientHeight;
    if (A.canvas.width !== cw || A.canvas.height !== ch) { A.canvas.width = cw; A.canvas.height = ch; }
    var sky = A.sc && A.sc.theme === 'snow' ? [0.72, 0.79, 0.88] : A.sc && A.sc.theme === 'sea' ? [0.42, 0.56, 0.70] : [0.47, 0.60, 0.74];

    g.clear(sky);

    if (A.st.terrDirty || (w.step % 40 === 0 && (env.scour.length || env.slide.u > 0.01))) { g.updateTerrain(env, A.sc); A.st.terrDirty = 0; }
    g.drawTerrain();
    g.updateMembers(w, A.st.mode, { showBroken: A.st.showBroken, rscale: 1.0, rmin: Math.max(0.14, g.cam.dist * 0.0004), reveal: A.st.phase === 'building' ? A.st.reveal : 1 });
    g.drawMembers();

      boxes.push({
        x0: V.s - V.L * 0.5, y0: V.y + 1.4, z0: V.z, x1: V.s + V.L * 0.5, y1: V.y + 1.4, z1: V.z,

      boxes.push({
        x0: w.x[n0], y0: w.y[n0] - P.depth * 0.35, z0: w.z[n0], x1: w.x[n1], y1: w.y[n1] - P.depth * 0.35, z1: w.z[n1],
        r: 7.5, c: P.flood > 0.05 ? [0.55, 0.30, 0.30] : [0.42, 0.46, 0.50]

    }
    if (boxes.length) g.drawBoxes(boxes);
    if (A.sc.water.depth > 0 || env.floodRise > 0) g.drawWater(env, w.t);
    A.particles.step(dtw);
    g.drawParticles(A.particles);
  };

  /* ============================ HUD ============================ */
  A.hud = function () {

    lines.push('风速 U10      ' + env.wind.U10.toFixed(1) + ' m/s   桥面高度处 ' + env.wind.mean(m.design.deckY - A.sc.riverY + 10).toFixed(1));
    if (env.scour.length) lines.push('局部冲刷深度  ' + env.scour[0].ys.toFixed(2) + ' / 平衡 ' + env.scour[0].yseq.toFixed(2) + ' m');

    // 右上卡片

  A.checkCards = function () {
    var m = A.meta, st = A.st, sc = A.sc, mo = m.modal, c = st.cur || {};
    var rows = [], ok = function (b) { return b ? '<span class="tag g">合格</span>' : '<span class="tag r">超限</span>'; };

  A.tip = function (msg) {

  /* ============================ 考验台动作 ============================ */
  A.setWind = function (U) {
    A.env.wind.U10 = U; A.st.windRamp = 0;
    $('sWind').value = U; $('vWind').textContent = U.toFixed(1);
  };
  A.quake = function (pga, pulse) {
    var s = A.sc.seismic;
    A.env.makeQuake({
      pga: pga, pgaV: pga * 0.65, mw: s.mw, pulse: pulse, Tp: A.tp || s.Tp, Ap: s.Ap || 1.0,
      dur: 40, fg: s.fg, zg: s.zg, apparentV: s.apparentV || 1800, seed: 2024 + Math.floor(Math.random() * 999)
    });
    A.st.quakeOn = 1;
    var sp = BR.responseSpectrum(A.env.quake.ag[0], A.env.quake.dt, 0.05, [0.2, 0.5, 1, 2, 3, 4, 5]);
    A.meta.spectrum = sp;
    A.log(3, 'QUAKE', (pulse ? '近断层脉冲型' : '') + '地震动输入：PGA=' + pga.toFixed(2) + 'g，Mw' + s.mw +
      (pulse ? '，脉冲周期 ' + (A.tp || s.Tp) + ' s' : '') + '；地表谱 Sa(1s)=' + (sp[2].Sa / 9.80665).toFixed(2) + 'g');
  };
  A.setFlood = function (T) {
    var env = A.env, sc = A.sc;
    if (!T) { env.floodRise = 0; env.floodVel = 0; env.surge = 0; A.log(1, 'FLOOD', '恢复常水位'); A.st.terrDirty = 1; return; }
    var lg = Math.log10(T) - 1;
    env.floodRise = Math.max(0, sc.water.depth * (0.18 + 0.30 * lg));
    env.floodVel = sc.water.current * (0.25 + 0.42 * lg);
    A.log(2, 'FLOOD', '1/' + T + ' 洪水：水位 +' + env.floodRise.toFixed(2) + ' m，流速 +' + env.floodVel.toFixed(2) +
      ' m/s（冲刷、漂浮物与浮托力同步作用）');
    A.st.terrDirty = 1;
  };
  A.pickWaterNode = function () {
    var w = A.world, best = -1, bd = 1e9;
    for (var i = 0; i < w.N; i++) {
      if (w.hydDa && w.hydDa[i] > 0) { }
    }
    for (i = 0; i < w.hydroNodes.length; i++) {
      var n = w.hydroNodes[i].n;
      var d = Math.abs(w.Y0[n] - A.sc.water.level);
      if (d < bd) { bd = d; best = n; }
    }
    if (best < 0) for (i = 0; i < w.N; i++) if (w.tag[i] === 'pier') { best = i; break; }
    return best;
  };
  A.cutRandomCable = function () {
    var w = A.world, cand = [], i;
    for (i = 0; i < w.nE; i++) if (w.act[i] && w.typ[i] === BR.ET.CABLE &&
      (w.eName[i].indexOf('斜拉索') >= 0 || w.eName[i].indexOf('吊索') >= 0)) cand.push(i);
    if (!cand.length) return A.log(1, 'CABLE', '本方案无可换拉索构件');
    var e = cand[Math.floor(Math.random() * cand.length)];
    var N0 = w.Nf[e];
    w.breakElem(e, '人为切断（断索验算）');
    A.log(3, 'CABLE', '切断 ' + w.eName[e] + ' #' + e + '（原索力 ' + (N0 / 1e6).toFixed(1) +
      ' MN）→ 观察相邻索力放大（PTI 要求动力放大 2.0 下余下结构 σ≤0.95fy 且不倒）');
    A.spawnDust(0.5 * (w.x[w.a_[e]] + w.x[w.b_[e]]), 0.5 * (w.y[w.a_[e]] + w.y[w.b_[e]]), 0.5 * (w.z[w.a_[e]] + w.z[w.b_[e]]), 30);
  };
  A.spawnDust = function (x, y, z, n) {
    for (var i = 0; i < n; i++) {
      A.particles.spawn(x, y, z, (Math.random() - 0.5) * 14, Math.random() * 10, (Math.random() - 0.5) * 14,
        [0.78, 0.74, 0.66], 0.9 + Math.random(), 1.2 + Math.random() * 1.6);
    }
  };

  /* ---------- 自由施灾：点选 ---------- */
  A.doFreeAction = function (ev) {
    var w = A.world, g = A.gl, r = A.canvas.getBoundingClientRect();
    var mx = (ev.clientX - r.left) / r.width * 2 - 1, my = -((ev.clientY - r.top) / r.height * 2 - 1);
    var best = -1, bd = 1e9, i;
    for (i = 0; i < w.nE; i++) {
      if (!w.act[i]) continue;
      var a = w.a_[i], b = w.b_[i];
      var px = 0.5 * (w.x[a] + w.x[b]), py = 0.5 * (w.y[a] + w.y[b]), pz = 0.5 * (w.z[a] + w.z[b]);
      var M = g.vp;
      var cx = M[0] * px + M[4] * py + M[8] * pz + M[12];
      var cy = M[1] * px + M[5] * py + M[9] * pz + M[13];
      var cwv = M[3] * px + M[7] * py + M[11] * pz + M[15];
      if (cwv <= 0.01) continue;
      var sx = cx / cwv, sy = cy / cwv;
      var d = (sx - mx) * (sx - mx) + (sy - my) * (sy - my);
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0 || bd > 0.004) { A.tip('未命中构件，请靠近构件中部点击'); return; }
    var a2 = w.a_[best], b2 = w.b_[best];
    var cx2 = 0.5 * (w.x[a2] + w.x[b2]), cy2 = 0.5 * (w.y[a2] + w.y[b2]), cz2 = 0.5 * (w.z[a2] + w.z[b2]);
    if (A.st.freeMode === 'cut') {
      w.breakElem(best, '人为切断');
      A.log(3, 'CUT', '切断 ' + (w.eName[best] || w.matKeys[w.mid[best]]) + ' #' + best +
        '（切断前 N=' + (w.Nf[best] / 1e6).toFixed(2) + ' MN，应力比 ' + w.util[best].toFixed(2) + '）');
      A.spawnDust(cx2, cy2, cz2, 24);
    } else if (A.st.freeMode === 'impulse') {
      A.env.impulse({ nodes: [a2, b2], F: [0, -1e7, 2e7], dur: 0.35, name: '人为冲击' });
      A.log(2, 'IMPACT', '对 #' + best + ' 施加 20 MN 横向 + 10 MN 竖向冲击（0.35 s 半正弦）');
      A.spawnDust(cx2, cy2, cz2, 16);
    } else if (A.st.freeMode === 'pier') {
      var tag = w.tag[a2], cnt = 0;
      for (i = 0; i < w.nE; i++) {
        if (!w.act[i]) continue;
        var m1 = 0.5 * (w.x[w.a_[i]] + w.x[w.b_[i]]), m2 = 0.5 * (w.y[w.a_[i]] + w.y[w.b_[i]]), m3 = 0.5 * (w.z[w.a_[i]] + w.z[w.b_[i]]);
        if (BR.hypot3(m1 - cx2, m2 - cy2, m3 - cz2) < Math.max(12, A.meta.design.deckB * 0.6)) { w.breakElem(i, '爆破'); cnt++; }
      }
      A.log(3, 'BLAST', '爆破 ' + tag + ' 区域：切断 ' + cnt + ' 个构件（模拟支承突然丧失 → 连续倒塌验算）');
      A.spawnDust(cx2, cy2, cz2, 90);
    }
  };

  /* ============================ 回放 ============================ */
  A.enterReplay = function () {
    if (A.st.replay.frames.length < 4) { A.tip('回放缓存不足，先运行一段时间'); return; }
    A.st.replay.on = true; A.st.replay.i = 0; A.st.replay.playing = true;
    A.st.running = false;
    $('replay').style.display = 'block'; $('rpPlay').textContent = '⏸';
    A.log(1, 'REPLAY', '进入回放：' + A.st.replay.frames.length + ' 帧（间隔 ' + A.st.replay.every + ' 帧录制）');
  };
  A.exitReplay = function () {
    A.st.replay.on = false; $('replay').style.display = 'none';
    var f = A.st.replay.frames[A.st.replay.frames.length - 1];
    if (f) A.world.restore(f);
    A.st.running = true;
  };
  A.replayFrame = function (dtw) {
    var rp = A.st.replay;
    if (rp.playing) { rp.i += Math.max(1, Math.round(dtw * 60 * 0.7)); if (rp.i >= rp.frames.length) rp.i = 0; }
    rp.i = BR.clamp(rp.i, 0, rp.frames.length - 1);
    var f = rp.frames[rp.i | 0];
    A.world.restore(f);
    for (var i = 0; i < A.world.nE; i++) A.world.st[i] = f.st[i];
    A.world.updateActive();
    $('rpSlider').value = (rp.i / Math.max(1, rp.frames.length - 1) * 100).toFixed(1);
    $('rpT').textContent = f.t.toFixed(2) + ' s';
  };

  /* ============================ 报告 ============================ */
  A.makeReport = function () {
    var w = A.world, st = A.st, m = A.meta, env = A.env;
    var ev = w.log.items.filter(function (x) { return x.level >= 2; });
    var mech = A.classifyMechanism();
    var e = w.energy();
    st.report = {
      t: w.t, collapseT: st.collapseT, mech: mech, events: ev.slice(0, 60),
      firstFail: st.firstFail, broken: w.brokenCount, nE: w.nE,
      peak: JSON.parse(JSON.stringify(st.peak)),
      energy: { KE: e.KE, SE: e.SE, plastic: w.diss.plastic, fracture: w.diss.fracture, contact: w.diss.contact, damp: w.diss.damp },
      env: {
        wind: env.wind.U10, pga: env.quake ? env.quake.pga : 0, flood: env.floodRise,
        ru: env.ru, scour: env.scour.length ? env.scour[0].ys : 0, slide: env.slide.u,
        years: st.years, temp: w.dTuniform, over: w.traffic ? w.traffic.overload : 1
      }
    };
  };
  A.classifyMechanism = function () {
    var w = A.world, st = A.st, cnt = {}, i;
    for (i = 0; i < w.nE; i++) if (w.st[i] === BR.ST.BROKEN || w.st[i] === BR.ST.BUCKLED) {
      var n = w.eName[i] || w.matKeys[w.mid[i]];
      cnt[n] = (cnt[n] || 0) + 1;
    }
    var arr = Object.keys(cnt).map(function (k) { return { k: k, v: cnt[k] }; }).sort(function (a, b) { return b.v - a.v; });
    var lost = 0; for (i = 0; i < w.bearings.length; i++) if (w.bearings[i].lost) lost++;
    var ph = 0; for (i = 0; i < w.nH; i++) if (w.hSt[i] === 2) ph++;
    var head = '';
    if (lost > 0) head = '落梁型（支座相对位移超过支承长度）';
    else if (ph > 0) head = '塑性铰机构型（墩/塔/拱肋抗弯能力丧失）';
    else if (arr.length && /索/.test(arr[0].k)) head = '拉索连锁断裂型（拉链式破坏）';
    else if (arr.length && /弦杆|腹杆|拱肋/.test(arr[0].k)) head = '构件压屈/断裂引发的渐进倒塌';
    else if (A.env.slide.u > 1) head = '地基失稳型（滑坡/侧向流动拖动基础）';
    else head = '综合型';
    return { head: head, top: arr.slice(0, 8), lost: lost, hinges: ph };
  };

      L.push('');

    } else L.push('（本次模拟未发生垮塌）');

/* ===== 88-selftest.js ===== */
/* =============================================================================
 * 桥匠 BRIDGEWRIGHT · 88-selftest.js
 * 仅当 URL 带 ?selftest=1 时运行：在真实浏览器环境里做端到端自检，
 * 结果写入 #selftest 与 document.title，便于 headless 验证。正常使用不受影响。
 * ========================================================================== */
'use strict';
var BR = (typeof BR !== 'undefined') ? BR : {};

BR.selfTest = function () {
  var out = [], fail = 0;
  var ok = function (name, cond, info) {
    out.push((cond ? 'PASS' : 'FAIL') + ' | ' + name + ' | ' + (info || ''));
    if (!cond) fail++;
  };
  var t0 = performance.now();
  try {
    // 1) 渲染器
    var A = BR.APP;
    ok('WebGL2 上下文与着色器', !!(A.gl && A.gl.ok && A.gl.progs.tube), 'progs=' + Object.keys(A.gl ? A.gl.progs : {}).join(','));
    var glerr = A.gl.gl.getError();
    ok('GL 无错误', glerr === 0, 'getError=' + glerr);

    // 2) 引擎验证套件
    var V = BR.runValidation();
    ok('验证套件全部通过', V.pass === V.total, V.pass + '/' + V.total + '，耗时 ' + V.ms.toFixed(0) + ' ms');
    if (V.pass !== V.total) V.items.forEach(function (r) {
      if (!r.pass) out.push('     ↳ 未通过：' + r.group + '/' + r.name + ' ref=' + r.ref + ' num=' + r.num + ' err=' + (r.err * 100).toFixed(2) + '%');
    });

    // 3) 全部 场景×桥型 构建（短找形）不出现 NaN
    var scs = BR.SCENARIOS.map(function (s) { return s.id; });
    var tps = BR.TEMPLATES.map(function (s) { return s.id; });
    var worst = { defl: 0, name: '' }, nanCnt = 0, built = 0;
    for (var a = 0; a < scs.length; a++) for (var b = 0; b < tps.length; b++) {
      var r = BR.buildBridge(scs[a], tps[b], {});
      var w = r.world;
      BR.formFind(w, { ramp: 900, steps: 900, tune: 0, tol: 1e-3 });
      var bad = false, i;
      for (i = 0; i < w.N; i++) if (!isFinite(w.x[i] + w.y[i] + w.z[i])) { bad = true; break; }
      if (bad) { nanCnt++; out.push('     ↳ NaN: ' + scs[a] + '/' + tps[b]); }
      built++;
    }
    ok('36 个 场景×桥型 组合均可构建且无 NaN', nanCnt === 0, '构建 ' + built + ' 个，NaN ' + nanCnt);

    // 4) 主场景成桥质量
    var r2 = BR.buildBridge('gorge', 'suspension', {});
    var w2 = r2.world;
    var ff = BR.formFind(w2, { ramp: 5000, steps: 8000, tune: 1, tol: 2e-4 });
    var m2 = BR.APP.measureBuiltFor ? BR.APP.measureBuiltFor(w2) : null;
    var defl = 0;
    for (var q = 0; q < w2.deckStations.length; q++) {
      var st = w2.deckStations[q], d = w2.y[st.nA] - w2.Y0[st.nA];
      if (Math.abs(d) > Math.abs(defl)) defl = d;
    }
    ok('悬索桥成桥挠度 < L/400', Math.abs(defl) < r2.meta.design.mainSpan / 400,
      'defl=' + defl.toFixed(3) + ' m，L/400=' + (r2.meta.design.mainSpan / 400).toFixed(2) + ' m，残差=' + ff.resid.toExponential(1));
    ok('成桥最大应力比 < 1.35', ff.maxUtil < 1.35, 'maxUtil=' + ff.maxUtil.toFixed(3));

    // 5) 灾害加载不产生 NaN，并能触发破坏
    var env2 = r2.env;
    env2.wind.U10 = 60;
    env2.makeQuake({ pga: 0.6, mw: 7.4, pulse: true, Tp: 4, dur: 20, fg: 1.6, zg: 0.65, seed: 7 });
    env2.setWave(6, 12);
    for (var s2 = 0; s2 < 220; s2++) { env2.prepFrame(w2, 1 / 60); w2.advance(1 / 60, 60); }
    var bad2 = false;
    for (i = 0; i < w2.N; i++) if (!isFinite(w2.x[i] + w2.y[i] + w2.z[i])) { bad2 = true; break; }
    ok('极端多灾耦合 3.7 s 后仍数值稳定', !bad2, '断裂单元 ' + w2.brokenCount + '，事件 ' + w2.log.items.length + ' 条');

    // 6) 人为切断 → 断索连锁可被记录
    var cut = 0;
    for (i = 0; i < w2.nE; i++) if (w2.act[i] && w2.typ[i] === BR.ET.CABLE && cut < 2) { w2.breakElem(i, 'selftest'); cut++; }
    for (s2 = 0; s2 < 60; s2++) { env2.prepFrame(w2, 1 / 60); w2.advance(1 / 60, 60); }
    ok('切断构件可被记录并继续求解', w2.brokenCount >= cut, 'broken=' + w2.brokenCount);

    // 7) 造价与文档数据完整
    var m = r2.meta;
    ok('造价表非空且量级合理', m.cost.rows.length > 6 && m.cost.total > 1e8 && m.cost.total < 5e10,
      '合计 ' + (m.cost.total / 1e8).toFixed(2) + ' 亿元，' + m.cost.rows.length + ' 行');
    ok('合格线条目 ≥ 15', (m.criteria || []).length >= 15, (m.criteria || []).length + ' 条');
    ok('破坏模式 ≥ 4', m.failure.length >= 4, m.failure.length + ' 条');
    ok('设计理由 ≥ 5', m.rationale.length >= 5, m.rationale.length + ' 条');

    // 8) 六桥型全部具备造价/破坏模式/施工阶段
    var lack = [];
    for (b = 0; b < tps.length; b++) {
      var rr = BR.buildBridge('estuary', tps[b], {});
      if (!rr.meta.failure.length || !rr.meta.stages.length || !rr.meta.cost.total) lack.push(tps[b]);
    }
    ok('六种桥型模板均完整（造价+破坏模式+施工阶段）', lack.length === 0, lack.join(',') || '全部完整');

    // 9) UI DOM 关键元素存在
    var ids = ['selSc', 'selTp', 'btnBuild', 'btnDoc', 'gl', 'hudTL', 'hudTR', 'log', 'cbarG', 'docBody', 'side',
      'sWind', 'sPga', 'sFlood', 'sYear', 'sTemp', 'bEqE2', 'bWRamp', 'bFCut', 'bRp', 'bCsv'];
    var miss = ids.filter(function (id) { return !document.getElementById(id); });
    ok('界面控件齐全', miss.length === 0, miss.length ? '缺失 ' + miss.join(',') : ids.length + ' 个关键控件');

    // 10) 文档六个页签均可渲染
    var tabs = ['val', 'asm', 'crt', 'cost', 'des', 'rep'], derr = [];
    tabs.forEach(function (k) {
      try { BR.APP.st.docTab = k; BR.APP.renderDoc(); if (document.getElementById('docBody').innerHTML.length < 200) derr.push(k + '(空)'); }
      catch (e) { derr.push(k + '(' + e.message + ')'); }
    });
    ok('技术文档 6 个页签均可渲染', derr.length === 0, derr.join(',') || '6/6');
  } catch (e) {
    out.push('FAIL | 自检异常 | ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]);
    fail++;
  }
  var ms = (performance.now() - t0).toFixed(0);
  var head = (fail === 0 ? 'SELFTEST-OK' : 'SELFTEST-FAIL(' + fail + ')') + ' in ' + ms + 'ms';
  var div = document.createElement('div');
  div.id = 'selftest';
  div.textContent = head + '\n' + out.join('\n');
  div.style.cssText = 'position:fixed;left:0;top:0;width:100%;max-height:100%;overflow:auto;background:#000;color:#0f0;' +
    'font:11px Consolas,monospace;white-space:pre;z-index:9999;padding:6px';
  document.body.appendChild(div);
  document.title = head;
  return head;
};

  window.addEventListener('unhandledrejection', function (e) { BR.__errs.push('REJECT: ' + e.reason); });

/* ?probe=N —— 让交互主循环真实跑 N 秒（虚拟时间），然后把运行状态与异常写入 DOM */
if (typeof window !== 'undefined' && /probe/.test(location.search)) {
  window.addEventListener('load', function () {
    var need = parseFloat((location.search.match(/probe=([\d.]+)/) || [0, 240])[1]) || 240;
    var qs = location.search.match(/sc=(\w+)/), qt = location.search.match(/tp=(\w+)/);
    if (qs || qt) {
      if (qs) { BR.APP.st.scId = qs[1]; document.getElementById('selSc').value = qs[1]; }
      if (qt) { BR.APP.st.tpId = qt[1]; document.getElementById('selTp').value = qt[1]; }
      BR.APP.build();
    }
    var frames = 0;
    var tick = function () {
      frames++;
      // ?hz=1 —— 在第 90 帧施加 E2 近断层地震 + 台风 + 1/1000 洪水 + 4 倍超载，检验垮塌链与报告
      if (/hz=1/.test(location.search) && frames === 90) {
        var A3 = BR.APP;
        A3.st.timeScale = 1;
        A3.setWind(A3.sc.criteria.Ud * 1.3); A3.env.wind.gust = 1.3;
        A3.quake(Math.max(0.6, A3.sc.criteria.seismicE2), true);
        A3.setFlood(1000);
        if (A3.world.traffic) A3.world.traffic.overload = 4;
      }
      if (frames < need) { requestAnimationFrame(tick); return; }
      BR.__stop = 1;
      document.title = 'PROBE-REACHED frames=' + frames;
      var A = BR.APP, w = A.world, m = A.meta, s = [];
      var nan = false, i;
      if (w) for (i = 0; i < w.N; i++) if (!isFinite(w.x[i] + w.y[i] + w.z[i])) { nan = true; break; }
      s.push('PROBE frames=' + frames + ' phase=' + A.st.phase + ' t=' + (w ? w.t.toFixed(2) : '—') +
        ' rtf=' + (A.st.rtf || 0).toFixed(2) + ' sub=' + (w ? w.lastSub : '—') + ' nan=' + nan);
      s.push('build=' + (m ? m.name : '—') + ' nodes=' + (w ? w.N : 0) + ' elems=' + (w ? w.nE : 0) +
        ' broken=' + (w ? w.brokenCount : 0) + ' modal=' + (m && m.modal ? m.modal.fv.toFixed(3) + '/' + m.modal.ft.toFixed(3) : '—'));
      s.push('built=' + (m && m.built ? ('defl=' + m.built.defl.toFixed(3) + ' util=' + m.built.maxUtil.toFixed(2) + ' resid=' + m.built.resid.toExponential(1)) : 'n/a'));
      s.push('traffic=' + (w && w.traffic ? w.traffic.veh.length : 0) + ' replayFrames=' + A.st.replay.frames.length +
        ' hudLen=' + (document.getElementById('hudTL').textContent || '').length +
        ' gl=' + (A.gl && A.gl.ok ? A.gl.gl.getError() : 'no'));
      // 渲染证据：统计已提交的构件数 + 关键节点的屏幕坐标 + 画面像素分布
      try {
        var A2 = BR.APP, g2 = A2.gl, w2 = A2.world;
        var ndc = function (nd) {
          var M = g2.vp, X = w2.x[nd], Y = w2.y[nd], Z = w2.z[nd];
          var cx = M[0]*X+M[4]*Y+M[8]*Z+M[12], cy = M[1]*X+M[5]*Y+M[9]*Z+M[13], cwv = M[3]*X+M[7]*Y+M[11]*Z+M[15];
          return cwv > 0 ? [(cx/cwv).toFixed(2), (cy/cwv).toFixed(2)] : ['behind','behind'];
        };
        var sts2 = w2.deckStations, mid2 = sts2[Math.floor(sts2.length/2)];
        var tow = -1, ty = -1e9;
        for (var k4 = 0; k4 < w2.N; k4++) if (w2.tag[k4] === 'tower' && w2.Y0[k4] > ty) { ty = w2.Y0[k4]; tow = k4; }
        s.push('drawnMembers=' + g2.mCount + '/' + w2.nE + '  midDeckNDC=' + ndc(mid2.nA).join(',') +
               '  towerTopNDC=' + (tow >= 0 ? ndc(tow).join(',') : '-'));
        var cv = A2.canvas, gl2 = g2.gl;
        var W = cv.width, H = cv.height, bw = 240, bh = 160;
        var px = new Uint8Array(bw * bh * 4);
        gl2.readPixels((W - bw) >> 1, (H - bh) >> 1, bw, bh, gl2.RGBA, gl2.UNSIGNED_BYTE, px);
        var hist = {}, nn2 = 0;
        for (var q4 = 0; q4 < bw * bh; q4++) {
          var key = (px[q4*4]>>5) + '-' + (px[q4*4+1]>>5) + '-' + (px[q4*4+2]>>5);
          hist[key] = (hist[key] || 0) + 1; nn2++;
        }
        var ks = Object.keys(hist).sort(function(a2,b2){return hist[b2]-hist[a2];});
        s.push('centerPixels distinctBuckets=' + ks.length + ' top5=' +
               ks.slice(0,5).map(function(k5){return k5+':'+(hist[k5]/nn2*100).toFixed(1)+'%';}).join(' '));
      } catch (e2) { s.push('renderCheck FAILED: ' + e2.message); }
      var bn = {}; if (w) for (i = 0; i < w.nE; i++) if (w.st[i] === 3) { var k2 = w.eName[i] || w.matKeys[w.mid[i]]; bn[k2] = (bn[k2] || 0) + 1; }
      s.push('brokenBy=' + Object.keys(bn).map(function (k3) { return k3 + '×' + bn[k3]; }).join(', ') + ' wind=' + (BR.APP.env ? BR.APP.env.wind.U10.toFixed(1) : '-'));
      s.push('collapsed=' + BR.APP.st.collapsed + ' collapseT=' + (BR.APP.st.collapseT||0).toFixed(2) +
        ' report=' + (BR.APP.st.report ? BR.APP.st.report.mech.head : 'none') + ' events=' + BR.APP.world.log.items.length);
      s.push('errors=' + BR.__errs.length + (BR.__errs.length ? '\n' + BR.__errs.join('\n') : ''));
      window.__probeText = s.join('\n');
      var d = document.createElement('div');
      d.id = 'probe'; d.textContent = s.join('\n');
      d.style.cssText = 'position:fixed;left:0;bottom:0;background:#000;color:#0ff;font:11px Consolas;white-space:pre;z-index:9999;padding:5px';
      document.body.appendChild(d);
      document.title = (BR.__errs.length ? 'PROBE-ERR' : 'PROBE-OK') + ' phase=' + A.st.phase + ' frames=' + frames;
    };
    requestAnimationFrame(tick);
  });
}

if (typeof window !== 'undefined') window.BR = BR;
})();
</script>
