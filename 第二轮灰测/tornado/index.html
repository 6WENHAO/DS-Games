<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TORNADO · 写实龙卷风三场景实时演示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<!-- 加载遮罩 -->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-title">T O R N A D O</div>
    <div class="boot-sub">体积化涡旋着色器 · 频谱海洋 · 统一光影</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <div class="boot-msg" id="bootMsg">初始化 WebGL2 …</div>
  </div>
</div>

<!-- 顶部：场景切换 -->
<header id="topbar">
  <div class="brand"><b>TORNADO</b><span>realtime volumetric</span></div>
  <nav id="sceneTabs">
    <button data-scene="ocean">大海</button>
    <button data-scene="desert">沙漠</button>
    <button data-scene="plain">平原</button>
  </nav>
  <div class="top-actions">
    <select id="presetSel" title="龙卷风预设"></select>
    <button id="btnStrike" title="让龙卷风扑向镜头前方的建筑">召唤打击</button>
    <button id="btnRebuild" title="修复所有被摧毁的物体">重建场景</button>
    <button id="btnPanel" title="显示/隐藏参数面板 (H)">参数</button>
  </div>
</header>

<!-- 右侧参数面板 -->
<aside id="panel"></aside>

<!-- 左下角统计 -->
<div id="stats"></div>

<!-- 底部提示 -->
<div id="hint">
  <span><kbd>拖拽</kbd> 环视</span><span><kbd>滚轮</kbd> 缩放</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换场景</span>
  <span><kbd>C</kbd> 镜头模式</span><span><kbd>Space</kbd> 打击</span><span><kbd>H</kbd> 面板</span><span><kbd>P</kbd> 暂停</span>
</div>

<!-- 自检输出（无头测试用 --dump-dom 读取） -->
<pre id="diag" hidden></pre>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/": "./vendor/",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module">
  // 早期错误也要能在无头环境里被看到
  const diag = document.getElementById('diag');
  window.__DIAG = [];
  window.__diag = (m) => { window.__DIAG.push(String(m)); diag.textContent = window.__DIAG.join('\n'); };
  window.addEventListener('error', (e) => {
    window.__diag('JS-ERROR: ' + (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno);
    const bm = document.getElementById('bootMsg');
    if (bm) { bm.textContent = '运行错误：' + e.message; bm.style.color = '#ff6b6b'; }
  });
  window.addEventListener('unhandledrejection', (e) => {
    window.__diag('PROMISE-REJECT: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
    const bm = document.getElementById('bootMsg');
    if (bm) { bm.textContent = '模块加载失败：' + (e.reason && e.reason.message || e.reason); bm.style.color = '#ff6b6b'; }
  });
  const err0 = console.error.bind(console);
  console.error = (...a) => { window.__diag('CONSOLE-ERROR: ' + a.map(x => (x && x.message) || String(x)).join(' ').slice(0, 900)); err0(...a); };
  const warn0 = console.warn.bind(console);
  console.warn = (...a) => { window.__diag('CONSOLE-WARN: ' + a.map(String).join(' ').slice(0, 400)); warn0(...a); };
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
