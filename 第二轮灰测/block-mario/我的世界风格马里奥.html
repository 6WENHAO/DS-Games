<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>方块冒险 · Block Adventure</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hide">
  <div id="topbar">
    <div class="panel">
      <div id="hearts" class="hearts"></div>
    </div>
    <div class="panel mid">
      <span id="lvlText">第一关</span>
    </div>
    <div class="panel">
      <span class="lab">得分</span><b id="scoreText">0</b>
      <span class="lab">宝石</span><b id="gemText">0</b>
      <span class="lab">时间</span><b id="timeText">0:00</b>
    </div>
  </div>
  <div id="hint" class="hide"></div>
  <div id="keys">
    <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> 移动 ·
    <kbd>空格</kbd> 跳跃(长按跳更高) · <kbd>Shift</kbd> 疾跑 ·
    <kbd>W</kbd>/<kbd>S</kbd> 爬梯 · <kbd>ESC</kbd> 暂停 · <kbd>M</kbd> 静音
    <span id="fps" class="dim"></span>
  </div>
</div>

<!-- ============ 菜单 ============ -->
<div id="menu">
  <div class="mcPanel">
    <h1>方块冒险</h1>
    <div class="sub">BLOCK ADVENTURE · 我的世界风格横版闯关</div>
    <div id="levelList"></div>
    <div class="help">
      踩在怪物头上消灭它们 · 顶奖励块拿绿宝石 · 抵达旗帜或末地传送门过关<br>
      <b>按 空格 从第一关开始，或按 1~4 直接选关</b>
    </div>
  </div>
</div>

<!-- ============ 暂停 ============ -->
<div id="pauseBox" class="hide modal">
  <div class="mcPanel narrow">
    <h2>已暂停</h2>
    <div class="center dim">按 <kbd>ESC</kbd> 继续</div>
  </div>
</div>

<!-- ============ 结算 ============ -->
<div id="overlay" class="hide modal">
  <div class="mcPanel narrow">
    <h2 id="ovTitle">结算</h2>
    <div id="ovBody" class="center"></div>
    <div class="center"><button id="ovBtn" class="btn">返回菜单 (R)</button></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script>
  window.addEventListener('load', function () { G.Game.init(document.getElementById('game')); });
</script>
</body>
</html>
