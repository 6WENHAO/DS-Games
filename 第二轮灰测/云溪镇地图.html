<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云溪镇 · 江南水乡全境图</title>
<style>
/* ============ 主题变量：以「时辰」切换全图色调 ============ */
:root{
  --ink:#2c2a26; --ink2:#5b564c; --ink3:#8b8375;
  --paper:#f4efe4; --paper2:#ebe4d5; --line:#d8cfba;
  --land:#eae3d0; --land2:#e2dac4;
  --water:#9fc6d8; --water2:#7fb0c8; --waterline:#5d93ae;
  --roof:#8d9aa0; --roof2:#78878e; --ridge:#5c686e; --wall:#efe9dd; --court:#e6dfcd;
  --road:#ded6c2; --roadline:#c6bca4;
  --field:#cfd8ab; --field2:#bccb96; --mulberry:#a8bf82; --bamboo:#8fb573;
  --stone:#d9d2c2; --stone2:#b9b1a0;
  --glow:0; --nightveil:0;
  --c-market:#c2703a; --c-craft:#8a6db8; --c-civic:#2f7f96; --c-temple:#b4453c;
  --c-edu:#3a8a62; --c-house:#8b8478; --c-garden:#4e9a4e; --c-bridge:#b8963f;
  --c-water:#4a8cb8; --c-road:#948972; --c-farm:#7d9a3f; --c-misc:#7a7a7a;
}
body[data-time="晨"]{
  --land:#e9e6d6; --land2:#e0ddca; --water:#b9d3dc; --water2:#9dc0cf;
  --roof:#96a1a6; --roof2:#828e95; --paper:#f6f2e8; --field:#d5dcb2;
}
body[data-time="暮"]{
  --land:#e6d8bc; --land2:#dccdaf; --water:#8fb0be; --water2:#6f94a8; --waterline:#527e94;
  --roof:#8a8b88; --roof2:#767674; --ridge:#565553; --wall:#ecdfc9;
  --field:#c9c894; --field2:#b6b681; --paper:#f3ead8; --glow:.55;
}
body[data-time="夜"]{
  --ink:#e8e3d6; --ink2:#c3bcac; --ink3:#9a9385;
  --paper:#1e232b; --paper2:#252b34; --line:#3a4250;
  --land:#39414c; --land2:#333b45;
  --water:#25384a; --water2:#1c2c3c; --waterline:#4d7d9c;
  --roof:#4a545e; --roof2:#3e4750; --ridge:#2b323a; --wall:#5b6470; --court:#414a55;
  --road:#4b5260; --roadline:#5c6474;
  --field:#3c4a3c; --field2:#354235; --mulberry:#3f5040; --bamboo:#3a5240;
  --stone:#5a6270; --stone2:#454d59;
  --glow:1; --nightveil:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",sans-serif;
  color:var(--ink); background:var(--paper);
  transition:background .5s;
  overflow:hidden;
}
.serif{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif}

/* ============ 顶栏 ============ */
.topbar{
  height:56px; display:flex; align-items:center; gap:14px; padding:0 16px;
  background:linear-gradient(180deg,var(--paper2),var(--paper));
  border-bottom:1px solid var(--line); position:relative; z-index:30;
}
.brand{display:flex; align-items:baseline; gap:10px; white-space:nowrap}
.brand h1{
  font-family:"Songti SC","STSong","SimSun",serif; font-size:22px; margin:0;
  letter-spacing:.22em; font-weight:700;
}
.brand .sub{font-size:12px; color:var(--ink3); letter-spacing:.08em}
.seal{
  width:34px;height:34px;border-radius:5px;background:#a8342a;color:#fff;
  display:grid;place-items:center;font-family:"Songti SC",serif;font-size:11px;
  line-height:1.05;text-align:center;letter-spacing:0;box-shadow:0 1px 4px rgba(0,0,0,.25);
  flex:0 0 auto;
}
.spacer{flex:1}
.tbtns{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{
  border:0;background:transparent;color:var(--ink2);padding:6px 11px;cursor:pointer;
  font-size:13px;font-family:inherit;border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.btn{
  border:1px solid var(--line);background:var(--paper);color:var(--ink2);
  padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;
}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ============ 布局 ============ */
.app{display:flex; height:calc(100% - 56px)}
.side{
  width:296px; flex:0 0 296px; border-right:1px solid var(--line);
  background:var(--paper2); display:flex; flex-direction:column; min-height:0;
}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{
  flex:1;border:0;background:transparent;padding:10px 4px;cursor:pointer;
  font-size:13px;color:var(--ink3);font-family:inherit;border-bottom:2px solid transparent;
}
.tabs button.on{color:var(--ink);border-bottom-color:#a8342a;font-weight:600}
.tabwrap{flex:1;overflow-y:auto;min-height:0}
.tabpane{display:none;padding:12px}
.tabpane.on{display:block}
.searchbox{position:relative;margin-bottom:10px}
.searchbox input{
  width:100%;padding:8px 30px 8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:13px;
}
.searchbox input:focus{outline:none;border-color:var(--ink3)}
.searchbox .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  color:var(--ink3);cursor:pointer;font-size:15px;padding:2px 5px;
}
.grp{margin-bottom:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.grp>summary{
  cursor:pointer;padding:7px 10px;font-size:13px;display:flex;align-items:center;gap:8px;
  list-style:none;user-select:none;
}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"▾";margin-left:auto;color:var(--ink3);font-size:11px}
.grp[open]>summary::after{content:"▴"}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
.cnt{color:var(--ink3);font-size:11px}
.grp ul{list-style:none;margin:0;padding:0 0 4px}
.grp li{
  padding:5px 10px 5px 28px;font-size:12.5px;cursor:pointer;color:var(--ink2);
  display:flex;gap:6px;align-items:baseline;
}
.grp li:hover{background:var(--paper2);color:var(--ink)}
.grp li.sel{background:var(--ink);color:var(--paper)}
.grp li .ty{font-size:11px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.grp li.sel .ty{color:var(--paper)}
.lyr{
  display:flex;align-items:center;gap:9px;padding:6px 9px;font-size:13px;cursor:pointer;
  border-radius:7px;user-select:none;
}
.lyr:hover{background:var(--paper)}
.lyr input{accent-color:#a8342a;cursor:pointer;margin:0}
.lyr .cnt{margin-left:auto}
.lyr.off{opacity:.45}
.zhi h3{font-size:14px;margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line);letter-spacing:.08em}
.zhi h3:first-child{margin-top:0}
.zhi p{font-size:12.5px;line-height:1.85;color:var(--ink2);margin:0 0 9px;text-indent:2em;text-align:justify}
.zhi .tl{list-style:none;margin:0;padding:0}
.zhi .tl li{
  font-size:12.5px;line-height:1.7;padding:0 0 9px 15px;border-left:2px solid var(--line);
  margin-left:5px;position:relative;color:var(--ink2);
}
.zhi .tl li::before{
  content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;
  background:#a8342a;box-shadow:0 0 0 2px var(--paper2);
}
.zhi .tl b{color:var(--ink);font-family:"Songti SC",serif;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .v{font-size:19px;font-family:"Songti SC",serif;line-height:1.2}
.stat .k{font-size:11px;color:var(--ink3);margin-top:2px}
.four{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px;line-height:1.7;color:var(--ink2)}
.four div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.four b{color:var(--ink);font-family:"Songti SC",serif}

/* ============ 舞台 ============ */
.stage{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--land2)}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.hud{position:absolute;z-index:12;user-select:none}
.compass{right:14px;top:14px;width:62px;height:62px;opacity:.9;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.scalebar{
  left:14px;bottom:14px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:11px;color:var(--ink2);
}
.scalebar .bar{
  height:7px;border:1px solid var(--ink2);border-top:0;margin-top:3px;position:relative;
  background:linear-gradient(90deg,var(--ink2) 0 25%,transparent 25% 50%,var(--ink2) 50% 75%,transparent 75%);
}
.zoombox{right:14px;bottom:14px;display:flex;flex-direction:column;gap:5px}
.zoombox button{
  width:32px;height:32px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);
  border-radius:8px;cursor:pointer;font-size:15px;font-family:inherit;line-height:1;
  display:grid;place-items:center;
}
.zoombox button:hover{border-color:var(--ink3);color:var(--ink)}
.legend{
  position:absolute;left:14px;top:14px;z-index:12;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;max-width:214px;
  font-size:11.5px;color:var(--ink2);backdrop-filter:blur(3px);
}
.legend h4{margin:0 0 7px;font-size:12px;letter-spacing:.12em;color:var(--ink);font-weight:600}
.legend .items{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.legend .it{display:flex;align-items:center;gap:5px;cursor:pointer;padding:1px 2px;border-radius:4px}
.legend .it:hover{background:var(--paper2)}
.legend .it.off{opacity:.38;text-decoration:line-through}
.legend .sym{width:12px;height:9px;border-radius:2px;flex:0 0 auto}
.legend .fold{margin-top:6px;border-top:1px dashed var(--line);padding-top:5px;font-size:11px;color:var(--ink3);line-height:1.6}
.tip{
  position:absolute;z-index:40;pointer-events:none;opacity:0;transition:opacity .1s;
  background:rgba(28,26,22,.93);color:#f6f1e6;padding:5px 9px;border-radius:6px;
  font-size:12px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.tip b{font-family:"Songti SC",serif;letter-spacing:.06em}
.tip i{font-style:normal;color:#c8bfa8;margin-left:6px;font-size:11px}
.panel{
  position:absolute;right:14px;top:88px;width:288px;z-index:20;
  background:color-mix(in srgb,var(--paper) 96%,transparent);
  border:1px solid var(--line);border-radius:11px;box-shadow:0 6px 26px rgba(0,0,0,.18);
  padding:14px;transform:translateX(115%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  max-height:calc(100% - 160px);overflow-y:auto;backdrop-filter:blur(4px);
}
.panel.on{transform:none}
.panel .x{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:17px}
.panel .badge{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;color:#fff;letter-spacing:.05em;
}
.panel h2{
  font-family:"Songti SC","STSong",serif;font-size:20px;margin:8px 0 3px;letter-spacing:.1em;font-weight:700;
}
.panel .ty{font-size:12px;color:var(--ink3);margin-bottom:10px}
.panel dl{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.panel dt{color:var(--ink3)}
.panel dd{margin:0;color:var(--ink2)}
.panel .desc{font-size:12.5px;line-height:1.85;color:var(--ink2);text-align:justify;border-top:1px dashed var(--line);padding-top:9px}
.panel .acts{display:flex;gap:6px;margin-top:11px}
.help{
  position:absolute;inset:0;z-index:50;background:rgba(20,18,16,.62);display:none;place-items:center;
  backdrop-filter:blur(2px);
}
.help.on{display:grid}
.help .card{
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 24px;
  max-width:440px;color:var(--ink2);font-size:13px;line-height:1.9;
}
.help h3{margin:0 0 10px;font-family:"Songti SC",serif;letter-spacing:.14em;color:var(--ink)}
.help kbd{
  background:var(--paper2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink);
}
.help table{width:100%;border-collapse:collapse}
.help td{padding:3px 0;vertical-align:top}
.help td:first-child{width:120px;white-space:nowrap}

/* ============ SVG 图面样式 ============ */
#map text{user-select:none}
.landbase{fill:var(--land)}
.riv{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.riv-e{fill:none;stroke:var(--waterline);stroke-opacity:.55;stroke-linecap:round}
.ripple{fill:none;stroke:#fff;stroke-opacity:.24;stroke-width:1.1}
.pond{fill:var(--water);stroke:var(--waterline);stroke-opacity:.5;stroke-width:1.2}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.road-e{fill:none;stroke:var(--roadline);stroke-opacity:.85;stroke-linecap:round}
.slab{fill:none;stroke:var(--roadline);stroke-opacity:.5;stroke-width:.7;stroke-dasharray:3 5}
.bld .roof{fill:var(--roof);stroke:var(--ridge);stroke-opacity:.65;stroke-width:.9}
.bld .shadow{fill:rgba(60,52,40,.16)}
.bld .ridge{stroke:var(--ridge);stroke-width:1.5;stroke-opacity:.85;fill:none}
.bld .eave{stroke:#fff;stroke-opacity:.28;stroke-width:1}
.bld .court{fill:var(--court);stroke:var(--ridge);stroke-opacity:.4;stroke-width:.7}
.bld .wallline{stroke:var(--wall);stroke-opacity:.5;stroke-width:1;fill:none}
.bld{cursor:pointer}
.bld:hover .roof{filter:brightness(1.12)}
.bld.t2 .roof{fill:var(--roof2)}
.mhwall{fill:var(--wall);stroke:var(--ridge);stroke-opacity:.5;stroke-width:.7}
.c-market .roof{fill:color-mix(in srgb,var(--roof) 76%,var(--c-market))}
.c-craft  .roof{fill:color-mix(in srgb,var(--roof) 78%,var(--c-craft))}
.c-civic  .roof{fill:color-mix(in srgb,var(--roof) 78%,var(--c-civic))}
.c-temple .roof{fill:color-mix(in srgb,var(--roof) 70%,var(--c-temple))}
.c-edu    .roof{fill:color-mix(in srgb,var(--roof) 78%,var(--c-edu))}
.c-garden .roof{fill:color-mix(in srgb,var(--roof) 80%,var(--c-garden))}
.wallenc{fill:none;stroke:var(--stone2);stroke-width:2.4;stroke-opacity:.75;stroke-linejoin:round}
.gardenland{fill:color-mix(in srgb,var(--land) 70%,var(--c-garden) 18%);stroke:var(--stone2);stroke-opacity:.6;stroke-width:1.2}
.yard{fill:color-mix(in srgb,var(--land2) 82%,#c9b78a);stroke:var(--stone2);stroke-opacity:.55;stroke-width:1;stroke-dasharray:4 3}
.deck{fill:var(--stone);stroke:var(--stone2);stroke-width:1.1}
.arch{fill:none;stroke:var(--stone2);stroke-width:1.6;stroke-opacity:.9}
.step{stroke:var(--stone2);stroke-width:.7;stroke-opacity:.75}
.rail{stroke:var(--stone2);stroke-width:1.6;stroke-opacity:.95;fill:none}
.wharf{fill:var(--stone);stroke:var(--stone2);stroke-width:.9}
.tree-c{fill:var(--bamboo);fill-opacity:.9;stroke:#4f6b3c;stroke-opacity:.45;stroke-width:.8}
.tree-t{fill:#7fa055;fill-opacity:.92;stroke:#4a6634;stroke-opacity:.5;stroke-width:.8}
.tree-w{fill:#9dba6a;fill-opacity:.85}
.paddy{fill:var(--field);stroke:#9aa878;stroke-opacity:.7;stroke-width:.8}
.paddy-l{stroke:#8d9c6b;stroke-opacity:.55;stroke-width:.7;fill:none}
.mulb{fill:var(--mulberry);fill-opacity:.55;stroke:#8fa06c;stroke-opacity:.6;stroke-width:.8}
.mulb-d{fill:#6d8a4a;fill-opacity:.8}
.reed{stroke:#a4b57a;stroke-width:1;stroke-opacity:.8;fill:none}
.lotus{fill:#7fa863;fill-opacity:.75}
.grave{fill:#c7c0aa;stroke:#9a9280;stroke-width:.8;fill-opacity:.9}
.boat-b{fill:#8a6a45;stroke:#5c452c;stroke-width:.8}
.boat-a{fill:#d8cdb4;stroke:#7a6a4c;stroke-width:.7}
.lantern{opacity:calc(var(--glow));transition:opacity .5s}
.nightveil{opacity:calc(var(--nightveil)*.34);fill:#0b1a2e;pointer-events:none;transition:opacity .5s}
.lbl{
  font-family:"Songti SC","STSong","SimSun",serif;fill:var(--ink);
  paint-order:stroke;stroke:var(--paper);stroke-width:2.6px;stroke-linejoin:round;
  text-anchor:middle;pointer-events:none;
}
.lbl.s{font-size:10.5px;stroke-width:2.4px;fill:var(--ink2)}
.lbl.m{font-size:13px}
.lbl.l{font-size:16px;letter-spacing:.1em}
.lbl.xl{font-size:22px;letter-spacing:.3em;fill:var(--ink2);stroke-width:3.6px;opacity:.55}
.rlbl{
  font-family:"Songti SC","STSong",serif;font-size:12px;fill:var(--ink2);
  paint-order:stroke;stroke:var(--paper);stroke-width:2.6px;stroke-linejoin:round;
  letter-spacing:.26em;pointer-events:none;
}
.wlbl{
  font-family:"Songti SC","STSong",serif;font-size:15px;fill:#376f8c;
  paint-order:stroke;stroke:var(--paper);stroke-width:2.8px;stroke-linejoin:round;
  letter-spacing:.5em;pointer-events:none;font-style:italic;
}
body[data-time="夜"] .wlbl{fill:#8fc4e0}
.grid line{stroke:var(--ink3);stroke-opacity:.2;stroke-width:.7;stroke-dasharray:6 6}
.grid text{font-size:11px;fill:var(--ink3);fill-opacity:.75;font-family:"Songti SC",serif;text-anchor:middle}
.frame{fill:none;stroke:var(--ink3);stroke-opacity:.45;stroke-width:2}
#lyr-sel .ring{fill:none;stroke:#d4453a;stroke-width:2.4;stroke-dasharray:7 5}
#lyr-sel .ring2{fill:none;stroke:#fff;stroke-width:5;stroke-opacity:.5}
.hit{fill:transparent;cursor:pointer}
.riv-e,.ripple,.slab,.road-e,.frame,.paddy-l,.reed,.lotus,.mulb-d,.paddy,.mulb{pointer-events:none}
path.riv,path.road{cursor:pointer}
path.hilite{filter:drop-shadow(0 0 3px #d4453a)}
.mk{cursor:pointer}
.mk circle{stroke:#fff;stroke-width:1.2;stroke-opacity:.9}
/* 远近层级：缩小时隐去细碎标注 */
body:not(.z-near) .lbl.s{display:none}
body.z-far .lbl.m{display:none}
body.z-far .rlbl{display:none}
body:not(.z-far) .lbl.xl{display:none}
body.hide-label #lyr-label{display:none}
.hilite .roof{stroke:#d4453a;stroke-width:2;stroke-opacity:1}
@media print{
  .topbar,.side,.legend,.zoombox,.panel,.tip,.help{display:none!important}
  .app,.stage{height:100vh}
}
@media (max-width:900px){
  .side{width:230px;flex-basis:230px}
  .legend{display:none}
}
</style>
</head>
<body data-time="昼" class="z-mid">

<header class="topbar">
  <div class="seal serif">云溪<br>镇印</div>
  <div class="brand">
    <h1 class="serif">云溪镇</h1>
    <span class="sub serif">江南水乡全境图 · 附四乡郊野 · 比例约一比二千</span>
  </div>
  <div class="spacer"></div>
  <div class="tbtns">
    <div class="seg" id="timeSeg">
      <button data-t="晨">晨</button><button data-t="昼" class="on">昼</button><button data-t="暮">暮</button><button data-t="夜">夜</button>
    </div>
    <button class="btn on" id="btnLabel">标注</button>
    <button class="btn" id="btnGrid">方格</button>
    <button class="btn on" id="btnBoat">舟船</button>
    <button class="btn" id="btnFit">全境</button>
    <button class="btn" id="btnSvg">导出</button>
    <button class="btn" id="btnHelp">?</button>
  </div>
</header>

<div class="app">
  <aside class="side">
    <div class="tabs">
      <button class="on" data-tab="dir">地名录</button>
      <button data-tab="lyr">图层</button>
      <button data-tab="zhi">镇志</button>
    </div>
    <div class="tabwrap">
      <section class="tabpane on" id="pane-dir">
        <div class="searchbox">
          <input id="q" type="search" placeholder="搜地名、行当、街巷…（按 / 聚焦）" autocomplete="off">

/* 隐藏 svg 用于量测河道与街巷中线 */

const RP = {};
function addMeas(id,d){ const p=document.createElementNS(NS,"path"); p.setAttribute("d",d); meas.appendChild(p); RP[id]=p; }

const isVert = id => id !== "w-yunxi";
function ptOn(rid, at){                    // 沿河道求 x（横河）或 y（纵河）对应之点
  const p = RP[rid], L = p.getTotalLength(), v = isVert(rid);
  const g = l => { const q=p.getPointAtLength(l); return v?q.y:q.x; };
  const asc = g(L) > g(0);
  let lo=0, hi=L;
  for(let i=0;i<46;i++){ const m=(lo+hi)/2; if(asc ? g(m)<at : g(m)>at) lo=m; else hi=m; }
  const q = p.getPointAtLength((lo+hi)/2);
  return {x:q.x, y:q.y};
}
function midOf(id, f){ const p=RP[id]; const q=p.getPointAtLength(p.getTotalLength()*(f||0.5)); return {x:q.x,y:q.y}; }
const rivOf = id => RIVERS.find(r=>r.id===id);

function bld(o){

  s += '<rect class="shadow" x="'+(x+3)+'" y="'+(y+4)+'" width="'+w+'" height="'+h+'" rx="3"/>';
  s += '<rect class="roof" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3"/>';
  if(o.court && w>48 && h>42){
    const ix=Math.min(24,Math.max(9,w*0.2)), iy=Math.min(22,Math.max(8,h*0.19));
    s += '<rect class="court" x="'+(x+ix)+'" y="'+(y+iy)+'" width="'+(w-2*ix)+'" height="'+(h-2*iy)+'" rx="2"/>';
    s += '<path class="ridge" d="M'+(x+ix/2)+' '+(y+iy/2)+'H'+(x+w-ix/2)+'V'+(y+h-iy/2)+'H'+(x+ix/2)+'Z"/>';
  } else if(rid==="h"){
    s += '<line class="ridge" x1="'+(x+3)+'" y1="'+(y+h/2)+'" x2="'+(x+w-3)+'" y2="'+(y+h/2)+'"/>';
  } else {
    s += '<line class="ridge" x1="'+(x+w/2)+'" y1="'+(y+3)+'" x2="'+(x+w/2)+'" y2="'+(y+h-3)+'"/>';
  }
  if(rid==="h"){
    s += '<line class="eave" x1="'+(x+2)+'" y1="'+(y+2.6)+'" x2="'+(x+w-2)+'" y2="'+(y+2.6)+'"/>';
    s += '<line class="eave" x1="'+(x+2)+'" y1="'+(y+h-2.6)+'" x2="'+(x+w-2)+'" y2="'+(y+h-2.6)+'"/>';
  } else {
    s += '<line class="eave" x1="'+(x+2.6)+'" y1="'+(y+2)+'" x2="'+(x+2.6)+'" y2="'+(y+h-2)+'"/>';
    s += '<line class="eave" x1="'+(x+w-2.6)+'" y1="'+(y+2)+'" x2="'+(x+w-2.6)+'" y2="'+(y+h-2)+'"/>';
  }
  if(o.court || w>=76 || h>=76){          // 马头墙（山墙面）
    if(rid==="h"){
      s += '<rect class="mhwall" x="'+(x-1.6)+'" y="'+(y-1)+'" width="4.2" height="'+(h+2)+'" rx="1"/>';
      s += '<rect class="mhwall" x="'+(x+w-2.6)+'" y="'+(y-1)+'" width="4.2" height="'+(h+2)+'" rx="1"/>';
    } else {
      s += '<rect class="mhwall" x="'+(x-1)+'" y="'+(y-1.6)+'" width="'+(w+2)+'" height="4.2" rx="1"/>';
      s += '<rect class="mhwall" x="'+(x-1)+'" y="'+(y+h-2.6)+'" width="'+(w+2)+'" height="4.2" rx="1"/>';
    }
  }
  return s + '</g>';
}

function bridgeSvg(b){
  const p = ptOn(b.on,b.at), riv = rivOf(b.on), v = isVert(b.on);
  const L = b.len, W = b.dw;
  const x = v ? p.x-L/2 : p.x-W/2, y = v ? p.y-W/2 : p.y-L/2;
  const bw = v ? L : W, bh = v ? W : L;
  let s = '<g class="bld c-bridge" data-id="'+b.id+'">';
  s += '<rect class="deck" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="2.5"/>';
  if(b.kind==="arch"){
    const sp = riv.w*0.34;
    if(v){
      s += '<path class="arch" d="M'+p.x+' '+(y-1)+' Q'+(p.x-sp*0.9)+' '+p.y+' '+p.x+' '+(y+bh+1)+'" transform="translate('+(-L/2+2)+',0)"/>';
      s += '<path class="arch" d="M'+p.x+' '+(y-1)+' Q'+(p.x+sp*0.9)+' '+p.y+' '+p.x+' '+(y+bh+1)+'" transform="translate('+(L/2-2)+',0)"/>';
    } else {
      s += '<path class="arch" d="M'+(x-1)+' '+p.y+' Q'+p.x+' '+(p.y-sp*0.9)+' '+(x+bw+1)+' '+p.y+'" transform="translate(0,'+(-L/2+2)+')"/>';
      s += '<path class="arch" d="M'+(x-1)+' '+p.y+' Q'+p.x+' '+(p.y+sp*0.9)+' '+(x+bw+1)+' '+p.y+'" transform="translate(0,'+(L/2-2)+')"/>';
    }
  }
  const n = b.kind==="arch" ? 9 : 5;
  for(let i=1;i<n;i++){
    if(v){ const px=x+bw*i/n; s+='<line class="step" x1="'+px+'" y1="'+(y+1.5)+'" x2="'+px+'" y2="'+(y+bh-1.5)+'"/>'; }
    else { const py=y+bh*i/n; s+='<line class="step" x1="'+(x+1.5)+'" y1="'+py+'" x2="'+(x+bw-1.5)+'" y2="'+py+'"/>'; }
  }
  if(b.kind==="covered"){
    const inz=4;
    s += '<rect class="roof" x="'+(x+(v?6:-inz))+'" y="'+(y+(v?-inz:6))+'" width="'+(bw+(v?-12:2*inz))+'" height="'+(bh+(v?2*inz:-12))+'" rx="3"/>';
    if(v) s += '<line class="ridge" x1="'+(x+8)+'" y1="'+p.y+'" x2="'+(x+bw-8)+'" y2="'+p.y+'"/>';
    else  s += '<line class="ridge" x1="'+p.x+'" y1="'+(y+8)+'" x2="'+p.x+'" y2="'+(y+bh-8)+'"/>';
  } else {
    if(v){ s+='<line class="rail" x1="'+(x+2)+'" y1="'+(y+1.6)+'" x2="'+(x+bw-2)+'" y2="'+(y+1.6)+'"/><line class="rail" x1="'+(x+2)+'" y1="'+(y+bh-1.6)+'" x2="'+(x+bw-2)+'" y2="'+(y+bh-1.6)+'"/>'; }
    else { s+='<line class="rail" x1="'+(x+1.6)+'" y1="'+(y+2)+'" x2="'+(x+1.6)+'" y2="'+(y+bh-2)+'"/><line class="rail" x1="'+(x+bw-1.6)+'" y1="'+(y+2)+'" x2="'+(x+bw-1.6)+'" y2="'+(y+bh-2)+'"/>'; }
  }
  return s + hit(b.id,p.x,p.y,Math.max(W,18)) + '</g>';
}

function patch(f){
  const R = mul32(Math.abs(Math.round(f.x*7+f.y*13))+11);
  let s = "";
  if(f.k==="paddy"){
    s += '<rect class="paddy" x="'+f.x+'" y="'+f.y+'" width="'+f.w+'" height="'+f.h+'" rx="3"/>';
    const cols=Math.max(2,Math.round(f.w/120)), rows=Math.max(2,Math.round(f.h/100));
    for(let i=1;i<cols;i++){ const X=f.x+f.w*i/cols; s+='<line class="paddy-l" x1="'+X+'" y1="'+f.y+'" x2="'+X+'" y2="'+(f.y+f.h)+'" stroke-width="1.4"/>'; }
    for(let j=1;j<rows;j++){ const Y=f.y+f.h*j/rows; s+='<line class="paddy-l" x1="'+f.x+'" y1="'+Y+'" x2="'+(f.x+f.w)+'" y2="'+Y+'" stroke-width="1.4"/>'; }
    for(let Y=f.y+8;Y<f.y+f.h-5;Y+=10) s+='<line class="paddy-l" x1="'+(f.x+5)+'" y1="'+Y+'" x2="'+(f.x+f.w-5)+'" y2="'+Y+'" stroke-dasharray="2 7" stroke-opacity=".33"/>';
  } else if(f.k==="mulb"){
    s += '<rect class="mulb" x="'+f.x+'" y="'+f.y+'" width="'+f.w+'" height="'+f.h+'" rx="3"/>';
    for(let Y=f.y+11;Y<f.y+f.h-6;Y+=15) for(let X=f.x+11;X<f.x+f.w-6;X+=17)
      s += '<circle class="mulb-d" cx="'+(X+R()*3)+'" cy="'+(Y+R()*3)+'" r="'+(2.4+R()*1.2)+'"/>';
  } else if(f.k==="veg"){
    s += '<rect class="mulb" x="'+f.x+'" y="'+f.y+'" width="'+f.w+'" height="'+f.h+'" rx="3"/>';
    for(let Y=f.y+7;Y<f.y+f.h-4;Y+=8)
      s += '<line x1="'+(f.x+5)+'" y1="'+Y+'" x2="'+(f.x+f.w-5)+'" y2="'+Y+'" stroke="#6d8a4a" stroke-width="2.6" stroke-opacity=".5"/>';
  } else if(f.k==="bamboo"){
    for(let i=0;i<Math.round(f.w*f.h/260);i++){
      const X=f.x+R()*f.w, Y=f.y+R()*f.h;
      s += '<line x1="'+X+'" y1="'+Y+'" x2="'+(X+R()*4-2)+'" y2="'+(Y-9-R()*8)+'" stroke="var(--bamboo)" stroke-width="1.3" stroke-opacity=".9"/>';
    }
    for(let i=0;i<Math.round(f.w*f.h/900);i++)
      s += '<circle class="tree-c" cx="'+(f.x+R()*f.w)+'" cy="'+(f.y+R()*f.h)+'" r="'+(5+R()*4)+'"/>';
  } else if(f.k==="reed"){
    for(let i=0;i<Math.round(f.w*f.h/150);i++){
      const X=f.x+R()*f.w, Y=f.y+R()*f.h;
      s += '<path class="reed" d="M'+X+' '+Y+' q'+(R()*5-2.5)+' -6 '+(R()*7-3.5)+' -12"/>';
    }
  }
  return s;
}
function treeSvg(t){
  if(t.k==="c") return '<circle class="tree-c" cx="'+t.x+'" cy="'+t.y+'" r="'+t.r+'"/>'
    + '<circle class="tree-c" cx="'+(t.x+t.r*0.5)+'" cy="'+(t.y+t.r*0.4)+'" r="'+(t.r*0.7)+'"/>';

  return '<circle class="tree-t" cx="'+t.x+'" cy="'+t.y+'" r="'+t.r+'"/>'
    + '<circle class="tree-t" cx="'+(t.x-t.r*0.35)+'" cy="'+(t.y-t.r*0.3)+'" r="'+(t.r*0.62)+'"/>'
    + '<circle cx="'+t.x+'" cy="'+t.y+'" r="1.8" fill="#5b4326" fill-opacity=".7"/>';

let view = {x:VB.x, y:VB.y, w:VB.w, h:VB.h};
function clampView(){
  const minW = VB.w/16, maxW = VB.w*1.25;
  view.w = Math.max(minW, Math.min(maxW, view.w));
  view.h = view.w * (VB.h/VB.w);
  const mx = VB.w*0.55, my = VB.h*0.55;
  view.x = Math.max(VB.x-mx, Math.min(VB.x+VB.w+mx-view.w, view.x));
  view.y = Math.max(VB.y-my, Math.min(VB.y+VB.h+my-view.h, view.y));
}
function applyView(){
  clampView();
  svg.setAttribute("viewBox", view.x.toFixed(2)+" "+view.y.toFixed(2)+" "+view.w.toFixed(2)+" "+view.h.toFixed(2));
  const k = VB.w/view.w;
  document.body.classList.toggle("z-far",  k<1.2);
  document.body.classList.toggle("z-mid",  k>=1.2 && k<2.3);
  document.body.classList.toggle("z-near", k>=2.3);
  updScale();
  if(selId) drawRing(selId);
}
function updScale(){
  const rect = svg.getBoundingClientRect();
  const pxPerUnit = rect.width / view.w;
  const cand = [5,10,20,50,100,200,500,1000,2000];
  let best = cand[0];
  for(const m of cand){ const px = (m/U2M)*pxPerUnit; if(px<=170) best = m; }
  const px = (best/U2M)*pxPerUnit;
  $("scaleTxt").textContent = best>=1000 ? (best/1000)+" 公里" : best+" 米";
  $("scaleBar").style.width = Math.max(28,px).toFixed(0)+"px";
}
function zoomAt(clientX, clientY, k){
  const r = svg.getBoundingClientRect();
  const ux = view.x + (clientX-r.left)/r.width*view.w;
  const uy = view.y + (clientY-r.top)/r.height*view.h;
  const nw = Math.max(VB.w/16, Math.min(VB.w*1.25, view.w*k));
  const ratio = nw/view.w;
  view.x = ux - (ux-view.x)*ratio;
  view.y = uy - (uy-view.y)*ratio;
  view.w = nw;
  applyView();
}
let anim = null;
function flyTo(cx, cy, w){
  const from = {...view}, to = {x:cx-w/2, y:cy-(w*VB.h/VB.w)/2, w:w};
  const t0 = performance.now(), D = 480;
  if(anim) cancelAnimationFrame(anim);
  (function step(t){
    const p = Math.min(1,(t-t0)/D), e = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    view.x = from.x+(to.x-from.x)*e; view.y = from.y+(to.y-from.y)*e; view.w = from.w+(to.w-from.w)*e;
    applyView();
    if(p<1) anim = requestAnimationFrame(step);
  })(t0);
}
svg.addEventListener("wheel", e=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY*0.0013)); }, {passive:false});
let drag = null, moved = 0;
svg.addEventListener("pointerdown", e=>{
  if(e.button!==0) return;
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; moved = 0;
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  svg.classList.add("drag");
});
svg.addEventListener("pointermove", e=>{
  if(drag){
    const r = svg.getBoundingClientRect();
    const dx = (e.clientX-drag.x)/r.width*view.w, dy = (e.clientY-drag.y)/r.height*view.h;
    moved = Math.max(moved, Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y));
    view.x = drag.vx-dx; view.y = drag.vy-dy; applyView();
  } else showTip(e);
});
svg.addEventListener("pointerup", e=>{ drag=null; svg.classList.remove("drag"); if(moved<5) pick(e); });
svg.addEventListener("pointerleave", ()=>{ hideTip(); });

const tip = $("tip");
function targetId(e){ const el = e.target.closest && e.target.closest("[data-id]"); return el ? el.getAttribute("data-id") : null; }
function placeTip(e){
  const r = svg.getBoundingClientRect();
  tip.style.opacity = 1;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(r.width-tw-8, Math.max(4, e.clientX-r.left+14))+"px";
  tip.style.top  = Math.max(4, e.clientY-r.top-th-12)+"px";
}
function showTip(e){
  const id = targetId(e), d = id && REG[id];
  if(!d){
    const h = e.target.closest && e.target.closest("#lyr-house .bld");
    if(h){ tip.innerHTML = '<b>寻常民居</b><i>民居 · 一户人家</i>'; placeTip(e); return; }
    hideTip(); return;
  }
  tip.innerHTML = '<b>'+esc(d.n)+'</b><i>'+esc(CATS[d.c].n+(d.t?" · "+d.t:""))+'</i>';
  placeTip(e);
}
function hideTip(){ tip.style.opacity = 0; }
let selId = null;
function drawRing(id){
  const d = REG[id]; const g = $("lyr-sel"); if(!d){ g.innerHTML=""; return; }
  const r = Math.max(16, Math.min(90, d.fw*0.09));
  g.innerHTML = '<circle class="ring2" cx="'+d.cx+'" cy="'+d.cy+'" r="'+r+'"/><circle class="ring" cx="'+d.cx+'" cy="'+d.cy+'" r="'+r+'"/>';
}

  const d = REG[id]; if(!d) return;
  selId = id; drawRing(id);

  p.innerHTML = '<span class="badge" style="background:'+CATS[d.c].c+'">'+esc(CATS[d.c].n)+'</span>'
    + '<h2 class="serif">'+esc(d.n)+'</h2>'
    + '<div class="ty">'+esc(d.t||"—")+'　·　图上位置 '+coord(d.cx,d.cy)+'</div>'
    + '<dl><dt>始建</dt><dd>'+esc(d.yr)+'</dd><dt>主事</dt><dd>'+esc(d.who)+'</dd></dl>'
    + '<div class="desc">'+esc(d.s)+'</div>'
    + '<div class="acts"><button class="btn" id="actZoom">图上定位</button><button class="btn" id="actNear">近邻</button></div>';
  $("panel").classList.add("on");
  $("actZoom").onclick = ()=>flyTo(d.cx,d.cy,Math.max(260,d.fw));
  $("actNear").onclick = ()=>{
    const near = ORDER.map(k=>REG[k]).filter(o=>o.id!==id)
      .map(o=>({o:o, dd:Math.hypot(o.cx-d.cx,o.cy-d.cy)})).sort((a,b)=>a.dd-b.dd).slice(0,6);
    p.querySelector(".desc").innerHTML = '<b>四邻：</b>' + near.map(k=>'<a href="#" data-jump="'+k.o.id+'" style="color:#a8342a;text-decoration:none">'+esc(k.o.n)+'</a>（'+Math.round(k.dd*U2M)+'米）').join("、");
  };
  document.querySelectorAll("#dirList li").forEach(li=>li.classList.toggle("sel", li.dataset.id===id));
  if(fly) flyTo(d.cx,d.cy,Math.max(260,d.fw));
}

function coord(x,y){
  const colN="甲乙丙丁戊己庚辛".split(""), rowN="一二三四五六".split("");
  if(x<0||x>1600||y<0||y>1120) return "郊野";
  return colN[Math.min(7,Math.floor(x/200))]+rowN[Math.min(5,Math.floor(y/200))]+"格";
}

/* ================= 地名录 ================= */
const CATORDER = ["water","bridge","road","market","craft","civic","temple","edu","garden","house","farm","misc"];
function buildDir(filter){
  const q = (filter||"").trim().toLowerCase();
  const box = $("dirList"); let html = "", total = 0;
  CATORDER.forEach(c=>{
    const items = ORDER.map(k=>REG[k]).filter(o=>o.c===c)
      .filter(o=>!q || (o.n+o.t+o.who+o.s).toLowerCase().includes(q));
    if(!items.length) return;
    total += items.length;
    html += '<details class="grp"'+(q||items.length<=14?" open":"")+'><summary><span class="dot" style="background:'+CATS[c].c+'"></span>'
         + CATS[c].n+'<span class="cnt">'+items.length+'</span></summary><ul>'
         + items.map(o=>'<li data-id="'+o.id+'">'+esc(o.n)+'<span class="ty">'+esc(o.t)+'</span></li>').join("")
         + '</ul></details>';
  });
  box.innerHTML = html || '<p style="color:var(--ink3);font-size:12.5px;padding:8px">未见此地。</p>';
  box.querySelectorAll("li").forEach(li=>li.onclick = ()=>select(li.dataset.id,true));
  svg.querySelectorAll(".hilite").forEach(el=>el.classList.remove("hilite"));
  if(q) ORDER.map(k=>REG[k]).filter(o=>(o.n+o.t+o.who+o.s).toLowerCase().includes(q))
    .forEach(o=>{ const el = svg.querySelector('[data-id="'+o.id+'"]'); if(el) el.classList.add("hilite"); });
  if(selId) document.querySelectorAll("#dirList li").forEach(li=>li.classList.toggle("sel", li.dataset.id===selId));
  return total;
}

window.addEventListener("keydown", e=>{

  else if(k==="l"||k==="L"){ $("btnLabel").click(); }
