<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>空洞之环 · Hollow Ring</title>
<style>
/* ============================================================
   空洞之环 — UI / HUD 样式表
   风格：暗色墨绘、骨白衬线、细颗粒噪点
   ============================================================ */
:root{
  --bone:#ddd6c6;
  --bone-dim:#8e8778;
  --ink:#05060a;
  --ink2:#0b0e15;
  --soul:#cfe9ff;
  --soul-deep:#5fa8d3;
  --blood:#c0392b;
  --geo:#cfd8d2;
  --gold:#e8c987;
  --ui-scale:1;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;background:#000;
  font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun","Georgia",serif;
  color:var(--bone);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  cursor:none;
}
body.showcursor{cursor:default;}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;}
#wrap{position:fixed;inset:0;background:#000;overflow:hidden;}

/* 全局叠加：颗粒 + 暗角 */
#grain{position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:60;
  background-image:repeating-conic-gradient(#fff 0% 25%,#000 0% 50%);
  background-size:3px 3px;mix-blend-mode:overlay;}
#vig{position:absolute;inset:0;pointer-events:none;z-index:61;
  box-shadow:inset 0 0 220px 60px rgba(0,0,0,.85);}
#hurtvig{position:absolute;inset:0;pointer-events:none;z-index:62;opacity:0;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(150,10,10,.75) 100%);
  transition:opacity .25s ease-out;}
#lowhp{position:absolute;inset:0;pointer-events:none;z-index:63;opacity:0;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(120,0,0,.55) 100%);
  animation:pulse 1.15s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.52}}
#fadeblack{position:absolute;inset:0;background:#000;z-index:70;pointer-events:none;opacity:1;
  transition:opacity .45s linear;}
#flashwhite{position:absolute;inset:0;background:#fff;z-index:69;pointer-events:none;opacity:0;}

/* ============================ HUD ============================ */
#hud{position:absolute;top:0;left:0;right:0;padding:22px 26px;z-index:40;
  pointer-events:none;opacity:0;transition:opacity .4s;
  transform-origin:top left;transform:scale(var(--ui-scale));}
#hud.on{opacity:1;}
#hudrow{display:flex;align-items:flex-start;gap:14px;}
#soulwrap{position:relative;width:76px;height:76px;flex:none;filter:drop-shadow(0 0 8px rgba(120,190,255,.35));}
#soulwrap svg{position:absolute;inset:0;width:100%;height:100%;}
#soulfill{transition:none;}
#masks{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;max-width:420px;}
.mask{width:30px;height:30px;flex:none;transition:transform .16s,opacity .3s;}
.mask.empty{opacity:.28;filter:grayscale(1);}
.mask.hit{animation:maskbreak .35s ease-out;}
@keyframes maskbreak{0%{transform:scale(1.45) rotate(-8deg);filter:brightness(3)}100%{transform:scale(1)}}
.mask.heal{animation:maskheal .5s ease-out;}
@keyframes maskheal{0%{transform:scale(.4);filter:brightness(3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#geobox{position:absolute;top:26px;right:30px;display:flex;align-items:center;gap:9px;
  font-size:22px;letter-spacing:2px;color:var(--geo);opacity:0;transition:opacity .5s;
  text-shadow:0 0 10px rgba(0,0,0,.9);}
#geobox.on{opacity:1;}
#geobox svg{width:26px;height:26px;}
#charmrow{position:absolute;top:64px;right:30px;display:flex;gap:5px;opacity:0;transition:opacity .5s;}
#charmrow.on{opacity:.9;}
.charmdot{width:12px;height:12px;border-radius:50%;background:#2a2f3a;border:1px solid #5d6577;}
.charmdot.filled{background:var(--gold);box-shadow:0 0 8px var(--gold);}

/* 首领血条 */
#bossbar{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);width:min(60vw,720px);
  z-index:41;opacity:0;transition:opacity .5s;pointer-events:none;}
#bossbar.on{opacity:1;}
#bossname{text-align:center;font-size:19px;letter-spacing:8px;color:var(--bone);margin-bottom:8px;
  text-shadow:0 0 12px #000;}
#bosstrack{height:9px;background:rgba(10,10,14,.85);border:1px solid rgba(200,190,170,.35);
  position:relative;overflow:hidden;}
#bossfill{position:absolute;inset:0;width:100%;transform-origin:left;
  background:linear-gradient(90deg,#8e2b2b,#d84b3a 60%,#f0a06a);transition:transform .18s ease-out;}
#bosslag{position:absolute;inset:0;width:100%;transform-origin:left;background:rgba(255,220,190,.35);
  transition:transform .8s .25s ease-out;}

/* 区域标题 */
#areatitle{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:45;
  pointer-events:none;opacity:0;}
#areatitle .n{font-size:44px;letter-spacing:16px;text-indent:16px;
  text-shadow:0 0 30px #000,0 0 60px rgba(0,0,0,.9);}
#areatitle .s{font-size:15px;letter-spacing:9px;text-indent:9px;color:var(--bone-dim);margin-top:14px;}
#areatitle.show{animation:areafade 4.4s ease-in-out forwards;}
@keyframes areafade{
  0%{opacity:0;transform:translateY(14px) scale(.98)}
  18%{opacity:1;transform:translateY(0) scale(1)}
  72%{opacity:1}
  100%{opacity:0}
}

/* 对话 / 石碑 */
#dialogue{position:absolute;left:50%;bottom:9%;transform:translateX(-50%) translateY(20px);
  width:min(76vw,860px);z-index:48;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  background:linear-gradient(180deg,rgba(6,8,12,.94),rgba(3,4,7,.97));
  border:1px solid rgba(190,180,160,.3);padding:26px 34px 30px;
  box-shadow:0 0 60px rgba(0,0,0,.9),inset 0 0 40px rgba(0,0,0,.6);}
#dialogue.on{opacity:1;transform:translateX(-50%) translateY(0);}
#dlgwho{font-size:14px;letter-spacing:6px;color:var(--bone-dim);margin-bottom:12px;}
#dlgtext{font-size:20px;line-height:1.95;letter-spacing:2px;min-height:2.6em;white-space:pre-wrap;}
#dlghint{position:absolute;right:22px;bottom:8px;font-size:12px;color:var(--bone-dim);letter-spacing:3px;
  animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}

/* 交互提示 */
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:44;
  font-size:15px;letter-spacing:5px;color:var(--bone);opacity:0;transition:opacity .25s;
  text-shadow:0 0 12px #000;pointer-events:none;}
#prompt.on{opacity:.92;}
#prompt b{color:var(--gold);font-weight:normal;}

/* ======================= 通用全屏面板 ======================= */
.screen{position:absolute;inset:0;z-index:50;display:none;
  background:radial-gradient(ellipse at center,rgba(9,11,17,.93),rgba(2,3,5,.985));}
.screen.on{display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:sfade .4s ease-out;}
@keyframes sfade{from{opacity:0}to{opacity:1}}

/* 标题画面 */
#title .logo{font-size:min(11vw,92px);letter-spacing:26px;text-indent:26px;
  text-shadow:0 0 44px rgba(160,200,255,.22),0 4px 0 rgba(0,0,0,.6);}
#title .sub{margin-top:12px;font-size:min(3vw,17px);letter-spacing:12px;text-indent:12px;color:var(--bone-dim);}
#title .orn{width:min(60vw,420px);height:1px;margin:34px 0 30px;
  background:linear-gradient(90deg,transparent,rgba(220,210,190,.5),transparent);}
.menu{display:flex;flex-direction:column;gap:4px;align-items:center;}
.mi{font-size:23px;letter-spacing:8px;text-indent:8px;padding:9px 40px;color:var(--bone-dim);
  cursor:pointer;position:relative;transition:color .18s,letter-spacing .18s;}
.mi:hover,.mi.sel{color:#fff;letter-spacing:12px;text-shadow:0 0 22px rgba(180,220,255,.5);}
.mi.sel::before{content:"◆";position:absolute;left:8px;font-size:12px;color:var(--gold);
  animation:blink 1.6s infinite;}
.mi.disabled{opacity:.3;pointer-events:none;}
#title .tip{position:absolute;bottom:26px;font-size:12px;letter-spacing:4px;color:#4a5060;}

/* 死亡 */
#death .big{font-size:min(10vw,76px);letter-spacing:22px;text-indent:22px;color:#e6e0d2;
  text-shadow:0 0 50px rgba(180,40,40,.5);animation:deathin 2.2s ease-out;}
@keyframes deathin{0%{opacity:0;letter-spacing:60px;filter:blur(14px)}100%{opacity:1;letter-spacing:22px;filter:blur(0)}}
#death .note{margin-top:26px;font-size:15px;letter-spacing:5px;color:var(--bone-dim);opacity:0;
  animation:fin 1.4s 1.6s forwards;}
@keyframes fin{to{opacity:1}}
#death .go{margin-top:44px;font-size:14px;letter-spacing:6px;color:#5c6272;opacity:0;
  animation:fin 1s 2.8s forwards,blink 1.8s 3.4s infinite;}

/* 能力获得 */
#flourish{z-index:56;background:radial-gradient(ellipse at center,rgba(30,50,80,.5),rgba(0,0,0,.97));}
#flourish .fname{font-size:min(8vw,58px);letter-spacing:20px;text-indent:20px;color:#fff;
  text-shadow:0 0 60px rgba(150,210,255,.8);}
#flourish .fdesc{margin-top:24px;font-size:17px;letter-spacing:4px;color:#b9c6da;max-width:640px;
  text-align:center;line-height:2;}
#flourish .fkey{margin-top:34px;font-size:14px;letter-spacing:5px;color:var(--gold);}
#flourish .fgo{margin-top:52px;font-size:12px;letter-spacing:5px;color:#5c6272;animation:blink 1.6s infinite;}

/* ======================= 暂停 / 菜单 ======================= */
#pause{background:linear-gradient(180deg,rgba(4,6,10,.97),rgba(2,3,5,.99));}
#pause.on{justify-content:flex-start;padding-top:4vh;}
#ptabs{display:flex;gap:2px;margin-bottom:22px;}
.ptab{padding:10px 32px;font-size:16px;letter-spacing:6px;text-indent:6px;color:var(--bone-dim);
  cursor:pointer;border-bottom:1px solid transparent;transition:.18s;}
.ptab.sel{color:#fff;border-bottom-color:var(--gold);text-shadow:0 0 18px rgba(255,220,150,.4);}
#pbody{width:min(90vw,1040px);height:66vh;position:relative;}
.ppane{position:absolute;inset:0;display:none;}
.ppane.on{display:block;animation:sfade .25s;}
#mapcv{width:100%;height:100%;image-rendering:pixelated;}
#pfoot{margin-top:20px;font-size:12px;letter-spacing:4px;color:#4d5464;text-align:center;line-height:2.1;}

/* 物品栏 */
#invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;
  padding:10px 6px;height:100%;overflow-y:auto;align-content:start;}
.inv{border:1px solid rgba(190,180,160,.18);padding:14px;background:rgba(255,255,255,.017);
  display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;}
.inv .ic{font-size:30px;line-height:1;color:var(--gold);}
.inv .nm{font-size:14px;letter-spacing:2px;}
.inv .ds{font-size:11px;color:var(--bone-dim);line-height:1.7;letter-spacing:1px;}
.inv.locked{opacity:.22;}

/* 护符 */
#charmwrap{display:flex;gap:26px;height:100%;}
#charmlist{flex:1.3;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
  gap:12px;align-content:start;overflow-y:auto;padding:4px;}
.charm{aspect-ratio:1;border:1px solid rgba(190,180,160,.2);display:flex;align-items:center;
  justify-content:center;font-size:30px;cursor:pointer;position:relative;
  background:rgba(255,255,255,.02);transition:.15s;}
.charm:hover{border-color:var(--gold);transform:translateY(-3px);}
.charm.equipped{border-color:var(--gold);background:rgba(232,201,135,.13);
  box-shadow:0 0 22px rgba(232,201,135,.25) inset;}
.charm.locked{opacity:.16;pointer-events:none;}
.charm .cost{position:absolute;bottom:3px;right:5px;font-size:10px;color:var(--bone-dim);}
#charminfo{flex:1;border-left:1px solid rgba(190,180,160,.15);padding-left:26px;}
#charminfo h3{font-size:21px;letter-spacing:5px;font-weight:normal;margin-bottom:8px;}
#charminfo .cn{font-size:12px;color:var(--gold);letter-spacing:3px;margin-bottom:16px;}
#charminfo p{font-size:14px;line-height:2.1;color:#b3ab9b;letter-spacing:1px;}
#notches{display:flex;gap:6px;margin:20px 0 6px;}
#notchlabel{font-size:12px;letter-spacing:4px;color:var(--bone-dim);}

/* 设置 */
#setlist{display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto;padding-top:10px;}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;
  border-bottom:1px solid rgba(190,180,160,.1);font-size:16px;letter-spacing:3px;cursor:pointer;}
.setrow:hover{background:rgba(255,255,255,.04);}
.setrow .v{color:var(--gold);letter-spacing:2px;}

/* 操作说明 */
#keysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 26px;
  padding:6px;height:100%;overflow-y:auto;align-content:start;}
.krow{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;
  border-bottom:1px solid rgba(190,180,160,.08);font-size:14px;letter-spacing:2px;}
.krow .k{color:var(--gold);font-size:13px;letter-spacing:1px;}

/* 商店 */
#shop{z-index:52;}
#shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;
  width:min(88vw,940px);max-height:60vh;overflow-y:auto;padding:4px;}
.shopitem{border:1px solid rgba(190,180,160,.2);padding:16px 18px;cursor:pointer;transition:.15s;
  background:rgba(255,255,255,.02);}
.shopitem:hover{border-color:var(--gold);background:rgba(232,201,135,.08);}
.shopitem.sold{opacity:.3;pointer-events:none;}
.shopitem .t{font-size:16px;letter-spacing:3px;margin-bottom:7px;}
.shopitem .d{font-size:12px;color:var(--bone-dim);line-height:1.8;margin-bottom:10px;}
.shopitem .p{font-size:15px;color:var(--geo);letter-spacing:2px;}

/* 结局 */
#ending .t{font-size:min(9vw,64px);letter-spacing:24px;text-indent:24px;
  text-shadow:0 0 60px rgba(200,230,255,.35);}
#ending .p{margin-top:34px;font-size:16px;line-height:2.4;letter-spacing:4px;color:#a9b3c4;
  max-width:660px;text-align:center;}
#ending .st{margin-top:38px;font-size:13px;letter-spacing:4px;color:#6b7385;line-height:2.2;text-align:center;}

/* 加载 / 错误 */
#boot{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#000;transition:opacity .6s;}
#boot .b1{font-size:34px;letter-spacing:18px;text-indent:18px;color:#6f7789;
  animation:breath 2.4s ease-in-out infinite;}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:1}}
#boot .b2{margin-top:20px;font-size:13px;letter-spacing:5px;color:#3d4352;}
#boot .err{margin-top:30px;font-size:14px;line-height:2.2;color:#c0704f;max-width:640px;
  text-align:center;letter-spacing:2px;display:none;}
#hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:56;
  font-size:14px;letter-spacing:4px;color:#9aa3b5;opacity:0;transition:opacity .8s;
  pointer-events:none;text-shadow:0 0 14px #000,0 0 30px #000;white-space:nowrap;}
#hint.on{opacity:.88;}
#hint b{color:var(--gold);font-weight:normal;}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:57;
  font-size:16px;letter-spacing:5px;color:var(--gold);opacity:0;transition:opacity .4s;
  text-shadow:0 0 18px #000;pointer-events:none;}
#toast.on{opacity:1;}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(190,180,160,.25)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="grain"></div>
  <div id="vig"></div>
  <div id="hurtvig"></div>
  <div id="lowhp"></div>
  <div id="flashwhite"></div>

  <!-- ============ HUD ============ -->
  <div id="hud">
    <div id="hudrow">
      <div id="soulwrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <clipPath id="soulclip"><circle cx="50" cy="50" r="34"/></clipPath>
            <radialGradient id="soulg" cx="50%" cy="40%">
              <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#bfe4ff"/>
              <stop offset="100%" stop-color="#4d8fc0"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="41" fill="none" stroke="#2b3240" stroke-width="3"/>
          <circle cx="50" cy="50" r="35" fill="rgba(10,16,26,.85)"/>
          <g clip-path="url(#soulclip)">
            <rect id="soulfill" x="0" y="100" width="100" height="100" fill="url(#soulg)"/>
          </g>
          <circle cx="50" cy="50" r="35" fill="none" stroke="#7b8698" stroke-width="1.5" opacity=".8"/>
          <path d="M50 6 L57 17 L50 14 L43 17 Z" fill="#8e9aad"/>
        </svg>
      </div>
      <div>
        <div id="masks"></div>
      </div>
    </div>
    <div id="geobox">
      <svg viewBox="0 0 24 24"><path d="M12 2 L21 12 L12 22 L3 12 Z" fill="none" stroke="#cfd8d2" stroke-width="1.6"/><path d="M12 7 L17 12 L12 17 L7 12 Z" fill="#cfd8d2" opacity=".85"/></svg>
      <span id="geonum">0</span>
    </div>
    <div id="charmrow"></div>
  </div>

  <div id="bossbar">
    <div id="bossname">虚空守卫</div>
    <div id="bosstrack"><div id="bosslag"></div><div id="bossfill"></div></div>
  </div>

  <div id="areatitle"><div class="n"></div><div class="s"></div></div>

  <div id="prompt"></div>

  <div id="dialogue">
    <div id="dlgwho"></div>
    <div id="dlgtext"></div>
    <div id="dlghint">[ 回车 / Z 继续 ]</div>
  </div>

  <div id="toast"></div>
  <div id="hint"></div>
  <div id="fps" style="position:absolute;left:8px;bottom:6px;z-index:58;font-size:11px;color:#4d5464;letter-spacing:1px;display:none"></div>

  <!-- ============ 标题 ============ -->
  <div id="title" class="screen">
    <div class="logo">空洞之环</div>
    <div class="sub">HOLLOW　RING</div>
    <div class="orn"></div>
    <div class="menu" id="titlemenu"></div>
    <div class="tip">方向键 / W S 选择　·　回车 或 Z 确认</div>
  </div>

  <!-- ============ 暂停 ============ -->
  <div id="pause" class="screen">
    <div id="ptabs"></div>
    <div id="pbody">
      <div class="ppane" id="pane-map"><canvas id="mapcv"></canvas></div>
      <div class="ppane" id="pane-inv"><div id="invgrid"></div></div>
      <div class="ppane" id="pane-charm">
        <div id="charmwrap">
          <div>
            <div id="notchlabel">护符孔位</div>
            <div id="notches"></div>
            <div id="charmlist"></div>
          </div>
          <div id="charminfo"><h3>—</h3><div class="cn"></div><p>选择一枚护符查看详情。</p></div>
        </div>
      </div>
      <div class="ppane" id="pane-keys"><div id="keysgrid"></div></div>
      <div class="ppane" id="pane-set"><div id="setlist"></div></div>
    </div>
    <div id="pfoot">Tab / ← → 切换页签　·　Esc 返回游戏　·　长按 R 回到主菜单</div>
  </div>

  <!-- ============ 商店 ============ -->
  <div id="shop" class="screen">
    <div style="font-size:30px;letter-spacing:12px;margin-bottom:8px">遗骸商人</div>
    <div style="font-size:13px;letter-spacing:4px;color:var(--bone-dim);margin-bottom:26px">
      吉欧：<span id="shopgeo">0</span>
    </div>
    <div id="shopgrid"></div>
    <div style="margin-top:24px;font-size:12px;letter-spacing:4px;color:#4d5464">Esc 离开</div>
  </div>

  <!-- ============ 死亡 ============ -->
  <div id="death" class="screen">
    <div class="big">你 已 死 去</div>
    <div class="note">你的吉欧与灵魂留在了倒下之处。<br>找到你的阴影，将它击碎，取回属于你的一切。</div>
    <div class="go">[ 按 Z / 回车 于长椅苏醒 ]</div>
  </div>

  <!-- ============ 能力获得 ============ -->
  <div id="flourish" class="screen">
    <div class="fname"></div>
    <div class="fdesc"></div>
    <div class="fkey"></div>
    <div class="fgo">[ 按任意键继续 ]</div>
  </div>

  <!-- ============ 结局 ============ -->
  <div id="ending" class="screen">
    <div class="t"></div>
    <div class="p"></div>
    <div class="st"></div>
  </div>

  <div id="fadeblack"></div>

  <div id="boot">
    <div class="b1">空 洞 之 环</div>
    <div class="b2">正在唤醒沉眠的王国…</div>
    <div class="err" id="booterr"></div>

      if (o.ff2) f.frequency.exponentialRampToValueAtTime(max(20, o.ff2), t0 + dur);
      f.Q.value = o.q || 1;
      node.connect(f); node = f;
    }
    node.connect(g);
    g.connect(o.bus || this.sfxBus);
    if (o.verb) { const vs = c.createGain(); vs.gain.value = o.verb; g.connect(vs); vs.connect(this.verbBus); }
    osc.start(t0); osc.stop(t0 + a + (o.hold || 0) + dur + .06);

  },
  /** 噪声脉冲 */
  noise(o) {
    if (!this.ready) return null;
    if (o.ff !== undefined && !isFinite(o.ff)) return null;
    const c = this.ctx, t0 = o.t0 || c.currentTime, dur = o.dur || .15;
    const src = c.createBufferSource();
    src.buffer = o.pink ? this.pinkBuf : this.noiseBuf;
    src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(max(20, o.ff || 1000), t0);
    if (o.ff2) f.frequency.exponentialRampToValueAtTime(max(20, o.ff2), t0 + dur);
    f.Q.value = o.q || 1;
    const g = c.createGain();
    const peak = o.vol === undefined ? .25 : o.vol, a = o.a === undefined ? .003 : o.a;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(max(.0002, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + a + dur);
    src.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus);
    if (o.verb) { const vs = c.createGain(); vs.gain.value = o.verb; g.connect(vs); vs.connect(this.verbBus); }
    src.start(t0, Math.random() * 1.5); src.stop(t0 + a + dur + .06);
    return src;
  },

        break;
      case 'gate':

  /* ---------------- 循环音（聚集/滑墙） ---------------- */
  startLoop(name) {
    if (!this.ready || this._loops[name]) return;
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain(); g.gain.value = 0; g.connect(this.sfxBus);
    let nodes = [g];
    if (name === 'focus') {
      const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.setValueAtTime(180, t);
      o1.frequency.linearRampToValueAtTime(560, t + .9);
      const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.setValueAtTime(270, t);
      o2.frequency.linearRampToValueAtTime(842, t + .9);
      const n = c.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
      const nf = c.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.setValueAtTime(600, t);
      nf.frequency.linearRampToValueAtTime(2600, t + .9); nf.Q.value = 2.2;
      const ng = c.createGain(); ng.gain.value = .35;
      o1.connect(g); o2.connect(g); n.connect(nf); nf.connect(ng); ng.connect(g);
      const vs = c.createGain(); vs.gain.value = .5; g.connect(vs); vs.connect(this.verbBus);
      g.gain.linearRampToValueAtTime(.12, t + .12);
      o1.start(t); o2.start(t); n.start(t);
      nodes = [g, o1, o2, n];
    } else if (name === 'wind') {
      const n = c.createBufferSource(); n.buffer = this.pinkBuf; n.loop = true;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = .8;
      const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = .08;
      const lg = c.createGain(); lg.gain.value = 200;
      lfo.connect(lg); lg.connect(f.frequency);
      n.connect(f); f.connect(g);
      g.gain.linearRampToValueAtTime(.05, t + 2);
      n.start(t); lfo.start(t);
      nodes = [g, n, lfo];
    }
    this._loops[name] = nodes;
  },
  stopLoop(name) {
    const nodes = this._loops[name];
    if (!nodes) return;
    const t = this.ctx.currentTime, g = nodes[0];
    try {
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0, t + .12);
      for (let i = 1; i < nodes.length; i++) { try { nodes[i].stop(t + .2); } catch (e) {} }
    } catch (e) {}
    delete this._loops[name];
  },

  /* ---------------- 程序化音乐 ---------------- */
  music: {
    on: false, area: null, intensity: 0, targetIntensity: 0,
    nextNote: 0, step: 0, timer: null, bpm: 62,
  },
  // 调式：以半音表示（相对主音）
  SCALES: {
    aeolian: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10],
    phrygian: [0, 1, 3, 5, 7, 8, 10],
    hexatonic: [0, 3, 5, 6, 7, 10],
  },
  AREA_MUSIC: {
    crossroads: { root: 55, scale: 'aeolian', bpm: 58, pad: 'sine', lead: 'triangle', prog: [0, 5, 3, 4] },
    verdant:    { root: 57, scale: 'dorian', bpm: 64, pad: 'triangle', lead: 'sine', prog: [0, 3, 5, 2] },
    depths:     { root: 51, scale: 'phrygian', bpm: 52, pad: 'sawtooth', lead: 'triangle', prog: [0, 1, 0, 5] },
    sanctum:    { root: 58, scale: 'hexatonic', bpm: 70, pad: 'sine', lead: 'sine', prog: [0, 4, 2, 6] },
    boss:       { root: 49, scale: 'phrygian', bpm: 96, pad: 'sawtooth', lead: 'square', prog: [0, 0, 1, 0] },
  },
  midi(n) { return 440 * pow(2, (n - 69) / 12); },

  startMusic(area) {
    if (!this.ready) return;
    const M = this.music;
    if (M.area === area && M.on) return;
    M.area = area; M.on = true;
    const cfg = this.AREA_MUSIC[area] || this.AREA_MUSIC.crossroads;
    M.bpm = cfg.bpm;
    this.musicBus.gain.cancelScheduledValues(this.now());
    this.musicBus.gain.setValueAtTime(this.musicBus.gain.value, this.now());
    this.musicBus.gain.linearRampToValueAtTime(this.volMusic, this.now() + 2.5);
    M.nextNote = this.now() + .1; M.step = 0;
    if (!M.timer) M.timer = setInterval(() => this._schedule(), 40);
  },
  stopMusic(fade) {
    const M = this.music;
    if (!this.ready) return;
    M.on = false;
    this.musicBus.gain.cancelScheduledValues(this.now());
    this.musicBus.gain.setValueAtTime(this.musicBus.gain.value, this.now());
    this.musicBus.gain.linearRampToValueAtTime(0, this.now() + (fade === undefined ? 1.5 : fade));
    M.area = null;
  },
  setIntensity(v) { this.music.targetIntensity = clamp01(v); },
  _schedule() {
    const M = this.music;
    if (!this.ready || !M.on) return;
    M.intensity += (M.targetIntensity - M.intensity) * .06;
    const cfg = this.AREA_MUSIC[M.area] || this.AREA_MUSIC.crossroads;
    const scale = this.SCALES[cfg.scale];
    const SL = scale.length;   // 不能写死 7：hexatonic 只有 6 个音
    const spb = 60 / M.bpm, stepDur = spb / 2;   // 八分音符
    const ahead = this.now() + .25;
    if (M.nextNote < this.now() - .5) M.nextNote = this.now() + .06;   // resync after tab throttling
    let guard = 0;
    while (M.nextNote < ahead && guard++ < 32) {
      const t = M.nextNote, s = M.step;
      const bar = floor(s / 8) % cfg.prog.length;
      const degree = cfg.prog[bar];
      const rootN = cfg.root + scale[degree % SL] + floor(degree / SL) * 12;
      const I = M.intensity;

      // 低音：每小节首拍
      if (s % 8 === 0) {
        this.tone({ t0: t, type: 'sine', f: this.midi(rootN - 12), dur: spb * 3, vol: .13 + .05 * I, a: .06, bus: this.musicBus, verb: .3 });
      }
      // 铺底和弦：每半小节
      if (s % 4 === 0) {
        [0, 2, 4].forEach((iv, k) => {
          this.tone({
            t0: t + k * .02, type: cfg.pad,
            f: this.midi(rootN + scale[(degree + iv) % SL] + floor((degree + iv) / SL) * 12),
            dur: spb * 2.4, vol: (.028 + .012 * I) / (k * .5 + 1), a: .5,
            filter: 'lowpass', ff: 700 + 900 * I, bus: this.musicBus, verb: .6, detune: (k - 1) * 6,
          });
        });
      }
      // 旋律：稀疏、随强度变密
      const density = .18 + .42 * I;
      if (Math.random() < density && s % 2 === (I > .5 ? 0 : 1)) {
        const oct = Math.random() < .3 ? 12 : 0;
        const n = cfg.root + 12 + scale[floor(Math.random() * scale.length)] + oct;
        this.tone({
          t0: t, type: cfg.lead, f: this.midi(n), dur: stepDur * (1.5 + Math.random()),
          vol: .04 + .035 * I, a: .01, filter: 'lowpass', ff: 2400, bus: this.musicBus, verb: .5,
        });
      }
      // 战斗层：打击乐
      if (I > .35) {
        if (s % 4 === 0) this.noise({ t0: t, dur: .18, filter: 'lowpass', ff: 240, vol: .12 * I, bus: this.musicBus });
        if (s % 4 === 2 && Math.random() < .7)
          this.noise({ t0: t, dur: .1, filter: 'highpass', ff: 2600, vol: .05 * I, bus: this.musicBus });
      }
      M.nextNote += stepDur; M.step++;
    }
  },
};
/* ==============================================================

        · 一次只渲染一个房间，房间局部坐标 == 世界坐标（1 单位 = 1 格）

/* ---------- GLSL 公共片段 ---------- */
const GLSL_NOISE = `
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1.0,0.0)), c=hash21(i+vec2(0.0,1.0)), d=hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
float fbm3(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.11; a*=0.5; } return s; }
`;

const ArtCache = { tex: {}, geo: {} };

/* ==============================================================
   程序纹理
   ============================================================== */
function cvs(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function texFromCanvas(c, wrap) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = wrap ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}
/** 柔和径向光晕 */
function texGlow() {
  if (ArtCache.tex.glow) return ArtCache.tex.glow;
  const S = 128, c = cvs(S, S), g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(.18, 'rgba(255,255,255,.75)');
  grd.addColorStop(.45, 'rgba(255,255,255,.22)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  return ArtCache.tex.glow = texFromCanvas(c);
}
/** 尖锐火花 */
function texSpark() {
  if (ArtCache.tex.spark) return ArtCache.tex.spark;
  const S = 64, c = cvs(S, S), g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(.25, 'rgba(255,255,255,.55)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  // 十字星芒
  g.globalCompositeOperation = 'lighter';
  const lg = g.createLinearGradient(0, S / 2, S, S / 2);
  lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.85)');
  lg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = lg; g.fillRect(0, S / 2 - 1.2, S, 2.4);
  const lg2 = g.createLinearGradient(S / 2, 0, S / 2, S);
  lg2.addColorStop(0, 'rgba(255,255,255,0)'); lg2.addColorStop(.5, 'rgba(255,255,255,.85)');
  lg2.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = lg2; g.fillRect(S / 2 - 1.2, 0, 2.4, S);
  return ArtCache.tex.spark = texFromCanvas(c);
}
/** 烟雾 / 尘土团块 */
function texSmoke() {
  if (ArtCache.tex.smoke) return ArtCache.tex.smoke;
  const S = 128, c = cvs(S, S), g = c.getContext('2d');
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (x - S / 2) / (S / 2), dy = (y - S / 2) / (S / 2);
    const r = hypot(dx, dy);
    let a = clamp01(1 - r);
    a = pow(a, 1.6);
    const n = fbm(x * .09, y * .09, 4);
    a *= .45 + .85 * n;
    const i = (y * S + x) * 4;
    img.data[i] = 255; img.data[i + 1] = 255; img.data[i + 2] = 255;
    img.data[i + 3] = clamp01(a) * 255;
  }
  g.putImageData(img, 0, 0);
  return ArtCache.tex.smoke = texFromCanvas(c);
}
/** 圆环冲击波 */
function texRing() {
  if (ArtCache.tex.ring) return ArtCache.tex.ring;
  const S = 128, c = cvs(S, S), g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, S * .28, S / 2, S / 2, S * .5);
  grd.addColorStop(0, 'rgba(255,255,255,0)');
  grd.addColorStop(.55, 'rgba(255,255,255,.9)');
  grd.addColorStop(.75, 'rgba(255,255,255,.35)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);

/** 视差背景层：按区域程序生成剪影 */
function texParallax(areaKey, layer) {
  const key = 'px_' + areaKey + '_' + layer;
  if (ArtCache.tex[key]) return ArtCache.tex[key];
  const A = AREAS[areaKey];
  const W = 1024, H = 512, c = cvs(W, H), g = c.getContext('2d');
  const base = A.bg[min(layer, A.bg.length - 1)];
  g.clearRect(0, 0, W, H);

  // 雾气渐变底
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, cssRGBA(base, layer === 0 ? .95 : .8));
  grd.addColorStop(.6, cssRGBA(base, .55));
  grd.addColorStop(1, cssRGBA(A.fog, .9));
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  const R = mulberry32(0x1234 + layer * 977 + areaKey.length * 31);
  const silh = cssRGBA(hexLerp(base, 0x000000, .45 + layer * .12), .9);
  g.fillStyle = silh;

  if (areaKey === 'crossroads' || areaKey === 'sanctum') {
    // 立柱与拱门
    const n = 7 + layer * 3;
    for (let i = 0; i < n; i++) {
      const x = R() * W, w = 26 + R() * 60, h = 150 + R() * 300;
      g.fillRect(x - w / 2, H - h, w, h);
      g.beginPath(); g.ellipse(x, H - h, w * .62, w * .5, 0, PI, TAU); g.fill();
      // 柱头装饰
      g.fillRect(x - w * .8, H - h - 8, w * 1.6, 12);
      if (areaKey === 'sanctum' && R() < .5) {
        g.save(); g.globalAlpha = .35; g.fillStyle = cssRGBA(A.glow, .5);
        g.fillRect(x - 3, H - h + 20, 6, h * .6); g.restore(); g.fillStyle = silh;
      }
    }
  } else if (areaKey === 'verdant') {
    // 巨大蘑菇与藤蔓
    for (let i = 0; i < 10 + layer * 4; i++) {
      const x = R() * W, y = H - R() * H * .55, s = 22 + R() * 70;
      g.beginPath(); g.ellipse(x, y, s, s * .52, 0, PI, TAU); g.fill();
      g.fillRect(x - s * .13, y, s * .26, s * .95);
    }
    for (let i = 0; i < 22; i++) {
      const x = R() * W, len = 60 + R() * 220;
      g.beginPath(); g.moveTo(x, 0);
      let px = x;
      for (let k = 0; k < 8; k++) {
        px += (R() - .5) * 26;
        g.lineTo(px, len * (k + 1) / 8);
      }
      g.lineWidth = 2 + R() * 5; g.strokeStyle = silh; g.stroke();
    }
  } else {
    // 深渊：尖刺岩柱与坠落的余烬
    for (let i = 0; i < 12 + layer * 5; i++) {
      const x = R() * W, w = 20 + R() * 70, h = 120 + R() * 320;
      const up = R() < .55;
      g.beginPath();
      if (up) { g.moveTo(x - w / 2, H); g.lineTo(x + (R() - .5) * w * .5, H - h); g.lineTo(x + w / 2, H); }
      else { g.moveTo(x - w / 2, 0); g.lineTo(x + (R() - .5) * w * .5, h); g.lineTo(x + w / 2, 0); }
      g.closePath(); g.fill();
    }
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 60; i++) {
      const x = R() * W, y = R() * H, s = R() * 2.2 + .6;
      g.fillStyle = cssRGBA(A.glow, .10 + R() * .25);
      g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
  }

  // 顶部/底部渐隐，避免层间硬边
  const fade = g.createLinearGradient(0, 0, 0, H);
  fade.addColorStop(0, cssRGBA(A.fog, .0));
  fade.addColorStop(.75, cssRGBA(A.fog, .35));
  fade.addColorStop(1, cssRGBA(A.fog, .92));
  g.fillStyle = fade; g.fillRect(0, 0, W, H);

  const t = texFromCanvas(c, true);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  return ArtCache.tex[key] = t;
}

/** 地形：靠房间 SDF 贴图做边缘辉光与深度分层 */
function makeTerrainMaterial(A) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uSDF: { value: null },
      uSize: { value: new THREE.Vector2(1, 1) },
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(A.deep) },
      uMid: { value: new THREE.Color(A.mid) },
      uEdge: { value: new THREE.Color(A.edge) },
      uGlow: { value: new THREE.Color(A.glow) },
      uFog: { value: new THREE.Color(A.fog) },
      uPulse: { value: 0 },
    },
    vertexShader: `
      varying vec2 vW;
      void main(){ vW = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: GLSL_NOISE + `
      uniform sampler2D uSDF; uniform vec2 uSize; uniform float uTime, uPulse;
      uniform vec3 uDeep, uMid, uEdge, uGlow, uFog;
      varying vec2 vW;
      void main(){
        vec2 uv = vW / uSize;
        vec4 s = texture2D(uSDF, uv);
        float d = s.r;              // distance from surface (normalized)
        float upf = s.g;            // up-facing proximity
        float n  = fbm(vW * 0.55);
        float n2 = fbm(vW * 2.3 + n * 1.2);
        float cr = vnoise(vW * 7.0 + n2 * 2.0);   // fine cracks
        float depth = clamp(d * 1.35 + (n - 0.5) * 0.30, 0.0, 1.0);

        vec3 col = mix(uEdge, uMid, smoothstep(0.03, 0.34, depth));
        col = mix(col, uDeep, smoothstep(0.30, 0.85, depth));
        col *= 0.72 + 0.56 * n2;
        col -= vec3(0.035) * smoothstep(0.55, 0.95, cr);

        // rim light -- the SDF stores dist/6, so a 1-tile surface band lands near 0.10-0.30
        float rim = smoothstep(0.30, 0.02, depth);
        float rimSharp = smoothstep(0.15, 0.0, depth);
        float upRim = rim * (0.30 + 1.0 * upf);
        col += uGlow * upRim * (0.42 + 0.18 * sin(uTime * 0.8 + vW.x * 0.35 + vW.y * 0.2));
        col += uGlow * rim * 0.14;
        col += vec3(1.0) * rimSharp * upf * 0.10;
        col += uGlow * uPulse * rim * 1.8;

        // deeper -> converge to fog color
        col = mix(col, uFog * 0.55, smoothstep(0.45, 1.0, depth) * 0.45);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
}

/** 房间背景墙：整块四边形 + 程序岩壁/砖structure */
function makeBackWallMaterial(A) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uSize: { value: new THREE.Vector2(1, 1) },
      uBack: { value: new THREE.Color(A.back) },
      uLine: { value: new THREE.Color(A.backLine) },
      uFog: { value: new THREE.Color(A.fog) },
      uGlow: { value: new THREE.Color(A.glow) },
      uStyle: { value: 0 },
    },
    depthWrite: false,
    vertexShader: `varying vec2 vW; varying vec2 vUv;
      void main(){ vW = position.xy; vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: GLSL_NOISE + `
      uniform float uTime, uStyle; uniform vec2 uSize;
      uniform vec3 uBack, uLine, uFog, uGlow;
      varying vec2 vW; varying vec2 vUv;
      void main(){
        float n = fbm(vW * 0.32);
        float n2 = fbm(vW * 1.6 + 3.1);
        vec3 col = mix(uBack, uLine, smoothstep(0.42, 0.78, n) * 0.75);
        col *= 0.66 + 0.62 * n2;

        // masonry / pillar structure
        if(uStyle < 0.5){
          vec2 g = vec2(vW.x / 4.0, vW.y / 2.6);
          g.x += floor(g.y) * 0.5;
          vec2 f = abs(fract(g) - 0.5);
          float line = smoothstep(0.47, 0.5, max(f.x, f.y));
          col = mix(col, uLine * 1.5, line * 0.22 * smoothstep(0.2, 0.8, n));
        } else {
          float v = abs(fract(vW.x / 7.0) - 0.5);
          col = mix(col, uLine * 1.3, smoothstep(0.44, 0.5, v) * 0.18);
        }

        // distant glow bleeding through
        float glow = pow(max(0.0, n - 0.55) * 2.2, 2.0);
        col += uGlow * glow * 0.10;

        // edge darkening
        float vig = smoothstep(0.0, 0.28, vUv.x) * smoothstep(1.0, 0.72, vUv.x)
                  * smoothstep(0.0, 0.22, vUv.y) * smoothstep(1.0, 0.78, vUv.y);
        col = mix(uFog * 0.4, col, 0.35 + 0.65 * vig);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
}

/** 前景雾／体积感薄雾 */
function makeFogMaterial(A, opacity) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uColor: { value: new THREE.Color(A.fog) },
      uOpacity: { value: opacity === undefined ? .3 : opacity },

    transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    vertexShader: `varying vec2 vUv; varying vec2 vW;
      void main(){ vUv = uv; vW = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: GLSL_NOISE + `
      uniform float uTime, uOpacity; uniform vec3 uColor;
      varying vec2 vUv; varying vec2 vW;
      void main(){
        vec2 p = vW * 0.06;
        float n = fbm(p + vec2(uTime * 0.014, uTime * 0.006));
        float n2 = fbm(p * 2.1 - vec2(uTime * 0.02, 0.0));
        float a = smoothstep(0.35, 0.85, n * 0.65 + n2 * 0.45) * uOpacity;
        gl_FragColor = vec4(uColor * (0.8 + 0.5 * n2), a);
      }
    `,
  });
}

    depthWrite: opts.depthWrite === undefined ? !additive : opts.depthWrite,

    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);

/** 弯月形（挥砍轨迹）：两端收尖 */

  for (let i = 0; i <= segs; i++) {

  g.setIndex(idx);

    const x0 = i * w - count * w / 2;

    pos.push(x0, 0, 0, x0 + w, 0, 0, x0 + w * .5, h, 0);

  const nailHi = mesh(geo('kNailHi', () => polyGeo([0.1, 0.004, 0.92, 0.012, 1.0, 0.0, 0.92, -0.004, 0.1, -0.012])), COL.nailEdge, 0.09);
  const hilt = mesh(geo('kHilt', () => roundRectGeo(0.1, 0.16, 0.04, 3)), COL.bodyRim, 0.07);
  hilt.position.x = -0.02;
  nailG.add(nail, nailHi, hilt);
  nailG.position.set(0.12, 0, 0);
  armG.add(nailG);
  armG.position.set(0, -0.12, 0);

  // 挥砍弧光
  const slashG = new THREE.Group(); root.add(slashG);
  const slashGeoO = geo('kSlash', () => crescentGeo(1.05, 1.05, 0.30, 24));
  const slash = new THREE.Mesh(slashGeoO, flatMat(0xffffff, { additive: true, opacity: 0.9, transparent: true }));
  const slash2 = new THREE.Mesh(geo('kSlash2', () => crescentGeo(1.02, 0.95, 0.16, 24)), flatMat(0xcfe8ff, { additive: true, opacity: 0.9, transparent: true }));

  // 头部柔光 + 灵魂聚集光球
  const halo = glowQuad(1.5, 0xbcd8ff, 0.16); halo.position.set(0, 0.3, -0.5); bodyG.add(halo);
  const focusGlow = glowQuad(2.2, 0xbfe6ff, 0); focusGlow.position.z = 0.4; root.add(focusGlow);

  const rig = {
    root, bodyG, cloakG, headG, legs, legL, legR, armG, nailG, slashG,

           legL.material, legR.material, nail.material, hilt.material],

const WHITE_C = new THREE.Color(0xffffff);
const RED_C = new THREE.Color(0xff5544);

/** 小骑士动画：st = { anim, at, face, vx, vy, grounded, wall, squash, focusAmt } */
function animateKnight(rig, st, dt) {
  rig.t += dt;
  const t = rig.t;
  const b = rig.bodyG, h = rig.headG, a = rig.armG, c = rig.cloakG;
  const speed = abs(st.vx);
  // 默认姿态
  let bodyY = 0, bodyRot = 0, bodyScaleX = 1, bodyScaleY = 1;
  let headRot = 0, headY = 0.30, cloakRot = 0, cloakScale = 1;
  let armRot = -1.15, armX = 0, armY = -0.12;
  let legLY = -0.74, legRY = -0.74, legLX = -0.11, legRX = 0.11;

  switch (st.anim) {
    case 'idle': {
      const s = sin(t * 1.9);
      bodyY = s * 0.022; headY += s * 0.014;
      bodyScaleY = 1 + s * 0.014; bodyScaleX = 1 - s * 0.010;
      cloakRot = sin(t * 1.3) * 0.05;
      headRot = sin(t * 0.7) * 0.03;
      break;
    }
    case 'run': {
      const f = t * 15.5;
      bodyY = abs(sin(f)) * 0.055 - 0.02;
      bodyRot = -0.10;
      headRot = 0.05 + sin(f * 2) * 0.02;
      headY += abs(sin(f)) * 0.02;
      legLY = -0.74 + max(0, sin(f)) * 0.16;
      legRY = -0.74 + max(0, sin(f + PI)) * 0.16;
      legLX = -0.11 + cos(f) * 0.09;
      legRX = 0.11 + cos(f + PI) * 0.09;
      cloakRot = 0.20 + sin(f) * 0.06;
      cloakScale = 1.05;
      armRot = -1.05 + sin(f) * 0.08;
      break;
    }
    case 'jump': {
      bodyScaleY = 1.10; bodyScaleX = 0.93;
      bodyRot = -0.06; headRot = -0.05;
      legLY = -0.66; legRY = -0.70; legLX = -0.09; legRX = 0.13;
      cloakRot = -0.30; cloakScale = 1.12;
      armRot = -1.35;
      break;
    }
    case 'fall': {
      bodyScaleY = 1.03; bodyScaleX = 0.98;
      bodyRot = 0.05; headRot = 0.06;
      legLY = -0.78 + sin(t * 9) * 0.02; legRY = -0.74;
      cloakRot = -0.48 + sin(t * 6) * 0.07; cloakScale = 1.16;
      armRot = -0.95;
      break;
    }
    case 'dash': {
      bodyScaleX = 1.30; bodyScaleY = 0.80;
      bodyRot = -0.16; headRot = 0.10; bodyY = -0.04;
      legLY = -0.66; legRY = -0.66; legLX = -0.18; legRX = 0.04;
      cloakRot = 0.85; cloakScale = 1.35;
      armRot = -0.55;
      break;
    }
    case 'wall': {
      bodyRot = 0.10; bodyScaleY = 1.05; bodyScaleX = 0.94;
      headRot = -0.14;
      legLY = -0.70; legRY = -0.78; legLX = -0.05; legRX = 0.12;
      cloakRot = -0.25 + sin(t * 12) * 0.05; cloakScale = 1.1;
      armRot = -1.75;
      break;
    }
    case 'focus': {
      const k = clamp01(st.focusAmt || 0);
      bodyScaleY = 1 - 0.10 * k; bodyScaleX = 1 + 0.06 * k;
      bodyY = -0.07 * k;
      headRot = -0.10 * k;
      cloakRot = -0.05; cloakScale = 1 + 0.05 * k;
      armRot = -1.9; armX = -0.06;
      legLY = -0.70; legRY = -0.70;
      break;
    }
    case 'cast': {
      bodyRot = -0.24; bodyScaleX = 1.08; bodyScaleY = 0.95;
      headRot = 0.12;
      armRot = -0.15; armX = 0.1;
      cloakRot = 0.5; cloakScale = 1.2;
      break;
    }
    case 'hurt': {
      const k = clamp01(st.at / 0.3);
      bodyRot = 0.34 * (1 - k) + 0.05;
      bodyScaleX = 1 + 0.18 * (1 - k); bodyScaleY = 1 - 0.12 * (1 - k);
      headRot = -0.45 * (1 - k);
      cloakRot = -0.7 * (1 - k);
      armRot = -1.9;
      break;
    }
    case 'attack': {
      const p = clamp01(st.at / 0.24);
      const dir = st.atkDir || 0;   // 0 侧 / 1 上 / -1 下
      const sw = Ease.outQuart(p);
      if (dir === 0) {
        armRot = lerp(-2.05, 0.55, sw);
        bodyRot = lerp(0.16, -0.20, sw);
        bodyScaleX = 1 + 0.10 * sin(p * PI);
        headRot = lerp(-0.14, 0.14, sw);
        cloakRot = lerp(-0.25, 0.42, sw);
      } else if (dir === 1) {
        armRot = lerp(-0.4, 1.75, sw);
        bodyRot = -0.12 * sin(p * PI);
        bodyScaleY = 1 + 0.12 * sin(p * PI);
        headRot = -0.2 * sin(p * PI);
      } else {
        armRot = lerp(-2.4, -4.4, sw);
        bodyRot = 0.10 * sin(p * PI);
        bodyScaleY = 1 - 0.10 * sin(p * PI);
        headRot = 0.24 * sin(p * PI);
      }
      const f = t * 14;
      if (st.grounded && speed > 0.5) {
        legLY = -0.74 + max(0, sin(f)) * 0.10;
        legRY = -0.74 + max(0, sin(f + PI)) * 0.10;
      }
      break;
    }
    case 'bench': {
      bodyY = -0.16; bodyScaleY = 0.90; bodyScaleX = 1.05;
      headRot = sin(t * 1.1) * 0.02; headY = 0.24;
      armRot = -2.1; cloakRot = -0.05;
      legLY = -0.60; legRY = -0.60; legLX = -0.13; legRX = 0.13;
      break;
    }
    case 'death': {
      const k = clamp01(st.at / 0.8);
      bodyRot = 0.9 * k; bodyY = -0.2 * k;
      bodyScaleY = 1 - 0.3 * k; bodyScaleX = 1 + 0.1 * k;
      headRot = 0.6 * k;
      armRot = -2.4;
      break;
    }
  }

  const sq = st.squash || 0;   // >0 压扁, <0 拉伸
  bodyScaleX *= 1 + sq * 0.35; bodyScaleY *= 1 - sq * 0.35;

  const L = 1 - Math.exp(-26 * dt);
  b.position.y = lerp(b.position.y, bodyY, L);
  b.rotation.z = lerp(b.rotation.z, bodyRot, L);
  b.scale.x = lerp(b.scale.x, bodyScaleX, L);
  b.scale.y = lerp(b.scale.y, bodyScaleY, L);
  h.position.y = lerp(h.position.y, headY, L);
  h.rotation.z = lerp(h.rotation.z, headRot, L);
  c.rotation.z = lerp(c.rotation.z, cloakRot, L);
  c.scale.setScalar(lerp(c.scale.x, cloakScale, L));
  const LA = 1 - Math.exp(-45 * dt);
  a.rotation.z = lerp(a.rotation.z, armRot, LA);
  a.position.x = lerp(a.position.x, armX, L);
  a.position.y = lerp(a.position.y, armY, L);
  rig.legL.position.y = lerp(rig.legL.position.y, legLY, L);
  rig.legR.position.y = lerp(rig.legR.position.y, legRY, L);
  rig.legL.position.x = lerp(rig.legL.position.x, legLX, L);
  rig.legR.position.x = lerp(rig.legR.position.x, legRX, L);

  rig.focusGlow.material.opacity = (st.focusAmt || 0) * 0.85;
  rig.focusGlow.scale.setScalar(1.2 + (st.focusAmt || 0) * 1.7);
  rig.halo.material.opacity = 0.12 + 0.05 * sin(t * 2);
}

function bugLegs(parent, n, spread, y, col) {
  const legs = [];
  const lg = geo('bugLeg', () => roundRectGeo(0.05, 0.22, 0.025, 3));
  for (let i = 0; i < n; i++) {
    const m = mesh(lg, col, -0.05);
    m.position.set(lerp(-spread, spread, n === 1 ? .5 : i / (n - 1)), y, -0.05);
    parent.add(m); legs.push(m);
  }
  return legs;
}

/** 敌人通用小动画 */
function animateEnemy(rig, type, st, dt) {
  const t = st.t, b = rig.bodyG;
  switch (type) {
    case 'crawlid':
      b.position.y = abs(sin(t * 9)) * 0.05;
      if (rig.legs) rig.legs.forEach((l, i) => l.position.y = -0.30 + max(0, sin(t * 9 + i * 1.6)) * 0.1);
      break;
    case 'vengefly': {
      const f = sin(t * 34);
      rig.wl.scale.x = -(0.5 + 0.55 * abs(f)); rig.wr.scale.x = 0.5 + 0.55 * abs(f);
      rig.wl.rotation.z = -f * 0.4; rig.wr.rotation.z = f * 0.4;
      b.rotation.z = clamp(st.vx * 0.05, -0.4, 0.4);
      break;
    }
    case 'husk':
      b.rotation.z = sin(t * 4.5) * 0.07 * (st.moving ? 1 : 0.25);
      b.position.y = abs(sin(t * 4.5)) * 0.06;
      if (rig.armL) { rig.armL.rotation.z = sin(t * 4.5) * 0.5 + 0.2; rig.armR.rotation.z = -sin(t * 4.5) * 0.5 - 0.2; }
      if (rig.head) rig.head.rotation.z = sin(t * 4.5 + 1) * 0.05;
      break;
    case 'spitter':
      b.position.y = sin(t * 2.2) * 0.14;
      b.rotation.z = sin(t * 1.7) * 0.09;
      if (rig.sac) rig.sac.scale.setScalar(1 + sin(t * 3.4) * 0.09 + (st.charge || 0) * .5);
      if (rig.tail) rig.tail.rotation.z = sin(t * 3) * 0.22;
      break;
    case 'hopper':
      if (rig.cap) { rig.cap.scale.y = 1 + (st.squash || 0); rig.cap.scale.x = 1 - (st.squash || 0) * .6; }
      if (rig.stem) rig.stem.scale.y = 1 - (st.squash || 0) * .8;
      break;
    case 'roller':
      b.rotation.z -= st.vx * dt * 2.4;
      break;
    case 'charger':
      b.position.y = abs(sin(t * 11)) * 0.04;
      if (rig.legs) rig.legs.forEach((l, i) => l.position.y = -0.44 + max(0, sin(t * 13 + i * 1.5)) * 0.12);
      if (rig.eye) rig.eye.material.color.setHex(st.aggro ? 0xff2200 : 0xff8855);
      break;
    case 'sentry':
      b.position.y = sin(t * 2) * 0.03;
      if (rig.shield) rig.shield.rotation.z = sin(t * 2.4) * 0.05;
      break;
    case 'wisp':
      b.position.y = sin(t * 1.9) * 0.2;
      b.rotation.z = sin(t * 1.3) * 0.12;
      if (rig.tail) rig.tail.scale.y = 1 + sin(t * 3) * 0.18;
      if (rig.halo) rig.halo.material.opacity = 0.22 + 0.12 * sin(t * 2.6);
      break;
    case 'ember': {
      const k = st.charge || 0;
      b.position.y = abs(sin(t * 12)) * 0.05;
      if (rig.core) { rig.core.scale.setScalar(1 + k * 1.4 + sin(t * 18) * 0.08 * (1 + k * 4)); }
      if (rig.halo) { rig.halo.material.opacity = 0.35 + k * 0.7; rig.halo.scale.setScalar(1 + k * 1.5); }
      break;
    }
  }
}

   6. 粒子与特效
   ============================================================== */
const PARTICLE_VS = `
attribute float aSize; attribute vec3 aColor; attribute float aAlpha;
uniform float uScale;
varying vec3 vColor; varying float vAlpha;
void main(){
  vColor = aColor; vAlpha = aAlpha;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_PointSize = max(1.0, aSize * (uScale / max(0.001, -mv.z)));
  gl_Position = projectionMatrix * mv;
}`;
const PARTICLE_FS = `
uniform sampler2D uMap;
varying vec3 vColor; varying float vAlpha;
void main(){
  vec4 t = texture2D(uMap, gl_PointCoord);
  float a = t.a * vAlpha;
  if(a < 0.004) discard;
  gl_FragColor = vec4(vColor, a);
}`;

class ParticleSystem {
  constructor(maxN, texture, additive) {
    this.max = maxN; this.count = 0;
    this.pos = new Float32Array(maxN * 3);
    this.col = new Float32Array(maxN * 3);
    this.siz = new Float32Array(maxN);
    this.alp = new Float32Array(maxN);
    // CPU 侧状态
    this.vx = new Float32Array(maxN); this.vy = new Float32Array(maxN);
    this.life = new Float32Array(maxN); this.maxLife = new Float32Array(maxN);
    this.grav = new Float32Array(maxN); this.drag = new Float32Array(maxN);
    this.size0 = new Float32Array(maxN); this.size1 = new Float32Array(maxN);
    this.a0 = new Float32Array(maxN);
    this.mode = new Uint8Array(maxN);      // 0 普通 1 追踪玩家 2 上浮
    this.r0 = new Float32Array(maxN); this.g0 = new Float32Array(maxN); this.b0 = new Float32Array(maxN);
    this.r1 = new Float32Array(maxN); this.g1 = new Float32Array(maxN); this.b1 = new Float32Array(maxN);

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.siz, 1));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alp, 1));
    g.setDrawRange(0, 0);
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uMap: { value: texture }, uScale: { value: 400 } },
      vertexShader: PARTICLE_VS, fragmentShader: PARTICLE_FS,
      transparent: true, depthWrite: false, depthTest: true,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = additive ? 12 : 11;
  }
  spawn(o) {
    let i;
    if (this.count < this.max) i = this.count++;
    else i = (Math.random() * this.max) | 0;   // 溢出时随机替换
    const p3 = i * 3;
    this.pos[p3] = o.x; this.pos[p3 + 1] = o.y; this.pos[p3 + 2] = o.z === undefined ? 0.6 : o.z;
    this.vx[i] = o.vx || 0; this.vy[i] = o.vy || 0;
    this.maxLife[i] = this.life[i] = o.life || 0.6;
    this.grav[i] = o.grav === undefined ? 0 : o.grav;
    this.drag[i] = o.drag === undefined ? 1.6 : o.drag;
    this.size0[i] = o.size || 0.3; this.size1[i] = o.size1 === undefined ? 0 : o.size1;
    this.a0[i] = o.alpha === undefined ? 1 : o.alpha;
    this.mode[i] = o.mode || 0;
    const c0 = o.color === undefined ? 0xffffff : o.color;
    const c1 = o.color1 === undefined ? c0 : o.color1;
    this.r0[i] = ((c0 >> 16) & 255) / 255; this.g0[i] = ((c0 >> 8) & 255) / 255; this.b0[i] = (c0 & 255) / 255;
    this.r1[i] = ((c1 >> 16) & 255) / 255; this.g1[i] = ((c1 >> 8) & 255) / 255; this.b1[i] = (c1 & 255) / 255;
    return i;
  }
  _swap(i, j) {
    if (i === j) return;
    const i3 = i * 3, j3 = j * 3;
    for (let k = 0; k < 3; k++) this.pos[i3 + k] = this.pos[j3 + k];
    const A = ['vx', 'vy', 'life', 'maxLife', 'grav', 'drag', 'size0', 'size1', 'a0', 'mode', 'r0', 'g0', 'b0', 'r1', 'g1', 'b1'];
    for (const k of A) this[k][i] = this[k][j];
  }
  update(dt, target) {
    for (let i = 0; i < this.count; i++) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        this.count--;
        this._swap(i, this.count);
        i--; continue;
      }
      const i3 = i * 3;
      if (this.mode[i] === 1 && target) {
        // 追踪（灵魂/吉欧吸附）
        const dx = target.x - this.pos[i3], dy = target.y - this.pos[i3 + 1];
        const d = max(0.001, hypot(dx, dy));
        const acc = 34 + (1 - this.life[i] / this.maxLife[i]) * 90;
        this.vx[i] += dx / d * acc * dt;
        this.vy[i] += dy / d * acc * dt;
        this.vx[i] *= 1 - min(.96, 3.0 * dt); this.vy[i] *= 1 - min(.96, 3.0 * dt);
      } else if (this.mode[i] === 2) {
        this.vy[i] += 1.6 * dt;
        this.vx[i] += sin(this.life[i] * 6 + i) * 1.2 * dt;
      } else {
        this.vy[i] -= this.grav[i] * dt;
        const dr = 1 - min(.98, this.drag[i] * dt);
        this.vx[i] *= dr; this.vy[i] *= dr;
      }
      this.pos[i3] += this.vx[i] * dt;
      this.pos[i3 + 1] += this.vy[i] * dt;

      const u = 1 - this.life[i] / this.maxLife[i];
      this.siz[i] = lerp(this.size0[i], this.size1[i], u);
      this.alp[i] = this.a0[i] * (u < .12 ? u / .12 : 1 - (u - .12) / .88);
      const c3 = i * 3;
      this.col[c3] = lerp(this.r0[i], this.r1[i], u);
      this.col[c3 + 1] = lerp(this.g0[i], this.g1[i], u);
      this.col[c3 + 2] = lerp(this.b0[i], this.b1[i], u);
    }
    this.geo.setDrawRange(0, this.count);
    if (this.count > 0) {
      this.geo.attributes.position.needsUpdate = true;
      this.geo.attributes.aColor.needsUpdate = true;
      this.geo.attributes.aSize.needsUpdate = true;
      this.geo.attributes.aAlpha.needsUpdate = true;
    }
  }
  clear() { this.count = 0; this.geo.setDrawRange(0, 0); }
}

/* ---------- 特效网格池（冲击波/闪光/残影） ---------- */
class FxMeshPool {
  constructor(scene) {
    this.scene = scene; this.items = [];
    this.free = [];
  }
  _obtain(kind) {
    for (let i = 0; i < this.free.length; i++) {
      if (this.free[i].kind === kind) return this.free.splice(i, 1)[0];
    }
    let m;
    if (kind === 'ring') m = ringQuad(1, 0xffffff, 1);
    else if (kind === 'glow') m = glowQuad(1, 0xffffff, 1);
    else if (kind === 'crescent') {
      m = new THREE.Mesh(geo('fxCres', () => crescentGeo(1.0, 1.0, 0.26, 20)),
        flatMat(0xffffff, { additive: true, transparent: true, opacity: 1 }));
    } else {
      m = new THREE.Mesh(geo('fxQuad', () => new THREE.PlaneGeometry(1, 1)),
        flatMat(0xffffff, { additive: true, transparent: true, opacity: 1 }));
    }
    m.kind = kind;
    return m;
  }
  add(kind, o) {
    const m = this._obtain(kind);
    m.visible = true;
    m.position.set(o.x, o.y, o.z === undefined ? 0.8 : o.z);
    m.rotation.z = o.rot || 0;
    m.scale.set(o.s0 === undefined ? 1 : o.s0, (o.s0 === undefined ? 1 : o.s0) * (o.aspect || 1), 1);
    m.material.color.setHex(o.color === undefined ? 0xffffff : o.color);
    m.material.opacity = o.alpha === undefined ? 1 : o.alpha;
    m.material.blending = o.normal ? THREE.NormalBlending : THREE.AdditiveBlending;
    // 上限保护：特效网格是活的场景子节点，必须有界
    if (this.items.length > 140) {
      const old = this.items.shift();
      this.scene.remove(old.m); old.m.visible = false; this.free.push(old.m);
    }
    this.scene.add(m);
    this.items.push({
      m, t: 0, life: o.life || .3, s0: o.s0 === undefined ? 1 : o.s0, s1: o.s1 === undefined ? 2 : o.s1,
      a0: o.alpha === undefined ? 1 : o.alpha, rotV: o.rotV || 0, aspect: o.aspect || 1,
      ease: o.ease || Ease.outQuad, follow: o.follow || null, ox: o.ox || 0, oy: o.oy || 0,
    });
    return m;
  }
  update(dt) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.t += dt;
      const u = clamp01(it.t / it.life), k = it.ease(u);
      const s = lerp(it.s0, it.s1, k);
      it.m.scale.set(s, s * it.aspect, 1);
      it.m.material.opacity = it.a0 * (1 - u);
      it.m.rotation.z += it.rotV * dt;
      if (it.follow) { it.m.position.x = it.follow.x + it.ox; it.m.position.y = it.follow.y + it.oy; }
      if (u >= 1) {
        this.scene.remove(it.m);
        it.m.visible = false;
        this.free.push(it.m);
        this.items.splice(i, 1);
      }
    }
  }
  clear() {
    for (const it of this.items) { this.scene.remove(it.m); this.free.push(it.m); }
    this.items.length = 0;
  }
}

const Fx = {

  init(scene) {
    this.scene = scene;
    this.add = new ParticleSystem(1400, texSpark(), true);
    this.alpha = new ParticleSystem(700, texSmoke(), false);

/* ==============================================================
   7. 后期处理 · r128 无 EffectComposer，手写多趟渲染
      scene → rtMain
      rtMain → rtBright（阈值提亮）
      rtBright →(H)→ rtA →(V)→ rtB →(H)→ rtA →(V)→ rtB   两轮分离高斯
      rtMain + rtB → 屏幕（合成 + 暗角 + 颗粒 + 色差 + 径向模糊 + 闪白）
   ============================================================== */
const Post = {
  enabled: true,
  renderer: null, w: 1, h: 1,
  rtMain: null, rtBright: null, rtA: null, rtB: null,
  quadScene: null, quadCam: null, quad: null,
  matBright: null, matBlur: null, matComp: null,
  time: 0,
  // 外部可调
  flash: 0, flashColor: new THREE.Color(0xffffff),
  ca: 0, radial: 0, sat: 1, vig: 1, bloomStr: .85, grade: new THREE.Color(0xffffff),

  init(renderer, w, h) {
    this.renderer = renderer;
    const base = {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, stencilBuffer: false, generateMipmaps: false,
      wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
    };
    const optMain = Object.assign({ depthBuffer: true }, base);
    const optHalf = Object.assign({ depthBuffer: false }, base);
    this.rtMain = new THREE.WebGLRenderTarget(w, h, optMain);
    const hw = max(2, w >> 1), hh = max(2, h >> 1);
    this.rtBright = new THREE.WebGLRenderTarget(hw, hh, optHalf);
    this.rtA = new THREE.WebGLRenderTarget(hw, hh, optHalf);
    this.rtB = new THREE.WebGLRenderTarget(hw, hh, optHalf);
    this.w = w; this.h = h;

    this.quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.quadScene = new THREE.Scene();
    const g = new THREE.PlaneGeometry(2, 2);

    const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

    this.matBright = new THREE.ShaderMaterial({
      uniforms: { tD: { value: null }, uThresh: { value: .55 }, uSoft: { value: .35 } },
      vertexShader: VS,
      fragmentShader: `
        uniform sampler2D tD; uniform float uThresh, uSoft; varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tD, vUv).rgb;
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          float k = smoothstep(uThresh, uThresh + uSoft, l);
          gl_FragColor = vec4(c * k, 1.0);
        }`,
    });

    this.matBlur = new THREE.ShaderMaterial({
      uniforms: { tD: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uTexel: { value: new THREE.Vector2(1 / hw, 1 / hh) }, uRad: { value: 1.0 } },
      vertexShader: VS,
      fragmentShader: `
        uniform sampler2D tD; uniform vec2 uDir, uTexel; uniform float uRad; varying vec2 vUv;
        void main(){
          vec2 o = uDir * uTexel * uRad;
          vec3 s = texture2D(tD, vUv).rgb * 0.227027;
          s += texture2D(tD, vUv + o * 1.3846).rgb * 0.316216;
          s += texture2D(tD, vUv - o * 1.3846).rgb * 0.316216;
          s += texture2D(tD, vUv + o * 3.2308).rgb * 0.070270;
          s += texture2D(tD, vUv - o * 3.2308).rgb * 0.070270;
          gl_FragColor = vec4(s, 1.0);
        }`,
    });

    this.matComp = new THREE.ShaderMaterial({
      uniforms: {
        tD: { value: null }, tBloom: { value: null },
        uTime: { value: 0 }, uBloom: { value: .85 }, uVig: { value: 1 },
        uCA: { value: 0 }, uRadial: { value: 0 }, uFlash: { value: 0 },
        uFlashCol: { value: new THREE.Color(1, 1, 1) },
        uSat: { value: 1 }, uGrain: { value: .045 },
        uGrade: { value: new THREE.Color(1, 1, 1) },
        uCenter: { value: new THREE.Vector2(.5, .5) },
        uAspect: { value: 1.777 },
      },
      vertexShader: VS,
      fragmentShader: `
        uniform sampler2D tD, tBloom;
        uniform float uTime, uBloom, uVig, uCA, uRadial, uFlash, uSat, uGrain, uAspect;
        uniform vec3 uFlashCol, uGrade;
        uniform vec2 uCenter;
        varying vec2 vUv;
        float rand(vec2 co){ return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453); }
        void main(){
          vec2 uv = vUv;
          vec2 d = uv - uCenter;
          float r = length(vec2(d.x * uAspect, d.y));

          // radial blur (dash)
          vec3 col;
          if(uRadial > 0.001){
            col = vec3(0.0);
            float tot = 0.0;
            for(int i = 0; i < 6; i++){
              float f = 1.0 - float(i) * 0.028 * uRadial;
              float w = 1.0 - float(i) * 0.12;
              col += texture2D(tD, uCenter + d * f).rgb * w;
              tot += w;
            }
            col /= tot;
          } else {
            col = texture2D(tD, uv).rgb;
          }

          // chromatic aberration
          if(uCA > 0.001){
            float amt = uCA * (0.002 + r * 0.010);
            col.r = texture2D(tD, uv + d * amt).r;
            col.b = texture2D(tD, uv - d * amt).b;
          }

          // bloom
          vec3 bl = texture2D(tBloom, uv).rgb;
          col += bl * uBloom;

          // color grade
          col *= uGrade;
          float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
          col = mix(vec3(l), col, uSat);
          col = pow(max(col, 0.0), vec3(0.96));
          col *= 1.04;

          // vignette
          float v = smoothstep(1.05, 0.28, r);
          col *= mix(1.0, v, uVig);

          // film grain
          float g = rand(uv * vec2(1024.0, 700.0) + fract(uTime) * 91.7) - 0.5;
          col += g * uGrain;

          // damage flash
          col = mix(col, uFlashCol, uFlash);
          gl_FragColor = vec4(col, 1.0);
        }`,
    });

    this.quad = new THREE.Mesh(g, this.matComp);
    this.quad.frustumCulled = false;
    this.quadScene.add(this.quad);
    this.matComp.uniforms.uAspect.value = w / h;   // init() 时 resize() 已经跑过，这里必须自己补上
  },

  resize(w, h) {
    if (!this.rtMain) return;
    this.w = w; this.h = h;
    this.rtMain.setSize(w, h);
    const hw = max(2, w >> 1), hh = max(2, h >> 1);
    this.rtBright.setSize(hw, hh); this.rtA.setSize(hw, hh); this.rtB.setSize(hw, hh);
    this.matBlur.uniforms.uTexel.value.set(1 / hw, 1 / hh);
    this.matComp.uniforms.uAspect.value = w / h;
  },

  _blit(mat, target) {
    this.quad.material = mat;
    this.renderer.setRenderTarget(target || null);
    this.renderer.clear();
    this.renderer.render(this.quadScene, this.quadCam);
  },

  render(scene, camera, dt) {
    const R = this.renderer;
    this.time += dt;
    if (!this.enabled || !this.rtMain) {
      R.setRenderTarget(null); R.render(scene, camera); return;
    }
    // 1. 场景
    R.setRenderTarget(this.rtMain);
    R.clear();
    R.render(scene, camera);

    let bloomTex = this.rtB.texture;
    if (Settings.bloom) {
      // 2. 提亮
      this.matBright.uniforms.tD.value = this.rtMain.texture;
      this._blit(this.matBright, this.rtBright);
      // 3. 两轮分离模糊
      let src = this.rtBright;
      for (let i = 0; i < 2; i++) {
        this.matBlur.uniforms.tD.value = src.texture;
        this.matBlur.uniforms.uDir.value.set(1, 0);
        this.matBlur.uniforms.uRad.value = 1 + i * 1.8;
        this._blit(this.matBlur, this.rtA);
        this.matBlur.uniforms.tD.value = this.rtA.texture;
        this.matBlur.uniforms.uDir.value.set(0, 1);
        this._blit(this.matBlur, this.rtB);
        src = this.rtB;
      }
    }
    // 4. 合成
    const u = this.matComp.uniforms;
    u.tD.value = this.rtMain.texture;
    u.tBloom.value = bloomTex;
    u.uBloom.value = Settings.bloom ? this.bloomStr : 0;
    u.uTime.value = this.time;
    u.uVig.value = this.vig;
    u.uCA.value = this.ca;
    u.uRadial.value = this.radial;
    u.uFlash.value = this.flash;
    u.uFlashCol.value.copy(this.flashColor);
    u.uSat.value = this.sat;
    u.uGrain.value = Settings.grain ? .045 : 0;
    u.uGrade.value.copy(this.grade);
    this._blit(this.matComp, null);
  },

  /** 每帧衰减瞬时效果 */
  tick(dt) {
    this.flash = max(0, this.flash - dt * 4.5);
    this.ca = damp(this.ca, 0, 7, dt);
    this.radial = damp(this.radial, 0, 9, dt);
  },
  hitFlash(amount, color) {
    this.flash = max(this.flash, amount);
    this.flashColor.setHex(color === undefined ? 0xffffff : color);
  },
};

const World = {
  id: null, def: null, area: null, A: null,
  w: 0, h: 0, grid: null,
  group: null, scene: null,
