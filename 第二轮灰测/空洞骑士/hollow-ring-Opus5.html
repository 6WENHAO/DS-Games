  /* ---------------- 商店 ---------------- */
  openShop() {
    Game.setState('shop');
    this.buildShop();
    show($('#shop'), true);
    $('#shop').classList.add('on');
    document.body.classList.add('showcursor');
  },
  closeShop() {
    $('#shop').classList.remove('on');
    document.body.classList.remove('showcursor');
    Game.setState('play');
  },
  buildShop() {
    const g = $('#shopgrid');
    g.innerHTML = '';
    $('#shopgeo').textContent = String(Game.save.geo);
    for (const it of SHOP_ITEMS) {
      const bought = Game.save.bought[it.id];
      const locked = it.need && !Game.save.bought[it.need];
      if (locked) continue;
      const d = el('div', 'shopitem' + (bought ? ' sold' : ''));
      d.appendChild(el('div', 't', it.name));
      d.appendChild(el('div', 'd', it.desc));
      d.appendChild(el('div', 'p', bought ? '已售出' : it.price + ' 吉欧'));
      d.addEventListener('click', () => this.buy(it));
      g.appendChild(d);
    }
  },
  buy(it) {
    const S = Game.save;
    if (S.bought[it.id]) return;
    if (S.geo < it.price) { Audio2.sfx('uiBack'); this.toast('吉欧不足'); return; }
    S.geo -= it.price;
    S.bought[it.id] = 1;
    Audio2.sfx('unlock', { vol: .5 });
    if (it.id === 'nail1') { S.nail = 9; S.nailLevel = 1; }
    if (it.id === 'nail2') { S.nail = 13; S.nailLevel = 2; }
    if (it.id === 'nail3') { S.nail = 17; S.nailLevel = 3; }
    if (it.id === 'mask1') { S.maxHp++; Game.player.maxHp = S.maxHp; Game.player.hp = S.maxHp; S.hp = S.maxHp; this.buildMasks(); }
    if (it.id === 'vessel1') { S.maxSoul += 33; Game.player.maxSoul = S.maxSoul; }
    if (it.charm) S.charms[it.charm] = 1;
    if (it.id === 'kmap') S.hasMap = true;
    Game.writeSave();
    this.buildShop();
    this.refreshHud(true);
    this.toast('购得：' + it.name);
  },

  /* ---------------- 能力获得演出 ---------------- */
  showFlourish(name, desc, key) {
    const f = $('#flourish');
    f.querySelector('.fname').textContent = name;
    f.querySelector('.fdesc').textContent = desc;
    f.querySelector('.fkey').textContent = key || '';
    f.classList.add('on');
    this.flourishT = 0;
    Game.setState('flourish');
  },
  updateFlourish() {
    this.flourishT = (this.flourishT || 0) + Game.dt;
    if (this.flourishT > .5 && (Input.anyPressed || Input.hit('confirm'))) {
      $('#flourish').classList.remove('on');
      Game.setState('play');
      Audio2.sfx('uiOk');
      if (this.pendingHint) { this.hint(this.pendingHint, 13); this.pendingHint = null; }
    }
  },

  /* ---------------- 淡入淡出 ---------------- */
  fade(to, dur) {
    const f = $('#fadeblack');
    f.style.transition = 'opacity ' + (dur || .45) + 's linear';
    f.style.opacity = String(to);
  },
  flashWhite() {
    const f = $('#flashwhite');
    f.style.transition = 'none'; f.style.opacity = '.9';
    setTimeout(() => { f.style.transition = 'opacity .5s'; f.style.opacity = '0'; }, 30);
  },
};
/* ==============================================================
   17. 游戏主体 · 初始化 / 房间切换 / 状态机 / 主循环
   ============================================================== */
Object.assign(Game, {

  init() {
    this.canvas = $('#cv');
    const renderer = new THREE.WebGLRenderer({
      canvas: this.canvas, antialias: false, alpha: false,
      powerPreference: 'high-performance', stencil: false,
    });
    renderer.setClearColor(0x05060a, 1);
    renderer.autoClear = true;
    this.renderer = renderer;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(CAM_FOV, 16 / 9, 0.5, 260);
    this.camera.position.z = CAM_DIST;
    Cam.init(this.camera);
    World.init(this.scene);
    Fx.init(this.scene);

    this.player = new Player();
    this.player.addToScene(this.scene);
    this.player.rig.root.visible = false;

    this.resize();
    addEventListener('resize', () => this.resize());

    Post.init(renderer, this.rw, this.rh);
    UI.init();

    this.setState('title');
    show($('#title'), true);
    document.body.classList.add('showcursor');
    $('#title').classList.add('on');
    UI.fade(0, .8);
    setTimeout(() => { $('#boot').style.opacity = '0'; }, 250);
    setTimeout(() => { $('#boot').style.display = 'none'; }, 1000);
  },

  resize() {
    const dpr = min(devicePixelRatio || 1, 2) * Settings.resScale;
    const w = innerWidth, h = innerHeight;
    this.renderer.setPixelRatio(dpr);
    this.renderer.setSize(w, h, false);
    const rw = max(2, floor(w * dpr)), rh = max(2, floor(h * dpr));
    this.rw = rw; this.rh = rh;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    Cam.resize(w / h);
    if (Post.rtMain) Post.resize(rw, rh);
    Fx.setScale(rh / (2 * Math.tan(deg(CAM_FOV) / 2)));
    document.documentElement.style.setProperty('--ui-scale', String(clamp(w / 1600, .72, 1.15)));
    if (World.group) Cam.apply();
  },

  /* ---------------- 状态 ---------------- */
  setState(s) {
    if (this.state === s) return;
    this.prevState = this.state;
    this.state = s;
    const inGame = (s === 'play' || s === 'dialog' || s === 'transition');
    UI.showHud(inGame && !!this.save);
    // 世界不再更新的状态下，玩家的持续音与蓄力必须收尾，否则会一直响
    if (!(inGame || s === 'dead')) {
      Audio2.stopLoop('focus');
      if (this.player) {
        this.player.focusing = false;
        this.player.castCharging = false;
        this.player.focusT = 0;
      }
    }
    document.body.classList.toggle('showcursor',
      s === 'title' || s === 'pause' || s === 'shop' || s === 'ending');
  },

  /* ---------------- 新游戏 / 继续 ---------------- */
  confirmNewGame() {
    const had = !!this.loadSave();
    if (had) {
      UI.showDialogue('开始新的旅程', '这将覆盖已有的存档。\n确定要重新开始吗？\n\n（按 Z / 回车 确认，Esc 取消）', () => {
        $('#title').classList.remove('on');
        this.startNew();
      });
      this._confirmNew = true;
    } else this.startNew();
  },
  startNew() {
    this.save = this.newSave();
    this.playTime = 0;
    this.writeSave();
    $('#title').classList.remove('on');
    show($('#title'), false);
    this.beginGame(this.save.room, null);
  },
  continueGame() {
    const s = this.loadSave();
    if (!s) { this.startNew(); return; }
    this.save = s;
    this.playTime = s.playTime || 0;
    // 在长椅上苏醒：与休息语义一致，恢复满血
    this.save.hp = this.save.maxHp;
    $('#title').classList.remove('on');
    show($('#title'), false);
    this.beginGame(s.benchRoom || s.room, { x: s.benchX, y: s.benchY });
  },
  beginGame(roomId, spawn) {
    Audio2.init(); Audio2.resume();
    this.player.syncFromSave(this.save);
    this.player.dead = false; this.player.deadT = 0;
    this.player.rig.root.visible = true;
    this.player.rig.setOpacity(1);
    this.player.rig.root.scale.setScalar(.95);
    UI.buildMasks();
    this.setState('play');
    UI.fade(1, 0);
    setTimeout(() => {
      const r = ROOMS[roomId] || ROOMS.cr_start;
      const sp = spawn || r.start || { x: r.w / 2, y: 6 };
      this.loadRoom(roomId, sp.x, sp.y, { announce: true });
      UI.fade(0, .8);
      if (!this.save.hints) this.save.hints = {};
      if (!this.save.hints.move) {
        this.save.hints.move = 1;
        setTimeout(() => UI.hint('<b>A D</b> / <b>← →</b> 移动　　<b>Z</b> 跳跃（长按更高）　　<b>X</b> 攻击　　<b>W</b>/<b>↑</b> 交互', 13), 3200);
      }
    }, 60);
  },

  /* ---------------- 房间加载 ---------------- */
  loadRoom(id, sx, sy, opts) {
    opts = opts || {};
    const prevArea = World.area;
    // 清理
    for (const e of this.enemies) e.rig && e.rig.root && this.scene.remove(e.rig.root);
    for (const p of this.projectiles) p.kill();
    for (const o of this.objects) o.dispose();
    for (const d of this.drops) d.kill();
    if (this.shade) { this.shade.remove(); this.shade = null; }
    this.enemies.length = 0; this.projectiles.length = 0;
    this.objects.length = 0; this.drops.length = 0;
    this.boss = null; this.bossLock = false;
    Fx.clear();
    UI.hideBossBar();
    UI.hidePrompt();

    const def = World.load(id);
    if (!def) return;
    this.roomId = id; this.roomDef = def;
    this.save.room = id;
    this.save.visited[id] = 1;

    // 敌人
    for (let i = 0; i < (def.spawns || []).length; i++) {
      const s = def.spawns[i];
      if (!ENEMY_DEFS[s.t]) continue;
      const e = new Enemy(s.t, s.x, s.y, s);
      e.addToScene(this.scene);
      this.enemies.push(e);
    }
    // 物件
    for (let i = 0; i < (def.objs || []).length; i++) {
      const o = def.objs[i];
      const key = id + ':' + i + ':' + o.t;
      if ((o.t === 'ability' || o.t === 'charm' || o.t === 'maskShard' || o.t === 'vessel')) {
        if (this.save.taken[key]) continue;
        if (o.t === 'ability' && this.save.abilities[o.ability]) continue;
        if (o.t === 'charm' && this.save.charms[o.charm]) continue;
      }
      this.objects.push(new WorldObj(o, key));
    }
    // 击败守卫后出现的翅膀
    if (id === 'dp_boss' && this.save.bosses.boss1 && !this.save.abilities.wings) {
      this.objects.push(new WorldObj({ t: 'ability', x: 24, y: 7.4, ability: 'wings' }, 'dp_boss:wings'));
      this.objects.push(new WorldObj({ t: 'glow', x: 24, y: 7.4, c: 0xcfe8ff, s: 6 }, 'dp_boss:glow'));
    }
    // 阴影
    if (this.save.shade && this.save.shade.room === id) {
      this.shade = new Shade(this.save.shade.x, this.save.shade.y, this.save.shade.geo, this.save.shade.soul);
    }

    // 玩家
    this.player.place(sx, sy);
    Cam.snapTo(sx, sy);

    // 区域演出
    if (opts.announce || prevArea !== def.area) {
      UI.showAreaTitle(AREAS[def.area].name, AREAS[def.area].sub);
    } else {
      UI.toast(def.name);
    }
    Post.grade.setHex(0xffffff);
    Audio2.startMusic(AREAS[def.area].music);
    Audio2.setIntensity(0);
    Audio2.startLoop('wind');

    // 首领
    if (def.boss && !this.save.bosses[def.boss === 'warden' ? 'boss1' : 'boss2']) {
      this.pendingBoss = def.boss;
    } else this.pendingBoss = null;

    this.writeSave();
  },

  spawnBoss(kind) {
    const x = World.w / 2, y = kind === 'warden' ? 8 : World.h * .62;
    const b = new Boss(kind, x, y);
    b.homeY = y;
    b.addToScene(this.scene);
    this.enemies.push(b);
    this.boss = b;
    this.bossLock = true;
    this.pendingBoss = null;
    UI.showBossBar(b.name);
    Audio2.startMusic('boss');
    Audio2.setIntensity(.85);
    Audio2.sfx('bossRoar');
    Game.shake(.8, 1.0);
    UI.fade(0, .2);
  },

  onBossDefeated(b) {
    const key = b.kind === 'warden' ? 'boss1' : 'boss2';
    this.save.bosses[key] = 1;
    this.bossLock = false;
    this.writeSave();
    setTimeout(() => {
      if (b.kind === 'warden') {
        Audio2.startMusic(AREAS[World.area].music);
        Audio2.setIntensity(0);
        this.objects.push(new WorldObj({ t: 'ability', x: 24, y: 7.4, ability: 'wings' }, 'dp_boss:wings'));
        this.objects.push(new WorldObj({ t: 'glow', x: 24, y: 7.4, c: 0xcfe8ff, s: 6 }, 'dp_boss:glow'));
        UI.toast('殿堂重归寂静');
      } else {
        this.showEnding();
      }
    }, 2600);
  },

  ABILITY_HINTS: {
    dash: '空中也可冲刺　·　落地或攀墙后才会恢复　·　轻按 <b>V</b> 释放复仇之魂',
    wall: '贴住墙面下滑时按 <b>Z</b> 蹬墙跳　·　垂直竖井自此可以攀登',
    wings: '十字中枢上方的封印之门，此刻应当认得你了',
    dive: '空中按 <b>↓ + V</b> 裹挟灵魂砸向大地',
    wraiths: '按 <b>↑ + V</b> 放出向上尖啸的怨魂',
    fireball: '轻按 <b>V</b> 释放怒魂　·　长按 <b>V</b> 则聚集灵魂治疗',
  },
  grantAbility(a) {
    this.save.abilities[a] = 1;
    if (a === 'dash') this.save.abilities.fireball = 1;   // 同时习得复仇之魂
    Audio2.sfx('unlock');
    UI.flashWhite();
    const A = ABILITIES[a];
    let desc = A.desc;
    if (a === 'dash') desc += '\n\n（同时习得「复仇之魂」：轻按 V 释放法术）';
    UI.showFlourish(A.name, desc, A.key);
    UI.pendingHint = this.ABILITY_HINTS[a] || null;
    this.writeSave();
  },

  restAtBench(bench) {
    const P = this.player;
    P.hp = P.maxHp; this.save.hp = P.hp;
    P.soul = P.maxSoul;
    this.save.benchRoom = this.roomId;
    this.save.benchX = bench.x; this.save.benchY = bench.y + .82;   // 与坐姿一致，避免重生时半个身子埋在地里
    this.save.room = this.roomId;
    this.respawnEnemies();
    Audio2.sfx('bench');
    Fx.burst(P.x, P.y, 0xcfe8ff, 26, 8);
    Fx.shockwave(P.x, P.y, 2.4, 0xcfe8ff, .8);
    Post.hitFlash(.25, 0xdff0ff);
    UI.refreshHud(true);
    UI.toast('已休息 · 进度已保存');
    this.writeSave();
    P.onBench = true;
    P.x = bench.x; P.y = bench.y + .82;
    setTimeout(() => { P.onBench = false; }, 1200);
  },

  /** 在长椅休息后重新生成本房间的普通敌人 */
  respawnEnemies() {
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.isBoss) continue;
      this.scene.remove(e.rig.root);
      this.enemies.splice(i, 1);
    }
    for (const s of (this.roomDef.spawns || [])) {
      if (!ENEMY_DEFS[s.t]) continue;
      const e = new Enemy(s.t, s.x, s.y, s);
      e.addToScene(this.scene);
      this.enemies.push(e);
    }
  },

  /* ---------------- 房间切换 ---------------- */
  checkTransitions() {
    if (this.transition || this.bossLock || this.state !== 'play' || !this.roomDef || !this.save) return;
    const P = this.player;
    if (P.dead) return;
    const W = World.w, H = World.h;
    for (const e of this.roomDef.exits) {
      let hit = false;
      if (e.side === 'R') hit = P.x > W - 1.0 && P.y + .6 >= e.a && P.y <= e.b;
      else if (e.side === 'L') hit = P.x < 1.0 && P.y + .6 >= e.a && P.y <= e.b;
      else if (e.side === 'T') hit = P.y > H - 2.2 && P.x >= e.a && P.x <= e.b;
      else if (e.side === 'B') hit = P.y < 1.2 && P.x >= e.a && P.x <= e.b;
      if (!hit) continue;
      if (e.req && !this.save.bosses[e.req]) {
        if (!this._reqShown) {
          this._reqShown = true;
          UI.showDialogue('封印之门', e.reqMsg || '此路不通。', () => { this._reqShown = false; this.setState('play'); });
        }
        return;
      }
      this.startTransition(e);
      return;
    }
  },
  startTransition(exit) {
    this.transition = { exit, t: 0, phase: 0 };
    this.setState('transition');
    Audio2.sfx('transition');
    UI.fade(1, .28);
    UI.hidePrompt();
  },
  updateTransition(dt) {
    const T = this.transition;
    T.t += dt;
    if (T.phase === 0 && T.t > .3) {
      T.phase = 1;
      const target = ROOMS[T.exit.to];
      const tex = (target.exits || []).find(x => x.id === T.exit.toId) || (target.exits || [])[0];
      const sx = tex ? tex.sx : target.w / 2, sy = tex ? tex.sy : 6;
      this.loadRoom(T.exit.to, sx, sy, {});
      UI.fade(0, .35);
    } else if (T.phase === 1 && T.t > .75) {
      this.transition = null;
      this.setState('play');
    }
  },

  /* ---------------- 暂停 ---------------- */
  openPause(tab) {
    if (this.state === 'pause') return;
    this._pauseFrom = this.state;
    this.setState('pause');
    UI.setTab(tab === undefined ? 0 : tab);
    $('#pause').classList.add('on');
    Audio2.sfx('uiOk');
  },
  closePause() {
    $('#pause').classList.remove('on');
    if (this._pauseFrom === 'title' || !this.save) {
      UI.buildTitleMenu();
      this.setState('title');
      $('#title').classList.add('on');
    } else this.setState('play');
    Audio2.sfx('uiBack');
    Settings.save();
  },

  /* ---------------- 死亡 ---------------- */
  onPlayerDeath() {
    Post.sat = 1;
    $('#lowhp').style.opacity = '0';
    this.setState('dead');
    setTimeout(() => { $('#death').classList.add('on'); }, 900);
  },
  respawn() {
    $('#death').classList.remove('on');
    UI.fade(1, .4);
    setTimeout(() => {
      const S = this.save;
      const P = this.player;
      P.dead = false; P.deadT = 0;
      P.hp = S.maxHp; S.hp = P.hp; P.soul = 0;
      P.iframe = 1.2;
      P.rig.setOpacity(1);
      P.rig.root.scale.setScalar(.95);
      P.rig.root.visible = true;
      this.setState('play');
      this.loadRoom(S.benchRoom || 'cr_start', S.benchX, S.benchY, { announce: true });
      P.onBench = true;
      setTimeout(() => { P.onBench = false; }, 780);
      UI.refreshHud(true);
      UI.fade(0, .8);
    }, 450);
  },

  /* ---------------- 结局 ---------------- */
  showEnding() {
    this.setState('ending');
    const e = $('#ending');
    e.querySelector('.t').textContent = '空 洞 之 环';
    e.querySelector('.p').textContent =
      '余晖散尽了。\n王国依旧沉默，但它终于可以安静地沉睡。\n\n你摘下面具，风从很远的地方吹来。';
    e.querySelector('.st').textContent =
      '游戏时间 ' + fmtTime(this.playTime) + '　·　死亡 ' + this.save.deaths + ' 次\n' +
      '吉欧 ' + this.save.geo + '　·　护符 ' + Object.keys(this.save.charms).length + ' / ' + Object.keys(CHARMS).length + '\n\n' +
      '[ 按 Z / 回车 回到主菜单 ]';
    e.classList.add('on');
    UI.hideBossBar();
    Audio2.stopMusic(2);
  },

  /* ---------------- 交互检测 ---------------- */
  updateInteract() {
    const P = this.player;
    let best = null, bd = 99;
    for (const o of this.objects) {
      if (!o.canInteract || !o.canInteract()) continue;
      const d = abs(o.x - P.x);
      if (d < bd) { bd = d; best = o; }
    }
    if (best) {
      UI.showPrompt('<b>↑ / W</b>　' + best.prompt);
      if (Input.hit('up')) { Audio2.sfx('uiOk'); best.interact(); }
    } else UI.hidePrompt();
  },

  /* ---------------- 更新 ---------------- */
  update(dt) {
    this.time += dt;
    Input.update(dt);
    updateTweens(dt);
    UI.updateToast(dt);
    Post.tick(dt);

    switch (this.state) {
      case 'title':
        UI.updateTitle();
        if (Input.hit('pause')) { /* noop */ }
        Cam.update(dt, null);
        break;

      case 'pause':
        UI.updatePause();
        if (Input.hit('pause') || Input.hit('cancel')) this.closePause();
        break;

      case 'shop':
        if (Input.hit('pause') || Input.hit('cancel')) UI.closeShop();
        break;

      case 'flourish':
        UI.updateFlourish();
        break;

      case 'dialog':
        UI.updateDialogue(dt);
        if (Input.hit('pause')) {
          if (this._confirmNew) {
            this._confirmNew = false;
            UI.dlg.on = false; UI.dlg.onClose = null;
            show($('#dialogue'), false);
            Audio2.sfx('uiBack');
            UI.buildTitleMenu();
            this.setState('title');
            $('#title').classList.add('on');
          }
        }
        if (this._confirmNew && !UI.dlg.on) this._confirmNew = false;
        if (this.roomId && this.save) this.updateWorld(dt * .15);
        break;

      case 'dead':
        this.updateWorld(dt);
        if ($('#death').classList.contains('on') && (Input.hit('confirm') || Input.hit('jump'))) this.respawn();
        break;

      case 'ending':
        if (Input.hit('confirm') || Input.hit('jump')) location.reload();
        break;

      case 'transition':
        this.updateTransition(dt);
        this.updateWorld(dt);
        break;

      case 'play':
        this.playTime += dt;
        if (Input.hit('pause')) { this.openPause(0); break; }
        if (Input.hit('map') && this.save) { this.openPause(0); break; }
        this.updateWorld(dt);
        this.updateInteract();
        this.checkTransitions();
        if (this.pendingBoss && !this.player.dead) {
          const bx = World.w / 2;
          if (abs(this.player.x - bx) < World.w * .22) this.spawnBoss(this.pendingBoss);
        }
        break;
    }
    Input.lateUpdate();
  },

  updateWorld(dt) {
    const P = this.player;
    // 顿帧
    if (this.hitstop > 0) {
      this.hitstop -= dt;
      Fx.update(dt * .25, P);
      Cam.update(dt, P);
      World.update(dt * .2);
      return;
    }
    World.update(dt);
    P.update(dt);
    if (P.dead && this.state === 'play') this.onPlayerDeath();

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.update(dt);
      if (!e.alive && (e.dying > (e.isBoss ? 3 : .4))) {
        this.scene.remove(e.rig.root);
        this.enemies.splice(i, 1);
        if (e === this.boss) this.boss = null;
      }
    }
    if (this.shade) {
      this.shade.update(dt);
      if (!this.shade.alive && this.shade.dying > .6) { this.shade.remove(); this.shade = null; }
    }
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.update(dt);
      if (p.dead) this.projectiles.splice(i, 1);
    }
    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i];
      d.update(dt);
      if (d.dead) this.drops.splice(i, 1);
    }
    for (const o of this.objects) o.update(dt);

    // 环境粒子
    if (chance(dt * 3.2) && World.A) {
      Fx.ambient(Cam.x, Cam.y, Cam.halfW * 2.2, Cam.halfH * 2.2, World.A.particle, 1);
    }
    // 战斗强度（影响音乐）
    let near = 0;
    for (const e of this.enemies) if (e.alive && dist2(e.x, e.y, P.x, P.y) < 144) near++;
    this.intensity = damp(this.intensity, this.boss ? 1 : min(1, near * .34), 1.2, dt);
    Audio2.setIntensity(this.intensity);

    Fx.update(dt, P);
    Cam.update(dt, P);
    if (P.geoStreak > 0) { P.geoStreakT = (P.geoStreakT || 0) + dt; if (P.geoStreakT > .55) { P.geoStreak = 0; P.geoStreakT = 0; } }
  },

  render(dt) {
    Post.render(this.scene, this.camera, dt);
  },
});

/* ==============================================================
   启动
   ============================================================== */
let _last = 0, _acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!_last) _last = now;
  let dt = (now - _last) / 1000;
  _last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 1 / 60;
  Game.dt = dt;
  Game._fpsAcc += dt; Game._fpsN++;
  if (Game._fpsAcc > .5) {
    Game.fps = Game._fpsN / Game._fpsAcc; Game._fpsAcc = 0; Game._fpsN = 0;
    const fe = document.getElementById('fps');
    if (fe) {
      fe.style.display = Settings.showFps ? 'block' : 'none';
      if (Settings.showFps) fe.textContent = Math.round(Game.fps) + ' FPS';
    }
  }
  try {
    Game.update(dt);
    Game.render(dt);
  } catch (err) {
    console.error(err);
  }
}

function boot() {
  Settings.load();
  Input.init();
  const unlock = () => { Audio2.init(); Audio2.resume(); Settings.load(); };
  addEventListener('pointerdown', unlock, { once: true });
  addEventListener('keydown', unlock, { once: true });
  Game.init();
  requestAnimationFrame(frame);
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
