  init(scene) { this.scene = scene; },

  /* ---------- 网格 ---------- */
  idx(x, y) { return y * this.w + x; },
  tile(x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return T_SOLID;
    return this.grid[y * this.w + x];
  },
  solid(x, y) { return this.tile(x, y) === T_SOLID; },
  /** 世界坐标处是否为实心 */
  solidAt(wx, wy) { return this.solid(floor(wx), floor(wy)); },
  hazardAt(wx, wy) { return isSpike(this.tile(floor(wx), floor(wy))); },

  buildGrid(def) {
    const w = def.w, h = def.h;
    this.w = w; this.h = h;
    const g = new Uint8Array(w * h).fill(T_SOLID);
    for (const op of def.ops) {
      const k = op[0], x = op[1], y = op[2];
      if (k === 'f' || k === 'c') {
        const val = k === 'f' ? T_SOLID : T_AIR;
        const ww = op[3], hh = op[4];
        for (let j = y; j < y + hh; j++) {
          if (j < 0 || j >= h) continue;
          for (let i = x; i < x + ww; i++) {
            if (i < 0 || i >= w) continue;
            g[j * w + i] = val;
          }
        }
      } else if (k === 'p') {
        const ww = op[3];
        for (let i = x; i < x + ww; i++) if (i >= 0 && i < w && y >= 0 && y < h) g[y * w + i] = T_PLAT;
      } else if (k === 's') {
        const ww = op[3], d = op[4];
        const val = d === 'd' ? T_SPIKE_D : d === 'l' ? T_SPIKE_L : d === 'r' ? T_SPIKE_R : T_SPIKE_U;
        for (let i = x; i < x + ww; i++) if (i >= 0 && i < w && y >= 0 && y < h) g[y * w + i] = val;
      }
    }
    this.grid = g;
  },

  /* ---------- 距离场纹理（供地形着色器） ---------- */
  buildSDF() {
    const w = this.w, h = this.h, g = this.grid;
    const D = new Float32Array(w * h);
    const BIG = 999;
    for (let i = 0; i < w * h; i++) D[i] = g[i] === T_SOLID ? BIG : 0;
    // 两趟 chamfer
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (D[i] === 0) continue;
      let m = D[i];
      if (x > 0) m = min(m, D[i - 1] + 1);
      if (y > 0) m = min(m, D[i - w] + 1);
      if (x > 0 && y > 0) m = min(m, D[i - w - 1] + 1.41);
      if (x < w - 1 && y > 0) m = min(m, D[i - w + 1] + 1.41);
      D[i] = m;
    }
    for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
      const i = y * w + x; if (D[i] === 0) continue;
      let m = D[i];
      if (x < w - 1) m = min(m, D[i + 1] + 1);
      if (y < h - 1) m = min(m, D[i + w] + 1);
      if (x < w - 1 && y < h - 1) m = min(m, D[i + w + 1] + 1.41);
      if (x > 0 && y < h - 1) m = min(m, D[i + w - 1] + 1.41);
      D[i] = m;
    }
    // 朝上表面的接近度
    const U = new Float32Array(w * h);
    for (let x = 0; x < w; x++) {
      let since = 99;
      for (let y = h - 1; y >= 0; y--) {
        const i = y * w + x;
        if (g[i] !== T_SOLID) { since = 0; U[i] = 0; }
        else { since++; U[i] = max(0, 1 - (since - 1) / 4.5); }
      }
    }
    const data = new Uint8Array(w * h * 4);
    for (let i = 0; i < w * h; i++) {
      data[i * 4] = clamp01(D[i] / 6) * 255;
      data[i * 4 + 1] = U[i] * 255;
      data[i * 4 + 2] = 0;
      data[i * 4 + 3] = 255;
    }
    const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.needsUpdate = true;
    return tex;
  },

  /* ---------- 地形网格（抖动晶格，边缘有机） ---------- */
  buildTerrainMesh() {
    const w = this.w, h = this.h;
    const J = 0.17;
    const lx = new Float32Array((w + 1) * (h + 1));
    const ly = new Float32Array((w + 1) * (h + 1));
    for (let j = 0; j <= h; j++) for (let i = 0; i <= w; i++) {
      const k = j * (w + 1) + i;
      const edge = (i === 0 || j === 0 || i === w || j === h);
      const jx = edge ? 0 : (hash2(i * 3 + 7, j * 5 + 11) - .5) * 2 * J;
      const jy = edge ? 0 : (hash2(i * 11 + 3, j * 7 + 5) - .5) * 2 * J;
      lx[k] = i + jx; ly[k] = j + jy;
    }
    const pos = [], idx = [];
    let vi = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (this.grid[y * w + x] !== T_SOLID) continue;
      const a = y * (w + 1) + x, b = a + 1, c = a + (w + 1), d = c + 1;
      pos.push(lx[a], ly[a], 0, lx[b], ly[b], 0, lx[c], ly[c], 0, lx[d], ly[d], 0);
      idx.push(vi, vi + 1, vi + 3, vi, vi + 3, vi + 2);
      vi += 4;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeBoundingSphere();
    return geo;
  },

  /* ---------- 单向平台的可视条 ---------- */
  buildPlatMesh() {
    const w = this.w, h = this.h;
    const pos = [], idx = [];
    let vi = 0;
    for (let y = 0; y < h; y++) {
      let x = 0;
      while (x < w) {
        if (this.grid[y * w + x] !== T_PLAT) { x++; continue; }
        let x2 = x;
        while (x2 + 1 < w && this.grid[y * w + x2 + 1] === T_PLAT) x2++;
        const x0 = x, x1 = x2 + 1, y0 = y + .58, y1 = y + 1.02;
        pos.push(x0, y0, 0, x1, y0, 0, x0, y1, 0, x1, y1, 0);
        idx.push(vi, vi + 1, vi + 3, vi, vi + 3, vi + 2);
        vi += 4;
        // 两端垂下的小挂饰
        for (const ex of [x0 + .12, x1 - .12]) {
          pos.push(ex - .07, y0 - .42, 0, ex + .07, y0 - .42, 0, ex - .07, y0, 0, ex + .07, y0, 0);
          idx.push(vi, vi + 1, vi + 3, vi, vi + 3, vi + 2);
          vi += 4;
        }
        x = x2 + 1;
      }
    }
    if (!pos.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    return geo;
  },

  /* ---------- 尖刺网格 ---------- */
  buildSpikeMesh() {
    const w = this.w, h = this.h;
    const pos = [], idx = [];
    let vi = 0;
    const tri = (ax, ay, bx, by, cx, cy) => {
      pos.push(ax, ay, 0, bx, by, 0, cx, cy, 0);
      idx.push(vi, vi + 1, vi + 2); vi += 3;
    };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const t = this.grid[y * w + x];
      if (!isSpike(t)) continue;
      const N = 3;
      for (let k = 0; k < N; k++) {
        const f0 = k / N, f1 = (k + 1) / N, fm = (f0 + f1) / 2;
        const jitter = (hash2(x * 7 + k, y * 13) - .5) * .12;
        if (t === T_SPIKE_U) tri(x + f0, y, x + f1, y, x + fm + jitter, y + .92);
        else if (t === T_SPIKE_D) tri(x + f0, y + 1, x + f1, y + 1, x + fm + jitter, y + .08);
        else if (t === T_SPIKE_L) tri(x + 1, y + f0, x + 1, y + f1, x + .08, y + fm + jitter);
        else tri(x, y + f0, x, y + f1, x + .92, y + fm + jitter);
      }
    }
    if (!pos.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    return geo;
  },

  /* ---------- 装饰物 ---------- */
  buildDecor(group, A, areaKey) {
    const w = this.w, h = this.h;
    const R = mulberry32(this.id.length * 7919 + w * 131 + h);
    const surf = [], ceil = [];
    for (let y = 0; y < h - 1; y++) for (let x = 0; x < w; x++) {
      if (this.grid[y * w + x] === T_SOLID && this.grid[(y + 1) * w + x] !== T_SOLID) surf.push([x, y + 1]);
      if (this.grid[y * w + x] !== T_SOLID && this.grid[(y + 1) * w + x] === T_SOLID) ceil.push([x, y + 1]);
    }
    const addMesh = (g, color, x, y, z, sx, sy, rot, opts) => {
      const m = mesh(g, color, z, opts);
      m.position.set(x, y, z); m.scale.set(sx, sy, 1); m.rotation.z = rot || 0;
      m.renderOrder = 0;                       // 装饰在地形之后绘制 -> 被岩石遮住底部
      group.add(m); this.disposables.push(m.material);
      return m;
    };
    const glowG = ArtCache.geo.unitQuad || (ArtCache.geo.unitQuad = new THREE.PlaneGeometry(1, 1));

    // 地面装饰
    for (const [x, y] of surf) {
      const r = R();
      if (r > .30) continue;
      const px = x + .5 + (R() - .5) * .5;
      if (areaKey === 'verdant') {
        if (R() < .45) {
          const s = .18 + R() * .30;
          addMesh(geo('decMush', () => shapeGeo(sh => {
            sh.moveTo(-.5, 0); sh.bezierCurveTo(-.5, .55, .5, .55, .5, 0); sh.lineTo(-.5, 0);
          }, 8)), 0x2f6a3a, px, y + s * .55, -.5, s * 2, s * 1.4, 0);
          addMesh(geo('decStem', () => roundRectGeo(1, 1, .3, 3)), 0x1a3a20, px, y + s * .3, -.52, s * .5, s * .8, 0);
          const gl = new THREE.Mesh(glowG, glowMat(0x7fd89a, .22 + R() * .2));
          gl.renderOrder = 0;
          gl.position.set(px, y + s * .6, -.45); gl.scale.setScalar(1.4 + R());
          group.add(gl); this.disposables.push(gl.material);
        } else {
          for (let k = 0; k < 3; k++) {
            addMesh(geo('decGrass', () => polyGeo([-.06, 0, .06, 0, 0, 1])), 0x2a5a33,
              px + (k - 1) * .18, y, -.5, .5 + R() * .4, .4 + R() * .5, (R() - .5) * .6);
          }
        }
      } else if (areaKey === 'depths') {
        if (R() < .4) {
          const gl = new THREE.Mesh(glowG, glowMat(0xd9683a, .18 + R() * .25));
          gl.position.set(px, y + .12, -.4); gl.scale.setScalar(.8 + R() * 1.4);
          group.add(gl); this.disposables.push(gl.material);
        }
        addMesh(geo('decRock', () => polyGeo([-.5, 0, -.2, .7, .2, .55, .5, 0])), 0x3a1d18,
          px, y, -.5, .35 + R() * .5, .3 + R() * .5, 0);
      } else if (areaKey === 'sanctum') {
        if (R() < .5) {
          addMesh(geo('decCry', () => polyGeo([-.2, 0, 0, 1, .2, 0])), 0x8fa8d8,
            px, y, -.5, .4 + R() * .5, .5 + R() * .9, (R() - .5) * .5, { opacity: .8, transparent: true });
          const gl = new THREE.Mesh(glowG, glowMat(0xbcd0ff, .2));
          gl.position.set(px, y + .4, -.42); gl.scale.setScalar(1 + R());
          group.add(gl); this.disposables.push(gl.material);
        }
      } else {
        addMesh(geo('decRock', () => polyGeo([-.5, 0, -.2, .7, .2, .55, .5, 0])), 0x1d2434,
          px, y, -.5, .3 + R() * .5, .25 + R() * .45, 0);
        if (R() < .12) {
          addMesh(geo('decBone', () => roundRectGeo(1, .2, .09, 3)), 0x6a6350,
            px, y + .12, -.48, .5 + R() * .5, .5, (R() - .5) * 1.2);
        }
      }
    }
    // 天花板垂饰
    for (const [x, y] of ceil) {
      if (R() > .22) continue;
      const px = x + .5 + (R() - .5) * .4;
      const len = .5 + R() * 1.6;
      if (areaKey === 'verdant') {
        addMesh(geo('decVine', () => polyGeo([-.07, 0, .07, 0, .03, -1, -.03, -1])), 0x1f4a28,
          px, y, -.5, .6 + R(), len, 0);
      } else {
        addMesh(geo('decStal', () => polyGeo([-.16, 0, .16, 0, 0, -1])), 0x1a1f2c,
          px, y, -.5, .5 + R() * .8, len, 0);
      }
    }
  },

  /* ---------- 视差背景 ---------- */
  buildParallax(group, areaKey) {
    const layers = [
      { z: -12, sc: 1.0, op: .50 },
      { z: -22, sc: 1.0, op: .62 },
      { z: -36, sc: 1.0, op: .74 },
      { z: -50, sc: 1.0, op: .85 },
    ];
    const cx = this.w / 2, cy = this.h / 2;
    for (let i = 0; i < layers.length; i++) {
      const L = layers[i];
      const dist = CAM_DIST - L.z;
      const vh = 2 * dist * Math.tan(deg(CAM_FOV) / 2);
      const pw = max(this.w * 1.6, vh * 2.6) + 40;
      const ph = max(this.h * 1.6, vh * 1.7) + 30;
      const tex = texParallax(areaKey, min(i, 2));
      const t2 = tex.clone(); t2.needsUpdate = true;
      t2.wrapS = THREE.RepeatWrapping; t2.wrapT = THREE.ClampToEdgeWrapping;
      t2.repeat.set(pw / 70, 1);
      t2.offset.set(i * .27, 0);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), new THREE.MeshBasicMaterial({
        map: t2, transparent: true, opacity: L.op, depthWrite: false, fog: false,
      }));
      m.position.set(cx, cy + ph * .12, L.z);
      m.renderOrder = -50 + (layers.length - 1 - i);   // 远层先画，近层后画覆盖其上
      group.add(m);
      this.disposables.push(m.material, m.geometry, t2);
    }
  },

  /* ---------- 构建整个房间 ---------- */
  load(id) {
    this.dispose();
    const def = ROOMS[id];
    if (!def) { console.error('missing room', id); return; }
    this.id = id; this.def = def;
    this.area = def.area; this.A = AREAS[def.area];
    this.buildGrid(def);

    const group = new THREE.Group();
    this.group = group;
    const A = this.A;

    // 视差
    this.buildParallax(group, def.area);

    // 背景墙：整个场景的最远层，视差剪影叠在它前面
    const backGeo = new THREE.PlaneGeometry(this.w + 170, this.h + 120);
    this.backMat = makeBackWallMaterial(A);
    this.backMat.uniforms.uSize.value.set(this.w, this.h);
    this.backMat.uniforms.uStyle.value = (def.area === 'verdant' || def.area === 'depths') ? 1 : 0;
    const back = new THREE.Mesh(backGeo, this.backMat);
    back.position.set(this.w / 2, this.h / 2, -58);
    back.renderOrder = -10;
    group.add(back);
    this.disposables.push(backGeo, this.backMat);

    // 地形
    this.sdfTex = this.buildSDF();
    this.terrainMat = makeTerrainMaterial(A);
    this.terrainMat.uniforms.uSDF.value = this.sdfTex;
    this.terrainMat.uniforms.uSize.value.set(this.w, this.h);
    const tGeo = this.buildTerrainMesh();
    const terrain = new THREE.Mesh(tGeo, this.terrainMat);
    terrain.position.z = 0;
    terrain.renderOrder = 1;
    group.add(terrain);
    this.disposables.push(tGeo, this.terrainMat, this.sdfTex);

    // 单向平台
    const pGeo = this.buildPlatMesh();
    if (pGeo) {
      const pm = mesh(pGeo, hexLerp(A.edge, 0xffffff, .18), .1, { depthWrite: true });
      pm.renderOrder = 2;
      group.add(pm);
      this.disposables.push(pGeo, pm.material);
      const pGeo2 = pGeo.clone();
      const pm2 = mesh(pGeo2, A.glow, .05, { additive: true, transparent: true, opacity: .25 });
      pm2.scale.set(1, 1, 1); pm2.position.y = .04; pm2.renderOrder = 3;
      group.add(pm2);
      this.disposables.push(pGeo2, pm2.material);
    }

    // 尖刺
    const sGeo = this.buildSpikeMesh();
    if (sGeo) {
      const sm = mesh(sGeo, hexLerp(A.edge, 0xffffff, .35), .12);
      sm.renderOrder = 3;
      group.add(sm);
      this.disposables.push(sGeo, sm.material);
    }

    // 装饰
    this.buildDecor(group, A, def.area);

    // 前景薄雾
    this.fogMats = [];
    for (const zf of [3.5, 7.5]) {
      const fm = makeFogMaterial(A, zf > 5 ? .34 : .18);
      const fg = new THREE.PlaneGeometry(this.w * 2 + 80, this.h * 2 + 60);
      const fmesh = new THREE.Mesh(fg, fm);
      fmesh.position.set(this.w / 2, this.h / 2, zf);
      fmesh.renderOrder = 40;
      group.add(fmesh);
      this.fogMats.push(fm);
      this.disposables.push(fg, fm);
    }

    this.scene.add(group);
    this.time = 0;
    return def;
  },

  update(dt) {
    this.time += dt;
    if (this.terrainMat) this.terrainMat.uniforms.uTime.value = this.time;
    if (this.backMat) this.backMat.uniforms.uTime.value = this.time;
    for (const f of this.fogMats) f.uniforms.uTime.value = this.time;
  },
  pulse(v) { if (this.terrainMat) this.terrainMat.uniforms.uPulse.value = v; },

  dispose() {
    if (this.group) {
      this.scene.remove(this.group);
      for (const d of this.disposables) { try { d.dispose && d.dispose(); } catch (e) {} }
      this.disposables.length = 0;
      this.group = null;
    }
  },

  /** 检测某个 AABB 是否与实心格重叠 */
  boxHitsSolid(cx, cy, hw, hh) {
    const x0 = floor(cx - hw), x1 = floor(cx + hw - 1e-6);
    const y0 = floor(cy - hh), y1 = floor(cy + hh - 1e-6);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
      if (this.solid(x, y)) return true;
    return false;
  },
  /** AABB 是否碰到尖刺 */
  boxHitsSpike(cx, cy, hw, hh) {
    const x0 = floor(cx - hw), x1 = floor(cx + hw - 1e-6);
    const y0 = floor(cy - hh), y1 = floor(cy + hh - 1e-6);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
      if (isSpike(this.tile(x, y))) return true;
    return false;
  },
  /** 视线检测（用于敌人 AI） */
  lineOfSight(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    const n = ceil(hypot(dx, dy) * 2);
    for (let i = 1; i < n; i++) {
      const t = i / n;
      if (this.solidAt(x0 + dx * t, y0 + dy * t)) return false;
    }
    return true;
  },
  /** 找到脚下最近的地面（用于尖刺重生） */
  groundBelow(wx, wy) {
    const x = floor(wx);
    for (let y = floor(wy); y >= 0; y--) {
      const t = this.tile(x, y);
      if (t === T_SOLID || t === T_PLAT) return y + 1;
    }
    return null;
  },
};
/* ==============================================================
   10. 物理 · 分轴扫描 AABB + 单向平台 + 高速分步
   ============================================================== */
const EPS = 1e-4;
const MAX_STEP = 0.35;   // 单次子步最大位移（防止高速穿墙）

/**
 * body: { x, y, vx, vy, hw, hh }
 * 输出：body.grounded / hitCeil / wallL / wallR
 */
function moveBody(b, dt, opt) {
  opt = opt || {};
  b.grounded = false; b.hitCeil = false; b.wallL = false; b.wallR = false;
  let dx = b.vx * dt, dy = b.vy * dt;
  const steps = max(1, ceil(max(abs(dx), abs(dy)) / MAX_STEP));
  const sx = dx / steps, sy = dy / steps;

  for (let s = 0; s < steps; s++) {
    /* ---- X ---- */
    if (sx !== 0) {
      b.x += sx;
      if (World.boxHitsSolid(b.x, b.y, b.hw, b.hh)) {
        if (sx > 0) { b.x = floor(b.x + b.hw) - b.hw - EPS; b.wallR = true; }
        else { b.x = floor(b.x - b.hw) + 1 + b.hw + EPS; b.wallL = true; }
        b.vx = 0;
      }
    }
    /* ---- Y ---- */
    if (sy !== 0) {
      const bottomOld = b.y - b.hh;
      b.y += sy;
      if (World.boxHitsSolid(b.x, b.y, b.hw, b.hh)) {
        if (sy < 0) { b.y = floor(b.y - b.hh) + 1 + b.hh + EPS; b.grounded = true; }
        else { b.y = floor(b.y + b.hh) - b.hh - EPS; b.hitCeil = true; }
        b.vy = 0;
      } else if (sy < 0 && !opt.noPlatform) {
        // 单向平台：仅在下落且此前脚底位于平台面之上时生效
        const bottomNew = b.y - b.hh;
        const y0 = floor(bottomNew), y1 = floor(bottomOld);
        for (let ty = y1; ty >= y0; ty--) {
          const top = ty + 1;
          if (bottomOld < top - 1e-3 || bottomNew >= top) continue;
          const xa = floor(b.x - b.hw + 0.02), xb = floor(b.x + b.hw - 0.02);
          let hit = false;
          for (let tx = xa; tx <= xb; tx++) if (World.tile(tx, ty) === T_PLAT) { hit = true; break; }
          if (hit) { b.y = top + b.hh + EPS; b.vy = 0; b.grounded = true; break; }
        }
      }
    }
    if (b.grounded || b.hitCeil) { /* 继续剩余子步 */ }
  }
  // 侧向贴墙检测（即使本帧无水平位移）
  if (!b.wallL && World.boxHitsSolid(b.x - 0.06, b.y, b.hw, b.hh * .92)) b.wallL = true;
  if (!b.wallR && World.boxHitsSolid(b.x + 0.06, b.y, b.hw, b.hh * .92)) b.wallR = true;
  // 站立检测（即使 vy==0）
  if (!b.grounded && b.vy <= 0.001) {
    if (World.boxHitsSolid(b.x, b.y - 0.05, b.hw, b.hh)) b.grounded = true;
    else {
      const bottom = b.y - b.hh;
      const ty = floor(bottom - 0.05);
      if (abs(bottom - (ty + 1)) < 0.08) {
        const xa = floor(b.x - b.hw + 0.02), xb = floor(b.x + b.hw - 0.02);
        for (let tx = xa; tx <= xb; tx++) if (World.tile(tx, ty) === T_PLAT) { b.grounded = true; break; }
      }
    }
  }
}

const Game = {
  state: 'boot',          // boot/title/play/pause/dialog/dead/shop/flourish/ending/transition
  prevState: 'play',
  scene: null, camera: null, renderer: null, canvas: null,
  player: null,
  enemies: [], projectiles: [], objects: [], drops: [], boss: null, shade: null,
  time: 0, dt: 0, hitstop: 0, slowmo: 1,
  roomId: null, roomDef: null,
  transition: null,
  fps: 60, _fpsAcc: 0, _fpsN: 0,
  playTime: 0,
  intensity: 0,

  save: null,

  newSave() {
    return {
      v: 1,
      room: 'cr_start', benchRoom: 'cr_start', benchX: 6, benchY: 5.82,
      maxHp: 5, hp: 5, maxSoul: 99, geo: 0,
      nail: 5, nailLevel: 0,
      abilities: {},                 // dash/wall/wings/fireball/dive/wraiths
      charms: {},                    // 拥有
      equipped: [],                  // 已装备
      notches: 5,
      bought: {},                    // 商店已购
      taken: {},                     // 已拾取的一次性物品 key
      bosses: {},                    // boss1/boss2
      visited: {},                   // 已访问房间
      shade: null,                   // {room,x,y,geo,soul}
      maskShards: 0, vesselFrags: 0,
      hints: {},
      hasMap: false,
      playTime: 0,
      deaths: 0,
    };
  },

  loadSave() {
    try {
      const raw = LS.get(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.v !== 1) return null;
      const base = this.newSave();
      for (const k in base) if (!(k in s)) s[k] = base[k];
      return s;
    } catch (e) { return null; }
  },
  writeSave() {
    if (!this.save) return;
    try {
      this.save.playTime = this.playTime;
      LS.set(SAVE_KEY, JSON.stringify(this.save));
    } catch (e) {}
  },
  clearSave() { LS.del(SAVE_KEY); },

  /** 玩家伤害的有效目标：普通敌人 + 阴影（阴影不在 enemies 数组里） */
  hitTargets() { return this.shade && this.shade.alive ? this.enemies.concat(this.shade) : this.enemies; },

  has(a) { return !!(this.save && this.save.abilities[a]); },
  charm(c) { return !!(this.save && this.save.equipped.indexOf(c) >= 0); },

  /* 屏幕震动 */
  shakeAmt: 0, shakeT: 0,
  shake(amount, dur) {
    amount *= Settings.shake;
    if (amount <= 0) return;
    this.shakeAmt = max(this.shakeAmt, amount);
    this.shakeT = max(this.shakeT, dur || .28);
  },
  freeze(t) { this.hitstop = max(this.hitstop, min(t, .18)); },
};
/* ==============================================================
   11. 玩家 · 移动 / 战斗 / 法术 / 状态机
   ============================================================== */
const PC = {
  HW: 0.31, HH: 0.68,
  RUN: 9.2, ACC_G: 105, ACC_A: 68, FRIC_G: 95, FRIC_A: 22,
  JUMP_V: 17.0, GRAV_UP: 42, GRAV_DOWN: 58, MAX_FALL: 30, JUMP_CUT: 0.42,
  COYOTE: 0.10,
  DASH_V: 24, DASH_T: 0.23, DASH_CD: 0.42,
  DJ_V: 16.2,
  WALL_SLIDE: 5.6, WJ_X: 12.5, WJ_Y: 15.8, WALL_LOCK: 0.17,
  POGO_V: 15.2,
  ATK_T: 0.30, ATK_CD: 0.06, ATK_A0: 0.03, ATK_A1: 0.17,
  RECOIL: 6.5, RECOIL_T: 0.09,
  IFRAME: 1.30, HURT_T: 0.32, HURT_VX: 9, HURT_VY: 8.5,
  SOUL_HIT: 11, SOUL_MAX_DEF: 99, SPELL_COST: 33,
  FOCUS_T: 0.85, FOCUS_COST: 33,
};

class Player {
  constructor() {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.hw = PC.HW; this.hh = PC.HH;
    this.grounded = false; this.wasGrounded = false; this.hitCeil = false;
    this.wallL = false; this.wallR = false;
    this.face = 1;
    this.anim = 'idle'; this.animT = 0;
    this.coyote = 0; this.jumpHeld = false;
    this.dashT = 0; this.dashCD = 0; this.dashUsed = false; this.dashDir = 1;
    this.djUsed = false;
    this.wallDir = 0; this.wallLock = 0; this.wallSliding = false;
    this.atkT = 0; this.atkCD = 0; this.atkDir = 0; this.atkHits = null; this.pogoed = false;
    this.recoil = 0;
    this.iframe = 0; this.hurtT = 0;
    this.castCharging = false; this.castPress = 0; this.focusT = 0; this.focusing = false;
    this.castAnimT = 0;
    this.diving = false; this.diveT = 0;
    this.hp = 5; this.maxHp = 5; this.soul = 0; this.maxSoul = 99;
    this.dead = false; this.deadT = 0;
    this.benchT = 0; this.onBench = false;
    this.spikeT = 0;
    this.safeX = 0; this.safeY = 0; this.safeTimer = 0;
    this.squash = 0;
    this.stepT = 0;
    this.vyPrev = 0; this.dropT = 0;
    this.respawnX = 0; this.respawnY = 0;
    this.geoStreakT = 0;
    this.invisible = false;
    this.rig = buildKnight();
    this.rig.root.scale.setScalar(0.95);
    this.geoStreak = 0;
  }

  addToScene(scene) { scene.add(this.rig.root); }

  syncFromSave(s) {
    this.maxHp = s.maxHp; this.hp = min(s.hp, s.maxHp);
    this.maxSoul = s.maxSoul; this.soul = 0;
  }

  place(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.rig.root.position.z = 0.7;
    this.safeX = x; this.safeY = y;
    this.dashT = 0; this.atkT = 0; this.hurtT = 0; this.diving = false;
    this.focusing = false; this.castCharging = false; this.focusT = 0;
    this.grounded = false;
    this.anim = 'fall';
    this.updateRig(0);
  }

  get box() { return _pbox.set(this.x, this.y, this.hw, this.hh); }

  /* ============ 主更新 ============ */
  update(dt) {
    if (this.dead) { this.updateDead(dt); return; }
    if (this.onBench) { this.updateBench(dt); return; }

    this.wasGrounded = this.grounded;
    const I = Input;

    /* --- 计时器 --- */
    if (this.dashCD > 0) this.dashCD -= dt;
    if (this.atkCD > 0) this.atkCD -= dt;
    if (this.iframe > 0) this.iframe -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;
    if (this.recoil > 0) this.recoil -= dt;
    if (this.wallLock > 0) this.wallLock -= dt;
    if (this.spikeT > 0) {
      this.spikeT -= dt;
      if (this.spikeT <= 0) {
        this.x = this.respawnX; this.y = this.respawnY + .25;
        this.vx = 0; this.vy = 0; this.invisible = false;
        Fx.burst(this.x, this.y, 0xbfd8ff, 14, 6);
        Cam.snapTo(this.x, this.y);
      }
      this.updateRig(dt); return;
    }
    if (this.grounded) {
      this.coyote = PC.COYOTE;
      this.djUsed = false;
      if (this.dashT <= 0) this.dashUsed = false;   // 站在地面上即可恢复冲刺（原来只在「落地那一帧」恢复）
    } else if (this.coyote > 0) this.coyote -= dt;

    const locked = this.hurtT > 0 || this.castAnimT > 0;
    const ax = locked ? 0 : I.ax;
    if (!locked && ax !== 0 && this.wallLock <= 0 && this.dashT <= 0) this.face = ax;

    /* --- 攻击 --- */
    if (!locked && this.atkT <= 0 && this.atkCD <= 0 && I.consume('attack') && !this.focusing) {
      this.startAttack();
    }
    if (this.atkT > 0) {
      this.atkT -= dt;
      this.checkAttackHits();
      if (this.atkT <= 0) { this.atkCD = PC.ATK_CD; this.atkHits = null; }
    }

    /* --- 冲刺 --- */
    if (!locked && Game.has('dash') && this.dashT <= 0 && this.dashCD <= 0 && !this.dashUsed && I.consume('dash')) {
      this.startDash();
    }
    if (this.dashT > 0) {
      this.dashT -= dt;
      const spd = PC.DASH_V * (Game.charm('dashmaster') ? 1.18 : 1);
      this.vx = this.dashDir * spd;
      this.vy = 0;
      if (chance(dt * 42 * Settings.particles)) Fx.ghost(this.x, this.y + .1, this.face, 0x9ecdff);
      if (chance(dt * 60)) Fx.add.spawn({
        x: this.x - this.dashDir * .3, y: this.y + rr(-.5, .5), vx: -this.dashDir * rr(1, 5), vy: rr(-1, 1),
        life: rr(.12, .3), size: rr(.2, .45), size1: 0, color: 0xdff0ff, color1: 0x5599dd, z: .3,
      });
      if (this.dashT <= 0) { this.vx *= .45; this.dashCD = PC.DASH_CD * (Game.charm('dashmaster') ? .65 : 1); }
    }

    /* --- 施法 / 聚集 --- */
    this.updateCast(dt, locked);

    /* --- 深渊俯冲 --- */
    if (this.diving) {
      this.vx = 0; this.vy = -30;
      this.iframe = max(this.iframe, .05);
      if (chance(dt * 60)) Fx.add.spawn({
        x: this.x + rr(-.4, .4), y: this.y + rr(-.4, .8), vx: rr(-2, 2), vy: rr(2, 8),
        life: rr(.15, .4), size: rr(.3, .7), size1: 0, color: 0xffffff, color1: 0x77bbff, z: .5,
      });
      if (this.grounded) this.endDive();
    }

    /* --- 水平移动 --- */
    if (this.dashT <= 0 && !this.diving) {
      const target = ax * PC.RUN;
      const onGround = this.grounded;
      if (this.wallLock > 0) {
        // 蹬墙后短暂锁定方向
      } else if (this.recoil > 0) {
        // 命中反推中
      } else if (ax !== 0) {
        const acc = onGround ? PC.ACC_G : PC.ACC_A;
        this.vx = approach(this.vx, target, acc * dt);
      } else {
        const fr = onGround ? PC.FRIC_G : PC.FRIC_A;
        this.vx = approach(this.vx, 0, fr * dt);
      }
    }

    /* --- 贴墙下滑 --- */
    this.wallSliding = false;
    if (!this.grounded && this.dashT <= 0 && !this.diving && Game.has('wall') && this.hurtT <= 0) {
      const pushL = I.isDown('left') && this.wallL, pushR = I.isDown('right') && this.wallR;
      if ((pushL || pushR) && this.vy < 2) {
        this.wallSliding = true;
        this.wallDir = pushL ? -1 : 1;
        this.face = -this.wallDir;
        this.vy = max(this.vy, -PC.WALL_SLIDE);
        this.dashUsed = false; this.djUsed = false;
        if (chance(dt * 21)) Fx.dust(this.x + this.wallDir * .35, this.y + rr(-.4, .4), 1, 0x8899aa, .6);
        if (chance(dt * 5.25)) Audio2.sfx('wallslide');
      }
    }

    /* --- 下穿单向平台（必须在跳跃状态机之前，否则跳跃会先吃掉输入缓冲） --- */
    if (this.dropT > 0) this.dropT -= dt;
    if (!locked && I.isDown('down') && this.grounded && I.peek('jump') && !this.onSolidGround()) {
      I.consume('jump'); this.dropT = .2; this.y -= .1; this.vy = -3;
      Audio2.sfx('step', { vol: .5 });
    }

    /* --- 跳跃 --- */
    if (!locked && this.dropT <= 0 && I.peek('jump')) {
      if (this.wallSliding) {
        I.consume('jump');
        this.vy = PC.WJ_Y; this.vx = -this.wallDir * PC.WJ_X;
        this.face = -this.wallDir; this.wallLock = PC.WALL_LOCK;
        this.jumpHeld = true; this.djUsed = false; this.dashUsed = false;
        Audio2.sfx('jump', { pitch: 1.1 });
        Fx.dust(this.x + this.wallDir * .35, this.y - .2, 6, 0x9aa8bb, 1.5);
        Fx.shockwave(this.x + this.wallDir * .4, this.y, .5, 0x88aacc, .25);
      } else if (this.coyote > 0 && this.dashT <= 0) {
        I.consume('jump');
        this.vy = PC.JUMP_V; this.coyote = 0; this.jumpHeld = true;
        this.grounded = false;
        Audio2.sfx('jump');
        Fx.dust(this.x, this.y - this.hh, 5, 0x9aa8bb, 1.6);
      } else if (Game.has('wings') && !this.djUsed && this.dashT <= 0 && !this.diving) {
        I.consume('jump');
        this.vy = PC.DJ_V; this.djUsed = true; this.jumpHeld = true;
        Audio2.sfx('dblJump');
        Fx.burst(this.x, this.y - .3, 0xbfe6ff, 14, 7);
        Fx.shockwave(this.x, this.y - .2, 1.0, 0xbfe6ff, .3);
        this.spawnWings();
      }
    }
    if (I.up('jump')) this.jumpHeld = false;
    if (!I.isDown('jump')) this.jumpHeld = false;

    /* --- 重力 --- */
    if (this.dashT <= 0 && !this.diving) {
      if (this.wallSliding) {
        this.vy = max(this.vy - PC.GRAV_DOWN * dt, -PC.WALL_SLIDE);
      } else {
        const g = (this.vy > 0 && this.jumpHeld) ? PC.GRAV_UP : (this.vy > 0 ? PC.GRAV_UP / PC.JUMP_CUT * .55 : PC.GRAV_DOWN);
        this.vy -= g * dt;
        if (this.vy < -PC.MAX_FALL) this.vy = -PC.MAX_FALL;
      }
    }

    /* --- 移动与碰撞 --- */
    moveBody(this, dt, { noPlatform: this.dropT > 0 });

    /* --- 落地 --- */
    if (this.grounded && !this.wasGrounded) {
      const impact = clamp01(-this.vyPrev / 24);
      this.squash = .35 * impact + .12;
      this.dashUsed = false; this.djUsed = false;
      if (impact > .4) { Audio2.sfx('landHard'); Game.shake(.22 * impact, .18); Fx.dust(this.x, this.y - this.hh, 10, 0x9aa8bb, 3); }
      else { Audio2.sfx('land', { vol: .5 + impact }); Fx.dust(this.x, this.y - this.hh, 4, 0x9aa8bb, 1.6); }
    }
    this.vyPrev = this.vy;
    this.squash = damp(this.squash, 0, 12, dt);

    /* --- 跑动脚步与尘土 --- */
    if (this.grounded && abs(this.vx) > 3) {
      this.stepT -= dt;
      if (this.stepT <= 0) {
        this.stepT = .27;
        Audio2.sfx('step', { vol: .6 });
        Fx.dust(this.x - sign(this.vx) * .2, this.y - this.hh, 1, 0x8a94a8, .8);
      }
    }

    /* --- 危险与安全点 --- */
    this.checkHazard(dt);
    if (this.grounded && this.hurtT <= 0 && !World.boxHitsSpike(this.x, this.y - .2, this.hw + .4, this.hh)) {
      this.safeTimer += dt;
      if (this.safeTimer > .12) { this.safeX = this.x; this.safeY = this.y; }
    } else this.safeTimer = 0;

    /* --- 动画选择 --- */
    this.pickAnim(dt);
    this.updateRig(dt);
  }

  /** feet resting on real solid ground (cannot drop through) */
  onSolidGround() {
    const ty = floor(this.y - this.hh - .06);
    const xa = floor(this.x - this.hw + .02), xb = floor(this.x + this.hw - .02);
    for (let tx = xa; tx <= xb; tx++) if (World.tile(tx, ty) === T_SOLID) return true;
    return false;
  }

  /* ============ 动画 ============ */
  pickAnim(dt) {
    let a;
    if (this.hurtT > 0) a = 'hurt';
    else if (this.castAnimT > 0) a = 'cast';
    else if (this.focusing) a = 'focus';
    else if (this.dashT > 0) a = 'dash';
    else if (this.atkT > 0) a = 'attack';
    else if (this.wallSliding) a = 'wall';
    else if (!this.grounded) a = this.vy > 0.5 ? 'jump' : 'fall';
    else if (abs(this.vx) > 0.6) a = 'run';
    else a = 'idle';
    if (a !== this.anim) { this.anim = a; this.animT = 0; }
    this.animT += dt;
  }

  updateRig(dt) {
    const r = this.rig;
    r.root.position.set(this.x, this.y + 0.15, 0.7);
    r.root.scale.x = 0.95 * this.face;
    r.root.scale.y = 0.95;
    let at = this.animT;
    if (this.anim === 'attack') at = PC.ATK_T - this.atkT;
    if (this.anim === 'hurt') at = PC.HURT_T - this.hurtT;
    animateKnight(r, {
      anim: this.anim, at, face: this.face, vx: this.vx, vy: this.vy,
      grounded: this.grounded, squash: this.squash, atkDir: this.atkDir,
      focusAmt: this.focusing ? clamp01(this.focusT / this.focusTime()) : 0,
    }, dt);
    // 受击闪烁
    const inv = this.iframe > 0 && this.hurtT <= 0;
    const blink = inv ? (sin(Game.time * 42) > 0 ? .28 : 1) : 1;
    r.setOpacity(this.invisible ? 0 : blink);
    r.flash(this.hurtT > 0 ? .75 : 0);
    r.slashG.visible = false;
  }

  /* ============ 攻击 ============ */
  attackDuration() { return PC.ATK_T * (Game.charm('quickslash') ? .62 : 1); }
  startAttack() {
    const I = Input;
    let dir = 0;
    if (I.isDown('up')) dir = 1;
    else if (I.isDown('down') && !this.grounded) dir = -1;
    this.atkDir = dir;
    this.atkT = this.attackDuration();
    this.atkHits = [];
    this.pogoed = false;
    Audio2.sfx('swing', { pitch: dir === 1 ? 1.15 : dir === -1 ? .9 : 1 });
    // 弧光
    const reach = this.reach();
    const cx = this.x + (dir === 0 ? this.face * reach * .62 : 0);
    const cy = this.y + (dir === 1 ? reach * .72 : dir === -1 ? -reach * .72 : .05);
    const ang = dir === 0 ? (this.face > 0 ? 0 : PI) : (dir === 1 ? PI / 2 : -PI / 2);
    Fx.slashArc(cx, cy, ang, reach * .95, 0xe8f4ff);
  }
  reach() { return 1.75 * (Game.charm('longnail') ? 1.25 : 1); }

  attackBox() {
    const R = this.reach();
    if (this.atkDir === 1) return _abox.set(this.x, this.y + R * .62 + .2, R * .40, R * .55);
    if (this.atkDir === -1) return _abox.set(this.x, this.y - R * .62 - .1, R * .40, R * .55);
    return _abox.set(this.x + this.face * (R * .58), this.y + .05, R * .52, R * .38);
  }

  checkAttackHits() {
    const prog = 1 - this.atkT / this.attackDuration();
    if (prog < PC.ATK_A0 / PC.ATK_T || prog > PC.ATK_A1 / PC.ATK_T + .25) return;
    const box = this.attackBox();
    const dmg = Game.save.nail;
    let anyHit = false;

    for (const e of Game.hitTargets()) {
      if (!e.alive || e.noHit) continue;
      if (this.atkHits.indexOf(e) >= 0) continue;
      if (!box.hits(e.box)) continue;
      this.atkHits.push(e);
      const dirX = this.atkDir === 0 ? this.face : sign(e.x - this.x) || this.face;
      const res = e.hurt(dmg, dirX, { from: 'nail', dirY: this.atkDir });
      anyHit = true;
      const hx = clamp(e.x, box.x - box.hw, box.x + box.hw);
      const hy = clamp(e.y, box.y - box.hh, box.y + box.hh);
      if (res === 'blocked') {
        Audio2.sfx('hitHard', { pitch: rr(.9, 1.15) });
        Fx.hitSpark(hx, hy, -this.face, .2, 0xfff0d0, 8);
        Game.freeze(.05); Game.shake(.14, .12);
        this.doRecoil(-this.face, true);
      } else {
        Audio2.sfx('hitFlesh', { pitch: rr(.92, 1.1) });
        Fx.hitSpark(hx, hy, this.atkDir === 0 ? this.face : 0, this.atkDir, 0xfff4d8, 12);
        Fx.blood(hx, hy, this.atkDir === 0 ? this.face : 0, e.bloodColor || 0x3a1520, 8);
        Game.freeze(.055); Game.shake(.17, .14);
        Post.hitFlash(.10, 0xffffff);
        this.gainSoul(PC.SOUL_HIT + (Game.charm('soulcatcher') ? 4 : 0));
        this.doRecoil(this.atkDir === 0 ? -this.face : 0, false);
      }
      if (this.atkDir === -1 && !this.pogoed) this.pogo();
    }

    // 可破坏物件
    for (const o of Game.objects) {
      if (!o.breakable || o.broken) continue;
      if (this.atkHits.indexOf(o) >= 0) continue;
      if (!box.hits(o.box)) continue;
      this.atkHits.push(o);
      o.hit(dmg, this.face);
      anyHit = true;
      Game.freeze(.04); Game.shake(.12, .1);
      Audio2.sfx('hitHard');
      if (this.atkDir === -1 && !this.pogoed) this.pogo();
    }

    // 下劈踩尖刺 / 撞墙火花
    if (this.atkDir === -1 && !this.pogoed) {
      if (World.boxHitsSpike(box.x, box.y, box.hw, box.hh)) {
        this.pogo();
        Audio2.sfx('hitHard', { pitch: 1.2 });
        Fx.hitSpark(box.x, box.y, 0, 1, 0xffd0a0, 10);
      }
    }
    if (!anyHit && this.atkDir === 0) {

  updateCast(dt, locked) {

  hurt(dmg, srcX, opts) {

    opts = opts || {};

    Game.save.hp = this.hp;
    this.iframe = PC.IFRAME * (Game.charm('heart') ? 1.35 : 1);

    this.focusing = false; this.castCharging = false; this.focusT = 0;
    this.diving = false; this.dashT = 0;
    Audio2.stopLoop('focus');
    const dir = srcX === undefined ? -this.face : (sign(this.x - srcX) || -this.face);
    this.vx = dir * PC.HURT_VX; this.vy = PC.HURT_VY;
    this.face = -dir;
    Audio2.sfx('hurt');

    UI.refreshHud(true);
    if (this.hp <= 0) this.die();

  }

  checkHazard(dt) {
    if (this.spikeT > 0 || this.dead) return;
    if (World.boxHitsSpike(this.x, this.y, this.hw * .8, this.hh * .8)) {

      this.hp -= 1;

      Post.hitFlash(.5, 0xff5b47);

      UI.damageVignette(); UI.refreshHud(true);
      if (this.hp <= 0) { this.die(); return; }
      this.spikeT = .45;
      this.iframe = PC.IFRAME * (Game.charm('heart') ? 1.35 : 1);
      this.vx = 0; this.vy = 0;
      this.invisible = true;
      this.respawnX = this.safeX; this.respawnY = this.safeY;
    }
  }

  die() {
    if (this.dead) return;
    this.dead = true; this.deadT = 0;
    this.anim = 'death'; this.animT = 0;
    this.vx = 0; this.vy = 0;
    Audio2.sfx('die');
    Audio2.stopLoop('focus');
    Audio2.stopMusic(1.2);
    Game.freeze(.35);
    Game.shake(1.0, .8);
    Post.hitFlash(.8, 0xffffff);
    Fx.burst(this.x, this.y, 0xffffff, 40, 14);
    Fx.blood(this.x, this.y, 0, 0x6a2030, 24);
    Game.save.deaths++;
    // 留下阴影
    Game.save.shade = {
      room: Game.roomId, x: this.x, y: this.y,
      geo: Game.save.geo, soul: floor(this.soul),
    };
    Game.save.geo = 0;
    Game.writeSave();
  }

  updateDead(dt) {
    this.deadT += dt;
    this.anim = 'death'; this.animT = this.deadT;
    this.vy -= 40 * dt;
    moveBody(this, dt, {});
    this.updateRig(dt);
    const k = clamp01(this.deadT / 1.1);
    this.rig.setOpacity(1 - k);
    this.rig.root.scale.setScalar(.95 * (1 - k * .4));
    if (this.deadT > .35 && this.deadT - dt <= .35) {
      Fx.burst(this.x, this.y, 0x88aaff, 26, 10);
    }
  }

  updateBench(dt) {
    this.anim = 'bench'; this.animT += dt;
    this.vx = 0; this.vy = 0;
    this.updateRig(dt);
  }
}

class Enemy {
  constructor(type, x, y, opts) {
    const d = ENEMY_DEFS[type];
    this.type = type; this.def = d;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.hw = d.hw; this.hh = d.hh;
    this.hp = d.hp; this.maxHp = d.hp;
    this.alive = true; this.dying = 0;
    this.face = chance(.5) ? 1 : -1;
    this.state = 'idle'; this.st = 0; this.t = rr(0, 10);
    this.grounded = false; this.wallL = false; this.wallR = false;
    this.flash = 0; this.knock = 0; this.stun = 0;
    this.bloodColor = d.blood;

  }
  addToScene(s) { s.add(this.rig.root); }
  remove(s) { s.remove(this.rig.root); }
  get box() { return _ebox.set(this.x, this.y, this.hw, this.hh); }

  hurt(dmg, dirX, o) {

    }
    this.hp -= dmg;

    this.knock = .18;

    this.vx = dirX * k;
    if (!this.def.fly) this.vy = max(this.vy, 3.5);
    this.stun = max(this.stun, .16);
    Audio2.sfx('enemyHurt', { pitch: rr(.85, 1.2) });

    return 'hit';
  }

  die(dirX) {
    this.alive = false; this.dying = 0;

    Fx.blood(this.x, this.y, dirX || 0, this.bloodColor, 16);
    Fx.dust(this.x, this.y, 6, 0x555a66, 2);
    Game.shake(.2, .16);

    for (let i = 0; i < min(n, 9); i++) {
      Game.drops.push(new GeoDrop(this.x + rr(-.3, .3), this.y + rr(0, .4), i === 0 ? n - min(n, 9) + 1 : 1));
    }

  }

  explode() {

    Fx.burst(this.x, this.y, 0xff9a4a, 26, 13);
    Audio2.sfx('slam', { vol: .7 });
    Game.shake(.35, .25);
    const P = Game.player;
    if (P && !P.dead && dist2(P.x, P.y, this.x, this.y) < 2.6 * 2.6) P.hurt(1, this.x);
    for (const e of Game.enemies) {
      if (e !== this && e.alive && dist2(e.x, e.y, this.x, this.y) < 2.6 * 2.6)
        e.hurt(12, sign(e.x - this.x) || 1, { from: 'spell' });
    }
  }

  /* -------- 主更新 -------- */
  update(dt) {
    this.t += dt;
    if (!this.alive) {
      this.dying += dt;
      const k = clamp01(this.dying / .35);
      this.rig.setOpacity(1 - k);
      this.rig.root.scale.setScalar(1 + k * .5);
      this.rig.root.rotation.z += dt * 4 * this.face;
      return;
    }
    if (this.flash > 0) this.flash = max(0, this.flash - dt * 6);
    if (this.knock > 0) this.knock -= dt;
    if (this.stun > 0) this.stun -= dt;
    if (this.cool > 0) this.cool -= dt;
    this.st += dt;

    const P = Game.player;
    const dx = P ? P.x - this.x : 0, dy = P ? P.y - this.y : 0;
    const dd = hypot(dx, dy);

    if (this.stun <= 0) this.ai(dt, P, dx, dy, dd);

    // 物理
    if (!this.def.fly) {
      this.vy -= this.def.grav * dt;
      if (this.vy < -28) this.vy = -28;
    }
    moveBody(this, dt, { noPlatform: !this.def.fly ? false : true });
    if (this.def.fly) {
      // 飞行体只与实心格碰撞（moveBody 已处理）
    }
    // 危险地形
    if (World.boxHitsSpike(this.x, this.y, this.hw * .7, this.hh * .7) && this.alive) {

  seek(dt, tx, ty, speed, acc) {

            else this.vx = approach(this.vx, 0, 40 * dt);
            if (this.grounded && abs(dy) > 1.5 && abs(dx) < 4 && this.cool <= 0) { this.vy = 12; this.cool = 1.2; }
          }

/* ==============================================================
   首领基类
   ============================================================== */
class Boss {
  constructor(kind, x, y) {
    this.kind = kind;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.alive = true; this.dying = 0;
    this.face = -1;
    this.flash = 0; this.stun = 0; this.knock = 0;
    this.t = 0; this.st = 0; this.state = 'intro';
    this.phase = 1; this.attacks = 0;
    this.grounded = false; this.wallL = false; this.wallR = false;
    this.staggerDmg = 0; this.stagger = 0;
    this.noHit = false; this.noContact = false;
    this.isBoss = true;
    this.pillarXs = []; this.sweepY = 0;
    this.introT = 0;

    if (kind === 'warden') {
      this.maxHp = 300; this.hp = 300;
      this.hw = 1.15; this.hh = 1.45;
      this.dmg = 1; this.bloodColor = 0x2a3040;
      this.name = '虚空守卫'; this.grav = 52;
      this.rig = buildWardenRig();
    } else {
      this.maxHp = 400; this.hp = 400;
      this.hw = .85; this.hh = 1.6;
      this.dmg = 1; this.bloodColor = 0x9fb8e8;
      this.name = '苍白余晖'; this.grav = 0;
      this.rig = buildRadianceRig();
    }
    this.rig.root.position.set(x, y, .6);
  }
  addToScene(s) { s.add(this.rig.root); }
  get box() { return _bbox.set(this.x, this.y, this.hw, this.hh); }
  get hpFrac() { return clamp01(this.hp / this.maxHp); }

  hurt(dmg, dirX, o) {
    if (!this.alive || this.state === 'intro' || this.state === 'dead') return 'dead';
    o = o || {};
    let mult = 1;
    if (this.stagger > 0) mult = 2;
    // 守卫的头盔正面很硬
    if (this.kind === 'warden' && this.stagger <= 0 && o.from === 'nail' && o.dirY === 0 && this.state !== 'downed') {
      mult = .75;
    }
    this.hp -= dmg * mult;
    this.flash = 1;
    this.staggerDmg += dmg * mult;
    Audio2.sfx('hitHard', { pitch: rr(.7, .85) });
    UI.setBossHp(this.hpFrac);
    if (this.hp <= 0) { this.die(); return 'dead'; }
    // 硬直
    if (this.staggerDmg >= (this.kind === 'warden' ? 70 : 90) && this.stagger <= 0 && this.state !== 'downed') {
      this.staggerDmg = 0;
      this.enterStagger();
    }
    return 'hit';
  }
  enterStagger() {
    this.stagger = this.kind === 'warden' ? 3.0 : 2.2;
    this.state = 'downed'; this.st = 0;
    this.vx = 0; this.vy = 0;
    Audio2.sfx('bossRoar', { vol: .6 });
    Game.shake(.5, .4);
    Fx.burst(this.x, this.y, 0xffd8a0, 30, 12);
    UI.toast('守卫失去平衡！');
  }
  die() {
    this.alive = false; this.state = 'dead'; this.dying = 0;
    Audio2.sfx('bossRoar');
    Audio2.stopMusic(2);
    Game.shake(1.2, 1.4);
    Game.freeze(.4);
    Post.hitFlash(.9, 0xffffff);
    UI.hideBossBar();
    Game.onBossDefeated(this);
  }

  update(dt) {
    this.t += dt; this.st += dt;
    if (!this.alive) {
      this.dying += dt;
      const k = clamp01(this.dying / 2.2);
      this.rig.setOpacity(1 - k * .9);
      this.rig.root.scale.setScalar(1 - k * .3);
      if (chance(dt * 14)) {
        Fx.burst(this.x + rr(-1.2, 1.2), this.y + rr(-1, 1.5), 0xffffff, 8, 6);
        Game.shake(.16, .12);
      }
      if (this.kind === 'warden') { this.vy -= 40 * dt; moveBody(this, dt, {}); }
      this.rig.root.position.set(this.x, this.y, .6);
      return;
    }
    if (this.flash > 0) this.flash = max(0, this.flash - dt * 6);
    if (this.stagger > 0) this.stagger -= dt;

    // 阶段推进
    const f = this.hpFrac;
    const np = f > .66 ? 1 : f > .33 ? 2 : 3;
    if (np !== this.phase) {
      this.phase = np;
      this.onPhase(np);
    }

    if (this.kind === 'warden') this.updateWarden(dt);
    else this.updateRadiance(dt);

    // 接触伤害
    const P = Game.player;
    if (P && !P.dead && P.iframe <= 0 && !this.noContact && this.box.hits(P.box)) P.hurt(this.dmg, this.x);

    this.rig.root.position.set(this.x, this.y, .6);
    this.rig.root.scale.x = abs(this.rig.root.scale.x) * this.face;
    this.rig.flash(this.flash * .85);

  onPhase(p) {
    Audio2.sfx('bossRoar');
    Game.shake(.7, .8);
    Post.hitFlash(.4, this.kind === 'warden' ? 0xff9060 : 0xdfe8ff);
    Fx.shockwave(this.x, this.y, 4, this.kind === 'warden' ? 0xff9060 : 0xcfe0ff, .7);
    UI.toast(p === 3 ? '它开始咆哮…' : '它变得更加狂暴');
    this.state = 'roar'; this.st = 0;
    Audio2.setIntensity(.6 + p * .15);
  }

  /* ---------------- 虚空守卫 ---------------- */
  updateWarden(dt) {
    const P = Game.player;
    const R = this.rig;
    this.vy -= this.grav * dt;
    if (this.vy < -34) this.vy = -34;

    switch (this.state) {
      case 'intro':
        this.introT += dt;
        this.vx = 0;
        R.body.position.y = -1.2 + smoothstep(clamp01(this.introT / 1.2)) * 1.2;
        R.body.rotation.z = (1 - clamp01(this.introT / 1.4)) * .25;
        if (this.introT > 1.8) { this.state = 'idle'; this.st = 0; }
        break;

      case 'idle': {
        if (P) this.face = sign(P.x - this.x) || this.face;
        this.vx = approach(this.vx, 0, 30 * dt);
        R.body.position.y = sin(this.t * 2) * .06;
        const wait = this.phase === 1 ? .95 : this.phase === 2 ? .7 : .5;
        if (this.st > wait) {
          const d = P ? abs(P.x - this.x) : 99;
          const r = Math.random();
          if (d < 3.4 && r < .5) this.state = 'swing';
          else if (this.phase >= 2 && r < .35) this.state = 'throw';
          else if (this.phase === 3 && r < .55) this.state = 'pound';
          else this.state = 'leap';
          this.st = 0;
        }
        break;
      }
      case 'roar':
        this.vx = 0;
        R.body.rotation.z = sin(this.st * 40) * .06;
        if (this.st > 1.0) { R.body.rotation.z = 0; this.state = 'idle'; this.st = 0; }
        break;

      case 'downed':
        this.vx = approach(this.vx, 0, 20 * dt);
        R.body.rotation.z = damp(R.body.rotation.z, -this.face * 1.35, 9, dt);
        R.body.position.y = damp(R.body.position.y, -.75, 9, dt);
        if (this.stagger <= 0) {
          R.body.rotation.z = 0; R.body.position.y = 0;
          this.state = 'idle'; this.st = 0;
          Audio2.sfx('bossRoar', { vol: .5 });
        }
        break;

      case 'swing': {

        const tel = .55;
        if (this.st < tel) {
          R.mace.rotation.z = damp(R.mace.rotation.z, -2.2, 10, dt);
          R.body.rotation.z = damp(R.body.rotation.z, this.face * .22, 8, dt);
        } else if (this.st < tel + .16) {
          R.mace.rotation.z = damp(R.mace.rotation.z, 1.4, 34, dt);
          R.body.rotation.z = damp(R.body.rotation.z, -this.face * .2, 26, dt);
          if (this.st - dt < tel) {
            Audio2.sfx('swing', { pitch: .55 });
            const bx = this.x + this.face * 2.4;

        } else if (this.st > tel + .5) {

          R.body.rotation.z = damp(R.body.rotation.z, 0, 8, dt);

          R.body.scale.x = damp(R.body.scale.x, 1.16, 12, dt);

        } else {
          R.body.scale.y = damp(R.body.scale.y, 1.12, 10, dt);

              dmg: 1, team: 'enemy', kind: 'rock', life: 4, hw: .35, hh: .35, grav: 34,
            }));
          }
          Audio2.sfx('swing', { pitch: .7 });
          R.armR.rotation.z = -1.4;
        }
        R.armR.rotation.z = damp(R.armR.rotation.z, 0, 8, dt);
        if (this.st > 1.3) { this.state = 'idle'; this.st = 0; }
        break;
      }
      case 'pound': {
        this.vx = approach(this.vx, 0, 40 * dt);
        if (this.st < .7) {
          R.mace.rotation.z = damp(R.mace.rotation.z, -2.6, 8, dt);
          R.body.position.y = damp(R.body.position.y, .35, 8, dt);
        } else if (this.st < .82) {
          R.mace.rotation.z = damp(R.mace.rotation.z, .3, 40, dt);

          R.body.position.y = damp(R.body.position.y, 0, 8, dt);
          this.state = 'idle'; this.st = 0;
        }

      }
    }

    // 掉进出口竖井时自救：跳回竞技场地面
    if (this.grounded && this.y < (this.homeY || 8) - 3) {
      this.vy = 30;
      this.vx = this.x < World.w / 2 ? 11 : -11;
      this.state = 'leap'; this.st = 0.6;
      Audio2.sfx('jump', { pitch: .5, vol: .8 });
    }
    if (this.grounded) this.vx = approach(this.vx, 0, 26 * dt);
  }

  slam(big) {
    Audio2.sfx('slam');

    Game.freeze(.07);
    Fx.shockwave(this.x, this.y - this.hh, big ? 4 : 3, 0xffb070, .5);

    R.core.scale.setScalar(1 + sin(this.t * 5) * .1);

        if (this.introT > 2) { this.state = 'idle'; this.st = 0; this.rig.setOpacity(1); }
        break;

        const wait = this.phase === 1 ? .9 : this.phase === 2 ? .68 : .48;
        this.vx = damp(this.vx, sin(this.t) * 1.2, 3, dt);
        this.vy = damp(this.vy, 0, 3, dt);
        this.x += this.vx * dt; this.y += this.vy * dt;

          const r = Math.random();
          if (r < .32) this.state = 'fan';
          else if (r < .58) this.state = 'pillars';
          else if (this.phase >= 2 && r < .82) this.state = 'sweep';
          else this.state = 'blink';
          this.st = 0;
        }
        break;
      }
      case 'downed':
        this.vy = damp(this.vy, -3, 4, dt);
        this.y += this.vy * dt;
        R.body.rotation.z = damp(R.body.rotation.z, .5, 8, dt);
        if (this.stagger <= 0) { R.body.rotation.z = 0; this.state = 'blink'; this.st = 0; }
        break;

      case 'roar':
        R.core.scale.setScalar(1 + sin(this.st * 30) * .4);
        if (this.st > 1.2) { this.state = 'idle'; this.st = 0; }
        break;

      case 'blink': {
        const k = clamp01(this.st / .3);
        this.rig.setOpacity(this.st < .3 ? 1 - k : clamp01((this.st - .35) / .3));
        if (this.st > .3 && this.st - dt <= .3) {
          let tx = 0, ty = 0, okSpot = false;
          for (let k = 0; k < 10 && !okSpot; k++) {
            tx = clamp((P ? P.x : this.x) + rr(-8, 8), 4, World.w - 4);
            ty = clamp((P ? P.y : this.y) + rr(3, 8), 6, World.h - 5);
            okSpot = !World.boxHitsSolid(tx, ty, this.hw + .2, this.hh + .2);
          }
          if (!okSpot) { tx = World.w / 2; ty = this.homeY || World.h * .55; }
          Fx.burst(this.x, this.y, 0xcfe0ff, 20, 9);
          this.x = tx; this.y = ty;
          Fx.burst(tx, ty, 0xcfe0ff, 20, 9);
          Audio2.sfx('transition', { vol: .5 });
        }
        if (this.st > .68) { this.rig.setOpacity(1); this.state = 'idle'; this.st = 0; }
        break;
      }
      case 'fan': {
        if (this.st > .55 && this.st - dt <= .55) {
          const n = this.phase === 3 ? 9 : this.phase === 2 ? 7 : 5;
          const base = P ? atan2(P.y - this.y, P.x - this.x) : -PI / 2;

            Game.projectiles.push(new Projectile({
              x: this.x + cos(a) * 1.2, y: this.y + sin(a) * 1.2,
              vx: cos(a) * 12, vy: sin(a) * 12, dmg: 1, team: 'enemy',
              kind: 'orb', life: 3, hw: .26, hh: .26,
              homing: this.phase === 3 ? 1.2 : 0,
            }));
          }
          Audio2.sfx('spellFire', { vol: .5, pitch: 1.3 });
          Game.shake(.2, .2);
        }
        R.core.scale.setScalar(1 + clamp01(this.st / .55) * .8);
        if (this.st > 1.05) { this.state = 'idle'; this.st = 0; }
        break;
      }
      case 'pillars': {
        if (this.st - dt <= 0) {     // 「进入该状态的第一帧」，不受 dt 上限 0.05 影响
          this.pillarXs = [];
          const cnt = this.phase === 3 ? 7 : this.phase === 2 ? 5 : 4;
          const px = P ? P.x : World.w / 2;
          for (let i = 0; i < cnt; i++) {
            let x = i === 0 ? px : clamp(px + rr(-14, 14), 3, World.w - 3);
            this.pillarXs.push(x);
            Fx.meshes.add('quad', {
              x, y: World.h / 2, s0: .3, s1: .3, life: .62,
              color: 0xffe9b0, alpha: .5, z: .3, aspect: World.h / .3,
            });
          }
        }
        if (this.st > .62 && this.st - dt <= .62) {
          for (const x of this.pillarXs) {
            Fx.meshes.add('quad', {
              x, y: World.h / 2, s0: 1.6, s1: 1.0, life: .35,
              color: 0xffffff, alpha: 1, z: .35, aspect: World.h / 1.6,
            });
            Fx.burst(x, 6, 0xffe9b0, 12, 8);
          }
          Audio2.sfx('spellScream', { vol: .5 });
          Game.shake(.5, .35);
          Post.hitFlash(.25, 0xffeec0);
          if (P && !P.dead) {
            for (const x of this.pillarXs) {
              if (abs(P.x - x) < .95) { P.hurt(1, x); break; }
            }
          }
        }
        if (this.st > 1.25) { this.state = 'idle'; this.st = 0; }
        break;
      }
      case 'sweep': {
        if (this.st - dt <= 0) this.sweepY = P ? P.y + rr(-1, 2) : World.h / 2;
        const tel = .7;
        if (this.st < tel) {
          Fx.meshes.add('quad', {
            x: World.w / 2, y: this.sweepY, s0: World.w, s1: World.w, life: .09,
            color: 0xffd0a0, alpha: .5, z: .3, aspect: .18 / World.w,
          });
        } else if (this.st < tel + .55) {
          Fx.meshes.add('quad', {
            x: World.w / 2, y: this.sweepY, s0: World.w, s1: World.w, life: .1,
            color: 0xffffff, alpha: .95, z: .35, aspect: 1.2 / World.w,
          });
          if (P && !P.dead && abs(P.y - this.sweepY) < 1.0) P.hurt(1, P.x - 1);
          if (this.st - dt < tel) { Audio2.sfx('spellScream', { vol: .45, pitch: 1.2 }); Game.shake(.35, .5); }
        } else if (this.st > tel + .85) { this.state = 'idle'; this.st = 0; }
        break;
      }
    }
    this.x = clamp(this.x, 3, World.w - 3);
    this.y = clamp(this.y, 4, World.h - 4);
  }
}

      big ? 0xf0e6c0 : 0xd8e0dc, .05);
    m.scale.setScalar(big ? 1.5 : 1);
    const gl = glowQuad(big ? 1.6 : 1.0, 0xcfe0d8, .55);
    g.add(gl, m);
    g.position.set(x, y, .5);
    this.obj = g; this.m = m;
    Game.scene.add(g);
  }
  update(dt) {
    this.life += dt;
    const P = Game.player;
    if (!this.magnet && this.life > .45 && P && dist2(P.x, P.y, this.x, this.y) < 16) this.magnet = true;
    if (this.magnet && P) {
      const dx = P.x - this.x, dy = P.y + .2 - this.y, d = max(.01, hypot(dx, dy));
      const acc = 60;
      this.vx += dx / d * acc * dt; this.vy += dy / d * acc * dt;
      this.vx *= 1 - min(.9, 4 * dt); this.vy *= 1 - min(.9, 4 * dt);
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (d < .55) this.collect();
    } else {
      this.vy -= 34 * dt;
      const oldY = this.y;
      moveBody(this, dt, { noPlatform: false });
      if (this.grounded) { this.vx *= .72; if (abs(oldY - this.y) < .01) this.vy = 0; }
      if (this.wallL || this.wallR) this.vx *= -.5;
    }
    this.obj.position.set(this.x, this.y, .5);
    this.m.rotation.z += dt * 2.5;
    if (this.life > 26) this.kill();
  }
  collect() {
    if (this.dead) return;
    Game.save.geo += this.value;
    Game.player.geoStreak = min(12, Game.player.geoStreak + 1);
    Audio2.sfx('geo', { step: Game.player.geoStreak, vol: .8 });
    Fx.burst(this.x, this.y, 0xcfe0d8, 5, 4);
    UI.refreshHud();
    this.kill();
  }
  kill() { if (!this.dead) { this.dead = true; Game.scene.remove(this.obj); } }
}

        }, 10)), 0x4a5468, -.05);
        back.position.y = .85;
        const gl = glowQuad(4, A ? A.glow : 0x6f8fc0, .3); gl.position.set(0, 1.2, -.5);

      case 'shop': {
        this.hw = .8; this.hh = 1.1; this.interactive = true; this.prompt = '交谈';

  update(dt) {
    const t = Game.time;
    if (this.pickup) {
      this.obj.position.y = this.y + sin(t * 1.8) * .16;
      this.core.rotation.z = t * .9;
      this.ring.rotation.z = -t * .5;
      this.ring.scale.setScalar(2.4 + sin(t * 2.4) * .3);
      this.gl.material.opacity = .45 + .2 * sin(t * 3);

        Fx.add.spawn({
          x: this.x + rr(-.7, .7), y: this.y + rr(-.7, .7), vx: 0, vy: rr(.6, 1.8),

      this.glow.material.opacity = .22 + .1 * sin(t * 1.3 + this.x);
    } else if (this.t === 'bench') {
      this.glow.material.opacity = .24 + .1 * sin(t * 1.6);
    } else if (this.t === 'shop') {
      this.obj.position.y = this.y + sin(t * 1.4) * .07;
    } else if (this.t === 'gate') {
      const open = !this.def.req || Game.save.bosses[this.def.req];
      if (open && !this.opened) {
        this.opened = true;

        this.solidBlock = false;

    if (this.hp <= 0) {
      this.broken = true;

      Fx.burst(this.x, this.y, 0xcfe0d8, 22, 10);
      Fx.dust(this.x, this.y, 10, 0x8d8468, 3);

  canInteract() {

  collect() {

class Shade {
  constructor(x, y, geoAmt, soulAmt) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.hw = .38; this.hh = .62;
    this.hp = 44; this.maxHp = 44;
    this.alive = true; this.dying = 0;
    this.geo = geoAmt; this.soul = soulAmt;
    this.face = 1; this.flash = 0; this.stun = 0; this.t = 0;
    this.cool = 1.2;
    this.bloodColor = 0x2a1a3d;
    this.noHit = false;
    this.def = { dmg: 1, fly: true, knock: 5 };
    this.rig = buildEnemyRig('wisp');
    this.rig.root.scale.setScalar(1.5);
    this.rig.root.position.set(x, y, .55);
    Game.scene.add(this.rig.root);
    Audio2.sfx('shade');
  }
  get box() { return _sbox.set(this.x, this.y, this.hw, this.hh); }
  hurt(dmg, dirX) {
    if (!this.alive) return 'dead';
    this.hp -= dmg; this.flash = 1;
    this.vx = dirX * 6;
    Audio2.sfx('enemyHurt', { pitch: .7 });
    if (this.hp <= 0) { this.die(); return 'dead'; }
    return 'hit';
  }
  die() {
    this.alive = false; this.dying = 0;
    Audio2.sfx('unlock', { vol: .6 });
    Fx.burst(this.x, this.y, 0xb08aff, 34, 12);
    Fx.shockwave(this.x, this.y, 2.4, 0x8a6ad0, .6);
    Game.shake(.4, .3);
    const P = Game.player;
    if (P) {
      P.soul = min(P.maxSoul, P.soul + this.soul);
      for (let i = 0; i < min(this.geo, 12); i++)
        Game.drops.push(new GeoDrop(this.x + rr(-.5, .5), this.y + rr(0, .5),
          i === 0 ? this.geo - min(this.geo, 12) + 1 : 1));
    }
    Game.save.shade = null;
    Game.writeSave();
    UI.toast('你取回了失落之物');
    UI.refreshHud(true);
  }
  update(dt) {
    this.t += dt;
    if (!this.alive) {
      this.dying += dt;
      const k = clamp01(this.dying / .5);
      this.rig.setOpacity(1 - k);
      this.rig.root.scale.setScalar(1.5 + k);
      return;
    }
    if (this.flash > 0) this.flash = max(0, this.flash - dt * 6);
    const P = Game.player;
    if (P && !P.dead) {
      const dx = P.x - this.x, dy = P.y + .3 - this.y, d = max(.01, hypot(dx, dy));
      if (d < 14) {
        this.vx = damp(this.vx, dx / d * 3.4, 3, dt);
        this.vy = damp(this.vy, dy / d * 3.4, 3, dt);
      } else { this.vx = damp(this.vx, 0, 3, dt); this.vy = damp(this.vy, sin(this.t) * .6, 3, dt); }
      this.face = sign(dx) || this.face;
      this.cool -= dt;
      if (d < 9 && this.cool <= 0) {
        this.cool = 2.6;
        const a = atan2(dy, dx);
        Game.projectiles.push(new Projectile({
          x: this.x + cos(a), y: this.y + sin(a), vx: cos(a) * 10, vy: sin(a) * 10,
          dmg: 1, team: 'enemy', kind: 'spore', life: 2.5, hw: .24, hh: .24,
        }));
        Audio2.sfx('spellFire', { vol: .3, pitch: .8 });
      }
      if (P.iframe <= 0 && this.box.hits(P.box)) P.hurt(1, this.x);
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.x = clamp(this.x, 1.5, World.w - 1.5);
    this.y = clamp(this.y, 1.5, World.h - 1.5);
    this.rig.root.position.set(this.x, this.y, .55);
    this.rig.root.scale.x = 1.5 * this.face;
    this.rig.flash(this.flash);
    animateEnemy(this.rig, 'wisp', { t: this.t, vx: this.vx, vy: this.vy }, dt);
    if (chance(dt * 8)) {
      Fx.add.spawn({
        x: this.x + rr(-.5, .5), y: this.y + rr(-.6, .6), vx: rr(-1, 1), vy: rr(-2, .5),
        life: rr(.3, .8), size: rr(.15, .4), size1: 0, color: 0xb08aff, color1: 0x40206a, z: .4,
      });
    }
  }
  remove() { Game.scene.remove(this.rig.root); }
}

/* ==============================================================
   15. 摄像机 · 死区跟随 + 前瞻 + 房间夹紧 + 震动
   ============================================================== */
const Cam = {
  cam: null, x: 0, y: 0, tx: 0, ty: 0,
  halfW: 10, halfH: 9.75,
  shakeX: 0, shakeY: 0,
  zoom: 1, zoomT: 1,
  lookY: 0,

  init(cam) { this.cam = cam; },

  resize(aspect) {
    this.halfH = VIEW_TILES_H / 2;
    this.halfW = this.halfH * aspect;
  },

  snapTo(px, py) {
    this.tx = px; this.ty = py + 1.2;
    this.clamp();
    this.x = this.tx; this.y = this.ty;
    this.apply();
  },

  clamp() {
    const w = World.w, h = World.h;
    const hw = this.halfW * this.zoom, hh = this.halfH * this.zoom;
    if (w <= hw * 2) this.tx = w / 2; else this.tx = clamp(this.tx, hw, w - hw);
    if (h <= hh * 2) this.ty = h / 2; else this.ty = clamp(this.ty, hh, h - hh);
  },

  update(dt, P) {
    if (P) {
      // 前瞻 + 死区
      const lead = clamp(P.vx * .22, -3.2, 3.2);
      let desiredX = P.x + lead;
      let desiredY = P.y + 1.0;
      // 上下观察
      if (P.grounded && abs(P.vx) < .5) {
        if (Input.isDown('up')) this.lookY = damp(this.lookY, 3.2, 2.2, dt);
        else if (Input.isDown('down')) this.lookY = damp(this.lookY, -3.0, 2.2, dt);
        else this.lookY = damp(this.lookY, 0, 5, dt);
      } else this.lookY = damp(this.lookY, 0, 5, dt);
      desiredY += this.lookY;

      const dz = 1.1;
      if (abs(desiredX - this.tx) > dz) this.tx += (desiredX - this.tx) - sign(desiredX - this.tx) * dz;
      const dzy = P.grounded ? .8 : 2.2;
      if (abs(desiredY - this.ty) > dzy) this.ty += (desiredY - this.ty) - sign(desiredY - this.ty) * dzy;
    }
    this.clamp();
    const spd = 7.5;
    this.x = damp(this.x, this.tx, spd, dt);
    this.y = damp(this.y, this.ty, spd, dt);

    // 震动
    if (Game.shakeT > 0) {
      Game.shakeT -= dt;
      const k = Game.shakeAmt * clamp01(Game.shakeT / .28);
      this.shakeX = (Math.random() - .5) * k * 2.2;
      this.shakeY = (Math.random() - .5) * k * 2.2;
      if (Game.shakeT <= 0) { Game.shakeAmt = 0; this.shakeX = this.shakeY = 0; }
    } else { this.shakeX = damp(this.shakeX, 0, 12, dt); this.shakeY = damp(this.shakeY, 0, 12, dt); }

    this.zoom = damp(this.zoom, this.zoomT, 5, dt);
    this.apply();
  },

  apply() {
    if (!this.cam) return;
    this.cam.position.set(this.x + this.shakeX, this.y + this.shakeY, CAM_DIST * this.zoom);
    this.cam.lookAt(this.x + this.shakeX, this.y + this.shakeY, 0);
  },

  punch(z) { this.zoom = z; },
};
/* ==============================================================

const MASK_SVG = '<svg viewBox="0 0 40 40" class="mk"><path d="M20 4 C10 4 5 12 6 22 C7 31 13 37 20 37 C27 37 33 31 34 22 C35 12 30 4 20 4 Z" fill="#e9e3d3" stroke="#8b8577" stroke-width="1.5"/><path d="M13 17 C13 14 16 13 16 16 C16 19 13 20 13 17 Z" fill="#2a2620"/><path d="M27 17 C27 14 24 13 24 16 C24 19 27 20 27 17 Z" fill="#2a2620"/></svg>';

const UI = {
  hud: null, masksEl: null, soulFill: null, geoNum: null,
  titleIdx: 0, titleItems: [], pauseTab: 0,
  dlg: { on: false, full: '', shown: 0, who: '', speed: 34, done: false, onClose: null },
  toastT: 0,
  charmSel: null,
  fadeT: 0,

  init() {
    this.hud = $('#hud');
    this.masksEl = $('#masks');
    this.soulFill = $('#soulfill');
    this.geoNum = $('#geonum');
    this.buildTitleMenu();
    this.buildPauseTabs();
    this.buildKeys();
    this.buildSettings();
    $('#dialogue').addEventListener('click', () => this.advanceDialogue());
  },

  /* ---------------- HUD ---------------- */
  buildMasks() {
    const P = Game.player;
    if (!P) return;
    this.masksEl.innerHTML = '';
    for (let i = 0; i < P.maxHp; i++) {
      const d = el('div', 'mask', MASK_SVG);
      this.masksEl.appendChild(d);
    }
    this._maskNodes = Array.from(this.masksEl.children);
    this._lastHp = P.hp;
    this.refreshHud(true);
  },
  refreshHud(anim) {
    const P = Game.player;
    if (!P || !this._maskNodes) return;
    if (this._maskNodes.length !== P.maxHp) { this.buildMasks(); return; }
    for (let i = 0; i < this._maskNodes.length; i++) {
      const on = i < P.hp;
      const n = this._maskNodes[i];
      const wasOn = !n.classList.contains('empty');
      n.classList.toggle('empty', !on);
      if (anim && wasOn && !on) { n.classList.remove('hit'); void n.offsetWidth; n.classList.add('hit'); }
      if (anim && !wasOn && on) { n.classList.remove('heal'); void n.offsetWidth; n.classList.add('heal'); }
    }
    const f = clamp01(P.soul / P.maxSoul);
    this.soulFill.setAttribute('y', String(100 - f * 100));
    this.geoNum.textContent = String(Game.save ? Game.save.geo : 0);
    // 护符槽
    const cr = $('#charmrow');
    if (Game.save) {
      const used = Game.save.equipped.reduce((a, c) => a + (CHARMS[c] ? CHARMS[c].cost : 0), 0);
      if (cr.childElementCount !== Game.save.notches) {
        cr.innerHTML = '';
        for (let i = 0; i < Game.save.notches; i++) cr.appendChild(el('div', 'charmdot'));
      }
      Array.from(cr.children).forEach((d, i) => d.classList.toggle('filled', i < used));
      show(cr, Game.save.equipped.length > 0);
    }
    // 低血量提示
    const low = P.hp <= 1 && !P.dead;
    $('#lowhp').style.opacity = low ? '1' : '0';
    Post.sat = low ? .78 : 1;
  },
  damageVignette() {
    const v = $('#hurtvig');
    v.style.transition = 'none'; v.style.opacity = '1';
    setTimeout(() => { v.style.transition = 'opacity .5s ease-out'; v.style.opacity = '0'; }, 40);
  },
  showHud(on) { show(this.hud, on); show($('#geobox'), on); },

  /* ---------------- 首领血条 ---------------- */
  showBossBar(name) {
    $('#bossname').textContent = name;
    $('#bossfill').style.transform = 'scaleX(1)';
    $('#bosslag').style.transform = 'scaleX(1)';
    show($('#bossbar'), true);
  },
  setBossHp(f) {
    $('#bossfill').style.transform = 'scaleX(' + clamp01(f) + ')';
    $('#bosslag').style.transform = 'scaleX(' + clamp01(f) + ')';
  },
  hideBossBar() { show($('#bossbar'), false); },

  /* ---------------- 区域标题 ---------------- */
  showAreaTitle(name, sub) {
    const a = $('#areatitle');
    a.querySelector('.n').textContent = name;
    a.querySelector('.s').textContent = sub;
    a.classList.remove('show'); void a.offsetWidth; a.classList.add('show');
  },

  /* ---------------- 提示 / 吐司 ---------------- */
  showPrompt(text) {
    const p = $('#prompt');
    p.innerHTML = text;
    show(p, true);
  },
  hidePrompt() { show($('#prompt'), false); },
  toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    show(t, true);
    this.toastT = 2.2;
  },
  updateToast(dt) {
    if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) show($('#toast'), false); }
    if (this.hintT > 0) { this.hintT -= dt; if (this.hintT <= 0) show($('#hint'), false); }
  },
  hint(html, dur) {
    const h = $('#hint');
    h.innerHTML = html;
    show(h, true);
    this.hintT = dur || 10;
  },

  /* ---------------- 对话 ---------------- */
  showDialogue(who, text, onClose) {
    this.dlg.on = true; this.dlg.who = who; this.dlg.full = text;
    this.dlg.shown = 0; this.dlg.done = false; this.dlg.onClose = onClose || null;
    $('#dlgwho').textContent = who;
    $('#dlgtext').textContent = '';
    show($('#dialogue'), true);
    Game.setState('dialog');
  },
  updateDialogue(dt) {
    if (!this.dlg.on) return;
    if (!this.dlg.done) {
      this.dlg.shown += this.dlg.speed * dt;
      if (this.dlg.shown >= this.dlg.full.length) { this.dlg.shown = this.dlg.full.length; this.dlg.done = true; }
      $('#dlgtext').textContent = this.dlg.full.slice(0, floor(this.dlg.shown));
    }
    if (Input.hit('confirm') || Input.hit('attack') || Input.hit('jump')) this.advanceDialogue();
  },
  advanceDialogue() {
    if (!this.dlg.on) return;
    if (!this.dlg.done) {
      this.dlg.done = true; this.dlg.shown = this.dlg.full.length;
      $('#dlgtext').textContent = this.dlg.full;
      return;
    }
    this.dlg.on = false;
    show($('#dialogue'), false);
    Audio2.sfx('uiBack');
    const cb = this.dlg.onClose; this.dlg.onClose = null;
    if (cb) cb(); else Game.setState('play');
  },

  /* ---------------- 标题菜单 ---------------- */
  buildTitleMenu() {
    const m = $('#titlemenu');
    m.innerHTML = '';
    this.titleItems = [];
    const has = !!Game.loadSave();
    const items = [
      { t: '继续旅程', act: () => Game.continueGame(), dis: !has },
      { t: '新的旅程', act: () => Game.confirmNewGame() },
      { t: '操作说明', act: () => { Game.openPause(3); } },
      { t: '设置', act: () => { Game.openPause(4); } },
    ];
    for (const it of items) {
      const d = el('div', 'mi' + (it.dis ? ' disabled' : ''), it.t);
      d.addEventListener('click', () => { if (!it.dis) { Audio2.sfx('uiOk'); it.act(); } });
      d.addEventListener('mouseenter', () => { this.setTitleIdx(this.titleItems.indexOf(d)); });
      m.appendChild(d);
      this.titleItems.push(d);
      d._act = it.act; d._dis = it.dis;
    }
    this.titleIdx = has ? 0 : 1;
    this.setTitleIdx(this.titleIdx);
  },
  setTitleIdx(i) {
    if (i < 0 || i >= this.titleItems.length) return;
    this.titleIdx = i;
    this.titleItems.forEach((d, k) => d.classList.toggle('sel', k === i));
  },
  updateTitle() {
    if (Input.hit('up') || Input.hit('left')) {
      let i = this.titleIdx;
      do { i = (i - 1 + this.titleItems.length) % this.titleItems.length; } while (this.titleItems[i]._dis);
      this.setTitleIdx(i); Audio2.sfx('uiMove');
    }
    if (Input.hit('down') || Input.hit('right')) {
      let i = this.titleIdx;
      do { i = (i + 1) % this.titleItems.length; } while (this.titleItems[i]._dis);
      this.setTitleIdx(i); Audio2.sfx('uiMove');
    }
    if (Input.hit('confirm')) {
      const d = this.titleItems[this.titleIdx];
      if (d && !d._dis) { Audio2.sfx('uiOk'); d._act(); }
    }
  },

  /* ---------------- 暂停菜单 ---------------- */
  PANES: ['map', 'inv', 'charm', 'keys', 'set'],
  TABNAMES: ['地图', '物品', '护符', '操作', '设置'],
  buildPauseTabs() {
    const t = $('#ptabs');
    t.innerHTML = '';
    this.TABNAMES.forEach((n, i) => {
      const d = el('div', 'ptab', n);
      d.addEventListener('click', () => { Audio2.sfx('uiMove'); this.setTab(i); });
      t.appendChild(d);
    });
    this.setTab(0);
  },
  setTab(i) {
    this.pauseTab = (i + this.PANES.length) % this.PANES.length;
    Array.from($('#ptabs').children).forEach((d, k) => d.classList.toggle('sel', k === this.pauseTab));
    this.PANES.forEach((p, k) => show($('#pane-' + p), k === this.pauseTab));
    if (this.PANES[this.pauseTab] === 'map') this.drawMap();
    if (this.PANES[this.pauseTab] === 'inv') this.buildInventory();
    if (this.PANES[this.pauseTab] === 'charm') this.buildCharms();
    if (this.PANES[this.pauseTab] === 'set') this.buildSettings();
  },
  updatePause() {
    if (Input.hit('map')) { Audio2.sfx('uiMove'); this.setTab(this.pauseTab + 1); }
    if (Input.hit('left')) { Audio2.sfx('uiMove'); this.setTab(this.pauseTab - 1); }
    if (Input.hit('right')) { Audio2.sfx('uiMove'); this.setTab(this.pauseTab + 1); }
  },

  /* ---------------- 地图 ---------------- */
  drawMap() {
    const cv = $('#mapcv');
    const rect = cv.getBoundingClientRect();
    cv.width = max(2, floor(rect.width)); cv.height = max(2, floor(rect.height));
    const g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    if (!Game.save) return;
    if (!Game.save.hasMap) {
      g.fillStyle = '#5c6272'; g.font = '16px serif'; g.textAlign = 'center';
      g.fillText('你还没有这个王国的地图。', cv.width / 2, cv.height / 2 - 10);
      g.fillText('也许某位商人愿意出售一份。', cv.width / 2, cv.height / 2 + 20);
      return;
    }
    // 计算网格范围
    let minX = 99, maxX = -99, minY = 99, maxY = -99;
    for (const id in ROOMS) {
      const r = ROOMS[id];
      minX = min(minX, r.map[0]); maxX = max(maxX, r.map[0]);
      minY = min(minY, r.map[1]); maxY = max(maxY, r.map[1]);
    }
    const cols = maxX - minX + 1, rows = maxY - minY + 1;
    const cell = min((cv.width - 40) / cols, (cv.height - 40) / rows);
    const ox = (cv.width - cols * cell) / 2, oy = (cv.height - rows * cell) / 2;
    for (const id in ROOMS) {
      const r = ROOMS[id];
      const visited = Game.save.visited[id];
      const cx = ox + (r.map[0] - minX) * cell, cy = oy + (rows - 1 - (r.map[1] - minY)) * cell;
      const pad = cell * .12;
      const w = cell - pad * 2, h = cell - pad * 2;
      if (!visited) {
        g.fillStyle = 'rgba(255,255,255,.028)';
        g.fillRect(cx + pad, cy + pad, w, h);
        continue;
      }
      const A = AREAS[r.area];
      g.fillStyle = cssRGBA(A.mid, .78);
      g.strokeStyle = cssRGBA(A.glow, .8);
      g.lineWidth = 1.5;
      g.fillRect(cx + pad, cy + pad, w, h);
      g.strokeRect(cx + pad, cy + pad, w, h);
      g.fillStyle = 'rgba(230,224,208,.82)';
      g.font = Math.round(cell * .13) + 'px serif';
      g.textAlign = 'center';
      g.fillText(r.name, cx + cell / 2, cy + cell * .55);
      // 长椅标记
      if ((r.objs || []).some(o => o.t === 'bench')) {
        g.fillStyle = '#e8c987';
        g.fillRect(cx + cell * .5 - 5, cy + cell * .68, 10, 3);
        g.fillRect(cx + cell * .5 - 5, cy + cell * .71, 2, 4);
        g.fillRect(cx + cell * .5 + 3, cy + cell * .71, 2, 4);
      }
      if (r.boss) {
        g.fillStyle = Game.save.bosses[r.boss === 'warden' ? 'boss1' : 'boss2'] ? '#5c6272' : '#c0392b';
        g.beginPath(); g.arc(cx + cell * .5, cy + cell * .3, 4, 0, TAU); g.fill();
      }
      if (id === Game.roomId) {
        g.strokeStyle = '#fff'; g.lineWidth = 2.4;
        g.strokeRect(cx + pad - 2, cy + pad - 2, w + 4, h + 4);
        const P = Game.player;
        if (P) {
          const px = cx + pad + clamp01(P.x / r.w) * w;
          const py = cy + pad + (1 - clamp01(P.y / r.h)) * h;
          g.fillStyle = '#fff';
          g.beginPath(); g.arc(px, py, 3.4, 0, TAU); g.fill();
        }
      }
    }
    // 连线
    g.strokeStyle = 'rgba(200,196,180,.22)'; g.lineWidth = 1;
    for (const id in ROOMS) {
      if (!Game.save.visited[id]) continue;
      const r = ROOMS[id];
      for (const e of r.exits) {
        const t = ROOMS[e.to];
        if (!t || !Game.save.visited[e.to]) continue;
        const ax = ox + (r.map[0] - minX) * cell + cell / 2, ay = oy + (rows - 1 - (r.map[1] - minY)) * cell + cell / 2;
        const bx = ox + (t.map[0] - minX) * cell + cell / 2, by = oy + (rows - 1 - (t.map[1] - minY)) * cell + cell / 2;
        g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
      }
    }
  },

  /* ---------------- 物品栏 ---------------- */
  buildInventory() {
    const g = $('#invgrid');
    g.innerHTML = '';
    const S = Game.save;
    if (!S) { g.innerHTML = '<div class="inv"><div class="ds">尚未开始旅程。</div></div>'; return; }
    const items = [
      { k: 'nail', ic: '⚔', nm: '骨钉', ds: '伤害 ' + S.nail + '（等级 ' + (S.nailLevel + 1) + '）', have: true },
      { k: 'dash', ic: '➤', nm: ABILITIES.dash.name, ds: ABILITIES.dash.key, have: S.abilities.dash },
      { k: 'wall', ic: '⇈', nm: ABILITIES.wall.name, ds: ABILITIES.wall.key, have: S.abilities.wall },
      { k: 'wings', ic: '❖', nm: ABILITIES.wings.name, ds: ABILITIES.wings.key, have: S.abilities.wings },
      { k: 'fireball', ic: '✹', nm: ABILITIES.fireball.name, ds: ABILITIES.fireball.key, have: S.abilities.fireball },
      { k: 'dive', ic: '⤓', nm: ABILITIES.dive.name, ds: ABILITIES.dive.key, have: S.abilities.dive },
      { k: 'wraiths', ic: '⤒', nm: ABILITIES.wraiths.name, ds: ABILITIES.wraiths.key, have: S.abilities.wraiths },
      { k: 'shard', ic: '◐', nm: '面具碎片', ds: S.maskShards + ' / 2', have: S.maskShards > 0 },
      { k: 'vessel', ic: '◍', nm: '灵魂容器', ds: '上限 ' + S.maxSoul, have: true },
      { k: 'map', ic: '🗺', nm: '王国地图', ds: S.hasMap ? '已持有' : '未持有', have: S.hasMap },
    ];
    for (const it of items) {
      const d = el('div', 'inv' + (it.have ? '' : ' locked'));
      d.appendChild(el('div', 'ic', it.ic));
      d.appendChild(el('div', 'nm', it.nm));
      d.appendChild(el('div', 'ds', it.have ? it.ds : '未获得'));
      g.appendChild(d);
    }
  },

  /* ---------------- 护符 ---------------- */
  buildCharms() {
    const list = $('#charmlist');
    list.innerHTML = '';
    const S = Game.save;
    if (!S) { $('#notches').innerHTML = ''; return; }
    for (const id in CHARMS) {
      const c = CHARMS[id];
      const have = !!S.charms[id];
      const eq = S.equipped.indexOf(id) >= 0;
      const d = el('div', 'charm' + (have ? '' : ' locked') + (eq ? ' equipped' : ''), c.icon);
      d.appendChild(el('div', 'cost', String(c.cost)));
      d.addEventListener('click', () => { if (have) this.toggleCharm(id); });
      d.addEventListener('mouseenter', () => this.showCharmInfo(id));
      list.appendChild(d);
    }
    const n = $('#notches');
    n.innerHTML = '';
    const used = S.equipped.reduce((a, c) => a + CHARMS[c].cost, 0);
    for (let i = 0; i < S.notches; i++) {
      const dd = el('div', 'charmdot' + (i < used ? ' filled' : ''));
      dd.style.width = dd.style.height = '18px';
      n.appendChild(dd);
    }
    if (this.charmSel) this.showCharmInfo(this.charmSel);
  },
  showCharmInfo(id) {
    this.charmSel = id;
    const c = CHARMS[id];
    const S = Game.save;
    if (!S || !c) return;
    const info = $('#charminfo');
    info.querySelector('h3').textContent = S.charms[id] ? c.name : '未知护符';
    info.querySelector('.cn').textContent = '孔位消耗 ' + c.cost;
    info.querySelector('p').textContent = S.charms[id] ? c.desc : '尚未寻得。';
  },
  toggleCharm(id) {
    const S = Game.save;
    if (!S || !S.charms[id]) return;
    const i = S.equipped.indexOf(id);
    if (i >= 0) { S.equipped.splice(i, 1); Audio2.sfx('uiBack'); }
    else {
      const used = S.equipped.reduce((a, c) => a + CHARMS[c].cost, 0);
      if (used + CHARMS[id].cost > S.notches) { Audio2.sfx('uiBack'); this.toast('护符孔位不足'); return; }
      S.equipped.push(id); Audio2.sfx('uiOk');
    }
    Game.writeSave();
    this.buildCharms();
    this.refreshHud();
  },

      ['下穿平台', '↓ + 跳跃'], ['暂停 / 菜单', 'Esc'],

  /* ---------------- 设置 ---------------- */

      { n: '主音量', v: () => round(Settings.volMaster * 100) + '%', a: () => { Settings.volMaster = Settings.volMaster >= .95 ? 0 : round((Settings.volMaster + .15) * 100) / 100; Audio2.volMaster = Settings.volMaster; Audio2.setVolumes(); } },
      { n: '音效音量', v: () => round(Settings.volSfx * 100) + '%', a: () => { Settings.volSfx = Settings.volSfx >= .95 ? 0 : round((Settings.volSfx + .15) * 100) / 100; Audio2.volSfx = Settings.volSfx; Audio2.setVolumes(); } },

      { n: '粒子密度', v: () => Settings.particles === .4 ? '低' : Settings.particles === .7 ? '中' : '高', a: () => { Settings.particles = Settings.particles >= 1 ? .4 : Settings.particles === .4 ? .7 : 1; } },
