<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EUV 光刻原理 3D 演示 · EUV Lithography Principle (Simulation)</title>
<style>
  :root{
    --euv:#8f7bff; --euv2:#5fd8ff; --ir:#ff5a3c; --sn:#cfd8e3; --h2:#6ff0d0;
    --ink:#eaf1f8; --ink2:#9fb2c4; --dim:#5f7386;
    --line:rgba(150,190,230,.16);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --fs:1;               /* frame scale: 1 at 1920 wide, set from JS */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#02040a;color:var(--ink);font-family:var(--sans);overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;background:#02040a}
  canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------------- film grade overlays ---------------- */
  .grade{position:absolute;inset:0;pointer-events:none}
  .vig{background:radial-gradient(125% 95% at 50% 46%,transparent 42%,rgba(0,0,0,.62) 100%)}
  .grain{opacity:.05;mix-blend-mode:overlay;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.6) 0 1px,transparent 1px 2px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 3px)}
  .flash{background:#dfe8ff;opacity:0}

  /* ---------------- graphics layer (captured in renders) ---------------- */
  #gfx{position:absolute;inset:0;pointer-events:none;font-feature-settings:"tnum"}
  #gfx.hidden{display:none}
  .u{position:absolute}

  /* title mark + chapter */
  #mark{left:calc(46px * var(--fs));top:calc(40px * var(--fs));opacity:0}
  #mark .t{font:700 calc(15px * var(--fs))/1 var(--sans);letter-spacing:.24em;color:var(--ink)}
  #mark .s{margin-top:calc(7px * var(--fs));font:600 calc(9.5px * var(--fs))/1 var(--mono);letter-spacing:.26em;color:var(--euv2)}

  #chap{left:calc(46px * var(--fs));top:calc(96px * var(--fs));opacity:0;display:flex;gap:calc(12px * var(--fs));align-items:flex-start}
  #chap .num{font:700 calc(34px * var(--fs))/0.9 var(--mono);letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,var(--euv2));-webkit-background-clip:text;background-clip:text;color:transparent}
  #chap .num sub{font-size:calc(12px * var(--fs));color:var(--dim);-webkit-text-fill-color:var(--dim);letter-spacing:.1em}
  #chap .txt .cn{font:600 calc(17px * var(--fs))/1.2 var(--sans);letter-spacing:.02em}
  #chap .txt .en{margin-top:calc(4px * var(--fs));font:600 calc(9.5px * var(--fs))/1.3 var(--mono);letter-spacing:.22em;color:var(--euv2)}
  #chap .bar{position:absolute;left:0;bottom:calc(-11px * var(--fs));height:2px;width:0;background:linear-gradient(90deg,var(--euv2),transparent)}

  /* simulation badge */
  #sim{right:calc(46px * var(--fs));top:calc(40px * var(--fs));display:flex;align-items:center;gap:calc(9px * var(--fs));
    padding:calc(7px * var(--fs)) calc(13px * var(--fs));border:1px solid rgba(143,123,255,.5);border-radius:calc(4px * var(--fs));
    background:linear-gradient(180deg,rgba(26,20,48,.72),rgba(16,12,30,.62))}
  #sim .d{width:calc(6px * var(--fs));height:calc(6px * var(--fs));border-radius:50%;background:var(--euv);box-shadow:0 0 calc(10px * var(--fs)) var(--euv)}
  #sim .l{font:700 calc(10px * var(--fs))/1 var(--mono);letter-spacing:.26em;color:#d8d2ff}
  #sim .l i{font-style:normal;color:var(--ink);letter-spacing:.1em;margin-right:calc(8px * var(--fs))}

  /* parameter chips */
  #chips{left:calc(46px * var(--fs));bottom:calc(150px * var(--fs));display:flex;flex-direction:column;gap:calc(7px * var(--fs))}
  .chip{display:flex;align-items:baseline;gap:calc(10px * var(--fs));padding:calc(7px * var(--fs)) calc(13px * var(--fs));
    border-left:2px solid var(--euv2);background:linear-gradient(90deg,rgba(12,20,32,.72),rgba(12,20,32,0));
    opacity:0;transform:translateX(calc(-10px * var(--fs)));transition:opacity .45s,transform .45s}
  .chip.on{opacity:1;transform:none}
  .chip .k{font:600 calc(9.5px * var(--fs))/1.2 var(--mono);letter-spacing:.16em;color:var(--ink2);text-transform:uppercase}
  .chip .v{font:700 calc(14.5px * var(--fs))/1.1 var(--mono);color:#fff;letter-spacing:.01em}
  .chip .s{font:600 calc(8px * var(--fs))/1 var(--mono);letter-spacing:.14em;color:var(--euv);border:1px solid rgba(143,123,255,.45);
    border-radius:calc(3px * var(--fs));padding:calc(2px * var(--fs)) calc(5px * var(--fs))}

  /* captions */
  #cap{left:0;right:0;bottom:calc(74px * var(--fs));text-align:center;padding:0 calc(120px * var(--fs))}
  #cap .rule{width:calc(30px * var(--fs));height:2px;margin:0 auto calc(13px * var(--fs));background:var(--euv2);opacity:0;
    box-shadow:0 0 calc(12px * var(--fs)) var(--euv2)}
  #cap .cn{font:600 calc(25px * var(--fs))/1.4 var(--sans);letter-spacing:.012em;
    text-shadow:0 calc(2px * var(--fs)) calc(22px * var(--fs)) rgba(0,0,0,.92);opacity:0}
  #cap .en{margin-top:calc(9px * var(--fs));font:500 calc(13.5px * var(--fs))/1.45 var(--sans);letter-spacing:.06em;color:var(--ink2);
    text-shadow:0 calc(2px * var(--fs)) calc(18px * var(--fs)) rgba(0,0,0,.9);opacity:0}

  /* step rail */
  #rail{left:calc(46px * var(--fs));right:calc(46px * var(--fs));bottom:calc(36px * var(--fs));display:flex;align-items:center;gap:calc(12px * var(--fs));opacity:0}
  #rail .track{position:relative;flex:1;height:2px;background:rgba(255,255,255,.13)}
  #rail .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--euv),var(--euv2));box-shadow:0 0 calc(10px * var(--fs)) rgba(95,216,255,.6)}
  #rail .tick{position:absolute;top:calc(-4px * var(--fs));width:1px;height:calc(10px * var(--fs));background:rgba(255,255,255,.3)}
  #rail .tick.on{background:var(--euv2);box-shadow:0 0 calc(8px * var(--fs)) var(--euv2)}
  #rail .tick b{position:absolute;left:50%;transform:translateX(-50%);top:calc(-16px * var(--fs));
    font:700 calc(8px * var(--fs))/1 var(--mono);color:rgba(255,255,255,.4)}
  #rail .tick.on b{color:#fff}
  #rail .tc{font:600 calc(10px * var(--fs))/1 var(--mono);letter-spacing:.14em;color:var(--ink2);min-width:calc(84px * var(--fs))}
  #rail .lbl{font:700 calc(9px * var(--fs))/1 var(--mono);letter-spacing:.2em;color:var(--dim)}

  /* engineering insets (spectrum, pulse timing, multilayer, uniformity, 4:1) */
  #inset{right:calc(46px * var(--fs));bottom:calc(150px * var(--fs));width:calc(320px * var(--fs));
    border:1px solid var(--line);background:linear-gradient(180deg,rgba(9,14,22,.94),rgba(6,10,16,.90));
    opacity:0;transform:translateY(calc(12px * var(--fs)));transition:opacity .5s,transform .5s}
  #inset.on{opacity:1;transform:none}
  #inset .h{display:flex;justify-content:space-between;align-items:center;padding:calc(9px * var(--fs)) calc(12px * var(--fs));
    border-bottom:1px solid var(--line)}
  #inset .h .a{font:700 calc(9.5px * var(--fs))/1 var(--mono);letter-spacing:.2em;color:var(--euv2)}
  #inset .h .b{font:600 calc(8.5px * var(--fs))/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
  #inset canvas{display:block;width:100%;height:auto}
  #inset .f{padding:calc(7px * var(--fs)) calc(12px * var(--fs)) calc(10px * var(--fs));
    font:500 calc(9.5px * var(--fs))/1.5 var(--mono);color:var(--ink2);letter-spacing:.04em}

  /* title / end cards */
  #card{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
  #card .brand{font:700 calc(10px * var(--fs))/1 var(--mono);letter-spacing:.34em;color:var(--dim);
    border:1px dashed rgba(150,190,230,.3);padding:calc(9px * var(--fs)) calc(16px * var(--fs));margin-bottom:calc(26px * var(--fs))}
  #card h1{margin:0;font:700 calc(78px * var(--fs))/0.98 var(--sans);letter-spacing:.02em;
    text-shadow:0 0 calc(60px * var(--fs)) rgba(143,123,255,.45)}
  #card h2{margin:calc(14px * var(--fs)) 0 0;font:600 calc(15px * var(--fs))/1.5 var(--mono);letter-spacing:.28em;color:var(--euv2)}
  #card .sub{margin-top:calc(18px * var(--fs));font:500 calc(14px * var(--fs))/1.6 var(--sans);color:var(--ink2);letter-spacing:.04em}
  #card .note{margin-top:calc(30px * var(--fs));font:500 calc(10px * var(--fs))/1.7 var(--mono);color:var(--dim);letter-spacing:.1em;max-width:calc(760px * var(--fs))}

  /* recap grid for the outro */
  #recap{inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
  #recap .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(11px * var(--fs));width:calc(1180px * var(--fs))}
  #recap .it{border:1px solid rgba(150,190,230,.42);padding:calc(12px * var(--fs));background:linear-gradient(180deg,rgba(22,34,50,.92),rgba(13,20,30,.82));opacity:0;transform:translateY(calc(10px * var(--fs)));box-shadow:0 calc(10px * var(--fs)) calc(30px * var(--fs)) rgba(0,0,0,.5)}
  #recap .it.on{opacity:1;transform:none;transition:opacity .5s,transform .5s}
  #recap .it .n{font:700 calc(11px * var(--fs))/1 var(--mono);color:var(--euv2);letter-spacing:.16em}
  #recap .it .c{margin-top:calc(8px * var(--fs));font:600 calc(13.5px * var(--fs))/1.35 var(--sans);color:#f2f7fc}
  #recap .it .e{margin-top:calc(5px * var(--fs));font:500 calc(8px * var(--fs))/1.35 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

  /* ---------------- player chrome (never captured) ---------------- */
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 18px 16px;
    background:linear-gradient(0deg,rgba(3,6,12,.94),rgba(3,6,12,.55) 60%,transparent);
    transition:opacity .35s;font-family:var(--sans)}
  #ui.hide{opacity:0;pointer-events:none}
  #ui .row{display:flex;align-items:center;gap:12px}
  #scrub{position:relative;height:22px;cursor:pointer;flex:1}
  #scrub .bg{position:absolute;left:0;right:0;top:9px;height:4px;background:rgba(255,255,255,.14);border-radius:3px}
  #scrub .pl{position:absolute;left:0;top:9px;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--euv),var(--euv2))}
  #scrub .kn{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--euv2)}
  #scrub .ch{position:absolute;top:7px;width:1px;height:8px;background:rgba(255,255,255,.4)}
  .pb{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink2);border-radius:6px;
    padding:7px 11px;font:600 10px/1 var(--mono);letter-spacing:.1em;cursor:pointer;transition:.15s;white-space:nowrap}
  .pb:hover{color:#fff;background:rgba(143,123,255,.2);border-color:rgba(143,123,255,.5)}
  .pb.on{color:#fff;background:rgba(95,216,255,.22);border-color:rgba(95,216,255,.55)}
  #play{width:44px;height:44px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center}
  #tcode{font:600 11px/1 var(--mono);color:var(--ink2);letter-spacing:.1em;min-width:118px;text-align:right}
  #ui .grp{display:flex;gap:5px;align-items:center}
  #ui .sep{width:1px;height:22px;background:var(--line)}
  #ui .lab{font:600 9px/1 var(--mono);letter-spacing:.18em;color:var(--dim);margin-right:2px}
  #chapters{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
  #chapters .cb{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink2);border-radius:5px;
    padding:5px 8px;font:600 9px/1.3 var(--mono);letter-spacing:.06em;cursor:pointer}
  #chapters .cb:hover{color:#fff;border-color:rgba(95,216,255,.5)}
  #chapters .cb.on{color:#fff;background:rgba(95,216,255,.18);border-color:rgba(95,216,255,.5)}
  #chapters .cb b{display:block;font:600 10px/1.3 var(--sans);letter-spacing:.02em}

  #boot{position:fixed;inset:0;z-index:60;background:#02040a;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;transition:opacity .8s}
  #boot.done{opacity:0;pointer-events:none}
  #boot .r{width:58px;height:58px;border-radius:50%;border:2px solid rgba(143,123,255,.18);border-top-color:var(--euv);
    animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #boot .t{font:700 10px/1.8 var(--mono);letter-spacing:.34em;color:var(--euv2);text-transform:uppercase}
  #boot .m{font:500 10px/1.6 var(--mono);letter-spacing:.12em;color:var(--dim);min-height:15px}
  #boot .e{max-width:620px;font:500 11px/1.7 var(--mono);color:#ff7a5c;text-align:center;white-space:pre-wrap;padding:0 20px}

  /* 导出模式：冻结过渡与动画（帧一致性） */
  body.exporting *, body.exporting *::before, body.exporting *::after{
    transition:none !important; animation:none !important; backdrop-filter:none !important}

  /* vertical (9:16) layout adjustments for social cuts */
  body.vert #cap{padding:0 calc(56px * var(--fs));bottom:calc(210px * var(--fs))}
  body.vert #cap .cn{font-size:calc(34px * var(--fs))}
  body.vert #cap .en{font-size:calc(17px * var(--fs))}
  body.vert #chips{bottom:calc(360px * var(--fs))}
  body.vert #inset{right:auto;left:calc(46px * var(--fs));bottom:calc(560px * var(--fs));width:calc(420px * var(--fs))}
  body.vert #chap{top:calc(150px * var(--fs))}
  body.vert #rail{bottom:calc(120px * var(--fs))}
  body.vert #card h1{font-size:calc(64px * var(--fs))}
  body.vert #recap .grid{grid-template-columns:repeat(2,minmax(0,1fr));width:calc(880px * var(--fs))}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div class="grade vig"></div>
  <div class="grade grain"></div>
  <div class="grade flash" id="flash"></div>

  <div id="gfx">
    <div class="u" id="mark">
      <div class="t">EUV LITHOGRAPHY</div>
      <div class="s">PRINCIPLE · LPP SOURCE</div>
    </div>

    <div class="u" id="chap">
      <div class="num" id="chapNum">01<sub>/10</sub></div>

    <div class="u" id="sim">
      <span class="d"></span>
      <span class="l"><i>示意</i>SIMULATION</span>
    </div>

    <div class="u" id="chips"></div>

    <div class="u" id="inset">
      <div class="h"><span class="a" id="insetA">SPECTRUM</span><span class="b" id="insetB">示意 / SIM</span></div>
      <canvas id="insetC" width="640" height="330"></canvas>
      <div class="f" id="insetF"></div>
    </div>

    <div class="u" id="cap">
      <div class="rule" id="capRule"></div>
      <div class="cn" id="capCn"></div>
      <div class="en" id="capEn"></div>

      <div class="brand" id="cardBrand">BRAND / LOGO PLACEHOLDER</div>

      <h2 id="cardH2">EUV LITHOGRAPHY · 13.5 nm</h2>
      <div class="sub" id="cardSub"></div>

<div id="ui">
  <div class="row">
    <button class="pb" id="play">▶</button>

  <div class="row" style="margin-top:10px;flex-wrap:wrap">

<div id="boot">
  <div class="r"></div>
  <div class="t">Loading EUV sequence</div>
  <div class="m" id="bootMsg">three.js …</div>
  <div class="e" id="bootErr"></div>

<script type="module">
// ===== src/00-boot.js ======================================================
/* =============================================================================
   00 · BOOT  ·  three.js 加载（本地优先 / CDN 回退）、启动界面、URL 参数
   ========================================================================== */

const bootEl = document.getElementById('boot');
const bootMsg = document.getElementById('bootMsg');
const bootErr = document.getElementById('bootErr');
const boot = (m) => { if (bootMsg) bootMsg.textContent = m; };
function bootFail(e) {
  const txt = e && e.stack ? e.stack : String(e);
  if (bootErr) bootErr.textContent = `初始化失败 / INIT FAILED\n${txt}`;
  console.error('[euv] fatal', e);
}
window.addEventListener('error', (e) => { if (!window.API || !window.API.ready) bootFail(e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { if (!window.API || !window.API.ready) bootFail(e.reason); });

/* ---------------------------------------------------------------- options   */
const QS = new URLSearchParams(location.search);
const OPT = {
  export: QS.get('export') === '1',
  cut: QS.get('cut') || 'full',
  aspect: QS.get('asp') || '16:9',
  quality: QS.get('q') || null,
  start: parseFloat(QS.get('t') || '0') || 0,
  sub: QS.get('sub') || 'both',
  gfx: QS.get('gfx') !== '0',
  audio: QS.get('audio') !== '0',
  autoplay: QS.get('autoplay') !== '0',
};

const CDN1 = 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.min.js';
const CDN2 = 'https://unpkg.com/three@0.161.0/build/three.module.min.js';
async function loadThree() {
  const local = new URL('./vendor/three.module.min.js', document.baseURI).href;
  const order = location.protocol === 'file:' ? [CDN1, CDN2, local] : [local, CDN1, CDN2];
  let last;
  for (const url of order) {
    try {
      const m = await import(/* @vite-ignore */ url);
      if (m && m.REVISION) { console.log(`[euv] three r${m.REVISION} (${url === local ? 'local' : 'cdn'})`); return m; }
    } catch (e) { last = e; }
  }
  throw new Error(`three.js 加载失败: ${last && last.message}`);
}

boot('three.js …');
const THREE = await loadThree();

// ===== src/10-util.js ======================================================
/* =============================================================================
   10 · UTIL  · 数学 / 确定性噪声 / 缓动 / 画质分级 / 几何工具
   本片所有动画均为时间 t 的纯函数（不做增量积分），因此任意帧可重复渲染，
   导出的帧序列完全一致——这是"无闪烁、无未渲染帧"的前提。
   ========================================================================== */

const TAU = Math.PI * 2;
const D2R = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => (b - a === 0 ? 0 : clamp01((v - a) / (b - a)));
const smooth = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const smoothstep = (e0, e1, x) => smooth(inv(e0, e1, x));
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const easeIn = (t) => Math.pow(clamp01(t), 3);
/** 0 → 1 → 0 窗口（用于闪光、脉冲） */
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? easeOut(inv(t0, t0 + rise, t)) : 1 - smoothstep(t0 + rise, t0 + rise + fall, t));

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rnd = mulberry32(20250413);
/** 确定性 hash：粒子/碎屑等一律由 index 派生，保证逐帧可复现 */
const hash1 = (i) => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };
const hash2 = (i) => { const x = Math.sin(i * 269.5 + 11.3) * 21983.13; return x - Math.floor(x); };
const hash3 = (i) => { const x = Math.sin(i * 419.2 + 71.9) * 13571.71; return x - Math.floor(x); };

function makeSampler(table, keys) {
  const xs = table.map((r) => r.x);
  return (x, out = {}) => {
    let i = 0;
    if (x <= xs[0]) i = 0;
    else if (x >= xs[xs.length - 1]) i = xs.length - 2;
    else while (i < xs.length - 2 && x > xs[i + 1]) i++;
    const a = table[i], b = table[i + 1];
    const t = inv(a.x, b.x, x);
    for (const k of keys) out[k] = lerp(a[k], b[k], t);
    return out;
  };
}

const _obj = new THREE.Object3D();

function mergeGeoms(list) {
  const geoms = list.filter(Boolean);
  if (geoms.length === 1) return geoms[0];
  let vc = 0, ic = 0;
  for (const g of geoms) {
    if (!g.attributes.normal) g.computeVertexNormals();
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    vc += g.attributes.position.count;
    ic += g.index ? g.index.count : g.attributes.position.count;
  }
  const pos = new Float32Array(vc * 3), nrm = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);
  const idx = new Uint32Array(ic);
  let vo = 0, io = 0;
  for (const g of geoms) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3);
    nrm.set(g.attributes.normal.array, vo * 3);
    uv.set(g.attributes.uv.array, vo * 2);
    if (g.index) { for (let i = 0; i < g.index.count; i++) idx[io + i] = g.index.array[i] + vo; io += g.index.count; }
    else { for (let i = 0; i < n; i++) idx[io + i] = i + vo; io += n; }
    vo += n;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

/** 绕 +Y 轴回转（默认）；profile 为 [[r, y], ...] */
function latheY(profile, seg = 64, aStart = 0, aLen = TAU) {
  return new THREE.LatheGeometry(profile.map((p) => new THREE.Vector2(Math.max(1e-4, p[0]), p[1])), seg, aStart, aLen);
}
/** 绕 +X 轴回转（光轴沿 X 的部件）；profile 为 [[x, r], ...] */
function latheX(profile, seg = 64, aStart = 0, aLen = TAU) {
  const g = latheY(profile.map((p) => [p[1], p[0]]), seg, aStart, aLen);
  g.rotateZ(-Math.PI / 2);
  return g;
}

/** 沿 2D 路径法向偏移，得到壁厚闭合截面 */
function offsetPath2D(line, d) {
  const out = [];
  for (let i = 0; i < line.length; i++) {
    const p = line[i], a = line[Math.max(0, i - 1)], b = line[Math.min(line.length - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx, ty) || 1;
    tx /= l; ty /= l;
    out.push([p[0] + ty * d, Math.max(0.0002, p[1] - tx * d)]);
  }
  return out;
}
const wallFromPath = (line, t) => [...offsetPath2D(line, t * 0.5), ...offsetPath2D(line, -t * 0.5).reverse()];

/** 管道（光路、气流、支撑） */
function tube(points, radius, radial = 8, seg = 64) {
  const c = new THREE.CatmullRomCurve3(points.map((p) => (p.isVector3 ? p : new THREE.Vector3(p[0], p[1], p[2]))), false, 'catmullrom', 0.25);
  return new THREE.TubeGeometry(c, seg, radius, radial, false);
}

function box(w, h, d, r = 0) {
  return new THREE.BoxGeometry(w, h, d, 1, 1, 1);
}

/** 曲面镜片（矩形/圆形开孔的抛物或椭球面片），带厚度基板 */
function mirrorPatch({ w = 1, h = 1, curve = 0.25, thick = 0.09, segs = 28, round = false }) {
  const top = new THREE.BufferGeometry();
  const n = segs, m = segs;
  const pos = [], nor = [], uv = [], idx = [];
  const zAt = (u, v) => -curve * ((u * u) + (v * v));
  for (let j = 0; j <= m; j++) {
    for (let i = 0; i <= n; i++) {
      const u = (i / n) * 2 - 1, v = (j / m) * 2 - 1;
      pos.push(u * w * 0.5, v * h * 0.5, zAt(u, v) * Math.max(w, h) * 0.5);
      const du = -2 * curve * u * Math.max(w, h) * 0.5 / (w * 0.5);
      const dv = -2 * curve * v * Math.max(w, h) * 0.5 / (h * 0.5);
      const nv = new THREE.Vector3(-du, -dv, 1).normalize();
      nor.push(nv.x, nv.y, nv.z);
      uv.push(i / n, j / m);
    }
  }
  for (let j = 0; j < m; j++) {
    for (let i = 0; i < n; i++) {
      const a = j * (n + 1) + i, b = a + 1, c = a + n + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  top.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  top.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  top.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  top.setIndex(idx);
  const back = new THREE.BoxGeometry(w * 0.98, h * 0.98, thick);
  back.translate(0, 0, -thick * 0.5 - curve * Math.max(w, h) * 0.5 - 0.004);
  return { top, back };
}

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, repeat = [1, 1], srgb = true) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = 4;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ------------------------------------------------------------------ time    */
const TC = (s) => {
  s = Math.max(0, s);
  const f = Math.floor((s % 1) * SCRIPT.meta.fps);
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}:${String(f).padStart(2, '0')}`;
};

`;

const INSTANCE_GLSL = `
#ifdef USE_INSTANCING
  mat4 iM = instanceMatrix;
#else
  mat4 iM = mat4(1.0);
#endif
`;

/* -------------------------------------------------------------------------- */
function buildEnvironment(renderer) {
  const w = 1024, h = 512;
  const c = makeCanvas(w, h), g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0.00, '#c3d2e4');
  sky.addColorStop(0.26, '#6d7f96');
  sky.addColorStop(0.48, '#2b3546');
  sky.addColorStop(0.52, '#1c2330');
  sky.addColorStop(1.00, '#0d1219');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  const blob = (u, v, r, col, a) => {
    const x = u * w, y = v * h;
    const grd = g.createRadialGradient(x, y, 0, x, y, r * w);
    grd.addColorStop(0, `rgba(${col},${a})`);
    grd.addColorStop(0.45, `rgba(${col},${a * 0.4})`);
    grd.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r * w, 0, TAU); g.fill();
  };
  blob(0.22, 0.16, 0.20, '255,255,255', 0.95);      // key softbox
  blob(0.70, 0.22, 0.16, '176,208,255', 0.80);      // cool fill
  blob(0.92, 0.40, 0.10, '190,164,255', 0.55);      // EUV violet kicker
  blob(0.46, 0.74, 0.30, '120,150,190', 0.22);      // floor bounce
  for (let i = 0; i < 5; i++) {                     // hangar strips
    const y = h * (0.06 + i * 0.05);
    const grd = g.createLinearGradient(0, y, w, y);
    grd.addColorStop(0, 'rgba(210,230,255,0)');
    grd.addColorStop(0.5, `rgba(255,255,255,${0.42 - i * 0.06})`);
    grd.addColorStop(1, 'rgba(210,230,255,0)');
    g.fillStyle = grd; g.fillRect(0, y, w, h * 0.016);
  }
  g.fillStyle = 'rgba(8,11,18,0.5)';
  for (let i = 0; i < 8; i++) g.fillRect((i / 8) * w + 10, 0, w * 0.010, h * 0.45);

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const p = new THREE.PMREMGenerator(renderer);
  p.compileEquirectangularShader();
  const env = p.fromEquirectangular(tex).texture;
  p.dispose(); tex.dispose();
  return env;
}

/* ------------------------------------------------------- procedural textures */
function texBrushed(size = 512, base = 0.5, amp = 0.24) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  const v = (base * 255) | 0;
  g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, 0, size, size);
  const r = mulberry32(5);
  for (let i = 0; i < size * 4; i++) {
    const y = r() * size, l = base + (r() - 0.5) * amp * 2;
    g.strokeStyle = `rgba(${(l * 255) | 0},${(l * 255) | 0},${(l * 255) | 0},${0.06 + r() * 0.24})`;
    g.lineWidth = r() < 0.85 ? 0.7 : 1.8;
    g.beginPath();
    const x0 = r() * size;
    g.moveTo(x0, y); g.lineTo(x0 + size * (0.2 + r() * 0.9), y + (r() - 0.5));
    g.stroke();
  }
  return c;
}
function normalFrom(src, strength = 1.2) {
  const s = src.width;
  const d = src.getContext('2d').getImageData(0, 0, s, s).data;
  const out = makeCanvas(s, s), g = out.getContext('2d');
  const img = g.createImageData(s, s);
  const at = (x, y) => d[(((y + s) % s) * s + ((x + s) % s)) * 4] / 255;
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const dx = (at(x + 1, y) - at(x - 1, y)) * strength, dy = (at(x, y + 1) - at(x, y - 1)) * strength;
    const l = Math.hypot(-dx, -dy, 1), i = (y * s + x) * 4;
    img.data[i] = ((-dx / l) * 0.5 + 0.5) * 255;
    img.data[i + 1] = ((-dy / l) * 0.5 + 0.5) * 255;
    img.data[i + 2] = (1 / l) * 0.5 * 255 + 127;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return out;
}
/** 掩模/晶圆用的芯片版图纹理 */
function texCircuit(size = 1024, density = 1) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  g.fillStyle = '#05070c'; g.fillRect(0, 0, size, size);
  const r = mulberry32(77);
  g.strokeStyle = '#cfe0f2';
  const cell = size / (10 * density);
  for (let bx = 0; bx < 10 * density; bx++) {
    for (let by = 0; by < 10 * density; by++) {
      const x0 = bx * cell, y0 = by * cell;
      const kind = r();
      g.lineWidth = Math.max(1, cell * 0.045);
      if (kind < 0.42) {                       // dense line/space array
        const n = 6 + Math.floor(r() * 7);
        for (let i = 0; i < n; i++) {
          const p = x0 + (cell * (i + 0.5)) / n;
          g.beginPath(); g.moveTo(p, y0 + cell * 0.1); g.lineTo(p, y0 + cell * 0.9); g.stroke();
        }
      } else if (kind < 0.72) {                // horizontal bus
        const n = 4 + Math.floor(r() * 5);
        for (let i = 0; i < n; i++) {
          const p = y0 + (cell * (i + 0.5)) / n;
          g.beginPath(); g.moveTo(x0 + cell * 0.08, p); g.lineTo(x0 + cell * 0.92, p); g.stroke();
        }
      } else if (kind < 0.88) {                // contact array
        for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
          g.fillStyle = '#b9d2ea';
          g.fillRect(x0 + cell * (0.15 + i * 0.17), y0 + cell * (0.15 + j * 0.17), cell * 0.075, cell * 0.075);
        }
      } else {                                  // logic block outline
        g.strokeRect(x0 + cell * 0.12, y0 + cell * 0.12, cell * 0.76, cell * 0.76);
        g.beginPath(); g.moveTo(x0 + cell * 0.12, y0 + cell * 0.5); g.lineTo(x0 + cell * 0.88, y0 + cell * 0.5); g.stroke();
      }
    }
  }
  return c;
}

/* -------------------------------------------------------------------------- */

/* 自发光效果着色器                                                            */

/** 体积感光束：核心亮、边缘菲涅尔衰减、沿轴向脉冲流动 */
function beamMaterial(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: SHARED.time,
      uExpo: SHARED.expo,
      uColor: { value: new THREE.Color(o.color ?? 0x7bd6ff) },
      uHot: { value: new THREE.Color(o.hot ?? 0xffffff) },
      uInt: { value: o.intensity ?? 1 },
      uFlow: { value: o.flow ?? 1.4 },
      uPulse: { value: o.pulse ?? 0.0 },
      uAxis: { value: new THREE.Vector2(o.a0 ?? -1, o.a1 ?? 1) },
      uEdge: { value: o.edge ?? 1.5 },
      uRing: { value: o.ring ?? 0.0 },
    },
    vertexShader: `
      varying vec2 vUv; varying vec3 vN; varying vec3 vV; varying vec3 vP;
      void main(){
        ${INSTANCE_GLSL}
        vec4 lp = iM * vec4(position, 1.0);
        vec4 wp = modelMatrix * lp;
        vUv = uv; vP = lp.xyz;
        vN = normalize(mat3(modelMatrix) * mat3(iM) * normal);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      ${NOISE_GLSL}
      ${FX_TONE_GLSL}
      uniform float uTime, uInt, uFlow, uPulse, uEdge, uRing;
      uniform vec3 uColor, uHot; uniform vec2 uAxis;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV; varying vec3 vP;
      void main(){
        if (uInt <= 0.0005) discard;
        float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), uEdge);
        float along = vUv.x;
        float flow = fract(along * 3.0 - uTime * uFlow);
        float streak = smoothstep(0.0, 0.12, flow) * (1.0 - smoothstep(0.18, 0.85, flow));
        float grain = 0.75 + 0.5 * fbm3(vec3(vP.xyz * 7.0 - vec3(uTime * 2.2, 0.0, 0.0)));
        float head = uPulse > 0.0 ? smoothstep(uPulse - 0.16, uPulse, along) * (1.0 - smoothstep(uPulse, uPulse + 0.06, along)) : 0.0;
        float ring = uRing > 0.0 ? smoothstep(0.42, 0.5, abs(vUv.y - 0.5)) * uRing : 0.0;
        float a = uInt * (0.16 + 0.55 * fres + 0.5 * streak + 1.6 * head + ring) * grain;
        vec3 col = mix(uColor, uHot, clamp(0.25 * fres + 0.7 * head + 0.35 * streak, 0.0, 1.0));
        gl_FragColor = fxOut(col * a * 1.25, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}

/** 高温等离子体：湍流噪声球，白热核心 + 橙色外缘 */
function plasmaMaterial(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: SHARED.time,
      uExpo: SHARED.expo,
      uInt: { value: 0 },
      uScale: { value: o.scale ?? 6.0 },
      uCore: { value: new THREE.Color(0xffffff) },
      uMid: { value: new THREE.Color(0xd8c8ff) },
      uEdge: { value: new THREE.Color(0xff8a3c) },
      uSeed: { value: o.seed ?? 0 },
    },
    vertexShader: `
      varying vec3 vP; varying vec3 vN; varying vec3 vV;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vP = position; vN = normalize(normalMatrix * normal);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      ${NOISE_GLSL}
      ${FX_TONE_GLSL}
      uniform float uTime, uInt, uScale, uSeed;
      uniform vec3 uCore, uMid, uEdge;
      varying vec3 vP; varying vec3 vN; varying vec3 vV;
      void main(){
        if (uInt <= 0.0005) discard;
        float r = length(vP);
        vec3 q = normalize(vP) * uScale + vec3(uSeed, uSeed * 0.7, -uTime * 2.6);
        float n = fbm3(q);
        float turb = mix(0.45, 1.55, n);
        float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 1.35);
        float core = pow(clamp(1.0 - r, 0.0, 1.0), 1.6);
        vec3 col = mix(uEdge, uMid, clamp(core * 1.8, 0.0, 1.0));
        col = mix(col, uCore, clamp(core * core * 2.2 * turb, 0.0, 1.0));
        float a = uInt * turb * (0.28 + 0.85 * core + 0.5 * fres);
        gl_FragColor = fxOut(col * a * 1.6, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}

/** 气流 / 碎屑云 / 潜影雾等柔性体积 */
function wispMaterial(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: SHARED.time,
      uExpo: SHARED.expo,
      uInt: { value: o.intensity ?? 0.5 },
      uColor: { value: new THREE.Color(o.color ?? 0x6ff0d0) },
      uSpeed: { value: o.speed ?? 0.6 },
      uScale: { value: o.scale ?? 3.0 },
      uDir: { value: new THREE.Vector3(o.dir ? o.dir[0] : 1, o.dir ? o.dir[1] : 0, o.dir ? o.dir[2] : 0) },
    },
    vertexShader: `
      varying vec2 vUv; varying vec3 vP; varying vec3 vN; varying vec3 vV;
      void main(){
        ${INSTANCE_GLSL}
        vec4 lp = iM * vec4(position, 1.0);
        vec4 wp = modelMatrix * lp;
        vUv = uv; vP = lp.xyz;
        vN = normalize(mat3(modelMatrix) * mat3(iM) * normal);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      ${NOISE_GLSL}
      ${FX_TONE_GLSL}
      uniform float uTime, uInt, uSpeed, uScale; uniform vec3 uColor, uDir;
      varying vec2 vUv; varying vec3 vP; varying vec3 vN; varying vec3 vV;
      void main(){
        if (uInt <= 0.0005) discard;
        vec3 q = vP * uScale - uDir * (uTime * uSpeed * uScale);
        float n = fbm3(q);
        float band = smoothstep(0.30, 0.62, n);
        float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 1.2);
        float endFade = smoothstep(0.0, 0.12, vUv.x) * (1.0 - smoothstep(0.72, 1.0, vUv.x));
        float a = uInt * band * endFade * (0.35 + 0.9 * fres);
        gl_FragColor = fxOut(uColor * a * 1.4, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}

/** 射线束（等离子体各向辐射 / 光线示意）：细管 + 行进脉冲 */
function rayMaterial(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: SHARED.time,
      uExpo: SHARED.expo,
      uInt: { value: o.intensity ?? 1 },
      uColor: { value: new THREE.Color(o.color ?? 0x8f7bff) },
      uHot: { value: new THREE.Color(o.hot ?? 0xdff0ff) },
      uSpeed: { value: o.speed ?? 0.9 },
      uCount: { value: o.count ?? 2.0 },
      uWidth: { value: o.width ?? 0.22 },
      uReveal: { value: 1 },
    },
    vertexShader: `
      attribute float aSeed;
      varying vec2 vUv; varying float vSeed; varying vec3 vN; varying vec3 vV;
      void main(){
        ${INSTANCE_GLSL}
        vec4 lp = iM * vec4(position, 1.0);
        vec4 wp = modelMatrix * lp;
        vUv = uv; vSeed = aSeed;
        vN = normalize(mat3(modelMatrix) * mat3(iM) * normal);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      ${FX_TONE_GLSL}
      uniform float uTime, uInt, uSpeed, uCount, uWidth, uReveal;
      uniform vec3 uColor, uHot;
      varying vec2 vUv; varying float vSeed; varying vec3 vN; varying vec3 vV;
      void main(){
        if (uInt <= 0.0005) discard;
        float u = vUv.x;
        if (u > uReveal) discard;
        float p = fract(u * uCount - uTime * uSpeed + vSeed);
        float head = smoothstep(0.0, uWidth * 0.35, p) * (1.0 - smoothstep(uWidth * 0.4, uWidth, p));
        float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 1.1);
        float a = uInt * (0.07 + 0.22 * fres + 1.15 * head);
        vec3 col = mix(uColor, uHot, head);
        gl_FragColor = fxOut(col * a * 1.35, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}

/** 加性点光晕（等离子体闪光、焦点、反射高光） */
function glowMaterial(color = 0xffffff, power = 2.6) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uInt: { value: 1 }, uPow: { value: power }, uExpo: SHARED.expo },
    vertexShader: `
      varying vec2 vUv;
      void main(){
        ${INSTANCE_GLSL}
        vUv = uv;
        vec4 wp = modelMatrix * iM * vec4(position, 1.0);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      ${FX_TONE_GLSL}
      uniform vec3 uColor; uniform float uInt, uPow;
      varying vec2 vUv;
      void main(){
        if (uInt <= 0.0005) discard;
        float d = length(vUv - 0.5) * 2.0;
        float a = pow(clamp(1.0 - d, 0.0, 1.0), uPow) * uInt;
        gl_FragColor = fxOut(uColor * a * 1.8, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}

/** 粒子系统（锡碎屑、氢气分子、光子等）— 位置由 CPU 端解析函数每帧写入 */
function pointsMaterial(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(o.color ?? 0xbfe6ff) },
      uHot: { value: new THREE.Color(o.hot ?? 0xffffff) },
      uSize: { value: o.size ?? 26 },
      uPixel: { value: 1 },
      uInt: { value: 1 },
      uExpo: SHARED.expo,
    },
    vertexShader: `
      attribute float aA; attribute float aS; attribute float aT;
      uniform float uSize, uPixel;
      varying float vA; varying float vT;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize * aS * uPixel / max(0.25, -mv.z);
        vA = aA; vT = aT;
      }`,
    fragmentShader: `
      ${FX_TONE_GLSL}
      uniform vec3 uColor, uHot; uniform float uInt;
      varying float vA; varying float vT;
      void main(){
        vec2 p = gl_PointCoord - 0.5;
        float r2 = dot(p, p);
        if (r2 > 0.25) discard;
        float core = exp(-r2 * 14.0), glow = exp(-r2 * 3.6) * 0.4;
        float a = (core + glow) * vA * uInt;
        gl_FragColor = fxOut(mix(uColor, uHot, vT) * (core * 1.6 + glow), a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
}

/** 3D 锚定标注（由 70-overlay 投影为 HTML 引线标签） */
const LABELS = [];
function label3d(parent, pos, o) {
  const anchor = new THREE.Object3D();
    anchor.position.set(pos[0], pos[1], pos[2]);
  parent.add(anchor);
  LABELS.push({
    obj: anchor, cn: o.cn, en: o.en || '', sub: o.sub || '',
    t0: o.t0, t1: o.t1, side: o.side || 'right', tone: o.tone || 'euv',
  });
  return anchor;
}

/** uv.x 沿轴向的锥形管（光束、气流通道） */
function taperedTube(len, r0, r1, seg = 24, radial = 20) {
  const pos = [], nor = [], uv = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const u = i / seg, x = u * len, r = lerp(r0, r1, u);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * TAU;
      const cy = Math.cos(a), sy = Math.sin(a);
      pos.push(x, cy * r, sy * r);
      nor.push(0, cy, sy);
      uv.push(u, j / radial);
    }
  }
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + 1, c = a + radial + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

/** 在两点之间放置锥形光束（自动对齐方向） */
function beamBetween(parent, p0, p1, r0, r1, mat, o = {}) {
  const a = new THREE.Vector3(...p0), b = new THREE.Vector3(...p1);
  const len = a.distanceTo(b);
  const g = taperedTube(len, r0, r1, o.seg ?? 26, o.radial ?? 18);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), b.clone().sub(a).normalize());
  m.renderOrder = 8;
  m.frustumCulled = false;
  parent.add(m);
  return m;
}

/** 一束射线（每条路径一根细管，合并为单次绘制，携带 aSeed 供着色器错相） */
function rayBundle(parent, paths, mat, radius = 0.0045, o = {}) {
  const geoms = [], seeds = [];
  paths.forEach((pts, i) => {
    geoms.push(tube(pts, radius, o.radial ?? 4, o.seg ?? Math.max(8, (pts.length - 1) * 6)));
    seeds.push(hash1(i + 3));
  });
  let vc = 0, ic = 0;
  for (const g of geoms) { vc += g.attributes.position.count; ic += g.index.count; }
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);
  const seed = new Float32Array(vc), idx = new Uint32Array(ic);
  let vo = 0, io = 0;
  geoms.forEach((g, gi) => {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3);
    nor.set(g.attributes.normal.array, vo * 3);
    uv.set(g.attributes.uv.array, vo * 2);
    seed.fill(seeds[gi], vo, vo + n);
    for (let i = 0; i < g.index.count; i++) idx[io + i] = g.index.array[i] + vo;
    io += g.index.count; vo += n;
    g.dispose();
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 7;
  parent.add(mesh);
  return mesh;
}

/** 六足精密调整机构（镜片支撑，工程可信度细节） */

  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(rBase, rBase * 1.04, 0.05, 24), MAT.steelDark);
  base.position.y = -h;

    const a0 = (i / 6) * TAU + 0.22, a1 = ((i + (i % 2 ? 1 : -1) * 0.42) / 6) * TAU;
    const p0 = new THREE.Vector3(Math.cos(a0) * rTop, 0, Math.sin(a0) * rTop);
    const p1 = new THREE.Vector3(Math.cos(a1) * rBase, -h, Math.sin(a1) * rBase);
    const len = p0.distanceTo(p1);
    const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, len, 10), MAT.alu);
    strut.position.copy(p0).add(p1).multiplyScalar(0.5);
    strut.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p1.clone().sub(p0).normalize());
    g.add(strut);
    const act = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, len * 0.32, 12), MAT.steel);
    act.position.copy(strut.position);
    act.quaternion.copy(strut.quaternion);

}

/**
 * 椭球集光镜。等离子体位于第一焦点、中间焦点位于第二焦点——
 * 射线由椭圆反射性质精确生成，保证"光路方向正确"。
 */
function collectorMirror(parent, o = {}) {
  const a = o.a ?? 1.70, c = o.c ?? 1.35;          // 半长轴 / 焦距
  const b = Math.sqrt(a * a - c * c);
  const xFrom = o.xFrom ?? -a, xTo = o.xTo ?? -0.86;
  const hole = o.hole ?? 0.14;                      // 中心通孔（CO₂ 激光由此射入）
  const seg = Math.max(40, Q.seg);
  const rAt = (x) => b * Math.sqrt(Math.max(0, 1 - (x * x) / (a * a)));

  const g = new THREE.Group();
  /* 反射面（回转面，带中心孔） */
  const prof = [];
  const n = 36;
  for (let i = 0; i <= n; i++) {
    const x = lerp(xFrom, xTo, i / n);
    const r = rAt(x);
    if (r < hole) continue;
    prof.push([x, r]);
  }
  if (prof.length && prof[0][1] > hole) prof.unshift([xFrom + 0.001, hole]);
  const face = new THREE.Mesh(latheX(prof, seg), MAT.multilayer);
  face.material.side = THREE.DoubleSide;
  g.add(face);
  /* 基板厚度与背筋 */
  const backProf = prof.map(([x, r]) => [x - 0.07, r]);
  const shell = new THREE.Mesh(latheX([...prof, ...backProf.reverse()], seg), MAT.substrate);
  g.add(shell);
  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * TAU;
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.055, Math.abs(xTo - xFrom) * 0.9, 0.03), MAT.steelDark);
    rib.position.set((xFrom + xTo) / 2 - 0.10, Math.cos(ang) * rAt((xFrom + xTo) / 2) * 0.72, Math.sin(ang) * rAt((xFrom + xTo) / 2) * 0.72);
    rib.rotation.set(ang, 0, Math.PI / 2);
    g.add(rib);
  }
  /* 冷却环 + 外框 */
  const rim = new THREE.Mesh(new THREE.TorusGeometry(rAt(xTo) + 0.03, 0.035, 8, seg), MAT.steel);
  rim.rotation.y = Math.PI / 2;
  rim.position.x = xTo;
  g.add(rim);

  /* 把第一焦点放到局部原点 */
  g.position.x = c;
  parent.add(g);
  return { group: g, a, b, c, xFrom, xTo, hole, rAt, F1: [0, 0, 0], F2: [2 * c, 0, 0] };
}

/** 由第一焦点出发、经椭球面反射到第二焦点的精确光路 */
function collectorRayPaths(col, count, o = {}) {
  const paths = [];
  const minA = o.minA ?? Math.atan2(col.hole * 1.5, Math.abs(col.xFrom + col.c)) + 0.05;
  const maxA = o.maxA ?? 2.02;
  const c0 = Math.cos(minA), c1 = Math.cos(maxA);
  for (let i = 0; i < count; i++) {
    const u = (i + 0.5) / count;
    const phi = hash1(i * 1.7) * TAU;
    /* 立体角均匀采样：cos(th) 线性插值 */
    const th = Math.acos(clamp(lerp(c0, c1, u), -1, 1));
    /* 由 F1（局部原点）出发的射线与椭球求交；椭球中心位于 x = c（F1 在 x=0） */
    const dx = -Math.cos(th), dr = Math.sin(th);
    const dy = dr * Math.cos(phi), dz = dr * Math.sin(phi);
    const A = (dx * dx) / (col.a * col.a) + (dy * dy + dz * dz) / (col.b * col.b);
    const B = (-2 * col.c * dx) / (col.a * col.a);
    const C = (col.c * col.c) / (col.a * col.a) - 1;
    const disc = B * B - 4 * A * C;
    if (disc < 0) continue;
    const t = (-B + Math.sqrt(disc)) / (2 * A);
    if (!(t > 0)) continue;
    const P = [dx * t, dy * t, dz * t];
    const xe = P[0] - col.c;                       // 椭球坐标系下的轴向位置
    if (xe < col.xFrom - 1e-3 || xe > col.xTo + 1e-3) continue;
    paths.push([[0, 0, 0], P, col.F2]);
  }
  return paths;
}

/** 面镜阵列（视场面镜 / 光瞳面镜）：InstancedMesh + 可变倾角 */
function facetArray(parent, o = {}) {
  const nx = o.nx ?? Q.facets, ny = o.ny ?? Q.facets;
  const size = o.size ?? 0.075, gap = o.gap ?? 0.012, curve = o.curve ?? 0.5;
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(size, size, 0.012);
  const mesh = new THREE.InstancedMesh(geo, o.warm ? MAT.multilayerWarm : MAT.multilayer, nx * ny);
  const w = nx * (size + gap), h = ny * (size + gap);
  let k = 0;
  const centers = [];
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const x = -w / 2 + (i + 0.5) * (size + gap);
      const y = -h / 2 + (j + 0.5) * (size + gap);
      const z = -curve * ((x * x) / (w * 0.5) + (y * y) / (h * 0.5)) * 0.5;
      _obj.position.set(x, y, z);
      _obj.rotation.set(y * 0.55, -x * 0.55, hash1(k) * 0.05);
      _obj.scale.setScalar(1);
      _obj.updateMatrix();
      mesh.setMatrixAt(k, _obj.matrix);
      centers.push([x, y, z]);
      k++;
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  g.add(mesh);
  const plate = new THREE.Mesh(new THREE.BoxGeometry(w + 0.09, h + 0.09, 0.05), MAT.substrate);
  plate.position.z = -0.05 - curve * 0.1;
  g.add(plate);
  const hp = new THREE.Group();
  hp.position.z = -0.16;
  hp.rotation.x = Math.PI / 2;
  hexapod(hp, { rTop: w * 0.22, rBase: w * 0.34, h: 0.2 });
  g.add(hp);
  g.position.set(o.pos ? o.pos[0] : 0, o.pos ? o.pos[1] : 0, o.pos ? o.pos[2] : 0);
  if (o.rot) g.rotation.set(o.rot[0], o.rot[1], o.rot[2]);
  parent.add(g);
  g.userData.centers = centers;
  g.userData.mesh = mesh;
  return g;
}

/** 精密工作台（掩模台 / 晶圆台）：导轨 + 音圈 + 光栅尺 */
function precisionStage(parent, o = {}) {
  const g = new THREE.Group();

/** 300 mm 晶圆 + 芯片阵列 + 光刻胶层 */
function waferAssembly(parent, o = {}) {
  const g = new THREE.Group();
  const R = o.r ?? 1.0;
  const wafer = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.022, Math.max(48, Q.seg)), MAT.silicon);
  g.add(wafer);
  /* 缺口 (notch) */
  const notch = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.03, 0.05), MAT.dark);
  notch.position.set(0, 0, -R);
  g.add(notch);
  /* 已曝光的 die 阵列 */
  const die = new THREE.PlaneGeometry(R * 0.19, R * 0.135);
  const dies = [];
  const inst = new THREE.InstancedMesh(die, new THREE.MeshStandardMaterial({
    color: 0x6d8598, metalness: 0.8, roughness: 0.2, map: MAT.circuitTex, envMapIntensity: 1.3,
    transparent: true, opacity: 1,
  }), 200);
  let k = 0;
  for (let j = -5; j <= 5; j++) {
    for (let i = -5; i <= 5; i++) {
      const x = i * R * 0.2, z = j * R * 0.145;
      if (Math.hypot(x, z) > R * 0.88) continue;
      _obj.position.set(x, 0.0125, z);
      _obj.rotation.set(-Math.PI / 2, 0, 0);
      _obj.scale.setScalar(1);
      _obj.updateMatrix();
      inst.setMatrixAt(k, _obj.matrix);
      dies.push([x, z]);
      k++;
    }
  }
  inst.count = k;
  inst.instanceMatrix.needsUpdate = true;
  g.add(inst);
  /* 光刻胶层 */
  const resist = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.995, R * 0.995, 0.006, Math.max(48, Q.seg)), MAT.resist);
  resist.position.y = 0.016;
  g.add(resist);
  g.position.set(o.pos ? o.pos[0] : 0, o.pos ? o.pos[1] : 0, o.pos ? o.pos[2] : 0);
  parent.add(g);
  g.userData.dies = dies;
  g.userData.dieMesh = inst;
  g.userData.resist = resist;
  return g;
}

/* =============================================================================
   40 · SCENES A  ·  片头 / 整机 / ①锡滴发生器 / ②预脉冲 / ③主脉冲 / ④13.5nm 辐射
   每个场景返回 update(t, local, k)：所有动画都是时间的纯函数（可逐帧复现）
   ========================================================================== */

const SCENES = {};
const BILLBOARDS = [];
function defineScene(id, builder) { SCENES[id] = builder; }
function billboard(m) { BILLBOARDS.push(m); return m; }

/** 单调时间弯曲（用于慢动作坡度，保持连续可复现） */
const timeWarp = (local, r0, r1, T) => r0 * local + ((r1 - r0) * local * local) / (2 * Math.max(0.001, T));

/** 确定性漂浮粒子云 */
function dustField(parent, o = {}) {
  const n = Math.max(60, Math.round((o.count ?? 420) * Q.particles));
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), aA = new Float32Array(n), aS = new Float32Array(n), aT = new Float32Array(n);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aA', new THREE.BufferAttribute(aA, 1));
  geo.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
  geo.setAttribute('aT', new THREE.BufferAttribute(aT, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 40);
  const mat = pointsMaterial({ color: o.color ?? 0x9fc8ff, hot: o.hot ?? 0xffffff, size: o.size ?? 16 });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.renderOrder = 6;
  parent.add(pts);
  return {
    points: pts, n, geo,
    update(t, fn) {
      for (let i = 0; i < n; i++) {
        const p = fn(i, t);
        pos[i * 3] = p[0]; pos[i * 3 + 1] = p[1]; pos[i * 3 + 2] = p[2];
        aA[i] = p[3]; aS[i] = p[4] ?? 1; aT[i] = p[5] ?? 0;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.aA.needsUpdate = true;
      geo.attributes.aS.needsUpdate = true;
      geo.attributes.aT.needsUpdate = true;
    },
  };
}

/* 片头：多层膜镜片阵列环绕 EUV 光核缓慢旋转                                    */
defineScene('title', (g) => {
  const cluster = new THREE.Group();
  g.add(cluster);
  const shards = [];
  const N = 15;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU * 3.1, r = lerp(1.5, 3.4, hash1(i)), y = lerp(-1.5, 1.5, hash2(i));
    const u = mirrorUnit(cluster, {
      w: lerp(0.5, 1.25, hash3(i)), h: lerp(0.4, 0.95, hash1(i + 9)),
      curve: lerp(0.12, 0.4, hash2(i + 4)), thick: 0.05, mount: false,
      pos: [Math.cos(a) * r, y, Math.sin(a) * r],
    });
    u.rotation.set(hash1(i + 2) * TAU, hash2(i + 3) * TAU, hash3(i + 5) * 0.9);
    shards.push({ g: u, sp: lerp(-0.22, 0.22, hash1(i + 7)), r, a });
  }
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.30, 4), plasmaMaterial({ scale: 5.5, seed: 3 }));
  g.add(core);
  const halo = billboard(glowSprite(g, [0, 0, 0], 4.2, 0x8f7bff, 2.2));
  const halo2 = billboard(glowSprite(g, [0, 0, 0], 1.5, 0xdfe8ff, 3.2));
  const dust = dustField(g, { count: 520, color: 0x8fb4ff, size: 13 });
  practicals(g, [
    { p: [4.5, 3.0, 5.5], c: 0xdfe8ff, i: 42, d: 26 },
    { p: [-5.0, -1.5, -3.5], c: 0xa48cff, i: 32, d: 26 },
    { p: [0, 4.5, -2.0], c: 0xbfd8ff, i: 14, d: 20 },
  ]);

  return (t, local, k) => {
    cluster.rotation.y = local * 0.075;
    cluster.rotation.x = Math.sin(local * 0.13) * 0.05;
    for (const s of shards) {
      s.g.rotation.y += 0;
      s.g.rotation.z = s.a + local * s.sp * 0.35;
      const br = 1 + 0.06 * Math.sin(local * 0.6 + s.r);
      s.g.position.set(Math.cos(s.a + local * s.sp * 0.1) * s.r * br, s.g.position.y, Math.sin(s.a + local * s.sp * 0.1) * s.r * br);
    }
    const ig = smoothstep(0.3, 4.2, local) * (0.55 + 0.45 * Math.sin(local * 2.1) * 0.5);
    core.material.uniforms.uInt.value = 0.55 + ig * 0.9 + pulse(local, 6.2, 0.12, 0.9) * 2.2;
    halo.material.uniforms.uInt.value = 0.22 + 0.3 * smoothstep(0, 5, local) + pulse(local, 6.2, 0.1, 1.3) * 0.85;
    halo2.material.uniforms.uInt.value = 0.5 + pulse(local, 6.2, 0.08, 0.7) * 1.6;
    dust.update(local, (i, tt) => {
      const a = hash1(i) * TAU + tt * (0.05 + hash2(i) * 0.05);
      const r = lerp(1.0, 5.2, hash2(i));
      const y = lerp(-2.4, 2.4, hash3(i)) + Math.sin(tt * 0.3 + i) * 0.06;
      return [Math.cos(a) * r, y, Math.sin(a) * r, 0.5 * smoothstep(0, 3, tt), 0.5 + hash1(i + 5) * 0.9, hash2(i + 3) * 0.4];
    });
  };
});

    });

});

  /* 可变形锡滴：顶点着色器实现压扁 + 边缘涟漪 */
  const dropMat = new THREE.MeshStandardMaterial({
    color: 0xdfe6ee, metalness: 1.0, roughness: 0.085, envMapIntensity: 2.4,
  });
  dropMat.onBeforeCompile = (sh) => {
    sh.uniforms.uSquash = dropMat.userData.uSquash = { value: 0 };
    sh.uniforms.uRipple = dropMat.userData.uRipple = { value: 0 };
    sh.uniforms.uTime = SHARED.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uSquash; uniform float uRipple; uniform float uTime;
        const float R0 = 0.10;                       // 液滴半径
        vec3 euvSquash(vec3 p){
          float sq = uSquash;
          float rn = length(p.yz) / R0;              // 归一化径向位置
          float rim = smoothstep(0.15, 1.0, rn);
          p.x *= 1.0 - 0.90 * sq;                    // 沿激光轴压缩
          p.yz *= 1.0 + 2.35 * sq;                   // 径向展开成盘
          p.x += sin(rn * 9.0 - uTime * 11.0) * 0.004 * uRipple * rim;
          p.yz *= 1.0 + sin(rn * 7.0 - uTime * 9.0) * 0.03 * uRipple * rim;
          return p;
        }`)
      .replace('#include <beginnormal_vertex>', `
        vec3 objectNormal = normalize(vec3(
          normal.x / max(0.10, 1.0 - 0.90 * uSquash),
          normal.y / (1.0 + 2.35 * uSquash),
          normal.z / (1.0 + 2.35 * uSquash)));`)
      .replace('#include <begin_vertex>', 'vec3 transformed = euvSquash(position);');
  };
  const drop = new THREE.Mesh(new THREE.SphereGeometry(0.10, 64, 48), dropMat);
  g.add(drop);

  /* 预脉冲激光（沿 +X 传播，压扁方向即激光轴向） */
  const pre = beamBetween(g, [-2.4, 0, 0], [-0.09, 0, 0], 0.028, 0.017,
    beamMaterial({ color: 0xff5a3c, hot: 0xffe0b0, flow: 3.4, intensity: 0, edge: 1.2 }));
  const hit = billboard(glowSprite(g, [-0.02, 0, 0], 0.85, 0xffb070, 2.6));
  const shock = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.012, 8, 48), beamMaterial({ color: 0xffc890, hot: 0xffffff, intensity: 0, flow: 0 }));
  shock.rotation.y = Math.PI / 2;
  g.add(shock);
  const debris = dustField(g, { count: 260, color: 0xdfe8f2, hot: 0xfff0d8, size: 10 });

  practicals(g, [
    { p: [0.55, 0.45, 0.75], c: 0xd8e8ff, i: 2.2, d: 2.6 },
    { p: [-0.45, -0.30, -0.60], c: 0xffb890, i: 1.4, d: 2.4 },
  ]);
  label3d(g, [-0.55, 0.20, 0], { cn: '预脉冲激光', en: 'PRE-PULSE (CO₂)', t0: 42.6, t1: 49.0, side: 'left', tone: 'ir' });
  label3d(g, [0.02, -0.26, 0], { cn: '压扁成圆盘', en: 'FLATTENED DISC', t0: 47.6, t1: 56.6, side: 'right' });
  label3d(g, [0.30, 0.20, 0], { cn: '受照面积增大 → 吸收更充分', en: 'LARGER AREA → BETTER ABSORPTION', t0: 49.6, t1: 56.6, side: 'right' });

  return (t, local, k) => {
    const s = smoothstep(3.0, 4.9, local);
    if (dropMat.userData.uSquash) dropMat.userData.uSquash.value = s;
    if (dropMat.userData.uRipple) dropMat.userData.uRipple.value = pulse(local, 3.0, 0.35, 4.2);
    drop.rotation.x = local * 0.12;
    pre.material.uniforms.uInt.value = pulse(local, 2.55, 0.28, 1.5) * 1.5 + 0.04 * smoothstep(1.5, 2.5, local);
    pre.material.uniforms.uPulse.value = ((local - 2.4) * 2.4) % 1.3;
    hit.material.uniforms.uInt.value = pulse(local, 2.95, 0.10, 1.1) * 1.7;
    const sp = smoothstep(2.95, 5.4, local);
    shock.scale.setScalar(0.6 + sp * 5.0);
    shock.material.uniforms.uInt.value = (1 - sp) * 0.9 * smoothstep(2.9, 3.1, local);
    debris.update(local, (i, tt) => {
      const a = hash1(i) * TAU, e = (hash2(i) - 0.5) * 0.7;
      const sp2 = 0.10 + hash3(i) * 0.42;
      const tt2 = Math.max(0, tt - 3.0);
      const r = tt2 * sp2;
      return [Math.cos(e) * 0.02 * Math.sign(e) - r * 0.05, Math.cos(a) * r, Math.sin(a) * r,
        clamp01(1 - r * 1.4) * smoothstep(3.0, 3.2, tt) * 0.5, 0.35 + hash1(i) * 0.5, 0.55];
    });
  };
});

/* ③ 主脉冲：圆盘被汽化电离，等离子体点燃                                        */
defineScene('mainpulse', (g) => {
  /* 圆盘（承接上一场的形态） */
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.019, 64), MAT.tinHot);
  disc.rotation.z = Math.PI / 2;
  g.add(disc);
  const main = beamBetween(g, [-2.6, 0, 0], [-0.10, 0, 0], 0.085, 0.055,
    beamMaterial({ color: 0xff4a2a, hot: 0xfff0d0, flow: 4.0, intensity: 0, edge: 1.1 }));
  const plasma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16, 5), plasmaMaterial({ scale: 7.5, seed: 17 }));
  g.add(plasma);
  const plasmaOuter = new THREE.Mesh(new THREE.IcosahedronGeometry(0.30, 4), plasmaMaterial({ scale: 4.2, seed: 41 }));
  g.add(plasmaOuter);
  const flare = billboard(glowSprite(g, [0, 0, 0], 1.05, 0xfff2e0, 3.0));
  const flare2 = billboard(glowSprite(g, [0, 0, 0], 0.42, 0xffffff, 3.8));
  const debris = dustField(g, { count: 420, color: 0xffd0a0, hot: 0xffffff, size: 12 });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), beamMaterial({ color: 0xffb070, hot: 0xffffff, intensity: 0, flow: 0, edge: 2.4 }));
  g.add(shell);

  label3d(g, [-0.72, 0.28, 0], { cn: '主脉冲激光', en: 'MAIN PULSE (CO₂)', t0: 57.4, t1: 62.4, side: 'left', tone: 'ir' });
  label3d(g, [0.26, 0.24, 0], { cn: '锡等离子体 ≈ 220,000 °C', en: 'TIN PLASMA ≈ 220,000 °C', t0: 61.0, t1: 70.8, side: 'right', tone: 'warm' });
  label3d(g, [-0.05, -0.34, 0], { cn: '锡碎屑（需氢气防护）', en: 'Sn DEBRIS', t0: 64.6, t1: 70.8, side: 'left' });

  return (t, local, k) => {
    const ign = smoothstep(2.4, 2.62, local);
    disc.visible = local < 3.0;
    disc.scale.setScalar(1 + smoothstep(2.4, 3.0, local) * 0.6);
    disc.material.emissiveIntensity = 0.35 + smoothstep(2.0, 2.5, local) * 6;
    main.material.uniforms.uInt.value = pulse(local, 2.0, 0.30, 1.9) * 2.1 + 0.05;
    main.material.uniforms.uPulse.value = ((local - 1.9) * 2.8) % 1.25;
    const grow = smoothstep(2.42, 3.4, local);
    plasma.scale.setScalar(0.35 + grow * 0.85 + Math.sin(local * 9) * 0.02 * ign);
    plasma.material.uniforms.uInt.value = ign * (0.44 + 0.10 * Math.sin(local * 11));
    plasmaOuter.scale.setScalar(0.5 + grow * 1.15);
    plasmaOuter.material.uniforms.uInt.value = ign * 0.10;
    flare.material.uniforms.uInt.value = pulse(local, 2.42, 0.06, 1.6) * 0.75 + ign * 0.07;
    flare2.material.uniforms.uInt.value = pulse(local, 2.42, 0.04, 0.9) * 1.0 + ign * 0.14;
    const sh = smoothstep(2.42, 6.0, local);
    shell.scale.setScalar(0.2 + sh * 3.2);
    shell.material.uniforms.uInt.value = (1 - sh) * 0.22 * ign;
    debris.update(local, (i, tt) => {
      const a = hash1(i) * TAU, b = (hash2(i) - 0.5) * Math.PI * 0.85;
      const sp = 0.16 + hash3(i) * 0.75;
      const tt2 = Math.max(0, tt - 2.45);
      const r = tt2 * sp;
      return [Math.sin(b) * r * 0.55, Math.cos(a) * Math.cos(b) * r, Math.sin(a) * Math.cos(b) * r,
        clamp01(1 - r * 0.55) * ign * 0.65, 0.35 + hash1(i + 2) * 0.7, 0.75];
    });
  };
});

/* ④ 等离子体辐射 13.5 nm（不可见光的艺术化可视化）                              */
defineScene('euv', (g) => {
  const plasma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.15, 5), plasmaMaterial({ scale: 7.5, seed: 17 }));
  g.add(plasma);
  const flare = billboard(glowSprite(g, [0, 0, 0], 0.85, 0xd8ccff, 2.8));
  practicals(g, [
    { p: [0.9, 0.7, 1.1], c: 0xcfe0ff, i: 2.6, d: 3.2 },
    { p: [-0.8, -0.5, -0.9], c: 0xa48cff, i: 1.8, d: 3.0 },
  ]);

  /* 各向同性 EUV 射线 */
  const rays = [];
  const nR = Math.max(24, Math.round(Q.rays * 0.85));
  for (let i = 0; i < nR; i++) {
    const a = hash1(i) * TAU, b = Math.acos(1 - 2 * hash2(i));
    const d = [Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)];
    const L = lerp(1.1, 2.0, hash3(i));
    rays.push([[d[0] * 0.12, d[1] * 0.12, d[2] * 0.12], [d[0] * L, d[1] * L, d[2] * L]]);
  }
  const euvMat = rayMaterial({ color: 0x8f7bff, hot: 0xe6f2ff, speed: 1.35, count: 1.6, width: 0.5, intensity: 0 });
  rayBundle(g, rays, euvMat, 0.0055);

  /* 带外辐射 / 红外（较暗的琥珀色） */
  const oob = [];
  for (let i = 0; i < Math.max(10, Math.round(nR * 0.35)); i++) {
    const a = hash1(i + 90) * TAU, b = Math.acos(1 - 2 * hash2(i + 90));
    const d = [Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)];
    const L = lerp(0.8, 1.5, hash3(i + 90));
    oob.push([[d[0] * 0.12, d[1] * 0.12, d[2] * 0.12], [d[0] * L, d[1] * L, d[2] * L]]);
  }
  const oobMat = rayMaterial({ color: 0xff8a3c, hot: 0xffd0a0, speed: 0.8, count: 1.2, width: 0.6, intensity: 0 });
  rayBundle(g, oob, oobMat, 0.004);

  /* 扩张波前（辐射的球面示意） */
  const shells = [];
  for (let i = 0; i < 3; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), beamMaterial({ color: 0x9f8cff, hot: 0xe8f0ff, intensity: 0, flow: 0, edge: 3.0 }));
    g.add(m);
    shells.push(m);
  }
  label3d(g, [0.62, 0.42, 0], { cn: 'EUV 13.5 nm（不可见 · 示意着色）', en: 'EUV 13.5 nm — INVISIBLE, COLOURISED', t0: 71.6, t1: 84.6, side: 'right' });
  label3d(g, [-0.52, -0.44, 0], { cn: '带外辐射与红外', en: 'OUT-OF-BAND & IR', t0: 81.6, t1: 84.6, side: 'left', tone: 'ir' });

  return (t, local, k) => {
    plasma.scale.setScalar(1.05 + Math.sin(local * 7) * 0.035);
    plasma.material.uniforms.uInt.value = 0.95 + 0.18 * Math.sin(local * 10);
    flare.material.uniforms.uInt.value = 0.34 + 0.08 * Math.sin(local * 6);
    euvMat.uniforms.uInt.value = smoothstep(0.2, 1.6, local) * 1.15;
    euvMat.uniforms.uReveal.value = smoothstep(0.3, 3.0, local);
    oobMat.uniforms.uInt.value = smoothstep(9.6, 11.2, local) * 0.85;
    oobMat.uniforms.uReveal.value = smoothstep(9.6, 11.6, local);
    shells.forEach((m, i) => {
      const ph = ((local * 0.55 + i * 0.34) % 1);
      m.scale.setScalar(0.2 + ph * 2.4);
      m.material.uniforms.uInt.value = (1 - ph) * 0.30 * smoothstep(0.4, 1.6, local);
    });
  };
});

/* =============================================================================
   45 · SCENES B  ·  ⑤多层膜集光镜→中间焦点 / ⑥光谱纯化与碎屑防护 / ⑦照明光学

/* ⑤ 椭球集光镜：等离子体在第一焦点，光线精确汇聚于第二焦点（中间焦点）          */
defineScene('collector', (g) => {
  vesselWall(g, { r: 2.1, len: 5.4, aStart: 0.4, aLen: TAU * 0.68 });
  const col = collectorMirror(g, { a: 1.70, c: 1.35, xFrom: -1.70, xTo: -0.90, hole: 0.15 });
  const IF = col.F2;                                  // [2c, 0, 0]

  /* 等离子体（第一焦点） */
  const plasma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.085, 4), plasmaMaterial({ scale: 8, seed: 17 }));
  g.add(plasma);
  const pFlare = billboard(glowSprite(g, [0, 0, 0], 1.15, 0xd8ccff, 2.6));

  /* CO₂ 驱动激光：穿过集光镜中心通孔射向锡滴 */
  const drive = beamBetween(g, [-2.9, 0, 0], [-0.06, 0, 0], 0.055, 0.028,
    beamMaterial({ color: 0xff4a2a, hot: 0xffd9a0, flow: 3.0, intensity: 0, edge: 1.2 }));

  /* 精确光路：F1 → 镜面 → F2 */
  const paths = collectorRayPaths(col, Math.max(28, Q.rays));
  const rayMat = rayMaterial({ color: 0x8f7bff, hot: 0xeaf4ff, speed: 0.85, count: 1.25, width: 0.34, intensity: 0 });
  rayBundle(g, paths, rayMat, 0.005, { seg: 26 });

  /* 中间焦点：光阑 + 亮斑 */
  aperturePlate(g, { pos: IF, rOut: 0.42, rIn: 0.045, th: 0.03 });
  const ifGlow = billboard(glowSprite(g, IF, 0.95, 0xbfd8ff, 3.0));
  const ifCore = billboard(glowSprite(g, IF, 0.28, 0xffffff, 3.6));
  /* 通过中间焦点后进入扫描机的发散光锥 */
  const outCone = beamBetween(g, IF, [IF[0] + 1.5, 0, 0], 0.03, 0.30,
    beamMaterial({ color: 0x8f7bff, hot: 0xdfe8ff, flow: 0.9, intensity: 0, edge: 1.6 }));

  label3d(g, [-0.30, 1.02, 0], { cn: 'Mo/Si 多层膜集光镜', en: 'Mo/Si MULTILAYER COLLECTOR', t0: 85.6, t1: 96.5, side: 'left' });
  label3d(g, [0.02, -0.34, 0], { cn: '第一焦点 · 等离子体', en: 'FOCUS 1 · PLASMA', t0: 88.0, t1: 99.0, side: 'left' });
  label3d(g, [IF[0], 0.46, 0], { cn: '第二焦点 · 中间焦点 IF', en: 'FOCUS 2 · INTERMEDIATE FOCUS', t0: 96.6, t1: 101.8, side: 'right' });
  label3d(g, [-1.15, -0.30, 0], { cn: 'CO₂ 激光经中心孔入射', en: 'DRIVE LASER THROUGH CENTRAL APERTURE', t0: 92.4, t1: 101.0, side: 'left', tone: 'ir' });

  const dust = dustField(g, { count: 240, color: 0x9f8cff, size: 9 });
  practicals(g, [
    { p: [1.9, 1.5, 2.6], c: 0xdfe8ff, i: 22, d: 12 },
    { p: [-1.2, -1.0, -1.8], c: 0xa48cff, i: 14, d: 12 },
    { p: [2.9, 0.4, 0.9], c: 0xbfd8ff, i: 8, d: 6 },
  ]);

  return (t, local, k) => {
    plasma.scale.setScalar(1 + Math.sin(local * 9) * 0.05);
    plasma.material.uniforms.uInt.value = 1.5 + 0.3 * Math.sin(local * 12);
    pFlare.material.uniforms.uInt.value = 0.42 + 0.1 * Math.sin(local * 7);
    drive.material.uniforms.uInt.value = 0.10 + 0.5 * (0.5 + 0.5 * Math.sin(local * 5.5));
    drive.material.uniforms.uPulse.value = (local * 1.7) % 1.4;
    rayMat.uniforms.uInt.value = smoothstep(0.4, 2.4, local) * 1.0;
    rayMat.uniforms.uReveal.value = smoothstep(0.6, 5.0, local);
    const focused = smoothstep(9.5, 12.0, local);
    ifGlow.material.uniforms.uInt.value = focused * (0.7 + 0.15 * Math.sin(local * 8));
    ifCore.material.uniforms.uInt.value = focused * 1.9;
    outCone.material.uniforms.uInt.value = smoothstep(12.5, 15.5, local) * 0.55;
    outCone.material.uniforms.uPulse.value = (local * 0.7) % 1.5;
    dust.update(local, (i, tt) => {
      const a = hash1(i) * TAU, r = lerp(0.2, 1.1, hash2(i));
      const x = lerp(-0.4, 2.6, (hash3(i) + tt * 0.03) % 1);
      const conv = 1 - smoothstep(0.0, 2.6, x) * 0.85;
      return [x, Math.cos(a) * r * conv, Math.sin(a) * r * conv, 0.22, 0.4 + hash1(i) * 0.5, 0.2];
    });
  };
});

/* ⑥ 光谱纯化与锡碎屑防护：氢气流 + 滤片，只让 13.5 nm 通过中间焦点              */
defineScene('purity', (g) => {
  vesselWall(g, { r: 1.5, len: 5.0, aStart: 0.5, aLen: TAU * 0.66 });
  const IF = [2.7, 0, 0];

  /* 收敛光锥（来自集光镜）→ 中间焦点 → 发散进入照明系统 */
  const inMat = beamMaterial({ color: 0x8f7bff, hot: 0xe8f0ff, flow: 1.1, intensity: 0.7, edge: 1.5 });
  beamBetween(g, [1.05, 0, 0], IF, 0.34, 0.03, inMat);
  const outMat = beamMaterial({ color: 0x8f7bff, hot: 0xe8f0ff, flow: 1.1, intensity: 0.6, edge: 1.5 });
  beamBetween(g, IF, [IF[0] + 1.45, 0, 0], 0.03, 0.26, outMat);

  /* 中间焦点光阑 + 光谱纯化滤片 */
  aperturePlate(g, { pos: IF, rOut: 0.44, rIn: 0.042, th: 0.03 });
  spectralFilter(g, { pos: [2.05, 0, 0], r: 0.26 });
  const ifCore = billboard(glowSprite(g, IF, 0.3, 0xffffff, 3.4));
  const ifGlow = billboard(glowSprite(g, IF, 0.9, 0xbfd8ff, 2.8));

  /* 带外辐射 / 红外：被滤片挡住（射线在滤片处终止） */
  const oobPaths = [];
  for (let i = 0; i < Math.max(12, Math.round(Q.rays * 0.4)); i++) {
    const a = hash1(i + 3) * TAU, r = lerp(0.04, 0.24, hash2(i + 3));
    oobPaths.push([[1.05, Math.cos(a) * 0.32, Math.sin(a) * 0.32], [2.02, Math.cos(a) * r, Math.sin(a) * r]]);
  }
  const oobMat = rayMaterial({ color: 0xff8a3c, hot: 0xffd0a0, speed: 0.7, count: 1.1, width: 0.5, intensity: 0 });
  rayBundle(g, oobPaths, oobMat, 0.0042);
  const absorbGlow = billboard(glowSprite(g, [2.05, 0, 0], 0.6, 0xff9a4c, 2.8));

  /* 氢气流：多股由喷嘴逆流吹向光源侧（动态气锁） */
  const h2 = [];

    const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.16, 12), MAT.steel);

      [2.36, Math.cos(a) * 0.48, Math.sin(a) * 0.48],
      [0.75, Math.cos(a) * 0.30, Math.sin(a) * 0.30],
      0.05, 0.16, wispMaterial({ color: 0x6ff0d0, intensity: 0, speed: 1.1, scale: 2.4, dir: [-1, 0, 0] }));
    h2.push(m);
  }

  /* 锡碎屑：自光源侧飞来，被气流阻挡并带走 */
  const debris = dustField(g, { count: 320, color: 0xcfd8e3, hot: 0xffd0a0, size: 11 });

  practicals(g, [
    { p: [2.6, 1.2, 2.0], c: 0xdfe8ff, i: 16, d: 10 },
    { p: [1.2, -0.9, -1.4], c: 0x6ff0d0, i: 9, d: 10 },
    { p: [3.4, 0.3, 0.8], c: 0xbfd8ff, i: 6, d: 6 },
  ]);
  label3d(g, [2.45, 0.62, 0], { cn: '氢气流 · 碎屑防护', en: 'H₂ FLOW · DEBRIS MITIGATION', t0: 102.6, t1: 110.0, side: 'right', tone: 'h2' });
  label3d(g, [2.05, -0.42, 0], { cn: '光谱纯化滤片', en: 'SPECTRAL PURITY FILTER', t0: 107.8, t1: 114.7, side: 'left' });
  label3d(g, [IF[0], 0.40, 0], { cn: '中间焦点 IF', en: 'INTERMEDIATE FOCUS', t0: 104.2, t1: 114.7, side: 'right' });
  label3d(g, [1.35, -0.34, 0], { cn: '红外与带外辐射被吸收', en: 'IR / OUT-OF-BAND ABSORBED', t0: 109.4, t1: 114.7, side: 'left', tone: 'ir' });

  return (t, local, k) => {
    inMat.uniforms.uPulse.value = (local * 0.8) % 1.5;
    outMat.uniforms.uPulse.value = ((local * 0.8) % 1.5);
    ifCore.material.uniforms.uInt.value = 1.7 + 0.2 * Math.sin(local * 9);
    ifGlow.material.uniforms.uInt.value = 0.6;
    const gas = smoothstep(0.4, 2.6, local);
    for (const m of h2) m.material.uniforms.uInt.value = gas * 0.55;
    oobMat.uniforms.uInt.value = smoothstep(6.0, 7.6, local) * 0.9;
    oobMat.uniforms.uReveal.value = smoothstep(6.0, 8.2, local);
    absorbGlow.material.uniforms.uInt.value = smoothstep(6.6, 8.0, local) * (0.35 + 0.12 * Math.sin(local * 14));
    debris.update(local, (i, tt) => {
      const a = hash1(i) * TAU;
      const seed = hash2(i);
      const cyc = 3.2;
      const ph = ((tt * (0.32 + seed * 0.3) + seed * cyc) % cyc) / cyc;      // 0..1
      const xStart = 0.55, xTurn = lerp(1.35, 2.05, hash3(i));
      /* 前半程向 +X 飞行，被氢气流顶回并侧向带走 */
      let x, rr, alpha;
      if (ph < 0.55) {
        const p = ph / 0.55;
        x = lerp(xStart, xTurn, p);
        rr = lerp(0.10, 0.30, p) + 0.02 * Math.sin(tt * 3 + i);
        alpha = 0.5 * (1 - p * 0.2);
      } else {
        const p = (ph - 0.55) / 0.45;
        x = lerp(xTurn, xStart - 0.4, p);
        rr = lerp(0.30, 0.62, p);
        alpha = 0.5 * (1 - p);
      }
      return [x, Math.cos(a) * rr, Math.sin(a) * rr, alpha * gas, 0.35 + seed * 0.5, 0.25];
    });
  };
});

/* ⑦ 照明光学：视场面镜 + 光瞳面镜，把光整形为均匀弧形光场                      */
defineScene('illuminator', (g) => {
  const IF = [-1.55, 0, 0];
  const FF = [0.10, 0.42, 0];        // field facet mirror
  const PF = [1.30, -0.34, 0];       // pupil facet mirror
  const RET = [2.42, 0.46, 0];       // reticle plane

  /* 入射光锥 */
  const inMat = beamMaterial({ color: 0x8f7bff, hot: 0xe8f0ff, flow: 1.0, intensity: 0, edge: 1.5 });
  beamBetween(g, IF, [FF[0] - 0.06, FF[1] - 0.02, 0], 0.03, 0.34, inMat);
  aperturePlate(g, { pos: IF, rOut: 0.30, rIn: 0.04, th: 0.025 });
  const ifCore = billboard(glowSprite(g, IF, 0.26, 0xffffff, 3.4));

  /* 两组面镜阵列 */
  const ff = facetArray(g, { nx: Q.facets, ny: Q.facets, size: 0.062, gap: 0.010, curve: 0.35, pos: FF, rot: [0.15, -1.02, 0] });
  const pf = facetArray(g, { nx: Math.max(6, Q.facets - 2), ny: Math.max(6, Q.facets - 2), size: 0.055, gap: 0.010, curve: 0.30, pos: PF, rot: [-0.28, 1.12, 0], warm: true });

  /* 掩模平面上的弧形照明光场（ring field） */
  const arcR = 0.62, arcHalf = 0.46, arcW = 0.075;
  const arcGeo = new THREE.RingGeometry(arcR - arcW / 2, arcR + arcW / 2, 64, 1, -arcHalf, arcHalf * 2);
  const arcMat = beamMaterial({ color: 0xbfd0ff, hot: 0xffffff, intensity: 0, flow: 0.6, edge: 0.6 });
  const arc = new THREE.Mesh(arcGeo, arcMat);
  arc.position.set(RET[0], RET[1], 0);
  arc.rotation.set(0, -Math.PI / 2, Math.PI / 2);
  arc.renderOrder = 8;
  g.add(arc);
  /* 掩模平面示意板 */
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.35, 1.35), MAT.substrate);
  plate.position.set(RET[0] + 0.05, RET[1], 0);
  g.add(plate);
  const plateMl = new THREE.Mesh(new THREE.BoxGeometry(0.008, 1.24, 1.24), MAT.multilayer);
  plateMl.position.set(RET[0] + 0.032, RET[1], 0);
  g.add(plateMl);

  /* 细束：IF → 视场面镜 → 光瞳面镜 → 弧形光场 */
  const nB = Math.max(10, Math.round(Q.facets * 2.4));
  const ffC = ff.userData.centers, pfC = pf.userData.centers;
  const toWorld = (grp, p) => {
    const v = new THREE.Vector3(p[0], p[1], p[2]);
    grp.updateMatrixWorld(true);
    return v.applyMatrix4(grp.matrix).toArray();
  };
  const paths = [];
  for (let i = 0; i < nB; i++) {
    const f = ffC[Math.floor(hash1(i) * ffC.length)];
    const p = pfC[Math.floor(hash2(i) * pfC.length)];
    const ang = lerp(-arcHalf, arcHalf, hash3(i));
    const target = [RET[0] + 0.03, RET[1] + Math.cos(ang + Math.PI / 2) * arcR, Math.sin(ang + Math.PI / 2) * arcR];
    paths.push([IF, toWorld(ff, f), toWorld(pf, p), target]);
  }
  const bMat = rayMaterial({ color: 0x9f8cff, hot: 0xeaf2ff, speed: 1.0, count: 1.15, width: 0.30, intensity: 0 });
  rayBundle(g, paths, bMat, 0.0042, { seg: 40 });

  practicals(g, [
    { p: [0.4, 1.6, 2.6], c: 0xe8f0ff, i: 22, d: 12 },
    { p: [2.2, -1.0, -1.4], c: 0xa48cff, i: 14, d: 12 },
    { p: [-1.2, 0.5, 1.4], c: 0xbfd8ff, i: 8, d: 8 },
  ]);
  label3d(g, [FF[0], FF[1] + 0.55, 0], { cn: '视场面镜阵列', en: 'FIELD FACET MIRROR', t0: 115.6, t1: 124.0, side: 'left' });
  label3d(g, [PF[0], PF[1] - 0.5, 0], { cn: '光瞳面镜阵列', en: 'PUPIL FACET MIRROR', t0: 117.6, t1: 126.0, side: 'right' });
  label3d(g, [RET[0], RET[1] + 0.78, 0], { cn: '弧形均匀照明光场', en: 'UNIFORM ARC (RING) FIELD', t0: 121.4, t1: 128.7, side: 'right' });
  label3d(g, [IF[0], -0.42, 0], { cn: '来自中间焦点', en: 'FROM INTERMEDIATE FOCUS', t0: 115.6, t1: 120.5, side: 'left' });

  return (t, local, k) => {
    inMat.uniforms.uInt.value = smoothstep(0.2, 1.4, local) * 0.65;
    inMat.uniforms.uPulse.value = (local * 0.85) % 1.4;
    ifCore.material.uniforms.uInt.value = 1.5;
    bMat.uniforms.uInt.value = smoothstep(1.4, 3.4, local) * 1.0;
    bMat.uniforms.uReveal.value = smoothstep(1.6, 6.0, local);
    arcMat.uniforms.uInt.value = smoothstep(5.2, 8.0, local) * (0.75 + 0.06 * Math.sin(local * 5));
    /* 面镜微动（照明方式切换示意） */
    const sw = smoothstep(10.4, 12.4, local);
    ff.rotation.z = Math.sin(local * 0.7) * 0.015 + sw * 0.05;
    pf.rotation.z = -Math.sin(local * 0.6) * 0.015 - sw * 0.06;
  };
});

defineScene('reticle', (g) => {
  const MASK = [0, 0.5, 0];
  const inc = 6 * D2R;                                   // 真实入射角
  const dIn = [Math.sin(inc), Math.cos(inc), 0];
  const dOut = [Math.sin(inc), -Math.cos(inc), 0];

  /* 掩模（图形面朝下，与真实扫描机一致：夹具在上） */
  const ret = reticleAssembly(g, { pos: MASK, w: 1.15, h: 1.15 });
  ret.rotation.x = Math.PI;
  precisionStage(g, { pos: [MASK[0], MASK[1] + 0.30, 0], w: 1.7, d: 1.4 });

  /* 吸收层图形（近景可见的立体线条） */
  const absLines = new THREE.InstancedMesh(new THREE.BoxGeometry(0.012, 0.010, 0.30), MAT.absorber, 46);
  let k = 0;
  for (let i = 0; i < 46; i++) {
    const x = -0.28 + (i / 45) * 0.56;
    _obj.position.set(x, MASK[1] - 0.012, lerp(-0.16, 0.16, hash1(i)));
    _obj.scale.set(1, 1, lerp(0.5, 1.2, hash2(i)));

  absLines.instanceMatrix.needsUpdate = true;

  /* 入射与反射光束（严格 6°） */
  const A = [MASK[0] - dIn[0] * 2.3, MASK[1] - dIn[1] * 2.3, 0];

  const inMat = beamMaterial({ color: 0x8f7bff, hot: 0xe8f0ff, flow: 1.2, intensity: 0, edge: 1.5 });
  beamBetween(g, A, MASK, 0.115, 0.075, inMat);
  const outMat = beamMaterial({ color: 0xbfd0ff, hot: 0xffffff, flow: 1.2, intensity: 0, edge: 1.5 });
  beamBetween(g, MASK, B, 0.075, 0.10, outMat);

  label3d(g, [MASK[0] + 0.10, MASK[1] - 0.62, 0], { cn: '入射角 ≈ 6°', en: 'INCIDENCE ≈ 6°', t0: 133.4, t1: 141.8, side: 'right' });
  label3d(g, [MASK[0] - 1.0, MASK[1] - 1.6, 0], { cn: '照明光（来自照明系统）', en: 'ILLUMINATION IN', t0: 129.6, t1: 136.0, side: 'left' });
  label3d(g, [MASK[0] + 1.0, MASK[1] - 1.7, 0], { cn: '携带图形的反射光 → 投影物镜', en: 'PATTERNED REFLECTION → PROJECTION OPTICS', t0: 136.4, t1: 141.8, side: 'right' });

    ret.position.x = MASK[0] + scan;
    absLines.position.x = scan;
  };
});

  ];
  const V = P.map((p) => new THREE.Vector3(...p));

  pobHousing(g, { pos: [0, -0.05, 0], h: 2.5, r: 0.92 });

  }

  /* 掩模与晶圆（同步反向扫描，速度比 4:1） */

  mask.position.set(0.06, 1.20, 0);
  g.add(mask);
  const maskPat = new THREE.Mesh(new THREE.PlaneGeometry(0.74, 0.58), new THREE.MeshStandardMaterial({
    color: 0x0b0e14, metalness: 0.5, roughness: 0.45, map: MAT.circuitTex,
  }));
  maskPat.rotation.x = Math.PI / 2;
  maskPat.position.set(0.06, 1.184, 0);
  g.add(maskPat);

  const wafer = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.02, 48), MAT.silicon);
  wafer.position.set(0, -1.27, 0);
  g.add(wafer);
  const field = new THREE.Mesh(new THREE.PlaneGeometry(0.185, 0.145), new THREE.MeshStandardMaterial({
    color: 0x9fc0e0, metalness: 0.7, roughness: 0.25, map: MAT.circuitTex, emissive: 0x2b6ea0, emissiveIntensity: 0.5,
  }));
  field.rotation.x = -Math.PI / 2;
  field.position.set(0, -1.258, 0);
  g.add(field);

  /* 4:1 比例示意：掩模上的特征与晶圆上的像 */
  const featM = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.12), glowMaterial(0xffd08a, 1.6));
  featM.rotation.x = Math.PI / 2;
  featM.position.set(0.06, 1.176, 0.30);
  g.add(featM);
  const featW = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 0.03), glowMaterial(0x9fe0ff, 1.6));
  featW.rotation.x = -Math.PI / 2;
  featW.position.set(0, -1.252, 0.075);
  g.add(featW);

    { p: [-1.8, -0.5, -2.0], c: 0xa48cff, i: 24, d: 14 },
    { p: [0.6, 1.4, 0.9], c: 0xcfe0ff, i: 16, d: 9 },
    { p: [-0.2, -1.3, 0.8], c: 0x9fd8ff, i: 13, d: 7 },
  ]);
  label3d(g, [0.06, 1.42, 0], { cn: '掩模台 → 扫描速度 4v', en: 'RETICLE STAGE · 4v', t0: 153.8, t1: 158.8, side: 'right' });
  label3d(g, [0, -1.52, 0], { cn: '晶圆台 → 反向 v（4:1）', en: 'WAFER STAGE · v (4:1)', t0: 153.8, t1: 158.8, side: 'left' });
  label3d(g, [0.42, 0.16, 0], { cn: '光阑（数值孔径 NA 0.33）', en: 'APERTURE STOP · NA 0.33', t0: 149.6, t1: 156.0, side: 'right' });
  label3d(g, [-0.9, -1.0, 0], { cn: '全反射式：无任何透镜', en: 'ALL-REFLECTIVE · NO LENSES', t0: 143.4, t1: 149.0, side: 'left' });

  return (t, local, k) => {
    const on = smoothstep(0.4, 2.2, local);
    segMats.forEach((m, i) => {
      m.uniforms.uInt.value = on * 0.62;
      m.uniforms.uPulse.value = ((local * 0.55 - i * 0.11) % 1.35);
    });
    /* 同步反向扫描：严格 4:1 */
    const scanOn = smoothstep(10.4, 11.6, local);
    const ph = (local * 0.32) % 1;
    const s = ph < 0.8 ? lerp(-1, 1, ph / 0.8) : lerp(1, -1, (ph - 0.8) / 0.2);
    const amp = 0.20 * scanOn;
    mask.position.x = 0.06 + s * amp;
    maskPat.position.x = 0.06 + s * amp;
    featM.position.x = 0.06 + s * amp;
    wafer.position.x = -s * amp * 0.25;
    field.position.x = -s * amp * 0.25;
    featW.position.x = -s * amp * 0.25;
    featM.material.uniforms.uInt.value = smoothstep(6.0, 7.4, local) * 0.9;
    featW.material.uniforms.uInt.value = smoothstep(6.6, 8.0, local) * 1.1;
    field.material.emissiveIntensity = 0.35 + 0.4 * on;
    stop.material.emissiveIntensity = 0;
  };
});
