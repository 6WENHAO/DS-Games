/* ⑩ 光刻胶曝光 → 潜影 → 显影 → 芯片                                           */
defineScene('resist', (g) => {
  /* --- 近景：硅片 + 光刻胶层 --- */
  const micro = new THREE.Group();
  g.add(micro);
  const W = 1.55, D = 0.95;
  const si = new THREE.Mesh(new THREE.BoxGeometry(W, 0.10, D), MAT.silicon);
  si.position.y = -0.06;
  micro.add(si);
  const resistSlab = new THREE.Mesh(new THREE.BoxGeometry(W, 0.035, D), MAT.resist);
  resistSlab.position.y = 0.0075;
  micro.add(resistSlab);

  /* 潜影：受曝光区域在胶层内部显现（wipe 由光缝位置驱动） */
  const latentMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: SHARED.time, uExpo: SHARED.expo, uWipe: { value: -1 }, uInt: { value: 0 },
      uMap: { value: MAT.circuitTex }, uColor: { value: new THREE.Color(0x7fd8ff) },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      ${FX_TONE_GLSL}
      uniform sampler2D uMap; uniform float uWipe, uInt, uTime; uniform vec3 uColor;
      varying vec2 vUv;
      void main(){
        if (uInt <= 0.001) discard;
        float pat = texture2D(uMap, vUv * 2.2).r;
        float rev = smoothstep(uWipe + 0.05, uWipe - 0.02, vUv.x);
        float a = pat * rev * uInt;
        float shimmer = 0.85 + 0.15 * sin(uTime * 3.0 + vUv.x * 40.0);
        gl_FragColor = fxOut(uColor * a * 1.6 * shimmer, a * 0.9);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const latent = new THREE.Mesh(new THREE.PlaneGeometry(W * 0.96, D * 0.94), latentMat);
  latent.rotation.x = -Math.PI / 2;
  latent.position.y = 0.012;
  micro.add(latent);

  /* 曝光光缝（弧形）+ 入射光锥 */
  const slitMat = beamMaterial({ color: 0xcfe0ff, hot: 0xffffff, intensity: 0, flow: 0.5, edge: 0.7 });
  const slit = new THREE.Mesh(new THREE.RingGeometry(0.52, 0.60, 48, 1, 1.05, 1.04), slitMat);
  slit.rotation.x = -Math.PI / 2;
  slit.position.y = 0.028;
  micro.add(slit);
  const cone = beamBetween(micro, [0, 1.25, 0], [0, 0.04, 0], 0.30, 0.075,
    beamMaterial({ color: 0xbfd0ff, hot: 0xffffff, flow: 1.6, intensity: 0, edge: 1.3 }));
  const photons = dustField(micro, { count: 460, color: 0xbfd8ff, hot: 0xffffff, size: 10 });

  /* 显影后的三维胶图形 */
  const nL = 58;
  const lines = new THREE.InstancedMesh(new THREE.BoxGeometry(W / (nL * 2.1), 0.055, D * 0.86), MAT.resistExposed, nL);
  lines.position.y = 0.0;
  micro.add(lines);

  /* --- 远景：整片晶圆 + 芯片 --- */
  const macro = new THREE.Group();
  macro.visible = false;
  g.add(macro);
  const waf = waferAssembly(macro, { pos: [0, 0, 0], r: 1.0 });
  precisionStage(macro, { pos: [0, -0.16, 0], w: 2.6, d: 2.2 });
  const chip = new THREE.Group();
  chip.position.set(0, 0.55, 0);
  macro.add(chip);
  const pkg = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.07, 0.62), MAT.dark);
  chip.add(pkg);
  const die = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.42), new THREE.MeshStandardMaterial({
    color: 0x8fb0cc, metalness: 0.85, roughness: 0.18, map: MAT.circuitTex, emissive: 0x1d5f8f, emissiveIntensity: 0.35,
  }));
  die.rotation.x = -Math.PI / 2;
  die.position.y = 0.037;
  chip.add(die);
  for (let i = 0; i < 4; i++) {
    const side = new THREE.Mesh(new THREE.BoxGeometry(i % 2 ? 0.62 : 0.02, 0.02, i % 2 ? 0.02 : 0.62), MAT.gold);
    side.position.set(i === 0 ? -0.31 : i === 2 ? 0.31 : 0, 0.0, i === 1 ? -0.31 : i === 3 ? 0.31 : 0);
    chip.add(side);
  }

  practicals(g, [
    { p: [1.1, 1.0, 1.3], c: 0xe8f0ff, i: 4.2, d: 5 },
    { p: [-1.0, 0.5, -0.9], c: 0x9fd8ff, i: 2.8, d: 5 },
    { p: [0.2, 0.35, 1.1], c: 0xbfd8ff, i: 1.6, d: 2.6 },
  ]);
  label3d(micro, [W * 0.42, 0.16, 0], { cn: '光刻胶（化学放大型）', en: 'CHEMICALLY AMPLIFIED RESIST', t0: 159.8, t1: 166.0, side: 'right' });
  label3d(micro, [-W * 0.42, 0.12, 0], { cn: '硅晶圆', en: 'SILICON WAFER', t0: 159.8, t1: 165.0, side: 'left' });
  label3d(micro, [0, 0.34, D * 0.3], { cn: 'EUV 光子 → 产生酸 → 潜影', en: 'PHOTONS → ACID → LATENT IMAGE', t0: 165.0, t1: 170.0, side: 'right' });
  label3d(micro, [W * 0.30, 0.14, -D * 0.34], { cn: '显影后：≈ 13 nm 半周期图形（示意）', en: 'AFTER DEVELOPMENT ≈ 13 nm HALF-PITCH', t0: 170.6, t1: 175.4, side: 'right' });
  label3d(macro, [1.05, 0.12, 0], { cn: '300 mm 晶圆 · 逐场步进曝光', en: '300 mm WAFER · FIELD BY FIELD', t0: 175.6, t1: 177.9, side: 'right' });

  return (t, local, k) => {
    const microOn = local < 15.2;
    micro.visible = microOn;
    macro.visible = !microOn;

    /* 光缝扫过 */
    const sweep = smoothstep(0.6, 9.0, local);
    const sx = lerp(-W * 0.46, W * 0.46, sweep);
    slit.position.x = sx;
    cone.position.x = sx;
    slitMat.uniforms.uInt.value = smoothstep(0.4, 1.2, local) * (1 - smoothstep(9.0, 9.8, local)) * 1.1;
    cone.material.uniforms.uInt.value = smoothstep(0.4, 1.2, local) * (1 - smoothstep(9.0, 9.8, local)) * 0.5;
    cone.material.uniforms.uPulse.value = (local * 1.4) % 1.2;

    /* 潜影随光缝显现 */
    latentMat.uniforms.uInt.value = smoothstep(1.4, 3.0, local) * (1 - smoothstep(10.6, 12.0, local)) * 0.95;
    latentMat.uniforms.uWipe.value = (sx + W * 0.48) / (W * 0.96);

    photons.update(local, (i, tt) => {
      const seed = hash1(i), seed2 = hash2(i);
      const fall = ((tt * (0.6 + seed * 0.8) + seed2 * 3) % 1.6) / 1.6;
      const x = sx + (seed - 0.5) * 0.14;
      const z = (seed2 - 0.5) * D * 0.86;
      const y = lerp(0.62, 0.02, fall);
      return [x, y, z, (1 - fall) * 0.7 * (microOn ? 1 : 0) * smoothstep(0.4, 1.2, tt) * (1 - smoothstep(9.0, 9.6, tt)), 0.4 + seed * 0.5, 0.15];
    });

    /* 显影：胶线自左向右升起 */
    const dev = smoothstep(10.8, 14.2, local);
    for (let i = 0; i < nL; i++) {
      const u = i / (nL - 1);
      const x = lerp(-W * 0.45, W * 0.45, u);
      const h = clamp01((dev - u * 0.45) / 0.55);
      _obj.position.set(x, 0.018 + 0.0275 * h, 0);
      _obj.scale.set(1, Math.max(0.001, h), 1);
      _obj.rotation.set(0, 0, 0);
      _obj.updateMatrix();
      lines.setMatrixAt(i, _obj.matrix);
    }
    lines.instanceMatrix.needsUpdate = true;
    lines.visible = dev > 0.001;
    resistSlab.material.opacity = 0.72 * (1 - dev * 0.75);

    /* 远景：die 逐个点亮 + 芯片浮现 */
    if (!microOn) {
      const p = smoothstep(15.4, 18.4, local);
      const dm = waf.userData.dieMesh;
      dm.material.emissive = new THREE.Color(0x1d5f8f);
      dm.material.emissiveIntensity = 0.25 + 0.5 * p;
      waf.rotation.y = (local - 15.2) * 0.10;
      chip.position.y = 0.55 + Math.sin(local * 0.8) * 0.02;
      chip.rotation.y = -(local - 15.2) * 0.18;
      chip.scale.setScalar(smoothstep(16.0, 17.4, local));
      die.material.emissiveIntensity = 0.3 + 0.35 * Math.sin(local * 2.2);
    }
  };
});

/* 片尾：十步工艺链的抽象光路回顾                                                */
defineScene('outro', (g) => {
  const chain = new THREE.Group();
  g.add(chain);
  const N = 10;
  const nodes = [];
  const bMat = beamMaterial({ color: 0x8f7bff, hot: 0xe8f0ff, flow: 0.8, intensity: 0.55, edge: 1.5 });
  for (let i = 0; i < N; i++) {
    const x = lerp(-2.55, 2.55, i / (N - 1));
    const y = Math.sin((i / (N - 1)) * Math.PI * 1.15) * 0.16 - 0.08;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.016, 10, 40), i < 4 ? MAT.multilayerWarm : MAT.multilayer);
    ring.position.set(x, y, 0);
    ring.rotation.y = Math.PI / 2;
    chain.add(ring);
    const core = billboard(glowSprite(chain, [x, y, 0], 0.62, i < 4 ? 0xffb070 : 0x9f8cff, 2.4));
    nodes.push({ ring, core, x, y });
    if (i > 0) {
      beamBetween(chain, [nodes[i - 1].x, nodes[i - 1].y, 0], [x, y, 0], 0.022, 0.022, bMat, { radial: 10, seg: 10 });
    }
  }
  const plasma = new THREE.Mesh(new THREE.IcosahedronGeometry(0.15, 4), plasmaMaterial({ scale: 7, seed: 5 }));
  plasma.position.set(nodes[2].x, nodes[2].y, 0);
  chain.add(plasma);
  billboard(glowSprite(g, [0, -0.1, -1.6], 9.0, 0x3a3f8f, 2.0)).material.uniforms.uInt.value = 0.20;
  const dust = dustField(g, { count: 420, color: 0x8fb4ff, size: 12 });
  practicals(g, [
    { p: [3.0, 2.2, 4.0], c: 0xe8f0ff, i: 30, d: 22 },
    { p: [-3.2, -1.2, -2.6], c: 0xa48cff, i: 20, d: 22 },
    { p: [0, 1.6, 2.2], c: 0xbfd8ff, i: 12, d: 14 },
  ]);

  return (t, local, k) => {
    chain.rotation.y = Math.sin(local * 0.16) * 0.20;
    chain.rotation.x = Math.sin(local * 0.11) * 0.05;
    bMat.uniforms.uPulse.value = (local * 0.55) % 1.5;
    plasma.material.uniforms.uInt.value = 1.2 + 0.3 * Math.sin(local * 8);
    nodes.forEach((n, i) => {
      const lit = smoothstep(0.4 + i * 0.42, 1.2 + i * 0.42, local);
      n.core.material.uniforms.uInt.value = lit * (0.85 + 0.18 * Math.sin(local * 4 + i));
      n.ring.scale.setScalar(0.9 + lit * 0.15);
    });
    dust.update(local, (i, tt) => {
      const a = hash1(i) * TAU, r = lerp(0.6, 4.6, hash2(i));
      return [Math.cos(a) * r * 0.9, lerp(-1.6, 1.6, hash3(i)) + Math.sin(tt * 0.25 + i) * 0.05, Math.sin(a) * r,
        0.34 * smoothstep(0, 2, tt), 0.4 + hash1(i + 4) * 0.7, hash2(i + 2) * 0.3];
    });
  };
});

/* =============================================================================
   60 · CAMERA  ·  按分镜关键帧插值的电影机位（时间的纯函数）
   ========================================================================== */

const CAMS = {};
function buildCameras() {
  for (const c of CH) {
    const pos = c.cam.map((k) => new THREE.Vector3(k.pos[0], k.pos[1], k.pos[2]));
    const tgt = c.cam.map((k) => new THREE.Vector3(k.tgt[0], k.tgt[1], k.tgt[2]));
    CAMS[c.id] = {
      times: c.cam.map((k) => k.t),
      fovs: c.cam.map((k) => k.fov),
      cpos: new THREE.CatmullRomCurve3(pos.length > 2 ? pos : [pos[0], pos[0].clone().lerp(pos[pos.length - 1], 0.5), pos[pos.length - 1]], false, 'catmullrom', 0.35),
      ctgt: new THREE.CatmullRomCurve3(tgt.length > 2 ? tgt : [tgt[0], tgt[0].clone().lerp(tgt[tgt.length - 1], 0.5), tgt[tgt.length - 1]], false, 'catmullrom', 0.35),
    };
  }
}

const _cp = new THREE.Vector3(), _ct = new THREE.Vector3();
/** 时间 → 机位：分段缓动映射到样条参数，保证速度连续（无跳动） */
function applyCamera(camera, chapter, t, aspectMode) {
  const c = CAMS[chapter.id];
  const ts = c.times;
  const n = ts.length;
  let i = 0;
  while (i < n - 2 && t > ts[i + 1]) i++;
  const seg = inv(ts[i], ts[i + 1], t);
  const u = (i + smooth(seg)) / (n - 1);
  c.cpos.getPoint(clamp01(u), _cp);
  c.ctgt.getPoint(clamp01(u), _ct);
  const fov = lerp(c.fovs[i], c.fovs[i + 1], smooth(seg));

  /* 竖版画幅：适当拉远，保证主体完整 */
  const pull = aspectMode === '9:16' ? 1.3 : 1.0;
  const dir = _cp.clone().sub(_ct);
  const dist = dir.length() * pull;
  dir.normalize();
  /* 极轻微的手持漂移，避免画面"死板" */
  const dr = dist * 0.006;
  camera.position.copy(_ct).addScaledVector(dir, dist);
  camera.position.x += Math.sin(t * 0.37) * dr;
  camera.position.y += Math.cos(t * 0.29) * dr * 0.8;
  camera.position.z += Math.sin(t * 0.23 + 1.1) * dr;
  camera.lookAt(_ct);
  camera.fov = fov * (aspectMode === '9:16' ? 1.06 : 1);
  camera.updateProjectionMatrix();
}

      const rev = clamp01(p / 8);
      for (let i = 0; i < 4; i++) {
        const x = w * (0.09 + i * 0.225);
        const on = clamp01(rev * 4 - i);
        g.strokeStyle = on > 0.05 ? '#5fd8ff' : 'rgba(150,190,230,.25)';
        g.lineWidth = 2;
        g.strokeRect(x, h * 0.30, w * 0.185, h * 0.30);

          arrow(g, ax + w * 0.032, h * 0.45, 1);
        }
      }
      txt(g, '潜影 LATENT IMAGE → 立体图形', w * 0.5, h * 0.16, '#9fb2c4', 11, 'center');
    },
  },
];

function grid(g, w, h) {
  g.clearRect(0, 0, w, h);
  g.strokeStyle = 'rgba(150,190,230,.07)';
  g.lineWidth = 1;
  for (let i = 1; i < 8; i++) { g.beginPath(); g.moveTo((w * i) / 8, 0); g.lineTo((w * i) / 8, h); g.stroke(); }
  for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(0, (h * i) / 5); g.lineTo(w, (h * i) / 5); g.stroke(); }
}
function txt(g, s, x, y, col, size, align) {
  g.fillStyle = col;
  g.font = `600 ${size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  g.textAlign = align || 'left';
  g.fillText(s, x, y);
}
function arrow(g, x, y, dir) {
  g.beginPath();
  g.moveTo(x, y); g.lineTo(x - 6 * dir, y - 4); g.lineTo(x - 6 * dir, y + 4);
  g.closePath();
  g.fillStyle = g.strokeStyle;
  g.fill();
}

/* --------------------------------------------------------------- init DOM   */
function buildOverlay() {
  /* 参数芯片 */
  for (const key of Object.keys(SCRIPT.params)) {
    const p = SCRIPT.params[key];
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = `<span class="k">${p.en}</span><span class="v">${p.v}</span>`
      + (p.src === 'sim' ? '<span class="s">示意 SIM</span>' : '');
    OV.chips.appendChild(el);
    OV.chipEls.set(key, el);
  }
  /* 3D 引线标注层 */
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('style', 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none');
  document.getElementById('gfx').appendChild(svg);
  OV.svg = svg;
  for (let i = 0; i < LABELS.length; i++) {
    const L = LABELS[i];
    const el = document.createElement('div');
    el.className = 'tag';
    el.style.cssText = 'position:absolute;opacity:0;white-space:nowrap;transform:translate(0,-50%);'
      + 'padding:calc(5px * var(--fs)) calc(10px * var(--fs));border:1px solid rgba(150,190,230,.3);'
      + 'background:linear-gradient(90deg,rgba(8,14,22,.92),rgba(8,14,22,.62))';
    const tone = L.tone === 'ir' ? '#ff8a5c' : L.tone === 'h2' ? '#6ff0d0' : L.tone === 'warm' ? '#ffc48a' : '#5fd8ff';
    el.innerHTML = `<div style="font:600 calc(13px * var(--fs))/1.3 var(--sans);color:#eaf1f8">${L.cn}</div>`
      + (L.en ? `<div style="font:600 calc(8.5px * var(--fs))/1.3 var(--mono);letter-spacing:.16em;color:${tone};margin-top:calc(2px * var(--fs))">${L.en}</div>` : '');
    document.getElementById('gfx').appendChild(el);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', tone);
    line.setAttribute('stroke-width', '1');
    line.setAttribute('opacity', '0');
    svg.appendChild(line);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', '2.5');
    dot.setAttribute('fill', tone);
    dot.setAttribute('opacity', '0');
    svg.appendChild(dot);
    OV.tagEls.set(i, { el, line, dot });
  }
  /* 片尾回顾网格 */
  for (const c of STEP_CHAPTERS) {
    const it = document.createElement('div');
    it.className = 'it';
    it.innerHTML = `<div class="n">STEP ${String(c.step).padStart(2, '0')}</div><div class="c">${c.cn}</div><div class="e">${c.en}</div>`;
    OV.recapGrid.appendChild(it);
  }
  OV.cardSub.textContent = `${SCRIPT.meta.subtitle.cn} · ${SCRIPT.meta.subtitle.en}`;
  OV.cardNote.textContent = `${SCRIPT.meta.disclaimerLong.cn}\n${SCRIPT.meta.disclaimerLong.en}`;
  setSubtitleMode(OPT.sub);
}

function setSubtitleMode(m) { OV.sub = m; }

/* ------------------------------------------------------------------ update  */
const _lp = new THREE.Vector3();
function updateOverlay(t, chapter, camera, w, h) {
  const fs = w / 1920;
  document.documentElement.style.setProperty('--fs', String(fs));

  /* 片头/片尾卡 */
  const titleIn = t < 10.6;
  const endIn = t > 188.6;
  if (titleIn || endIn) {
    OV.card.style.opacity = String(titleIn
      ? smoothstep(0.6, 2.4, t) * (1 - smoothstep(8.6, 10.6, t))
      : smoothstep(188.8, 190.2, t));
    OV.cardH1.textContent = titleIn ? SCRIPT.meta.title.cn : '13.5 nm';
    OV.cardH2.textContent = titleIn ? `${SCRIPT.meta.title.en} · 13.5 nm` : SCRIPT.meta.brandPlate.en;
    OV.cardSub.style.opacity = titleIn ? '1' : '0.001';
    OV.cardNote.style.opacity = titleIn ? String(smoothstep(3.2, 4.6, t)) : '0.001';
    OV.cardBrand.textContent = SCRIPT.meta.brandPlate.en;
  } else {
    OV.card.style.opacity = '0';
  }

  /* 片名标记 + 章节 */
  const showMark = t > 10.8 && t < 178.4;
  OV.mark.style.opacity = String(showMark ? 0.9 : 0);
  const isStep = chapter.step > 0;
  const chIn = t - chapter.t0;
  const chFade = smoothstep(0.15, 0.8, chIn) * (1 - smoothstep(chapter.t1 - chapter.t0 - 0.5, chapter.t1 - chapter.t0, chIn));
  OV.chap.style.opacity = String(showMark ? chFade : 0);
  OV.chapNum.innerHTML = isStep ? `${String(chapter.step).padStart(2, '0')}<sub>/10</sub>` : `<sub>OVERVIEW</sub>`;
  OV.chapCn.textContent = chapter.cn;
  OV.chapEn.textContent = chapter.en;
  OV.chapBar.style.width = `${clamp01(chIn / (chapter.t1 - chapter.t0)) * 100}%`;

  /* 参数芯片 */
  for (const [key, el] of OV.chipEls) {
    let on = false;
    for (const c of chapter.chips || []) if (c.k === key && t >= c.t0 && t <= c.t1) on = true;
    el.classList.toggle('on', on);
    el.style.display = on ? '' : 'none';
  }

  /* 字幕 */
  let cap = null;
  for (const c of chapter.captions || []) if (t >= c.t0 && t <= c.t1) cap = c;
  const showSub = OV.sub !== 'off' && cap;
  if (showSub) {
    const fade = smoothstep(cap.t0, cap.t0 + 0.35, t) * (1 - smoothstep(cap.t1 - 0.35, cap.t1, t));
    OV.capCn.textContent = OV.sub === 'en' ? cap.en : cap.cn;
    OV.capEn.textContent = OV.sub === 'both' ? cap.en : '';
    OV.capCn.style.opacity = String(fade);
    OV.capEn.style.opacity = String(OV.sub === 'both' ? fade * 0.9 : 0);
    OV.capRule.style.opacity = String(fade * 0.8);
  } else {
    OV.capCn.style.opacity = '0';
    OV.capEn.style.opacity = '0';
    OV.capRule.style.opacity = '0';
  }

  /* 步骤进度条 */
  const railOn = t > 24.4 && t < 178.2;
  OV.rail.style.opacity = String(railOn ? 0.92 : 0);
  if (railOn) {
    if (!OV.rail.dataset.built) {
      const track = OV.rail.querySelector('.track');
      STEP_CHAPTERS.forEach((c, i) => {
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.left = `${(i / (STEP_CHAPTERS.length - 1)) * 100}%`;
        tick.innerHTML = `<b>${String(c.step).padStart(2, '0')}</b>`;
        track.appendChild(tick);
      });
      OV.rail.dataset.built = '1';
    }
    const ticks = OV.rail.querySelectorAll('.tick');
    const idx = STEP_CHAPTERS.findIndex((c) => c.id === chapter.id);
    ticks.forEach((el, i) => el.classList.toggle('on', i <= idx && idx >= 0));
    const stepStart = STEP_CHAPTERS[0].t0, stepEnd = STEP_CHAPTERS[STEP_CHAPTERS.length - 1].t1;
    OV.railFill.style.width = `${clamp01(inv(stepStart, stepEnd, t)) * 100}%`;
    OV.railTc.textContent = `${TC(t)} / ${TC(SCRIPT.meta.duration)}`;
  }

  /* 工程示意图插图 */
  let ins = null;
  for (const i of INSETS) if (i.ch === chapter.id && t >= i.t0 && t <= i.t1) ins = i;
  OV.inset.classList.toggle('on', !!ins);
  if (ins) {
    OV.insetA.textContent = ins.a;
    OV.insetF.textContent = ins.foot();
    const c2 = OV.insetC.getContext('2d');
    ins.draw(c2, OV.insetC.width, OV.insetC.height, t - ins.t0);
  }

  /* 片尾回顾 */
  const recapOn = t > 178.3 && t < 189.2;
  OV.recap.style.opacity = String(recapOn ? smoothstep(178.4, 179.2, t) * (1 - smoothstep(188.4, 189.2, t)) : 0);
  if (recapOn) {
    const items = OV.recapGrid.children;
    for (let i = 0; i < items.length; i++) items[i].classList.toggle('on', t > 178.6 + i * 0.36);
  }

  /* 3D 引线标注 */
  for (let i = 0; i < LABELS.length; i++) {
    const L = LABELS[i];
    const ui = OV.tagEls.get(i);
    const vis = t >= L.t0 && t <= L.t1;
    if (!vis) {
      ui.el.style.opacity = '0';
      ui.line.setAttribute('opacity', '0');
      ui.dot.setAttribute('opacity', '0');
      continue;
    }
    L.obj.getWorldPosition(_lp);
    _lp.project(camera);
    if (_lp.z > 1) { ui.el.style.opacity = '0'; ui.line.setAttribute('opacity', '0'); ui.dot.setAttribute('opacity', '0'); continue; }
    const sx = (_lp.x * 0.5 + 0.5) * w, sy = (-_lp.y * 0.5 + 0.5) * h;
    const fade = smoothstep(L.t0, L.t0 + 0.4, t) * (1 - smoothstep(L.t1 - 0.4, L.t1, t));
    const right = L.side !== 'left';
    const off = 90 * fs;
    const tx = clamp(right ? sx + off : sx - off, 40 * fs, w - 40 * fs);
    const ty = clamp(sy - 26 * fs, 60 * fs, h - 150 * fs);
    ui.el.style.left = `${tx}px`;
    ui.el.style.top = `${ty}px`;
    ui.el.style.transform = right ? 'translate(0,-50%)' : 'translate(-100%,-50%)';
    ui.el.style.opacity = String(fade * 0.97);
    ui.line.setAttribute('points', `${sx},${sy} ${(sx + tx) / 2},${(sy + ty) / 2} ${right ? tx - 4 : tx + 4},${ty}`);
    ui.line.setAttribute('opacity', String(fade * 0.55));
    ui.dot.setAttribute('cx', String(sx));
    ui.dot.setAttribute('cy', String(sy));
    ui.dot.setAttribute('opacity', String(fade * 0.9));
  }

  /* 转场闪光（章节切换与点火瞬间） */
  let fl = 0;
  for (const c of CH) if (c.step > 0 || c.id === 'machine') fl = Math.max(fl, pulse(t, c.t0, 0.05, 0.42) * 0.10);
  fl = Math.max(fl, pulse(t, 59.42, 0.04, 0.5) * 0.55);          // 主脉冲点火
  fl = Math.max(fl, pulse(t, 45.0, 0.03, 0.25) * 0.18);          // 预脉冲
  OV.flash.style.opacity = String(fl);
}

// ===== src/80-postfx.js ====================================================
/* =============================================================================
   80 · POST  ·  两级泛光 + 电影级调色（亮部提取 → 可分离模糊 → sRGB 合成）
   ========================================================================== */

const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const SRGB_FN = `
  vec3 toSRGB(vec3 c){
    c = max(c, vec3(0.0));
    return mix(c * 12.92, pow(c, vec3(1.0 / 2.4)) * 1.055 - 0.055, step(vec3(0.0031308), c));
  }`;

class Bloom {
  constructor(renderer) {
    this.r = renderer;
    this.enabled = true;
    this.strength = 0.60;
    this.threshold = 0.62;
    this.knee = 0.35;
    const rt = (samples = 0) => {
      const t = new THREE.WebGLRenderTarget(2, 2, {
        type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        depthBuffer: true, stencilBuffer: false, samples,
      });
      t.texture.generateMipmaps = false;
      return t;
    };
    this.scene = rt(Q.msaa);
    this.a1 = rt(); this.a2 = rt(); this.b1 = rt(); this.b2 = rt();
    this.qs = new THREE.Scene();
    this.qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    this.quad.frustumCulled = false;
    this.qs.add(this.quad);

    this.mBright = new THREE.ShaderMaterial({
      uniforms: { tex: { value: null }, thr: { value: 0.55 }, knee: { value: 0.35 } },
      vertexShader: FS_VERT,
      fragmentShader: `
        uniform sampler2D tex; uniform float thr, knee;
        varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tex, vUv).rgb;
          float l = max(c.r, max(c.g, c.b));
          float soft = clamp(l - thr + knee, 0.0, 2.0 * knee);
          soft = soft * soft / (4.0 * knee + 1e-5);
          float w = max(soft, l - thr) / max(l, 1e-5);
          gl_FragColor = vec4(c * w, 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
    this.mBlur = new THREE.ShaderMaterial({
      uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2() } },
      vertexShader: FS_VERT,
      fragmentShader: `
        uniform sampler2D tex; uniform vec2 dir;
        varying vec2 vUv;
        void main(){
          vec3 s = texture2D(tex, vUv).rgb * 0.227027;
          s += (texture2D(tex, vUv + dir * 1.3846154).rgb + texture2D(tex, vUv - dir * 1.3846154).rgb) * 0.3162162;
          s += (texture2D(tex, vUv + dir * 3.2307692).rgb + texture2D(tex, vUv - dir * 3.2307692).rgb) * 0.0702703;
          gl_FragColor = vec4(s, 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
    this.mComp = new THREE.ShaderMaterial({
      uniforms: {
        tex: { value: null }, bA: { value: null }, bB: { value: null },
        strength: { value: 0.60 }, sat: { value: 1.07 }, contrast: { value: 1.06 },
      },
      vertexShader: FS_VERT,
      fragmentShader: `
        ${SRGB_FN}
        uniform sampler2D tex, bA, bB;
        uniform float strength, sat, contrast;
        varying vec2 vUv;
        void main(){
          vec3 base = texture2D(tex, vUv).rgb;
          vec3 glow = texture2D(bA, vUv).rgb * 0.60 + texture2D(bB, vUv).rgb * 0.95;
          vec3 c = base + glow * strength;
          /* 电影级基础调色：冷阴影 / 暖高光 + 轻微对比与饱和 */
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          c = mix(vec3(l), c, sat);
          c = (c - 0.5) * contrast + 0.5;
          c += vec3(-0.006, 0.000, 0.014) * (1.0 - smoothstep(0.0, 0.35, l));
          c += vec3(0.010, 0.004, -0.008) * smoothstep(0.55, 1.0, l);
          gl_FragColor = vec4(toSRGB(max(c, vec3(0.0))), 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
  }

  setSize(w, h, dpr) {
    const W = Math.max(2, Math.round(w * dpr)), H = Math.max(2, Math.round(h * dpr));
    this.scene.setSize(W, H);
    this.a1.setSize(Math.round(W / 2), Math.round(H / 2));
    this.a2.setSize(Math.round(W / 2), Math.round(H / 2));
    this.b1.setSize(Math.round(W / 4), Math.round(H / 4));
    this.b2.setSize(Math.round(W / 4), Math.round(H / 4));
  }

  pass(mat, target) {
    this.quad.material = mat;
    this.r.setRenderTarget(target);
    this.r.clear(true, false, false);
    this.r.render(this.qs, this.qc);
  }

  render(scene, camera) {
    const r = this.r;
    if (!this.enabled) {
      r.setRenderTarget(null);
      r.render(scene, camera);
      this.stats = { triangles: r.info.render.triangles, calls: r.info.render.calls };
      return;
    }
    r.setRenderTarget(this.scene);
    r.clear();
    r.render(scene, camera);
    this.stats = { triangles: r.info.render.triangles, calls: r.info.render.calls };

    this.mBright.uniforms.tex.value = this.scene.texture;
    this.mBright.uniforms.thr.value = this.threshold;
    this.mBright.uniforms.knee.value = this.knee;
    this.pass(this.mBright, this.a1);
    const blur = (src, dst, dx, dy, ref) => {
      this.mBlur.uniforms.tex.value = src.texture;
      this.mBlur.uniforms.dir.value.set(dx / ref.width, dy / ref.height);
      this.pass(this.mBlur, dst);
    };
    blur(this.a1, this.a2, 1, 0, this.a1);
    blur(this.a2, this.a1, 0, 1, this.a1);
    this.mBright.uniforms.tex.value = this.a1.texture;
    this.mBright.uniforms.thr.value = 0.0;
    this.mBright.uniforms.knee.value = 0.01;
    this.pass(this.mBright, this.b1);
    blur(this.b1, this.b2, 1, 0, this.b1);
    blur(this.b2, this.b1, 0, 1, this.b1);

    this.mComp.uniforms.tex.value = this.scene.texture;
    this.mComp.uniforms.bA.value = this.a1.texture;
    this.mComp.uniforms.bB.value = this.b1.texture;
    this.mComp.uniforms.strength.value = this.strength;
    this.pass(this.mComp, null);
  }
}

/* =============================================================================
   90 · MAIN  ·  渲染器 / 灯光 / 场景装配 / 确定性 renderAt(t) / 播放器 / 导出 API

{

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.dpr));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 16 / 9, 0.02, 400);

boot('environment …');
await new Promise((r) => requestAnimationFrame(() => r()));

/* 背景：深色渐变穹顶（避免纯黑死区，同时不干扰主体） */
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 24), new THREE.ShaderMaterial({
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `
      varying vec3 vP;
      void main(){
        vec3 d = normalize(vP);
        vec3 low = vec3(0.0012, 0.0018, 0.0034);
        vec3 mid = vec3(0.0075, 0.0105, 0.0210);
        vec3 top = vec3(0.0030, 0.0048, 0.0105);
        vec3 c = mix(low, mid, smoothstep(-0.6, 0.05, d.y));
        c = mix(c, top, smoothstep(0.1, 0.9, d.y));
        c += vec3(0.010, 0.008, 0.026) * pow(max(0.0, 1.0 - length(d.xy * 1.2)), 3.0);
        gl_FragColor = vec4(c, 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false,
  }));
  sky.frustumCulled = false;
  scene.add(sky);
}

/* 灯光：三点式 + 半球补光（金属主要由环境贴图点亮） */
const key = new THREE.DirectionalLight(0xfff4e6, 3.1);
key.position.set(6, 7.5, 6.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9ecdff, 1.15);
fill.position.set(-7, 3, -5);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xc9b8ff, 1.8);
rim.position.set(-3, -2, -8);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0x6b86a8, 0x0a0d12, 0.5));

/* ------------------------------------------------------------ 场景装配 */
boot('building scenes …');
await new Promise((r) => requestAnimationFrame(() => r()));

const STAGES = {};
for (const c of CH) {
  const g = new THREE.Group();
  g.name = c.id;
  g.visible = false;
  scene.add(g);
  const builder = SCENES[c.id];
  if (!builder) { console.warn('[euv] missing scene', c.id); continue; }
  STAGES[c.id] = { group: g, update: builder(g) };
  boot(`scene ${c.id} …`);
}
buildCameras();
buildOverlay();

const bloom = new Bloom(renderer);
bloom.enabled = Q.bloom;

/* ------------------------------------------------------------ 画幅与尺寸 */
const VIEW = { aspect: OPT.export ? 'free' : OPT.aspect, w: 1920, h: 1080 };
function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  let w = W, h = H;
  if (VIEW.aspect === '16:9' || VIEW.aspect === '9:16') {
    const ar = VIEW.aspect === '16:9' ? 16 / 9 : 9 / 16;
    if (W / H > ar) { h = H; w = Math.round(H * ar); } else { w = W; h = Math.round(W / ar); }
  }
  VIEW.w = w; VIEW.h = h;
  stageEl.style.width = `${w}px`;
  stageEl.style.height = `${h}px`;
  stageEl.style.left = `${Math.round((W - w) / 2)}px`;
  stageEl.style.top = `${Math.round((H - h) / 2)}px`;
  stageEl.style.right = 'auto';
  stageEl.style.bottom = 'auto';
  document.body.classList.toggle('vert', h > w * 1.05);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const dpr = Math.min(window.devicePixelRatio || 1, Q.dpr);
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(dpr);
  bloom.setSize(w, h, dpr);
  OV.svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}
window.addEventListener('resize', layout);
layout();

/* ------------------------------------------------------------ 剪辑映射 */
function cutRanges(name) {
  const r = SCRIPT.cuts[name];
  return r && r.length ? r : [[0, SCRIPT.meta.duration]];
}
function cutDuration(name) {
  return cutRanges(name).reduce((s, [a, b]) => s + (b - a), 0);
}
/** 剪辑时间 → 母版时间 */
function cutToMaster(name, tc) {
  const rs = cutRanges(name);
  let acc = 0;
  for (const [a, b] of rs) {
    const d = b - a;
    if (tc <= acc + d) return a + (tc - acc);
    acc += d;
  }
  return rs[rs.length - 1][1];
}

/* ------------------------------------------------------------ 渲染 */
const _q = new THREE.Quaternion();
function chapterAt(t) {
  for (const c of CH) if (t >= c.t0 && t < c.t1) return c;
  return t < CH[0].t0 ? CH[0] : CH[CH.length - 1];
}

let lastRendered = -1;
function renderAt(t) {
  t = clamp(t, 0, SCRIPT.meta.duration - 1e-4);
  SHARED.time.value = t;
  const c = chapterAt(t);
  /* 分镜曝光补偿（相邻镜头之间做 0.6 s 交叉过渡，避免亮度跳变） */
  const nb = CH.find((x) => x.t0 > c.t0 && x.t0 - t < 0.6 && x.t0 - t > 0);
  const pv = CH.find((x) => x.t1 <= c.t0 && t - c.t0 < 0.6);
  let expo = c.expo ?? 1;
  if (nb) expo = lerp(expo, nb.expo ?? 1, smoothstep(nb.t0 - 0.6, nb.t0, t) * 0.5);
  else if (pv) expo = lerp(pv.expo ?? 1, expo, smoothstep(c.t0, c.t0 + 0.6, t));
  renderer.toneMappingExposure = 1.24 * expo;
  SHARED.expo.value = 1.24 * expo;
  for (const id in STAGES) STAGES[id].group.visible = (id === c.id);
  applyCamera(camera, c, t, VIEW.aspect);
  STAGES[c.id].update(t, t - c.t0, inv(c.t0, c.t1, t));
  for (const b of BILLBOARDS) {
    if (!b.visible || !b.parent) continue;
    /* 无状态朝向：local = parentWorld⁻¹ · cameraWorld（可逐帧复现） */
    b.parent.getWorldQuaternion(_q);
    b.quaternion.copy(_q.invert()).multiply(camera.quaternion);
  }
  updateOverlay(t, c, camera, VIEW.w, VIEW.h);
  bloom.render(scene, camera);
  lastRendered = t;
}

/* ------------------------------------------------------------ 音频 */
const AUDIO = { el: null, ready: false, on: OPT.audio && !OPT.export };
function initAudio() {
  const el = new Audio();
  el.src = new URL('./audio/mix.wav', document.baseURI).href;
  el.preload = 'auto';
  el.addEventListener('canplay', () => { AUDIO.ready = true; console.log('[euv] audio ready'); });
  el.addEventListener('error', () => { AUDIO.ready = false; console.log('[euv] audio unavailable (silent playback)'); });
  AUDIO.el = el;
}
initAudio();

/* ------------------------------------------------------------ 播放器 */
const PLAY = { cut: OPT.cut, t: 0, playing: false, speed: 1, lastWall: 0 };
const ui = document.getElementById('ui');
const playBtn = document.getElementById('play');
const scrub = document.getElementById('scrub');
const scrubPl = document.getElementById('scrubPl');
const scrubKn = document.getElementById('scrubKn');
const tcode = document.getElementById('tcode');

function setPlaying(v) {
  PLAY.playing = v;
  playBtn.textContent = v ? '❚❚' : '▶';
  if (AUDIO.el && AUDIO.ready && AUDIO.on) {
    if (v) { AUDIO.el.currentTime = cutToMaster(PLAY.cut, PLAY.t); AUDIO.el.play().catch(() => {}); }
    else AUDIO.el.pause();
  }
}
function seekCut(tc) {
  PLAY.t = clamp(tc, 0, cutDuration(PLAY.cut));
  if (AUDIO.el && AUDIO.ready) AUDIO.el.currentTime = cutToMaster(PLAY.cut, PLAY.t);
  renderAt(cutToMaster(PLAY.cut, PLAY.t));
  updateScrub();
}
function updateScrub() {
  const d = cutDuration(PLAY.cut);
  const p = clamp01(PLAY.t / d);
  scrubPl.style.width = `${p * 100}%`;
  scrubKn.style.left = `${p * 100}%`;
  tcode.textContent = `${TC(PLAY.t)} / ${TC(d)}`;
}
playBtn.addEventListener('click', () => setPlaying(!PLAY.playing));
scrub.addEventListener('pointerdown', (e) => {
  const move = (ev) => {
    const r = scrub.getBoundingClientRect();
    seekCut(((ev.clientX - r.left) / r.width) * cutDuration(PLAY.cut));
  };
  move(e);
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});
for (const b of document.querySelectorAll('[data-speed]')) {
  b.addEventListener('click', () => {
    PLAY.speed = parseFloat(b.dataset.speed);
    if (AUDIO.el) AUDIO.el.playbackRate = PLAY.speed;
    for (const o of document.querySelectorAll('[data-speed]')) o.classList.toggle('on', o === b);
  });
}
for (const b of document.querySelectorAll('[data-sub]')) {
  b.addEventListener('click', () => {
    setSubtitleMode(b.dataset.sub);
    for (const o of document.querySelectorAll('[data-sub]')) o.classList.toggle('on', o === b);
    renderAt(cutToMaster(PLAY.cut, PLAY.t));
  });
}
for (const b of document.querySelectorAll('[data-cut]')) {
  b.addEventListener('click', () => {
    PLAY.cut = b.dataset.cut;
    for (const o of document.querySelectorAll('[data-cut]')) o.classList.toggle('on', o === b);
    buildChapterButtons();
    seekCut(0);
  });
}
for (const b of document.querySelectorAll('[data-asp]')) {
  b.addEventListener('click', () => {
    VIEW.aspect = b.dataset.asp;
    for (const o of document.querySelectorAll('[data-asp]')) o.classList.toggle('on', o === b);
    layout();
    renderAt(cutToMaster(PLAY.cut, PLAY.t));
  });
}
document.getElementById('gfxBtn').addEventListener('click', (e) => {
  const g = document.getElementById('gfx');
  g.classList.toggle('hidden');
  e.currentTarget.classList.toggle('on', !g.classList.contains('hidden'));
});
document.getElementById('audioBtn').addEventListener('click', (e) => {
  AUDIO.on = !AUDIO.on;
  e.currentTarget.classList.toggle('on', AUDIO.on);
  e.currentTarget.textContent = AUDIO.on ? '🔊 音频' : '🔇 静音';
  if (AUDIO.el) { if (!AUDIO.on) AUDIO.el.pause(); else if (PLAY.playing) { AUDIO.el.currentTime = cutToMaster(PLAY.cut, PLAY.t); AUDIO.el.play().catch(() => {}); } }
});
document.getElementById('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
function buildChapterButtons() {
  const host = document.getElementById('chapters');
  host.innerHTML = '';
  const rs = cutRanges(PLAY.cut);
  for (const c of CH) {
    /* 只显示当前剪辑包含的章节 */
    let cutT = 0, found = -1, acc = 0;
    for (const [a, b] of rs) {
      if (c.t0 < b && c.t1 > a) { found = acc + Math.max(0, c.t0 - a); break; }
      acc += b - a;
    }
    if (found < 0) continue;
    cutT = found;
    const el = document.createElement('button');
    el.className = 'cb';
    el.innerHTML = `${c.step > 0 ? `STEP ${String(c.step).padStart(2, '0')}` : 'INTRO'}<b>${c.cn}</b>`;
    el.addEventListener('click', () => seekCut(cutT + 0.05));
    host.appendChild(el);
  }
}
buildChapterButtons();

let idleTimer = 0;
window.addEventListener('pointermove', () => { idleTimer = 0; ui.classList.remove('hide'); });
window.addEventListener('keydown', (e) => {
  if (e.key === ' ') { setPlaying(!PLAY.playing); e.preventDefault(); }
  if (e.key === 'ArrowRight') seekCut(PLAY.t + 5);
  if (e.key === 'ArrowLeft') seekCut(PLAY.t - 5);
  if (e.key.toLowerCase() === 'f') document.getElementById('fsBtn').click();
  if (e.key.toLowerCase() === 'g') document.getElementById('gfxBtn').click();
});

/* ------------------------------------------------------------ 主循环 */
let frames = 0, fpsAcc = 0, fpsN = 0, fpsShown = 0;
let prevWall = performance.now() / 1000;
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now() / 1000;
  const dt = Math.min(0.25, now - prevWall);
  prevWall = now;
  if (OPT.export) return;                       // 导出模式：仅按指令渲染

  if (PLAY.playing) {
    const d = cutDuration(PLAY.cut);
    if (AUDIO.el && AUDIO.ready && AUDIO.on && !AUDIO.el.paused) {
      /* 以音频为主时钟 → 音画严格同步 */
      const master = AUDIO.el.currentTime;
      let acc = 0, mapped = null;
      for (const [a, b] of cutRanges(PLAY.cut)) {
        if (master >= a && master <= b) { mapped = acc + (master - a); break; }
        acc += b - a;
      }
      PLAY.t = mapped != null ? mapped : PLAY.t + dt * PLAY.speed;
    } else {
      PLAY.t += dt * PLAY.speed;
    }
    if (PLAY.t >= d) { PLAY.t = 0; if (AUDIO.el && AUDIO.ready) AUDIO.el.currentTime = cutToMaster(PLAY.cut, 0); }
    updateScrub();
  }
  renderAt(cutToMaster(PLAY.cut, PLAY.t));

  idleTimer += dt;
  if (idleTimer > 4 && PLAY.playing) ui.classList.add('hide');
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fpsShown = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  frames++;
}

/* 初始帧 */
renderAt(clamp(OPT.start, 0, SCRIPT.meta.duration));
updateScrub();
tick();
setTimeout(() => bootEl.classList.add('done'), 300);
if (!OPT.export && OPT.autoplay) setTimeout(() => setPlaying(true), 900);

/* ------------------------------------------------------------ 公共 API */
window.API = {
  ready: true,
  THREE, scene, camera, renderer, SCRIPT, STAGES, LABELS, OV, PLAY, VIEW, Q,
  duration: SCRIPT.meta.duration,
  fps: SCRIPT.meta.fps,
  /** 导出用：渲染指定母版时间并在完成后 resolve */
  seek: (t) => { renderAt(t); return true; },
  seekFrame: (n, fps) => new Promise((res) => {
    const f = fps || SCRIPT.meta.fps;
    renderAt(n / f);
    requestAnimationFrame(() => requestAnimationFrame(() => res(n / f)));
  }),
  play: () => setPlaying(true),
  pause: () => setPlaying(false),
  seekCut: (tc) => seekCut(tc),
  setCut: (name) => { PLAY.cut = name; buildChapterButtons(); seekCut(0); },
  setAspect: (a) => { VIEW.aspect = a; layout(); renderAt(cutToMaster(PLAY.cut, PLAY.t)); },
  setSub: (m) => { setSubtitleMode(m); renderAt(cutToMaster(PLAY.cut, PLAY.t)); },
  showGfx: (v) => { document.getElementById('gfx').classList.toggle('hidden', !v); },
  chrome: (v) => { ui.style.display = v ? '' : 'none'; },
  cutDuration: (n) => cutDuration(n || PLAY.cut),
  cutToMaster: (n, tc) => cutToMaster(n, tc),
  chapters: CH.map((c) => ({ id: c.id, step: c.step, t0: c.t0, t1: c.t1, cn: c.cn, en: c.en })),
  diagnostics: () => ({
    tier: Q.tier,
    fps: +fpsShown.toFixed(1),
    tris: (bloom.stats || {}).triangles || 0,
    calls: (bloom.stats || {}).calls || 0,
    geoms: renderer.info.memory.geometries,
    textures: renderer.info.memory.textures,
    scenes: Object.keys(STAGES).length,
    labels: LABELS.length,
    view: `${VIEW.w}x${VIEW.h}`,
    aspect: VIEW.aspect,
    cut: PLAY.cut,
    t: +lastRendered.toFixed(3),
    chapter: chapterAt(lastRendered).id,
    audio: AUDIO.ready,
    bloom: bloom.enabled,
  }),
};
console.log('[euv] ready', JSON.stringify(window.API.diagnostics()));

/* ------------------------------------------------------------- 自检 (QA) */
/** 内容与技术不变量自检：供验收与回归使用 */
window.API.selfTest = () => {
  const r = { ok: true, issues: [] };
  const bad = (m) => { r.ok = false; r.issues.push(m); };

  /* 1 · 章节时间轴连续、无缝隙、总时长一致 */
  let cursor = 0;
  for (const c of CH) {
    if (Math.abs(c.t0 - cursor) > 1e-6) bad(`章节 ${c.id} 起点 ${c.t0} 与上一章结束 ${cursor} 不连续`);
    if (c.t1 <= c.t0) bad(`章节 ${c.id} 时长非正`);
    cursor = c.t1;
  }
  if (Math.abs(cursor - SCRIPT.meta.duration) > 1e-6) bad(`章节总时长 ${cursor} ≠ 声明时长 ${SCRIPT.meta.duration}`);
  r.timelineContinuous = r.issues.length === 0;

  /* 2 · 10 个工艺步骤齐全且顺序正确 */
  const steps = CH.filter((c) => c.step > 0).sort((a, b) => a.t0 - b.t0).map((c) => c.step);
  r.steps = steps;
  if (steps.length !== 10) bad(`工艺步骤数量 ${steps.length} ≠ 10`);
  for (let i = 0; i < steps.length; i++) if (steps[i] !== i + 1) bad(`第 ${i + 1} 个出现的步骤是 ${steps[i]}，顺序错误`);

  /* 3 · 字幕中英齐全；参数字卡引用有效；每章有场景与机位 */
  let caps = 0, vos = 0, chips = 0;
  for (const c of CH) {
    for (const x of c.captions || []) {
      caps++;
      if (!x.cn || !x.en) bad(`章节 ${c.id} 有缺语言的字幕`);
      if (x.t1 <= x.t0 || x.t0 < c.t0 - 1e-6 || x.t1 > c.t1 + 1e-6) bad(`章节 ${c.id} 字幕时间越界`);
    }
    for (const x of c.vo || []) { vos++; if (!x.cn || !x.en) bad(`章节 ${c.id} 有缺语言的配音`); }
    for (const x of c.chips || []) { chips++; if (!SCRIPT.params[x.k]) bad(`章节 ${c.id} 引用了不存在的参数 ${x.k}`); }
    if (!STAGES[c.id]) bad(`章节 ${c.id} 缺少三维场景`);
    if (!c.cam || c.cam.length < 2) bad(`章节 ${c.id} 机位关键帧不足`);
    else {
      if (Math.abs(c.cam[0].t - c.t0) > 1e-6) bad(`章节 ${c.id} 首个机位时间 ${c.cam[0].t} ≠ ${c.t0}`);
      if (Math.abs(c.cam[c.cam.length - 1].t - c.t1) > 1e-6) bad(`章节 ${c.id} 末个机位时间 ≠ ${c.t1}`);
    }
  }
  r.captions = caps; r.voLines = vos; r.chipCues = chips; r.labels = LABELS.length;

  /* 4 · 全片示意标注常驻 */
  r.simBadge = getComputedStyle(document.getElementById('sim')).display !== 'none';
  if (!r.simBadge) bad('「示意 / SIMULATION」标注未显示');

  /* 5 · 逐时刻渲染无异常、相机数值有效 */
  const saved = lastRendered;
  let nan = 0;
  for (let i = 0; i <= 96; i++) {
    const t = (SCRIPT.meta.duration * i) / 96;
    try { renderAt(t); } catch (e) { bad(`t=${t.toFixed(1)} 渲染异常：${e.message}`); break; }
    if (!Number.isFinite(camera.position.x + camera.position.y + camera.position.z + camera.fov)) nan++;
  }
  if (nan) bad(`${nan} 个采样点相机数值无效`);
  r.sampledFrames = 97;

  /* 6 · 剪辑版本时长与字幕映射 */
  r.cuts = {};
  for (const k of Object.keys(SCRIPT.cuts)) {
    const d = cutDuration(k);
    r.cuts[k] = +d.toFixed(2);
    if (k !== 'full' && (d < 20 || d > 70)) bad(`剪辑 ${k} 时长 ${d}s 超出预期范围`);
  }

  /* 7 · 光路几何：集光镜每条射线经反射后必须精确指向第二焦点 */
  {
    const a = 1.70, c0 = 1.35, b = Math.sqrt(a * a - c0 * c0);
    let worst = 1;
    for (let i = 0; i < 40; i++) {
      const th = lerp(0.6, 2.0, i / 39), phi = i * 0.7;
      const dx = -Math.cos(th), dr = Math.sin(th);
      const d = new THREE.Vector3(dx, dr * Math.cos(phi), dr * Math.sin(phi));
      const A = (d.x * d.x) / (a * a) + (d.y * d.y + d.z * d.z) / (b * b);
      const B = (-2 * c0 * d.x) / (a * a);
      const C = (c0 * c0) / (a * a) - 1;
      const t = (-B + Math.sqrt(B * B - 4 * A * C)) / (2 * A);
      const Pp = d.clone().multiplyScalar(t);
      const n = new THREE.Vector3((Pp.x - c0) / (a * a), Pp.y / (b * b), Pp.z / (b * b)).normalize();
      const refl = d.clone().sub(n.clone().multiplyScalar(2 * d.dot(n))).normalize();
      const toF2 = new THREE.Vector3(2 * c0, 0, 0).sub(Pp).normalize();
      worst = Math.min(worst, refl.dot(toF2));
    }
    r.collectorReflectionDot = +worst.toFixed(6);
    if (worst < 0.999999) bad(`集光镜反射光路偏差过大（dot=${worst}）`);
  }

  renderAt(saved < 0 ? 0 : saved);
  return r;
};

</script>
</body>
</html>
