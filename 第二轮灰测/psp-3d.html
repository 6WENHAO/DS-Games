<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PSP-2000 · 三维可拆装模型</title>
<style>
  /* ===================== 基础布局 ===================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06070b;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #e9ecf4; -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; touch-action: none; cursor: grab; }
  #app canvas.grabbing { cursor: grabbing; }
  #app canvas.pick { cursor: pointer; }
  /* 暗角，提升产品质感 */
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }

  /* ===================== 玻璃拟态控制面板 ===================== */
  #panel { position: fixed; top: 16px; left: 16px; z-index: 10; width: 288px;
    max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 16px 14px;
    background: linear-gradient(160deg, rgba(24,28,40,.78), rgba(10,12,18,.72));
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);
    user-select: none; -webkit-user-select: none;
    transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .32s; }
  #panel.hide { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }

  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #59d0ff; flex: none;
    box-shadow: 0 0 10px #59d0ff, 0 0 22px rgba(89,208,255,.6); }
  .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: .4px; }
  .sub { font-size: 11px; color: #8d97ad; margin-bottom: 14px; letter-spacing: .2px; line-height: 1.55; }

  .sec { font-size: 10.5px; color: #7f8aa1; letter-spacing: 1.4px; margin: 15px 0 8px;
    display: flex; align-items: center; gap: 8px; }
  .sec::after { content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.16), transparent); }

  .row { display: flex; gap: 8px; }
  .row + .row { margin-top: 8px; }
  button { flex: 1; font: inherit; font-size: 12.5px; color: #dbe1ee; cursor: pointer;
    padding: 8px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.055); transition: .16s ease; white-space: nowrap; }
  button:hover { background: rgba(89,208,255,.16); border-color: rgba(89,208,255,.55); color: #fff; }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(180deg, rgba(89,208,255,.26), rgba(89,208,255,.12));
    border-color: rgba(89,208,255,.5); color: #eaf8ff; }
  button.primary:hover { background: linear-gradient(180deg, rgba(89,208,255,.42), rgba(89,208,255,.2)); }
  button.on { background: rgba(89,208,255,.3); border-color: #59d0ff; color: #fff;
    box-shadow: 0 0 0 1px rgba(89,208,255,.25), 0 0 14px rgba(89,208,255,.22); }

  .slider label { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; color: #aeb7c9; margin-bottom: 7px; }
  .slider label b { font-size: 13px; color: #59d0ff; font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px;
    background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #59d0ff var(--p,0%), rgba(255,255,255,.14) var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
    margin-top: -5.5px; border-radius: 50%; background: #fff; border: 3px solid #59d0ff;
    box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: #59d0ff; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 3px solid #59d0ff; }

  /* ===================== 部件清单 ===================== */
  .cat { font-size: 10.5px; color: #6f7a91; margin: 11px 0 6px; letter-spacing: .8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; line-height: 1;
    padding: 6px 9px; border-radius: 999px; cursor: pointer; color: #b9c1d2;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); transition: .16s ease; }
  .chip i { width: 5px; height: 5px; border-radius: 50%; background: #56607a; flex: none; transition: .16s ease; }
  .chip:hover { color: #fff; border-color: rgba(89,208,255,.55); background: rgba(89,208,255,.12); }
  .chip.on { color: #eaf8ff; border-color: rgba(89,208,255,.75); background: rgba(89,208,255,.24);
    box-shadow: 0 0 12px rgba(89,208,255,.2); }
  .chip.on i { background: #59d0ff; box-shadow: 0 0 8px #59d0ff; }
  .chip.hov { border-color: #fff; color: #fff; }

  /* ===================== 浮层 ===================== */
  #tip { position: fixed; z-index: 30; pointer-events: none; opacity: 0;
    transform: translate(-50%, -145%); padding: 6px 11px; border-radius: 9px; font-size: 12px;
    white-space: nowrap; background: rgba(8,10,16,.92); border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 8px 24px rgba(0,0,0,.5); transition: opacity .14s; }
  #tip b { color: #59d0ff; font-weight: 600; }
  #tip span { color: #8b95ab; font-size: 10.5px; margin-left: 7px; }

  #toggle { position: fixed; top: 16px; left: 16px; z-index: 11; width: 40px; height: 40px;
    display: none; align-items: center; justify-content: center; font-size: 17px; border-radius: 12px;
    background: rgba(14,17,25,.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.14);
    color: #cfd6e6; cursor: pointer; }
  #toggle.show { display: flex; }

  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5;
    font-size: 11.5px; color: #6b748a; text-align: center; line-height: 1.7;
    padding: 7px 14px; border-radius: 10px; background: rgba(8,10,16,.55);
    border: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(8px); pointer-events: none; }
  #hint kbd { font: inherit; color: #9aa4ba; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12); border-radius: 4px; padding: 1px 5px; }

  #boot { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: #06070b;
    font-size: 13px; color: #8d97ad; transition: opacity .5s; }
  #boot.done { opacity: 0; pointer-events: none; }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.12);
    border-top-color: #59d0ff; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #boot .fail { max-width: 470px; text-align: center; line-height: 1.9; color: #ff9a9a; }
  #boot .fail code { color: #ffd9a0; background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 5px; }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===================== 移动端适配 ===================== */
  @media (max-width: 620px) {
    #panel { width: calc(100vw - 32px); max-width: 320px; max-height: calc(100vh - 116px); }
    #hint { font-size: 10.5px; bottom: 10px; max-width: 94vw; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>

<button id="toggle" title="显示 / 隐藏控制面板 (H)">☰</button>

<aside id="panel">
  <div class="brand"><span class="dot"></span><h1>PSP-2000 三维可拆装模型</h1></div>
  <p class="sub">Three.js · 全程序化 Canvas 贴图 · 17 个独立部件<br>点击模型或下方清单即可单独拆 / 装</p>

  <div class="sec">拆装控制</div>
  <div class="row">
    <button id="btnExplode" class="primary">一键拆解</button>

  </div>
  <div class="row slider">
    <div style="flex:1">
      <label>拆解程度 <b id="lvlTxt">0%</b></label>

    </div>
  </div>

  <div class="sec">视角</div>

    <button id="btnRotate">自动旋转</button>

    <button id="btnFront">正面</button>

    <button id="btnSide">侧视</button>
  </div>

  <div class="sec">部件清单 <span id="cnt" style="color:#59d0ff;letter-spacing:0"></span></div>
  <div id="list"></div>
</aside>

<div id="tip"></div>

<div id="hint">
  拖拽旋转 · 滚轮缩放 · 点击部件拆装 &nbsp;|&nbsp;
  <kbd>空格</kbd> 拆装 <kbd>R</kbd> 重置 <kbd>A</kbd> 自动旋转 <kbd>H</kbd> 面板
</div>

<div id="boot"><div class="spin"></div><div id="bootMsg">正在从 CDN 加载 Three.js …</div></div>

<!-- 全局错误收集（便于排查运行环境问题） -->
<script>
  window.__ERRORS = [];
  addEventListener('error', e => window.__ERRORS.push(e.message || String(e.error)));
  addEventListener('unhandledrejection', e => window.__ERRORS.push('promise: ' + ((e.reason && e.reason.message) || e.reason)));
</script>

<!-- ES Module 依赖：主源 jsdelivr；scopes 为备用 CDN 提供内部 'three' 解析 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  },
  "scopes": {
    "https://unpkg.com/": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" },
    "https://esm.sh/":    { "three": "https://esm.sh/three@0.160.0" }
  }
}
</script>

<script type="module">
/* ==========================================================================
   PSP-2000 · 可交互拆装三维模型（单文件 / 无构建 / 无外部图片）
   --------------------------------------------------------------------------
   坐标约定：X 向右，Y 向上，Z 指向观察者（+Z 为掌机正面）
   机身：宽 16.4 × 高 8.0（比例 2.05:1）× 厚 2.22
   Z 分层：前壳 0 → 1.00 ｜ 金属中框 -0.62 → 0 ｜ 后壳 -1.22 → -0.62
   全部贴图均由 Canvas2D 在运行时绘制，无任何外部图片资源。
   ========================================================================== */

/* ------------------------------ 0. 依赖加载（带 CDN 回退） ------------------------------ */
const VER = '0.160.0';
const SOURCES = [
  { name: 'jsdelivr', three: 'three', addons: 'three/addons/' },
  { name: 'unpkg', three: `https://unpkg.com/three@${VER}/build/three.module.js`, addons: `https://unpkg.com/three@${VER}/examples/jsm/` },
  { name: 'esm.sh', three: `https://esm.sh/three@${VER}`, addons: `https://esm.sh/three@${VER}/examples/jsm/` },
];

const bootEl = document.getElementById('boot');
const bootMsg = document.getElementById('bootMsg');

let THREE, OrbitControls, RoundedBoxGeometry, RoomEnvironment, loadErr = null;
for (const s of SOURCES) {
  try {
    bootMsg.textContent = `正在从 ${s.name} 加载 Three.js r160 …`;
    const [core, oc, rb, re] = await Promise.all([
      import(s.three),
      import(s.addons + 'controls/OrbitControls.js'),
      import(s.addons + 'geometries/RoundedBoxGeometry.js'),
      import(s.addons + 'environments/RoomEnvironment.js'),
    ]);
    THREE = core;
    OrbitControls = oc.OrbitControls;
    RoundedBoxGeometry = rb.RoundedBoxGeometry;
    RoomEnvironment = re.RoomEnvironment;
    break;
  } catch (e) { loadErr = e; }
}
if (!THREE) {
  bootEl.innerHTML = `<div class="fail">Three.js 加载失败，请检查网络后刷新页面。<br>
    如需离线运行，可在本文件目录下启动本地服务：<code>npx serve</code><br>
    <span style="color:#8d97ad;font-size:11px">${String((loadErr && loadErr.message) || loadErr)}</span></div>`;
  throw loadErr;
}

/* ------------------------------ 1. 尺寸常量 ------------------------------ */
const W = 16.4;                              // 机身宽
const H = 8.0;                               // 机身高（16.4 / 8.0 = 2.05 : 1）
const CR = 0.5;                              // 机身圆角半径
const FD = 1.00, MD = 0.62, BD = 0.60;       // 前壳 / 中框 / 后壳 厚度
const FZ = FD;                               // 前壳外表面 z
const FC = FD / 2;                           // 前壳中心 z
const MC = -MD / 2;                          // 中框中心 z
const BC = -(MD + BD / 2);                   // 后壳中心 z
const BZ = -(MD + BD);                       // 后壳外表面 z
const DOOR_Z = BZ - 0.07;                    // 后盖类部件中心 z（厚 0.14，外凸 0.07）

/* 前面板功能区中心坐标 */
const P_SCREEN = { x: 0, y: 0.45 };
const P_DPAD = { x: -6.45, y: 0.72 };
const P_FACE = { x: 6.45, y: 0.72 };
const P_NUB = { x: -6.45, y: -2.24 };
const P_SPK = { x: 6.5, y: 2.92 };           // 右扬声器（左侧镜像）
const ROW_Y = -3.18;                         // 底部功能键行

/* ------------------------------ 2. 渲染器 / 场景 / 控制器 ------------------------------ */
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;          // ACES 电影级色调映射
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;            // PCF 软阴影
app.appendChild(renderer.domElement);
const canvasEl = renderer.domElement;

const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);

const controls = new OrbitControls(camera, canvasEl);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.9;
controls.minDistance = 6;
controls.maxDistance = 95;
controls.autoRotateSpeed = 1.1;
controls.target.set(0, 0, 0);

/* ------------------------------ 3. Canvas 贴图工厂 ------------------------------ */
const CJK = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';
const SANS = 'Arial,Helvetica,"Segoe UI",sans-serif';

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.textBaseline = 'middle'; x.textAlign = 'center';
  return { c, x };
}
function tex(canvas, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = Math.min(8, MAX_ANISO);
  t.needsUpdate = true;
  return t;
}
/** 圆角矩形路径 */
function rr(x, X, Y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  x.beginPath();
  x.moveTo(X + r, Y); x.lineTo(X + w - r, Y); x.quadraticCurveTo(X + w, Y, X + w, Y + r);
  x.lineTo(X + w, Y + h - r); x.quadraticCurveTo(X + w, Y + h, X + w - r, Y + h);
  x.lineTo(X + r, Y + h); x.quadraticCurveTo(X, Y + h, X, Y + h - r);
  x.lineTo(X, Y + r); x.quadraticCurveTo(X, Y, X + r, Y);
  x.closePath();
}
/** 手动字距绘制（兼容所有浏览器） */
function spaced(x, text, cx, cy, sp, align = 'center') {
  const chars = [...text];
  const ws = chars.map(ch => x.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  let px = align === 'center' ? cx - total / 2 : align === 'right' ? cx - total : cx;
  const old = x.textAlign; x.textAlign = 'left';
  chars.forEach((ch, i) => { x.fillText(ch, px, cy); px += ws[i] + sp; });
  x.textAlign = old;
  return total;
}
/** 确定性伪随机（保证纹理每次一致） */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- 3.1 XMB 风格屏幕界面 ---- */
function makeScreenTex() {
  const S = 2, w = 480 * S, h = 272 * S;      // PSP 原生 480×272 ×2 超采样
  const { c, x } = cv(w, h);
  x.scale(S, S);
  const W2 = 480, H2 = 272;

  // 渐变背景 + 中心光晕
  let g = x.createLinearGradient(0, 0, 0, H2);
  g.addColorStop(0, '#020a20'); g.addColorStop(.4, '#0a2a63');
  g.addColorStop(.72, '#0d3d86'); g.addColorStop(1, '#021231');
  x.fillStyle = g; x.fillRect(0, 0, W2, H2);
  g = x.createRadialGradient(W2 * .34, H2 * .5, 8, W2 * .34, H2 * .5, 260);
  g.addColorStop(0, 'rgba(120,200,255,.34)'); g.addColorStop(1, 'rgba(120,200,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, W2, H2);

  // XMB 波浪光带
  for (let i = 0; i < 5; i++) {
    x.beginPath();
    for (let px = 0; px <= W2; px += 4) {
      const y = 138 + Math.sin(px / 52 + i * 1.15) * (11 + i * 3.4) + Math.sin(px / 19 + i) * 3;
      px === 0 ? x.moveTo(px, y) : x.lineTo(px, y);
    }
    x.strokeStyle = `rgba(${150 + i * 12},${210 + i * 6},255,${0.16 - i * 0.024})`;
    x.lineWidth = 10 - i * 1.4; x.stroke();
  }
  x.beginPath();
  for (let px = 0; px <= W2; px += 3) x.lineTo(px, 138 + Math.sin(px / 52) * 11);
  x.strokeStyle = 'rgba(220,245,255,.5)'; x.lineWidth = 1; x.stroke();

  // 顶部状态栏
  x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(0, 0, W2, 26);
  x.strokeStyle = 'rgba(255,255,255,.16)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(0, 26.5); x.lineTo(W2, 26.5); x.stroke();
  x.fillStyle = '#eaf4ff'; x.font = `600 12px ${SANS}`; x.textAlign = 'left';
  x.fillText('12:34', 12, 13);
  x.font = `500 10px ${CJK}`; x.fillStyle = 'rgba(220,235,255,.75)';
  x.fillText('星期六', 52, 13.5);
  // 电池
  x.strokeStyle = '#dfeaff'; x.lineWidth = 1.4;
  rr(x, 442, 6, 24, 13, 2.5); x.stroke();
  x.fillStyle = '#dfeaff'; x.fillRect(466.5, 9.5, 3, 6);
  x.fillStyle = '#7dffb2'; rr(x, 444.5, 8.5, 17, 8, 1.5); x.fill();
  // Wi-Fi 弧线
  x.strokeStyle = '#bfe4ff'; x.lineWidth = 1.6;
  for (let i = 1; i <= 3; i++) { x.beginPath(); x.arc(418, 18, i * 4.2, -Math.PI * .78, -Math.PI * .22); x.stroke(); }
  x.beginPath(); x.arc(418, 18, 1.5, 0, 7); x.fillStyle = '#bfe4ff'; x.fill();

  // PSP Logo（左上）
  drawPSP(x, 20, 44, 30, 'rgba(255,255,255,.95)', true);
  x.font = `500 7.5px ${SANS}`; x.fillStyle = 'rgba(200,225,255,.6)'; x.textAlign = 'left';
  spaced(x, 'PLAYSTATION PORTABLE', 20, 58, 1.1, 'left');

  // 横向分类图标行（XMB 十字轴）
  const cats = [
    { icon: iSettings, label: '设置' }, { icon: iPhoto, label: '照片' },
    { icon: iMusic, label: '音乐' }, { icon: iVideo, label: '视频' },
    { icon: iGame, label: '游戏' }, { icon: iNet, label: '网络' },
  ];
  const selIdx = 4, gap = 56, baseY = 108, selX = 168;
  cats.forEach((cat, i) => {
    const cx = selX + (i - selIdx) * gap;
    const on = i === selIdx, s = on ? 30 : 21;
    x.save();
    x.globalAlpha = on ? 1 : 0.5;
    if (on) {
      const gg = x.createRadialGradient(cx, baseY, 2, cx, baseY, 42);

    const px = rand() * w, py = rand() * h, r = 2 + rand() * 2.6;
    x.beginPath(); x.arc(px, py, r, 0, 7); x.fillStyle = 'rgba(216,190,110,.55)'; x.fill();
    x.beginPath(); x.arc(px, py, r * .45, 0, 7); x.fillStyle = 'rgba(10,30,25,.85)'; x.fill();
  }
  // 焊盘阵列
  for (let b = 0; b < 5; b++) {
    const bx = 60 + rand() * (w - 260), by = 40 + rand() * (h - 160);
    const cols = 6 + (rand() * 10 | 0), rows = 3 + (rand() * 6 | 0);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      x.fillStyle = 'rgba(224,198,120,.7)';
      x.fillRect(bx + i * 11, by + j * 11, 6, 6);
    }
  }
  // 金手指
  x.fillStyle = '#d8bd6e';
  for (let i = 0; i < 26; i++) x.fillRect(w * .30 + i * 15, h - 34, 9, 30);
  // 丝印
  x.fillStyle = 'rgba(235,245,255,.62)'; x.textAlign = 'left';
  x.font = `700 30px ${SANS}`; x.fillText('SONY  TA-088v3', 34, 40);
  x.font = `600 20px ${SANS}`;
  x.fillText('PSP-2000  MAIN BOARD', 34, 74);
  x.fillText('CXD2962GG', w * .62, 44);
  x.textAlign = 'center';
  return tex(c);
}
/** 屏幕光晕（加色混合） */
function makeGlowTex() {
  const S = 256, { c, x } = cv(S, S);
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(150,215,255,.85)');
  g.addColorStop(.35, 'rgba(110,180,255,.35)');
  g.addColorStop(1, 'rgba(80,150,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return tex(c);
}
/** 场景背景渐变 */
function makeBgTex() {
  const S = 512, { c, x } = cv(S, S);
  const g = x.createRadialGradient(S * .5, S * .42, 0, S * .5, S * .42, S * .72);
  g.addColorStop(0, '#1d2536'); g.addColorStop(.45, '#111725'); g.addColorStop(1, '#05060a');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return tex(c);
}
/** 微磨砂 bump（塑料表面质感） */
function makeNoiseTex() {
  const S = 256, { c, x } = cv(S, S);
  const rand = rng(7);
  const img = x.createImageData(S, S);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 118 + rand() * 20;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = tex(c, false);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(9, 5);
  return t;
}

/* ------------------------------ 5. 几何辅助 ------------------------------ */
/** 安全圆角盒（自动夹紧半径，避免几何退化） */
function rbox(w, h, d, r = 0.08, seg = 4) {
  r = Math.max(0.004, Math.min(r, Math.min(w, h, d) / 2 - 1e-3));
  return new RoundedBoxGeometry(w, h, d, seg, r);
}
/** 圆角矩形 Shape */
function rectShape(w, h, r) {
  const s = new THREE.Shape();
  const x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2;
  r = Math.min(r, w / 2, h / 2);
  s.moveTo(x0 + r, y0);
  s.lineTo(x1 - r, y0); s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x1, y1 - r); s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
  s.lineTo(x0 + r, y1); s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x0, y0 + r); s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}
/** 壳体几何：X-Y 圆角与厚度解耦，正反面带柔和倒角 */
function shellGeo(w, h, d, r, bevel = 0.13) {
  bevel = Math.min(bevel, d / 2 - 0.02);
  const geo = new THREE.ExtrudeGeometry(rectShape(w, h, r), {
    depth: d - 2 * bevel, bevelEnabled: true,
    bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 18, steps: 1,
  });
  geo.translate(0, 0, -(d - 2 * bevel) / 2);
  geo.computeVertexNormals();
  return geo;
}
/** 圆柱（轴朝 +Z）；材质组顺序 [侧面, 顶面, 底面] */
function discGeo(rTop, rBot, d, seg = 40) {
  const g = new THREE.CylinderGeometry(rTop, rBot, d, seg);
  g.rotateX(Math.PI / 2);
  return g;
}
const PLANE = new THREE.PlaneGeometry(1, 1);

/* ------------------------------ 6. 部件系统 ------------------------------ */
const model = new THREE.Group();
scene.add(model);

const parts = [];
const partById = {};

function definePart(id, name, cat, off, rot) {
  const group = new THREE.Group();
  group.userData.partId = id;
  model.add(group);
  const p = {
    id, name, cat, group,
    off: new THREE.Vector3(off[0], off[1], off[2]),
    rot: rot ? new THREE.Euler(rot[0], rot[1], rot[2]) : null,
    dist: Math.hypot(off[0], off[1], off[2]),
    progress: 0, from: 0, to: 0, t: 1, dur: 1, dirty: true, meshes: [],
  };
  parts.push(p); partById[id] = p;
  return p;
}
/** 向部件添加网格 */
function add(part, geo, mat, pos = [0, 0, 0], opt = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  if (opt.rx) m.rotation.x = opt.rx;
  if (opt.ry) m.rotation.y = opt.ry;
  if (opt.rz) m.rotation.z = opt.rz;
  if (opt.scale) m.scale.set(opt.scale[0], opt.scale[1], opt.scale[2] ?? 1);
  m.castShadow = opt.shadow !== false;
  m.receiveShadow = opt.shadow !== false;
  if (opt.noPick) m.userData.noPick = true;
  if (opt.noHighlight) m.userData.noHighlight = true;
  if (opt.order) m.renderOrder = opt.order;
  part.group.add(m);
  part.meshes.push(m);
  return m;
}
/** 平面贴花（默认朝 +Z；ry:Math.PI 则朝 -Z） */
function decal(part, map, w, h, pos, opt = {}) {
  return add(part, PLANE, matDecal(map, opt.mat), pos, {
    scale: [w, h], shadow: false, noHighlight: true,
    order: opt.order ?? 2, rx: opt.rx, ry: opt.ry, rz: opt.rz, noPick: opt.noPick,
  });
}

const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);   // easeInOutCubic

function setTarget(p, v, dur = 0.95, delay = 0) {
  p.from = p.progress; p.to = v; p.dur = Math.max(0.001, dur); p.t = -delay;
}
/** 一键拆解 / 组装（带逐件延迟，形成波浪感） */
function explodeAll(v, dur = 1.05) {
  const order = v > 0.5 ? parts : [...parts].reverse();
  order.forEach((p, i) => setTarget(p, v, dur, i * 0.035));
  syncUI(v);
  flyTo();                     // 同步把镜头推到合适距离
}
/** 滑块：全局同步（短缓动保证跟手） */
function setLevel(v) {
  parts.forEach(p => setTarget(p, v, 0.22, 0));
  syncUI(v);
}
/** 单件拆 / 装 */

/* ------------------------------ 9. 相机取景 ------------------------------ */
const VIEWS = {
  home: { az: 0.5, pol: 1.15 },
  front: { az: 0, pol: Math.PI / 2 },
  back: { az: Math.PI, pol: Math.PI / 2 },
  side: { az: 1.36, pol: 1.32 },
};
const panelEl = document.getElementById('panel');
/** 左侧控制面板占用的横向像素（面板隐藏或窄屏时为 0） */
function panelReserve() {
  return (!panelEl.classList.contains('hide') && innerWidth >= 620) ? 320 : 0;
}
/** 用非对称视锥把画面整体右移，避开控制面板（不改变轨道中心） */
function applyViewOffset() {
  const s = panelReserve() / 2;
  if (s > 0) camera.setViewOffset(innerWidth, innerHeight, -s, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
}

/* 记录装配状态下各部件的局部包围盒，用于精确计算取景距离 */
parts.forEach(p => { p.homeBox = new THREE.Box3().setFromObject(p.group); });

const _box = new THREE.Box3();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
/** 依据各部件当前拆解目标，计算整体包围盒 */
function targetBox() {
  _box.makeEmpty();
  for (const p of parts) {
    _v1.copy(p.off).multiplyScalar(p.to);
    _box.expandByPoint(_v2.copy(p.homeBox.min).add(_v1));
    _box.expandByPoint(_v3.copy(p.homeBox.max).add(_v1));
  }
  return _box;
}
const _fitCam = new THREE.PerspectiveCamera();
/** 迭代求解“完整入画”所需的最小视距（自动适配宽高比、面板占位与拆解程度） */
function fitDistance(az, pol) {
  const box = targetBox();
  const dir = _v1.setFromSpherical(new THREE.Spherical(1, pol, az)).clone();
  const allowX = Math.max(0.25, 1 - panelReserve() / innerWidth);
  _fitCam.fov = camera.fov; _fitCam.aspect = camera.aspect;
  _fitCam.near = 0.1; _fitCam.far = 1000;
  let d = 24;
  for (let i = 0; i < 8; i++) {
    _fitCam.position.copy(controls.target).addScaledVector(dir, d);
    _fitCam.lookAt(controls.target);
    _fitCam.updateMatrixWorld(true);
    _fitCam.updateProjectionMatrix();
    let nx = 1e-6, ny = 1e-6;
    for (let k = 0; k < 8; k++) {
      _v2.set(k & 1 ? box.max.x : box.min.x, k & 2 ? box.max.y : box.min.y, k & 4 ? box.max.z : box.min.z);
      _v2.project(_fitCam);
      nx = Math.max(nx, Math.abs(_v2.x)); ny = Math.max(ny, Math.abs(_v2.y));
    }
    const k = Math.max(nx / allowX, ny);
    d = Math.min(Math.max(d * k, 7), 220);
    if (Math.abs(k - 1) < 0.008) break;
  }
  return d * 1.05;
}
let camTween = null;
/** 平滑推拉到“恰好完整入画”的距离；传入 view 可同时切换角度 */
function flyTo(view, dur = 1.0) {
  const cur = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const az = view ? view.az : cur.theta;
  const pol = view ? view.pol : cur.phi;
  const d = fitDistance(az, pol);
  const to = new THREE.Vector3().setFromSpherical(new THREE.Spherical(d, pol, az)).add(controls.target);
  camTween = { from: camera.position.clone(), to, t: 0, dur };
}
/** 窗口/面板变化后若画面被裁切则只向外拉远，不打断用户的放大操作 */
function ensureFits() {
  const cur = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const need = fitDistance(cur.theta, cur.phi);
  if (cur.radius < need * 0.995) {
    camera.position.setFromSpherical(new THREE.Spherical(need, cur.phi, cur.theta)).add(controls.target);
  }
}
function avgLevel() { return parts.reduce((s, p) => s + p.to, 0) / parts.length; }
function resetView() {
  controls.target.set(0, 0, 0);
  flyTo(VIEWS.home);
}

/* ------------------------------ 11. 拾取 / 悬停 ------------------------------ */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let hovered = null, downPos = null, isDown = false;

function pickAt(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  for (const h of ray.intersectObjects(model.children, true)) {
    if (h.object.userData.noPick) continue;
    let o = h.object;
    while (o && !o.userData.partId) o = o.parent;
    if (o) return partById[o.userData.partId];
  }
  return null;
}
function setHighlight(p, on) {
  if (!p) return;
  p.meshes.forEach(m => {
    if (m.userData.noHighlight) return;
    m.userData.mats.forEach(({ m: mat, hex, inten }) => {
      if (hex === null) return;
      if (on) { mat.emissive.setHex(0x1d4fd8); mat.emissiveIntensity = 0.42; }
      else { mat.emissive.setHex(hex); mat.emissiveIntensity = inten; }
    });
  });
  chipOf[p.id].classList.toggle('hov', on);
}
function showTip(p, cx, cy) {
  tipEl.innerHTML = `<b></b><span>${p.to > 0.5 ? '点击装回' : '点击拆下'}</span>`;
  tipEl.querySelector('b').textContent = p.name;
  tipEl.style.left = cx + 'px';
  tipEl.style.top = cy + 'px';
  tipEl.style.opacity = 1;
}
function hideTip() { tipEl.style.opacity = 0; }

canvasEl.addEventListener('pointermove', e => {
  if (isDown) { hideTip(); return; }
  const p = pickAt(e.clientX, e.clientY);
  if (p !== hovered) {
    setHighlight(hovered, false);
    setHighlight(p, true);
    hovered = p;
    canvasEl.classList.toggle('pick', !!p);
  }
  p ? showTip(p, e.clientX, e.clientY) : hideTip();
});
canvasEl.addEventListener('pointerdown', e => {
  isDown = true; downPos = { x: e.clientX, y: e.clientY };
  canvasEl.classList.add('grabbing');
});
canvasEl.addEventListener('pointerup', e => {
  isDown = false;
  canvasEl.classList.remove('grabbing');
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6) return;                          // 拖拽旋转时不触发点击
  const p = pickAt(e.clientX, e.clientY);
  if (p) { togglePart(p); showTip(p, e.clientX, e.clientY); setTimeout(hideTip, 1200); }
});
canvasEl.addEventListener('pointerleave', () => {
  setHighlight(hovered, false); hovered = null; hideTip();
  canvasEl.classList.remove('pick', 'grabbing');
});

/* ------------------------------ 12. 主循环 ------------------------------ */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const et = clock.elapsedTime;

  // 各部件独立缓动（easeInOutCubic）
  for (const p of parts) {
    if (p.t < p.dur) {
      p.t = Math.min(p.dur, p.t + dt);
      const u = p.t <= 0 ? 0 : easeInOut(p.t / p.dur);
      p.progress = p.from + (p.to - p.from) * u;
      p.dirty = true;
    }
    if (p.dirty) {
      p.group.position.copy(tmp.copy(p.off).multiplyScalar(p.progress));
      if (p.rot) p.group.rotation.set(p.rot.x * p.progress, p.rot.y * p.progress, p.rot.z * p.progress);
      if (p.ghost) applyGhost(p);
      p.dirty = p.t < p.dur;
    }
  }
  // UMD 拆出后缓慢旋转
  if (umdDisc) umdDisc.rotation.z += dt * 1.9 * partById.umd.progress;
  // 无线指示灯呼吸
  if (wlanLedMat) wlanLedMat.emissiveIntensity = 1.5 + 1.1 * (0.5 + 0.5 * Math.sin(et * 3.2));
  // 屏幕光随拆解淡出
  screenLight.intensity = 1.4 * (1 - Math.min(1, partById.screen.progress * 1.4));

  // 相机补间
  if (camTween) {
    camTween.t = Math.min(camTween.dur, camTween.t + dt);
    camera.position.lerpVectors(camTween.from, camTween.to, easeInOut(camTween.t / camTween.dur));
    if (camTween.t >= camTween.dur) camTween = null;
  }

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

/* ------------------------------ 13. 自适应 ------------------------------ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  applyViewOffset();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  ensureFits();                 // 仅在会被裁切时向外拉远
});

applyViewOffset();
ensureFits();

/* 调试钩子：地址栏加 ?debug 后可在控制台访问 window.__PSP */
if (location.search.includes('debug')) {
  window.__PSP = {
    THREE, scene, camera, renderer, controls, model, parts, partById,
    explodeAll, setLevel, togglePart, fitDistance, targetBox, panelReserve, applyGhost, VIEWS,
  };
}

syncUI(0);
bootEl.classList.add('done');
setTimeout(() => bootEl.remove(), 600);
</script>
</body>
</html>
