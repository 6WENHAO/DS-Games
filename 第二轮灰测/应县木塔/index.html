<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>应县木塔 · 佛宫寺释迦塔 · 大木作模型</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231a1512'/%3E%3Cg stroke='%23d8a24a' stroke-width='1.6' fill='none'%3E%3Cpath d='M4 27h24M7 27V9M25 27V9M16 3l11 6H5z'/%3E%3Cpath d='M6 17h20M6 13h20'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header id="hud">
      <h1>應縣木塔</h1>
      <p class="sub">佛宫寺释迦塔 · 辽清宁二年（1056）· 大木作数字模型</p>
      <div id="stats"></div>
    </header>

    <nav id="views" aria-label="视角"></nav>

    <section id="panel">
      <div class="pnl-head">构造解析</div>
      <div id="controls"></div>
      <div id="doc"></div>
    </section>

    <footer id="hint">
      <span><kbd>拖拽</kbd> 环视</span><span><kbd>滚轮</kbd> 缩放</span>
      <span><kbd>右键</kbd> 平移</span><span><kbd>1-9</kbd> 视角</span>
      <span><kbd>X</kbd> 半透明</span><span><kbd>C</kbd> 剖视</span>
      <span><kbd>J</kbd> 榫卯高亮</span><span><kbd>H</kbd> 隐藏界面</span>
    </footer>

    <div id="loading">
      <div class="l-inner">
        <div class="l-mark">⛩</div>
        <h2>應縣木塔</h2>
        <p id="loading-text">依《营造法式》放样…</p>
        <div class="l-track"><div id="loading-bar"></div></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
