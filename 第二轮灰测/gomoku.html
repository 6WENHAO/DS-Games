      // 退到人类可下的状态：若最后一手是 AI 的，连退两手
      var last = S.history[S.history.length - 1];
      if (last.p !== S.human && S.history.length >= 2) pops = 2;
    }
    for (var k = 0; k < pops && S.history.length; k++) {
      var h = S.history.pop();
      S.board[h.y * N + h.x] = EMPTY;
      S.turn = h.p;
    }
    S.rates.length = Math.max(1, S.history.length + 1);
    S.over = false; S.winner = 0; S.winCells = null; S.hint = null;
    hideOverlay();
    updateAnalysis(false);
    render();
  }

  async function hint() {
    if (S.over || S.thinking) return;
    var gen = S.gen;
    S.thinking = true; render();
    await sleep(20);
    var res = await E.bestMoveAsync(S.board, S.turn,
      { maxDepth: 5, time: 1600, noise: 0, q: 6, vcf: true, vct: true, vcfDef: true }, function () { return sleep(0); });
    S.thinking = false;
    if (gen !== S.gen) { render(); return; }
    S.hint = { x: res.x, y: res.y };
    render();
  }

  function showOverlay(title, note) {
    $('ovTitle').textContent = title;
    $('ovNote').textContent = note;
    $('overlay').classList.add('on');
  }
  function hideOverlay() { $('overlay').classList.remove('on'); }

  /* ================= 交互 ================= */
  function cellFromEvent(ev) {
    var r = cv.getBoundingClientRect();
    var cx = (ev.clientX - r.left) * (L / r.width);
    var cy = (ev.clientY - r.top) * (L / r.height);
    var x = Math.round((cx - PAD) / STEP), y = Math.round((cy - PAD) / STEP);
    if (x < 0 || x >= N || y < 0 || y >= N) return null;
    // 离交叉点太远则忽略
    if (Math.abs(cx - px(x)) > STEP * .62 || Math.abs(cy - px(y)) > STEP * .62) return null;
    return { x: x, y: y };
  }

  cv.addEventListener('pointerdown', function (ev) {
    if (!isHumanTurn()) return;
    var c = cellFromEvent(ev);
    if (!c) return;
    if (place(c.x, c.y)) maybeAI();
  });
  cv.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'touch') return;
    var c = cellFromEvent(ev);
    var same = (S.hover && c && S.hover.x === c.x && S.hover.y === c.y) || (!S.hover && !c);
    S.hover = c;
    if (!same) { if (S.heat) renderHover(); draw(); }
  });
  cv.addEventListener('pointerleave', function () { S.hover = null; draw(); });

  $('btnRestart').onclick = function () { reset(); };
  $('ovAgain').onclick = function () { reset(); };
  $('ovClose').onclick = hideOverlay;
  $('btnUndo').onclick = undo;
  $('btnHint').onclick = hint;
  $('btnNum').onclick = function () { S.showNum = !S.showNum; render(); };
  $('btnHeat').onclick = function () {
    S.heat = !S.heat;
    computeHeat();
    render();
  };
  $('segWr').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.wrMode = b.getAttribute('data-wr');
    setOn('segWr', 'wr', S.wrMode);
    S.mc = S.mcResult = S.deep = S.deepResult = null;
    updateAnalysis(true);
    render();
  };
  $('btnSwap').onclick = function () {
    S.human = E.other(S.human);
    setOn('segSide', 'side', String(S.human));
    reset();
  };

  function setOn(segId, attr, val) {
    var seg = $(segId);
    Array.prototype.forEach.call(seg.children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-' + attr) === val);
    });
  }
  $('segMode').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.mode = b.getAttribute('data-mode');
    setOn('segMode', 'mode', S.mode);
    reset();
  };
  $('segSide').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.human = parseInt(b.getAttribute('data-side'), 10);
    setOn('segSide', 'side', String(S.human));
    reset();
  };
  $('segDiff').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.diff = b.getAttribute('data-diff');
    setOn('segDiff', 'diff', S.diff);
    render();
  };

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    var k = e.key.toLowerCase();
    if (k === 'u') undo();
    else if (k === 'r') reset();
    else if (k === 'h') hint();
    else if (k === 'm') { S.heat = !S.heat; computeHeat(); render(); }
  });

  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new window.ResizeObserver(fit).observe($('boardWrap'));

  /* ================= 启动 ================= */
  fit();
  updateAnalysis(true);
  render();
  window.__GOMOKU_STATE__ = S;   // 便于调试
})();
</script>
</body>
</html>
