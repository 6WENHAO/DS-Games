  return { list: list, forShip: forShip };
})();

/* ========================= 16. PLAYER（真实甲板行走） ========================= */
function Player() {
  this.mode = 'ship';
  this.ship = null;
  this.lp = V.make(0, Hull.DECK + 0.1, 1.6);
  this.lv = V.make();
  this.wp = V.make();
  this.wv = V.make();
  this.yaw = 0; this.pitch = 0;
  this.grounded = false;
  this.station = null;
  this.carry = null;
  this.hp = 100;
  this.alive = true;
  this.breath = 1;
  this.digProgress = 0;
  this.repairTarget = null;
  this.qv = Q.make();
  this._t = { a: V.make(), b: V.make(), c: V.make(), d: V.make(), e: V.make() };
  this.viewQ = Q.make();
  this.headBob = 0;
  this.footT = 0;
  this.lastLand = 0;
}
Player.prototype.worldPos = function (out) {
  out = out || V.make();
  if (this.mode === 'ship' && this.ship) return this.ship.hullToWorld(out, this.lp);
  return V.copy(out, this.wp);
};
Player.prototype.eyePos = function (out) {
  out = out || V.make();
  this.worldPos(out);
  if (this.mode === 'ship' && this.ship) {
    var up = this.ship.body.localDir(this._t.a, V.set(this._t.b, 0, 1, 0));
    V.addScaled(out, out, up, CFG.player.eye + this.headBob);
  } else {
    out.y += CFG.player.eye + this.headBob;
  }
  return out;
};
/* 视线四元数：船体姿态 × 本地朝向 */
Player.prototype.viewQuat = function (out) {
  out = out || this.viewQ;
  var qy = Q.fromAxisAngle({ x: 0, y: 0, z: 0, w: 1 }, 0, 1, 0, this.yaw - Math.PI / 2);
  var qp = Q.fromAxisAngle({ x: 0, y: 0, z: 0, w: 1 }, 1, 0, 0, this.pitch);
  var local = Q.mul(Q.make(), qy, qp);
  if (this.mode === 'ship' && this.ship) Q.mul(out, this.ship.body.q, local);
  else Q.copy(out, local);
  return Q.norm(out);
};
Player.prototype.lookDir = function (out) {
  var q = this.viewQuat();
  return Q.rotate(out || V.make(), q, V.set(this._t.e, 0, 0, -1));
};
/* 本地水平前/右向量（用于移动） */
Player.prototype.moveBasis = function (fwd, right) {
  var cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
  V.set(fwd, cy, 0, sy);
  V.set(right, -sy, 0, cy);
};

Player.prototype.deckLimits = function (lp) {
  /* 返回当前所在层的可行走范围 */
  var inHold = lp.y < Hull.DECK - 0.45;
  if (inHold) return { x0: -6.0, x1: 6.4, z: 1.9, floor: CFG.ship.holdY };
  var w = Math.max(0.6, Hull.halfBeam(lp.x, Hull.DECK) - 0.42);
  return { x0: -8.5, x1: 8.5, z: Math.min(2.7, w), floor: null };
};

Player.prototype.step = function (dt, input, world, ships) {
  if (!this.alive) return;
  var P = CFG.player, T = this._t;
  /* 站在工位上时锁定位置 */
  if (this.station && this.station.stand && this.mode === 'ship') {
    var st = this.station.stand;
    this.lp.x = lerp(this.lp.x, st[0], clamp(dt * 8, 0, 1));
    this.lp.z = lerp(this.lp.z, st[2], clamp(dt * 8, 0, 1));
  }
  if (this.mode === 'ship' && this.ship) this.stepOnShip(dt, input, world, ships);
  else this.stepWorld(dt, input, world, ships);
  /* 头部起伏 */
  var sp = this.mode === 'ship' ? Math.sqrt(this.lv.x * this.lv.x + this.lv.z * this.lv.z)
    : Math.sqrt(this.wv.x * this.wv.x + this.wv.z * this.wv.z);
  if (this.grounded && sp > 0.4) {
    this.footT += dt * sp * 2.1;
    this.headBob = Math.sin(this.footT) * 0.045;
  } else this.headBob *= (1 - 4 * dt);
};

Player.prototype.stepOnShip = function (dt, input, world, ships) {
  var P = CFG.player, T = this._t, ship = this.ship, b = ship.body;
  /* --- 局部系等效重力（含船体加速度与旋转惯性力） --- */
  var gLoc = b.worldDirToLocal(T.a, V.set(T.b, 0, -CFG.phys.g, 0));
  if (b.accel) {
    var aLoc = b.worldDirToLocal(T.c, b.accel);
    gLoc.x -= aLoc.x; gLoc.y -= aLoc.y; gLoc.z -= aLoc.z;
  }
  /* r = 玩家相对重心（刚体局部） */
  var r = V.set(T.d, this.lp.x, this.lp.y - ship.cgY, this.lp.z);
  var om = b.omega, al = b.alpha || V.make();
  /* 离心力 -ω×(ω×r) */
  var wxr = V.cross(T.b, om, r);
  var cen = V.cross(V.make(), om, wxr);
  gLoc.x -= cen.x; gLoc.y -= cen.y; gLoc.z -= cen.z;
  /* 欧拉力 -α×r */
  var eul = V.cross(V.make(), al, r);
  gLoc.x -= eul.x; gLoc.y -= eul.y; gLoc.z -= eul.z;
  /* 科氏力 -2ω×v */
  var cor = V.cross(V.make(), om, this.lv);
  gLoc.x -= 2 * cor.x; gLoc.y -= 2 * cor.y; gLoc.z -= 2 * cor.z;
  /* 限幅，避免极端浪中把人弹飞 */
  var gl2 = V.len(gLoc);
  if (gl2 > 42) V.scale(gLoc, gLoc, 42 / gl2);

  /* --- 移动输入 --- */
  var fwd = T.a === gLoc ? V.make() : V.make(), right = V.make();
  this.moveBasis(fwd, right);
  var wish = V.make();
  if (!this.station || this.station.id === 'helm' || (this.station && this.station.free)) {
    /* 掌舵时不移动（转轮），其余工位也锁定 */
  }
  var canMove = !this.station;
  if (canMove) {
    if (input.fwd) V.addScaled(wish, wish, fwd, 1);
    if (input.back) V.addScaled(wish, wish, fwd, -1);
    if (input.left) V.addScaled(wish, wish, right, -1);
    if (input.right) V.addScaled(wish, wish, right, 1);
  }
  var wl = V.len(wish);
  var speed = (input.run ? CFG.player.run : CFG.player.walk) * (this.carry && this.carry.type === 'chest' ? 0.62 : 1);
  /* 舱内积水拖慢 */
  if (this.lp.y < Hull.DECK - 0.4 && ship.waterVol > 1) {
    var wLvl = ship.holdWaterY();
    if (this.lp.y < wLvl) speed *= clamp(1 - (wLvl - this.lp.y) * 0.42, 0.35, 1);
  }
  if (wl > 0.001) V.scale(wish, wish, speed / wl); else V.zero(wish);

  /* --- 积分（局部系） --- */
  var accel = this.grounded ? CFG.player.accel : CFG.player.airAccel;
  this.lv.x += (wish.x - this.lv.x) * clamp(accel * dt / Math.max(1, speed), 0, 1) * speed;
  this.lv.z += (wish.z - this.lv.z) * clamp(accel * dt / Math.max(1, speed), 0, 1) * speed;
  if (this.grounded) {
    var fr = 1 - CFG.player.friction * dt;
    if (wl < 0.01) { this.lv.x *= clamp(fr, 0, 1); this.lv.z *= clamp(fr, 0, 1); }
    /* 甲板倾斜时会滑动 */
    this.lv.x += gLoc.x * dt * 0.42;
    this.lv.z += gLoc.z * dt * 0.42;
  } else {
    this.lv.x += gLoc.x * dt * 0.20;
    this.lv.z += gLoc.z * dt * 0.20;
  }
  this.lv.y += gLoc.y * dt;
  if (input.jump && this.grounded && !this.station) {
    this.lv.y = CFG.player.jump;
    this.grounded = false;
  }
  this.lp.x += this.lv.x * dt;
  this.lp.y += this.lv.y * dt;
  this.lp.z += this.lv.z * dt;

  /* --- 碰撞：平台 --- */
  var lim = this.deckLimits(this.lp);
  var plat = ship.platformAt(this.lp.x, this.lp.z, this.lp.y + 0.5);
  var floorY = null;
  if (plat) floorY = plat.y;
  else if (this.lp.y < Hull.DECK - 0.3) floorY = CFG.ship.holdY;
  this.grounded = false;
  if (floorY !== null && this.lp.y <= floorY + 0.06 && this.lv.y <= 0.6) {
    this.lp.y = floorY;
    if (this.lv.y < -6) this.hp -= Math.min(35, (-this.lv.y - 6) * 3.5);
    this.lv.y = 0;
    this.grounded = true;
  }
  /* 天花板（甲板下） */
  if (this.lp.y < Hull.DECK - 0.35 && this.lp.y > CFG.ship.holdY) {
    var underHatch = (this.lp.x > 1.9 && this.lp.x < 4.5 && Math.abs(this.lp.z) < 1.3);
    if (!underHatch && this.lp.y + CFG.player.height > Hull.DECK - 0.12) {
      this.lp.y = Hull.DECK - 0.12 - CFG.player.height;
      if (this.lv.y > 0) this.lv.y = 0;
    }
  }
  /* 侧向边界 */
  if (this.lp.y < Hull.RAIL - 0.15) {
    if (this.lp.z > lim.z) { this.lp.z = lim.z; if (this.lv.z > 0) this.lv.z = 0; }
    if (this.lp.z < -lim.z) { this.lp.z = -lim.z; if (this.lv.z < 0) this.lv.z = 0; }
    if (this.lp.x > lim.x1) { this.lp.x = lim.x1; if (this.lv.x > 0) this.lv.x = 0; }
    if (this.lp.x < lim.x0) { this.lp.x = lim.x0; if (this.lv.x < 0) this.lv.x = 0; }
  }
  /* 桅杆碰撞 */
  var dxm = this.lp.x - 0.55, dzm = this.lp.z;
  var dm = Math.sqrt(dxm * dxm + dzm * dzm);
  if (dm < 0.55 && this.lp.y > Hull.DECK - 0.2) {
    var push = (0.55 - dm) / Math.max(0.01, dm);
    this.lp.x += dxm * push; this.lp.z += dzm * push;
  }
  /* 掉出船外 */
  if (this.lp.y > Hull.RAIL - 0.1 && (Math.abs(this.lp.z) > 3.15 || this.lp.x > 9.0 || this.lp.x < -9.0)) {
    this.leaveShip();
  }
  if (this.lp.y < CFG.ship.holdY - 3) this.leaveShip();
};

Player.prototype.leaveShip = function () {
  var ship = this.ship;
  if (!ship) return;
  var wp = ship.hullToWorld(V.make(), this.lp);
  var r = V.make(this.lp.x, this.lp.y - ship.cgY, this.lp.z);
  var omW = ship.body.omegaWorld(V.make());
  var vr = V.cross(V.make(), omW, ship.body.localDir(V.make(), r));
  var vw = ship.body.localDir(V.make(), this.lv);
  V.copy(this.wp, wp);
  V.set(this.wv, ship.body.vel.x + vr.x + vw.x, ship.body.vel.y + vr.y + vw.y, ship.body.vel.z + vr.z + vw.z);
  /* 世界朝向 = 船艏向 + 本地朝向 */
  this.yaw = wrapPi(this.yaw + ship.yaw);
  this.mode = 'air';
  this.ship = null;
  this.station = null;
  this.grounded = false;
};

Player.prototype.boardShip = function (ship, lp) {
  this.ship = ship;
  V.copy(this.lp, lp);
  V.zero(this.lv);
  this.yaw = wrapPi(this.yaw - ship.yaw);
  this.mode = 'ship';
  this.grounded = true;
  this.lastLand = 0;
};

Player.prototype.stepWorld = function (dt, input, world, ships) {
  var P = CFG.player, T = this._t;
  var fwd = V.make(), right = V.make();
  this.moveBasis(fwd, right);
  var seaY = Ocean.height(this.wp.x, this.wp.z);
  var terrY = world ? (world.walkHeightAt ? world.walkHeightAt(this.wp.x, this.wp.z) : world.terrainAt(this.wp.x, this.wp.z)) : -60;
  var inWater = this.wp.y < seaY - 0.15;
  this.mode = inWater ? 'swim' : (this.grounded ? 'land' : 'air');

  var wish = V.make();
  if (input.fwd) V.addScaled(wish, wish, fwd, 1);
  if (input.back) V.addScaled(wish, wish, fwd, -1);
  if (input.left) V.addScaled(wish, wish, right, -1);
  if (input.right) V.addScaled(wish, wish, right, 1);
  var wl = V.len(wish);
  var speed = inWater ? CFG.player.swim : (input.run ? CFG.player.run : CFG.player.walk);
  if (this.carry && this.carry.type === 'chest') speed *= 0.62;
  if (wl > 0.001) V.scale(wish, wish, speed / wl);

  if (inWater) {
    /* 游泳：浮力 + 阻尼 */
    var sub = clamp((seaY - this.wp.y) / 1.7, 0, 1);
    this.wv.y += (CFG.phys.g * sub * 1.32 - CFG.phys.g) * dt;
    if (input.jump) this.wv.y += 4.2 * dt * 3;
    var flow = Ocean.flow(T.a, this.wp.x, this.wp.y, this.wp.z);
    this.wv.x += ((wish.x + flow.x * 0.55) - this.wv.x) * clamp(3.2 * dt, 0, 1);
    this.wv.z += ((wish.z + flow.z * 0.55) - this.wv.z) * clamp(3.2 * dt, 0, 1);
    this.wv.y *= (1 - 1.9 * dt);
    this.breath = clamp(this.breath - (this.wp.y < seaY - 1.3 ? dt * 0.09 : -dt * 0.5), 0, 1);
    if (this.breath <= 0) this.hp -= 12 * dt;
    this.grounded = false;
  } else {
    this.wv.y -= CFG.phys.g * dt;
    var acc = this.grounded ? CFG.player.accel : CFG.player.airAccel;
    this.wv.x += (wish.x - this.wv.x) * clamp(acc * dt / Math.max(1, speed), 0, 1) * speed;
    this.wv.z += (wish.z - this.wv.z) * clamp(acc * dt / Math.max(1, speed), 0, 1) * speed;
    if (this.grounded && wl < 0.01) { this.wv.x *= clamp(1 - 11 * dt, 0, 1); this.wv.z *= clamp(1 - 11 * dt, 0, 1); }
    if (input.jump && this.grounded) { this.wv.y = CFG.player.jump; this.grounded = false; }
    this.breath = clamp(this.breath + dt * 0.5, 0, 1);
  }
  this.wp.x += this.wv.x * dt; this.wp.y += this.wv.y * dt; this.wp.z += this.wv.z * dt;

  /* 地形碰撞（含栈桥） */
  terrY = world ? (world.walkHeightAt ? world.walkHeightAt(this.wp.x, this.wp.z) : world.terrainAt(this.wp.x, this.wp.z)) : -60;
  if (this.wp.y <= terrY) {
    this.wp.y = terrY;
    if (this.wv.y < -8) this.hp -= Math.min(45, (-this.wv.y - 8) * 4);
    this.wv.y = 0;
    this.grounded = true;
    this.mode = 'land';
  } else if (this.wp.y > terrY + 0.12) {
    this.grounded = false;
  }
  /* 上船：靠近任意船体舷侧且高度合适 */
  this.lastLand += dt;
  if (ships && this.lastLand > 0.35) {
    for (var i = 0; i < ships.length; i++) {
      var sh = ships[i];
      if (sh.sunk) continue;
      var lp = sh.worldToHull(V.make(), this.wp);
      if (lp.x > -9.3 && lp.x < 9.3 && Math.abs(lp.z) < 3.5) {
        var plat = sh.highestPlatformAt(lp.x, lp.z);
        /* 从上方落到甲板 */
        if (plat && lp.y < plat.y + 0.55 && lp.y > plat.y - 1.6 && this.wv.y <= 1.5) {
          lp.y = plat.y; this.boardShip(sh, lp); return;
        }
        /* 攀爬：在水中贴着船体（船梯） */
        if (this.mode === 'swim' && lp.y > CFG.ship.holdY && lp.y < Hull.RAIL + 0.5 &&
          Math.abs(Math.abs(lp.z) - Hull.halfBeam(lp.x, lp.y)) < 1.5) {
          if (input.fwd || input.jump) {
            this.wv.y = Math.max(this.wv.y, 3.4);
            this.wp.y += 2.2 * dt;
          }
          if (lp.y > Hull.RAIL - 0.6) {
            lp.y = Hull.DECK; lp.z = clamp(lp.z, -2.4, 2.4);
            this.boardShip(sh, lp); return;
          }
        }
      }
    }
  }
  if (this.hp <= 0) this.alive = false;
};

/* 交互：找最近可用工位 */
Player.prototype.findStation = function (ship) {
  if (this.mode !== 'ship' || !ship) return null;
  var list = STATIONS.forShip(ship), best = null, bd = 1e9;
  var look = this.lookDir(V.make());
  var lookLocal = ship.body.worldDirToLocal(V.make(), look);
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    var dx = s.p[0] - this.lp.x, dy = s.p[1] - (this.lp.y + CFG.player.eye), dz = s.p[2] - this.lp.z;
    var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d > s.r + 0.65) continue;
    var dot = (dx * lookLocal.x + dy * lookLocal.y + dz * lookLocal.z) / Math.max(0.01, d);
    if (dot < 0.25) continue;
    var score = d - dot * 0.8;
    if (score < bd) { bd = score; best = s; }
  }
  return best;
};
/* 找最近破洞（修补用） */
Player.prototype.findBreach = function (ship) {
  if (this.mode !== 'ship' || !ship) return null;
  var best = null, bd = 1e9;
  for (var i = 0; i < ship.breaches.length; i++) {
    var br = ship.breaches[i];
    var d = V.dist(br.p, this.lp);
    if (d < 3.0 && d < bd) { bd = d; best = br; }
  }
  return best;
};

/* ========================= 17. AI（骷髅船，使用同一套物理器具） ========================= */
var AI = (function () {
  function solveElevation(from, to, muzzle) {
    /* 二分求仰角，使弹道落点距离匹配（含空气阻力） */
    var dx = to.x - from.x, dz = to.z - from.z;
    var horiz = Math.sqrt(dx * dx + dz * dz);
    var dy = to.y - from.y;
    var lo = -0.05, hi = 0.75, best = 0.08, bestErr = 1e9;
    var dirx = dx / Math.max(0.01, horiz), dirz = dz / Math.max(0.01, horiz);
    for (var it = 0; it < 14; it++) {
      var mid = (lo + hi) * 0.5;
      var v = V.make(dirx * Math.cos(mid) * muzzle, Math.sin(mid) * muzzle, dirz * Math.cos(mid) * muzzle);
      var pr = Ballistics.predict(from, v, 14, 0.05);
      /* 求该弹道在到达目标水平距离时的高度差 */
      var pdx = pr.pos.x - from.x, pdz = pr.pos.z - from.z;
      var reach = Math.sqrt(pdx * pdx + pdz * pdz);
      var err = reach - horiz;
      if (Math.abs(err) < Math.abs(bestErr)) { bestErr = err; best = mid; }
      if (err < 0) lo = mid; else hi = mid;
    }
    return { pitch: best + clamp(dy / Math.max(20, horiz), -0.3, 0.3), err: bestErr };
  }
  function update(ship, target, dt, aiState) {
    if (ship.sunk) return;
    var st = aiState;
    var b = ship.body;
    var tp = target.body.pos;
    var d = V.dist(b.pos, tp);
    st.t = (st.t || 0) + dt;

    /* --- 帆：自动最优收帆 --- */
    ship.setSailHoist(d > 140 ? 1 : 0.78);
    var bt = ship.bestTrim();
    ship.sail.trimTarget = bt.trim;

    /* --- 航向决策 --- */
    var brg = Math.atan2(tp.z - b.pos.z, tp.x - b.pos.x);
    var localBrg = wrapPi(brg - ship.yaw);      /* 目标相对艏向（+ = 右舷） */
    /* 交战舷侧：带滞回，避免来回摆舵 */
    if (!st.side) st.side = localBrg >= 0 ? 1 : -1;
    if (st.side > 0 && localBrg < -1.15) st.side = -1;
    if (st.side < 0 && localBrg > 1.15) st.side = 1;
    /* 螺旋接近：远距直冲，接近到理想炮击距离后转为环绕，保证舷炮持续在射界内 */
    var Rdes = 88;
    var k = clamp((d - Rdes) / (Rdes * 1.6), -0.62, 1);
    var offset = (Math.PI * 0.5) * (1 - k);
    var want = brg + st.side * offset;
    /* 受创严重则脱离 */
    if (ship.hp < CFG.ship.hull.hp * 0.22 || ship.waterLevel() > 0.72) want = brg + Math.PI;
    /* 避免搁浅：探测前方地形 */
    var fwd = b.localDir(V.make(), V.make(1, 0, 0));
    for (var la = 0; la < 3; la++) {
      var probe = V.addScaled(V.make(), b.pos, fwd, 45 + la * 45);
      if (World.terrainAt(probe.x, probe.z) > -3.5) { want = brg + Math.PI * 0.5 * (st.side || 1) * 1.4; break; }
    }
    var err = wrapPi(want - ship.yaw);
    ship.setHelm(clamp(err * 1.9, -1, 1));
    st.dbg = { brg: brg, want: want, err: err, yaw: ship.yaw, d: d, side: st.side, helm: ship.helm.target };

    /* --- 火炮 --- */
    var lead = clamp(d / CFG.cannon.muzzle, 0, 3.5);
    var aimAt = V.make(
      tp.x + target.body.vel.x * lead,
      tp.y + 1.2 + target.body.vel.y * lead * 0.4,
      tp.z + target.body.vel.z * lead
    );
    for (var i = 0; i < ship.cannons.length; i++) {
      var c = ship.cannons[i];
      var hp = V.make(c.lx, Hull.DECK + 0.62, c.lz);
      var wpos = ship.hullToWorld(V.make(), hp);
      var toT = V.sub(V.make(), aimAt, wpos);
      var localDir = ship.body.worldDirToLocal(V.make(), toT);
      var needYaw = Math.atan2(localDir.z, localDir.x);
      var rel = wrapPi(needYaw - c.baseYaw);
      if (Math.abs(rel) > CFG.cannon.yawRange) continue;
      c.yaw = moveToward(c.yaw, rel, 0.9, dt);
      var sol = solveElevation(wpos, aimAt, CFG.cannon.muzzle);
      c.pitch = moveToward(c.pitch, clamp(sol.pitch, CFG.cannon.pitchMin, CFG.cannon.pitchMax), 0.55, dt);
      if (c.loaded && Math.abs(c.yaw - rel) < 0.06 && Math.abs(sol.err) < 26 && d < 340 && st.t > 1.2) {
        if (!st.fireCd || st.fireCd <= 0) {
          var shot = ship.fireCannon(i);
          if (shot) {
            /* 命中散布 */
            var spread = 0.012 + Math.min(0.02, d / 22000);
            shot.vel.x += (Math.random() - 0.5) * CFG.cannon.muzzle * spread;
            shot.vel.y += (Math.random() - 0.5) * CFG.cannon.muzzle * spread;
            shot.vel.z += (Math.random() - 0.5) * CFG.cannon.muzzle * spread;
            Ballistics.spawn(shot.pos, shot.vel, ship, {});
            Render.emit(shot.pos, V.scale(V.make(), shot.dir, 8), 1.6, [0.85, 0.85, 0.85, 0.8], 1.4, -0.4);
            st.fireCd = 0.55;
          }
        }
      }
    }
    if (st.fireCd) st.fireCd -= dt;
    /* 损管：AI 自动修补/抽水 */
    if (ship.breaches.length && st.t > 3) {
      var br = ship.breaches[0];
      br.repair += dt * 0.34;
      if (br.repair >= 1) ship.breaches.splice(0, 1);
    }
    if (ship.waterVol > 3) ship.pump(dt);
  }
  return { update: update, solveElevation: solveElevation };
})();

/* ========================= 18. GAME ========================= */
var Game = (function () {
  var player = null, ships = [], myShip = null, loot = [], aiStates = [], time = 0;
  var state = 'menu', paused = false, seed = 0, gust = 1, gustT = 0;
  var log = [], lastEnemy = 0, enemyCount = 0, digSpots = [];
  var input = {
    fwd: 0, back: 0, left: 0, right: 0, jump: 0, run: 0, use: 0, useEdge: 0, fire: 0, fireEdge: 0,
    mdx: 0, mdy: 0, reload: 0, drop: 0, mapKey: 0
  };
  var stats = { sunk: 0, delivered: 0, shots: 0, hits: 0, dist: 0 };
  var msg = '', msgT = 0, deadT = 0, respawnT = 0;

  function addLog(s, cls) { log.push({ t: 0, s: s, cls: cls || '' }); if (log.length > 6) log.shift(); }
  function toast(s) { msg = s; msgT = 3.2; }

  function newGame(sd) {
    seed = sd || (Date.now() % 1000000);
    World.generate(seed);
    World.setGold(0);
    Ballistics.clear();
    Render.clearParticles();
    ships.length = 0; loot.length = 0; aiStates.length = 0; log.length = 0;
    digSpots.length = 0;
    var isls = World.getIslands();
    for (var i = 0; i < isls.length; i++) {
      for (var j = 0; j < isls[i].digs.length; j++) {
        var dg = isls[i].digs[j];
        digSpots.push({ x: dg.x, y: dg.y, z: dg.z, dug: false, has: dg.has, island: isls[i] });
      }
    }
    var op = World.getOutpost();
    var moor = op.mooring || V.make(op.pos.x + op.radius + 60, 0, op.pos.z);
    var away = Math.atan2(moor.z - op.pos.z, moor.x - op.pos.x);
    myShip = new Ship({ pos: V.make(moor.x, 0.0, moor.z), yaw: away + Math.PI * 0.5, name: '黑砂号' });
    ships.push(myShip); aiStates.push(null);
    Ocean.setWind(rad(35), 8.5);
    Ocean.setSeaState(0.95);
    Ocean.setTime(0);
    time = 0; lastEnemy = -40; enemyCount = 0;
    player = new Player();
    player.boardShip(myShip, V.make(-3.2, Hull.DECK, 0));
    player.yaw = 0;
    stats = { sunk: 0, delivered: 0, shots: 0, hits: 0, dist: 0 };
    state = 'play';
    if (typeof Render !== 'undefined' && Render.isReady()) Render.buildWorldGfx();
    addLog('起航！目标：' + (World.currentQuest() ? World.currentQuest().island.name : '未知'), 'good');
    save();
    return true;
  }

  function spawnEnemy() {
    if (enemyCount >= 2) return;
    var w = Ocean.getWind();
    var ang = w.dir + Math.PI + (Math.random() - 0.5) * 1.2;
    var dist = 420 + Math.random() * 160;
    var p = V.make(myShip.body.pos.x + Math.cos(ang) * dist, 0.4, myShip.body.pos.z + Math.sin(ang) * dist);
    if (World.terrainAt(p.x, p.z) > -6) return;
    var e = new Ship({ pos: p, yaw: ang + Math.PI, faction: 'skeleton', name: '骸骨帆船' });
    e.setSailHoist(1);
    ships.push(e);
    aiStates.push({ side: 1, t: 0 });
    enemyCount++;
    addLog('海平面出现骷髅船帆影！', 'bad');
    toast('⚠ 骷髅船逼近');
  }

  /* ---------- 工位操作 ---------- */
  function operateStation(dt) {
    var s = player.station;
    if (!s || !player.ship) return;
    var ship = player.ship;
    if (s.id === 'helm') {
      var steer = 0;
      if (input.left) steer -= 1;
      if (input.right) steer += 1;
      if (Math.abs(input.mdx) > 0.0001) steer += clamp(input.mdx * 0.06, -1, 1);
      if (steer) ship.turnHelm(steer, dt);
      if (input.back) ship.setHelm(moveToward(ship.helm.target, 0, 1.2, dt));
    } else if (s.id === 'hoist') {
      if (input.fwd) ship.setSailHoist(ship.sail.hoistTarget + dt * 0.55);
      if (input.back) ship.setSailHoist(ship.sail.hoistTarget - dt * 0.55);
    } else if (s.id === 'trimP') {
      if (input.fwd) ship.trimSail(-1, dt);
      if (input.back) ship.trimSail(0.6, dt);
    } else if (s.id === 'trimS') {
      if (input.fwd) ship.trimSail(1, dt);
      if (input.back) ship.trimSail(-0.6, dt);
    } else if (s.id === 'capstan') {
      if (input.fwd) {
        if (ship.workCapstan(dt)) { if (ship.anchor.state === 'up') { addLog('锚已完全收起', 'good'); } }
      }
    } else if (s.id === 'pump') {
      if (input.fwd && ship.waterVol > 0) {
        ship.pump(dt);
        if (Math.random() < dt * 6) {
          var wp = ship.hullToWorld(V.make(), V.make(-0.9, Hull.DECK + 1.5, 1.2));
          Render.emit(wp, V.make((Math.random() - 0.5) * 2, 1.5, 2.5), 0.14, [0.6, 0.75, 0.8, 0.7], 0.8);
        }
      }
    } else if (s.cannon !== undefined) {
      var c = ship.cannons[s.cannon];
      c.manned = true;
      c.yaw = clamp(c.yaw + input.mdx * 0.0022, -CFG.cannon.yawRange, CFG.cannon.yawRange);
      c.pitch = clamp(c.pitch - input.mdy * 0.0018, CFG.cannon.pitchMin, CFG.cannon.pitchMax);
      if (input.fireEdge) fireCannon(ship, s.cannon);
      if (input.reload) loadCannon(ship, s.cannon);
    }
  }
  function fireCannon(ship, idx) {
    var c = ship.cannons[idx];
    if (!c.loaded) { toast('火炮未装填 —— 按 R 装填（需携带炮弹）'); return; }
    var shot = ship.fireCannon(idx);
    if (!shot) return;
    stats.shots++;
    Ballistics.spawn(shot.pos, shot.vel, ship, {});
    for (var k = 0; k < 14; k++) {
      var v = V.scale(V.make(), shot.dir, 6 + Math.random() * 16);
      v.x += (Math.random() - 0.5) * 5; v.y += (Math.random() - 0.5) * 5 + 1.5; v.z += (Math.random() - 0.5) * 5;
      Render.emit(shot.pos, v, 0.5 + Math.random() * 0.9, [0.92, 0.9, 0.86, 0.85], 1.1 + Math.random(), -0.5);
    }
    Audio.boom();
    shakeCam(0.55);
  }
  function loadCannon(ship, idx) {
    var c = ship.cannons[idx];
    if (c.loaded) return;
    if (player.carry && player.carry.type === 'ball') {
      player.carry = null; c.loaded = true; c.reload = 0;
      toast('已装填！'); Audio.click();
    } else if (c.reload <= 0) {
      toast('需要携带炮弹（甲板炮弹架 E 取弹）');
    }
  }

  /* ---------- 交互（E 键） ---------- */
  function doInteract() {
    if (!player.alive) return;
    /* 交付/挖掘/拾取（陆地或船上） */
    if (player.mode === 'ship' && player.ship) {
      var ship = player.ship;
      /* 放下携带物 */
      if (player.carry && player.carry.type === 'chest') {
        ship.cargo.push({ lx: clamp(player.lp.x, -5, 6), lz: clamp(player.lp.z, -2.2, 2.2), rot: Math.random() * 6, value: player.carry.value });
        player.carry = null;
        addLog('宝箱已装船', 'good');
        return;
      }
      var st = player.findStation(ship);
      if (player.station) {
        if (player.station.cannon !== undefined) player.ship.cannons[player.station.cannon].manned = false;
        player.station = null;
        return;
      }
      if (st) {
        if (st.id === 'plank') { player.carry = { type: 'plank' }; toast('拿起木板 —— 走到破洞处按住 E 修补'); return; }
        if (st.id === 'ammo') { player.carry = { type: 'ball' }; toast('拿起炮弹 —— 到火炮旁按 R 装填'); return; }
        if (st.id === 'bucket') { player.carry = { type: 'bucket' }; toast('拿起水桶 —— 在底舱按住 E 舀水'); return; }
        if (st.id === 'map') { openMap(); return; }
        if (st.id === 'capstan') {
          if (ship.anchor.state === 'up' || ship.anchor.state === 'raising') {
            ship.toggleAnchor(); addLog('抛锚！', 'warn'); Audio.chain(); return;
          }
          player.station = st; return;
        }
        player.station = st;
        if (st.cannon !== undefined) ship.cannons[st.cannon].manned = true;
        return;
      }
      /* 甲板上的宝箱 */
      for (var i = 0; i < ship.cargo.length; i++) {
        var cg = ship.cargo[i];
        if (Math.abs(cg.lx - player.lp.x) < 1.4 && Math.abs(cg.lz - player.lp.z) < 1.4 && !player.carry) {
          player.carry = { type: 'chest', value: cg.value };
          ship.cargo.splice(i, 1);
          toast('抱起宝箱');
          return;
        }
      }
      return;
    }
    /* 陆地：挖掘 / 拾取 / 交付 */
    if (player.mode === 'land' || player.mode === 'air') {
      var op = World.getOutpost();
      if (op.deliver && player.carry && player.carry.type === 'chest' && V.dist(player.wp, op.deliver) < 4.2) {
        var val = player.carry.value || CFG.loot.chestValue;
        World.addGold(val);
        player.carry = null;
        stats.delivered++;
        addLog('交付宝箱，获得 ' + val + ' 金币！', 'good');
        toast('+' + val + ' 金币');
        Audio.coin();
        var q = World.currentQuest();
        if (q) { q.state = 'done'; World.nextQuest(); }
        var nq = World.currentQuest();
        if (nq) addLog('新委托：' + nq.text, 'good');
        save();
        return;
      }
      for (var k = 0; k < loot.length; k++) {
        var lt = loot[k];
        if (lt.taken || lt.onShip) continue;
        if (V.dist(player.wp, lt.pos) < 3.0 && !player.carry) {
          player.carry = { type: 'chest', value: lt.value };
          lt.taken = true;
          toast('抱起宝箱 —— 运回' + World.getOutpost().name);
          return;
        }
      }
    }
  }

  /* 长按 E：挖掘 / 修补 / 舀水 */
  function doHold(dt) {
    if (!player.alive) return;
    if (player.mode === 'ship' && player.ship) {
      var ship = player.ship;
      /* 修补破洞 */
      if (player.carry && player.carry.type === 'plank') {
        var br = player.findBreach(ship);
        if (br) {
          var res = ship.repairNearest(player.lp, dt);
          if (res === 'done') {
            player.carry = null;
            addLog('破洞已用木板封住', 'good');
            Audio.hammer();
          } else if (Math.random() < dt * 4) Audio.hammer();
          return true;
        }
      }
      /* 舀水 */
      if (player.carry && player.carry.type === 'bucket' && player.lp.y < Hull.DECK - 0.4 && ship.waterVol > 0.2) {
        ship.bail(dt);
        return true;
      }
      return false;
    }
    /* 挖宝 */
    if (player.mode === 'land') {
      for (var i = 0; i < digSpots.length; i++) {
        var d = digSpots[i];
        if (d.dug) continue;
        if (V.dist(player.wp, V.make(d.x, d.y, d.z)) < 3.0) {
          player.digProgress += dt / 2.6;
          if (Math.random() < dt * 8) {
            Render.emit(V.make(d.x + (Math.random() - 0.5), d.y + 0.3, d.z + (Math.random() - 0.5)),
              V.make((Math.random() - 0.5) * 2, 2 + Math.random() * 2, (Math.random() - 0.5) * 2),
              0.22, [0.62, 0.54, 0.36, 0.8], 0.9);
          }
          if (player.digProgress >= 1) {
            d.dug = true; player.digProgress = 0;
            if (d.has) {
              loot.push({ pos: V.make(d.x, d.y + 0.2, d.z), value: (World.currentQuest() ? World.currentQuest().reward : CFG.loot.chestValue), taken: false, rot: Math.random() * 6 });
              addLog('挖到宝箱！按 E 抱起', 'good');
              toast('挖到宝箱！');
              Audio.coin();
              if (Math.random() < 0.75) { lastEnemy = time - 26; }
            } else {
              addLog('只挖到一堆碎贝壳…', '');
              toast('空的坑');
            }
          }
          return true;
        }
      }
    }
    player.digProgress = Math.max(0, player.digProgress - dt);
    return false;
  }

  /* ---------- 主循环步 ---------- */
  var camShake = 0;
  function shakeCam(v) { camShake = Math.max(camShake, v); }

  function step(dt) {
    if (state !== 'play' || paused) return;
    time += dt;
    Ocean.setTime(time);
    /* 阵风 */
    gustT += dt;
    gust = 1 + Math.sin(gustT * 0.21) * 0.16 + Math.sin(gustT * 0.73 + 1.7) * 0.09;
    var w = Ocean.getWind();
    var nd = w.dir + Math.sin(time * 0.021) * CFG.wind.turnRate * dt * 60;
    Ocean.setWind(nd, w.speed);

    /* AI */
    for (var i = 1; i < ships.length; i++) {
      if (aiStates[i] && !ships[i].sunk) AI.update(ships[i], myShip, dt, aiStates[i]);
    }
    /* 船体物理 */
    for (i = 0; i < ships.length; i++) {
      ships[i].step(dt, { terrainAt: World.terrainAt, terrainNormal: World.terrainNormal, gust: gust });
      /* 船首浪花 */
      if (ships[i].speed > 1.6 && Math.random() < dt * ships[i].speed * 2.2) {
        var bow = ships[i].hullToWorld(V.make(), V.make(Hull.halfL - 0.8, -0.35, (Math.random() - 0.5) * 1.6));
        Render.emit(bow, V.make(ships[i].body.vel.x * 0.3 + (Math.random() - 0.5) * 2, 1.4 + Math.random() * 1.6, ships[i].body.vel.z * 0.3 + (Math.random() - 0.5) * 2),
          0.30 + Math.random() * 0.35, [0.92, 0.96, 0.98, 0.55], 0.85, -4.5);
      }
      /* 破洞喷水 */
      for (var bi = 0; bi < ships[i].breaches.length; bi++) {
        if (Math.random() > dt * 3) continue;
        var br = ships[i].breaches[bi];
        var d = ships[i].waterlineAt(br.p);
        if (d > 0) {
          var wpos = ships[i].hullToWorld(V.make(), br.p);
          Render.emit(wpos, V.make((Math.random() - 0.5) * 3, 0.5, (Math.random() - 0.5) * 3), 0.2, [0.8, 0.9, 0.92, 0.5], 0.7, -3);
        }
      }
    }
    /* 弹道 */
    Ballistics.step(dt, ships, player, onBallEvent);
    /* 玩家 */
    if (player.station) operateStation(dt);
    player.step(dt, input, { terrainAt: World.terrainAt, walkHeightAt: World.walkHeightAt }, ships);
    if (input.use) doHold(dt);
    /* 溺水/受伤恢复 */
    if (player.hp < 100 && player.alive) player.hp = Math.min(100, player.hp + dt * 1.6);
    if (!player.alive && state === 'play') { state = 'dead'; deadT = 0; addLog('你倒下了…', 'bad'); }
    /* 沉船处理 */
    for (i = ships.length - 1; i >= 0; i--) {
      var sh = ships[i];
      if (!sh.sunk) continue;
      if (sh === myShip) {
        if (player.ship === myShip) player.leaveShip();
        addLog('黑砂号沉没了！游到前哨或等待救援船', 'bad');
        respawnT = 6;
        ships.splice(i, 1); aiStates.splice(i, 1);
        myShip = null;
      } else {
        stats.sunk++;
        enemyCount = Math.max(0, enemyCount - 1);
        addLog('骷髅船沉没！掠夺物浮上水面', 'good');
        /* 掉落战利品 */
        loot.push({ pos: V.make(sh.body.pos.x, 0.2, sh.body.pos.z), value: CFG.loot.cargoValue, taken: false, floating: true, rot: 0 });
        ships.splice(i, 1); aiStates.splice(i, 1);
      }
    }
    /* 救援船 */
    if (!myShip && respawnT > 0) {
      respawnT -= dt;
      if (respawnT <= 0) {
        var op = World.getOutpost();
        var moor = op.mooring || V.make(op.pos.x + op.radius + 60, 0, op.pos.z);
        myShip = new Ship({ pos: V.make(moor.x, 0.0, moor.z), yaw: Math.atan2(moor.z - op.pos.z, moor.x - op.pos.x) + Math.PI * 0.5, name: '黑砂号' });
        ships.unshift(myShip); aiStates.unshift(null);
        addLog('前哨派来一艘新船，停在码头', 'good');
        toast('新船已停靠码头');
      }
    }
    /* 敌船生成 */
    if (myShip && time - lastEnemy > 95 + Math.random() * 40) {
      lastEnemy = time;
      if (World.gold() > 0 || stats.delivered > 0 || Math.random() < 0.6) spawnEnemy();
    }
    /* 漂浮战利品跟随水面 */
    for (i = 0; i < loot.length; i++) {
      var lt = loot[i];
      if (lt.taken) continue;
      if (lt.floating) lt.pos.y = Ocean.height(lt.pos.x, lt.pos.z) + 0.1;
    }
    /* 粒子 */
    Render.stepParticles(dt);
    if (camShake > 0) camShake = Math.max(0, camShake - dt * 1.6);
    /* 提示计时 */
    if (msgT > 0) msgT -= dt;
    for (i = 0; i < log.length; i++) log[i].t += dt;
    /* 世界边界 */
    if (myShip) {
      var dc = Math.sqrt(myShip.body.pos.x * myShip.body.pos.x + myShip.body.pos.z * myShip.body.pos.z);
      if (dc > CFG.world.boundary) {
        var n = V.norm(V.make(), V.make(-myShip.body.pos.x, 0, -myShip.body.pos.z));
        myShip.body.addForce(V.scale(V.make(), n, myShip.body.mass * 1.4));
        if (Math.random() < dt) toast('风暴带！调头返回海域');
      }
    }
    /* 死亡复活 */
    if (state === 'dead') {
      deadT += dt;
      if (deadT > 4.5) respawnPlayer();
    }
    stats.dist += (myShip ? myShip.speed : 0) * dt;

  }
  function respawnPlayer() {
    player.alive = true; player.hp = 100; player.breath = 1; player.carry = null;
    state = 'play';
    if (myShip) player.boardShip(myShip, V.make(-3.2, Hull.DECK, 0));
    else {
      var op = World.getOutpost();
      V.set(player.wp, op.deliver ? op.deliver.x : op.pos.x, (op.deliver ? op.deliver.y : 4) + 1, op.deliver ? op.deliver.z + 3 : op.pos.z);
      player.mode = 'land'; player.ship = null;
    }
    addLog('你在前哨的酒馆里醒来', '');
  }
  function onBallEvent(ev) {
    if (ev.type === 'shipHit') {
      Audio.hit();
      if (ev.shooter === myShip) { stats.hits++; toast(ev.breach ? '命中水线！敌舰进水' : '命中！'); }
      if (ev.ship === myShip) { addLog(ev.breach ? '我舰水线被击穿，正在进水！' : '我舰被命中！', 'bad'); shakeCam(0.9); }
      for (var i = 0; i < 16; i++) {
        Render.emit(ev.at, V.make((Math.random() - 0.5) * 8, Math.random() * 6, (Math.random() - 0.5) * 8),
          0.28 + Math.random() * 0.4, [0.45, 0.34, 0.22, 0.9], 1.0 + Math.random(), -6);
      }
    } else if (ev.type === 'water') {
      if (!ev.bounce) {
        for (var k = 0; k < 12; k++) {
          Render.emit(ev.at, V.make((Math.random() - 0.5) * 5, 4 + Math.random() * 7, (Math.random() - 0.5) * 5),
            0.30 + Math.random() * 0.5, [0.88, 0.94, 0.96, 0.75], 1.0 + Math.random() * 0.6, -7);
        }
        Audio.splash();
      } else {
        for (k = 0; k < 5; k++) Render.emit(ev.at, V.make((Math.random() - 0.5) * 3, 2 + Math.random() * 3, (Math.random() - 0.5) * 3), 0.2, [0.9, 0.95, 0.97, 0.6], 0.6, -6);
      }
    } else if (ev.type === 'playerHit') {
      player.hp -= ev.dmg; shakeCam(1.2); Audio.hit();
      addLog('你被炮弹擦中！', 'bad');
      if (player.hp <= 0) player.alive = false;
    } else if (ev.type === 'ground') {
      for (k = 0; k < 10; k++) Render.emit(ev.at, V.make((Math.random() - 0.5) * 6, 2 + Math.random() * 5, (Math.random() - 0.5) * 6), 0.3, [0.66, 0.58, 0.42, 0.7], 1.1, -6);
    }
  }

  /* ---------- 存档 ---------- */
  function save() {
    try {
      var d = {
        v: CFG.version, seed: seed, time: time, gold: World.gold(), qi: World.questIndex(),
        stats: stats, digs: digSpots.map(function (x) { return x.dug ? 1 : 0; }),
        ship: myShip ? {
          p: [myShip.body.pos.x, myShip.body.pos.y, myShip.body.pos.z],
          q: [myShip.body.q.x, myShip.body.q.y, myShip.body.q.z, myShip.body.q.w],
          hp: myShip.hp, water: myShip.waterVol,
          br: myShip.breaches.map(function (b) { return [b.p.x, b.p.y, b.p.z, b.size]; }),
          cargo: myShip.cargo.map(function (c) { return [c.lx, c.lz, c.value]; }),
          sail: myShip.sail.hoistTarget, trim: myShip.sail.trimTarget, anchor: myShip.anchor.state
        } : null,
        loot: loot.filter(function (l) { return !l.taken; }).map(function (l) { return [l.pos.x, l.pos.z, l.value, l.floating ? 1 : 0]; }),
        carry: player && player.carry ? player.carry : null
      };
      localStorage.setItem(CFG.saveKey, JSON.stringify(d));
    } catch (e) { }
  }
  function hasSave() {
    try { var d = JSON.parse(localStorage.getItem(CFG.saveKey)); return !!(d && d.seed !== undefined); } catch (e) { return false; }
  }
  function load() {
    var d;
    try { d = JSON.parse(localStorage.getItem(CFG.saveKey)); } catch (e) { return false; }
    if (!d) return false;
    newGame(d.seed);
    time = d.time || 0; Ocean.setTime(time);
    World.setGold(d.gold || 0);
    World.setQuestIndex(d.qi || 0);
    stats = d.stats || stats;
    if (d.digs) for (var i = 0; i < digSpots.length && i < d.digs.length; i++) digSpots[i].dug = !!d.digs[i];
    if (d.ship && myShip) {
      V.set(myShip.body.pos, d.ship.p[0], d.ship.p[1], d.ship.p[2]);
      myShip.body.q.x = d.ship.q[0]; myShip.body.q.y = d.ship.q[1]; myShip.body.q.z = d.ship.q[2]; myShip.body.q.w = d.ship.q[3];
      myShip.hp = d.ship.hp; myShip.waterVol = d.ship.water || 0;
      myShip.breaches = (d.ship.br || []).map(function (b, k) { return { p: V.make(b[0], b[1], b[2]), size: b[3], id: 'ld' + k, repair: 0 }; });
      myShip.cargo = (d.ship.cargo || []).map(function (c) { return { lx: c[0], lz: c[1], value: c[2], rot: 0 }; });
      myShip.setSailHoist(d.ship.sail || 0);
      myShip.sail.trimTarget = d.trim || 0;
      player.boardShip(myShip, V.make(-3.2, Hull.DECK, 0));
    }
    loot.length = 0;
    if (d.loot) for (i = 0; i < d.loot.length; i++) {
      loot.push({ pos: V.make(d.loot[i][0], 0.2, d.loot[i][1]), value: d.loot[i][2], taken: false, floating: !!d.loot[i][3], rot: 0 });
    }
    if (d.carry) player.carry = d.carry;
    state = 'play';
    addLog('继续航程', 'good');
    return true;
  }
  function clearSave() { try { localStorage.removeItem(CFG.saveKey); } catch (e) { } }

  var mapOpen = false;
  function openMap() { mapOpen = true; }
  function closeMap() { mapOpen = false; }

  return {
    newGame: newGame, step: step, save: save, load: load, hasSave: hasSave, clearSave: clearSave,
    input: input, getPlayer: function () { return player; }, getShips: function () { return ships; },
    myShip: function () { return myShip; }, getLoot: function () { return loot; }, getDigs: function () { return digSpots; },
    getState: function () { return state; }, setState: function (s) { state = s; },
    getLog: function () { return log; }, getMsg: function () { return { s: msg, t: msgT }; },
    getStats: function () { return stats; }, getTime: function () { return time; }, getSeed: function () { return seed; },
    interact: doInteract, shake: function () { return camShake; }, shakeCam: shakeCam,
    isPaused: function () { return paused; }, setPaused: function (p) { paused = p; },
    mapOpen: function () { return mapOpen; }, openMap: openMap, closeMap: closeMap,
    toast: toast, addLog: addLog, spawnEnemy: spawnEnemy, respawn: respawnPlayer,
    gust: function () { return gust; }
  };
})();

var Input = (function () {
  var keys = {}, locked = false, canvas = null, sens = 0.0022, mdx = 0, mdy = 0, invert = false;
  function init(cv) {
    canvas = cv;
    document.addEventListener('keydown', function (e) {
      if (e.repeat) { return; }
      keys[e.code] = 1;
      onKeyDown(e);
    });
    document.addEventListener('keyup', function (e) { keys[e.code] = 0; });
    canvas.addEventListener('mousedown', function (e) {
      Audio.resume();
      if (!locked && Game.getState() === 'play') { requestLock(); return; }
      if (e.button === 0) { Game.input.fire = 1; Game.input.fireEdge = 1; }
      if (e.button === 2) { Game.input.aim = 1; }
    });
    document.addEventListener('mouseup', function (e) {
      if (e.button === 0) Game.input.fire = 0;
      if (e.button === 2) Game.input.aim = 0;
    });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('mousemove', function (e) {
      if (!locked) return;
      mdx += e.movementX || 0; mdy += e.movementY || 0;
    });
    document.addEventListener('pointerlockchange', function () {
      locked = (document.pointerLockElement === canvas);
      if (!locked && Game.getState() === 'play' && !Game.mapOpen()) Game.setPaused(true);
    });
    window.addEventListener('blur', function () { keys = {}; });
  }
  function requestLock() {
    try { var pr = canvas.requestPointerLock(); if (pr && pr.catch) pr.catch(function () { }); } catch (e) { }
  }
  function onKeyDown(e) {
    var p = Game.getPlayer();
    if (e.code === 'Escape') {
      if (Game.mapOpen()) { Game.closeMap(); return; }
      Game.setPaused(!Game.isPaused());
      if (Game.isPaused()) { try { document.exitPointerLock(); } catch (er) { } Boot.pauseMenu(); }
      else { Boot.hideMenu(); requestLock(); }
      e.preventDefault(); return;
    }
    if (Game.getState() !== 'play' || Game.isPaused()) return;
    if (e.code === 'KeyE') {
      if (Game.mapOpen()) { Game.closeMap(); return; }
      Game.interact();
    }
    if (e.code === 'KeyM') { if (Game.mapOpen()) Game.closeMap(); else Game.openMap(); }
    if (e.code === 'KeyR') Game.input.reload = 1;
    if (e.code === 'KeyF') Audio.setOn(!Audio.isOn());
  }
  function poll() {
    var i = Game.input;
    i.fwd = keys['KeyW'] || keys['ArrowUp'] ? 1 : 0;
    i.back = keys['KeyS'] || keys['ArrowDown'] ? 1 : 0;
    i.left = keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0;
    i.right = keys['KeyD'] || keys['ArrowRight'] ? 1 : 0;
    i.jump = keys['Space'] ? 1 : 0;
    i.run = keys['ShiftLeft'] || keys['ShiftRight'] ? 1 : 0;
    i.use = keys['KeyE'] ? 1 : 0;
    i.mdx = mdx; i.mdy = mdy;
    mdx = 0; mdy = 0;
    return i;
  }
  function applyLook(player) {
    var i = Game.input;
    if (!player) return;
    /* 掌舵/操炮时鼠标用于设备，仍允许有限视角 */
    var st = player.station;
    var f = (st && (st.cannon !== undefined)) ? 0.25 : (st && st.id === 'helm' ? 0.55 : 1);
    player.yaw = wrapPi(player.yaw + i.mdx * sens * f);
    player.pitch = clamp(player.pitch - i.mdy * sens * f * (invert ? -1 : 1), -1.45, 1.45);
  }
  function clearEdges() { Game.input.fireEdge = 0; Game.input.reload = 0; }
  return { init: init, poll: poll, applyLook: applyLook, clearEdges: clearEdges, isLocked: function () { return locked; }, requestLock: requestLock, keys: keys };
})();

/* ========================= 22. BOOT ========================= */
var Boot = (function () {
  var last = 0, acc = 0, rafId = 0, cam = { pos: V.make(), yaw: 0, pitch: 0, q: Q.make() }, started = false, menuT = 0;
  function mainMenu() {
    HUD.showMenu(true);
    HUD.show(false);
    var has = Game.hasSave();
    HUD.menu(
      '<div class="mrow"><button class="btn big" data-a="new">新的航程</button></div>' +
      (has ? '<div class="mrow"><button class="btn" data-a="cont">继续航程</button></div>' : '') +
      '<div class="mrow"><button class="btn ghost" data-a="help">操作说明</button></div>' +
      '<div class="mnote">WASD 走动 · 鼠标看 · E 交互 · 空格跳 · Shift 疾走 · M 海图 · Esc 菜单<br>' +
      '这不是"上车驾驶"：升帆 → 调帆角 → 掌舵 → 起锚，四件事都得亲手做。</div>');
    bindMenu();
  }
  function pauseMenu() {
    HUD.showMenu(true);
    HUD.menu(
      '<div class="mrow"><button class="btn big" data-a="resume">返回甲板</button></div>' +
      '<div class="mrow"><button class="btn" data-a="save">存档</button><button class="btn ghost" data-a="help">操作说明</button></div>' +
      '<div class="mrow"><button class="btn ghost" data-a="quit">放弃航程</button></div>' +
      '<div class="mnote">种子 ' + Game.getSeed() + '　航行 ' + (Game.getStats().dist / 1000).toFixed(2) + ' km　击沉 ' + Game.getStats().sunk + '　交付 ' + Game.getStats().delivered + '</div>');
    bindMenu();
  }
  function helpMenu() {
    HUD.showMenu(true);
    HUD.menu(
      '<div class="help">' +
      '<h3>怎么开船（真实帆船流程）</h3>' +
      '<p>1. 走到<b>绞盘</b>（船头）按 E <b>起锚</b>：按住 W 转绞盘直到锚完全收起。</p>' +
      '<p>2. 走到<b>升帆索</b>（主桅右侧）按 E，按住 W <b>升帆</b>。</p>' +
      '<p>3. 走到<b>左/右舷帆索</b>按 E，按住 W <b>调整收帆角</b>，让帆吃满风（仪表上的黄标是最佳角度；帆抖动=角度不对）。</p>' +
      '<p>4. 走到船尾<b>舵轮</b>按 E，A/D 转舵。逆风无法前进，需要走 Z 字抢风。</p>' +
      '<h3>战斗与损管</h3>' +
      '<p>· <b>火炮</b>：从炮弹架 E 取弹 → 到炮位 E 上炮 → R 装填 → 鼠标瞄准 → 左键开火。炮弹受重力与空气阻力影响，远距离要抬高仰角；平射会在水面跳弹。</p>' +
      '<p>· 水线附近被击穿会<b>破洞进水</b>：从木板堆 E 取木板 → 到破洞（多在底舱）按住 E 封堵 → 用<b>抽水泵</b>或水桶排水。</p>' +
      '<p>· 进水会让船吃水加深、稳性变差，最终沉没。</p>' +
      '<h3>赚钱</h3>' +
      '<p>海图（M）上红叉是委托岛。上岛找沙丘按住 E 挖宝，抱回船上（E 放下），航行回前哨的交付台按 E 交付。</p>' +
      '<h3>按键</h3>' +
      '<p>WASD 移动 · Shift 疾走 · 空格 跳/上浮 · E 交互/长按 · R 装填 · 左键 开火 · M 海图 · F 静音 · Esc 菜单</p>' +
      '</div><div class="mrow"><button class="btn" data-a="back">返回</button></div>');
    bindMenu();
  }
  function bindMenu() {
    var btns = document.querySelectorAll('#menuBody [data-a]');
    Array.prototype.forEach.call(btns, function (b) {
      b.addEventListener('click', function () {
        Audio.resume(); Audio.click();
        var a = b.dataset.a;
        if (a === 'new') { startGame(null); }
        else if (a === 'cont') { if (Game.load()) { hideMenu(); HUD.show(true); Input.requestLock(); Game.setPaused(false); } else startGame(null); }
        else if (a === 'help') helpMenu();
        else if (a === 'back') { if (Game.getState() === 'play') pauseMenu(); else mainMenu(); }
        else if (a === 'resume') { hideMenu(); Game.setPaused(false); Input.requestLock(); }
        else if (a === 'save') { Game.save(); Game.toast('已存档'); pauseMenu(); }
        else if (a === 'quit') { Game.clearSave(); Game.setState('menu'); HUD.show(false); mainMenu(); }
      });
    });
  }
  function hideMenu() { HUD.showMenu(false); }
  function startGame(seed) {
    HUD.loading(true, '正在生成海域…');
    setTimeout(function () {
      Game.newGame(seed);
      HUD.loading(false);
      hideMenu();
      HUD.show(true);
      Game.setPaused(false);
      Input.requestLock();
    }, 30);
  }

  function updateCamera(dt) {
    var p = Game.getPlayer();
    if (!p) return;
    p.eyePos(cam.pos);
    p.viewQuat(cam.q);
    /* 由四元数取 yaw/pitch 供视图矩阵使用 */
    var f = Q.rotate(V.make(), cam.q, V.make(0, 0, -1));
    cam.yaw = Math.atan2(-f.x, -f.z);
    cam.pitch = Math.asin(clamp(f.y, -1, 1));
    var sh = Game.shake();
    if (sh > 0) {
      cam.pos.x += (Math.random() - 0.5) * sh * 0.22;
      cam.pos.y += (Math.random() - 0.5) * sh * 0.22;
      cam.pos.z += (Math.random() - 0.5) * sh * 0.22;
      cam.yaw += (Math.random() - 0.5) * sh * 0.012;
      cam.pitch += (Math.random() - 0.5) * sh * 0.012;
    }
  }

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    var now = ts * 0.001;
    if (!last) last = now;
    var dt = Math.min(0.1, now - last);
    last = now;
    var inp = Input.poll();
    if (Game.getState() === 'play' && !Game.isPaused() && !Game.mapOpen()) {
      Input.applyLook(Game.getPlayer());
      acc += dt;
      var steps = 0;
      while (acc >= CFG.phys.dt && steps < CFG.phys.maxSteps) {
        Game.step(CFG.phys.dt);
        acc -= CFG.phys.dt;
        steps++;
      }
      if (acc > CFG.phys.dt * CFG.phys.maxSteps) acc = 0;
    } else if (Game.mapOpen()) {
      Input.applyLook(null);
    }
    Input.clearEdges();
    if (Game.getState() === 'menu') {
      /* 标题画面：缓慢环绕前哨的展示镜头 */
      menuT += dt;
      Ocean.setTime(Ocean.getTime() + dt);
      var op = World.getOutpost();
      if (op && Render.isReady()) {
        var ang = menuT * 0.055;
        V.set(cam.pos, op.pos.x + Math.cos(ang) * 285, 26 + Math.sin(menuT * 0.21) * 3, op.pos.z + Math.sin(ang) * 285);
        cam.yaw = Math.atan2(op.pos.z - cam.pos.z, op.pos.x - cam.pos.x);
        cam.pitch = -0.10;
        Render.stepParticles(dt);
        Render.frame(cam, [], null, dt, {});
      }
    } else {
      updateCamera(dt);
      if (Render.isReady()) {
        Render.frame(cam, Game.getShips(), Game.getPlayer(), dt, { loot: Game.getLoot(), digSpots: Game.getDigs() });
      }
      HUD.update(dt);
    }
    var my = Game.myShip();
    Audio.setAmbience(Ocean.getWind().speed, Ocean.getWind().sea, my ? my.speed : 0);
  }

  function start() {
    var cv = document.getElementById('gl');
    HUD.init();
    HUD.loading(true, '正在建造船坞…');
    var okGL = false;
    try { okGL = Render.init(cv); } catch (e) { console.error(e); }
    if (!okGL) {
      HUD.loading(true, '你的浏览器不支持 WebGL2，无法运行本作。');
      return;
    }
    Input.init(cv);
    World.generate(CFG.world.seed);
    Render.buildWorldGfx();
    HUD.loading(false);
    mainMenu();
    started = true;
    rafId = requestAnimationFrame(loop);
  }
  return { start: start, mainMenu: mainMenu, pauseMenu: pauseMenu, hideMenu: hideMenu, helpMenu: helpMenu, startGame: startGame };
})();

(function () {
  function go() {
    try { Boot.start(); }
    catch (e) {
      console.error('启动失败', e);
      var d = document.getElementById('loading');
      if (d) { d.classList.remove('hidden'); d.textContent = '启动失败：' + (e && e.message ? e.message : e); }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();

window.PIRATE = {
  CFG: CFG, V: V, Q: Q, M4: M4, Ocean: Ocean, Body: Body, Hull: Hull, Ship: Ship, World: World,
  Ballistics: Ballistics, Player: Player, STATIONS: STATIONS, AI: AI, Game: Game, Render: Render,
  HUD: HUD, Input: Input, Boot: Boot, Audio: Audio, version: CFG.version
};
//%%JS%%
</script>
