<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>怒海掠影 · SALT &amp; POWDER</title>
<style>

:root{
  --ink:#f2e4c0; --brass:#c9a227; --brass2:#8a6b18; --wood:#3a2717; --wood2:#241708;
  --danger:#e2564a; --good:#7fe0a0; --sea:#0e2c3a;
  --font:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Bahnschrift Condensed","DIN Alternate",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05080a}
body{font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;cursor:default}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:13px}
#crosshair{
  position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  border:1.5px solid rgba(255,240,205,.55);border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 0 3px rgba(0,0,0,.5);
}
#crosshair::before,#crosshair::after{
  content:"";position:absolute;background:rgba(255,240,205,.65);
}
#crosshair::before{left:50%;top:-7px;width:1.5px;height:5px;margin-left:-.75px}
#crosshair::after{top:50%;left:-7px;height:1.5px;width:5px;margin-top:-.75px}

#compassWrap{position:absolute;left:50%;top:10px;transform:translateX(-50%);
  border:1px solid rgba(201,162,39,.45);border-radius:6px;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.5);background:rgba(8,12,16,.35)}
#compass{display:block;opacity:.95}

#prompt{
  position:absolute;left:50%;top:58%;transform:translateX(-50%);
  padding:8px 16px;border-radius:8px;background:linear-gradient(180deg,rgba(28,20,10,.88),rgba(14,10,5,.92));
  border:1px solid rgba(201,162,39,.5);font-size:14px;letter-spacing:.4px;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:78vw;
}
#prompt b{color:var(--brass);font-family:var(--mono);font-size:15px}
#prompt .ph{display:block;font-size:11.5px;opacity:.72;margin-top:2px}

#stationPanel{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);min-width:280px;text-align:center;
  padding:10px 18px;border-radius:10px;background:linear-gradient(180deg,rgba(30,22,11,.92),rgba(15,11,6,.94));
  border:1px solid rgba(201,162,39,.55);box-shadow:0 8px 26px rgba(0,0,0,.65);
}
#stationPanel .sp-t{font-size:16px;font-weight:700;color:var(--brass);letter-spacing:2px}
#stationPanel .sp-h{font-size:12px;opacity:.8;margin-top:3px}
#stationPanel .sp-e{font-family:var(--mono);font-size:14px;margin-top:6px;color:#fff3d0}
#stationPanel .sp-x{font-size:11px;opacity:.55;margin-top:5px}

#leftGauges{position:absolute;left:12px;bottom:12px;width:250px}
#rightInfo{position:absolute;right:12px;bottom:12px;width:230px;text-align:right}
#leftGauges,#rightInfo{
  padding:10px 12px;border-radius:10px;
  background:linear-gradient(180deg,rgba(22,16,8,.72),rgba(10,7,4,.80));
  border:1px solid rgba(201,162,39,.32);box-shadow:0 6px 18px rgba(0,0,0,.45);
}
.g-row{display:flex;align-items:center;gap:7px;margin:3px 0;font-size:11.5px}
#rightInfo .g-row{justify-content:flex-end}
.g-lab{width:34px;opacity:.72;flex:0 0 auto;letter-spacing:1px}
.g-bar{position:relative;flex:1 1 auto;height:9px;border-radius:5px;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.10);overflow:hidden}
.g-bar>i{display:block;height:100%;border-radius:4px}
.g-bar.trim{overflow:visible;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06))}
.g-bar.trim>i{position:absolute;top:-3px;width:4px;height:15px;border-radius:2px;background:#f4e3ad;margin-left:-2px;box-shadow:0 0 6px rgba(244,227,173,.7)}
.g-bar.trim>b{position:absolute;top:-6px;width:2px;height:21px;background:#ffcf5d;margin-left:-1px;opacity:.85}
.g-val{width:56px;text-align:right;font-family:var(--mono);font-size:12px;flex:0 0 auto;color:#fff3d0}
.g-val2{font-family:var(--mono);font-size:12px;color:#fff3d0}
.g-wind{flex:1 1 auto;text-align:center}
.g-wind>i{display:inline-block;font-style:normal;color:#7fd8ff;font-size:15px;text-shadow:0 0 8px rgba(127,216,255,.7)}
.g-warn{margin-top:4px;font-size:11.5px;color:#ffcf5d;letter-spacing:.5px}
.i-gold{font-family:var(--mono);font-size:20px;color:var(--brass);text-shadow:0 0 10px rgba(201,162,39,.5);margin-bottom:4px}
.i-carry{margin-top:5px;font-size:12px;color:#ffe6a8}

#objective{
  position:absolute;left:50%;top:52px;transform:translateX(-50%);
  padding:6px 14px;border-radius:20px;background:rgba(10,14,18,.55);
  border:1px solid rgba(201,162,39,.28);font-size:12.5px;white-space:nowrap;
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
#objective b{color:var(--brass)}

#logLines{position:absolute;left:12px;top:12px;width:330px;display:flex;flex-direction:column;gap:3px}
.lg{padding:4px 9px;border-radius:6px;background:rgba(8,10,14,.6);font-size:12px;border-left:2px solid rgba(201,162,39,.6)}
.lg.good{border-left-color:var(--good);color:#d8ffe8}
.lg.bad{border-left-color:var(--danger);color:#ffd8d4}
.lg.warn{border-left-color:#ffcf5d}
.lg.big{font-size:15px;font-weight:700;background:rgba(20,14,6,.8);border-left-color:var(--brass);color:#ffeeb8}

#damageList{position:absolute;left:50%;top:80px;transform:translateX(-50%);text-align:center}
.alarm{margin:3px 0;padding:5px 14px;border-radius:6px;font-size:13px;
  background:rgba(120,26,20,.72);border:1px solid rgba(226,86,74,.6);color:#ffe0dc;
  animation:pulse 1.5s ease-in-out infinite}
.alarm.big{font-size:17px;font-weight:700;letter-spacing:2px}
@keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}

#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 120%);opacity:.32;transition:opacity .4s}
#waterOverlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(ellipse at center,rgba(20,90,110,.35),rgba(4,32,44,.72));
  box-shadow:inset 0 0 140px rgba(0,40,60,.8)}

/* ---------- 海图 ---------- */
#map2d{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
  border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.8);border:2px solid #6b4f22}

/* ---------- 菜单 ---------- */
#menu{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:
    radial-gradient(ellipse at 50% 15%,rgba(10,20,30,.35),transparent 62%),
    linear-gradient(180deg,rgba(6,12,17,.62),rgba(4,8,11,.86));
  backdrop-filter:blur(2px);
}
#menu::before{
  content:"";position:absolute;inset:0;opacity:.20;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);
}
.menu-inner{position:relative;width:min(92vw,620px);padding:28px 30px 24px;text-align:center;
  background:linear-gradient(180deg,rgba(30,22,12,.94),rgba(12,9,5,.96));
  border:1px solid rgba(201,162,39,.45);border-radius:14px;
  box-shadow:0 24px 70px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
  max-height:92vh;overflow:auto}
.brand-mark svg{width:82px;height:82px;filter:drop-shadow(0 0 12px rgba(201,162,39,.4))}
.menu-inner h1{font-size:clamp(30px,6vw,46px);letter-spacing:10px;font-weight:800;margin-top:4px;
  background:linear-gradient(180deg,#fff6d8,var(--brass) 60%,#6d5210);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11.5px;letter-spacing:3px;opacity:.66;margin:2px 0 18px}
.mrow{display:flex;gap:10px;justify-content:center;margin:9px 0;flex-wrap:wrap}
.btn{
  font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;
  padding:11px 26px;border-radius:9px;border:1px solid rgba(201,162,39,.55);color:#1a1206;
  background:linear-gradient(180deg,#e8cf7a,#b8912c);
  box-shadow:0 4px 0 #6b5013,0 8px 18px rgba(0,0,0,.5);
  transition:transform .12s,box-shadow .12s,filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 6px 0 #6b5013,0 12px 22px rgba(0,0,0,.55)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b5013}
.btn.big{font-size:18px;padding:14px 34px}
.btn.ghost{background:linear-gradient(180deg,rgba(201,162,39,.16),rgba(201,162,39,.05));color:var(--ink);
  box-shadow:0 3px 0 rgba(0,0,0,.4)}
.btn.ghost:hover{background:linear-gradient(180deg,rgba(201,162,39,.28),rgba(201,162,39,.1))}
.mnote{margin-top:16px;font-size:11.5px;line-height:1.7;opacity:.62}
.help{text-align:left;max-height:56vh;overflow:auto;padding-right:6px}
.help h3{color:var(--brass);font-size:14px;letter-spacing:1.5px;margin:12px 0 5px}
.help p{font-size:12.5px;line-height:1.66;opacity:.86;margin:3px 0}
.help b{color:#ffe6a8}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
  background:#070b0e;color:var(--brass);font-size:15px;letter-spacing:3px}
@media (max-width:760px){
  #leftGauges{width:190px;font-size:11px}#rightInfo{width:170px}
  #logLines{width:220px}#compass{width:340px}
}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="map2d" class="hidden"></canvas>
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="compassWrap"><canvas id="compass" width="520" height="34"></canvas></div>
  <div id="prompt" class="hidden"></div>
  <div id="stationPanel" class="hidden"></div>
  <div id="leftGauges"></div>
  <div id="rightInfo"></div>
  <div id="objective"></div>
  <div id="damageList"></div>
  <div id="logLines"></div>
  <div id="vignette"></div>
  <div id="waterOverlay"></div>
</div>
<div id="menu">
  <div class="menu-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#d9b26a" stroke-width="3"/>
          <path d="M60 14v92M14 60h92" stroke="#d9b26a" stroke-width="2" opacity=".55"/>
          <path d="M60 20 74 60 60 100 46 60z" fill="#d9b26a" opacity=".9"/>
          <path d="M20 60 60 46 100 60 60 74z" fill="#8d6b33" opacity=".9"/>
        </svg>
      </div>
      <h1>怒海掠影</h1>
      <p class="sub">S A L T &nbsp;&amp;&nbsp; P O W D E R　—　真实水动力海盗帆船</p>
    </div>
    <div id="menuBody"></div>
  </div>
</div>
<div id="loading">正在建造船坞…</div>
<script>

/* ============================================================================
   怒海掠影 · SALT & POWDER
   单文件 WebGL2 海盗帆船模拟 —— 真实水动力 / 六自由度刚体船 / 多操纵器具
   模块: CONFIG · MATH · OCEAN · BODY(刚体) · HULL(船体几何/浮力采样) · SHIP
         · BALLISTICS · PLAYER · WORLD · AI · RENDER · HUD · INPUT · GAME
   ========================================================================== */
'use strict';

/* ========================= 1. CONFIG ========================= */
var CFG = {
  version: '1.0.0',
  saveKey: 'saltpowder.save.v1',

  phys: {
    g: 9.81,
    rhoWater: 1025,      /* kg/m^3 海水 */
    rhoAir: 1.225,
    dt: 1 / 120,         /* 固定物理步长 */
    maxSteps: 6,
    linDamp: 0.02,
    angDamp: 0.10
  },

  ocean: {
    /* 波长(m) / 振幅(m) / Gerstner 陡度 / 相对风向偏角(度) */
    waves: [
      { len: 84.0, amp: 0.70, steep: 0.62, deg: 0 },
      { len: 51.0, amp: 0.46, steep: 0.58, deg: 21 },
      { len: 31.0, amp: 0.28, steep: 0.54, deg: -27 },
      { len: 18.5, amp: 0.16, steep: 0.48, deg: 44 },
      { len: 10.5, amp: 0.085, steep: 0.42, deg: -57 },
      { len: 6.0, amp: 0.045, steep: 0.36, deg: 73 }
    ],
    seaState: 1.0,       /* 0.5 平静 · 1 常态 · 1.9 风暴 */
    invIters: 3          /* CPU 反解 Gerstner 迭代次数 */
  },

  wind: { dir: 0.7, speed: 9.0, gust: 2.4, turnRate: 0.012 },

  ship: {
    len: 18.0, beam: 6.3, depth: 3.7,
    deckY: 1.05,          /* 主甲板高度（相对设计水线） */
    holdY: -1.55,         /* 底舱地板 */
    mass: 70000,          /* kg（含压载）—— 与水线下排水体积匹配 */
    cgY: 0.0,             /* 重心（设计水线处；实际浮心更低 => 稳定） */
    inertiaMul: { roll: 1.75, pitch: 1.45, yaw: 1.30 },
    sample: 0.92,         /* 浮力采样体元边长(m) */
    cd: { x: 0.0080, y: 0.86, z: 0.95 },  /* 船体局部三轴阻力系数（x=纵向 z=横向抗漂） */
    rollDamp: 2.4e6, pitchDamp: 7.0e6, yawDamp: 2.4e6,
    sail: { area: 192, height: 6.4, maxTrim: 1.48, hoistRate: 0.30, trimRate: 0.85 },
    rudder: { area: 5.8, maxAngle: 0.66, rate: 1.6, x: -8.6 },
    anchor: { holdForce: 2.1e5, chain: 46, rate: 0.34 },
    hull: { hp: 1000 },
    water: { capacity: 46, ingressPerBreach: 0.30, pumpRate: 1.05, bailRate: 0.55 },
    repair: { plankTime: 1.5 }
  },

  cannon: {
    muzzle: 92, mass: 6.2, radius: 0.062, cd: 0.47,
    reload: 3.4, yawRange: 0.72, pitchMin: -0.18, pitchMax: 0.45,
    damage: 105, splashRadius: 2.2
  },

  player: {
    eye: 1.66, radius: 0.32, height: 1.80,
    walk: 4.0, run: 6.6, swim: 2.1, jump: 4.4,
    accel: 42, airAccel: 6, friction: 11,
    maxSlope: 0.62
  },

  world: {
    size: 3000, islandCount: 7, seed: 20240611,
    boundary: 2650, viewDist: 2200
  },

  loot: { chestValue: 420, cargoValue: 160 },
  render: { fov: 68, near: 0.25, far: 3000, oceanRings: 9, oceanRes: 96 }
};

/* ========================= 2. MATH ========================= */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function sign(x) { return x < 0 ? -1 : (x > 0 ? 1 : 0); }
function wrapPi(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function moveToward(cur, target, rate, dt) {
  var d = target - cur, m = rate * dt;
  return Math.abs(d) <= m ? target : cur + sign(d) * m;
}
function deg(r) { return r * 180 / Math.PI; }
function rad(d) { return d * Math.PI / 180; }

/* 可复现随机数 */
function Rng(seed) { this.s = (seed >>> 0) || 1; }
Rng.prototype.next = function () {
  this.s = this.s + 0x6D2B79F5 | 0;
  var t = Math.imul(this.s ^ this.s >>> 15, 1 | this.s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
Rng.prototype.range = function (a, b) { return a + this.next() * (b - a); };
Rng.prototype.int = function (n) { return Math.floor(this.next() * n); };

/* --- Vec3 (对象式 {x,y,z}) --- */
var V = {
  make: function (x, y, z) { return { x: x || 0, y: y || 0, z: z || 0 }; },
  set: function (o, x, y, z) { o.x = x; o.y = y; o.z = z; return o; },
  copy: function (o, a) { o.x = a.x; o.y = a.y; o.z = a.z; return o; },
  clone: function (a) { return { x: a.x, y: a.y, z: a.z }; },
  add: function (o, a, b) { o.x = a.x + b.x; o.y = a.y + b.y; o.z = a.z + b.z; return o; },
  sub: function (o, a, b) { o.x = a.x - b.x; o.y = a.y - b.y; o.z = a.z - b.z; return o; },
  scale: function (o, a, s) { o.x = a.x * s; o.y = a.y * s; o.z = a.z * s; return o; },
  addScaled: function (o, a, b, s) { o.x = a.x + b.x * s; o.y = a.y + b.y * s; o.z = a.z + b.z * s; return o; },
  dot: function (a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; },
  cross: function (o, a, b) {
    var x = a.y * b.z - a.z * b.y, y = a.z * b.x - a.x * b.z, z = a.x * b.y - a.y * b.x;
    o.x = x; o.y = y; o.z = z; return o;
  },
  len: function (a) { return Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z); },
  len2: function (a) { return a.x * a.x + a.y * a.y + a.z * a.z; },
  dist: function (a, b) { var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return Math.sqrt(dx * dx + dy * dy + dz * dz); },
  dist2: function (a, b) { var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return dx * dx + dy * dy + dz * dz; },
  norm: function (o, a) {
    var l = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
    if (l < 1e-9) { o.x = 0; o.y = 0; o.z = 0; return o; }
    o.x = a.x / l; o.y = a.y / l; o.z = a.z / l; return o;
  },
  lerp: function (o, a, b, t) { o.x = lerp(a.x, b.x, t); o.y = lerp(a.y, b.y, t); o.z = lerp(a.z, b.z, t); return o; },
  zero: function (o) { o.x = 0; o.y = 0; o.z = 0; return o; },
  isFinite: function (a) { return isFinite(a.x) && isFinite(a.y) && isFinite(a.z); }
};

/* --- Quaternion --- */
var Q = {
  make: function () { return { x: 0, y: 0, z: 0, w: 1 }; },
  copy: function (o, a) { o.x = a.x; o.y = a.y; o.z = a.z; o.w = a.w; return o; },
  fromAxisAngle: function (o, ax, ay, az, ang) {
    var h = ang * 0.5, s = Math.sin(h);
    o.x = ax * s; o.y = ay * s; o.z = az * s; o.w = Math.cos(h); return o;
  },
  mul: function (o, a, b) {
    var ax = a.x, ay = a.y, az = a.z, aw = a.w, bx = b.x, by = b.y, bz = b.z, bw = b.w;
    o.x = aw * bx + ax * bw + ay * bz - az * by;
    o.y = aw * by - ax * bz + ay * bw + az * bx;
    o.z = aw * bz + ax * by - ay * bx + az * bw;
    o.w = aw * bw - ax * bx - ay * by - az * bz;
    return o;
  },
  norm: function (o) {
    var l = Math.sqrt(o.x * o.x + o.y * o.y + o.z * o.z + o.w * o.w);
    if (l < 1e-9) { o.x = o.y = o.z = 0; o.w = 1; return o; }
    o.x /= l; o.y /= l; o.z /= l; o.w /= l; return o;
  },
  conj: function (o, a) { o.x = -a.x; o.y = -a.y; o.z = -a.z; o.w = a.w; return o; },
  /* 世界 = q * v * q^-1 */
  rotate: function (o, q, v) {
    var qx = q.x, qy = q.y, qz = q.z, qw = q.w, vx = v.x, vy = v.y, vz = v.z;
    var tx = 2 * (qy * vz - qz * vy), ty = 2 * (qz * vx - qx * vz), tz = 2 * (qx * vy - qy * vx);
    o.x = vx + qw * tx + (qy * tz - qz * ty);
    o.y = vy + qw * ty + (qz * tx - qx * tz);
    o.z = vz + qw * tz + (qx * ty - qy * tx);
    return o;
  },
  /* 局部 = q^-1 * v * q */
  unrotate: function (o, q, v) {
    var qx = -q.x, qy = -q.y, qz = -q.z, qw = q.w, vx = v.x, vy = v.y, vz = v.z;

    var f;
    if (y < 0) {
      var u = (y - k) / Math.max(0.02, -k);        /* 0=龙骨 1=水线 */
      f = Math.pow(clamp(u, 0, 1), 0.42);          /* U 形横剖 */
    } else {
      f = 1 + 0.055 * Math.min(y, RAIL);          /* 舷侧外张 */
    }
    return hb * f;
  }
  function inside(x, y, z) {
    if (x < -halfL || x > halfL || y > RAIL) return false;
    if (y < keelY(x)) return false;
    return Math.abs(z) <= halfBeam(x, y);
  }
  /* 体元采样：8 子点估算填充率，得到较准确的排水体积 */
  function buildSamples(step) {
    step = step || CFG.ship.sample;
    var pts = [], vTotal = 0, vBelow0 = 0;
    var yTop = DECK - 0.1;
    var h = step * 0.5, sub = 0.25 * step;
    for (var x = -halfL + h; x < halfL; x += step) {
      var kmin = keelY(x) - step;
      for (var y = kmin; y < yTop; y += step) {
        for (var z = -HB - h; z < HB + h; z += step) {
          var fill = 0;
          for (var a = -1; a <= 1; a += 2) for (var b = -1; b <= 1; b += 2) for (var c = -1; c <= 1; c += 2) {
            if (inside(x + a * sub, y + b * sub, z + c * sub)) fill++;
          }
          if (!fill) continue;
          fill /= 8;
          var vol = step * step * step * fill;
          pts.push({
            p: V.make(x, y, z), vol: vol, h: step,
            area: step * step * fill,
            /* 是否属于船底外表面（用于附着阻力权重） */
            deep: y < -0.4
          });
          vTotal += vol;
          if (y + h * fill <= 0) vBelow0 += vol;
        }
      }
    }
    return { pts: pts, volume: vTotal, volumeBelowWL: vBelow0, step: step };
  }
  /* 甲板与舱室碰撞平台（船体局部系）：{x0,x1,z0,z1,y} */
  function platforms() {
    return [
      { name: 'hold', x0: -6.2, x1: 6.6, z0: -2.1, z1: 2.1, y: CFG.ship.holdY },
      { name: 'deck', x0: -5.4, x1: 7.4, z0: -2.95, z1: 2.95, y: DECK },
      { name: 'deckMidL', x0: -5.4, x1: 7.4, z0: -3.1, z1: -2.95, y: DECK },
      { name: 'quarter', x0: -8.7, x1: -5.4, z0: -2.6, z1: 2.6, y: DECK + 1.05 },
      { name: 'stair1', x0: -5.9, x1: -5.4, z0: -1.0, z1: 1.0, y: DECK + 0.35 },
      { name: 'stair2', x0: -6.4, x1: -5.9, z0: -1.0, z1: 1.0, y: DECK + 0.7 },
      { name: 'foredeck', x0: 7.4, x1: 8.8, z0: -1.7, z1: 1.7, y: DECK + 0.55 }
    ];
  }
  /* 舷墙（阻挡）：局部系竖直墙面 */
  function walls() {
    return [
      { axis: 'z', at: 3.05, x0: -5.4, x1: 7.6, yTop: RAIL },
      { axis: 'z', at: -3.05, x0: -5.4, x1: 7.6, yTop: RAIL },
      { axis: 'x', at: 8.85, z0: -3.1, z1: 3.1, yTop: RAIL },
      { axis: 'x', at: -8.85, z0: -3.1, z1: 3.1, yTop: RAIL }
    ];
  }
  return {
    L: L, HB: HB, halfL: halfL, DECK: DECK, RAIL: RAIL,
    keelY: keelY, halfBeam: halfBeam, inside: inside,
    buildSamples: buildSamples, platforms: platforms, walls: walls
  };
})();

/* ========================= 6. SHIP（水动力 + 操纵器具） ========================= */
var SHIP_SAMPLES = null;   /* 体元只构建一次，所有船共享（只读） */
function getSamples() { if (!SHIP_SAMPLES) SHIP_SAMPLES = Hull.buildSamples(); return SHIP_SAMPLES; }

function Ship(opts) {
  opts = opts || {};
  var S = CFG.ship, M = opts.mass || S.mass;
  var B = S.beam, L = S.len, H = S.depth;
  var Ix = M * (B * B + H * H) / 12 * S.inertiaMul.roll;
  var Iy = M * (L * L + B * B) / 12 * S.inertiaMul.yaw;
  var Iz = M * (L * L + H * H) / 12 * S.inertiaMul.pitch;
  this.body = new Body(M, Ix, Iy, Iz);
  this.baseMass = M;
  this.samples = getSamples();
  this.faction = opts.faction || 'player';
  this.name = opts.name || '无名号';
  this.cgY = S.cgY;

  /* --- 操纵器具状态 --- */
  this.helm = { wheel: 0, target: 0 };          /* -1..1 轮盘 */
  this.rudder = 0;                              /* 实际舵角 rad */
  this.sail = { hoist: 0, trim: 0, trimTarget: 0, hoistTarget: 0, luffing: false, force: 0 };
  this.anchor = { state: 'up', drop: 0, pos: V.make(), set: false };  /* drop: 0..1 */
  this.cannons = [];
  var cs = [[-2.2, 1], [1.4, 1], [-2.2, -1], [1.4, -1]];
  for (var i = 0; i < cs.length; i++) {
    this.cannons.push({
      id: i, lx: cs[i][0], lz: cs[i][1] * 2.55, side: cs[i][1] > 0 ? 'starboard' : 'port',
      baseYaw: cs[i][1] > 0 ? Math.PI / 2 : -Math.PI / 2,
      yaw: 0, pitch: 0.06, loaded: true, reload: 0, manned: false, smoke: 0
    });
  }
  /* --- 损管 --- */
  this.hp = S.hull.hp;
  this.breaches = [];      /* {p:hullFrame, size, id} */
  this.waterVol = 0;
  this.sinking = false;
  this.sunk = false;
  this.sinkT = 0;
  this.pumpUse = 0; this.bailUse = 0;

  /* --- 缓存 --- */
  this.submergedVol = 0;
  this.draft = 0;
  this.speed = 0;
  this.heel = 0; this.trimAngle = 0; this.yaw = 0;
  this.windRel = 0;
  this.lastForces = { buoy: 0, sail: 0, drag: 0 };
  this._t = { a: V.make(), b: V.make(), c: V.make(), d: V.make(), e: V.make(), f: V.make(), g: V.make() };
  this.wake = 0;
  this.cargo = [];         /* 甲板上的战利品 */
  if (opts.pos) V.copy(this.body.pos, opts.pos);
  if (opts.yaw !== undefined) this.setHeading(opts.yaw);
}

/* 设置艏向（与 ship.yaw = atan2(fwd.z, fwd.x) 同一约定） */
Ship.prototype.setHeading = function (yaw) {
  Q.fromAxisAngle(this.body.q, 0, 1, 0, -yaw);
  this.yaw = yaw;
  return this;
};

/* 船体局部(设计水线原点) -> 刚体局部(重心原点) */
Ship.prototype.hullToBody = function (out, hp) { out.x = hp.x; out.y = hp.y - this.cgY; out.z = hp.z; return out; };
Ship.prototype.bodyToHull = function (out, bp) { out.x = bp.x; out.y = bp.y + this.cgY; out.z = bp.z; return out; };
Ship.prototype.hullToWorld = function (out, hp) {
  var t = this._t.g; this.hullToBody(t, hp); return this.body.localToWorld(out, t);
};
Ship.prototype.worldToHull = function (out, wp) {
  this.body.worldToLocal(out, wp); return this.bodyToHull(out, out);
};

/* 水线以上的舷侧高度（用于判定破洞是否浸水） */
Ship.prototype.waterlineAt = function (hp) {
  var w = this._t.a; this.hullToWorld(w, hp);
  return Ocean.height(w.x, w.z) - w.y;
};

/* --------- 操纵器具输入 --------- */
Ship.prototype.setHelm = function (v) { this.helm.target = clamp(v, -1, 1); };
Ship.prototype.turnHelm = function (d, dt) { this.helm.target = clamp(this.helm.target + d * dt * 1.6, -1, 1); };
Ship.prototype.setSailHoist = function (v) { this.sail.hoistTarget = clamp(v, 0, 1); };
Ship.prototype.trimSail = function (d, dt) {
  this.sail.trimTarget = clamp(this.sail.trimTarget + d * dt * CFG.ship.sail.trimRate, -CFG.ship.sail.maxTrim, CFG.ship.sail.maxTrim);
};
Ship.prototype.toggleAnchor = function () {
  if (this.anchor.state === 'up' || this.anchor.state === 'raising') {
    this.anchor.state = 'dropping';
    var bow = this._t.a; this.hullToWorld(bow, V.set(this._t.b, Hull.halfL - 0.6, 0.2, 0));
    V.copy(this.anchor.pos, bow); this.anchor.pos.y = 0;
  } else this.anchor.state = 'raising';
};
Ship.prototype.workCapstan = function (dt) {
  /* 起锚需要持续转绞盘 */
  if (this.anchor.state === 'raising' || this.anchor.state === 'down') {
    this.anchor.state = 'raising';
    this.anchor.drop = clamp(this.anchor.drop - CFG.ship.anchor.rate * dt, 0, 1);
    if (this.anchor.drop <= 0) { this.anchor.state = 'up'; this.anchor.set = false; }
    return true;
  }
  return false;
};

/* --------- 主物理步 --------- */
Ship.prototype.step = function (dt, world) {
  var b = this.body, S = CFG.ship, g = CFG.phys.g, rho = CFG.phys.rhoWater;
  var T = this._t;
  b.clearForces();

  /* 器具动作平滑 */
  this.helm.wheel = moveToward(this.helm.wheel, this.helm.target, 2.2, dt);
  this.rudder = moveToward(this.rudder, this.helm.wheel * S.rudder.maxAngle, S.rudder.rate, dt);
  this.sail.hoist = moveToward(this.sail.hoist, this.sail.hoistTarget, S.sail.hoistRate, dt);
  this.sail.trim = moveToward(this.sail.trim, this.sail.trimTarget, S.sail.trimRate, dt);
  if (this.anchor.state === 'dropping') {
    this.anchor.drop = clamp(this.anchor.drop + CFG.ship.anchor.rate * 1.6 * dt, 0, 1);
    if (this.anchor.drop >= 1) { this.anchor.state = 'down'; this.anchor.set = true; }
  }

  /* 进水量 */
  var ingress = 0;
  for (var i = 0; i < this.breaches.length; i++) {
    var br = this.breaches[i];
    if (br.size <= 0) continue;
    var d = this.waterlineAt(br.p);
    if (d > 0) ingress += S.water.ingressPerBreach * br.size * Math.sqrt(Math.min(d, 3.2)) * 1.35;
  }
  this.waterVol = clamp(this.waterVol + (ingress - this.pumpUse - this.bailUse) * dt, 0, S.water.capacity * 1.35);
  this.pumpUse = 0; this.bailUse = 0;
  this.ingressRate = ingress;
  var waterMass = this.waterVol * rho;
  b.setMass(this.baseMass + waterMass + this.cargoMass());

  /* 重力（含舱内积水的自由液面效应） */
  b.addForce(V.set(T.a, 0, -this.baseMass * g, 0));
  var eu = b.euler();
  this.heel = eu.roll; this.trimAngle = eu.pitch; this.yaw = eu.yaw;
  if (waterMass > 1) {
    /* 积水堆积在低舷一侧：list -> 更多倾斜（真实危险） */
    var lvl = this.waterVol / S.water.capacity;
    var shiftZ = clamp(-Math.sin(eu.roll) * 2.5, -2.2, 2.2) * clamp(lvl * 1.4, 0, 1);
    var shiftX = clamp(-Math.sin(eu.pitch) * 3.2, -3.4, 3.4) * clamp(lvl * 1.4, 0, 1);
    var wp = this.hullToWorld(T.b, V.set(T.a, shiftX, S.holdY + 0.35 + lvl * 0.9, shiftZ));
    V.sub(T.c, wp, b.pos);
    b.addForceAt(V.set(T.d, 0, -waterMass * g, 0), T.c);
  }

  /* 浮力 + 水动阻力（逐体元） */
  var subVol = 0, lowest = 1e9, buoyTotal = 0, dragTotal = 0;
  var pts = this.samples.pts;
  var wp2 = T.a, r = T.b, pv = T.c, fv = T.d, vr = T.e, vl = T.f;
  var sinkFade = this.sinking ? clamp(1 - this.sinkT / 14, 0.12, 1) : 1;
  for (i = 0; i < pts.length; i++) {
    var sp = pts[i];
    this.hullToWorld(wp2, sp.p);
    var wh = Ocean.height(wp2.x, wp2.z);
    var depth = wh - wp2.y;
    if (depth < -sp.h * 0.5) continue;
    var frac = clamp((depth + sp.h * 0.5) / sp.h, 0, 1);
    subVol += sp.vol * frac;
    if (wp2.y < lowest) lowest = wp2.y;
    V.sub(r, wp2, b.pos);
    /* 浮力 */
    var fb = rho * g * sp.vol * frac * sinkFade;
    buoyTotal += fb;
    b.addForceAt(V.set(T.g, 0, fb, 0), r);
    /* 阻力（相对水质点速度） */
    b.pointVel(pv, r);
    Ocean.flow(fv, wp2.x, wp2.y, wp2.z);
    V.sub(vr, pv, fv);
    b.worldDirToLocal(vl, vr);
    var A = sp.area * frac, cd = S.cd, k = -0.5 * rho * A;
    var fx = k * cd.x * Math.abs(vl.x) * vl.x;
    var fy = k * cd.y * Math.abs(vl.y) * vl.y;
    var fz = k * cd.z * Math.abs(vl.z) * vl.z;
    /* 单点冲量限幅，防止大浪时数值爆炸 */
    var lim = b.mass * 6.0;
    fx = clamp(fx, -lim, lim); fy = clamp(fy, -lim, lim); fz = clamp(fz, -lim, lim);
    dragTotal += Math.abs(fx) + Math.abs(fz);
    b.localDir(vl, V.set(T.g, fx, fy, fz));
    b.addForceAt(vl, r);
  }
  this.submergedVol = subVol;
  this.draft = (lowest < 1e8) ? (Ocean.height(b.pos.x, b.pos.z) - lowest) : 0;
  this.keelY = lowest;
  var subFrac = subVol / Math.max(0.001, this.samples.volume);

  /* 帆：升力板模型（真实风向依赖） */
  var wind = Ocean.windVec(T.a);
  if (world && world.gust) { wind.x *= world.gust; wind.z *= world.gust; }
  V.sub(T.b, wind, b.vel);                 /* 视风 */
  T.b.y = 0;
  var appSpeed = V.len(T.b);
  this.appWind = appSpeed;
  var sailF = 0;
  if (this.sail.hoist > 0.01 && appSpeed > 0.15 && !this.sunk) {
    /* --- 二维翼型帆模型：升力 + 阻力（因此可以斜逆风前进，正逆风失速） --- */
    var f = V.norm(T.c, T.b);               /* 视风去向（单位） */
    /* 帆弦向（帆杠指向艉部，随收放角旋转）：局部 (-cos τ, 0, sin τ) */
    var cl_ = V.set(T.d, -Math.cos(this.sail.trim), 0, Math.sin(this.sail.trim));
    var cw = b.localDir(T.e, cl_); cw.y = 0; V.norm(cw, cw);
    var nw = V.set(T.f, cw.z, 0, -cw.x);    /* 帆面法线（水平） */
    var sa = V.dot(f, nw), ca = V.dot(f, cw);
    var alpha = Math.atan2(sa, ca);         /* 攻角 */
    var sA = Math.sin(alpha), cA = Math.cos(alpha);
    var CL = 1.85 * Math.sin(2 * alpha);
    var CD = 0.11 + 1.25 * sA * sA;
    var q = 0.5 * CFG.phys.rhoAir * appSpeed * appSpeed * S.sail.area * this.sail.hoist;
    /* 升力垂直于来流（f 顺时针转 90°），阻力沿来流 */
    var px = f.z, pz = -f.x;
    var Fx = q * (CL * px + CD * f.x);
    var Fz = q * (CL * pz + CD * f.z);
    sailF = Math.sqrt(Fx * Fx + Fz * Fz);
    this.sail.aoa = alpha;
    this.sail.luffing = Math.abs(alpha) < 0.14 || Math.abs(Math.abs(alpha) - Math.PI) < 0.14;
    if (this.sail.luffing) { Fx *= 0.12; Fz *= 0.12; sailF *= 0.12; }
    var cop = this.hullToWorld(T.g, V.set(cl_, 0.55, Hull.DECK + S.sail.height * 0.62, 0));
    V.sub(T.b, cop, b.pos);
    b.addForceAt(V.set(T.d, Fx, 0, Fz), T.b);
  } else { this.sail.luffing = this.sail.hoist > 0.01; this.sail.aoa = 0; }
  this.sail.force = sailF;

  /* 水线以上船体/桅杆受风（风压） */
  var windR = V.sub(T.a, Ocean.windVec(T.b), b.vel); windR.y = 0;
  var ws = V.len(windR);
  if (ws > 0.2) {
    var above = clamp(1 - subFrac, 0.1, 1);
    var Ah = 26 * above;
    var mag2 = 0.5 * CFG.phys.rhoAir * ws * ws * 0.85 * Ah / Math.max(0.5, ws);
    V.scale(T.c, windR, mag2);
    var cp = this.hullToWorld(T.d, V.set(T.b, 0, Hull.DECK + 1.1, 0));
    V.sub(T.e, cp, b.pos);
    b.addForceAt(T.c, T.e);
  }

  /* 舵：平板升力，随水流反向自动换向 */
  var rpHull = V.set(T.a, S.rudder.x, -0.95, 0);
  var rw = this.hullToWorld(T.b, rpHull);
  V.sub(r, rw, b.pos);
  b.pointVel(pv, r);
  Ocean.flow(fv, rw.x, rw.y, rw.z);
  V.sub(vr, pv, fv);
  b.worldDirToLocal(vl, vr);
  var flowSpeed = Math.sqrt(vl.x * vl.x + vl.z * vl.z);
  if (flowSpeed > 0.08 && this.draft > 0.3) {
    /* 水流去向（局部）= -相对速度 */
    var fdx = -vl.x / flowSpeed, fdz = -vl.z / flowSpeed;
    var nrx = Math.sin(this.rudder), nrz = Math.cos(this.rudder);
    var dpr = fdx * nrx + fdz * nrz;
    var Cr = 2.35 * Math.abs(dpr);
    if (Math.abs(dpr) > 0.62) Cr *= (1 - (Math.abs(dpr) - 0.62) * 1.1);   /* 失速 */
    var magR = 0.5 * rho * S.rudder.area * flowSpeed * flowSpeed * Cr * sign(dpr);
    var fl = V.set(T.c, nrx * magR, 0, nrz * magR);
    b.localDir(T.d, fl);
    b.addForceAt(T.d, r);
    this.rudderForce = magR;
  } else this.rudderForce = 0;

  /* 锚 */
  if (this.anchor.drop > 0.02) {
    var bowW = this.hullToWorld(T.a, V.set(T.b, Hull.halfL - 0.6, 0.2, 0));
    V.sub(T.c, this.anchor.pos, bowW);
    T.c.y = 0;
    var dist = V.len(T.c);
    var slack = CFG.ship.anchor.chain * (1 - this.anchor.drop * 0.55);
    if (this.anchor.state === 'down' && dist > slack * 0.35) {
      V.norm(T.d, T.c);
      var stretch = Math.max(0, dist - slack * 0.35);
      var kf = clamp(stretch / 6, 0, 1) * CFG.ship.anchor.holdForce * this.anchor.drop;
      V.scale(T.e, T.d, kf);
      /* 阻尼 */
      var vAlong = V.dot(b.vel, T.d);
      V.addScaled(T.e, T.e, T.d, -vAlong * 9000 * this.anchor.drop);
      V.sub(T.f, bowW, b.pos);
      b.addForceAt(T.e, T.f);
    }
    /* 锚链带来的额外阻力/转向惯性 */
    var brake = this.anchor.drop * 0.55;
    V.scale(T.e, b.vel, -brake * 6500);
    b.addForce(T.e);
  }

  /* 搁浅：龙骨与地形碰撞（弹簧-阻尼 + 摩擦 + 结构损伤） */
  this.aground = false;
  if (world && world.terrainAt) {
    if (!this._gpts) {
      this._gpts = [];
      for (var gi = -3; gi <= 3; gi++) {
        var gx = gi * (Hull.halfL / 3.4);
        this._gpts.push(V.make(gx, Hull.keelY(gx) + 0.05, 0));
        if (Math.abs(gi) < 3) {
          this._gpts.push(V.make(gx, Hull.keelY(gx) + 0.5, Hull.halfBeam(gx, -0.9) * 0.85));
          this._gpts.push(V.make(gx, Hull.keelY(gx) + 0.5, -Hull.halfBeam(gx, -0.9) * 0.85));
        }
      }
    }
    var kSpring = b.mass * 26, kDamp = b.mass * 5.5, totalPen = 0;
    for (var gj = 0; gj < this._gpts.length; gj++) {
      this.hullToWorld(T.a, this._gpts[gj]);
      var th = world.terrainAt(T.a.x, T.a.z);
      var pen = th - T.a.y;
      if (pen <= 0) continue;
      this.aground = true;
      totalPen += pen;
      V.sub(r, T.a, b.pos);
      b.pointVel(pv, r);
      var nrm = world.terrainNormal ? world.terrainNormal(T.b, T.a.x, T.a.z) : V.set(T.b, 0, 1, 0);
      var vn = V.dot(pv, nrm);
      var fmag = clamp(kSpring * Math.min(pen, 1.4) - kDamp * vn, 0, b.mass * 55);
      V.scale(T.c, nrm, fmag / this._gpts.length * 2.2);
      /* 切向摩擦（沙石阻滞） */
      V.addScaled(T.d, pv, nrm, -vn);
      var tl = V.len(T.d);
      if (tl > 0.05) V.addScaled(T.c, T.c, T.d, -Math.min(fmag * 0.55, b.mass * 2.2) / tl / this._gpts.length * 2.2);
      b.addForceAt(T.c, r);
    }
    /* 触底瞬间：一次性撞击损伤（速度越高越重），之后只有轻微刮擦 */
    if (this.aground && !this._wasAground) {
      var impact = this.speed;
      if (impact > 1.8) {
        this.hp = Math.max(0, this.hp - clamp(impact * 16, 8, 140));
        if (impact > 3.0 && this.breaches.length < 5) {
          var bz = (this.groundRng() < 0.5 ? -1 : 1) * 2.0;
          this.breaches.push({
            p: V.make(lerp(-4, 4, this.groundRng()), Hull.keelY(0) + 0.55, bz),

  var nAxis = axis === 'x' ? [1, 0, 0] : (axis === 'z' ? [0, 0, 1] : [0, 1, 0]);

  for (i = 0; i < seg; i++) {

      capB.push(this.vert(cx + c2 * r1, cy + s2 * r1, cz + h, 0, 0, 1, c2 * 0.5 + 0.5, s2 * 0.5 + 0.5, col[0], col[1], col[2]));

MeshBuilder.prototype.grid = function (nx, ny, fn, flip) {
  var ids = [], i, j;
  for (i = 0; i <= nx; i++) {
    ids[i] = [];
    for (j = 0; j <= ny; j++) {
      var d = fn(i / nx, j / ny, i, j);
      ids[i][j] = this.vert(d.p[0], d.p[1], d.p[2], d.n[0], d.n[1], d.n[2], d.uv[0], d.uv[1], d.c[0], d.c[1], d.c[2]);
    }
  }
  for (i = 0; i < nx; i++) for (j = 0; j < ny; j++) {
    if (flip) this.quad(ids[i][j], ids[i][j + 1], ids[i + 1][j + 1], ids[i + 1][j]);
    else this.quad(ids[i][j], ids[i + 1][j], ids[i + 1][j + 1], ids[i][j + 1]);
  }
  return ids;
};

var ShipMesh = (function () {
  var HL = Hull.halfL, DK = Hull.DECK, RL = Hull.RAIL;
  function hb(x, y) { return Hull.halfBeam(x, y); }
  function levels(x) {
    var k = Hull.keelY(x);
    return [k, lerp(k, 0, 0.34), lerp(k, 0, 0.62), lerp(k, 0, 0.84), 0.0, 0.52, DK, RL];
  }
  function hullColor(y) {
    if (y < -0.75) return COL.hullDark;
    if (y > DK + 0.35) return COL.hullStrake;
    if (y > DK - 0.25) return [0.30, 0.20, 0.12];
    return COL.hullWood;
  }
  function surfNormal(x, y, sgn) {
    var e = 0.12;
    var dx = (hb(x + e, y) - hb(x - e, y)) / (2 * e);
    var dy = (hb(x, y + e) - hb(x, y - e)) / (2 * e);
    var n = [-dx * sgn, -dy, sgn];
    var l = Math.sqrt(n[0] * n[0] + n[1] * n[1] + n[2] * n[2]) || 1;
    return [n[0] / l, n[1] / l, n[2] / l];
  }
  /* 船体外壳 + 甲板 + 舷墙 + 舱室 */
  function buildHullPart() {
    var mb = new MeshBuilder(), NX = 30, NY = 7;
    for (var sgn = -1; sgn <= 1; sgn += 2) {
      mb.grid(NX, NY, function (u, v) {
        var x = lerp(-HL, HL, u);
        var lv = levels(x);
        var fi = v * NY, i0 = Math.min(NY, Math.floor(fi)), fr = fi - i0;
        var y = lerp(lv[i0], lv[Math.min(NY, i0 + 1)], fr);
        var w = hb(x, y);
        return {
          p: [x, y, w * sgn], n: surfNormal(x, y, sgn),
          uv: [u * 9, v * 2.2], c: hullColor(y)
        };
      }, sgn < 0);
    }
    /* 艉板 */
    mb.grid(6, 6, function (u, v) {
      var lv = levels(-HL + 0.01);
      var y = lerp(lv[0], RL, v);
      var w = hb(-HL + 0.02, y) * (1 - 0.06 * (1 - v));
      return { p: [-HL + 0.02 - v * 0.12, y, lerp(-w, w, u)], n: [-1, 0.06, 0], uv: [u * 3, v * 2], c: hullColor(y) };
    });
    /* 艏柱 */
    mb.grid(5, 6, function (u, v) {
      var y = lerp(Hull.keelY(HL - 0.2), RL, v);
      var w = hb(HL - 0.05, y) + 0.02;
      return { p: [HL - 0.02 + u * 0.5 * (1 - v * 0.2), y, lerp(-w, w, u) * 0.35], n: [1, 0.1, 0], uv: [u * 2, v * 2], c: hullColor(y) };
    });
    /* 龙骨 */
    mb.grid(20, 1, function (u, v) {
      var x = lerp(-HL, HL, u);
      return { p: [x, Hull.keelY(x) - 0.12 + v * 0.14, (v - 0.5) * 0.34], n: [0, -1, 0], uv: [u * 8, v], c: COL.hullDark };
    });

    if (P_ocean.a.aEdge !== undefined) {
      gl.enableVertexAttribArray(P_ocean.a.aEdge);
      gl.vertexAttribPointer(P_ocean.a.aEdge, 1, gl.FLOAT, false, 12, 8);
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ocean.ibo);
    gl.drawElements(gl.TRIANGLES, ocean.count, gl.UNSIGNED_INT, 0);

    /* --- 陆地 --- */
    gl.enable(gl.CULL_FACE);
    gl.useProgram(P_obj.p);
    setCommon(P_obj);
    gl.uniform1f(P_obj.u.uWaterY, 0.0);
    M4.ident(model);
    gl.disable(gl.CULL_FACE);
    for (var i = 0; i < islandMeshes.length; i++) {
      var im = islandMeshes[i];
      if (V.dist2(im.isl.pos, camPos) > Math.pow(im.isl.radius * 1.6 + CFG.render.viewDist, 2)) continue;

    if (extra && extra.loot) {
      for (i = 0; i < extra.loot.length; i++) {
        var lt = extra.loot[i];

        var ly = lt.onShip ? 0 : Math.max(World.terrainAt(lt.pos.x, lt.pos.z), Ocean.height(lt.pos.x, lt.pos.z) - 0.15);
        if (lt.onShip) {
          lt.onShip.hullToWorld(lt._w || (lt._w = V.make()), lt.localPos);

      for (i = 0; i < extra.digSpots.length; i++) {
        var ds = extra.digSpots[i];
        if (ds.dug) continue;

    gl.uniform1f(P_inst.u.uWaterY, 0);
    gl.uniform1f(P_inst.u.uTexMix, 0.55);
    gl.uniform1f(P_inst.u.uSpec, 0.05);

    drawInstanced(meshes.palm, instBufs.palm, tex.ground);
    drawInstanced(meshes.bush, instBufs.bush, tex.ground);
    drawInstanced(meshes.rock, instBufs.rock, tex.ground);
    gl.enable(gl.CULL_FACE);

    /* --- 粒子 --- */
    drawParticles(cam);
  }

  function drawInstanced(mesh, ib, texture) {
    if (!ib || !ib.n) return;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texture); gl.uniform1i(P_inst.u.uTex, 0);
    bindMesh(P_inst, mesh);
    gl.bindBuffer(gl.ARRAY_BUFFER, ib.buf);
    var st = 28;
    gl.enableVertexAttribArray(P_inst.a.iPosScale);
    gl.vertexAttribPointer(P_inst.a.iPosScale, 4, gl.FLOAT, false, st, 0);
    gl.vertexAttribDivisor(P_inst.a.iPosScale, 1);
    gl.enableVertexAttribArray(P_inst.a.iRot);
    gl.vertexAttribPointer(P_inst.a.iRot, 3, gl.FLOAT, false, st, 16);
    gl.vertexAttribDivisor(P_inst.a.iRot, 1);
    gl.drawElementsInstanced(gl.TRIANGLES, mesh.count, mesh.type, 0, ib.n);
    gl.vertexAttribDivisor(P_inst.a.iPosScale, 0);
    gl.vertexAttribDivisor(P_inst.a.iRot, 0);

  var shipMat = M4.create(), partMat = M4.create(), tmpMat = M4.create();
  function drawShip(ship) {
    var b = ship.body;
    if (V.dist2(b.pos, camPos) > Math.pow(CFG.render.viewDist, 2)) return;
    /* 船体局部(设计水线) -> 世界 */
    M4.fromQuatPos(shipMat, b.q, b.pos, 1);
    M4.trs(tmpMat, 0, -ship.cgY, 0, 0, 0, 0, 1, 1, 1);
    M4.mul(shipMat, shipMat, tmpMat);

    gl.useProgram(P_obj.p);
    setCommon(P_obj);
    gl.uniform1f(P_obj.u.uWaterY, -9999);
    gl.disable(gl.CULL_FACE);
    var dmg = 1 - clamp(ship.hp / CFG.ship.hull.hp, 0, 1);
    var tint = ship.faction === 'skeleton' ? [0.22, 0.26, 0.24] : [0.1, 0.08, 0.06];
    var tintAmt = ship.faction === 'skeleton' ? 0.42 : dmg * 0.28;
    drawMesh(P_obj, meshes.hull, shipMat, tex.hull, { texMix: 0.95, spec: 0.30, tint: tint, tintAmt: tintAmt });
    drawMesh(P_obj, meshes.deck, shipMat, tex.deck, { texMix: 0.95, spec: 0.12, tint: tint, tintAmt: tintAmt });
    drawMesh(P_obj, meshes.rig, shipMat, tex.hull, { texMix: 0.7, spec: 0.2, tint: tint, tintAmt: tintAmt });
    drawMesh(P_obj, meshes.props, shipMat, tex.deck, { texMix: 0.8, spec: 0.15, tint: tint, tintAmt: tintAmt });

    /* 舵 */
    M4.trs(partMat, -Hull.halfL + 0.05, 0.15, 0, ship.rudder, 0, 0, 1, 1, 1);
    M4.mul(tmpMat, shipMat, partMat);
    drawMesh(P_obj, meshes.rudder, tmpMat, tex.hull, { texMix: 0.9, spec: 0.2, tint: tint, tintAmt: tintAmt });
    /* 舵轮 */
    M4.trs(partMat, -8.0, Hull.DECK + 1.05 + 0.95, 0, Math.PI / 2, 0, ship.helm.wheel * 3.4, 1, 1, 1);
    M4.mul(tmpMat, shipMat, partMat);
    drawMesh(P_obj, meshes.wheel, tmpMat, tex.hull, { texMix: 0.7, spec: 0.3, tint: tint, tintAmt: tintAmt });
    /* 绞盘 */
    M4.trs(partMat, 7.55, Hull.DECK, 0, ship.anchor.drop * 12, 0, 0, 1, 1, 1);
    M4.mul(tmpMat, shipMat, partMat);
    drawMesh(P_obj, meshes.capstan, tmpMat, tex.hull, { texMix: 0.8, spec: 0.25, tint: tint, tintAmt: tintAmt });
    /* 火炮 */
    for (var i = 0; i < ship.cannons.length; i++) {

      M4.trs(partMat, c.lx, Hull.DECK + 0.30, c.lz * 0.86, c.baseYaw + c.yaw, c.pitch, 0, 1, 1, 1);
      M4.mul(tmpMat, shipMat, partMat);

    }
    /* 货物 */
    for (i = 0; i < ship.cargo.length; i++) {
      var cg = ship.cargo[i];
      M4.trs(partMat, cg.lx, Hull.DECK + 0.02, cg.lz, cg.rot || 0, 0, 0, 1, 1, 1);
      M4.mul(tmpMat, shipMat, partMat);

    }
    /* 旗 */
    var wr = wrapPi(Ocean.getWind().dir - ship.yaw);
    M4.trs(partMat, 0.55, Hull.DECK + 9.6, 0, wr + Math.PI, 0, 0, 1, 1, 1);
    M4.mul(tmpMat, shipMat, partMat);
    drawMesh(P_obj, meshes.flag, tmpMat, tex.sail, { texMix: 0.5, spec: 0.1, tint: ship.faction === 'skeleton' ? [0.15, 0.2, 0.18] : [0, 0, 0], tintAmt: ship.faction === 'skeleton' ? 0.5 : 0 });

    /* 帆 */
    if (ship.sail.hoist > 0.02) {

      setCommon(P_sail);
      var h = ship.sail.hoist;
      M4.trs(partMat, 0.62, Hull.DECK + 0.60 + 7.4 * (1 - h), 0, ship.sail.trim, 0, 0, 1, h, 1);
      M4.mul(tmpMat, shipMat, partMat);
      var aoa = ship.sail.aoa || 0;
      var billow = clamp(Math.sin(Math.abs(aoa)) * 1.15, 0.05, 1.15) * (ship.sail.luffing ? 0.25 : 1) * (sign(Math.sin(aoa)) || 1);
      gl.uniform1f(P_sail.u.uBillow, -billow);
      gl.uniform1f(P_sail.u.uLuff, ship.sail.luffing ? 1 : 0.08);
      gl.uniform1f(P_sail.u.uTime, Ocean.getTime());
      drawMesh(P_sail, meshes.sail, tmpMat, tex.sail, {});
      gl.useProgram(P_obj.p);
      setCommon(P_obj);
    }
    /* 舱内积水 */
    if (ship.waterVol > 0.4) {
      gl.useProgram(P_hold.p);
      gl.uniformMatrix4fv(P_hold.u.uProj, false, proj);
      gl.uniformMatrix4fv(P_hold.u.uView, false, view);
      gl.uniform3f(P_hold.u.uCam, camPos.x, camPos.y, camPos.z);
      gl.uniform1f(P_hold.u.uTime, Ocean.getTime());
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      M4.trs(partMat, 0, ship.holdWaterY(), 0, 0, 0, 0, 1, 1, 1);
      M4.mul(tmpMat, shipMat, partMat);
      gl.uniformMatrix4fv(P_hold.u.uModel, false, tmpMat);
      bindMesh(P_hold, meshes.holdWater);
      gl.drawElements(gl.TRIANGLES, meshes.holdWater.count, meshes.holdWater.type, 0);
      gl.disable(gl.BLEND);
      gl.useProgram(P_obj.p);
      setCommon(P_obj);
    }
    gl.enable(gl.CULL_FACE);
  }

  /* ---------- 粒子 ---------- */
  var particles = [];
  function emit(pos, vel, size, col, life, grav) {
    if (particles.length > MAXPART - 2) particles.shift();
    particles.push({ p: V.clone(pos), v: V.clone(vel), s: size, c: col, t: 0, life: life, g: grav === undefined ? -3.2 : grav });
  }
  function stepParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.v.y += p.g * dt;
      p.v.x *= (1 - 1.2 * dt); p.v.z *= (1 - 1.2 * dt);
      p.p.x += p.v.x * dt; p.p.y += p.v.y * dt; p.p.z += p.v.z * dt;
    }
  }
  function drawParticles(cam) {
    if (!particles.length) return;
    var n = 0;
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    var rx = cy, rz = -sy;
    var upx = sy * Math.sin(cam.pitch), upy = Math.cos(cam.pitch), upz = cy * Math.sin(cam.pitch);
    for (var i = 0; i < particles.length && n < MAXPART; i++) {
      var p = particles[i];
      var k = p.t / p.life;
      var alpha = p.c[3] * (1 - k * k);
      var size = p.s * (1 + k * 1.5);
      var o = n * 8;
      partData[o] = p.p.x; partData[o + 1] = p.p.y; partData[o + 2] = p.p.z; partData[o + 3] = size;
      partData[o + 4] = p.c[0]; partData[o + 5] = p.c[1]; partData[o + 6] = p.c[2]; partData[o + 7] = alpha;
      n++;
    }
    partCount = n;
    if (!n) return;
    gl.useProgram(P_part.p);
    gl.uniformMatrix4fv(P_part.u.uProj, false, proj);
    gl.uniformMatrix4fv(P_part.u.uView, false, view);
    gl.uniform3f(P_part.u.uRight, rx, 0, rz);
    gl.uniform3f(P_part.u.uUp, upx, upy, upz);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.bindBuffer(gl.ARRAY_BUFFER, part.quad);
    gl.enableVertexAttribArray(P_part.a.aPos);
    gl.vertexAttribPointer(P_part.a.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, part.inst);
    gl.bufferData(gl.ARRAY_BUFFER, partData.subarray(0, n * 8), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(P_part.a.iPos);
    gl.vertexAttribPointer(P_part.a.iPos, 4, gl.FLOAT, false, 32, 0);
    gl.vertexAttribDivisor(P_part.a.iPos, 1);
    gl.enableVertexAttribArray(P_part.a.iCol);
    gl.vertexAttribPointer(P_part.a.iCol, 4, gl.FLOAT, false, 32, 16);
    gl.vertexAttribDivisor(P_part.a.iCol, 1);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, n);
    gl.vertexAttribDivisor(P_part.a.iPos, 0);
    gl.vertexAttribDivisor(P_part.a.iCol, 0);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
  return {
    init: init, buildWorldGfx: buildWorldGfx, frame: frame, emit: emit, stepParticles: stepParticles,
    isReady: function () { return ready; }, particleCount: function () { return particles.length; },
    clearParticles: function () { particles.length = 0; }, sunDir: sunDir
  };
})();

/* ========================= 15. 操纵器具（工位） ========================= */
var STATIONS = (function () {
  var DK = Hull.DECK, QD = DK + 1.05;
  var list = [
    { id: 'helm', name: '舵轮', hint: 'A/D 或鼠标左右 = 转舵　S = 回正', p: [-7.95, QD + 0.85, 0], r: 1.9, stand: [-7.0, QD, 0] },
    { id: 'hoist', name: '升帆索', hint: 'W = 升帆　S = 收帆', p: [1.95, DK + 1.0, 2.55], r: 1.5, stand: [1.95, DK, 2.1] },
    { id: 'trimP', name: '左舷帆索', hint: '按住 W = 把帆转向左舷', p: [-1.7, DK + 1.0, -2.55], r: 1.5, stand: [-1.7, DK, -2.1] },

    { id: 'capstan', name: '起锚绞盘', hint: 'E = 抛锚 / 按住 W = 转绞盘起锚', p: [7.55, DK + 0.7, 0], r: 1.9, stand: [6.6, DK, 0] },
    { id: 'pump', name: '抽水泵', hint: '按住 W = 抽出舱内积水', p: [-0.9, DK + 0.9, 0], r: 1.6, stand: [-0.9, DK, 0.8] },
    { id: 'map', name: '航海图桌', hint: 'E = 查看海图', p: [-6.6, QD + 0.5, 1.55], r: 1.7, stand: [-6.6, QD, 0.9] },
    { id: 'plank', name: '木板堆', hint: 'E = 取一块木板（修补破洞用）', p: [-2.6, DK + 0.3, 2.3], r: 1.6, stand: [-2.6, DK, 1.8] },
    { id: 'ammo', name: '炮弹架', hint: 'E = 取一颗炮弹', p: [0.4, DK + 0.25, -2.35], r: 1.6, stand: [0.4, DK, -1.9] },
    { id: 'bucket', name: '水桶', hint: 'E = 拿起水桶', p: [2.9, DK + 0.25, 2.4], r: 1.4, stand: [2.9, DK, 1.9] }
  ];
  function forShip(ship) {

    for (var i = 0; i < ship.cannons.length; i++) {
      var c = ship.cannons[i];
      out.push({
        id: 'cannon' + i, name: (c.side === 'starboard' ? '右舷' : '左舷') + '火炮', cannon: i,
        hint: '鼠标瞄准　左键开火　R 装填　E 离开',
        p: [c.lx, DK + 0.55, c.lz * 0.86], r: 1.9,
