<style>

<script type="module">
import * as THREE from 'three';
window.__DIORAMA_OK__ = true;

/* ═══════════════════════════ 1 · 基础工具 ═══════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
let _sd = 20240617 >>> 0;
const rnd  = () => ((_sd = (_sd * 1664525 + 1013904223) >>> 0) / 4294967296);
const rr   = (a, b) => a + rnd() * (b - a);
const ri   = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V2 = (x, z) => new THREE.Vector2(x, -z);          // 世界(x,z) → Shape 平面
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ═══════════════════════════ 2 · 程序化贴图 ═══════════════════════════ */
function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; return [c, c.getContext('2d')]; }
const _texCache = new Map();
function toTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8; return t;
}
function rep(tex, r) {                                   // 带缓存的重复贴图克隆
  const k = tex.uuid + '|' + r;
  if (_texCache.has(k)) return _texCache.get(k);
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(r, r); _texCache.set(k, t); return t;
}
function grain(ctx, w, h, amp) {
  const id = ctx.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * amp; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(id, 0, 0);
}
function wrapArc(x, cx, cy, r, S) {                      // 无缝平铺用的九宫绘制
  for (const [dx, dy] of [[0, 0], [S, 0], [-S, 0], [0, S], [0, -S]]) { x.beginPath(); x.arc(cx + dx, cy + dy, r, 0, TAU); x.fill(); }
}
const T = {};
function buildTextures() {
  const S = 256;
  // 灰泥 / 抹灰
  { const [c, x] = cvs(S); x.fillStyle = '#f2f2f2'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 190; i++) { const g = ri(205, 252); x.fillStyle = `rgba(${g},${g},${g},.26)`; wrapArc(x, rr(0, S), rr(0, S), rr(6, 30), S); }
    grain(x, S, S, 16); T.plaster = toTex(c); }
  // 屋瓦
  { const [c, x] = cvs(S); x.fillStyle = '#6e6e6e'; x.fillRect(0, 0, S, S);
    const rows = 9, tw = S / 7, rh = S / rows;
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * tw * .5, y = S - (r + 1) * rh;
      for (let i = -1; i < 8; i++) {
        const px = i * tw + off, g = ri(190, 250);
        x.fillStyle = `rgb(${g},${g},${g})`;
        x.beginPath(); x.moveTo(px, y + rh * 1.15); x.lineTo(px, y + rh * .42);
        x.quadraticCurveTo(px + tw * .5, y - rh * .22, px + tw, y + rh * .42);
        x.lineTo(px + tw, y + rh * 1.15); x.closePath(); x.fill();
        x.strokeStyle = 'rgba(80,80,80,.55)'; x.lineWidth = 1.6; x.stroke();
        const lg = x.createLinearGradient(0, y, 0, y + rh);
        lg.addColorStop(0, 'rgba(255,255,255,.16)'); lg.addColorStop(1, 'rgba(0,0,0,.20)');
        x.fillStyle = lg; x.fill();
      }
    }
    grain(x, S, S, 10); T.tile = toTex(c); }
  // 木板
  { const [c, x] = cvs(S); x.fillStyle = '#c9c9c9'; x.fillRect(0, 0, S, S);
    const n = 7, ph = S / n;
    for (let i = 0; i < n; i++) {
      const g = ri(195, 246); x.fillStyle = `rgb(${g},${g},${g})`;
      x.fillRect(0, i * ph + 1.4, S, ph - 2.8);
      for (let k = 0; k < 26; k++) { x.strokeStyle = `rgba(${g - 45},${g - 45},${g - 45},.30)`; x.lineWidth = rr(.5, 1.5);
        const yy = i * ph + rr(2, ph - 2); x.beginPath(); x.moveTo(0, yy); x.bezierCurveTo(S * .3, yy + rr(-3, 3), S * .7, yy + rr(-3, 3), S, yy); x.stroke(); }
      x.fillStyle = 'rgba(70,70,70,.5)'; x.fillRect(0, i * ph, S, 1.6);
    }
    grain(x, S, S, 12); T.plank = toTex(c); }
  // 石板路 / 卵石
  { const [c, x] = cvs(S); x.fillStyle = '#5f5f5f'; x.fillRect(0, 0, S, S);
    for (let r = 0; r < 12; r++) for (let i = 0; i < 12; i++) {
      const cx = i * (S / 12) + ((r % 2) * S / 24) + rr(-2, 2), cy = r * (S / 12) + rr(-2, 2);
      const g = ri(150, 235); x.fillStyle = `rgb(${g},${g},${g})`;
      x.save(); x.translate(cx, cy); x.rotate(rr(0, TAU)); x.beginPath();
      const rad = S / 26;
      for (let k = 0; k < 7; k++) { const a = k / 7 * TAU, rr2 = rad * rr(.75, 1.15); const px = Math.cos(a) * rr2, py = Math.sin(a) * rr2 * .82; k ? x.lineTo(px, py) : x.moveTo(px, py); }
      x.closePath(); x.fill(); x.restore();
    }
    grain(x, S, S, 20); T.cobble = toTex(c); }
  // 砖
  { const [c, x] = cvs(S); x.fillStyle = '#8a8a8a'; x.fillRect(0, 0, S, S);
    const rows = 12, bh = S / rows, bw = S / 6;
    for (let r = 0; r < rows; r++) for (let i = -1; i < 7; i++) {
      const g = ri(180, 245); x.fillStyle = `rgb(${g},${g},${g})`;
      x.fillRect(i * bw + (r % 2) * bw / 2 + 1.2, r * bh + 1.2, bw - 2.4, bh - 2.4);
    }
    grain(x, S, S, 14); T.brick = toTex(c); }
  // 岩石
  { const [c, x] = cvs(S); x.fillStyle = '#a8a8a8'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 150; i++) { const g = ri(140, 240); x.fillStyle = `rgba(${g},${g},${g},.4)`; wrapArc(x, rr(0, S), rr(0, S), rr(4, 26), S); }
    for (let i = 0; i < 42; i++) { x.strokeStyle = `rgba(${ri(70, 130)},${ri(70, 130)},${ri(70, 130)},.45)`; x.lineWidth = rr(.6, 2.4);
      let px = rr(0, S), py = rr(0, S); x.beginPath(); x.moveTo(px, py);
      for (let k = 0; k < 4; k++) { px += rr(-30, 30); py += rr(-30, 30); x.lineTo(px, py); } x.stroke(); }
    grain(x, S, S, 22); T.rock = toTex(c); }
  // 草地
  { const [c, x] = cvs(S); x.fillStyle = '#d6d6d6'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 260; i++) { const g = ri(150, 255); x.fillStyle = `rgba(${g},${g},${g},.32)`; wrapArc(x, rr(0, S), rr(0, S), rr(5, 22), S); }
    for (let i = 0; i < 900; i++) { const g = ri(120, 250); x.strokeStyle = `rgba(${g},${g},${g},.5)`; x.lineWidth = rr(.5, 1.3);
      const px = rr(0, S), py = rr(0, S); x.beginPath(); x.moveTo(px, py); x.lineTo(px + rr(-2, 2), py - rr(2, 6)); x.stroke(); }
    grain(x, S, S, 18); T.grass = toTex(c); }
  // 泥土
  { const [c, x] = cvs(S); x.fillStyle = '#b9b9b9'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 220; i++) { const g = ri(130, 245); x.fillStyle = `rgba(${g},${g},${g},.35)`; wrapArc(x, rr(0, S), rr(0, S), rr(3, 18), S); }
    grain(x, S, S, 26); T.soil = toTex(c); }
  // 柔和圆点（粒子 / 光晕 / 灯池）
  { const [c, x] = cvs(128); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.28, 'rgba(255,255,255,.62)');
    g.addColorStop(.65, 'rgba(255,255,255,.14)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128); T.soft = toTex(c); }
  // 云朵
  { const [c, x] = cvs(128); for (let i = 0; i < 26; i++) {
      const cx = 64 + rr(-26, 26), cy = 64 + rr(-16, 16), rad = rr(14, 34);
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, 'rgba(255,255,255,.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(cx, cy, rad, 0, TAU); x.fill(); }
    T.puff = toTex(c); }
  // 星点
  { const [c, x] = cvs(64); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, '#fff'); g.addColorStop(.2, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); T.star = toTex(c); }
  // 水面法线（可无缝平铺）
  { const N = 128, [c, x] = cvs(N); const id = x.createImageData(N, N), d = id.data;
    const hf = (u, v) => Math.sin((2 * u + 1 * v) * TAU) * .5 + Math.sin((3 * u - 2 * v) * TAU + 1.1) * .3
      + Math.sin((1 * u + 4 * v) * TAU + 2.2) * .22 + Math.sin((5 * u + 3 * v) * TAU + .4) * .12;
    const e = 1 / N;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const u = i / N, v = j / N;
      const nx = -(hf(u + e, v) - hf(u - e, v)) / (2 * e) * .012;
      const ny = -(hf(u, v + e) - hf(u, v - e)) / (2 * e) * .012;
      const L = Math.hypot(nx, ny, 1), o = (j * N + i) * 4;
      d[o] = (nx / L * .5 + .5) * 255; d[o + 1] = (ny / L * .5 + .5) * 255; d[o + 2] = (1 / L * .5 + .5) * 255; d[o + 3] = 255;
    }
    x.putImageData(id, 0, 0); T.waveN = toTex(c, false); T.waveN2 = toTex(c, false); T.waveN2.repeat.set(2.6, 2.6); }
  // 月面
  { const [c, x] = cvs(128); x.fillStyle = '#eef2ff'; x.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 30; i++) { x.fillStyle = `rgba(${ri(178, 214)},${ri(184, 218)},${ri(200, 235)},.55)`;
      x.beginPath(); x.arc(rr(0, 128), rr(0, 128), rr(3, 15), 0, TAU); x.fill(); }
    T.moon = toTex(c); }
  // 条纹（遮阳棚 / 帐篷 / 热气球）
  T.stripe = (a, b, n = 8) => { const [c, x] = cvs(64); for (let i = 0; i < n; i++) { x.fillStyle = i % 2 ? a : b; x.fillRect(i * 64 / n, 0, 64 / n + .6, 64); } return toTex(c); };
}
buildTextures();   // 天空/星空/精灵在模块顶层即需要贴图，故立即生成

/* ═══════════════════════════ 3 · 材质库 ═══════════════════════════ */
const M = {};
const wallM = (c, r = 2) => new THREE.MeshStandardMaterial({ color: c, map: rep(T.plaster, r), bumpMap: rep(T.plaster, r), bumpScale: .07, roughness: .93, metalness: 0 });
const roofM = c => new THREE.MeshStandardMaterial({ color: c, map: rep(T.tile, 1), bumpMap: rep(T.tile, 1), bumpScale: .16, roughness: .74, metalness: .02 });
const woodM = (c, r = 2) => new THREE.MeshStandardMaterial({ color: c, map: rep(T.plank, r), bumpMap: rep(T.plank, r), bumpScale: .05, roughness: .85, metalness: 0 });
const rockM = (c, r = 1.5) => new THREE.MeshStandardMaterial({ color: c, map: rep(T.rock, r), bumpMap: rep(T.rock, r), bumpScale: .12, roughness: .95, metalness: 0 });

function mergeGeos(list) {
  const gs = list.map(g => (g.index ? g.toNonIndexed() : g));

  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let o = 0;
  for (const g of gs) {
    if (!g.attributes.normal) g.computeVertexNormals();
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    pos.set(p.array.subarray ? p.array.subarray(0, p.count * 3) : p.array, o * 3);
    nor.set(n.array.subarray ? n.array.subarray(0, p.count * 3) : n.array, o * 3);
    if (u) uv.set(u.array.subarray ? u.array.subarray(0, p.count * 2) : u.array, o * 2);
    o += p.count;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.computeBoundingSphere();

}
function trs(x, y, z, ry = 0, rx = 0, rz = 0, sx = 1, sy = 1, sz = 1) {

  pop() { this.stack.pop(); },

    s.lineTo(w2 + rr2, -d2); s.quadraticCurveTo(w2 + rr2, -d2 - rr2, w2, -d2 - rr2);
    s.lineTo(-w2, -d2 - rr2); s.quadraticCurveTo(-w2 - rr2, -d2 - rr2, -w2 - rr2, -d2);

function sweepGeo(curve, section, n, opt = {}) {
  const scaleFn = opt.scaleFn || (() => 1), uvS = opt.uvS || [.35, .35], closed = !!opt.closed;
  const up = V3(0, 1, 0), P = [], R = [];

    const t = i / total;
    const p = curve.getPoint(closed ? t % 1 : t), tg = curve.getTangent(closed ? t % 1 : t).normalize();
    const r = new THREE.Vector3().crossVectors(up, tg).normalize();
    P.push(p); R.push(r);

  const rows = [], dist = [0];
  for (let i = 0; i < P.length; i++) {
    const sc = scaleFn(i / total), row = [];
    for (const s of section) row.push(V3(P[i].x + R[i].x * s.x * sc, P[i].y + s.y, P[i].z + R[i].z * s.x * sc));
    rows.push(row);

  const lat = [0]; for (let k = 1; k < section.length; k++) lat.push(lat[k - 1] + Math.hypot(section[k].x - section[k - 1].x, section[k].y - section[k - 1].y));

  for (let i = 0; i < rows.length - 1; i++) for (let k = 0; k < section.length - 1; k++) {
    const a = rows[i][k], b = rows[i][k + 1], c = rows[i + 1][k + 1], d = rows[i + 1][k];
    const u0 = dist[i] * uvS[0], u1 = dist[i + 1] * uvS[0], v0 = lat[k] * uvS[1], v1 = lat[k + 1] * uvS[1];

class Orbit {
  constructor(cam, dom) {
    this.cam = cam; this.dom = dom;
    this.target = V3(0, 2.4, 0); this.tTarget = this.target.clone();
    this.r = 190; this.tr = 82; this.th = PI * .22; this.tth = PI * .26; this.ph = PI * .18; this.tph = PI * .30;
    this.auto = false; this.autoSpd = .035;

    this.ptr = new Map(); this.mode = 0; this.pd = 0;
    dom.addEventListener('pointerdown', e => {
      dom.setPointerCapture(e.pointerId); this.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
      this.mode = (e.button === 2 || e.shiftKey) ? 2 : 1; dom.classList.add('dragging');
      if (this.ptr.size === 2) { const [a, b] = [...this.ptr.values()]; this.pd = Math.hypot(a.x - b.x, a.y - b.y); }
    });
    dom.addEventListener('pointermove', e => {
      const p = this.ptr.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      if (this.ptr.size === 2) {

        this.tr = clamp(this.tr * (this.pd / (d || 1)), this.minR, this.maxR); this.pd = d; return;
      }

        const k = this.r * .0016;
        const right = V3(Math.cos(this.th), 0, -Math.sin(this.th)), fwd = V3(-Math.sin(this.th), 0, -Math.cos(this.th));
        this.tTarget.addScaledVector(right, -dx * k).addScaledVector(fwd, -dy * k);
        this.tTarget.x = clamp(this.tTarget.x, -26, 26); this.tTarget.z = clamp(this.tTarget.z, -26, 26);
        this.tTarget.y = clamp(this.tTarget.y, -2, 14);
      } else {

    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('wheel', e => { e.preventDefault(); this.tr = clamp(this.tr * Math.exp(clamp(e.deltaY, -160, 160) * .00085), this.minR, this.maxR); }, { passive: false });

  _cCl.setHex(a.cloud).lerp(_cA.setHex(b.cloud), k);

  cur.lamp = lerp(a.lamp, b.lamp, k); cur.star = lerp(a.star, b.star, k); cur.fd = lerp(a.fd, b.fd, k);
  cur.exp = lerp(a.exp, b.exp, k); cur.idx = k < .5 ? i : Math.min(i + 1, 9);
}
const _sd3 = new THREE.Vector3(), _sd4 = new THREE.Vector3();
function updateSky() {
  lerpStops(timeOfDay);
  lampF = cur.lamp;
  const ang = (timeOfDay - 6) / 24 * TAU;
  _sd3.set(Math.cos(ang) * .92, Math.sin(ang), -.3 - Math.cos(ang) * .2).normalize();
  dayF = clamp(_sd3.y * 3.2, 0, 1);
  _sd4.copy(_sd3); if (_sd3.y < .015) _sd4.negate();
  sun.position.copy(_sd4).multiplyScalar(120);
  sun.color.copy(_cSun); sun.intensity = cur.si;
  hemi.intensity = cur.hemi; hemi.color.copy(_cHor); hemi.groundColor.copy(_cHg);
  amb.intensity = cur.amb; amb.color.copy(_cZen).lerp(_cHor, .5);
  scene.fog.color.copy(_cFog); scene.fog.density = cur.fd;
  renderer.toneMappingExposure = cur.exp;
  if (Math.abs(timeOfDay - lastSkyDraw) > .012) {
    lastSkyDraw = timeOfDay;
    const x = skyCv[1], g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#' + _cZen.getHexString());
    g.addColorStop(.42, '#' + _cZen.clone().lerp(_cHor, .55).getHexString());
    g.addColorStop(.5, '#' + _cHor.getHexString());
    g.addColorStop(.57, '#' + _cFog.getHexString());
    g.addColorStop(1, '#' + _cHg.getHexString());
    x.fillStyle = g; x.fillRect(0, 0, 8, 256);
    skyTex.needsUpdate = true;
    if (envMaps.length) scene.environment = envMaps[clamp(cur.idx, 0, envMaps.length - 1)];
  }
  sunSprite.position.copy(_sd3).multiplyScalar(250).add(camera.position);
  sunDisc.position.copy(sunSprite.position);
  sunSprite.material.color.copy(_cSun);
  sunDisc.material.color.copy(_cSun).lerp(_cA.setHex(0xffffff), .6);
  const vis = smoothstep(-.12, .06, _sd3.y), sz = lerp(70, 42, smoothstep(0, .45, _sd3.y));
  sunSprite.material.opacity = vis * .85; sunDisc.material.opacity = vis;
  sunSprite.scale.set(sz, sz, 1); sunDisc.scale.set(sz * .3, sz * .3, 1);
  moon.position.copy(_sd3).multiplyScalar(-260).add(camera.position);
  moonGlow.position.copy(moon.position);
  const mv = smoothstep(-.05, .12, -_sd3.y);
  moon.material.transparent = true; moon.material.opacity = mv;
  moonGlow.material.opacity = mv * .5;
  starMat.opacity = cur.star * .95;
  SKYG.position.copy(camera.position);
  stars.rotation.y = elapsed * .004;
  const fl = 1 + Math.sin(elapsed * 3.1) * .04 + Math.sin(elapsed * 7.7) * .02;
  M.winL.emissiveIntensity = lampF * 1.55 * fl;
  M.winL3.emissiveIntensity = lampF * 1.35 * (1 + Math.sin(elapsed * 2.3 + 1) * .07);
  M.winL2.emissiveIntensity = lampF * 1.15;
  M.lampG.emissiveIntensity = lampF * 2.6 * fl;
  M.glow.opacity = lampF * .62 * fl;
  M.pool.opacity = lampF * .3;
  M.beam.opacity = lampF * .17;
  HEADM.opacity = lampF * .8;
  M.foam.emissiveIntensity = .1 + lampF * .12;
  for (const l of townLights) l.intensity = lampF * l.userData.base;
  for (const c of clouds) for (const s of c.children) s.material.color.copy(_cCl);
}

/* ═══════════════════════════ 15 · 交互 UI ═══════════════════════════ */
const el = id => document.getElementById(id);
const PHASE = t => t < 4.6 ? '深 夜' : t < 6.4 ? '黎 明' : t < 8.6 ? '清 晨' : t < 11.4 ? '上 午' : t < 13.6 ? '正 午' : t < 16.6 ? '午 后' : t < 18.6 ? '黄 昏' : t < 20.4 ? '暮 色' : '夜 晚';
const POIVIEW = {
  all: [0, 2.4, 0, 84, PI * .3, PI * .26],
  church: [-1.6, 9, -15.4, 34, PI * .34, PI * .12],
  mill: [-9, 11, -19, 32, PI * .33, PI * .04],
  plaza: [-11.5, 4, 13.4, 26, PI * .36, PI * .58],
  harbor: [10.5, 3, 17.5, 30, PI * .35, PI * .4],
  fair: [-14, 6, -1, 30, PI * .33, PI * .78],
  light: [32, 6, -11, 28, PI * .34, PI * .14],
  falls: [-7.4, 4, -7, 22, PI * .38, PI * .3]
};
function setTime(v) { timeOfDay = (v + 24) % 24; el('slider').value = Math.round(timeOfDay * 60); }
function syncUI() {
  const h = Math.floor(timeOfDay), m = Math.floor((timeOfDay % 1) * 60);
  el('tTime').textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  el('tPhase').textContent = PHASE(timeOfDay);
  el('slider').value = Math.round(timeOfDay * 60);
}
function bindUI() {
  el('slider').addEventListener('input', e => { timeOfDay = +e.target.value / 60; });
  el('bPlay').addEventListener('click', e => { playing = !playing; e.target.classList.toggle('on', playing); e.target.textContent = playing ? '▶ 流动' : '⏸ 静止'; });
  const sb = [el('bS1'), el('bS2'), el('bS3')], sv = [1, 4, 12];
  sb.forEach((b, i) => b.addEventListener('click', () => { tSpeed = sv[i]; sb.forEach((x, j) => x.classList.toggle('on', i === j)); }));
  document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => setTime(+b.dataset.t)));
  el('bOrbit').addEventListener('click', e => { controls.auto = !controls.auto; e.target.classList.toggle('on', controls.auto); });
  el('bShadow').addEventListener('click', e => {
    renderer.shadowMap.enabled = !renderer.shadowMap.enabled;
    e.target.classList.toggle('on', renderer.shadowMap.enabled);
    scene.traverse(o => { if (o.isMesh) { const m = o.material; (Array.isArray(m) ? m : [m]).forEach(x => x.needsUpdate = true); } });
  });
  el('bBloomish').addEventListener('click', e => {
    const on = !e.target.classList.contains('on'); e.target.classList.toggle('on', on);
    M.glow.visible = on; M.pool.visible = on; HEADM.visible = on; M.beam.visible = on;
  });
  document.querySelectorAll('#poi button').forEach(b => b.addEventListener('click', () => {
    const v = POIVIEW[b.dataset.poi]; if (v) controls.focus(v[0], v[1], v[2], v[3], v[4], v[5]);
  }));
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); el('bPlay').click(); }
    if (e.key === '1') setTime(6); if (e.key === '2') setTime(12.5);
    if (e.key === '3') setTime(18.4); if (e.key === '4') setTime(22.5);
    if (e.key === 'r' || e.key === 'R') el('bOrbit').click();
  });
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

/* ═══════════════════════════ 16 · 启动 ═══════════════════════════ */
let fpsT = 0, fpsN = 0;
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(.06, clock.getDelta());
  elapsed += dt;
  if (playing) timeOfDay = (timeOfDay + dt * tSpeed * .33) % 24;
  updateSky();
  for (const f of DYNF) f(dt);
  for (const c of clouds) {
    c.userData.a += c.userData.spd * dt * .07;
    c.position.set(Math.cos(c.userData.a) * c.userData.rad, c.userData.y + Math.sin(elapsed * .1 + c.userData.rad) * .5, Math.sin(c.userData.a) * c.userData.rad);
  }
  controls.update(dt);
  sun.target.position.set(0, 2, 0); sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
  fpsN++; fpsT += dt;
  if (fpsT > .5) { el('tFps').textContent = Math.round(fpsN / fpsT) + ' fps · ' + Math.round(MG.stats / 1000) + 'k 面'; fpsT = 0; fpsN = 0; }
  syncUI();
}
const STAGES = [
  ['编织材质与贴图', () => { buildMaterials(); }],
  ['塑造地形与水系', buildTerrain],
  ['铺设街道与桥梁', buildRoads],
  ['建造房屋与地标', buildTown],
  ['栽种草木与细节', buildDetails],
  ['点亮灯火与生灵', () => {
    MG.flush(WORLD);
    WORLD.traverse(o => {
      if (!o.isMesh) return;
      const m = Array.isArray(o.material) ? o.material[0] : o.material;
      if (NOSHADOW.has(m)) { o.castShadow = false; if (m === M.pool || m === M.glass) o.receiveShadow = false; }
      if (m === M.pool) o.renderOrder = 3;
    });
    buildDynamic(); buildClouds();
    if (clouds.length && clouds[0].parent) scene.add(clouds[0].parent);
    try { buildEnvs(); } catch (e) { console.warn('env skipped', e); }
    bindUI();
    // 支持 URL 参数：?t=22.4 指定时刻，&pause=1 静止，&orbit=1 自动环游
    const q = new URLSearchParams(location.search);
    setTime(q.has('t') ? parseFloat(q.get('t')) || 0 : 8.2);
    if (q.get('pause') === '1') el('bPlay').click();
    if (q.get('orbit') === '1') el('bOrbit').click();
    window.__DIO = { renderer, scene, camera, controls, M, POI, get time() { return timeOfDay; }, set time(v) { setTime(v); } };
  }]
];
let stage = 0;
function runStage() {
  if (stage >= STAGES.length) {
    el('loading').classList.add('hide');
    setTimeout(() => { const l = el('loading'); if (l) l.remove(); }, 900);
    loop(); return;
  }
  el('lgTxt').innerHTML = STAGES[stage][0] + ' <b>…</b>';
  requestAnimationFrame(() => {
    const t0 = performance.now();
    try { STAGES[stage][1](); }
    catch (e) { console.error('阶段 ' + stage + ' 失败', e); el('lgTxt').innerHTML = '构建出错：' + e.message; return; }
    console.log('stage', stage, STAGES[stage][0], (performance.now() - t0).toFixed(0) + 'ms');
    stage++; runStage();
  });
}
runStage();
</script>
