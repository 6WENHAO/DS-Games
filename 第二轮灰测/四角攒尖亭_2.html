<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四角攒尖亭 · 木构营造与形制演变</title>
<style>
  :root{
    --gold:#c9a86a; --ink:#ece5d8; --ink-dim:#b9b0a0;
    --panel:rgba(15,20,23,.86); --line:rgba(255,255,255,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",serif;
    background:linear-gradient(#a9c6d6 0%,#cfd9d4 45%,#e8dfc8 78%,#efe6cf 100%);
    color:var(--ink);
  }
  canvas{display:block;position:fixed;inset:0}

  /* ---------- 左上：标题 / 朝代 ---------- */
  #hud{position:fixed;top:16px;left:16px;width:302px;z-index:10;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 12px;backdrop-filter:blur(10px);
    box-shadow:0 10px 40px rgba(10,14,16,.35)}
  #hud h1{font-size:21px;letter-spacing:4px;font-weight:700;color:var(--ink)}
  #hud .sub{font-size:11px;letter-spacing:2px;color:var(--ink-dim);margin:4px 0 12px}
  #tabs{display:flex;gap:6px;margin-bottom:12px}
  #tabs button{
    flex:1;padding:7px 0;font-size:15px;font-family:inherit;letter-spacing:1px;
    background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;cursor:pointer;transition:all .18s}
  #tabs button:hover{background:rgba(255,255,255,.12)}
  #tabs button.on{background:var(--gold);color:#1c1712;font-weight:700;border-color:var(--gold)}
  #tabs button .yr{display:block;font-size:9px;letter-spacing:0;opacity:.75;margin-top:1px}
  #card .era{font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
  #card .name{font-size:14px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
  #card ul{list-style:none;margin-bottom:10px}
  #card ul li{font-size:12px;line-height:1.75;color:#d8d0c0;padding-left:14px;position:relative}
  #card ul li::before{content:"◆";position:absolute;left:0;top:0;font-size:8px;color:var(--gold);line-height:2.1}
  .stat{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:11.5px}
  .stat .k{width:86px;color:var(--ink-dim);flex:none}
  .stat .bar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
  .stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#8d7344,var(--gold));border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .stat .v{width:64px;text-align:right;color:var(--ink);flex:none;font-variant-numeric:tabular-nums}
  #card .note{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:10px;color:#8f8779;line-height:1.6}

  /* ---------- 右上：营造层级 ---------- */
  #panel{position:fixed;top:16px;right:16px;width:246px;z-index:10;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(10,14,16,.35);
    transition:opacity .25s}
  #panel h3{font-size:14px;letter-spacing:3px;margin-bottom:2px}
  #panel .sub{font-size:10px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:10px}
  #layerList{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .lrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;
    background:rgba(255,255,255,.04);border:1px solid transparent;cursor:pointer;transition:all .15s}
  .lrow:hover{background:rgba(255,255,255,.09)}
  .lrow.off{opacity:.38}
  .lrow .num{font-size:11px;color:var(--gold);width:16px;flex:none}
  .lrow .nm{flex:1;font-size:13px;letter-spacing:1px}
  .lrow .ct{font-size:10px;color:var(--ink-dim)}
  .lrow .eye{font-size:10px;color:var(--ink-dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex:none}
  .lrow:not(.off) .eye{color:var(--gold);border-color:rgba(201,168,106,.5)}
  #panel label{display:block;font-size:11px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:5px}
  #explode{width:100%;accent-color:var(--gold);cursor:pointer}
  #btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}

  #btns button.on{background:var(--gold);color:#1c1712;font-weight:700;border-color:var(--gold)}

  #info{position:fixed;left:16px;bottom:16px;width:336px;z-index:11;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;

  #info .py{font-size:11px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:9px}
  #info p{font-size:12.5px;line-height:1.85;color:#ddd5c5;margin-bottom:9px}
  #info .joint{font-size:11.5px;line-height:1.75;color:#d9c9a5;
    background:rgba(201,168,106,.09);border:1px solid rgba(201,168,106,.28);
    border-radius:8px;padding:8px 10px}
  #info .joint b{color:var(--gold);letter-spacing:1px}
  #info .close{position:absolute;top:10px;right:12px;font-size:15px;color:var(--ink-dim);
    background:none;border:none;cursor:pointer;font-family:inherit}
  #info .close:hover{color:var(--ink)}

  #tip{position:fixed;z-index:12;pointer-events:none;display:none;
    background:rgba(18,24,28,.92);border:1px solid rgba(201,168,106,.55);color:var(--ink);
    font-size:12px;letter-spacing:1px;padding:4px 10px;border-radius:6px;white-space:nowrap}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;
    font-size:11px;letter-spacing:2px;color:rgba(40,46,50,.72);

  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;

    transition:opacity .8s;cursor:pointer}
  #splash.hide{opacity:0;pointer-events:none}
  #splash h1{font-size:44px;letter-spacing:16px;text-indent:16px;color:#efe7d6;text-shadow:0 4px 30px rgba(0,0,0,.5)}
  #splash .l2{font-size:14px;letter-spacing:8px;color:var(--gold);margin:18px 0 30px}
  #splash .l3{font-size:11px;letter-spacing:3px;color:#9a9284}
  #err{position:fixed;inset:auto 16px 16px 16px;z-index:60;display:none;
    background:#3a1f1f;border:1px solid #a05b5b;color:#f0d5d5;border-radius:10px;
    padding:12px 16px;font-size:13px;line-height:1.7}

  @media (max-width:900px){
    #hud{width:250px;padding:12px}
    #panel{width:210px}
    #info{width:calc(100vw - 32px)}
    #splash h1{font-size:30px;letter-spacing:8px}
  }
</style>
</head>

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c=1.35;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

// 极简补间引擎
const tweens=[];
function tween(dur,fn,{delay=0,ease=easeOutCubic,done}={}){
  tweens.push({t0:performance.now()+delay,dur,fn,ease,done,started:false});
}
function stepTweens(now){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    if(now<tw.t0){ if(!tw.started){tw.fn(0);tw.started=true;} continue; }
    const t=clamp((now-tw.t0)/tw.dur,0,1);
    tw.fn(tw.ease(t));
    if(t>=1){ tweens.splice(i,1); tw.done&&tw.done(); }
  }
}

const INFOS={
taiji:{n:'台基（台明）',py:'Tai Ji · 基座承台',t:'高出地面之基座，由阶条石、陡板石砌成，防潮防湿，并将上部荷载扩散传于地基；正面设踏跺供升降。台明之高卑、做法之精粗，皆是等级之表征。',j:'台明四角安岔角石；柱位之下预埋磉墩，磉墩上承柱础，层层扩散柱压。'},

/* ---------- 地面（低多边形草地）---------- */
function buildGround(){
  const g=new THREE.PlaneGeometry(120,120,52,52); g.rotateX(-Math.PI/2);
  const pos=g.attributes.position; const colors=[];
  const c1=new THREE.Color(0x93a37e),c2=new THREE.Color(0x7c9469),c3=new THREE.Color(0xa9b489);
  const rand=(x,z)=>{const s=Math.sin(x*12.9898+z*78.233)*43758.5453;return s-Math.floor(s);};
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    // 亭区/对比区保持平整
    const dx=Math.max(Math.abs(x)-19.5,0),dz=Math.max(Math.abs(z)-11,0);
    const m=smoothstep(0,7,Math.hypot(dx,dz));
    pos.setY(i,(Math.sin(x*0.33)*Math.cos(z*0.27)*0.5+(rand(x,z)-0.5)*0.6)*0.35*m);
    const r=rand(x*1.7,z*0.9);
    const c=c1.clone().lerp(r>0.72?c3:c2,r*0.7);
    colors.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1}));
  mesh.receiveShadow=true; mesh.name='ground';
  return mesh;
}

/* ---------- 环境点缀：树、石、步石 ---------- */
function buildEnv(){
  const env=new THREE.Group();
  const woodM=new THREE.MeshStandardMaterial({color:0x6e4f36,flatShading:true,roughness:.95});
  const leafM1=new THREE.MeshStandardMaterial({color:0x4d6b4f,flatShading:true,roughness:.95});
  const leafM2=new THREE.MeshStandardMaterial({color:0x3f5d45,flatShading:true,roughness:.95});
  const rockM=new THREE.MeshStandardMaterial({color:0x9a958a,flatShading:true,roughness:1});
  const stoneM=new THREE.MeshStandardMaterial({color:0xa9a193,flatShading:true,roughness:.98});
  const tree=(x,z,s)=>{
    const t=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.09*s,0.14*s,0.9*s,6),woodM);
    trunk.position.y=0.45*s; t.add(trunk);
    [[1.15,1.1,0.95],[0.85,0.95,1.75],[0.55,0.8,2.4]].forEach(([r,h,y],i)=>{
      const c=new THREE.Mesh(new THREE.ConeGeometry(r*s,h*s,7),i%2?leafM2:leafM1);
      c.position.y=y*s; c.castShadow=true; t.add(c);
    });
    trunk.castShadow=true; t.position.set(x,0,z); t.rotation.y=x*3.1;
    return t;
  };
  [[-13,-9,1.5],[13.5,-11,1.8],[-19,-2,1.2],[19.5,-4,1.4],[16,7.5,1.1],[-16.5,8,1.3],[-8,-14,1.7],[9,-15,1.3]]
    .forEach(([x,z,s])=>env.add(tree(x,z,s)));
  [[-9.5,4.2,.55],[10.6,5.8,.4],[-6.5,7.2,.35],[7.8,-6.5,.5],[-12,10,.45]]
    .forEach(([x,z,s])=>{
      const r=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),rockM);
      r.position.set(x,s*0.4,z); r.scale.y=0.7; r.rotation.set(x,z*.3,x*.2); r.castShadow=true; env.add(r);
    });
  for(let i=0;i<7;i++){
    const st=new THREE.Mesh(new THREE.BoxGeometry(1.15-.04*i,0.09,0.85),stoneM);
    st.position.set(Math.sin(i*1.7)*0.12,0.045,3.4+i*0.92); st.rotation.y=Math.sin(i*2.3)*0.12;
    st.receiveShadow=true; env.add(st);
  }
  return env;
}
const ground=buildGround(); scene.add(ground);

const highlightMat=new THREE.MeshStandardMaterial({color:0xffc46b,emissive:0x915a10,emissiveIntensity:.75,roughness:.5});
function makeMats(P){
  const M={
    wood:new THREE.MeshStandardMaterial({color:P.wood,roughness:.82,flatShading:true}),
    woodD:new THREE.MeshStandardMaterial({color:P.woodD,roughness:.85,flatShading:true}),
    trim:new THREE.MeshStandardMaterial({color:P.trim,roughness:.7,flatShading:true}),
    stone:new THREE.MeshStandardMaterial({color:0xb6ad9c,roughness:.95,flatShading:true}),
    stoneD:new THREE.MeshStandardMaterial({color:0x9d9481,roughness:.95,flatShading:true}),
    tile:new THREE.MeshStandardMaterial({color:P.tile,roughness:1-P.tileGloss*0.6,metalness:P.tileGloss*0.25,flatShading:true,side:THREE.DoubleSide,transparent:true}),
    ridge:new THREE.MeshStandardMaterial({color:P.ridge,roughness:.75,metalness:P.tileGloss*0.2,flatShading:true,transparent:true}),
    wang:new THREE.MeshStandardMaterial({color:0xc9a273,roughness:.9,flatShading:true,side:THREE.DoubleSide,transparent:true}),
    raf:new THREE.MeshStandardMaterial({color:0xb3855a,roughness:.9,flatShading:true}),
    gold:new THREE.MeshStandardMaterial({color:0xb58a3c,roughness:.45,metalness:.5,flatShading:true}),
  };

function mesh(mat,geo,x,y,z,infoKey){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  if(infoKey) m.userData.infoKey=infoKey;
  m.castShadow=true; m.receiveShadow=true;
  return m;
}
const box=(mat,w,h,d,x,y,z,key)=>mesh(mat,new THREE.BoxGeometry(w,h,d),x,y,z,key);
const cyl=(mat,rt,rb,h,seg,x,y,z,key)=>mesh(mat,new THREE.CylinderGeometry(rt,rb,h,seg),x,y,z,key);
const boxAt=(mat,w,h,p0,p1,key)=>{ // 两点间放置方料（截面 w×h，长度取两点距离）
  const dir=new THREE.Vector3().subVectors(p1,p0); const len=dir.length();
  const m=mesh(mat,new THREE.BoxGeometry(w,h,len+0.02),0,0,0,key);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir.clone().normalize());
  m.position.copy(p0).add(p1).multiplyScalar(0.5);
  return m;
};

/* ================================================================
   5. 营造 —— 单亭程序化生成
================================================================ */
function computeDgH(P,corner){ // 铺作总高（与建簇过程同式）
  const d=P.dg,ch=d.caiH;
  let y=ch*0.72+ch*0.06;
  y+=d.arms*(ch+ch*0.10);
  if(d.ang) y+=ch*0.55;
  y+=ch*0.90;
  return y+(corner?ch*0.50:ch*0.30);
}

function buildPavilion(P){
  const mats=makeMats(P);
  const root=new THREE.Group();
  const layers=LAYER_DEFS.map(d=>({key:d.key,name:d.name,num:d.num,group:new THREE.Group(),count:0,centerY:0,def:d}));
  layers.forEach(l=>{root.add(l.group);l.group.userData.layer=l;});
  const L=Object.fromEntries(layers.map(l=>[l.key,l.group]));
  root.userData.isPavRoot=true;

  /* ---- 标高链 ---- */
  const platH=0.48;
  const chuH=0.14;
  const colBase=platH+chuH;
  const colTop=colBase+P.colH;
  const fangTop=colTop+P.lintel.h;
  const pfH=P.pufang.h;
  const dgBase=fangTop+pfH;
  const dgH=computeDgH(P,true);
  const dgTop=dgBase+dgH;
  const d=P.dg;
  const railY=dgTop-d.caiH*0.62;
  const railH=d.round?d.caiH*2.3:0.16;
  const railTop=railY+railH/2;
  const railDist=A+d.jump*d.arms*0.92+d.caiW*0.6+(d.ang?d.jump*0.5:0);
  const Emid=railDist+P.over;                    // 檐口平面半宽（边中）
  const Ecor=Emid+P.bulge;                       // 角梁端平面半径
  const rafEndY=railTop+0.045;                   // 檐椽（或飞椽）头标高
  const roofEaveY=rafEndY+0.19;                  // 瓦檐口底平面
  const apexY=roofEaveY+P.rise;                  // 攒尖顶点
  const roofUnder=r=>{ // 平面半径 r 处瓦底标高（边中线）
    const s=clamp(1-r/Emid,0,1);
    return roofEaveY+P.rise*Math.pow(s,P.p)-0.15;
  };
  const ringTopY=roofUnder(RG)-0.05;             // 金枋上皮
  const mjTop=dgTop+P.mj.h;                      // 抹角梁上皮

  const ctx={P,mats,L,platH,colBase,colTop,fangTop,dgBase,dgH,dgTop,railY,railH,railTop,
             railDist,Emid,Ecor,rafEndY,roofEaveY,apexY,ringTopY,mjTop};

  buildPlatform(ctx);
  buildFrame(ctx);
  buildDougong(ctx);
  buildBeamSys(ctx);
  buildRafters(ctx);
  buildRoof(ctx);
  buildFinial(ctx);

  return {P,root,layers,mats,ctx,xray:false,layerTags:[]};
}

/* ---- 壹 台基 ---- */
function buildPlatform({P,mats,L,platH,colBase}){
  const g=L.plat;
  const half=2.62;
  const base=box(mats.stoneD,half*2+0.36,0.12,half*2+0.36,0,0.06,0,'taiji'); g.add(base);
  const main=box(mats.stone,half*2,platH-0.12,half*2,0,0.12+(platH-0.12)/2,0,'taiji'); g.add(main);
  // 阶条石
  const edge=box(mats.stoneD,half*2,0.07,0.24,0,platH-0.035,half-0.12,'taiji'); g.add(edge);
  // 踏跺
  for(let i=0;i<4;i++){
    const st=box(mats.stone,1.7,0.12,0.4,0,0.06+i*0.12,half+0.14+(3-i)*0.4,'taiji');
    g.add(st);
  }
  // 柱础
  for(const sx of[-1,1])for(const sz of[-1,1]){
    if(P.key==='tang'||P.key==='song'){

/* ---- 贰 柱框 ---- */
function buildFrame({P,mats,L,colBase,colTop,fangTop}){
  const g=L.frame;
  // 檐柱（收分 + 侧脚）
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const geo=new THREE.CylinderGeometry(P.colR*P.taper,P.colR,P.colH,6);
    geo.translate(0,P.colH/2,0);
    const c=mesh(mats.wood,geo,sx*A,colBase,sz*A,'zhu');
    c.rotation.z=-sx*0.012; c.rotation.x=sz*0.012; g.add(c);
  }
  // 额枋（四道，端头留榫入柱）
  for(let k=0;k<4;k++){
    const h=holder(g,k*Math.PI/2);
    const len=2*A+P.colR*1.8;
    h.add(box(mats.wood,len,P.lintel.h,P.lintel.w,0,colTop+P.lintel.h/2,A,'fang'));
    if(P.pufang.h>0) h.add(box(mats.woodD,len,P.pufang.h,P.pufang.w,0,fangTop+P.pufang.h/2,A,'pufang'));
    if(P.gua){ // 挂落（清）
      const y0=colTop-0.30;
      h.add(box(mats.trim,2*A-0.5,0.05,0.05,0,y0+0.26,A-0.02,'zuo'));
      h.add(box(mats.trim,2*A-0.5,0.05,0.05,0,y0,A-0.02,'zuo'));
      for(let i=-1;i<=1;i++) h.add(box(mats.trim,0.05,0.30,0.04,i*(A-0.35),y0+0.15,A-0.02,'zuo'));
    }
  }
  // 坐凳（明清）
  if(P.seat){
    for(let k=0;k<4;k++){
      const h=holder(g,k*Math.PI/2);
      const seatY=0.48+0.45;
      h.add(box(mats.wood,2*A-0.44,0.07,0.36,0,seatY,A-0.30,'zuo'));
      for(const i of[-1,0,1]) h.add(box(mats.woodD,0.07,0.42,0.30,i*(A-0.35),seatY-0.24,A-0.30,'zuo'));
      h.add(box(mats.trim,2*A-0.44,0.05,0.05,0,seatY+0.42,A-0.42,'zuo'));
      for(let i=-1;i<=1;i++) h.add(box(mats.trim,0.05,0.40,0.04,i*(A-0.35),seatY+0.21,A-0.42,'zuo'));
    }
  }
}

/* ---- 叁 斗栱 ---- */
function buildDougong({P,mats,L,dgBase,dgTop,railY,railH,railDist}){
  const g=L.dg;
  const d=P.dg;
  const ch=d.caiH,cw=d.caiW,jp=d.jump;

  const cluster=(corner)=>{
    const c=new THREE.Group();
    let y=0; const luH=ch*0.72;
    c.add(box(mats.wood,cw*2.7,luH,cw*2.7,0,y+luH/2,0,'ludou'));
    y+=luH+ch*0.06;
    for(let t=0;t<d.arms;t++){
      const reach=jp*(t+1);
      // 华栱（外挑）
      c.add(box(mats.wood,cw,ch,reach+cw*1.6,0,y+ch/2,reach/2-cw*0.5,'huagong'));
      // 横栱（泥道/慢栱）
      const hl=cw*1.6+jp*1.5*(t+1)*0.62;
      c.add(box(mats.wood,hl,ch,cw,0,y+ch/2,0,'henggong'));
      // 散斗：华栱端 + 横栱两端
      const sd=ch*0.5;
      c.add(box(mats.wood,cw*1.5,sd,cw*1.5,0,y+ch+sd/2-cw*0.05,reach-cw*0.9,'sandou'));
      c.add(box(mats.wood,cw*1.4,sd,cw*1.4,-hl/2+cw*0.2,y+ch+sd/2-cw*0.05,0,'sandou'));
      c.add(box(mats.wood,cw*1.4,sd,cw*1.4,hl/2-cw*0.2,y+ch+sd/2-cw*0.05,0,'sandou'));
      y+=ch+ch*0.10;
    }
    if(d.ang){ // 下昂（宋）
      const L2=jp*2.3+cw*2;
      const a=box(mats.woodD,cw*1.25,ch*0.8,L2,0,y+ch*0.25,jp*0.95,'ang');
      a.rotation.x=0.40; c.add(a); y+=ch*0.55;
    }
    // 耍头
    const shL=jp*d.arms+cw*2.4;
    c.add(box(mats.woodD,cw*1.35,ch*0.9,shL,0,y+ch*0.45,jp*d.arms*0.60,'shuatou'));
    y+=ch*0.9;
    c.add(box(mats.wood,cw*1.7,ch*0.5,cw*1.7,0,y+ch*0.25,0,'sandou')); // 齐心斗
    c.position.y=dgBase;
    return c;
  };

  // 四角科（45°朝向）
  for(let k=0;k<4;k++){
    const h=holder(g,Math.PI/4+k*Math.PI/2);
    const c=cluster(true);
    c.position.x=A; c.position.z=A; // 在角柱头
    h.add(c);
  }
  // 平身科
  const offs={0:[],1:[0],2:[-0.45,0.45],3:[-0.58,0,0.58]}[d.mids]||[];
  if(offs.length){
    for(let k=0;k<4;k++){
      const h=holder(g,k*Math.PI/2);
      for(const o of offs.map(v=>v*A)){
        const c=cluster(false);
        c.position.set(o,dgBase,A);
        h.add(c);
      }
    }
  }
  // 橑檐枋 / 挑檐桁（四道通枋）
  for(let k=0;k<4;k++){
    const h=holder(g,k*Math.PI/2);
    const len=2*(A-0.05);
    if(d.round){
      const geo=new THREE.CylinderGeometry(railH/2,railH/2,len,8);
      geo.rotateZ(Math.PI/2);
      h.add(mesh(mats.woodD,geo,0,railY,railDist,'liaoyanfang'));
    }else{
      h.add(box(mats.woodD,len,railH,0.17,0,railY,railDist,'liaoyanfang'));
    }
  }
}

/* ---- 肆 梁架（抹角梁—金枋—太平梁—雷公柱—角梁）---- */
function buildBeamSys({P,mats,L,dgTop,Emid,Ecor,roofEaveY,apexY,ringTopY,mjTop}){
  const g=L.beam;
  const jfh=0.14; // 金枋高
  // 抹角梁 ×4：局部45°系中，梁两端 (±) 搭于相邻两侧檐枋（柱头）之上
  for(let k=0;k<4;k++){
    const h=holder(g,Math.PI/4+k*Math.PI/2);
    const e1=new THREE.Vector3(A*Math.SQRT1_2, dgTop+P.mj.h/2, (A-MJ_S)*Math.SQRT1_2);
    const e2=new THREE.Vector3((A-MJ_S)*Math.SQRT1_2, dgTop+P.mj.h/2, A*Math.SQRT1_2);
    h.add(boxAt(mats.woodD,P.mj.w,P.mj.h,e1,e2,'mojiao'));
  }
  const ringY=ringTopY-jfh; // 金枋环
  // 交金墩 ×4（立于抹角梁跨中，正对金枋角头）
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const hh=(ringY)- (mjTop);
    const gz=box(mats.wood,0.13,Math.max(hh,0.08),0.13,sx*RG,mjTop+Math.max(hh,0.08)/2,sz*RG,'guazhu');
    g.add(gz);
  }
  // 金枋环 ×4
  for(let k=0;k<4;k++){
    const h=holder(g,k*Math.PI/2);
    h.add(box(mats.wood,2*RG+0.16,jfh,0.13,0,ringY+jfh/2,RG,'jinfang'));
  }
  // 太平梁（十字）
  for(const rz of[0,Math.PI/2]){
    const b=box(mats.woodD,2*(RG+0.14),0.13,0.12,0,ringTopY+0.065,0,'taiping');
    b.rotation.y=rz; g.add(b);
  }
  // 雷公柱
  const lg=new THREE.CylinderGeometry(0.085,0.095,apexY-0.05-(ringTopY+0.13),6);
  g.add(mesh(mats.woodD,lg,0,(ringTopY+0.13+apexY-0.05)/2,0,'leigong'));
  // 角梁 ×4（含仔角梁）
  const yOut=roofEaveY+P.lift*0.9+0.02;
  const upAng={tang:0,song:6,ming:11,qing:15}[P.key]*KV;
  for(let k=0;k<4;k++){
    const h=holder(g,Math.PI/4+k*Math.PI/2);
    const pOut=new THREE.Vector3(0,yOut,Ecor+0.10);
    const pIn=new THREE.Vector3(0,apexY-0.10,0.02);
    const lao=boxAt(mats.woodD,0.17,0.22,pOut,pIn,'laojiao');
    h.add(lao);
    // 梁头
    const tip=box(mats.woodD,0.17,0.20,0.34,0,yOut-0.02,Ecor+0.26,'laojiao');
    h.add(tip);
    if(P.key!=='tang'){
      // 仔角梁：叠于老角梁上，前端上翘
      const y2=yOut+0.14;
      const zj=boxAt(mats.wood,0.15,0.16,new THREE.Vector3(0,y2,Ecor+0.16),pIn.clone().add(new THREE.Vector3(0,0.14,0)),'zijiao');
      h.add(zj);
      const zk=Ecor+0.16+Math.cos(upAng)*0.55,zy=y2+Math.sin(upAng)*0.55;
      const ztip=boxAt(mats.wood,0.15,0.16,new THREE.Vector3(0,y2+0.01,Ecor+0.14),new THREE.Vector3(0,zy,zk),'zijiao');
      h.add(ztip);
    }
  }
}

/* ---- 伍 椽望 ---- */
function buildRafters({P,mats,L,railDist,Emid,roofEaveY,apexY,ringTopY,railTop}){
  const g=L.raf;
  const hasFei=P.key!=='tang';
  const rafEndY=railTop+0.045;
  // 檐椽 + 飞椽（四面）
  for(let k=0;k<4;k++){
    const h=holder(g,k*Math.PI/2);
    const n=9,span=A*1.62;
    for(let i=0;i<n;i++){
      const x=-span/2+span*i/(n-1);
      // 檐椽：金枋 → 橑檐枋（两端皆落实支座）
      const p0=new THREE.Vector3(x,ringTopY+0.02,RG-0.02);
      const p1=new THREE.Vector3(x,railTop+0.05,railDist+0.05);
      h.add(boxAt(mats.raf,0.075,0.09,p0,p1,'yanraf'));
      if(hasFei){
        // 飞椽：钉于檐椽头上，外伸上扬
        const p2=new THREE.Vector3(x,railTop+0.075,railDist-0.16);
        const p3=new THREE.Vector3(x,roofEaveY-0.13,Emid-0.02);
        h.add(boxAt(mats.raf,0.062,0.07,p2,p3,'feiraf'));
      }else{
        // 唐构檐口平直：椽头续段近水平外伸
        const p2=new THREE.Vector3(x,railTop+0.06,railDist-0.10);
        const p3=new THREE.Vector3(x,roofEaveY-0.165,Emid-0.02);
        h.add(boxAt(mats.raf,0.085,0.10,p2,p3,'yanraf'));
      }
    }
    // 脑椽（上段，环心至金枋）
    const m=5,sp=RG*1.5;
    for(let i=0;i<m;i++){
      const x=-sp/2+sp*i/(m-1);
      const p0=new THREE.Vector3(x,apexY-0.155,0.10);
      const p1=new THREE.Vector3(x,ringTopY-0.01,RG-0.04);
      h.add(boxAt(mats.raf,0.075,0.09,p0,p1,'yanraf'));
    }
  }
  // 翼角椽（四角，扇形）
  for(let k=0;k<4;k++){
    const h=holder(g,Math.PI/4+k*Math.PI/2);
    for(let i=0;i<3;i++){
      const yaw=-0.42+i*0.30;
      const liftY=roofEaveY-0.16+P.lift*(0.25+0.14*i);
      const hh=holder(h,yaw);
      const p0=new THREE.Vector3(0,ringTopY-0.10,RG*1.1);
      const p1=new THREE.Vector3(0,liftY,Emid-0.25);
      hh.add(boxAt(mats.raf,0.07,0.085,p0,p1,'yijiao'));
    }
  }
  // 望板（四面曲面板）
  for(let k=0;k<4;k++){
    const geo=roofSideGeom(P,Emid,roofEaveY,apexY,{rib:false,inset:0.985,yOff:0.125});
    const m=new THREE.Mesh(geo,mats.wang);
    m.rotation.y=k*Math.PI/2; m.userData.infoKey='wangban';
    m.castShadow=true; m.receiveShadow=true;
    g.add(m);
  }
}

/* ---- 屋面（凹曲瓦面 + 瓦垄 + 垂脊 + 勾滴）---- */
function roofSideGeom(P,E,eaveY,apexY,{rib=true,inset=1,yOff=0}={}){
  const US=18,SS=10;
  const pos=[],idx=[];
  for(let j=0;j<=SS;j++){
    const s=j/SS;
    for(let i=0;i<=US;i++){
      const u=-1+2*i/US;
      const au=Math.abs(u);
      const bulge=P.bulge*Math.pow(au,1.6);
      let x=u*(E+bulge)*(1-s), z=(E)*(1-s);
      const w=smoothstep(0.55,1,au);
      let y=eaveY+P.lift*w*Math.pow(1-s,1.7)+(apexY-eaveY)*Math.pow(s,P.p);
      if(rib&&yOff===0){
        const rv=Math.abs(Math.sin((u+1)*0.5*Math.PI*P.ribN));
        const amp=P.ribAmp*(1-0.30*s)*rv;
        const rl=Math.hypot(x,z)||1;
        x+=x/rl*amp; z+=z/rl*amp; y+=amp*0.35;
      }
      x*=inset; z*=inset; y-=yOff;
      pos.push(x,y,z);
    }
  }
  const W=US+1;
  for(let j=0;j<SS;j++)for(let i=0;i<US;i++){
    const a=j*W+i,b=a+1,c=a+W,d=c+1;
    idx.push(a,b,c,b,d,c);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  return g;
}

function buildRoof({P,mats,L,Emid,Ecor,roofEaveY,apexY}){
  const g=L.roof;
  for(let k=0;k<4;k++){
    const geo=roofSideGeom(P,Emid,roofEaveY,apexY,{rib:true});
    const m=new THREE.Mesh(geo,mats.tile);
    m.rotation.y=k*Math.PI/2; m.userData.infoKey='wa';
    m.castShadow=true; m.receiveShadow=true;
    g.add(m);
    // 檐口勾滴条
    const h=holder(g,k*Math.PI/2);
    h.add(box(mats.ridge,Emid*2-0.05,0.075,0.09,0,roofEaveY-0.055,Emid-0.015,'goutou'));
  }
  // 四条垂脊（沿角梁）
  for(let k=0;k<4;k++){
    const dir=new THREE.Vector2(Math.cos(Math.PI/4+k*Math.PI/2),Math.sin(Math.PI/4+k*Math.PI/2));
    const pts=[];
    for(let j=0;j<=8;j++){
      const s=0.04+0.96*j/8;
      const r=Ecor*(1-s);
      const y=roofEaveY+P.lift*Math.pow(1-s,1.7)+P.rise*Math.pow(s,P.p)+0.02+0.10*(1-s);
      pts.push(new THREE.Vector3(dir.x*r,y,dir.y*r));
    }
    for(let j=0;j<8;j++){
      const a=pts[j],b=pts[j+1];
      const wdt=lerp(0.17,0.09,j/8);
      g.add(boxAt(mats.ridge,wdt,wdt*0.95,a,b,'chuiji'));
    }
    if(P.key==='ming'||P.key==='qing'){ // 戗兽
      const p=pts[1];
      const be=box(mats.gold,0.14,0.16,0.20,p.x,p.y+0.14,p.z,'qiangshou');
      be.lookAt(0,p.y+0.14,0); g.add(be);
    }
  }
}

/* ================================================================
   6. 文字标签 Sprite
================================================================ */
function textSprite(text,{fs=54,pad=26,scale=0.011,color='#f2ead8',border='#c9a86a',bg='rgba(16,22,26,.85)',bold=600}={}){
  const c=document.createElement('canvas');
  let ctx=c.getContext('2d');
  ctx.font=`${bold} ${fs}px "Source Han Serif SC","Noto Serif SC",serif`;
  const w=Math.ceil(ctx.measureText(text).width)+pad*2,h=fs+pad*1.6;
  c.width=w;c.height=h;
  ctx=c.getContext('2d');
  ctx.font=`${bold} ${fs}px "Source Han Serif SC","Noto Serif SC",serif`;
  const r=18;
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(w-r,0);ctx.arcTo(w,0,w,r,r);ctx.lineTo(w,h-r);ctx.arcTo(w,h,w-r,h,r);
  ctx.lineTo(r,h);ctx.arcTo(0,h,0,h-r,r);ctx.lineTo(0,r);ctx.arcTo(0,0,r,0,r);ctx.closePath();
  ctx.fillStyle=bg;ctx.fill();
  ctx.strokeStyle=border;ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,w/2,h/2+2);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(w*scale,h*scale,1);
  return sp;
}

/* ================================================================
   7. 状态 & 场景管理
================================================================ */
const state={
  dyn:'tang', mode:'single',      // single | compare
  explode:0, xray:false, env:true, autorot:true,
  compare:null,                   // {group, pavilions:[], labels:[]}
  single:null,                    // 当前 pavilion
  selected:null, selectedMat:null,
};

function finalizePavilion(pav){
  scene.add(pav.root);
  pav.root.updateMatrixWorld(true);
  pav.layers.forEach(l=>{
    l.count=0;
    l.group.traverse(o=>{if(o.isMesh&&o.userData.infoKey)l.count++;});
    const bb=new THREE.Box3().setFromObject(l.group);
    l.centerY=bb.isEmpty()?0:(bb.min.y+bb.max.y)/2;
  });
}
function mountSingle(key,animate=true){
  // 卸旧
  if(state.single){
    scene.remove(state.single.root);
    disposePavilion(state.single);
  }
  const pav=buildPavilion(DYNS[key]);
  finalizePavilion(pav);
  // 层级角标（挂层内，随拆解移动）
  pav.layers.forEach(l=>{
    const sp=textSprite(`${l.num} · ${l.name}`,{fs:52,scale:0.0105});
    sp.position.set(pav.ctx.Ecor+1.35,l.centerY,0);
    sp.visible=false;
    l.group.add(sp); pav.layerTags.push(sp);
  });
  state.single=pav;
  if(animate) playErection(pav);
  applyExplode(state.explode);
  applyXray();
}
function disposePavilion(pav){
  pav.root.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material&&o.material!==highlightMat){
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});
    }
  });
}
function playErection(pav){
  pav.layers.forEach((l,i)=>{
    l.group.scale.y=0.001;
    tween(520,e=>{l.group.scale.y=Math.max(e,0.001);},{delay:i*110,ease:easeOutBack,
      done:()=>{l.group.scale.y=1; if(i===pav.layers.length-1) updateTagVisibility();}});
  });
}
function updateTagVisibility(){
  const pav=state.single; if(!pav)return;
  const show=state.mode==='single'&&state.explode>0.12;
  pav.layers.forEach((l,i)=>{
    const sp=pav.layerTags[i]; if(!sp)return;
    const target=(show&&l.group.visible)?1:0;
    sp.material.opacity=lerp(sp.material.opacity,target,0.3);
    sp.visible=sp.material.opacity>0.03;
  });
}

function applyExplode(v){
  state.explode=v;
  const pav=state.single;
  if(pav&&state.mode==='single'){
    pav.layers.forEach((l,i)=>{
      l.group.position.y=i*v*1.02;
    });
  }
  updateTagVisibility();
}
function applyXray(){
  const list=[];
  if(state.mode==='single'&&state.single)list.push(state.single);
  if(state.mode==='compare'&&state.compare)list.push(...state.compare.pavilions);
  const op=state.xray?0.32:1;
  list.forEach(p=>{
    ['tile','ridge','wang'].forEach(k=>{
      p.mats[k].opacity=op;
    });
  });
}

/* ---------- 四朝对比 ---------- */
// 将整亭按材质合并为少量网格（对比模式性能优化；材质实例保留，透视等状态可用）
function mergedClone(pav){
  const out=new THREE.Group();
  pav.root.updateMatrixWorld(true);
  const byMat=new Map();
  pav.root.traverse(o=>{
    if(!o.isMesh)return;
    let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
    for(const k of Object.keys(g.attributes))if(k!=='position')g.deleteAttribute(k);
    g.applyMatrix4(o.matrixWorld);
    const key=o.material.uuid;
    if(!byMat.has(key))byMat.set(key,{mat:o.material,list:[]});
    byMat.get(key).list.push(g);
  });
  byMat.forEach(({mat,list})=>{
    const m=new THREE.Mesh(mergeGeometries(list,false),mat);
    m.castShadow=true;m.receiveShadow=true;
    out.add(m);
  });
  pav.root.traverse(o=>{if(o.isMesh&&o.geometry)o.geometry.dispose();});
  return out;
}
function buildCompare(){
  const group=new THREE.Group();
  const pavilions=[],labels=[];
  const xs=[-13.8,-4.6,4.6,13.8];
  DORDER.forEach((key,i)=>{
    const p=buildPavilion(DYNS[key]);
    const merged=mergedClone(p);
    merged.position.x=xs[i];
    group.add(merged);
    p.mergedRoot=merged;
    pavilions.push(p);
    const sp=textSprite(`${DYNS[key].label} · ${DYNS[key].years}`,{fs:64,scale:0.013});
    sp.position.set(xs[i],p.ctx.apexY+1.1,0);
    group.add(sp); labels.push(sp);
  });
  return {group,pavilions,labels};
}
function enterCompare(){
  if(!state.compare)state.compare=buildCompare();
  state.mode='compare';
  if(state.single)state.single.root.visible=false;
  scene.add(state.compare.group);
  panel.classList.add('disabled');
  deselect();
  hintEl.textContent='四朝同屏对比 · 屋面自左至右渐陡、斗栱渐小 · 点击任一朝代标签返回单体细察';
  tweenCamera(new THREE.Vector3(0,10,26.5),new THREE.Vector3(0,3.4,0));
  applyXray();
}
function exitCompare(){
  if(state.compare)scene.remove(state.compare.group);
  state.mode='single';
  if(state.single)state.single.root.visible=true;
  panel.classList.remove('disabled');
  hintEl.textContent='拖拽旋转 · 滚轮缩放 · 右键平移 · 点击构件查看构造详情';
  applyExplode(state.explode);
  applyXray();
  tweenCamera(new THREE.Vector3(8.6,5.4,9.8),new THREE.Vector3(0,2.8,0));
}

/* ---------- 相机补间 ---------- */
let camTweening=false;
function tweenCamera(pos,tgt){
  const p0=camera.position.clone(),t0=controls.target.clone();
  camTweening=true;
  tween(1100,e=>{
    camera.position.lerpVectors(p0,pos,e);
    controls.target.lerpVectors(t0,tgt,e);
  },{done:()=>camTweening=false});
}

/* ================================================================
   8. UI
================================================================ */
const $=id=>document.getElementById(id);
const tabsEl=$('tabs'),cardEl=$('card'),panel=$('panel'),layerList=$('layerList');
const infoEl=$('info'),tipEl=$('tip'),splash=$('splash'),hintEl=$('hint');

function computeStats(P){
  const dgH=computeDgH(P,true);
  const railDist=A+P.dg.jump*P.dg.arms*0.92+P.dg.caiW*0.6+(P.dg.ang?P.dg.jump*0.5:0);
  const Emid=railDist+P.over;
  return {
    dgRatio:dgH/P.colH,
    over:P.over+railDist-A,
    ju:P.rise/(2*Emid),
    lift:P.lift,
    zan:4+P.dg.mids*4,
    colRatio:P.colH/(2*P.colR),
  };
}
function renderCard(key){
  const P=DYNS[key],s=computeStats(P);
  const all=DORDER.map(k=>computeStats(DYNS[k]));
  const maxOf=f=>Math.max(...all.map(f));
  const row=(k,v,txt,max,fmt)=>`
    <div class="stat"><span class="k">${k}</span>
      <span class="bar"><i style="width:${clamp(v/max*100,4,100)}%"></i></span>
      <span class="v">${txt}</span></div>`;
  cardEl.innerHTML=`
    <div class="era">${P.years} · ${P.era}</div>
    <div class="name">${P.label}代形制要点 · ${P.modular}</div>
    <ul>${P.points.map(p=>`<li>${p}</li>`).join('')}</ul>
    ${row('斗栱高 / 柱高',s.dgRatio,Math.round(s.dgRatio*100)+'%',maxOf(x=>x.dgRatio))}
    ${row('出檐深（米）',s.over,s.over.toFixed(2),maxOf(x=>x.over))}
    ${row('屋面举势（举高/檐宽）',s.ju,s.ju.toFixed(2),maxOf(x=>x.ju))}
    ${row('角部起翘（米）',s.lift,s.lift.toFixed(2),maxOf(x=>x.lift))}
    ${row('斗栱攒数',s.zan,s.zan+' 攒',maxOf(x=>x.zan))}
    ${row('柱径 / 柱高',1/s.colRatio,'1 : '+Math.round(s.colRatio),maxOf(x=>1/x.colRatio))}
    <div class="note">低多边形艺术演绎 · 比例归纳自各朝官式做法特征</div>`;
}
function renderTabs(){
  tabsEl.innerHTML='';
  DORDER.forEach(k=>{
    const P=DYNS[k];
    const b=document.createElement('button');
    b.innerHTML=`${P.label}<span class="yr">${P.years}</span>`;
    b.className=k===state.dyn?'on':'';
    b.onclick=()=>{
      if(state.mode==='compare')exitCompare();
      if(state.dyn===k)return;
      state.dyn=k;
      deselect();
      mountSingle(k,true);
      renderLayers();
      renderTabs();renderCard(k);
      $('bCompare').classList.remove('on');
    };
    tabsEl.appendChild(b);
  });
}
function renderLayers(){
  layerList.innerHTML='';
  const pav=state.single;
  pav.layers.forEach((l,i)=>{
    const row=document.createElement('div');
    row.className='lrow';
    row.innerHTML=`<span class="num">${l.num}</span><span class="nm">${l.name}</span>
      <span class="ct">${l.count}件</span><span class="eye">显</span>`;
    row.onclick=()=>{
      if(state.mode==='compare')return;
      l.group.visible=!l.group.visible;
      row.classList.toggle('off',!l.group.visible);
      row.querySelector('.eye').textContent=l.group.visible?'显':'隐';
      updateTagVisibility();
    };
    layerList.appendChild(row);
  });
}

/* ---------- 按钮 ---------- */
$('explode').oninput=e=>{
  if(state.mode==='compare')return;
  const v=e.target.value/100;
  $('expV').textContent=e.target.value+'%';
  applyExplode(v);
};
$('bReset').onclick=()=>{
  if(state.mode==='compare')tweenCamera(new THREE.Vector3(0,10,26.5),new THREE.Vector3(0,3.4,0));
  else tweenCamera(new THREE.Vector3(8.6,5.4,9.8),new THREE.Vector3(0,2.8,0));
};
$('bXray').onclick=e=>{state.xray=!state.xray;e.target.classList.toggle('on',state.xray);applyXray();};
$('bEnv').onclick=e=>{state.env=!state.env;e.target.classList.toggle('on',state.env);envGroup.visible=state.env;};
$('bRot').onclick=e=>{state.autorot=!state.autorot;e.target.classList.toggle('on',state.autorot);controls.autoRotate=state.autorot;};
$('bCompare').onclick=e=>{
  if(state.mode==='single'){enterCompare();e.target.classList.add('on');}
  else{exitCompare();e.target.classList.remove('on');}
};
infoEl.querySelector('.close').onclick=deselect;

/* ================================================================
   9. 拾取 / 高亮 / 信息
================================================================ */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
function pickables(){
  if(state.mode==='single'){
    const arr=[];
    state.single.layers.forEach(l=>{if(l.group.visible)l.group.traverse(o=>{if(o.isMesh&&o.userData.infoKey)arr.push(o);});});
    return arr;
  }
  // 对比模式为合并网格，构件细察请返回单体模式
  return [];
}
function setPointer(e){
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;
  pointer.y=-((e.clientY-r.top)/r.height)*2+1;
}
function pick(e){
  setPointer(e);
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(pickables(),false);
  return hits.length?hits[0].object:null;
}
function select(m){
  deselect();
  state.selected=m; state.selectedMat=m.material;
  m.material=highlightMat;
  const key=m.userData.infoKey,info=INFOS[key];
  // 沿父链找所属营造层级
  let layerName='——';
  let p=m;
  while(p){ if(p.userData&&p.userData.layer){const l=p.userData.layer;layerName=`第${l.num}层 · ${l.name}`;break;} p=p.parent; }
  infoEl.querySelector('.layer').textContent=layerName;
  infoEl.querySelector('h2').textContent=info.n;
  infoEl.querySelector('.py').textContent=info.py;
  infoEl.querySelector('p').textContent=info.t;
  infoEl.querySelector('.joint').innerHTML=`<b>榫卯 · 做法要点</b><br>${info.j}`;
  infoEl.classList.add('show');
}
function deselect(){
  if(state.selected){state.selected.material=state.selectedMat;state.selected=null;}
  infoEl.classList.remove('show');
}

let downXY=null;
renderer.domElement.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY)return;
  const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]);
  downXY=null;
  if(moved>5)return;
  const m=pick(e);
  if(m)select(m);else deselect();
});
renderer.domElement.addEventListener('pointermove',e=>{
  const m=pick(e);
  if(m){
    const info=INFOS[m.userData.infoKey];
    tipEl.style.display='block';
    tipEl.textContent=info.n;
    tipEl.style.left=(e.clientX+14)+'px';
    tipEl.style.top=(e.clientY+10)+'px';
    renderer.domElement.style.cursor='pointer';
  }else{
    tipEl.style.display='none';
    renderer.domElement.style.cursor='';
  }
});

/* ================================================================
   10. 启动 & 主循环
================================================================ */
renderTabs();
renderCard(state.dyn);
mountSingle(state.dyn,true);
renderLayers();

// URL 状态直达：#dyn=qing&explode=60&compare=1&xray=1
(function(){
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  const d=h.get('dyn');
  if(d&&DYNS[d]){
    state.dyn=d; deselect();
    mountSingle(d,false); renderLayers(); renderTabs(); renderCard(d);
  }
  const ex=h.get('explode');
  if(ex!==null){ const v=clamp(parseFloat(ex)||0,0,100); $('explode').value=v; $('expV').textContent=Math.round(v)+'%'; applyExplode(v/100); }
  if(h.get('xray')==='1'){ state.xray=true; $('bXray').classList.add('on'); applyXray(); }
  if(h.get('compare')==='1'){ $('bCompare').click(); }
})();

// 调试截屏：等待动画落定后上传
if(SNAP){
  setTimeout(()=>{
    try{
      controls.update();
      renderer.render(scene,camera);
      renderer.domElement.toBlob(async b=>{
        if(!b)return;
        await fetch('http://127.0.0.1:8138/snap?name='+encodeURIComponent(SNAP),{method:'POST',body:b});
      },'image/png');
    }catch(e){ /* 服务器不在则忽略 */ }
  },4600);
}

// 开场镜头
camera.position.set(20,12,24);
tweenCamera(new THREE.Vector3(8.6,5.4,9.8),new THREE.Vector3(0,2.8,0));
controls.addEventListener('start',()=>{
  if(controls.autoRotate){controls.autoRotate=false;state.autorot=false;$('bRot').classList.remove('on');}
});

let splashGone=false;
function hideSplash(){if(!splashGone){splashGone=true;splash.classList.add('hide');}}
splash.addEventListener('click',hideSplash);
setTimeout(hideSplash,2600);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta(),now=performance.now();
  stepTweens(now);
  if(state.selected){
    highlightMat.emissiveIntensity=0.6+Math.sin(now*0.005)*0.25;
  }
  // 层级角标透明度趋近
  if(state.mode==='single'&&state.single)updateTagVisibilitySoft();
  controls.update();
  renderer.render(scene,camera);
}
function updateTagVisibilitySoft(){
  const pav=state.single;
  pav.layers.forEach((l,i)=>{
    const sp=pav.layerTags[i];if(!sp)return;
    const target=(state.explode>0.12&&l.group.visible)?1:0;
    sp.material.opacity+=(target-sp.material.opacity)*0.12;
    sp.visible=sp.material.opacity>0.03;
  });
}
loop();

// 调试钩子（亦便于外部观测）
window.__app={
  state,controls,camera,
  setView(px,py,pz,tx,ty,tz){tweenCamera(new THREE.Vector3(px,py,pz),new THREE.Vector3(tx,ty,tz));},
  dyn:k=>{document.querySelectorAll('#tabs button')[DORDER.indexOf(k)].click();},
  explode:v=>{$('explode').value=v;applyExplode(v/100);$('expV').textContent=v+'%';},
  compare:()=>{$('bCompare').click();},
  select:(key)=>{const arr=pickables();const m=arr.find(o=>o.userData.infoKey===key);if(m)select(m);}
};
</script>
