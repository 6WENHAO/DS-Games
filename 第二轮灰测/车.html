<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAMBORGHINI AVENTADOR SVJ · PBR 写实 + 内部构造 (Three.js)</title>
<style>
  :root{
    --org:#ff6a00;
    --org2:#ff8a2b;
    --ink:#eef1f6;
    --panel:rgba(14,16,20,.72);
    --line:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#040507;color:var(--ink);
    font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .glass{
    position:fixed;z-index:6;border-radius:14px;padding:13px 15px;
    background:linear-gradient(158deg,rgba(20,23,28,.80),rgba(9,11,14,.62));
    border:1px solid var(--line);
    box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
  }

  /* ---- 左上：车型信息 ---- */
  #card{top:16px;left:16px;width:262px;pointer-events:none}
  #card .mk{font-size:9.5px;letter-spacing:.34em;color:var(--org);font-weight:700}
  #card h1{margin:5px 0 2px;font-size:26px;line-height:1;letter-spacing:.04em;font-weight:800}
  #card h2{margin:0;font-size:11px;letter-spacing:.30em;color:#9fabbb;font-weight:600}
  #card .rule{height:2px;margin:10px 0;background:linear-gradient(90deg,var(--org),rgba(255,106,0,0))}
  #card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:10.5px}
  #card dt{color:#7e8b9b;letter-spacing:.06em}
  #card dd{margin:0;text-align:right;color:#dfe6ef;font-weight:600;font-variant-numeric:tabular-nums}

  /* ---- 右上：实时统计 ---- */
  #stat{top:16px;right:16px;font-size:10px;letter-spacing:.08em;color:#8492a2;pointer-events:none;
    font-variant-numeric:tabular-nums;line-height:1.9}
  #stat b{color:var(--org2);font-weight:700}

  /* ---- 底部：控制台 ---- */
  #dock{bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;
    padding:12px 14px;max-width:min(96vw,860px)}
  .row{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
  .row .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
  .lbl{font-size:9px;letter-spacing:.22em;color:#6f7d8d;margin-right:2px}
  button.b{
    appearance:none;cursor:pointer;border:1px solid var(--line);border-radius:9px;
    background:rgba(255,255,255,.045);color:#cdd6e2;font:600 11px/1 inherit;letter-spacing:.10em;
    padding:9px 11px;transition:.16s ease;white-space:nowrap
  }
  button.b:hover{background:rgba(255,106,0,.14);border-color:rgba(255,106,0,.55);color:#fff}
  button.b.on{background:linear-gradient(180deg,rgba(255,106,0,.34),rgba(255,106,0,.18));
    border-color:var(--org);color:#fff;box-shadow:0 0 18px rgba(255,106,0,.28)}
  .sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.18);cursor:pointer;padding:0;transition:.16s}
  .sw:hover{transform:scale(1.14)}
  .sw.on{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.35)}
  #cutWrap{display:none;align-items:center;gap:9px}
  #cutWrap.show{display:flex}
  input[type=range]{width:190px;accent-color:var(--org);height:16px}

  /* ---- 左下提示 ---- */
  #tip{bottom:16px;left:16px;font-size:10px;color:#788595;letter-spacing:.05em;pointer-events:none;padding:9px 12px}
  #tip b{color:var(--org2);font-weight:700}

  /* ---- 载入 ---- */
  #boot{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:#040507;transition:opacity .8s ease}
  #boot.off{opacity:0;pointer-events:none}
  #boot .bmk{font-size:10px;letter-spacing:.5em;color:var(--org);font-weight:700}
  #boot .bt{font-size:22px;letter-spacing:.22em;font-weight:800}
  #boot .bar{width:min(58vw,300px);height:2px;background:rgba(255,255,255,.10);overflow:hidden;border-radius:2px}
  #boot .bar i{display:block;height:100%;width:36%;background:linear-gradient(90deg,var(--org),#ffd08a);
    animation:slide 1.05s ease-in-out infinite}
  #boot .bs{font-size:10px;letter-spacing:.26em;color:#6f7d8d}
  #boot .berr{display:none;max-width:76vw;text-align:center;font-size:12.5px;line-height:1.9;color:#ffb083}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

  @media (max-width:820px){
    #card{width:208px;padding:10px 12px}
    #card h1{font-size:20px}
    #card dl{display:none}
    #tip,#stat{display:none}
    #dock{gap:7px;padding:9px 10px;bottom:10px}
    button.b{padding:8px 8px;font-size:10px;letter-spacing:.05em}
    input[type=range]{width:120px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="card" class="glass">
  <div class="mk">AUTOMOBILI LAMBORGHINI</div>
  <h1>AVENTADOR</h1>
  <h2>LP 770-4 SVJ</h2>
  <div class="rule"></div>
  <dl>
    <dt>发动机</dt><dd>6.5L V12 自吸</dd>
    <dt>最大功率</dt><dd>770 CV / 8500</dd>
    <dt>峰值扭矩</dt><dd>720 N·m</dd>
    <dt>0–100 km/h</dt><dd>2.8 s</dd>
    <dt>极速</dt><dd>350+ km/h</dd>
    <dt>车身结构</dt><dd>碳纤维单体壳</dd>
    <dt>涂装</dt><dd id="paintName">Arancio Atlas</dd>

</div>

<div id="stat" class="glass">

</div>

<div id="tip" class="glass">
  <b>左键拖拽</b> 环绕 · <b>滚轮/双指</b> 推拉 · <b>右键</b> 平移 · 静止 3 秒自动环绕
</div>

<div id="dock" class="glass">
  <div class="row">
    <span class="lbl">视图</span>
    <button class="b on" id="mSolid">实车</button>
    <button class="b" id="mXray">透视</button>
    <button class="b" id="mCut">剖切</button>
    <button class="b" id="mExp">爆炸</button>
    <button class="b" id="mWire">线框</button>
    <span class="sep"></span>
    <span class="lbl">机位</span>
    <button class="b" id="vHero">全景</button>
    <button class="b" id="vSide">侧身</button>
    <button class="b" id="vFace">前脸</button>
    <button class="b" id="vTail">尾部</button>
    <button class="b" id="vBay">引擎舱</button>
    <button class="b" id="vCab">座舱</button>
  </div>
  <div class="row">
    <span class="lbl">功能</span>
    <button class="b" id="tDoor">剪刀门</button>
    <button class="b" id="tWing">尾翼</button>
    <button class="b" id="tLamp">大灯</button>
    <button class="b on" id="tSpin">自动环绕</button>
    <span class="sep"></span>
    <span class="lbl">涂装</span>
    <button class="sw on" id="c0" style="background:#ff6a00"></button>
    <button class="sw" id="c1" style="background:#e8340c"></button>
    <button class="sw" id="c2" style="background:#c9d400"></button>
    <button class="sw" id="c3" style="background:#1b1d21"></button>
    <span class="sep"></span>
    <span id="cutWrap"><span class="lbl">剖面</span><input type="range" id="cutR" min="-1.05" max="1.05" step="0.01" value="0"></span>
  </div>
</div>

<div id="boot">
  <div class="bmk">AUTOMOBILI LAMBORGHINI</div>
  <div class="bt">AVENTADOR SVJ</div>
  <div class="bar"><i></i></div>
  <div class="bs" id="bootMsg">正在生成 PBR 贴图与车身放样…</div>
  <div class="berr" id="bootErr"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ============================================================================================
   LAMBORGHINI AVENTADOR SVJ —— 单文件 Three.js 写实模型
   ├ 车身：横截面放样（loft）曲面，由 11 条纵向控制曲线驱动，硬折边保留兰博基尼刀锋棱线
   ├ 材质：MeshPhysicalMaterial（clearcoat 清漆 + 金属漆片 + 各向异性），全部贴图程序化生成
   │        法线贴图 / 粗糙度贴图 / 透明度贴图 均由 Canvas 高度场实时求导得到，无任何外部资源
   ├ 内构：碳纤维单体壳、6.5L V12、ISR 变速箱、传动轴、推杆式双叉臂悬挂、排气、油箱、座舱
   └ 交互：透视 / 剖切（局部裁剪面）/ 爆炸 / 线框，剪刀门、升降尾翼、大灯、涂装切换
   坐标系：X 车宽（右+），Y 车高，Z 车长（车头 +Z）；单位：米
   ============================================================================================ */

let THREE, OrbitControls, Reflector, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;
const bootErr = document.getElementById('bootErr');
const bootMsg = document.getElementById('bootMsg');
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
} catch (e) {
  document.querySelector('#boot .bar').style.display = 'none';
  bootMsg.style.display = 'none';
  bootErr.style.display = 'block';
  bootErr.innerHTML = '无法从 CDN 载入 Three.js。请连接网络后刷新，'
    + '或把 importmap 中的 <b>cdn.jsdelivr.net</b> 改为 <b>unpkg.com</b> / 本地 three 副本。<br><small>' + e + '</small>';
  throw e;
}
// 可选增强模块（失败则自动降级，不影响主体）
let HAS_REFLECT = false, HAS_BLOOM = false;
try { ({ Reflector } = await import('three/addons/objects/Reflector.js')); HAS_REFLECT = true; } catch (e) { }
try {
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
  ({ OutputPass } = await import('three/addons/postprocessing/OutputPass.js'));
  HAS_BLOOM = true;
} catch (e) { }

/* ============================================================================================
   0 · 数学与几何工具
   ============================================================================================ */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t * t * (3 - 2 * t);

/** 单调三次 Hermite 插值（控制点 [z,value] 按 z 升序），用于纵向车身曲线，避免过冲 */
function smoothAt(ctrl, z) {
  const n = ctrl.length;
  if (z <= ctrl[0][0]) return ctrl[0][1];
  if (z >= ctrl[n - 1][0]) return ctrl[n - 1][1];
  let i = 0; while (i < n - 2 && z > ctrl[i + 1][0]) i++;
  const z0 = ctrl[i][0], v0 = ctrl[i][1], z1 = ctrl[i + 1][0], v1 = ctrl[i + 1][1];
  const h = z1 - z0, t = (z - z0) / h, s = (v1 - v0) / h;
  const sp = i > 0 ? (v0 - ctrl[i - 1][1]) / (z0 - ctrl[i - 1][0]) : s;
  const sn = i + 2 < n ? (ctrl[i + 2][1] - v1) / (ctrl[i + 2][0] - z1) : s;
  let m0 = (sp + s) * .5, m1 = (s + sn) * .5;
  if (s === 0) { m0 = 0; m1 = 0; } else {
    if (m0 / s < 0) m0 = 0; if (m1 / s < 0) m1 = 0;
    if (m0 / s > 3) m0 = 3 * s; if (m1 / s > 3) m1 = 3 * s;
  }
  const t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * v0 + (t3 - 2 * t2 + t) * h * m0 + (-2 * t3 + 3 * t2) * v1 + (t3 - t2) * h * m1;
}

const BOX = (w, h, d, sw, sh, sd) => new THREE.BoxGeometry(w, h, d, sw, sh, sd);
const CYL = (rt, rb, h, s, o) => new THREE.CylinderGeometry(rt, rb, h, s || 20, 1, !!o);
const SPH = (r, w, h) => new THREE.SphereGeometry(r, w || 20, h || 14);

/** 圆角盒（用 SphereGeometry 顶点重投影得到软边方块，做发动机缸体/油箱等） */
function roundBox(w, h, d, r, seg = 3) {
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const p = g.attributes.position, hx = w / 2 - r, hy = h / 2 - r, hz = d / 2 - r, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const cx = clamp(v.x, -hx, hx), cy = clamp(v.y, -hy, hy), cz = clamp(v.z, -hz, hz);
    const dx = v.x - cx, dy = v.y - cy, dz = v.z - cz, L = Math.hypot(dx, dy, dz) || 1;
    p.setXYZ(i, cx + dx / L * r, cy + dy / L * r, cz + dz / L * r);
  }
  g.computeVertexNormals();
  return g;
}

/** 管道（用于排气头段、油管、线束） */
function tube(pts, r, seg = 24, rad = 8) {
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => V3(p[0], p[1], p[2]))), seg, r, rad, false);
}

/** 镜像几何体（翻转绕序，保证法线朝外） */
function mirrorX(src) {
  const g = src.clone(); g.scale(-1, 1, 1);
  const idx = g.getIndex();
  if (idx) { const a = idx.array; for (let i = 0; i < a.length; i += 3) { const t = a[i]; a[i] = a[i + 2]; a[i + 2] = t; } idx.needsUpdate = true; }
  else for (const k of Object.keys(g.attributes)) {
    const at = g.attributes[k], it = at.itemSize, ar = at.array;
    for (let i = 0; i < at.count; i += 3) for (let c = 0; c < it; c++) {
      const a0 = i * it + c, a2 = (i + 2) * it + c, t = ar[a0]; ar[a0] = ar[a2]; ar[a2] = t;
    }
    at.needsUpdate = true;
  }
  g.computeVertexNormals();
  return g;
}

/** 世界尺度盒式投影 UV（单位：米）
 *  内置几何体的 UV 是 0..1 归一化的，贴到大小不同的零件上会被任意拉伸 —— 这正是
 *  "贴图位置不对"的根因。这里按面法线主轴取另两个世界坐标做 UV，
 *  于是所有零件共享同一物理尺度，碳纤维/蜂窝/皮革的纹理大小与车身放样面完全一致
 *  （车身放样面的 UV 本来就是"弧长-车长"米制）。纹理密度改由 texture.repeat 控制。*/
const BOXUV = new Set();
function uvBox(src) {
  const g = src.index ? src.toNonIndexed() : src.clone();
  const p = g.attributes.position;
  const uv = new Float32Array(p.count * 2);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), fn = new THREE.Vector3(), t2 = new THREE.Vector3();
  for (let i = 0; i < p.count; i += 3) {
    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);
    fn.copy(b).sub(a).cross(t2.copy(c).sub(a));
    const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);
    for (let k = 0; k < 3; k++) {
      const v = k === 0 ? a : k === 1 ? b : c;
      let u, w;
      if (ax >= ay && ax >= az) { u = v.z; w = v.y; }
      else if (ay >= az) { u = v.x; w = v.z; }
      else { u = v.x; w = v.y; }
      uv[(i + k) * 2] = u; uv[(i + k) * 2 + 1] = w;
    }
  }
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

let MESH_COUNT = 0;
/** 建 Mesh 并挂载 */
function put(parent, geo, mat, name, opt = {}) {
  if (BOXUV.has(mat)) geo = uvBox(geo);
  const m = new THREE.Mesh(geo, mat);
  m.name = name; MESH_COUNT++;
  m.castShadow = opt.shadow !== false;
  m.receiveShadow = opt.shadow !== false;
  if (opt.p) m.position.set(opt.p[0], opt.p[1], opt.p[2]);
  if (opt.r) m.rotation.set(opt.r[0], opt.r[1], opt.r[2]);
  if (opt.s) m.scale.set(opt.s[0], opt.s[1], opt.s[2]);
  parent.add(m);
  return m;
}
/** 左右成对（几何体镜像，法线正确） */
function pair(parent, geo, mat, name, opt = {}) {
  const a = put(parent, geo, mat, name + '_R', opt);
  const b = put(parent, mirrorX(geo), mat, name + '_L', opt);
  if (opt.p) b.position.set(-opt.p[0], opt.p[1], opt.p[2]);
  if (opt.r) b.rotation.set(opt.r[0], -opt.r[1], -opt.r[2]);
  return [a, b];
}
/** 同一几何体左右对称摆放（不镜像几何，用于回转体） */
function twin(parent, geo, mat, name, x, y, z, rot) {
  const out = [];
  for (const s of [1, -1]) {
    const m = put(parent, geo, mat, name + (s > 0 ? '_R' : '_L'), { p: [s * x, y, z] });
    if (rot) m.rotation.set(rot[0], s > 0 ? rot[1] : -rot[1], s > 0 ? rot[2] : -rot[2]);
    out.push(m);
  }
  return out;
}
const grp = (parent, name) => { const g = new THREE.Group(); g.name = name; parent.add(g); return g; };

/* ============================================================================================
   1 · 渲染器 / 场景 / 相机
   ============================================================================================ */
const canvas = document.getElementById('gl');
const isMobile = matchMedia('(pointer:coarse)').matches || innerWidth < 820;
const HI = !isMobile;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: HI, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, HI ? 2 : 1.5));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;              // 剖切模式需要
const MAXA = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 260);
camera.position.set(5.6, 1.85, 6.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.minDistance = 2.2;
controls.maxDistance = 20;
controls.minPolarAngle = .05;
controls.maxPolarAngle = 1.545;
controls.autoRotate = true;
controls.autoRotateSpeed = .42;
controls.panSpeed = .6;

/* ============================================================================================
   2 · 程序化 PBR 贴图（Canvas 高度场 → 法线/粗糙度/透明贴图）
   ============================================================================================ */
function cv(size, h) { const c = document.createElement('canvas'); c.width = size; c.height = h || size; return c; }

/** 由灰度高度图求导生成法线贴图（Sobel） */
function heightToNormal(srcCanvas, strength = 2.0) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const s = srcCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  const out = cv(w, h), ctx = out.getContext('2d'), img = ctx.createImageData(w, h);
  const H = (x, y) => {
    const xx = (x + w) % w, yy = (y + h) % h;
    return s[(yy * w + xx) * 4] / 255;
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x - 1, y - 1) + 2 * H(x - 1, y) + H(x - 1, y + 1)) - (H(x + 1, y - 1) + 2 * H(x + 1, y) + H(x + 1, y + 1));
    const dy = (H(x - 1, y - 1) + 2 * H(x, y - 1) + H(x + 1, y - 1)) - (H(x - 1, y + 1) + 2 * H(x, y + 1) + H(x + 1, y + 1));
    let nx = dx * strength, ny = dy * strength, nz = 1;
    const L = Math.hypot(nx, ny, nz);
    const i = (y * w + x) * 4;
    img.data[i] = (nx / L * .5 + .5) * 255;
    img.data[i + 1] = (ny / L * .5 + .5) * 255;
    img.data[i + 2] = (nz / L * .5 + .5) * 255;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return out;
}
function tex(canvas, rep = 1, repY, srgb = false) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep, repY === undefined ? rep : repY);
  t.anisotropy = Math.min(8, MAXA);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/** 值噪声（用于漆面橘皮、金属漆片、地面） */
function noiseCanvas(size, cells, oct = 3, contrast = 1) {
  const c = cv(size), x = c.getContext('2d');
  const rnd = (() => { let s = 20240519; return () => (s = s * 16807 % 2147483647) / 2147483647; })();
  const img = x.createImageData(size, size);
  const grids = [];
  for (let o = 0; o < oct; o++) {
    const n = cells * (1 << o), g = new Float32Array(n * n);
    for (let i = 0; i < n * n; i++) g[i] = rnd();
    grids.push({ n, g });
  }
  const at = (gr, i, j) => gr.g[((j + gr.n) % gr.n) * gr.n + ((i + gr.n) % gr.n)];
  for (let y = 0; y < size; y++) for (let px = 0; px < size; px++) {
    let v = 0, amp = 1, sum = 0;
    for (const gr of grids) {
      const fx = px / size * gr.n, fy = y / size * gr.n;
      const i0 = Math.floor(fx), j0 = Math.floor(fy), tx = ease(fx - i0), ty = ease(fy - j0);
      const a = lerp(at(gr, i0, j0), at(gr, i0 + 1, j0), tx);
      const b = lerp(at(gr, i0, j0 + 1), at(gr, i0 + 1, j0 + 1), tx);
      v += lerp(a, b, ty) * amp; sum += amp; amp *= .5;
    }
    v = clamp((v / sum - .5) * contrast + .5, 0, 1);
    const i = (y * size + px) * 4, g = v * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = g; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}

/* —— 碳纤维（2×2 斜纹编织）：颜色 + 法线 + 粗糙度 —— */
function carbonSet() {
  const S = 256, c = cv(S), x = c.getContext('2d');
  const hc = cv(S), hx = hc.getContext('2d');
  x.fillStyle = '#0a0b0d'; x.fillRect(0, 0, S, S);
  hx.fillStyle = '#808080'; hx.fillRect(0, 0, S, S);
  const tw = S / 8;                                  // 单根纤维束宽度
  for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
    const over = ((i >> 1) + (j >> 1)) % 2 === 0;     // 2×2 斜纹
    const px = i * tw, py = j * tw;
    const g = x.createLinearGradient(px, py, over ? px + tw : px, over ? py : py + tw);
    g.addColorStop(0, '#101216'); g.addColorStop(.42, '#2f343c'); g.addColorStop(.55, '#363c45');
    g.addColorStop(1, '#0d0f12');
    x.fillStyle = g; x.fillRect(px, py, tw, tw);
    const hg = hx.createLinearGradient(px, py, over ? px + tw : px, over ? py : py + tw);
    hg.addColorStop(0, '#3a3a3a'); hg.addColorStop(.5, '#e8e8e8'); hg.addColorStop(1, '#3a3a3a');
    hx.fillStyle = hg; hx.fillRect(px, py, tw, tw);
  }
  return { map: tex(c, 1, 1, true), normal: tex(heightToNormal(hc, 1.5)) };
}

/* —— 金属漆：低频橘皮 + 高频金属漆片 —— */
function paintNormals() {
  return {
    peel: tex(heightToNormal(noiseCanvas(256, 6, 3, .55), .55)),
    flake: tex(heightToNormal(noiseCanvas(256, 128, 1, 1.6), 1.1)),
  };
}

/* —— 轮胎：胎面花纹（周向主沟 + 横向排水槽）法线 + 粗糙度 —— */
function tireSet() {
  const S = 256, h = cv(S), x = h.getContext('2d');
  x.fillStyle = '#d8d8d8'; x.fillRect(0, 0, S, S);
  x.fillStyle = '#101010';                                     // 4 条周向主沟（沿 U 方向）
  for (const gy of [.14, .38, .62, .86]) x.fillRect(0, gy * S - 7, S, 14);
  x.fillStyle = '#232323';                                     // 横向排水槽（左右错位）
  for (let i = 0; i < 18; i++) {
    const px = i * S / 18;
    x.fillRect(px, .15 * S, 6, .22 * S);
    x.fillRect(px + S / 36, .63 * S, 6, .22 * S);
    x.fillRect(px + S / 36, .39 * S, 5, .22 * S);
  }
  const r = cv(64), rx = r.getContext('2d');
  rx.fillStyle = '#d0d0d0'; rx.fillRect(0, 0, 64, 64);
  rx.globalAlpha = .5; rx.drawImage(noiseCanvas(64, 8, 2, 1), 0, 0);
  return { normal: tex(heightToNormal(h, 2.6), 6, 2), rough: tex(r, 6, 2) };
}

/* —— 六边形蜂窝网：颜色 + 透贴（可透视内部）+ 法线 —— */
function hexSet() {
  const S = 256, c = cv(S), x = c.getContext('2d'), a = cv(S), ax = a.getContext('2d');
  const hh = cv(S), hx = hh.getContext('2d');
  x.fillStyle = '#0e1013'; x.fillRect(0, 0, S, S);
  ax.fillStyle = '#ffffff'; ax.fillRect(0, 0, S, S);
  hx.fillStyle = '#f0f0f0'; hx.fillRect(0, 0, S, S);
  const R = 21, w = Math.sqrt(3) / 2 * R;
  const hexPath = (ctx, cx, cy, r) => {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const an = Math.PI / 180 * (60 * k - 30), px = cx + r * Math.cos(an), py = cy + r * Math.sin(an);
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  };
  for (let row = -1; row < 12; row++) for (let col = -1; col < 10; col++) {
    const cx = col * w * 2 + (row & 1 ? w : 0), cy = row * R * 1.5;
    hexPath(x, cx, cy, R * .80); x.fillStyle = '#05060700'; x.fill();
    hexPath(ax, cx, cy, R * .74); ax.fillStyle = '#000'; ax.fill();       // 洞 → 透明
    hexPath(hx, cx, cy, R * .74); hx.fillStyle = '#404040'; hx.fill();
    hexPath(x, cx, cy, R * .84); x.strokeStyle = '#4a5158'; x.lineWidth = 3; x.stroke();
  }
  return { map: tex(c, 1, 1, true), alpha: tex(a), normal: tex(heightToNormal(hh, 1.2)) };
}

/* —— 拉丝金属（各向异性，用于刹车盘/排气/机加工件） —— */
function brushedNormal(lines = 220) {
  const S = 256, h = cv(S), x = h.getContext('2d');
  x.fillStyle = '#808080'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < lines; i++) {
    const y = Math.random() * S, g = 128 + (Math.random() * 2 - 1) * 90;
    x.strokeStyle = 'rgb(' + (g | 0) + ',' + (g | 0) + ',' + (g | 0) + ')';
    x.lineWidth = Math.random() * 1.8 + .3; x.beginPath(); x.moveTo(0, y); x.lineTo(S, y); x.stroke();
  }
  return tex(heightToNormal(h, 1.0), 1, 1);
}

/* —— 皮革 / Alcantara —— */
function leatherSet() {
  const S = 256, h = cv(S), x = h.getContext('2d');
  x.drawImage(noiseCanvas(S, 26, 3, 1.5), 0, 0);
  x.globalAlpha = .5; x.drawImage(noiseCanvas(S, 90, 2, 1.2), 0, 0); x.globalAlpha = 1;
  return { normal: tex(heightToNormal(h, 1.4), 5) };
}

/* —— 散热器鳍片 —— */
function radiatorSet() {
  const S = 128, h = cv(S), x = h.getContext('2d');
  x.fillStyle = '#202020'; x.fillRect(0, 0, S, S);
  x.fillStyle = '#e0e0e0';
  for (let i = 0; i < S; i += 4) x.fillRect(i, 0, 2, S);
  const c = cv(S), cx2 = c.getContext('2d');
  cx2.fillStyle = '#14161a'; cx2.fillRect(0, 0, S, S);
  cx2.fillStyle = '#3c4249'; for (let i = 0; i < S; i += 4) cx2.fillRect(i, 0, 2, S);
  return { map: tex(c, 6, 3, true), normal: tex(heightToNormal(h, 2.2), 6, 3) };
}

/* —— 刹车盘（打孔 + 划痕） —— */
function discSet() {
  const S = 256, h = cv(S), x = h.getContext('2d');
  x.fillStyle = '#909090'; x.fillRect(0, 0, S, S);
  x.strokeStyle = '#b8b8b8'; x.lineWidth = 1;
  for (let i = 0; i < S; i += 3) { x.beginPath(); x.moveTo(0, i); x.lineTo(S, i); x.stroke(); }
  x.fillStyle = '#101010';
  for (let r = 0; r < 5; r++) for (let cIdx = 0; cIdx < 22; cIdx++) {
    const px = (cIdx + (r & 1 ? .5 : 0)) * S / 22, py = 26 + r * 34;
    x.beginPath(); x.arc(px, py, 6, 0, 7); x.fill();
  }
  return { normal: tex(heightToNormal(h, 2.0), 1, 1) };
}

/* —— 地面（抛光混凝土） —— */
function floorSet() {
  const n = noiseCanvas(512, 10, 4, .8);
  const r = cv(512), rx = r.getContext('2d');
  rx.drawImage(n, 0, 0);
  rx.globalAlpha = .55; rx.fillStyle = '#3a3a3a'; rx.fillRect(0, 0, 512, 512);
  return { normal: tex(heightToNormal(n, .35), 26), rough: tex(r, 13) };
}

/* —— 画布文字（车尾铭牌，程序化，无需字体文件） —— */
function textTexture(txt, opt = {}) {
  const W = opt.w || 512, H = opt.h || 128, c = cv(W, H), x = c.getContext('2d');
  x.clearRect(0, 0, W, H);
  x.font = (opt.weight || 700) + ' ' + (opt.size || 74) + 'px "Segoe UI",Arial,sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = opt.color || '#d8dde4';
  x.letterSpacing && (x.letterSpacing = opt.tracking || '10px');
  x.fillText(txt, W / 2, H / 2 + 2);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Math.min(8, MAXA);
  return t;
}

function studioEnvironment() {
  const s = new THREE.Scene();
  const dark = new THREE.MeshBasicMaterial({ color: 0x0b0d10, side: THREE.BackSide });
  s.add(new THREE.Mesh(new THREE.BoxGeometry(26, 14, 26), dark));
  const soft = (w, h, d, x, y, z, col, int, rx, ry) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(int), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); s.add(m);
  };
  soft(16, 2.2, 0, 0, 6.4, 2.6, 0xffffff, 5.2, Math.PI / 2);      // 顶部长条主灯箱
  soft(16, 1.4, 0, 0, 6.4, -3.4, 0xdfe9ff, 3.0, Math.PI / 2);     // 顶部副灯箱
  soft(9, 3.4, 0, -9, 3.0, 0, 0xd8e6ff, 1.7, 0, Math.PI / 2);     // 左侧柔光板
  soft(9, 3.4, 0, 9, 3.0, 0, 0xfff0dd, 1.5, 0, -Math.PI / 2);     // 右侧柔光板
  soft(7, 2.6, 0, 0, 2.2, -11, 0xffb066, 1.9, 0, 0);              // 背景暖光（勾轮廓）
  soft(20, 20, 0, 0, -1.2, 0, 0x0a0b0d, 1, -Math.PI / 2);         // 暗地板
  const pm = new THREE.PMREMGenerator(renderer);
  pm.compileEquirectangularShader();
  const rt = pm.fromScene(s, .02);
  pm.dispose();
  s.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  return rt.texture;
}

   4 · 车身：横截面放样（Loft）
   由 15 条纵向控制曲线定义每个 Z 站位的横截面环（18 点闭合），再放样成连续曲面。
   环点含义（右半，自底向上）——这套拓扑是"像不像大牛"的关键：
     h0 底盘中心 · h1 底盘外缘 · h2 门槛外缘/轮拱内顶 · h3 最宽腰线
     h4 肩线棱（宽车肩顶点）· h5 侧窗根部（肩部平台内缘）· h6 车顶纵梁（侧窗上沿）
     h7 车顶外肩 · h8 车顶过渡 · h9 顶部中心
   h4→h5 是近水平的"肩部平台"，h5→h6 才是近乎直立的侧窗（内倾约 25°），

/** 某个 Z 站位的截面环（20 点闭合，逆序补左半） */
function ringAt(z) {
  const uy = smoothAt(C.uy, z), uw = smoothAt(C.uw, z), sx = smoothAt(C.sx, z), sy = smoothAt(C.sy, z),
    kx = smoothAt(C.kx, z), ky = smoothAt(C.ky, z),
    hw = smoothAt(C.hw, z), hy = smoothAt(C.hy, z), tw = smoothAt(C.tw, z), ty = smoothAt(C.ty, z),
    dw = smoothAt(C.dw, z), dy = smoothAt(C.dy, z), gw = smoothAt(C.gw, z), gy = smoothAt(C.gy, z),
    rw = smoothAt(C.rw, z), ry = smoothAt(C.ry, z), cy = smoothAt(C.cy, z);
  const half = [
    [0, uy], [uw, uy + .014], [sx, sy], [kx, ky], [hw, hy], [tw, ty], [dw, dy], [gw, gy], [rw, ry],
    [rw * .46, ry + (cy - ry) * .58], [0, cy]

  const ring = half.slice();
  for (let i = 9; i >= 1; i--) ring.push([-half[i][0], half[i][1]]);
  return ring;
}

// 站位：车头、车尾、轮拱边缘、风挡与车顶边界处加密，保证棱线与拱口锐利
const ZS = [
  2.42, 2.395, 2.36, 2.31, 2.25, 2.18, 2.10, 2.02, 1.94, 1.865, 1.80, 1.755, 1.72, 1.69, 1.655,
  1.60, 1.53, 1.45, 1.38, 1.31, 1.24, 1.17, 1.10, 1.055, 1.015, .985, .955, .925, .89, .83,
  .75, .69, .655, .62, .56, .48, .38, .26, .13, 0, -.13, -.26, -.38, -.50, -.62, -.72,

const MAT_SLOT = [M.paint, M.carbon, M.matte, M.glass, M.glassDark, M.satin];
// 硬棱线：底盘缘、门槛上下缘、车门切线、肩线棱（其余软化，形成流线大壳的连续曲面）
const HARD_RING = new Set([1, 2, 3, 5, 15, 17, 18, 19]);
const HARD_ST = new Set();

/** 面片材质分配：b = 面片下侧环索引（0..19） */
function bandMat(z, b) {
  const bb = b >= 10 ? 19 - b : b;
  if (bb <= 1) return 2;                                   // 底盘 / 内衬板
  if (bb === 2) return 1;                                  // 碳纤维门槛 / 前后下唇（贯穿全车下缘）
  if (bb === 3) return z > 2.06 ? 2 : 0;                   // 下侧面（车头处为进气口内腔）
  if (bb === 4) return z > 2.12 ? 2 : 0;                   // 上侧面
  if (bb === 5) return 0;                                  // 肩部平台（融入车顶壳的过渡面）
  if (bb === 6) return (z > -1.02 && z < .66) ? 3 : 0;     // 侧窗带（压低后仅一条窄玻璃）
  // bb 7、8、9：车顶 / 前后盖中央（弓形大壳的主体）
  if (z > -.16 && z < .64) return 3;                       // 前风挡（并入玻璃区域）
  if (bb === 8 && z < -1.06 && z > -1.68) return 4;        // 后窗玻璃（仅中央一条）
  if (z < -.96 && z > -1.68) return 4;                     // 引擎盖玻璃（中央六边形区域）
  return 0;
}

/** 车门区域：下侧面 + 上侧面 + 肩部平台 + 侧窗（碳纤维门槛留在车身上） */
const DOOR_BANDS_R = new Set([3, 4, 5, 6]);
const DOOR_BANDS_L = new Set([13, 14, 15, 16]);
const inDoor = (z, b) => (z > -.62 && z < .95) && (DOOR_BANDS_R.has(b) || DOOR_BANDS_L.has(b));

/**
 * 放样器：生成非索引几何 + 材质分组 + 硬边法线
 * keep(zMid, band) 返回 false 则跳过该面片（挖车门洞）
 */
function loft(zs, keep) {
  const nS = zs.length, rings = zs.map(ringAt), nR = rings[0].length;
  const P = rings.map((r, i) => r.map(p => [p[0], p[1], zs[i]]));
  const CY = P.map(r => r.reduce((a, p) => a + p[1], 0) / nR);     // 环心高度（判断朝外）
  const U = P.map(r => { let a = 0; const u = [0]; for (let j = 1; j < nR; j++) { a += Math.hypot(r[j][0] - r[j - 1][0], r[j][1] - r[j - 1][1]); u.push(a); } return u; });

  const FN = [], FLIP = [];
  for (let i = 0; i < nS - 1; i++) {
    const rn = [], rf = [];
    for (let j = 0; j < nR; j++) {
      const j1 = (j + 1) % nR, A = P[i][j], B = P[i][j1], C2 = P[i + 1][j1], D = P[i + 1][j];
      const ux = C2[0] - A[0], uy2 = C2[1] - A[1], uz = C2[2] - A[2];
      const vx = D[0] - B[0], vy = D[1] - B[1], vz = D[2] - B[2];
      let n = [uy2 * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy2 * vx];
      const L = Math.hypot(n[0], n[1], n[2]) || 1; n = [n[0] / L, n[1] / L, n[2] / L];
      const cx = (A[0] + B[0] + C2[0] + D[0]) / 4, cy2 = (A[1] + B[1] + C2[1] + D[1]) / 4;
      const oy = (CY[i] + CY[i + 1]) / 2;
      const flip = (n[0] * cx + n[1] * (cy2 - oy)) < 0;
      if (flip) n = [-n[0], -n[1], -n[2]];
      rn.push(n); rf.push(flip);
    }
    FN.push(rn); FLIP.push(rf);
  }

  // 角点法线：跨硬边界不参与平均
  function cn(i, j, a, b) {
    const acc = [0, 0, 0];
    for (const fi of [a - 1, a]) {
      if (fi < 0 || fi > nS - 2) continue;
      if (fi !== i && HARD_ST.has(a)) continue;
      for (const fjRaw of [b - 1, b]) {
        const fj = (fjRaw + nR) % nR;
        if (fj !== j && HARD_RING.has(((b % nR) + nR) % nR)) continue;
        const n = FN[fi][fj]; acc[0] += n[0]; acc[1] += n[1]; acc[2] += n[2];
      }
    }
    const L = Math.hypot(acc[0], acc[1], acc[2]);
    if (L < 1e-6) return FN[i][j];
    return [acc[0] / L, acc[1] / L, acc[2] / L];
  }

  const buckets = new Map();
  for (let i = 0; i < nS - 1; i++) for (let j = 0; j < nR; j++) {
    const zm = (zs[i] + zs[i + 1]) / 2;
    if (keep && !keep(zm, j)) continue;
    const mi = bandMat(zm, j);
    if (!buckets.has(mi)) buckets.set(mi, []);
    buckets.get(mi).push([i, j]);
  }

  const pos = [], nor = [], uvs = [], groups = [];
  let cursor = 0;
  for (const [mi, list] of [...buckets.entries()].sort((a, b) => a[0] - b[0])) {
    for (const [i, j] of list) {
      const j1 = (j + 1) % nR;
      const A = P[i][j], B = P[i][j1], C2 = P[i + 1][j1], D = P[i + 1][j];
      const nA = cn(i, j, i, j), nB = cn(i, j, i, j + 1), nC = cn(i, j, i + 1, j + 1), nD = cn(i, j, i + 1, j);
      const uA = [U[i][j], zs[i]], uB = [U[i][j1] || (U[i][j] + .12), zs[i]];
      const uC = [U[i + 1][j1] || (U[i + 1][j] + .12), zs[i + 1]], uD = [U[i + 1][j], zs[i + 1]];
      const quad = FLIP[i][j] ? [[A, nA, uA], [D, nD, uD], [C2, nC, uC], [A, nA, uA], [C2, nC, uC], [B, nB, uB]]
        : [[A, nA, uA], [B, nB, uB], [C2, nC, uC], [A, nA, uA], [C2, nC, uC], [D, nD, uD]];
      for (const [p, n, u] of quad) { pos.push(p[0], p[1], p[2]); nor.push(n[0], n[1], n[2]); uvs.push(u[0], u[1]); }
    }
    groups.push([cursor, list.length * 6, mi]);
    cursor += list.length * 6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  for (const [s, c, m] of groups) g.addGroup(s, c, m);
  g.computeBoundingSphere();
  return g;
}

/** 端面封盖（三角扇） */
function capGeo(z, outward) {
  const r = ringAt(z), n = r.length, cx = 0, cy = r.reduce((a, p) => a + p[1], 0) / n;
  const pos = [], nor = [], uvs = [];
  for (let j = 0; j < n; j++) {
    const a = r[j], b = r[(j + 1) % n];
    const tri = outward > 0 ? [[cx, cy], a, b] : [[cx, cy], b, a];
    for (const p of tri) { pos.push(p[0], p[1], z); nor.push(0, 0, outward); uvs.push(p[0], p[1]); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  return g;
}

// ---- 挤出辅助：三种朝向的板件 ----
function shapeOf(pts) {
  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath(); return s;
}
function extr(pts, depth, bev) {
  return new THREE.ExtrudeGeometry(shapeOf(pts), {
    depth, steps: 1, curveSegments: 2, bevelEnabled: bev !== 0,
    bevelThickness: bev || .006, bevelSize: bev || .006, bevelOffset: 0, bevelSegments: 1
  });
}
/** 平板：轮廓在 (x,z)，厚度沿 Y */
function plateXZ(pts, t, bev) { const g = extr(pts, t, bev); g.rotateX(Math.PI / 2); g.translate(0, t / 2, 0); return g; }
/** 立板：轮廓在 (x,y)，厚度沿 Z */
function plateXY(pts, t, bev) { const g = extr(pts, t, bev); g.translate(0, 0, -t / 2); return g; }
/** 侧板：轮廓在 (z,y)，厚度沿 X */
function plateZY(pts, t, bev) { const g = extr(pts, t, bev); g.rotateY(-Math.PI / 2); g.translate(t / 2, 0, 0); return g; }

/* ---- 剪刀门（复用同一放样曲面，向内偏 4.5 mm 形成钣金缝） ---- */
const DOOR_HINGE = [.720, .900, .945];
function buildDoor(side) {
  const g = loft(ZS, (z, b) => inDoor(z, b) && (side > 0 ? DOOR_BANDS_R.has(b) : DOOR_BANDS_L.has(b)));
  g.scale(.9955, 1, 1);
  g.translate(-side * DOOR_HINGE[0], -DOOR_HINGE[1], -DOOR_HINGE[2]);
  const pivot = new THREE.Group();
  pivot.name = 'doorPivot' + (side > 0 ? 'R' : 'L');
  pivot.position.set(side * DOOR_HINGE[0], DOOR_HINGE[1], DOOR_HINGE[2]);
  const m = new THREE.Mesh(g, MAT_SLOT);

function rod(parent, a, b, r, mat, name, seg = 10) {
  const A = V3(a[0], a[1], a[2]), B = V3(b[0], b[1], b[2]);

  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);

/* 9.4 推杆式双叉臂悬挂（四轮） */
function suspension(side, front) {
  const s = side, f = front;
  const g = grp(gIn, (f ? 'suspF' : 'suspR') + (s > 0 ? 'R' : 'L'));
  const az = f ? CAR.axF : CAR.axR, hx = (f ? CAR.wF.x : CAR.wR.x), hy = f ? CAR.wF.r : CAR.wR.r;
  const inX = f ? .40 : .44;
  const lo = [s * (hx - .10), hy * .62, az], up = [s * (hx - .13), hy * 1.38, az];
  // 下叉臂
  rod(g, [s * inX, .215, az - .26], lo, .026, M.alu, 'lcaA');
  rod(g, [s * inX, .215, az + .26], lo, .026, M.alu, 'lcaB');
  // 上叉臂
  rod(g, [s * (inX - .02), hy * 1.42, az - .22], up, .022, M.alu, 'ucaA');
  rod(g, [s * (inX - .02), hy * 1.42, az + .22], up, .022, M.alu, 'ucaB');
  // 转向节 / 轮毂支架
  put(g, roundBox(.075, hy * .95, .12, .03), M.aluCast, 'upright', { p: [s * (hx - .115), hy, az] });
  put(g, CYL(.045, .045, .10, 14), M.steel, 'stubAxle', { p: [s * (hx - .06), hy, az], r: [0, 0, Math.PI / 2], shadow: false });
  // 推杆 + 摇臂 + 弹簧减振器（内置）
  const rockZ = az + (f ? .10 : -.10);
  rod(g, lo, [s * .30, hy + .34, rockZ], .020, M.steel, 'pushrod');
  put(g, plateZY([[-.10, -.05], [.10, -.05], [.07, .09], [-.07, .09]], .022, 0), M.alu, 'rocker',
    { p: [s * .30, hy + .34, rockZ] });
  const damperA = [s * .26, hy + .34, rockZ], damperB = [s * .04, hy + .16, rockZ + (f ? .04 : -.04)];
  rod(g, damperA, damperB, .022, M.steel, 'damper');
  const dl = Math.hypot(damperA[0] - damperB[0], damperA[1] - damperB[1], damperA[2] - damperB[2]);
  const spr = put(g, coilSpring(dl * .8, .046, 7, .0085), M.spring, 'spring',
    { p: [(damperA[0] + damperB[0]) / 2, (damperA[1] + damperB[1]) / 2, (damperA[2] + damperB[2]) / 2] });
  spr.quaternion.setFromUnitVectors(V3(0, 1, 0), V3(damperB[0] - damperA[0], damperB[1] - damperA[1], damperB[2] - damperA[2]).normalize());
  // 防倾杆 + 连杆
  rod(g, [s * .10, hy + .30, rockZ + (f ? .16 : -.16)], [s * .30, hy + .30, rockZ + (f ? .16 : -.16)], .014, M.steel, 'arb');
  // 转向拉杆（前）/ 前束拉杆（后）
  rod(g, [s * .22, hy * .78, az + (f ? -.20 : .20)], [s * (hx - .13), hy * .82, az + (f ? -.14 : .14)], .015, M.steel, 'tieRod');
  // 刹车导风管
  put(g, tube([[s * .34, .20, az + .30], [s * .55, .20, az + .16], [s * (hx - .18), hy * .7, az + .04]], .028, 10, 7), M.rubber, 'brakeDuct', { shadow: false });
  return g;
}

    transparent: !!reflector, opacity: reflector ? .62 : 1, envMapIntensity: .55, depthWrite: !reflector
  }));
floorTop.rotation.x = -Math.PI / 2; floorTop.position.y = .006; floorTop.renderOrder = 1;
floorTop.receiveShadow = false;                       // 阴影统一由 shadowCatcher 承接
gFloor.add(floorTop); MESH_COUNT++;
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(22, 22),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: .62, depthWrite: false }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = .010;
shadowCatcher.receiveShadow = true; shadowCatcher.renderOrder = 2;
gFloor.add(shadowCatcher); MESH_COUNT++;
// 展台光圈
const halo = new THREE.Mesh(new THREE.RingGeometry(5.4, 5.48, 96),
  new THREE.MeshBasicMaterial({ color: 0xff6a00, transparent: true, opacity: .30, side: THREE.DoubleSide, depthWrite: false }));
halo.rotation.x = -Math.PI / 2; halo.position.y = .014; halo.renderOrder = 3; gFloor.add(halo);

/* ============================================================================================
   11 · 后处理（Bloom；失败自动降级为直接渲染）
   ============================================================================================ */
let composer = null, bloomPass = null;
if (HAS_BLOOM && HI) {
  try {
    const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
    composer = new EffectComposer(renderer, rt);
    composer.addPass(new RenderPass(scene, camera));
    bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .40, .62, .86);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
  } catch (e) { composer = null; }
}

/* ============================================================================================
   12 · 视图模式 / 交互
   ============================================================================================ */
// 记录外壳材质的原始状态，便于透视模式恢复
for (const m of EXT_MATS) m.userData.base = { t: m.transparent, o: m.opacity, d: m.depthWrite, s: m.side };
const XRAY_OP = new Map([[M.paint, .17], [M.carbon, .16], [M.matte, .14], [M.satin, .16],
[M.glass, .10], [M.glassDark, .10], [M.hex, .14], [M.lens, .12],
[M.tire, .16], [M.sidewall, .16], [M.rim, .22], [M.rimLip, .26]]);

const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
let mode = 'solid', wireOn = false;
const btn = id => document.getElementById(id);
const MODE_BTN = { solid: btn('mSolid'), xray: btn('mXray'), cut: btn('mCut'), exp: btn('mExp') };

// 爆炸视图位移表
const EXPLODE = [];
function reg(obj, dx, dy, dz) { if (obj) EXPLODE.push({ o: obj, base: obj.position.clone(), off: V3(dx, dy, dz) }); }
reg(bodyMesh, 0, .92, 0); reg(gShell.getObjectByName('noseCap'), 0, .92, 0); reg(gShell.getObjectByName('tailPanel'), 0, .92, 0);
reg(doorR, .62, .22, 0); reg(doorL, -.62, .22, 0);
reg(gFront, 0, .18, .95); reg(gRear, 0, .18, -.95); reg(gWing, 0, .78, -.30);
reg(gSide.getObjectByName('sideR'), .55, 0, 0); reg(gSide.getObjectByName('sideL'), -.55, 0, 0);
for (const w of wheelRefs) reg(w.hub, w.side * .62, 0, 0);
reg(gEngine, 0, .95, -.10); reg(gCab, 0, .40, 0); reg(gCool, 0, .30, .25); reg(gExh, 0, -.28, -.30);

function applyMode() {
  const xray = mode === 'xray', cut = mode === 'cut';
  for (const m of EXT_MATS) {
    const b = m.userData.base;
    m.transparent = xray ? true : b.t;
    m.opacity = xray ? (XRAY_OP.get(m) || .16) : b.o;
    m.depthWrite = xray ? false : b.d;
    m.clippingPlanes = cut ? [cutPlane] : null;
    m.needsUpdate = true;
  }
  for (const k in MODE_BTN) MODE_BTN[k].classList.toggle('on', mode === k);
  btn('cutWrap').classList.toggle('show', cut);
  halo.material.opacity = xray ? .5 : .3;
  if (bloomPass) bloomPass.strength = xray ? .62 : .40;
}
for (const k in MODE_BTN) MODE_BTN[k].onclick = () => { mode = k; applyMode(); };
btn('mWire').onclick = () => {
  wireOn = !wireOn;
  btn('mWire').classList.toggle('on', wireOn);
  for (const m of ALL_MATS) { m.wireframe = wireOn; m.needsUpdate = true; }
};
btn('cutR').oninput = e => { cutPlane.constant = parseFloat(e.target.value); };

// —— 剪刀门 / 尾翼 / 大灯 / 自动环绕 ——
const anim = { door: 0, doorT: 0, wing: 0, wingT: 0, exp: 0, lamp: 0 };
btn('tDoor').onclick = e => { anim.doorT = anim.doorT > .5 ? 0 : 1; e.currentTarget.classList.toggle('on', anim.doorT > .5); };
btn('tWing').onclick = e => { anim.wingT = anim.wingT > .5 ? 0 : 1; e.currentTarget.classList.toggle('on', anim.wingT > .5); };
btn('tLamp').onclick = e => {
  anim.lamp = anim.lamp ? 0 : 1;
  e.currentTarget.classList.toggle('on', !!anim.lamp);
  M.ledCold.emissiveIntensity = anim.lamp ? 3.4 : 0;
  M.ledAmber.emissiveIntensity = anim.lamp ? 2.6 : 1.6;
  M.ledRed.emissiveIntensity = anim.lamp ? 4.0 : 2.6;
  for (const b of beams) b.intensity = anim.lamp ? 70 : 0;
};
btn('tSpin').onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.classList.toggle('on', controls.autoRotate); };

// —— 涂装 ——
const SW = [['c0', 'atlas'], ['c1', 'argos'], ['c2', 'verde'], ['c3', 'nero']];
for (const [id, key2] of SW) btn(id).onclick = () => {
  const p = PAINTS[key2];
  M.paint.color.setHex(p.c);
  M.paint.metalness = key2 === 'nero' ? .78 : .62;
  btn('paintName').textContent = p.name;
  SW.forEach(([i2]) => btn(i2).classList.toggle('on', i2 === id));
  M.orgAcc.color.setHex(key2 === 'atlas' ? 0xff6a00 : 0xff7a1a);
};

// —— 预设机位（平滑过渡）——
const VIEWS = {
  vHero: [[5.6, 1.85, 6.2], [0, .62, 0]],
  vSide: [[8.3, .82, .25], [0, .60, 0]],
  vFace: [[.85, 1.02, 7.3], [0, .56, 1.30]],
  vTail: [[-1.5, 1.30, -6.6], [0, .70, -1.60]],
  vBay: [[1.55, 1.92, -2.30], [0, .78, -1.35]],
  vCab: [[-1.95, 1.42, 1.55], [0, .74, .10]],
};
let fly = null;
for (const id in VIEWS) btn(id).onclick = () => {
  fly = { p: V3(...VIEWS[id][0]), t: V3(...VIEWS[id][1]) };
  controls.autoRotate = false; btn('tSpin').classList.remove('on');
};
// 交互后 3 秒恢复自动环绕
let idle = null;
controls.addEventListener('start', () => { clearTimeout(idle); controls.autoRotate = false; btn('tSpin').classList.remove('on'); fly = null; });
controls.addEventListener('end', () => {
  clearTimeout(idle);
  idle = setTimeout(() => { controls.autoRotate = true; btn('tSpin').classList.add('on'); }, 3000);
});
applyMode();

/* ============================================================================================
   13 · 自适应与渲染循环
   ============================================================================================ */
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, HI ? 2 : 1.5));
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
}
addEventListener('resize', resize, { passive: true });
addEventListener('orientationchange', () => setTimeout(resize, 140));

const sFps = btn('sFps'), sTri = btn('sTri'), sCall = btn('sCall');
let acc = 0, frames = 0, booted = false;
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);

  // 机位过渡
  if (fly) {
    camera.position.lerp(fly.p, 1 - Math.pow(.012, dt));
    controls.target.lerp(fly.t, 1 - Math.pow(.012, dt));
    if (camera.position.distanceTo(fly.p) < .03) fly = null;
  }
  // 剪刀门
  anim.door += (anim.doorT - anim.door) * Math.min(1, dt * 3.4);
  const dA = ease(clamp(anim.door, 0, 1)) * .88;
  doorR.rotation.x = dA; doorL.rotation.x = dA;
  doorR.position.x = DOOR_HINGE[0] + dA * .075; doorL.position.x = -(DOOR_HINGE[0] + dA * .075);
  // ALA 尾翼
  anim.wing += (anim.wingT - anim.wing) * Math.min(1, dt * 3.0);
  const wA = ease(clamp(anim.wing, 0, 1));
  wingPivot.rotation.x = wA * .26;
  wingPivot.position.y = 1.128 + wA * .085;
  // 爆炸视图
  const expT = mode === 'exp' ? 1 : 0;
  anim.exp += (expT - anim.exp) * Math.min(1, dt * 2.6);
  const eT = ease(clamp(anim.exp, 0, 1));
  if (Math.abs(anim.exp - expT) > .0004 || eT > .0004) {
    for (const it of EXPLODE) {
      it.o.position.set(it.base.x + it.off.x * eT, it.base.y + it.off.y * eT, it.base.z + it.off.z * eT);
    }
    // 车门铰链位移需叠加剪刀门开合
    doorR.position.x = DOOR_HINGE[0] + dA * .075 + .62 * eT;
    doorL.position.x = -(DOOR_HINGE[0] + dA * .075) - .62 * eT;
  }
  // 剖切模式下轻微呼吸，强调剖面结构
  controls.update();

  if (composer) composer.render(dt); else renderer.render(scene, camera);

  // 统计
  frames++; acc += dt;
  if (acc > .5) {
    sFps.textContent = (frames / acc).toFixed(0);
    sTri.textContent = (renderer.info.render.triangles / 1000).toFixed(1) + 'k';
    sCall.textContent = renderer.info.render.calls;
    frames = 0; acc = 0;
  }
  if (!booted) { booted = true; document.getElementById('boot').classList.add('off'); }
}
resize();
tick();

// 控制台调试入口
window.SVJ = { car, scene, camera, controls, renderer, M, TX, groups: { gShell, gDoors, gFront, gRear, gSide, gWing, gWheels, gIn }, meshCount: MESH_COUNT };
</script>
</body>
</html>
