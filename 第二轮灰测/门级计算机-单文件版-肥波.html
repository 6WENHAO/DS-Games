<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从逻辑门到程序 —— 门级 8 位计算机</title>
<style>
/* style.css —— 深色现代化 UI */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b1020;
  --panel: #111831;
  --panel2: #182136;
  --border: #26314d;
  --text: #dbe3f0;
  --dim: #7d8ba3;
  --cyan: #22d3ee;
  --green: #34d399;
  --orange: #fb923c;
  --red: #f87171;
  --violet: #818cf8;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.mono, textarea, .ram-cell, .kv.mono b { font-family: Consolas, "Cascadia Mono", monospace; }
.dim { color: var(--dim); }
.hidden { display: none !important; }

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; gap: 12px; flex-wrap: wrap;
  background: linear-gradient(180deg, #141c36, #101630);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo {
  font-size: 24px; color: var(--cyan);
  width: 40px; height: 40px; display: grid; place-items: center;
  background: rgba(34, 211, 238, .1); border: 1px solid rgba(34, 211, 238, .3); border-radius: 10px;
}
.brand h1 { font-size: 16px; letter-spacing: .5px; }
.brand p { font-size: 11px; color: var(--dim); }
.controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vsep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.btn {
  background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn.primary { background: rgba(34,211,238,.12); border-color: rgba(34,211,238,.5); color: var(--cyan); }
.btn.run { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.5); color: var(--green); }
.btn.pause { background: rgba(251,146,60,.12); border-color: rgba(251,146,60,.5); color: var(--orange); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.speed { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
.speed input { width: 130px; accent-color: var(--cyan); }
.speed b { color: var(--cyan); min-width: 56px; }

/* ---------- 三栏布局 ---------- */
#layout {
  flex: 1; display: grid;
  grid-template-columns: 300px 1fr 320px;
  gap: 8px; padding: 8px; min-height: 0;
}
#left-col, #right-col {
  display: flex; flex-direction: column; gap: 8px;
  min-height: 0; overflow-y: auto;
}
#center-col {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden;
}
.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px;
}
.panel h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; }
select {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 6px; font-size: 12px; max-width: 170px;
}

/* ---------- 汇编编辑器 ---------- */
#asm-editor {
  width: 100%; height: 300px; resize: vertical;
  background: #0d1226; color: #c8e6ff;
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; font-size: 13px; line-height: 1.55;
  outline: none; white-space: pre;
}
#asm-editor:focus { border-color: var(--cyan); }
.asm-err { color: var(--red); font-size: 12px; padding: 2px 0; }
.cur-src { color: var(--green); font-size: 12px; margin-top: 6px; min-height: 16px; }

/* ---------- 画布区 ---------- */
#canvas-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap;
}
#breadcrumb { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.bc-item {
  background: none; border: none; color: var(--dim); cursor: pointer;
  font-size: 13px; padding: 3px 6px; border-radius: 5px;
}
.bc-item:hover { color: var(--cyan); background: rgba(34,211,238,.08); }
.bc-item.cur { color: var(--text); font-weight: 700; }
.bc-sep { color: var(--border); }
.canvas-tools { display: flex; align-items: center; gap: 8px; }
.hint { font-size: 11px; color: var(--dim); }
#circuit-canvas { flex: 1; width: 100%; min-height: 0; cursor: grab; display: block; }
#circuit-canvas:active { cursor: grabbing; }
#status-bar {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 6px 12px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--dim); flex-wrap: wrap;
}
#status-msg.err { color: var(--red); }
.stats b { color: var(--cyan); }

/* ---------- 状态面板 ---------- */
.kv {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 4px 0; border-bottom: 1px dashed rgba(38,49,77,.6);
  font-size: 12px;
}
.kv:last-child { border-bottom: none; }
.kv span { color: var(--dim); white-space: nowrap; }
.kv b { color: var(--cyan); font-weight: 600; text-align: right; word-break: break-all; }
.bus-error { color: var(--red); font-weight: 700; font-size: 12px; }

#signal-list { display: flex; flex-wrap: wrap; gap: 4px; }
.sig {
  font-family: Consolas, monospace; font-size: 11px;
  padding: 3px 6px; border-radius: 5px;
  background: var(--panel2); color: var(--dim);
  border: 1px solid var(--border);
  transition: all .12s;
}
.sig.on {
  background: rgba(52,211,153,.15); color: var(--green);
  border-color: rgba(52,211,153,.6); font-weight: 700;
}

.inspector { max-height: 220px; overflow-y: auto; }
.ins-row {
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 12px; padding: 3px 0; border-bottom: 1px dashed rgba(38,49,77,.6);
}
.ins-row span { color: var(--dim); }
.ins-row b { color: var(--text); font-family: Consolas, monospace; font-weight: 500; }

/* ---------- 测试 ---------- */
#test-results { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.test-row { font-size: 12px; padding: 3px 6px; border-radius: 4px; }
.test-row.pass { color: var(--green); background: rgba(52,211,153,.06); }
.test-row.fail { color: var(--red); background: rgba(248,113,113,.08); }

/* ---------- RAM ---------- */
#bottom { padding: 0 8px 8px; }
.ram-panel { max-height: 190px; display: flex; flex-direction: column; }
#ram-grid {
  display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px;
  overflow-y: auto;
}
.ram-cell {
  font-size: 10px; text-align: center; padding: 3px 0;
  background: var(--panel2); color: #4d5c78;
  border-radius: 3px; cursor: pointer; border: 1px solid transparent;
  transition: background .15s;
}
.ram-cell:hover { border-color: var(--cyan); }
.ram-cell.nonzero { color: var(--text); }
.ram-cell.pc { background: rgba(52,211,153,.25); color: var(--green); font-weight: 700; }
.ram-cell.mar { border-color: var(--orange); color: var(--orange); }
.ram-cell.written { background: rgba(251,146,60,.25); }
.legend { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
.lg { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 3px; }
.lg.pc { background: rgba(52,211,153,.5); }
.lg.mar { border: 1px solid var(--orange); }
.lg.written { background: rgba(251,146,60,.5); }

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 响应式 ---------- */
@media (max-width: 1200px) {
  #layout { grid-template-columns: 260px 1fr 280px; }
}
@media (max-width: 950px) {
  #layout { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; }
  body { overflow: auto; }
}

</style>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo">⊕</span>
    <div>
      <h1>从逻辑门到程序</h1>
      <p>门级仿真 · 8 位 CPU · 微指令控制 · 真实总线</p>
    </div>
  </div>
  <div class="controls">
    <button id="btn-assemble" class="btn primary" title="汇编源码并装载入 RAM">⚙ 汇编并装载</button>
    <span class="vsep"></span>
    <button id="btn-micro" class="btn" title="执行一个时钟周期（一条微指令）">⏯ 微步</button>
    <button id="btn-instr" class="btn" title="执行完整一条指令">⏭ 单条指令</button>
    <button id="btn-run" class="btn run" title="按时钟频率连续运行">▶ 运行</button>
    <button id="btn-pause" class="btn pause hidden" title="暂停">⏸ 暂停</button>
    <button id="btn-reset" class="btn" title="复位 CPU（寄存器清零，内存保留）">↺ 复位</button>
    <span class="vsep"></span>
    <label class="speed">
      时钟 <input id="speed-slider" type="range" min="1" max="100" value="28">
      <b id="speed-label">4 Hz</b>
    </label>
  </div>
</header>

<main id="layout">
  <!-- 左：汇编 -->
  <section id="left-col">
    <div class="panel">
      <div class="panel-head">
        <h2>汇编程序</h2>
        <select id="example-select" title="内置示例程序"></select>
      </div>
      <textarea id="asm-editor" spellcheck="false" wrap="off"></textarea>
      <div id="asm-errors"></div>
      <div id="cur-src" class="cur-src"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h2>自动测试</h2>
        <button id="btn-tests" class="btn small">▶ 运行全部测试</button>
      </div>
      <div id="test-results"></div>
    </div>
  </section>

  <!-- 中：电路可视化 -->
  <section id="center-col">
    <div id="canvas-toolbar">
      <nav id="breadcrumb"></nav>
      <div class="canvas-tools">
        <button id="btn-fit" class="btn small" title="自动取景">⤢ 取景</button>
        <span class="hint">拖动平移 · 滚轮缩放 · 点击下钻/查看</span>
      </div>
    </div>
    <canvas id="circuit-canvas"></canvas>
    <div id="status-bar">
      <span id="status-msg">初始化中…</span>
      <span class="stats">
        门数 <b id="stat-gates">0</b> ·
        门求值 <b id="stat-evals">0</b> ·
        周期 <b id="stat-cycles">0</b> ·
        指令 <b id="stat-instrs">0</b>
      </span>
    </div>
  </section>

  <!-- 右：CPU 状态 -->
  <section id="right-col">
    <div class="panel">
      <h2>执行状态</h2>
      <div class="kv"><span>当前指令</span><b id="cur-instr">—</b></div>
      <div class="kv"><span>控制器状态</span><b id="cu-state">—</b></div>
      <div class="kv"><span>刚完成微操作</span><b id="cu-micro">—</b></div>
      <div class="kv"><span>下一微操作</span><b id="cu-next">—</b></div>
      <div id="bus-error" class="bus-error"></div>
    </div>
    <div class="panel">
      <h2>寄存器</h2>
      <div class="kv mono"><span>PC</span><b id="reg-PC"></b></div>
      <div class="kv mono"><span>MAR</span><b id="reg-MAR"></b></div>
      <div class="kv mono"><span>IR</span><b id="reg-IR"></b></div>
      <div class="kv mono"><span>A</span><b id="reg-A"></b></div>
      <div class="kv mono"><span>B</span><b id="reg-B"></b></div>
      <div class="kv mono"><span>TMP</span><b id="reg-TMP"></b></div>
      <div class="kv mono"><span>FLAGS</span><b id="reg-FLAGS"></b></div>
    </div>
    <div class="panel">
      <h2>总线 / ALU</h2>
      <div class="kv mono"><span>数据总线</span><b id="bus-data"></b></div>
      <div class="kv mono"><span>地址总线</span><b id="bus-addr"></b></div>
      <div class="kv mono"><span>ALU·A 输入</span><b id="alu-a"></b></div>
      <div class="kv mono"><span>ALU·B 输入</span><b id="alu-b"></b></div>
      <div class="kv mono"><span>ALU 操作</span><b id="alu-op"></b></div>
      <div class="kv mono"><span>ALU 输出</span><b id="alu-out"></b></div>
    </div>
    <div class="panel">
      <h2>控制信号</h2>
      <div id="signal-list"></div>
    </div>
    <div class="panel">
      <h2 id="inspector-title">检查器（点击电路元素）</h2>
      <div id="inspector-body" class="inspector"></div>
    </div>
  </section>
</main>

<!-- 底部：RAM -->
<footer id="bottom">
  <div class="panel ram-panel">
    <div class="panel-head">
      <h2>RAM 256×8</h2>
      <span id="ram-info" class="mono dim"></span>
      <span class="legend">
        <i class="lg pc"></i>PC
        <i class="lg mar"></i>MAR/地址总线
        <i class="lg written"></i>最近写入
      </span>
    </div>
    <div id="ram-grid"></div>
  </div>
</footer>

<script>
/**
 * sim.js —— 门级事件驱动数字电路仿真内核
 *
 * 所有更高层组件（加法器、ALU、寄存器、CPU）都建立在这里的
 * 网络(net)与逻辑门(gate)之上。仿真是事件驱动的：某条网络电平
 * 变化 -> 其扇出的门被重新求值 -> 若输出变化则继续传播，直到稳定。
 *
 * 特性：
 *  - 确定性：相同初始状态 + 相同输入序列 => 完全相同的事件顺序。
 *  - 传播轨迹(trace)：记录每次电平翻转的先后顺序，供 UI 播放
 *    “信号在电路中传播”的动画。
 *  - hook：用于把 RAM 这类宏单元(SRAM 阵列)接入电路（地址线变化
 *    时组合式地驱动数据输出线）。
 */
'use strict';
(function (G) {
  const NS = (G.LGC = G.LGC || {});

  /** 各类门的求值函数，输入为 0/1 数组 */
  const GATE_EVAL = {
    AND:  (v) => { for (let i = 0; i < v.length; i++) if (!v[i]) return 0; return 1; },
    OR:   (v) => { for (let i = 0; i < v.length; i++) if (v[i]) return 1; return 0; },
    NAND: (v) => { for (let i = 0; i < v.length; i++) if (!v[i]) return 1; return 0; },
    NOR:  (v) => { for (let i = 0; i < v.length; i++) if (v[i]) return 0; return 1; },
    XOR:  (v) => { let x = 0; for (let i = 0; i < v.length; i++) x ^= v[i]; return x; },
    XNOR: (v) => { let x = 1; for (let i = 0; i < v.length; i++) x ^= v[i]; return x; },
    NOT:  (v) => (v[0] ? 0 : 1),
    BUF:  (v) => (v[0] ? 1 : 0),
  };

  class Sim {
    constructor() {
      /** @type {{id:number,name:string,val:number,fan:number[],hooks:number[],lastChange:number,driver:number}[]} */
      this.nets = [];
      /** @type {{id:number,type:string,ins:number[],out:number,name:string}[]} */
      this.gates = [];
      /** @type {{id:number,fn:Function}[]} */
      this.hooks = [];
      this.tick = 0;            // 全局事件计数（单调递增）
      this.trace = null;        // 若非 null，则记录 {net,val,order}
      this._queue = [];
      this._queued = new Set(); // gate 用 id，hook 用 -1-id
      this.gateEvalCount = 0;   // 性能统计
    }

    /** 新建一条网络(导线)，返回 id */
    net(name) {
      const n = {
        id: this.nets.length,
        name: name || 'n' + this.nets.length,
        val: 0,
        fan: [],
        hooks: [],
        lastChange: 0,
        driver: -1,
      };
      this.nets.push(n);
      return n.id;
    }

    /** 新建一批网络 */
    bus(name, width) {
      const arr = [];
      for (let i = 0; i < width; i++) arr.push(this.net(name + i));
      return arr;
    }

    /**
     * 新建一个门。ins 为输入网络 id 数组；out 可传入既有网络
     * （用于交叉耦合的锁存器），否则自动新建。返回输出网络 id。
     */
    gate(type, ins, out, name) {
      if (!GATE_EVAL[type]) throw new Error('未知门类型: ' + type);
      if (out === undefined || out === null) out = this.net(name || type.toLowerCase());
      const g = { id: this.gates.length, type, ins: ins.slice(), out, name: name || type };
      this.gates.push(g);
      for (const i of ins) this.nets[i].fan.push(g.id);
      if (this.nets[out].driver >= 0) throw new Error('网络已有驱动源: ' + this.nets[out].name);
      this.nets[out].driver = g.id;
      this._enq(g.id);
      return out;
    }

    /** 注册 hook：ins 中任一网络变化时调用 fn(sim)。用于 RAM 宏单元。 */
    hook(ins, fn) {
      const h = { id: this.hooks.length, fn };
      this.hooks.push(h);
      for (const i of ins) this.nets[i].hooks.push(h.id);
      return h;
    }

    /** 手动触发 hook 重新求值（例如 RAM 内容被写入后） */
    touchHook(h) { this._enqHook(h.id); }

    /** 读取网络电平 */
    v(id) { return this.nets[id].val; }

    /** 把一组网络按低位在前读成整数 */
    readBits(ids) {
      let x = 0;
      for (let i = ids.length - 1; i >= 0; i--) x = (x << 1) | this.nets[ids[i]].val;
      return x;
    }

    /**
     * 设置网络电平（外部驱动或门求值结果）。
     * 变化时更新 tick / trace，并把扇出门与 hook 入队。
     */
    setNet(id, val) {
      val = val ? 1 : 0;
      const n = this.nets[id];
      if (n.val === val) return;
      n.val = val;
      this.tick++;
      n.lastChange = this.tick;
      if (this.trace) this.trace.push({ net: id, val, order: this.trace.length });
      const fan = n.fan;
      for (let i = 0; i < fan.length; i++) this._enq(fan[i]);
      const hk = n.hooks;
      for (let i = 0; i < hk.length; i++) this._enqHook(hk[i]);
    }

    /** 把整数写入一组外部驱动的网络（低位在前） */
    setBits(ids, value) {
      for (let i = 0; i < ids.length; i++) this.setNet(ids[i], (value >> i) & 1);
    }

    /**
     * 强制设定电平（复位用，可作用于门驱动的网络）。
     * 之后必须调用 settle() 使电路进入自洽稳定态。
     */
    forceNet(id, val) {
      val = val ? 1 : 0;
      const n = this.nets[id];
      if (n.val === val) return;
      n.val = val;
      this.tick++;
      n.lastChange = this.tick;
      for (const g of n.fan) this._enq(g);
      for (const h of n.hooks) this._enqHook(h);
    }

    _enq(gid) {
      if (!this._queued.has(gid)) { this._queued.add(gid); this._queue.push(gid); }
    }
    _enqHook(hid) {
      const k = -1 - hid;
      if (!this._queued.has(k)) { this._queued.add(k); this._queue.push(k); }
    }

    /**
     * 传播直到电路稳定。maxEvents 防止振荡死循环。
     */
    settle(maxEvents = 500000) {
      let qi = 0, count = 0;
      const q = this._queue;
      while (qi < q.length) {
        const item = q[qi++];
        this._queued.delete(item);
        if (++count > maxEvents) throw new Error('电路未收敛（可能存在振荡）');
        if (item >= 0) {
          const g = this.gates[item];
          const ins = g.ins;
          const vals = [];
          for (let i = 0; i < ins.length; i++) vals.push(this.nets[ins[i]].val);
          this.gateEvalCount++;
          this.setNet(g.out, GATE_EVAL[g.type](vals));
        } else {
          this.hooks[-1 - item].fn(this);
        }
        // 队列压缩，避免长时间运行内存膨胀
        if (qi > 8192 && qi === q.length) { q.length = 0; qi = 0; }
      }
      q.length = 0;
      this._queued.clear();
      return count;
    }

    /** 全量求值（电路构建完毕后调用一次，使初值自洽） */
    evalAll() {
      for (const g of this.gates) this._enq(g.id);
      for (const h of this.hooks) this._enqHook(h.id);
      this.settle();
    }

    /** 开始 / 结束记录传播轨迹 */
    beginTrace() { this.trace = []; }
    endTrace() { const t = this.trace; this.trace = null; return t || []; }

    /** 由输出网络反查驱动门（视图用） */
    driverOf(netId) {
      const d = this.nets[netId].driver;
      return d >= 0 ? this.gates[d] : null;
    }
  }

<script>
/**
 * parts.js —— 由基础逻辑门搭建的标准部件库
 *
 * 全部部件只用 sim.gate() 搭建，不做任何“直接算结果”的捷径：
 *  - 半加器 / 全加器 / 8位行波进位加法器 / 8位自增器
 *  - 2:1 选择器
 *  - 门控 D 锁存器（4 个 NAND 交叉耦合）
 *  - 主从边沿 D 触发器（两级锁存器）
 *  - 带使能的 8 位寄存器（反馈选择器 + DFF，上升沿装载）
 *  - 8 位程序计数器（门级自增器 + 装载/自增选择）
 *  - 零检测（OR 树 + NOT）
 *  - 相等比较器（XNOR + AND 树）
 * 每个构建函数都返回内部网络/子结构引用，供可视化层逐层下钻。
 */
'use strict';
(function (G) {
  const NS = (G.LGC = G.LGC || {});

  /** 半加器: s = a⊕b, c = a·b */
  function halfAdder(sim, a, b, tag) {
    tag = tag || 'HA';
    const s = sim.gate('XOR', [a, b], null, tag + '.xor');
    const c = sim.gate('AND', [a, b], null, tag + '.and');
    return { a, b, s, c };
  }

  /** 全加器: 2×XOR + 2×AND + 1×OR */
  function fullAdder(sim, a, b, cin, tag) {
    tag = tag || 'FA';
    const x1 = sim.gate('XOR', [a, b], null, tag + '.xor1');
    const s = sim.gate('XOR', [x1, cin], null, tag + '.xor2');
    const a1 = sim.gate('AND', [a, b], null, tag + '.and1');
    const a2 = sim.gate('AND', [x1, cin], null, tag + '.and2');
    const cout = sim.gate('OR', [a1, a2], null, tag + '.or');
    return { a, b, cin, x1, s, a1, a2, cout };
  }

  /** n 位行波进位加法器 */
  function rippleAdder(sim, a, b, cin, tag) {
    tag = tag || 'ADD';
    const bits = [];
    const sum = [];
    let carry = cin;
    for (let i = 0; i < a.length; i++) {
      const fa = fullAdder(sim, a[i], b[i], carry, tag + '.fa' + i);
      bits.push(fa);
      sum.push(fa.s);
      carry = fa.cout;
    }
    return { a, b, cin, sum, cout: carry, bits };
  }

  /** n 位自增器（半加器链，进位输入恒 1） */
  function incrementer(sim, a, one, tag) {
    tag = tag || 'INC';
    const bits = [];
    const sum = [];
    let carry = one;
    for (let i = 0; i < a.length; i++) {
      const ha = halfAdder(sim, a[i], carry, tag + '.ha' + i);
      bits.push(ha);
      sum.push(ha.s);
      carry = ha.c;
    }
    return { a, sum, cout: carry, bits };
  }

  /** 2:1 选择器: out = sel ? b : a （NOT + 2×AND + OR） */
  function mux2(sim, a, b, sel, tag, selN) {
    tag = tag || 'MUX';
    const sn = (selN !== undefined) ? selN : sim.gate('NOT', [sel], null, tag + '.not');
    const t0 = sim.gate('AND', [a, sn], null, tag + '.and0');
    const t1 = sim.gate('AND', [b, sel], null, tag + '.and1');
    const out = sim.gate('OR', [t0, t1], null, tag + '.or');
    return { a, b, sel, selN: sn, t0, t1, out };
  }

  /**
   * 门控 D 锁存器（NAND 结构）：G=1 时透明，G=0 时保持。
   *   n1 = NAND(D,G); n2 = NAND(n1,G); Q = NAND(n1,Qb); Qb = NAND(n2,Q)
   */
  function dLatch(sim, d, g, tag) {
    tag = tag || 'LATCH';
    const n1 = sim.gate('NAND', [d, g], null, tag + '.n1');
    const n2 = sim.gate('NAND', [n1, g], null, tag + '.n2');
    const q = sim.net(tag + '.q');
    const qb = sim.net(tag + '.qb');
    sim.gate('NAND', [n1, qb], q, tag + '.nq');
    sim.gate('NAND', [n2, q], qb, tag + '.nqb');
    return { d, g, n1, n2, q, qb };
  }

  /**
   * 主从 D 触发器：clk=0 时主级采样，上升沿输出更新。
   * clkN 可共享（同一寄存器 8 位共用一个反相器）。
   */
  function dff(sim, d, clk, clkN, tag) {
    tag = tag || 'DFF';
    const cn = (clkN !== undefined) ? clkN : sim.gate('NOT', [clk], null, tag + '.clkN');
    const master = dLatch(sim, d, cn, tag + '.m');
    const slave = dLatch(sim, master.q, clk, tag + '.s');
    const cell = { d, clk, clkN: cn, master, slave, q: slave.q, qb: slave.qb };
    cell.reset = function () {
      // 强制两级锁存器进入 Q=0 的自洽稳定态，再由 settle 收敛
      sim.forceNet(master.q, 0); sim.forceNet(master.qb, 1);
      sim.forceNet(slave.q, 0); sim.forceNet(slave.qb, 1);
    };
    return cell;
  }

  /**
   * 带装载使能的 n 位寄存器。
   * 每位: D = load ? dIn[i] : Q （反馈选择器），上升沿写入。
   */
  function register(sim, name, dIn, load, clk, width) {
    width = width || dIn.length;
    const clkN = sim.gate('NOT', [clk], null, name + '.clkN');
    const loadN = sim.gate('NOT', [load], null, name + '.loadN');
    const bits = [];
    const q = [];
    for (let i = 0; i < width; i++) {
      const tag = name + '.b' + i;
      const qNet = sim.net(tag + '.q'); // 先占位，供 mux 反馈引用
      const m = mux2(sim, qNet, dIn[i], load, tag + '.mux', loadN);
      // dff 的 slave.q 需要等于 qNet：dLatch 内部自建 q，
      // 这里改为手工搭 dff，使 slave 的 q 就是 qNet。
      const cn = clkN;
      const master = dLatch(sim, m.out, cn, tag + '.m');
      const n1 = sim.gate('NAND', [master.q, clk], null, tag + '.s.n1');
      const n2 = sim.gate('NAND', [n1, clk], null, tag + '.s.n2');
      const qb = sim.net(tag + '.qb');
      sim.gate('NAND', [n1, qb], qNet, tag + '.s.nq');
      sim.gate('NAND', [n2, qNet], qb, tag + '.s.nqb');
      const slave = { d: master.q, g: clk, n1, n2, q: qNet, qb };
      const cell = { mux: m, master, slave, q: qNet, qb };
      cell.reset = function () {
        sim.forceNet(master.q, 0); sim.forceNet(master.qb, 1);
        sim.forceNet(qNet, 0); sim.forceNet(qb, 1);
      };
      bits.push(cell);
      q.push(qNet);
    }
    const reg = { name, dIn, load, clk, clkN, loadN, bits, q, width };
    reg.value = () => sim.readBits(q);
    reg.reset = () => { for (const b of bits) b.reset(); };
    return reg;
  }

  /**
   * 8 位程序计数器：
   *   D = load ? bus : (inc ? Q+1 : Q)
   * 自增值由门级半加器链产生。
   */
  function counter8(sim, name, busIn, load, inc, clk, one) {
    const width = busIn.length;
    // 先建输出占位网络
    const qNets = [];
    for (let i = 0; i < width; i++) qNets.push(sim.net(name + '.b' + i + '.q'));
    const incUnit = incrementer(sim, qNets, one, name + '.inc');
    const clkN = sim.gate('NOT', [clk], null, name + '.clkN');
    const incN = sim.gate('NOT', [inc], null, name + '.incN');
    const loadN = sim.gate('NOT', [load], null, name + '.loadN');
    const bits = [];
    for (let i = 0; i < width; i++) {
      const tag = name + '.b' + i;
      const m1 = mux2(sim, qNets[i], incUnit.sum[i], inc, tag + '.muxInc', incN);
      const m2 = mux2(sim, m1.out, busIn[i], load, tag + '.muxLoad', loadN);
      const master = dLatch(sim, m2.out, clkN, tag + '.m');
      const n1 = sim.gate('NAND', [master.q, clk], null, tag + '.s.n1');
      const n2 = sim.gate('NAND', [n1, clk], null, tag + '.s.n2');
      const qb = sim.net(tag + '.qb');
      sim.gate('NAND', [n1, qb], qNets[i], tag + '.s.nq');
      sim.gate('NAND', [n2, qNets[i]], qb, tag + '.s.nqb');
      const cell = { muxInc: m1, muxLoad: m2, master, slave: { n1, n2, q: qNets[i], qb }, q: qNets[i], qb };
      cell.reset = function () {
        sim.forceNet(master.q, 0); sim.forceNet(master.qb, 1);
        sim.forceNet(qNets[i], 0); sim.forceNet(qb, 1);
      };
      bits.push(cell);
    }
    const pc = { name, q: qNets, bits, inc: incUnit, load, incSig: inc, clk, width };
    pc.value = () => sim.readBits(qNets);
    pc.reset = () => { for (const b of bits) b.reset(); };
    return pc;
  }

  /** 零检测：OR 二叉树 + NOT，返回树结构供可视化 */
  function zeroDetect(sim, bits, tag) {
    tag = tag || 'ZERO';
    let layer = bits.slice();
    const tree = [];
    let li = 0;
    while (layer.length > 1) {
      const next = [];
      for (let i = 0; i < layer.length; i += 2) {
        if (i + 1 < layer.length) {
          next.push(sim.gate('OR', [layer[i], layer[i + 1]], null, tag + '.or' + li + '_' + (i >> 1)));
        } else next.push(layer[i]);
      }
      tree.push(next.slice());
      layer = next;
      li++;
    }
    const z = sim.gate('NOT', [layer[0]], null, tag + '.not');
    return { in: bits, tree, any: layer[0], z };
  }

  /** n 位相等比较器：逐位 XNOR 后 AND 树 */
  function equalComparator(sim, a, b, tag) {
    tag = tag || 'EQ';
    const xn = [];
    for (let i = 0; i < a.length; i++) xn.push(sim.gate('XNOR', [a[i], b[i]], null, tag + '.xn' + i));
    let layer = xn.slice();
    let li = 0;
    while (layer.length > 1) {
      const next = [];
      for (let i = 0; i < layer.length; i += 2) {
        if (i + 1 < layer.length) next.push(sim.gate('AND', [layer[i], layer[i + 1]], null, tag + '.and' + li + '_' + (i >> 1)));
        else next.push(layer[i]);
      }
      layer = next; li++;
    }
    return { a, b, xnor: xn, eq: layer[0] };
  }

  NS.parts = {
    halfAdder, fullAdder, rippleAdder, incrementer,
    mux2, dLatch, dff, register, counter8, zeroDetect, equalComparator,
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/**
 * alu.js —— 完全由逻辑门构成的 8 位 ALU
 *
 * 操作编码（op2 op1 op0）：
 *   000 ADD   001 SUB(二补码: B 取反 + 进位 1)
 *   010 AND   011 OR    100 XOR
 *
 * 结构：
 *   op 译码(NOT×3 + AND3×5)
 *   B 有效值 = B ⊕ sub            （XOR 阵列，减法时按位取反）
 *   8 位行波进位加法器（cin = sub）
 *   AND / OR / XOR 三个按位阵列
 *   结果选择：每位 4 路 AND-OR 选择网络
 *   标志：Z = NOR树(结果)，C = 加法器 cout，N = 结果第 7 位
 *
 * 严禁捷径：结果只可能来自上述门网络的稳定电平。
 */
'use strict';
(function (G) {
  const NS = (G.LGC = G.LGC || {});
  const P = NS.parts;

  const ALU_OPS = { ADD: 0, SUB: 1, AND: 2, OR: 3, XOR: 4 };

  /**
   * @param {LGC.Sim} sim
   * @param {number[]} a  8 条输入网络（来自 A 寄存器 Q 端）
   * @param {number[]} b  8 条输入网络（来自 TMP 寄存器 Q 端）
   * @param {number[]} op [op0, op1, op2] 控制网络
   */
  function buildALU(sim, a, b, op, tag) {
    tag = tag || 'ALU';
    const [op0, op1, op2] = op;
    // ---- op 译码 ----
    const n0 = sim.gate('NOT', [op0], null, tag + '.n0');
    const n1 = sim.gate('NOT', [op1], null, tag + '.n1');
    const n2 = sim.gate('NOT', [op2], null, tag + '.n2');
    const dADD = sim.gate('AND', [n2, n1, n0], null, tag + '.dADD');
    const dSUB = sim.gate('AND', [n2, n1, op0], null, tag + '.dSUB');
    const dAND = sim.gate('AND', [n2, op1, n0], null, tag + '.dAND');
    const dOR  = sim.gate('AND', [n2, op1, op0], null, tag + '.dOR');
    const dXOR = sim.gate('AND', [op2, n1, n0], null, tag + '.dXOR');
    const selSum = sim.gate('OR', [dADD, dSUB], null, tag + '.selSum');

    // ---- B 有效值（减法取反）----
    const bEff = [];
    for (let i = 0; i < 8; i++) {
      bEff.push(sim.gate('XOR', [b[i], dSUB], null, tag + '.binv' + i));
    }

    // ---- 加法器（cin = dSUB，构成二补码减法）----
    const adder = P.rippleAdder(sim, a, bEff, dSUB, tag + '.adder');

    // ---- 按位逻辑阵列 ----
    const andArr = [], orArr = [], xorArr = [];
    for (let i = 0; i < 8; i++) {
      andArr.push(sim.gate('AND', [a[i], b[i]], null, tag + '.and' + i));
      orArr.push(sim.gate('OR', [a[i], b[i]], null, tag + '.or' + i));
      xorArr.push(sim.gate('XOR', [a[i], b[i]], null, tag + '.xor' + i));
    }

    // ---- 结果选择（每位 4×AND + OR4）----
    const result = [];
    const muxBits = [];
    for (let i = 0; i < 8; i++) {
      const t = tag + '.mux' + i;
      const g0 = sim.gate('AND', [selSum, adder.sum[i]], null, t + '.s');
      const g1 = sim.gate('AND', [dAND, andArr[i]], null, t + '.a');
      const g2 = sim.gate('AND', [dOR, orArr[i]], null, t + '.o');
      const g3 = sim.gate('AND', [dXOR, xorArr[i]], null, t + '.x');
      const out = sim.gate('OR', [g0, g1, g2, g3], null, t + '.out');
      muxBits.push({ g0, g1, g2, g3, out });
      result.push(out);
    }

    // ---- 标志位 ----
    const zero = P.zeroDetect(sim, result, tag + '.zero');
    const carry = sim.gate('BUF', [adder.cout], null, tag + '.carry');
    const neg = sim.gate('BUF', [result[7]], null, tag + '.neg');

    return {
      a, b, op,
      decode: { n0, n1, n2, dADD, dSUB, dAND, dOR, dXOR, selSum },
      bEff, adder, andArr, orArr, xorArr, muxBits,
      result, zero, z: zero.z, carry, neg,
      value: () => sim.readBits(result),
    };
  }

  NS.buildALU = buildALU;
  NS.ALU_OPS = ALU_OPS;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/**
 * cpu.js —— 8 位 CPU：数据通路 + 微指令控制单元
 *
 * 数据通路（SAP 风格单总线结构，全部为门级电路）：
 *
 *   PC(计数器) ──oe──►┐
 *   RAM ──oe─────────►│ 数据总线(8位, AND-OR 驱动网络)
 *   A ──oe───────────►│──load──► MAR / IR / A / B / TMP / PC
 *   B ──oe───────────►│
 *   ALU ──oe─────────►┘
 *   MAR.Q ──► 地址总线 ──► RAM 地址
 *   ALU: 输入 = A.Q 与 TMP.Q，输出经总线写回
 *   FLAGS(Z/C/N) ◄── ALU 标志（FLAGS_load 上升沿写入）
 *
 * 控制单元 = 微指令 ROM + 微步计数器（显式状态机）：
 *   每个时钟周期执行一条微指令（即一组控制信号）；
 *   取指(2 拍) → 译码(查 ROM) → 逐拍执行 → 回到取指。
 *   条件跳转在译码时读取 FLAGS 寄存器的门级 Q 端电平选择微程序分支。
 *

    0x31: { name: 'SUB A,B', len: 1, fmt: 'SUB A, B' },
