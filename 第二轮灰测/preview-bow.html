落箭箭台随缆绳下落让开箭羽，余振被止弦器与弓片减震块吸收。
<b>瞄准链：</b>眼 → 弦上窥孔 → 瞄镜光纤准星 三点共线（实测偏差 0.85°）。
</p>
</div>
<script>
const svg = document.querySelector('#stage svg');
const pp = document.getElementById('pp'), sk = document.getElementById('sk'), tt = document.getElementById('tt');
let playing = true;
const show = () => { const t = svg.getCurrentTime() % 10; sk.value = t; tt.textContent = t.toFixed(2) + 's / 10.00s'; };
pp.onclick = () => {
  playing = !playing;
  if (playing) { svg.unpauseAnimations(); pp.textContent = '⏸ 暂停'; pp.classList.add('on'); }
  else { svg.pauseAnimations(); pp.textContent = '▶ 播放'; pp.classList.remove('on'); }
};
sk.oninput = () => { svg.pauseAnimations(); playing = false; pp.textContent = '▶ 播放'; pp.classList.remove('on'); svg.setCurrentTime(+sk.value); tt.textContent = (+sk.value).toFixed(2) + 's / 10.00s'; };
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-rate]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('animate,animateTransform').forEach(a => {
    if (!a.dataset.d) a.dataset.d = a.getAttribute('dur');
    a.setAttribute('dur', (parseFloat(a.dataset.d) / +b.dataset.rate) + 's');
  });
  const t = svg.getCurrentTime(); svg.setCurrentTime(t);
});
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  svg.pauseAnimations(); playing = false; pp.textContent = '▶ 播放'; pp.classList.remove('on');
  const r = +(document.querySelector('[data-rate].on')?.dataset.rate || 1);
  svg.setCurrentTime(+b.dataset.go / r); show();
});
setInterval(() => { if (playing) show(); }, 80);
</script>
</body></html>
