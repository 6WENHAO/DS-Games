<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>主动悬架 3D 仿真对比 · 前双叉臂 / 后五连杆 · 被动 vs 魔毯系统</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231d2530'/><circle cx='11' cy='11' r='6' fill='%233ddcff'/><circle cx='21' cy='21' r='6' fill='%23ff8a3d'/></svg>" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</head>

<body>
  <div id="boot">
    <div class="bootbox">
      <div class="spinner"></div>
      <h1>主动悬架 3D 仿真</h1>
      <p id="bootMsg">正在初始化…</p>
    </div>
  </div>

  <header id="top">
    <div class="brand">
      <span class="logo"></span>
      <div>
        <h1>主动悬架（魔毯系统）3D 对比仿真</h1>
        <p>前 <b>双叉臂</b> · 后 <b>五连杆</b> · 7 自由度整车动力学 + 空间运动学几何真解 · 同一坑洼路面同步对比</p>
      </div>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main>
    <aside id="left" class="panel"></aside>

    <section id="stage">
      <canvas id="gl"></canvas>
      <div class="vlabel top">
        <span class="tag p">①&nbsp;传统被动悬架</span>
        <span class="desc">螺旋弹簧 + 液压减振器 · <b>无</b>魔毯系统</span>
      </div>
      <div class="vlabel bottom">
        <span class="tag a">②&nbsp;主动悬架 · 魔毯系统</span>
        <span class="desc">LQR 最优反馈 + 路面预瞄前馈 · 4 × 液压作动器</span>
      </div>
      <div class="split"></div>
      <div class="hintbar">左键拖动 = 旋转 · 右键拖动 = 平移 · 滚轮 = 缩放 · 两视口视角始终同步</div>
    </section>

    <aside id="right" class="panel"></aside>
  </main>
</body>

</html>
