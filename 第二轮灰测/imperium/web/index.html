<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>万世纪元 · Imperium Aeternum（0–1600）</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- 开始界面 -->
<div id="start" class="screen">
  <div class="start-inner">
    <h1>万世纪元</h1>
    <p class="sub">Imperium Aeternum · 公元 0 – 1600 年 · 王朝与帝国的千六百年</p>
    <div id="loading">正在载入世界……</div>
    <div id="startBody" hidden>
      <div class="bm-row">
        <div class="bm-label">选择时代</div>
        <div id="bookmarks" class="bookmarks"></div>
      </div>
      <div class="pick-row">
        <div class="pick-col">
          <div class="bm-label">选择政权 <span id="polCount" class="dim"></span></div>
          <input id="polSearch" type="search" placeholder="搜索政权（中文/拉丁/tag）…" />
          <div id="polList" class="pol-list"></div>
        </div>
        <div class="pick-col">
          <div id="polInfo" class="pol-info">在左侧选择一个政权。</div>
          <button id="startBtn" class="big" disabled>开始统治</button>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button id="observeBtn" style="flex:1">旁观世界演化</button>
            <button id="loadBtn" style="flex:1">读取存档</button>
          </div>
          <div class="tip">提示：滚轮缩放、拖拽平移、点击省份查看详情；空格暂停/继续，1–5 调整速度，Ctrl+S 存档。</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="game" hidden>
  <header id="topbar">
    <div class="realm">
      <span id="realmFlag" class="flag"></span>
      <div>
        <div id="realmName" class="realm-name">—</div>
        <div id="realmRuler" class="realm-ruler dim">—</div>
      </div>
    </div>
    <div class="res">
      <div class="res-item" title="国库"><span class="ico">⛃</span><span id="rTreasury">0</span><span id="rIncome" class="delta"></span></div>
      <div class="res-item" title="人力（千）"><span class="ico">⚔</span><span id="rManpower">0</span></div>
      <div class="res-item" title="军队（千）"><span class="ico">🛡</span><span id="rArmy">0</span></div>
      <div class="res-item" title="稳定度"><span class="ico">☯</span><span id="rStability">0</span></div>
      <div class="res-item" title="正统性"><span class="ico">♛</span><span id="rLegit">0</span></div>
      <div class="res-item" title="威望"><span class="ico">✶</span><span id="rPrestige">0</span></div>
      <div class="res-item tech" title="行政/外交/军事科技"><span id="rTech">0/0/0</span></div>
    </div>
    <div class="clock">
      <button id="saveBtn" title="Ctrl+S 存档">存</button>
      <button id="btnPause" title="空格">▶</button>
      <div class="speeds">
        <button data-sp="1">1</button><button data-sp="2">2</button><button data-sp="3">3</button><button data-sp="4">4</button><button data-sp="5">5</button>
      </div>
      <div id="date" class="date">—</div>
    </div>
  </header>

  <div id="modebar"></div>

  <main id="stage">
    <canvas id="map"></canvas>
    <div id="tooltip" class="tooltip" hidden></div>

    <aside id="left" class="panel">
      <div class="panel-head"><span id="provTitle">未选择省份</span><button class="x" data-close="left">×</button></div>
      <div id="provBody" class="panel-body"></div>
    </aside>

    <aside id="right" class="panel">
      <div class="tabs">
        <button data-tab="realm" class="on">国政</button>
        <button data-tab="court">宫廷</button>
        <button data-tab="tech">科技</button>
        <button data-tab="diplo">外交</button>
        <button data-tab="wars">战争</button>
        <button data-tab="rank">排行</button>
        <button data-tab="world">世界</button>
      </div>
      <div id="tabBody" class="panel-body"></div>
    </aside>

    <div id="logbox">
      <div class="log-head">纪事<button id="logToggle">—</button></div>
      <div id="logBody"></div>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-inner">
      <h2 id="mTitle">事件</h2>
      <p id="mText"></p>
      <div id="mOpts"></div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
