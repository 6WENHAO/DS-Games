<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>probing…</title></head>
<body>
<!--
  tools/glprobe.html —— WebGL2 能力探针
  用于确认某个浏览器 / 命令行开关组合下是否可以取得 WebGL2 上下文与浮点渲染目标。
  以 --dump-dom 抓取页面中 id 为 probe 的元素即可读到 JSON 结果。
-->
<script>
(function () {
  const out = { webgl2: false };
  try {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const gl = c.getContext('webgl2', { antialias: false });
    out.webgl2 = !!gl;
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      out.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      out.version = gl.getParameter(gl.VERSION);
      out.glsl = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
      out.colorBufferFloat = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
      out.floatLinear = !!gl.getExtension('OES_texture_float_linear');
      out.maxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      out.maxDrawBuffers = gl.getParameter(gl.MAX_DRAW_BUFFERS);
      // 简单编译一个 GLSL ES 3.00 着色器，确认编译器可用
      const vs = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vs, '#version 300 es\nvoid main(){ gl_Position = vec4(0.0); }');
      gl.compileShader(vs);
      out.glsl300 = gl.getShaderParameter(vs, gl.COMPILE_STATUS);
      out.moduleWorker = (function () {
        try { const w = new Worker(URL.createObjectURL(new Blob(['export default 1;'], { type: 'text/javascript' })), { type: 'module' }); w.terminate(); return true; }
        catch (e) { return String(e.message || e); }
      })();
    }
  } catch (e) {
    out.error = String(e && e.message || e);
  }
  const pre = document.createElement('pre');
  pre.id = 'probe';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
  document.title = 'PROBE ' + JSON.stringify(out);
})();
</script>
</body></html>
