<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>POCKET ARENA 像素竞技场</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 像素字体：Fusion Pixel 12px（TakWolf，OFL-1.1）+ Press Start 2P（CodeMan38，OFL-1.1）
     CDN：jsDelivr 主源，unpkg 备用；均失败时回退系统等宽字体 */
  @font-face {
    font-family: 'Fusion Pixel';
    src: url('https://cdn.jsdelivr.net/npm/@fontpkg/fusion-pixel@20220405.0.0/fusion-pixel.ttf') format('truetype'),
         url('https://unpkg.com/@fontpkg/fusion-pixel@20220405.0.0/fusion-pixel.ttf') format('truetype');
    font-display: block;
  }
  @font-face {
    font-family: 'Press Start 2P';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5.2.6/files/press-start-2p-latin-400-normal.woff2') format('woff2'),
         url('https://unpkg.com/@fontsource/press-start-2p@5.2.6/files/press-start-2p-latin-400-normal.woff2') format('woff2');
    font-display: block;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0d1420;
    overflow: hidden;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: none;
  }
  #selftest-report {
    position: fixed; left: 8px; top: 8px;
    color: #62b45c; background: rgba(13,20,32,0.92);
    font: 11px/1.5 Consolas, monospace;
    white-space: pre; max-height: 86vh; overflow: auto;
    display: none; z-index: 99; padding: 6px 10px;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<pre id="selftest-report"></pre>

<!-- 渲染管线（自研 Canvas 2D，零第三方渲染库依赖） -->
<script src="js/palette.js"></script>
<script src="js/noise.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/maps.generated.js"></script>
<script src="js/sprites.js"></script>
<script src="js/scene.js"></script>
<script src="js/fx.js"></script>
<script src="js/font.js"></script>
<script src="js/sfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/tests.js"></script>
<script src="js/game.js"></script>
</body>
</html>
