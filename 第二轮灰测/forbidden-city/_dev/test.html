<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>引擎自检</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script src="../js/gl.js"></script>
<script src="../js/voxel.js"></script>
<script src="../js/palette.js"></script>
<script src="../js/arch.js"></script>
<script src="../js/render.js"></script>
<script src="inspect.js"></script>
<script>
const log = [];
window.__log = log;
try {
  const t0 = performance.now();
  const vol = new Volume();
  const ground = new Ground(-200, -200, 200, 200, 2);
  const idmap = new IdMap(-200, -200, 200, 200);
  const A = new Arch(vol, ground, idmap);
  ground.rect(-200, -200, 200, 200, GM.plaza, 0);
  ground.rect(-60, -120, 60, -60, GM.water, -2);

  // 三台 + 太和殿（重檐庑殿）
  A.platform(-70, -30, 70, 60, 0, 8, { style: 'sumeru', railing: true });
  A.stairs(0, 60, 20, 0, 8, 's', { imperial: true });
  A.hall({ name: '太和殿', x: 0, z: 20, w: 64, d: 37, y: 8, ph: 3, bh: 13, tiers: 2,
           over: 6, rh: 11, type: 'hip', imperial: true, railing: true,
           sides: { s: 'door', n: 'door', e: 'window', w: 'window' }, interior: true, throne: true, bay: 6 });
  // 歇山 + 攒尖 + 十字脊 对照
  A.hall({ name: '保和殿', x: -110, z: 20, w: 40, d: 24, ph: 3, bh: 10, over: 4, rh: 9, type: 'gable', tiers: 2 });
  A.hall({ name: '中和殿', x: 110, z: 20, w: 24, d: 24, ph: 3, bh: 9, over: 4, rh: 10, type: 'pyramid' });
  A.pavilion({ name: '万春亭', x: 110, z: -60, r: 8, ph: 2, bh: 6, tiers: 2, rh: 7 });
  A.hall({ name: '角楼', x: -110, z: -60, w: 18, d: 18, ph: 2, bh: 8, over: 3, rh: 8, type: 'cross' });
  A.corridor(-70, 80, 70, 88, { h: 5 });
  A.wallRun(-150, 100, 150, 100, { h: 7, t: 2, gates: [{ at: 0, w: 4, name: '门' }] });
  A.lion(-14, 70); A.lion(14, 70);
  A.huabiao(-30, 90); A.huabiao(30, 90);
  A.tree(-90, 0, -90, 'pine'); A.tree(-80, 0, -95, 'leaf');
  A.rockery(80, -100, 10, 8, 9);
  A.bridge(0, -90, 5, 16, { dir: 'ns', imperial: true });
  log.push('build ' + (performance.now() - t0).toFixed(0) + 'ms voxels=' + vol.total + ' chunks=' + vol.chunks.size + ' mem=' + vol.memoryMB().toFixed(1) + 'MB');

  const t1 = performance.now();
  const ms = new MeshSet(), water = new MeshSet();
  const mesher = new Mesher(vol);
  const seen = new Set();
  for (const key of vol.chunks.keys()) {
    // 反解 key
    const cy = (key % 64) - 8;
    const rest = (key - (cy + 8)) / 64;
    const cz = (rest % 512) - 256;
    const cx = (rest - (cz + 256)) / 512 - 256;
    if (seen.has(key)) continue; seen.add(key);
    mesher.meshChunk(cx, cy, cz, ms);
  }
  ground.build(ms, GROUND_MATS, water);
  log.push('mesh ' + (performance.now() - t1).toFixed(0) + 'ms quads=' + ms.totalQuads() + ' water=' + water.totalQuads() + ' regions=' + ms.regions.size);

  const canvas = document.getElementById('c');
  const R = new Renderer(canvas, { shadowSize: 1024, cascadeSpan: [60, 200, 400] });
  R.upload(ms, water);
  R.setSun(0.34);
  R.fogDensity = 0.0003;
  const cam = {
    pos: V3.create(-120, 90, 190), target: V3.create(0, 18, 0),
    fovy: 50 * Math.PI / 180, near: 0.2, far: 3000,
  };
  const params = new URLSearchParams(location.search);
  if (params.get('view') === 'fps') {
    cam.pos = V3.create(0, 3, 95); cam.target = V3.create(0, 14, 20);
  }
  if (params.get('view') === 'top') {
    cam.pos = V3.create(0, 260, 120); cam.target = V3.create(0, 0, 0);
  }
  R.render(cam, 0.016);
  const t2 = performance.now();
  R.render(cam, 0.016);
  log.push('frame ' + (performance.now() - t2).toFixed(1) + 'ms draws=' + R.stats.drawn + ' quads=' + R.stats.quads);
  const insp = makeInspector(R);
  insp.grab();
  window.__ascii = (c,r)=>insp.ascii(c,r);
  window.__stats = ()=>insp.stats();
  window.__probe = (pts)=>insp.probe(pts);
  window.__probeW = (pts)=>insp.probeWorld(pts);
  window.__slice = (ax,at,a0,a1,y0,y1)=>sliceVolume(vol,ax,at,a0,a1,y0,y1);
  const err = R.gl.getError();
  if (err) log.push('GL ERROR ' + err);
  window.__ok = true;
} catch (e) {
  log.push('ERROR: ' + e.message + '\n' + e.stack);
  window.__ok = false;
}
document.title = 'ok=' + window.__ok;
</script>
</body></html>
