<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>植物大战僵尸 · 网页复刻版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#171a10;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 35%,#3b4223 0%,#1b1d12 70%,#0d0f08 100%)}
  #stage{position:relative;width:min(100vw,166.6667vh);aspect-ratio:1000/600;
    box-shadow:0 0 0 3px #241d10,0 14px 60px rgba(0,0,0,.75);border-radius:6px;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:default;touch-action:none}
  #err{position:absolute;left:0;top:0;right:0;z-index:99;display:none;padding:8px 12px;
    font:12px/1.5 Consolas,monospace;color:#ffdcdc;background:rgba(120,0,0,.9);white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv" width="1000" height="600"></canvas></div></div>
<div id="err"></div>
<script>
"use strict";
/* ================================================================
   植物大战僵尸 · 网页复刻版 (Plants vs Zombies - HTML5 remake)
   单文件 / 零依赖 / 全部美术由 Canvas 程序化绘制
   ================================================================ */

/* ---------- 运行时错误可视化（便于自检） ---------- */
(function () {
  var box = document.getElementById('err');
  function show(t) { box.style.display = 'block'; box.textContent += t + '\n'; }
  window.addEventListener('error', function (e) {
    show('JS ERROR: ' + (e.message || e.type) + '  @line ' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) { show('PROMISE: ' + e.reason); });
})();

/* ---------- 基础配置 ---------- */
var CFG = {
  W: 1000, H: 600,          // 逻辑画布
  COLS: 9, ROWS: 5,
  CW: 80, CH: 88,           // 单格宽高
  GX: 158, GY: 104,         // 草坪左上角
  MOWX: 122,                // 小推车 x
  SUNV: 25                  // 单个阳光价值
};
var GR = { R: CFG.GX + CFG.COLS * CFG.CW };   // 草坪右边界 = 878

function cx(col) { return CFG.GX + col * CFG.CW + CFG.CW / 2; }
function cyRow(row) { return CFG.GY + row * CFG.CH + CFG.CH / 2; }
function baseY(row) { return CFG.GY + row * CFG.CH + CFG.CH * 0.86; }
function colAt(x) { return Math.floor((x - CFG.GX) / CFG.CW); }
function rowAt(y) { return Math.floor((y - CFG.GY) / CFG.CH); }

/* ---------- 工具 ---------- */
var PI = Math.PI, TAU = PI * 2;
function rnd(a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function sgn(v) { return v < 0 ? -1 : 1; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function ell(g, x, y, rx, ry, rot) {
  g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, TAU);
}
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.abs(r), 0, TAU); }
function fill(g, c) { g.fillStyle = c; g.fill(); }
function line(g, c, w) { g.strokeStyle = c; g.lineWidth = w; g.stroke(); }
function txt(g, s, x, y, font, col, align, stroke, sw) {
  g.font = font; g.textAlign = align || 'center'; g.textBaseline = 'middle';
  if (stroke) { g.lineWidth = sw || 4; g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = col; g.fillText(s, x, y);
}
function shadow(g, x, y, rx, ry, a) {
  g.save(); g.globalAlpha = a === undefined ? 0.26 : a;
  ell(g, x, y, rx, ry); fill(g, '#000'); g.restore();
}

/* ---------- 音频（全程序化合成，无外部资源） ---------- */
var AU = {
  ctx: null, master: null, musBus: null, sfxOn: true, musOn: true,
  mus: { step: 0, next: 0, spb: 0.1385 },
  init: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    try { this.ctx = new C(); } catch (e) { return; }
    this.master = this.ctx.createGain(); this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
    this.musBus = this.ctx.createGain(); this.musBus.gain.value = 0.19; this.musBus.connect(this.master);
    this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.55; this.sfxBus.connect(this.master);
    this.mus.next = this.ctx.currentTime + 0.1;
  },
  noiseBuf: function () {
    if (this._nb) return this._nb;
    var n = this.ctx.sampleRate * 1.2, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this._nb = b; return b;
  },
  tone: function (o) {
    if (!this.ctx || !this.sfxOn) return;
    var t = this.ctx.currentTime + (o.at || 0), osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + o.d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.v || 0.25, t + (o.a || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
    osc.connect(g); g.connect(o.bus || this.sfxBus); osc.start(t); osc.stop(t + o.d + 0.02);
  },
  nz: function (o) {
    if (!this.ctx || !this.sfxOn) return;
    var t = this.ctx.currentTime + (o.at || 0), s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf(); s.playbackRate.value = o.rate || 1;
    var f = this.ctx.createBiquadFilter(); f.type = o.ft || 'bandpass';
    f.frequency.setValueAtTime(o.f || 900, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f2), t + o.d);
    f.Q.value = o.q || 1.2;
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.v || 0.25, t + (o.a || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
    s.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus); s.start(t); s.stop(t + o.d + 0.03);
  },
  sfx: function (n) {
    if (!this.ctx || !this.sfxOn) return;
    switch (n) {
      case 'shoot': this.tone({ f: 720, f2: 1500, d: 0.09, v: 0.11, type: 'triangle' }); break;
      case 'snow': this.tone({ f: 900, f2: 1800, d: 0.13, v: 0.1, type: 'sine' });
        this.nz({ f: 5200, d: 0.16, v: 0.07, ft: 'highpass' }); break;
      case 'splat': this.nz({ f: 1500, f2: 400, d: 0.11, v: 0.16, rate: 1.4 }); break;
      case 'sun': this.tone({ f: 784, d: 0.14, v: 0.18, type: 'sine' });
        this.tone({ f: 1175, d: 0.22, v: 0.14, type: 'sine', at: 0.07 }); break;
      case 'plant': this.nz({ f: 320, f2: 130, d: 0.16, v: 0.3, ft: 'lowpass', q: 3 });
        this.tone({ f: 180, f2: 90, d: 0.12, v: 0.1, type: 'sine' }); break;
      case 'shovel': this.nz({ f: 2600, f2: 700, d: 0.16, v: 0.16, ft: 'highpass' }); break;
      case 'bite': this.nz({ f: 480, f2: 190, d: 0.1, v: 0.26, ft: 'lowpass', q: 5, rate: 1.6 }); break;
      case 'chomp': this.nz({ f: 700, f2: 120, d: 0.3, v: 0.34, ft: 'lowpass', q: 4 });
        this.tone({ f: 150, f2: 60, d: 0.25, v: 0.14, type: 'sawtooth' }); break;
      case 'boom': this.nz({ f: 900, f2: 60, d: 0.75, v: 0.5, ft: 'lowpass', q: 1.2, rate: 0.65 });
        this.tone({ f: 110, f2: 32, d: 0.6, v: 0.3, type: 'sine' }); break;
      case 'fire': this.nz({ f: 2400, f2: 300, d: 0.9, v: 0.34, ft: 'bandpass', q: 0.8, rate: 0.8 }); break;
      case 'thud': this.nz({ f: 240, f2: 80, d: 0.22, v: 0.32, ft: 'lowpass', q: 2 }); break;
      case 'groan': var b = rnd(85, 135); this.tone({ f: b, f2: b * rnd(0.6, 1.5), d: rnd(0.5, 0.9), v: 0.12, type: 'sawtooth' });
        this.nz({ f: rnd(260, 520), f2: 160, d: 0.7, v: 0.07, ft: 'bandpass', q: 3 }); break;
      case 'zdie': this.tone({ f: 220, f2: 40, d: 0.45, v: 0.16, type: 'square' });
        this.nz({ f: 700, f2: 90, d: 0.5, v: 0.14, ft: 'lowpass' }); break;
      case 'mower': this.nz({ f: 260, d: 1.0, v: 0.3, ft: 'lowpass', q: 6, rate: 0.5 });
        this.tone({ f: 90, f2: 130, d: 0.9, v: 0.16, type: 'square' }); break;
      case 'siren': this.tone({ f: 420, f2: 900, d: 0.7, v: 0.2, type: 'sawtooth' });
        this.tone({ f: 900, f2: 420, d: 0.7, v: 0.2, type: 'sawtooth', at: 0.7 }); break;
      case 'win': [0, 0.14, 0.28, 0.46].forEach(function (d, i) {
        AU.tone({ f: [523, 659, 784, 1047][i], d: 0.45, v: 0.2, type: 'triangle', at: d });
      }); break;
      case 'lose': [0, 0.18, 0.36].forEach(function (d, i) {
        AU.tone({ f: [392, 330, 233][i], d: 0.6, v: 0.22, type: 'sawtooth', at: d });
      }); break;
      case 'ui': this.tone({ f: 520, f2: 700, d: 0.07, v: 0.12, type: 'square' }); break;
      case 'err': this.tone({ f: 200, f2: 150, d: 0.14, v: 0.16, type: 'square' }); break;
    }
  },
  /* 简易 32 步音序器（原创旋律，草地风格） */
  M: {
    lead: [69, 0, 72, 0, 74, 0, 72, 69, 67, 0, 69, 0, 72, 0, 0, 0, 74, 0, 76, 0, 77, 0, 76, 74, 72, 0, 69, 0, 67, 0, 65, 0],
    bass: [45, 0, 45, 52, 0, 45, 0, 45, 43, 0, 43, 50, 0, 43, 0, 43, 41, 0, 41, 48, 0, 41, 0, 41, 43, 0, 50, 0, 43, 0, 43, 0]
  },
  f: function (n) { return 440 * Math.pow(2, (n - 69) / 12); },
  tickMus: function () {
    if (!this.ctx || !this.musOn) return;
    var now = this.ctx.currentTime, m = this.mus;
    if (m.next < now) m.next = now + 0.05;
    while (m.next < now + 0.25) {
      var s = m.step, at = m.next - now;
      var ld = this.M.lead[s], bs = this.M.bass[s];
      if (ld) this.mnote(this.f(ld), at, 0.26, 'triangle', 0.2);
      if (bs) this.mnote(this.f(bs) / 2, at, 0.2, 'sine', 0.34);
      if (s % 4 === 0) this.nzm(at, 0.09, 0.1, 3000);
      else if (s % 2 === 0) this.nzm(at, 0.05, 0.045, 5200);
      m.step = (s + 1) % 32; m.next += m.spb;
    }
  },
  mnote: function (f, at, d, type, v) {
    var t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.musBus); o.start(t); o.stop(t + d + 0.02);
  },
  nzm: function (at, d, v, f) {
    var t = this.ctx.currentTime + at, s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf();
    var fl = this.ctx.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = f;
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(this.musBus); s.start(t); s.stop(t + d + 0.02);
  }
};

/* ---------- 画布 ---------- */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var DPR = clamp(window.devicePixelRatio || 1, 1, 2);
cv.width = CFG.W * DPR; cv.height = CFG.H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
ctx.textBaseline = 'middle';

/* ---------- 草坪背景预渲染 ---------- */
var LAWN = null;
function makeLawn() {
  var s = DPR, c = document.createElement('canvas');
  c.width = CFG.W * s; c.height = CFG.H * s;
  var g = c.getContext('2d'); g.setTransform(s, 0, 0, s, 0, 0);

  /* 天空/远景土壤 */
  var sky = g.createLinearGradient(0, 0, 0, CFG.H);
  sky.addColorStop(0, '#6b4a2a'); sky.addColorStop(1, '#4a3218');
  g.fillStyle = sky; g.fillRect(0, 0, CFG.W, CFG.H);

  /* 草坪条纹 */
  for (var r = 0; r < CFG.ROWS; r++) {
    var y = CFG.GY + r * CFG.CH;
    var lightRow = r % 2 === 0;
    for (var col = 0; col < CFG.COLS + 2; col++) {
      var x = CFG.GX + col * CFG.CW;
      var light = (col % 2 === 0) === lightRow;
      var gd = g.createLinearGradient(x, y, x, y + CFG.CH);
      if (light) { gd.addColorStop(0, '#7ec24a'); gd.addColorStop(1, '#66ab38'); }
      else { gd.addColorStop(0, '#63a83c'); gd.addColorStop(1, '#53932e'); }
      g.fillStyle = gd; g.fillRect(x, y, CFG.CW, CFG.CH);
    }
  }
  /* 草坪左侧（小推车所在）与顶部/底部延伸草地 */
  g.fillStyle = '#5c9c35'; g.fillRect(96, CFG.GY, CFG.GX - 96, CFG.ROWS * CFG.CH);
  var topG = g.createLinearGradient(0, CFG.GY - 26, 0, CFG.GY);
  topG.addColorStop(0, '#3f6b22'); topG.addColorStop(1, '#5d9c33');
  g.fillStyle = topG; g.fillRect(96, CFG.GY - 26, CFG.W, 26);
  var botG = g.createLinearGradient(0, CFG.GY + CFG.ROWS * CFG.CH, 0, CFG.H);
  botG.addColorStop(0, '#5d9c33'); botG.addColorStop(1, '#33591b');
  g.fillStyle = botG; g.fillRect(96, CFG.GY + CFG.ROWS * CFG.CH, CFG.W, CFG.H);

  /* 草叶纹理 */
  for (var i = 0; i < 2600; i++) {
    var gx2 = rnd(100, CFG.W), gy2 = rnd(CFG.GY - 24, CFG.H - 4);
    g.strokeStyle = 'rgba(' + rndi(30, 70) + ',' + rndi(90, 150) + ',' + rndi(20, 60) + ',' + rnd(0.12, 0.4).toFixed(2) + ')';
    g.lineWidth = rnd(0.7, 1.5);
    g.beginPath(); g.moveTo(gx2, gy2); g.lineTo(gx2 + rnd(-2.5, 2.5), gy2 - rnd(2.5, 6)); g.stroke();
  }
  /* 网格分隔线（很淡） */
  g.strokeStyle = 'rgba(0,0,0,.055)'; g.lineWidth = 1;
  for (var c2 = 0; c2 <= CFG.COLS; c2++) {
    g.beginPath(); g.moveTo(CFG.GX + c2 * CFG.CW, CFG.GY); g.lineTo(CFG.GX + c2 * CFG.CW, CFG.GY + CFG.ROWS * CFG.CH); g.stroke();
  }
  for (var r2 = 0; r2 <= CFG.ROWS; r2++) {
    g.beginPath(); g.moveTo(CFG.GX, CFG.GY + r2 * CFG.CH); g.lineTo(GR.R + CFG.CW, CFG.GY + r2 * CFG.CH); g.stroke();
  }

  /* 右侧灌木丛（僵尸从这里走出来） */
  drawHedge(g, CFG.W - 6, CFG.GY - 30, CFG.H + 10);
  /* 顶部与底部小花 */
  for (var f = 0; f < 26; f++) {
    var fx = rnd(120, CFG.W - 20), fy = pick([CFG.GY - 16, CFG.GY - 8, CFG.H - 30, CFG.H - 14]);
    var col2 = pick(['#f2f2f2', '#ffd9e8', '#fff2a8', '#e6c8ff']);
    for (var p = 0; p < 5; p++) {
      ell(g, fx + Math.cos(p / 5 * TAU) * 2.6, fy + Math.sin(p / 5 * TAU) * 2.2, 2.1, 1.8); fill(g, col2);
    }
    circ(g, fx, fy, 1.3); fill(g, '#f7b731');
  }

  /* 左侧房屋 */
  drawHouse(g);
  return c;
}

function drawHedge(g, x, y0, y1) {
  for (var y = y0; y < y1; y += 16) {
    var w = rnd(26, 42);
    ell(g, x + 8, y, w, 20);
    var gd = g.createLinearGradient(x - 30, y, x + 20, y);
    gd.addColorStop(0, '#1f4a17'); gd.addColorStop(1, '#2f6b1f');
    g.fillStyle = gd; g.fill();
  }
  for (var i = 0; i < 260; i++) {
    var lx = rnd(x - 42, x + 10), ly = rnd(y0, y1);
    ell(g, lx, ly, rnd(3, 7), rnd(2, 4), rnd(-1, 1)); fill(g, 'rgba(' + rndi(30, 70) + ',' + rndi(80, 130) + ',' + rndi(25, 60) + ',.85)');
  }
}

function drawHouse(g) {
  var HW = 104;
  /* 墙体 */
  var wall = g.createLinearGradient(0, 0, HW, 0);
  wall.addColorStop(0, '#c8b48a'); wall.addColorStop(0.75, '#a99070'); wall.addColorStop(1, '#7d6549');
  g.fillStyle = wall; g.fillRect(0, 30, HW, CFG.H - 30);
  /* 砖缝 */
  g.strokeStyle = 'rgba(90,70,50,.35)'; g.lineWidth = 1;
  for (var y = 44; y < CFG.H; y += 16) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(HW, y); g.stroke();
    for (var x = (y % 32 === 12 ? 0 : 18); x < HW; x += 36) {
      g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 16); g.stroke();
    }
  }
  /* 屋顶 */
  g.beginPath(); g.moveTo(-10, 46); g.lineTo(HW * 0.62, -6); g.lineTo(HW + 26, 46); g.closePath();
  var roof = g.createLinearGradient(0, 0, 0, 50);
  roof.addColorStop(0, '#8e4b3a'); roof.addColorStop(1, '#5e2e22'); g.fillStyle = roof; g.fill();
  line(g, 'rgba(40,18,12,.7)', 2);
  /* 窗户 */
  rr(g, 16, 150, 62, 70, 6); fill(g, '#42342a');
  rr(g, 20, 154, 54, 62, 4);
  var win = g.createLinearGradient(20, 154, 74, 216);
  win.addColorStop(0, '#8fd0e8'); win.addColorStop(0.5, '#5c9fc4'); win.addColorStop(1, '#2f6f96');
  g.fillStyle = win; g.fill();
  g.strokeStyle = '#42342a'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(47, 154); g.lineTo(47, 216); g.moveTo(20, 185); g.lineTo(74, 185); g.stroke();
  /* 门 + 台阶 */
  rr(g, 22, 330, 60, 120, 5); fill(g, '#6b4527');
  rr(g, 26, 334, 52, 112, 4); fill(g, '#8a5c34');
  circ(g, 70, 396, 3.6); fill(g, '#f0d070');
  g.fillStyle = '#b6a58c'; g.fillRect(14, 450, 78, 10); g.fillRect(8, 460, 90, 10);
  /* 屋前草地阴影 */
  var sh = g.createLinearGradient(HW, 0, HW + 34, 0);
  sh.addColorStop(0, 'rgba(0,0,0,.28)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(HW, 30, 34, CFG.H);
}

/* ================================================================
   植物：数据 + 程序化美术
   ================================================================ */
var PDEF = {
  sunflower:  { n: '向日葵',   cost: 50,  cd: 7.5,  hp: 300,  iy: 8,  is: 0.72, d: '每 24 秒生产 25 阳光' },
  peashooter: { n: '豌豆射手', cost: 100, cd: 7.5,  hp: 300,  iy: 8,  is: 0.72, d: '向前发射豌豆' },

  wave: 0, waveT: 0, waves: [], hugeAt: [], banner: null, shake: 0,
  endless: false, sunTimer: 0, over: 0, win: 0, chosen: [],
  stats: { killed: 0, planted: 0, sun: 0 }, msg: null, flagPct: 0
};

function resetGame(endless) {
  G.zs = []; G.ps = []; G.pr = []; G.suns = []; G.fx = []; G.mowers = [];
  G.grid = []; G.cool = {}; G.sel = -1; G.shovel = false; G.t = 0;
  G.wave = 0; G.banner = null; G.shake = 0; G.over = 0; G.win = 0; G.msg = null;
  G.stats = { killed: 0, planted: 0, sun: 0 }; G.endless = !!endless;
  G.sun = endless ? 175 : 150;
  G.sunTimer = 4.5;
  for (var r = 0; r < CFG.ROWS; r++) {
    G.grid.push([]);
    for (var c = 0; c < CFG.COLS; c++) G.grid[r].push(null);
    G.mowers.push({ row: r, x: CFG.MOWX, state: 'idle', t: 0 });
  }
  G.waves = buildWaves(endless);
  G.hugeAt = endless ? [] : [10, 20];
  G.waveT = 20;
  PORDER.forEach(function (k) { G.cool[k] = 0; });
}

function buildWaves(endless) {
  var total = endless ? 60 : 20, list = [];
  for (var i = 1; i <= total; i++) {
    var huge = endless ? (i % 5 === 0) : (i === 10 || i === 20);
    var budget = (endless ? 2.2 + i * 1.62 : 0.6 + i * 1.02) * (huge ? 2.15 : 1);
    var pool = ['basic', 'basic'];
    if (i >= 3) pool.push('cone');
    if (i >= 6) pool.push('cone');
    if (i >= 8) pool.push('paper');
    if (i >= 9) pool.push('pole');
    if (i >= 10) pool.push('bucket');
    if (i >= 13) pool.push('bucket');
    if (i >= 15) pool.push('football');
    var arr = [], guard = 0;
    if (huge) arr.push('flag');
    while (budget >= 1 && guard++ < 80) {
      var t = pick(pool), w = ZDEF[t].w;
      if (w > budget + 0.6) { t = 'basic'; w = 1; }
      arr.push(t); budget -= w;
    }
    list.push({ zs: arr, huge: huge });
  }
  return list;
}

/* ---------- 特效 ---------- */
function fx(o) { o.t = 0; o.life = o.life || 0.6; G.fx.push(o); return o; }
function puff(x, y, n, col, spd, size) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, TAU), s = rnd(spd * 0.3, spd);
    fx({ k: 'cloud', x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 12, r: rnd(size * 0.5, size), col: col, life: rnd(0.4, 0.9) });
  }
}
function splat(x, y, col) {
  for (var i = 0; i < 7; i++) {
    var a = rnd(-PI, 0.4);
    fx({ k: 'bit', x: x, y: y, vx: Math.cos(a) * rnd(30, 130), vy: Math.sin(a) * rnd(40, 150), r: rnd(1.6, 3.6), col: col, life: rnd(0.3, 0.6), g: 420 });
  }
}
function floatText(x, y, s, col) { fx({ k: 'txt', x: x, y: y, s: s, col: col, life: 1.1, vy: -34 }); }

function updFx(dt) {
  for (var i = G.fx.length - 1; i >= 0; i--) {
    var f = G.fx[i]; f.t += dt;
    if (f.vx !== undefined) f.x += f.vx * dt;
    if (f.vy !== undefined) f.y += f.vy * dt;
    if (f.g) f.vy += f.g * dt;
    if (f.k === 'cloud') { f.r += dt * 26; f.vx *= 0.94; f.vy *= 0.94; }
    if (f.k === 'sunfly') {
      var pr = clamp(f.t / f.life, 0, 1), e = pr * pr * (3 - 2 * pr);
      f.x = lerp(f.x0, 46, e); f.y = lerp(f.y0, 50, e); f.sc = lerp(1, 0.45, e);
    }
    if (f.t >= f.life) G.fx.splice(i, 1);
  }
}
function drawFx(g, f) {
  var pr = clamp(f.t / f.life, 0, 1), a = 1 - pr;
  g.save();
  switch (f.k) {
    case 'cloud':
      g.globalAlpha = a * 0.75; circ(g, f.x, f.y, f.r); fill(g, f.col); break;
    case 'bit':
      g.globalAlpha = a; circ(g, f.x, f.y, f.r); fill(g, f.col); break;
    case 'ring':
      g.globalAlpha = a * 0.8; g.lineWidth = 5 * a + 1;
      circ(g, f.x, f.y, f.r * (0.25 + pr * 1.05)); g.strokeStyle = f.col; g.stroke(); break;
    case 'flash':
      g.globalAlpha = a * 0.9; g.globalCompositeOperation = 'lighter';
      var gd = g.createRadialGradient(f.x, f.y, 2, f.x, f.y, f.r * (0.5 + pr));
      gd.addColorStop(0, '#fff6d0'); gd.addColorStop(0.4, f.col); gd.addColorStop(1, 'rgba(0,0,0,0)');
      circ(g, f.x, f.y, f.r * (0.5 + pr)); g.fillStyle = gd; g.fill(); break;
    case 'scorch':
      g.globalAlpha = clamp(a * 1.6, 0, 0.5); ell(g, f.x, f.y, f.rx, f.ry); fill(g, '#241a10'); break;
    case 'txt':
      g.globalAlpha = clamp(a * 1.8, 0, 1);
      txt(g, f.s, f.x, f.y, 'bold 20px "Microsoft YaHei"', f.col, 'center', 'rgba(0,0,0,.65)', 4); break;
    case 'sunfly':
      drawSun(g, { x: f.x, y: f.y, t: f.t * 4, sc: f.sc, alpha: 1 }); break;
    case 'ice':
      g.globalAlpha = a; g.translate(f.x, f.y); g.rotate(f.t * 3);
      g.strokeStyle = '#dff6ff'; g.lineWidth = 1.6;
      for (var k = 0; k < 3; k++) { g.save(); g.rotate(k * PI / 3); g.beginPath(); g.moveTo(-f.r, 0); g.lineTo(f.r, 0); g.stroke(); g.restore(); }
      break;
    case 'fire':
      g.globalAlpha = a * 0.9; g.globalCompositeOperation = 'lighter';
      var fg2 = g.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.r);
      fg2.addColorStop(0, '#fff0a0'); fg2.addColorStop(0.35, '#ff9a20'); fg2.addColorStop(1, 'rgba(200,30,0,0)');
      circ(g, f.x, f.y, f.r); g.fillStyle = fg2; g.fill(); break;
  }
  g.restore();
}

/* ---------- 阳光 ---------- */
function skySun() {
  var x = rnd(CFG.GX + 10, GR.R + 50);
  G.suns.push({ x: x, y: -24, ty: rnd(CFG.GY + 30, CFG.H - 60), vy: 30, t: 0, life: 13, st: 'fall' });
}
function plantSun(p) {
  G.suns.push({ x: p.x + rnd(-8, 8), y: p.y - 46, ty: p.y - 8, vy: 40, t: 0, life: 11, st: 'fall' });
}
function updSuns(dt) {
  for (var i = G.suns.length - 1; i >= 0; i--) {
    var s = G.suns[i]; s.t += dt;
    if (s.st === 'fall') { s.y += s.vy * dt; if (s.y >= s.ty) { s.y = s.ty; s.st = 'idle'; } }
    else { s.life -= dt; if (s.life < 1.2) s.alpha = clamp(s.life / 1.2, 0, 1); }
    if (s.life <= 0) G.suns.splice(i, 1);
  }
}
function grabSun(mx, my) {
  for (var i = G.suns.length - 1; i >= 0; i--) {
    var s = G.suns[i];
    if ((mx - s.x) * (mx - s.x) + (my - s.y) * (my - s.y) < 26 * 26) {
      G.sun += CFG.SUNV; G.stats.sun += CFG.SUNV;
      fx({ k: 'sunfly', x: s.x, y: s.y, x0: s.x, y0: s.y, sc: 1, life: 0.55 });
      G.suns.splice(i, 1); AU.sfx('sun'); return true;
    }
  }
  return false;
}

/* ---------- 种植 ---------- */
function canPlace(r, c) {
  return r >= 0 && r < CFG.ROWS && c >= 0 && c < CFG.COLS && !G.grid[r][c];
}
function addPlant(type, r, c) {
  var d = PDEF[type];
  var p = {
    type: type, def: d, row: r, col: c, x: cx(c), y: baseY(r),
    hp: d.hp, maxhp: d.hp, t: 0, ph: rnd(0, TAU), cd: 0, hitT: 0, flash: 0,
    plantAnim: 1, yOff: 0, xOff: 0, rot: 0, sink: 0, prAnim: 0, shootAnim: 0,
    armed: false, arm: 15, armMax: 15, fuse: 0, chewT: 0, st: 'idle', pend: 0, gone: false
  };
  if (type === 'sunflower') p.cd = rnd(5, 8);
  if (type === 'peashooter' || type === 'snowpea' || type === 'repeater') p.cd = rnd(0.3, 1.2);
  if (type === 'cherrybomb' || type === 'jalapeno') p.fuse = 0.001;
  G.grid[r][c] = p; G.ps.push(p); G.stats.planted++;
  puff(p.x, p.y - 6, 6, '#8a6a3a', 40, 7);

}
function killPlant(p, eaten) {
  if (p.gone) return; p.gone = true;
  if (G.grid[p.row] && G.grid[p.row][p.col] === p) G.grid[p.row][p.col] = null;
  var i = G.ps.indexOf(p); if (i >= 0) G.ps.splice(i, 1);
  if (eaten) { splat(p.x, p.y - 30, '#4f8f22'); puff(p.x, p.y - 20, 4, '#6aa832', 30, 6); }
}
function plantAtPoint(row, ax) {
  var best = null;
  for (var i = 0; i < G.ps.length; i++) {
    var p = G.ps[i];
    if (p.row !== row || p.gone) continue;
    if (ax > p.x - 28 && ax < p.x + 28) { if (!best || p.x > best.x) best = p; }
  }
  return best;
}

/* ---------- 攻击/伤害 ---------- */
function shoot(p, type, dy) {
  G.pr.push({
    type: type, x: p.x + 24, y: p.y - 52 + (dy || 0), row: p.row,
    vx: 300, dmg: 20, slow: type === 'snow', t: 0
  });
  p.shootAnim = 1;
  AU.sfx(type === 'snow' ? 'snow' : 'shoot');
}
function zombieInRow(row, minX, maxX) {
  var best = null;
  for (var i = 0; i < G.zs.length; i++) {
    var z = G.zs[i];
    if (z.row !== row || z.state === 'die') continue;
    if (z.x >= minX && z.x <= maxX) { if (!best || z.x < best.x) best = z; }
  }
  return best;
}
function hurtZ(z, dmg, kind) {
  if (z.state === 'die') return;
  if (kind === 'boom' || kind === 'fire' || kind === 'chomp' || kind === 'mow') { z.armor = 0; z.hp -= dmg; }
  else if (z.armor > 0) {
    z.armor -= dmg;
    if (z.armor < 0) { z.hp += z.armor; z.armor = 0; }
  } else z.hp -= dmg;
  if (z.type === 'paper' && z.armor <= 0 && !z.rage) {
    z.rage = true; z.spd = 38; AU.sfx('groan');
    puff(z.x, z.y - 50, 8, '#e8e4d4', 90, 5);
  }
  if (!z.armLost && z.hp <= z.maxhp * 0.5 && z.hp > 0) {
    z.armLost = true;
    fx({ k: 'bit', x: z.x - 26, y: z.y - 54, vx: rnd(-40, -90), vy: -60, r: 4, col: '#8fa376', life: 0.7, g: 400 });
  }
  if (z.hp <= 0) killZ(z, kind);
}
function killZ(z, kind) {
  if (z.state === 'die') return;
  z.state = 'die'; z.dieT = 0; G.stats.killed++;
  z.burn = (kind === 'boom' || kind === 'fire' || kind === 'mow');
  if (kind === 'chomp') { z.dieT = 9; }
  if (!z.burn) { splat(z.x, z.y - 60, '#7f9463'); AU.sfx('zdie'); }
  if (kind === 'mow') puff(z.x, z.y - 10, 6, '#6b4a26', 60, 7);
}
function boxDamage(x0, x1, r0, r1, dmg, kind) {
  for (var i = 0; i < G.zs.length; i++) {
    var z = G.zs[i];
    if (z.row < r0 || z.row > r1 || z.state === 'die') continue;
    if (z.x > x0 && z.x < x1) hurtZ(z, dmg, kind);
  }
}
function explodeAt(p) {
  var x0 = p.x - CFG.CW * 1.5, x1 = p.x + CFG.CW * 1.5;
  boxDamage(x0, x1, p.row - 1, p.row + 1, 1800, 'boom');
  fx({ k: 'flash', x: p.x, y: p.y - 34, r: 130, col: '#ffb020', life: 0.5 });
  fx({ k: 'ring', x: p.x, y: p.y - 24, r: 140, col: '#ffd36a', life: 0.45 });
  fx({ k: 'scorch', x: p.x, y: p.y - 6, rx: 108, ry: 62, life: 4 });
  for (var i = 0; i < 26; i++) {
    var a = rnd(0, TAU), s = rnd(40, 210);
    fx({ k: 'cloud', x: p.x + rnd(-20, 20), y: p.y - 30 + rnd(-20, 20), vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.6 - 20, r: rnd(10, 26), col: pick(['#ff9a2a', '#ffd45c', '#8a5a2a', '#5a4030']), life: rnd(0.4, 0.95) });
  }
  G.shake = 14; AU.sfx('boom');
}
function jalapenoBurn(p) {
  boxDamage(-40, CFG.W + 120, p.row, p.row, 1800, 'fire');
  for (var i = 0; i < 60; i++) {
    fx({ k: 'fire', x: rnd(CFG.GX - 30, CFG.W + 30), y: baseY(p.row) - rnd(6, 52), r: rnd(14, 34), life: rnd(0.35, 0.95) });
  }
  fx({ k: 'scorch', x: (CFG.GX + CFG.W) / 2, y: baseY(p.row) - 6, rx: 460, ry: 34, life: 5 });
  G.shake = 12; AU.sfx('fire');
}

/* ---------- 僵尸 ---------- */
function spawnZ(type, row) {
  var d = ZDEF[type];
  var z = {
    type: type, def: d, row: row, x: CFG.W + rnd(14, 76), y: baseY(row) + 4,
    hp: d.hp, maxhp: d.hp, armor: d.armor, armorMax: d.armor, spd: d.spd,
    t: rnd(0, 5), walk: rnd(0, TAU), ph: rnd(0, TAU), state: 'walk',
    slow: 0, armLost: false, dieT: 0, burn: false, rage: false,
    skin: pick(SKINS), shirt: type === 'pole' ? '#3f6fa8' : pick(SHIRTS),
    poleUsed: false, vaultT: 0, yOff: 0, eatCd: 0, groan: rnd(3, 12), _hand: null
  };
  if (type === 'football') z.shirt = '#c93232';
  G.zs.push(z);
  return z;
}
function updZ(z, dt) {
  z.t += dt;
  if (z.state === 'die') {
    z.dieT += dt;
    if (z.dieT > (z.burn ? 0.95 : 1.7)) { var i = G.zs.indexOf(z); if (i >= 0) G.zs.splice(i, 1); }
    return;
  }
  z.groan -= dt;
  if (z.groan <= 0) { z.groan = rnd(6, 16); if (z.x < CFG.W && Math.random() < 0.55) AU.sfx('groan'); }
  if (z.slow > 0) { z.slow -= dt; if (z.slow <= 0) z.slow = 0; }
  var sf = z.slow > 0 ? 0.5 : 1;

  if (z.state === 'vault') {
    z.vaultT += dt;
    var pr = clamp(z.vaultT / 0.62, 0, 1);
    z.x = z.vx0 + (z.vx1 - z.vx0) * pr;
    z.yOff = -Math.sin(pr * PI) * 46;
    z.walk += dt * 3;
    if (pr >= 1) { z.state = 'walk'; z.yOff = 0; z.poleUsed = true; z.spd = 17; AU.sfx('thud'); puff(z.x, z.y - 4, 5, '#7a5a34', 40, 5); }
    return;
  }

  var ax = z.x - 20;
  var target = plantAtPoint(z.row, ax);

  /* 撑杆跳：第一次遇到植物直接跳过 */
  if (target && z.type === 'pole' && !z.poleUsed) {
    z.state = 'vault'; z.vaultT = 0; z.vx0 = z.x; z.vx1 = z.x - 96; return;
  }

  if (target) {
    z.state = 'eat';
    z.walk += dt * 2.2;
    z.eatCd -= dt;
    if (z.eatCd <= 0) {
      z.eatCd = 0.36;
      target.hp -= ZDEF[z.type].dps * 0.36; target.hitT = 0.28;
      AU.sfx('bite');
      if (target.type === 'wallnut') splat(target.x - 10, target.y - 34, '#c08a48');
      if (target.hp <= 0) killPlant(target, true);
    }
  } else {
    z.state = 'walk';
    var v = z.spd * sf * dt;
    z.x -= v;
    z.walk += (v / 17) * 2.6 + dt * 0.4;
  }

  /* 到达房屋 */
  if (z.x < CFG.GX - 2) {
    var m = G.mowers[z.row];
    if (m.state === 'idle') { m.state = 'run'; m.t = 0; AU.sfx('mower'); }
    else if (m.state === 'done' && z.x < CFG.MOWX - 6 && !G.over) loseGame(z);
  }
}

/* ---------- 子弹 ---------- */
function updProj(dt) {
  for (var i = G.pr.length - 1; i >= 0; i--) {
    var b = G.pr[i]; b.t += dt; b.x += b.vx * dt;
    if (b.x > CFG.W + 40) { G.pr.splice(i, 1); continue; }
    var hit = null;
    for (var j = 0; j < G.zs.length; j++) {
      var z = G.zs[j];
      if (z.row !== b.row || z.state === 'die') continue;
      if (z.state === 'vault' && z.yOff < -14) continue;
      if (b.x + 7 > z.x - 17 && b.x - 7 < z.x + 15) { if (!hit || z.x < hit.x) hit = z; }
    }
    if (hit) {
      hurtZ(hit, b.dmg, 'pea');
      if (b.slow) {
        hit.slow = 3.2;
        for (var k = 0; k < 3; k++) fx({ k: 'ice', x: b.x + rnd(-6, 6), y: b.y + rnd(-8, 8), r: rnd(3, 6), life: rnd(0.3, 0.6) });
      }
      splat(b.x + 6, b.y, b.slow ? '#bfeaff' : '#8fd44a');
      AU.sfx('splat');
      G.pr.splice(i, 1);
    }
  }
}

/* ---------- 植物行为 ---------- */
function updP(p, dt) {
  p.t += dt;
  if (p.plantAnim > 0) p.plantAnim = Math.max(0, p.plantAnim - dt * 3.2);
  if (p.hitT > 0) p.hitT = Math.max(0, p.hitT - dt * 2.6);
  if (p.shootAnim > 0) p.shootAnim = Math.max(0, p.shootAnim - dt * 6);
  if (p.prAnim > 0) p.prAnim = Math.max(0, p.prAnim - dt * 1.6);

  switch (p.type) {
    case 'sunflower':
      p.cd -= dt;
      if (p.cd <= 0) { p.cd = 24; p.prAnim = 1; plantSun(p); }
      break;
    case 'peashooter': case 'snowpea': case 'repeater':
      p.cd -= dt;
      if (p.pend > 0) {
        p.pend -= dt;
        if (p.pend <= 0) { p.pend = 0; shoot(p, p.type === 'snowpea' ? 'snow' : 'pea', 6); }
      }
      if (p.cd <= 0 && zombieInRow(p.row, p.x - 6, CFG.W + 30)) {
        p.cd = 1.42;
        shoot(p, p.type === 'snowpea' ? 'snow' : 'pea', 0);
        if (p.type === 'repeater') p.pend = 0.18;
      }
      break;
    case 'potatomine':
      if (!p.armed) {
        p.arm -= dt;
        if (p.arm <= 0) { p.armed = true; puff(p.x, p.y - 10, 6, '#8a6a3a', 40, 6); AU.sfx('thud'); }
      } else {
        var z = zombieInRow(p.row, p.x - 44, p.x + 62);
        if (z) {
          boxDamage(p.x - 62, p.x + 74, p.row, p.row, 1800, 'boom');
          fx({ k: 'flash', x: p.x, y: p.y - 20, r: 70, col: '#ffb020', life: 0.4 });
          puff(p.x, p.y - 16, 16, '#a0783c', 150, 14);
          fx({ k: 'scorch', x: p.x, y: p.y - 4, rx: 46, ry: 22, life: 3.5 });
          G.shake = 9; AU.sfx('boom'); killPlant(p);
        }
      }
      break;
    case 'cherrybomb':
      p.fuse += dt / 1.15;
      if (p.fuse >= 1) { explodeAt(p); killPlant(p); }
      break;
    case 'jalapeno':
      p.fuse += dt / 1.05;
      if (p.fuse >= 1) { jalapenoBurn(p); killPlant(p); }
      break;
    case 'squash':
      if (p.st === 'idle') {
        var zt = zombieInRow(p.row, p.x - 30, p.x + 74);
        if (zt) { p.st = 'up'; p.cd = 0; p.tgt = zt; }
      } else if (p.st === 'up') {
        p.cd += dt / 0.42;
        p.yOff = -Math.sin(clamp(p.cd, 0, 1) * PI * 0.5) * 54;
        p.rot = clamp(p.cd, 0, 1) * 0.25;
        if (p.cd >= 1) {
          p.st = 'down'; p.cd = 0;
          p.tx = (p.tgt && p.tgt.state !== 'die') ? p.tgt.x : p.x + 40;
        }
      } else if (p.st === 'down') {
        p.cd += dt / 0.2;
        var q = clamp(p.cd, 0, 1);
        p.xOff = (p.tx - p.x) * q; p.yOff = -54 * (1 - q * q); p.rot = 0.25 * (1 - q);
        if (p.cd >= 1) {
          boxDamage(p.x + p.xOff - 44, p.x + p.xOff + 44, p.row, p.row, 1800, 'boom');
          puff(p.x + p.xOff, p.y - 8, 12, '#8a6a3a', 110, 10);
          G.shake = 8; AU.sfx('thud'); AU.sfx('chomp'); killPlant(p);
        }
      }
      break;
    case 'chomper':
      if (p.chewT > 0) { p.chewT -= dt; break; }
      if (p.st === 'lunge') {
        p.cd += dt / 0.22; p.xOff = Math.sin(clamp(p.cd, 0, 1) * PI) * 26;
        if (p.cd >= 1) {
          p.xOff = 0; p.st = 'idle';
          if (p.tgt && p.tgt.state !== 'die') { killZ(p.tgt, 'chomp'); p.chewT = 42; AU.sfx('chomp'); }
        }
      } else {
        var zc = zombieInRow(p.row, p.x + 4, p.x + 86);
        if (zc) { p.st = 'lunge'; p.cd = 0; p.tgt = zc; }
      }
      break;
  }
  if (p.hp <= 0 && !p.gone) killPlant(p, true);
}

/* ---------- 小推车 ---------- */
function updMower(m, dt) {
  if (m.state !== 'run') return;
  m.t += dt; m.x += 430 * dt;
  for (var i = 0; i < G.zs.length; i++) {
    var z = G.zs[i];
    if (z.row === m.row && z.state !== 'die' && Math.abs(z.x - m.x) < 34) hurtZ(z, 9999, 'mow');
  }
  if (m.t < 0.5 && Math.random() < 0.4) puff(m.x - 16, m.y || baseY(m.row) - 4, 1, 'rgba(200,200,200,.5)', 20, 5);
  if (m.x > CFG.W + 60) m.state = 'done';
}

/* ---------- 波次 ---------- */
function waveTotal() { return G.waves.length; }
function startWave() {
  if (G.wave >= G.waves.length) return;
  var w = G.waves[G.wave]; G.wave++;
  /* 行号袋：保证僵尸尽量均匀分摊到 5 行，避免同一行被堆死 */
  var bag = [];
  w.zs.forEach(function (t, i) {
    if (!bag.length) { bag = [0, 1, 2, 3, 4]; for (var s = bag.length - 1; s > 0; s--) { var j = rndi(0, s), tmp = bag[s]; bag[s] = bag[j]; bag[j] = tmp; } }
    var row = bag.pop();
    var z = spawnZ(t, row);
    z.x += (i % 3) * 34 + (w.huge ? rnd(0, 300) : rnd(0, 90));
  });
  if (w.huge) {
    G.banner = { txt: '一大波僵尸即将来袭！', t: 0, life: 3.4 };
    AU.sfx('siren'); G.shake = 8;
  }
  G.waveT = w.huge ? 48 : (34 - Math.min(13, G.wave * 0.62) + rnd(-1, 4));
}
function updWaves(dt) {
  if (G.wave >= G.waves.length) {
    var anyAlive = G.zs.some(function (z) { return z.state !== 'die'; });
    if (!anyAlive && !G.win && !G.over) winGame();
    return;
  }
  G.waveT -= dt;
  var alive = 0;
  for (var i = 0; i < G.zs.length; i++) if (G.zs[i].state !== 'die') alive++;
  var last = G.wave > 0 ? G.waves[G.wave - 1].zs.length : 0;
  if (G.wave > 0 && alive <= Math.max(1, Math.floor(last * 0.2)) && G.waveT > 9) G.waveT = 9;
  if (G.waveT <= 0) startWave();
}
function winGame() {
  G.win = 1; G.mode = 'win'; G.winT = 0; AU.sfx('win');
  for (var i = 0; i < 60; i++) {
    fx({ k: 'bit', x: rnd(200, 800), y: rnd(80, 300), vx: rnd(-90, 90), vy: rnd(-160, -40), r: rnd(2, 5), col: pick(['#ffd84d', '#ff6b6b', '#6be0ff', '#9dff6b', '#ff9df0']), life: rnd(1.2, 2.4), g: 180 });
  }
}
function loseGame(z) {
  G.over = 1; G.mode = 'lose'; G.overT = 0; G.eater = z;
  AU.sfx('lose'); AU.musOn = false; G.shake = 18;
}

/* ---------- 流程 ---------- */
function startPlay(endless) {
  resetGame(endless);
  G.bank = G.chosen.slice(0, BANKMAX);
  G.mode = 'play';
  AU.init();
}
function handleBtn(id) {
  AU.sfx('ui');
  if (id === 'adventure') { G.chosen = DEFAULT_BANK.slice(); G.endless = false; G.mode = 'choose'; }
  else if (id === 'endless') { G.chosen = DEFAULT_BANK.slice(); G.endless = true; G.mode = 'choose'; }
  else if (id === 'music') { AU.musOn = !AU.musOn; AU.init(); }
  else if (id === 'sfx') { AU.sfxOn = !AU.sfxOn; }
  else if (id === 'rock') { if (G.chosen.length) startPlay(G.endless); }
  else if (id === 'auto') { G.chosen = DEFAULT_BANK.slice(); }
  else if (id === 'back') { G.mode = 'menu'; }
  else if (id === 'resume') { G.mode = 'play'; }
  else if (id === 'again') { var e = G.endless; if (!G.chosen.length) G.chosen = DEFAULT_BANK.slice(); AU.musOn = true; startPlay(e); }
  else if (id === 'menu') { G.mode = 'menu'; AU.musOn = true; }
}

/* ---------- 更新 ---------- */
function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 26);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
  G.sunTimer -= dt;
  if (G.sunTimer <= 0) { G.sunTimer = rnd(6.5, 10.5); skySun(); }
  for (var k in G.cool) if (G.cool[k] > 0) G.cool[k] = Math.max(0, G.cool[k] - dt);
  var i;
  for (i = G.ps.length - 1; i >= 0; i--) updP(G.ps[i], dt);
  for (i = G.zs.length - 1; i >= 0; i--) updZ(G.zs[i], dt);
  for (i = 0; i < G.mowers.length; i++) updMower(G.mowers[i], dt);
  updProj(dt); updSuns(dt); updFx(dt); updWaves(dt);
}

/* ---------- 渲染 ---------- */
function render() {
  var g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, CFG.W, CFG.H);
  G.btns = [];
  g.save();
  if (G.shake > 0.2) g.translate(rnd(-1, 1) * G.shake * 0.35, rnd(-1, 1) * G.shake * 0.35);
  if (G.mode === 'menu') drawMenu(g);
  else if (G.mode === 'choose') drawChoose(g);
  else if (G.mode === 'art') drawArtSheet(g);
  else if (G.mode === 'paused') drawPause(g);
  else if (G.mode === 'win') drawWin(g);
  else if (G.mode === 'lose') drawLose(g);
  else {
    drawBoard(g); drawTopBar(g); drawProgress(g); drawBanner(g);
    if (G.sel >= 0 && G.mouse.in) {
      g.save(); g.globalAlpha = 0.8;
      var r = packetRect(G.sel);
      drawPacket(g, G.mouse.x - r.w / 2, G.mouse.y - r.h / 2, r.w, r.h, G.bank[G.sel], 0, true, false, G.time, false);
      g.restore();
    }
    if (G.shovel && G.mouse.in) { g.save(); g.globalAlpha = 0.9; drawShovel(g, G.mouse.x, G.mouse.y, 1.15); g.restore(); }
  }
  g.restore();
  /* 光标 */
  var wantPointer = false;
  for (var b = 0; b < G.btns.length; b++) {
    var bb = G.btns[b];
    if (G.mouse.x >= bb.x && G.mouse.x <= bb.x + bb.w && G.mouse.y >= bb.y && G.mouse.y <= bb.y + bb.h) wantPointer = true;
  }
  if (G.mode === 'play') {
    for (var s = 0; s < G.suns.length; s++) {
      var d = (G.mouse.x - G.suns[s].x) * (G.mouse.x - G.suns[s].x) + (G.mouse.y - G.suns[s].y) * (G.mouse.y - G.suns[s].y);
      if (d < 26 * 26) wantPointer = true;
    }
    if (G.mouse.y < BK.y + BK.h && G.mouse.x < SHOVEL.x + SHOVEL.w) wantPointer = true;
  }
  cv.style.cursor = wantPointer ? 'pointer' : ((G.sel >= 0 || G.shovel) ? 'none' : 'default');
}

/* ---------- 主循环 ---------- */
var lastTs = 0;
function frame(ts) {
  var dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
  lastTs = ts; dt = Math.min(dt, 0.05);
  G.time += dt;
  if (AU.ctx) AU.tickMus();
  if (G.mode === 'play') { for (var s = 0; s < G.speed; s++) update(dt); }
  else if (G.mode === 'win' || G.mode === 'lose') { G.overT += dt; updFx(dt); updSuns(dt); }
  else updFx(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------- 输入 ---------- */
function toLocal(e) {
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * CFG.W / r.width, y: (e.clientY - r.top) * CFG.H / r.height };
}
cv.addEventListener('pointermove', function (e) {
  var p = toLocal(e); G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.in = true;
  G.hover.r = rowAt(p.y); G.hover.c = colAt(p.x);
  if (G.hover.r < 0 || G.hover.r >= CFG.ROWS || G.hover.c < 0 || G.hover.c >= CFG.COLS) { G.hover.r = -1; G.hover.c = -1; }
});
cv.addEventListener('pointerleave', function () { G.mouse.in = false; G.mouse.x = -99; G.mouse.y = -99; });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); G.sel = -1; G.shovel = false; });
cv.addEventListener('pointerdown', function (e) {
  AU.init();
  var p = toLocal(e); G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.in = true;
  if (e.button === 2) { G.sel = -1; G.shovel = false; return; }
  for (var i = 0; i < G.btns.length; i++) {
    var b = G.btns[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { handleBtn(b.id); return; }
  }
  if (G.mode === 'choose') {
    var cr = G.chooseRects || [];
    for (var j = 0; j < cr.length; j++) {
      if (inR(p, cr[j])) {
        var t = cr[j].type, ix = G.chosen.indexOf(t);
        if (ix < 0 && G.chosen.length < BANKMAX) { G.chosen.push(t); AU.sfx('ui'); }
        else if (ix >= 0) { G.chosen.splice(ix, 1); AU.sfx('ui'); }
        return;
      }
    }
    for (var q = 0; q < G.chosen.length; q++) {
      if (inR(p, packetRect(q))) { G.chosen.splice(q, 1); AU.sfx('ui'); return; }
    }
    return;
  }
  if (G.mode !== 'play') return;
  if (grabSun(p.x, p.y)) return;
  /* 顶栏 */
  if (p.y < BK.y + BK.h) {
    if (inR(p, SHOVEL)) { G.shovel = !G.shovel; G.sel = -1; AU.sfx('shovel'); return; }
    for (var k = 0; k < G.bank.length; k++) {
      if (inR(p, packetRect(k))) {
        var type = G.bank[k];
        if (G.cool[type] > 0 || G.sun < PDEF[type].cost) { AU.sfx('err'); floatText(packetRect(k).x + 30, BK.y + BK.h + 18, G.sun < PDEF[type].cost ? '阳光不足' : '冷却中', '#ffd0d0'); return; }
        G.sel = (G.sel === k ? -1 : k); G.shovel = false; AU.sfx('ui'); return;
      }
    }
    return;
  }
  /* 草坪 */
  var r2 = rowAt(p.y), c2 = colAt(p.x);
  if (r2 < 0 || r2 >= CFG.ROWS || c2 < 0 || c2 >= CFG.COLS) { G.sel = -1; G.shovel = false; return; }
  if (G.shovel) {
    var pl = G.grid[r2][c2];
    if (pl) { killPlant(pl); puff(cx(c2), baseY(r2) - 8, 8, '#8a6a3a', 60, 7); AU.sfx('shovel'); }
    G.shovel = false; return;
  }
  if (G.sel >= 0) {
    var ty = G.bank[G.sel], d = PDEF[ty];
    if (!canPlace(r2, c2)) { AU.sfx('err'); return; }
    if (G.sun < d.cost || G.cool[ty] > 0) { AU.sfx('err'); return; }
    G.sun -= d.cost; G.cool[ty] = d.cd; addPlant(ty, r2, c2); G.sel = -1;
  }
});
window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k >= '1' && k <= '8' && G.mode === 'play') {
    var i = parseInt(k, 10) - 1;
    if (i < G.bank.length) { G.sel = G.sel === i ? -1 : i; G.shovel = false; AU.sfx('ui'); }
  }
  if (k === ' ') {
    e.preventDefault();
    if (G.mode === 'play') G.mode = 'paused'; else if (G.mode === 'paused') G.mode = 'play';
  }
  if (k === 'Escape') { if (G.sel >= 0 || G.shovel) { G.sel = -1; G.shovel = false; } else if (G.mode === 'play') G.mode = 'paused'; }
  if (k === 'm' || k === 'M') { AU.musOn = !AU.musOn; AU.init(); }
  if (k === 'n' || k === 'N') { AU.sfxOn = !AU.sfxOn; }
  if (k === 'f' || k === 'F') { G.speed = G.speed === 1 ? 3 : 1; }
});

function bootQuery() {

/* ---------- 无头逻辑自测（?selftest=1，用 --dump-dom 读取结果） ---------- */
function selftest() {
  var out = [], pass = 0, fail = 0;
  function ok(name, cond, detail) {
    if (cond) pass++; else fail++;
    out.push((cond ? 'PASS' : 'FAIL') + ' | ' + name + ' | ' + (detail || ''));
  }
  function sim(sec, dt) { dt = dt || 1 / 50; var n = Math.round(sec / dt); for (var i = 0; i < n; i++) update(dt); }
  function fresh() {
    AU.sfxOn = false; AU.musOn = false;
    resetGame(false); G.mode = 'play'; G.waveT = 1e9; G.sun = 9999;
    G.bank = DEFAULT_BANK.slice();
  }
  function alive() { var n = 0; for (var i = 0; i < G.zs.length; i++) if (G.zs[i].state !== 'die') n++; return n; }
  var z, z2, i, r;

  try {
    /* 1 豌豆射手击杀 */
    fresh(); addPlant('peashooter', 2, 0); z = spawnZ('basic', 2); z.x = 700; sim(40);
    ok('豌豆射手击杀普通僵尸', G.stats.killed >= 1 && alive() === 0, 'killed=' + G.stats.killed);

    /* 2 向日葵产阳光 + 收集 */
    fresh(); addPlant('sunflower', 1, 1); sim(32);
    ok('向日葵产出阳光', G.suns.length > 0, 'suns=' + G.suns.length);
    var before = G.sun, got = G.suns.length ? grabSun(G.suns[0].x, G.suns[0].y) : false;
    ok('点击收集阳光 +25', got && G.sun === before + 25, before + ' -> ' + G.sun);

    /* 3 小推车 + 二次入侵判负 */
    fresh(); z = spawnZ('basic', 3); z.x = CFG.GX + 40; sim(4);
    ok('僵尸触发小推车', G.mowers[3].state !== 'idle', 'state=' + G.mowers[3].state);
    sim(6);
    ok('小推车清空该行', alive() === 0 && G.mowers[3].state === 'done', 'alive=' + alive());
    z2 = spawnZ('basic', 3); z2.x = CFG.GX + 30; sim(16);
    ok('该行再被突破则失败', G.mode === 'lose', 'mode=' + G.mode);

    /* 4 樱桃炸弹范围杀 */
    fresh();
    for (i = 0; i < 6; i++) { z = spawnZ('basic', 2 + (i % 2)); z.x = cx(4) + (i - 3) * 12; }
    addPlant('cherrybomb', 2, 4); sim(3);
    ok('樱桃炸弹 3x3 群杀', alive() === 0, 'alive=' + alive());

    /* 5 寒冰射手减速 */
    fresh(); addPlant('snowpea', 0, 0); z = spawnZ('basic', 0); z.x = 620; sim(7);
    ok('寒冰豌豆减速僵尸', z.slow > 0, 'slow=' + z.slow.toFixed(2));

    /* 6 坚果墙耐久 */
    fresh(); var wn = addPlant('wallnut', 4, 4); z = spawnZ('basic', 4); z.x = cx(5) + 30; sim(30);
    ok('坚果墙 30 秒未被吃穿', !wn.gone && wn.hp > 0, 'hp=' + Math.round(wn.hp) + '/4000');

    /* 7 土豆雷 */
    fresh(); var pm = addPlant('potatomine', 1, 3); sim(16);
    ok('土豆雷 15 秒出土', pm.armed === true, 'armed=' + pm.armed);
    z = spawnZ('basic', 1); z.x = cx(3) + 70; sim(5);
    ok('土豆雷引爆并消失', pm.gone && alive() === 0, 'alive=' + alive());

    /* 8 大嘴花吞噬 */
    fresh(); var ch = addPlant('chomper', 2, 2); z = spawnZ('basic', 2); z.x = cx(2) + 60; sim(3);
    ok('大嘴花吞噬僵尸并咀嚼', alive() === 0 && ch.chewT > 30, 'chew=' + ch.chewT.toFixed(0) + 's');

    /* 9 倭瓜压杀 */
    fresh(); addPlant('squash', 0, 4); z = spawnZ('basic', 0); z.x = cx(4) + 50; sim(4);
    ok('倭瓜压死僵尸', alive() === 0, 'alive=' + alive());

    /* 10 辣椒清行 */
    fresh();
    for (i = 0; i < 5; i++) { z = spawnZ('cone', 3); z.x = 420 + i * 90; }
    addPlant('jalapeno', 3, 1); sim(2.5);
    ok('火爆辣椒清空一整行', alive() === 0, 'alive=' + alive());

    /* 11 双发射手连发 */
    fresh(); addPlant('repeater', 0, 0); z = spawnZ('basic', 0); z.x = 900;
    var maxPeas = 0;
    for (i = 0; i < 200; i++) { update(1 / 50); if (G.pr.length > maxPeas) maxPeas = G.pr.length; }
    ok('双发射手一次两颗豌豆', maxPeas >= 2, 'maxPeas=' + maxPeas);

    /* 12 撑杆跳越过植物 */
    fresh(); addPlant('wallnut', 2, 5); z = spawnZ('pole', 2); z.x = cx(6) + 40; sim(9);
    ok('撑杆跳僵尸越过植物', z.poleUsed && z.x < cx(5), 'x=' + z.x.toFixed(0) + ' 植物x=' + cx(5));

    /* 13 读报僵尸暴走 */
    fresh(); addPlant('peashooter', 4, 0); z = spawnZ('paper', 4); z.x = 800; sim(22);
    ok('读报僵尸失报纸后暴走', z.rage === true || z.state === 'die', 'rage=' + z.rage + ' spd=' + z.spd);

    /* 14 铁桶护甲吸收 */
    fresh(); addPlant('peashooter', 1, 0); z = spawnZ('bucket', 1); z.x = 860; sim(20);
    ok('铁桶僵尸先掉护甲', z.armor < z.armorMax && z.hp === z.maxhp, 'armor=' + Math.round(z.armor) + '/1100');

    /* 15 整局自动通关（无限阳光 AI） */
    var A = autoplay(true, 620);
    ok('全 20 波可通关（强 AI）', A.mode === 'win', 'mode=' + A.mode + ' wave=' + A.wave + ' 用时' + A.t + 's 击杀' + A.killed);
    /* 16 经济 AI 平衡参考（不判失败） */
    var B = autoplay(false, 620);
    out.push('INFO | 经济 AI 结果 | mode=' + B.mode + ' wave=' + B.wave + '/20 击杀' + B.killed + ' 存活植物' + B.plants);

    /* 17 数值健康检查 */
    var bad = 0;
    [G.zs, G.ps, G.pr, G.suns, G.fx].forEach(function (arr) {
      for (var i2 = 0; i2 < arr.length; i2++) {
        var o = arr[i2];
        if (!isFinite(o.x) || !isFinite(o.y)) bad++;
      }
    });
    ok('无 NaN/Infinity 坐标', bad === 0, 'bad=' + bad);

    /* 18 绘制全模式不抛异常 */
    var modes = ['menu', 'choose', 'art', 'play', 'paused', 'win', 'lose'], drawErr = '';
    for (i = 0; i < modes.length; i++) {
      G.mode = modes[i];
      try { render(); } catch (e) { drawErr += modes[i] + ':' + e.message + ' '; }
    }
    ok('7 个界面渲染无异常', drawErr === '', drawErr || '全部通过');

  } catch (e) {
    fail++; out.push('FAIL | 自测过程抛出异常 | ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]);
  }

  var head = 'SELFTEST ' + (fail === 0 ? 'ALL PASS' : fail + ' FAILED') + '  (pass=' + pass + ', fail=' + fail + ')';
  document.title = head;
  var pre = document.createElement('pre');
  pre.id = 'selftest';
  pre.style.cssText = 'position:absolute;left:0;top:0;z-index:200;background:#0b0f08;color:#b6ff8a;font:12px/1.55 Consolas,monospace;padding:10px;white-space:pre-wrap;max-width:100%';
  pre.textContent = head + '\n' + out.join('\n');
  document.body.appendChild(pre);
}
function autoplay(strong, maxSec) {
  AU.sfxOn = false; AU.musOn = false;
  resetGame(false); G.mode = 'play'; G.bank = DEFAULT_BANK.slice(); G.waveT = 16;
  var plan = [], r, ro = [2, 1, 3, 0, 4];
  /* 拟人开局：先给中路一炮，再逐行铺经济+火力 */
  for (r = 0; r < 5; r++) { plan.push(['sunflower', ro[r], 0]); plan.push(['peashooter', ro[r], 2]); }
  for (r = 0; r < 5; r++) plan.push(['sunflower', ro[r], 1]);
  for (r = 0; r < 5; r++) plan.push(['peashooter', ro[r], 3]);
  for (r = 0; r < 5; r++) plan.push(['wallnut', ro[r], 6]);
  for (r = 0; r < 5; r++) plan.push(['repeater', ro[r], 4]);
  for (r = 0; r < 5; r++) plan.push(['snowpea', ro[r], 5]);
  var dt = 1 / 40, t = 0, tick = 0, maxZ = 0;
  while (t < maxSec && G.mode === 'play') {
    update(dt); t += dt; tick++;
    if (G.zs.length > maxZ) maxZ = G.zs.length;
    if (tick % 8) continue;
    if (strong) G.sun = 9999;
    for (var i = G.suns.length - 1; i >= 0; i--) grabSun(G.suns[i].x, G.suns[i].y);
    /* 拟人反应：哪一行有僵尸却没有攻击植物，就先补一门炮 */
    var need = -1;
    for (var k2 = 0; k2 < G.zs.length && need < 0; k2++) {
      var zz = G.zs[k2];
      if (zz.state === 'die') continue;
      var armed = false;
      for (var pi = 0; pi < G.ps.length; pi++) {
        var pp = G.ps[pi];
        if (pp.row === zz.row && (pp.type === 'peashooter' || pp.type === 'repeater' || pp.type === 'snowpea')) { armed = true; break; }
      }
      if (!armed) need = zz.row;
    }
    if (need >= 0 && G.cool['peashooter'] <= 0 && G.sun >= 100) {
      for (var c2 = 2; c2 < CFG.COLS; c2++) {
        if (canPlace(need, c2)) { G.sun -= 100; G.cool['peashooter'] = 7.5; addPlant('peashooter', need, c2); break; }
      }
      continue;
    }
    for (var j = 0; j < plan.length; j++) {
      var ty = plan[j][0];
      if (!canPlace(plan[j][1], plan[j][2])) continue;
      if (G.cool[ty] > 0 || G.sun < PDEF[ty].cost) continue;
      G.sun -= PDEF[ty].cost; G.cool[ty] = PDEF[ty].cd; addPlant(ty, plan[j][1], plan[j][2]);
      break;
    }
    if (strong && G.cool['cherrybomb'] <= 0) {
      for (var k = 0; k < G.zs.length; k++) {
        var z = G.zs[k];
        if (z.state === 'die' || z.x > cx(3)) continue;
        for (var cc = clamp(colAt(z.x), 0, CFG.COLS - 1); cc < CFG.COLS; cc++) {
          if (canPlace(z.row, cc)) { G.cool['cherrybomb'] = 50; addPlant('cherrybomb', z.row, cc); break; }
        }
        break;
      }
    }
  }
  return { mode: G.mode, wave: G.wave, t: Math.round(t), killed: G.stats.killed, plants: G.ps.length, maxZ: maxZ };
}

function balance(n) {
  var lines = ['BALANCE 经济型 AI x' + n + '（模拟真实玩家节奏：只靠向日葵攒钱，不用应急植物）'];
  var winCnt = 0;
  for (var i = 0; i < n; i++) {
    var r = autoplay(false, 760);
    if (r.mode === 'win') winCnt++;
    lines.push('  run' + (i + 1) + ': ' + r.mode + '  wave=' + r.wave + '/20  kills=' + r.killed +
      '  存活植物=' + r.plants + '  t=' + r.t + 's  峰值僵尸=' + r.maxZ);
  }
  var s = autoplay(true, 760);
  lines.push('  强 AI: ' + s.mode + ' wave=' + s.wave + ' t=' + s.t + 's kills=' + s.killed);
  lines.push('  经济 AI 通关率 = ' + winCnt + '/' + n);
  document.title = 'BALANCE win=' + winCnt + '/' + n;
  var pre = document.createElement('pre');
  pre.id = 'selftest';
  pre.style.cssText = 'position:absolute;left:0;top:0;z-index:200;background:#0b0f08;color:#b6ff8a;font:12px/1.5 Consolas,monospace;padding:10px;white-space:pre-wrap';
  pre.textContent = lines.join('\n');
  document.body.appendChild(pre);
}

/* ---------- 启动 ---------- */
LAWN = makeLawn();
resetGame(false);
initArtZ();
G.chosen = DEFAULT_BANK.slice();
G.mode = 'menu';
bootQuery();
requestAnimationFrame(frame);
