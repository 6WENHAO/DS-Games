<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREENFALL · 绿蚀纪元 —— 体素生存</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="ui"></div>

  <!-- 数据与引擎（普通脚本，双击 index.html 也能直接玩） -->
  <script src="src/core.js"></script>
  <script src="src/blocks.js"></script>
  <script src="src/items.js"></script>
  <script src="src/recipes.js"></script>
  <script src="src/atlas.js"></script>
  <script src="src/worldgen.js"></script>
  <script src="src/structures.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/survival.js"></script>
  <script src="src/quests.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>

  <!-- MOD：想加东西就往这里加脚本（见 mods/example-mod.js 与 README） -->
  <script src="mods/example-mod.js"></script>

  <script>
    window.addEventListener('load', function () {
      try { GF.boot(); }
      catch (e) {
        console.error(e);
        document.body.insertAdjacentHTML('beforeend',
          '<pre style="position:fixed;inset:20px;color:#ffb0b0;background:#101410;padding:20px;overflow:auto;font:13px monospace;z-index:9999">启动失败：\n' +
          (e && e.stack ? e.stack : e) + '</pre>');
      }
    });
  </script>
</body>
</html>
