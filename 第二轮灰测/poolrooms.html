<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b1a20'/%3E%3Cpath d='M0 10h16v6H0z' fill='%234fd8e4' opacity='.7'/%3E%3C/svg%3E">
<title>POOLROOMS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #04070a;
    font-family: "Inter", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #view { display: block; width: 100vw; height: 100vh; outline: none; }
  body.locked { cursor: none; }

  /* ---- boot / pause veil (无 HUD，仅进入提示) ---- */
  #veil {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 45%, #0d1a21 0%, #04070a 70%);
    color: #cfe6ee; transition: opacity .9s ease; opacity: 1;
  }
  #veil.hidden { opacity: 0; pointer-events: none; }
  #veil .title {
    font-size: clamp(28px, 7vw, 76px); letter-spacing: .42em; font-weight: 200;
    text-indent: .42em; color: #e7f6fb; text-shadow: 0 0 42px rgba(120,220,240,.30);
  }
  #veil .sub {
    margin-top: 14px; font-size: 12px; letter-spacing: .30em; text-transform: uppercase;
    color: #6d93a1; text-indent: .30em;
  }
  #bar {
    margin-top: 40px; width: min(320px, 60vw); height: 1px; background: rgba(150,200,215,.16);
    position: relative; overflow: hidden;
  }
  #bar > i { position: absolute; inset: 0 100% 0 0; background: linear-gradient(90deg,#4fd8e4,#bff3fa); transition: right .35s ease; }
  #status { margin-top: 14px; font-size: 11px; letter-spacing: .18em; color: #5b7d8a; height: 14px; }
  #enter {
    margin-top: 34px; font-size: 13px; letter-spacing: .30em; color: #9fd4e2; text-indent: .3em;
    opacity: 0; transition: opacity .6s ease; animation: pulse 3.2s ease-in-out infinite;
  }
  #enter.on { opacity: 1; }
  @keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  #hint { margin-top: 18px; font-size: 10.5px; letter-spacing: .12em; color: #43606b; line-height: 2; text-align: center; }

  /* ---- 隐藏诊断层：F3 切换（默认不可见，非游戏 UI） ---- */
  #diag {
    position: fixed; left: 10px; top: 10px; z-index: 20; display: none;
    font: 11px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #8fe6d4; background: rgba(3,10,13,.62); padding: 8px 11px;
    border: 1px solid rgba(120,220,220,.16); border-radius: 3px; white-space: pre;
    pointer-events: none; text-shadow: 0 0 8px rgba(0,0,0,.9);
  }
  #diag.on { display: block; }
  #fatal {
    position: fixed; inset: 0; z-index: 40; display: none; overflow: auto; padding: 6vh 8vw;
    background: #0a0406; color: #ffb4b4; font: 12px/1.7 ui-monospace, Consolas, monospace; white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="veil">
  <div class="title">POOLROOMS</div>
  <div class="sub">endless wet architecture</div>
  <div id="bar"><i></i></div>
  <div id="status">初始化…</div>
  <div id="enter">点击进入</div>
  <div id="hint">WASD 移动 · SHIFT 疾行 · 空格 上浮/跳 · CTRL 下潜 · 鼠标 视角 · ESC 释放光标</div>
</div>

<div id="diag"></div>
<pre id="fatal"></pre>

    if (ev && ev.message && /Script error/i.test(ev.message)) return;
