<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>BlockRealm · 方块国度</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0b0d12; --panel: rgba(16,19,26,.86); --panel2: rgba(26,30,40,.92);
  --line: rgba(255,255,255,.10); --line2: rgba(255,255,255,.18);
  --txt: #e8ecf4; --dim: #9aa4b6; --acc: #6fd3c7; --acc2: #f0b455; --bad: #e0554a;
  --slot: rgba(255,255,255,.055); --slotH: rgba(111,211,199,.22);
}
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }
.hidden { display: none !important; }

#crosshair { position: fixed; left: 50%; top: 50%; width: 40px; height: 40px; transform: translate(-50%,-50%);
  pointer-events: none; opacity: .8; mix-blend-mode: exclusion; }
#vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.35) 100%); }
#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .18s;
  background: radial-gradient(ellipse at center, rgba(190,20,20,0) 40%, rgba(190,20,20,.55) 100%); }
#uw { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: linear-gradient(rgba(20,90,130,.28), rgba(10,50,90,.42)); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud-left { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); width: 640px; display: flex; }
#hud-right { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); width: 640px; display: flex; justify-content: flex-end; }
#stats { display: flex; flex-direction: column; gap: 3px; }
.bar-row { display: flex; gap: 2px; align-items: center; flex-wrap: nowrap; }
.pip { width: 15px; height: 14px; position: relative; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.pip svg { width: 100%; height: 100%; display: block; }
#xpbar { position: absolute; left: 50%; bottom: 68px; transform: translateX(-50%); width: 640px; height: 7px;
  background: rgba(0,0,0,.45); border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
#xpfill { height: 100%; width: 0%; background: linear-gradient(90deg,#7ce0a0,#b6f06a); }
#xplabel { position: absolute; left: 50%; top: -17px; transform: translateX(-50%); font-size: 12px; color: #b6f06a;
  text-shadow: 0 1px 3px #000; font-weight: 700; }
#hotbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 5px;
  padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  backdrop-filter: blur(9px); box-shadow: 0 8px 26px rgba(0,0,0,.45); }
.slot { width: 46px; height: 46px; border-radius: 8px; background: var(--slot); position: relative;
  box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.slot.sel { box-shadow: inset 0 0 0 2px var(--acc), 0 0 14px rgba(111,211,199,.35); background: var(--slotH); }
.slot img { width: 40px; height: 40px; pointer-events: none; image-rendering: auto; }
.slot .cnt { position: absolute; right: 3px; bottom: 1px; font-size: 12px; font-weight: 700;
  text-shadow: 0 1px 3px #000, 0 0 6px #000; }
.slot .dur { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.6); overflow: hidden; }
.slot .dur i { display: block; height: 100%; background: linear-gradient(90deg,#6de07a,#d8e05a); }
#itemname { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); font-size: 14px;
  color: #fff; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .3s; font-weight: 600; letter-spacing: .3px; }
#place-info { position: absolute; left: 50%; bottom: 122px; transform: translateX(-50%); font-size: 12px; color: var(--dim); text-shadow: 0 1px 3px #000; }
#toasts { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { background: var(--panel); border: 1px solid var(--line2); border-left: 3px solid var(--acc);
  padding: 9px 14px; border-radius: 8px; font-size: 13px; backdrop-filter: blur(8px);
  animation: tin .3s ease-out; max-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.warn { border-left-color: var(--acc2); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

#debug { position: fixed; left: 10px; top: 10px; font: 12px/1.55 "Cascadia Mono", Consolas, monospace;
  background: rgba(6,8,12,.72); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  pointer-events: none; white-space: pre; color: #cfe3e0; max-width: 46vw; }
#debug b { color: var(--acc); font-weight: 600; }

/* ---------- screens ---------- */
#screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6,8,12,.72);
  backdrop-filter: blur(7px); z-index: 20; }
.panel { background: var(--panel2); border: 1px solid var(--line2); border-radius: 16px; padding: 20px 22px;
  box-shadow: 0 26px 70px rgba(0,0,0,.6); max-height: 92vh; overflow: auto; }
.panel h2 { font-size: 19px; margin-bottom: 14px; letter-spacing: .4px; display: flex; align-items: center; gap: 8px; }
.panel h2 .sub { font-size: 12px; color: var(--dim); font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(9, 46px); gap: 5px; }
.grid.c3 { grid-template-columns: repeat(3, 46px); }
.grid.c2 { grid-template-columns: repeat(2, 46px); }
.grid.c4 { grid-template-columns: repeat(4, 46px); }
.row { display: flex; gap: 14px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.sep { height: 1px; background: var(--line); margin: 12px 0; }
.slot.hov { background: var(--slotH); box-shadow: inset 0 0 0 1px var(--acc); }
.slot.out { background: rgba(240,180,85,.14); box-shadow: inset 0 0 0 1px rgba(240,180,85,.5); }
.lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
#cursorSlot { position: fixed; width: 46px; height: 46px; pointer-events: none; z-index: 50; transform: translate(-50%,-50%); }
#cursorSlot img { width: 40px; height: 40px; }
#tooltip { position: fixed; z-index: 60; pointer-events: none; background: rgba(8,10,14,.95); border: 1px solid var(--line2);
  border-radius: 8px; padding: 8px 11px; font-size: 12.5px; max-width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
#tooltip .tt-name { font-weight: 700; margin-bottom: 3px; }
#tooltip .tt-lore { color: var(--dim); font-size: 11.5px; font-style: italic; }
#tooltip .tt-stat { color: var(--acc); font-size: 11.5px; }
.rare1 { color: #7ce0a0; } .rare2 { color: #6fd3ff; } .rare3 { color: #c48af0; } .rare4 { color: #f0b455; }

button, .btn { font: inherit; font-size: 14px; padding: 10px 18px; border-radius: 10px; cursor: pointer;

button:hover, .btn:hover { background: rgba(111,211,199,.18); border-color: var(--acc); transform: translateY(-1px); }
button.primary { background: linear-gradient(180deg, #2f9d90, #1d6f66); border-color: #46c2b3; font-weight: 600; }
button.primary:hover { background: linear-gradient(180deg, #3ab8a8, #23847a); }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  border: 1px solid var(--line2); color: var(--txt); width: 100%; }
input[type=range] { width: 190px; accent-color: var(--acc); }
label.set { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; padding: 5px 0; }
label.set span.v { color: var(--acc); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button { padding: 7px 14px; font-size: 13px; }
.tabs button.on { background: rgba(111,211,199,.2); border-color: var(--acc); }
.list { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow: auto; }
.wcard { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px;

.wcard .meta { font-size: 11.5px; color: var(--dim); }
.recipes { display: grid; grid-template-columns: repeat(6, 46px); gap: 5px; max-height: 260px; overflow: auto; padding-right: 4px; }
.arrow { width: 34px; display: grid; place-items: center; color: var(--dim); font-size: 20px; }
.progressbar { width: 34px; height: 8px; background: rgba(0,0,0,.5); border-radius: 4px; overflow: hidden; }
.progressbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#f0b455,#f07a35); }
.flame { width: 22px; height: 26px; margin: 6px auto; }

/* ---------- loading / menu ---------- */
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40;
  background: radial-gradient(ellipse at 50% 30%, #16202c 0%, #080a0f 70%); }
.lg-inner { text-align: center; }
.logo { font-size: 54px; letter-spacing: 5px; font-weight: 800; color: #e8f4f2; text-shadow: 0 4px 30px rgba(111,211,199,.35); }
.logo span { color: var(--acc); }
.tagline { color: var(--dim); margin: 8px 0 26px; font-size: 13.5px; letter-spacing: 3px; }
.progress { width: 380px; height: 6px; background: rgba(255,255,255,.09); border-radius: 4px; overflow: hidden; margin: 0 auto; }
#lgbar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--acc), #b6f06a); transition: width .25s; }
#lgtext { margin-top: 12px; font-size: 12.5px; color: var(--dim); }
.menu-hero { text-align: center; margin-bottom: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12.5px; color: var(--dim); }
.kv b { color: var(--txt); font-weight: 600; }
.keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px 20px; font-size: 12.5px; }
.keys div { display: flex; justify-content: space-between; gap: 10px; }
.keys kbd { background: rgba(255,255,255,.1); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 7px; font-size: 11.5px; }
.dim-title { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 30; }
.dim-title div { font-size: 42px; font-weight: 800; letter-spacing: 8px; opacity: 0; animation: dimt 3.4s ease-in-out;
  text-shadow: 0 4px 40px #000; }
@keyframes dimt { 0%,100% { opacity: 0; transform: scale(1.06); } 22%,64% { opacity: 1; transform: none; } }
.death { text-align: center; }
.death h2 { font-size: 34px; color: var(--bad); letter-spacing: 3px; justify-content: center; }

</style>
</head>

    const P = (a, b) => (a & 65535 | (b & 65535) << 16) >>> 0;
    for (const bx of boxes) {
      const [x0, y0, z0, x1, y1, z1, tex2, part] = bx;
      const T2 = typeof tex2 === "number" ? [tex2, tex2, tex2, tex2, tex2, tex2] : tex2;
      const X0 = x0 + OFF2, Y0 = y0 + OFF2, Z0 = z0 + OFF2, X1 = x1 + OFF2, Y1 = y1 + OFF2, Z1 = z1 + OFF2;
      const w3 = ((part || 0) & 15) << 24 >>> 0;
      for (let f = 0; f < 6; f++) {
        let px, py, pz, w, h;
        if (f < 2) {
          px = f === 0 ? X1 : X0;
          py = Y0;
          pz = Z0;
          w = Z1 - Z0;
          h = Y1 - Y0;
        } else if (f < 4) {
          px = X0;
          py = f === 2 ? Y1 : Y0;
          pz = Z0;
          w = X1 - X0;
          h = Z1 - Z0;
        } else {
          px = X0;
          py = Y0;
          pz = f === 4 ? Z1 : Z0;
          w = X1 - X0;
          h = Y1 - Y0;
        }
        q.push(P(px | 0, py | 0), ((pz | 0) & 65535 | f << 16 | (T2[f] & 8191) << 19) >>> 0, P(w | 0, h | 0), w3);
      }
    }
    return new Uint32Array(q);
  }
  async function boot() {
    try {
      setP(0.02, "\u70D8\u7119\u7A0B\u5E8F\u5316\u6750\u8D28 (" + TEXTURES.length + " \u5C42)\u2026");
      await nextFrame();
      const res = navigator.deviceMemory && navigator.deviceMemory < 4 ? 64 : 128;
      const atlas = createAtlas(TEXTURES, res);
      const step = 12;
      for (let i = 0; i < TEXTURES.length; i += step) {
        bakeRange(atlas, TEXTURES, i, i + step);
        setP(0.02 + 0.62 * (i / TEXTURES.length), "\u70D8\u7119\u6750\u8D28 " + Math.min(TEXTURES.length, i + step) + "/" + TEXTURES.length);
        await nextFrame();
      }
      setP(0.68, "\u521D\u59CB\u5316\u6E32\u67D3\u7BA1\u7EBF\u2026");
      await nextFrame();
      const game = new Game(canvas, atlas);
      window.GAME = game;
      const items = await Promise.resolve().then(() => (init_items(), items_exports));
      const invmod = await Promise.resolve().then(() => (init_inventory(), inventory_exports));
      const save = await Promise.resolve().then(() => (init_save(), save_exports));
      window.__ITEM = (n) => items.itemByName(n);
      window.__BID = (n) => blockId(n);
      window.__Container = () => invmod.Container;
      window.__listWorlds = () => save.Save.listWorlds();
      window.BLOCKS = BLOCKS;
      setP(0.84, "\u6784\u5EFA\u6A21\u578B\u2026");
      for (const b of BLOCKS) {
        if (b.id === 0 || !b.cube) continue;
        const t = [b.tf[0], b.tf[1], b.tf[2], b.tf[3], b.tf[4], b.tf[5]];
        game.renderer.registerModel("block:" + b.id, boxModel([[-5, 0, -5, 5, 10, 5, t, 0]]));
      }
      const white = ETEX.sheep_wool;
      game.renderer.registerModel("item", boxModel([[-4, 0, -1.5, 4, 8, 1.5, white, 0]]));
      game.renderer.registerModel("proj:arrow", boxModel([[-1, -1, -6, 1, 1, 6, ETEX.bone, 0]]));
      game.renderer.registerModel("proj:fire", boxModel([[-4, -4, -4, 4, 4, 4, ETEX.ember_body, 0]]));
      setP(0.95, "\u5C31\u7EEA");
      await nextFrame();
      booted = true;
      await game.boot();
      requestAnimationFrame((t) => game.frame(t));
      const qs = new URLSearchParams(location.search);
      if (qs.get("auto")) {
        if (qs.get("scale")) {
          const s = parseFloat(qs.get("scale"));
          game.settings.renderScale = s;
          game.renderer.q.renderScale = s;
          game.renderer.W = 0;
          game.onResize();
        }
        if (qs.get("preset")) game.applyPreset(qs.get("preset"));
        const q2 = game.renderer.q;
        if (qs.get("nosh")) q2.shadows = false;
        if (qs.get("noao")) q2.ssao = false;
        if (qs.get("nogi")) q2.ssgi = false;
        if (qs.get("novol")) q2.vol = false;
        if (qs.get("nobloom")) q2.bloom = false;
        if (qs.get("notaa")) {
          q2.taa = false;
          q2.fxaa = false;
        }
        if (qs.get("noclouds")) q2.clouds = false;
        if (qs.get("dbg")) game.renderer.debugView = parseInt(qs.get("dbg"));
        if (qs.get("exp")) game.settings.exposure = parseFloat(qs.get("exp"));
        game.startNew(parseInt(qs.get("seed") || "1234"), parseInt(qs.get("mode") || "0"));
        if (qs.get("far")) game.world.farRadius = parseInt(qs.get("far"));
        if (qs.get("dim")) setTimeout(() => game.switchDimension(parseInt(qs.get("dim"))), 4e3);
        if (qs.get("pitch")) game.player.pitch = parseFloat(qs.get("pitch"));
        if (qs.get("yaw")) game.player.yaw = parseFloat(qs.get("yaw"));
        if (qs.get("zoom")) game.zoom = parseFloat(qs.get("zoom"));
        if (qs.get("time")) {
          const tt = parseFloat(qs.get("time"));
          game.timeOfDay = tt;
          setTimeout(() => {
            game.timeOfDay = tt;
          }, 3e3);
        }
        if (qs.get("weather")) setTimeout(() => {
          game.weather.kind = qs.get("weather");
          game.weather.intensity = 0.9;
          game.weather.next = 9999;
        }, 2500);
        if (qs.get("x") || qs.get("z")) setTimeout(() => {
          if (qs.get("x")) game.player.pos[0] = parseFloat(qs.get("x"));
          if (qs.get("z")) game.player.pos[2] = parseFloat(qs.get("z"));
        }, 1200);
        if (qs.get("y")) {
          game.player.mode = 1;
          game.player.flying = true;
          const hold = () => {
            game.player.pos[1] = parseFloat(qs.get("y"));
            game.player.vel[1] = 0;
          };
          hold();
          setTimeout(hold, 1500);
          setTimeout(hold, 3e3);
          setTimeout(hold, 6e3);
          setTimeout(hold, 1e4);
        }
        window.__auto = true;
      }
    } catch (e) {
      fatal((e && e.message ? e.message : String(e)) + (e && e.stack ? "\n" + e.stack.split("\n").slice(0, 4).join("\n") : ""));
    }
  }
  boot();
})();
