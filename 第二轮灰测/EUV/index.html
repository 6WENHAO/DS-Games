<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EUV 光刻原理 · 三维演示动画 | How EUV Lithography Works</title>
<meta name="description" content="基于锡滴 LPP 光源方案的 EUV 光刻全工艺链三维演示动画（示意 / Simulation）">
<link rel="stylesheet" href="./css/app.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>

<div id="loading">
  <div class="ld-inner">
    <div class="ld-mark"></div>
    <div class="ld-title">EUV 光刻原理</div>
    <div class="ld-sub">How EUV Lithography Works</div>
    <div class="ld-bar"><i></i></div>
    <div class="ld-note">正在装配光学系统与程序化材质…</div>
  </div>
</div>

<div id="app"></div>

<div id="chrome">
  <div id="topbar">
    <div class="grp">
      <span class="badge">示意 / Simulation</span>
      <span class="hint">本片为技术原理演示，不可见光与等离子体经艺术化表现</span>
    </div>
    <div class="grp right">
      <span id="stats" class="mono"></span>
    </div>
  </div>

  <div id="bottombar">
    <div id="chapters"></div>
    <div id="transport">
      <button id="btn-play" class="btn primary">播放</button>
      <input id="scrub" type="range" min="0" max="180" step="0.01" value="0">
      <span id="time-readout" class="mono">00:00:00</span>
      <span id="shot-readout" class="shot"></span>
      <span class="sep"></span>
      <select id="sel-lang" title="字幕语言">
        <option value="bi">双语字幕</option>
        <option value="zh">中文字幕</option>
        <option value="en">English</option>
      </select>
      <select id="sel-quality" title="渲染质量档">
        <option value="preview">预览档</option>
        <option value="review">评审档</option>
        <option value="master">母版档</option>
      </select>
      <button id="btn-inspect" class="btn">自由观察</button>
      <button id="btn-mute" class="btn">静音</button>
      <a class="btn" href="./tools/capture.html" target="_blank" rel="noopener">母版输出</a>
      <a class="btn" href="./tools/qc.html" target="_blank" rel="noopener">画质巡检</a>
      <a class="btn" href="./test/verify.html" target="_blank" rel="noopener">工程校验</a>
    </div>
    <div id="keys" class="mono">空格 播放/暂停 · ←/→ 单帧 · Shift+←/→ 10s · I 自由观察 · M 静音 · H 隐藏界面</div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
