<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EUV 工程校验 · Verification Harness</title>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/build/three.module.js",
    "three/addons/": "../vendor/three/addons/"
  }
}
</script>
<style>
  body { background:#0A0E14; color:#EAF2FA; font:13px/1.6 Consolas,monospace; padding:24px; }
  h1 { font-size:16px; color:#3FA9F5; }
  .pass { color:#5BE08A; } .fail { color:#FF5C5C; font-weight:700; } .warn { color:#FF9F45; }
  table { border-collapse:collapse; margin:12px 0; }
  td,th { border:1px solid #1B2836; padding:3px 10px; text-align:left; }
  #summary { margin:16px 0; padding:10px 14px; border:1px solid #1B2836; }
</style>
</head>
<body>
<h1>EUV 演示动画 · 工程校验台</h1>
<div id="summary">running…</div>
<pre id="out"></pre>
<script type="module">
import { runAllChecks } from './checks.js';
const out = document.getElementById('out');
const summary = document.getElementById('summary');
try {
  const r = await runAllChecks();
  out.innerHTML = r.lines.join('\n');
  summary.innerHTML = `<b class="${r.failed ? 'fail' : 'pass'}">${r.failed ? 'FAIL' : 'PASS'}</b> ` +
    `— 通过 ${r.passed} / 共 ${r.total}，失败 ${r.failed}`;
  window.__RESULT__ = { passed: r.passed, failed: r.failed, total: r.total, text: r.lines.join('\n').replace(/<[^>]+>/g,'') };
} catch (e) {
  summary.innerHTML = `<b class="fail">ERROR</b> ${e && e.message}`;
  out.textContent = (e && e.stack) || String(e);
  window.__RESULT__ = { error: String(e && e.stack || e) };
}
</script>
</body>
</html>
