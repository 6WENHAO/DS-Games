<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>彭罗斯阶梯 · Penrose Stairs</title>
<style>
  :root{
    --ink:#eaf1fb; --dim:#9db0c9; --line:rgba(255,255,255,.10);
    --glass:rgba(10,15,25,.86); --glass2:rgba(10,15,25,.92);
    --accent:#5fd0ff; --accent2:#ffb459; --ok:#54e0a5; --warn:#ffc266;
    --shadow:0 18px 48px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(120% 90% at 68% 8%, #1b2b45 0%, #101a2c 42%, #080d16 78%, #05080e 100%);
    color:var(--ink);
    font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  body.paper{background:radial-gradient(120% 90% at 60% 10%,#fdfbf5 0%,#f2ece0 55%,#e6ddcc 100%);color:#22303f}
  body.paper .panel,body.paper .card{background:rgba(255,255,255,.74);border-color:rgba(30,40,55,.12);color:#22303f}
  body.paper .panel .sub,body.paper .card .sub,body.paper .kv b{color:#4c5f76}
  body.paper button{background:rgba(255,255,255,.6);border-color:rgba(30,40,55,.18);color:#22303f}
  body.paper button[aria-pressed="true"]{background:#22303f;color:#fff;border-color:#22303f}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(105% 78% at 50% 46%,transparent 55%,rgba(0,0,0,.42) 100%)}
  body.paper .vignette{background:radial-gradient(105% 78% at 50% 46%,transparent 60%,rgba(90,80,60,.16) 100%)}
  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
      padding:clamp(12px,2vw,22px);gap:12px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .card,.panel{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px)}
  .card{padding:12px 16px}
  h1{margin:0;font-size:clamp(15px,1.35vw,19px);letter-spacing:.14em;font-weight:650}
  h1 span{color:var(--accent2)}
  .sub{margin:3px 0 0;font-size:12px;color:var(--dim);letter-spacing:.04em}
  .chip{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px rgba(255,194,102,.16);
       transition:background .25s,box-shadow .25s}
  .chip.locked .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(84,224,165,.18)}
  .chip b{font-weight:600}
  .panel{padding:12px;background:var(--glass2)}
  .btns{display:flex;flex-wrap:wrap;gap:8px;max-width:min(72vw,720px)}
  button{font:inherit;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;
    transition:transform .12s,background .18s,border-color .18s,box-shadow .18s;white-space:nowrap}
  button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.primary{background:linear-gradient(180deg,rgba(95,208,255,.28),rgba(95,208,255,.14));
    border-color:rgba(95,208,255,.5);box-shadow:0 0 0 1px rgba(95,208,255,.12) inset}
  button.primary:hover{background:linear-gradient(180deg,rgba(95,208,255,.4),rgba(95,208,255,.2))}
  button[aria-pressed="true"]{background:rgba(95,208,255,.22);border-color:rgba(95,208,255,.55);color:#fff}
  kbd{font:11px/1 ui-monospace,Consolas,monospace;padding:2px 5px;border-radius:5px;border:1px solid var(--line);
    background:rgba(255,255,255,.07);color:var(--dim)}
  .info{max-width:min(40ch,44vw);font-size:12px;color:var(--dim)}
  .info p{margin:0 0 6px}
  .hint{margin:9px 2px 1px;font-size:11.5px;color:var(--dim);letter-spacing:.02em}
  .kv{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:11.5px;color:var(--dim);
      font-variant-numeric:tabular-nums;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .kv b{color:var(--ink);font-weight:600;text-align:right}
  details summary{cursor:pointer;color:var(--accent);font-size:12px;outline:none;margin-top:6px}
  details[open] summary{margin-bottom:6px}
  .lbl{position:fixed;transform:translate(-50%,-140%);pointer-events:none;font-size:11px;letter-spacing:.06em;
    padding:4px 9px;border-radius:8px;background:rgba(8,12,20,.82);border:1px solid var(--line);
    white-space:nowrap;opacity:0;transition:opacity .25s;box-shadow:var(--shadow)}
  .lbl.on{opacity:1}
  .lbl.low{color:#9fe8ff;border-color:rgba(95,208,255,.4);transform:translate(-50%,34%)}
  .lbl.high{color:#ffcf8e;border-color:rgba(255,180,89,.4);transform:translate(-50%,-160%)}
  .lbl.gap{color:#c9f4ff;border-color:rgba(95,208,255,.32);transform:translate(-50%,-50%) translateX(64px)}
  #diag{position:fixed;left:-9999px;top:-9999px;white-space:pre}
  body.no-ui .ui,body.no-ui .lbl{display:none}
  @media (max-width:980px){
    .info{max-width:min(46ch,88vw)}
    .btns{max-width:92vw}
    button{padding:7px 11px;font-size:12px}
  }
  @media (max-height:680px){
    .info p:nth-of-type(n+2){display:none}
    .card{padding:9px 12px}
  }
</style>

<body>
<div id="stage"></div>
<div class="vignette"></div>

<div class="ui">
  <div class="row">
    <div class="card">
      <h1>彭罗斯阶梯 <span>Penrose Stairs</span></h1>
      <p class="sub">真实三维几何 · 正交投影下的不可能闭环</p>
    </div>
    <div class="card chip locked" id="chip">
      <i class="dot"></i>
      <span id="chipText">错觉视角已锁定</span>
      <b id="chipDev">0.0°</b>
    </div>
  </div>

  <div class="row" style="align-items:flex-end">
    <div class="panel">
      <div class="btns">
        <button class="primary" id="btnHome" title="返回最佳错觉视角（R）">⌾ 返回最佳视角</button>
        <button id="btnReveal" aria-pressed="false" title="揭示真实结构（S）">◇ 结构揭示</button>
        <button id="btnTour" title="自动演示（空格）">▷ 自动揭秘</button>
        <button id="btnWalk" aria-pressed="true" title="行走演示（W）">▲ 行走演示</button>
        <button id="btnPath" aria-pressed="false" title="显示闭环路径（P）">◠ 闭环路径</button>
        <button id="btnLine" aria-pressed="false" title="线描模式（L）">✎ 线描</button>
      </div>
      <p class="hint">拖拽 = 有限旋转 · 滚轮 = 缩放 · <kbd>R</kbd> 或双击 = 精确回位</p>
    </div>
    <div class="card info">
      <details>
        <summary>它为什么能闭合？（展开看真实数据）</summary>
        <p id="explain"></p>
        <div class="kv" id="kv"></div>
      </details>
    </div>
  </div>
</div>

<div class="lbl low" id="lblLow">起点 · 最低一级</div>
<div class="lbl high" id="lblHigh">终点 · 最高一级</div>
<div class="lbl gap" id="lblGap">沿视线错位</div>
<pre id="diag"></pre>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. 参数（可用 URL 查询串覆盖，便于调参与自动化验证）
   ============================================================ */
const Q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const int = (k, d) => { const v = parseInt(Q.get(k), 10); return Number.isFinite(v) ? v : d; };

const CFG = {
  elevDeg : num('theta', 60),   // 最佳视角俯仰角（决定几何比例，几何与视角互相绑定）
  aziDeg  : 45,                 // 最佳视角方位角（对角线方向，保证 x/z 漂移对称）
  legLong : int('long', 7),     // 长边台阶数（两条“朝向相机”的边）
  legShort: int('short', 3),    // 短边台阶数（两条“背离相机”的边）
  run     : num('run', 1),      // 踏面进深
  width   : num('width', 1),    // 梯带宽度（自由参数，不影响闭合；= run 时转角恰好一级，节奏最干净）
  thickK  : num('thick', 3.2),  // 板厚 = thickK × 每级抬升（越厚越像一整条实心梯带）
  phase   : int('phase', 0),    // 接缝相位偏移（0 = 默认的无瑕接缝位置，见下）
};
const ELEV = THREE.MathUtils.degToRad(CFG.elevDeg);
const AZI  = THREE.MathUtils.degToRad(CFG.aziDeg);

/* 视线方向 u（由场景指向相机）与屏幕基底 —— 正交投影下沿 u 的位移完全不可见 */
const SIN = Math.sin(ELEV), COS = Math.cos(ELEV);
const U    = new THREE.Vector3(COS * Math.cos(AZI), SIN, COS * Math.sin(AZI)).normalize();
const RGT  = new THREE.Vector3(-Math.sin(AZI), 0, Math.cos(AZI)).normalize();
const UPV  = new THREE.Vector3(-SIN * Math.cos(AZI), COS, -SIN * Math.sin(AZI)).normalize();
const proj = (p) => new THREE.Vector2(p.dot(RGT), p.dot(UPV));

/* ============================================================
   1. 几何：一条真实、连续上升的阶梯；其首尾在视线方向上恰好重合
   ------------------------------------------------------------
   闭合条件：环绕一圈的三维总位移 Δ 必须平行于 u。
   平面漂移 (m·run, m·run) + 竖直上升 N·rise  =  t·u
   ⇒ rise = √2 · m · run · tan(elev) / N        （m = 长边 − 短边）
   ============================================================ */
function buildStairs(cfg) {
  const legs = [cfg.legLong, cfg.legLong, cfg.legShort, cfg.legShort];
  const N = legs.reduce((a, b) => a + b, 0);
  const m = cfg.legLong - cfg.legShort;
  const rise = Math.SQRT2 * m * cfg.run * Math.tan(ELEV) / N;
  const dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // 边序：+X、+Z（朝向相机） / -X、-Z（背离相机）
  const raw = [];
  let y = 0, Cx = 0, Cz = 0;                          // C = 当前转角点（两条中线的交点）

  /* 转角处理：C_L = C_{L-1} + n_L·run·d_L，第 L 条边的台阶从 C_{L-1} + (W/2)·d_L 起铺。
     于是转角处那块 W×W 方形区域由进入边最后几级铺满，出边紧贴方块外沿开始 ——
     梯带严丝合缝，而且全场踏面尺寸完全一致（没有加大的转角平台）。 */
  for (let period = 0; period < 3; period++) {
    for (let L = 0; L < 4; L++) {
      const [dx, dz] = dirs[L];
      let cx = Cx + dx * cfg.width / 2, cz = Cz + dz * cfg.width / 2;
      for (let j = 0; j < legs[L]; j++) {
        const top = y + rise;
        raw.push({
          leg: L, dx, dz, isLegEnd: j === legs[L] - 1,
          x: cx + dx * cfg.run / 2, z: cz + dz * cfg.run / 2, top,
          sx: dx ? cfg.run : cfg.width, sz: dz ? cfg.run : cfg.width,
        });
        cx += dx * cfg.run; cz += dz * cfg.run; y = top;
      }
      Cx += dx * legs[L] * cfg.run; Cz += dz * legs[L] * cfg.run;
    }
  }

  /* 相位选择（决定错觉是否完美）：只截取连续的一个周期，接缝必须落在“背离相机”
     的直边中段。在那里，相邻两级之间不存在互相争夺的可见面 —— 于是把“下一周期
     的一级”换成“本周期同相位的一级”后，遮挡关系与真正的周期阶梯逐像素一致。
     若接缝落在转角（下一级更靠近相机），台阶侧面就会暴露出破口。 */
  const cut = 2 * cfg.legLong + 1 + ((cfg.phase % N) + N) % N;
  const steps = raw.slice(cut, cut + N + 1)
    .map((s, i) => Object.assign({}, s, { index: i, raw: cut + i, virtual: i >= N }));
  return { steps, N, m, rise, thickness: rise * cfg.thickK, totalRise: N * rise, depthGap: N * rise / SIN };
}
const S = buildStairs(CFG);
const REAL = S.steps.filter(s => !s.virtual);

/* 自检：所有台阶都是轴对齐长方体，任意两级之间只允许共面接触，不允许体积相交。
   （返回最大相交体积，正常应为 0 —— 证明这是一个可以真造出来的实体结构） */
function maxOverlapVolume(steps, thickness) {
  const bx = steps.map(s => [s.x - s.sx / 2, s.x + s.sx / 2, s.top - thickness, s.top, s.z - s.sz / 2, s.z + s.sz / 2]);
  let worst = 0;
  for (let i = 0; i < bx.length; i++) for (let j = i + 1; j < bx.length; j++) {
    const a = bx[i], b = bx[j];
    const ox = Math.min(a[1], b[1]) - Math.max(a[0], b[0]);
    const oy = Math.min(a[3], b[3]) - Math.max(a[2], b[2]);
    const oz = Math.min(a[5], b[5]) - Math.max(a[4], b[4]);
    if (ox > 1e-9 && oy > 1e-9 && oz > 1e-9) worst = Math.max(worst, ox * oy * oz);
  }
  return worst;
}

/* 接缝校验：第 N 级（虚拟续级）的投影必须与第 0 级完全重合 —— 错觉的数学证明 */
function seamResidual() {
  const a = S.steps[0], b = S.steps[S.N];
  let worst = 0;
  for (const sx of [-.5, .5]) for (const sy of [0, -1]) for (const sz of [-.5, .5]) {
    const pa = proj(new THREE.Vector3(a.x + sx * a.sx, a.top + sy * S.thickness, a.z + sz * a.sz));
    const pb = proj(new THREE.Vector3(b.x + sx * b.sx, b.top + sy * S.thickness, b.z + sz * b.sz));
    worst = Math.max(worst, pa.distanceTo(pb));
  }
  return worst;
}
const SEAM = seamResidual();

/* ============================================================
   2. 渲染器 / 场景 / 灯光（全部与位置无关，保证投影严格周期）
   ============================================================ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const world = new THREE.Group();
scene.add(world);

const keyLight = new THREE.DirectionalLight(0xfff1dc, 2.15);
keyLight.position.set(0.62, 1.0, 0.34).normalize();
const rimLight = new THREE.DirectionalLight(0x7fb0ff, 0.75);
rimLight.position.set(-0.75, 0.42, -0.55).normalize();
const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x2a1c14, 0.62);
scene.add(keyLight, rimLight, hemi);

/* ============================================================
   3. 台阶网格：顶点色烘焙 AO（与位置无关 ⇒ 接缝零色差）
   ============================================================ */
/* 顶点色烘焙：环境光遮蔽 + 每级踏面靠上一级立板一侧的接触阴影。
   全部只依赖“盒子自身的局部坐标”，因此同一相位的任意周期副本完全同色 ——
   这是接缝零色差的前提（也是不能用阴影贴图 / 雾 / SSAO 的原因：它们依赖世界位置或深度）。 */
function bakedBox(sx, sy, sz, dirX, dirZ) {
  const g = new THREE.BoxGeometry(sx, sy, sz);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const ny = nor.getY(i), py = pos.getY(i);
    let ao;
    if (ny > 0.5) {                                           // 踏面：朝行进方向渐暗（上一级投下的影）
      const t = dirX ? (pos.getX(i) * dirX) / sx : (pos.getZ(i) * dirZ) / sz;
      ao = 1.0 - 0.3 * Math.max(0, t + 0.5);
    } else if (ny < -0.5) ao = 0.42;                           // 底面
    else ao = 0.86;                                            // 侧墙：必须整面均匀！
    /* 侧墙若做自上而下的渐变，相邻两级本来共面的侧墙就会在交界处出现亮度断层，
       整条梯带会被“看”成一块块独立积木 —— 这里保持均匀，方向光负责区分朝向。 */
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = ao;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
/* 只画“真实折痕”，不要画整盒轮廓：相邻两级的侧墙本来是共面的，
   若把每个盒子的竖边都画满，梯带就会散成一块块积木。这里只保留
   踏面轮廓、侧墙下沿、立板两侧那段高 = 一级抬升的竖线，
   转角一级的迎面则完整描边（它确实整面裸露）。 */
function creaseSegments(sx, sy, sz, dx, dz, h, isLegEnd) {
  const hx = sx / 2, hy = sy / 2, hz = sz / 2, v = [];
  const seg = (a, b) => v.push(a[0], a[1], a[2], b[0], b[1], b[2]);
  seg([-hx, hy, -hz], [hx, hy, -hz]);          // 踏面四边
  seg([hx, hy, -hz], [hx, hy, hz]);
  seg([hx, hy, hz], [-hx, hy, hz]);
  seg([-hx, hy, hz], [-hx, hy, -hz]);
  const alongX = dx !== 0;
  const span = alongX ? hx : hz;                                   // 行进方向半长
  const lat = alongX ? hz : hx;                                    // 横向半宽
  const back = -(alongX ? dx : dz) * span, front = -back;
  const P = (t, y, l) => (alongX ? [t, y, l] : [l, y, t]);
  for (const l of [-lat, lat]) seg(P(-span, -hy, l), P(span, -hy, l));                 // 侧墙下沿
  for (const l of [-lat, lat]) seg(P(back, hy - h, l), P(back, hy, l));                // 立板两侧竖线
  for (const l of [-lat, lat]) seg(P(front, -hy, l), P(front, isLegEnd ? hy : -hy + h, l));
  if (isLegEnd) seg(P(front, -hy, -lat), P(front, -hy, lat));                          // 转角迎面下边
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  return g;
}

const LEG_HUE = [30, 26, 34, 22];
const stepGroup = new THREE.Group();
world.add(stepGroup);
const stepUnits = [];

for (const st of REAL) {
  const g = bakedBox(st.sx, S.thickness, st.sz, st.dx, st.dz);
  /* 同一条边共用一个色调：同边相邻两级的侧墙共面，只要有一点明暗差就会显出竖向接缝，
     梯带就散成积木；换边处两面互相垂直，色调变化反而帮助分层。 */
  const base = new THREE.Color().setHSL(LEG_HUE[st.leg] / 360, 0.5, 0.55);
  const mat = new THREE.MeshStandardMaterial({
    color: base, vertexColors: true, roughness: 0.62, metalness: 0.04,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.position.set(st.x, st.top - S.thickness / 2, st.z);

  const edges = new THREE.LineSegments(
    creaseSegments(st.sx, S.thickness, st.sz, st.dx, st.dz, S.rise, st.isLegEnd),
    new THREE.LineBasicMaterial({ color: 0x1b1008, transparent: true, opacity: 0.44 })
  );
  edges.position.copy(mesh.position);

  stepGroup.add(mesh, edges);
  stepUnits.push({ st, mesh, edges, base, dim: base.clone().lerp(new THREE.Color(0x0c1626), 0.55) });
}

/* ============================================================
   4. 行走路径（首尾节点沿 u 相隔一个周期 ⇒ 投影是闭环）
   ============================================================ */
/* 节点 = 每级踏面中心；第 N 个节点（虚拟续级）与第 0 个在视线上相距一个周期，
   因此这条真实开口的折线在最佳视角下投影为一个完美闭环。 */
const nodes = S.steps.map(s => new THREE.Vector3(s.x, s.top, s.z));
const pathPts = nodes.map(p => p.clone().setY(p.y + S.rise * 0.34));
const pathCurve = new THREE.CatmullRomCurve3(pathPts, false, 'catmullrom', 0.06);
const pathGeo = new THREE.TubeGeometry(pathCurve, pathPts.length * 4, S.rise * 0.075, 8, false);
const pathMesh = new THREE.Mesh(pathGeo, new THREE.MeshStandardMaterial({
  color: 0x2ff0c8, emissive: 0x19c8a6, emissiveIntensity: 0.9, roughness: 0.35,
}));
/* 被台阶挡住的那一段用半透明重影补上，闭环才看得出是连续一条 */
const pathGhost = new THREE.Mesh(pathGeo, new THREE.MeshBasicMaterial({
  color: 0x2ff0c8, transparent: true, opacity: 0.22, depthTest: false, depthWrite: false,
}));
pathGhost.renderOrder = 3;
const pathGroup = new THREE.Group();
pathGroup.add(pathMesh, pathGhost);
pathGroup.visible = false;
world.add(pathGroup);

/* 行走者：沿真实几何前进；越过第 N 级时沿 u 平移一个周期（投影上完全连续） */
const walker = new THREE.Group();
const skin = new THREE.MeshStandardMaterial({ color: 0xf2f8ff, emissive: 0x2fbfff, emissiveIntensity: 0.42, roughness: 0.4 });
const body = new THREE.Mesh(new THREE.CapsuleGeometry(S.rise * 0.2, S.rise * 0.46, 4, 12), skin);
body.position.y = S.rise * 0.55;
const head = new THREE.Mesh(new THREE.SphereGeometry(S.rise * 0.2, 18, 14), skin);
head.position.y = S.rise * 1.06;
walker.add(body, head);
walker.scale.setScalar(1.55);          // 放大到一眼能看出是个"人"在不停往上走
world.add(walker);

function walkerAt(s) {
  const i = Math.min(Math.floor(s), S.N - 1), f = s - i;
  const a = nodes[i], b = nodes[i + 1];
  const p = new THREE.Vector3().lerpVectors(a, b, f);
  p.y = THREE.MathUtils.lerp(a.y, b.y, f * f * (3 - 2 * f)) + Math.sin(Math.PI * f) * S.rise * 0.14;
  return p;
}

/* ============================================================
   5. 结构揭示：起终点标记 + 那道“看不见的深度跳跃”
   ============================================================ */
const revealGroup = new THREE.Group();
revealGroup.visible = false;
world.add(revealGroup);
const startPt = nodes[0].clone();
const endPt = nodes[S.N].clone();

/* 这根发光杆就是“被视线方向吃掉”的那段错位：它严格平行于 u，
   所以在最佳视角下整根杆压缩成一个点（完全看不见）；一旦转开就立刻现身。 */
const jumpVec = new THREE.Vector3().subVectors(startPt, endPt);
const jumpMid = new THREE.Vector3().copy(endPt).addScaledVector(jumpVec, 0.5);
const jumpGeo = new THREE.CylinderGeometry(S.rise * 0.055, S.rise * 0.055, jumpVec.length(), 10, 1);
const jumpQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), jumpVec.clone().normalize());
const jumpSolid = new THREE.Mesh(jumpGeo, new THREE.MeshStandardMaterial({
  color: 0x9beeff, emissive: 0x36c8ff, emissiveIntensity: 1.1, roughness: 0.3,
}));
const jumpGhost = new THREE.Mesh(jumpGeo, new THREE.MeshBasicMaterial({
  color: 0x8be9ff, transparent: true, opacity: 0.3, depthTest: false, depthWrite: false,
}));
jumpGhost.renderOrder = 4;
for (const j of [jumpSolid, jumpGhost]) { j.position.copy(jumpMid); j.quaternion.copy(jumpQuat); revealGroup.add(j); }
for (const [p, c] of [[startPt, 0x5fd0ff], [endPt, 0xffb459]]) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(CFG.run * 0.46, CFG.run * 0.05, 8, 28),
    new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.85, roughness: 0.3 })
  );
  ring.position.copy(p); ring.rotation.x = Math.PI / 2;
  revealGroup.add(ring);
}

/* ============================================================
   6. 相机：正交投影 —— 错觉严格成立且矩阵完全可重复
   ============================================================ */
const box = new THREE.Box3();
const tmp = new THREE.Vector3();
let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity, sumD = 0, cnt = 0;
for (const { st } of stepUnits) {
  for (const sx of [-.5, .5]) for (const sy of [0, -1]) for (const sz of [-.5, .5]) {
    tmp.set(st.x + sx * st.sx, st.top + sy * S.thickness, st.z + sz * st.sz);
    box.expandByPoint(tmp);
    const p = proj(tmp);
    minA = Math.min(minA, p.x); maxA = Math.max(maxA, p.x);
    minB = Math.min(minB, p.y); maxB = Math.max(maxB, p.y);
    sumD += tmp.dot(U); cnt++;
  }
}
const PAD = 1.3;                                    // 留出 HUD 安全边距，图形不会被面板压住
const FIT = { w: (maxA - minA) / 2 * PAD, h: (maxB - minB) / 2 * PAD };
/* 目标点：投影包围盒中心，再沿屏幕竖直方向抬一点，让画面整体上移，
   为底部控制条留出净空（沿 u 的分量对正交投影没有影响，只为把几何放在视锥中央）。 */
const TARGET = new THREE.Vector3()
  .addScaledVector(RGT, (minA + maxA) / 2)
  .addScaledVector(UPV, (minB + maxB) / 2 - (maxB - minB) * 0.05)
  .addScaledVector(U, sumD / cnt);
const CAM_DIST = Math.max(120, box.getSize(new THREE.Vector3()).length() * 6);

const camera = new THREE.OrthographicCamera(-FIT.w, FIT.w, FIT.h, -FIT.h, 0.1, CAM_DIST * 4);
const MAGIC = {
  pos: TARGET.clone().addScaledVector(U, CAM_DIST),
  target: TARGET.clone(),
  zoom: 1,
};
camera.position.copy(MAGIC.pos);
camera.zoom = MAGIC.zoom;
camera.lookAt(MAGIC.target);
camera.updateProjectionMatrix();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(MAGIC.target);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.85;
controls.minZoom = 0.55;
controls.maxZoom = 2.4;
const MAGIC_AZI = Math.atan2(U.x, U.z);
const MAGIC_POL = Math.acos(THREE.MathUtils.clamp(U.y, -1, 1));
controls.minAzimuthAngle = MAGIC_AZI - THREE.MathUtils.degToRad(38);
controls.maxAzimuthAngle = MAGIC_AZI + THREE.MathUtils.degToRad(38);
controls.minPolarAngle = Math.max(THREE.MathUtils.degToRad(9), MAGIC_POL - THREE.MathUtils.degToRad(20));
controls.maxPolarAngle = Math.min(THREE.MathUtils.degToRad(86), MAGIC_POL + THREE.MathUtils.degToRad(34));
controls.update();

let locked = true;                     // 锁定时每帧强制写回精确矩阵 ⇒ 完全可重复
controls.addEventListener('start', () => { locked = false; tween = null; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / Math.max(h, 1);
  let hw = FIT.w, hh = FIT.h;
  if (hw / hh < aspect) hw = hh * aspect; else hh = hw / aspect;
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ---- 相机补间：回到最佳视角 / 自动揭秘 ---- */
let tween = null;
const sphOf = () => new THREE.Spherical().setFromVector3(tmp.copy(camera.position).sub(controls.target));
function tweenTo(sph, zoom, ms, onDone) {
  const from = sphOf(), fz = camera.zoom;
  tween = { t0: performance.now(), ms, from, to: sph, fz, tz: zoom, onDone };
}
function applyMagic() {
  camera.position.copy(MAGIC.pos);
  controls.target.copy(MAGIC.target);
  camera.zoom = MAGIC.zoom;
  camera.updateProjectionMatrix();
  controls.update();
  camera.position.copy(MAGIC.pos);
  camera.up.set(0, 1, 0);
  camera.lookAt(MAGIC.target);
  camera.updateProjectionMatrix();
}
function goHome(ms = 820, then) {
  const target = new THREE.Spherical(CAM_DIST, MAGIC_POL, MAGIC_AZI);
  if (ms <= 0) { locked = true; applyMagic(); if (then) then(); return; }
  tweenTo(target, MAGIC.zoom, ms, () => { locked = true; applyMagic(); if (then) then(); });
}
let tourRevealed = false;
function tour() {
  locked = false;
  if (!state.reveal) { $('btnReveal').onclick(); tourRevealed = true; }
  const away = new THREE.Spherical(CAM_DIST, MAGIC_POL + THREE.MathUtils.degToRad(24), MAGIC_AZI + THREE.MathUtils.degToRad(31));
  tweenTo(away, 0.86, 2000, () => {
    setTimeout(() => goHome(2000, () => {
      if (tourRevealed) { $('btnReveal').onclick(); tourRevealed = false; }
    }), 1400);
  });
}

/* ============================================================
   7. 交互界面
   ============================================================ */
const $ = (id) => document.getElementById(id);
const state = { walk: true, path: false, reveal: false, line: false };
function press(btn, on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }

/* 统一样式：线描 = 纯平白面 + 墨线（关掉色调映射才够白）；结构揭示 = 压暗梯身突出路线 */
function applyStyle() {
  const line = state.line, reveal = state.reveal;
  document.body.classList.toggle('paper', line);
  renderer.toneMapping = line ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  for (const u of stepUnits) {
    const m = u.mesh.material;
    m.vertexColors = !line;
    m.color.set(line ? 0x000000 : (reveal ? u.dim : u.base));
    m.emissive.set(line ? 0xffffff : 0x000000);
    m.emissiveIntensity = line ? 1 : 0;
    m.roughness = line ? 1 : 0.62;
    m.needsUpdate = true;
    u.edges.material.color.set(line ? 0x0d141c : 0x1b1008);
    u.edges.material.opacity = line ? 1 : (reveal ? 0.3 : 0.44);
  }
  skin.color.set(line ? 0x1d2733 : 0xf2f8ff);
  skin.emissive.set(line ? 0x1d2733 : 0x2fbfff);
  skin.emissiveIntensity = line ? 1 : 0.42;
}
function setLine(on) { state.line = on; applyStyle(); press($('btnLine'), on); }
$('btnHome').onclick = () => goHome();
$('btnTour').onclick = () => tour();
$('btnWalk').onclick = () => { state.walk = !state.walk; walker.visible = state.walk; press($('btnWalk'), state.walk); };
$('btnPath').onclick = () => { state.path = !state.path; pathGroup.visible = state.path; press($('btnPath'), state.path); };
let pathAuto = false;
$('btnReveal').onclick = () => {
  state.reveal = !state.reveal;
  revealGroup.visible = state.reveal;
  $('lblLow').classList.toggle('on', state.reveal);
  $('lblHigh').classList.toggle('on', state.reveal);
  if (state.reveal && !state.path) { $('btnPath').onclick(); pathAuto = true; }
  else if (!state.reveal && pathAuto) { $('btnPath').onclick(); pathAuto = false; }
  applyStyle();
  press($('btnReveal'), state.reveal);
};
$('btnLine').onclick = () => setLine(!state.line);
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'r') goHome();
  else if (k === 'w') $('btnWalk').onclick();
  else if (k === 's') $('btnReveal').onclick();
  else if (k === 'p') $('btnPath').onclick();
  else if (k === 'l') $('btnLine').onclick();
  else if (e.code === 'Space') { e.preventDefault(); tour(); }
});
renderer.domElement.addEventListener('dblclick', () => goHome());

const f2 = (v) => v.toFixed(2);
$('kv').innerHTML = [
  ['台阶总数', S.N + ' 级'],
  ['每级抬升 / 进深', f2(S.rise) + ' / ' + f2(CFG.run)],
  ['真实总升高', f2(S.totalRise) + '（并非 0）'],
  ['首尾视线错位', f2(S.depthGap)],
  ['接缝投影残差', SEAM.toExponential(1) + ' px'],
].map(([k, v]) => '<span>' + k + '</span><b>' + v + '</b>').join('');
$('explain').textContent =
  '这是一段真实、连续上升的阶梯：' + S.N + ' 级，每级抬升 ' + f2(S.rise) +
  '，绕行一圈后实际升高 ' + f2(S.totalRise) + '。诀窍在于平面路线并不闭合——长边比短边各多 ' +
  S.m + ' 级，使得终点相对起点的三维位移恰好平行于视线方向 u。正交投影会把沿 u 的 ' +
  f2(S.depthGap) + ' 单位错位压缩为零，于是最高一级正好投在最低一级上并遮住它，' +
  '阶梯看起来永远上升。旋转视角，这段错位就会现身。' +
  '（用正交/轴测投影而非透视投影，是因为“沿视线平移不可见”只在平行投影下严格成立；' +
  '空间层次改由遮挡、方向性光照、烘焙环境光遮蔽与色彩分层来建立。）';

const chip = $('chip'), chipText = $('chipText'), chipDev = $('chipDev');
const lblLow = $('lblLow'), lblHigh = $('lblHigh'), lblGap = $('lblGap');
lblGap.textContent = '视线错位 ' + f2(S.depthGap) + ' · 投影后为 0';
function placeLabel(el, p) {
  const v = p.clone().project(camera);
  el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
  el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
}

/* ============================================================
   8. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let s = 0;
const camDir = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (tween) {
    const k = Math.min(1, (performance.now() - tween.t0) / tween.ms);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const sph = new THREE.Spherical(
      THREE.MathUtils.lerp(tween.from.radius, tween.to.radius, e),
      THREE.MathUtils.lerp(tween.from.phi, tween.to.phi, e),
      THREE.MathUtils.lerp(tween.from.theta, tween.to.theta, e)
    );
    camera.position.setFromSpherical(sph).add(controls.target);
    camera.zoom = THREE.MathUtils.lerp(tween.fz, tween.tz, e);
    camera.updateProjectionMatrix();
    camera.lookAt(controls.target);
    if (k >= 1) { const cb = tween.onDone; tween = null; if (cb) cb(); }
  } else {
    controls.update();
    if (locked) applyMagic();
  }

  if (state.walk) {
    s = (s + dt * 1.5) % S.N;
    const p = walkerAt(s);
    walker.position.copy(p);
    const nx = walkerAt(Math.min(s + 0.12, S.N - 0.001));   // 不取模：跨接缝时朝向仍连续
    const dir = nx.clone().sub(p);
    if (dir.lengthSq() > 1e-9) walker.rotation.y = Math.atan2(dir.x, dir.z);
  }

  camera.getWorldDirection(camDir);
  const dev = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(-camDir.dot(U), -1, 1)));
  const zoomOff = Math.abs(camera.zoom - MAGIC.zoom) > 1e-6;
  const good = dev < 0.35 && !zoomOff;
  chip.classList.toggle('locked', good);
  chipText.textContent = good ? '错觉视角已锁定' : '已偏离最佳视角';
  chipDev.textContent = dev.toFixed(1) + '°' + (zoomOff ? ' · ' + camera.zoom.toFixed(2) + '×' : '');

  if (state.reveal) {
    placeLabel(lblLow, startPt); placeLabel(lblHigh, endPt); placeLabel(lblGap, jumpMid);
    lblGap.classList.toggle('on', dev > 2.5);      // 错位真的看得见时才提示它有多长
  } else lblGap.classList.remove('on');

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ============================================================
   9. 启动 · 自检接口
   ------------------------------------------------------------
   URL 参数：ui=0 隐藏界面 / walk=0 关闭行走 / reveal=1 / path=1 / line=1
             az,pol,zoom 预置视角（用于核验与分享特定角度）
   window.penrose 暴露诊断数据与可重复性自检，方便验证错觉的数学前提。
   ============================================================ */
if (Q.get('ui') === '0') document.body.classList.add('no-ui');
if (Q.get('walk') === '0') { state.walk = false; walker.visible = false; press($('btnWalk'), false); }
if (Q.get('reveal') === '1') $('btnReveal').onclick();
if (Q.get('path') === '1') $('btnPath').onclick();
if (Q.get('line') === '1') setLine(true);

applyMagic();
const viewProjNow = () => {
  camera.updateMatrixWorld(true);
  return camera.projectionMatrix.clone().multiply(camera.matrixWorldInverse).elements.slice();
};
const MAGIC_VP = viewProjNow();

function setView(azDeg, polDeg, zoom) {
  locked = false; tween = null;
  const sph = new THREE.Spherical(
    CAM_DIST,
    THREE.MathUtils.clamp(MAGIC_POL + THREE.MathUtils.degToRad(polDeg || 0), controls.minPolarAngle, controls.maxPolarAngle),
    THREE.MathUtils.clamp(MAGIC_AZI + THREE.MathUtils.degToRad(azDeg || 0), controls.minAzimuthAngle, controls.maxAzimuthAngle)
  );
  camera.position.setFromSpherical(sph).add(controls.target);
  camera.zoom = zoom || MAGIC.zoom;
  camera.updateProjectionMatrix();
  camera.lookAt(controls.target);
  controls.update();
}

const diag = {
  three: THREE.REVISION, webgl: !!renderer.getContext(),
  steps: S.N, legs: [CFG.legLong, CFG.legLong, CFG.legShort, CFG.legShort], legDiff: S.m,
  run: CFG.run, width: CFG.width, rise: +S.rise.toFixed(6), thickness: +S.thickness.toFixed(4),
  totalRise: +S.totalRise.toFixed(4), depthGap: +S.depthGap.toFixed(4),
  seamResidual: SEAM, overlapVolume: maxOverlapVolume(REAL, S.thickness),
  fit: [+FIT.w.toFixed(3), +FIT.h.toFixed(3)], phase: CFG.phase,
};

window.penrose = {
  diag,
  setView,
  home: () => goHome(0),
  toggle: (name) => { const b = $('btn' + name); if (b) b.onclick(); },
  /* 阶梯在屏幕上的像素包围盒（用于确认构图留白 / HUD 不遮挡） */
  screenBBox() {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const v = new THREE.Vector3();
    for (const { st } of stepUnits) {
      for (const sx of [-.5, .5]) for (const sy of [0, -1]) for (const sz of [-.5, .5]) {
        v.set(st.x + sx * st.sx, st.top + sy * S.thickness, st.z + sz * st.sz).project(camera);
        const px = (v.x * 0.5 + 0.5) * innerWidth, py = (-v.y * 0.5 + 0.5) * innerHeight;
        x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
      }
    }
    return { x0: Math.round(x0), y0: Math.round(y0), x1: Math.round(x1), y1: Math.round(y1), vw: innerWidth, vh: innerHeight };
  },
  /* 当前相机状态：方位角/俯角相对最佳视角的偏移、缩放、与最佳视线的夹角 */
  state() {
    const sph = new THREE.Spherical().setFromVector3(new THREE.Vector3().copy(camera.position).sub(controls.target));
    const dir = camera.getWorldDirection(new THREE.Vector3());
    return {
      azDeg: +THREE.MathUtils.radToDeg(sph.theta - MAGIC_AZI).toFixed(3),
      polDeg: +THREE.MathUtils.radToDeg(sph.phi - MAGIC_POL).toFixed(3),
      zoom: +camera.zoom.toFixed(4),
      devDeg: +THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(-dir.dot(U), -1, 1))).toFixed(3),
      locked,
    };
  },
  /* 起点 / 终点在屏幕上的像素位置（正交视角下两者应完全重合） */
  screen(which) {
    const v = (which === 'end' ? endPt : startPt).clone().project(camera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
  },
  /* 旋转到别处再立即回位，比较视图投影矩阵：证明“返回最佳视角”严格可重复 */
  probeReturn() {
    setView(-17, 23, 1.7);
    goHome(0);
    const after = viewProjNow();
    let worst = 0;
    for (let i = 0; i < 16; i++) worst = Math.max(worst, Math.abs(MAGIC_VP[i] - after[i]));
    return worst;
  },
};
document.getElementById('diag').textContent = 'DIAG ' + JSON.stringify(diag);

const az = num('az', 0), pol = num('pol', 0), zm = num('zoom', 0);
if (az || pol || zm) setView(az, pol, zm || MAGIC.zoom);
frame();
</script>
</body>
</html>
