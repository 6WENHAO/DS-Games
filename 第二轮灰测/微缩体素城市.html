  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <div id="reticle" class="reticle" aria-hidden="true">
        <div class="reticle-ring"></div>
        <div class="reticle-dot"></div>
      </div>

      <div id="flash" class="flash" aria-hidden="true"></div>
      <div id="vignette-storm" class="storm-tint" aria-hidden="true"></div>

      <header class="brand">
        <div class="brand-title">微缩体素城市 · 灾难沙盘</div>
        <div class="brand-hint" id="hint">左键拖动旋转 · 右键拖动平移 · 滚轮缩放 · 选择灾难后点击城市释放</div>
      </header>

      <div class="stats" id="stats">
        <span id="stat-voxels">体素 --</span><i>·</i><span id="stat-debris">碎片 --</span><i>·</i
        ><span id="stat-peds">行人 --</span><i>·</i><span id="stat-fps">FPS --</span>
      </div>

      <div class="ctrl-tip" id="ctrl-tip" hidden></div>

      <footer class="dock" id="dock">
        <div class="tools" id="tools"></div>
        <div class="dock-sep" aria-hidden="true"></div>
        <div class="switches">
          <button class="chip" id="btn-slowmo" type="button" aria-pressed="false">
            <span class="chip-ico">◐</span><span class="chip-label">慢镜头</span>
          </button>
          <button class="chip" id="btn-audio" type="button" aria-pressed="true">
            <span class="chip-ico">♪</span><span class="chip-label">音效</span>
          </button>
          <button class="chip chip-accent" id="btn-rebuild" type="button">
            <span class="chip-ico">⟳</span><span class="chip-label">重建</span>
          </button>
        </div>
        <div class="dock-sep" aria-hidden="true"></div>
        <div class="sliders">
          <label class="slider">
            <span class="slider-name">威力</span>
            <input id="sl-power" type="range" min="30" max="220" value="100" step="1" />
            <span class="slider-val" id="val-power">100%</span>
          </label>
          <label class="slider">
            <span class="slider-name">移轴</span>
            <input id="sl-tilt" type="range" min="0" max="100" value="55" step="1" />
            <span class="slider-val" id="val-tilt">55%</span>
          </label>
        </div>
      </footer>

      <div class="boot" id="boot">
        <div class="boot-inner">
          <div class="boot-spin"></div>
          <div class="boot-text">正在搭建微缩城市…</div>
        </div>
      </div>
    </div>
  </body>
