<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="WebCraft - a faithful browser-based voxel sandbox in the spirit of Minecraft, built with WebGL2.">
<meta name="theme-color" content="#0a0d12">
<title>WebCraft</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/textures/blocks/grass_block_side.png">
</head>
<body>
  <!-- The game renders everything, including its interface, into this canvas. -->
  <canvas id="game" width="1280" height="720"></canvas>

  <!-- Loading screen, hidden once assets are ready. -->
  <div id="loading">
    <div class="panel">
      <h1>WebCraft</h1>
      <p class="sub">网页版 Minecraft &middot; a browser voxel sandbox</p>
      <div class="bar-track"><div id="loading-bar"></div></div>
      <p id="loading-label">正在启动&hellip;</p>
      <p class="tip">
        <b>WASD</b> 移动 &middot; <b>空格</b> 跳跃 &middot; <b>Shift</b> 潜行 &middot;
        <b>Ctrl</b> 疾跑 &middot; <b>鼠标</b> 转向 &middot;
        <b>左键</b> 挖掘 &middot; <b>右键</b> 放置 &middot; <b>中键</b> 选取<br>
        <b>1-9</b> 快捷栏 &middot; <b>E</b> 背包 &middot; <b>Q</b> 丢弃 &middot;
        <b>T</b> 聊天 &middot; <b>/</b> 命令 &middot; <b>F3</b> 调试 &middot;
        <b>F5</b> 视角 &middot; <b>F11</b> 全屏 &middot; <b>F2</b> 截图<br>
        创造模式双击 <b>空格</b> 切换飞行 &middot; 语言可在设置中切换
      </p>
    </div>
  </div>

  <!-- Fatal error surface, so a failure is never a black screen. -->
  <div id="error"></div>

  <noscript>
    <div class="noscript">WebCraft needs JavaScript and WebGL2 to run.</div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
