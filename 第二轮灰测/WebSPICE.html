let spaceDown=false;
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('mousedown',function(e){
  cv.focus();
  const sx=e.offsetX, sy=e.offsetY, w=S2W(sx,sy);
  if(e.button===1||spaceDown){
    App.drag={mode:'pan',sx:sx,sy:sy,px:App.view.px,py:App.view.py}; e.preventDefault(); return;
  }
  if(e.button===2){
    if(App.wiring){ App.wiring=null; draw(); return; }
    if(App.place){ setPlace(null); return; }
    const hc=hitComp(sx,sy)||hitWire(sx,sy)||hitProbe(sx,sy);
    showMenu(e.clientX,e.clientY,hc&&hc.w?hc.w:hc);
    return;
  }
  hideMenu();
  // 放置模式
  if(App.place){
    pushUndo();
    const c=addComp(App.place.type,w.x,w.y,App.place.rot,App.place.mirror);
    rebuild(); App.sel.clear(); App.sel.add(c);
    if(!e.shiftKey) setPlace(null); else renderSide();
    return;
  }
  // 探针模式
  if(App.mode==='probe'){
    const hw=hitWire(sx,sy);
    if(hw){ pushUndo(); const pr=addProbe(hw.x,hw.y); rebuild();
      toast('已添加探针 '+pr.name+'（可在示波器中查看）'); }
    else toast('请点击一根导线以放置探针');
    return;
  }
  // 连线中
  if(App.wiring){
    const hp=hitPin(sx,sy);
    const end=(App.wiring.preview&&App.wiring.preview.length)?
      App.wiring.preview[App.wiring.preview.length-1]:App.wiring.pts[App.wiring.pts.length-1];
    App.wiring.pts=App.wiring.pts.concat(App.wiring.preview||[]);
    App.wiring.preview=[];
    const onW=hitWire(sx,sy);
    if(hp || (onW && App.wiring.pts.length>1)) commitWire();
    else draw();
    return;
  }
  const hp=hitPin(sx,sy);
  if(hp){ startWire({x:hp.x,y:hp.y}); return; }
  if(App.mode==='wire'){ startWire({x:snap(w.x),y:snap(w.y)}); return; }
  const pr=hitProbe(sx,sy);
  const hc=hitComp(sx,sy);
  const hw=hitWire(sx,sy);
  const obj=pr||hc||(hw?hw.w:null);
  if(obj){
    if(!App.sel.has(obj)){ if(!e.shiftKey) App.sel.clear(); App.sel.add(obj); }
    else if(e.shiftKey){ App.sel.delete(obj); renderSide(); draw(); return; }
    // 拖动准备（含导线端点橡皮筋跟随）
    const items=[];
    App.sel.forEach(function(o){
      if(o.pts) items.push({o:o,kind:'wire',pts:o.pts.map(function(p){return {x:p.x,y:p.y};})});
      else if(o.name!==undefined&&o.type) items.push({o:o,kind:'comp',x:o.x,y:o.y});
      else items.push({o:o,kind:'probe',x:o.x,y:o.y});
    });
    const rubber=[];
    for(let i=0;i<items.length;i++){
      if(items[i].kind!=='comp') continue;
      const c=items[i].o, d=COMP[c.type];
      for(let j=0;j<d.pins.length;j++){
        const pw=pinWorld(c,j);
        for(let k=0;k<App.sch.wires.length;k++){
          const wr=App.sch.wires[k]; if(App.sel.has(wr)) continue;
          for(let m=0;m<wr.pts.length;m++)
            if(wr.pts[m].x===pw.x&&wr.pts[m].y===pw.y)
              rubber.push({w:wr,i:m,x:wr.pts[m].x,y:wr.pts[m].y});
        }
      }
    }
    App.drag={mode:'move',sx:sx,sy:sy,items:items,rubber:rubber,moved:false};
    renderSide(); draw(); return;
  }
  if(!e.shiftKey) App.sel.clear();
  App.box={x1:w.x,y1:w.y,x2:w.x,y2:w.y};
  App.drag={mode:'box'};
  renderSide(); draw();
});
window.addEventListener('mousemove',function(e){
  if(e.target!==cv && !App.drag && !App.wiring && !App.place) return;
  const r=cv.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  const w=S2W(sx,sy);
  $('stXY').textContent=snap(w.x)+','+snap(w.y);
  const d=App.drag;
  if(d&&d.mode==='pan'){
    App.view.px=d.px+(sx-d.sx); App.view.py=d.py+(sy-d.sy); draw(); return;
  }
  if(d&&d.mode==='move'){
    const dx=snap((sx-d.sx)/App.view.z), dy=snap((sy-d.sy)/App.view.z);
    if(dx||dy) d.moved=true;
    for(let i=0;i<d.items.length;i++){
      const it=d.items[i];
      if(it.kind==='wire'){ for(let j=0;j<it.pts.length;j++){
          it.o.pts[j].x=it.pts[j].x+dx; it.o.pts[j].y=it.pts[j].y+dy; } }
      else { it.o.x=it.x+dx; it.o.y=it.y+dy; }
    }
    for(let i=0;i<d.rubber.length;i++){
      const rb=d.rubber[i]; rb.w.pts[rb.i].x=rb.x+dx; rb.w.pts[rb.i].y=rb.y+dy;
    }
    draw(); return;
  }
  if(d&&d.mode==='box'){ App.box.x2=w.x; App.box.y2=w.y; draw(); return; }
  if(App.place){ App.place.x=snap(w.x); App.place.y=snap(w.y); draw(); return; }
  if(App.wiring){
    const hp=hitPin(sx,sy);
    const tgt=hp?{x:hp.x,y:hp.y}:{x:snap(w.x),y:snap(w.y)};
    const last=App.wiring.pts[App.wiring.pts.length-1];
    App.wiring.preview=manhattan(last,tgt,e.shiftKey);
    App.hoverPin=hp?{x:hp.x,y:hp.y}:null;
    draw(); return;
  }
  const hp=hitPin(sx,sy);
  App.hoverPin=hp?{x:hp.x,y:hp.y}:null;
  const hc=hitComp(sx,sy);
  if(hc!==App.hover){ App.hover=hc; draw(); }
  else if(hp!==null||App.hoverPin) draw();
  cv.style.cursor=hp?'crosshair':(hc?'move':(App.mode==='wire'?'crosshair':'default'));
});
window.addEventListener('mouseup',function(e){
  const d=App.drag;
  if(d&&d.mode==='box'){
    const b=App.box;
    const x1=Math.min(b.x1,b.x2),x2=Math.max(b.x1,b.x2),y1=Math.min(b.y1,b.y2),y2=Math.max(b.y1,b.y2);
    if(Math.abs(x2-x1)>3||Math.abs(y2-y1)>3){
      for(let i=0;i<App.sch.comps.length;i++){
        const bb=compBB(App.sch.comps[i]);
        if(bb[2]>=x1&&bb[0]<=x2&&bb[3]>=y1&&bb[1]<=y2) App.sel.add(App.sch.comps[i]);
      }
      for(let i=0;i<App.sch.wires.length;i++){
        const wr=App.sch.wires[i]; let all=wr.pts.length>0;
        for(let j=0;j<wr.pts.length;j++)
          if(!(wr.pts[j].x>=x1&&wr.pts[j].x<=x2&&wr.pts[j].y>=y1&&wr.pts[j].y<=y2)) all=false;
        if(all) App.sel.add(wr);
      }
      for(let i=0;i<App.sch.probes.length;i++){
        const pr=App.sch.probes[i];
        if(pr.x>=x1&&pr.x<=x2&&pr.y>=y1&&pr.y<=y2) App.sel.add(pr);
      }
    }
    App.box=null; renderSide();
  }
  if(d&&d.mode==='move'&&d.moved){ App.undoS.push(snapshot()); App.redoS.length=0; rebuild(); }
  App.drag=null; draw();
});

window.addEventListener('keydown',function(e){
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.code==='Space'){ spaceDown=true; cv.style.cursor='grab'; e.preventDefault(); return; }
  const k=e.key.toLowerCase();
  if(e.ctrlKey||e.metaKey){
    if(k==='z'){ undo(); e.preventDefault(); }
    else if(k==='y'){ redo(); e.preventDefault(); }
    else if(k==='a'){ App.sel.clear();
      for(let i=0;i<App.sch.comps.length;i++) App.sel.add(App.sch.comps[i]);
      for(let i=0;i<App.sch.wires.length;i++) App.sel.add(App.sch.wires[i]);
      renderSide(); draw(); e.preventDefault(); }
    else if(k==='c'){ copySel(); e.preventDefault(); }
    else if(k==='v'){ pasteSel(); e.preventDefault(); }
    else if(k==='s'){ saveFile(); e.preventDefault(); }
    return;
  }
  if(k==='r'){ rotateSel(1); draw(); }
  else if(k==='m'){ mirrorSel(); draw(); }
  else if(e.key==='Delete'||e.key==='Backspace'){ deleteSel(); draw(); }
  else if(e.key==='Escape'){ App.wiring=null; setPlace(null); App.sel.clear(); hideMenu(); renderSide(); draw(); }
  else if(k==='w'){ setMode('wire'); }
  else if(k==='p'){ setMode('probe'); }
  else if(k==='v'||k==='escape'){ setMode('sel'); }
  else if(k==='enter'&&App.wiring){ commitWire(); }
  else if(e.key.indexOf('Arrow')===0){
    const cs=selComps(); if(!cs.length) return;
    const dx=e.key==='ArrowLeft'?-GRID:(e.key==='ArrowRight'?GRID:0);
    const dy=e.key==='ArrowUp'?-GRID:(e.key==='ArrowDown'?GRID:0);
    pushUndo();
    for(let i=0;i<cs.length;i++){ cs[i].x+=dx; cs[i].y+=dy; }
    rebuild(); draw(); e.preventDefault();
  }
  else {
    // 开关快捷键：仿真运行中也能实时通断（Multisim 风格）
    let hit=false;
    for(let i=0;i<App.sch.comps.length;i++){
      const c=App.sch.comps[i];
      if(c.type!=='SW') continue;
      if(String(ps(c,'key')).toLowerCase()===k){
        c.props.on = pv(c,'on')>0.5?'0':'1'; invalidateComp(c); hit=true;
      }
    }
    if(hit){ if(!App.running&&App.dc) runDC(true); renderSide(); draw();
      toast('开关状态已切换（按键 '+k.toUpperCase()+'）'); }
  }
});

let clip=null;
function copySel(){
  const cs=selComps(); if(!cs.length) return;
  clip=cs.map(function(c){ return {type:c.type,x:c.x,y:c.y,rot:c.rot,mirror:c.mirror,props:Object.assign({},c.props)}; });
  toast('已复制 '+cs.length+' 个元件');
}
function pasteSel(){
  if(!clip||!clip.length) return;
  pushUndo(); App.sel.clear();
  for(let i=0;i<clip.length;i++){
    const c=addComp(clip[i].type,clip[i].x+GRID*4,clip[i].y+GRID*4,clip[i].rot,clip[i].mirror,clip[i].props);
    App.sel.add(c);
  }
  rebuild(); draw(); toast('已粘贴');
}

function esc(s){ return String(s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let toastT=0;
function toast(msg,type){
  const t=$('toast'); t.textContent=msg; t.className='show';
  t.style.borderColor = type==='err'?'#ff5f56':(type==='warn'?'#ffb648':'#3fa7ff');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.className=''; },2600);
}
const HINTS={ sel:'选择模式：拖动移动元件 · 点击引脚开始连线 · 双击改参数 · R 旋转 · M 镜像 · Del 删除 · 滚轮缩放 · 空格拖动平移',
  wire:'连线模式：点击起点→自动直角走线→点击引脚/导线结束 · Shift 切换折向 · 右键或 Esc 取消',
  probe:'探针模式：点击任意导线放置电压探针，瞬态分析时在示波器中显示该点波形' };
function setMode(m,quiet){
  App.mode=m;
  $('mdSel').classList.toggle('on',m==='sel');
  $('mdWire').classList.toggle('on',m==='wire');
  $('mdProbe').classList.toggle('on',m==='probe');
  $('hint').textContent=App.place?('放置 '+COMP[App.place.type].name+'：点击画布放置（按住 Shift 连续放置）· R 旋转 · Esc 取消'):HINTS[m];
  if(m!=='wire') App.wiring=null;
  if(!quiet) draw();
}
function setPlace(type){
  if(!type){ App.place=null; setMode(App.mode,true); draw(); 
    const els=document.querySelectorAll('.li.sel'); for(let i=0;i<els.length;i++) els[i].classList.remove('sel');
    return; }
  App.place={type:type,name:'',x:-9999,y:-9999,rot:App.placeRot||0,mirror:false,props:{},st:{},conn:null};
  const els=document.querySelectorAll('.li');
  for(let i=0;i<els.length;i++) els[i].classList.toggle('sel',els[i].getAttribute('data-t')===type);
  setMode('sel',true);
  $('hint').textContent='放置 '+COMP[type].name+'：点击画布放置（按住 Shift 连续放置）· R 旋转 · Esc 取消';
  draw();
}
function drawIcon(cvs,type){
  const g=cvs.getContext('2d'), d=COMP[type], b=d.bb;
  const w=Math.max(b[2]-b[0],20), h=Math.max(b[3]-b[1],20);
  const s=Math.min((cvs.width-10)/w,(cvs.height-10)/h);
  g.clearRect(0,0,cvs.width,cvs.height);
  g.save(); g.translate(cvs.width/2,cvs.height/2); g.scale(s,s);
  g.translate(-(b[0]+b[2])/2,-(b[1]+b[3])/2);
  g.strokeStyle='#cbd6e2'; g.fillStyle='#cbd6e2'; g.lineWidth=Math.max(1.4,2.2/s); g.lineJoin='round';
  try{ d.draw(g,{type:type,props:{},st:{},name:''}); }catch(e){}
  g.restore();
}
function buildLib(){
  const lib=$('lib'); let h='';
  for(let i=0;i<CATS.length;i++){
    const cat=CATS[i][0];
    h+='<h4>'+CATS[i][1]+'</h4><div class="litems">';
    for(const t in COMP) if(COMP[t].cat===cat)
      h+='<div class="li" data-t="'+t+'" title="'+esc(COMP[t].name)+'（点击后在画布上点击放置）">'+
         '<canvas width="104" height="72" style="width:52px;height:36px"></canvas><span>'+esc(COMP[t].name)+'</span></div>';
    h+='</div>';
  }
  lib.innerHTML=h;
  const items=lib.querySelectorAll('.li');
  for(let i=0;i<items.length;i++){
    const el=items[i], t=el.getAttribute('data-t');
    drawIcon(el.querySelector('canvas'),t);
    el.addEventListener('mousedown',function(e){ setPlace(t); App.placeDrag=true; e.preventDefault(); });
  }
}

function propRows(c,idp){
  const d=COMP[c.type]; let h='';
  h+='<div class="prow"><label>标识</label><input type="text" id="'+idp+'name" value="'+esc(c.name)+'"></div>';
  for(let i=0;i<d.props.length;i++){
    const p=d.props[i], raw=(c.props&&c.props[p.k]!==undefined)?c.props[p.k]:'';
    if(p.type==='select'){
      h+='<div class="prow"><label>'+p.label+'</label><select id="'+idp+p.k+'">';
      for(let j=0;j<p.opts.length;j++)
        h+='<option'+(ps(c,p.k)===p.opts[j]?' selected':'')+'>'+esc(p.opts[j])+'</option>';
      h+='</select></div>';
    } else if(p.type==='bool'){
      h+='<div class="prow"><label>'+p.label+'</label><input type="checkbox" id="'+idp+p.k+'"'+
         (pv(c,p.k)>0.5?' checked':'')+'><span class="u"></span></div>';
    } else if(p.type==='range'){
      h+='<div class="prow"><label>'+p.label+'</label><input type="range" min="0" max="1" step="0.01" id="'+
         idp+p.k+'" value="'+pv(c,p.k)+'"><span class="u" id="'+idp+p.k+'_v">'+Math.round(pv(c,p.k)*100)+'%</span></div>';
    } else {
      h+='<div class="prow"><label>'+p.label+'</label><input type="text" id="'+idp+p.k+'" value="'+esc(raw)+
         '" placeholder="'+esc(p.def)+'"><span class="u">'+(p.unit||'')+'</span></div>';
    }
  }
  return h;
}
function setProp(c,k,v){
  c.props[k]=v; invalidateComp(c);
  if(!App.running && App.dc) runDC(true);
  updateStat(); draw();
}
function bindProps(c,idp){
  const d=COMP[c.type], nm=$(idp+'name');
  if(nm) nm.onchange=function(){ c.name=nm.value||c.name; rebuild(); draw(); };
  for(let i=0;i<d.props.length;i++){
    const p=d.props[i], el=$(idp+p.k);
    if(!el) continue;
    if(p.type==='bool') el.onchange=function(){ setProp(c,p.k,el.checked?'1':'0'); };
    else if(p.type==='range') el.oninput=function(){
      setProp(c,p.k,el.value);
      const s=$(idp+p.k+'_v'); if(s) s.textContent=Math.round(parseFloat(el.value)*100)+'%';
    };
    else el.onchange=function(){
      const had=!!App.dc;
      setProp(c,p.k,el.value);
      if(p.type==='select'){ rebuild(); }        // 型号可能改变内部节点数 → 重建网表
      if(had) runDC(true);
      draw();
    };
  }
}

  h+='<h4>瞬态设置 · Transient</h4><div class="sect">'+
    '<div class="prow"><label>仿真时长</label><input type="text" id="simTstop" value="'+esc(App.sim.tstop)+'"><span class="u">s</span></div>'+
    '<div class="prow"><label>最大步长</label><input type="text" id="simTstep" value="'+esc(App.sim.tstep)+'"><span class="u">s</span></div>'+
    '<div class="prow"><label>积分方法</label><select id="simMethod">'+
      '<option value="trap"'+(App.sim.method==='trap'?' selected':'')+'>梯形法（二阶）</option>'+
      '<option value="be"'+(App.sim.method==='be'?' selected':'')+'>后向欧拉（一阶）</option></select></div>'+
    '<div class="prow"><label>零初值(UIC)</label><input type="checkbox" id="simUic"'+(App.sim.uic?' checked':'')+'></div>'+

const TDIVS=[], VDIVS=[];
(function(){
  const ms=[1,2,5];
  for(let e=-7;e<=1;e++) for(let i=0;i<3;i++) TDIVS.push(ms[i]*Math.pow(10,e));
  for(let e=-3;e<=2;e++) for(let i=0;i<3;i++) VDIVS.push(ms[i]*Math.pow(10,e));
})();
function nearIdx(arr,v){
  let b=0, bd=1e99;
  for(let i=0;i<arr.length;i++){ const d=Math.abs(Math.log(arr[i]/v)); if(d<bd){bd=d;b=i;} }
  return b;
}
const Scope={ tdiv:1e-3, hpos:0, ch:[{vdiv:1,off:0},{vdiv:1,off:-0}],
  trig:{lvl:0,edge:1,mode:'auto'}, cursor:false, c1:0.35, c2:0.65 };
function chTrace(ch){
  if(!App.traces) return null;
  for(let i=0;i<App.traces.length;i++) if(App.traces[i].ch===ch) return App.traces[i];
  return null;
}
function pickTdiv(x){ return TDIVS[nearIdx(TDIVS,Math.max(x,1e-7))]; }
function autoScaleScope(){
  for(let ch=0;ch<2;ch++){
    let lo=1e99,hi=-1e99;
    for(let i=0;i<(App.traces||[]).length;i++){
      const t=App.traces[i]; if(t.ch!==ch||!t.n) continue;
      const mm=t.minmax(-1e99,1e99); lo=Math.min(lo,mm[0]); hi=Math.max(hi,mm[1]);
    }
    if(lo>hi) continue;
    const span=Math.max((hi-lo)*1.35,1e-3);
    Scope.ch[ch].vdiv=VDIVS[nearIdx(VDIVS,span/6)];
    Scope.ch[ch].off=-((hi+lo)/2)/Scope.ch[ch].vdiv;
  }
  updateScopeUI();
}
function findTrigger(span,tEnd){
  const tr=chTrace(0);
  if(Scope.trig.mode==='roll'||!tr||tr.n<4) return null;
  const lvl=Scope.trig.lvl, ed=Scope.trig.edge;
  for(let i=tr.n-2;i>0;i--){
    if(tr.t[i]+span*0.5>tEnd) continue;
    const a=tr.y[i], b=tr.y[i+1];
    if((ed>0&&a<=lvl&&b>lvl)||(ed<0&&a>=lvl&&b<lvl))
      return tr.t[i]+(tr.t[i+1]-tr.t[i])*((lvl-a)/((b-a)||1e-30));
  }
  return null;
}
function scopeWin(){
  const span=Scope.tdiv*10;
  const tr=(App.traces&&App.traces.length)?App.traces[0]:null;
  const tEnd=(tr&&tr.n)?tr.t[tr.n-1]:0;
  const trg=findTrigger(span,tEnd);
  let t0=(trg!==null)?(trg-span*0.5):Math.max(0,tEnd-span);
  t0+=Scope.hpos;
  return [t0,t0+span,tEnd,trg];
}
function fitPlot(c){
  const r=c.getBoundingClientRect();
  const w=Math.max(60,Math.round(r.width*DPR)), h=Math.max(60,Math.round(r.height*DPR));
  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
  return [r.width,r.height];
}
function drawScope(){
  const c=$('scCv'), g=c.getContext('2d'), d=fitPlot(c), W=d[0], H=d[1];
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#08160d'; g.fillRect(0,0,W,H);
  const win=scopeWin(), t0=win[0], t1=win[1], tEnd=win[2];
  // ---- 荧光绿网格（10×8 格）----
  g.lineWidth=1;
  g.strokeStyle='#173d24';
  g.beginPath();
  for(let i=0;i<=10;i++){ const x=Math.round(i*W/10)+.5; g.moveTo(x,0); g.lineTo(x,H); }
  for(let i=0;i<=8;i++){ const y=Math.round(i*H/8)+.5; g.moveTo(0,y); g.lineTo(W,y); }
  g.stroke();
  g.strokeStyle='#2a6b3d'; g.beginPath();
  g.moveTo(0,Math.round(H/2)+.5); g.lineTo(W,Math.round(H/2)+.5);
  g.moveTo(Math.round(W/2)+.5,0); g.lineTo(Math.round(W/2)+.5,H);
  g.stroke();
  g.fillStyle='#2a6b3d';
  for(let i=1;i<10;i++) for(let j=1;j<50;j++){
    const x=i*W/10, y=j*H/50;
    if(j%(50/8)<0.01) continue;
    g.fillRect(x,y,1,1);
  }
  // ---- 波形 ----
  const trs=App.traces||[];
  let any=false;
  for(let ti=0;ti<trs.length;ti++){
    const tr=trs[ti]; if(!tr.n) continue;
    any=true;
    const chi=Scope.ch[tr.ch||0], vd=chi.vdiv, off=chi.off;
    const y0=H/2, ppd=H/8;
    g.strokeStyle=tr.color; g.lineWidth=1.6; g.beginPath();
    let started=false, px=-1, pmin=0, pmax=0;
    for(let i=0;i<tr.n;i++){
      const t=tr.t[i]; if(t<t0) continue; if(t>t1) break;
      const x=(t-t0)/(t1-t0)*W;
      const y=y0-((tr.y[i]/vd)+off)*ppd;
      const xi=Math.round(x);
      if(xi!==px){
        if(px>=0){
          if(!started){ g.moveTo(px,pmin); started=true; }
          g.lineTo(px,pmin); if(pmax!==pmin) g.lineTo(px,pmax);
        }
        px=xi; pmin=y; pmax=y;
      } else { if(y<pmin) pmin=y; if(y>pmax) pmax=y; }
    }
    if(px>=0){ if(!started) g.moveTo(px,pmin); g.lineTo(px,pmin); if(pmax!==pmin) g.lineTo(px,pmax); }
    g.stroke();
    // 通道基线标记
    g.fillStyle=tr.color;
    const by=y0-off*ppd;
    if(by>4&&by<H-4){ g.beginPath(); g.moveTo(0,by); g.lineTo(7,by-4); g.lineTo(7,by+4); g.closePath(); g.fill(); }
  }
  // ---- 触发电平线 ----
  const c0=Scope.ch[0];
  const ty=H/2-((Scope.trig.lvl/c0.vdiv)+c0.off)*(H/8);
  if(ty>0&&ty<H){
    g.strokeStyle='#ff8fab'; g.setLineDash([5,4]); g.lineWidth=1;
    g.beginPath(); g.moveTo(0,ty); g.lineTo(W,ty); g.stroke(); g.setLineDash([]);
    g.fillStyle='#ff8fab'; g.font='9px Consolas'; g.textAlign='right'; g.textBaseline='bottom';
    g.fillText('T',W-2,ty-1);
  }
  // ---- 游标 ----
  let rd='';
  if(Scope.cursor && any){
    const xa=Scope.c1*W, xb=Scope.c2*W;
    const ta=t0+(t1-t0)*Scope.c1, tb=t0+(t1-t0)*Scope.c2;
    g.strokeStyle='#ffd166'; g.setLineDash([4,3]); g.lineWidth=1;
    g.beginPath(); g.moveTo(xa,0); g.lineTo(xa,H); g.moveTo(xb,0); g.lineTo(xb,H); g.stroke();
    g.setLineDash([]);
    g.fillStyle='#ffd166'; g.font='10px Consolas'; g.textAlign='center'; g.textBaseline='top';
    g.fillText('1',xa,2); g.fillText('2',xb,2);
    const dt=tb-ta;
    rd='游标 T1='+fmtEng(ta,'s',4)+'  T2='+fmtEng(tb,'s',4)+'  ΔT='+fmtEng(dt,'s',4)+
       '  1/ΔT='+fmtEng(dt!==0?1/dt:0,'Hz',4)+'\n';
    for(let i=0;i<trs.length;i++){
      const tr=trs[i]; if(!tr.n) continue;
      const va=tr.at(ta), vb=tr.at(tb);
      rd+='  '+tr.name+': V1='+fmtEng(va,'V',4)+'  V2='+fmtEng(vb,'V',4)+'  ΔV='+fmtEng(vb-va,'V',4)+'\n';
    }
  } else if(any){
    rd='窗口 '+fmtEng(t0,'s',3)+' → '+fmtEng(t1,'s',3)+'   （'+fmtEng(Scope.tdiv,'s',3)+'/格）\n';
    for(let i=0;i<trs.length;i++){
      const tr=trs[i]; if(!tr.n) continue;
      const mm=tr.minmax(t0,t1);
      if(mm[0]>mm[1]) continue;
      let sum=0,cnt=0,rms=0;
      for(let j=0;j<tr.n;j++){ if(tr.t[j]<t0||tr.t[j]>t1) continue; sum+=tr.y[j]; rms+=tr.y[j]*tr.y[j]; cnt++; }
      rd+='  '+tr.name+': Vpp='+fmtEng(mm[1]-mm[0],'V',4)+'  Vmax='+fmtEng(mm[1],'V',4)+
          '  Vmin='+fmtEng(mm[0],'V',4)+'  Vavg='+fmtEng(cnt?sum/cnt:0,'V',3)+
          '  Vrms='+fmtEng(cnt?Math.sqrt(rms/cnt):0,'V',3)+'\n';
    }
  } else rd=App.tran?'正在采集数据…':'等待瞬态分析数据：点击工具栏【▶ 瞬态】开始';
  if(App.tran) rd+='仿真进度 '+fmtEng(App.tran.t,'s',3)+' / '+fmtEng(App.tran.o.tstop,'s',3)+
    '   步数 '+App.tran.n+'   拒步 '+App.tran.rej+(App.running?'   ●运行中':'   ■已停止');
  $('scRd').textContent=rd;
  // 边框
  g.strokeStyle='#2a6b3d'; g.lineWidth=1; g.strokeRect(.5,.5,W-1,H-1);
}

  $('vOA').textContent=Scope.ch[0].off.toFixed(2)+' div';

const Bode={ showMag:true, showPh:true, cursor:false, cf:0.5, auto:true };
function drawBode(){
  const c=$('bdCv'), g=c.getContext('2d'), d=fitPlot(c), W=d[0], H=d[1];
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#08160d'; g.fillRect(0,0,W,H);
  const PL=46, PR=44, PT=14, PB=26;
  const w=W-PL-PR, h=H-PT-PB;
  const r=App.ac;
  g.strokeStyle='#173d24'; g.lineWidth=1;
  if(!r||!r.ok||!r.f.length){
    g.fillStyle='#3d8f56'; g.font='13px Consolas'; g.textAlign='center';
    g.fillText('等待交流扫描数据：设置频率范围后点击【▶ 运行扫描】',W/2,H/2);
    g.strokeRect(.5,.5,W-1,H-1); return;
  }
  const f1=r.f[0], f2=r.f[r.f.length-1];
  const lf1=Math.log10(f1), lf2=Math.log10(f2);
  const X=function(f){ return PL+(Math.log10(f)-lf1)/(lf2-lf1)*w; };
  const dbs=r.mag.map(function(m){ return 20*Math.log10(Math.max(m,1e-12)); });
  const lin=$('acScale').value==='lin';
  let ymin,ymax;
  if(lin){ ymin=0; ymax=Math.max.apply(null,r.mag)*1.1||1; }
  else {
    let lo=1e9,hi=-1e9;
    for(let i=0;i<dbs.length;i++){ if(isFinite(dbs[i])){ lo=Math.min(lo,dbs[i]); hi=Math.max(hi,dbs[i]); } }
    if(!Bode.auto){ lo=-60; hi=60; }
    if(lo>hi){ lo=-60; hi=20; }
    const pad=Math.max((hi-lo)*0.12,3);
    ymin=Math.floor((lo-pad)/10)*10; ymax=Math.ceil((hi+pad)/10)*10;
    if(ymax-ymin<20) ymax=ymin+20;
  }
  const Y=function(v){ return PT+h-(v-ymin)/(ymax-ymin)*h; };
  let phmin=-180, phmax=180;
  let plo=1e9,phi=-1e9;
  for(let i=0;i<r.ph.length;i++){ plo=Math.min(plo,r.ph[i]); phi=Math.max(phi,r.ph[i]); }
  if(isFinite(plo)){ phmin=Math.floor(plo/45)*45; phmax=Math.ceil(phi/45)*45;
    if(phmax-phmin<90){ phmax=phmin+90; } }
  const YP=function(p){ return PT+h-(p-phmin)/(phmax-phmin)*h; };
  // 网格：十倍频 + 1-9 细线
  g.strokeStyle='#12301c'; g.beginPath();
  for(let e=Math.floor(lf1);e<=Math.ceil(lf2);e++)
    for(let m=1;m<10;m++){
      const f=m*Math.pow(10,e); if(f<f1||f>f2) continue;
      const x=Math.round(X(f))+.5; g.moveTo(x,PT); g.lineTo(x,PT+h);
    }
  g.stroke();
  g.strokeStyle='#1f5732'; g.beginPath();
  for(let e=Math.ceil(lf1);e<=Math.floor(lf2);e++){
    const x=Math.round(X(Math.pow(10,e)))+.5; g.moveTo(x,PT); g.lineTo(x,PT+h);
  }
  const nY=6;
  for(let i=0;i<=nY;i++){ const y=Math.round(PT+i*h/nY)+.5; g.moveTo(PL,y); g.lineTo(PL+w,y); }
  g.stroke();
  g.font='10px Consolas'; g.textBaseline='middle';
  g.fillStyle='#4c9c66'; g.textAlign='right';
  for(let i=0;i<=nY;i++){
    const v=ymax-(ymax-ymin)*i/nY;
    g.fillText(lin?v.toPrecision(3):v.toFixed(0),PL-4,PT+i*h/nY);
  }
  g.fillStyle='#4ad6f3'; g.textAlign='left';
  for(let i=0;i<=nY;i++){
    const p=phmax-(phmax-phmin)*i/nY;
    g.fillText(p.toFixed(0)+'°',PL+w+4,PT+i*h/nY);
  }
  g.fillStyle='#4c9c66'; g.textAlign='center'; g.textBaseline='top';
  for(let e=Math.ceil(lf1);e<=Math.floor(lf2);e++)
    g.fillText(fmtEng(Math.pow(10,e),'Hz',2),X(Math.pow(10,e)),PT+h+5);
  g.textAlign='left'; g.fillStyle='#d8f34a';
  g.fillText(lin?'幅度（线性）':'幅度 dB',PL,2);
  g.textAlign='right'; g.fillStyle='#4ad6f3'; g.fillText('相位 °',PL+w,2);
  // 相频
  if(Bode.showPh){
    g.strokeStyle='#4ad6f3'; g.lineWidth=1.4; g.setLineDash([5,3]); g.beginPath();
    for(let i=0;i<r.f.length;i++){ const x=X(r.f[i]), y=YP(r.ph[i]);
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y); }
    g.stroke(); g.setLineDash([]);
  }
  // 幅频
  if(Bode.showMag){
    g.strokeStyle='#d8f34a'; g.lineWidth=2; g.beginPath();
    for(let i=0;i<r.f.length;i++){
      const x=X(r.f[i]), y=Y(lin?r.mag[i]:dbs[i]);
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.stroke();
  }
  // −3dB 标记
  const mark=function(f,lbl,col){
    if(!f||f<f1||f>f2) return;
    const x=X(f);
    g.strokeStyle=col; g.setLineDash([3,3]); g.lineWidth=1;
    g.beginPath(); g.moveTo(x,PT); g.lineTo(x,PT+h); g.stroke(); g.setLineDash([]);
    g.fillStyle=col; g.font='700 10px Consolas'; g.textAlign='center'; g.textBaseline='bottom';
    g.fillText(lbl,x,PT+h-2);
  };
  mark(r.fL,'fL '+fmtEng(r.fL,'Hz',3),'#ffb648');
  mark(r.fH,'fH '+fmtEng(r.fH,'Hz',3),'#ffb648');
  mark(r.f0,'0dB '+fmtEng(r.f0,'Hz',3),'#ff8fab');
  // 游标
  let info='';
  if(Bode.cursor){
    const f=Math.pow(10,lf1+(lf2-lf1)*Bode.cf), x=X(f);
    g.strokeStyle='#ffd166'; g.setLineDash([4,3]); g.beginPath();
    g.moveTo(x,PT); g.lineTo(x,PT+h); g.stroke(); g.setLineDash([]);
    let k=0; for(let i=0;i<r.f.length;i++) if(Math.abs(Math.log(r.f[i]/f))<Math.abs(Math.log(r.f[k]/f))) k=i;
    g.fillStyle='#ffd166'; g.beginPath(); g.arc(X(r.f[k]),Y(lin?r.mag[k]:dbs[k]),3.5,0,6.28); g.fill();
    info='游标 f='+fmtEng(r.f[k],'Hz',4)+'  |H|='+r.mag[k].toPrecision(4)+
         ' ('+dbs[k].toFixed(2)+' dB)  ∠H='+r.ph[k].toFixed(1)+'°\n';
  }
  g.strokeStyle='#2a6b3d'; g.lineWidth=1; g.strokeRect(.5,.5,W-1,H-1);
  // 测量结果
  let ms='峰值增益 '+(20*Math.log10(r.peak)).toFixed(2)+' dB（'+r.peak.toPrecision(4)+
    '×）@ '+fmtEng(r.peakF,'Hz',3)+'\n';
  if(r.fL) ms+='低端 −3dB：'+fmtEng(r.fL,'Hz',4)+'\n';
  if(r.fH) ms+='高端 −3dB：'+fmtEng(r.fH,'Hz',4)+'\n';
  if(r.fL&&r.fH) ms+='通带带宽 BW='+fmtEng(r.fH-r.fL,'Hz',4)+'\n';
  if(r.gbw) ms+='增益带宽积 GBW≈'+fmtEng(r.gbw,'Hz',4)+'\n';
  if(r.f0) ms+='单位增益频率 '+fmtEng(r.f0,'Hz',4)+'\n';
  ms+='扫描点数 '+r.f.length;
  $('bdMeas').textContent=ms;
  $('bdRd').textContent=info+'幅频（黄绿实线，左轴 dB）· 相频（青色虚线，右轴 度）· '+
    '橙色虚线为 −3dB 截止频率。拖动画布可移动游标。';
}

function buildTraces(){
  const circ=App.circ, tr=[];
  for(let i=0;i<circ.comps.length;i++){
    const c=circ.comps[i];
    if(c.type!=='SCOPE') continue;
    const a=c.ni[0], b=c.ni[1], gg=c.ni[2];
    const t1=new Trace(c.name+'.A','#d8f34a',function(ctx){ return ctx.xv(a)-ctx.xv(gg); },'V');
    const t2=new Trace(c.name+'.B','#4ad6f3',function(ctx){ return ctx.xv(b)-ctx.xv(gg); },'V');
    t1.ch=0; t2.ch=1; tr.push(t1); tr.push(t2);
  }
  for(let i=0;i<App.sch.probes.length;i++){
    const pr=App.sch.probes[i], idx=pr.net-1;
    const t=new Trace(pr.name,pr.color,function(ctx){ return ctx.xv(idx); },'V');
    t.ch=(tr.length?0:0); tr.push(t);
  }
  if(!tr.length){
    for(let i=1;i<Math.min(circ.nets,4);i++){
      const idx=i-1;
      const t=new Trace('V(n'+i+')',['#d8f34a','#4ad6f3','#ff8fab'][(i-1)%3],
        function(ctx){ return ctx.xv(idx); },'V');
      t.ch=(i-1)%2; tr.push(t);
    }
  }
  return tr;
}

function runAC(){
  if(!prepare()) return;
  let inIdx=null, outIdx=null, ref=-1, src='';
  for(let i=0;i<App.circ.comps.length;i++){
    const c=App.circ.comps[i];
    if(c.type==='BODE'){ inIdx=c.ni[0]; outIdx=c.ni[1]; ref=c.ni[2]; src='波特图仪 '+c.name; }
  }
  if(inIdx===null) for(let i=0;i<App.circ.comps.length;i++){
    const c=App.circ.comps[i];
    if(c.type==='SCOPE'){ inIdx=c.ni[0]; outIdx=c.ni[1]; ref=c.ni[2]; src='示波器 '+c.name+'（A=输入,B=输出）'; }
  }
  if(inIdx===null&&App.sch.probes.length>=2){
    inIdx=App.sch.probes[0].net-1; outIdx=App.sch.probes[1].net-1;
    src='探针 '+App.sch.probes[0].name+'→'+App.sch.probes[1].name;
  }
  if(inIdx===null){
    toast('交流扫描需要指定输入/输出：请放置【波特图仪】或【示波器】，或至少 2 个探针','warn');
    return;
  }
  let hasAC=false;
  for(let i=0;i<App.circ.comps.length;i++){
    const c=App.circ.comps[i];
    if(c.type==='VSIN'||c.type==='VSQ'||c.type==='VTRI'){ hasAC=true; break; }
    if((c.type==='VDC'||c.type==='IDC')&&ps(c,'ac')!==''&&parseVal(ps(c,'ac'),0)!==0){ hasAC=true; break; }
  }
  if(!hasAC) toast('提示：未发现交流激励源（正弦源默认以其幅值作为 AC 幅值）','warn');
  App.status='交流扫描中…'; updateStat();
  const f1=Math.max(parseVal($('acF1').value,1),1e-6);
  const f2=Math.max(parseVal($('acF2').value,1e6),f1*1.001);
  const ppd=clamp(parseVal($('acPts').value,30),3,400);
  const r=acSweep(App.circ,{f1:f1,f2:f2,ppd:ppd,inIdx:inIdx,outIdx:outIdx,inRef:ref,outRef:ref});
  App.ac=r; App.status=r.ok?'交流扫描完成':'交流扫描失败';
  if(!r.ok){ toast(r.reason||'交流扫描失败','err'); }
  else {
    showWin('winBode',true); drawBode();
    toast('交流扫描完成（'+src+'）：'+r.f.length+' 个频点');
  }
  // 交流分析同时给出工作点标注
  App.dc={ok:true,ctx:r.dc.ctx,it:r.dc.it,path:r.dc.path};
  annotate(); updateStat(); renderSide(); draw();
}

    if(!more||App.tran.fail){
      App.running=false;
      App.status=App.tran.fail?'瞬态中断':'瞬态完成';
      if(App.tran.fail) toast('瞬态分析中断：'+App.tran.fail,'err');
      else toast('瞬态分析完成：'+App.tran.n+' 步（拒步 '+App.tran.rej+'，牛顿 '+App.tran.itsum+' 次）');
      autoScaleScope(); renderSide();
    }
    annotate(); updateStat();
  }
  if($('winScope').classList.contains('show')) drawScope();
  if($('winBode').classList.contains('show')) drawBode();
  draw();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',function(){ resizeCv(); draw(); });
(function init(){
  resizeCv();
  buildLib();
  setMode('sel',true);
  updateScopeUI();
  loadExample('rclp');
  showWin('winScope',false); showWin('winBode',false);
  requestAnimationFrame(frame);
  console.log('WebSPICE 就绪：MNA + Newton-Raphson + 梯形积分 + 复数交流扫描');
})();
</script>
