<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebSPICE · 网页版电路仿真器</title>
<style>
/* ===================== 主题变量（深色工程风，参考 NI Multisim） ===================== */
:root{
  --bg:#12171c; --panel:#1b2129; --panel2:#222b34; --panel3:#2a343f;
  --line:#33404d; --line2:#445362; --txt:#cbd6e2; --dim:#7e8c9a;
  --acc:#3fa7ff; --acc2:#6ee7a8; --warn:#ffb648; --err:#ff5f56;
  --grid:#22303f; --gridb:#2c3f52; --wire:#39c2ff; --sel:#ffd166;
  --scope:#0a1a0f; --scopegrid:#1d5c33; --chA:#d8f34a; --chB:#4ad6f3;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);
  font:13px/1.45 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button,select,input{font:inherit;color:var(--txt)}
#app{display:flex;flex-direction:column;height:100%}

/* ===================== 顶部工具栏 ===================== */
#toolbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:linear-gradient(#252f3a,#1b2129);
  border-bottom:1px solid #0c1014;flex-wrap:wrap;row-gap:4px}
.tbgrp{display:flex;align-items:center;gap:3px;padding:0 6px;border-right:1px solid var(--line)}
.tbgrp:last-child{border-right:none}
.brand{font-weight:700;letter-spacing:.5px;color:var(--acc);padding-right:8px;font-size:14px}
.brand small{color:var(--dim);font-weight:400;letter-spacing:0}
button.tb{background:linear-gradient(#2c3742,#232c35);border:1px solid #3b4854;border-radius:4px;
  padding:4px 8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
button.tb:hover{background:linear-gradient(#37454f,#2a343d);border-color:#4d5f6e}
button.tb:active{transform:translateY(1px)}
button.tb.on{background:linear-gradient(#1f6ea8,#17527d);border-color:#3fa7ff;color:#fff}
button.tb.run{background:linear-gradient(#1f7a4d,#155c39);border-color:#2fa86b;color:#eafff2;font-weight:600}
button.tb.run:hover{background:linear-gradient(#268f5b,#186b43)}
button.tb.stop{background:linear-gradient(#8c2f2a,#6d221e);border-color:#c1443c;color:#ffecea}
button.tb:disabled{opacity:.45;cursor:default}
select.tb{background:#232c35;border:1px solid #3b4854;border-radius:4px;padding:4px 6px;cursor:pointer}
.sep{width:1px;height:20px;background:var(--line)}

/* ===================== 主体三栏 ===================== */
#main{flex:1;display:flex;min-height:0}
#lib{width:186px;background:var(--panel);border-right:1px solid #0c1014;overflow-y:auto;flex-shrink:0}
#lib h4{margin:0;padding:6px 8px;background:var(--panel2);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);font-size:12px;color:var(--acc2);letter-spacing:1px;position:sticky;top:0;z-index:2}
.litems{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px}
.li{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;border:1px solid transparent;
  border-radius:4px;cursor:grab;background:#1f262e}
.li:hover{border-color:var(--acc);background:#26313b}
.li.sel{border-color:var(--sel);background:#2f3646}
.li canvas{display:block}
.li span{font-size:10px;color:var(--dim);text-align:center;line-height:1.1}
#cwrap{flex:1;position:relative;min-width:0;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;display:block;cursor:crosshair}
#hint{position:absolute;left:8px;bottom:8px;background:#0009;border:1px solid var(--line);border-radius:4px;
  padding:4px 8px;font-size:11px;color:var(--dim);pointer-events:none;max-width:60%}
#side{width:262px;background:var(--panel);border-left:1px solid #0c1014;overflow-y:auto;flex-shrink:0}
#side h4{margin:0;padding:6px 8px;background:var(--panel2);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);font-size:12px;color:var(--acc2);letter-spacing:1px;
  display:flex;justify-content:space-between;cursor:pointer}
.sect{padding:7px 8px}
.prow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.prow label{flex:0 0 84px;color:var(--dim);font-size:12px}
.prow input[type=text],.prow input[type=number],.prow select{flex:1;min-width:0;background:#161c22;
  border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.prow input:focus,.prow select:focus{outline:1px solid var(--acc);border-color:var(--acc)}
.prow input[type=range]{flex:1;min-width:0}
.prow .u{color:var(--dim);font-size:11px;flex:0 0 auto;width:20px}
.hintline{color:var(--dim);font-size:11px;margin:2px 0 6px}
table.res{width:100%;border-collapse:collapse;font-size:11.5px;font-family:Consolas,monospace}
table.res th{text-align:left;color:var(--dim);font-weight:400;border-bottom:1px solid var(--line);padding:2px 3px}
table.res td{padding:1px 3px;border-bottom:1px solid #232b34}
table.res td.n{text-align:right}
#log{font:11px/1.4 Consolas,monospace;max-height:170px;overflow-y:auto;background:#11161b;
  border:1px solid var(--line);border-radius:3px;padding:4px;white-space:pre-wrap}
.lw{color:var(--warn)} .le{color:var(--err)} .lo{color:var(--acc2)} .ld{color:var(--dim)}
#statbar{display:flex;gap:14px;padding:3px 10px;background:var(--panel2);border-top:1px solid #0c1014;
  font-size:11.5px;color:var(--dim);font-family:Consolas,monospace}
#statbar b{color:var(--txt);font-weight:600}

/* ===================== 浮动仪器窗口 ===================== */
.win{position:fixed;background:var(--panel);border:1px solid #05070a;border-radius:6px;
  box-shadow:0 12px 40px #000b,0 0 0 1px #3b4854 inset;display:none;flex-direction:column;z-index:40}
.win.show{display:flex}
.winbar{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;cursor:move;
  background:linear-gradient(#2f3b47,#232c35);border-bottom:1px solid #0c1014;border-radius:5px 5px 0 0}
.winbar b{font-size:12px;letter-spacing:.5px}
.winbar .wb{background:#3a4652;border:1px solid #4c5b69;border-radius:3px;width:20px;height:18px;
  line-height:1;cursor:pointer;padding:0;font-size:11px}
.winbar .wb:hover{background:#4d5c6b}
.winbody{flex:1;display:flex;min-height:0;padding:6px;gap:6px}
.winrz{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 45%,#5a6b7a 45%,#5a6b7a 55%,transparent 55%)}
.instr{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
canvas.plot{flex:1;min-height:0;width:100%;background:var(--scope);border:1px solid #0b1a10;border-radius:3px}
.ctrl{width:206px;flex-shrink:0;overflow-y:auto;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:6px}
.ctrl h5{margin:5px 0 4px;font-size:11px;color:var(--acc2);letter-spacing:1px;border-bottom:1px solid var(--line);padding-bottom:2px}
.knobrow{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.knob{width:38px;height:38px;border-radius:50%;flex-shrink:0;cursor:ns-resize;position:relative;
  background:radial-gradient(circle at 38% 32%,#5b6b7a,#2b343d 62%,#171d23);
  box-shadow:0 2px 5px #000a,0 0 0 2px #131922,0 0 0 3px #3d4a57}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:2.5px;height:13px;margin-left:-1.25px;
  background:var(--acc2);border-radius:2px;box-shadow:0 0 5px var(--acc2)}
.knob i{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.kinfo{flex:1;min-width:0;font-size:11px;color:var(--dim);line-height:1.25}
.kinfo b{display:block;color:var(--txt);font-size:12px;font-family:Consolas,monospace}
.btnrow{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0}
.btnrow button{flex:1;background:linear-gradient(#2c3742,#232c35);border:1px solid #3b4854;border-radius:3px;
  padding:3px 5px;cursor:pointer;font-size:11.5px;white-space:nowrap}
.btnrow button:hover{border-color:var(--acc)}
.btnrow button.on{background:linear-gradient(#1f6ea8,#17527d);border-color:var(--acc);color:#fff}
.rd{font:11px/1.5 Consolas,monospace;background:#11161b;border:1px solid var(--line);border-radius:3px;
  padding:4px;color:var(--acc2);white-space:pre-wrap;min-height:56px}
.chip{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* ===================== 模态对话框 ===================== */
#mask{position:fixed;inset:0;background:#000a;display:none;z-index:60;align-items:center;justify-content:center}
#mask.show{display:flex}
#dlg{width:392px;max-height:84vh;overflow:auto;background:var(--panel);border:1px solid #4c5b69;
  border-radius:7px;box-shadow:0 16px 60px #000c}
#dlgt{padding:7px 10px;background:linear-gradient(#2f3b47,#232c35);border-bottom:1px solid #0c1014;
  font-weight:600;border-radius:6px 6px 0 0}
#dlgb{padding:10px}
#dlgf{padding:8px 10px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px}
#dlgf button{background:linear-gradient(#2c3742,#232c35);border:1px solid #3b4854;border-radius:4px;
  padding:4px 14px;cursor:pointer}
#dlgf button.pri{background:linear-gradient(#1f6ea8,#17527d);border-color:var(--acc);color:#fff}
#menu{position:fixed;background:var(--panel2);border:1px solid #4c5b69;border-radius:5px;padding:3px;
  display:none;z-index:70;box-shadow:0 8px 26px #000a;min-width:132px}
#menu.show{display:block}
#menu div{padding:4px 10px;border-radius:3px;cursor:pointer;font-size:12px}
#menu div:hover{background:var(--acc);color:#fff}
#menu hr{border:none;border-top:1px solid var(--line);margin:3px 0}
#toast{position:fixed;left:50%;top:52px;transform:translateX(-50%);background:#0d1318ee;border:1px solid var(--acc);
  color:var(--txt);padding:7px 16px;border-radius:5px;z-index:80;display:none;box-shadow:0 6px 24px #000a}
#toast.show{display:block;animation:tin .18s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#161c22}
::-webkit-scrollbar-thumb{background:#3a4652;border-radius:5px;border:2px solid #161c22}
::-webkit-scrollbar-thumb:hover{background:#4d5c6b}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="tbgrp"><span class="brand">WebSPICE <small>v1.0</small></span></div>
    <div class="tbgrp">
      <button class="tb" id="btNew" title="新建电路">🗋 新建</button>
      <button class="tb" id="btOpen" title="打开 .json 电路文件">📂 打开</button>
      <button class="tb" id="btSave" title="保存为 .json">💾 保存</button>
    </div>
    <div class="tbgrp">
      <button class="tb" id="btUndo" title="撤销 Ctrl+Z">↶</button>
      <button class="tb" id="btRedo" title="重做 Ctrl+Y">↷</button>
      <button class="tb" id="btRot" title="旋转 R">⟳ 旋转</button>
      <button class="tb" id="btMir" title="镜像 M">⇄ 镜像</button>
      <button class="tb" id="btDel" title="删除 Del">🗑 删除</button>
    </div>
    <div class="tbgrp">
      <button class="tb on" id="mdSel" title="选择/移动模式">▣ 选择</button>
      <button class="tb" id="mdWire" title="连线模式 W">〰 连线</button>
      <button class="tb" id="mdProbe" title="探针模式 P：点击导线添加探针">🔍 探针</button>
    </div>
    <div class="tbgrp">
      <button class="tb run" id="btDC" title="直流工作点分析">▶ 直流工作点</button>
      <button class="tb run" id="btTran" title="瞬态分析（示波器）">▶ 瞬态</button>
      <button class="tb run" id="btAC" title="交流扫描（波特图）">▶ 交流扫描</button>
      <button class="tb stop" id="btStop" title="停止仿真">■ 停止</button>
    </div>
    <div class="tbgrp">
      <button class="tb" id="btScope" title="示波器窗口">📈 示波器</button>
      <button class="tb" id="btBode" title="波特图仪窗口">📉 波特图</button>
    </div>
    <div class="tbgrp">
      <button class="tb on" id="btGrid" title="显示网格">▦</button>
      <button class="tb on" id="btNet" title="网络着色">🎨</button>
      <button class="tb on" id="btHeat" title="节点电压热度图">🌡</button>
      <button class="tb on" id="btAnim" title="电流流动动画">💫</button>
      <button class="tb" id="btFit" title="缩放适应">⤢ 适应</button>
    </div>
    <div class="tbgrp">
      <select class="tb" id="selEx" title="加载内置示例电路">
        <option value="">— 示例电路 —</option>
      </select>
    </div>
  </div>

  <div id="main">
    <div id="lib"></div>
    <div id="cwrap">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
    </div>
    <div id="side"></div>
  </div>
  <div id="statbar">
    <span>坐标 <b id="stXY">0,0</b></span><span>缩放 <b id="stZoom">100%</b></span>
    <span>元件 <b id="stCnt">0</b></span><span>节点 <b id="stNode">0</b></span>
    <span>状态 <b id="stSim">就绪</b></span><span id="stMsg"></span>
  </div>
</div>

<!-- ===================== 示波器 ===================== -->
<div class="win" id="winScope" style="left:300px;top:110px;width:790px;height:452px">
  <div class="winbar"><b>📈 双通道示波器 · Oscilloscope</b>
    <span><button class="wb" data-act="close" data-win="winScope">✕</button></span></div>
  <div class="winbody">
    <div class="instr"><canvas class="plot" id="scCv"></canvas>
      <div class="rd" id="scRd">等待瞬态分析数据…</div></div>
    <div class="ctrl">
      <h5>时基 TIME BASE</h5>
      <div class="knobrow"><div class="knob" id="kTime"></div>
        <div class="kinfo">时间/格<b id="vTime">1 ms</b>10 格 = <span id="vTimeAll">10 ms</span></div></div>
      <div class="knobrow"><div class="knob" id="kPos"></div>
        <div class="kinfo">水平位置<b id="vPos">0 s</b></div></div>
      <h5><span class="chip" style="background:var(--chA)"></span>通道 A</h5>
      <div class="knobrow"><div class="knob" id="kVA"></div>
        <div class="kinfo">电压/格<b id="vVA">1 V</b><span id="srcA">—</span></div></div>
      <div class="knobrow"><div class="knob" id="kOA"></div>
        <div class="kinfo">垂直偏移<b id="vOA">0 div</b></div></div>
      <h5><span class="chip" style="background:var(--chB)"></span>通道 B</h5>
      <div class="knobrow"><div class="knob" id="kVB"></div>
        <div class="kinfo">电压/格<b id="vVB">1 V</b><span id="srcB">—</span></div></div>
      <div class="knobrow"><div class="knob" id="kOB"></div>
        <div class="kinfo">垂直偏移<b id="vOB">0 div</b></div></div>
      <h5>触发 TRIGGER</h5>
      <div class="knobrow"><div class="knob" id="kTrig"></div>
        <div class="kinfo">触发电平<b id="vTrig">0 V</b></div></div>
      <div class="btnrow"><button id="scEdge">↑ 上升沿</button><button id="scMode">自动</button></div>
      <h5>操作</h5>
      <div class="btnrow"><button id="scCur">游标</button><button id="scCsv">导出CSV</button>
        <button id="scClr">清屏</button></div>
    </div>
  </div>
  <div class="winrz" data-win="winScope"></div>
</div>

<!-- ===================== 波特图仪 ===================== -->
<div class="win" id="winBode" style="left:340px;top:150px;width:800px;height:462px">
  <div class="winbar"><b>📉 波特图仪 · Bode Plotter（幅频 / 相频）</b>
    <span><button class="wb" data-act="close" data-win="winBode">✕</button></span></div>
  <div class="winbody">
    <div class="instr"><canvas class="plot" id="bdCv"></canvas>
      <div class="rd" id="bdRd">等待交流扫描数据…</div></div>
    <div class="ctrl">
      <h5>扫描设置 SWEEP</h5>
      <div class="prow"><label>起始频率</label><input type="text" id="acF1" value="1"><span class="u">Hz</span></div>
      <div class="prow"><label>终止频率</label><input type="text" id="acF2" value="10meg"><span class="u">Hz</span></div>
      <div class="prow"><label>点/十倍频</label><input type="number" id="acPts" value="30" min="5" max="400"></div>
      <div class="prow"><label>纵轴</label><select id="acScale">
        <option value="db">幅度 dB</option><option value="lin">幅度 线性</option></select></div>
      <div class="btnrow"><button id="bdRun">▶ 运行扫描</button></div>
      <h5>显示</h5>
      <div class="btnrow"><button id="bdMag" class="on">幅频</button><button id="bdPh" class="on">相频</button>
        <button id="bdCur">游标</button></div>
      <div class="btnrow"><button id="bdCsv">导出CSV</button><button id="bdAuto" class="on">自动纵轴</button></div>
      <h5>测量结果</h5>
      <div class="rd" id="bdMeas">—</div>
    </div>
  </div>
  <div class="winrz" data-win="winBode"></div>
</div>

<div id="mask"><div id="dlg"><div id="dlgt">参数</div><div id="dlgb"></div>
  <div id="dlgf"><button id="dlgCancel">取消</button><button class="pri" id="dlgOK">确定</button></div></div></div>
<div id="menu"></div><div id="toast"></div>
<input type="file" id="fileIn" accept=".json,.txt" style="display:none">

<script>
'use strict';
/* ==========================================================================================
 *  WebSPICE —— 纯单文件网页版 SPICE 电路仿真器
 *  算法总览：
 *    Schematic（图数据） → Netlist（并查集提取网络） → MNA（改进节点分析）
 *    → 线性：LU 分解（部分选主元）  → 非线性：Newton-Raphson（pn 结限步 + gmin 步进）
 *    → 瞬态：梯形/后向欧拉伴随模型 + 可变步长（LTE 预估拒步）
 *    → 交流：直流工作点线性化 → 复数 MNA 对数频率扫描
 * ========================================================================================== */

/*==CORE-BEGIN==*/ /* 以下核心区不依赖任何 DOM，可独立在 Node 中做数值自检 */

/* ------------------------------------------------------------------ 物理常数 */
const K_B   = 1.380649e-23;      // 玻尔兹曼常数 J/K
const Q_E   = 1.602176634e-19;   // 电子电荷 C
const T_NOM = 300.15;            // 标称温度 300K（27℃）
// 热电压 Vt = kT/q ≈ 25.85 mV @300K —— 半导体中一切指数关系的尺度因子
const VT    = K_B * T_NOM / Q_E;
const GMIN_DEF = 1e-12;          // 最小并联电导，防止节点悬浮导致矩阵奇异
const GSHUNT   = 1e-12;          // 每个节点对地的极小分流（1 TΩ），保证矩阵非奇异
const MAXITER  = 100;            // 牛顿迭代上限
const RELTOL = 1e-3, VNTOL = 1e-6, ABSTOL = 1e-12; // SPICE 风格收敛容差

/* ------------------------------------------------------------------ 通用工具 */
const SUF = {t:1e12,g:1e9,k:1e3,m:1e-3,u:1e-6,µ:1e-6,n:1e-9,p:1e-12,a:1e-18};
/** 解析工程记数法字符串：'4k7'不支持，'1k','2.2u','1meg','10nF','1e3' 均支持 */
function parseVal(s, dflt){
  if(dflt===undefined) dflt = 0;
  if(typeof s === 'number') return isFinite(s) ? s : dflt;
  if(s === null || s === undefined) return dflt;
  let t = String(s).trim().replace(/[Ω欧姆秒]/g,'').replace(/,/g,'');
  if(t === '') return dflt;
  const m = /^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\s*([a-zA-ZµΩ%]*)$/.exec(t);
  if(!m) { const v = parseFloat(t); return isFinite(v) ? v : dflt; }
  let v = parseFloat(m[1]); const suf = (m[2]||'').toLowerCase();
  if(suf.startsWith('meg')) v *= 1e6;
  else if(suf === '%') v *= 0.01;
  // 单个 f/h/v/a/s/w 视为单位（法拉/亨利/伏/安/秒/瓦）而非 femto
  else if(/^(f|h|v|a|s|w|hz|f\b)/.test(suf) && suf.length<=3 && !SUF[suf[0]]) v *= 1;
  else if(suf[0] === 'f') v *= 1e-15;
  else if(SUF[suf[0]] !== undefined) v *= SUF[suf[0]];
  return isFinite(v) ? v : dflt;
}
/** 工程记数法格式化，用于界面显示 */
function fmtEng(v, unit, digits){
  if(unit===undefined) unit='';
  if(digits===undefined) digits=4;
  if(v === undefined || v === null || !isFinite(v)) return '—';
  if(v === 0) return '0 ' + unit;
  const a = Math.abs(v);
  const tb = [[1e12,'T'],[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f']];
  for(let i=0;i<tb.length;i++){
    if(a >= tb[i][0]*0.999){
      let x = v/tb[i][0], s = x.toPrecision(digits);
      if(s.indexOf('e')<0 && s.indexOf('.')>=0) s = s.replace(/0+$/,'').replace(/\.$/,'');
      return s + ' ' + tb[i][1] + unit;
    }
  }
  return v.toExponential(2) + ' ' + unit;
}
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
/** 指数函数保护：> 40 之后线性延伸，避免溢出且导数连续（数值稳定性） */
function safeExp(x){
  if(x > 40){ const e = Math.exp(40); return e*(1 + (x-40)); } // 一阶线性延伸
  return Math.exp(x);
}
/** SPICE pn 结限步（pnjlim）：抑制指数元件牛顿迭代发散 */
function pnjlim(vnew, vold, vt, vcrit, flag){
  if(vnew > vcrit && Math.abs(vnew - vold) > 2*vt){
    if(vold > 0){
      const arg = 1 + (vnew - vold)/vt;
      vnew = arg > 0 ? vold + vt*Math.log(arg) : vcrit;
    } else {
      vnew = vnew > 0 ? vt*Math.log(Math.max(vnew/vt, 1.0000001)) : vcrit;
    }
    flag.lim = true;
  }
  return vnew;
}
/** MOS 栅压限步（fetlim） */
function fetlim(vnew, vold, vto, flag){
  const vtsthi = Math.abs(2*(vold - vto)) + 2, vtstlo = Math.max(vtsthi/2, 2);
  const vtox = vto + 3.5, delv = vnew - vold;
  if(vold >= vto){
    if(vold >= vtox){
      if(delv <= 0){ if(vnew >= vtox){ if(-delv > vtstlo){ vnew = vold - vtstlo; flag.lim=true; } }
        else { vnew = Math.max(vnew, vto+2); flag.lim=true; } }
      else if(delv > vtsthi){ vnew = vold + vtsthi; flag.lim=true; }
    } else if(delv > 0){ if(delv > vtsthi){ vnew = vold + vtsthi; flag.lim=true; } }
    else if(vnew <= vto){ /* 进入截止，允许 */ }
  } else if(delv > 0 && vnew > vtox){ vnew = vtox; flag.lim=true; }
  return vnew;
}

/* ================================================================== 线性代数
 * 稠密实数矩阵 + LU 分解（部分选主元），用于 MNA 方程 A·x = b
 * addA/addB 的第 4/3 个参数（虚部）在实数矩阵中被忽略，
 * 这样同一份 stamp() 代码既能盖印实数矩阵（DC/瞬态）也能盖印复数矩阵（AC）。
 * ================================================================== */
class Mat{
  constructor(n){ this.n=n; this.a=new Float64Array(n*n); this.b=new Float64Array(n);
    this.x=new Float64Array(n); this.lu=new Float64Array(n*n); this.piv=new Int32Array(n); this.cplx=false; }
  clear(){ this.a.fill(0); this.b.fill(0); }
  addA(i,j,re){ if(i<0||j<0) return; this.a[i*this.n+j] += re; }
  addB(i,re){ if(i<0) return; this.b[i] += re; }
  solve(){
    const n=this.n, a=this.lu, piv=this.piv; a.set(this.a);
    for(let i=0;i<n;i++) piv[i]=i;
    for(let k=0;k<n;k++){
      let p=k, mx=Math.abs(a[k*n+k]);
      for(let i=k+1;i<n;i++){ const v=Math.abs(a[i*n+k]); if(v>mx){ mx=v; p=i; } }
      if(mx < 1e-300) return false;                       // 奇异矩阵
      if(p!==k){ for(let j=0;j<n;j++){ const t=a[k*n+j]; a[k*n+j]=a[p*n+j]; a[p*n+j]=t; }
        const t=piv[k]; piv[k]=piv[p]; piv[p]=t; }
      const d=a[k*n+k];
      for(let i=k+1;i<n;i++){
        const f=a[i*n+k]/d; if(f===0) continue; a[i*n+k]=f;
        for(let j=k+1;j<n;j++) a[i*n+j] -= f*a[k*n+j];
      }
    }
    const x=this.x, b=this.b;
    for(let i=0;i<n;i++){ let s=b[piv[i]]; for(let j=0;j<i;j++) s -= a[i*n+j]*x[j]; x[i]=s; }
    for(let i=n-1;i>=0;i--){ let s=x[i]; for(let j=i+1;j<n;j++) s -= a[i*n+j]*x[j]; x[i]=s/a[i*n+i]; }
    for(let i=0;i<n;i++) if(!isFinite(x[i])) return false;
    return true;
  }
}
/** 复数稠密矩阵（交流小信号分析用），实部/虚部分开存储 */
class CMat{
  constructor(n){ this.n=n; this.ar=new Float64Array(n*n); this.ai=new Float64Array(n*n);
    this.br=new Float64Array(n); this.bi=new Float64Array(n);
    this.xr=new Float64Array(n); this.xi=new Float64Array(n); this.cplx=true; }
  clear(){ this.ar.fill(0); this.ai.fill(0); this.br.fill(0); this.bi.fill(0); }
  addA(i,j,re,im){ if(i<0||j<0) return; const k=i*this.n+j; this.ar[k]+=re; if(im) this.ai[k]+=im; }
  addB(i,re,im){ if(i<0) return; this.br[i]+=re; if(im) this.bi[i]+=im; }
  solve(){
    const n=this.n, ar=Float64Array.from(this.ar), ai=Float64Array.from(this.ai);
    const br=Float64Array.from(this.br), bi=Float64Array.from(this.bi);
    for(let k=0;k<n;k++){
      let p=k, mx=Math.hypot(ar[k*n+k],ai[k*n+k]);
      for(let i=k+1;i<n;i++){ const v=Math.hypot(ar[i*n+k],ai[i*n+k]); if(v>mx){mx=v;p=i;} }
      if(mx<1e-300) return false;
      if(p!==k){ for(let j=0;j<n;j++){ let t=ar[k*n+j];ar[k*n+j]=ar[p*n+j];ar[p*n+j]=t;
          t=ai[k*n+j];ai[k*n+j]=ai[p*n+j];ai[p*n+j]=t; }
        let t=br[k];br[k]=br[p];br[p]=t; t=bi[k];bi[k]=bi[p];bi[p]=t; }
      const dr=ar[k*n+k], di=ai[k*n+k], dd=dr*dr+di*di;
      for(let i=k+1;i<n;i++){
        const nr=ar[i*n+k], ni=ai[i*n+k]; if(nr===0&&ni===0) continue;
        const fr=(nr*dr+ni*di)/dd, fi=(ni*dr-nr*di)/dd;      // f = a[i][k]/a[k][k]
        ar[i*n+k]=0; ai[i*n+k]=0;
        for(let j=k+1;j<n;j++){
          const xr=ar[k*n+j], xi=ai[k*n+j];
          ar[i*n+j] -= fr*xr - fi*xi; ai[i*n+j] -= fr*xi + fi*xr;
        }
        br[i] -= fr*br[k] - fi*bi[k]; bi[i] -= fr*bi[k] + fi*br[k];
      }
    }
    for(let i=n-1;i>=0;i--){
      let sr=br[i], si=bi[i];
      for(let j=i+1;j<n;j++){ sr -= ar[i*n+j]*this.xr[j] - ai[i*n+j]*this.xi[j];
        si -= ar[i*n+j]*this.xi[j] + ai[i*n+j]*this.xr[j]; }
      const dr=ar[i*n+i], di=ai[i*n+i], dd=dr*dr+di*di;
      this.xr[i]=(sr*dr+si*di)/dd; this.xi[i]=(si*dr-sr*di)/dd;
      if(!isFinite(this.xr[i])||!isFinite(this.xi[i])) return false;
    }
    return true;
  }
}

/* ------------------------------------------------------------------ 盖印(stamp)基元 */
/** 两节点间盖印复导纳 Y = gre + j·gim（实数矩阵忽略虚部） */
function stampY(m,a,b,gre,gim){
  m.addA(a,a, gre, gim); m.addA(b,b, gre, gim);
  m.addA(a,b,-gre,-gim); m.addA(b,a,-gre,-gim);
}
/** 盖印电流源：电流 i 在元件内部由 a 流向 b（即从 a 节点抽走） */
function stampI(m,a,b,ire,iim){
  m.addB(a,-ire, iim===undefined?undefined:-iim); m.addB(b, ire, iim);
}
/** 盖印受控/独立电压源支路：V(p)-V(n) = val，支路电流 k 由 p 流入元件 */
function stampVSrc(m,p,n,k,val,imag){
  m.addA(p,k, 1); m.addA(n,k,-1);
  m.addA(k,p, 1); m.addA(k,n,-1);
  m.addB(k, val, imag);
}
/** 多端非线性器件线性化盖印：I[k] 为流入端子 k 的电流，J[k][j]=dI[k]/dV[j] */
function stampNL(m, nodes, V, I, J){
  const N = nodes.length;
  for(let k=0;k<N;k++){
    let rhs = -I[k];
    for(let j=0;j<N;j++){ const g=J[k][j]; if(!g) continue; m.addA(nodes[k],nodes[j],g); rhs += g*V[j]; }
    m.addB(nodes[k], rhs);
  }
}
/** 线性电容的伴随模型（companion model）——把 i=C·dv/dt 离散成 电导‖电流源
 *  后向欧拉： i(n+1) = C/h·[v(n+1)-v(n)]           → Geq=C/h,    Ieq=Geq·v(n)
 *  梯形法：   i(n+1) = 2C/h·[v(n+1)-v(n)] - i(n)   → Geq=2C/h,   Ieq=Geq·v(n)+i(n)
 *  梯形法是二阶精度、A 稳定，是 SPICE 默认积分法。 */
function stampCap(m, ctx, a, b, C, st){
  if(!(C>0)) return;
  if(ctx.mode === 'ac'){ stampY(m,a,b,0, ctx.w*C); return; }
  if(ctx.mode === 'dc'){ st.geq=0; st.ieq=0; return; }      // 直流：电容开路
  let geq, ieq;
  if(ctx.trap){ geq = 2*C/ctx.h; ieq = geq*st.v + st.i; }
  else        { geq =   C/ctx.h; ieq = geq*st.v; }
  st.geq=geq; st.ieq=ieq;
  stampY(m,a,b,geq,0);
  m.addB(a, ieq); m.addB(b,-ieq);
}
/** 电容状态推进：记录本步电压与电流，供下一步伴随模型使用 */
function acceptCap(ctx, a, b, st, xv){
  const v = xv(a) - xv(b);
  if(ctx.mode === 'tran') st.i = st.geq*v - st.ieq; else st.i = 0;
  st.v = v;
}
/* ================================================================== 元件框架
 *  每个元件类型 = 一个描述对象：几何(pins/bb) + 符号绘制(draw) + 物理盖印(stamp)
 *  stamp(c, m, ctx) 中 ctx.mode ∈ {dc, tran, ac}，同一份代码服务三种分析。
 * ================================================================== */
const GRID = 10;                 // 栅格（世界坐标单位）
const COMP = {};                 // 元件注册表
const CATS = [['passive','无源元件'],['source','电源'],['semi','半导体'],['opamp','运算放大器'],
              ['digital','数字/定时'],['meter','测量仪器']];
function defComp(type, d){
  d.type = type; d.pins = d.pins||[]; d.props = d.props||[]; d.propDef = {};
  for(let i=0;i<d.props.length;i++) d.propDef[d.props[i].k] = d.props[i].def;
  d.extraNodes = d.extraNodes || null; d.extraBranches = d.extraBranches || null;
  d.cat = d.cat || 'passive'; d.prefix = d.prefix || 'X';
  if(!d.bb){ let x1=-20,y1=-12,x2=20,y2=12;
    for(let i=0;i<d.pins.length;i++){ const p=d.pins[i];
      x1=Math.min(x1,p.x); y1=Math.min(y1,p.y); x2=Math.max(x2,p.x); y2=Math.max(y2,p.y); }
    d.bb=[x1-4,y1-4,x2+4,y2+4]; }
  COMP[type]=d; return d;
}
/** 取数值型参数（带缓存，避免牛顿迭代中反复解析字符串） */
function pv(c,k){
  const cc = c._pv || (c._pv = {});
  let v = cc[k];
  if(v === undefined){
    const dd = COMP[c.type].propDef[k];
    const raw = (c.props && c.props[k] !== undefined && c.props[k] !== '') ? c.props[k] : dd;
    v = cc[k] = parseVal(raw, parseVal(dd,0));
  }
  return v;
}
/** 取字符串型参数 */
function ps(c,k){
  const dd = COMP[c.type].propDef[k];
  const v = c.props ? c.props[k] : undefined;
  return (v === undefined || v === '') ? dd : v;
}
/** 取器件模型参数集（型号库 + 实例覆盖） */
function mdl(c){
  if(c._mdl) return c._mdl;
  const m = Object.assign({}, MODELS[ps(c,'model')] || {});
  const pl = COMP[c.type].props;
  for(let i=0;i<pl.length;i++){ const p=pl[i];
    if(p.mdl && c.props && c.props[p.k]!==undefined && c.props[p.k]!=='') m[p.k]=parseVal(c.props[p.k]); }
  return c._mdl = m;
}
function invalidateComp(c){ c._pv=null; c._mdl=null; }

/* ------------------------------------------------------------------ 绘图基元 */
function ln(g,x1,y1,x2,y2){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
function poly(g,p,close,fill){ g.beginPath(); g.moveTo(p[0],p[1]);
  for(let i=2;i<p.length;i+=2) g.lineTo(p[i],p[i+1]);
  if(close) g.closePath(); if(fill){ g.fillStyle=fill; g.fill(); } g.stroke(); }
function circ(g,x,y,r,fill){ g.beginPath(); g.arc(x,y,r,0,6.2832);
  if(fill){ g.fillStyle=fill; g.fill(); } g.stroke(); }
function arrowH(g,x,y,dx,dy,s,fill){        // 箭头（dx,dy 为单位方向）
  const px=-dy, py=dx;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x-dx*s+px*s*0.5, y-dy*s+py*s*0.5);
  g.lineTo(x-dx*s-px*s*0.5, y-dy*s-py*s*0.5); g.closePath();
  g.fillStyle=fill||g.strokeStyle; g.fill();
}
function txt(g,s,x,y,size,col,al){ g.save(); g.fillStyle=col||g.strokeStyle;
  g.font=(size||9)+'px Consolas,monospace'; g.textAlign=al||'center'; g.textBaseline='middle';
  g.fillText(s,x,y); g.restore(); }

/* ============================== 无源元件 ============================== */
defComp('R',{ cat:'passive', name:'电阻', prefix:'R', ico:'R',
  pins:[{n:'1',x:-30,y:0},{n:'2',x:30,y:0}],
  props:[{k:'r',label:'阻值',unit:'Ω',def:'1k'},{k:'tol',label:'容差',unit:'%',def:'5'}],
  lab:c=>[c.name, fmtEng(pv(c,'r'),'Ω',3)],
  draw(g,c){ ln(g,-30,0,-18,0); ln(g,18,0,30,0);
    // ANSI 折线电阻符号
    poly(g,[-18,0,-15,-7,-9,7,-3,-7,3,7,9,-7,15,7,18,0]); },
  stamp(c,m,ctx){ const g=1/Math.max(pv(c,'r'),1e-9); stampY(m,c.ni[0],c.ni[1],g,0); },
  currents(c,ctx){ const g=1/Math.max(pv(c,'r'),1e-9);
    const i=(ctx.xv(c.ni[0])-ctx.xv(c.ni[1]))*g; return [i,-i]; }
});
defComp('C',{ cat:'passive', name:'电容', prefix:'C',
  pins:[{n:'1',x:-30,y:0},{n:'2',x:30,y:0}],
  props:[{k:'c',label:'容值',unit:'F',def:'100n'},{k:'ic',label:'初始电压',unit:'V',def:'0'},
         {k:'pol',label:'电解电容',type:'bool',def:'0'}],
  lab:c=>[c.name, fmtEng(pv(c,'c'),'F',3)],
  initState:()=>({v:0,i:0,geq:0,ieq:0}),
  draw(g,c){ ln(g,-30,0,-4,0); ln(g,4,0,30,0); ln(g,-4,-12,-4,12);
    if(pv(c,'pol')>0.5){ g.beginPath(); g.arc(14,0,10,2.35,3.93); g.stroke();  // 电解：弧形负极板
      txt(g,'+',-12,-11,10); }
    else ln(g,4,-12,4,12); },
  stamp(c,m,ctx){ stampCap(m,ctx,c.ni[0],c.ni[1],pv(c,'c'),c.st); },
  accept(c,ctx){ acceptCap(ctx,c.ni[0],c.ni[1],c.st,ctx.xv); },
  currents(c,ctx){ if(ctx.mode!=='tran') return [0,0];
    const i=c.st.geq*(ctx.xv(c.ni[0])-ctx.xv(c.ni[1]))-c.st.ieq; return [i,-i]; }
});
defComp('L',{ cat:'passive', name:'电感', prefix:'L',
  pins:[{n:'1',x:-30,y:0},{n:'2',x:30,y:0}],
  props:[{k:'l',label:'感值',unit:'H',def:'1m'},{k:'rs',label:'串联电阻',unit:'Ω',def:'0.01'},
         {k:'ic',label:'初始电流',unit:'A',def:'0'}],
  lab:c=>[c.name, fmtEng(pv(c,'l'),'H',3)],
  extraBranches:()=>1, initState:()=>({i:0,v:0}),
  draw(g,c){ ln(g,-30,0,-18,0); ln(g,18,0,30,0);
    g.beginPath();                              // 四个半圆弧（IEC 电感）
    for(let i=0;i<4;i++){ const x=-18+i*9; g.arc(x+4.5,0,4.5,Math.PI,0,false); }
    g.stroke(); },
  stamp(c,m,ctx){
    const L=Math.max(pv(c,'l'),1e-15), rs=Math.max(pv(c,'rs'),0), a=c.ni[0], b=c.ni[1], k=c.bi[0];
    m.addA(a,k,1); m.addA(b,k,-1); m.addA(k,a,1); m.addA(k,b,-1);
    if(ctx.mode==='ac'){ m.addA(k,k,-rs,-ctx.w*L); }               // v = (Rs + jωL)·i
    else if(ctx.mode==='dc'){ m.addA(k,k,-rs); }                   // 直流：短路（仅 Rs）
    else {  // v = Rs·i + L·di/dt 的梯形/后向欧拉离散
      const gl = ctx.trap ? 2*L/ctx.h : L/ctx.h;
      m.addA(k,k,-(rs+gl));
      m.addB(k, ctx.trap ? (-(gl-rs)*c.st.i - c.st.v) : (-gl*c.st.i));
    }
  },
  accept(c,ctx){ c.st.i=ctx.xv(c.bi[0]); c.st.v=ctx.xv(c.ni[0])-ctx.xv(c.ni[1]); },
  currents(c,ctx){ const i=ctx.xv(c.bi[0]); return [i,-i]; }
});
defComp('SW',{ cat:'passive', name:'开关', prefix:'S',
  pins:[{n:'1',x:-30,y:0},{n:'2',x:30,y:0}],
  props:[{k:'on',label:'闭合',type:'bool',def:'0'},{k:'ron',label:'导通电阻',unit:'Ω',def:'0.01'},
         {k:'roff',label:'断开电阻',unit:'Ω',def:'1G'},{k:'key',label:'快捷键',type:'text',def:'A'}],
  lab:c=>[c.name, pv(c,'on')>0.5?'闭合':'断开'],
  draw(g,c){ const on=pv(c,'on')>0.5;
    ln(g,-30,0,-13,0); ln(g,13,0,30,0);
    circ(g,-13,0,2.5,'#1b2129'); circ(g,13,0,2.5,'#1b2129');
    if(on) ln(g,-13,0,13,0); else ln(g,-13,0,11,-13);
    if(!on){ g.save(); g.strokeStyle='#7e8c9a'; g.setLineDash([2,2]); ln(g,-13,0,13,0); g.restore(); } },
  stamp(c,m,ctx){ const g=1/Math.max(pv(c,'on')>0.5?pv(c,'ron'):pv(c,'roff'),1e-9);
    stampY(m,c.ni[0],c.ni[1],g,0); },
  currents(c,ctx){ const g=1/Math.max(pv(c,'on')>0.5?pv(c,'ron'):pv(c,'roff'),1e-9);
    const i=(ctx.xv(c.ni[0])-ctx.xv(c.ni[1]))*g; return [i,-i]; }
});
defComp('POT',{ cat:'passive', name:'电位器', prefix:'RP',
  pins:[{n:'1',x:-30,y:0},{n:'2',x:30,y:0},{n:'W',x:0,y:-30}],
  props:[{k:'r',label:'总阻值',unit:'Ω',def:'10k'},{k:'pos',label:'位置',type:'range',def:'0.5'}],
  lab:c=>[c.name, fmtEng(pv(c,'r'),'Ω',3)+' '+Math.round(pv(c,'pos')*100)+'%'],
  draw(g,c){ ln(g,-30,0,-18,0); ln(g,18,0,30,0);
    poly(g,[-18,0,-15,-7,-9,7,-3,-7,3,7,9,-7,15,7,18,0]);
    const x=-18+36*clamp(pv(c,'pos'),0,1);      // 滑动端箭头
    ln(g,0,-30,0,-20); ln(g,0,-20,x,-13); arrowH(g,x,-11,0,1,7); },
  stamp(c,m,ctx){
    const R=Math.max(pv(c,'r'),1), p=clamp(pv(c,'pos'),0.001,0.999);
    stampY(m,c.ni[0],c.ni[2],1/(R*p),0);        // 下半段
    stampY(m,c.ni[2],c.ni[1],1/(R*(1-p)),0);    // 上半段
  },
  currents(c,ctx){ const R=Math.max(pv(c,'r'),1), p=clamp(pv(c,'pos'),0.001,0.999);
    const i1=(ctx.xv(c.ni[0])-ctx.xv(c.ni[2]))/(R*p), i2=(ctx.xv(c.ni[2])-ctx.xv(c.ni[1]))/(R*(1-p));
    return [i1,-i2,i2-i1]; }
});

/* ============================== 电源 ============================== */
/** 各类电源的瞬时值 v(t)：用于瞬态分析 */
function srcTran(c,t){
  const ty=c.type;
  if(ty==='VDC') return pv(c,'v');
  const off=pv(c,'off'), amp=pv(c,'amp'), f=Math.max(pv(c,'f'),1e-12);
  const delay = pv(c,'td');
  if(t < delay) return ty==='VSIN' ? off : (ty==='VSQ' ? off-amp : off-amp);
  const tt2=(t-delay)*f + pv(c,'ph')/360;
  const frac=((tt2%1)+1)%1;
  if(ty==='VSIN'){ // 正弦：v = 偏置 + 幅值·sin(2πft+φ)
    return off + amp*Math.sin(2*Math.PI*(t-delay)*f + pv(c,'ph')*Math.PI/180);
  }
  if(ty==='VSQ'){  // 方波：带有限上升/下降时间（利于收敛与真实性）
    const du=clamp(pv(c,'duty')/100,0.001,0.999), tr=Math.max(pv(c,'tr'),1e-12)*f;
    const hi=off+amp, lo=off-amp;
    if(frac < tr) return lo+(hi-lo)*frac/tr;
    if(frac < du) return hi;
    if(frac < du+tr) return hi-(hi-lo)*(frac-du)/tr;
    return lo;
  }
  if(ty==='VTRI'){ // 三角波
    return off + amp*(frac<0.5 ? (-1+4*frac) : (3-4*frac));
  }
  return off;
}
/** 断点：源波形的转折时刻，瞬态求解器在此强制减小步长 */
function srcBreaks(c,t){
  const ty=c.type; if(ty!=='VSQ'&&ty!=='VTRI') return Infinity;
  const f=Math.max(pv(c,'f'),1e-12), T=1/f, td=pv(c,'td');
  if(t<td) return td;
  const du=ty==='VSQ'?clamp(pv(c,'duty')/100,0.001,0.999):0.5;
  const ph=pv(c,'ph')/360, k=Math.floor(((t-td)*f+ph));
  const cand=[];
  for(let i=k-1;i<=k+2;i++){ cand.push(td+(i-ph)/f); cand.push(td+(i+du-ph)/f);
    if(ty==='VSQ') cand.push(td+(i+du-ph)/f+pv(c,'tr')); }
  let best=Infinity;
  for(let i=0;i<cand.length;i++) if(cand[i]>t+1e-18 && cand[i]<best) best=cand[i];
  return best;
}

/** 独立电压源统一盖印：直流/瞬态取实数值，交流取相量（幅值∠相位） */
function stampVsource(c,m,ctx,dcv){
  const p=c.ni[0], n=c.ni[1], k=c.bi[0], rs=Math.max(pv(c,'r'),0);
  let vr=0, vi=0;
  if(ctx.mode==='ac'){
    let a=ps(c,'ac'); a=(a===''||a===undefined)?(c.type==='VDC'?0:pv(c,'amp')):parseVal(a);
    const ph=pv(c,'ph')*Math.PI/180; vr=a*Math.cos(ph); vi=a*Math.sin(ph);
  } else if(ctx.mode==='tran' || ctx.useT) vr=srcTran(c,ctx.t);
  else vr=dcv;
  if(ctx.mode!=='ac' && ctx.k!==1) vr*=ctx.k;    // 源步进（收敛回退策略）用
  stampVSrc(m,p,n,k,vr,vi);
  if(rs>0) m.addA(k,k,-rs);                    // 内阻：V(p)-V(n) - Rs·i = e(t)
}

function stampJ(m,nodes,J){
  for(let k=0;k<nodes.length;k++) for(let j=0;j<nodes.length;j++)
    if(J[k][j]) m.addA(nodes[k],nodes[j],J[k][j]);

/** 二极管盖印：Shockley 方程 + 反向击穿 + 结电容 + 串联电阻（内部节点） */
function diodeStamp(c,m,ctx){
  const md=mdl(c), nA=c.ni[0], nK=c.ni[1];
  const useRs = md.rs>0, mid = useRs ? c.nx[0] : nA;
  if(useRs) stampY(m,nA,mid,1/md.rs,0);          // 体电阻 Rs
  const nvt=md.n*VT, cj=md.cj||0;
  if(ctx.mode==='ac'){
    const g=(c.lin?c.lin.g:GMIN_DEF);
    // 小信号电容 = 结电容 Cj + 扩散电容 τ·gd
    stampY(m,mid,nK,g,ctx.w*(cj+(md.tt||0)*g));
    return;
  }
  let vd = ctx.xv(mid)-ctx.xv(nK);
  const vcrit = nvt*Math.log(nvt/(Math.SQRT2*Math.max(md.is,1e-30)));
  vd = pnjlim(vd, c.it.vd, nvt, vcrit, ctx.flag); c.it.vd = vd;
  // ★ 肖克利方程：I = Is·(exp(V/(n·Vt)) − 1)，Vt=kT/q≈25.85mV
  //   微分电导 gd = dI/dV = Is/(n·Vt)·exp(V/(n·Vt))，即牛顿迭代的雅可比
  const e = safeExp(vd/nvt);
  let id = md.is*(e-1) + ctx.gmin*vd;            // 加 gmin·V：反偏时提供 1TΩ 通路
  let gd = md.is*e/nvt + ctx.gmin;
  if(md.bv && md.bv<1e4){                        // ★ 反向击穿（稳压二极管工作区）
    const nbv=(md.nbv||1)*VT;
    const ib=(md.ibv||1e-7)*safeExp((-vd-md.bv)/nbv);
    id -= ib; gd += ib/nbv;
  }
  c.lin={g:gd,id:id,vd:vd};
  stampNL(m,[mid,nK],[vd,0],[id,-id],[[gd,-gd],[-gd,gd]]);
  stampCap(m,ctx,mid,nK,cj,c.st);                // 结电容（瞬态用伴随模型）
}

/* ============================== BJT 三极管 ==============================
 * ★ Ebers-Moll 传输形式（含 Early 效应）：
 *   If = Is·(exp(Vbe/(NF·Vt))−1)      正向注入
 *   Ir = Is·(exp(Vbc/(NR·Vt))−1)      反向注入
 *   Ict = (If−Ir)·(1−Vbc/VAF)         传输电流（基区宽度调制 → 输出电阻有限）
 *   Ib  = If/BF + Ir/BR               两个结的复合电流
 *   由 Vbe/Vbc 的符号自然区分：截止区 / 正向有源 / 反向有源 / 饱和区
 * ====================================================================== */
function bjtStamp(c,m,ctx){
  const md=mdl(c), pol = md.pnp?-1:1;
  const nC=c.ni[0], nB=c.ni[1], nE=c.ni[2];
  const cje=md.cje||0, cjc=md.cjc||0;
  if(ctx.mode==='ac'){
    if(c.lin) stampJ(m,[nC,nB,nE],c.lin.J);
    // ★ 密勒效应：Cbc 跨接输入输出，等效输入电容 = Cbc·(1+|Av|)，限制高频增益
    stampY(m,nB,nC,0,ctx.w*cjc);
    stampY(m,nB,nE,0,ctx.w*(cje+(md.tf||0)*(c.lin?c.lin.gif:0)));
    return;
  }
  const nvtF=(md.nf||1)*VT, nvtR=(md.nr||1)*VT, is=Math.max(md.is,1e-30);
  let vbe = pol*(ctx.xv(nB)-ctx.xv(nE)), vbc = pol*(ctx.xv(nB)-ctx.xv(nC));
  const vcrit = nvtF*Math.log(nvtF/(Math.SQRT2*is));
  vbe = pnjlim(vbe, c.it.vbe, nvtF, vcrit, ctx.flag);
  vbc = pnjlim(vbc, c.it.vbc, nvtR, vcrit, ctx.flag);
  c.it.vbe=vbe; c.it.vbc=vbc;
  const ef=safeExp(vbe/nvtF), er=safeExp(vbc/nvtR);
  const If=is*(ef-1), Ir=is*(er-1);
  const gif=is*ef/nvtF, gir=is*er/nvtR;
  const vaf=md.vaf>0?md.vaf:0;
  const q = vaf ? (1 - vbc/vaf) : 1;             // Early 因子
  const Ict=(If-Ir)*q, Ibe=If/md.bf, Ibc=Ir/md.br;
  let ic = Ict - Ibc;                            // 集电极：传输电流 − BC 结复合电流
  let ib = Ibe + Ibc;
  // gmin：在两个结上并联 1TΩ，保证截止时矩阵非奇异
  ic += ctx.gmin*(-vbc); ib += ctx.gmin*(vbe+vbc);
  let ie = -(ic+ib);
  const dIct_du = gif*q, dIct_dw = -gir*q - (vaf?(If-Ir)/vaf:0);
  const gpi = gif/md.bf + ctx.gmin, gmu = gir/md.br + ctx.gmin;
  // 以 u=Vbe=vB−vE, w=Vbc=vB−vC 为中间变量展开 3×3 雅可比
  const dic_du=dIct_du, dic_dw=dIct_dw-gmu;
  const dib_du=gpi, dib_dw=gmu;
  const J=[
    [-dic_dw, dic_du+dic_dw, -dic_du],           // ∂Ic/∂(vC,vB,vE)
    [-dib_dw, dib_du+dib_dw, -dib_du],           // ∂Ib/∂(vC,vB,vE)
    [0,0,0]];
  J[2]=[-(J[0][0]+J[1][0]), -(J[0][1]+J[1][1]), -(J[0][2]+J[1][2])];
  const I=[pol*ic, pol*ib, pol*ie];
  const V=[-pol*vbc, 0, -pol*vbe];               // 与限步后电压一致的任意等效端电压
  c.lin={J:J, I:I, gif:gif, vbe:vbe, vbc:vbc, gm:dIct_du,
         mode:(vbe>0.35&&vbc<0.25)?'放大':(vbe<=0.35&&vbc<=0.25?'截止':'饱和')};
  stampNL(m,[nC,nB,nE],V,I,J);
  stampCap(m,ctx,nB,nE,cje,c.st.be);
  stampCap(m,ctx,nB,nC,cjc,c.st.bc);
}

/* ============================== MOSFET ==============================
 * ★ Level-1 Shichman-Hodges 模型：
 *   截止区   Vgs≤Vth        : Id=0
 *   线性区   Vds<Vgs−Vth    : Id=β[(Vgs−Vth)Vds − Vds²/2](1+λVds)
 *   饱和区   Vds≥Vgs−Vth    : Id=(β/2)(Vgs−Vth)²(1+λVds)
 *   并含衬底寄生二极管（S→D）与 Cgs/Cgd（Cgd 产生密勒效应）
 * ==================================================================== */
function mosStamp(c,m,ctx){
  const md=mdl(c), pol=md.pmos?-1:1;
  const nD=c.ni[0], nG=c.ni[1], nS=c.ni[2];
  const cgs=md.cgs||0, cgd=md.cgd||0;
  if(ctx.mode==='ac'){
    if(c.lin) stampJ(m,c.lin.nodes,c.lin.J);
    stampY(m,nG,nS,0,ctx.w*cgs); stampY(m,nG,nD,0,ctx.w*cgd);
    return;
  }
  const vto=md.vto, beta=md.kp, lam=md.lam||0;
  let vgs=pol*(ctx.xv(nG)-ctx.xv(nS)), vds=pol*(ctx.xv(nD)-ctx.xv(nS));
  let d=nD, s=nS, swap=false;
  if(vds<0){ swap=true; d=nS; s=nD; vgs=vgs-vds; vds=-vds; }  // 源漏互换（结构对称）
  vgs=fetlim(vgs,c.it.vgs,vto,ctx.flag); c.it.vgs=vgs;
  const vov=vgs-vto;
  let id=0,gm=0,gds=0;
  if(vov<=0){ gds=ctx.gmin; id=gds*vds; }                     // 截止区
  else if(vds<vov){                                           // 线性区
    id=beta*(vov*vds-0.5*vds*vds)*(1+lam*vds);
    gm=beta*vds*(1+lam*vds);
    gds=beta*(vov-vds)*(1+lam*vds)+beta*(vov*vds-0.5*vds*vds)*lam+ctx.gmin;
  } else {                                                    // 饱和区
    id=0.5*beta*vov*vov*(1+lam*vds);
    gm=beta*vov*(1+lam*vds);
    gds=0.5*beta*vov*vov*lam+ctx.gmin;
  }
  const nodes=[d,nG,s];
  const J=[[gds,gm,-(gm+gds)],[0,0,0],[-gds,-gm,gm+gds]];
  const I=[pol*id,0,-pol*id];
  const V=[pol*vds,pol*vgs,0];
  c.lin={J:J,nodes:nodes,gm:gm,gds:gds,id:id,vgs:vgs,vds:vds,swap:swap,
         mode:vov<=0?'截止':(vds<vov?'线性':'饱和')};
  stampNL(m,nodes,V,I,J);
  // 衬底二极管（源→漏），反向时仅有 gmin
  const bis=md.bis||1e-14, nvtb=VT;
  let vbd=pol*(ctx.xv(nS)-ctx.xv(nD));
  vbd=pnjlim(vbd,c.it.vbd,nvtb,nvtb*Math.log(nvtb/(Math.SQRT2*bis)),ctx.flag); c.it.vbd=vbd;
  const eb=safeExp(vbd/nvtb), ibd=bis*(eb-1)+ctx.gmin*vbd, gbd=bis*eb/nvtb+ctx.gmin;
  stampNL(m,[nS,nD],[pol*vbd,0],[pol*ibd,-pol*ibd],[[gbd,-gbd],[-gbd,gbd]]);
  stampCap(m,ctx,nG,nS,cgs,c.st.gs);
  stampCap(m,ctx,nG,nD,cgd,c.st.gd);
}

/** 软限幅函数 g(u)=u/(1+|u|^p)^(1/p) 及其导数：
 *  |u|<0.8 时 g'≈1（不影响小信号增益），|u|→∞ 时 g→±1（饱和），
 *  处处可微 ⇒ 牛顿迭代友好。p 越大拐点越硬。 */
function softLim(u,p){
  const a=Math.abs(u);
  if(a<1e-12) return [u,1];
  if(a>1e9) return [u>0?1:-1, 0];
  const w=Math.pow(a,p);
  return [u*Math.pow(1+w,-1/p), Math.pow(1+w,-(1+p)/p)];
}
/* ============================== 运算放大器 ==============================
 * ★ 两级宏模型（真实反映增益/带宽/摆率/限幅）：
 *   ① 跨导级：I = Imax·tanh(gm·Vd/Imax) 注入内部节点 n1（tanh 实现电流限幅 → 压摆率）
 *   ② 主极点：R1‖C1，A0=gm·R1，GBW=gm/(2πC1)，fp=GBW/A0
 *   ③ 输出级：单位增益缓冲 + 输出电阻 Ro + 软限幅至 ±(Vcc−1.5V)
 *   负反馈闭环时自动满足"虚短"(V+≈V−，因 A0 极大)与"虚断"(输入电流≈0)
 * ====================================================================== */
function opampStamp(c,m,ctx){
  const md=mdl(c);
  const p=c.ni[0], n=c.ni[1], o=c.ni[2], vp=c.ni[3], vm=c.ni[4], n1=c.nx[0], k=c.bi[0];
  const gm=md.gm, C1=gm/(2*Math.PI*md.gbw), R1=md.a0/gm, Imax=md.sr*C1;
  // 输出限幅电平：由实际电源引脚电压决定
  let vhi=md.vsat, vlo=-md.vsat;
  if(c.supOK){ vhi=ctx.xv(vp)-md.vdrop; vlo=ctx.xv(vm)+md.vdrop;
    if(vhi<vlo+0.2){ vhi=md.vsat; vlo=-md.vsat; } }
  const mid=(vhi+vlo)/2, span=Math.max((vhi-vlo)/2,0.1);
  const v1=ctx.xv(n1);
  const sl=softLim((v1-mid)/span,8);
  const fo=mid+span*sl[0], fp=sl[1];             // 输出软限幅及其导数（近轨才压缩）
  stampY(m,n1,-1,1/R1,0);                        // 主极点电阻
  stampCap(m,ctx,n1,-1,C1,c.st.c1);              // 主极点电容（决定 GBW 与摆率）
  if(ctx.mode==='ac'){
    const gme=c.lin?c.lin.gme:gm, fpp=c.lin?c.lin.fp:1;
    m.addA(n1,p,-gme); m.addA(n1,n,gme);
    m.addA(o,k,1); m.addA(k,o,1); m.addA(k,k,-md.ro); m.addA(k,n1,-fpp);
    return;
  }
  const vd=ctx.xv(p)-ctx.xv(n);
  const sz=softLim(gm*vd/Imax,4);
  const Ign=Imax*sz[0], gme=gm*sz[1];            // 限流后的等效跨导 ⇒ 压摆率 SR=Imax/C1
  c.lin={gme:gme,fp:fp,vd:vd,vo:fo,sat:Math.abs((v1-mid)/span)>0.97};
  // 跨导级：把电流注入 n1（对地参考的宏模型近似）
  m.addA(n1,p,-gme); m.addA(n1,n,gme);
  m.addB(n1, Ign-gme*vd);
  // 输出级支路：V(o) − Ro·i = f(V(n1))
  m.addA(o,k,1); m.addA(k,o,1); m.addA(k,k,-md.ro); m.addA(k,n1,-fp);
  m.addB(k, fo-fp*v1);
  if(c.supOK && md.iq>0) stampI(m,vp,vm,md.iq);  // 静态工作电流
}

/* ============================== 555 定时器（行为级） ==============================
 * 内部：5k+5k+5k 分压器给出 2/3Vcc(阈值) 与 1/3Vcc(触发)，两比较器 + RS 触发器
 * 数字状态只在"被接受的时间点"更新，并做事件迭代，避免牛顿迭代中来回抖动
 * ================================================================================ */
const P555 = {VCC:0,GND:1,TRIG:2,THR:3,CTL:4,DIS:5,RST:6,OUT:7};
defComp('IC555',{ cat:'digital', name:'555 定时器', prefix:'U',
  pins:[{n:'VCC',x:0,y:-70},{n:'GND',x:0,y:70},{n:'TRIG',x:-70,y:30},{n:'THR',x:-70,y:0},
        {n:'CTL',x:70,y:0},{n:'DIS',x:-70,y:-30},{n:'RST',x:70,y:-30},{n:'OUT',x:70,y:30}],
  bb:[-72,-72,72,72],
  props:[{k:'ron',label:'输出内阻',unit:'Ω',def:'10'}],
  lab:c=>[c.name,'NE555'],
  extraBranches:()=>1, initState:()=>({q:0}),
  stamp(c,m,ctx){
    const ni=c.ni, k=c.bi[0], G=ni[P555.GND], ron=Math.max(pv(c,'ron'),0.1);
    stampY(m,ni[P555.VCC],ni[P555.CTL],1/5000,0);      // 内部电阻分压器（上 5k）
    stampY(m,ni[P555.CTL],G,1/10000,0);                // 下 10k（=5k+5k）
    const hi=c.st.q>0.5;
    const vcc=ctx.xv(ni[P555.VCC])-ctx.xv(G);
    const vout = hi ? Math.max(vcc-1.7,0) : 0.1;       // 图腾柱输出级电平
    m.addA(ni[P555.OUT],k,1); m.addA(G,k,-1);
    m.addA(k,ni[P555.OUT],1); m.addA(k,G,-1); m.addA(k,k,-ron);
    m.addB(k, ctx.mode==='ac'?0:vout);
    stampY(m,ni[P555.DIS],G, hi?1e-9:1/25, 0);         // 放电管：输出低时导通
  },
  accept(c,ctx){ return false; },
  evt(c,ctx){
    if(ctx.mode==='ac') return false;
    const ni=c.ni, G=ctx.xv(ni[P555.GND]);
    const vc=ctx.xv(ni[P555.CTL])-G, vth=ctx.xv(ni[P555.THR])-G;
    const vtr=ctx.xv(ni[P555.TRIG])-G, vr=ctx.xv(ni[P555.RST])-G;
    let q=c.st.q;
    if(c.conn[P555.RST] && vr<0.7) q=0;                // 复位优先
    else if(vtr < vc/2) q=1;                           // 触发端 < 1/3Vcc → 置位
    else if(vth > vc)  q=0;                            // 阈值端 > 2/3Vcc → 复位
    const ch = (q!==c.st.q); c.st.q=q; return ch;      // 返回 true 触发事件迭代
  },
  currents(c,ctx){ const a=[0,0,0,0,0,0,0,0]; a[P555.OUT]=ctx.xv(c.bi[0]); return a; },
  draw(g,c){
    g.beginPath(); g.rect(-45,-55,90,110); g.fillStyle='#212a33'; g.fill(); g.stroke();
    ln(g,0,-70,0,-55); ln(g,0,70,0,55);
    ln(g,-70,30,-45,30); ln(g,-70,0,-45,0); ln(g,-70,-30,-45,-30);
    ln(g,70,30,45,30); ln(g,70,0,45,0); ln(g,70,-30,45,-30);
    txt(g,'555',0,-38,13); txt(g,'TRIG',-42,30,8,null,'left'); txt(g,'THR',-42,0,8,null,'left');
    txt(g,'DIS',-42,-30,8,null,'left'); txt(g,'OUT',42,30,8,null,'right');
    txt(g,'CTL',42,0,8,null,'right'); txt(g,'RST',42,-30,8,null,'right');
    txt(g,'V+',6,-48,8,null,'left'); txt(g,'GND',6,48,8,null,'left');
    if(c.st) txt(g,c.st.q>0.5?'Q=1':'Q=0',0,38,9,c.st.q>0.5?'#6ee7a8':'#7e8c9a');
  }
});

/* ==========================================================================================
 *  网表提取（Schematic → Netlist）
 *  用并查集把"同一坐标的引脚 / 导线顶点 / 落在导线上的点"合并为一个电气网络，
 *  GND 元件所在网络固定为参考节点 0。
 * ========================================================================================== */
function xfPt(c,x,y){
  if(c.mirror) x=-x;
  const r=(((c.rot|0)%360)+360)%360;
  let nx=x, ny=y;
  if(r===90){ nx=-y; ny=x; } else if(r===180){ nx=-x; ny=-y; } else if(r===270){ nx=y; ny=-x; }
  return {x:c.x+nx, y:c.y+ny};
}
function pinWorld(c,i){ const p=COMP[c.type].pins[i]; return xfPt(c,p.x,p.y); }
/** 点是否落在线段上（含端点），容差 0.5 世界单位 */
function onSeg(x,y,s){
  const dx=s.x2-s.x1, dy=s.y2-s.y1, len=Math.hypot(dx,dy);
  if(len<0.5) return Math.abs(x-s.x1)<0.5 && Math.abs(y-s.y1)<0.5;   // 退化线段
  if(Math.abs((x-s.x1)*dy-(y-s.y1)*dx) > 0.5*len) return false;      // 垂距 > 0.5
  const t=(x-s.x1)*dx+(y-s.y1)*dy;
  return t>=-0.25 && t<=len*len+0.25;
}
const NL_TYPES={D:1,LED:1,DZ:1,NPN:1,PNP:1,NMOS:1,OPAMP:1};
/** 直流通路分组：默认所有引脚互通；下列元件的引脚在直流下不导通 */
const DCG={ C:[], SCOPE:[], BODE:[], IDC:[], OPAMP:[[2,'g']], IC555:[[0,1,4,5,7]] };

function buildCircuit(sch){
  const par=new Map();
  const mk=k=>{ if(!par.has(k)) par.set(k,k); return k; };
  const find=k=>{ let r=k; while(par.get(r)!==r) r=par.get(r);
    let x=k; while(par.get(x)!==r){ const nx=par.get(x); par.set(x,r); x=nx; } return r; };
  const uni=(a,b)=>{ const ra=find(mk(a)), rb=find(mk(b)); if(ra!==rb) par.set(ra,rb); };
  const K=(x,y)=>Math.round(x)+','+Math.round(y);
  const pts=[], segs=[];
  for(let wi=0;wi<sch.wires.length;wi++){
    const w=sch.wires[wi];
    for(let i=0;i<w.pts.length;i++){ const p=w.pts[i], k=K(p.x,p.y); mk(k); pts.push({x:p.x,y:p.y,k}); }
    for(let i=0;i+1<w.pts.length;i++){
      uni(K(w.pts[i].x,w.pts[i].y), K(w.pts[i+1].x,w.pts[i+1].y));
      segs.push({x1:w.pts[i].x,y1:w.pts[i].y,x2:w.pts[i+1].x,y2:w.pts[i+1].y,w:w});
    }
  }
  const pinList=[];
  for(let ci=0;ci<sch.comps.length;ci++){
    const c=sch.comps[ci], d=COMP[c.type]; c.pw=[];
    for(let i=0;i<d.pins.length;i++){
      const p=pinWorld(c,i); c.pw.push(p); const k=K(p.x,p.y); mk(k);
      pts.push({x:p.x,y:p.y,k}); pinList.push({c:c,i:i,x:p.x,y:p.y,k:k});
    }
  }
  for(let si=0;si<segs.length;si++){ const s=segs[si], k1=K(s.x1,s.y1);
    for(let pi=0;pi<pts.length;pi++){ const p=pts[pi]; if(onSeg(p.x,p.y,s)) uni(p.k,k1); } }
  const GK='#GND'; mk(GK); let hasGnd=false;
  for(let ci=0;ci<sch.comps.length;ci++){ const c=sch.comps[ci];
    if(COMP[c.type].ground){ uni(K(c.pw[0].x,c.pw[0].y),GK); hasGnd=true; } }
  // 分配网络编号：接地网络 = 0
  const rn=new Map(); rn.set(find(GK),0); let nn=0;
  const keys=Array.from(par.keys());
  for(let i=0;i<keys.length;i++){ const r=find(keys[i]); if(!rn.has(r)) rn.set(r,++nn); }
  const keyNet=new Map();
  for(let i=0;i<keys.length;i++) keyNet.set(keys[i], rn.get(find(keys[i])));
  const netPins=[]; for(let i=0;i<=nn;i++) netPins.push([]);
  for(let ci=0;ci<sch.comps.length;ci++){
    const c=sch.comps[ci], d=COMP[c.type]; c.nets=[]; c.ni=[]; c.conn=[];
    for(let i=0;i<d.pins.length;i++){
      const net=keyNet.get(K(c.pw[i].x,c.pw[i].y));
      c.nets.push(net); c.ni.push(net===0?-1:net-1); netPins[net].push({c:c,i:i});
    }
  }
  for(let ci=0;ci<sch.comps.length;ci++){ const c=sch.comps[ci];
    for(let i=0;i<c.nets.length;i++) c.conn[i]=(c.nets[i]===0)||netPins[c.nets[i]].length>1; }
  // 索引分配：0..nn-1 普通节点，其后内部节点，最后支路电流
  let idx=nn;
  for(let ci=0;ci<sch.comps.length;ci++){ const c=sch.comps[ci], d=COMP[c.type];
    const en=d.extraNodes?d.extraNodes(c):0; c.nx=[]; for(let i=0;i<en;i++) c.nx.push(idx++); }
  const nTot=idx;
  for(let ci=0;ci<sch.comps.length;ci++){ const c=sch.comps[ci], d=COMP[c.type];
    const eb=d.extraBranches?d.extraBranches(c):0; c.bi=[]; for(let i=0;i<eb;i++) c.bi.push(idx++); }
  const size=Math.max(idx,1);
  const isCur=new Uint8Array(size); for(let i=nTot;i<size;i++) isCur[i]=1;
  let nonlinear=false;
  for(let ci=0;ci<sch.comps.length;ci++){
    const c=sch.comps[ci];
    if(NL_TYPES[c.type]) nonlinear=true;
    c.supOK = (c.type==='OPAMP') ? (c.conn[3]&&c.conn[4]) : false;
    c.st = COMP[c.type].initState ? COMP[c.type].initState(c) : {};
    c.it = {vd:0.3,vbe:0.6,vbc:-0.6,vgs:0,vbd:0}; c.lin=null;
    invalidateComp(c);
  }
  const circ={comps:sch.comps, wires:sch.wires, nNode:nn, nTot:nTot, size:size, isCur:isCur,
    mat:new Mat(size), cmat:null, netPins:netPins, keyNet:keyNet, pinList:pinList, segs:segs,
    nonlinear:nonlinear, hasGnd:hasGnd, warns:[], errs:[], nets:nn+1, K:K};
  // ---- 电路检查 ----
  if(!hasGnd && sch.comps.length) circ.errs.push('电路缺少接地符号（GND）：MNA 必须有参考节点');
  const dang=[];
  for(let ci=0;ci<sch.comps.length;ci++){ const c=sch.comps[ci], d=COMP[c.type];
    for(let i=0;i<c.nets.length;i++) if(!c.conn[i]) dang.push(c.name+'.'+d.pins[i].n); }
  if(dang.length) circ.warns.push('未连接的引脚：'+dang.slice(0,10).join(', ')+(dang.length>10?' …':''));
  // 直流通路可达性（是否存在到地的直流路径）
  const uf2=new Int32Array(nn+1); for(let i=0;i<=nn;i++) uf2[i]=i;
  const f2=a=>{ while(uf2[a]!==a) a=uf2[a]=uf2[uf2[a]]; return a; };
  const u2=(a,b)=>{ a=f2(a); b=f2(b); if(a!==b) uf2[a]=b; };
  for(let ci=0;ci<sch.comps.length;ci++){
    const c=sch.comps[ci], gs=DCG[c.type];
    if(gs){ for(let gi=0;gi<gs.length;gi++){ const grp=gs[gi]; let base=null;
        for(let j=0;j<grp.length;j++){ const t=grp[j]; const net=(t==='g')?0:c.nets[t];
          if(base===null) base=net; else u2(base,net); } } }
    else { for(let i=1;i<c.nets.length;i++) u2(c.nets[0],c.nets[i]); }
  }
  const flo=[];
  for(let i=1;i<=nn;i++) if(f2(i)!==f2(0)) flo.push('n'+i);
  if(flo.length) circ.warns.push('悬浮网络（无直流通路到地，已用 1TΩ 虚拟电导稳定）：'+flo.slice(0,8).join(', '));
  return circ;
}

/* ==========================================================================================
 *  求解上下文与牛顿-拉夫逊迭代
 * ========================================================================================== */
function makeCtx(circ,mode){
  const ctx={mode:mode, x:new Float64Array(circ.size), h:1e-6, t:0, trap:false, w:0,
    gmin:GMIN_DEF, k:1, useT:false, flag:{lim:false}};
  ctx.xv=(i)=> i<0?0:ctx.x[i];
  return ctx;
}
function stampAll(circ,m,ctx){
  m.clear();
  for(let i=0;i<circ.nTot;i++) m.addA(i,i,GSHUNT);       // 每节点对地 1TΩ：防奇异
  const cs=circ.comps;
  for(let i=0;i<cs.length;i++){ const d=COMP[cs[i].type]; if(d.stamp) d.stamp(cs[i],m,ctx); }
}
/** 牛顿-拉夫逊迭代：线性电路一次求解即精确；非线性电路迭代至满足 SPICE 容差 */
function newtonSolve(circ,ctx,maxit){
  const m=circ.mat, n=m.n, xp=new Float64Array(n);
  if(maxit===undefined) maxit=MAXITER;
  for(let it=1;it<=maxit;it++){
    xp.set(ctx.x);
    ctx.flag.lim=false;
    stampAll(circ,m,ctx);
    if(!m.solve()) return {ok:false,it:it,reason:'矩阵奇异（检查悬浮节点/短路电压源）'};
    ctx.x.set(m.x);
    if(!circ.nonlinear) return {ok:true,it:it};
    let conv=true;
    for(let i=0;i<n;i++){
      const a=Math.abs(ctx.x[i]);
      const tol=circ.isCur[i] ? (RELTOL*a+ABSTOL) : (RELTOL*a+VNTOL);
      if(!(Math.abs(ctx.x[i]-xp[i])<=tol)){ conv=false; break; }
    }
    if(conv && !ctx.flag.lim && it>1) return {ok:true,it:it};
  }
  return {ok:false,it:maxit,reason:'牛顿迭代 '+maxit+' 次未收敛'};
}
function resetIter(circ){
  for(let i=0;i<circ.comps.length;i++){
    circ.comps[i].it={vd:0.3,vbe:0.6,vbc:-0.6,vgs:0,vbd:0};
  }
}
/** 直流工作点分析：直接牛顿 → gmin 步进 → 源步进 三级回退策略 */
function dcOp(circ,opt){
  opt=opt||{};
  const ctx=makeCtx(circ,'dc');
  ctx.useT=!!opt.useT; ctx.t=opt.t||0;
  resetIter(circ);
  let r=newtonSolve(circ,ctx,MAXITER);
  let path='直接迭代';
  if(!r.ok && circ.nonlinear){
    ctx.x.fill(0); resetIter(circ); path='gmin 步进';
    let good=true;
    for(let g=1e-2; g>1e-13; g/=10){
      ctx.gmin=g; r=newtonSolve(circ,ctx,MAXITER);
      if(!r.ok){ good=false; break; }
    }
    if(good){ ctx.gmin=GMIN_DEF; r=newtonSolve(circ,ctx,MAXITER); }
    if(!r.ok){                                    // 源步进：把所有独立源从 0 缓慢升到额定值
      ctx.x.fill(0); ctx.gmin=GMIN_DEF; resetIter(circ); path='源步进';
      let ok2=true;
      const ks=[0,0.02,0.05,0.1,0.2,0.35,0.5,0.65,0.8,0.9,0.96,1];
      for(let i=0;i<ks.length;i++){ ctx.k=ks[i]; r=newtonSolve(circ,ctx,MAXITER);
        if(!r.ok){ ok2=false; break; } }
      ctx.k=1; if(ok2) r=newtonSolve(circ,ctx,MAXITER);
    }
  }
  ctx.gmin=GMIN_DEF; ctx.k=1;
  return {ok:r.ok, ctx:ctx, it:r.it, reason:r.reason, path:path};
}
function acceptAll(circ,ctx){
  const cs=circ.comps;
  for(let i=0;i<cs.length;i++){ const d=COMP[cs[i].type]; if(d.accept) d.accept(cs[i],ctx); }
}
/** 事件迭代：数字元件（555）状态变化后在同一时间点重解，避免一步延迟 */
function eventCheck(circ,ctx){
  const cs=circ.comps; let ch=false;
  for(let i=0;i<cs.length;i++){ const d=COMP[cs[i].type]; if(d.evt && d.evt(cs[i],ctx)) ch=true; }
  return ch;
}

/* ==========================================================================================
 *  瞬态分析：伴随模型 + 可变步长
 *    局部截断误差(LTE)用"线性预测值 vs 实际解"的偏差近似，超限则拒步并减半
 * ========================================================================================== */
class Tran{
  constructor(circ,opt){
    this.circ=circ; this.o=opt; this.t=0; this.n=0; this.rej=0; this.itsum=0; this.fail=null;
    this.trap = (opt.method!=='be');
    const dc=dcOp(circ,{useT:true,t:0});
    this.ok=dc.ok; this.dcReason=dc.reason;
    this.ctx=makeCtx(circ,'tran');
    this.ctx.x.set(dc.ctx.x);
    if(opt.uic){ // 使用初始条件：电容电压=IC，电感电流=IC
      for(let i=0;i<circ.comps.length;i++){ const c=circ.comps[i];
        if(c.type==='C') c.st.v=pv(c,'ic'); if(c.type==='L') c.st.i=pv(c,'ic'); }
    } else acceptAll(circ,dc.ctx);                 // 由工作点初始化各元件状态
    this.xl=Float64Array.from(this.ctx.x);         // 上一步解
    this.xll=Float64Array.from(this.ctx.x);        // 上上步解
    this.hl=0;
    this.hmax=Math.max(opt.tstop/2000, opt.tstep);
    this.hmin=Math.max(opt.tstop*1e-12, 1e-15);
    this.h=Math.min(opt.tstep, opt.tstop/100);
    this.traces=opt.traces||[];
    for(let i=0;i<this.traces.length;i++) this.traces[i].reset();
    this.record();
  }
  record(){
    for(let i=0;i<this.traces.length;i++) this.traces[i].push(this.t, this.traces[i].get(this.ctx));
  }
  nextBreak(){
    let tb=Infinity; const cs=this.circ.comps;
    for(let i=0;i<cs.length;i++){ const d=COMP[cs[i].type];
      if(d.breaks){ const b=d.breaks(cs[i],this.t); if(b<tb) tb=b; } }
    return tb;
  }
  /** 推进一个时间步，返回 true 表示成功 */
  step(){
    const ctx=this.ctx, circ=this.circ, o=this.o;
    let h=Math.min(this.h,this.hmax), tries=0, err=0;
    const tb=this.nextBreak();
    let atBreak=false;
    if(this.t+h > tb-1e-18){ const hb=tb-this.t; if(hb>this.hmin){ h=hb; atBreak=true; } }
    if(this.t+h>o.tstop) h=o.tstop-this.t;
    if(h<=0) return false;
    for(;;){
      ctx.h=h; ctx.t=this.t+h; ctx.trap=this.trap && this.n>0 && !atBreak;
      // 预测器：线性外插作为牛顿初值（同时用于 LTE 估计）
      const pred=this.pred=new Float64Array(circ.size);
      if(this.n>0 && this.hl>0){ const r=h/this.hl;
        for(let i=0;i<circ.size;i++) pred[i]=this.xl[i]+(this.xl[i]-this.xll[i])*r;
      } else pred.set(this.xl);
      ctx.x.set(pred);
      let r=newtonSolve(circ,ctx,MAXITER);
      if(r.ok){
        let ev=0;
        while(eventCheck(circ,ctx) && ev<8){ ctx.x.set(pred); r=newtonSolve(circ,ctx,MAXITER); ev++;
          if(!r.ok) break; }
      }
      this.itsum+=r.it;
      if(r.ok){
        err=0;
        if(this.n>1 && this.hl>0){
          for(let i=0;i<circ.nTot;i++){
            const d=Math.abs(ctx.x[i]-pred[i]);
            const tol=0.35*(RELTOL*Math.abs(ctx.x[i])+VNTOL*40);   // LTE 容许限
            const e=d/tol; if(e>err) err=e;
          }
        }
        if(err>1 && h>this.hmin*2 && tries<10 && !atBreak){
          h=Math.max(h*Math.max(0.3,1/Math.sqrt(err)), this.hmin); tries++; this.rej++; continue;
        }
        break;
      }
      if(h<=this.hmin*1.001 || tries>12){ this.fail=r.reason+'（t='+fmtEng(this.t,'s')+'）'; return false; }
      h*=0.25; tries++; this.rej++;
    }
    acceptAll(circ,ctx);
    this.xll.set(this.xl); this.xl.set(ctx.x); this.hl=h;
    this.t+=h; this.n++;
    this.record();
    // 步长控制：误差小则放大，接近断点时限制
    let hn=h;
    if(err<0.1) hn=h*2; else if(err<0.5) hn=h*1.4; else if(err>0.9) hn=h*0.8;
    this.h=clamp(hn,this.hmin,this.hmax);
    return this.t < this.o.tstop-1e-18;
  }
}
/** 波形道：可增长存储 + 自动抽稀（保证长时间仿真内存有界） */
class Trace{
  constructor(name,color,get,unit){
    this.name=name; this.color=color; this.get=get; this.unit=unit||'V';
    this.t=new Float64Array(8192); this.y=new Float64Array(8192); this.n=0; this.cap=8192;
  }
  reset(){ this.n=0; }
  push(t,y){
    if(this.n>=this.cap){
      if(this.cap>=262144){                       // 抽稀：隔点丢弃，时间跨度不变
        for(let i=0;i<this.n>>1;i++){ this.t[i]=this.t[i*2]; this.y[i]=this.y[i*2]; }
        this.n=this.n>>1;
      } else {
        this.cap*=2;
        const nt=new Float64Array(this.cap), ny=new Float64Array(this.cap);
        nt.set(this.t); ny.set(this.y); this.t=nt; this.y=ny;
      }
    }
    this.t[this.n]=t; this.y[this.n]=y; this.n++;
  }
  minmax(t0,t1){
    let lo=Infinity, hi=-Infinity;
    for(let i=0;i<this.n;i++){ if(this.t[i]<t0||this.t[i]>t1) continue;
      if(this.y[i]<lo) lo=this.y[i]; if(this.y[i]>hi) hi=this.y[i]; }
    return [lo,hi];
  }
  at(t){
    if(this.n===0) return NaN;
    let a=0,b=this.n-1;
    if(t<=this.t[0]) return this.y[0];
    if(t>=this.t[b]) return this.y[b];
    while(b-a>1){ const m=(a+b)>>1; if(this.t[m]<=t) a=m; else b=m; }
    const dt=this.t[b]-this.t[a];
    return dt>0 ? this.y[a]+(this.y[b]-this.y[a])*(t-this.t[a])/dt : this.y[a];
  }
}

/* ==========================================================================================
 *  交流小信号分析（AC Sweep）
 *   ① 求直流工作点 → ② 各非线性器件在工作点线性化（gm/gπ/gds 与结电容）
 *   ③ 对频率作对数扫描，复数 MNA 求解 → ④ 输出幅频(dB)与相频(°)
 * ========================================================================================== */
function acSweep(circ,opt){
  const dc=dcOp(circ,{});
  if(!dc.ok) return {ok:false,reason:'交流分析前的直流工作点求解失败：'+dc.reason};
  const ctx=makeCtx(circ,'ac');
  ctx.x=dc.ctx.x; ctx.xv=(i)=> i<0?0:ctx.x[i];
  const cm=circ.cmat||(circ.cmat=new CMat(circ.size));
  const f1=Math.max(opt.f1,1e-6), f2=Math.max(opt.f2,f1*1.0001), ppd=Math.max(opt.ppd,2);
  const nd=Math.log10(f2/f1), N=Math.max(2,Math.round(nd*ppd)+1);
  const res={ok:true,f:[],mag:[],ph:[],re:[],im:[],dc:dc,vin:[],vout:[]};
  const oi=opt.outIdx, ii=opt.inIdx, oir=opt.outRef===undefined?-1:opt.outRef, iir=opt.inRef===undefined?-1:opt.inRef;
  let lastPh=0;
  for(let s=0;s<N;s++){
    const f=f1*Math.pow(10, nd*s/(N-1));
    ctx.w=2*Math.PI*f;
    stampAll(circ,cm,ctx);
    if(!cm.solve()){ res.ok=false; res.reason='复数矩阵在 '+fmtEng(f,'Hz')+' 处奇异'; break; }
    const gr=i=> i<0?0:cm.xr[i], gi=i=> i<0?0:cm.xi[i];
    const orr=gr(oi)-gr(oir), oii=gi(oi)-gi(oir);
    let irr=gr(ii)-gr(iir), iii=gi(ii)-gi(iir);
    let hr,hi2;
    const den=irr*irr+iii*iii;
    if(den<1e-30){ hr=orr; hi2=oii; }              // 输入幅度为 0 时直接给输出
    else { hr=(orr*irr+oii*iii)/den; hi2=(oii*irr-orr*iii)/den; }
    const mg=Math.hypot(hr,hi2);
    let ph=Math.atan2(hi2,hr)*180/Math.PI;
    while(ph-lastPh>180) ph-=360;                  // 相位解缠绕
    while(ph-lastPh<-180) ph+=360;
    lastPh=ph;
    res.f.push(f); res.mag.push(mg); res.ph.push(ph); res.re.push(hr); res.im.push(hi2);
    res.vin.push(Math.hypot(irr,iii)); res.vout.push(Math.hypot(orr,oii));
  }
  // ---- 特征参数：峰值增益 / −3dB 截止频率 / 增益带宽积 / 0dB 频率 ----
  if(res.f.length>2){
    let pk=0,pki=0;
    for(let i=0;i<res.mag.length;i++) if(res.mag[i]>pk){ pk=res.mag[i]; pki=i; }
    const th=pk/Math.SQRT2;                        // −3dB → 幅值下降 1/√2
    const interp=(i0,i1)=>{                        // 对数频率上线性插值求交点
      const y0=res.mag[i0], y1=res.mag[i1];
      if(y0===y1) return res.f[i1];
      const r=(th-y0)/(y1-y0);
      return Math.pow(10, Math.log10(res.f[i0])+r*(Math.log10(res.f[i1])-Math.log10(res.f[i0])));
    };
    let fH=null,fL=null;
    for(let i=pki;i+1<res.mag.length;i++) if(res.mag[i+1]<th){ fH=interp(i,i+1); break; }
    for(let i=pki;i>0;i--) if(res.mag[i-1]<th){ fL=interp(i,i-1); break; }
    let f0=null;
    for(let i=0;i+1<res.mag.length;i++)
      if((res.mag[i]-1)*(res.mag[i+1]-1)<0){
        const y0=Math.log10(res.mag[i]), y1=Math.log10(res.mag[i+1]);
        const r=(0-y0)/(y1-y0);
        f0=Math.pow(10, Math.log10(res.f[i])+r*(Math.log10(res.f[i+1])-Math.log10(res.f[i]))); break;
      }
    res.peak=pk; res.peakF=res.f[pki]; res.fH=fH; res.fL=fL; res.f0=f0;
    res.gbw=(fH!==null)?pk*fH:null;
  }
  return res;
}

function schFromExample(ex){
  let id=0;

    return {id:++id, type:a[0], name:a[1], x:a[2], y:a[3],
      props:Object.assign({},a[4]||{}), rot:a[5]||0, mirror:!!a[6]}; });

    return {id:++id, pts:p.map(function(q){ return {x:q[0],y:q[1]}; })}; });
  return {comps:comps, wires:wires, probes:[]};

function S2W(sx,sy){ const v=App.view; return {x:(sx-v.px)/v.z, y:(sy-v.py)/v.z}; }

function compBB(c){
  const b=COMP[c.type].bb;
  const p=[xfPt(c,b[0],b[1]),xfPt(c,b[2],b[1]),xfPt(c,b[2],b[3]),xfPt(c,b[0],b[3])];
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(let i=0;i<4;i++){ x1=Math.min(x1,p[i].x); y1=Math.min(y1,p[i].y);
    x2=Math.max(x2,p[i].x); y2=Math.max(y2,p[i].y); }
  return [x1,y1,x2,y2];
}
function schBB(){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9, any=false;
  for(let i=0;i<App.sch.comps.length;i++){ const b=compBB(App.sch.comps[i]); any=true;
    x1=Math.min(x1,b[0]); y1=Math.min(y1,b[1]); x2=Math.max(x2,b[2]); y2=Math.max(y2,b[3]); }
  for(let i=0;i<App.sch.wires.length;i++){ const w=App.sch.wires[i];
    for(let j=0;j<w.pts.length;j++){ any=true;
      x1=Math.min(x1,w.pts[j].x); y1=Math.min(y1,w.pts[j].y);
      x2=Math.max(x2,w.pts[j].x); y2=Math.max(y2,w.pts[j].y); } }
  return any?[x1,y1,x2,y2]:[0,0,400,300];
}
function fitView(){
  const b=schBB(), w=b[2]-b[0]+140, h=b[3]-b[1]+140;

function netColor(n){ return n===0?'#8ea3b5':NETCOL[(n-1)%NETCOL.length]; }
/** 节点电压热度图：红=正压、蓝=负压、绿≈接近地 */
function heatColor(v){
  const t=clamp(Math.abs(v)/Math.max(App.vmax,0.5),0,1);
  const h=v>=0 ? 120-120*t : 120+140*t;
  return 'hsl('+h.toFixed(0)+',88%,'+(46+14*t).toFixed(0)+'%)';
}
function netV(n){ return (App.netVs && n!==undefined && n<App.netVs.length) ? App.netVs[n] : 0; }
function wireColor(w){
  const n=(w.net===undefined)?-1:w.net;
  if(App.netVs && App.opts.heat && n>=0) return heatColor(netV(n));
  if(App.opts.netcolor && n>=0) return netColor(n);
  return '#39c2ff';
}
/* ---------------- 结果标注计算 ---------------- */
function annotate(){
  const circ=App.circ; if(!circ) return;
  const ctx=App.tran?App.tran.ctx:(App.dc?App.dc.ctx:null);
  if(!ctx){ App.netVs=null; return; }
  const nv=new Float64Array(circ.nets); let mx=1;
  for(let i=1;i<circ.nets;i++){ nv[i]=ctx.xv(i-1); mx=Math.max(mx,Math.abs(nv[i])); }
  App.netVs=nv; App.vmax=Math.max(mx*0.85,1);
  for(let i=0;i<circ.comps.length;i++){
    const c=circ.comps[i], d=COMP[c.type];
    c.iPin = d.currents ? d.currents(c,ctx) : null;
    if(d.read) c.rd=d.read(c,ctx);
  }
  // 导线电流：由端点处引脚电流决定幅值与方向（用于流动动画与箭头）
  for(let i=0;i<App.sch.wires.length;i++){
    const w=App.sch.wires[i]; w.ia=0; w.idir=1;
    if(w.pts.length<2||!App.pinAt) continue;
    const ends=[{k:circ.K(w.pts[0].x,w.pts[0].y),s:-1},
                {k:circ.K(w.pts[w.pts.length-1].x,w.pts[w.pts.length-1].y),s:1}];
    let best=0,dir=1;
    for(let e=0;e<2;e++){
      const lst=App.pinAt.get(ends[e].k); if(!lst) continue;
      for(let j=0;j<lst.length;j++){
        const pc=lst[j].c, pi=lst[j].i;
        if(!pc.iPin) continue;
        const cur=pc.iPin[pi]||0;
        if(Math.abs(cur)>Math.abs(best)){ best=cur; dir=(cur>0?ends[e].s:-ends[e].s); }
      }
    }
    w.ia=Math.abs(best); w.idir=dir;
  }
}

function drawGrid(){
  if(!App.opts.grid) return;
  const v=App.view, step=GRID*v.z;
  if(step<4) return;
  const big=step*5;
  if(step>=9){
    G.strokeStyle='#19222c'; G.lineWidth=1; G.beginPath();
    for(let x=((v.px%step)+step)%step; x<CW; x+=step){ G.moveTo(x+.5,0); G.lineTo(x+.5,CH); }
    for(let y=((v.py%step)+step)%step; y<CH; y+=step){ G.moveTo(0,y+.5); G.lineTo(CW,y+.5); }
    G.stroke();
  }
  G.strokeStyle='#243340'; G.lineWidth=1; G.beginPath();
  for(let x=((v.px%big)+big)%big; x<CW; x+=big){ G.moveTo(x+.5,0); G.lineTo(x+.5,CH); }
  for(let y=((v.py%big)+big)%big; y<CH; y+=big){ G.moveTo(0,y+.5); G.lineTo(CW,y+.5); }
  G.stroke();
}
function polyLen(pts){ let L=0;
  for(let i=0;i+1<pts.length;i++) L+=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y); return L; }
function polyAt(pts,d){
  for(let i=0;i+1<pts.length;i++){
    const dx=pts[i+1].x-pts[i].x, dy=pts[i+1].y-pts[i].y, L=Math.hypot(dx,dy);
    if(d<=L||i===pts.length-2){ const t=L>0?d/L:0;
      return {x:pts[i].x+dx*t, y:pts[i].y+dy*t, dx:L>0?dx/L:1, dy:L>0?dy/L:0}; }
    d-=L;
  }
  return {x:pts[0].x,y:pts[0].y,dx:1,dy:0};
}
function drawWires(){
  const v=App.view;
  for(let i=0;i<App.sch.wires.length;i++){
    const w=App.sch.wires[i]; if(w.pts.length<2) continue;
    if(App.sel.has(w)){
      G.strokeStyle='#ffd166'; G.lineWidth=Math.max(4,5.5*v.z); G.globalAlpha=0.35;
      G.beginPath();
      for(let j=0;j<w.pts.length;j++){ const p=W2S(w.pts[j].x,w.pts[j].y);
        if(j===0) G.moveTo(p.x,p.y); else G.lineTo(p.x,p.y); }
      G.stroke(); G.globalAlpha=1;
    }
    G.strokeStyle=wireColor(w); G.lineWidth=Math.max(1.5,2.1*v.z);
    G.lineJoin='round'; G.lineCap='round';
    G.beginPath();
    for(let j=0;j<w.pts.length;j++){ const p=W2S(w.pts[j].x,w.pts[j].y);
      if(j===0) G.moveTo(p.x,p.y); else G.lineTo(p.x,p.y); }
    G.stroke();
    // 电流流动动画：箭头沿导线移动，速度 ∝ |I|（电子/电流方向）
    if(App.opts.anim && w.ia>1e-9 && v.z>0.3){
      const L=polyLen(w.pts); if(L<8) continue;
      const spd=clamp(w.ia*5000,8,320);
      const gap=30/Math.max(v.z,0.4);
      let off=(App.anim*spd)%gap; if(w.idir<0) off=gap-off;
      G.fillStyle='#f2fbffdd';
      for(let d=off; d<L; d+=gap){
        const q=polyAt(w.pts,d), p=W2S(q.x,q.y);
        const dx=q.dx*w.idir, dy=q.dy*w.idir, s=Math.max(3.4,4.4*Math.min(v.z,1.3));
        G.beginPath();
        G.moveTo(p.x+dx*s, p.y+dy*s);
        G.lineTo(p.x-dx*s-dy*s*0.62, p.y-dy*s+dx*s*0.62);
        G.lineTo(p.x-dx*s+dy*s*0.62, p.y-dy*s-dx*s*0.62);
        G.closePath(); G.fill();
      }
    }
  }
  if(App.junc) for(let i=0;i<App.junc.length;i++){
    const o=App.junc[i], p=W2S(o.x,o.y);
    G.fillStyle=(App.netVs&&App.opts.heat)?heatColor(netV(o.net)):
      (App.opts.netcolor?netColor(o.net):'#39c2ff');
    G.beginPath(); G.arc(p.x,p.y,Math.max(2.6,3.4*App.view.z),0,6.2832); G.fill();
  }
}
function drawComp(c,ghost){

      const q=W2S((b[0]+b[2])/2,b[3]);

    } else if(c.iPin && c.iPin.length && d.pins.length<=3 && !d.ground){
      let im=0; for(let i=0;i<c.iPin.length;i++) if(Math.abs(c.iPin[i])>Math.abs(im)) im=c.iPin[i];
      if(Math.abs(im)>1e-11){
        const q=W2S((b[0]+b[2])/2,b[3]);

        G.fillStyle='#ffd23f'; G.fillText(fmtEng(Math.abs(im),'A',3),q.x,q.y+3);
      }
    }
  }
  // 半导体工作区域标注（由 Ebers-Moll / Level-1 判定）
  if(App.netVs && v.z>0.55 && c.lin && c.lin.mode){
    const b=compBB(c), q=W2S(b[0],b[1]);
    G.font='700 10px Consolas,monospace'; G.textAlign='left'; G.textBaseline='bottom';
    G.fillStyle=c.lin.mode==='放大'?'#6ee7a8':(c.lin.mode==='截止'?'#7e8c9a':'#ffb648');
    G.fillText(c.lin.mode,q.x,q.y-2);

}
function drawNodeLabels(){

function draw(){

/* ==========================================================================================
 *  网表重建 / 命中测试 / 撤销 / 编辑操作
 * ========================================================================================== */
let UID=1;
function nextId(){ return ++UID; }
function nextName(type){
  const p=COMP[type].prefix;
  App.names[p]=(App.names[p]||0)+1;
  let n=p+App.names[p], guard=0;
  while(App.sch.comps.some(function(c){return c.name===n;}) && guard++<999){
    App.names[p]++; n=p+App.names[p];
  }
  return n;
}
function syncNames(){
  App.names={};
  for(let i=0;i<App.sch.comps.length;i++){
    const c=App.sch.comps[i], m=/^([A-Za-z+\-]+)(\d+)$/.exec(c.name||'');
    if(m){ const k=m[1], v=parseInt(m[2],10); if(!App.names[k]||App.names[k]<v) App.names[k]=v; }
    if(c.id>UID) UID=c.id;
  }
  for(let i=0;i<App.sch.wires.length;i++) if(App.sch.wires[i].id>UID) UID=App.sch.wires[i].id;
}
function rebuild(){
  const had=!!App.dc;
  App.circ=buildCircuit(App.sch);
  // 结构可能已变化 → 旧仿真结果失效
  if(App.running) stopSim();
  App.dc=null; App.tran=null; App.netVs=null;
  const circ=App.circ;
  for(let i=0;i<App.sch.wires.length;i++){
    const w=App.sch.wires[i];
    w.net = w.pts.length ? circ.keyNet.get(circ.K(w.pts[0].x,w.pts[0].y)) : undefined;
  }
  const pa=new Map();
  for(let i=0;i<circ.pinList.length;i++){
    const p=circ.pinList[i]; let l=pa.get(p.k);
    if(!l){ l=[]; pa.set(p.k,l); } l.push({c:p.c,i:p.i});
  }
  App.pinAt=pa;
  // 探针网络
  for(let i=0;i<App.sch.probes.length;i++){
    const pr=App.sch.probes[i];
    pr.net=circ.keyNet.get(circ.K(pr.x,pr.y));
    if(pr.net===undefined){                      // 探针不在顶点上：找所在线段
      for(let j=0;j<circ.segs.length&&pr.net===undefined;j++)
        if(onSeg(pr.x,pr.y,circ.segs[j])) pr.net=circ.keyNet.get(circ.K(circ.segs[j].x1,circ.segs[j].y1));
    }
    if(pr.net===undefined) pr.net=0;
  }
  computeJunctions();
  annotate();
  updateStat();
  renderSide();
  return had;
}
/** 节点圆点：某点入度≥3（导线端 1、折点 2、穿过 2、引脚 1）时打点 */
function computeJunctions(){
  const circ=App.circ, cnt=new Map(), pos=new Map(), pts=[];
  function add(x,y,n){ const k=circ.K(x,y); cnt.set(k,(cnt.get(k)||0)+n); if(!pos.has(k)) pos.set(k,{x:x,y:y}); }
  for(let i=0;i<App.sch.wires.length;i++){
    const w=App.sch.wires[i];
    for(let j=0;j<w.pts.length;j++){
      add(w.pts[j].x,w.pts[j].y,(j===0||j===w.pts.length-1)?1:2);
      pts.push(w.pts[j]);
    }
  }
  for(let i=0;i<App.sch.comps.length;i++){
    const c=App.sch.comps[i], d=COMP[c.type];
    for(let j=0;j<d.pins.length;j++){ const p=pinWorld(c,j); add(p.x,p.y,1); pts.push(p); }
  }
  for(let i=0;i<App.sch.wires.length;i++){
    const w=App.sch.wires[i];
    for(let j=0;j+1<w.pts.length;j++){
      const s={x1:w.pts[j].x,y1:w.pts[j].y,x2:w.pts[j+1].x,y2:w.pts[j+1].y};
      if(s.x1===s.x2&&s.y1===s.y2) continue;
      for(let p=0;p<pts.length;p++){
        const q=pts[p];
        if((q.x===s.x1&&q.y===s.y1)||(q.x===s.x2&&q.y===s.y2)) continue;
        if(onSeg(q.x,q.y,s)) add(q.x,q.y,2);
      }
    }
  }
  const out=[];
  cnt.forEach(function(v,k){ if(v>=3){ const p=pos.get(k); out.push({x:p.x,y:p.y,net:circ.keyNet.get(k)||0}); } });
  App.junc=out;
}
/* ---------------- 命中测试 ---------------- */
function distSeg(x,y,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy;
  let t=L2>0?((x-a.x)*dx+(y-a.y)*dy)/L2:0; t=clamp(t,0,1);
  return Math.hypot(x-(a.x+dx*t), y-(a.y+dy*t));
}
function hitPin(sx,sy){
  for(let i=App.sch.comps.length-1;i>=0;i--){
    const c=App.sch.comps[i], d=COMP[c.type];
    for(let j=0;j<d.pins.length;j++){
      const p=pinWorld(c,j), s=W2S(p.x,p.y);
      if(Math.abs(s.x-sx)<8&&Math.abs(s.y-sy)<8) return {c:c,i:j,x:p.x,y:p.y};
    }
  }
  return null;
}
function hitComp(sx,sy){
  const w=S2W(sx,sy);
  for(let i=App.sch.comps.length-1;i>=0;i--){
    const c=App.sch.comps[i], b=compBB(c);
    if(w.x>=b[0]&&w.x<=b[2]&&w.y>=b[1]&&w.y<=b[3]) return c;
  }
  return null;
}
function hitWire(sx,sy){
  const w=S2W(sx,sy), tol=7/App.view.z;
  for(let i=App.sch.wires.length-1;i>=0;i--){
    const wi=App.sch.wires[i];
    for(let j=0;j+1<wi.pts.length;j++)
      if(distSeg(w.x,w.y,wi.pts[j],wi.pts[j+1])<tol)
        return {w:wi, seg:j, x:snap(w.x), y:snap(w.y)};
  }
  return null;
}
function hitProbe(sx,sy){
  for(let i=App.sch.probes.length-1;i>=0;i--){
    const pr=App.sch.probes[i], p=W2S(pr.x,pr.y);
    if(Math.abs(p.x-sx)<9 && sy>p.y-18 && sy<p.y+4) return pr;
  }
  return null;
}
/* ---------------- 撤销 / 重做 ---------------- */
function snapshot(){
  return JSON.stringify({
    c:App.sch.comps.map(function(c){ return {id:c.id,type:c.type,name:c.name,x:c.x,y:c.y,
      rot:c.rot||0,mirror:!!c.mirror,props:c.props}; }),
    w:App.sch.wires.map(function(w){ return {id:w.id,pts:w.pts.map(function(p){return {x:p.x,y:p.y};})}; }),
    p:App.sch.probes.map(function(p){ return {id:p.id,x:p.x,y:p.y,name:p.name,color:p.color}; }),
    n:App.names, v:App.view
  });
}
function loadSnap(s,keepView){
  const o=JSON.parse(s);
  App.sch={comps:o.c||[], wires:o.w||[], probes:o.p||[]};
  for(let i=0;i<App.sch.comps.length;i++){
    const c=App.sch.comps[i]; c.props=c.props||{}; c._pv=null; c._mdl=null;
  }
  App.names=o.n||{}; App.sel.clear(); App.wiring=null;
  if(!keepView&&o.v) App.view=o.v;
  syncNames(); stopSim(); App.dc=null; App.tran=null; App.netVs=null; rebuild();
}
function pushUndo(){
  App.undoS.push(snapshot());
  if(App.undoS.length>150) App.undoS.shift();
  App.redoS.length=0;
}
function undo(){ if(!App.undoS.length){toast('无可撤销操作');return;} App.redoS.push(snapshot()); loadSnap(App.undoS.pop(),true); }
function redo(){ if(!App.redoS.length){toast('无可重做操作');return;} App.undoS.push(snapshot()); loadSnap(App.redoS.pop(),true); }
/* ---------------- 编辑操作 ---------------- */
function selComps(){ const a=[]; App.sel.forEach(function(o){ if(o.type&&COMP[o.type]) a.push(o); }); return a; }
function rotateSel(dir){
  const cs=selComps(); if(!cs.length&&!App.place){ toast('先选中元件'); return; }
  if(App.place){ App.place.rot=(((App.place.rot||0)+90*(dir||1))%360+360)%360; return; }
  pushUndo();
  for(let i=0;i<cs.length;i++) cs[i].rot=(((cs[i].rot||0)+90*(dir||1))%360+360)%360;
  rebuild();
}
function mirrorSel(){
  if(App.place){ App.place.mirror=!App.place.mirror; return; }
  const cs=selComps(); if(!cs.length){ toast('先选中元件'); return; }
  pushUndo();
  for(let i=0;i<cs.length;i++) cs[i].mirror=!cs[i].mirror;
  rebuild();
}
function deleteSel(){
  if(!App.sel.size){ toast('先选中要删除的对象'); return; }
  pushUndo();
  const del=App.sel;
  App.sch.comps=App.sch.comps.filter(function(c){ return !del.has(c); });
  App.sch.wires=App.sch.wires.filter(function(w){ return !del.has(w); });
  App.sch.probes=App.sch.probes.filter(function(p){ return !del.has(p); });
  App.sel.clear(); rebuild();
}
function addComp(type,wx,wy,rot,mirror,props){
  const c={id:nextId(), type:type, name:nextName(type), x:snap(wx), y:snap(wy),
    rot:rot||0, mirror:!!mirror, props:Object.assign({},props||{})};
  App.sch.comps.push(c); return c;
}
const PROBECOL=['#ff8fab','#c4b5fd','#a3e635','#fca5a5','#7de2d1','#ffd166'];
function addProbe(x,y){
  const n=App.sch.probes.length;
  const pr={id:nextId(), x:snap(x), y:snap(y), name:'P'+(n+1), color:PROBECOL[n%PROBECOL.length]};
  App.sch.probes.push(pr); return pr;
}
function simplify(pts){
  const o=[];
  for(let i=0;i<pts.length;i++){
    if(i>0 && pts[i].x===pts[i-1].x && pts[i].y===pts[i-1].y) continue;
    o.push({x:pts[i].x,y:pts[i].y});
  }
  for(let i=1;i+1<o.length;){
    const a=o[i-1],b=o[i],c=o[i+1];
    if((a.x===b.x&&b.x===c.x)||(a.y===b.y&&b.y===c.y)) o.splice(i,1); else i++;
  }
  return o;
}
function manhattan(a,b,flip){
  if(a.x===b.x||a.y===b.y) return [{x:b.x,y:b.y}];
  const dx=Math.abs(b.x-a.x), dy=Math.abs(b.y-a.y);
  const hFirst = flip ? (dx<dy) : (dx>=dy);
  return hFirst ? [{x:b.x,y:a.y},{x:b.x,y:b.y}] : [{x:a.x,y:b.y},{x:b.x,y:b.y}];
}
function startWire(pt){ App.wiring={pts:[{x:pt.x,y:pt.y}], preview:[]}; setMode('wire',true); }
function commitWire(){
  const wr=App.wiring; if(!wr) return;
  const pts=simplify(wr.pts.concat(wr.preview||[]));
  App.wiring=null;
  if(pts.length<2){ draw(); return; }
  pushUndo();
  App.sch.wires.push({id:nextId(), pts:pts});
  rebuild();
}
