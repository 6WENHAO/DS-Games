<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>骑自行车的鹈鹕 🚲🐦</title>
<style>
  :root{
    --sky-1:#a9e0f7; --sky-2:#d9f1fb; --sky-3:#fff2d8;
    --hill-far:#9fd8c0; --hill-mid:#6fc39b; --hill-near:#4faa80;
    --ground:#7ec98f; --ground-dark:#5fb478;
    --road:#8d8f9c; --road-2:#7a7c88; --road-line:#f7f3e3;
    --cloud:#ffffff; --cloud-op:.92;
    --star-op:0; --sun-op:1; --moon-op:0;
    --tree:#3f8f6a; --tree-dark:#2f7154;
    --ink:#1d2733;
    --panel:#ffffffcc; --panel-line:#ffffff;
    --page-1:#eaf6ff; --page-2:#dff1ea;
    --txt:#20303d; --txt-soft:#5b7183;
    --btn:#ffffff; --btn-line:#cfe3ef; --accent:#ef5f4c;
    --vignette:.05;
  }
  body.night{
    --sky-1:#131a3a; --sky-2:#243063; --sky-3:#3d3a6b;
    --hill-far:#2b3a63; --hill-mid:#22304f; --hill-near:#1a2740;
    --ground:#1e3350; --ground-dark:#182a42;
    --road:#3a3f52; --road-2:#31364a; --road-line:#e8e2c6;
    --cloud:#8fa0d0; --cloud-op:.35;
    --star-op:1; --sun-op:0; --moon-op:1;
    --tree:#1d3550; --tree-dark:#152741;
    --page-1:#0f1530; --page-2:#161d3d;
    --txt:#e8eeff; --txt-soft:#9fb0d6;
    --panel:#1b2445cc; --panel-line:#2c3a69;
    --btn:#212b52; --btn-line:#39477a; --accent:#ff7a63;
    --vignette:.28;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(1200px 700px at 15% -10%, var(--page-2), transparent 60%),
      linear-gradient(160deg, var(--page-1), var(--page-2));
    color:var(--txt);
    display:flex; align-items:center; justify-content:center;
    padding:22px 16px 30px;
    transition:background .6s ease, color .6s ease;
  }
  .wrap{width:100%; max-width:980px}

  header{text-align:center; margin-bottom:14px}
  h1{
    margin:0; font-size:clamp(21px,3.4vw,32px); letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  h1 .emoji{filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
  .sub{margin:6px 0 0; color:var(--txt-soft); font-size:14px}

  .frame{
    position:relative; border-radius:20px; overflow:hidden;
    box-shadow:0 22px 50px -18px rgba(12,26,45,.55), 0 0 0 1px rgba(255,255,255,.35) inset;
    background:var(--sky-2);
    transition:background .6s ease;
  }
  .frame::after{ /* soft vignette */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(4,10,26,var(--vignette)));
    transition:background .6s ease;
  }
  svg#scene{display:block; width:100%; height:auto}

  .controls{
    margin-top:14px; display:flex; flex-wrap:wrap; gap:10px 14px;
    align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--panel-line);
    padding:12px 14px; border-radius:16px;
    backdrop-filter:blur(8px);
    transition:background .6s ease, border-color .6s ease;
  }
  button{
    font:inherit; font-size:14px; color:var(--txt);
    background:var(--btn); border:1px solid var(--btn-line);
    padding:9px 15px; border-radius:11px; cursor:pointer;
    transition:transform .12s ease, box-shadow .18s ease, background .3s ease;
    box-shadow:0 2px 0 rgba(10,25,45,.06);
  }
  button:hover{transform:translateY(-2px); box-shadow:0 7px 16px -8px rgba(10,25,45,.5)}
  button:active{transform:translateY(0) scale(.97)}
  button.primary{background:var(--accent); border-color:transparent; color:#fff; font-weight:600}
  .slider{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--txt-soft)}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:190px; height:6px; border-radius:99px;
    background:linear-gradient(90deg,var(--accent) 0%, var(--accent) var(--pct,45%), rgba(125,150,175,.35) var(--pct,45%));
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:#fff; border:3px solid var(--accent); cursor:grab;
    box-shadow:0 3px 8px -2px rgba(0,0,0,.4);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);
  }
  .readout{
    font-variant-numeric:tabular-nums; font-weight:600; color:var(--txt);
    min-width:78px; text-align:right;
  }
  .hint{margin:11px 2px 0; text-align:center; color:var(--txt-soft); font-size:12.5px; line-height:1.7}
  kbd{
    font:inherit; font-size:11.5px; padding:2px 7px; border-radius:6px;
    border:1px solid var(--btn-line); background:var(--btn); color:var(--txt);
  }
  @media (max-width:560px){ input[type=range]{width:130px} .hint{font-size:12px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="emoji">🐦</span> 骑自行车的鹈鹕 <span class="emoji">🚲</span></h1>
    <p class="sub">一只戴着头盔、嘴里还叼着鱼的鹈鹕，正在夕阳的公路上蹬着车。</p>
  </header>

  <div class="frame">
    <svg id="scene" viewBox="0 0 800 450" role="img" aria-label="一只鹈鹕骑着自行车沿着公路前进的动画场景">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="var(--sky-1)"/>
          <stop offset="62%" stop-color="var(--sky-2)"/>
          <stop offset="100%" stop-color="var(--sky-3)"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6c8" stop-opacity=".95"/>
          <stop offset="55%" stop-color="#ffd977" stop-opacity=".38"/>
          <stop offset="100%" stop-color="#ffcf6a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--road)"/>
          <stop offset="100%" stop-color="var(--road-2)"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="60%" stop-color="#f6efe1"/>
          <stop offset="100%" stop-color="#e3d7c3"/>
        </linearGradient>
        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.4">
          <stop offset="0%" stop-color="#ffc857"/>
          <stop offset="100%" stop-color="#f59331"/>
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb454"/>
          <stop offset="100%" stop-color="#ef7d3a"/>
        </linearGradient>
        <linearGradient id="helmetGrad" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#ff7b62"/>
          <stop offset="100%" stop-color="#d83f34"/>
        </linearGradient>
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#31a3b8"/>
          <stop offset="100%" stop-color="#16697a"/>
        </linearGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <filter id="blurLight" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>

        <!-- one repeating tile of far hills -->
        <g id="hillFarTile">
          <path d="M0 300 C 60 262 108 258 158 288 C 196 254 242 246 292 282
                   C 330 250 380 250 420 286 C 462 252 512 250 556 284
                   C 596 256 648 254 692 286 C 730 262 772 266 800 296 L800 330 L0 330 Z"
                fill="var(--hill-far)"/>
        </g>
        <g id="hillMidTile">
          <path d="M0 330 C 48 300 96 296 140 320 C 186 292 232 292 276 322
                   C 322 296 366 298 408 326 C 452 300 502 300 546 328
                   C 590 304 640 304 688 330 C 728 310 768 312 800 334 L800 380 L0 380 Z"
                fill="var(--hill-mid)"/>
          <!-- little trees -->
          <g fill="var(--tree)">
            <path d="M96 322 l11 26 h-22 Z"/><path d="M100 300 l12 28 h-24 Z"/>
            <path d="M330 326 l10 24 h-20 Z"/><path d="M334 306 l11 26 h-22 Z"/>
            <path d="M600 324 l11 26 h-22 Z"/><path d="M604 302 l12 28 h-24 Z"/>
          </g>
          <g fill="var(--tree-dark)">
            <rect x="97" y="344" width="6" height="10" rx="2"/>
            <rect x="331" y="346" width="6" height="10" rx="2"/>
            <rect x="601" y="346" width="6" height="10" rx="2"/>
          </g>
        </g>
        <g id="cloudTile">
          <g fill="var(--cloud)" opacity="var(--cloud-op)">
            <g>
              <ellipse cx="110" cy="80" rx="46" ry="24"/><ellipse cx="150" cy="86" rx="38" ry="19"/>
              <ellipse cx="76" cy="90" rx="34" ry="17"/>
            </g>
            <g opacity=".85">
              <ellipse cx="420" cy="52" rx="38" ry="19"/><ellipse cx="452" cy="58" rx="30" ry="15"/>
              <ellipse cx="392" cy="60" rx="26" ry="13"/>
            </g>
            <g opacity=".7">
              <ellipse cx="660" cy="104" rx="42" ry="20"/><ellipse cx="694" cy="110" rx="32" ry="15"/>
              <ellipse cx="628" cy="111" rx="26" ry="12"/>
            </g>
          </g>
        </g>
        <g id="grassTile">
          <g stroke="var(--ground-dark)" stroke-width="3" stroke-linecap="round" opacity=".75">
            <path d="M30 448 q4 -16 10 -22"/><path d="M44 448 q-2 -14 -8 -20"/>
            <path d="M210 448 q5 -18 12 -24"/><path d="M226 448 q-3 -15 -9 -21"/>
            <path d="M470 448 q4 -17 11 -23"/><path d="M486 448 q-3 -14 -10 -20"/>
            <path d="M660 448 q5 -18 12 -23"/><path d="M676 448 q-3 -15 -10 -21"/>
          </g>
        </g>
      </defs>

      <!-- ================= SKY ================= -->
      <rect x="0" y="0" width="800" height="450" fill="url(#skyGrad)"/>

      <g id="stars" opacity="var(--star-op)"></g>

      <g id="sun" opacity="var(--sun-op)">
        <circle cx="648" cy="104" r="86" fill="url(#sunGlow)"/>
        <circle cx="648" cy="104" r="34" fill="#fff0b8"/>
        <circle cx="648" cy="104" r="27" fill="#ffe07a"/>
      </g>
      <g id="moon" opacity="var(--moon-op)">
        <circle cx="648" cy="98" r="72" fill="url(#sunGlow)" opacity=".5"/>
        <circle cx="648" cy="98" r="28" fill="#eef2ff"/>
        <circle cx="636" cy="90" r="6" fill="#d5ddf4" opacity=".8"/>
        <circle cx="658" cy="108" r="8" fill="#d5ddf4" opacity=".65"/>
        <circle cx="654" cy="84" r="4" fill="#d5ddf4" opacity=".6"/>
      </g>

      <!-- distant birds -->
      <g id="birds" fill="none" stroke="var(--hill-near)" stroke-width="2.4" stroke-linecap="round" opacity=".55">
        <path d="M0 0 q7 -7 14 0 q7 -7 14 0" transform="translate(150,120)"/>
        <path d="M0 0 q6 -6 12 0 q6 -6 12 0" transform="translate(196,142)"/>
        <path d="M0 0 q5 -5 10 0 q5 -5 10 0" transform="translate(120,152)"/>
      </g>

      <!-- ================= SCROLLING BACKGROUND ================= -->
      <g id="cloudLayer"><use href="#cloudTile"/><use href="#cloudTile" x="800"/></g>
      <g id="hillFarLayer"><use href="#hillFarTile"/><use href="#hillFarTile" x="800"/></g>
      <g id="hillMidLayer"><use href="#hillMidTile"/><use href="#hillMidTile" x="800"/></g>

      <!-- ================= GROUND & ROAD ================= -->
      <rect x="0" y="368" width="800" height="82" fill="var(--ground)"/>
      <rect x="0" y="368" width="800" height="7" fill="var(--ground-dark)" opacity=".55"/>
      <rect x="0" y="374" width="800" height="34" fill="url(#roadGrad)"/>
      <rect x="0" y="374" width="800" height="3" fill="#ffffff" opacity=".18"/>
      <rect x="0" y="405" width="800" height="4" fill="#000000" opacity=".12"/>
      <line id="roadLine" x1="0" y1="392" x2="800" y2="392"
            stroke="var(--road-line)" stroke-width="4" stroke-dasharray="34 26" opacity=".8"/>

      <!-- speed streaks -->
      <g id="streaks" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0"></g>

      <!-- dust puffs -->
      <g id="dust"></g>

      <!-- ================= RIDER (bike + pelican) ================= -->
      <g id="rider">
        <!-- contact shadow -->
        <ellipse id="shadow" cx="360" cy="392" rx="118" ry="11" fill="#0b1a2b" opacity=".22" filter="url(#soft)"/>

        <!-- FAR wing (behind everything) -->
        <g id="farWing">
          <path d="M352 202 C 372 194 402 202 424 216 C 430 222 424 230 416 227
                   C 394 219 368 214 348 214 Z" fill="#d9cdb8"/>
          <path d="M356 209 C 378 209 400 216 416 224" fill="none" stroke="#c6b8a0" stroke-width="1.6"/>
        </g>

        <!-- FAR leg -->
        <g id="farLeg">
          <line id="farThigh" stroke="#ded2bd" stroke-width="17" stroke-linecap="round"/>
          <line id="farShin"  stroke="#c9822f" stroke-width="8.5" stroke-linecap="round"/>
          <g id="farFoot" fill="#c9822f">
            <path d="M-12 0 L12 0 L14 5 L-11 5 Z"/>
            <path d="M-11 4 C -4 12, 8 12, 14 5 L 12 6 Z"/>
          </g>
        </g>

        <!-- BICYCLE -->
        <g id="bike">
          <!-- rear wheel -->
          <g id="wheelRear">
            <circle cx="250" cy="330" r="46" fill="none" stroke="#25303c" stroke-width="6"/>
            <circle cx="250" cy="330" r="41" fill="none" stroke="#4c5a68" stroke-width="2.2" opacity=".8"/>
            <g id="spokesRear" stroke="#cfd8e0" stroke-width="1.6" opacity=".95"></g>
            <circle cx="250" cy="330" r="6" fill="#8c98a4"/>
            <circle cx="250" cy="330" r="2.6" fill="#3a4652"/>
          </g>
          <!-- front wheel -->
          <g id="wheelFront">
            <circle cx="470" cy="330" r="46" fill="none" stroke="#25303c" stroke-width="6"/>
            <circle cx="470" cy="330" r="41" fill="none" stroke="#4c5a68" stroke-width="2.2" opacity=".8"/>
            <g id="spokesFront" stroke="#cfd8e0" stroke-width="1.6" opacity=".95"></g>
            <circle cx="470" cy="330" r="6" fill="#8c98a4"/>
            <circle cx="470" cy="330" r="2.6" fill="#3a4652"/>
          </g>

          <!-- chain -->
          <g stroke="#5c6672" stroke-width="3" stroke-dasharray="5 3" fill="none">
            <line id="chainTop" x1="250" y1="323" x2="352" y2="322"/>
            <line id="chainBot" x1="250" y1="337" x2="352" y2="350"/>
          </g>

          <!-- frame -->
          <g stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" fill="none">
            <path d="M250 330 L352 336"/>              <!-- chainstay -->
            <path d="M250 330 L302 264"/>              <!-- seat stay -->
            <path d="M352 336 L302 264"/>              <!-- seat tube -->
            <path d="M352 336 L438 268"/>              <!-- down tube -->
            <path d="M306 266 L436 266"/>              <!-- top tube -->
            <path d="M440 272 L432 246"/>              <!-- head tube -->
            <path d="M470 330 L442 274"/>              <!-- fork -->
          </g>
          <!-- saddle -->
          <path d="M282 258 C 292 250 314 250 318 258 C 312 264 290 266 282 258 Z" fill="#2b3542"/>
          <line x1="302" y1="264" x2="302" y2="256" stroke="#9aa6b2" stroke-width="5"/>
          <!-- handlebar -->
          <g stroke="#2b3542" stroke-width="7" stroke-linecap="round" fill="none">
            <path d="M432 246 L458 240 C 470 238 474 248 468 254"/>
          </g>
          <circle cx="466" cy="243" r="5" fill="#ef5f4c"/>
          <!-- bell -->
          <circle cx="446" cy="236" r="5.5" fill="#ffd35c" stroke="#c99a24" stroke-width="1.4"/>
          <!-- crank + chainring -->
          <circle cx="352" cy="336" r="15" fill="none" stroke="#9aa6b2" stroke-width="3"/>
          <circle cx="352" cy="336" r="9" fill="none" stroke="#9aa6b2" stroke-width="2" opacity=".7"/>
          <g id="crankFar">
            <line x1="352" y1="336" x2="352" y2="353" stroke="#6f7b88" stroke-width="6" stroke-linecap="round"/>
          </g>
          <rect id="pedalFar" x="-11" y="-3" width="22" height="6" rx="2.5" fill="#4a5561"/>
        </g>

        <!-- PELICAN -->
        <g id="pelican">
          <!-- tail feathers -->
          <g id="tail" fill="#e8dcc7">
            <path d="M296 242 C 268 240 250 248 244 256 C 258 258 280 256 298 250 Z"/>
            <path d="M296 252 C 272 254 256 262 252 270 C 266 270 286 264 300 258 Z" fill="#dccfb8"/>
          </g>
          <!-- body -->
          <path id="body" d="M288 258 C 284 230 300 208 326 199 C 353 189 378 194 388 213
                             C 398 232 379 253 350 261 C 323 269 296 272 288 258 Z"
                fill="url(#bodyGrad)"/>
          <path d="M300 252 C 320 262 344 260 362 250" fill="none" stroke="#e0d3bd" stroke-width="2"/>
          <!-- jersey stripe + number -->
          <path d="M312 205 C 322 226 320 250 306 266" fill="none" stroke="#ef5f4c" stroke-width="7" opacity=".9"/>
          <path d="M326 201 C 336 224 334 248 320 268" fill="none" stroke="#16697a" stroke-width="5" opacity=".85"/>

          <!-- neck -->
          <path id="neck" d="M352 210 C 358 186 376 168 396 162 L 412 186
                             C 396 192 378 204 370 222 Z" fill="url(#bodyGrad)"/>
          <!-- head + beak group (bobs) -->
          <g id="head">
            <!-- head -->
            <circle cx="408" cy="163" r="21" fill="url(#bodyGrad)"/>
            <path d="M392 150 C 396 138 408 134 414 140" fill="none" stroke="#e6dac4" stroke-width="4" stroke-linecap="round"/>

            <!-- upper beak -->
            <path d="M420 150 C 450 148 486 155 514 166 C 500 172 464 173 434 168
                     C 424 166 418 158 420 150 Z" fill="url(#beakGrad)"/>
            <path d="M424 154 C 452 155 486 161 510 167" fill="none" stroke="#e07f2c" stroke-width="1.4" opacity=".7"/>

            <!-- lower beak + pouch (opens when honking) -->
            <g id="lowerBeak">
              <path d="M424 163 C 452 169 486 171 512 167 C 506 188 476 202 448 196
                       C 432 192 422 178 424 163 Z" fill="url(#pouchGrad)"/>
              <path d="M432 176 C 452 188 478 190 498 180" fill="none" stroke="#d9682c" stroke-width="1.6" opacity=".65"/>
              <!-- fish tail poking out of the pouch -->
              <g id="fish" transform="translate(470,196)">
                <path d="M0 0 C 8 -3 14 -8 18 -14 C 12 -12 4 -8 0 -4 Z" fill="#7fd0e8"/>
                <path d="M0 -2 C 7 -4 12 -9 16 -13" fill="none" stroke="#4aa8c6" stroke-width="1.4"/>
              </g>
            </g>

            <!-- eye -->
            <g id="eye">
              <circle cx="418" cy="155" r="6.2" fill="#ffffff"/>
              <circle id="pupil" cx="420" cy="155.5" r="3.2" fill="#22303c"/>
              <circle cx="421.4" cy="154" r="1.1" fill="#ffffff"/>
              <rect id="lid" x="411.5" y="148.5" width="13.5" height="13.5" rx="6" fill="#f2e8d6" opacity="0"/>
            </g>

            <!-- helmet -->
            <g id="helmet">
              <path d="M385 158 C 384 134 402 119 421 124 C 437 128 445 143 442 158
                       C 430 152 400 151 385 158 Z" fill="url(#helmetGrad)"/>
              <path d="M390 149 C 402 141 424 140 436 147" fill="none" stroke="#ffffff" stroke-width="2.6" opacity=".55"/>
              <g fill="#a52d24" opacity=".75">
                <rect x="398" y="130" width="5" height="12" rx="2.5" transform="rotate(-12 400 136)"/>
                <rect x="411" y="127" width="5" height="13" rx="2.5" transform="rotate(-6 413 133)"/>
                <rect x="424" y="129" width="5" height="12" rx="2.5" transform="rotate(4 426 135)"/>
              </g>
              <path d="M441 156 L 456 152 L 455 158 L 441 161 Z" fill="#c9382d"/>
              <path d="M389 160 C 394 172 404 176 412 175" fill="none" stroke="#8f2b22" stroke-width="2.2" opacity=".8"/>
            </g>

            <!-- honk bubble -->
            <g id="honkBubble" opacity="0">
              <path d="M520 108 q34 -22 66 -4 q24 14 8 34 q-20 22 -54 12 l-18 12 l3 -18 q-24 -18 -5 -36 Z"
                    fill="#ffffff" opacity=".95"/>
              <text x="556" y="132" font-size="24" font-weight="700" text-anchor="middle" fill="#ef5f4c">嘎!</text>
            </g>
          </g>

          <!-- scarf (JS-animated) -->
          <path id="scarfKnot" d="M368 188 C 380 182 392 184 396 192 C 386 200 372 198 368 188 Z" fill="#ef5f4c"/>
          <path id="scarf" fill="none" stroke="#ef5f4c" stroke-width="9" stroke-linecap="round"/>
          <path id="scarf2" fill="none" stroke="#ff8a74" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        </g>

        <!-- NEAR wing gripping the handlebar -->
        <g id="nearWing">
          <path d="M354 198 C 384 196 424 212 462 236 C 468 242 462 252 452 249
                   C 416 238 378 224 348 214 Z" fill="url(#bodyGrad)"/>
          <g fill="none" stroke="#ded1ba" stroke-width="1.8">
            <path d="M362 206 C 392 210 428 224 452 240"/>
            <path d="M372 214 C 400 220 430 232 450 244"/>
          </g>
          <!-- wing "hand" on the grip -->
          <path d="M448 234 C 462 232 470 240 466 250 C 458 254 448 248 448 234 Z" fill="#f3ead9"/>
        </g>

        <!-- NEAR leg -->
        <g id="nearLeg">
          <line id="nearThigh" stroke="#f7f0e2" stroke-width="18" stroke-linecap="round"/>
          <line id="nearShin"  stroke="#f0a03f" stroke-width="9.5" stroke-linecap="round"/>
        </g>
        <g id="crankNear">
          <line x1="352" y1="336" x2="352" y2="319" stroke="#8b97a4" stroke-width="6" stroke-linecap="round"/>
        </g>
        <rect id="pedalNear" x="-12" y="-3.2" width="24" height="6.4" rx="3" fill="#5b6672"/>
        <g id="nearFoot" fill="#f0a03f">
          <path d="M-13 0 L13 0 L15 5 L-12 5 Z"/>
          <path d="M-12 4 C -4 13, 9 13, 15 5 L 13 6 Z" fill="#e59033"/>
        </g>
      </g>

      <!-- foreground grass, scrolls fastest -->
      <g id="grassLayer"><use href="#grassTile"/><use href="#grassTile" x="800"/></g>
    </svg>
  </div>

  <div class="controls">
    <button id="btnPlay" class="primary">⏸ 暂停</button>
    <div class="slider">
      <label for="speed">车速</label>
      <input id="speed" type="range" min="0" max="100" value="45" />
      <span class="readout" id="kmh">14.4 km/h</span>
    </div>
    <button id="btnHonk">📣 嘎一声</button>
    <button id="btnNight">🌙 夜骑</button>
    <button id="btnWheelie">🤸 后轮平衡</button>
  </div>

  <p class="hint">
    快捷键：<kbd>空格</kbd> 暂停/继续 · <kbd>←</kbd><kbd>→</kbd> 调速 · <kbd>H</kbd> 鸣笛 · <kbd>N</kbd> 昼夜 · <kbd>W</kbd> 抬前轮
    <br/>全部画面由纯 SVG 绘制，双腿使用反向动力学（IK）实时求解，所以踩踏动作和曲柄始终严格同步。
  </p>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ---------------- geometry constants ---------------- */
  const R = 46;                    // wheel radius
  const BB = { x: 352, y: 336 };   // bottom bracket (crank centre)
  const CRANK = 17;                // crank arm length
  const HIP = { x: 303, y: 250 };  // hip joint
  const THIGH = 58, SHIN = 62;
  const GEAR = 0.40;               // crank revs per wheel rev

  /* ---------------- build spokes & stars ---------------- */
  function makeSpokes(g, cx, cy) {
    let d = "";
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      d += `M${cx} ${cy} L${(cx + Math.cos(a) * 40).toFixed(1)} ${(cy + Math.sin(a) * 40).toFixed(1)} `;
    }
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    g.appendChild(p);
  }
  makeSpokes($("spokesRear"), 250, 330);
  makeSpokes($("spokesFront"), 470, 330);

  const NS = "http://www.w3.org/2000/svg";
  (function stars() {
    const g = $("stars");
    for (let i = 0; i < 46; i++) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", (Math.random() * 800).toFixed(1));
      c.setAttribute("cy", (Math.random() * 300).toFixed(1));
      c.setAttribute("r", (Math.random() * 1.5 + 0.6).toFixed(2));
      c.setAttribute("fill", "#fff");
      c.setAttribute("opacity", (Math.random() * 0.7 + 0.3).toFixed(2));
      c.dataset.tw = (Math.random() * 6.283).toFixed(2);
      g.appendChild(c);
    }
  })();

  /* ---------------- dust particles ---------------- */
  const dustG = $("dust");
  const dust = [];
  for (let i = 0; i < 16; i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("fill", "#cbb9a0");
    c.setAttribute("r", 3);
    c.setAttribute("opacity", 0);
    dustG.appendChild(c);
    dust.push({ el: c, life: 0, x: 0, y: 0, vx: 0, vy: 0, r: 3 });
  }
  function spawnDust() {
    const p = dust.find((d) => d.life <= 0);
    if (!p) return;
    p.x = 244 + Math.random() * 12;
    p.y = 378 + Math.random() * 6;
    p.vx = -(30 + Math.random() * 70);
    p.vy = -(10 + Math.random() * 45);
    p.r = 2 + Math.random() * 4;
    p.life = 1;
  }

  /* ---------------- speed streaks ---------------- */
  const streakG = $("streaks");
  const streaks = [];
  for (let i = 0; i < 7; i++) {
    const l = document.createElementNS(NS, "line");
    streakG.appendChild(l);
    streaks.push({ el: l, x: Math.random() * 800, y: 150 + Math.random() * 200, len: 20 + Math.random() * 50, sp: 0.8 + Math.random() * 0.9 });
  }

  /* ---------------- state ---------------- */
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const st = {
    dist: 0, t: 0,
    speedPct: 45,
    paused: reduce,
    honk: 0,
    wheelie: 0, wheelieTarget: 0,
    blink: 2 + Math.random() * 3,
  };
  const MAXV = 320;                       // px/s at 100 %
  const vel = () => (st.speedPct / 100) * MAXV;

  /* ---------------- two-bone IK ---------------- */
  function ik(hx, hy, fx, fy, a, b) {
    let dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy) || 0.001;
    const lo = Math.abs(a - b) + 0.5, hi = a + b - 0.5;
    const dc = Math.min(Math.max(d, lo), hi);
    const ux = dx / d, uy = dy / d;
    const tx = hx + ux * dc, ty = hy + uy * dc;      // clamped foot target
    const base = Math.atan2(uy, ux);
    let cosA = (a * a + dc * dc - b * b) / (2 * a * dc);
    cosA = Math.min(1, Math.max(-1, cosA));
    const off = Math.acos(cosA);
    const k1x = hx + a * Math.cos(base + off), k1y = hy + a * Math.sin(base + off);
    const k2x = hx + a * Math.cos(base - off), k2y = hy + a * Math.sin(base - off);
    // knee always points forward (larger x) like a real cyclist
    const forward = k1x > k2x;
    return { kx: forward ? k1x : k2x, ky: forward ? k1y : k2y, fx: tx, fy: ty };
  }

  const el = {
    rider: $("rider"), shadow: $("shadow"),
    wr: $("wheelRear"), wf: $("wheelFront"),
    crankN: $("crankNear"), crankF: $("crankFar"),
    pedalN: $("pedalNear"), pedalF: $("pedalFar"),
    nearThigh: $("nearThigh"), nearShin: $("nearShin"), nearFoot: $("nearFoot"),
    farThigh: $("farThigh"), farShin: $("farShin"), farFoot: $("farFoot"),
    head: $("head"), lower: $("lowerBeak"), fish: $("fish"), lid: $("lid"),
    scarf: $("scarf"), scarf2: $("scarf2"),
    farWing: $("farWing"), tail: $("tail"),
    clouds: $("cloudLayer"), hf: $("hillFarLayer"), hm: $("hillMidLayer"),
    grass: $("grassLayer"), roadLine: $("roadLine"),
    chainTop: $("chainTop"), chainBot: $("chainBot"),
    bubble: $("honkBubble"), birds: $("birds"),
    kmh: $("kmh"),
  };

  function setLine(l, x1, y1, x2, y2) {
    l.setAttribute("x1", x1.toFixed(2)); l.setAttribute("y1", y1.toFixed(2));
    l.setAttribute("x2", x2.toFixed(2)); l.setAttribute("y2", y2.toFixed(2));
  }
  const mod = (a, n) => ((a % n) + n) % n;

  /* ---------------- one leg ---------------- */
  function leg(angle, thighEl, shinEl, footEl, hipYOff) {
    const px = BB.x + Math.cos(angle) * CRANK;
    const py = BB.y + Math.sin(angle) * CRANK;
    const s = ik(HIP.x, HIP.y + hipYOff, px, py, THIGH, SHIN);
    setLine(thighEl, HIP.x, HIP.y + hipYOff, s.kx, s.ky);
    setLine(shinEl, s.kx, s.ky, s.fx, s.fy);
    // ankle keeps the foot nearly level, with a natural little roll
    const roll = Math.sin(angle - 0.6) * 13;
    footEl.setAttribute("transform", `translate(${px.toFixed(2)},${(py - 4).toFixed(2)}) rotate(${roll.toFixed(2)})`);
    return { px, py };
  }

  /* ---------------- main loop ---------------- */
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;                 // keep physics sane after tab switch
    const v = st.paused ? 0 : vel();
    st.t += dt;
    st.dist += v * dt;

    const wheelRad = st.dist / R;                       // wheel rotation (rad)
    const wheelDeg = wheelRad * 180 / Math.PI;
    const crankA = wheelRad * GEAR;                     // crank angle (rad)
    const sp = st.speedPct / 100;

    /* wheels + crank */
    el.wr.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 250 330)`);
    el.wf.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 470 330)`);
    const cDeg = crankA * 180 / Math.PI;
    el.crankN.setAttribute("transform", `rotate(${cDeg.toFixed(2)} 352 336)`);
    el.crankF.setAttribute("transform", `rotate(${(cDeg + 180).toFixed(2)} 352 336)`);

    /* body bob driven by the pedal stroke */
    const bob = Math.sin(crankA * 2) * 1.7 + Math.sin(st.t * 19) * 0.5 * sp;

    /* wheelie */
    st.wheelie += (st.wheelieTarget - st.wheelie) * Math.min(1, dt * 5);
    const lean = -st.wheelie * 15;

    el.rider.setAttribute("transform",
      `translate(0 ${bob.toFixed(2)}) rotate(${lean.toFixed(2)} 250 330)`);
    el.shadow.setAttribute("opacity", (0.22 - st.wheelie * 0.08 - bob * 0.006).toFixed(3));
    el.shadow.setAttribute("rx", (118 - st.wheelie * 26).toFixed(1));

    /* legs (near pedal leads by 180°) */
    const pn = leg(crankA, el.nearThigh, el.nearShin, el.nearFoot, 0);
    leg(crankA + Math.PI, el.farThigh, el.farShin, el.farFoot, 1.5);
    el.pedalN.setAttribute("transform", `translate(${pn.px.toFixed(2)},${pn.py.toFixed(2)}) rotate(${(Math.sin(crankA) * 4).toFixed(2)})`);
    const fpx = BB.x - Math.cos(crankA) * CRANK, fpy = BB.y - Math.sin(crankA) * CRANK;
    el.pedalF.setAttribute("transform", `translate(${fpx.toFixed(2)},${fpy.toFixed(2)})`);

    /* head bob & look */
    const hb = Math.sin(crankA * 2 + 0.8) * 1.1 + st.wheelie * 2;
    const hr = Math.sin(crankA * 2 + 0.4) * 0.9 - st.wheelie * 4;
    el.head.setAttribute("transform", `translate(${(hb * 0.5).toFixed(2)} ${hb.toFixed(2)}) rotate(${hr.toFixed(2)} 404 166)`);

    /* far wing flaps a little, faster when pedalling hard */
    const flap = Math.sin(st.t * (3 + sp * 9)) * (3 + sp * 11);
    el.farWing.setAttribute("transform", `rotate(${flap.toFixed(2)} 352 204)`);
    el.tail.setAttribute("transform", `rotate(${(Math.sin(st.t * 4) * 1.6 * (0.3 + sp)).toFixed(2)} 298 250)`);

    /* scarf: a sine ribbon trailing behind the neck */
    const amp = 2 + sp * 9, N = 9;
    let d1 = "", d2 = "";
    for (let i = 0; i <= N; i++) {
      const f = i / N;
      const x = 386 - i * 13.5 - sp * 4 * f;
      const y = 190 + Math.sin(st.t * (5 + sp * 7) - i * 0.85) * amp * f - f * f * 16 - sp * 10 * f;
      d1 += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      d2 += (i ? "L" : "M") + x.toFixed(1) + " " + (y + 4).toFixed(1) + " ";
    }
    el.scarf.setAttribute("d", d1);
    el.scarf2.setAttribute("d", d2);

    /* blinking */
    st.blink -= dt;
    let lidOp = 0;
    if (st.blink < 0.14) lidOp = 1 - Math.abs(st.blink + 0.07) / 0.07;
    if (st.blink < 0) st.blink = 2.5 + Math.random() * 4;
    el.lid.setAttribute("opacity", Math.max(0, lidOp).toFixed(2));

    /* honking */
    if (st.honk > 0) {
      st.honk = Math.max(0, st.honk - dt);
      const k = Math.sin(Math.min(1, st.honk / 0.6) * Math.PI);
      el.lower.setAttribute("transform", `rotate(${(k * 17).toFixed(2)} 424 163)`);
      el.bubble.setAttribute("opacity", (k * 1.2).toFixed(2));
      el.bubble.setAttribute("transform", `translate(0 ${(-k * 6).toFixed(1)}) scale(${(0.9 + k * 0.1).toFixed(3)})`);
    } else {
      el.lower.setAttribute("transform", "rotate(0 424 163)");
      el.bubble.setAttribute("opacity", "0");
    }
    el.fish.setAttribute("transform",
      `translate(470,196) rotate(${(Math.sin(st.t * 9) * 12).toFixed(2)})`);

    /* parallax layers */
    el.clouds.setAttribute("transform", `translate(${(-mod(st.dist * 0.05, 800)).toFixed(1)} 0)`);
    el.hf.setAttribute("transform", `translate(${(-mod(st.dist * 0.14, 800)).toFixed(1)} 0)`);
    el.hm.setAttribute("transform", `translate(${(-mod(st.dist * 0.34, 800)).toFixed(1)} 0)`);
    el.grass.setAttribute("transform", `translate(${(-mod(st.dist * 1.25, 800)).toFixed(1)} 0)`);
    el.roadLine.setAttribute("stroke-dashoffset", mod(st.dist, 60).toFixed(1));
    const co = mod(st.dist * 0.9, 8).toFixed(1);
    el.chainTop.setAttribute("stroke-dashoffset", (-co));
    el.chainBot.setAttribute("stroke-dashoffset", co);
    el.birds.setAttribute("transform", `translate(${(-mod(st.dist * 0.03, 900)).toFixed(1)} ${(Math.sin(st.t) * 3).toFixed(1)})`);

    /* dust */
    if (!st.paused && Math.random() < sp * 0.55) spawnDust();
    for (const p of dust) {
      if (p.life <= 0) { p.el.setAttribute("opacity", 0); continue; }
      p.life -= dt * 1.5;
      p.x += (p.vx - v * 0.35) * dt; p.y += p.vy * dt; p.vy += 26 * dt;
      p.el.setAttribute("cx", p.x.toFixed(1));
      p.el.setAttribute("cy", p.y.toFixed(1));
      p.el.setAttribute("r", (p.r * (0.6 + p.life * 0.9)).toFixed(1));
      p.el.setAttribute("opacity", (Math.max(0, p.life) * 0.42).toFixed(2));
    }

    /* streaks */
    streakG.setAttribute("opacity", Math.max(0, (sp - 0.45) * 0.6).toFixed(2));
    for (const s of streaks) {
      s.x -= v * s.sp * 1.5 * dt;
      if (s.x < -80) { s.x = 820 + Math.random() * 120; s.y = 140 + Math.random() * 210; }
      s.el.setAttribute("x1", s.x.toFixed(1)); s.el.setAttribute("y1", s.y.toFixed(1));
      s.el.setAttribute("x2", (s.x + s.len).toFixed(1)); s.el.setAttribute("y2", s.y.toFixed(1));
    }

    /* twinkling stars */
    if (document.body.classList.contains("night")) {
      for (const c of $("stars").children) {
        const tw = parseFloat(c.dataset.tw);
        c.setAttribute("opacity", (0.35 + 0.45 * (0.5 + 0.5 * Math.sin(st.t * 2.2 + tw))).toFixed(2));
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------------- controls ---------------- */
  const slider = $("speed"), btnPlay = $("btnPlay");
  function syncSlider() {
    slider.style.setProperty("--pct", slider.value + "%");
    st.speedPct = +slider.value;
    el.kmh.textContent = (st.speedPct * 0.32).toFixed(1) + " km/h";
  }
  slider.addEventListener("input", syncSlider);
  syncSlider();

  function setPaused(p) {
    st.paused = p;
    btnPlay.textContent = p ? "▶ 继续" : "⏸ 暂停";
  }
  setPaused(st.paused);
  btnPlay.addEventListener("click", () => setPaused(!st.paused));

  /* honk with a little WebAudio quack */
  let actx = null;
  function honk() {
    st.honk = 0.6;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t0 = actx.currentTime;
      [0, 0.24].forEach((off, i) => {
        const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(320 - i * 45, t0 + off);
        o.frequency.exponentialRampToValueAtTime(175 - i * 20, t0 + off + 0.19);
        f.type = "lowpass"; f.frequency.value = 1300;
        g.gain.setValueAtTime(0.0001, t0 + off);
        g.gain.exponentialRampToValueAtTime(0.22, t0 + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.22);
        o.connect(f); f.connect(g); g.connect(actx.destination);
        o.start(t0 + off); o.stop(t0 + off + 0.26);
      });
    } catch (e) { /* audio is optional */ }
  }
  $("btnHonk").addEventListener("click", honk);

  const btnNight = $("btnNight");
  btnNight.addEventListener("click", () => {
    const n = document.body.classList.toggle("night");
    btnNight.textContent = n ? "☀️ 白天" : "🌙 夜骑";
    if (!n) for (const c of $("stars").children) c.setAttribute("opacity", "");
  });

  const btnW = $("btnWheelie");
  btnW.addEventListener("click", () => {
    st.wheelieTarget = st.wheelieTarget ? 0 : 1;
    btnW.textContent = st.wheelieTarget ? "🚲 放下前轮" : "🤸 后轮平衡";
  });

  /* keyboard */
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); setPaused(!st.paused); }
    else if (e.key === "ArrowRight") { slider.value = Math.min(100, +slider.value + 5); syncSlider(); }
    else if (e.key === "ArrowLeft") { slider.value = Math.max(0, +slider.value - 5); syncSlider(); }
    else if (k === "h") honk();
    else if (k === "n") btnNight.click();
    else if (k === "w") btnW.click();
  });

  /* click the scene to honk too */
  $("scene").addEventListener("click", honk);
})();
</script>
</body>
</html>
