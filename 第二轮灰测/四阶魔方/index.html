<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0d18">
<title>动漫风四阶魔方 · CFOP / 桥式解法分步演示</title>
<style>
/* ============================================================================
 * 动漫风四阶魔方 —— 界面样式（黑描边 + 高饱和配色 + 卡通投影）
 * ==========================================================================*/
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  background: #0a0d18; color: #eef2ff; user-select: none;
  -webkit-font-smoothing: antialiased;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv:active { cursor: grabbing; }
.fatal { padding: 40px; font-size: 18px; line-height: 1.8; }

/* ------------------------------- 通用控件 ------------------------------- */
.btn {
  font: inherit; font-weight: 800; letter-spacing: .04em;
  color: #10131f; background: linear-gradient(180deg, #fff, #dfe6f7);
  border: 2.5px solid #05070d; border-radius: 12px;
  padding: 9px 16px; cursor: pointer;
  box-shadow: 0 3px 0 #05070d, 0 6px 14px rgba(0, 0, 0, .35);
  transition: transform .08s ease, box-shadow .08s ease, filter .15s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 #05070d, 0 3px 8px rgba(0, 0, 0, .35); }
.btn.primary { background: linear-gradient(180deg, #ffe066, #ffb020); }
.btn.ghost { background: linear-gradient(180deg, #3b4a72, #232c47); color: #e9efff; }
.btn.loading { position: relative; color: transparent; pointer-events: none; }
.btn.loading::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 16px; height: 16px;
  border: 3px solid #10131f; border-top-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------- 顶栏 ------------------------------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px; padding: 12px 16px;
  background: linear-gradient(180deg, rgba(8, 11, 22, .92), rgba(8, 11, 22, .45) 70%, transparent);
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.cube-logo {
  display: grid; place-items: center; width: 42px; height: 42px; flex: none;
  font-weight: 900; font-size: 15px; color: #0b0f1a;
  background: conic-gradient(from 210deg, #ffd60a, #22c55e, #2f6bff, #ff3b30, #ffd60a);
  border: 3px solid #05070d; border-radius: 12px; transform: rotate(-6deg);
  box-shadow: 0 3px 0 #05070d, 0 8px 18px rgba(0, 0, 0, .45);
}
.brand div { display: flex; flex-direction: column; line-height: 1.15; }
.brand b { font-size: 18px; letter-spacing: .06em; }
.brand span { font-size: 11.5px; color: #93a3c9; letter-spacing: .12em; }

.seg { display: flex; background: rgba(12, 17, 33, .82); border: 2.5px solid #05070d; border-radius: 13px; padding: 3px; box-shadow: 0 3px 0 #05070d; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 7px 15px; font-size: 13.5px; font-weight: 800; border-radius: 10px; color: #a8b6d8; white-space: nowrap; }
.seg input:checked + span { color: #10131f; background: linear-gradient(180deg, #7ee8ff, #29b6f6); box-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
.acts { display: flex; gap: 9px; }
.only-mobile { display: none; }

/* ------------------------------- 步骤面板 ------------------------------- */
.panel {
  position: fixed; top: 74px; right: 14px; bottom: 104px; width: 352px; z-index: 15;
  display: flex; flex-direction: column;
  background: rgba(11, 15, 28, .88); backdrop-filter: blur(9px);
  border: 3px solid #05070d; border-radius: 18px;
  box-shadow: 0 6px 0 #05070d, 0 18px 40px rgba(0, 0, 0, .5);
  overflow: hidden; transition: transform .28s cubic-bezier(.4, 1.3, .5, 1);
}
.panel-head {
  display: flex; align-items: baseline; gap: 9px; padding: 12px 15px 10px;
  border-bottom: 2px dashed rgba(255, 255, 255, .14);
}
.panel-head b { font-size: 15px; letter-spacing: .08em; }
.panel-head span { font-size: 12px; color: #ffd60a; font-weight: 800; }
.steps { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
.steps::-webkit-scrollbar { width: 8px; }
.steps::-webkit-scrollbar-thumb { background: #2c3céé; background: #2c3a5e; border-radius: 8px; }
.empty { color: #8fa0c6; font-size: 13px; line-height: 2; padding: 14px 10px; }

.step {
  border: 2px solid rgba(255, 255, 255, .1); border-radius: 13px; padding: 9px 11px;
  background: rgba(20, 27, 48, .7); cursor: pointer; transition: .15s;
}
.step:hover { border-color: rgba(126, 232, 255, .5); transform: translateX(-2px); }
.step.active { border-color: #ffd60a; background: rgba(48, 42, 16, .78); box-shadow: 0 0 0 2px rgba(255, 214, 10, .25); }
.step-head { display: flex; align-items: center; gap: 7px; }
.step-head .nm { font-size: 13.5px; font-weight: 800; flex: 1; }
.step-head .cnt { font-size: 11px; color: #93a3c9; background: rgba(255, 255, 255, .08); border-radius: 20px; padding: 1px 8px; }
.desc { font-size: 11.5px; color: #93a3c9; line-height: 1.55; margin: 5px 0 6px; }
.ph { font-size: 10.5px; font-weight: 900; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; border: 1.5px solid #05070d; color: #0b0f1a; }
.ph-归约 { background: #7ee8ff; }
.ph-奇偶 { background: #ff8ab3; }
.ph-CFOP { background: #ffd60a; }
.ph-Roux { background: #7bf1a8; }
.mvs { display: flex; flex-wrap: wrap; gap: 4px; }
.mv {
  font: 700 11.5px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  padding: 4px 6px; border-radius: 6px; background: rgba(255, 255, 255, .1); color: #dbe4ff;
  border: 1.5px solid transparent;
}
.mv.done { background: rgba(126, 232, 255, .16); color: #7ee8ff; }
.mv.now { background: #ffd60a; color: #10131f; border-color: #05070d; transform: scale(1.12); }
.legend { padding: 8px 14px 11px; font-size: 10.5px; color: #7f8db2; line-height: 1.7; border-top: 2px dashed rgba(255, 255, 255, .12); }
.legend code { color: #b9c7ee; }

/* ------------------------------- 播放条 ------------------------------- */
.playbar {
  position: fixed; left: 14px; right: 380px; bottom: 14px; z-index: 15;
  background: rgba(11, 15, 28, .9); backdrop-filter: blur(9px);
  border: 3px solid #05070d; border-radius: 18px; padding: 10px 14px;
  box-shadow: 0 6px 0 #05070d, 0 18px 40px rgba(0, 0, 0, .5);
  transition: opacity .2s;
}
.playbar.disabled { opacity: .5; }
.playbar.disabled .ctrl { pointer-events: none; }
.cur { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cur .nextmv { color: #93a3c9; font-weight: 600; font-size: 12px; }
.cur .nextmv b { color: #ffd60a; font: 800 13px ui-monospace, Menlo, monospace; }
.ctrl { display: flex; align-items: center; gap: 8px; }
.ctrl button {
  font: 700 14px/1 system-ui; color: #eef2ff; background: linear-gradient(180deg, #3b4a72, #222b46);
  border: 2.5px solid #05070d; border-radius: 10px; width: 40px; height: 34px; cursor: pointer;
  box-shadow: 0 2.5px 0 #05070d;
}
.ctrl button:active { transform: translateY(2px); box-shadow: none; }
.ctrl button.play { width: 52px; background: linear-gradient(180deg, #7bf1a8, #23c46a); color: #08210f; }
#progress { flex: 1; min-width: 80px; height: 26px; accent-color: #ffd60a; cursor: pointer; }
#moveCounter { font: 800 13px ui-monospace, Menlo, monospace; color: #ffd60a; min-width: 74px; text-align: center; }
#speed {
  font: 700 12.5px system-ui; color: #eef2ff; background: #222b46;
  border: 2.5px solid #05070d; border-radius: 10px; padding: 6px 6px; cursor: pointer;
}

/* ------------------------------- 状态 / 提示 ------------------------------- */
.status {
  position: fixed; left: 16px; bottom: 108px; z-index: 12; max-width: 44vw;
  font-size: 12.5px; color: #a9b8db; text-shadow: 0 2px 6px #000;
  padding: 6px 12px; border-radius: 10px; background: rgba(9, 12, 24, .6);
  border: 1.5px solid rgba(255, 255, 255, .08); line-height: 1.5;
}
.status.ok { color: #7bf1a8; border-color: rgba(123, 241, 168, .35); }
.status.warn { color: #ffb4c8; border-color: rgba(255, 138, 179, .4); }
.status.busy { color: #ffd60a; border-color: rgba(255, 214, 10, .4); }
.toast {
  position: fixed; left: 50%; top: 84px; transform: translate(-50%, -14px); z-index: 30;
  padding: 10px 20px; font-size: 13.5px; font-weight: 800; color: #10131f;
  background: linear-gradient(180deg, #fff, #d8e2f8);
  border: 3px solid #05070d; border-radius: 14px; box-shadow: 0 4px 0 #05070d;
  opacity: 0; pointer-events: none; transition: .22s cubic-bezier(.4, 1.4, .5, 1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
body.solved::after {
  content: "复原完成 ✓"; position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  font-size: min(11vw, 92px); font-weight: 900; letter-spacing: .1em; color: #fff;
  text-shadow: 0 0 24px #ffd60a, 6px 6px 0 #05070d;
  background: radial-gradient(circle at 50% 50%, rgba(255, 214, 10, .22), transparent 62%);
  animation: pop .9s ease-out; pointer-events: none;
}
@keyframes pop { from { transform: scale(.7); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1.12); opacity: 0; } }

/* ------------------------------- 响应式 ------------------------------- */
@media (max-width: 900px) {
  .only-mobile { display: inline-block; }
  .brand span { display: none; }
  .panel {
    top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; height: 56vh;
    transform: translateY(112%);
  }
  body.panel-open .panel { transform: translateY(0); }
  .playbar { right: 14px; }
  .status { bottom: 116px; max-width: 62vw; }
  .topbar { gap: 8px; padding: 10px; }
  .btn { padding: 8px 12px; font-size: 13px; }
  .seg span { padding: 6px 10px; font-size: 12.5px; }
}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="topbar">
  <div class="brand">
    <span class="cube-logo">4×4</span>
    <div><b>动漫魔方</b><span>CEL 卡线渲染 · 自动求解</span></div>
  </div>
  <div class="seg" role="radiogroup" aria-label="解法选择">
    <label><input type="radio" name="method" value="cfop" checked><span>CFOP</span></label>
    <label><input type="radio" name="method" value="roux"><span>桥式 Roux</span></label>
  </div>
  <div class="acts">
    <button id="btnScramble" class="btn ghost" title="随机打乱 (S)">打乱</button>
    <button id="btnSolve" class="btn primary" title="求解并演示 (Enter)">求解</button>
    <button id="btnReset" class="btn ghost" title="回到复原状态 (R)">重置</button>
    <button id="btnPanel" class="btn ghost only-mobile" title="展开/收起步骤面板">步骤</button>
  </div>
</header>

<aside class="panel" id="panel">
  <div class="panel-head"><b>求解步骤</b><span id="solMeta"></span></div>
  <div class="steps" id="steps"></div>
  <div class="legend">
    记号：<code>U R F D L B</code> 外层顺时针 · <code>'</code> 逆时针 · <code>2</code> 转 180°<br>
    <code>2U 2R …</code> 第二层单层 · <code>Uw Rw</code> 外两层同转 · <code>M</code> 中间两层<br>
    CFOP = 十字 → F2L → OLL → PLL；桥式 Roux = 双块 → CMLL → LSE（&lt;M,U&gt; 完全 BFS 最短解）
  </div>
</aside>

<footer class="playbar disabled" id="playbar">
  <div class="cur" id="curStep">—</div>
  <div class="ctrl">
    <button id="btnFirst" title="回到开头">⏮</button>
    <button id="btnPrev" title="上一步 (←)">◀</button>
    <button id="btnPlay" class="play" title="播放 / 暂停 (空格)">▶</button>
    <button id="btnNext" title="下一步 (→)">▶|</button>
    <button id="btnLast" title="跳到结尾">⏭</button>
    <input type="range" id="progress" min="0" max="0" value="0" title="拖动跳转到任意步">
    <span id="moveCounter">0 / 0</span>
    <select id="speed" title="播放速度">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </div>
</footer>

<div class="status" id="status"></div>
<div class="toast" id="toast"></div>

<!-- 求解器：以文本形式内嵌，运行时通过 Blob 创建 Web Worker（后台计算，界面不卡） -->
<script id="solverWorker" type="text/plain">
/* ===== cube4.js ===== */
/* ============================================================================
 * cube4.js —— 四阶魔方（4x4x4）状态引擎
 * 所有转动置换均由几何推导自动生成，避免手写置换表出错。
 * 面序：U=0 R=1 F=2 D=3 L=4 B=5 ；贴纸编号 fid = face*16 + row*4 + col
 * 世界坐标：+x 右 / +y 上 / +z 朝向观察者（前）
 * ==========================================================================*/
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.CUBE4 = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const N = 4;                     // 阶数
  const NF = N * N;                // 每面贴纸数
  const NS = 6 * NF;               // 贴纸总数 96
  const FACE_NAMES = ['U', 'R', 'F', 'D', 'L', 'B'];
  const FACE_COLORS = ['#f7f7f2', '#d8352a', '#2fa84f', '#f4c518', '#f07c1e', '#2260c7'];

  /* --------------------------------------------------------------------------
   * 1. 贴纸 <-> 几何（cubie 坐标 + 法向）
   * ------------------------------------------------------------------------*/
  // 返回 {i,j,k, n:[nx,ny,nz]}，i/j/k ∈ 0..3
  function faceletGeom(face, r, c) {
    switch (face) {
      case 0: return { i: c, j: 3, k: r, n: [0, 1, 0] };        // U
      case 1: return { i: 3, j: 3 - r, k: 3 - c, n: [1, 0, 0] }; // R
      case 2: return { i: c, j: 3 - r, k: 3, n: [0, 0, 1] };     // F
      case 3: return { i: c, j: 0, k: 3 - r, n: [0, -1, 0] };    // D
      case 4: return { i: 0, j: 3 - r, k: c, n: [-1, 0, 0] };    // L
      case 5: return { i: 3 - c, j: 3 - r, k: 0, n: [0, 0, -1] };// B
    }
    throw new Error('bad face ' + face);
  }

  const GEOM = new Array(NS);
  const GEOM_KEY = new Map();
  const gkey = (i, j, k, n) => i + ',' + j + ',' + k + '|' + n[0] + ',' + n[1] + ',' + n[2];
  for (let f = 0; f < 6; f++) {
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const fid = f * NF + r * N + c;
        const g = faceletGeom(f, r, c);
        g.fid = fid; g.face = f; g.row = r; g.col = c;
        GEOM[fid] = g;
        GEOM_KEY.set(gkey(g.i, g.j, g.k, g.n), fid);
      }
    }
  }

  // 右手法则 90° 旋转（作用于以立方体中心为原点的坐标）
  function rot90(v, axis) {
    const [x, y, z] = v;
    if (axis === 0) return [x, -z, y];   // 绕 +x
    if (axis === 1) return [z, y, -x];   // 绕 +y
    return [-y, x, z];                   // 绕 +z
  }
  function rotN(v, axis, q) { let o = v; for (let t = 0; t < ((q % 4) + 4) % 4; t++) o = rot90(o, axis); return o; }

  const cubieCoord = (g, axis) => (axis === 0 ? g.i : axis === 1 ? g.j : g.k);

  /* --------------------------------------------------------------------------
   * 2. 转动置换生成
   * ------------------------------------------------------------------------*/
  // 单层转动：axis 0/1/2，layer 0..3（沿 +axis 方向的层号），q 个右手 90°
  function layerPerm(axis, layers, q) {
    const src = new Uint8Array(NS);
    for (let i = 0; i < NS; i++) src[i] = i;
    for (let fid = 0; fid < NS; fid++) {
      const g = GEOM[fid];
      if (layers.indexOf(cubieCoord(g, axis)) < 0) continue;
      const p = [g.i - 1.5, g.j - 1.5, g.k - 1.5];
      const np = rotN(p, axis, q);
      const nn = rotN(g.n, axis, q);
      const key = gkey(Math.round(np[0] + 1.5), Math.round(np[1] + 1.5), Math.round(np[2] + 1.5),
        [Math.round(nn[0]), Math.round(nn[1]), Math.round(nn[2])]);
      const dst = GEOM_KEY.get(key);
      if (dst === undefined) throw new Error('geometry mismatch');
      src[dst] = fid;   // 转动后 dst 位置上的贴纸来自 fid
    }
    return src;
  }

  /* --------------------------------------------------------------------------
   * 3. 招式表（MOVES）
   *   记号（SiGN 风格）：外层 U R F D L B ；内层 2U 2R 2F 2D 2L 2B
   *   宽层 Uw Rw ... ；中层 M E S
   * ------------------------------------------------------------------------*/
  // base: {name, axis, layers, qBase}  qBase = 顺时针（从该面外侧看）对应的右手转数
  const BASES = [
    { name: 'U', axis: 1, layers: [3], qBase: 3 },
    { name: '2U', axis: 1, layers: [2], qBase: 3 },
    { name: '2D', axis: 1, layers: [1], qBase: 1 },
    { name: 'D', axis: 1, layers: [0], qBase: 1 },
    { name: 'R', axis: 0, layers: [3], qBase: 3 },
    { name: '2R', axis: 0, layers: [2], qBase: 3 },
    { name: '2L', axis: 0, layers: [1], qBase: 1 },
    { name: 'L', axis: 0, layers: [0], qBase: 1 },
    { name: 'F', axis: 2, layers: [3], qBase: 3 },
    { name: '2F', axis: 2, layers: [2], qBase: 3 },
    { name: '2B', axis: 2, layers: [1], qBase: 1 },
    { name: 'B', axis: 2, layers: [0], qBase: 1 },
    // 宽层（两层一起转）
    { name: 'Uw', axis: 1, layers: [3, 2], qBase: 3 },
    { name: 'Dw', axis: 1, layers: [0, 1], qBase: 1 },
    { name: 'Rw', axis: 0, layers: [3, 2], qBase: 3 },
    { name: 'Lw', axis: 0, layers: [0, 1], qBase: 1 },
    { name: 'Fw', axis: 2, layers: [3, 2], qBase: 3 },
    { name: 'Bw', axis: 2, layers: [0, 1], qBase: 1 },
    // 中层（3x3 意义上的 M/E/S，作用于两个内层）
    { name: 'M', axis: 0, layers: [1, 2], qBase: 1 },   // 跟随 L
    { name: 'E', axis: 1, layers: [1, 2], qBase: 1 },   // 跟随 D
    { name: 'S', axis: 2, layers: [1, 2], qBase: 3 }    // 跟随 F
  ];

  const MOVES = [];           // 全部招式
  const MOVE_BY_NAME = new Map();
  for (const b of BASES) {
    for (const [sfx, mul] of [['', 1], ["'", -1], ['2', 2]]) {
      const q = ((b.qBase * mul) % 4 + 4) % 4;
      const name = b.name + sfx;
      const mv = {
        idx: MOVES.length, name, base: b.name, axis: b.axis, layers: b.layers.slice(),
        q, turns: mul, perm: layerPerm(b.axis, b.layers, q),
        // 动画用：绕 axis 的右手转角（度）
        angle: (b.qBase === 3 ? -90 : 90) * (mul === 2 ? 2 : mul)
      };
      MOVES.push(mv);
      MOVE_BY_NAME.set(name, mv);
    }
  }
  // 单层招式（打乱/搜索用，共 36 个）
  const SINGLE_MOVES = MOVES.filter(m => m.layers.length === 1);

  function moveByName(n) {
    const m = MOVE_BY_NAME.get(n);
    if (!m) throw new Error('unknown move: ' + n);
    return m;
  }
  function parseSeq(s) {
    if (Array.isArray(s)) return s.map(x => (typeof x === 'string' ? moveByName(x) : x));
    return s.trim().split(/\s+/).filter(Boolean).map(moveByName);
  }
  function seqToString(seq) { return seq.map(m => m.name).join(' '); }
  function invertSeq(seq) {
    return seq.slice().reverse().map(m => {
      const t = m.turns === 2 ? 2 : -m.turns;
      return moveByName(m.base + (t === 1 ? '' : t === -1 ? "'" : '2'));
    });
  }

  /* --------------------------------------------------------------------------
   * 4. 状态操作
   * ------------------------------------------------------------------------*/
  function solvedState() {
    const st = new Uint8Array(NS);
    for (let i = 0; i < NS; i++) st[i] = (i / NF) | 0;
    return st;
  }
  function applyMove(st, mv, out) {
    const p = mv.perm, o = out || new Uint8Array(NS);
    for (let i = 0; i < NS; i++) o[i] = st[p[i]];
    return o;
  }
  function applySeq(st, seq) {
    let cur = st.slice();
    for (const m of parseSeq(seq)) cur = applyMove(cur, m);
    return cur;

      if (order.length > width) order = order.slice(0, width);
      const b0 = Math.floor(kcost[order[0]]);
      if (b0 >= best) { if (++stall > 10) return null; } else { best = b0; stall = 0; }
      const nb = new Uint8Array(order.length * NS);
      const nmv = new Int16Array(order.length), npar = new Int32Array(order.length);
      for (let di = 0; di < order.length; di++) {
        const s = order[di];
        nb.set(kbuf.subarray(s * NS, s * NS + NS), di * NS);
        nmv[di] = kmv[s]; npar[di] = kpar[s];
      }
      cur = { buf: nb, n: order.length, mv: nmv, par: npar };
      levels.push(cur);
    }
    return null;
  }

  // 逐步放宽宽度的束搜索（保证成功率）
  function beamSolveStage(st, costFn, opts) {
    opts = opts || {};
    const widths = opts.widths || [1500, 1500, 5000, 12000];
    for (const w of widths) {
      const r = beamSearch(st, opts.moves || ATOM, costFn, {
        width: w, maxDepth: opts.maxDepth || 42, proj: opts.proj || CEN
      });
      if (r) return r;
    }
    return null;
  }

  /* ==========================================================================
   * 2. 招式序列化简（相邻同层合并 / 抵消）
   * ========================================================================*/
  function simplify(seq) {
    const out = [];
    for (const m of seq) {
      const last = out[out.length - 1];
      if (last && last.base === m.base) {
        let t = ((last.turns + m.turns) % 4 + 4) % 4;
        out.pop();
        if (t === 3) t = -1;
        if (t !== 0) out.push(byName(m.base + (t === 1 ? '' : t === -1 ? "'" : '2')));
      } else out.push(m);
    }
    return out;
  }

  /* ==========================================================================
   * 3. 三阶（降阶后）模型：cp/co/ep/eo 平坦数组 + M 层偏移
   *    偏移量表由四阶引擎自动推导，保证两套模型完全一致
   * ========================================================================*/
  const S_LEN = 41;   // 0..7 cp, 8..15 co, 16..27 ep, 28..39 eo, 40 mOff
  const AXIS_OF = { U: 1, D: 1, R: 0, L: 0, M: 0, F: 2, B: 2 };
  const ORDER_OF = { U: 0, D: 1, R: 2, L: 3, M: 4, F: 5, B: 6 };

  function derive3(name) {
    const r = C.reduce(C.applySeq(C.solvedState(), name));
    if (!r) throw new Error('move breaks reduction: ' + name);
    const base = name.replace(/['2]$/, '');
    let mOff = 0;
    if (base === 'M') mOff = name === 'M' ? 1 : name === "M'" ? 3 : 2;
    return {
      name, base, axis: AXIS_OF[base], order: ORDER_OF[base],
      cp: Int8Array.from(r.cp), co: Int8Array.from(r.co),
      ep: Int8Array.from(r.ep), eo: Int8Array.from(r.eo), mOff
    };
  }
  const FACE3 = [];
  for (const f of ['U', 'D', 'R', 'L', 'F', 'B']) for (const s of ['', "'", '2']) FACE3.push(derive3(f + s));
  const MOVE3_M = [derive3('M'), derive3("M'"), derive3('M2')];
  const MOVE3_ALL = FACE3.concat(MOVE3_M);
  const M3_BY_NAME = new Map(MOVE3_ALL.map(m => [m.name, m]));

  function solved3() {
    const s = new Int8Array(S_LEN);
    for (let i = 0; i < 8; i++) { s[i] = i; s[8 + i] = 0; }
    for (let i = 0; i < 12; i++) { s[16 + i] = i; s[28 + i] = 0; }
    return s;
  }
  function state3From(st) {
    const r = C.reduce(st);
    if (!r) return null;
    const s = new Int8Array(S_LEN);
    for (let i = 0; i < 8; i++) { s[i] = r.cp[i]; s[8 + i] = r.co[i]; }
    for (let i = 0; i < 12; i++) { s[16 + i] = r.ep[i]; s[28 + i] = r.eo[i]; }
    s[40] = 0;
    return s;
  }
  function apply3(a, m, out) {
    for (let i = 0; i < 8; i++) { const s = m.cp[i]; out[i] = a[s]; out[8 + i] = (a[8 + s] + m.co[i]) % 3; }
    for (let i = 0; i < 12; i++) { const s = m.ep[i]; out[16 + i] = a[16 + s]; out[28 + i] = (a[28 + s] + m.eo[i]) & 1; }
    out[40] = (a[40] + m.mOff) & 3;
    return out;
  }
  function applySeq3(a, seq) {
    let cur = a.slice(), tmp = new Int8Array(S_LEN);
    for (const m of seq) { apply3(cur, m, tmp); const t = cur; cur = tmp; tmp = t; }
    return cur;
  }
  const isSolved3 = s => {
    for (let i = 0; i < 8; i++) if (s[i] !== i || s[8 + i] !== 0) return false;
    for (let i = 0; i < 12; i++) if (s[16 + i] !== i || s[28 + i] !== 0) return false;
    return s[40] === 0;
  };

  /* ==========================================================================
   * 4. 距离表（精确 BFS）—— 单块 / 块对 / 十字 / LSE
   * ========================================================================*/
  function pieceMaps(moves) {
    // cMap[mi][pos*3+ori] -> newPos*3+newOri ; eMap[mi][pos*2+ori] -> ...
    const cMap = [], eMap = [];
    for (const m of moves) {
      const dc = new Int8Array(8), de = new Int8Array(12);
      for (let i = 0; i < 8; i++) dc[m.cp[i]] = i;
      for (let i = 0; i < 12; i++) de[m.ep[i]] = i;
      const cm = new Uint8Array(24), em = new Uint8Array(24);
      for (let p = 0; p < 8; p++) for (let o = 0; o < 3; o++) { const d = dc[p]; cm[p * 3 + o] = d * 3 + (o + m.co[d]) % 3; }
      for (let p = 0; p < 12; p++) for (let o = 0; o < 2; o++) { const d = de[p]; em[p * 2 + o] = d * 2 + ((o + m.eo[d]) & 1); }
      cMap.push(cm); eMap.push(em);
    }
    return { cMap, eMap };
  }

  function bfs1(size, startIdx, step) {
    const dist = new Int8Array(size).fill(-1);
    dist[startIdx] = 0;
    let frontier = [startIdx], d = 0;
    while (frontier.length) {
      const next = [];
      for (const s of frontier) {
        step(s, t => { if (dist[t] < 0) { dist[t] = d + 1; next.push(t); } });
      }
      frontier = next; d++;
    }
    return dist;
  }

  function buildTables(moves) {
    const { cMap, eMap } = pieceMaps(moves);
    const nm = moves.length;
    const cornerDist = [], edgeDist = [];
    for (let t = 0; t < 8; t++) cornerDist.push(bfs1(24, t * 3, (s, push) => { for (let mi = 0; mi < nm; mi++) push(cMap[mi][s]); }));
    for (let t = 0; t < 12; t++) edgeDist.push(bfs1(24, t * 2, (s, push) => { for (let mi = 0; mi < nm; mi++) push(eMap[mi][s]); }));
    const pairDist = new Map();
    function pair(cSlot, eSlot) {
      const key = cSlot + ':' + eSlot;
      if (pairDist.has(key)) return pairDist.get(key);
      const d = bfs1(576, (cSlot * 3) * 24 + eSlot * 2, (s, push) => {
        const cs = (s / 24) | 0, es = s % 24;
        for (let mi = 0; mi < nm; mi++) push(cMap[mi][cs] * 24 + eMap[mi][es]);
      });
      pairDist.set(key, d);
      return d;
    }
    // 十字（4 条 D 层棱）精确距离表：24^4 = 331776
    let crossDist = null;
    function cross() {
      if (crossDist) return crossDist;
      const goal = ((4 * 2) * 24 + 5 * 2) * 576 + (6 * 2) * 24 + 7 * 2;
      crossDist = bfs1(331776, goal, (s, push) => {
        const a = (s / 13824) | 0, b = ((s / 576) | 0) % 24, c = ((s / 24) | 0) % 24, e = s % 24;
        for (let mi = 0; mi < nm; mi++) {
          const em = eMap[mi];
          push(em[a] * 13824 + em[b] * 576 + em[c] * 24 + em[e]);
        }
      });
      return crossDist;
    }
    return { cMap, eMap, cornerDist, edgeDist, pair, cross, moves };
  }

  let TAB_FACE = null;
  const tabFace = () => (TAB_FACE || (TAB_FACE = buildTables(FACE3)));

  /* ==========================================================================
   * 5. 子目标搜索：IDA*（精确、优先）+ 束搜索（兜底）
   * ========================================================================*/
  // req: {corners:[slot..], edges:[slot..], pairs:[[cSlot,eSlot]..], cross:bool}
  function makeGoal(req) {
    const cs = req.corners || [], es = req.edges || [], ps = req.pairs || [];
    return function (s) {
      for (const c of cs) if (s[c] !== c || s[8 + c] !== 0) return false;
      for (const e of es) if (s[16 + e] !== e || s[28 + e] !== 0) return false;
      for (const p of ps) {
        if (s[p[0]] !== p[0] || s[8 + p[0]] !== 0) return false;
        if (s[16 + p[1]] !== p[1] || s[28 + p[1]] !== 0) return false;
      }
      if (req.cross) for (let e = 4; e <= 7; e++) if (s[16 + e] !== e || s[28 + e] !== 0) return false;
      return true;
    };
  }
  function makeHeur(tab, req, sum) {
    const cs = req.corners || [], es = req.edges || [], ps = (req.pairs || []).map(p => [p[0], p[1], tab.pair(p[0], p[1])]);
    const crossTab = req.cross ? tab.cross() : null;
    const invC = new Int8Array(8), invE = new Int8Array(12);
    return function (s) {
      for (let i = 0; i < 8; i++) invC[s[i]] = i;
      for (let i = 0; i < 12; i++) invE[s[16 + i]] = i;
      let h = 0;
      const acc = sum ? (v => { h += v; }) : (v => { if (v > h) h = v; });
      for (const c of cs) { const p = invC[c]; acc(tab.cornerDist[c][p * 3 + s[8 + p]]); }
      for (const e of es) { const p = invE[e]; acc(tab.edgeDist[e][p * 2 + s[28 + p]]); }
      for (const pr of ps) {
        const pc = invC[pr[0]], pe = invE[pr[1]];
        acc(pr[2][(pc * 3 + s[8 + pc]) * 24 + pe * 2 + s[28 + pe]]);
      }
      if (crossTab) {
        const a = invE[4], b = invE[5], c = invE[6], d = invE[7];
        acc(crossTab[(a * 2 + s[28 + a]) * 13824 + (b * 2 + s[28 + b]) * 576 + (c * 2 + s[28 + c]) * 24 + d * 2 + s[28 + d]]);
      }
      return h;
    };
  }

  function idaSearch(start, moves, goal, heur, maxDepth, nodeBudget) {
    const stack = [];
    for (let i = 0; i <= maxDepth + 1; i++) stack.push(new Int8Array(S_LEN));
    stack[0].set(start);
    const path = new Array(maxDepth + 1);
    let nodes = 0, aborted = false;
    function dfs(depth, bound, prevBase, prevAxis) {
      const s = stack[depth];
      if (goal(s)) return depth;
      const h = heur(s);
      if (depth + h > bound) return -1;
      if (++nodes > nodeBudget) { aborted = true; return -1; }
      for (let mi = 0; mi < moves.length; mi++) {
        const m = moves[mi];
        if (m.base === prevBase) continue;
        if (m.axis === prevAxis && m.order < ORDER_OF[prevBase]) continue;
        apply3(s, m, stack[depth + 1]);
        path[depth] = m;
        const r = dfs(depth + 1, bound, m.base, m.axis);
        if (r >= 0) return r;
        if (aborted) return -1;
      }
      return -1;
    }
    for (let bound = heur(stack[0]); bound <= maxDepth; bound++) {
      const r = dfs(0, bound, '', -1);
      if (r >= 0) return path.slice(0, r);
      if (aborted) return null;
    }
    return null;   // 深度内无解 → 交给束搜索兜底（返回空数组会被误当成"已完成"）
  }

  // 三阶子目标束搜索兜底
  function beam3(start, moves, goal, cost, width, maxDepth) {
    let level = [{ s: start, mv: null, par: null }];
    if (goal(start)) return [];
    for (let d = 0; d < maxDepth; d++) {
      const cand = [];
      const seen = new Set();
      for (const node of level) {
        for (const m of moves) {
          if (node.mv && node.mv.base === m.base) continue;
          const ns = apply3(node.s, m, new Int8Array(S_LEN));
          const key = ns.join(',');
          if (seen.has(key)) continue;
          seen.add(key);
          const nn = { s: ns, mv: m, par: node };
          if (goal(ns)) { const out = []; let p = nn; while (p.mv) { out.unshift(p.mv); p = p.par; } return out; }
          cand.push({ node: nn, c: cost(ns) + Math.random() * 0.5 });
        }
      }
      if (!cand.length) return null;
      cand.sort((a, b) => a.c - b.c);
      level = cand.slice(0, width).map(x => x.node);
    }
    return null;
  }

  function solveSub(state, req, tab, opts) {
    opts = opts || {};
    const moves = opts.moves || tab.moves;
    const goal = makeGoal(req);
    if (goal(state)) return [];
    const h = makeHeur(tab, req, false);
    const r = idaSearch(state, moves, goal, h, opts.maxDepth || 12, opts.nodeBudget || 1.1e6);
    if (r) return r;
    const cost = makeHeur(tab, req, true);
    for (const w of [60, 250, 900]) {
      const b = beam3(state, moves, goal, cost, w, opts.beamDepth || 26);
      if (b) return b;
    }
    return null;
  }

  /* ==========================================================================
   * 6. 顶层公式阶段（OLL / PLL / CMLL）：公式集 + AUF 组合搜索
   * ========================================================================*/
  const ALGS = {
    // 顶层棱定向（2-look OLL 第一步）
    eoll: ["F R U R' U' F'", "F U R U' R' F'"],
    // 顶层角定向（Sune / Anti-Sune，纯外层公式，不破坏其余部分）
    coll: ["R U R' U R U2 R'", "R U2 R' U' R U' R'"],
    // 顶层角换位（T-perm / Y-perm）
    cp: ["R U R' U' R' F R2 U' R' U' R U R' F'",
      "F R U' R' U' R U R' F' R U R' U' R' F R F'"],
    // 顶层棱换位（Ua / Ub）
    ep: ["R U' R U R U R U' R' U' R2", "R2 U R U R' U' R' U' R' U R'"]
  };
  const AUF = ['', 'U', 'U2', "U'"];
  function seq3(str) { return str ? str.split(/\s+/).map(n => M3_BY_NAME.get(n)) : []; }
  const ALG_SEQ = {};
  for (const k in ALGS) ALG_SEQ[k] = ALGS[k].map(seq3);
  const AUF_SEQ = AUF.map(seq3);

  // 在 (AUF + 公式) 的组合空间内做有界搜索，直到满足 goalFn
  function algStage(state, algSets, goalFn, maxApply) {
    const opts = [];
    for (const set of algSets) for (const a of ALG_SEQ[set]) for (const u of AUF_SEQ) opts.push(u.concat(a));
    let frontier = [{ s: state, seq: [] }];
    if (goalFn(state)) return [];
    for (let d = 0; d < maxApply; d++) {
      const next = [];
      for (const node of frontier) {
        for (const o of opts) {
          const ns = applySeq3(node.s, o);
          const nseq = node.seq.concat(o);
          if (goalFn(ns)) return nseq;
          next.push({ s: ns, seq: nseq });
        }
      }
      frontier = next;
      if (frontier.length > 4000) frontier = frontier.slice(0, 4000);
    }
    return null;
  }
  function aufFix(state) {
    for (let u = 0; u < 4; u++) {
      const s = applySeq3(state, AUF_SEQ[u]);
      if (isSolved3(s)) return AUF_SEQ[u];
    }
    return null;
  }
  const existsAUF = (state, pred) => AUF_SEQ.some(u => pred(applySeq3(state, u)));

  /* ==========================================================================
   * 7. LSE（桥式最后六棱）—— <M,U> 群完全 BFS 距离表
   * ========================================================================*/
  const LSE_SLOTS = [0, 1, 2, 3, 5, 7];    // UR UF UL UB DF DB
  const LSE_LOCAL = new Int8Array(12).fill(-1);
  LSE_SLOTS.forEach((g, t) => { LSE_LOCAL[g] = t; });
  const LSE_MOVES = ['U', "U'", 'U2', 'M', "M'", 'M2'].map(n => M3_BY_NAME.get(n));
  const FACT = [1, 1, 2, 6, 24, 120, 720];
  function permIndex(p) {   // Lehmer code, 6 元
    let idx = 0;
    for (let i = 0; i < 6; i++) {
      let c = 0;
      for (let j = i + 1; j < 6; j++) if (p[j] < p[i]) c++;
      idx += c * FACT[5 - i];
    }
    return idx;
  }
  const LSE_SIZE = 720 * 64 * 4 * 4;
  const lseEnc = (p, o, mOff, cOff) => ((permIndex(p) * 64 + o) * 4 + mOff) * 4 + cOff;
  // 每个招式在 LSE 抽象空间的作用：src[t] / flip[t] / mOff / uTurn
  const LSE_ACT = LSE_MOVES.map(m => {
    const src = new Int8Array(6), flip = new Int8Array(6);
    for (let t = 0; t < 6; t++) {
      const g = LSE_SLOTS[t], sg = m.ep[g];
      if (LSE_LOCAL[sg] < 0) throw new Error('LSE slot escape: ' + m.name);
      src[t] = LSE_LOCAL[sg]; flip[t] = m.eo[g];
    }
    const uTurn = m.base === 'U' ? (m.name === 'U' ? 1 : m.name === "U'" ? 3 : 2) : 0;
    return { m, src, flip, mOff: m.mOff, uTurn };
  });
  let LSE_DIST = null;
  function lseTable() {
    if (LSE_DIST) return LSE_DIST;
    const dist = new Int8Array(LSE_SIZE).fill(-1);
    const p = new Int8Array(6), np = new Int8Array(6);
    const startP = Int8Array.from([0, 1, 2, 3, 4, 5]);
    const start = lseEnc(startP, 0, 0, 0);
    dist[start] = 0;
    let frontier = [start], d = 0;
    // 索引 -> (perm, o, mOff, cOff) 需要 perm 逆映射表
    const permList = [];
    (function gen(arr, used) {
      if (arr.length === 6) { permList[permIndex(arr)] = Int8Array.from(arr); return; }
      for (let v = 0; v < 6; v++) if (!used[v]) { used[v] = 1; arr.push(v); gen(arr, used); arr.pop(); used[v] = 0; }
    })([], new Uint8Array(6));
    while (frontier.length) {
      const next = [];
      for (const s of frontier) {
        const cOff = s & 3, mOff = (s >> 2) & 3, o = ((s >> 4) & 63), pi = (s / 1024) | 0;
        const pp = permList[pi];
        for (const act of LSE_ACT) {
          let no = 0;
          for (let t = 0; t < 6; t++) {
            const ts = act.src[t];
            np[t] = pp[ts];
            if (((o >> ts) & 1) ^ act.flip[t]) no |= 1 << t;
          }
          const ns = lseEnc(np, no, (mOff + act.mOff) & 3, (cOff - act.uTurn + 8) & 3);
          if (dist[ns] < 0) { dist[ns] = d + 1; next.push(ns); }
        }
      }
      frontier = next; d++;
    }
    LSE_DIST = dist;
    return dist;
  }
  function lseStateOf(s) {
    // 从三阶状态提取 LSE 抽象状态
    const p = new Int8Array(6);
    let o = 0;
    for (let t = 0; t < 6; t++) {
      const g = LSE_SLOTS[t], piece = s[16 + g];
      const lp = LSE_LOCAL[piece];
      if (lp < 0) return null;
      p[t] = lp;
      if (s[28 + g]) o |= 1 << t;
    }
    // 角块 AUF 偏移
    let cOff = -1;
    for (let u = 0; u < 4; u++) {
      const t = applySeq3(s, AUF_SEQ[u]);
      let good = true;
      for (let i = 0; i < 4; i++) if (t[i] !== i || t[8 + i] !== 0) { good = false; break; }
      if (good) { cOff = u; break; }
    }
    if (cOff < 0) return null;
    return { p, o, mOff: s[40] & 3, cOff, idx: lseEnc(p, o, s[40] & 3, cOff) };
  }
  function solveLSE(state) {
    const dist = lseTable();
    let cur = state.slice();
    const out = [];
    let ls = lseStateOf(cur);
    if (!ls) return null;
    let d = dist[ls.idx];
    if (d < 0) return null;
    let guard = 0;
    while (d > 0 && guard++ < 40) {
      let moved = false;
      for (const act of LSE_ACT) {
        const ns = apply3(cur, act.m, new Int8Array(S_LEN));
        const s2 = lseStateOf(ns);
        if (!s2) continue;
        const nd = dist[s2.idx];
        if (nd >= 0 && nd === d - 1) { out.push(act.m); cur = ns; d = nd; moved = true; break; }
      }
      if (!moved) return null;
    }
    return d === 0 ? out : null;
  }

  /* ==========================================================================
   * 8. 归约阶段代价函数（中心块 + 复合棱配对）
   * ========================================================================*/
  const PROJ_CEN = CEN;                                       // 只关心中心块
  const PROJ_RED = Int32Array.from([...CEN, ...WING_FID, ...WING_SEC_FID]);  // 中心块 + 棱片
  const PROJ_WING = Int32Array.from([...WING_FID, ...WING_SEC_FID]);          // 仅棱片（配对阶段中心块恒定）
  const centerCost = (buf, off) => centerDistSum(buf, off) * 4 + centerMis(buf, off);
  function pairCost(target) {
    return (buf, off) => {
      const u = nUnpaired(buf, off);
      return u > target ? (u - target) * 8 + wingDistSum(buf, off) : 0;
    };
  }
  // 收尾专用平滑代价：只用"每对棱片精确合并距离"，允许暂时拆散已配好的棱，
  // 从而越过"最后两组棱"的平台期陷阱（cost=0 ⟺ 12 组全部配对）
  const pairCostSmooth = (buf, off) => wingDistSum(buf, off) * 2 + nUnpaired(buf, off);
  // 带目标的平滑代价：收尾时先逐级把未配对数降下来，比一步冲到 0 便宜得多
  const pairCostSmoothT = target => (buf, off) => {
    const u = nUnpaired(buf, off);
    return u > target ? wingDistSum(buf, off) * 2 + u : 0;
  };

  /* ==========================================================================
   * 9. 主求解流程
   * ========================================================================*/
  const EDGE_NAME = C.EDGE_ORDER, CORNER_NAME = C.CORNER_ORDER;

  function solve(state, method, onProgress) {
    const t0 = Date.now();
    const steps = [];
    let st = Uint8Array.from(state);
    const report = (label, frac) => { if (onProgress) onProgress({ label, frac }); };

    let tLast = Date.now();
    function pushStep(phase, name, desc, seq) {
      const s = simplify(seq || []);
      st = C.applySeq(st, s);
      const now = Date.now();
      steps.push({ phase, name, desc, moves: s.map(m => m.name), ms: now - tLast });
      tLast = now;
      return s;
    }

    /* ---------- 阶段一 + 二：归约（中心块 + 复合棱配对）----------
     * 束搜索带随机抖动 ⇒ 同一状态每次跑出的轨迹不同。困难局面直接整段重启换轨迹，
     * 通常几百毫秒即可通过；最后一次尝试不设时限，靠"奇偶公式 / 打散重排 / 大宽度深搜"必定收敛。 */
    const PARITY_OLL = "2R2 B2 U2 2L U2 2R' U2 2R U2 F2 2R F2 2L' B2 2R2";
    const PARITY_PLL = "2R2 U2 2R2 Uw2 2R2 Uw2";
    const macros = macroMoves();
    const st0 = Uint8Array.from(st);
    const MAX_TRY = 8;
    for (let attempt = 0; attempt < MAX_TRY; attempt++) {
      const last = attempt === MAX_TRY - 1;
      const budget = last ? Infinity : 2600;
      st = Uint8Array.from(st0);
      steps.length = 0;
      // --- 中心块：每色精确 BFS 距离表 + 投影去重束搜索
      report('中心块归位', 0.05);
      const rc = beamSolveStage(st, centerCost,
        { widths: [1500, 2500, 6000], maxDepth: 30, proj: PROJ_CEN });
      if (!rc) continue;
      pushStep('归约', '中心块归位',
        '把 24 个中心块按颜色聚成 6 个 2×2 色块（每色 C(24,4) 完全 BFS 距离表 + 束搜索）', rc);
      if (C.centerErrors(st) !== 0) continue;

      // --- 复合棱配对：全部使用"保中心宏招式"，中心块全程不散
      const tPair = Date.now();
      const beamPair = (cost, w, d, ext) => beamSearch(st, ext ? macroMovesL2E() : macros, cost,
        { width: w, maxDepth: d, proj: PROJ_WING });
      let u = C.unpairedEdges(st), round = 0, parityUsed = false, kicks = 0, bigUsed = 0, dead = false;
      while (u > 0) {
        if (++round > 60 || Date.now() - tPair > budget) { dead = true; break; }
        report('复合棱配对', 0.15 + 0.3 * (1 - u / 12));
        let r = null, label = '复合棱配对 · 第 ' + round + ' 轮';
        if (u > 4) {           // 增量段：每轮少 2~3 组，很浅很快
          for (const step of [2, 3, 1]) {
            for (const w of [150, 600]) { r = beamPair(pairCost(Math.max(0, u - step)), w, 8, 0); if (r) break; }
            if (r) break;
          }
        } else {               // 收尾段：一次冲"全部配对"
          for (const [w, d, ext] of [[300, 7, 0], [200, 5, 1], [400, 8, 0]]) {
            r = beamPair(pairCostSmooth, w, d, ext); if (r) break;
          }
          if (!r && u > 2) {   // 便宜的"换局面"：只降 2 组，下一轮再冲（常常 1~2 毫秒）
            for (const [w, d, ext] of [[300, 6, 1], [300, 8, 0], [700, 7, 1]]) {
              r = beamPair(pairCostSmoothT(u - 2), w, d, ext); if (r) break;
            }
            if (r) label = '复合棱配对 · 第 ' + round + ' 轮（局面调整）';
          }
          if (!r && kicks >= 1 && bigUsed < (last ? 3 : 1)) {   // 有限次大宽度深搜兜底
            bigUsed++;
            for (const [w, d] of [[1200, 11], [2400, 13]]) { r = beamPair(pairCostSmooth, w, d, 0); if (r) break; }
          }
        }
        if (r) {
          pushStep('归约', label,
            '用 slice-flip-slice 型宏招式把成对棱片合成复合棱（中心块保持不散）', r);
          u = C.unpairedEdges(st);
          continue;
        }
        if (!parityUsed) {     // 四阶特有：最后两组棱的奇偶情形
          parityUsed = true;
          pushStep('奇偶', 'OLL 奇偶校正（配对期）',
            '最后两组棱遇到四阶特有奇偶：先用 15 步公式翻转一条复合棱，改变棱片置换奇偶性', C.parseSeq(PARITY_OLL));
          u = C.unpairedEdges(st);
          continue;
        }
        if (kicks++ < (last ? 24 : 4)) {
          const seq = [];
          const times = 2 + ((Math.random() * 3) | 0);
          for (let i = 0; i < times; i++) seq.push(...macros[(18 + Math.random() * (macros.length - 18)) | 0].seq);
          pushStep('归约', '复合棱配对 · 布局调整', '重新打散棱片布局，跳出局部困境后继续配对', seq);
          u = C.unpairedEdges(st);
          continue;
        }
        dead = true; break;
      }
      if (!dead && u === 0) break;
      if (last) throw new Error('复合棱配对失败');
    }
    if (C.unpairedEdges(st) !== 0 || C.centerErrors(st) !== 0) throw new Error('归约未完成');

    /* ---------- 阶段三：奇偶校正 ---------- */
    const parityOf = arr => { let p = 0; for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) if (arr[i] > arr[j]) p ^= 1; return p; };
    let red = C.reduce(st);
    let eoSum = 0; for (const v of red.eo) eoSum ^= v & 1;
    if (eoSum) {
      report('奇偶校正', 0.5);
      pushStep('奇偶', 'OLL 奇偶校正', '四阶特有：单条复合棱翻转，需用 15 步公式修正', C.parseSeq(PARITY_OLL));
      red = C.reduce(st);
    }
    if (parityOf(Array.from(red.cp)) !== parityOf(Array.from(red.ep))) {
      pushStep('奇偶', 'PLL 奇偶校正', '四阶特有：两条复合棱互换，需用 6 步公式修正', C.parseSeq(PARITY_PLL));
      red = C.reduce(st);
    }

    /* ---------- 阶段四：降阶为三阶后求解 ---------- */
    let s3 = state3From(st);
    if (!s3) throw new Error('降阶失败');
    const tab = tabFace();
    const emit = (phase, name, desc, seq3arr) => {
      if (!seq3arr) throw new Error('求解失败: ' + name);
      s3 = applySeq3(s3, seq3arr);
      pushStep(phase, name, desc, seq3arr.map(m => byName(m.name)));
    };
    const sub = (req, opts) => {
      const r = solveSub(s3, req, tab, opts);
      if (!r) throw new Error('子目标搜索失败');
      return r;
    };

    if (method === 'roux') {
      /* ================= 桥式 Roux ================= */
      report('桥式 · 第一块', 0.5);
      emit('Roux', '第一块 · 底棱 DL', 'FB：先把左下棱 DL 放好',
        sub({ edges: [6] }, { maxDepth: 9 }));
      emit('Roux', '第一块 · 前对 DLF+FL', 'FB：组好前左角棱对并插入',
        sub({ edges: [6], pairs: [[5, 9]] }, { maxDepth: 11 }));
      emit('Roux', '第一块 · 后对 DBL+BL', 'FB：组好后左角棱对，完成 1×2×3 第一块',
        sub({ edges: [6], pairs: [[5, 9], [6, 10]] }, { maxDepth: 12 }));
      report('桥式 · 第二块', 0.65);
      emit('Roux', '第二块 · 底棱 DR', 'SB：把右下棱 DR 放好（保持第一块）',
        sub({ edges: [6, 4], pairs: [[5, 9], [6, 10]] }, { maxDepth: 12 }));
      emit('Roux', '第二块 · 前对 DFR+FR', 'SB：组好前右角棱对并插入',
        sub({ edges: [6, 4], pairs: [[5, 9], [6, 10], [4, 8]] }, { maxDepth: 12 }));
      emit('Roux', '第二块 · 后对 DRB+BR', 'SB：完成右侧 1×2×3 第二块',
        sub({ edges: [6, 4], pairs: [[5, 9], [6, 10], [4, 8], [7, 11]] }, { maxDepth: 13 }));
      report('桥式 · CMLL', 0.8);
      emit('Roux', 'CMLL · 角块定向', '只处理顶层四个角：先全部翻正（Sune 家族）',
        algStage(s3, ['coll'], s => s[8] === 0 && s[9] === 0 && s[10] === 0 && s[11] === 0, 3));
      emit('Roux', 'CMLL · 角块归位', '顶层四角换位到正确位置（允许最后 AUF）',
        algStage(s3, ['cp'], s => existsAUF(s, t => t[0] === 0 && t[1] === 1 && t[2] === 2 && t[3] === 3 &&
          t[8] === 0 && t[9] === 0 && t[10] === 0 && t[11] === 0), 3));
      report('桥式 · LSE', 0.9);
      emit('Roux', 'LSE · 最后六棱', 'M/U 两层搞定最后六条棱（含 EOLR 与中层归位），已由完全 BFS 求最短解',
        solveLSE(s3));
    } else {
      /* ================= CFOP ================= */
      report('CFOP · 十字', 0.5);
      emit('CFOP', '底层十字 Cross', '把 D 层四条棱归位形成十字（BFS 精确最短解）',
        sub({ cross: true }, { maxDepth: 9 }));
      const F2L = [[4, 8, '右前'], [5, 9, '左前'], [6, 10, '左后'], [7, 11, '右后']];
      const done = [];
      F2L.forEach((p, i) => {
        report('CFOP · F2L ' + (i + 1), 0.55 + i * 0.06);
        done.push([p[0], p[1]]);
        emit('CFOP', 'F2L 第' + (i + 1) + '组 · ' + p[2], '角块 ' + CORNER_NAME[p[0]] + ' 与棱块 ' + EDGE_NAME[p[1]] + ' 配对并插入底层',
          sub({ cross: true, pairs: done.map(x => x.slice()) }, { maxDepth: 13 }));
      });
      report('CFOP · OLL', 0.82);
      emit('CFOP', 'OLL · 棱块朝向', '顶层十字：让四条顶棱朝上（2-look OLL 第一步）',
        algStage(s3, ['eoll'], s => s[28] === 0 && s[29] === 0 && s[30] === 0 && s[31] === 0, 3));
      emit('CFOP', 'OLL · 角块朝向', '顶层全黄：四个顶角翻正（2-look OLL 第二步）',
        algStage(s3, ['coll'], s => s[8] === 0 && s[9] === 0 && s[10] === 0 && s[11] === 0, 3));
      report('CFOP · PLL', 0.9);
      emit('CFOP', 'PLL · 角块归位', '顶层四角换位（2-look PLL 第一步）',
        algStage(s3, ['cp'], s => existsAUF(s, t => t[0] === 0 && t[1] === 1 && t[2] === 2 && t[3] === 3), 3));
      emit('CFOP', 'PLL · 棱块归位', '顶层四棱换位，魔方复原（2-look PLL 第二步）',
        algStage(s3, ['ep'], s => existsAUF(s, isSolved3), 3));
      const auf = aufFix(s3);
      if (auf && auf.length) emit('CFOP', 'AUF 顶层对齐', '最后转动顶层对齐颜色', auf);
    }

    if (!C.isSolved(st)) throw new Error('求解结果校验失败');
    const moves = [];
    for (const s of steps) moves.push(...s.moves);
    return { method, steps: steps.filter(s => s.moves.length), moves, ms: Date.now() - t0 };
  }

  return {
    solve, simplify, beamSearch, beamSolveStage,
    // 供测试使用
    _internal: {
      macroMoves, macroMovesL2E, composePerm, ATOM,
      state3From, apply3, applySeq3, solved3, isSolved3, MOVE3_ALL, M3_BY_NAME,
      buildTables, tabFace, solveSub, solveLSE, lseTable, algStage, derive3, S_LEN,
      centerCost, pairCost, pairCostSmooth, pairCostSmoothT, PROJ_CEN, PROJ_WING, PROJ_RED, centerDistSum, wingDistSum, centerMis,
      colorTables, wingPairTable, nUnpaired
    }
  };
});


/* ---- Web Worker 入口 ---- */
if (typeof self !== 'undefined') {
  self.onmessage = function (e) {
    var d = e.data || {};
    try {
      var res = self.SOLVER.solve(Uint8Array.from(d.state), d.method, function (p) {
        self.postMessage({ type: 'progress', label: p.label, frac: p.frac });
      });
      self.postMessage({ type: 'done', res: res });
    } catch (err) {
      self.postMessage({ type: 'error', message: (err && err.message) || String(err) });
    }
  };
}

</script>

<script>
/* ===== cube4.js ===== */
/* ============================================================================
 * cube4.js —— 四阶魔方（4x4x4）状态引擎
 * 所有转动置换均由几何推导自动生成，避免手写置换表出错。
 * 面序：U=0 R=1 F=2 D=3 L=4 B=5 ；贴纸编号 fid = face*16 + row*4 + col
 * 世界坐标：+x 右 / +y 上 / +z 朝向观察者（前）
 * ==========================================================================*/
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.CUBE4 = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const N = 4;                     // 阶数
  const NF = N * N;                // 每面贴纸数
  const NS = 6 * NF;               // 贴纸总数 96
  const FACE_NAMES = ['U', 'R', 'F', 'D', 'L', 'B'];
  const FACE_COLORS = ['#f7f7f2', '#d8352a', '#2fa84f', '#f4c518', '#f07c1e', '#2260c7'];

  /* --------------------------------------------------------------------------
   * 1. 贴纸 <-> 几何（cubie 坐标 + 法向）
   * ------------------------------------------------------------------------*/
  // 返回 {i,j,k, n:[nx,ny,nz]}，i/j/k ∈ 0..3
  function faceletGeom(face, r, c) {
    switch (face) {
      case 0: return { i: c, j: 3, k: r, n: [0, 1, 0] };        // U
      case 1: return { i: 3, j: 3 - r, k: 3 - c, n: [1, 0, 0] }; // R
      case 2: return { i: c, j: 3 - r, k: 3, n: [0, 0, 1] };     // F
      case 3: return { i: c, j: 0, k: 3 - r, n: [0, -1, 0] };    // D
      case 4: return { i: 0, j: 3 - r, k: c, n: [-1, 0, 0] };    // L
      case 5: return { i: 3 - c, j: 3 - r, k: 0, n: [0, 0, -1] };// B
    }
    throw new Error('bad face ' + face);
  }

  const GEOM = new Array(NS);
  const GEOM_KEY = new Map();
  const gkey = (i, j, k, n) => i + ',' + j + ',' + k + '|' + n[0] + ',' + n[1] + ',' + n[2];
  for (let f = 0; f < 6; f++) {
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const fid = f * NF + r * N + c;
        const g = faceletGeom(f, r, c);
        g.fid = fid; g.face = f; g.row = r; g.col = c;
        GEOM[fid] = g;
        GEOM_KEY.set(gkey(g.i, g.j, g.k, g.n), fid);
      }
    }
  }

  // 右手法则 90° 旋转（作用于以立方体中心为原点的坐标）
  function rot90(v, axis) {
    const [x, y, z] = v;
    if (axis === 0) return [x, -z, y];   // 绕 +x
    if (axis === 1) return [z, y, -x];   // 绕 +y
    return [-y, x, z];                   // 绕 +z
  }
  function rotN(v, axis, q) { let o = v; for (let t = 0; t < ((q % 4) + 4) % 4; t++) o = rot90(o, axis); return o; }

  const cubieCoord = (g, axis) => (axis === 0 ? g.i : axis === 1 ? g.j : g.k);

  /* --------------------------------------------------------------------------
   * 2. 转动置换生成
   * ------------------------------------------------------------------------*/
  // 单层转动：axis 0/1/2，layer 0..3（沿 +axis 方向的层号），q 个右手 90°
  function layerPerm(axis, layers, q) {
    const src = new Uint8Array(NS);
    for (let i = 0; i < NS; i++) src[i] = i;
    for (let fid = 0; fid < NS; fid++) {
      const g = GEOM[fid];
      if (layers.indexOf(cubieCoord(g, axis)) < 0) continue;
      const p = [g.i - 1.5, g.j - 1.5, g.k - 1.5];
      const np = rotN(p, axis, q);
      const nn = rotN(g.n, axis, q);
      const key = gkey(Math.round(np[0] + 1.5), Math.round(np[1] + 1.5), Math.round(np[2] + 1.5),
        [Math.round(nn[0]), Math.round(nn[1]), Math.round(nn[2])]);
      const dst = GEOM_KEY.get(key);
      if (dst === undefined) throw new Error('geometry mismatch');
      src[dst] = fid;   // 转动后 dst 位置上的贴纸来自 fid
    }
    return src;
  }

  /* --------------------------------------------------------------------------
   * 3. 招式表（MOVES）
   *   记号（SiGN 风格）：外层 U R F D L B ；内层 2U 2R 2F 2D 2L 2B
   *   宽层 Uw Rw ... ；中层 M E S
   * ------------------------------------------------------------------------*/
  // base: {name, axis, layers, qBase}  qBase = 顺时针（从该面外侧看）对应的右手转数
  const BASES = [
    { name: 'U', axis: 1, layers: [3], qBase: 3 },
    { name: '2U', axis: 1, layers: [2], qBase: 3 },
    { name: '2D', axis: 1, layers: [1], qBase: 1 },
    { name: 'D', axis: 1, layers: [0], qBase: 1 },
    { name: 'R', axis: 0, layers: [3], qBase: 3 },
    { name: '2R', axis: 0, layers: [2], qBase: 3 },
    { name: '2L', axis: 0, layers: [1], qBase: 1 },
    { name: 'L', axis: 0, layers: [0], qBase: 1 },
    { name: 'F', axis: 2, layers: [3], qBase: 3 },
    { name: '2F', axis: 2, layers: [2], qBase: 3 },
    { name: '2B', axis: 2, layers: [1], qBase: 1 },
    { name: 'B', axis: 2, layers: [0], qBase: 1 },
    // 宽层（两层一起转）
    { name: 'Uw', axis: 1, layers: [3, 2], qBase: 3 },
    { name: 'Dw', axis: 1, layers: [0, 1], qBase: 1 },
    { name: 'Rw', axis: 0, layers: [3, 2], qBase: 3 },
    { name: 'Lw', axis: 0, layers: [0, 1], qBase: 1 },
    { name: 'Fw', axis: 2, layers: [3, 2], qBase: 3 },
    { name: 'Bw', axis: 2, layers: [0, 1], qBase: 1 },
    // 中层（3x3 意义上的 M/E/S，作用于两个内层）
    { name: 'M', axis: 0, layers: [1, 2], qBase: 1 },   // 跟随 L
    { name: 'E', axis: 1, layers: [1, 2], qBase: 1 },   // 跟随 D
    { name: 'S', axis: 2, layers: [1, 2], qBase: 3 }    // 跟随 F
  ];

  const MOVES = [];           // 全部招式
  const MOVE_BY_NAME = new Map();
  for (const b of BASES) {
    for (const [sfx, mul] of [['', 1], ["'", -1], ['2', 2]]) {
      const q = ((b.qBase * mul) % 4 + 4) % 4;
      const name = b.name + sfx;
      const mv = {
        idx: MOVES.length, name, base: b.name, axis: b.axis, layers: b.layers.slice(),
        q, turns: mul, perm: layerPerm(b.axis, b.layers, q),
        // 动画用：绕 axis 的右手转角（度）
        angle: (b.qBase === 3 ? -90 : 90) * (mul === 2 ? 2 : mul)
      };
      MOVES.push(mv);
      MOVE_BY_NAME.set(name, mv);
    }
  }
  // 单层招式（打乱/搜索用，共 36 个）
  const SINGLE_MOVES = MOVES.filter(m => m.layers.length === 1);

  function moveByName(n) {
    const m = MOVE_BY_NAME.get(n);
    if (!m) throw new Error('unknown move: ' + n);
    return m;
  }
  function parseSeq(s) {
    if (Array.isArray(s)) return s.map(x => (typeof x === 'string' ? moveByName(x) : x));
    return s.trim().split(/\s+/).filter(Boolean).map(moveByName);
  }
  function seqToString(seq) { return seq.map(m => m.name).join(' '); }
  function invertSeq(seq) {
    return seq.slice().reverse().map(m => {
      const t = m.turns === 2 ? 2 : -m.turns;
      return moveByName(m.base + (t === 1 ? '' : t === -1 ? "'" : '2'));
    });
  }

  /* --------------------------------------------------------------------------
   * 4. 状态操作
   * ------------------------------------------------------------------------*/
  function solvedState() {
    const st = new Uint8Array(NS);
    for (let i = 0; i < NS; i++) st[i] = (i / NF) | 0;
    return st;
  }
  function applyMove(st, mv, out) {
    const p = mv.perm, o = out || new Uint8Array(NS);
    for (let i = 0; i < NS; i++) o[i] = st[p[i]];
    return o;
  }
  function applySeq(st, seq) {
    let cur = st.slice();
    for (const m of parseSeq(seq)) cur = applyMove(cur, m);
    return cur;
  }
  function isSolved(st) {
    for (let i = 0; i < NS; i++) if (st[i] !== ((i / NF) | 0)) return false;
    return true;
  }

  function randomScramble(len) {
    len = len || 40;
    const out = [];
    let lastKey = -1;
    while (out.length < len) {
      const m = SINGLE_MOVES[(Math.random() * SINGLE_MOVES.length) | 0];
      const key = m.axis * 4 + m.layers[0];
      if (key === lastKey) continue;
      out.push(m); lastKey = key;
    }
    return out;
  }

  /* --------------------------------------------------------------------------
   * 5. 块结构（角块 / 棱块（复合棱）/ 中心块）

      try {
        const res = mainSolver.solve(Uint8Array.from(state), method);
        cb({ type: 'done', res });
      } catch (e) { cb({ type: 'error', message: e.message }); }
    }, 60);
  }

  function currentMethod() {
    const el = document.querySelector('input[name="method"]:checked');
    return el ? el.value : 'cfop';
  }

  function doSolve() {
    if (busy()) return;
    S.playing = false;
    flushQueue();
    if (C.isSolved(S.cube)) { toast('魔方已经是复原状态'); return; }
    S.solving = true;
    btnSolve.classList.add('loading');
    status('求解中… 正在归约 / 搜索', 'busy');
    const base = Uint8Array.from(S.cube);
    const method = currentMethod();
    const onMsg = msg => {
      if (msg.type === 'progress') { status('求解中… ' + msg.label, 'busy'); return; }
      S.solving = false;
      btnSolve.classList.remove('loading');
      if (msg.type === 'error') { status('求解失败：' + msg.message, 'warn'); toast('求解失败：' + msg.message, 3600); return; }
      const res = msg.res;
      const flat = [];
      res.steps.forEach((s, si) => s.moves.forEach(n => flat.push({ name: n, step: si })));
      S.solution = { method: res.method, steps: res.steps, flat, base };
      S.playIdx = 0;
      S.cube = Uint8Array.from(base);
      renderer.setState(S.cube);
      renderStepList();
      updatePlayUI();
      const mm = res.method === 'roux' ? '桥式 Roux' : 'CFOP';
      status(`${mm} 解法就绪：${flat.length} 步 / ${res.steps.length} 个阶段（耗时 ${res.ms}ms）`, 'ok');
      toast(`已生成 ${mm} 解法：${flat.length} 步，点击 ▶ 播放`);
      document.body.classList.add('has-solution');
      setPlaying(true);
    };
    const w = ensureWorker();
    if (w) {
      w.onmessage = e => onMsg(e.data);
      w.postMessage({ state: Array.from(base), method });
    } else {
      status('求解中…（主线程计算，界面可能短暂无响应）', 'busy');
      solveOnMainThread(base, method, onMsg);
    }
  }

  /* ------------------------------ 打乱 / 重置 ------------------------------ */
  function doScramble() {
    if (busy()) return;
    S.playing = false; flushQueue();
    S.solution = null; S.playIdx = 0;
    document.body.classList.remove('has-solution');
    renderStepList();
    const seq = C.randomScramble(32);
    S.scrambling = true;
    status('打乱中…', 'busy');
    enqueue(seq, 62, () => {
      S.scrambling = false;
      status('已打乱 ' + seq.length + ' 步，可拖拽转层，或选择解法后点击「求解」', '');
      toast('打乱完成：' + seq.length + ' 步');
    });
  }
  function doReset() {
    if (busy()) return;
    S.queue.length = 0;
    S.anim = null; renderer.setAnim(null);
    S.solution = null; S.playing = false; S.playIdx = 0;
    document.body.classList.remove('has-solution');
    S.cube = C.solvedState();
    renderer.setState(S.cube);
    renderStepList();
    status('已回到复原状态', '');
  }

  /* ------------------------------ 分步演示控制 ------------------------------ */
  function setPlaying(v) {
    S.playing = v && !!S.solution && S.playIdx < S.solution.flat.length;
    btnPlay.textContent = S.playing ? '⏸' : '▶';
    btnPlay.title = S.playing ? '暂停' : '播放';
    if (S.playing) pump();
  }
  function stepDuration() {
    const sp = parseFloat(speedSel.value) || 1;
    return Math.max(70, 300 / sp);
  }
  function pump() {
    if (!S.playing || !S.solution) return;
    if (S.anim || S.queue.length) return;
    if (S.playIdx >= S.solution.flat.length) { setPlaying(false); checkSolved(); return; }
    const mv = C.moveByName(S.solution.flat[S.playIdx].name);
    S.playIdx++;
    enqueue([mv], stepDuration(), () => { updatePlayUI(); pump(); });
    updatePlayUI();
  }
  function stepOnce(dir) {
    if (!S.solution || S.anim || S.queue.length) return;
    setPlaying(false);
    if (dir > 0) {
      if (S.playIdx >= S.solution.flat.length) return;
      const mv = C.moveByName(S.solution.flat[S.playIdx].name);
      S.playIdx++;
      enqueue([mv], 190, () => { updatePlayUI(); checkSolved(); });
    } else {
      if (S.playIdx <= 0) return;
      S.playIdx--;
      const mv = C.moveByName(S.solution.flat[S.playIdx].name);
      const inv = C.invertSeq([mv])[0];
      enqueue([inv], 190, updatePlayUI);
    }
    updatePlayUI();
  }
  function gotoIndex(k) {
    if (!S.solution) return;
    setPlaying(false);
    S.queue.length = 0; S.anim = null; renderer.setAnim(null);
    k = Math.max(0, Math.min(S.solution.flat.length, k));
    let st = Uint8Array.from(S.solution.base);
    for (let i = 0; i < k; i++) st = C.applyMove(st, C.moveByName(S.solution.flat[i].name));
    S.cube = st; renderer.setState(st); S.playIdx = k;
    updatePlayUI();
    if (k === S.solution.flat.length) checkSolved();
  }

  function renderStepList() {
    stepsEl.innerHTML = '';
    if (!S.solution) {
      stepsEl.innerHTML = '<div class="empty">还没有解法。<br>① 点「打乱」或直接拖动魔方<br>② 选择 CFOP / 桥式 Roux<br>③ 点「求解」生成分步演示</div>';
      metaEl.textContent = '';
      updatePlayUI();
      return;
    }
    const sol = S.solution;
    metaEl.textContent = (sol.method === 'roux' ? '桥式 Roux' : 'CFOP') + ' · ' + sol.flat.length + ' 步';
    let acc = 0;
    sol.steps.forEach((s, si) => {
      const start = acc; acc += s.moves.length;
      const d = document.createElement('div');
      d.className = 'step';
      d.dataset.si = si; d.dataset.start = start;
      const chips = s.moves.map((m, mi) => `<span class="mv" data-idx="${start + mi}">${m}</span>`).join('');
      d.innerHTML =
        `<div class="step-head"><span class="ph ph-${s.phase}">${s.phase}</span>` +
        `<span class="nm">${s.name}</span><span class="cnt">${s.moves.length}</span></div>` +
        `<div class="desc">${s.desc || ''}</div><div class="mvs">${chips}</div>`;
      d.addEventListener('click', ev => {
        const chip = ev.target.closest('.mv');
        gotoIndex(chip ? parseInt(chip.dataset.idx, 10) + 1 : parseInt(d.dataset.start, 10));
      });
      stepsEl.appendChild(d);
    });
    updatePlayUI();
  }

  function updatePlayUI() {
    const sol = S.solution;
    const total = sol ? sol.flat.length : 0;
    progress.max = String(total);
    progress.value = String(S.playIdx);
    moveCounter.textContent = total ? `${S.playIdx} / ${total}` : '0 / 0';
    playbar.classList.toggle('disabled', !sol);
    if (!sol) { curStepEl.textContent = '—'; return; }
    const si = S.playIdx < total ? sol.flat[S.playIdx].step
      : (total ? sol.flat[total - 1].step : 0);
    const s = sol.steps[si];
    const nextMv = S.playIdx < total ? sol.flat[S.playIdx].name : '完成';
    curStepEl.innerHTML = `<span class="ph ph-${s.phase}">${s.phase}</span> ${s.name}` +
      `　<span class="nextmv">下一步：<b>${nextMv}</b></span>`;
    stepsEl.querySelectorAll('.step').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.si, 10) === si);
    });
    stepsEl.querySelectorAll('.mv').forEach(el => {
      const i = parseInt(el.dataset.idx, 10);
      el.classList.toggle('done', i < S.playIdx);
      el.classList.toggle('now', i === S.playIdx);
    });
    const act = stepsEl.querySelector('.step.active');
    if (act) {
      const pr = panel.getBoundingClientRect(), ar = act.getBoundingClientRect();
      if (ar.top < pr.top + 40 || ar.bottom > pr.bottom - 10) act.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  /* ------------------------------ 绑定 ------------------------------ */
  btnScramble.addEventListener('click', doScramble);
  btnSolve.addEventListener('click', doSolve);
  btnReset.addEventListener('click', doReset);
  btnPlay.addEventListener('click', () => setPlaying(!S.playing));
  btnNext.addEventListener('click', () => stepOnce(1));
  btnPrev.addEventListener('click', () => stepOnce(-1));
  btnFirst.addEventListener('click', () => gotoIndex(0));
  btnLast.addEventListener('click', () => gotoIndex(S.solution ? S.solution.flat.length : 0));
  progress.addEventListener('input', () => gotoIndex(parseInt(progress.value, 10)));
  document.querySelectorAll('input[name="method"]').forEach(el => el.addEventListener('change', () => {
    if (S.solution) {
      S.solution = null; S.playIdx = 0; renderStepList();
      document.body.classList.remove('has-solution');
      status('已切换解法，请重新点击「求解」', '');
    }
  }));
  $('btnPanel').addEventListener('click', () => document.body.classList.toggle('panel-open'));
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!S.playing); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); stepOnce(1); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); stepOnce(-1); }
    else if (e.key === 's' || e.key === 'S') doScramble();
    else if (e.key === 'r' || e.key === 'R') doReset();
    else if (e.key === 'Enter') doSolve();
  });
  window.addEventListener('resize', () => renderer.resize());

  // 调试 / 自动化测试挂钩
  window.__APP__ = {
    S, C, renderer, doSolve, doScramble, doReset, gotoIndex, stepOnce, setPlaying,
    currentMethod, isSolved: () => C.isSolved(S.cube),
    setMethod(m) { const el = document.querySelector('input[name="method"][value="' + m + '"]'); if (el) { el.checked = true; el.dispatchEvent(new Event('change', { bubbles: true })); } },
    ready: true
  };

  renderStepList();
  status('拖拽魔方表面转层 · 拖拽背景转视角 · 滚轮缩放', '');
  // 预热求解器（后台创建 Worker，避免首次求解卡顿）
  setTimeout(ensureWorker, 400);
})();

</script>
</body>
</html>
