<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0d18">
<title>动漫风四阶魔方 · CFOP / 桥式解法分步演示</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="topbar">
  <div class="brand">
    <span class="cube-logo">4×4</span>
    <div><b>动漫魔方</b><span>CEL 卡线渲染 · 自动求解</span></div>
  </div>
  <div class="seg" role="radiogroup" aria-label="解法选择">
    <label><input type="radio" name="method" value="cfop" checked><span>CFOP</span></label>
    <label><input type="radio" name="method" value="roux"><span>桥式 Roux</span></label>
  </div>
  <div class="acts">
    <button id="btnScramble" class="btn ghost" title="随机打乱 (S)">打乱</button>
    <button id="btnSolve" class="btn primary" title="求解并演示 (Enter)">求解</button>
    <button id="btnReset" class="btn ghost" title="回到复原状态 (R)">重置</button>
    <button id="btnPanel" class="btn ghost only-mobile" title="展开/收起步骤面板">步骤</button>
  </div>
</header>

<aside class="panel" id="panel">
  <div class="panel-head"><b>求解步骤</b><span id="solMeta"></span></div>
  <div class="steps" id="steps"></div>
  <div class="legend">
    记号：<code>U R F D L B</code> 外层顺时针 · <code>'</code> 逆时针 · <code>2</code> 转 180°<br>
    <code>2U 2R …</code> 第二层单层 · <code>Uw Rw</code> 外两层同转 · <code>M</code> 中间两层<br>
    CFOP = 十字 → F2L → OLL → PLL；桥式 Roux = 双块 → CMLL → LSE（&lt;M,U&gt; 完全 BFS 最短解）
  </div>
</aside>

<footer class="playbar disabled" id="playbar">
  <div class="cur" id="curStep">—</div>
  <div class="ctrl">
    <button id="btnFirst" title="回到开头">⏮</button>
    <button id="btnPrev" title="上一步 (←)">◀</button>
    <button id="btnPlay" class="play" title="播放 / 暂停 (空格)">▶</button>
    <button id="btnNext" title="下一步 (→)">▶|</button>
    <button id="btnLast" title="跳到结尾">⏭</button>
    <input type="range" id="progress" min="0" max="0" value="0" title="拖动跳转到任意步">
    <span id="moveCounter">0 / 0</span>
    <select id="speed" title="播放速度">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </div>
</footer>

<div class="status" id="status"></div>
<div class="toast" id="toast"></div>

<!-- 求解器：以文本形式内嵌，运行时通过 Blob 创建 Web Worker（后台计算，界面不卡） -->
<script id="solverWorker" type="text/plain">
/*__WORKER__*/
</script>

<script>
/*__APP__*/
</script>
</body>
</html>
