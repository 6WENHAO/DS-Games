<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>菌株监测可视化平台 · StrainLab</title>
<style>
:root{--bg:#0d1220;--panel:#141a2a;--panel2:#1a2236;--line:#2a3550;
 --fg:#dbe6f4;--fg2:#9fb2c9;--fg3:#6c7f99;--acc:#4ea8de;--good:#4fbf8b;
 --warn:#e0a03a;--bad:#e2564a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);
 font:13px/1.55 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
.topbar{flex:0 0 48px;display:flex;align-items:center;gap:14px;padding:0 14px;
 background:linear-gradient(180deg,#182133,#101625);border-bottom:1px solid var(--line)}
.logo{font-size:17px;font-weight:700;letter-spacing:1px;
 background:linear-gradient(90deg,#7fd6f0,#4ea8de);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:var(--fg3)}
.topstat{margin-left:auto;font:11px ui-monospace,Consolas,monospace;color:var(--fg2)}
.main{flex:1;display:flex;min-height:0}
.side{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.nav{display:flex;flex-direction:column;padding:8px}
.nav button{text-align:left;padding:10px 12px;margin:2px 0;border:1px solid transparent;border-radius:6px;
 background:transparent;color:var(--fg2);font-size:13px;cursor:pointer;transition:.12s}
.nav button:hover{background:var(--panel2)}
.nav button.on{background:#1d2a42;border-color:#2f5f86;color:#a8e2ff;font-weight:600}
.safety{margin:12px;padding:10px;font-size:11px;line-height:1.6;color:#e8c9a0;
 background:#241d10;border:1px solid #54431f;border-radius:6px}
.content{flex:1;overflow-y:auto;padding:16px 18px 60px}
.pane{display:none}
.pane.on{display:block}
h2{font-size:15px;margin-bottom:10px;color:#cfe4f5}
h3{font-size:13px;margin:14px 0 6px;color:#bcd6ea}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.col{flex:1;min-width:320px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
canvas.chart{width:100%;height:260px;background:#0e1522;border:1px solid var(--line);border-radius:6px;display:block}
canvas.wide{height:300px}
.ctl{margin:8px 0}
.ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2)}
.ctl output{font-family:ui-monospace,monospace;color:var(--acc)}
.ctl input[type=range]{width:100%;margin-top:3px;accent-color:var(--acc)}
select,input[type=number],input[type=file]{background:var(--panel2);border:1px solid var(--line);
 color:var(--fg);border-radius:4px;padding:5px 8px;font-size:12px;width:100%;margin:4px 0}
button{font-size:12px;padding:7px 13px;border-radius:5px;border:1px solid #2c4257;background:#18242f;
 color:#c6ddf0;cursor:pointer;transition:.12s;margin:2px}
button:hover{background:#203143}
button.primary{background:#1c4a68;border-color:#2f7ba8;color:#d8f0ff;font-weight:600}
button.bad{background:#3a1f1c;border-color:#6b3129;color:#f2a99f}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;border-bottom:1px dashed #1e2939}
.kv b{font-family:ui-monospace,monospace;color:#cfe3f4;text-align:right}
.note{font-size:11.5px;color:var(--fg3);line-height:1.7;background:#101823;border-left:2px solid #2c4457;
 padding:6px 10px;margin:8px 0;border-radius:0 4px 4px 0}
.warnbox{font-size:11.5px;color:#f0c7a8;background:#2a1f16;border-left:2px solid var(--warn);
 padding:6px 10px;margin:8px 0;border-radius:0 4px 4px 0;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
th{background:#16212d;color:#9fbdd6;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
td{padding:4px 8px;border-bottom:1px solid #182430;color:var(--fg2);font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.ok{color:var(--good)} .bad{color:var(--bad)} .dim{color:var(--fg3)}
.mono{font-family:ui-monospace,Consolas,monospace}
.statusdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--fg3);margin-right:6px;vertical-align:middle}
.statusdot.run{background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.heat-cell-label{font-size:9px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="logo">StrainLab 菌株监测可视化平台</span>
    <span class="sub">非致病模式生物 · 培养监测 · 诱变教学仿真</span>
    <span class="topstat" id="conn"></span>
  </div>
  <div class="main">
    <div class="side">
      <div class="nav" id="nav"></div>
      <div class="safety">⚠ <b>安全边界</b><br>
        本平台仅用于<b>非致病安全菌株</b>（E. coli K-12 / 酿酒酵母，BSL-1）的监测与诱变<b>教学仿真</b>。
        不得用于任何致病微生物的定向改造；涉及致病性研究必须停止并报生物安全委员会。</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
"use strict";
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
var h=function(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls&&typeof cls==='object'&&!Array.isArray(cls)){   // 对象 → 当属性表处理（与 el 一致）
    for(var k in cls){
      if(k==='class')e.className=Array.isArray(cls[k])?cls[k].join(' '):String(cls[k]);
      else if(k==='text')e.textContent=cls[k];
      else if(k==='on'&&cls[k]&&typeof cls[k]==='object'){for(var ev2 in cls[k])e.addEventListener(ev2,cls[k][ev2]);}
      else if(k.slice(0,2)==='on'&&k.length>2)e.addEventListener(k.slice(2),cls[k]);
      else if(k==='id')e.setAttribute(k,cls[k]);
      else e.setAttribute(k,cls[k]);
    }
    return e;
  }
  if(Array.isArray(cls))e.className=cls.join(' ');else if(cls)e.className=String(cls);
  if(txt!==undefined)e.textContent=txt;return e;};
var el=function(tag,attrs,kids){var e=document.createElement(tag);
 if(attrs)for(var k in attrs){if(k==='class')e.className=Array.isArray(attrs[k])?attrs[k].join(' '):String(attrs[k]);
  else if(k==='text')e.textContent=attrs[k];
  else if(k==='on'&&attrs[k]&&typeof attrs[k]==='object'){for(var ev in attrs[k])e.addEventListener(ev,attrs[k][ev]);}
 else if(k.slice(0,2)==='on'&&k.length>2)e.addEventListener(k.slice(2),attrs[k]);
 else if(k==='class'){}
 else e.setAttribute(k,attrs[k]);}
 if(kids)for(var i=0;i<kids.length;i++){
   var kid=kids[i];
   if(kid===null||kid===undefined||kid===false)continue;
   if(typeof kid==='string'||typeof kid==='number')kid=document.createTextNode(String(kid));
   e.appendChild(kid);
 }
 return e;};
var clear=function(e){while(e.firstChild)e.removeChild(e.firstChild);return e;};

var API='';
var PANES=['dash','sim','search','data','worker','manual','epi','about'];
var state={files:[],dataset:null,workerTimer:null,sim:null,trav:null};

/* ---- 诊断基础设施：任何错误都不许静默 ---- */
function toast(msg,kind){
  var old=document.getElementById('errToast');
  if(old)old.remove();
  var d=el('div',{id:'errToast',style:'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);'
    +'z-index:999;max-width:82%;padding:10px 18px;border-radius:8px;font-size:13px;line-height:1.6;'
    +'background:'+(kind==='err'?'#3a1f1c':'#1c2b3a')+';color:'+(kind==='err'?'#ffc0b5':'#cfe4f5')
    +';border:1px solid '+(kind==='err'?'#8a4034':'#2f5f86')+';box-shadow:0 6px 24px rgba(0,0,0,.5);white-space:pre-wrap'},[String(msg)]);
  document.body.appendChild(d);
  setTimeout(function(){d.remove();},7000);
}
window.addEventListener('error',function(ev){
  toast('页面脚本错误（'+(ev.filename||'?').split('/').pop()+' 第'+(ev.lineno||'?')+'行）:\n'+ev.message,'err');
});
window.addEventListener('unhandledrejection',function(ev){
  toast('异步请求失败:\n'+(ev.reason&&ev.reason.message?ev.reason.message:ev.reason),'err');
});
function post(path,body){
  return fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})})
  .then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  })
  .catch(function(e){
    toast('请求失败 '+path+'\n'+String(e)+'\n若提示网络错误：后端服务没在运行。\n请运行 启动StrainLab.bat 后，通过它打开的 http://127.0.0.1:8000/ 访问（不要直接双击 frontend.html）。','err');
    return {error:String(e)};
  });
}
function get(path){
  return fetch(API+path)
  .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
  .catch(function(e){
    toast('请求失败 '+path+'\n'+String(e)+'\n若提示网络错误：后端服务没在运行。\n请运行 启动StrainLab.bat 后，通过它打开的 http://127.0.0.1:8000/ 访问（不要直接双击 frontend.html）。','err');
    return {error:String(e)};
  });
}
/* ---------- 自绘 Canvas 图表库（无依赖） ---------- */
function Chart2D(cv){
  if(!cv||!cv.getContext){return {cv:null,line:function(){},heat:function(){}};}
  var dpr=window.devicePixelRatio||1;
  var c=cv.getContext('2d');
  function resize(){var w=cv.clientWidth||640,h=cv.clientHeight||260;
    if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;}
    c.setTransform(dpr,0,0,dpr,0,0);return {w:w,h:h};}
  return {
    cv:cv, ctx:c,
    line:function(series,opt){opt=opt||{};
      var d=resize(),W=d.w,H=d.h,padL=46,padR=10,padT=22,padB=26;
      var x0=padL,x1=W-padR,y0=padT,y1=H-padB;
      var xmin=1e30,xmax=-1e30,ymin=1e30,ymax=-1e30;
      series.forEach(function(s){s.pts.forEach(function(p){if(isFinite(p[0])&&isFinite(p[1])){
        xmin=Math.min(xmin,p[0]);xmax=Math.max(xmax,p[0]);
        ymin=Math.min(ymin,p[1]);ymax=Math.max(ymax,p[1]);}});});
      if(opt.xmin!==undefined)xmin=opt.xmin; if(opt.xmax!==undefined)xmax=opt.xmax;
      if(opt.ymin!==undefined)ymin=opt.ymin; if(opt.ymax!==undefined)ymax=opt.ymax;
      if(!isFinite(xmin)){xmin=0;xmax=1;} if(!isFinite(ymin)){ymin=0;ymax=1;}
      if(xmax-xmin<1e-9)xmax=xmin+1; if(ymax-ymin<1e-9)ymax=ymin+1;
      ymax+=(ymax-ymin)*0.08;
      c.clearRect(0,0,W,H);
      c.strokeStyle='rgba(120,160,200,.15)';c.lineWidth=1;c.font='10px ui-monospace,monospace';
      for(var g=0;g<=4;g++){var yy=y0+(y1-y0)*g/4;
        c.beginPath();c.moveTo(x0,yy);c.lineTo(x1,yy);c.stroke();
        c.fillStyle='rgba(170,200,230,.7)';
        c.fillText(fmtNum(ymax-(ymax-ymin)*g/4,2),2,yy+3);
        var xx=x0+(x1-x0)*g/4;c.beginPath();c.moveTo(xx,y0);c.lineTo(xx,y1);c.stroke();
        c.fillText(fmtNum(xmin+(xmax-xmin)*g/4,2),xx-10,H-10);}
      series.forEach(function(s){c.strokeStyle=s.color;c.lineWidth=s.w||1.6;
        c.setLineDash(s.dash||[]);c.beginPath();
        s.pts.forEach(function(p,i){var px=x0+(x1-x0)*(p[0]-xmin)/(xmax-xmin);
          var py=y0+(y1-y0)*(ymax-p[1])/(ymax-ymin);
          if(i===0)c.moveTo(px,py);else c.lineTo(px,py);});
        c.stroke();c.setLineDash([]);});
      c.fillStyle='rgba(210,230,250,.92)';c.font='bold 11px system-ui,sans-serif';
      if(opt.title)c.fillText(opt.title,x0,13);
      var lx=x0+110;c.font='10px system-ui,sans-serif';
      series.forEach(function(s){c.fillStyle=s.color;c.fillRect(lx,6,9,3);
        c.fillStyle='rgba(190,215,240,.8)';c.fillText(s.name,lx+12,10);
        lx+=c.measureText(s.name).width+24;});
      if(opt.xLabel){c.fillStyle='rgba(150,180,210,.7)';c.fillText(opt.xLabel,(x0+x1)/2-30,H-2);}
      if(opt.yLabel){c.save();c.translate(12,(y0+y1)/2);c.rotate(-Math.PI/2);
        c.fillText(opt.yLabel,-30,0);c.restore();}
    },
    heat:function(rows,cols,getVal,opt){opt=opt||{};
      var d=resize(),W=d.w,H=d.h,padL=40,padR=8,padT=22,padB=30;
      var x0=padL,x1=W-padR,y0=padT,y1=H-padB;
      var vmin=1e30,vmax=-1e30;
      for(var i=0;i<rows;i++)for(var j=0;j<cols;j++){var v=getVal(i,j);
        if(v<vmin)vmin=v;if(v>vmax)vmax=v;}
      if(!isFinite(vmin)){vmin=0;vmax=1;} if(vmax-vmin<1e-6)vmax=vmin+1;
      c.clearRect(0,0,W,H);
      var cw=(x1-x0)/cols,ch=(y1-y0)/rows;
      for(i=0;i<rows;i++)for(j=0;j<cols;j++){
        var t=(getVal(i,j)-vmin)/(vmax-vmin);
        var col=turbo(Math.max(0,Math.min(1,t)));
        c.fillStyle='rgb('+Math.round(col[0]*255)+','+Math.round(col[1]*255)+','+Math.round(col[2]*255)+')';
        c.fillRect(x0+j*cw,y0+i*ch,cw-0.8,ch-0.8);
        if(cw>22&&ch>13){c.fillStyle='rgba(8,12,18,.75)';
          c.fillText(fmtNum(getVal(i,j),2),x0+j*cw+2,y0+i*ch+11);}}
      c.fillStyle='rgba(210,230,250,.9)';c.font='bold 11px system-ui,sans-serif';
      if(opt.title)c.fillText(opt.title,x0,13);
      c.font='9px ui-monospace,monospace';
      for(j=0;j<cols;j++){c.fillStyle='rgba(170,200,230,.65)';
        c.fillText(opt.colLabel?opt.colLabel(j):(''+j),x0+j*cw+cw/2-6,y1+14);}
      for(i=0;i<rows;i++){c.fillStyle='rgba(170,200,230,.65)';
        c.fillText(opt.rowLabel?opt.rowLabel(i):(''+i),4,y0+i*ch+ch/2+3);}
      var bw=120,bh=9,bx=W-bw-8,by=H-13;
      for(var k=0;k<=40;k++){var c2=turbo(k/40);
        c.fillStyle='rgb('+Math.round(c2[0]*255)+','+Math.round(c2[1]*255)+','+Math.round(c2[2]*255)+')';
        c.fillRect(bx+k*bw/40,by,bw/40+0.5,bh);}
      c.fillStyle='rgba(190,215,240,.8)';
      c.fillText(fmtNum(vmin,2)+' ~ '+fmtNum(vmax,2),bx,by-4);
    }
  };
}
function fmtNum(v,d){if(v===null||v===undefined||!isFinite(v))return '-';
 d=(d===undefined)?2:d;var a=Math.abs(v);
 if(a>=1e9)return (v/1e9).toFixed(2)+'e9';
 if(a!==0&&a<1e-4)return v.toExponential(2);
 return v.toFixed(d).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1');}
function turbo(t){t=Math.max(0,Math.min(1,t));
 var r=0.1357+t*(4.6154+t*(-42.6603+t*(132.1311+t*(-152.9424+t*59.2864))));
 var g=0.0914+t*(2.1942+t*(4.8430+t*(-14.1850+t*(4.2773+t*2.8296))));
 var b=0.1067+t*(12.6419+t*(-60.5820+t*(110.3628+t*(-89.9031+t*27.3482))));
 return [Math.min(1,Math.max(0,r)),Math.min(1,Math.max(0,g)),Math.min(1,Math.max(0,b))];}
/* ---------- 面板 1：总览（交互式菌株生长热力图 + 动态菌落繁殖动画） ---------- */
function paneDash(){
  var box=el('div',{class:'pane'},[
    h('h2',null,'菌株生长监测总览'),
    el('div',{class:'grid2'},[
      el('div',{class:'card'},[
        h('h3',null,'交互式生长热力图（36 孔板 × 24 h，菌落密度）'),
        h('canvas',{class:'chart wide',id:'cvHeat'}),
        el('div',{class:'row'},[
          el('button',{text:'重新随机播种',on:{click:function(){seedHeat();drawHeat();}}}),
          el('button',{text:'模拟升温 41 ℃',on:{click:function(){heatTemp=41;drawHeat();}}}),
          el('button',{text:'恢复 37 ℃',on:{click:function(){heatTemp=37;drawHeat();}}}),
          el('button',{text:'加载示例 CSV',on:{click:function(){loadExample();}}}),
          el('span',{class:'note',text:'热力图数据 = 各孔 Logistic 生长 × 空间扩散场（平台内生成，可被上传 CSV 替换）'})
        ])
      ]),
      el('div',{class:'card'},[
        h('h3',null,'动态菌落繁殖动画（Canvas 逐帧模拟）'),
        h('canvas',{class:'chart wide',id:'cvColony'}),
        el('div',{class:'row'},[
          el('button',{text:'▶ 开始',on:{click:function(){colonyRunning=true;}}}),
          el('button',{text:'⏸ 暂停',on:{click:function(){colonyRunning=false;}}}),
          el('button',{text:'↺ 重置',on:{click:function(){initColonies();}}}),
          el('button',{text:'+ 营养',on:{click:function(){nutrient=Math.min(nutrient+200,900);}}}),
          el('button',{text:'+ 接种量',on:{click:function(){spawnColonies(6);}}})
        ])
      ])
    ]),
    el('div',{class:'grid2'},[
      el('div',{class:'card'},[
        h('h3',null,'繁殖曲线（总菌数 vs 代数）'),
        h('canvas',{class:'chart',id:'cvCurve'})
      ]),
      el('div',{class:'card'},[
        h('h3',null,'当前状态'),
        el('div',{id:'dashStats'})
      ])
    ])
  ]);
  return box;
}
/* 热力图状态 */
var heatTemp=37,heatSeed=[];      // [36][24] 每孔每时刻密度
function seedHeat(){
  heatSeed=[];
  for(var i=0;i<36;i++){heatSeed.push([]);
    for(var hh=0;hh<24;hh++){
      var t=heatTemp,r=Math.max(0.0001,Math.pow(0.036*(t-8)*(1-Math.exp(0.18*(t-48))),2));
      var well=1+0.35*Math.sin(i*1.7)+0.2*Math.cos(i*0.9);
      var K=0.9+0.1*well;
      var N=K/(1+(K/0.005-1)*Math.exp(-r*5.5*hh))*well;
      heatSeed[i].push(N);
    }}
}
function drawHeat(){
  var cv=$('#cvHeat');if(!cv)return;
  var ch=Chart2D(cv);
  var rows=36,cols=24;
  var grid=[];
  for(var i=0;i<rows;i++){grid.push([]);
    for(var j=0;j<cols;j++){grid[i].push(heatSeed[i]?heatSeed[i][j]:0);}}
  ch.heat(rows,cols,function(i,j){return grid[i][j];},
    {title:'菌落密度（OD600 归一化）· 孔板纵轴 / 时间横轴',rowLabel:function(i){return String.fromCharCode(65+Math.floor(i/6))+(i%6+1);},
     colLabel:function(j){return (j%6===0?j+'h':'');}});
}
/* 菌落动画 */
var colonies=[],nutrient=420,colonyRunning=true,colonyHist=[];
function initColonies(){colonies=[];nutrient=420;colonyHist=[];spawnColonies(14);}
function spawnColonies(n){
  for(var i=0;i<n;i++)colonies.push({x:Math.random()*640,y:Math.random()*260,r:1.2+Math.random()*1.5,
    sp:0.05+Math.random()*0.06,dir:Math.random()*Math.PI*2,age:0});}
function stepColonies(){
  if(!colonyRunning)return;
  var W=640,H=260;
  var total=0;
  nutrient=Math.min(nutrient+2.2,900);
  colonies.forEach(function(c){total+=c.r*c.r;});
  for(var i=colonies.length-1;i>=0;i--){
    var c=colonies[i];
    c.age++;
    var share=nutrient/Math.max(colonies.length*40,1);
    if(c.r<28&&share>0.35)c.r+=0.05+0.02*c.sp;
    if(c.r>=3){
      c.x+=Math.cos(c.dir)*c.sp*8+ (Math.random()-0.5)*0.8;
      c.y+=Math.sin(c.dir)*c.sp*8+ (Math.random()-0.5)*0.8;
      if(Math.random()<0.004){colonies.push({x:c.x+Math.random()*6-3,y:c.y+Math.random()*6-3,
        r:1.1,sp:c.sp*(0.9+Math.random()*0.2),dir:Math.random()*Math.PI*2,age:0});}}
    if(c.x<2||c.x>W-2||c.y<2||c.y>H-2){c.dir+=Math.PI*(0.5+Math.random());}
  }
  colonyHist.push({gen:colonyHist.length,total:total,count:colonies.length,nutrient:nutrient});
  if(colonyHist.length>400)colonyHist.shift();
  drawColonies();
}
function drawColonies(){
  var cv=$('#cvColony');if(!cv)return;
  var dpr=window.devicePixelRatio||1;
  if(cv.width!==640*dpr){cv.width=640*dpr;cv.height=260*dpr;}
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,640,260);
  c.fillStyle='#0c1320';c.fillRect(0,0,640,260);
  /* 营养梯度背景 */
  var g=c.createRadialGradient(320,130,20,320,130,340);
  g.addColorStop(0,'rgba(48,110,90,'+(nutrient/900*0.5)+')');
  g.addColorStop(1,'rgba(48,110,90,0)');
  c.fillStyle=g;c.fillRect(0,0,640,260);
  colonies.forEach(function(cc){
    var col=turbo(Math.min(1,cc.r/28));
    c.beginPath();c.arc(cc.x,cc.y,Math.max(cc.r,0.8),0,Math.PI*2);
    c.fillStyle='rgba('+Math.round(col[0]*255)+','+Math.round(col[1]*255)+','+Math.round(col[2]*255)+',0.85)';
    c.fill();
    c.strokeStyle='rgba(255,255,255,0.25)';c.stroke();
  });
  c.fillStyle='rgba(220,240,255,0.9)';c.font='bold 12px system-ui,sans-serif';
  c.fillText('菌落数 '+colonies.length+'  营养 '+Math.round(nutrient)+'/900',10,20);
  var cv2=$('#cvCurve');if(!cv2)return;
  Chart2D(cv2).line([{name:'总菌体量',color:'#5fd1e0',
    pts:colonyHist.map(function(p){return [p.gen,p.total];})},
   {name:'菌落数×100',color:'#e0a03a',
    pts:colonyHist.map(function(p){return [p.gen,p.count*100];})}],
   {title:'繁殖曲线（每帧一代）'});
}

function parseLocal(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<2)return;
  var head=lines[0].split(',');
  state.dataset={head:head,rows:[]};
  for(var i=1;i<lines.length;i++){
    var c=lines[i].split(',');
    var o={};head.forEach(function(hh,j){o[hh]=c[j];});
    state.dataset.rows.push(o);
  }
}
function renderDataset(r){
  var cols={};r.columns.forEach(function(c){cols[c.name]=c;});
  var rows=el('div');
  rows.appendChild(el('div',{class:'kv'},[el('span',{text:'行数'}),el('b',{text:r.n})]));
  rows.appendChild(el('div',{class:'kv'},[el('span',{text:'列'}),el('b',{text:r.columns.map(function(c){return c.name;}).join('，')})]));
  r.columns.filter(function(c){return c.numeric;}).forEach(function(c){
    var s=r.stats[c.name];
    rows.appendChild(el('div',{class:'kv'},[el('span',{text:c.name+' (min/max/mean)'}),
      el('b',{text:s.min+' / '+s.max+' / '+s.mean})]));
  });
  clear($('#dsMeta')).appendChild(rows);
  /* 生长曲线：找 time 列与数值列 */
  var tCol=r.columns.filter(function(c){return /time|hour|h$|^h\b/i.test(c.name);})[0];
  var yCol=r.columns.filter(function(c){return /od|density|cfu|count/i.test(c.name)&&c.numeric;})[0];
  if(tCol&&yCol){
    var pts=[];
    for(var i=0;i<r.rows.length;i++){
      var t=parseFloat(r.rows[i][tCol.name]),y=parseFloat(r.rows[i][yCol.name]);
      if(isFinite(t)&&isFinite(y))pts.push([t,y]);
    }
    pts.sort(function(a,b){return a[0]-b[0];});
    Chart2D($('#cvDsCurve')).line([{name:yCol.name,color:'#5fd1e0',pts:pts}],
      {title:'数据集生长曲线',xLabel:tCol.name});
  }
  /* 孔板热力图 */
  var wellCol=r.columns.filter(function(c){return /well|孔/i.test(c.name);})[0];
  if(wellCol&&tCol&&yCol){
    var wells={};
    for(i=0;i<r.rows.length;i++){
      var w=r.rows[i][wellCol.name]||'?',t2=parseFloat(r.rows[i][tCol.name]),y2=parseFloat(r.rows[i][yCol.name]);
      if(!isFinite(t2)||!isFinite(y2))continue;
      (wells[w]=wells[w]||[]).push([t2,y2]);
    }
    var names=Object.keys(wells).sort(),times=[];
    names.forEach(function(w2){wells[w2].forEach(function(p){times.push(p[0]);});});
    var tmin=Math.min.apply(null,times),tmax=Math.max.apply(null,times),nt=12;
    Chart2D($('#cvDsHeat')).heat(names.length,nt,function(i,j){
      var tt=tmin+(tmax-tmin)*(j+0.5)/nt;
      var best=0;
      (wells[names[i]]||[]).forEach(function(p){if(Math.abs(p[0]-tt)<(tmax-tmin)/nt)best=Math.max(best,p[1]);});
      return best;
    },{title:'孔板热力图（'+yCol.name+'）',rowLabel:function(i){return names[i];},
      colLabel:function(j){return j%3===0?fmtNum(tmin+(tmax-tmin)*j/nt,0)+'h':'';}});
  }
}

  post('/api/worker/start',{temp_c:+val('inWTemp'),step_s:+$('#wStep').value}).then(function(r){
    if(r.error){alert(r.error);return;}
    setWorkerUI(r);
    if(state.workerTimer)clearInterval(state.workerTimer);
    state.workerTimer=setInterval(pollWorker,500);
  });
}
function stopWorker(){
  post('/api/worker/stop',{}).then(function(r){setWorkerUI(r);});
}
function pollWorker(){
  get('/api/worker').then(function(r){setWorkerUI(r);});
}
function setWorkerUI(r){
  var st=$('#wStatus');
  clear(st);
  st.appendChild(el('span',{class:'statusdot'+(r.running?' run':'')}));
  st.appendChild(el('span',{text:r.running?('运行中 · 第 '+r.generation+' 代'):(r.error?('异常：'+r.error):'已停止')}));
  if(r.history&&r.history.length){
    Chart2D($('#cvWorker')).line([
      {name:'菌数(相对)',color:'#5fd1e0',pts:r.history.map(function(p){return [p.gen,p.colony];})},
      {name:'突变率×1e8',color:'#e0a03a',pts:r.history.map(function(p){return [p.gen,p.mut_rate*1e8];})}],
      {title:'实时预测（服务端线程持续迭代，前端自动刷新）'});
    var m=clear($('#wMeta'));
    m.appendChild(el('div',{class:'kv'},[el('span',{text:'当前代数'}),el('b',{text:r.generation})]));
    m.appendChild(el('div',{class:'kv'},[el('span',{text:'菌数(相对单位)'}),el('b',{text:r.colony})]));
    m.appendChild(el('div',{class:'kv'},[el('span',{text:'自发突变率'}),el('b',{text:r.mutation_rate.toExponential(2)})]));
    m.appendChild(el('div',{class:'kv'},[el('span',{text:'温度'}),el('b',{text:r.temp_c+' ℃'})]));
  }
}

/* 情景预设加载（下拉 → 填充参数滑杆） */
function initEpiPresets(){
  get('/api/epi/presets').then(function(r){
    var sel=$('#epiPreset');
    if(!sel||sel.childNodes.length)return;
    var presets=r.error?{
      flu:{name:'流感样（参考）',R0:1.5,latent_days:2,infectious_days:4,IFR_pct:0.05,hosp_rate_pct:1.2,ventil_rate_pct:0.05},
      covid:{name:'新冠早期株（参考）',R0:2.6,latent_days:5.2,infectious_days:6,IFR_pct:0.6,hosp_rate_pct:5,ventil_rate_pct:0.5},
      measles:{name:'麻疹（参考）',R0:15,latent_days:10,infectious_days:8,IFR_pct:0.1,hosp_rate_pct:2,ventil_rate_pct:0.1}}:r;
    Object.keys(presets).forEach(function(k){
      sel.appendChild(el('option',{value:k,text:presets[k].name}));
    });
    sel.addEventListener('change',function(){
      var p=presets[sel.value];
      if(!p)return;
      $('#epiR0').value=p.R0;
      $('#epiLatent').value=p.latent_days;
      $('#epiInfectious').value=p.infectious_days;
      $('#epiIFR').value=p.IFR_pct;
      $('#epiHosp').value=p.hosp_rate_pct;
      $('#epiVent').value=p.ventil_rate_pct;
      $('#epiPresetDesc').textContent=p.desc||'';
    });
    $('#epiPresetDesc').textContent=presets[sel.value]?presets[sel.value].desc:'';
  });
}

var paneBuilders={dash:paneDash,sim:paneSim,search:paneSearch,data:paneData,worker:paneWorker,
  manual:paneManual,epi:function(){return paneEpi();},about:paneAbout};
function showPane(id){
  state.tab=id;
  var content=clear($('#content'));
  var pane=paneBuilders[id]();
  if(pane.classList)pane.classList.add('on');
  content.appendChild(pane);
  buildNav();
  if(id==='dash'){
    if(!heatSeed.length)seedHeat();
    drawHeat();
    if(!colonies.length)initColonies();
  }
  if(id==='data')refreshFiles();
  if(id==='worker')pollWorker();
  if(id==='epi')initEpiPresets();
}
function tick(){
  if(state.tab==='dash')stepColonies();
  requestAnimationFrame(tick);
}
function boot(){
  state.tab='dash';
  showPane('dash');
  if(typeof location!=='undefined'&&location.protocol==='file:'){
    toast('检测到你是直接双击打开的本页面（file://）。\n这种情况下浏览器禁止调用本地后端，所以按钮都不会有反应。\n正确用法：双击 启动StrainLab.bat，由它自动打开 http://127.0.0.1:8000/ 再操作。','err');

/* 内置自检（?e2e=1）：自动点击关键流程，把结果写进 document.title，供无头浏览器验收 */
if(typeof location!=='undefined'&&location.search.indexOf('e2e=1')>=0){
  window.addEventListener('DOMContentLoaded',function(){
    var results=[];
    var ok=function(n,v){results.push(n+'='+v);};
    var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
    function clickTab(t){
      var nav=[].slice.call(document.querySelectorAll('.nav button'));
      var b=nav.find(function(x){return x.textContent.indexOf(t)>=0;});
      if(b)b.click();
      return sleep(300);
    }
    function clickBtn(t){
      var btns=[].slice.call(document.querySelectorAll('button'));
      var b=btns.find(function(x){return x.textContent.indexOf(t)>=0;});
      if(b)b.click();
      return sleep(300);
    }
    setTimeout(function(){
      clickTab('诱变仿真')
      .then(function(){return clickBtn('运行仿真');}).then(function(){return sleep(2600);})
      .then(function(){ok('sim',String(((document.getElementById('simOut')||{}).textContent||'空').replace(/\s+/g,' ')).slice(0,50));})
      .then(function(){return clickTab('突变路径');})
      .then(function(){return clickBtn('开始遍历');}).then(function(){return sleep(2400);})
      .then(function(){ok('search',String(((document.getElementById('searchTable')||{}).textContent||'空').replace(/\s+/g,' ')).slice(0,50));})
      .then(function(){return clickTab('传染病');})
      .then(function(){return clickBtn('运行模拟');}).then(function(){return sleep(2600);})
      .then(function(){ok('epi',String(((document.getElementById('epiStats')||{}).textContent||'空').replace(/\s+/g,' ')).slice(0,60));})
      .then(function(){return clickTab('后台常驻');})
      .then(function(){return clickBtn('启动常驻仿真');}).then(function(){return sleep(2400);})
      .then(function(){ok('worker',String(((document.getElementById('wStatus')||{}).textContent||'空').replace(/\s+/g,' ')).slice(0,40));})
      .then(function(){document.title='E2E::'+results.join(' | ');})
      .catch(function(e){document.title='E2E::FAIL '+e.message;});
    },800);
  });
}

function epiCtl(id,label,min,max,step,val){
  var out=el('span',{class:'mono'},[String(val)]);
  var inp=el('input',{type:'range',id:'epi'+id.charAt(0).toUpperCase()+id.slice(1),min:min,max:max,step:step,value:val,
    on:{input:function(){out.textContent=inp.value;}}});
  return el('div',{class:'ctl'},[el('label',{text:label},[out]),inp]);
}
function epiParams(){
  function getV(id,def){var e=$('#'+id);return e?e.value:def;}
  var vaxDay=+getV('epiVaxDay',9999);
  var vaxCov=+getV('epiVaxCov',0.7);
  var p={N:+$('#epiN').value,R0:+$('#epiR0').value,latent_days:+$('#epiLatent').value,
    infectious_days:+$('#epiInfectious').value,IFR_pct:+$('#epiIFR').value,
    hosp_rate_pct:+$('#epiHosp').value,ventil_rate_pct:+$('#epiVent').value,
    hosp_capacity:+$('#epiHcap').value,ventil_capacity:+$('#epiVcap').value,
    days:+$('#epiDays').value,
    contact_series:+$('#epiContact').value,
    isolation_series:+$('#epiIsol').value};
  if(vaxDay<=200){
    p.vaccine_series=[[0,vaxDay,0],[vaxDay,vaxDay+60,vaxCov*0.7],[vaxDay+60,9999,vaxCov]];
  }
  return p;
}
function runEpi(){
  toast('已触发：正在运行 SEIR 模拟…');
  post('/api/epi',epiParams()).then(function(r){
    if(r.error){alert('模拟失败：'+r.error);return;}
    state.epi=r;
    var ser=r.series;
    var chart=Chart2D($('#cvEpi'));
    if(!chart.cv)return;
    chart.line([
      {name:'易感 S',color:'#4ea8de',pts:ser.map(function(p){return [p.day,p.S];})},
      {name:'传染 I',color:'#e2564a',pts:ser.map(function(p){return [p.day,p.I];})},
      {name:'移出 R',color:'#4fbf8b',pts:ser.map(function(p){return [p.day,p.R];})},
      {name:'累计死亡 D',color:'#7a6aa8',pts:ser.map(function(p){return [p.day,p.D];})},
      {name:'潜伏 E',color:'#e0a03a',pts:ser.map(function(p){return [p.day,p.E];})}],
      {title:'流行曲线',xLabel:'天'});
    Chart2D($('#cvEpiDaily')).line([
      {name:'新增病例/天',color:'#e2564a',pts:r.daily.map(function(p){return [p.day,p.new_cases];})}],
      {title:'每日新增（-ΔS）',xLabel:'天'});
    Chart2D($('#cvEpiHosp')).line([
      {name:'住院需求',color:'#e0a03a',pts:ser.map(function(p){return [p.day,p.hospitalized];})},
      {name:'床位容量',color:'#4ea8de',dash:[4,3],pts:ser.map(function(p){return [p.day,r.capacity.hosp_cap];})},
      {name:'呼吸机需求',color:'#e2564a',pts:ser.map(function(p){return [p.day,p.ventilator];})},
      {name:'呼吸机容量',color:'#7a6aa8',dash:[4,3],pts:ser.map(function(p){return [p.day,r.capacity.vent_cap];})}],
      {title:'医疗资源占用',xLabel:'天'});
    var box=clear($('#epiStats'));
    [['初始有效再生数 Re(0)',r.R0_eff0],
     ['感染峰值',r.peak.I+' 人 @ 第 '+r.peak.day+' 天'],
     ['住院峰值',r.peak.hosp+' 床 @ 第 '+r.peak.hosp_day+' 天（超容量 '+r.capacity.hosp_exceeded_days+' 天）'],
     ['呼吸机峰值',r.peak.vent+' 台 @ 第 '+r.peak.vent_day+' 天（超容量 '+r.capacity.vent_exceeded_days+' 天）'],
     ['累计死亡',r.final.D+' 人'],
     ['累计感染比例（attack rate）',r.final.attack_rate_pct+' %'],
     ['质量守恒误差',r.quality.mass_error_max.toExponential(2)],
     ['模型',r.model+'，β='+r.params.beta+'，γ='+r.params.gamma+'，σ='+r.params.sigma]
    ].forEach(function(kv){box.appendChild(el('div',{class:'kv'},[el('span',{text:kv[0]}),el('b',{text:String(kv[1])})]));});
    box.appendChild(el('div',{class:'note',text:r.disclaimer}));
  });
}
function runEpiCompare(){
  post('/api/epi/compare',epiParams()).then(function(r){
    if(r.error){alert('对比失败：'+r.error);return;}
    var colors=['#e2564a','#4fbf8b','#4ea8de'];
    var chart=Chart2D($('#cvEpiCmp'));
    if(!chart.cv)return;
    chart.line(r.map(function(s,i){
      return {name:s.name,color:colors[i],pts:s.curve.map(function(p){return [p.day,p.I];})};
    }),{title:'三种策略的现存感染人数对比',xLabel:'天'});
    var box=clear($('#epiCmpNote'));
    box.appendChild(el('div',{class:'note',text:r.map(function(s){
      return s.name+'：感染峰值 '+s.res.peak.I+'（第'+s.res.peak.day+'天），累计死亡 '+s.res.final.D+'，累计感染 '+s.res.final.attack_rate_pct+'%';
    }).join('；')}));
  });
}
</script>
