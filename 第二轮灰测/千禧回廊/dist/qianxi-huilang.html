<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 单文件构建：全部代码内联，可直接双击打开 -->
<title>千禧回廊 · Millennium Corridor</title>
<style>
  /* ===== 千禧年 UI：宋体叙事 + 黑体标签 + 红金配色 ===== */
  :root{
    --cream:#f0e2c4; --gold:#d9b45f; --red:#a8231c; --ink:#241d14;
    --song:"FZShuSong","SimSun","Songti SC","STSong","Noto Serif CJK SC",serif;
    --hei:"SimHei","Microsoft YaHei","Heiti SC","Noto Sans CJK SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:var(--hei);color:var(--cream);cursor:default;-webkit-font-smoothing:antialiased}

  #view{position:fixed;inset:0;width:100%;height:100%;display:block;
        image-rendering:pixelated;image-rendering:crisp-edges;background:#0a0806}

  /* CRT 味道：极细扫描线 + 屏幕反光 + 暗角 */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:5;
       background:
         repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,rgba(0,0,0,0) 1px 3px),
         radial-gradient(ellipse 85% 75% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%),
         radial-gradient(ellipse 40% 22% at 26% 12%,rgba(255,240,210,.05),rgba(0,0,0,0) 70%);
       mix-blend-mode:normal}

  #fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:8;opacity:1}
  #blink{position:fixed;inset:0;background:#f6e2bc;pointer-events:none;z-index:9;opacity:0;
         transition:opacity .5s ease-out}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:6}
  #zone{position:absolute;left:18px;top:14px;font-size:12px;letter-spacing:.28em;
        color:rgba(240,226,196,.52);text-shadow:0 1px 3px #000}
  #mem{position:absolute;left:18px;top:34px;font-size:11px;letter-spacing:.14em;
       color:rgba(217,180,95,.72);text-shadow:0 1px 3px #000}
  #mem.flash{animation:memflash 1.1s ease-out}
  @keyframes memflash{0%{color:#fff6d8;text-shadow:0 0 14px #d9b45f}100%{color:rgba(217,180,95,.72)}}

  #item{position:absolute;left:50%;top:34%;transform:translateX(-50%);
        font-size:15px;letter-spacing:.3em;color:#f6e2bc;opacity:0;
        text-shadow:0 0 16px rgba(217,180,95,.8),0 2px 6px #000;transition:opacity .6s}

  #prompt{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);
          font-size:13px;letter-spacing:.16em;color:rgba(240,226,196,.9);
          padding:5px 14px;border:1px solid rgba(217,180,95,.34);
          background:rgba(20,14,8,.42);backdrop-filter:blur(1px);
          opacity:0;transition:opacity .18s;white-space:nowrap}
  #prompt b{color:var(--gold);font-weight:400;margin-right:8px}

  #sub{position:absolute;left:50%;bottom:8.5%;transform:translateX(-50%);
       max-width:min(86vw,720px);text-align:center;font-family:var(--song);
       font-size:clamp(15px,2.3vw,23px);line-height:1.7;letter-spacing:.06em;
       color:#f4e8d0;text-shadow:0 2px 10px #000,0 0 24px rgba(0,0,0,.7);
       opacity:0;transition:opacity .35s}

  #cross{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
         background:rgba(240,226,196,.3);border-radius:50%}

  /* ---------- 标题 ---------- */
  #title{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;
         align-items:center;justify-content:center;text-align:center;gap:0;
         background:
           radial-gradient(ellipse 70% 55% at 50% 42%,#5a3a22 0%,#241811 55%,#0b0806 100%);
         cursor:pointer}
  #title .frame{border:1px solid rgba(217,180,95,.28);padding:38px 54px 30px;
                background:rgba(12,8,5,.34);position:relative}
  #title .frame::before,#title .frame::after{content:'';position:absolute;width:14px;height:14px;
        border:1px solid var(--gold);opacity:.55}
  #title .frame::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  #title .frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
  #title h1{font-family:var(--song);font-size:clamp(38px,7.5vw,74px);font-weight:400;
            letter-spacing:.3em;text-indent:.3em;color:#f3e3c0;
            text-shadow:0 0 34px rgba(217,180,95,.35),0 4px 0 rgba(0,0,0,.5)}
  #title .en{margin-top:10px;font-size:11px;letter-spacing:.42em;color:rgba(217,180,95,.6)}
  #title .rule{width:70%;height:1px;margin:22px auto 18px;
               background:linear-gradient(to right,transparent,rgba(217,180,95,.5),transparent)}
  #title .tag{font-family:var(--song);font-size:clamp(13px,1.7vw,16px);line-height:2.1;
              color:rgba(240,226,196,.74)}
  #title .keys{margin-top:26px;font-size:11.5px;letter-spacing:.1em;line-height:2;
               color:rgba(240,226,196,.44)}
  #title .keys kbd{font-family:var(--hei);border:1px solid rgba(217,180,95,.4);
       border-radius:2px;padding:1px 6px;margin:0 2px;color:var(--gold);font-size:11px}
  #title .go{margin-top:30px;font-size:13px;letter-spacing:.32em;color:var(--gold);
             animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- 记忆手册 ---------- */
  #log{position:fixed;inset:0;z-index:11;display:none;
       background:rgba(8,6,4,.9);padding:6vh 8vw;overflow:auto}
  #log.open{display:block}
  #log h2{font-family:var(--song);font-weight:400;font-size:22px;letter-spacing:.3em;
          color:var(--gold);margin-bottom:6px}
  #log .hint{font-size:11px;letter-spacing:.14em;color:rgba(240,226,196,.4);margin-bottom:26px}
  #log ul{list-style:none;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  #log li{font-family:var(--song);font-size:14.5px;line-height:1.85;color:rgba(244,232,208,.92);
          border-left:2px solid rgba(217,180,95,.45);padding:8px 0 8px 14px}
  #log li i{display:block;font-family:var(--hei);font-style:normal;font-size:10.5px;
            letter-spacing:.22em;color:rgba(217,180,95,.7);margin-bottom:5px}
  #log .empty{font-family:var(--song);color:rgba(240,226,196,.45)}

  /* ---------- 结局 ---------- */
  #end{position:fixed;inset:0;z-index:13;display:none;flex-direction:column;
       align-items:center;justify-content:center;background:#070604;padding:8vh 6vw}
  #end.open{display:flex}
  #end .line{font-family:var(--song);font-size:clamp(15px,2.2vw,22px);line-height:2.15;
             letter-spacing:.08em;color:#f0e2c4;opacity:0;text-align:center;
             transition:opacity 1.6s ease-in}
  #end .line.on{opacity:1}
  #end .line.big{font-size:clamp(24px,4vw,40px);letter-spacing:.32em;color:#f3e3c0;
                 margin-top:34px}
  #end .again{margin-top:44px;font-size:12px;letter-spacing:.3em;color:rgba(217,180,95,.75);
              opacity:0;transition:opacity 1.2s}
  #end .again.on{opacity:1}

  #corner{position:fixed;right:14px;bottom:12px;z-index:6;font-size:10.5px;
          letter-spacing:.16em;color:rgba(240,226,196,.26);pointer-events:none}
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="crt"></div>
  <div id="hud">
    <div id="zone"></div>
    <div id="mem"></div>
    <div id="cross"></div>
    <div id="item"></div>
    <div id="prompt"></div>
    <div id="sub"></div>
  </div>
  <div id="fade"></div>
  <div id="blink"></div>

  <div id="title">
    <div class="frame">
      <h1>千禧回廊</h1>
      <div class="en">MILLENNIUM &nbsp;CORRIDOR</div>
      <div class="rule"></div>
      <div class="tag">
        米黄的墙，墨绿的墙裙，声控灯亮了三秒。<br>
        黄柜子里有樟脑丸的味道，电视在放雪花。<br>
        整栋楼都听得见，谁也看不见。
      </div>
      <div class="keys">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 走路 &nbsp;·&nbsp;
        <kbd>鼠标</kbd>／<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 转头 &nbsp;·&nbsp;
        <kbd>C</kbd> 视角归正 &nbsp;·&nbsp; <kbd>Shift</kbd> 快走<br>
        <kbd>E</kbd> 看／用 &nbsp;·&nbsp; <kbd>Tab</kbd> 记忆 &nbsp;·&nbsp;
        <kbd>M</kbd> 静音 &nbsp;·&nbsp; <kbd>Esc</kbd> 松开鼠标
      </div>
      <div class="go">按 回车 或 点击画面 进入</div>
    </div>
  </div>

  <div id="log">
    <h2>记 忆</h2>
    <div class="hint">按 TAB 关闭</div>
    <ul id="logList"></ul>
  </div>

  <div id="end"></div>
  <div id="corner">建议戴耳机 · 全程无素材，画面与声音均为实时程序生成</div>

  <script>
(function () {
'use strict';
var __defs = {}, __cache = {};
function __def(id, fn) { __defs[id] = fn; }
function __req(id) {
  if (__cache[id]) return __cache[id];
  var fn = __defs[id];
  if (!fn) throw new Error('模块未打包: ' + id);
  var x = __cache[id] = {};
  fn(x, __req);
  return x;
}

// ═══════════════════════════════════════ ./game/audio.js
__def("./game/audio.js", function (__x, __req) {
// ============================================================================
//  audio.js —— 全程序化合成音景（零音频素材，全靠 WebAudio 现算）
//  梦核的一半是声音：听得见的东西，一个都看不见
//    · 环境床：蝉鸣 / 日光灯嗡 / 楼下车流 / 天台的风 / 大堂的走音广播
//    · 定位音源：厨房的炒菜声、卧室的麻将声、客厅的聊天声（走近变大，进门就停）
//    · 一次性：脚步（分地面材质）、声控灯"咔"、铁门吱呀、电话铃、电梯"叮"
// ============================================================================

let ctx = null;
let master = null;
let wetBus = null;      // 混响
let dryBus = null;
let convolver = null;
let started = false;
let muted = false;

const emitters = new Map();   // id → {x,y,radius,gain,pan,stop}
const beds = new Map();       // id → {gain, stop}

function isReady() { return started; }
function isMuted() { return muted; }

// ---------------------------------------------------------------------------
//  基础设施
// ---------------------------------------------------------------------------
function init() {
  if (started) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.value = 0.85;
  master.connect(ctx.destination);

  dryBus = ctx.createGain();
  dryBus.gain.value = 1;
  dryBus.connect(master);

  convolver = ctx.createConvolver();
  convolver.buffer = makeImpulse(2.6, 2.4);
  wetBus = ctx.createGain();
  wetBus.gain.value = 0.34;
  wetBus.connect(convolver);
  convolver.connect(master);

  started = true;
  return true;
}

function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
function toggleMute() {
  muted = !muted;
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.85, ctx.currentTime, 0.08);
  return muted;
}

/** 程序化混响冲激：噪声 × 指数衰减，带一点早期反射 */
function makeImpulse(seconds, decay) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * seconds);
  const buf = ctx.createBuffer(2, len, rate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
    }
    // 几个早期反射（楼道 / 大堂的"空"感）
    for (const [ms, amp] of [[17, 0.5], [31, 0.38], [53, 0.28], [79, 0.2], [113, 0.14]]) {
      const i = Math.floor((ms / 1000) * rate) + c * 37;
      if (i < len) d[i] += amp * (c ? -1 : 1);
    }
  }
  return buf;
}

/** 一段可循环的白噪声 buffer */
let noiseBuf = null;
function noise() {
  if (!noiseBuf) {
    const len = ctx.sampleRate * 3;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  return src;
}

function env(node, t0, a, peak, d, s = 0) {
  const g = node.gain;
  g.cancelScheduledValues(t0);
  g.setValueAtTime(0.0001, t0);
  g.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + a);
  if (s > 0) {
    g.setValueAtTime(Math.max(0.0001, peak), t0 + a + s);
    g.exponentialRampToValueAtTime(0.0001, t0 + a + s + d);
  } else {
    g.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
}

function chain(...nodes) {
  for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]);
  return nodes[nodes.length - 1];
}

function toBus(node, wet = 0.4) {
  const d = ctx.createGain(); d.gain.value = 1 - wet * 0.55;
  const w = ctx.createGain(); w.gain.value = wet;
  node.connect(d); d.connect(dryBus);
  node.connect(w); w.connect(wetBus);
}

// ---------------------------------------------------------------------------
//  一次性音效
// ---------------------------------------------------------------------------

/** 脚步：按地面材质换质感 */
function footstep(surface = 'stone', vol = 1) {
  if (!started) return;
  const t = ctx.currentTime;
  const cfg = {
    stone: { f: 1900, q: 1.1, d: 0.09, thump: 118, tv: 0.30 },   // 水磨石 / 大理石
    wood: { f: 800, q: 1.4, d: 0.12, thump: 82, tv: 0.46 },      // 木地板
    tile: { f: 2600, q: 1.5, d: 0.07, thump: 132, tv: 0.24 },    // 瓷砖
    carpet: { f: 480, q: 0.8, d: 0.14, thump: 70, tv: 0.20 },    // 地毯
    concrete: { f: 1400, q: 0.9, d: 0.11, thump: 96, tv: 0.34 }, // 天台水泥
  }[surface] || { f: 1600, q: 1, d: 0.1, thump: 100, tv: 0.3 };

  const n = noise();
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = cfg.f * (0.86 + Math.random() * 0.28); bp.Q.value = cfg.q;
  const g = ctx.createGain();
  chain(n, bp, g);
  toBus(g, 0.3);
  env(g, t, 0.004, 0.16 * vol, cfg.d);
  n.start(t); n.stop(t + cfg.d + 0.05);

  const o = ctx.createOscillator();
  o.type = 'sine'; o.frequency.value = cfg.thump * (0.92 + Math.random() * 0.16);
  const og = ctx.createGain();
  chain(o, og); toBus(og, 0.22);
  env(og, t, 0.006, cfg.tv * vol, 0.1);
  o.start(t); o.stop(t + 0.2);
}

/** 声控灯"咔"一声 */
function lampClick() {
  if (!started) return;
  const t = ctx.currentTime;
  const n = noise();
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2400;
  const g = ctx.createGain();
  chain(n, hp, g); toBus(g, 0.55);
  env(g, t, 0.002, 0.3, 0.045);
  n.start(t); n.stop(t + 0.09);
  // 灯丝的一声轻响
  const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1180;
  const og = ctx.createGain(); chain(o, og); toBus(og, 0.5);
  env(og, t + 0.01, 0.003, 0.035, 0.06);
  o.start(t); o.stop(t + 0.12);
}

/** 铁门：锁舌 + 吱呀 */
function doorOpen() {
  if (!started) return;
  const t = ctx.currentTime;
  for (const [dt, f] of [[0, 3200], [0.07, 2400]]) {
    const n = noise();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 3;
    const g = ctx.createGain(); chain(n, bp, g); toBus(g, 0.5);
    env(g, t + dt, 0.003, 0.2, 0.06);
    n.start(t + dt); n.stop(t + dt + 0.12);
  }
  // 吱呀：滑动的窄带噪声
  const n2 = noise();
  const bp2 = ctx.createBiquadFilter(); bp2.type = 'bandpass'; bp2.Q.value = 12;
  bp2.frequency.setValueAtTime(620, t + 0.13);
  bp2.frequency.exponentialRampToValueAtTime(1450, t + 0.95);
  const g2 = ctx.createGain(); chain(n2, bp2, g2); toBus(g2, 0.6);
  env(g2, t + 0.13, 0.12, 0.11, 0.5, 0.25);
  n2.start(t + 0.13); n2.stop(t + 1.3);
}

/** 电梯"叮" */
function ding() {
  if (!started) return;
  const t = ctx.currentTime;
  [1568, 1046].forEach((f, i) => {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain(); chain(o, g); toBus(g, 0.65);
    env(g, t + i * 0.42, 0.006, 0.16, 1.1);
    o.start(t + i * 0.42); o.stop(t + i * 0.42 + 1.4);
  });
}

/** 老式电话铃（两声一组） */
function phoneRing(times = 2) {
  if (!started) return;
  const t0 = ctx.currentTime;
  for (let k = 0; k < times; k++) {
    const t = t0 + k * 1.5;
    for (let b = 0; b < 2; b++) {
      const tb = t + b * 0.42;
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = b ? 880 : 1046;
      const trem = ctx.createOscillator(); trem.type = 'sine'; trem.frequency.value = 22;
      const tg = ctx.createGain(); tg.gain.value = 0.5;
      const g = ctx.createGain(); g.gain.value = 0;
      trem.connect(tg); tg.connect(g.gain);
      chain(o, g); toBus(g, 0.5);
      g.gain.setValueAtTime(0.0001, tb);
      g.gain.linearRampToValueAtTime(0.09, tb + 0.02);
      g.gain.setValueAtTime(0.09, tb + 0.3);
      g.gain.linearRampToValueAtTime(0, tb + 0.36);
      o.start(tb); o.stop(tb + 0.4);
      trem.start(tb); trem.stop(tb + 0.4);
    }
  }
}

/** 自行车铃 */
function bikeBell() {
  if (!started) return;
  const t = ctx.currentTime;
  for (let i = 0; i < 5; i++) {
    const tb = t + i * 0.11;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.value = 2700 + (i % 2) * 340;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 4100;
    const g = ctx.createGain(); chain(o, g); o2.connect(g); toBus(g, 0.7);
    env(g, tb, 0.003, 0.05, 0.28);
    o.start(tb); o.stop(tb + 0.35); o2.start(tb); o2.stop(tb + 0.35);
  }
}

/** 麻将：一串塑料牌的碰撞 */
function mahjongClack(n = 6, vol = 1) {
  if (!started) return;
  const t0 = ctx.currentTime;
  for (let i = 0; i < n; i++) {
    const t = t0 + Math.random() * 1.1;
    const nz = noise();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1500 + Math.random() * 2600; bp.Q.value = 5 + Math.random() * 8;
    const g = ctx.createGain(); chain(nz, bp, g); toBus(g, 0.5);
    env(g, t, 0.002, 0.075 * vol, 0.055);
    nz.start(t); nz.stop(t + 0.1);
  }
}

/** 乒乓球（楼上永远在打） */
function pingPong() {
  if (!started) return;
  const t0 = ctx.currentTime;
  for (let i = 0; i < 4 + Math.floor(Math.random() * 5); i++) {
    const t = t0 + i * (0.26 + Math.random() * 0.1);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(1500 + Math.random() * 500, t);
    o.frequency.exponentialRampToValueAtTime(700, t + 0.05);
    const g = ctx.createGain(); chain(o, g); toBus(g, 0.75);
    env(g, t, 0.002, 0.035, 0.07);
    o.start(t); o.stop(t + 0.12);
  }
}

/** 一句听不清的话（含笑声变体）—— 梦核主音色 */
function babble({ pitch = 1, dur = 1.6, vol = 0.09, laugh = false, wet = 0.6, muffle = 900 } = {}) {
  if (!started) return null;
  const t = ctx.currentTime;
  const n = noise();
  // 两个共振峰，模拟"人在说话但听不清内容"
  const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass';
  f1.frequency.value = 480 * pitch; f1.Q.value = 5.5;

/** 靠地面的踢脚阴影 */
function floorContact(p, h = 6, strength = 0.42) {
  for (let i = 0; i < h; i++) {
    const a = (1 - i / h) * strength;
    p.rect(0, p.h - 1 - i, p.w, 1, '#000', a);
  }
  return p;
}

/** 岁月：随机划痕、磕碰、灰污 */
function aging(p, seed, level = 1) {
  const rng = makeRng(seed);
  for (let i = 0; i < 5 * level; i++) {
    const x = rng() * TS, y = rng() * TS;
    p.stain(x, y, 4 + rng() * 11, '#4a3a22', seed + i, 0.13 + rng() * 0.16);
  }
  for (let i = 0; i < 7 * level; i++) {
    const x = Math.floor(rng() * TS), y = Math.floor(rng() * TS);
    const len = 2 + Math.floor(rng() * 9);
    const vert = rng() > 0.5;
    p.line(x, y, vert ? x : x + len, vert ? y + len : y, rng() > 0.5 ? '#efe6d2' : '#3a2e1c', 0.16 + rng() * 0.2);
  }
  p.grain(4.5 * level, seed + 99);
  return p;
}

/** 小广告贴纸（开锁 / 通下水道 / 收旧家电），楼道之魂 */
function smallAd(p, x, y, w, h, kind, seed) {
  const rng = makeRng(seed);
  const paper = ['#e8e2cd', '#dfd2b4', '#e5cfc0'][Math.floor(rng() * 3)];
  p.rect(x, y, w, h, paper, 0.92);
  p.frame(x, y, w, h, scaleColor(paper, 0.72), 1, 0.6);
  const ink = ['#b0231c', '#20304a', '#2a2a24'][Math.floor(rng() * 3)];
  const txt = kind || ['开锁', '通下水道', '收旧家电', '疏通管道'][Math.floor(rng() * 4)];
  p.text(x + 1, y + 1, txt, ink, { size: Math.min(h - 4, 8), bold: true, seed });
  // 电话号码
  p.tiny(x + 1, y + h - 6, ['1390138', '8265432', '6712345'][Math.floor(rng() * 3)], ink, 1, 0.85);
  // 撕角
  p.rect(x + w - 3, y, 3, 3, [0, 0, 0, 0]);
  return p;
}

function stairWallBase(p, seed, dado = P.dadoGreen) {
  // 上：米黄涂料
  paintTexture(p, 0, 0, TS, 41, P.wallCream, seed);
  // 上部再压一层竖向渐变（越高越亮，像楼道窗光从上打下来）
  for (let y = 0; y < 41; y++) p.shade(0, y, TS, 1, 1 + (0.5 - y / 41) * 0.16);
  // 墙裙上沿白线
  p.rect(0, 39, TS, 1, P.dadoLine, 0.9);
  p.rect(0, 40, TS, 2, scaleColor(P.dadoLine, 0.8), 0.5);
  // 下：墨绿墙裙（油漆，带反光）
  paintTexture(p, 0, 42, TS, TS - 42, dado, seed + 7, 0.04);
  for (let y = 42; y < TS; y++) {
    const t = (y - 42) / (TS - 42);
    p.shade(0, y, TS, 1, 1 + (0.35 - t) * 0.22);
  }
  // 油漆刷痕
  const rng = makeRng(seed + 3);
  for (let i = 0; i < 14; i++) {
    const x = Math.floor(rng() * TS);
    p.vline(x, 42, TS - 42, rng() > 0.5 ? '#ffffff' : '#000000', 0.05 + rng() * 0.05);
  }
  return p;
}

});

function glassPane(p, x, y, w, h, base, lit, seed, emissive = 0.7) {
  // 单块幕墙玻璃：天空反射渐变 + 斜向高光 + 边缘暗角
  p.vgrad(x, y, w, h, lit, base);
  const rng = makeRng(seed);
  // 反射的天空带
  p.rect(x, y + Math.floor(h * 0.45), w, Math.max(1, Math.floor(h * 0.14)), P.skyHaze, 0.3);
  // 斜高光
  for (let i = 0; i < h; i++) {
    const xx = x + Math.floor((i / h) * w * 0.9);
    p.line(xx, y + h - i, xx + Math.floor(w * 0.25), y + h - i, '#ffffff', 0.07);
  }
  // 室内隐约的东西
  if (rng() > 0.55) p.rect(x + 2, y + h - 5, w - 4, 3, '#2a2a22', 0.3);
  p.frame(x, y, w, h, scaleColor(base, 0.62), 1, 0.85);
  p.glow(x, y, w, h, emissive);
  return p;
}

def('glass_curtain', (p) => {
  // 蓝绿色玻璃幕墙 —— 千禧年地标的招牌
  p.fill(P.mullion);
  p.vgrad(0, 0, TS, TS, scaleColor(P.mullion, 1.1), scaleColor(P.mullion, 0.8));
  const cols = 3, rows = 4;
  const pw = Math.floor(TS / cols), ph = Math.floor(TS / rows);
  const tints = [P.glassTeal, P.glassTeal, P.glassGreen, P.glassTeal, P.glassBlue, P.glassTeal];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const t = tints[(r * cols + c) % tints.length];
      glassPane(p, c * pw + 2, r * ph + 2, pw - 4, ph - 4, t,
        mix(t, P.glassTealLit, 0.55), 601 + r * 31 + c * 7, 0.72);
    }
  }
  // 铝框高光
  for (let c = 1; c < cols; c++) p.vline(c * pw, 0, TS, '#e2e8ea', 0.3);
  for (let r = 1; r < rows; r++) p.hline(0, r * ph, TS, '#e2e8ea', 0.22);
  p.grain(2.5, 611);
  return p;
});

def('glass_curtain_lit', (p) => {

  const cols = 3, rows = 4;
  const pw = Math.floor(TS / cols), ph = Math.floor(TS / rows);
  const rng = makeRng(621);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const on = rng() > 0.62;
      const t = on ? '#c99a4a' : P.glassGreen;
      glassPane(p, c * pw + 2, r * ph + 2, pw - 4, ph - 4, t,
        on ? '#ffe0a0' : mix(t, P.glassTealLit, 0.4), 631 + r * 13 + c * 5, on ? 1 : 0.5);
    }
  }
  p.grain(2.5, 641);
  return p;
});

def('dougong', (p) => {
  // 中华复兴式母题：朱红梁枋 + 层叠斗拱 + 青灰檐口
  p.vgrad(0, 0, TS, TS, '#5a463a', '#43332a');
  // 檐口瓦（顶部）
  p.vgrad(0, 0, TS, 12, scaleColor(P.roofTile, 1.2), P.roofTile);

  p.rect(0, 11, TS, 2, '#20282c');
  // 檐下垫板
  p.rect(0, 13, TS, 4, P.roofTileWarm);
  p.rect(0, 13, TS, 1, '#8f6a52', 0.7);
  // 斗拱：三层交错方块
  const layers = [
    { y: 18, w: 10, gap: 16, c: P.dougongRed },
    { y: 26, w: 14, gap: 16, c: scaleColor(P.dougongRed, 1.12) },
    { y: 34, w: 18, gap: 16, c: scaleColor(P.dougongRed, 0.9) },
  ];
  for (const L of layers) {
    for (let x = 0; x < TS + 16; x += L.gap) {
      const bx = x - Math.floor(L.w / 2) + 8;
      p.rect(bx, L.y, L.w, 7, L.c);
      p.rect(bx, L.y, L.w, 1, P.dougongGold, 0.55);
      p.rect(bx, L.y + 6, L.w, 1, '#4a1c14', 0.8);
      p.rect(bx, L.y, 1, 7, '#4a1c14', 0.5);
      p.rect(bx + L.w - 1, L.y, 1, 7, '#4a1c14', 0.5);
    }
    // 层间阴影
    p.rect(0, L.y + 7, TS, 1, '#000', 0.4);

  // 额枋（大红梁）+ 金线
  p.vgrad(0, 42, TS, 12, scaleColor(P.dougongRed, 1.1), scaleColor(P.dougongRed, 0.75));
  p.hline(0, 43, TS, P.dougongGold, 0.75);
  p.hline(0, 52, TS, P.dougongGold, 0.5);
  // 旋子彩画的抽象：金色圆环
  for (let x = 6; x < TS; x += 16) {
    p.ring(x, 48, 4, 3.4, P.dougongGold, 0.6);
    p.disc(x, 48, 1.4, 1.2, P.dougongGold, 0.45);

  for (let x = 0; x < TS; x += 32) p.rect(x + 12, 54, 8, 10, '#93382a');

});

};

const ENDING = [

  '',
  '楼下有一万个声音。',
  '电视、炒菜、麻将、自行车铃、',
  '还有人在喊一个孩子回家吃饭。',

  '',
  '但整个小区，',

// ---------------------------------------------------------------------------
//  各场景的逻辑
// ---------------------------------------------------------------------------

const H = {};

// ========================== 楼道 ==========================
H.stair = {
  enter(g) {
    g.set('climb', 0);
    A.addEmitter('sta_news', { x: 6.5, y: 5.6, radius: 7, kind: 'static', vol: 0.5 });
    g.say(...(g.flag('seen_opening') ? [] : OPENING));
    g.raise('seen_opening');
    // 声控灯：一开始全灭
    for (const l of g.world.lights) if (l.id?.startsWith('l_') && !l.id.startsWith('l_win')) l.on = false;
    g.set('lampTimer', 0);
  },

  tick(g, dt) {
    // —— 声控灯：只要有脚步声就亮，安静 6 秒后灭 ——
    const t = g.get('lampTimer', 0);
    if (t > 0) {
      g.set('lampTimer', t - dt);
      if (t - dt <= 0) {
        for (const l of g.world.lights) if (l.id?.startsWith('l_') && !l.id.startsWith('l_win')) l.on = false;
        A.lampClick();
        g.say('灯灭了。');
      }
    }
    // —— 楼上永远在打乒乓球 / 麻将 / 放新闻 ——
    g.every('amb_stair', 7 + Math.random() * 9, () => {
      const r = Math.random();
      if (r < 0.3) A.pingPong();
      else if (r < 0.58) A.mahjongClack(5, 0.5);
      else if (r < 0.8) A.newscast();
      else A.childCall();
    });
    // —— 走廊尽头的背影：只在你看向那边时出现，走近就没了 ——
    const gh = g.sprite('ghost1');
    if (gh && g.zoneIs('stair')) {
      const inCorridor = g.cam.y > 6.5 && g.cam.y < 10 && g.cam.x > 4;
      const dist = Math.hypot(g.cam.x - gh.x, g.cam.y - gh.y);
      if (inCorridor && dist > 5.5 && !g.flag('ghost1_gone')) {
        if (gh.hidden) { gh.hidden = false; A.babble({ pitch: 1.1, dur: 1.2, vol: 0.05, muffle: 700 }); }
      } else if (dist < 4.2 && !gh.hidden) {
        gh.hidden = true;
        g.raise('ghost1_gone');
        g.say('刚才那里站着一个人。', '你走过去，只有一扇窗。');
        A.lampClick();
      }
    }
  },

  step(g) {
    // 每一步都可能唤醒声控灯
    if (g.get('lampTimer', 0) <= 0) {
      A.lampClick();
      for (const l of g.world.lights) if (l.id?.startsWith('l_') && !l.id.startsWith('l_win')) l.on = true;
      if (!g.flag('lamp_once')) { g.raise('lamp_once'); g.say('灯亮了。', '楼道是米黄色的墙，墨绿色的墙裙。'); }
    }
    g.set('lampTimer', 6);
  },

  teleport(g, tp) {
    const n = g.get('climb', 0) + 1;
    g.set('climb', n);
    const floorNames = ['五层', '六层', '七层', '七层', '七层'];
    if (n < 3) {
      g.say(`${floorNames[n - 1] || '七层'}。`, '这一层和刚才那一层，一模一样。');
    } else if (n === 3) {
      // 第三层：楼道的口子"长"出来
      setCell(g.world, 18, 8, '.');
      g.say('七层。', '楼梯不见了。', '左边的墙上多了一个口子，', '那边的灯是亮的。');
      A.doorOpen();
    } else {
      g.say('还是七层。');
    }
  },

  interact(g, id) {
    switch (id) {
      case 'door302':
        if (g.has('key')) {
          g.say(...LINES.door302_open);
          A.doorOpen();
          g.goto('home', 1.6);
        } else {
          g.say(...LINES.door302_locked);
          if (!g.flag('hint_key')) { g.raise('hint_key'); g.say('钥匙一向压在门口的花盆下面。'); }
        }
        return true;
      case 'pot':
        if (!g.has('key')) {
          g.take('key');
          g.sprite('key') && (g.sprite('key').hidden = false);
          g.say(...LINES.pot_key);
          A.lampClick();
          setTimeout(() => { const s = g.sprite('key'); if (s) s.hidden = true; }, 2600);
        } else g.say(...LINES.pot_empty);
        return true;
      case 'door301': g.say(...LINES.door301); A.newscast(); return true;
      case 'door303': g.say(...LINES.door303); return true;
      case 'win_landing': g.say(...LINES.win_landing); A.bikeBell(); return true;
      default: return false;
    }
  },
};

// ========================== 家 ==========================
H.home = {
  enter(g) {
    A.addEmitter('h_fridge', { x: 19.6, y: 10.8, radius: 6.5, kind: 'fridge', vol: 0.9 });
    A.addEmitter('h_fan', { x: 12.2, y: 8.4, radius: 5, kind: 'fan', vol: 0.7 });
    g.say(...ZONE_INTRO.home);
    g.set('tvOn', false);
  },

  tick(g, dt) {
    // —— 客厅：两个人在聊天，沙发上没有人 ——
    g.every('chat', 6 + Math.random() * 7, () => {
      if (g.cam.x > 4 && g.cam.x < 13.5 && g.cam.y > 6.5 && g.cam.y < 14) {
        A.babble({ pitch: 0.95 + Math.random() * 0.25, dur: 1.4 + Math.random(), vol: 0.062, muffle: 1100 });
        if (Math.random() > 0.6) setTimeout(() => A.babble({ pitch: 1.35, dur: 0.7, vol: 0.05, laugh: true }), 1500);
        if (!g.flag('heard_chat')) {
          g.raise('heard_chat');
          g.say('有人在说话。', '就在沙发那边。', '沙发上没有人。');
        }
      }
    });
    // —— 厨房：炒菜声。走进去就停 ——
    const inKitchen = g.cam.x > 15.5 && g.cam.y > 9.5;
    if (!inKitchen) {
      g.every('wok', 4 + Math.random() * 4, () => {
        const d = Math.hypot(g.cam.x - 18, g.cam.y - 11.5);
        if (d < 13) A.wokBurst(Math.max(0.25, 1 - d / 14));
      });
    }
    // —— 卧室：麻将声 ——
    g.every('mj', 8 + Math.random() * 6, () => {
      const d = Math.hypot(g.cam.x - 18.6, g.cam.y - 6.2);
      if (d < 12) {
        A.mahjongClack(6, Math.max(0.3, 1 - d / 13));
        if (Math.random() > 0.5) A.babble({ pitch: 0.9, dur: 1.1, vol: 0.045, muffle: 800 });
      }
    });
    // —— 电视：你关了它，回头它又亮了 ——
    if (g.get('tvOn') && !A.hasEmitter('h_tvs')) {
      A.addEmitter('h_tvs', { x: 7.0, y: 7.55, radius: 8, kind: 'static', vol: 1 });
    }
    const tv = g.sprite('tv');
    const tvLight = g.light('h_tv');
    if (tv) tv.emit = g.get('tvOn') ? 0.55 : 0;
    if (tvLight) tvLight.i = g.get('tvOn') ? 0.75 : 0;
    if (g.get('tvOn') === false && g.flag('tv_was_on')) {
      g.after('tv_reopen', 9, () => {
        if (!g.get('tvOn')) {
          g.set('tvOn', true);
          A.lampClick();
          g.say('电视又亮了。');
        }
      });
    }
    // —— 走廊里的背影 ——
    const gh = g.sprite('ghost2');
    if (gh) {
      const inLiving = g.cam.x < 13 && g.cam.y > 7;
      const d = Math.hypot(g.cam.x - gh.x, g.cam.y - gh.y);
      if (inLiving && d > 5 && d < 11 && !g.flag('ghost2_gone') && Math.random() > 0.994) gh.hidden = false;
      if (!gh.hidden && d < 3.6) {
        gh.hidden = true; g.raise('ghost2_gone');
        g.say('走廊里有人背对着你。', '你叫了一声。', '走廊尽头是一面墙。');
      }
    }
    // —— 时间在这里不走 ——
    g.every('tick_home', 26, () => {
      if (Math.random() > 0.5) g.say('钟摆的声音停了一下，又接上了。');
    });
  },

  interact(g, id) {
    switch (id) {
      case 'tv':
        if (g.get('tvOn')) {
          g.set('tvOn', false);
          A.removeEmitter('h_tvs');
          g.say(...LINES.tv_off);
        } else {
          g.set('tvOn', true);
          g.raise('tv_was_on');
          A.lampClick();
          g.say(...LINES.tv_on);
          A.newscast();
        }
        return true;
      case 'phone':
        A.phoneRing(2);
        g.say(...LINES.phone);
        g.memory('phone');
        return true;
      case 'stove':
        A.wokBurst(1);
        g.say(...LINES.stove);
        g.memory('stove');
        return true;
      case 'mahjong':
        A.mahjongClack(8, 1);
        A.babble({ pitch: 1.3, dur: 0.8, vol: 0.055, laugh: true });
        g.say(...LINES.mahjong);
        g.memory('mahjong');
        return true;
      case 'homedoor': {
        const n = g.memoryCount();
        if (n >= MEMORY_NEEDED) {
          A.doorOpen();
          g.say(...LINES.homedoor_open);
          g.goto('lobby', 2.2);
        } else {
          g.say(LINES.homedoor_locked[0], LINES.homedoor_locked[1].replace('{n}', MEMORY_NEEDED - n));
        }
        return true;
      }
      default: return false;
    }
  },
};

// ========================== 大堂 ==========================
H.lobby = {
  enter(g) {
    g.say(...ZONE_INTRO.lobby);
    g.set('eleTimer', 0);
    A.addEmitter('lb_cooler', { x: 23.5, y: 17.5, radius: 5, kind: 'fridge', vol: 0.5 });
  },

  tick(g, dt) {
    // —— 广播：走音的欢庆曲，一遍一遍 ——
    g.every('bc', 34, () => { A.broadcastTune(); if (!g.flag('heard_bc')) { g.raise('heard_bc'); g.say('广播在放一首歌。', '调子是欢快的，音是错的。'); } });
    // —— 没有人的电梯，一直开一直关 ——
    g.every('ele', 11 + Math.random() * 7, () => {
      A.ding();
      if (!g.flag('saw_ele')) { g.raise('saw_ele'); g.say('电梯开了。', '没有人出来。', '门又关上了。'); }
    });
    // —— 大厅深处的脚步声，不是你的 ——
    g.every('steps', 13 + Math.random() * 9, () => {
      const s = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < s; i++) setTimeout(() => A.footstep('stone', 0.35), i * 480);
      if (!g.flag('heard_steps')) { g.raise('heard_steps'); g.say('有脚步声，在大理石上。', '不是你的——你站着没动。'); }
    });
    // —— 远处的背影，一个在地毯尽头，一个在灭了灯的角落 ——
    for (const [gid, fl] of [['ghost3', 'g3'], ['ghost4', 'g4']]) {
      const gh = g.sprite(gid);
      if (!gh) continue;
      const d = Math.hypot(g.cam.x - gh.x, g.cam.y - gh.y);
      if (gh.hidden && d > 9 && d < 17 && !g.flag(fl) && Math.random() > 0.993) gh.hidden = false;
      if (!gh.hidden && d < 6.5) {
        gh.hidden = true; g.raise(fl);
        g.say('那边站着一个人。', '你走过去，那里只有柱子。');
      }
    }
  },

  interact(g, id) {
    if (id === 'elevator') {
      A.ding();
      g.say(...LINES.elevator);
      g.goto('tower', 2.4);
      return true;
    }
    return false;
  },
};

// ========================== 尖塔 ==========================
H.tower = {
  enter(g) {
    g.say(...ZONE_INTRO.tower);
    g.set('floor', 0);
    g.set('cp', 'A');
  },

  tick(g, dt) {
    // —— 走完一整圈 = 上一层。三层之后，核心开了 ——
    const nearNW = Math.hypot(g.cam.x - 2.5, g.cam.y - 2.5) < 1.6;
    const nearSE = Math.hypot(g.cam.x - 13.5, g.cam.y - 13.5) < 1.6;
    if (nearNW && g.get('cp') === 'A') {
      g.set('cp', 'B');
      const f = g.get('floor', 0) + 1;
      g.set('floor', f);
      if (f === 1) g.say('你绕了一圈。', '窗外的楼矮了一点。');
      else if (f === 2) g.say('又一圈。', '窗外只剩天线了。');
      else if (f === 3) {
        setCell(g.world, 7, 5, '^'); setCell(g.world, 8, 5, '^');
        for (let y = 6; y <= 9; y++) for (let x = 6; x <= 9; x++) setCell(g.world, x, y, '^');
        const l = g.light('tw_core'); if (l) l.i = 0.85;
        const tv = g.sprite('lasttv'); if (tv) tv.emit = 0.6;
        A.addEmitter('tw_static', { x: 7.5, y: 8.2, radius: 11, kind: 'static', vol: 1 });
        A.doorOpen();
        g.say('第三圈。', '塔的中间开了。');
      } else g.say('还是这一层。');
    }
    if (nearSE && g.get('cp') === 'B') g.set('cp', 'A');

    g.every('tw_amb', 9 + Math.random() * 8, () => {
      Math.random() > 0.5 ? A.babble({ pitch: 0.85, dur: 2.2, vol: 0.04, muffle: 520 }) : A.pingPong();
    });

    const gh = g.sprite('ghost5');
    if (gh) {
      const d = Math.hypot(g.cam.x - gh.x, g.cam.y - gh.y);
      if (gh.hidden && d > 6 && d < 12 && !g.flag('g5') && Math.random() > 0.995) gh.hidden = false;
      if (!gh.hidden && d < 4) { gh.hidden = true; g.raise('g5'); g.say('前面有人在上楼。', '你追过去，楼梯是空的。'); }
    }
  },

  interact(g, id) {
    if (id === 'core') {
      g.say(...(g.get('floor', 0) >= 3 ? LINES.core_open : LINES.core_closed));
      return true;
    }
    if (id === 'lasttv') {
      g.say(...LINES.lasttv);
      g.memory('lasttv');
      g.goto('roof', 3.0);
      return true;
    }
    return false;
  },
};

// ========================== 天台 ==========================
H.roof = {
  enter(g) {
    g.say(...ZONE_INTRO.roof);
  },

  tick(g, dt) {
    // —— 楼下一整个小区的声音，全都听得见 ——
    g.every('roof_amb', 3 + Math.random() * 4, () => {
      const r = Math.random();
      if (r < 0.22) A.newscast();
      else if (r < 0.42) A.mahjongClack(5, 0.4);
      else if (r < 0.58) A.wokBurst(0.5);
      else if (r < 0.72) A.bikeBell();
      else if (r < 0.86) A.childCall();
      else A.babble({ pitch: 0.9 + Math.random() * 0.5, dur: 1.6, vol: 0.045, muffle: 700 });
    });

    const gh = g.sprite('ghost6');
    if (gh) {
