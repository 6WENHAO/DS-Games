<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>箱庭小镇 · Diorama Town</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="scene"></canvas>

<!-- ---------------- loading ---------------- -->
<div id="loading">
  <div class="load-inner">
    <div class="load-title">箱庭小镇</div>
    <div class="load-sub">Diorama Town</div>
    <div class="load-track"><div id="loadbar"></div></div>
    <div id="loadtext">准备中…</div>
  </div>
</div>

<!-- ---------------- title ---------------- -->
<div id="titlecard">
  <h1>箱庭小镇</h1>
  <p>海港 · 阶梯小镇 · 昼夜流转</p>
  <div id="fps">—</div>
</div>

<button id="btn-collapse" title="收起/展开面板 (H)">›</button>

<!-- ---------------- control panel ---------------- -->
<div id="panel">

  <section>
    <h2>时间</h2>
    <div id="timelabel">08:24　清晨</div>
    <input id="time" type="range" min="0" max="24" step="0.01" value="8.4">
    <div class="row wrap">
      <button data-hour="5.6">黎明</button>
      <button data-hour="8.5">清晨</button>
      <button data-hour="12.5">正午</button>
      <button data-hour="17.8">黄金</button>
      <button data-hour="18.9">日落</button>
      <button data-hour="20.4">暮色</button>
      <button data-hour="22.5">夜晚</button>
      <button data-hour="1.5">深夜</button>
    </div>
    <div class="row">
      <button id="btn-auto" class="wide">自动昼夜</button>
    </div>
    <label class="slab">流速 <span id="speedlabel">0.55×</span></label>
    <input id="speed" type="range" min="0.05" max="3" step="0.05" value="0.55">
  </section>

  <section>
    <h2>视角</h2>
    <div class="row wrap">
      <button data-view="overview">全景</button>
      <button data-view="harbour">海港</button>
      <button data-view="square">广场</button>
      <button data-view="terrace">台地</button>
      <button data-view="hill">山顶</button>
      <button data-view="fair">游乐场</button>
      <button data-view="lighthouse">灯塔</button>
      <button data-view="windmill">风车</button>
    </div>
    <div class="row">
      <button id="btn-spin" class="wide">环绕巡航</button>
    </div>
  </section>

  <section>
    <h2>显示</h2>
    <div class="row wrap">
      <button id="btn-dyn">动态元素</button>
      <button id="btn-shadow">阴影</button>
      <button id="btn-fog">雾气</button>
    </div>
    <div class="row wrap">
      <button data-quality="low">低</button>
      <button data-quality="mid">中</button>
      <button data-quality="high">高</button>
    </div>
    <div class="row">
      <button id="btn-shot" class="wide">保存截图</button>
    </div>
  </section>

  <section class="hint">
    <h2>操作</h2>
    <p>左键拖拽旋转 · 右键/Shift 平移 · 滚轮缩放</p>
    <p>空格暂停 · A 昼夜 · R 巡航 · D 动态 · H 面板 · 1–5 时段 · ←→ 微调</p>
  </section>

</div>

<!-- ---------------- scripts (classic, so file:// works) ---------------- -->
<script src="js/vendor/three.min.js"></script>

<script src="js/core/core.js"></script>
<script src="js/core/geo.js"></script>
<script src="js/core/controls.js"></script>

<script src="js/world/sky.js"></script>
<script src="js/world/island.js"></script>
<script src="js/world/roads.js"></script>
<script src="js/world/nature.js"></script>
<script src="js/world/props.js"></script>
<script src="js/world/buildings_home.js"></script>
<script src="js/world/buildings_civic.js"></script>
<script src="js/world/dynamics.js"></script>
<script src="js/world/fx.js"></script>
<script src="js/world/layout.js"></script>

<script src="js/app.js"></script>
</body>
</html>
