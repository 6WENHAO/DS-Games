<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>J-20「威龙」· 三维模型</title>
<style>
  :root{
    --ink:#e8eef6; --dim:#94a3b8; --line:rgba(255,255,255,.12);
    --glass:rgba(12,18,28,.62); --accent:#5fa8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1118;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .card{position:fixed;background:var(--glass);border:1px solid var(--line);
    border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 34px rgba(0,0,0,.42)}

  #title{left:18px;top:18px;padding:14px 18px 12px}
  #title h1{margin:0;font-size:19px;letter-spacing:.10em;font-weight:600}
  #title h1 span{color:var(--accent)}
  #title .sub{margin-top:5px;font-size:11.5px;color:var(--dim);letter-spacing:.04em}
  #stats{margin-top:8px;font-size:10.5px;color:#7f8ea3;font-variant-numeric:tabular-nums}

  #spec{left:18px;top:118px;padding:12px 16px;font-size:11.5px;line-height:1.85;color:var(--dim)}
  #spec b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  #spec .k{display:inline-block;min-width:74px;color:#8496ab}

  #panel{left:50%;transform:translateX(-50%);bottom:18px;padding:11px 13px;
    display:flex;flex-direction:column;gap:9px;max-width:min(94vw,860px)}
  .row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--ink);padding:7px 13px;border-radius:9px;font-size:12.5px;cursor:pointer;
    transition:.16s;letter-spacing:.03em;white-space:nowrap;font-family:inherit}
  .btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
  .btn.on{background:rgba(95,168,255,.24);border-color:rgba(95,168,255,.75);color:#dbeeff;
    box-shadow:0 0 14px rgba(95,168,255,.22) inset}
  .row.views .btn{font-size:12px;padding:6px 11px;color:#c4d2e2}

  #hint{right:18px;bottom:18px;padding:9px 13px;font-size:11px;color:var(--dim);line-height:1.7}
  #hint kbd{background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-size:10px;font-family:inherit}

  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0b1118;z-index:9;
    font-size:13px;color:var(--dim);letter-spacing:.12em}
  @media (max-width:720px){
    #spec{display:none} #title{padding:11px 14px 9px} #title h1{font-size:16px}
    .btn{padding:6px 10px;font-size:11.5px}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="boot">正在生成机体几何…</div>

<div id="title" class="card">
  <h1>J-20 <span>威龙</span></h1>
  <div class="sub">成都飞机工业集团 · 第五代双发重型隐身战斗机</div>
  <div id="stats">—</div>
</div>

<div id="spec" class="card">
  <div><span class="k">全长</span><b>20.4 m</b></div>
  <div><span class="k">翼展</span><b>12.88 m</b></div>
  <div><span class="k">全高</span><b>4.45 m</b></div>
  <div><span class="k">气动布局</span><b>鸭翼 + 边条 + 升力体 + 全动 V 尾</b></div>
  <div><span class="k">进气道</span><b>DSI 无附面层隔道</b></div>
  <div><span class="k">武器</span><b>主弹舱 4×PL-15 · 侧舱 2×PL-10</b></div>
</div>

<div id="panel" class="card">
  <div class="row" id="row-toggle"></div>
  <div class="row views" id="row-view"></div>
</div>

<div id="hint" class="card">
  <div><kbd>左键</kbd> 拖拽环绕 · <kbd>滚轮</kbd> 推拉 · <kbd>右键</kbd> 平移</div>
  <div style="margin-top:3px;color:#6f7f93">全部几何与贴图均由代码程序化生成，无外部资源</div>
</div>

<script type="module">
/*__BUNDLE__*/
</script>
</body>
</html>
