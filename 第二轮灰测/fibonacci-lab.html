    // 斐波那契进制位串
    const maxIdx = z.parts.length ? z.parts[0].index : 2;
    let bits = '';
    for (let i = maxIdx; i >= 2; i--) bits += z.parts.some((p) => p.index === i) ? '1' : '0';
    U.text(ctx, '斐波那契进制：' + bits + '   （相邻两位不同时为 1' + (z.adjacent ? ' ✗ 该变体不满足' : ' ✓') + '）',
      R.x, barY + barH + 18, { size: 12, color: z.adjacent ? P.d : U.rgba(P.text, 0.85), weight: 700, mono: true, baseline: 'middle' });

    // 下方：1..R 的分解阶梯
    const gy = R.y + topH + 30;
    const gh = R.h - topH - 34;
    const maxRow = Math.min(Math.floor(gh / 13), 46);
    const rowH = gh / Math.max(1, maxRow);
    const scale = (R.w - 60) / Math.max(1, maxRow);
    for (let i = 1; i <= maxRow; i++) {
      const zi = SEQ.zeckendorf(i, env.terms);
      const y = gy + (i - 1) * rowH;
      let cx2 = R.x + 34;
      U.text(ctx, String(i), R.x + 28, y + rowH / 2, {
        size: Math.min(10.5, rowH * 0.8), color: U.rgba(P.dim, 0.85), weight: 600, mono: true, align: 'right', baseline: 'middle',
      });
      zi.parts.forEach((p) => {
        const wpx = Number(p.value) * scale;
        const col = U.ramp(P, U.clamp(p.index / 12, 0, 1), 58);
        ctx.fillStyle = U.rgba(col, i === N ? 0.98 : 0.72);
        ctx.fillRect(cx2, y + rowH * 0.16, Math.max(1, wpx - 1.4), rowH * 0.68);
        cx2 += wpx;
      });
      if (i === N) {
        ctx.save();
        ctx.strokeStyle = U.rgba(P.a, 0.9);
        ctx.lineWidth = 1.4;
        U.roundRect(ctx, R.x + 32, y + rowH * 0.1, R.w - 40, rowH * 0.8, 4);
        ctx.stroke();
        ctx.restore();
      }
    }
    U.text(ctx, '每个正整数都有唯一的“不相邻项”分解（齐肯多夫定理）—— 上图每行即一个整数的拼法',
      R.x, R.y + R.h + 14, { size: 11.5, color: U.rgba(P.text, 0.78), weight: 600, baseline: 'middle' });
  }

  /* ---------------- 斐波那契字 ---------------- */
  function drawWord(ctx, env, R) {
    const P = env.P, S = env.st.nt;
    const steps = S.wordSteps;
    const words = SEQ.fibWords(steps);
    const narrow = R.w < 780;
    const stripW = narrow ? R.w : R.w * 0.5;
    const stripX = R.x;
    const rows = words.length;
    const rowH = Math.min(34, (narrow ? R.h * 0.46 : R.h) / rows);
    const top = R.y + (narrow ? 0 : (R.h - rowH * rows) / 2);

    for (let i = 0; i < rows; i++) {
      const wd = words[i];
      const y = top + i * rowH;
      const cw = (stripW - 46) / wd.length;
      U.text(ctx, 'S' + U.sub(i + 1), stripX + 40, y + rowH / 2, {
        size: Math.min(11.5, rowH * 0.6), color: U.rgba(P.dim, 0.9), weight: 700, mono: true, align: 'right', baseline: 'middle',
      });
      for (let k = 0; k < wd.length; k++) {
        ctx.fillStyle = wd[k] === '0' ? U.rgba(P.a, 0.88) : U.rgba(P.b, 0.82);
        ctx.fillRect(stripX + 46 + k * cw, y + rowH * 0.15, Math.max(0.7, cw - (cw > 3 ? 0.8 : 0)), rowH * 0.7);
      }
      if (rowH > 12) {
        U.text(ctx, String(wd.length), stripX + stripW - 2, y + rowH / 2, {
          size: Math.min(10.5, rowH * 0.55), color: U.rgba(P.text, 0.55), weight: 600, mono: true, align: 'right', baseline: 'middle',
        });
      }
    }
    const last = words[words.length - 1];
    let zeros = 0;
    for (let i = 0; i < last.length; i++) if (last[i] === '0') zeros++;
    const ones = last.length - zeros;
    U.text(ctx, 'S(n) = S(n−1) + S(n−2)  ·  长度 = 斐波那契数  ·  #0/#1 = ' + U.fixed(zeros / Math.max(1, ones), 6) + ' → φ',
      stripX, (narrow ? top + rowH * rows + 16 : R.y + R.h + 14), {
      size: 12, color: U.rgba(P.a, 0.95), weight: 700, mono: true, baseline: 'middle',
    });

    // 分形曲线
    const fx = narrow ? R.x : R.x + R.w * 0.52;
    const fy = narrow ? top + rowH * rows + 30 : R.y;
    const fw = narrow ? R.w : R.w * 0.48;
    const fh = narrow ? R.h - (rowH * rows + 30) : R.h;
    if (fw > 60 && fh > 60) {
      const word = last.length > 2200 ? last.slice(0, 2200) : last;
      const pts = SEQ.wordFractal(word);
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const p of pts) {
        x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
        x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
      }
      const sc = Math.min(fw / Math.max(1, x1 - x0), fh / Math.max(1, y1 - y0)) * 0.88;
      const ox = fx + fw / 2 - ((x0 + x1) / 2) * sc;
      const oy = fy + fh / 2 + ((y0 + y1) / 2) * sc;
      const lim = Math.max(2, Math.floor(pts.length * U.clamp(env.progress * 1.15, 0.05, 1)));
      const scr = [];
      for (let i = 0; i < lim; i++) scr.push({ x: ox + pts[i].x * sc, y: oy - pts[i].y * sc });
      ctx.save();
      const g = ctx.createLinearGradient(fx, fy, fx + fw, fy + fh);
      g.addColorStop(0, P.b);
      g.addColorStop(1, P.a);
      ctx.strokeStyle = g;
      ctx.lineWidth = Math.max(1.1, Math.min(2.6, sc * 0.5));
      ctx.lineJoin = 'round';
      ctx.shadowColor = U.rgba(P.a, 0.45); ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(scr[0].x, scr[0].y);
      for (let i = 1; i < scr.length; i++) ctx.lineTo(scr[i].x, scr[i].y);
      ctx.stroke();
      ctx.restore();
      U.text(ctx, '斐波那契字分形（遇 0 拐 90°）', fx + fw / 2, fy + 12, {
        size: 11.5, color: U.rgba(P.dim, 0.95), weight: 600, align: 'center', baseline: 'middle',
      });
    }
  }

  /* ---------------- 恒等式 ---------------- */
  function drawIdentity(ctx, env, R) {
    const P = env.P;
    const n = U.clamp(env.cursor, 1, env.count - 2);
    const xn = env.at(n), xp = env.at(n - 1), xq = env.at(n + 1);
    if (xn === null || xp === null || xq === null) return;
    const sq = xn * xn, rc = xp * xq;
    const diff = rc - sq;

    // 左：正方形 vs 矩形
    const boxW = Math.min(R.w * 0.46, R.h * 1.15);
    const unit = Math.min(boxW / Math.max(1, Number(U.bigAbs(xq))), (R.h * 0.72) / Math.max(1, Number(U.bigAbs(xq))));
    const sSide = Number(U.bigAbs(xn)) * unit;
    const rW = Number(U.bigAbs(xq)) * unit, rH = Number(U.bigAbs(xp)) * unit;
    const baseY = R.y + R.h * 0.7;
    const x1 = R.x + 8, x2 = x1 + Math.max(sSide, 60) + 44;

    ctx.save();
    U.roundRect(ctx, x1, baseY - sSide, sSide, sSide, 4);
    const g1 = ctx.createLinearGradient(x1, baseY - sSide, x1 + sSide, baseY);
    g1.addColorStop(0, U.rgba(P.b, 0.34));
    g1.addColorStop(1, U.rgba(P.b, 0.1));
    ctx.fillStyle = g1;
    ctx.fill();
    ctx.strokeStyle = U.rgba(P.b, 0.9);
    ctx.lineWidth = 1.4;
    ctx.stroke();
    U.roundRect(ctx, x2, baseY - rH, rW, rH, 4);
    const g2 = ctx.createLinearGradient(x2, baseY - rH, x2 + rW, baseY);
    g2.addColorStop(0, U.rgba(P.c, 0.34));
    g2.addColorStop(1, U.rgba(P.c, 0.1));
    ctx.fillStyle = g2;
    ctx.fill();
    ctx.strokeStyle = U.rgba(P.c, 0.9);
    ctx.stroke();
    ctx.restore();

    U.text(ctx, 'x' + U.sub(n) + '² = ' + U.compactBig(sq, 12), x1, baseY + 18, { size: 12.5, color: P.b, weight: 700, mono: true, baseline: 'middle' });
    U.text(ctx, 'x' + U.sub(n - 1) + '·x' + U.sub(n + 1) + ' = ' + U.compactBig(rc, 12), x2, baseY + 18, { size: 12.5, color: P.c, weight: 700, mono: true, baseline: 'middle' });
    U.text(ctx, '卡西尼不变量  x' + U.sub(n - 1) + 'x' + U.sub(n + 1) + ' − x' + U.sub(n) + '² = ' + (diff >= 0n ? '+' : '') + diff.toString(),
      x1, baseY + 42, { size: 14, color: P.a, weight: 800, mono: true, baseline: 'middle' });
    U.text(ctx, '（斐波那契恒为 ±1：两个几乎相等的面积永远差一个单位）', x1, baseY + 64, {
      size: 11.5, color: U.rgba(P.dim, 0.95), weight: 600, baseline: 'middle',
    });

    // 右：恒等式核对表
    const tx = R.x + R.w * 0.52;
    let ty = R.y + 20;
    const line = (label, val, ok, col) => {
      U.text(ctx, label, tx, ty, { size: 13, color: U.rgba(P.text, 0.88), weight: 600, mono: true, baseline: 'middle' });
      U.text(ctx, val, R.x + R.w, ty, {
        size: 13, color: col || (ok === false ? P.d : P.a), weight: 800, mono: true, align: 'right', baseline: 'middle',
      });
      ty += 31;
    };
    let sum = 0n, sumSq = 0n;
    for (let i = 0; i <= n; i++) {
      const v = env.at(i);
      if (v !== null) { sum += v; sumSq += v * v; }
    }
    const xn2 = env.at(n + 2);
    U.text(ctx, '恒等式核对（n = ' + n + '，全部精确大整数）', tx, ty, {
      size: 12.5, color: U.rgba(P.dim, 0.95), weight: 700, baseline: 'middle',
    });
    ty += 32;
    line('Σ x(0..n)', U.compactBig(sum, 13));
    if (xn2 !== null) line('x(n+2) − Σ', U.compactBig(xn2 - sum, 13), true, P.b);
    line('Σ x(i)²', U.compactBig(sumSq, 13));
    line('x(n)·x(n+1)', U.compactBig(xn * xq, 13), true, P.b);
    line('gcd(x(n), x(n+1))', bigGcd(xn, xq).toString(), true, P.c);
    const dbl = env.at(2 * n) || null;
    if (dbl !== null) {
      const pred = xn * (2n * xq - xn);
      line('x(2n) = x(n)(2x(n+1)−x(n))', dbl === pred ? '成立 ✓' : '不成立 ✗', dbl === pred, dbl === pred ? P.a : P.d);
    }
    line('比值 → λ', isFinite(env.root.value) ? U.fixed(env.root.value, 9) : '复根', true, P.a);
  }

  root.FIB.registerView({
    id: 'nt',
    name: '数论变体',
    badge: '06',
    desc:
      '斐波那契的整数结构同样可调：模 m 之后必然循环（皮萨诺周期）；每个正整数都能唯一写成不相邻项之和' +
      '（齐肯多夫定理，即“斐波那契进制”）；用 S(n)=S(n−1)+S(n−2) 拼接字符串会得到自相似的斐波那契字与分形；' +
      '而卡西尼恒等式说明相邻项构成的正方形与矩形面积永远只差一个常数。换成卢卡斯、佩尔等变体，这些结构会整体平移。',
    controls: [
      {
        kind: 'chips', path: 'nt.tab', label: '子主题',
        options: [
          { v: 'pisano', label: '皮萨诺周期' },
          { v: 'zeck', label: '齐肯多夫' },
          { v: 'word', label: '斐波那契字' },
          { v: 'identity', label: '恒等式' },
        ],
      },
      { kind: 'slider', path: 'nt.modMax', label: '模数上限 m', min: 3, max: 30, step: 1, when: (S) => S.nt.tab === 'pisano' },
      { kind: 'slider', path: 'nt.cols', label: '展示项数', min: 12, max: 80, step: 1, when: (S) => S.nt.tab === 'pisano' },
      { kind: 'slider', path: 'nt.zeckN', label: '待分解整数 N', min: 1, max: 400, step: 1, when: (S) => S.nt.tab === 'zeck', wide: true },
      { kind: 'slider', path: 'nt.wordSteps', label: '迭代层数', min: 3, max: 16, step: 1, when: (S) => S.nt.tab === 'word' },
    ],
    stats: function (env) {
      const S = env.st.nt;
      if (S.tab === 'pisano') {
        const out = [];
        for (const m of [2, 3, 5, 10]) {
          const p = SEQ.period(env.coef, env.seeds, env.order, m, 6000);
          out.push({ label: 'π(' + m + ')', value: p > 0 ? String(p) : '—' });
        }
        return out;
      }
      if (S.tab === 'zeck') {
        const z = SEQ.zeckendorf(S.zeckN, env.terms);
        return [
          { label: 'N', value: String(S.zeckN) },
          { label: '项数', value: String(z.parts.length) },
          { label: '最大项', value: z.parts.length ? U.compactBig(z.parts[0].value, 12) : '—' },
          { label: '无相邻项', value: z.adjacent ? '否 ✗' : '是 ✓' },
        ];
      }
      if (S.tab === 'word') {
        const words = SEQ.fibWords(S.wordSteps);
        const last = words[words.length - 1];
        let zeros = 0;
        for (let i = 0; i < last.length; i++) if (last[i] === '0') zeros++;
        return [
          { label: '层数', value: String(S.wordSteps) },
          { label: '字长', value: U.group(last.length) },
          { label: '#0 : #1', value: zeros + ' : ' + (last.length - zeros) },
          { label: '比值', value: U.fixed(zeros / Math.max(1, last.length - zeros), 6) },
        ];
      }
      const n = U.clamp(env.cursor, 1, env.count - 2);
      const xn = env.at(n), xp = env.at(n - 1), xq = env.at(n + 1);
      const diff = xn !== null && xp !== null && xq !== null ? xp * xq - xn * xn : null;
      return [
        { label: 'n', value: String(n) },
        { label: '卡西尼不变量', value: diff === null ? '—' : diff.toString() },
        { label: 'gcd(xₙ,xₙ₊₁)', value: xn !== null && xq !== null ? bigGcd(xn, xq).toString() : '—' },
        { label: '变体', value: env.preset ? env.preset.name : '自定义' },
      ];
    },
    draw: function (ctx, env) {
      const w = env.w, h = env.h;
      const pad = Math.max(18, Math.min(34, w * 0.026));
      const R = { x: pad, y: pad + 16, w: w - pad * 2, h: h - pad * 2 - 44 };
      const tab = env.st.nt.tab;
      if (tab === 'pisano') drawPisano(ctx, env, R);
      else if (tab === 'zeck') drawZeck(ctx, env, R);
      else if (tab === 'word') drawWord(ctx, env, R);
      else drawIdentity(ctx, env, R);
    },
  });
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
/* scripts/app.js */
/*
 * app.js —— 状态 / 控件 / 渲染循环
 */
(function (root) {
  'use strict';
  const U = root.FIB.util;
  const SEQ = root.FIB.seq;
  const VIEWS = root.FIB.views;

  /* ---------------- 状态 ---------------- */
  const DEFAULTS = {
    view: 'recurrence',
    theme: 'aurora',
    order: 2,
    coef: [1, 1, 0],
    seeds: [0, 1, 0],
    count: 22,
    cursorF: 5,
    playing: true,
    speed: 1,
    rec: { neg: false, showBars: true },
    tree: { mode: 'recursion', depth: 8, memo: false, months: 9 },
    spiral: { mode: 'tiles', arcs: true, log: true, labels: true, depth: 12, rotate: 0 },
    phyllo: { n: 900, angle: SEQ.GOLDEN_ANGLE, k: 13, grow: true, dot: 1 },
    nt: { tab: 'pisano', modMax: 12, cols: 40, zeckN: 88, wordSteps: 11 },
  };
  const S = JSON.parse(JSON.stringify(DEFAULTS));

  const getPath = (o, p) => p.split('.').reduce((acc, k) => acc[k], o);
  const setPath = (o, p, v) => {
    const ks = p.split('.');
    const last = ks.pop();
    ks.reduce((acc, k) => acc[k], o)[last] = v;
  };
  const val = (x) => (typeof x === 'function' ? x(S) : x);

  /* ---------------- 全局控件表 ---------------- */
  const GLOBAL = [
    {
      kind: 'chips', path: 'order', label: '阶数（回看几项）',
      options: [{ v: 2, label: '二阶' }, { v: 3, label: '三阶' }],
    },
    { kind: 'slider', path: 'coef.0', label: 'a · x(n−1)', min: -3, max: 5, step: 1 },
    { kind: 'slider', path: 'coef.1', label: 'b · x(n−2)', min: -3, max: 5, step: 1 },
    { kind: 'slider', path: 'coef.2', label: 'c · x(n−3)', min: -3, max: 5, step: 1, when: (s) => s.order >= 3 },
    { kind: 'slider', path: 'seeds.0', label: '初值 x₀', min: -5, max: 9, step: 1 },
    { kind: 'slider', path: 'seeds.1', label: '初值 x₁', min: -5, max: 9, step: 1 },
    { kind: 'slider', path: 'seeds.2', label: '初值 x₂', min: -5, max: 9, step: 1, when: (s) => s.order >= 3 },
    { kind: 'slider', path: 'count', label: '项数', min: 8, max: 60, step: 1 },
    { kind: 'slider', path: 'cursorF', label: '光标 n', min: (s) => s.order, max: (s) => s.count - 1, step: 0.01, digits: 0, cursor: true, wide: true },
    { kind: 'slider', path: 'speed', label: '播放速度', min: 0.1, max: 3, step: 0.05, digits: 2, unit: '×' },
  ];

  /* ---------------- DOM ---------------- */
  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  let cursorInput = null, cursorLabel = null;
  let t = 0;

  const currentView = () => VIEWS.filter((v) => v.id === S.view)[0] || VIEWS[0];

  /* ---------------- 派生数据（缓存） ---------------- */
  let cache = { key: '', terms: [], neg: [], ratios: [], root: null, binet: null, preset: null };
  const EXTRA = 46;

  function derive() {
    const key = [S.order, S.coef.join(','), S.seeds.join(','), S.count].join('|');
    if (cache.key === key) return cache;
    const terms = SEQ.generate(S.coef, S.seeds, S.order, S.count + EXTRA);
    const neg = SEQ.canExtendBack(S.coef, S.order) ? SEQ.extendBack(S.coef, S.seeds, 8) : [];
    cache = {
      key: key,
      terms: terms,
      neg: neg,
      ratios: SEQ.ratios(terms),
      root: SEQ.rootInfo(S.coef, S.order),
      binet: SEQ.binet(S.coef, S.seeds, S.order),
      preset: SEQ.matchPreset(S.coef, S.seeds, S.order),
    };
    return cache;
  }

  function buildEnv(w, h) {
    const d = derive();
    const P = U.THEMES[S.theme];
    const negOn = S.rec.neg && d.neg.length > 0;
    const iMin = negOn ? -d.neg.length : 0;
    const iMax = S.count - 1;
    const at = (i) => {
      if (i < 0) return i >= -d.neg.length ? d.neg[-i - 1] : null;
      return i < d.terms.length ? d.terms[i] : null;
    };
    const cursorF = U.clamp(S.cursorF, S.order, S.count - 1);
    const cursor = Math.floor(cursorF + 1e-9);
    return {
      w: w, h: h, t: t, P: P, st: S,
      coef: S.coef, seeds: S.seeds, order: S.order, count: S.count,
      terms: d.terms.slice(0, S.count), full: d.terms, neg: d.neg,
      at: at, iMin: iMin, iMax: iMax,
      ratioAt: (i) => (i > 0 && i < d.ratios.length ? d.ratios[i] : NaN),
      root: d.root, binet: d.binet, preset: d.preset,
      cursorF: cursorF, cursor: cursor, frac: U.clamp(cursorF - cursor, 0, 1),
      progress: U.clamp((cursorF - S.order) / Math.max(1, S.count - 1 - S.order), 0, 1),
    };
  }

  /* ---------------- 控件渲染 ---------------- */
  function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  function fmtVal(spec, v) {
    const d = spec.digits === undefined ? (spec.step && spec.step < 1 ? 2 : 0) : spec.digits;
    return (typeof v === 'number' ? v.toFixed(d) : String(v)) + (spec.unit || '');
  }

  function makeControl(spec, host) {
    if (spec.when && !spec.when(S)) return;
    if (spec.kind === 'slider') {
      const box = el('div', 'ctl' + (spec.wide ? ' wide' : ''));
      const head = el('div', 'ctl-head');
      head.appendChild(el('span', 'ctl-label', spec.label));
      const vLab = el('span', 'ctl-val', fmtVal(spec, getPath(S, spec.path)));
      head.appendChild(vLab);
      box.appendChild(head);
      const inp = el('input', 'range');
      inp.type = 'range';
      inp.min = val(spec.min); inp.max = val(spec.max); inp.step = spec.step;
      inp.value = getPath(S, spec.path);
      const paint = () => {
        const mn = Number(inp.min), mx = Number(inp.max);
        const p = ((Number(inp.value) - mn) / Math.max(1e-9, mx - mn)) * 100;
        inp.style.setProperty('--fill', p + '%');
      };
      paint();
      inp.addEventListener('input', () => {
        const v = Number(inp.value);
        setPath(S, spec.path, v);
        if (spec.cursor) S.playing = false;
        if (spec.path === 'count') {
          S.cursorF = U.clamp(S.cursorF, S.order, S.count - 1);
          if (cursorInput) { cursorInput.max = S.count - 1; cursorInput.value = S.cursorF; }
        }
        vLab.textContent = fmtVal(spec, v);
        paint();
        syncHeader();
        if (spec.cursor) syncPlayBtn();
      });
      inp.addEventListener('change', () => { if (spec.path === 'count') build(); });
      box.appendChild(inp);
      host.appendChild(box);
      if (spec.cursor) { cursorInput = inp; cursorLabel = vLab; cursorInput._spec = spec; }
      return;
    }
    if (spec.kind === 'toggle') {
      const box = el('div', 'ctl row');
      const lab = el('label', 'switch');
      const inp = el('input');
      inp.type = 'checkbox';
      inp.checked = !!getPath(S, spec.path);
      const track = el('span', 'track');
      lab.appendChild(inp);
      lab.appendChild(track);
      box.appendChild(lab);
      const txt = el('span', 'ctl-label', spec.label);
      box.appendChild(txt);
      if (spec.hint) box.title = spec.hint;
      inp.addEventListener('change', () => { setPath(S, spec.path, inp.checked); build(); });
      txt.addEventListener('click', () => { inp.checked = !inp.checked; setPath(S, spec.path, inp.checked); build(); });
      host.appendChild(box);
      return;
    }
    if (spec.kind === 'chips') {
      const box = el('div', 'ctl');
      if (spec.label) box.appendChild(el('div', 'ctl-label', spec.label));
      const wrap = el('div', 'chips small');
      const cur = getPath(S, spec.path);
      spec.options.forEach((o) => {
        const b = el('button', 'chip' + (String(cur) === String(o.v) ? ' on' : ''), o.label);
        b.addEventListener('click', () => { setPath(S, spec.path, o.v); build(); });
        wrap.appendChild(b);
      });
      box.appendChild(wrap);
      host.appendChild(box);
      return;
    }
    if (spec.kind === 'buttons') {
      const box = el('div', 'ctl');
      if (spec.label) box.appendChild(el('div', 'ctl-label', spec.label));
      const wrap = el('div', 'chips small');
      spec.options.forEach((o) => {
        const b = el('button', 'chip', o.label);
        b.addEventListener('click', () => { o.act(S, buildEnv(canvas.clientWidth, canvas.clientHeight)); build(); });
        wrap.appendChild(b);
      });
      box.appendChild(wrap);
      host.appendChild(box);
    }
  }

  function buildPresets() {
    const host = $('presetChips');
    host.innerHTML = '';
    const d = derive();
    SEQ.PRESETS.forEach((p) => {
      const on = d.preset && d.preset.id === p.id;
      const b = el('button', 'chip' + (on ? ' on' : ''), p.name);
      b.title = p.rule + '　' + p.story;
      b.addEventListener('click', () => {
        S.order = p.order;
        S.coef = p.coef.slice();
        S.seeds = p.seeds.slice();
        S.cursorF = Math.max(S.order, Math.min(S.cursorF, S.count - 1));
        build();
      });
      host.appendChild(b);
    });
  }

  function buildTabs() {
    const host = $('tabs');
    host.innerHTML = '';
    VIEWS.forEach((v, i) => {
      const b = el('button', 'tab' + (v.id === S.view ? ' on' : ''));
      b.appendChild(el('span', 'tab-badge', v.badge));
      b.appendChild(el('span', 'tab-name', v.name));
      b.appendChild(el('span', 'tab-key', String(i + 1)));
      b.addEventListener('click', () => { S.view = v.id; build(); });
      host.appendChild(b);
    });
  }

  function buildThemes() {
    const host = $('themeChips');
    host.innerHTML = '';
    Object.keys(U.THEMES).forEach((k) => {
      const P = U.THEMES[k];
      const b = el('button', 'chip swatch' + (S.theme === k ? ' on' : ''));
      const dot = el('span', 'dot');
      dot.style.background = 'linear-gradient(135deg,' + P.a + ',' + P.b + ' 60%,' + P.c + ')';
      b.appendChild(dot);
      b.appendChild(el('span', '', P.label));
      b.addEventListener('click', () => { S.theme = k; applyTheme(); build(); });
      host.appendChild(b);
    });
  }

  function applyTheme() {
    const P = U.THEMES[S.theme];
    const r = document.documentElement.style;
    r.setProperty('--accent', P.a);
    r.setProperty('--accent2', P.b);
    r.setProperty('--accent3', P.c);
    r.setProperty('--accent4', P.d);
    r.setProperty('--bg', P.bg);
    r.setProperty('--bg2', P.bg2);
    r.setProperty('--text', P.text);
    r.setProperty('--dim', P.dim);
  }

  function syncPlayBtn() {
    const b = $('playBtn');
    b.textContent = S.playing ? '⏸  暂停' : '▶  播放';
    b.classList.toggle('on', S.playing);
  }

  function syncCursorUI() {
    if (!cursorInput) return;
    cursorInput.value = S.cursorF;
    const mn = Number(cursorInput.min), mx = Number(cursorInput.max);
    cursorInput.style.setProperty('--fill', ((S.cursorF - mn) / Math.max(1e-9, mx - mn)) * 100 + '%');
    if (cursorLabel) cursorLabel.textContent = String(Math.floor(S.cursorF));
  }

  function syncHeader() {
    const d = derive();
    const c = S.coef;
    const parts = [];
    for (let p = 1; p <= S.order; p++) {
      const k = c[p - 1];
      if (k === 0) continue;
      const sign = parts.length === 0 ? (k < 0 ? '−' : '') : (k < 0 ? ' − ' : ' + ');
      const mag = Math.abs(k) === 1 ? '' : Math.abs(k) + '·';
      parts.push(sign + mag + 'x(n−' + p + ')');
    }
    $('formulaBox').innerHTML =
      '<div class="f-main">x(n) = ' + (parts.join('') || '0') + '</div>' +
      '<div class="f-seed">x₀=' + S.seeds[0] + '  x₁=' + S.seeds[1] + (S.order >= 3 ? '  x₂=' + S.seeds[2] : '') + '</div>' +
      '<div class="f-root">λ ' + (isFinite(d.root.value) ? '= ' + U.fixed(d.root.value, 9) : '无实根（振荡）') +
      (d.root.name ? '　<b>' + d.root.name + '</b>' : '') + '</div>' +
      (d.preset ? '<div class="f-story">' + d.preset.story + '</div>' : '<div class="f-story">自定义变体</div>');
  }

  function build() {
    const view = currentView();
    const gHost = $('globalControls');
    gHost.innerHTML = '';
    cursorInput = null;
    GLOBAL.forEach((spec) => makeControl(spec, gHost));
    const vHost = $('viewControls');
    vHost.innerHTML = '';
    if (view.controls && view.controls.length) {
      view.controls.forEach((spec) => makeControl(spec, vHost));
      $('viewCtrlPanel').style.display = '';
    } else {
      $('viewCtrlPanel').style.display = 'none';
    }
    buildPresets();
    buildTabs();
    syncHeader();
    syncPlayBtn();
    $('infoTitle').textContent = view.badge + ' · ' + view.name;
    $('infoDesc').textContent = view.desc;
    lastStats = '';
  }

  /* ---------------- 统计条 ---------------- */
  let lastStats = '';
  function updateStats(list) {
    const key = list.map((s) => s.label + s.value).join('|');
    if (key === lastStats) return;
    lastStats = key;
    const host = $('stats');
    host.innerHTML = '';
    list.forEach((s) => {
      const c = el('div', 'stat');
      c.appendChild(el('span', 'stat-label', s.label));
      c.appendChild(el('span', 'stat-value', String(s.value)));
      host.appendChild(c);
    });
  }

  /* ---------------- 背景 ---------------- */
  function backdrop(w, h, P) {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w * 0.5, h * 0.1, 0, w * 0.5, h * 0.1, Math.max(w, h) * 0.9);
    g.addColorStop(0, U.rgba(P.a, 0.05));
    g.addColorStop(0.5, U.rgba(P.c, 0.02));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  /* ---------------- 循环 ---------------- */
  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.06, (now - last) / 1000) : 0;
    last = now;
    t += dt;
    if (S.playing) {
      S.cursorF += dt * S.speed * 0.8;
      if (S.cursorF > S.count - 1 + 0.35) S.cursorF = S.order;
    }
    syncCursorUI();
    const size = U.fitCanvas(canvas, ctx);
    const P = U.THEMES[S.theme];
    backdrop(size.w, size.h, P);
    const env = buildEnv(size.w, size.h);
    const view = currentView();
    try {
      view.draw(ctx, env);
      updateStats(view.stats ? view.stats(env) : []);
    } catch (e) {
      U.text(ctx, '绘制出错：' + e.message, 24, 40, { size: 14, color: '#ff6b6b', weight: 700 });
      if (root.console) root.console.error(e);
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- 交互 ---------------- */
  function exportPNG() {
    const off = document.createElement('canvas');
    off.width = canvas.width;
    off.height = canvas.height;
    const c2 = off.getContext('2d');
    const P = U.THEMES[S.theme];
    const g = c2.createLinearGradient(0, 0, off.width, off.height);
    g.addColorStop(0, P.bg);
    g.addColorStop(1, P.bg2);
    c2.fillStyle = g;
    c2.fillRect(0, 0, off.width, off.height);
    c2.drawImage(canvas, 0, 0);
    off.toBlob((b) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'fibonacci-' + S.view + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    });
  }

  function bindActions() {
    $('playBtn').addEventListener('click', () => { S.playing = !S.playing; syncPlayBtn(); });
    $('resetBtn').addEventListener('click', () => {
      const fresh = JSON.parse(JSON.stringify(DEFAULTS));
      fresh.view = S.view;
      fresh.theme = S.theme;
      Object.keys(fresh).forEach((k) => { S[k] = fresh[k]; });
      applyTheme();
      build();
    });
    $('exportBtn').addEventListener('click', exportPNG);
    $('menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));

    document.addEventListener('keydown', (e) => {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      const k = e.key;
      if (k === ' ') { e.preventDefault(); S.playing = !S.playing; syncPlayBtn(); return; }
      if (k === 'ArrowRight') { S.playing = false; S.cursorF = U.clamp(Math.floor(S.cursorF) + 1, S.order, S.count - 1); syncPlayBtn(); syncCursorUI(); return; }
      if (k === 'ArrowLeft') { S.playing = false; S.cursorF = U.clamp(Math.floor(S.cursorF) - 1, S.order, S.count - 1); syncPlayBtn(); syncCursorUI(); return; }
      if (k === 'e' || k === 'E') { exportPNG(); return; }
      if (k === 'r' || k === 'R') { $('resetBtn').click(); return; }
      const n = parseInt(k, 10);
      if (!isNaN(n) && n >= 1 && n <= VIEWS.length) { S.view = VIEWS[n - 1].id; build(); }
    });

    // 舞台横向拖拽 = 拖动光标
    let dragging = false, lastX = 0;
    const stage = $('stage');
    stage.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX;
      stage.setPointerCapture(e.pointerId);
      S.playing = false; syncPlayBtn();
    });
    stage.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      S.cursorF = U.clamp(S.cursorF + dx * 0.02, S.order, S.count - 1);
      syncCursorUI();
    });
    stage.addEventListener('pointerup', (e) => { dragging = false; try { stage.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ } });
    stage.addEventListener('wheel', (e) => {
      if (!e.shiftKey) return;
      e.preventDefault();
      S.playing = false; syncPlayBtn();
      S.cursorF = U.clamp(S.cursorF + (e.deltaY > 0 ? 0.25 : -0.25), S.order, S.count - 1);
    }, { passive: false });
  }

  /* ---------------- 启动 ---------------- */
  /** 支持 #view=spiral&preset=pell&n=9&play=0&sub=divide&theme=ink 形式的深链接 */
  function applyHash() {
    const raw = (root.location.hash || '').replace(/^#/, '') || (root.location.search || '').replace(/^\?/, '');
    if (!raw) return;
    const q = {};
    raw.split('&').forEach((kv) => {
      const i = kv.indexOf('=');
      if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    if (q.view && VIEWS.some((v) => v.id === q.view)) S.view = q.view;
    if (q.theme && U.THEMES[q.theme]) S.theme = q.theme;
    if (q.preset) {
      const p = SEQ.presetById(q.preset);
      if (p) { S.order = p.order; S.coef = p.coef.slice(); S.seeds = p.seeds.slice(); }
    }
    ['a', 'b', 'c'].forEach((k, i) => { if (q[k] !== undefined) S.coef[i] = Number(q[k]); });
    ['x0', 'x1', 'x2'].forEach((k, i) => { if (q[k] !== undefined) S.seeds[i] = Number(q[k]); });
    if (q.order) S.order = U.clamp(Number(q.order), 2, 3);
    if (q.count) S.count = U.clamp(Number(q.count), 8, 60);
    if (q.n) S.cursorF = U.clamp(Number(q.n), S.order, S.count - 1);
    if (q.angle) S.phyllo.angle = Number(q.angle);
    if (q.play === '0') S.playing = false;
    if (q.sub) {
      S.nt.tab = ['pisano', 'zeck', 'word', 'identity'].indexOf(q.sub) >= 0 ? q.sub : S.nt.tab;
      S.tree.mode = ['recursion', 'rabbit'].indexOf(q.sub) >= 0 ? q.sub : S.tree.mode;
      S.spiral.mode = ['tiles', 'divide'].indexOf(q.sub) >= 0 ? q.sub : S.spiral.mode;
    }
    if (q.memo === '1') S.tree.memo = true;
  }

  function boot() {
    applyHash();
    buildThemes();
    applyTheme();
    bindActions();
    build();
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  root.FIB.state = S;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
</html>
