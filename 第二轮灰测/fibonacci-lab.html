<script>
/* scripts/core/util.js */
/*
 * util.js —— 基础工具：数值/大整数/颜色/画布绘制
 * 以经典脚本方式挂载到全局，浏览器 file:// 直接可用；也可在 Node 中 eval 做自测。
 */
(function (root) {
  'use strict';

  const U = {};

  /* ---------------- 数值 ---------------- */
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
  U.mod = (a, n) => ((a % n) + n) % n;
  U.easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  U.easeOut = (t) => 1 - Math.pow(1 - t, 3);
  U.easeOutBack = (t) => {
    const c = 1.70158 + 1;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  };
  U.smoothstep = (t) => {
    t = U.clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
  };

  /* ---------------- 大整数 ---------------- */
  U.bigAbs = (v) => (v < 0n ? -v : v);

  /** log10(|v|)，用于对数坐标；v=0 返回 -Infinity */
  U.bigLog10 = function (v) {
    const a = U.bigAbs(v);
    if (a === 0n) return -Infinity;
    const s = a.toString();
    const headLen = Math.min(17, s.length);
    return Math.log10(Number(s.slice(0, headLen))) + (s.length - headLen);
  };

  /** 高精度 BigInt 比值 → Number */
  U.bigRatio = function (a, b) {
    if (b === 0n) return a === 0n ? NaN : Infinity;
    const SC = 1000000000000000000n; // 1e18
    const q = (a * SC) / b;
    return Number(q) / 1e18;
  };

  /** 千分位分组（细空格） */
  U.group = (s) => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');

  const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  U.sup = (n) => String(n).split('').map((c) => SUP[c] || c).join('');

  const SUB = { '-': '₋', 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉' };
  U.sub = (n) => String(n).split('').map((c) => SUB[c] || c).join('');

  /** 紧凑显示大整数：超过 maxDigits 位改用科学计数法 */
  U.compactBig = function (v, maxDigits) {
    maxDigits = maxDigits || 13;
    const neg = v < 0n;
    const s = U.bigAbs(v).toString();
    if (s.length <= maxDigits) return (neg ? '-' : '') + U.group(s);
    const mant = s[0] + '.' + s.slice(1, 3);
    return (neg ? '-' : '') + mant + '×10' + U.sup(s.length - 1);
  };

  U.fixed = function (v, d) {
    if (!isFinite(v)) return v > 0 ? '∞' : v < 0 ? '-∞' : 'NaN';
    return v.toFixed(d === undefined ? 4 : d);
  };

  /* ---------------- 颜色 ---------------- */
  function hex2rgb(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  U.hex2rgb = hex2rgb;

  /** hex + alpha → rgba() */
  U.rgba = function (hex, a) {
    const c = hex2rgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a === undefined ? 1 : a) + ')';
  };

  /** 两色线性混合 */
  U.mix = function (c1, c2, t) {
    const a = hex2rgb(c1), b = hex2rgb(c2);
    t = U.clamp(t, 0, 1);
    return 'rgb(' + Math.round(U.lerp(a[0], b[0], t)) + ',' + Math.round(U.lerp(a[1], b[1], t)) + ',' + Math.round(U.lerp(a[2], b[2], t)) + ')';
  };

  U.hsl = (h, s, l, a) => 'hsla(' + U.mod(h, 360) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')';

  /** 主题调色板：ramp 用于热力图/色环 */
  U.THEMES = {
    aurora: {
      key: 'aurora', label: '极光',
      bg: '#070b16', bg2: '#101a33', line: '#1d2947',
      text: '#e9eefc', dim: '#8ea2c8',
      a: '#f5c56a', b: '#5ad1c8', c: '#a78bfa', d: '#f472b6',
      hue0: 42, hue1: 265,
    },
    sunset: {
      key: 'sunset', label: '落日',
      bg: '#140a12', bg2: '#33131f', line: '#3c1e2c',
      text: '#fdeae4', dim: '#c79aa4',
      a: '#ffb457', b: '#ff7a6b', c: '#ef476f', d: '#ffd166',
      hue0: 12, hue1: 330,
    },
    ocean: {
      key: 'ocean', label: '深海',

    usable.sort((p, q) => (q.value > p.value ? 1 : q.value < p.value ? -1 : 0));
    let rest = BigInt(n);
    const parts = [];
    for (const u of usable) {
      if (u.value <= rest) {
        parts.push(u);
        rest -= u.value;
        if (rest === 0n) break;
      }
    }
    let adjacent = false;
    for (let i = 1; i < parts.length; i++) if (parts[i - 1].index - parts[i].index === 1) adjacent = true;
    return { parts: parts, remainder: rest, adjacent: adjacent };
  };

  /* ---------------- 斐波那契字 ---------------- */
  /** S1='0', S2='01', Sn = S(n-1)+S(n-2) —— 长度即斐波那契数 */
  S.fibWords = function (steps) {
    const list = ['0', '01'];
    while (list.length < steps) list.push(list[list.length - 1] + list[list.length - 2]);
    return list.slice(0, Math.max(1, steps));
  };

  /** 斐波那契字分形曲线：逐字符前进，遇 '0' 按下标奇偶左/右转 90° */
  S.wordFractal = function (word) {
    const pts = [{ x: 0, y: 0 }];
    let x = 0, y = 0, dir = 0; // 0:+x 1:+y 2:-x 3:-y
    for (let i = 0; i < word.length; i++) {
      const d = [[1, 0], [0, 1], [-1, 0], [0, -1]][dir];
      x += d[0]; y += d[1];
      pts.push({ x: x, y: y });
      if (word[i] === '0') dir = U.mod(dir + ((i + 1) % 2 === 0 ? 1 : -1), 4);
    }
    return pts;
  };

  /* ---------------- 递归调用次数 ---------------- */
  /** 朴素递归 fib(n) 的调用次数 = 2·F(n+1) − 1；记忆化 = 2n − 1 */
  S.callCounts = function (n) {
    const f = [0, 1];
    for (let i = 2; i <= n + 1; i++) f.push(f[i - 1] + f[i - 2]);
    return { naive: 2 * f[Math.max(0, n + 1)] - 1, memo: Math.max(1, 2 * n - 1) };
  };

  /* ---------------- 常数 ---------------- */
  S.PHI = (1 + Math.sqrt(5)) / 2;
  S.GOLDEN_ANGLE = 360 / (S.PHI * S.PHI); // 137.507764…

<script>
/* scripts/views/recurrence.js */
/*
 * views/recurrence.js —— 视图 1：递推原理
 * 胶片式数轴 + 加法动画 + 对数尺度增长条
 */
(function (root) {
  'use strict';
  const U = root.FIB.util;
  const SEQ = root.FIB.seq;

  function coefLabel(k) {
    if (k === 1) return '';
    if (k === -1) return '−';
    return String(k);
  }

  /* 顶部递推公式 */
  function drawFormula(ctx, env, x, y) {
    const P = env.P, c = env.coef, o = env.order;
    const size = Math.max(15, Math.min(24, env.w * 0.019));
    let cx = x;
    const put = (s, color, weight, mono) => {
      cx += U.text(ctx, s, cx, y, { size: size, color: color, weight: weight || 600, mono: mono, baseline: 'middle' });
    };
    put('x' + U.sub('n'), P.a, 800, true);
    put('  =  ', P.dim, 500, true);
    const terms = [
      { k: c[0], idx: 'n−1', col: P.b },
      { k: c[1], idx: 'n−2', col: P.c },
      { k: c[2], idx: 'n−3', col: P.d },
    ].slice(0, o);
    let first = true;
    for (const t of terms) {
      if (t.k === 0) continue;
      if (!first) put(t.k < 0 ? '  −  ' : '  +  ', P.dim, 500, true);
      else if (t.k < 0) put('−', P.dim, 500, true);
      const lab = coefLabel(Math.abs(t.k) === 1 ? 1 : Math.abs(t.k));
      if (lab) put(lab + '·', t.col, 700, true);
      put('x' + U.sub(t.idx), t.col, 700, true);
      first = false;
    }
    if (first) put('0', P.dim, 700, true);
  }

  /* 单个数字卡片 */
  function drawTile(ctx, env, i, x, y, tw, th, role, alpha, pop) {
    const P = env.P;
    const v = env.at(i);
    const col = role === 'result' ? P.a : role === 'p1' ? P.b : role === 'p2' ? P.c : P.dim;
    const active = role !== 'idle';
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x + tw / 2, y + th / 2);
    const s = pop === undefined ? 1 : pop;
    ctx.scale(s, s);
    ctx.translate(-tw / 2, -th / 2);

    if (active) {
      ctx.save();
      ctx.shadowColor = U.rgba(col, 0.5);
      ctx.shadowBlur = 26;
      U.roundRect(ctx, 0, 0, tw, th, 14);
      ctx.fillStyle = U.rgba(col, 0.1);
      ctx.fill();
      ctx.restore();
    }
    U.roundRect(ctx, 0, 0, tw, th, 14);
    const g = ctx.createLinearGradient(0, 0, 0, th);
    g.addColorStop(0, U.rgba(active ? col : '#ffffff', active ? 0.2 : 0.06));
    g.addColorStop(1, U.rgba(active ? col : '#ffffff', active ? 0.05 : 0.02));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = active ? 1.6 : 1;
    ctx.strokeStyle = U.rgba(active ? col : '#ffffff', active ? 0.75 : 0.12);
    ctx.stroke();

    U.text(ctx, 'x' + U.sub(i), 10, 8, {
      size: Math.max(10, th * 0.17), color: active ? col : P.dim, weight: 700, mono: true, baseline: 'top',
    });

    const hidden = role === 'result' && env.frac < 0.42;
    const label = hidden ? '?' : U.compactBig(v === null ? 0n : v, 9);
    let fs = th * 0.34;
    while (fs > 8 && U.measure(ctx, label, fs, 700, true) > tw * 0.84) fs -= 1;
    U.text(ctx, label, tw / 2, th * 0.62, {
      size: fs, color: active ? P.text : U.rgba(P.text, 0.7), weight: 700, mono: true,
      align: 'center', baseline: 'middle', glow: active ? U.rgba(col, 0.6) : null, glowBlur: 14,
    });
    ctx.restore();
  }

  /* 增长总览条（对数尺度） */
  function drawBars(ctx, env, x, y, w, h) {
    const P = env.P;
    const n = env.iMax - env.iMin + 1;
    const gap = Math.min(4, Math.max(1, w / n * 0.22));
    const bw = (w - gap * (n - 1)) / n;
    let maxLog = 1, anyNeg = false;
    for (let i = env.iMin; i <= env.iMax; i++) {
      const v = env.at(i);
      if (v === null) continue;
      if (v < 0n) anyNeg = true;
      maxLog = Math.max(maxLog, U.bigLog10(U.bigAbs(v) + 1n));
    }
    const base = anyNeg ? y + h * 0.62 : y + h;
    const span = anyNeg ? h * 0.6 : h;

    ctx.save();
    ctx.strokeStyle = U.rgba(P.text, 0.1);
    ctx.beginPath();
    ctx.moveTo(x, Math.round(base) + 0.5);
    ctx.lineTo(x + w, Math.round(base) + 0.5);
    ctx.stroke();
    ctx.restore();

    for (let i = env.iMin; i <= env.iMax; i++) {
      const v = env.at(i);
      if (v === null) continue;
      const k = i - env.iMin;
      const bx = x + k * (bw + gap);
      const lg = U.bigLog10(U.bigAbs(v) + 1n);
      const bh = Math.max(2, (lg / maxLog) * span * 0.94);
      const neg = v < 0n;
      const isCur = i === env.cursor;
      const t = n <= 1 ? 0 : k / (n - 1);
      const col = isCur ? P.a : U.ramp(P, t, 56);
      ctx.save();
      ctx.globalAlpha = isCur ? 1 : i <= env.cursor ? 0.9 : 0.28;
      if (isCur) { ctx.shadowColor = P.a; ctx.shadowBlur = 16; }
      ctx.fillStyle = col;
      U.roundRect(ctx, bx, neg ? base : base - bh, bw, neg ? bh : bh, Math.min(3, bw / 2));
      ctx.fill();
      ctx.restore();
      if (isCur) {
        U.text(ctx, 'n=' + i, bx + bw / 2, base - bh - 8, {
          size: 11, color: P.a, weight: 700, mono: true, align: 'center', baseline: 'bottom',
        });
      }
    }
    U.text(ctx, '对数尺度 · 指数增长', x, y - 4, { size: 11, color: U.rgba(P.dim, 0.85), weight: 600, baseline: 'bottom' });
  }

  root.FIB.registerView({
    id: 'recurrence',
    name: '递推原理',
    badge: '01',
    desc:
      '斐波那契的全部秘密只有一行：每一项都是前两项之和。把系数 a、b（乃至三阶的 c）和两个起点变成旋钮，' +
      '同一台“加法机器”就会吐出卢卡斯、佩尔、雅各布斯塔尔……所有变体。注意底部对数尺度的增长条：' +
      '只要特征根 λ>1，数列必然指数爆炸。',
    controls: [
      { kind: 'toggle', path: 'rec.neg', label: '向负指数延伸', hint: 'F(−n) = (−1)ⁿ⁺¹F(n)，递推对全体整数成立' },
      { kind: 'toggle', path: 'rec.showBars', label: '增长总览条' },
    ],
    stats: function (env) {
      const out = [];
      const v = env.at(env.cursor);
      out.push({ label: 'x' + U.sub(env.cursor), value: v === null ? '—' : U.compactBig(v, 16) });
      const r = env.ratioAt(env.cursor);
      out.push({ label: '相邻比值', value: isFinite(r) ? U.fixed(r, 8) : '—' });
      out.push({ label: '特征根 λ', value: isFinite(env.root.value) ? U.fixed(env.root.value, 8) : '复根' });
      const dig = v === null || v === 0n ? 1 : U.bigAbs(v).toString().length;
      out.push({ label: '位数', value: String(dig) });
      return out;
    },
    draw: function (ctx, env) {
      const P = env.P, w = env.w, h = env.h;
      const pad = Math.max(18, Math.min(36, w * 0.028));

      drawFormula(ctx, env, pad, pad + 14);
      if (env.preset) {
        U.text(ctx, env.preset.name + '  ' + env.preset.symbol + '(n)', w - pad, pad + 14, {
          size: 14, color: U.rgba(P.dim, 0.9), weight: 600, align: 'right', baseline: 'middle',
        });
      }

      const barsOn = env.st.rec.showBars;
      const stripTop = pad + 46;
      const stripH = (barsOn ? h * 0.52 : h * 0.74) - pad;
      const tw = U.clamp(w / 7.4, 74, 176);
      const th = tw * 0.74;
      const gap = tw * 0.2;
      const cy = stripTop + stripH * 0.42;
      const cx = w / 2;

      // 连接弧线（父项 → 结果）
      const xOf = (i) => cx + (i - env.cursorF) * (tw + gap) - tw / 2;
      const cur = env.cursor;
      const targetX = xOf(cur) + tw / 2;
      const targetY = cy + th / 2;
      for (let p = 1; p <= env.order; p++) {
        const k = env.coef[p - 1];
        if (k === 0) continue;
        const src = cur - p;
        if (src < env.iMin) continue;
        const sx = xOf(src) + tw / 2;
        const sy = cy + th / 2;
        const col = p === 1 ? P.b : p === 2 ? P.c : P.d;
        const lift = th * (0.42 + 0.2 * p);
        const mid = (sx + targetX) / 2;
        const pt = U.curveArrow(ctx, sx, sy + 4, mid, sy + lift, targetX - (p === 1 ? 6 : -6), targetY + 4, {
          color: col, width: 2, alpha: 0.75, head: 8, glow: 10,
        });
        // 沿弧线流动的光点
        const tt = U.clamp(env.frac / 0.85, 0, 1);
        const q = pt(tt);
        U.dot(ctx, q.x, q.y, 4.2, col, 14);
        if (Math.abs(k) !== 1) {
          const m = pt(0.5);
          U.text(ctx, '×' + k, m.x, m.y + 14, {
            size: 12, color: col, weight: 700, mono: true, align: 'center', baseline: 'middle',
          });
        }
      }

      // 卡片
      for (let i = env.iMin; i <= env.iMax; i++) {
        const d = i - env.cursorF;
        if (Math.abs(d) > 4.6) continue;
        const alpha = 1 - U.clamp((Math.abs(d) - 2.4) / 2.1, 0, 1);
        if (alpha <= 0.02) continue;
        const role = i === cur ? 'result' : i === cur - 1 && env.coef[0] !== 0 ? 'p1'
          : i === cur - 2 && env.coef[1] !== 0 ? 'p2'
            : i === cur - 3 && env.order >= 3 && env.coef[2] !== 0 ? 'p2' : 'idle';
        const pop = i === cur ? 1 + 0.06 * Math.sin(U.clamp(env.frac, 0, 1) * Math.PI) : 1;
        drawTile(ctx, env, i, xOf(i), cy - th / 2, tw, th, role, alpha, pop);
      }

      // 等式行
      const eqY = cy + th / 2 + th * 0.72;
      const parts = [];
      for (let p = 1; p <= env.order; p++) {
        const k = env.coef[p - 1];
        if (k === 0) continue;
        const v = env.at(cur - p);
        if (v === null) continue;
        parts.push({ k: k, v: v, col: p === 1 ? P.b : p === 2 ? P.c : P.d });
      }
      const size = U.clamp(w * 0.016, 13, 21);
      let total = U.measure(ctx, 'x' + U.sub(cur) + ' = ', size, 700, true);
      for (const pp of parts) {
        total += U.measure(ctx, (Math.abs(pp.k) !== 1 ? Math.abs(pp.k) + '×' : '') + U.compactBig(pp.v, 9) + '   ', size, 700, true);
      }
      const resStr = U.compactBig(env.at(cur) || 0n, 12);
      total += U.measure(ctx, '=  ' + resStr, size, 800, true);
      let ex = Math.max(pad, w / 2 - total / 2);
      ex += U.text(ctx, 'x' + U.sub(cur) + ' = ', ex, eqY, { size: size, color: P.dim, weight: 700, mono: true, baseline: 'middle' });
      parts.forEach((pp, idx) => {
        if (idx > 0) ex += U.text(ctx, pp.k < 0 ? ' −  ' : ' +  ', ex, eqY, { size: size, color: P.dim, weight: 600, mono: true, baseline: 'middle' });
        const s = (Math.abs(pp.k) !== 1 ? Math.abs(pp.k) + '×' : '') + U.compactBig(pp.v < 0n && idx > 0 ? U.bigAbs(pp.v) : pp.v, 9);
        ex += U.text(ctx, s, ex, eqY, { size: size, color: pp.col, weight: 700, mono: true, baseline: 'middle' });
      });
      ex += U.text(ctx, '  =  ', ex, eqY, { size: size, color: P.dim, weight: 600, mono: true, baseline: 'middle' });
      U.text(ctx, resStr, ex, eqY, {
        size: size * 1.12, color: P.a, weight: 800, mono: true, baseline: 'middle',
        glow: U.rgba(P.a, 0.7), glowBlur: 16, alpha: U.clamp(env.frac / 0.5, 0.15, 1),
      });

      // 比值读数
      const r = env.ratioAt(cur);
      if (isFinite(r)) {
        const ry = eqY + size * 2.1;
        const txt = 'x' + U.sub(cur) + ' / x' + U.sub(cur - 1) + ' = ' + U.fixed(r, 9);
        const tail = env.root.name && isFinite(env.root.value) ? '   →   ' + env.root.name + ' ' + U.fixed(env.root.value, 6) : '';
        const tw2 = U.measure(ctx, txt, 14, 700, true) + U.measure(ctx, tail, 14, 600, false);
        let rx = w / 2 - tw2 / 2;
        rx += U.text(ctx, txt, rx, ry, { size: 14, color: U.rgba(P.text, 0.85), weight: 700, mono: true, baseline: 'middle' });
        if (tail) U.text(ctx, tail, rx, ry, { size: 14, color: P.a, weight: 700, baseline: 'middle' });
      }

      if (barsOn) {
        const by = h * 0.62;
        drawBars(ctx, env, pad, by, w - pad * 2, h - by - pad * 1.2);
      }
    },
  });
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* scripts/views/ratio.js */
/*
 * views/ratio.js —— 视图 2：比值收敛与闭式
 * 相邻比值折线 + 半对数误差 + 连分数 / 特征方程 + 比内公式
 */
(function (root) {
  'use strict';
  const U = root.FIB.util;
  const SEQ = root.FIB.seq;

  function cardBox(ctx, x, y, w, h, title, P, sub) {
    U.card(ctx, x, y, w, h, P, { r: 16 });
    U.text(ctx, title, x + 16, y + 18, { size: 12.5, color: U.rgba(P.text, 0.9), weight: 700, baseline: 'middle' });
    if (sub) U.text(ctx, sub, x + w - 16, y + 18, { size: 11, color: U.rgba(P.dim, 0.9), weight: 600, align: 'right', baseline: 'middle' });
    return { x: x + 16, y: y + 34, w: w - 32, h: h - 48 };
  }

  /* 主图：r(n) = x(n)/x(n-1) */
  function drawMain(ctx, env, R) {
    const P = env.P, lam = env.root.value;
    const from = 2, to = env.count - 1;
    const vals = [];
    for (let i = from; i <= to; i++) {
      const r = env.ratioAt(i);
      if (isFinite(r) && Math.abs(r) < 1e6) vals.push({ i: i, r: r });
    }
    if (!vals.length) {
      U.text(ctx, '数列含 0 项，无法计算比值', R.x + R.w / 2, R.y + R.h / 2, { size: 14, color: P.dim, align: 'center' });
      return;
    }
    let lo = Infinity, hi = -Infinity;
    for (const v of vals) { lo = Math.min(lo, v.r); hi = Math.max(hi, v.r); }
    if (isFinite(lam)) { lo = Math.min(lo, lam); hi = Math.max(hi, lam); }
    // 早期比值常常离谱，收紧到 λ 附近以看清收敛
    if (isFinite(lam)) {
      const near = vals.filter((v) => v.i >= Math.min(6, to));
      if (near.length) {
        let nlo = Infinity, nhi = -Infinity;
        for (const v of near) { nlo = Math.min(nlo, v.r); nhi = Math.max(nhi, v.r); }
        const spanNear = Math.max(nhi - nlo, Math.abs(lam) * 0.02);
        lo = Math.max(lo, Math.min(nlo, lam) - spanNear * 3);
        hi = Math.min(hi, Math.max(nhi, lam) + spanNear * 3);
      }
    }
    const spanY = Math.max(hi - lo, 1e-6);
    lo -= spanY * 0.14; hi += spanY * 0.14;
    const X = (i) => R.x + ((i - from) / Math.max(1, to - from)) * R.w;
    const Y = (r) => R.y + R.h - ((U.clamp(r, lo, hi) - lo) / (hi - lo)) * R.h;
    // 早期比值常常远在量程之外，直接略过而不是压在边界上
    const shown = vals.filter((v) => v.r >= lo && v.r <= hi);
    const hidden = vals.length - shown.length;

    // 网格 + y 轴刻度
    ctx.save();
    ctx.strokeStyle = U.rgba(P.text, 0.07);
    ctx.lineWidth = 1;
    for (let k = 0; k <= 4; k++) {
      const yy = R.y + (R.h * k) / 4;
      ctx.beginPath(); ctx.moveTo(R.x, yy); ctx.lineTo(R.x + R.w, yy); ctx.stroke();
      U.text(ctx, U.fixed(hi - ((hi - lo) * k) / 4, 3), R.x - 8, yy, {
        size: 10.5, color: U.rgba(P.dim, 0.8), mono: true, align: 'right', baseline: 'middle',
      });
    }
    ctx.restore();

    // λ 水平线
    if (isFinite(lam) && lam >= lo && lam <= hi) {
      const ly = Y(lam);
      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = U.rgba(P.a, 0.85);
      ctx.lineWidth = 1.6;
      ctx.shadowColor = U.rgba(P.a, 0.6); ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(R.x, ly); ctx.lineTo(R.x + R.w, ly); ctx.stroke();
      ctx.restore();
      const lab = 'λ = ' + U.fixed(lam, 9) + (env.root.name ? '   ' + env.root.name : '');
      U.text(ctx, lab, R.x + R.w, ly - 9, {
        size: 12.5, color: P.a, weight: 700, mono: true, align: 'right', baseline: 'bottom',
      });
    }

    // 振荡棒棒糖 + 折线
    const pts = shown.map((v) => ({ x: X(v.i), y: Y(v.r), i: v.i, r: v.r }));
    if (isFinite(lam)) {
      ctx.save();
      const ly = Y(lam);
      for (const p of pts) {
        if (p.i > env.cursor) continue;
        ctx.strokeStyle = U.rgba(p.r > lam ? P.b : P.c, 0.4);
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(p.x, ly); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      ctx.restore();
    }
    U.polyline(ctx, pts, { color: U.rgba(P.dim, 0.35), width: 1.4, dash: [4, 4] });
    const active = pts.filter((p) => p.i <= env.cursor);
    U.polyline(ctx, active, { color: P.b, width: 2.4, glow: 12 });
    for (const p of pts) {
      const on = p.i <= env.cursor;
      U.dot(ctx, p.x, p.y, on ? (p.i === env.cursor ? 5.4 : 3.1) : 2.2,
        on ? (p.i === env.cursor ? P.a : P.b) : U.rgba(P.dim, 0.4), on ? 12 : 0);
    }
    // x 轴标签
    for (let i = from; i <= to; i += Math.max(1, Math.round((to - from) / 10))) {
      U.text(ctx, String(i), X(i), R.y + R.h + 6, {
        size: 10.5, color: U.rgba(P.dim, 0.8), mono: true, align: 'center', baseline: 'top',
      });
    }
    U.text(ctx, 'n', R.x + R.w, R.y + R.h + 6, { size: 11, color: P.dim, mono: true, align: 'right', baseline: 'top' });
    if (hidden > 0) {
      U.text(ctx, '前 ' + hidden + ' 个比值远离量程，已省略', R.x + 4, R.y + 4, {
        size: 11, color: U.rgba(P.dim, 0.8), weight: 600, baseline: 'top',
      });
    }

    const cr = env.ratioAt(env.cursor);
    if (isFinite(cr)) {
      const px = X(env.cursor), py = Y(cr);
      U.text(ctx, U.fixed(cr, 9), px, py - 12, {
        size: 13, color: P.a, weight: 800, mono: true, align: 'center', baseline: 'bottom', glow: U.rgba(P.a, 0.6),
      });
    }
  }

  /* 半对数误差 */
  function drawError(ctx, env, R) {
    const P = env.P, lam = env.root.value;
    if (!isFinite(lam)) {
      U.text(ctx, '无实特征根 → 比值不收敛（数列振荡）', R.x, R.y + R.h / 2, { size: 12, color: P.dim, weight: 600 });
      return;
    }
    const pts = [];
    let lastRatio = NaN, prevE = NaN;
    for (let i = 2; i < env.count; i++) {
      const r = env.ratioAt(i);
      if (!isFinite(r)) continue;
      const e = Math.abs(r - lam);
      const le = e <= 0 ? -17 : Math.log10(e);
      pts.push({ i: i, le: U.clamp(le, -17, 2) });
      if (isFinite(prevE) && e > 0 && prevE > 0) lastRatio = e / prevE;
      prevE = e;
    }
    if (pts.length < 2) return;
    const X = (i) => R.x + ((i - 2) / Math.max(1, env.count - 3)) * R.w;
    const Y = (le) => R.y + R.h - ((le + 17) / 19) * R.h;
    ctx.save();
    ctx.strokeStyle = U.rgba(P.text, 0.07);
    for (let e = 0; e >= -16; e -= 4) {
      const yy = Y(e);
      ctx.beginPath(); ctx.moveTo(R.x, yy); ctx.lineTo(R.x + R.w, yy); ctx.stroke();
      U.text(ctx, '10' + U.sup(e), R.x + 2, yy - 2, { size: 9.5, color: U.rgba(P.dim, 0.75), mono: true, baseline: 'bottom' });
    }
    ctx.restore();
    U.polyline(ctx, pts.map((p) => ({ x: X(p.i), y: Y(p.le) })), { color: P.c, width: 2, glow: 10 });
    for (const p of pts) U.dot(ctx, X(p.i), Y(p.le), p.i === env.cursor ? 4.4 : 2.2, p.i === env.cursor ? P.a : P.c, 8);
    const l2 = SEQ.minorRoot(env.coef, env.order);
    const theo = isFinite(l2) ? Math.abs(l2 / lam) : NaN;
    const s = '|r(n) − λ| 每步 ×' + (isFinite(lastRatio) ? U.fixed(lastRatio, 3) : '—') +
      (isFinite(theo) ? '   理论 |λ₂/λ₁| = ' + U.fixed(theo, 3) : '');
    U.text(ctx, s, R.x, R.y + R.h + 12, { size: 11, color: U.rgba(P.text, 0.75), weight: 600, mono: true, baseline: 'middle' });
  }

  /* 连分数（二阶）/ 特征方程曲线 */
  function drawFraction(ctx, env, R) {
    const P = env.P, c = env.coef;
    if (env.order === 2 && c[0] !== 0) {
      const depth = U.clamp(env.cursor - 1, 1, 5);
      const a = c[0], b = c[1];
      let x = R.x, y = R.y + R.h * 0.34, size = Math.min(20, R.h * 0.3);
      U.text(ctx, 'λ =', x, y, { size: size, color: P.dim, weight: 700, mono: true, baseline: 'middle' });
      x += U.measure(ctx, 'λ = ', size, 700, true);
      for (let k = 0; k < depth; k++) {
        const sz = size * Math.pow(0.9, k);
        x += U.text(ctx, (a === 1 ? '1' : String(a)), x, y, { size: sz, color: P.a, weight: 800, mono: true, baseline: 'middle' });
        x += U.text(ctx, ' + ', x, y, { size: sz, color: P.dim, weight: 600, mono: true, baseline: 'middle' });
        const num = b === 1 ? '1' : String(b);
        const nw = U.measure(ctx, num, sz * 0.9, 700, true);
        U.text(ctx, num, x + nw / 2, y - sz * 0.42, { size: sz * 0.9, color: P.b, weight: 700, mono: true, align: 'center', baseline: 'middle' });
        ctx.save();
        ctx.strokeStyle = U.rgba(P.text, 0.55);
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(x, y - sz * 0.06); ctx.lineTo(x + nw * 1.9, y - sz * 0.06); ctx.stroke();
        ctx.restore();
        const dy = sz * 0.5;
        y += dy;
        x += nw * 0.35;
        if (k === depth - 1) {
          const conv = env.ratioAt(env.cursor);
          U.text(ctx, isFinite(conv) ? U.fixed(conv, 5) + '…' : 'λ', x, y + sz * 0.1, {
            size: sz * 0.85, color: P.c, weight: 700, mono: true, baseline: 'middle',
          });
        }
      }
      U.text(ctx, '每一层截断都恰好是相邻两项之比 x(n)/x(n−1)', R.x, R.y + R.h - 4, {
        size: 11, color: U.rgba(P.dim, 0.9), weight: 600, baseline: 'bottom',
      });
    } else {
      // 特征方程曲线
      const lam = env.root.value;
      const xs = -1.6, xe = isFinite(lam) ? Math.max(2.4, lam * 1.5) : 3;
      let maxAbs = 1;
      const N = 160;
      const fs = [];
      for (let k = 0; k <= N; k++) {
        const xv = U.lerp(xs, xe, k / N);
        const f = SEQ.charPoly(env.coef, env.order, xv);
        fs.push({ xv: xv, f: f });
        maxAbs = Math.max(maxAbs, Math.abs(f));
      }
      const X = (xv) => R.x + ((xv - xs) / (xe - xs)) * R.w;
      const Y = (f) => R.y + R.h / 2 - (f / maxAbs) * (R.h / 2) * 0.88;
      ctx.save();
      ctx.strokeStyle = U.rgba(P.text, 0.16);
      ctx.beginPath(); ctx.moveTo(R.x, Y(0)); ctx.lineTo(R.x + R.w, Y(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(0), R.y); ctx.lineTo(X(0), R.y + R.h); ctx.stroke();
      ctx.restore();
      U.polyline(ctx, fs.map((p) => ({ x: X(p.xv), y: Y(p.f) })), { color: P.b, width: 2.2, glow: 10 });
      if (isFinite(lam)) {
        U.dot(ctx, X(lam), Y(0), 5, P.a, 16);
        U.text(ctx, 'λ=' + U.fixed(lam, 6), X(lam), Y(0) + 10, {
          size: 11.5, color: P.a, weight: 700, mono: true, align: 'center', baseline: 'top',
        });
      }
      U.text(ctx, env.root.equation, R.x, R.y + R.h - 2, { size: 11.5, color: U.rgba(P.dim, 0.95), weight: 700, mono: true, baseline: 'bottom' });
    }
  }

  /* 比内闭式 */
  function drawBinet(ctx, env, R) {
    const P = env.P;
    const b = env.binet;
    let y = R.y + 6;
    const line = (s, col, size, mono) => {
      U.text(ctx, s, R.x, y, { size: size || 12.5, color: col || U.rgba(P.text, 0.86), weight: 600, mono: mono !== false, baseline: 'top' });
      y += (size || 12.5) * 1.65;
    };
    if (b) {
      line('x(n) = A·λ₁ⁿ + B·λ₂ⁿ', P.a, 14);
      line('λ₁ = ' + U.fixed(b.l1, 9) + '   λ₂ = ' + U.fixed(b.l2, 9), P.b);
      line('A  = ' + U.fixed(b.A, 6) + '   B  = ' + U.fixed(b.B, 6), P.c);
      const exact = env.at(env.cursor);
      const approx = b.at(env.cursor);
      line('n = ' + env.cursor + ' → 闭式 ' + (Math.abs(approx) < 1e15 ? U.fixed(approx, 3) : approx.toExponential(4)), U.rgba(P.text, 0.9));
      line('        精确 ' + (exact === null ? '—' : U.compactBig(exact, 15)), U.rgba(P.text, 0.9));
      if (Math.abs(env.coef[0] - 1) < 1e-9 && Math.abs(env.coef[1] - 1) < 1e-9) {
        line('|λ₂| < 1 ⇒ 第二项迅速消失，x(n) ≈ A·λ₁ⁿ', P.d, 11.5);
      }
    } else {
      line('三阶（或重根）无二项闭式，', U.rgba(P.text, 0.9), 12.5, false);
      line('但主项依旧是 C·λⁿ：', U.rgba(P.text, 0.9), 12.5, false);
      const lam = env.root.value;
      const v = env.at(env.cursor);
      if (isFinite(lam) && v !== null && lam > 0) {
        const c = Math.pow(10, U.bigLog10(v) - env.cursor * Math.log10(lam));
        line('C ≈ x(n)/λⁿ = ' + U.fixed(c, 6), P.a, 13);
      }
      line('λ = ' + (isFinite(lam) ? U.fixed(lam, 9) : '无实根'), P.b, 13);
    }
  }

  root.FIB.registerView({
    id: 'ratio',
    name: '比值收敛',
    badge: '02',
    desc:
      '为什么斐波那契牵着黄金比？把递推两边同除 x(n−1)：r = a + b/r，收敛点就是特征方程 λ²=aλ+b 的正根。' +
      '比值在 λ 上下交替跳动、误差按 |λ₂/λ₁| 几何衰减（半对数图上是一条直线）。改成 a=2 得白银比，a=3 得青铜比。',
    controls: [],
    stats: function (env) {
      const r = env.ratioAt(env.cursor);
      const lam = env.root.value;
      return [
        { label: '当前比值', value: isFinite(r) ? U.fixed(r, 10) : '—' },
        { label: '特征根 λ', value: isFinite(lam) ? U.fixed(lam, 10) : '复根' },
        { label: '误差', value: isFinite(r) && isFinite(lam) ? Math.abs(r - lam).toExponential(2) : '—' },
        { label: 'λ 名称', value: env.root.name || '—' },
      ];
    },
    draw: function (ctx, env) {
      const P = env.P, w = env.w, h = env.h;
      const pad = Math.max(16, Math.min(30, w * 0.024));
      const narrow = w < 900;
      const mainW = narrow ? w - pad * 2 : (w - pad * 3) * 0.615;
      const mainH = narrow ? h * 0.5 : h - pad * 2;
      const mx = pad, my = pad;
      const inner = cardBox(ctx, mx, my, mainW, mainH, '相邻比值 r(n) = x(n) / x(n−1)', P, env.preset ? env.preset.name : '自定义');
      drawMain(ctx, env, { x: inner.x + 34, y: inner.y + 8, w: inner.w - 44, h: inner.h - 30 });

      const cx = narrow ? pad : mx + mainW + pad;
      const cw = narrow ? w - pad * 2 : w - mainW - pad * 3;
      const cy0 = narrow ? my + mainH + pad * 0.7 : my;
      const ch = narrow ? h - cy0 - pad : h - pad * 2;
      const gap = pad * 0.6;
      const h1 = (ch - gap * 2) * 0.34, h2 = (ch - gap * 2) * 0.33, h3 = (ch - gap * 2) * 0.33;

      let b1 = cardBox(ctx, cx, cy0, cw, h1, '收敛误差（半对数）', P, '直线 = 几何收敛');
      drawError(ctx, env, { x: b1.x, y: b1.y, w: b1.w, h: b1.h - 14 });

      let b2 = cardBox(ctx, cx, cy0 + h1 + gap, cw, h2, env.order === 2 && env.coef[0] !== 0 ? '连分数展开' : '特征方程', P);
      drawFraction(ctx, env, b2);

      let b3 = cardBox(ctx, cx, cy0 + h1 + h2 + gap * 2, cw, h3, '闭式（比内公式）', P);
      drawBinet(ctx, env, b3);
    },
  });
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
/* scripts/views/tree.js */
/*
 * views/tree.js —— 视图 3：递归树 / 兔子繁殖
 * 展示“同一条递推”的两种因果图：算法的重复子问题，与兔子的世代增长
 */
(function (root) {
  'use strict';
  const U = root.FIB.util;
  const SEQ = root.FIB.seq;

  const CAP = 1400;

  function activeCoefs(env) {
    const on = [];
    for (let p = 1; p <= env.order; p++) if (env.coef[p - 1] !== 0) on.push(p);
    return on;
  }

  function buildTree(env, nMax, memo) {
    const on = activeCoefs(env);
    const seen = new Set();
    let count = 0, truncated = false;
    function make(n, depth) {
      count++;
      const node = { n: n, depth: depth, children: [], cached: false };
      if (n < env.order) return node;
      if (count > CAP) { truncated = true; return node; }
      if (memo) {
        if (seen.has(n)) { node.cached = true; return node; }
        seen.add(n);
      }
      for (const p of on) {
        const c = n - p;
        if (c < 0) continue;
        node.children.push(make(c, depth + 1));
      }
      return node;
    }
    const r = make(nMax, 0);
    return { root: r, count: count, truncated: truncated };
  }

  function layout(node) {
    let leaves = 0, maxDepth = 0;
    (function walk(nd) {
      maxDepth = Math.max(maxDepth, nd.depth);
      if (!nd.children.length) { nd.ix = leaves++; return; }
      nd.children.forEach(walk);
      nd.ix = (nd.children[0].ix + nd.children[nd.children.length - 1].ix) / 2;
    })(node);
    return { leaves: Math.max(1, leaves), maxDepth: maxDepth };
  }

  function countNaive(env, n) {
    const memo = new Map();
    const on = activeCoefs(env);
    function f(k) {
      if (k < env.order) return 1;
      if (memo.has(k)) return memo.get(k);
      let s = 1;
      for (const p of on) if (k - p >= 0) s += f(k - p);
      memo.set(k, s);
      return s;
    }
    return f(n);
  }

  function drawRecursion(ctx, env, R) {
    const P = env.P, st = env.st.tree;
    const nMax = st.depth;
    const T = buildTree(env, nMax, st.memo);
    const L = layout(T.root);
    const nodeR = U.clamp(Math.min((R.w / L.leaves) * 0.42, (R.h / (L.maxDepth + 1)) * 0.3), 5, 21);
    const X = (ix) => R.x + ((ix + 0.5) / L.leaves) * R.w;
    const Y = (d) => R.y + nodeR + 4 + (L.maxDepth === 0 ? 0 : (d / L.maxDepth) * (R.h - nodeR * 2 - 8));

    // 逐层展开动画
    const cycle = L.maxDepth + 3.4;
    const reveal = env.st.playing ? U.mod(env.t * 0.9 * env.st.speed, cycle) : cycle;

    const nodes = [];
    (function collect(nd) { nodes.push(nd); nd.children.forEach(collect); })(T.root);

    // 连线
    ctx.save();
    for (const nd of nodes) {
      const a = U.clamp(reveal - nd.depth, 0, 1);
      if (a <= 0) continue;
      for (const ch of nd.children) {
        const x0 = X(nd.ix), y0 = Y(nd.depth) + nodeR * 0.8;
        const x1 = X(ch.ix), y1 = Y(ch.depth) - nodeR * 0.8;
        const ca = U.clamp(reveal - ch.depth, 0, 1);
        ctx.strokeStyle = U.rgba(ch.cached ? P.dim : P.text, 0.14 + 0.2 * ca);
        ctx.lineWidth = ch.cached ? 1 : 1.4;
        if (ch.cached) ctx.setLineDash([3, 3]); else ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        const my = (y0 + y1) / 2;
        ctx.bezierCurveTo(x0, my, x1, my, x1, y1);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 节点
    for (const nd of nodes) {
      const a = U.clamp(reveal - nd.depth, 0, 1);
      if (a <= 0.001) continue;
      const x = X(nd.ix), y = Y(nd.depth);
      const t = nMax <= 0 ? 0 : U.clamp(nd.n / nMax, 0, 1);
      const base = nd.n < env.order ? P.d : U.ramp(P, 1 - t, 58);
      const rr = nodeR * (0.6 + 0.4 * U.easeOutBack(a));
      ctx.save();
      ctx.globalAlpha = nd.cached ? 0.45 * a : a;
      if (!nd.cached) { ctx.shadowColor = U.rgba(base, 0.55); ctx.shadowBlur = nodeR * 0.9; }
      ctx.fillStyle = nd.cached ? U.rgba(P.dim, 0.18) : U.rgba(base, 0.9);
      ctx.beginPath();
      ctx.arc(x, y, rr, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = nd.cached ? U.rgba(P.dim, 0.6) : U.rgba('#ffffff', 0.35);
      if (nd.cached) ctx.setLineDash([2.5, 2.5]);
      ctx.stroke();
      ctx.restore();
      if (rr >= 8.5) {
        U.text(ctx, nd.cached ? '↺' : String(nd.n), x, y + 0.5, {
          size: Math.min(rr * 1.05, 15), color: nd.cached ? P.dim : '#0b0f1a',
          weight: 800, mono: true, align: 'center', baseline: 'middle', alpha: a,
        });
      }
    }

    // 统计
    const naive = countNaive(env, nMax);
    const memoTree = buildTree(env, nMax, true);
    const sy = R.y + R.h + 16;
    const barW = R.w * 0.42;
    const rows = [
      { label: '朴素递归调用次数', v: naive, col: P.d },
      { label: '记忆化 / 迭代次数', v: memoTree.count, col: P.b },
    ];
    const maxV = Math.max(naive, memoTree.count, 1);
    rows.forEach((r, i) => {
      const y = sy + i * 22;
      U.text(ctx, r.label, R.x, y, { size: 11.5, color: U.rgba(P.dim, 0.95), weight: 600, baseline: 'middle' });
      const bx = R.x + 132;
      const bw = (r.v / maxV) * barW;
      ctx.save();
      ctx.fillStyle = U.rgba(r.col, 0.85);
      ctx.shadowColor = U.rgba(r.col, 0.5); ctx.shadowBlur = 10;
      U.roundRect(ctx, bx, y - 6, Math.max(3, bw), 12, 6);
      ctx.fill();
      ctx.restore();
      U.text(ctx, String(r.v), bx + Math.max(3, bw) + 8, y, {
        size: 12, color: r.col, weight: 800, mono: true, baseline: 'middle',
      });
    });
    const ratio = memoTree.count ? naive / memoTree.count : 1;
    U.text(ctx, '重复计算放大 ' + U.fixed(ratio, 1) + '×   复杂度 O(λⁿ) → O(n)', R.x + 132 + barW + 70, sy + 11, {
      size: 12, color: P.a, weight: 700, baseline: 'middle',
    });
    U.text(ctx, st.memo ? '↺ = 命中缓存，不再展开' : '同色节点 = 同一个子问题被反复重算', R.x, R.y - 10, {
      size: 11.5, color: U.rgba(P.text, 0.7), weight: 600, baseline: 'bottom',
    });
    if (T.truncated) {
      U.text(ctx, '（节点过多，已截断显示）', R.x + R.w, R.y - 10, {
        size: 11, color: P.d, weight: 600, align: 'right', baseline: 'bottom',
      });
    }
  }

  function drawRabbits(ctx, env, R) {
    const P = env.P, st = env.st.tree;
    const months = U.clamp(st.months, 2, env.count - 1);
    const rowH = R.h / months;
    const iconS = Math.min(rowH * 0.66, 30);
    const leftW = Math.min(R.w * 0.3, 210);
    const fieldX = R.x + leftW;
    const fieldW = R.w - leftW - 54;
    const perRow = Math.max(1, Math.floor(fieldW / (iconS * 0.92)));
    const a = env.coef[0], b = env.coef[1];

    for (let m = 1; m <= months; m++) {
      const y = R.y + (m - 1) * rowH + rowH / 2;
      const total = env.at(m);
      const survive = env.at(m - 1);
      const born = env.at(m - 2);
      const nSurvive = survive === null ? 0 : Number(U.bigAbs(survive)) * Math.abs(a);
      const nBorn = born === null ? 0 : Number(U.bigAbs(born)) * Math.abs(b);
      const isCur = m === U.clamp(env.cursor, 1, months);

      if (isCur) {
        ctx.save();
        U.roundRect(ctx, R.x - 8, y - rowH / 2 + 2, R.w + 16, rowH - 4, 12);
        ctx.fillStyle = U.rgba(P.a, 0.07);
        ctx.fill();
        ctx.strokeStyle = U.rgba(P.a, 0.28);
        ctx.stroke();
        ctx.restore();
      }

      U.text(ctx, '第 ' + m + ' 月', R.x + 2, y - rowH * 0.14, {
        size: Math.min(15, rowH * 0.34), color: isCur ? P.a : U.rgba(P.text, 0.9), weight: 700, baseline: 'middle',
      });
      U.text(ctx, (total === null ? '—' : U.compactBig(total, 9)) + ' 对', R.x + 2, y + rowH * 0.24, {
        size: Math.min(13, rowH * 0.3), color: isCur ? P.a : U.rgba(P.dim, 0.95), weight: 700, mono: true, baseline: 'middle',
      });
      const detail = (a === 1 ? '' : a + '×') + U.fixed(nSurvive, 0) + ' 存活 + ' + (b === 1 ? '' : b + '×') + U.fixed(nBorn, 0) + ' 新生';
      U.text(ctx, detail, R.x + 92, y + rowH * 0.24, {
        size: Math.min(11, rowH * 0.26), color: U.rgba(P.dim, 0.8), weight: 600, mono: true, baseline: 'middle',
      });

      // 兔子图标
      let drawn = 0;
      const totalN = nSurvive + nBorn;
      const show = Math.min(totalN, perRow);
      for (let k = 0; k < show; k++) {
        const isBaby = k >= nSurvive;
        const x = fieldX + iconS * 0.5 + k * iconS * 0.92;
        const wob = Math.sin(env.t * 2 + k * 0.7 + m) * (isCur ? 1.6 : 0.5);
        const s = iconS * (isBaby ? 0.62 : 0.86);
        U.rabbit(ctx, x, y + wob, s, U.rgba(isBaby ? P.b : P.a, isCur ? 0.98 : 0.7), isBaby);
        drawn++;
      }
      if (totalN > drawn) {
        U.text(ctx, '+' + U.fixed(totalN - drawn, 0), fieldX + iconS * 0.5 + drawn * iconS * 0.92, y, {
          size: Math.min(13, rowH * 0.3), color: U.rgba(P.text, 0.8), weight: 700, mono: true, baseline: 'middle',
        });
      }
    }
    // 图例
    U.text(ctx, '成年（上月存活，可生育）', R.x + leftW, R.y - 10, { size: 11.5, color: P.a, weight: 700, baseline: 'bottom' });
    U.text(ctx, '幼兔（本月新生）', R.x + leftW + 190, R.y - 10, { size: 11.5, color: P.b, weight: 700, baseline: 'bottom' });
    U.text(ctx, '递推 = 上月全部存活 + 两月前的那些各生 ' + Math.abs(b) + ' 对', R.x + R.w, R.y - 10, {
      size: 11.5, color: U.rgba(P.dim, 0.95), weight: 600, align: 'right', baseline: 'bottom',
    });
  }

  root.FIB.registerView({
    id: 'tree',
    name: '递归 · 兔子',
    badge: '03',
    desc:
      '同一条递推有两副面孔：算法上它是一棵指数级膨胀的调用树（相同颜色即被重算无数次的同一子问题，' +
      '打开记忆化后立刻塌缩成线性）；生物上它是兔子的世代账本——上月全部存活，两月前的那些各生一窝。' +
      '把系数改成 a=0（帕多瓦）等，树的分叉规则会随之改变。',
    controls: [
      {
        kind: 'chips', path: 'tree.mode', label: '视角',
        options: [{ v: 'recursion', label: '递归调用树' }, { v: 'rabbit', label: '兔子繁殖' }],
      },
      { kind: 'slider', path: 'tree.depth', label: '递归 n', min: 3, max: 13, step: 1, when: (S) => S.tree.mode === 'recursion' },
      { kind: 'toggle', path: 'tree.memo', label: '记忆化（剪掉重复子树）', when: (S) => S.tree.mode === 'recursion' },
      { kind: 'slider', path: 'tree.months', label: '月份数', min: 3, max: 14, step: 1, when: (S) => S.tree.mode === 'rabbit' },
    ],
    stats: function (env) {
      if (env.st.tree.mode === 'rabbit') {

          { label: '总对数', value: env.at(m) === null ? '—' : U.compactBig(env.at(m), 14) },
          { label: '上月存活', value: env.at(m - 1) === null ? '—' : U.compactBig(env.at(m - 1), 14) },

        ];
      }
      const n = env.st.tree.depth;
      const naive = countNaive(env, n);
      const memo = buildTree(env, n, true).count;
      return [
        { label: '递归 n', value: String(n) },
        { label: '朴素调用', value: U.group(naive) },
        { label: '记忆化调用', value: U.group(memo) },
        { label: '放大倍数', value: U.fixed(naive / Math.max(1, memo), 1) + '×' },
      ];
    },
    draw: function (ctx, env) {
      const w = env.w, h = env.h;
      const pad = Math.max(20, Math.min(38, w * 0.03));
      const R = { x: pad, y: pad + 22, w: w - pad * 2, h: h - pad * 2 - 76 };
      if (env.st.tree.mode === 'rabbit') drawRabbits(ctx, env, R);
      else drawRecursion(ctx, env, R);
    },
  });
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
/* scripts/views/spiral.js */
/*
 * views/spiral.js —— 视图 4：黄金螺旋 / 自相似
 * 模式 A：用数列项铺正方形（斐波那契铺砌，同时是恒等式 Σx(k)² = x(n)·x(n+1) 的图证）
 * 模式 B：把 λ:1 矩形反复切掉正方形（欧几里得算法 = λ 的连分数展开）
 * 叠加：四分之一圆弧螺旋 与 真正的对数螺旋 r = r₀·λ^(2θ/π)
 */
(function (root) {
  'use strict';
  const U = root.FIB.util;
  const SEQ = root.FIB.seq;

  /* ---------- 模式 A：正方形铺砌（数学坐标，y 向上） ---------- */
  function buildSquares(sizes) {
    const out = [];
    if (!sizes.length) return out;
    let s = sizes[0];
    let x0 = 0, y0 = 0, x1 = s, y1 = s;
    out.push({ x0: 0, y0: 0, s: s, dir: 3 });
    for (let i = 1; i < sizes.length; i++) {
      s = sizes[i];
      const dir = (i + 3) % 4;
      if (dir === 0) {           // 右
        out.push({ x0: x1, y0: y0, s: s, dir: 0 });
        x1 += s; y1 = Math.max(y1, y0 + s);
      } else if (dir === 1) {    // 上
        out.push({ x0: x1 - s, y0: y1, s: s, dir: 1 });
        y1 += s; x0 = Math.min(x0, x1 - s);
      } else if (dir === 2) {    // 左
        out.push({ x0: x0 - s, y0: y1 - s, s: s, dir: 2 });
        x0 -= s; y0 = Math.min(y0, y1 - s);
      } else {                   // 下
        out.push({ x0: x0, y0: y0 - s, s: s, dir: 3 });
        y0 -= s; x1 = Math.max(x1, x0 + s);
      }
    }
    return out;
  }

  /** 每个正方形内的四分之一圆弧（圆心取靠“螺眼”的角），返回数学坐标采样点 */
  function arcPoints(sq, segs) {
    const s = sq.s, x = sq.x0, y = sq.y0;
    let cx, cy, a0;
    if (sq.dir === 0) { cx = x; cy = y + s; a0 = -Math.PI / 2; }       // 圆心左上
    else if (sq.dir === 1) { cx = x; cy = y; a0 = 0; }                  // 圆心左下
    else if (sq.dir === 2) { cx = x + s; cy = y; a0 = Math.PI / 2; }    // 圆心右下
    else { cx = x + s; cy = y + s; a0 = Math.PI; }                      // 圆心右上
    const pts = [];
    for (let k = 0; k <= segs; k++) {
      const a = a0 + (Math.PI / 2) * (k / segs);
      pts.push({ x: cx + s * Math.cos(a), y: cy + s * Math.sin(a) });
    }
    return pts;
  }

  /** 由两段相邻弧端点解出对数螺旋的“螺眼” */
  function spiralEye(p0, p1, lam) {
    const a = p0.x, b = p0.y, c = p1.x, d = p1.y;
    const ey = (lam * lam * b + lam * c - lam * a + d) / (1 + lam * lam);
    const ex = lam * b + c - lam * ey;
    return { x: ex, y: ey };
  }

  /* ---------- 模式 B：矩形连分数分割（屏幕坐标） ---------- */
  function subdivide(rect, depth, maxSq) {
    const squares = [];
    let r = { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
    let dir = 0;
    const steps = [];
    for (let d = 0; d < depth; d++) {
      const long = Math.max(r.w, r.h), short = Math.min(r.w, r.h);
      if (short <= 1e-9 || squares.length >= maxSq) break;
      const k = U.clamp(Math.floor(long / short + 1e-9), 1, 12);
      const s = short;
      const horiz = r.w >= r.h;
      const cut = [];
      for (let j = 0; j < k; j++) {
        if (horiz) {
          const sx = dir === 2 ? r.x + r.w - (j + 1) * s : r.x + j * s;
          cut.push({ x: sx, y: r.y, s: s, step: d, j: j });
        } else {
          const sy = dir === 3 ? r.y + r.h - (j + 1) * s : r.y + j * s;
          cut.push({ x: r.x, y: sy, s: s, step: d, j: j });
        }
      }
      squares.push.apply(squares, cut);
      steps.push({ k: k, depth: d, rect: { x: r.x, y: r.y, w: r.w, h: r.h } });
      if (horiz) {
        const rest = r.w - k * s;
        r = { x: dir === 2 ? r.x : r.x + k * s, y: r.y, w: rest, h: r.h };
        dir = dir === 2 ? 3 : 1;
      } else {
        const rest = r.h - k * s;
        r = { x: r.x, y: dir === 3 ? r.y : r.y + k * s, w: r.w, h: rest };
        dir = dir === 3 ? 0 : 2;
      }
    }
    return { squares: squares, steps: steps, eye: { x: r.x + r.w / 2, y: r.y + r.h / 2 } };
  }

  /* ---------- 通用：对数螺旋 ---------- */
  function logSpiral(ctx, eye, r1, th1, lam, turnsIn, turnsOut, color, width, alpha, ccw) {
    if (!isFinite(lam) || lam <= 1 || !isFinite(r1) || r1 <= 0) return;
    const g = Math.log(lam) / (Math.PI / 2);
    const pts = [];
    const from = -turnsIn * 2 * Math.PI, to = turnsOut * 2 * Math.PI;
    const N = 900;
    for (let i = 0; i <= N; i++) {
      const dth = U.lerp(from, to, i / N);
      const r = r1 * Math.exp(g * dth);
      if (r < 1e-4) continue;
      const th = th1 + (ccw ? dth : -dth);
      pts.push({ x: eye.x + r * Math.cos(th), y: eye.y + r * Math.sin(th) });
    }
    U.polyline(ctx, pts, { color: color, width: width, alpha: alpha, glow: 14 });
  }

  /* ---------- 铺砌信息栏（竖长外框时填补左侧空白） ---------- */
  let tileStats = null;

  function drawTilesInfo(ctx, env, box) {
    const P = env.P;
    if (!tileStats) return;
    const T = tileStats;
    U.card(ctx, box.x, box.y, box.w, box.h, P, { r: 16 });
    let y = box.y + 26;
    const x = box.x + 16;
    const iw = box.w - 32;
    const GAP = U.clamp(box.h / 25, 22, 34);
    const put = (s, o) => {
      o = o || {};
      U.text(ctx, s, o.right ? box.x + box.w - 16 : x, y, {
        size: o.size || 12, color: o.color || U.rgba(P.text, 0.86), weight: o.weight || 600,
        mono: o.mono !== false, align: o.right ? 'right' : 'left', baseline: 'middle',
      });
      if (!o.same) y += o.gap || GAP;
    };
    const rule = () => {
      ctx.save();
      ctx.strokeStyle = U.rgba(P.text, 0.1);
      ctx.beginPath();
      ctx.moveTo(x, y - 10); ctx.lineTo(x + iw, y - 10);
      ctx.stroke();
      ctx.restore();
      y += 8;
    };
    U.text(ctx, '面积图证', x, y, { size: 12, color: P.a, weight: 800, baseline: 'middle' });
    y += GAP + 6;
    put('正方形个数', { color: U.rgba(P.dim, 0.95), same: true, mono: false });
    put(String(T.shown + 1), { right: true, color: P.text, weight: 800 });
    put('Σ x(i)²', { color: U.rgba(P.dim, 0.95), same: true });
    put(U.compactBig(T.sumSq, 11), { right: true, color: P.b, weight: 800 });
    put('x(n)·x(n+1)', { color: U.rgba(P.dim, 0.95), same: true });
    put(U.compactBig(T.prod, 11), { right: true, color: P.c, weight: 800 });
    const perfect = T.prod === T.sumSq;
    put(perfect ? '完美铺满 ✓' : '有缝隙 / 重叠', { color: perfect ? P.a : P.d, weight: 800, mono: false });
    if (!perfect) {
      put('外框面积占用 ' + U.fixed(T.fill * 100, 1) + '%', { color: U.rgba(P.dim, 0.95), size: 11, mono: false });
    }
    rule();
    put('外框', { color: U.rgba(P.dim, 0.95), same: true, mono: false });
    put(U.fixed(T.bw, 0) + ' × ' + U.fixed(T.bh, 0), { right: true, color: P.text, weight: 700 });
    put('x(n)', { color: U.rgba(P.dim, 0.95), same: true });
    put(U.compactBig(T.xn, 11), { right: true, color: P.text, weight: 700 });
    put('x(n+1)', { color: U.rgba(P.dim, 0.95), same: true });
    put(U.compactBig(T.xn1, 11), { right: true, color: P.text, weight: 700 });
    put('比值', { color: U.rgba(P.dim, 0.95), same: true, mono: false });
    put(isFinite(T.ratio) ? U.fixed(T.ratio, 6) : '—', { right: true, color: P.b, weight: 700 });
    put('λ', { color: U.rgba(P.dim, 0.95), same: true });
    put(isFinite(env.root.value) ? U.fixed(env.root.value, 6) : '—', { right: true, color: P.a, weight: 700 });
    if (env.root.name) put(env.root.name, { color: U.rgba(P.a, 0.9), size: 11, mono: false });
    rule();
    put('边长', { color: U.rgba(P.dim, 0.95), size: 11, mono: false });
    const tail = T.sizes.slice(-7);
    put(tail.join(' · '), { size: 11.5, color: U.rgba(P.text, 0.8), weight: 600 });
    if (y < box.y + box.h - 34) {
      y = box.y + box.h - 34;
      U.text(ctx, '每个正方形边长 = 数列的一项，', x, y, { size: 11, color: U.rgba(P.dim, 0.9), weight: 600, mono: false, baseline: 'middle' });
      U.text(ctx, '它们的面积之和恰好填满外框矩形。', x, y + 16, { size: 11, color: U.rgba(P.dim, 0.9), weight: 600, mono: false, baseline: 'middle' });
    }
  }

  root.FIB.registerView({
    id: 'spiral',
    name: '黄金螺旋',
    badge: '04',
    desc:
      '把数列的每一项当作正方形边长，沿右→上→左→下贴着已有图形铺出去：只有 a=b=1 时它们才严丝合缝，' +
      '外框恰好是 x(n)×x(n+1)（这就是 Σx(k)² = x(n)·x(n+1) 的图证）。切换到“矩形分割”，' +
      '不断从 λ:1 矩形上切掉正方形——每步切几个，正是 λ 连分数的系数：黄金比每步 1 个，白银比每步 2 个。',
    controls: [
      {
        kind: 'chips', path: 'spiral.mode', label: '构造方式',
        options: [{ v: 'tiles', label: '正方形铺砌' }, { v: 'divide', label: '矩形分割' }],
      },
      { kind: 'toggle', path: 'spiral.arcs', label: '四分之一圆弧螺旋', when: (S) => S.spiral.mode === 'tiles' },
      { kind: 'toggle', path: 'spiral.log', label: '真·对数螺旋' },
      { kind: 'toggle', path: 'spiral.labels', label: '标注边长' },
      { kind: 'slider', path: 'spiral.depth', label: '分割层数', min: 3, max: 24, step: 1, when: (S) => S.spiral.mode === 'divide' },
      { kind: 'slider', path: 'spiral.rotate', label: '旋转', min: 0, max: 360, step: 1, unit: '°' },
    ],
    stats: function (env) {
      const lam = env.root.value;
      if (env.st.spiral.mode === 'divide') {
        const k = isFinite(lam) ? Math.floor(lam) : 0;
        return [
          { label: 'λ', value: isFinite(lam) ? U.fixed(lam, 8) : '—' },
          { label: '连分数', value: isFinite(lam) ? '[' + k + '; ' + k + ', ' + k + ', …]' : '—' },
          { label: '每步切出', value: isFinite(lam) ? k + ' 个正方形' : '—' },
          { label: '每 90° 缩放', value: isFinite(lam) ? U.fixed(1 / lam, 6) : '—' },
        ];
      }
      const k = U.clamp(env.cursor, 1, env.count - 1);
      let sumSq = 0n;
      for (let i = 0; i <= k; i++) {
        const v = env.at(i);
        if (v !== null) sumSq += v * v;
      }
      const a = env.at(k), b = env.at(k + 1);
      return [
        { label: '正方形数', value: String(k + 1) },
        { label: 'Σ x(i)²', value: U.compactBig(sumSq, 13) },
        { label: 'x(n)·x(n+1)', value: a !== null && b !== null ? U.compactBig(a * b, 13) : '—' },
        { label: '完美铺砌', value: a !== null && b !== null && a * b === sumSq ? '是 ✓' : '否（有缝隙/重叠）' },
      ];
    },
    draw: function (ctx, env) {
      const P = env.P, w = env.w, h = env.h;
      const pad = Math.max(22, Math.min(46, w * 0.035));
      const rot = (env.st.spiral.rotate * Math.PI) / 180;
      const lam = env.root.value;
      const R = { x: pad, y: pad + 8, w: w - pad * 2, h: h - pad * 2 - 26 };

      // 铺砌时数列外框常常是竖长方形，左侧留出信息栏，画面才不空
      const infoW = env.st.spiral.mode === 'tiles' && R.w > 720 ? Math.min(320, R.w * 0.26) : 0;
      const A = { x: R.x + infoW, y: R.y, w: R.w - infoW, h: R.h };

      ctx.save();
      ctx.translate(A.x + A.w / 2, A.y + A.h / 2);
      ctx.rotate(rot);
      ctx.translate(-(A.x + A.w / 2), -(A.y + A.h / 2));

      if (env.st.spiral.mode === 'tiles') {
        // 取正的项作为边长
        const idx = [];
        for (let i = 0; i < env.count; i++) {
          const v = env.at(i);
          if (v === null) continue;
          const n = Number(U.bigAbs(v));
          if (!isFinite(n) || n <= 0) continue;
          idx.push({ i: i, s: n });
          if (idx.length > 22) break; // 再多就超出双精度/画布意义
        }
        const sizes = idx.map((d) => d.s);
        const sq = buildSquares(sizes);
        const shownF = U.clamp(env.cursorF, 1, sq.length - 0.001);
        const shown = Math.floor(shownF);
        const frac = U.easeInOut(shownF - shown);

        const bbox = (k) => {
          let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
          for (let i = 0; i <= k && i < sq.length; i++) {
            x0 = Math.min(x0, sq[i].x0); y0 = Math.min(y0, sq[i].y0);
            x1 = Math.max(x1, sq[i].x0 + sq[i].s); y1 = Math.max(y1, sq[i].y0 + sq[i].s);
          }
          return { x0: x0, y0: y0, x1: x1, y1: y1 };
        };
        // 缩放跟随“正在长出的那个正方形”，而不是提前跳到下一个（否则画面下方会空着）
        const b0 = bbox(Math.max(0, shown - 1)), b1 = bbox(shown);
        const B = {
          x0: U.lerp(b0.x0, b1.x0, frac), y0: U.lerp(b0.y0, b1.y0, frac),
          x1: U.lerp(b0.x1, b1.x1, frac), y1: U.lerp(b0.y1, b1.y1, frac),
        };
        const bw = Math.max(1e-6, B.x1 - B.x0), bh = Math.max(1e-6, B.y1 - B.y0);
        const sc = Math.min(A.w / bw, A.h / bh) * 0.94;
        const ox = A.x + A.w / 2 - ((B.x0 + B.x1) / 2) * sc;
        const oy = A.y + A.h / 2 + ((B.y0 + B.y1) / 2) * sc;
        const TX = (x) => ox + x * sc;
        const TY = (y) => oy - y * sc;

        // 供左侧信息栏使用的精确统计
        let sumSq = 0n, areaS = 0;
        for (let i = 0; i <= shown && i < idx.length; i++) {
          const v = env.at(idx[i].i);
          if (v !== null) sumSq += v * v;
          areaS += sizes[i] * sizes[i];
        }
        const lastI = idx[Math.min(shown, idx.length - 1)].i;
        const va = env.at(lastI), vb = env.at(lastI + 1);
        tileStats = {
          shown: shown, sumSq: sumSq, prod: va !== null && vb !== null ? va * vb : 0n,
          bw: bw, bh: bh, fill: areaS / Math.max(1e-9, bw * bh),
          xn: va === null ? 0n : va, xn1: vb === null ? 0n : vb,
          ratio: env.ratioAt(lastI),
          sizes: sizes.slice(0, shown + 1),
        };

        // 外框（恒等式的矩形）
        ctx.save();
        ctx.setLineDash([7, 6]);
        ctx.strokeStyle = U.rgba(P.a, 0.45);
        ctx.lineWidth = 1.4;
        ctx.strokeRect(TX(B.x0), TY(B.y1), bw * sc, bh * sc);
        ctx.restore();

        // 正方形
        for (let i = 0; i <= shown && i < sq.length; i++) {
          const s = sq[i];
          const grow = i === shown ? frac : 1;
          const full = s.s * sc;
          const ss = full * (i === shown ? U.lerp(0.25, 1, U.clamp(U.easeOutBack(grow), 0, 1.05)) : 1);
          const px = TX(s.x0) + (full - ss) / 2;
          const py = TY(s.y0 + s.s) + (full - ss) / 2;
          const t = sq.length <= 1 ? 0 : i / (sq.length - 1);
          const col = U.ramp(P, t, 60);
          ctx.save();
          ctx.globalAlpha = i === shown ? 0.35 + 0.65 * grow : 1;
          U.roundRect(ctx, px, py, ss, ss, Math.min(6, ss * 0.08));
          const g = ctx.createLinearGradient(px, py, px + ss, py + ss);
          g.addColorStop(0, U.rgba(col, 0.26));
          g.addColorStop(1, U.rgba(col, 0.07));
          ctx.fillStyle = g;
          ctx.fill();
          ctx.lineWidth = 1.3;
          ctx.strokeStyle = U.rgba(col, 0.85);
          ctx.stroke();
          ctx.restore();
          if (env.st.spiral.labels && ss > 30) {
            U.text(ctx, U.compactBig(env.at(idx[i].i) || 0n, 7), px + ss / 2, py + ss / 2, {
              size: Math.min(ss * 0.24, 24), color: U.rgba(P.text, 0.92), weight: 700, mono: true,
              align: 'center', baseline: 'middle',
            });
          }
        }

        // 圆弧螺旋
        if (env.st.spiral.arcs) {
          const pts = [];
          for (let i = 0; i <= shown && i < sq.length; i++) {
            const ap = arcPoints(sq[i], 26);
            const lim = i === shown ? Math.max(1, Math.floor(ap.length * frac)) : ap.length;
            for (let k = 0; k < lim; k++) pts.push({ x: TX(ap[k].x), y: TY(ap[k].y) });
          }
          if (pts.length > 2) {
            ctx.save();
            const g = ctx.createLinearGradient(A.x, A.y, A.x + A.w, A.y + A.h);
            g.addColorStop(0, P.b);
            g.addColorStop(0.55, P.c);
            g.addColorStop(1, P.a);
            ctx.strokeStyle = g;
            ctx.lineWidth = Math.max(2, Math.min(4.5, A.w / 260));
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.shadowColor = U.rgba(P.a, 0.6);
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);

      lines.forEach((s, i) => {

<script>
/* scripts/views/phyllotaxis.js */
/*
 * views/phyllotaxis.js —— 视图 5：叶序花盘
 * r = c·√n，θ = n·α。α 取黄金角 360°/φ² 时最均匀；稍微偏一点就出现辐射空隙。
 */
(function (root) {
  'use strict';
  const U = root.FIB.util;
  const SEQ = root.FIB.seq;

  /** x 的连分数渐近分数（分母 = 可见螺线数） */
  function convergents(x, maxQ) {
    const out = [];
    let frac = x - Math.floor(x);
    let p0 = 1, q0 = 0, p1 = Math.floor(x), q1 = 1;
    for (let i = 0; i < 24 && frac > 1e-13; i++) {
      const inv = 1 / frac;
      const ai = Math.floor(inv);
      frac = inv - ai;
      const p2 = ai * p1 + p0, q2 = ai * q1 + q0;
      p0 = p1; q0 = q1; p1 = p2; q1 = q2;
      if (q1 > maxQ) break;
      if (q1 >= 2) out.push({ p: p1, q: q1 });
    }
    return out;
  }

  /** 归一化最小间距（越大越均匀）：以 c 为单位 */
  function spacingIndex(angleDeg, N) {
    const a = (angleDeg * Math.PI) / 180;
    const from = Math.max(20, Math.floor(N * 0.45));
    const to = Math.min(N - 1, from + 180);
    let best = Infinity;
    for (let n = from; n <= to; n++) {
      const rn = Math.sqrt(n), tn = n * a;
      const xn = rn * Math.cos(tn), yn = rn * Math.sin(tn);
      for (let o = 1; o <= 45; o++) {
        const m = n + o;
        if (m > N) break;
        const rm = Math.sqrt(m), tm = m * a;
        const d = Math.hypot(rm * Math.cos(tm) - xn, rm * Math.sin(tm) - yn);
        if (d < best) best = d;
      }
    }
    return best;
  }

  let cacheGolden = { N: 0, v: 1 };

  root.FIB.registerView({
    id: 'phyllotaxis',
    name: '叶序花盘',
    badge: '05',
    desc:
      '向日葵、松果、菠萝把种子排在 r=c√n、θ=n·α 的螺线上。α 越“无理”，种子越不容易排成浪费空间的辐射线；' +
      'φ 是最难被有理数逼近的数，于是黄金角 137.507764° 给出最致密的堆积——顺/逆时针数出的螺线条数，' +
      '正是 φ 连分数渐近分数的分母：8、13、21、34。点“使用当前 λ”可以看变体（白银比等）的花盘。',
    controls: [
      { kind: 'slider', path: 'phyllo.n', label: '种子数', min: 120, max: 2400, step: 20 },
      { kind: 'slider', path: 'phyllo.angle', label: '发散角 α', min: 90, max: 180, step: 0.002, unit: '°', digits: 3, wide: true },
      {
        kind: 'buttons', label: '角度预设',
        options: [
          { label: '黄金角', act: (S) => { S.phyllo.angle = SEQ.GOLDEN_ANGLE; } },
          { label: '当前 λ', act: (S, env) => { const l = env.root.value; if (isFinite(l) && l > 0) S.phyllo.angle = U.clamp(360 / (l * l), 90, 180); } },
          { label: '137.4°', act: (S) => { S.phyllo.angle = 137.4; } },
          { label: '137.6°', act: (S) => { S.phyllo.angle = 137.6; } },
          { label: '99.5°', act: (S) => { S.phyllo.angle = 99.5; } },
          { label: '120°', act: (S) => { S.phyllo.angle = 120; } },
        ],
      },
      { kind: 'slider', path: 'phyllo.k', label: '高亮螺线数 k（0=关）', min: 0, max: 40, step: 1 },
      { kind: 'toggle', path: 'phyllo.grow', label: '随播放生长' },
      { kind: 'slider', path: 'phyllo.dot', label: '种子大小', min: 0.4, max: 1.8, step: 0.05, digits: 2 },
    ],
    stats: function (env) {
      const S = env.st.phyllo;
      const N = S.n;
      if (cacheGolden.N !== N) cacheGolden = { N: N, v: spacingIndex(SEQ.GOLDEN_ANGLE, N) };
      const si = spacingIndex(S.angle, N);
      const conv = convergents(S.angle / 360, 200);
      const qs = conv.slice(-3).map((c) => c.q);
      return [
        { label: '发散角', value: U.fixed(S.angle, 4) + '°' },
        { label: '与黄金角差', value: U.fixed(S.angle - SEQ.GOLDEN_ANGLE, 4) + '°' },
        { label: '均匀度', value: U.fixed((si / (cacheGolden.v || 1)) * 100, 1) + '%' },
        { label: '螺线条数', value: qs.length ? qs.join(' / ') : '—' },
      ];
    },
    draw: function (ctx, env) {
      const P = env.P, w = env.w, h = env.h;
      const S = env.st.phyllo;
      const pad = Math.max(16, Math.min(30, w * 0.02));
      const cxp = w / 2, cyp = pad + (h - pad * 2) / 2;
      const rad = Math.min(w - pad * 2, h - pad * 2) / 2;
      const N = S.n;
      const c = rad / Math.sqrt(N);
      const a = (S.angle * Math.PI) / 180;
      const shown = S.grow ? Math.max(3, Math.floor(N * U.clamp(env.progress, 0.02, 1))) : N;
      const spin = env.st.playing ? env.t * 0.04 : 0;
      const dotR = c * 0.66 * S.dot;
      const k = S.k | 0;

      // 高亮螺线（连线）
      if (k >= 2) {
        ctx.save();
        for (let s = 0; s < k; s++) {
          const pts = [];
          for (let n = s; n < shown; n += k) {
            const r = c * Math.sqrt(n), th = n * a + spin;
            pts.push({ x: cxp + r * Math.cos(th), y: cyp + r * Math.sin(th) });
          }
          U.polyline(ctx, pts, { color: U.ramp(P, s / k, 62), width: 1.3, alpha: 0.5 });
        }
        ctx.restore();
      }

      // 种子
      for (let n = 0; n < shown; n++) {
        const r = c * Math.sqrt(n), th = n * a + spin;
        const x = cxp + r * Math.cos(th), y = cyp + r * Math.sin(th);
        const t = k >= 2 ? (n % k) / k : n / Math.max(1, shown - 1);
        const col = U.ramp(P, t, k >= 2 ? 60 : U.lerp(46, 68, n / Math.max(1, shown - 1)));
        const age = shown - n;
        const grow = U.clamp(age / 24, 0.15, 1);
        ctx.beginPath();
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.94;
        ctx.arc(x, y, Math.max(0.6, dotR * grow), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 中心与最新种子
      if (shown < N) {
        const r = c * Math.sqrt(shown - 1), th = (shown - 1) * a + spin;
        U.dot(ctx, cxp + r * Math.cos(th), cyp + r * Math.sin(th), dotR * 1.5, P.a, 20);
      }

      // 角度指示
      ctx.save();
      ctx.strokeStyle = U.rgba(P.a, 0.5);
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(cxp, cyp);
      ctx.lineTo(cxp + rad * 0.99 * Math.cos(spin), cyp + rad * 0.99 * Math.sin(spin));
      ctx.moveTo(cxp, cyp);
      ctx.lineTo(cxp + rad * 0.99 * Math.cos(a + spin), cyp + rad * 0.99 * Math.sin(a + spin));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(cxp, cyp, rad * 0.16, spin, a + spin);
      ctx.strokeStyle = U.rgba(P.a, 0.9);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      U.text(ctx, 'α = ' + U.fixed(S.angle, 3) + '°', cxp + rad * 0.2 * Math.cos(a / 2 + spin), cyp + rad * 0.2 * Math.sin(a / 2 + spin), {
        size: 12.5, color: P.a, weight: 800, mono: true, baseline: 'middle',
      });

      // 左下信息
      const conv = convergents(S.angle / 360, 300);
      const qs = conv.slice(-4).map((cv) => cv.q);
      const info = [
        { s: 'α = ' + U.fixed(S.angle, 5) + '°', col: P.a },
        { s: '黄金角 = 360°/φ² = ' + U.fixed(SEQ.GOLDEN_ANGLE, 5) + '°', col: U.rgba(P.dim, 0.95) },
        { s: '渐近分母（螺线条数）：' + (qs.length ? qs.join(', ') : '—'), col: U.rgba(P.text, 0.85) },
      ];
      info.forEach((it, i) => {
        U.text(ctx, it.s, pad + 4, pad + 14 + i * 17, { size: 12, color: it.col, weight: 700, mono: i < 2, baseline: 'middle' });
      });

      // 右下均匀度条
      if (cacheGolden.N !== N) cacheGolden = { N: N, v: spacingIndex(SEQ.GOLDEN_ANGLE, N) };
      const si = spacingIndex(S.angle, N) / (cacheGolden.v || 1);
      const bw = Math.min(220, w * 0.24), bx = w - pad - bw, by = h - pad - 16;
      U.text(ctx, '堆积均匀度', bx, by - 12, { size: 11.5, color: U.rgba(P.dim, 0.95), weight: 600, baseline: 'middle' });
      ctx.save();
      U.roundRect(ctx, bx, by - 4, bw, 8, 4);
      ctx.fillStyle = U.rgba(P.text, 0.1);
      ctx.fill();
      const fw = bw * U.clamp(si, 0, 1.05);
      U.roundRect(ctx, bx, by - 4, Math.max(3, fw), 8, 4);
      ctx.fillStyle = si > 0.985 ? P.a : U.mix(P.c, P.a, U.clamp(si, 0, 1));
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();
      U.text(ctx, U.fixed(si * 100, 1) + '%', bx + bw, by - 12, {
        size: 12, color: si > 0.985 ? P.a : U.rgba(P.text, 0.9), weight: 800, mono: true, align: 'right', baseline: 'middle',
      });
    },
  });
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
/* scripts/views/numbertheory.js */
/*
 * views/numbertheory.js —— 视图 6：数论变体
 * 皮萨诺周期热力图 / 齐肯多夫表示 / 斐波那契字与分形 / 恒等式

(function (root) {
  'use strict';
  const U = root.FIB.util;
  const SEQ = root.FIB.seq;

  function bigGcd(a, b) {
    a = U.bigAbs(a); b = U.bigAbs(b);
    while (b) { const t = a % b; a = b; b = t; }
    return a;
  }

  /* ---------------- 皮萨诺周期 ---------------- */
  function drawPisano(ctx, env, R) {
    const P = env.P, S = env.st.nt;
    const mMax = S.modMax, cols = S.cols;
    const labL = 30, labR = 92;
    const gw = R.w - labL - labR;
    const rows = mMax - 1;
    const cw = gw / cols;
    const chh = Math.min(R.h / rows, cw * 2.1); // 允许竖向拉长以填满画面
    const gx = R.x + labL, gy = R.y + (R.h - chh * rows) / 2;

    U.text(ctx, 'n →', gx, gy - 10, { size: 11, color: U.rgba(P.dim, 0.9), weight: 600, mono: true, baseline: 'bottom' });
    U.text(ctx, 'x(n) mod m 的颜色 · 白圈 = 0（整除）', gx + gw, gy - 10, {
      size: 11, color: U.rgba(P.dim, 0.9), weight: 600, align: 'right', baseline: 'bottom',
    });

    for (let m = 2; m <= mMax; m++) {
      const row = m - 2;
      const y = gy + row * chh;
      const series = SEQ.modSeries(env.coef, env.seeds, env.order, m, cols);
      const per = SEQ.period(env.coef, env.seeds, env.order, m, 6000);
      U.text(ctx, String(m), R.x + labL - 6, y + chh / 2, {
        size: Math.min(12.5, chh * 0.6), color: U.rgba(P.text, 0.8), weight: 700, mono: true, align: 'right', baseline: 'middle',
      });
      for (let n = 0; n < cols; n++) {
        const v = series[n];
        const x = gx + n * cw;
        const t = m <= 1 ? 0 : v / m;
        ctx.fillStyle = v === 0 ? U.rgba(P.bg2, 0.9) : U.ramp(P, t, 40 + 26 * t, 0.95);
        ctx.fillRect(x + 0.5, y + 0.5, cw - 1, chh - 1);
        if (v === 0 && Math.min(cw, chh) > 6) {
          ctx.save();
          ctx.strokeStyle = U.rgba('#ffffff', 0.55);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x + cw / 2, y + chh / 2, Math.max(1.2, Math.min(cw, chh) * 0.22), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }
      // 周期标记
      if (per > 0 && per <= cols) {
        ctx.save();
        ctx.strokeStyle = U.rgba(P.a, 0.9);

      U.text(ctx, 'π(' + m + ') = ' + (per > 0 ? per : '>6000'), gx + gw + 8, y + chh / 2, {
        size: Math.min(12.5, chh * 0.58), color: per > 0 && per <= cols ? P.a : U.rgba(P.dim, 0.9),
        weight: 700, mono: true, baseline: 'middle',
      });
    }
    U.text(ctx, '任何模 m 下数列都必然循环（状态有限）；金线标出一个周期', R.x, R.y + R.h + 14, {
      size: 11.5, color: U.rgba(P.text, 0.78), weight: 600, baseline: 'middle',
    });
  }

  /* ---------------- 齐肯多夫 ---------------- */
  function drawZeck(ctx, env, R) {
    const P = env.P, S = env.st.nt;
    const N = S.zeckN;
    const z = SEQ.zeckendorf(N, env.terms);
    const topH = R.h * 0.32;

    // 大分解条
    const barY = R.y + 26, barH = Math.min(52, topH * 0.5);
    let x = R.x;
    const unit = R.w / Math.max(1, N);
    U.text(ctx, N + '  =  ' + (z.parts.length ? z.parts.map((p) => U.compactBig(p.value, 9)).join(' + ') : '—') +
      (z.remainder > 0n ? '  + 余 ' + z.remainder.toString() : ''), R.x, R.y + 10, {
      size: 15, color: P.text, weight: 800, mono: true, baseline: 'middle',
    });
    z.parts.forEach((p, i) => {
      const wpx = Number(p.value) * unit;
      const col = U.ramp(P, i / Math.max(1, z.parts.length - 1), 58);
      ctx.save();
      U.roundRect(ctx, x + 1, barY, Math.max(2, wpx - 2), barH, 6);
      const g = ctx.createLinearGradient(x, barY, x, barY + barH);
      g.addColorStop(0, U.rgba(col, 0.85));
      g.addColorStop(1, U.rgba(col, 0.45));
      ctx.fillStyle = g;
      ctx.shadowColor = U.rgba(col, 0.5); ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();
      if (wpx > 34) {
        U.text(ctx, U.compactBig(p.value, 7), x + wpx / 2, barY + barH / 2 - 5, {
          size: Math.min(14, wpx * 0.3), color: '#0b0f1a', weight: 800, mono: true, align: 'center', baseline: 'middle',
        });
        U.text(ctx, 'x' + U.sub(p.index), x + wpx / 2, barY + barH / 2 + 11, {
          size: 10.5, color: U.rgba('#0b0f1a', 0.75), weight: 700, mono: true, align: 'center', baseline: 'middle',
        });
