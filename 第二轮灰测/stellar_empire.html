<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星环帝国 · 银河大战略</title>
<style>
/* ============================================================
   星环帝国 STELLAR EMPIRE — 设计系统
   深空指挥中心风格：深蓝黑底 + 青 / 紫 / 琥珀 信息高光
   ============================================================ */
:root{
  --bg-0:#03060d; --bg-1:#060b16; --bg-2:#0a1020;
  --panel:rgba(9,16,30,.92); --panel-2:rgba(13,22,40,.92);
  --line:#1b2a44; --line-2:#27395a;
  --cyan:#3fe0e0; --cyan-d:#1b8f9a; --purple:#9d7bff; --amber:#ffb44d;
  --rose:#ff6b7d; --green:#57e39b; --blue:#5aa8ff;
  --tx:#cadcf5; --tx-2:#8ba3c4; --tx-3:#5d7291;
  --shadow:0 8px 30px rgba(0,0,0,.6);
  --r:8px; --r-s:5px;
  --fs:13.5px;
  --ff:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --ffm:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(120% 90% at 50% -10%,#0d1a33 0%,#05080f 55%,#02040a 100%);
  color:var(--tx);font-family:var(--ff);font-size:var(--fs);
  -webkit-font-smoothing:antialiased;user-select:none;line-height:1.45;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em;flex:none}
.ic.f{fill:currentColor;stroke:none}
#sprite{display:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#070c16}
::-webkit-scrollbar-thumb{background:#22344f;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#31496c}

/* ---------- 应用骨架：三层视觉层级 ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;display:block;cursor:grab}
#map.dragging{cursor:grabbing}

/* ---------- 顶部常驻状态栏 ---------- */
#topbar{
  position:relative;z-index:30;display:flex;align-items:center;gap:10px;
  height:54px;padding:0 12px;flex:none;
  background:linear-gradient(180deg,rgba(12,22,42,.97),rgba(6,11,22,.94));
  border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.5)
}
#brand{display:flex;align-items:center;gap:8px;padding-right:10px;border-right:1px solid var(--line);height:34px}
#brand .logo{width:24px;height:24px;color:var(--cyan);filter:drop-shadow(0 0 6px rgba(63,224,224,.55))}
#brand .txt{display:flex;flex-direction:column;line-height:1.05}
#brand b{font-size:14px;letter-spacing:.13em;color:#e8f4ff}
#brand small{font-size:9.5px;color:var(--tx-3);letter-spacing:.22em}
#empName{font-size:11px;color:var(--cyan);letter-spacing:.05em;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#resbar{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden}
.res{
  display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--r-s);
  background:rgba(8,15,28,.75);border:1px solid var(--line);min-width:0;white-space:nowrap;cursor:help
}
.res:hover{border-color:var(--line-2);background:rgba(16,28,50,.85)}
.res .ic{width:15px;height:15px}
.res .v{font-family:var(--ffm);font-size:13px;font-weight:600;letter-spacing:.02em}
.res .d{font-family:var(--ffm);font-size:10.5px;opacity:.92}
.res.energy{color:var(--amber)} .res.minerals{color:#c8a2ff}
.res.research{color:var(--cyan)} .res.influence{color:#7fd0ff} .res.pop{color:var(--green)}
.res .v{color:var(--tx)}
.d.up{color:var(--green)} .d.down{color:var(--rose)} .d.zero{color:var(--tx-3)}

#clockbox{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:var(--r-s);
  background:rgba(8,15,28,.75);border:1px solid var(--line);flex:none}
#stardate{font-family:var(--ffm);font-size:14px;color:var(--amber);letter-spacing:.06em;min-width:104px;text-align:center}
#stardate small{color:var(--tx-3);font-size:10px;letter-spacing:.1em}
.spd{display:flex;gap:2px}
.spd button{
  width:28px;height:26px;border:1px solid var(--line);background:rgba(10,18,34,.9);
  border-radius:4px;cursor:pointer;font-family:var(--ffm);font-size:11px;color:var(--tx-2);
  display:flex;align-items:center;justify-content:center;transition:.12s
}
.spd button:hover{border-color:var(--cyan-d);color:var(--cyan)}
.spd button.on{background:linear-gradient(180deg,#12405c,#0c2740);border-color:var(--cyan);color:#bff6ff;
  box-shadow:0 0 10px rgba(63,224,224,.3) inset}
.spd button.on.pause{background:linear-gradient(180deg,#5c3312,#40230c);border-color:var(--amber);color:#ffdca8;
  box-shadow:0 0 10px rgba(255,180,77,.25) inset}

#navbtns{display:flex;gap:5px;flex:none}
.nav{
  display:flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:var(--r-s);
  border:1px solid var(--line);background:rgba(10,18,34,.85);color:var(--tx-2);cursor:pointer;
  font-size:12px;transition:.12s;white-space:nowrap
}
.nav:hover{border-color:var(--cyan-d);color:#dff;background:rgba(16,32,54,.9);transform:translateY(-1px)}
.nav.hot{border-color:var(--amber);color:var(--amber);animation:pulseB 1.6s infinite}
.nav .ic{width:14px;height:14px}
@keyframes pulseB{0%,100%{box-shadow:0 0 0 rgba(255,180,77,0)}50%{box-shadow:0 0 12px rgba(255,180,77,.5)}}
.badge{background:var(--rose);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;font-family:var(--ffm)}

/* ---------- 侧边上下文面板 ---------- */
#sidebar{
  position:absolute;top:8px;right:8px;bottom:8px;width:352px;z-index:20;
  display:flex;flex-direction:column;gap:8px;pointer-events:none
}
#sidebar>*{pointer-events:auto}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);backdrop-filter:blur(7px);overflow:hidden;flex:none
}
.card.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#sidebar>.card{min-height:0}
.card.sec{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.card.sec>.body{max-height:min(46vh,420px)}
.card>h3{
  display:flex;align-items:center;gap:7px;padding:8px 11px;font-size:12.5px;font-weight:600;
  letter-spacing:.06em;color:#dff0ff;background:linear-gradient(90deg,rgba(30,60,95,.55),rgba(14,24,44,.2));
  border-bottom:1px solid var(--line)
}
.card>h3 .ic{width:15px;height:15px;color:var(--cyan)}
.card>h3 .sp{flex:1}
.card>h3 .tag{font-size:10px;color:var(--tx-3);letter-spacing:.1em;font-weight:400}
.body{padding:9px 11px;overflow-y:auto;overflow-x:hidden}
.card.grow .body{flex:1;min-height:0}
.xbtn{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);background:rgba(0,0,0,.25);
  color:var(--tx-3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.xbtn:hover{color:var(--rose);border-color:var(--rose)}

/* ---------- 通用组件 ---------- */
.row{display:flex;align-items:center;gap:7px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.kv{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;font-size:12px;border-bottom:1px dashed rgba(40,60,92,.45)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--ffm);font-weight:600;color:#e6f2ff}
.kv span{color:var(--tx-2)}
.muted{color:var(--tx-3)} .dim{color:var(--tx-2)}
.mono{font-family:var(--ffm)}
.cy{color:var(--cyan)} .am{color:var(--amber)} .pu{color:var(--purple)}
.gr{color:var(--green)} .ro{color:var(--rose)} .bl{color:var(--blue)}
.small{font-size:11px} .tiny{font-size:10px;letter-spacing:.04em}
hr.sep{border:0;border-top:1px solid var(--line);margin:8px 0}
.tt{margin:6px 0 4px;font-size:10.5px;letter-spacing:.14em;color:var(--tx-3);
  display:flex;align-items:center;gap:6px}
.tt:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 10px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(26,44,72,.95),rgba(13,23,42,.95));
  color:#d8e9ff;cursor:pointer;font-size:12px;transition:.13s;white-space:nowrap
}
.btn:hover:not(:disabled){border-color:var(--cyan);color:#eafcff;box-shadow:0 0 12px rgba(63,224,224,.2);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.65)}
.btn.pri{background:linear-gradient(180deg,#146070,#0b3444);border-color:var(--cyan-d);color:#c9fbff}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#1a7c8f,#0e4356)}
.btn.warn{background:linear-gradient(180deg,#6a3a12,#40230c);border-color:#a4691f;color:#ffd9a5}
.btn.warn:hover:not(:disabled){border-color:var(--amber)}
.btn.dang{background:linear-gradient(180deg,#6d2131,#41131e);border-color:#9c3346;color:#ffd0d8}
.btn.dang:hover:not(:disabled){border-color:var(--rose);box-shadow:0 0 12px rgba(255,107,125,.25)}
.btn.gho{background:rgba(10,18,32,.7);border-color:var(--line)}
.btn.full{width:100%}
.btn.sm{padding:4px 8px;font-size:11px}
.btn .ic{width:14px;height:14px}
.btn .cost{font-family:var(--ffm);font-size:10.5px;opacity:.9}
.btn .cost.no{color:var(--rose)}
.bar{height:6px;border-radius:4px;background:rgba(8,14,26,.9);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan-d),var(--cyan));transition:width .25s}
.bar.pu>i{background:linear-gradient(90deg,#5a3ca8,var(--purple))}
.bar.am>i{background:linear-gradient(90deg,#a06a15,var(--amber))}
.bar.gr>i{background:linear-gradient(90deg,#1f8a5a,var(--green))}
.bar.ro>i{background:linear-gradient(90deg,#8c2436,var(--rose))}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:10px;font-size:10.5px;
  border:1px solid var(--line-2);background:rgba(12,22,40,.8);color:var(--tx-2);white-space:nowrap}
.pill.cy{border-color:rgba(63,224,224,.5);color:var(--cyan);background:rgba(15,50,58,.5)}
.pill.am{border-color:rgba(255,180,77,.5);color:var(--amber);background:rgba(58,40,14,.5)}
.pill.ro{border-color:rgba(255,107,125,.5);color:var(--rose);background:rgba(58,18,26,.5)}
.pill.gr{border-color:rgba(87,227,155,.5);color:var(--green);background:rgba(14,50,34,.5)}
.pill.pu{border-color:rgba(157,123,255,.5);color:var(--purple);background:rgba(34,24,64,.5)}
.tile{
  border:1px solid var(--line);border-radius:var(--r-s);background:rgba(9,16,30,.72);
  padding:7px 9px;margin-bottom:6px;transition:.13s
}
.tile:hover{border-color:var(--line-2);background:rgba(16,28,50,.8)}
.tile.sel{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(63,224,224,.35) inset,0 0 14px rgba(63,224,224,.12)}
.tile.click{cursor:pointer}
.tile.dis{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.chip{display:flex;align-items:center;gap:4px;font-family:var(--ffm);font-size:11px;color:var(--tx-2)}
.chip .ic{width:12px;height:12px}

/* ---------- 左下：迷你地图 + 图例 ---------- */
#hudleft{position:absolute;left:8px;bottom:8px;z-index:18;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#minimapWrap{position:relative;border:1px solid var(--line);border-radius:var(--r-s);
  background:rgba(4,8,16,.85);box-shadow:var(--shadow);overflow:hidden}
#minimap{display:block;cursor:crosshair}
#legend{display:flex;flex-wrap:wrap;gap:4px 8px;max-width:246px;padding:6px 8px;border:1px solid var(--line);
  border-radius:var(--r-s);background:rgba(6,11,22,.86);font-size:10px;color:var(--tx-3);box-shadow:var(--shadow)}
#legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#legend span{white-space:nowrap}
#zoomctl{display:flex;gap:4px}
#zoomctl button{width:26px;height:24px;border:1px solid var(--line);background:rgba(8,14,26,.85);border-radius:4px;
  color:var(--tx-2);cursor:pointer;font-family:var(--ffm);font-size:12px}
#zoomctl button:hover{color:var(--cyan);border-color:var(--cyan-d)}

/* ---------- 底部事件日志 ---------- */
#logbar{
  position:absolute;left:8px;bottom:8px;z-index:16;width:min(430px,42vw);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(6px)
}
#logbar.up{bottom:8px}
#logbar h4{display:flex;align-items:center;gap:6px;padding:5px 9px;font-size:11px;letter-spacing:.1em;
  color:var(--tx-2);background:rgba(20,36,60,.5);border-bottom:1px solid var(--line);cursor:pointer}
#logbar h4 .ic{width:13px;height:13px;color:var(--cyan)}
#logList{max-height:132px;overflow-y:auto;padding:4px 0;transition:max-height .2s}
#logbar.min #logList{max-height:0;padding:0}
.logrow{display:flex;gap:7px;padding:2.5px 9px;font-size:11.5px;align-items:baseline}
.logrow:hover{background:rgba(30,50,80,.35)}
.logrow time{font-family:var(--ffm);font-size:10px;color:var(--tx-3);flex:none}
.logrow.war{color:#ffc2cb} .logrow.good{color:#b6f5d6} .logrow.tech{color:#bdf1ff}
.logrow.diplo{color:#d8c8ff} .logrow.evt{color:#ffe0b0}

/* ---------- 通知 toast ---------- */
#toasts{position:absolute;top:8px;right:372px;z-index:40;display:flex;flex-direction:column;gap:6px;
  align-items:flex-end;pointer-events:none;max-width:320px}
.toast{
  pointer-events:auto;display:flex;align-items:flex-start;gap:7px;padding:7px 10px;border-radius:var(--r-s);
  background:rgba(10,20,38,.95);border:1px solid var(--line-2);border-left:3px solid var(--cyan);
  box-shadow:var(--shadow);font-size:12px;animation:tin .22s ease-out;max-width:320px
}
.toast.w{border-left-color:var(--amber)} .toast.e{border-left-color:var(--rose)}
.toast.g{border-left-color:var(--green)} .toast.p{border-left-color:var(--purple)}
.toast.out{animation:tout .3s ease-in forwards}
.toast .ic{width:15px;height:15px;margin-top:1px;flex:none}
@keyframes tin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(26px)}}

/* ---------- 悬停提示 ---------- */
#tip{
  position:fixed;z-index:90;max-width:290px;padding:7px 10px;border-radius:var(--r-s);
  background:rgba(6,12,24,.97);border:1px solid var(--line-2);box-shadow:var(--shadow);
  font-size:11.5px;color:var(--tx);pointer-events:none;opacity:0;transition:opacity .1s;line-height:1.5
}
#tip.on{opacity:1}
#tip b{color:var(--cyan)} #tip .hd{font-size:12.5px;color:#e8f5ff;margin-bottom:3px;font-weight:600}
#tip .tiny{color:var(--tx-3)}

/* ---------- 模态层 ---------- */
#modals{position:fixed;inset:0;z-index:60;display:none}
#modals.on{display:block}
.scrim{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,rgba(6,14,30,.72),rgba(2,4,9,.9))}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(720px,94vw);max-height:92vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(12,22,42,.98),rgba(7,12,24,.98));
  border:1px solid var(--line-2);border-radius:11px;
  box-shadow:0 24px 70px rgba(0,0,0,.75),0 0 0 1px rgba(63,224,224,.08) inset;
  animation:min .2s ease-out
}
@keyframes min{from{opacity:0;transform:translate(-50%,-46%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal>header{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(30,62,98,.5),transparent)}
.modal>header .ic{width:19px;height:19px;color:var(--cyan)}
.modal>header h2{font-size:15.5px;font-weight:600;letter-spacing:.05em;color:#e9f6ff}
.modal>header .sub{font-size:11px;color:var(--tx-3);letter-spacing:.08em}
.modal .mbody{padding:13px 15px;overflow-y:auto;flex:1;min-height:0}
.modal>footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 15px;border-top:1px solid var(--line);
  background:rgba(5,10,20,.6);flex-wrap:wrap}
.modal.wide{width:min(1020px,96vw)}
.modal.slim{width:min(500px,94vw)}
input[type=text],input[type=number],textarea,select{
  background:rgba(4,9,18,.9);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:6px 9px;color:var(--tx);outline:none;font-family:var(--ffm);width:100%
}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(63,224,224,.14)}
textarea{resize:vertical;min-height:88px;font-size:11px;line-height:1.4}
label.fl{display:block;font-size:11px;color:var(--tx-3);letter-spacing:.1em;margin-bottom:4px}
.field{margin-bottom:11px}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt button{flex:1;min-width:78px;padding:7px 6px;border:1px solid var(--line);border-radius:var(--r-s);
  background:rgba(10,18,34,.8);color:var(--tx-2);cursor:pointer;font-size:12px;text-align:center;transition:.13s}
.opt button b{display:block;font-size:12.5px;color:#dceeff}
.opt button small{display:block;font-size:10px;color:var(--tx-3);margin-top:2px}
.opt button:hover{border-color:var(--cyan-d)}
.opt button.on{border-color:var(--cyan);background:linear-gradient(180deg,rgba(20,72,88,.9),rgba(10,36,50,.9));
  box-shadow:0 0 14px rgba(63,224,224,.16)}
.opt button.on b{color:#c8fbff}

/* 科技卡 / 事件选项 / 星球卡 */
.techcard{border:1px solid var(--line);border-radius:var(--r-s);padding:9px 10px;background:rgba(10,18,34,.75);
  cursor:pointer;transition:.13s;display:flex;flex-direction:column;gap:5px;height:100%}
.techcard:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.techcard .nm{font-size:13px;color:#e6f4ff;font-weight:600;display:flex;align-items:center;gap:6px}
.techcard .ds{font-size:11px;color:var(--tx-2);flex:1}
.techcard .ef{font-size:11px;color:var(--green);font-family:var(--ffm)}
.techcard.p{border-left:3px solid var(--blue)} .techcard.s{border-left:3px solid var(--amber)}
.techcard.e{border-left:3px solid var(--purple)}
.choice{display:block;width:100%;text-align:left;padding:9px 11px;margin-bottom:7px;border-radius:var(--r-s);
  border:1px solid var(--line-2);background:rgba(12,22,40,.8);cursor:pointer;transition:.13s}
.choice:hover{border-color:var(--cyan);background:rgba(18,36,60,.9);transform:translateX(3px)}
.choice b{display:block;color:#e4f3ff;font-size:12.5px;margin-bottom:2px}
.choice span{font-size:11px;color:var(--tx-2)}
.evtart{height:104px;border-radius:var(--r-s);border:1px solid var(--line);margin-bottom:11px;overflow:hidden;position:relative}
.evtart canvas{display:block;width:100%;height:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;font-size:10.5px;letter-spacing:.1em;color:var(--tx-3);padding:4px 6px;
  border-bottom:1px solid var(--line);font-weight:500}
table.tbl td{padding:4px 6px;border-bottom:1px dashed rgba(40,60,92,.4);font-family:var(--ffm);font-size:11.5px}
table.tbl tr:hover td{background:rgba(30,50,80,.3)}
.stat{display:flex;flex-direction:column;gap:1px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-s);
  background:rgba(9,16,30,.7)}
.stat b{font-family:var(--ffm);font-size:16px;color:#e9f6ff}
.stat span{font-size:10px;letter-spacing:.1em;color:var(--tx-3)}
.win-title{font-size:26px;letter-spacing:.16em;text-align:center;margin:4px 0 8px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--amber));-webkit-background-clip:text;
  background-clip:text;color:transparent;font-weight:700}
.lose-title{font-size:26px;letter-spacing:.16em;text-align:center;margin:4px 0 8px;color:var(--rose);font-weight:700}

/* 开屏标题 */
#splash .modal{width:min(760px,95vw)}
#splashTitle{text-align:center;padding:6px 0 2px}
#splashTitle h1{font-size:34px;letter-spacing:.32em;font-weight:700;
  background:linear-gradient(90deg,#4fe6ff,#9d7bff 55%,#ffb44d);-webkit-background-clip:text;background-clip:text;
  color:transparent;text-shadow:0 0 34px rgba(80,180,255,.18)}
#splashTitle p{font-size:11px;letter-spacing:.36em;color:var(--tx-3);margin-top:2px}
.seedrow{display:flex;gap:6px}
.seedrow input{flex:1}

/* 战斗视觉反馈 */
.flash{position:absolute;pointer-events:none;z-index:12}
#warnbanner{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:26;padding:5px 14px;
  border-radius:14px;background:rgba(60,12,22,.92);border:1px solid var(--rose);color:#ffd6dc;
  font-size:12px;letter-spacing:.1em;box-shadow:0 0 20px rgba(255,60,90,.25);display:none;align-items:center;gap:7px}
#warnbanner.on{display:flex}
#paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:14;pointer-events:none;
  font-size:54px;letter-spacing:.3em;color:rgba(160,200,240,.09);font-weight:700;display:none}
#paused.on{display:block}

/* 窄窗口自适应 */
@media (max-width:1400px){
  #sidebar{width:322px} #toasts{right:342px}
}
@media (max-width:1180px){
  :root{--fs:12.5px}
  #sidebar{width:296px} #toasts{right:312px;max-width:250px}
  #brand .txt{display:none} #logbar{width:min(340px,40vw)}
  .res{padding:3px 6px;gap:4px} .res .d{display:none} #legend{max-width:200px}
}
@media (max-width:980px){
  #sidebar{width:270px} #toasts{right:286px}
  #navbtns .nav span{display:none} #navbtns .nav{padding:0 7px}
  #minimapWrap{display:none} #logbar{width:min(300px,46vw)}
}
@media (max-height:640px){
  #logList{max-height:86px} #legend{display:none}
}

<script>
"use strict";
/* ================================================================================
   星环帝国 · STELLAR EMPIRE — 单文件银河大战略
   模块划分： Util / RNG / Names / Data / Galaxy / State / Econ / Sim
              Combat / EventSys / AI / Diplo / Victory / SaveSys
              Render / Minimap / UI / Panels / Modals / Input / Sfx / Game
   状态：全部游戏状态集中在 GameState(S) 中，可完整序列化 / 恢复。
   ================================================================================ */
/* ================================================================================
   1) UTIL —— 通用工具
   ================================================================================ */
const Util = {
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); },
  round(v, d) { const m = Math.pow(10, d || 0); return Math.round(v * m) / m; },
  /* 数值紧凑显示 */
  num(v) {
    const a = Math.abs(v);
    if (a >= 100000) return (v / 1000).toFixed(0) + 'k';
    if (a >= 10000) return (v / 1000).toFixed(1) + 'k';
    if (a >= 100) return Math.round(v).toString();
    if (a >= 10) return Util.round(v, 1).toString();
    return Util.round(v, 1).toString();
  },
  /* 带符号增减显示 */
  sgn(v, d) {
    const n = Util.round(v, d === undefined ? 1 : d);
    return (n > 0 ? '+' : n < 0 ? '' : '±') + (n === 0 ? '0' : n);
  },
  cls(v) { return v > 0.049 ? 'up' : v < -0.049 ? 'down' : 'zero'; },
  esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  },
  roman(n) { return ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'][n] || ('P' + n); },
  id(x) { return document.getElementById(x); },
  hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  },
  /* 月 -> 银河纪年字符串 */
  date(month) {
    const y = 2287 + Math.floor(month / 12), m = (month % 12) + 1;
    return y + '.' + (m < 10 ? '0' + m : m);
  },
  deepCopy(o) { return JSON.parse(JSON.stringify(o)); },
};
const $ = Util.id;

/* ================================================================================
   2) RNG —— 基于种子的可序列化伪随机数发生器（mulberry32）
   ================================================================================ */
function RNG(seed) { this.s = (seed >>> 0) || 1; }
RNG.prototype.next = function () {
  this.s = (this.s + 0x6D2B79F5) >>> 0;
  let t = this.s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
RNG.prototype.f = function (a, b) { return a + this.next() * (b - a); };
RNG.prototype.i = function (a, b) { return Math.floor(a + this.next() * (b - a + 1)); };
RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
RNG.prototype.chance = function (p) { return this.next() < p; };
RNG.prototype.shuffle = function (arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
};
/* 模拟期随机数：状态直接存放于 GameState.rng，保证存档可复现 */
const Rand = {
  next() {
    S.rng = (S.rng + 0x6D2B79F5) >>> 0;
    let t = S.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  f(a, b) { return a + Rand.next() * (b - a); },
  i(a, b) { return Math.floor(a + Rand.next() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Rand.next() * arr.length)]; },
  chance(p) { return Rand.next() < p; },
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Rand.next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  },
};

/* ================================================================================
   3) NAMES —— 原创程序化命名
   ================================================================================ */
const Names = {
  a: ['泽', '维', '卡', '赛', '诺', '伊', '塔', '罗', '米', '阿', '欧', '克', '法', '希', '乌', '涅', '珀', '斯', '忒', '律', '昴', '苍', '璇', '曜', '翎', '霄', '黯', '辉', '寂', '溯'],
  b: ['兰', '洛', '琳', '缇', '瑞', '纳', '登', '西', '菲', '尔', '恩', '隆', '蒙', '丝', '库', '珊', '冕', '岚', '垣', '枢', '渊', '璃', '穹', '砾', '澜', '晞'],
  c: ['', '', '', '', ' α', ' β', ' γ', ' δ', ' ε', ' ζ', ' η', ' θ', '之门', '星群', '星域', '裂隙', '哨环', '回廊', '眼', '之喉'],
  sys(rng, used) {
    for (let k = 0; k < 60; k++) {
      let n = rng.pick(Names.a) + rng.pick(Names.b) + rng.pick(Names.c);
      if (rng.chance(0.12)) n = n + '-' + rng.i(2, 97);
      if (!used[n]) { used[n] = 1; return n; }
    }
    return 'NX-' + rng.i(100, 999);
  },
  planet(sysName, idx) { return sysName + ' ' + Util.roman(idx); },
  fleet(rng, kind) {
    const w1 = ['第一', '第二', '第三', '第四', '第五', '第六', '第七', '第八', '第九', '锐锋', '暮鸦', '烈阳', '霜牙', '铁砧', '孤星', '雷幕', '蚀影'];
    const w2 = kind === 'sci' ? ['勘测队', '巡天队', '观测支队'] : kind === 'col' ? ['垦荒船团', '拓殖船队'] : ['舰队', '战斗群', '突击群', '远征军'];
    return rng.pick(w1) + w2[Math.floor(rng.next() * w2.length)];
  },
  empires: [
    { name: '昴垣霸权', adj: '昴垣', color: '#ff6b7d', p: 'militant' },
    { name: '维洛丝学派联合', adj: '维洛丝', color: '#7fd8ff', p: 'scholar' },
    { name: '砾环矿业财团', adj: '砾环', color: '#ffb44d', p: 'trader' },
    { name: '涅索净化教团', adj: '涅索', color: '#c46bff', p: 'zealot' },
    { name: '黯流游牧群', adj: '黯流', color: '#8de08a', p: 'expansionist' },
    { name: '寂垣观星议会', adj: '寂垣', color: '#9aa8ff', p: 'isolationist' },
    { name: '澜枢共治体', adj: '澜枢', color: '#5be5c0', p: 'trader' },
  ],
  playerDefault: ['苍穹共治体', '银枢联合星区', '曜岚元老院', '溯洄星盟', '晞光同盟'],
};
const PERSON = {
  militant:      { name: '好战', desc: '崇尚武力扩张，容易宣战，重视舰队。', warlike: 1.6, expand: 1.0, sci: .7, eco: .9, diplo: .6 },
  scholar:       { name: '学者', desc: '专注研究与勘测，倾向和平但技术领先。', warlike: .55, expand: .9, sci: 1.7, eco: 1.0, diplo: 1.2 },

/* ================================================================================
   6) GALAXY —— 程序化银河生成（种子可复现：旋臂布局 + 无交叉航道 + 连通性保证）
   ================================================================================ */
const GAL_SIZE = {
  small:  { n: 28, w: 1500, h: 1000, ai: 2, label: '边缘星区', desc: '28 星系 · 2 个对手' },
  medium: { n: 36, w: 1800, h: 1180, ai: 3, label: '猎户旋臂', desc: '36 星系 · 3 个对手' },
  large:  { n: 46, w: 2150, h: 1400, ai: 4, label: '银心穹隆', desc: '46 星系 · 4 个对手' },
};
const DIFFS = {
  easy:   { label: '拓荒者', mul: .78, aiEco: .8,  aiWar: .75, desc: 'AI 产能与侵略性较低' },
  normal: { label: '总督',   mul: 1,   aiEco: 1,   aiWar: 1,   desc: '标准平衡' },
  hard:   { label: '大元帅', mul: 1.25, aiEco: 1.3, aiWar: 1.35, desc: 'AI 产能 +30%，更早开战' },
};

const Galaxy = {
  /* 生成银河几何与内容，返回 {sys, lanes, pl, homes} */
  build(seed, sizeKey) {
    const cfg = GAL_SIZE[sizeKey] || GAL_SIZE.medium;
    const rng = new RNG(Util.hash('galaxy:' + seed + ':' + sizeKey));
    const W = cfg.w, H = cfg.h, N = cfg.n;
    const cx = W / 2, cy = H / 2;
    const arms = rng.i(3, 4), tight = rng.f(2.0, 2.9), maxR = Math.min(W, H) * .46;
    const pts = [];
    let guard = 0;
    while (pts.length < N && guard < N * 400) {
      guard++;
      let x, y;
      if (pts.length < 3 || rng.chance(.16)) {           /* 核心区散布 */
        const a = rng.f(0, Math.PI * 2), r = rng.f(0, maxR * .3);
        x = cx + Math.cos(a) * r * 1.35; y = cy + Math.sin(a) * r;
      } else {                                           /* 旋臂 */
        const arm = pts.length % arms, t = Math.pow(rng.f(.08, 1), .82);
        const ang = arm * (Math.PI * 2 / arms) + t * tight + rng.f(-.19, .19);
        const r = maxR * (.22 + t * .78);
        x = cx + Math.cos(ang) * r * 1.28 + rng.f(-34, 34);
        y = cy + Math.sin(ang) * r + rng.f(-30, 30);
      }
      x = Util.clamp(x, 70, W - 70); y = Util.clamp(y, 70, H - 70);
      let ok = true;
      const minD = guard > N * 120 ? 78 : 104;
      for (let i = 0; i < pts.length; i++) { if (Util.dist(x, y, pts[i].x, pts[i].y) < minD) { ok = false; break; } }
      if (ok) pts.push({ x: Math.round(x), y: Math.round(y) });
    }
    /* ---- 星系对象 ---- */
    const used = {}, sys = [];
    for (let i = 0; i < pts.length; i++) {
      const st = rng.pick(STARS);
      sys.push({
        id: i, name: Names.sys(rng, used), x: pts[i].x, y: pts[i].y,
        star: st.id, dep: { energy: 0, minerals: 0 },
        anomaly: 0, anomalyEv: '', anomalyDone: 0, hostile: 0, hostileName: '',
        planets: [], owner: -1, kn: [], lanes: [],
      });
    }
    /* ---- 航道：最小生成树保证连通 + 短程无交叉补边 ---- */
    const lanes = [], pairs = [];
    for (let i = 0; i < sys.length; i++) for (let j = i + 1; j < sys.length; j++) {
      const d = Util.dist(sys[i].x, sys[i].y, sys[j].x, sys[j].y);
      if (d < 460) pairs.push({ a: i, b: j, d: d });
    }
    pairs.sort((p, q) => p.d - q.d);
    const par = sys.map((_, i) => i);
    const find = a => { while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; };
    const uni = (a, b) => { const ra = find(a), rb = find(b); if (ra === rb) return false; par[ra] = rb; return true; };
    const cross = (a, b) => {
      const p1 = sys[a], p2 = sys[b];
      for (let k = 0; k < lanes.length; k++) {
        const q1 = sys[lanes[k].a], q2 = sys[lanes[k].b];
        if (lanes[k].a === a || lanes[k].a === b || lanes[k].b === a || lanes[k].b === b) continue;
        if (Galaxy.segInt(p1, p2, q1, q2)) return true;
      }
      return false;
    };
    const deg = sys.map(() => 0);
    const addLane = (a, b, d) => { lanes.push({ a: a, b: b, len: Math.round(d) }); deg[a]++; deg[b]++; sys[a].lanes.push(b); sys[b].lanes.push(a); };
    /* 1) 短程邻接补边（避免交叉、限制度数） */
    for (let k = 0; k < pairs.length; k++) {
      const p = pairs[k];
      if (p.d > 300) break;
      if (deg[p.a] >= 4 || deg[p.b] >= 4) continue;
      if (sys[p.a].lanes.indexOf(p.b) >= 0) continue;
      if (cross(p.a, p.b)) continue;
      addLane(p.a, p.b, p.d); uni(p.a, p.b);
    }
    /* 2) 连通性修补：按距离升序把不同连通分量连起来（允许长航道） */
    for (let k = 0; k < pairs.length; k++) {
      const p = pairs[k];
      if (sys[p.a].lanes.indexOf(p.b) >= 0) continue;
      if (uni(p.a, p.b)) addLane(p.a, p.b, p.d);
    }
    /* 3) 仍存在孤立分量（超出 460 距离限制）时，暴力连接最近点 */
    for (let i = 1; i < sys.length; i++) {
      if (find(i) === find(0)) continue;
      let best = -1, bd = 1e9;
      for (let j = 0; j < sys.length; j++) {
        if (find(j) !== find(0)) continue;
        const d = Util.dist(sys[i].x, sys[i].y, sys[j].x, sys[j].y);
        if (d < bd) { bd = d; best = j; }
      }
      if (best >= 0) { addLane(i, best, bd); uni(i, best); }
    }
    /* 4) 少量额外环路，避免树状僵硬地图 */
    let extra = Math.round(N * .18);
    for (let k = 0; k < pairs.length && extra > 0; k++) {
      const p = pairs[k];
      if (p.d < 150 || p.d > 340) continue;
      if (deg[p.a] >= 5 || deg[p.b] >= 5) continue;
      if (sys[p.a].lanes.indexOf(p.b) >= 0) continue;
      if (cross(p.a, p.b)) continue;
      addLane(p.a, p.b, p.d); extra--;
    }
    return { sys: sys, lanes: lanes, cfg: cfg, rng: rng, W: W, H: H };
  },
  segInt(p1, p2, q1, q2) {
    const d = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    const d1 = d(q1, q2, p1), d2 = d(q1, q2, p2), d3 = d(p1, p2, q1), d4 = d(p1, p2, q2);
    return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
  },
  /* 图上最短跳数 */
  bfs(from, sys) {
    const dist = new Array(sys.length).fill(-1);
    dist[from] = 0; const q = [from];
    for (let h = 0; h < q.length; h++) {
      const c = q[h];
      const ln = sys[c].lanes;
      for (let i = 0; i < ln.length; i++) if (dist[ln[i]] < 0) { dist[ln[i]] = dist[c] + 1; q.push(ln[i]); }
    }
    return dist;
  },
  /* Dijkstra：按航道长度求路径（返回星系 id 数组，含起点）
     avoidFor 为帝国 id 时，会为敌对舰队 / 敌国星系加上高额通行代价（仍保证可达） */
  path(from, to, avoidFor) {
    if (from === to) return [from];
    const n = S.sys.length, dist = new Array(n).fill(Infinity), prev = new Array(n).fill(-1), done = new Array(n).fill(false);
    const risk = new Array(n).fill(0);
    if (avoidFor !== undefined && avoidFor !== null) {
      for (let i = 0; i < n; i++) {
        if (i === to) continue;
        const sy = S.sys[i];
        if (Sim.fleetsAt(i, -1).length) risk[i] += 900;
        if (sy.owner >= 0 && sy.owner !== avoidFor && Diplo.atWar(avoidFor, sy.owner)) risk[i] += 700;
      }
    }
    dist[from] = 0;
    for (let it = 0; it < n; it++) {
      let u = -1, best = Infinity;
      for (let i = 0; i < n; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u < 0) break;
      if (u === to) break;
      done[u] = true;
      const ln = S.sys[u].lanes;
      for (let k = 0; k < ln.length; k++) {
        const v = ln[k], w = Util.dist(S.sys[u].x, S.sys[u].y, S.sys[v].x, S.sys[v].y) + risk[v];
        if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
      }
    }
    if (dist[to] === Infinity) return null;
    const out = [to];
    let c = to;
    while (prev[c] >= 0) { c = prev[c]; out.unshift(c); }
    return out;
  },
  /* 在指定星系生成敌对（掠夺者）舰队 */
  spawnHostile(sysId, tier, name) {
    const sy = S.sys[sysId];
    sy.hostile = Math.max(sy.hostile, 1);
    sy.hostileName = name || sy.hostileName || '掠夺者巢穴';
    const ships = [];
    const t = Util.clamp(tier || 1, 1, 6);
    for (let i = 0; i < 1 + t; i++) ships.push({ c: 'corv', hp: SHIPS.corv.hp });
    for (let i = 0; i < Math.floor(t / 1.5); i++) ships.push({ c: 'dest', hp: SHIPS.dest.hp });
    if (t >= 4) ships.push({ c: 'cruis', hp: SHIPS.cruis.hp });
    Sim.newFleet(-1, sysId, ships, sy.hostileName);
    return sysId;
  },
};

const V = { ver: 4, tipEl: null, cam: { x: 0, y: 0, z: .82 }, hover: null, dragging: false,
            fx: [], toasts: [], modal: null, sound: true, lastFrame: 0, acc: 0, dirty: true,
            bg: null, bgSeed: -1, needUI: true, laneHi: {}, mmScale: 1, mmOff: { x: 0, y: 0 } };

const State = {
  create(opts) {
    const seedNum = (opts.seed >>> 0) || 1;
    const g = Galaxy.build(seedNum, opts.size);
    const rng = g.rng;
    const st = {
      ver: V.ver, seed: seedNum, size: opts.size, diff: opts.diff,
      rng: Util.hash('sim:' + seedNum) >>> 0,
      month: 0, speed: 0, lastSpeed: 1,
      W: g.W, H: g.H,
      sys: g.sys, lanes: g.lanes, pl: [], fl: [], emp: [], diplo: {},
      queue: [], log: [], pending: [], over: null, nextFleet: 1,
      stats: { battles: 0, shipsLost: 0, shipsKilled: 0, colonized: 0, techs: 0, evts: 0, planetsTaken: 0 },
      offers: [], sel: null, autoSurvey: true,
    };
    S = st;
    /* ---- 帝国 ---- */
    const nAi = GAL_SIZE[opts.size].ai;
    const roster = rng.shuffle(Names.empires.slice());
    const mkEmp = (id, name, adj, color, person, isP) => ({
      id: id, name: name, adj: adj, color: color, person: person, isPlayer: !!isP, dead: false,
      res: { energy: 320, minerals: 340, research: 40, influence: 90 },
      bonus: { energy: 0, minerals: 0, research: 0, influence: 0 },
      timed: [], mods: {}, cap: -1, home: -1,
      tech: { done: [], cur: { phy: null, soc: null, eng: null }, prog: { phy: 0, soc: 0, eng: 0 }, choices: { phy: [], soc: [], eng: [] } },
      inc: { energy: 0, minerals: 0, research: 0, influence: 0, pop: 0 },
      ai: { survey: 0, colony: 0, war: 0, build: 0, target: -1, mood: 0 },
      warExh: 0, seenEmp: [],
    });
    st.emp.push(mkEmp(0, opts.empName || '苍穹共治体', (opts.empName || '苍穹').slice(0, 2), '#3fe0e0', 'scholar', true));
    for (let i = 0; i < nAi; i++) {
      const r = roster[i % roster.length];
      st.emp.push(mkEmp(i + 1, r.name, r.adj, r.color, r.p, false));
    }
    /* ---- 母星系选址：图距离尽量分散 ---- */
    const homes = State.pickHomes(st.sys, st.emp.length, rng);
    /* ---- 星系内容 ---- */
    for (let i = 0; i < st.sys.length; i++) {
      const sy = st.sys[i];
      sy.kn = new Array(st.emp.length).fill(0);
      const isHome = homes.indexOf(i) >= 0;
      const nP = isHome ? rng.i(3, 4) : rng.i(1, 3);
      for (let k = 0; k < nP; k++) {
        let t;
        if (isHome && k === 0) t = PTYPES[rng.chance(.5) ? 2 : 1];
        else t = State.rollType(rng, isHome);
        const hab = t.hab[0] + Math.round(rng.next() * (t.hab[1] - t.hab[0]));
        const pl = {
          id: st.pl.length, sys: i, name: Names.planet(sy.name, k + 1), type: t.id,
          size: rng.i(9, 20), hab: hab, owner: -1, pop: 0, popCap: 0, stab: 50,
          b: {}, cap: 0, autonomy: 0, siege: 0, siegeBy: -1, growth: 0,
          out: { energy: 0, minerals: 0, research: 0, influence: 0 },
        };
        st.pl.push(pl); sy.planets.push(pl.id);
      }
      if (isHome) { sy.dep.energy = rng.i(1, 3); sy.dep.minerals = rng.i(1, 3); continue; }
      /* 非母星系内容分布 */
      const roll = rng.next();
      if (roll < .24) {                       /* 资源星系 */
        sy.dep.energy = rng.i(2, 7); sy.dep.minerals = rng.i(2, 7);
        if (rng.chance(.5)) sy.dep.minerals += rng.i(2, 4); else sy.dep.energy += rng.i(2, 4);
      } else if (roll < .34) {                /* 富矿 + 异常 */
        sy.dep.minerals = rng.i(3, 8); sy.anomaly = 1;
      } else if (roll < .56) {                /* 异常现象 */
        sy.anomaly = 1; sy.dep.energy = rng.i(0, 3); sy.dep.minerals = rng.i(0, 3);
      } else if (roll < .72) {                /* 敌对据点 */
        sy.hostile = rng.i(1, 3); sy.hostileName = rng.pick(['掠夺者巢穴', '虚空游猎团', '锈甲舰群', '无标识哨站']);
        sy.dep.energy = rng.i(1, 5); sy.dep.minerals = rng.i(1, 5);
        if (rng.chance(.4)) sy.anomaly = 1;
      } else {                                /* 普通恒星系 */
        sy.dep.energy = rng.i(0, 2); sy.dep.minerals = rng.i(0, 2);
      }
      if (sy.anomaly) sy.anomalyEv = rng.pick(EVENTS.filter(e => e.kind === 'survey')).id;
    }
    /* 保证至少若干宜居星球分布在中距离 */
    State.ensureHabitable(st, homes, rng);
    /* 公平开局：每个文明在 3 跳内至少有 2 颗可殖民星球（宜居度 ≥ 42） */
    State.ensureNearbyHomes(st, homes, rng);
    /* ---- 建立首都 ---- */
    for (let e = 0; e < st.emp.length; e++) {
      const emp = st.emp[e], hs = homes[e], sy = st.sys[hs];
      emp.home = hs;
      let best = -1, bh = -1;
      sy.planets.forEach(pid => { if (st.pl[pid].hab > bh) { bh = st.pl[pid].hab; best = pid; } });
      const p = st.pl[best];
      p.owner = e; p.cap = 1; p.pop = 11; p.stab = 62;
      p.b = { fusion: 1, mine: 1, lab: 1, dock: 1, habitat: 1 };
      emp.cap = p.id;
      sy.owner = e; sy.hostile = 0; sy.anomaly = 0;
      /* 母星系及邻居可见 */
      State.reveal(e, hs, 2);
      sy.lanes.forEach(n => State.reveal(e, n, 1));
      /* 初始舰队 */
      const rn = new RNG(Util.hash('fl' + seedNum + e));
      Sim.newFleet(e, hs, [{ c: 'probe', hp: SHIPS.probe.hp }], Names.fleet(rn, 'sci'));
      Sim.newFleet(e, hs, [{ c: 'corv', hp: SHIPS.corv.hp }, { c: 'corv', hp: SHIPS.corv.hp }], Names.fleet(rn, 'war'));
      if (!emp.isPlayer) { const m = DIFFS[opts.diff].aiEco; emp.res.energy *= m; emp.res.minerals *= m; }
    }
    /* ---- 敌对据点守卫舰队 ---- */
    st.sys.forEach(sy => { if (sy.hostile > 0) Galaxy.spawnHostile(sy.id, sy.hostile, sy.hostileName); });
    /* ---- 外交初始化 ---- */
    for (let a = 0; a < st.emp.length; a++) for (let b = a + 1; b < st.emp.length; b++) {
      st.diplo[a + '-' + b] = { rel: rng.i(-8, 14), war: 0, nap: 0, trade: 0, truce: 0, met: 0, warStart: 0 };
    }
    /* ---- 科技候选 & 首次结算 ---- */
    st.emp.forEach(e => { Tech.roll(e, 'phy'); Tech.roll(e, 'soc'); Tech.roll(e, 'eng'); Econ.recalc(e); });
    st.emp.forEach(e => { if (!e.isPlayer) { Tech.aiPick(e); } });
    Sim.recalcAll();
    Log.add('帝国议会批准了「星环拓殖法案」。' + st.emp[0].name + '的首支勘测舰队已在' + st.sys[st.emp[0].home].name + '出发，自动勘测已开启（可在舰队面板关闭）。', 'good');
    Log.add('已探测到 ' + nAi + ' 个异族文明的广播信号，方位未知。', 'diplo');
    return st;
  },
  rollType(rng, isHome) {
    const r = rng.next();
    if (r < .12) return PTYPES[rng.i(1, 3)];        /* 宜居 */
    if (r < .22) return PTYPES[rng.i(4, 5)];        /* 中等 */
    if (r < .30) return PTYPES[0];                  /* 盖亚（稀有） */
    if (r < .55) return PTYPES[rng.i(6, 8)];        /* 恶劣 */
    if (r < .72) return PTYPES[9];                  /* 气态 */
    return PTYPES[10];                              /* 荒芜 */
  },
  ensureHabitable(st, homes, rng) {
    const target = Math.max(6, Math.round(st.sys.length * .34));
    const good = () => st.pl.filter(p => p.hab >= 40).length;
    let guard = 0;
    while (good() < target && guard < 400) {
      guard++;
      const sy = st.sys[rng.i(0, st.sys.length - 1)];
      if (homes.indexOf(sy.id) >= 0 || !sy.planets.length) continue;
      const p = st.pl[sy.planets[rng.i(0, sy.planets.length - 1)]];
      if (p.hab >= 40) continue;
      const t = PTYPES[rng.i(1, 5)];
      p.type = t.id; p.hab = t.hab[0] + Math.round(rng.next() * (t.hab[1] - t.hab[0]));
    }
  },
  ensureNearbyHomes(st, homes, rng) {
    homes.forEach((h, ei) => {
      const dist = Galaxy.bfs(h, st.sys);
      const near = [];
      for (let i = 0; i < st.sys.length; i++) {
        if (i === h || dist[i] < 0 || dist[i] > 3) continue;
        if (homes.indexOf(i) >= 0) continue;
        near.push(i);
      }
      const count = () => near.reduce((n, sid) => n + st.sys[sid].planets.filter(pid => st.pl[pid].hab >= 42).length, 0);
      let guard = 0;
      while (count() < 2 && guard < 40 && near.length) {
        guard++;
        const sid = near[Math.floor(rng.next() * near.length)];
        const sy = st.sys[sid];
        if (!sy.planets.length) continue;
        if (sy.hostile > 0 && rng.chance(.6)) { sy.hostile = 0; sy.hostileName = ''; }
        const pid = sy.planets[Math.floor(rng.next() * sy.planets.length)];
        const p = st.pl[pid];
        const t = PTYPES[rng.i(1, 4)];
        p.type = t.id;
        p.hab = Math.max(46, t.hab[0] + Math.round(rng.next() * (t.hab[1] - t.hab[0])));
        p.size = Math.max(p.size, rng.i(11, 18));
      }
    });
  },
  pickHomes(sys, count, rng) {
    let bestSet = null, bestScore = -1;
    for (let attempt = 0; attempt < 60; attempt++) {
      const start = rng.i(0, sys.length - 1);
      const set = [start];
      for (let c = 1; c < count; c++) {
        let cand = -1, cs = -1;
        for (let i = 0; i < sys.length; i++) {
          if (set.indexOf(i) >= 0) continue;
          if (sys[i].lanes.length < 2) continue;
          let mn = 1e9;
          for (let k = 0; k < set.length; k++) {
            const d = Galaxy.bfs(set[k], sys)[i];
            if (d >= 0 && d < mn) mn = d;
          }
          if (mn > cs) { cs = mn; cand = i; }
        }
        if (cand < 0) break;
        set.push(cand);
      }
      if (set.length < count) continue;
      let score = 1e9;
      for (let a = 0; a < set.length; a++) for (let b = a + 1; b < set.length; b++) {
        const d = Galaxy.bfs(set[a], sys)[set[b]];
        if (d < score) score = d;
      }
      if (score > bestScore) { bestScore = score; bestSet = set; }
      if (bestScore >= 5) break;
    }
    return bestSet || sys.slice(0, count).map(s => s.id);
  },
  /* 情报等级：0 未知 / 1 已知（坐标与恒星） / 2 已勘测（完整信息） */
  reveal(empId, sysId, level) {
    const sy = S.sys[sysId];
    if (!sy) return;
    if (!sy.kn) sy.kn = new Array(S.emp.length).fill(0);
    if ((sy.kn[empId] || 0) < level) sy.kn[empId] = level;
  },
  known(empId, sysId) { const sy = S.sys[sysId]; return sy && sy.kn ? (sy.kn[empId] || 0) : 0; },
};
/* ================================================================================
   8) LOG / TOAST —— 通讯记录与瞬时通知
   ================================================================================ */
const Log = {
  add(text, cls) {
    if (!S) return;
    S.log.push({ m: S.month, t: text, c: cls || '' });
    if (S.log.length > 240) S.log.splice(0, S.log.length - 240);
    V.logDirty = true;
  },
};
const Toast = {
  show(text, kind, icon) {
    const host = $('toasts');
    if (!host) return;
    const d = document.createElement('div');
    d.className = 'toast ' + (kind || '');
    d.innerHTML = '<svg class="ic"><use href="#i-' + (icon || 'info') + '"/></svg><div>' + Util.esc(text) + '</div>';
    host.appendChild(d);
    const kill = () => { d.classList.add('out'); setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 320); };
    setTimeout(kill, 4600);
    d.addEventListener('click', kill);
    while (host.children.length > 6) host.removeChild(host.firstChild);
  },
};

/* ================================================================================
   9) ECON —— 资源 / 修正 / 产出结算
   ================================================================================ */
const MOD_KEYS = ['energyMul', 'mineralMul', 'researchMul', 'influenceAdd', 'growth', 'habit', 'stab',
  'shipAtk', 'shipHp', 'shipDef', 'fleetSpd', 'survey', 'colonyCost', 'buildSpd', 'diplo',
  'upkeep', 'deposit', 'repair', 'trade', 'popCap', 'sight', 'energyFlat'];
const RES_KEYS = ['energy', 'minerals', 'research', 'influence'];

const Econ = {
  recalc(emp) {
    const m = {};
    MOD_KEYS.forEach(k => { m[k] = 0; });
    m.unlock = {};
    const apply = eff => {
      if (!eff) return;
      for (const k in eff) {
        if (k === 'unlock') { eff[k].forEach(u => { m.unlock[u] = 1; }); }
        else if (m[k] !== undefined) m[k] += eff[k];
      }
    };
    emp.tech.done.forEach(id => { if (TECHS[id]) apply(TECHS[id].eff); });
    emp.timed = (emp.timed || []).filter(t => t.until > S.month);
    emp.timed.forEach(t => { if (m[t.key] !== undefined) m[t.key] += t.val; });
    if (!emp.isPlayer) {
      const d = DIFFS[S.diff] || DIFFS.normal;
      m.energyMul += (d.aiEco - 1); m.mineralMul += (d.aiEco - 1); m.researchMul += (d.aiEco - 1) * .8;
    }
    m.upkeep = Math.max(-.6, m.upkeep);
    emp.mods = m;
    return m;
  },
  unlocked(emp, id) {
    const def = SHIPS[id] || BUILDINGS[id];
    if (!def || !def.tech) return true;
    return !!(emp.mods.unlock && emp.mods.unlock[id]) || emp.tech.done.indexOf(def.tech) >= 0;
  },
  give(empId, delta) {
    const e = S.emp[empId];
    if (!e) return;
    for (const k in delta) {
      if (e.res[k] === undefined) continue;
      e.res[k] = Math.max(0, e.res[k] + delta[k]);
    }
  },
  cost(empId, base, kind) {
    const e = S.emp[empId], out = {};
    let mul = 1;
    if (kind === 'colony') mul = Math.max(.3, 1 + e.mods.colonyCost);
    for (const k in base) out[k] = Math.round(base[k] * mul);
    return out;
  },
  can(empId, cost) {
    const e = S.emp[empId];
    for (const k in cost) if ((e.res[k] || 0) < cost[k] - 1e-6) return false;
    return true;
  },
  missing(empId, cost) {
    const e = S.emp[empId], out = [];
    for (const k in cost) if ((e.res[k] || 0) < cost[k] - 1e-6) out.push(RES_NAME[k] + ' 还缺 ' + Math.ceil(cost[k] - e.res[k]));
    return out;
  },
  pay(empId, cost) {
    if (!Econ.can(empId, cost)) return false;
    const e = S.emp[empId];
    for (const k in cost) e.res[k] -= cost[k];
    return true;
  },
  timed(empId, key, val, months) {
    const e = S.emp[empId];
    if (!e) return;
    e.timed.push({ key: key, val: val, until: S.month + months });
    Econ.recalc(e);
  },
  /* 星球人口上限 / 稳定目标 / 产出 */
  planetCalc(p, emp) {
    const m = emp.mods;
    const t = PT(p.type);
    const hab = Util.clamp(p.hab + m.habit, 0, 110);
    const lv = id => p.b[id] || 0;
    p.popCap = Math.max(3, Math.round((p.size * .34 + hab * .055 + (p.cap ? 4 : 0) + lv('habitat') * 4 + lv('ring') * 10 + m.popCap) * 10) / 10);
    let stabT = 50 + lv('admin') * 8 + lv('ring') * 10 + m.stab + (p.cap ? 8 : 0);
    const cols = S.pl.filter(x => x.owner === emp.id).length;
    stabT -= Math.max(0, cols - 4) * 3.2;
    stabT -= (emp.warExh || 0) * .8;
    if (hab < 40) stabT -= (40 - hab) * .35;
    p.stabT = Util.clamp(stabT, 5, 100);
    const stabF = Util.clamp(.5 + p.stab / 100 * .72, .35, 1.25);
    const auto = p.autonomy > S.month ? .8 : 1;
    let en = p.pop * .34 + lv('fusion') * 4 + lv('ring') * 6;
    let mi = p.pop * .3 + lv('mine') * 4 + lv('ring') * 6;
    let re = p.pop * .26 + lv('lab') * 3.4 + lv('ring') * 5;
    let inf = lv('admin') * .7;
    if (p.cap) { en += 2; mi += 2; re += 3; inf += 1; }
    if (t.id === 'gaia') { en += 1; re += 1; }
    p.out.energy = en * stabF * auto * (1 + m.energyMul);
    p.out.minerals = mi * stabF * auto * (1 + m.mineralMul);
    p.out.research = re * stabF * auto * (1 + m.researchMul);
    p.out.influence = inf * auto;
    p.use = lv('lab') * 1.2 + lv('admin') * .8 + lv('defense') * 1 + lv('dock') * 1;
    /* 所有殖民地都有基础轨道防御，首都更强：避免早期一支小舰队直接吞掉母星 */
    p.defMax = 70 + (p.cap ? 170 : 0) + lv('defense') * 240;
    p.defAtk = 7 + (p.cap ? 13 : 0) + lv('defense') * 28;
    if (p.dhp === undefined) p.dhp = p.defMax;
    p.dhp = Math.min(p.dhp, p.defMax);
    /* 人口增长（每月） */
    const room = p.popCap - p.pop;
    p.growth = room > 0
      ? (0.055 + lv('habitat') * .012) * Math.max(.15, p.pop) * Util.clamp(room / Math.max(3, p.popCap), 0, 1) * (0.55 + p.stab / 150) * (1 + m.growth) * .5
      : (room < -0.2 ? -0.05 : 0);
  },
  /* 帝国收支 */
  empireCalc(emp) {
    Econ.recalc(emp);
    const inc = { energy: 0, minerals: 0, research: 0, influence: 0, pop: 0 };
    let use = 0;
    const mine = [];
    S.pl.forEach(p => { if (p.owner === emp.id) mine.push(p); });
    mine.forEach(p => {
      Econ.planetCalc(p, emp);
      inc.energy += p.out.energy; inc.minerals += p.out.minerals;
      inc.research += p.out.research; inc.influence += p.out.influence;
      inc.pop += p.pop; use += p.use;
    });
    /* 疆域矿藏：拥有星系 100%，相邻无主星系 50% */
    let depE = 0, depM = 0;
    const ownSys = {};
    S.sys.forEach(sy => { if (sy.owner === emp.id) ownSys[sy.id] = 1; });
    S.sys.forEach(sy => {
      if (ownSys[sy.id]) { depE += sy.dep.energy; depM += sy.dep.minerals; return; }
      if (sy.owner >= 0) return;
      if (sy.hostile > 0) return;
      let adj = false;
      for (let i = 0; i < sy.lanes.length; i++) if (ownSys[sy.lanes[i]]) { adj = true; break; }
      if (adj) { depE += sy.dep.energy * .5; depM += sy.dep.minerals * .5; }
    });
    const dm = 1 + emp.mods.deposit;
    inc.energy += depE * dm * (1 + emp.mods.energyMul);
    inc.minerals += depM * dm * (1 + emp.mods.mineralMul);
    inc.energy += emp.bonus.energy + emp.mods.energyFlat;
    inc.minerals += emp.bonus.minerals;
    inc.research += emp.bonus.research * (1 + emp.mods.researchMul);
    inc.influence += 1 + emp.bonus.influence + emp.mods.influenceAdd - Math.max(0, mine.length - 1) * .22;
    /* 舰队维护 */
    let up = 0;
    S.fl.forEach(f => { if (f.owner === emp.id) f.ships.forEach(s => { up += SHIPS[s.c].upkeep; }); });
    up *= Math.max(.4, 1 + emp.mods.upkeep);
    emp.upkeepFleet = up; emp.upkeepBld = use; emp.depE = depE; emp.depM = depM;
    inc.energy -= up + use;
    emp.inc = inc;
    emp.colonies = mine.length;
    emp.power = Sim.empPower(emp.id);
    return inc;
  },
};
const RES_NAME = { energy: '能源', minerals: '矿物', research: '科研', influence: '影响力', pop: '人口' };
const RES_IC = { energy: 'i-energy', minerals: 'i-min', research: 'i-res', influence: 'i-inf', pop: 'i-pop' };
function PT(id) { for (let i = 0; i < PTYPES.length; i++) if (PTYPES[i].id === id) return PTYPES[i]; return PTYPES[10]; }
function ST(id) { for (let i = 0; i < STARS.length; i++) if (STARS[i].id === id) return STARS[i]; return STARS[0]; }

/* ================================================================================
   10) TECH —— 三大领域 / 随机候选 / 研究进度
   ================================================================================ */
const Tech = {
  fieldDone(emp, field) { return emp.tech.done.filter(id => TECHS[id] && TECHS[id].field === field).length; },
  maxTier(emp, field) {
    const n = Tech.fieldDone(emp, field);
    if (n >= 4) return 3;
    if (n >= 2) return 2;
    return 1;
  },
  avail(emp, field) {
    const out = [];
    const mt = Tech.maxTier(emp, field);
    for (const id in TECHS) {
      const t = TECHS[id];
      if (t.field !== field) continue;
      if (emp.tech.done.indexOf(id) >= 0) continue;
      if (t.tier === 4) {
        if (KEYSTONES.some(k => emp.tech.done.indexOf(k) < 0)) continue;
      } else {
        if (t.tier > mt) continue;
      }
      if (t.req.some(r => emp.tech.done.indexOf(r) < 0)) continue;
      out.push(id);
    }
    return out;
  },
  roll(emp, field) {
    const av = Tech.avail(emp, field);
    /* 终局科技一旦解锁必然出现在候选中 */
    const forced = av.filter(id => TECHS[id].tier === 4);
    const rest = av.filter(id => TECHS[id].tier !== 4);
    const rng = { next: Rand.next };
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Rand.next() * (i + 1)); const t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
    /* 低阶技术优先出现，保持前期节奏 */
    rest.sort((a, b) => (TECHS[a].tier - TECHS[b].tier) * .0001 + (Rand.next() - .5));
    emp.tech.choices[field] = forced.concat(rest).slice(0, 3);
    return emp.tech.choices[field];
  },
  start(empId, field, id) {
    const emp = S.emp[empId];
    if (!emp || !TECHS[id]) return false;
    if (emp.tech.choices[field].indexOf(id) < 0) return false;
    if (emp.tech.cur[field] === id) return false;
    emp.tech.cur[field] = id;
    emp.tech.prog[field] = emp.tech.prog[field] || 0;
    return true;
  },
  cost(emp, id) {
    const t = TECHS[id];
    const scale = 1 + Tech.fieldDone(emp, t.field) * .06;
    return Math.round(t.cost * scale * (DIFFS[S.diff] ? (emp.isPlayer ? 1 : 1 / DIFFS[S.diff].aiEco) : 1));
  },
  monthly(emp) {
    const P = Math.max(0, emp.inc.research);
    emp.res.research += P;
    const act = ['phy', 'soc', 'eng'].filter(f => emp.tech.cur[f]);
    if (!act.length) return;
    const bankOld = Math.max(0, emp.res.research - P);
    const share = P / act.length + (bankOld * .09) / act.length;
    act.forEach(f => {
      const id = emp.tech.cur[f];
      const need = Tech.cost(emp, id);
      const s = Math.min(share, need - emp.tech.prog[f], emp.res.research);
      if (s <= 0) return;
      emp.tech.prog[f] += s; emp.res.research -= s;
      if (emp.tech.prog[f] >= need - 1e-6) Tech.finish(emp, f, id);
    });
  },
  finish(emp, field, id) {
    emp.tech.done.push(id);
    emp.tech.cur[field] = null;
    emp.tech.prog[field] = 0;
    Econ.recalc(emp);
    Tech.roll(emp, field);
    if (emp.isPlayer) {
      S.stats.techs++;
      Log.add('研究完成：' + TECHS[id].name + '（' + FIELDS[field].name + '）—— ' + TECHS[id].desc, 'tech');
      Toast.show('研究完成：' + TECHS[id].name, 'p', 'tech');
      Sfx.play('tech');
      if (TECHS[id].tier === 4) Victory.trigger('tech', emp.id);
      if (TECHS[id].keystone) Log.add('奇点级技术突破！超验回廊的三分之一已经点亮。', 'tech');
    } else {
      if (TECHS[id].tier === 4) Victory.trigger('tech', emp.id);
      Tech.aiPick(emp);
    }
    if (S.pl.some(p => p.owner === emp.id)) Sim.recalcAll();
  },
  aiPick(emp) {
    const w = PERSON[emp.person];
    ['phy', 'soc', 'eng'].forEach(f => {
      if (emp.tech.cur[f]) return;
      let ch = emp.tech.choices[f];
      if (!ch || !ch.length) ch = Tech.roll(emp, f);
      if (!ch.length) return;
      let best = ch[0], bs = -1;
      ch.forEach(id => {
        const t = TECHS[id];
        let s = 1 + Rand.next() * .5;
        if (t.tier === 4) s += 10;
        if (t.eff.shipAtk || t.eff.shipHp || t.eff.shipDef) s += w.warlike * 1.1;
        if (t.eff.researchMul || t.eff.survey) s += w.sci * 1.0;
        if (t.eff.energyMul || t.eff.mineralMul || t.eff.deposit) s += w.eco * 1.0;
        if (t.eff.habit || t.eff.colonyCost || t.eff.growth) s += w.expand * 1.0;
        if (t.eff.diplo || t.eff.influenceAdd) s += w.diplo * .7;
        if (t.keystone) s += 3;
        if (s > bs) { bs = s; best = id; }
      });
      emp.tech.cur[f] = best;
    });
  },
};

/* ================================================================================
   11) SIM —— 舰队 / 建造队列 / 每月推进
   ================================================================================ */
const Sim = {
  newFleet(owner, sysId, ships, name) {
    const f = {
      id: S.nextFleet++, owner: owner, name: name || ('第' + S.nextFleet + '舰队'),
      ships: ships, sys: sysId, path: [], prog: 0, leg: 0, task: 'idle',
      survey: 0, surveyTarget: -1, auto: 0, retreat: 0,
    };
    /* 勘测舰默认开启「自动勘测」，可在舰队面板关闭 */
    if (ships.some(s => SHIPS[s.c] && SHIPS[s.c].role === 'sci')) f.auto = 1;
    S.fl.push(f);
    return f;
  },
  fleet(id) { for (let i = 0; i < S.fl.length; i++) if (S.fl[i].id === id) return S.fl[i]; return null; },
  fleetsAt(sysId, owner) {
    const out = [];
    for (let i = 0; i < S.fl.length; i++) {
      const f = S.fl[i];
      if (f.sys === sysId && !f.path.length && (owner === undefined || f.owner === owner)) out.push(f);
    }
    return out;
  },
  capital(empId) { const e = S.emp[empId]; return e && e.cap >= 0 ? S.pl[e.cap] : null; },
  has(f, role) { return f.ships.some(s => SHIPS[s.c].role === role); },
  count(f, role) { return f.ships.filter(s => SHIPS[s.c].role === role).length; },
  power(f) {
    let p = 0;
    const m = S.emp[f.owner] ? S.emp[f.owner].mods : null;
    f.ships.forEach(s => {
      const d = SHIPS[s.c];
      const atk = d.atk * (1 + (m ? m.shipAtk : 0));
      p += atk * 1.6 + s.hp * .5;
    });
    return Math.round(p);
  },
  empPower(empId) {
    let p = 0;
    S.fl.forEach(f => { if (f.owner === empId) p += Sim.power(f); });
    S.pl.forEach(pl => { if (pl.owner === empId) p += (pl.dhp || 0) * .4; });
    return Math.round(p);
  },
  fleetSpeed(f) {
    let mn = 9;
    f.ships.forEach(s => { mn = Math.min(mn, SHIPS[s.c].spd); });
    const m = S.emp[f.owner] ? S.emp[f.owner].mods : { fleetSpd: 0 };
    return mn * (1 + (m.fleetSpd || 0)) * LANE_SPEED;
  },
  fleetHp(f) { let a = 0, b = 0; f.ships.forEach(s => { a += s.hp; b += SHIPS[s.c].hp; }); return { cur: a, max: b }; },
  /* 下达移动命令 */
  order(f, target, avoid) {
    if (!f) return false;
    if (target === f.sys && !f.path.length) { f.task = 'idle'; return true; }
    const from = f.path.length ? f.path[0] : f.sys;
    const p = Galaxy.path(from, target, avoid ? f.owner : undefined);
    if (!p) return false;
    /* 已在航道中间：比较「折返回起点」与「先抵达下一站」两种方案，取更短者 */
    if (f.path.length > 1 && f.prog > 0) {
      const cur = f.path[0], nxt = f.path[1];
      const legLen = Util.dist(S.sys[cur].x, S.sys[cur].y, S.sys[nxt].x, S.sys[nxt].y) || 1;
      const av = avoid ? f.owner : undefined;
      const pa = Galaxy.path(cur, target, av), pb = Galaxy.path(nxt, target, av);
      const la = pa ? Sim.pathLen(pa) + f.prog : Infinity;                 /* 折返：先退回 cur */
      const lb = pb ? Sim.pathLen(pb) + (legLen - f.prog) : Infinity;      /* 继续：先抵达 nxt */
      if (!pa && !pb) return false;
      if (lb <= la) {
        /* 继续朝 nxt 前进：本段仍是 cur -> nxt，进度不变 */
        f.path = [nxt].concat(pb.slice(1));
        f.legFrom = cur; f.legTo = nxt;
      } else {
        /* 折返回 cur：本段视为 nxt -> cur，进度取镜像值 */
        f.path = pa;
        f.prog = legLen - f.prog;
        f.legFrom = nxt; f.legTo = cur;
      }
      f.rev = 1;
      f.pendingPath = 1;
      f.task = 'move';
      return true;
    }
    f.path = p; f.prog = 0; f.rev = 0; f.pendingPath = 0;
    f.task = p.length > 1 ? 'move' : 'idle';
    return true;
  },
  pathLen(p) { let l = 0; for (let i = 0; i + 1 < p.length; i++) l += Util.dist(S.sys[p[i]].x, S.sys[p[i]].y, S.sys[p[i + 1]].x, S.sys[p[i + 1]].y); return l; },
  /* 舰队图标相对于恒星的像素偏移（同星系多支舰队扇形散开，保证各自可点击） */
  iconOffset(f) {
    if (f.path.length > 1) return { x: 0, y: 0 };
    const st = V.stack && V.stack[f.id];
    const i = st ? st.i : 0, n = st ? Math.max(1, st.n) : 1;
    const r = 16;
    if (n === 1) return { x: r, y: -r * .55 };
    const a = -1.15 + (i / (n - 1)) * 2.3;
    return { x: Math.cos(a) * r * 1.05, y: Math.sin(a) * r * .95 };
  },
  /* 每帧构建同星系舰队堆叠索引（避免图标重合） */
  buildStacks() {
    const map = {}, groups = {};
    for (let i = 0; i < S.fl.length; i++) {
      const f = S.fl[i];
      if (f.path.length > 1) continue;
      const k = f.sys;
      if (!groups[k]) groups[k] = [];
      groups[k].push(f.id);
    }
    for (const k in groups) {
      const g = groups[k];
      for (let i = 0; i < g.length; i++) map[g[i]] = { i: i, n: g.length };
    }
    V.stack = map;
  },
  /* 舰队当前地图坐标（含航道插值） */
  pos(f) {
    if (!f.path.length || f.path.length < 2) { const s = S.sys[f.sys]; return { x: s.x, y: s.y }; }
    let a = S.sys[f.path[0]], b = S.sys[f.path[1]];
    if (f.rev && f.legFrom !== undefined && f.legTo !== undefined && f.pendingPath) { a = S.sys[f.legFrom]; b = S.sys[f.legTo]; }
    const len = Util.dist(a.x, a.y, b.x, b.y) || 1;
    const t = Util.clamp(f.prog / len, 0, 1);
    return { x: Util.lerp(a.x, b.x, t), y: Util.lerp(a.y, b.y, t) };
  },
  /* 连续推进（每帧）：舰队航行 + 勘测 */
  advance(dt) {
    for (let i = 0; i < S.fl.length; i++) {
      const f = S.fl[i];
      if (f.path.length > 1) {
        const spd = Sim.fleetSpeed(f) * dt;
        let a = S.sys[f.path[0]], b = S.sys[f.path[1]];
        if (f.rev && f.pendingPath && f.legFrom !== undefined) { a = S.sys[f.legFrom]; b = S.sys[f.legTo]; }
        const len = Util.dist(a.x, a.y, b.x, b.y) || 1;
        f.prog += spd;
        if (f.prog >= len) {
          f.prog = 0; f.rev = 0;
          if (f.pendingPath) { f.pendingPath = 0; f.sys = f.path[0]; }
          else { f.path.shift(); f.sys = f.path[0]; }
          Sim.arrive(f);
        }
      } else if (f.task === 'survey' && f.owner >= 0) {
        const sy = S.sys[f.sys];
        const m = S.emp[f.owner].mods;
        if (State.known(f.owner, f.sys) >= 2) { f.task = 'idle'; Sim.autoNextSurvey(f); }
        else {
          f.survey += dt * (1 + m.survey) * .55;
          if (f.survey >= 1) { f.survey = 0; Sim.completeSurvey(f); }
        }
      }
    }
  },
  arrive(f) {
    const sy = S.sys[f.sys];
    if (f.owner >= 0) {
      State.reveal(f.owner, f.sys, Math.max(1, State.known(f.owner, f.sys)));
      sy.lanes.forEach(n => State.reveal(f.owner, n, Math.max(1, State.known(f.owner, n))));
      if (f.path.length <= 1) {
        f.path = [];
        f.task = 'idle';
        if (Sim.has(f, 'sci') && State.known(f.owner, f.sys) < 2) f.task = 'survey';
      }
      if (f.owner === 0) {
        if (f.path.length === 0) {
          Sfx.play('arrive');
          if (sy.hostile > 0 && Sim.fleetsAt(f.sys, -1).length) Toast.show(f.name + ' 抵达 ' + sy.name + '，遭遇敌对势力！', 'e', 'war');
        }
      }
    } else if (f.path.length <= 1) { f.path = []; f.task = 'idle'; }
    Combat.check(f.sys);
  },
  completeSurvey(f) {
    const sy = S.sys[f.sys];
    State.reveal(f.owner, f.sys, 2);
    sy.lanes.forEach(n => State.reveal(f.owner, n, Math.max(1, State.known(f.owner, n))));
    const emp = S.emp[f.owner];
    if (emp.mods.sight) sy.lanes.forEach(n => S.sys[n].lanes.forEach(k => State.reveal(f.owner, k, Math.max(1, State.known(f.owner, k)))));
    if (f.owner === 0) {
      const hab = sy.planets.filter(pid => Sim.colonizable(S.pl[pid], emp)).length;
      Log.add('勘测完成：' + sy.name + (hab ? '，发现 ' + hab + ' 颗可殖民星球。' : '。'), 'good');
      Toast.show('勘测完成：' + sy.name, 'g', 'eye');
      Sfx.play('ping');
    }
    if (sy.anomaly && !sy.anomalyDone) {
      sy.anomalyDone = 1; sy.anomaly = 0;
      EventSys.fire(sy.anomalyEv || 'ev_ringwreck', { emp: f.owner, sysId: sy.id });
    }
    f.task = 'idle';
    Sim.autoNextSurvey(f);
    Combat.check(f.sys);
  },
  /* 每月维护：让开启自动勘测的舰队持续工作（含读档恢复后的状态） */
  autoTasks() {
    for (let i = 0; i < S.fl.length; i++) {
      const f = S.fl[i];
      if (f.owner < 0 || !f.auto || f.path.length || !Sim.has(f, 'sci')) continue;
      if (State.known(f.owner, f.sys) < 2) { f.task = 'survey'; continue; }
      if (f.task === 'survey') f.task = 'idle';
      Sim.autoNextSurvey(f);
    }
  },
  /* 勘测舰自动前往最近的未知星系 */
  autoNextSurvey(f) {
    if (!Sim.has(f, 'sci') || !f.auto) return;
    const t = Sim.nearestUnknown(f.owner, f.sys, true);
    if (t >= 0) { Sim.order(f, t, true); f.task = 'move'; f.surveyTarget = t; }
  },
  nearestUnknown(empId, from, safe) {
    const d = Galaxy.bfs(from, S.sys);
    let best = -1, bd = 1e9;
    for (let i = 0; i < S.sys.length; i++) {
      if (d[i] < 0) continue;
      if (State.known(empId, i) >= 2) continue;
      const sy = S.sys[i];
      if (safe && sy.hostile > 0 && Sim.fleetsAt(i, -1).length) continue;
      if (safe && sy.owner >= 0 && sy.owner !== empId && Diplo.atWar(empId, sy.owner)) continue;
      if (d[i] < bd) { bd = d[i]; best = i; }
    }
    return best;
  },
  colonizable(p, emp) {
    if (p.owner >= 0) return false;
    const hab = p.hab + (emp ? emp.mods.habit : 0);
    return hab >= 35;
  },
  /* 殖民：消耗舰队中的殖民船 */
  colonize(f, planetId) {
    const p = S.pl[planetId];
    const emp = S.emp[f.owner];
    if (!p || p.owner >= 0 || p.sys !== f.sys) return { ok: false, msg: '目标星球不可殖民。' };
    if (!Sim.colonizable(p, emp)) return { ok: false, msg: '该星球宜居度过低，需要基因适应工程等技术。' };
    const idx = f.ships.findIndex(s => s.c === 'colony');
    if (idx < 0) return { ok: false, msg: '该舰队没有殖民船。' };
    const sy = S.sys[f.sys];
    if (sy.owner >= 0 && sy.owner !== f.owner) return { ok: false, msg: '该星系已属于其他文明。' };
    if (Sim.fleetsAt(f.sys, -1).length) return { ok: false, msg: '必须先清除该星系的敌对舰队。' };
    f.ships.splice(idx, 1);
    if (!f.ships.length) Sim.removeFleet(f);
    p.owner = f.owner; p.pop = 2.2; p.stab = 48; p.b = {}; p.dhp = 0;
    sy.owner = f.owner;
    State.reveal(f.owner, f.sys, 2);
    S.stats.colonized += (f.owner === 0 ? 1 : 0);
    Sim.recalcAll();
    if (f.owner === 0) {
      Log.add('殖民地建立：' + p.name + '（' + PT(p.type).name + '，宜居度 ' + Math.round(p.hab) + '）', 'good');
      Toast.show('殖民地建立：' + p.name, 'g', 'planet');
      Sfx.play('colony');
    } else {
      if (State.known(0, f.sys) >= 1) Log.add(emp.name + '在' + sy.name + '建立了殖民地。', 'diplo');
    }
    Diplo.borderFriction(f.owner);
    return { ok: true };
  },
  removeFleet(f) {
    const i = S.fl.indexOf(f);
    if (i >= 0) S.fl.splice(i, 1);
    if (S.sel && S.sel.kind === 'fleet' && S.sel.id === f.id) S.sel = { kind: 'sys', id: f.sys };
  },
  damageFleet(f, dmg, wipe) {
    if (wipe) {
      const n = f.ships.length;
      if (f.owner === 0) S.stats.shipsLost += n;
      Sim.removeFleet(f);
      return n;
    }
    let left = dmg, lost = 0;
    while (left > 0 && f.ships.length) {
      const s = f.ships[0];
      if (s.hp <= left) { left -= s.hp; f.ships.shift(); lost++; }
      else { s.hp -= left; left = 0; }
    }
    if (!f.ships.length) Sim.removeFleet(f);
    return lost;
  },
  /* 合并同星系我方舰队 */
  merge(f) {
    const list = Sim.fleetsAt(f.sys, f.owner).filter(x => x !== f && !x.path.length);
    if (!list.length) return 0;
    let n = 0;
    list.forEach(o => { o.ships.forEach(s => f.ships.push(s)); n += o.ships.length; Sim.removeFleet(o); });
    f.task = 'idle';
    return n;
  },
  split(f) {
    if (f.ships.length < 2) return null;
    const half = Math.floor(f.ships.length / 2);
    const taken = f.ships.splice(0, half);
    const rn = new RNG(Util.hash('sp' + S.month + f.id));
    return Sim.newFleet(f.owner, f.sys, taken, Names.fleet(rn, 'war'));
  },
  /* 建造队列 */
  queueShip(empId, sysId, shipId) {
    const emp = S.emp[empId], def = SHIPS[shipId];
    if (!def) return { ok: false, msg: '未知舰船型号。' };
    if (!Econ.unlocked(emp, shipId)) return { ok: false, msg: '需要先完成对应科技。' };
    const sy = S.sys[sysId];
    if (!sy || sy.owner !== empId) return { ok: false, msg: '只能在自己的星系建造。' };
    const hasDock = sy.planets.some(pid => S.pl[pid].owner === empId && (S.pl[pid].b.dock || 0) > 0);
    if (!hasDock) return { ok: false, msg: '该星系没有轨道船坞。' };
    const cost = Econ.cost(empId, def.cost, shipId === 'colony' ? 'colony' : '');
    if (!Econ.can(empId, cost)) return { ok: false, msg: '资源不足：' + Econ.missing(empId, cost).join('、') };
    Econ.pay(empId, cost);
    S.queue.push({ emp: empId, sys: sysId, kind: 'ship', id: shipId, prog: 0, need: def.build, cost: cost });
    if (empId === 0) { Sfx.play('click2'); Toast.show('已下单：' + def.name, '', 'ship'); }
    return { ok: true };
  },
  queueBuilding(empId, planetId, bId) {
    const emp = S.emp[empId], def = BUILDINGS[bId], p = S.pl[planetId];
    if (!def || !p || p.owner !== empId) return { ok: false, msg: '无法在此建造。' };
    if (!Econ.unlocked(emp, bId)) return { ok: false, msg: '需要先完成「' + (TECHS[def.tech] ? TECHS[def.tech].name : '前置科技') + '」。' };
    const lv = p.b[bId] || 0;
    const inQ = S.queue.filter(q => q.kind === 'bld' && q.pl === planetId && q.id === bId).length;
    if (lv + inQ >= def.max) return { ok: false, msg: def.name + ' 已达最高等级。' };
    const cost = {};
    for (const k in def.cost) cost[k] = Math.round(def.cost[k] * (1 + (lv + inQ) * .75));
    if (!Econ.can(empId, cost)) return { ok: false, msg: '资源不足：' + Econ.missing(empId, cost).join('、') };
    Econ.pay(empId, cost);
    S.queue.push({ emp: empId, sys: p.sys, kind: 'bld', id: bId, pl: planetId, prog: 0, need: def.build, cost: cost });
    if (empId === 0) { Sfx.play('click2'); Toast.show('开始建造：' + def.name + ' ' + Util.roman(lv), '', 'build'); }
    return { ok: true };
  },
  cancelQueue(idx) {
    const q = S.queue[idx];
    if (!q) return;
    const back = {};
    for (const k in q.cost) back[k] = Math.round(q.cost[k] * .5);
    Econ.give(q.emp, back);
    S.queue.splice(idx, 1);
    if (q.emp === 0) Toast.show('已取消建造，返还 50% 资源。', 'w', 'x');
  },
  queueTick(emp) {
    const spd = 1 + emp.mods.buildSpd;
    for (let i = S.queue.length - 1; i >= 0; i--) {
      const q = S.queue[i];
      if (q.emp !== emp.id) continue;
      const sy = S.sys[q.sys];
      if (!sy || sy.owner !== emp.id) { S.queue.splice(i, 1); continue; }
      let local = 1;
      sy.planets.forEach(pid => { const p = S.pl[pid]; if (p.owner === emp.id && p.b.dock) local += p.b.dock * .3; });
      q.prog += spd * local;
      if (q.prog < q.need) continue;
      S.queue.splice(i, 1);
      if (q.kind === 'ship') {
        const def = SHIPS[q.id];
        const here = Sim.fleetsAt(q.sys, emp.id).filter(f => !f.path.length &&
          ((SHIPS[q.id].role === 'war' && Sim.has(f, 'war')) || (SHIPS[q.id].role !== 'war' && Sim.count(f, SHIPS[q.id].role) > 0 && f.ships.length < 6)));
        const hp = Math.round(def.hp * (1 + emp.mods.shipHp));
        if (here.length) here[0].ships.push({ c: q.id, hp: hp });
        else {
          const rn = new RNG(Util.hash('nf' + S.month + q.sys + emp.id + S.nextFleet));
          Sim.newFleet(emp.id, q.sys, [{ c: q.id, hp: hp }], Names.fleet(rn, def.role));
        }
        if (emp.id === 0) { Log.add(def.name + ' 在' + sy.name + '下线。', 'good'); Toast.show(def.name + ' 建造完成', 'g', 'ship'); Sfx.play('done'); }
      } else {
        const p = S.pl[q.pl];
        if (p && p.owner === emp.id) {
          p.b[q.id] = (p.b[q.id] || 0) + 1;
          if (q.id === 'defense') p.dhp = (p.b.defense || 1) * 240;
          if (emp.id === 0) { Log.add(p.name + '：' + BUILDINGS[q.id].name + ' ' + Util.roman(p.b[q.id] - 1) + ' 级建成。', 'good'); Toast.show(BUILDINGS[q.id].name + ' 建成', 'g', 'build'); Sfx.play('done'); }
        }
      }
      Sim.recalcAll();
    }
  },
  recalcAll() { S.emp.forEach(e => { if (!e.dead) Econ.empireCalc(e); }); },
  /* ============ 月度推进 ============ */
  month() {
    S.month++;
    const pEmp = S.emp[0];
    S.emp.forEach(emp => {
      if (emp.dead) return;
      Econ.empireCalc(emp);
      /* 资源结算 */
      RES_KEYS.forEach(k => {
        if (k === 'research') return;
        emp.res[k] = Math.max(0, emp.res[k] + emp.inc[k]);
      });
      if (emp.res.energy <= 0 && emp.inc.energy < 0) {
        emp.energyCrisis = (emp.energyCrisis || 0) + 1;
        if (emp.isPlayer && emp.energyCrisis % 6 === 1) {
          Toast.show('能源赤字！稳定度正在下降，请削减舰队或建造发电群。', 'e', 'alert');
          Log.add('警告：帝国能源储备耗尽，各殖民地开始限电。', 'war');
        }
      } else emp.energyCrisis = 0;
      Tech.monthly(emp);
      Sim.queueTick(emp);
      /* 星球每月变化 */
      S.pl.forEach(p => {
        if (p.owner !== emp.id) return;
        p.pop = Util.clamp(p.pop + p.growth, .5, p.popCap + .5);
        let st = p.stabT - (emp.energyCrisis ? 12 : 0);
        p.stab += Util.clamp(st - p.stab, -2.2, 1.8);
        p.stab = Util.clamp(p.stab, 0, 100);
        if (p.defMax > 0 && p.dhp < p.defMax) p.dhp = Math.min(p.defMax, p.dhp + p.defMax * .06);
      });
      /* 舰队修复 */
      if (emp.mods.repair > 0) {
        S.fl.forEach(f => {
          if (f.owner !== emp.id || f.path.length) return;
          const sy = S.sys[f.sys];
          if (sy.owner !== emp.id) return;
          f.ships.forEach(s => { s.hp = Math.min(Math.round(SHIPS[s.c].hp * (1 + emp.mods.shipHp)), s.hp + SHIPS[s.c].hp * .12); });
        });
      }
      emp.warExh = Math.max(0, (emp.warExh || 0) + (Diplo.wars(emp.id).length ? .35 : -.55));
    });
    /* 自动勘测维护 */
    Sim.autoTasks();
    /* 围城 / 占领 */
    Combat.sieges();
    /* AI 行动 */
    S.emp.forEach(emp => { if (!emp.dead && !emp.isPlayer) AI.month(emp); });
    Diplo.month();
    EventSys.month();
    Combat.scan();
    Victory.check();
    if (S.month % 12 === 0) SaveSys.auto();
    Sim.recalcAll();
    V.logDirty = true; V.needUI = true;
  },
};
/* ================================================================================
   12) COMBAT —— 舰队交战 / 轨道防御 / 围城占领
   ================================================================================ */
const STATION = { name: '轨道防御网', def: 7 };
const Combat = {
  hostile(a, b) {
    if (a === b) return false;
    if (a < 0 || b < 0) return true;
    return Diplo.atWar(a, b);
  },
  check(sysId) {
    const fl = Sim.fleetsAt(sysId).filter(f => f.ships.length);
    if (fl.length < 2) {
      /* 单方舰队 vs 轨道防御 */
      if (fl.length === 1) {
        const own = S.sys[sysId].owner;
        if (own >= 0 && Combat.hostile(fl[0].owner, own)) {
          const def = S.sys[sysId].planets.map(p => S.pl[p]).filter(p => p.owner === own && (p.dhp || 0) > 0);
          if (def.length) return Combat.resolve(sysId);
        }
      }
      return null;
    }
    for (let i = 0; i < fl.length; i++) for (let j = i + 1; j < fl.length; j++)
      if (Combat.hostile(fl[i].owner, fl[j].owner)) return Combat.resolve(sysId);
    const own = S.sys[sysId].owner;
    if (own >= 0 && fl.some(f => Combat.hostile(f.owner, own)) &&
        S.sys[sysId].planets.some(p => S.pl[p].owner === own && (S.pl[p].dhp || 0) > 0)) return Combat.resolve(sysId);
    return null;
  },
  scan() { for (let i = 0; i < S.sys.length; i++) Combat.check(i); },
  mkUnits(owners, sysId) {
    const out = [];
    S.fl.forEach(f => {
      if (owners.indexOf(f.owner) < 0 || f.sys !== sysId || f.path.length) return;
      const m = S.emp[f.owner] ? S.emp[f.owner].mods : { shipAtk: 0, shipDef: 0 };
      f.ships.forEach(s => {
        const d = SHIPS[s.c];
        out.push({ f: f, s: s, name: d.name, atk: d.atk * (1 + (m.shipAtk || 0)), def: d.def + (m.shipDef || 0), hp: s.hp, own: f.owner });
      });
    });
    S.sys[sysId].planets.forEach(pid => {
      const p = S.pl[pid];
      if (owners.indexOf(p.owner) < 0 || !(p.dhp > 0)) return;
      out.push({ p: p, name: STATION.name, atk: p.defAtk || 0, def: STATION.def, hp: p.dhp, own: p.owner, station: 1 });
    });
    return out;
  },
  resolve(sysId) {
    const sy = S.sys[sysId];
    const fl = Sim.fleetsAt(sysId).filter(f => f.ships.length);
    let A = null, B = null;
    /* 主战方 = 战力最高的一方 */
    const owners = [];
    fl.forEach(f => { if (owners.indexOf(f.owner) < 0) owners.push(f.owner); });
    if (sy.owner >= 0 && owners.indexOf(sy.owner) < 0 &&
        sy.planets.some(p => S.pl[p].owner === sy.owner && (S.pl[p].dhp || 0) > 0) &&
        owners.some(o => Combat.hostile(o, sy.owner))) owners.push(sy.owner);
    let pairFound = false;
    for (let i = 0; i < owners.length && !pairFound; i++)
      for (let j = i + 1; j < owners.length && !pairFound; j++)
        if (Combat.hostile(owners[i], owners[j])) { A = owners[i]; B = owners[j]; pairFound = true; }
    if (!pairFound) return null;
    if (Sim.empPower(B) > Sim.empPower(A)) { const t = A; A = B; B = t; }
    const sideA = [A], sideB = owners.filter(o => Combat.hostile(A, o));
    let ua = Combat.mkUnits(sideA, sysId), ub = Combat.mkUnits(sideB, sysId);
    if (!ua.length || !ub.length) return null;
    const startA = ua.length, startB = ub.length;
    const hp0A = ua.reduce((s, u) => s + u.hp, 0), hp0B = ub.reduce((s, u) => s + u.hp, 0);
    const volley = (att, dfn) => {
      const pend = new Array(dfn.length).fill(0);
      for (let i = 0; i < att.length; i++) {
        const u = att[i];
        if (u.hp <= 0 || u.atk <= 0) continue;
        const ti = Math.floor(Rand.next() * dfn.length);
        const t = dfn[ti];
        if (!t || t.hp <= 0) continue;
        const shot = u.atk * Rand.f(.84, 1.16);
        pend[ti] += Math.max(shot * .28, shot - t.def * 2.3);
      }
      for (let i = 0; i < dfn.length; i++) if (pend[i] > 0) dfn[i].hp -= pend[i];
    };
    let rounds = 0;
    const alive = arr => arr.filter(u => u.hp > 0);
    while (rounds < 16) {
      const sa = alive(ua), sb = alive(ub);
      if (!sa.length || !sb.length) break;
      rounds++;
      volley(sa, sb); volley(sb, sa);
      const ra = alive(ua).reduce((s, u) => s + u.hp, 0) / Math.max(1, hp0A);
      const rb = alive(ub).reduce((s, u) => s + u.hp, 0) / Math.max(1, hp0B);
      if (rounds >= 6 && (ra < .25 || rb < .25)) break;
    }
    /* 结算：把每个单位（含被击毁者）的结构值写回舰船 / 防御结构 */
    const lostA = startA - alive(ua).length;
    const lostB = startB - alive(ub).length;
    ua.concat(ub).forEach(u => {
      const v = Math.max(0, Math.round(u.hp));
      if (u.station) u.p.dhp = v; else u.s.hp = v;
    });
    /* 移除毁灭的舰船（hp<=0） */
    const cleanup = [];
    S.fl.forEach(f => {
      if (f.sys !== sysId || f.path.length) return;
      f.ships = f.ships.filter(s => s.hp > 0);
      if (!f.ships.length) cleanup.push(f);
    });
    cleanup.forEach(f => Sim.removeFleet(f));
    const aliveA = alive(ua).length, aliveB = alive(ub).length;
    const ratioA = alive(ua).reduce((s, u) => s + u.hp, 0) / Math.max(1, hp0A);
    const ratioB = alive(ub).reduce((s, u) => s + u.hp, 0) / Math.max(1, hp0B);
    const winner = (aliveA > 0 && aliveB === 0) ? A : (aliveB > 0 && aliveA === 0) ? sideB[0] : (ratioA >= ratioB ? A : sideB[0]);
    /* 败方撤退 */
    const loserSide = winner === A ? sideB : sideA;
    S.fl.slice().forEach(f => {
      if (loserSide.indexOf(f.owner) < 0 || f.sys !== sysId || f.path.length || !f.ships.length) return;
      if (f.owner < 0) { Sim.removeFleet(f); return; }
      const opts = sy.lanes.filter(n => {
        const t = S.sys[n];
        if (t.owner === f.owner) return true;
        if (t.owner >= 0 && Combat.hostile(f.owner, t.owner)) return false;
        return !Sim.fleetsAt(n).some(x => Combat.hostile(x.owner, f.owner));
      });
      if (opts.length) { Sim.order(f, opts[Math.floor(Rand.next() * opts.length)]); f.retreat = S.month; }
      else Sim.damageFleet(f, 0, true);
    });
    /* 统计 / 日志 */
    S.stats.battles++;
    const nm = id => id < 0 ? '掠夺者' : S.emp[id].name;
