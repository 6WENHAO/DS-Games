    cv.addEventListener('contextmenu', Input.rclick);
    cv.addEventListener('mouseleave', () => { V.hover = null; UI.tipHide(); });
    document.addEventListener('click', Input.click);
    document.addEventListener('mouseover', Input.over);
    document.addEventListener('mouseout', Input.out);
    document.addEventListener('keydown', Input.key);
    document.addEventListener('change', Input.change);
    window.addEventListener('resize', () => { Render.resize(); V.needUI = true; });
    document.addEventListener('visibilitychange', () => { V.lastFrame = 0; });
    const mm = $('minimap');
    if (mm) {
      mm.addEventListener('mousedown', ev => { Input.mmDrag = 1; Minimap.click(ev); ev.stopPropagation(); });
      mm.addEventListener('mousemove', ev => { if (Input.mmDrag) Minimap.click(ev); });
      window.addEventListener('mouseup', () => { Input.mmDrag = 0; });
    }
  },
  pick(mx, my) {
    if (!S) return null;
    let best = null, bd = 1e9;
    /* 先看星系（点击恒星本体永远选中星系） */
    const lim = Math.max(14, 17 * V.cam.z);
    for (let i = 0; i < S.sys.length; i++) {
      const sy = S.sys[i];
      const d = Util.dist(mx, my, Render.sx(sy.x), Render.sy(sy.y));
      if (d < lim && d < bd) { bd = d; best = { kind: 'sys', id: i }; }
    }
    /* 再看舰队图标：只有比星系更近时才夺取选中权 */
    const s = Util.clamp(V.cam.z, .6, 1.5);
    Sim.buildStacks();
    for (let i = 0; i < S.fl.length; i++) {
      const f = S.fl[i];
      if (f.owner !== 0 && State.known(0, f.sys) < 1) continue;
      const p = Sim.pos(f), io = Sim.iconOffset(f);
      const d = Util.dist(mx, my, Render.sx(p.x) + io.x * s, Render.sy(p.y) + io.y * s);
      if (d < 13 && d < bd) { bd = d; best = { kind: 'fleet', id: f.id }; }
    }
    return best;
  },
  local(ev) {
    const r = Render.cv.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  },
  down(ev) {
    if (ev.button !== 0) return;
    const p = Input.local(ev);
    Input.drag = { x: p.x, y: p.y, cx: V.cam.x, cy: V.cam.y, moved: 0 };
  },
  move(ev) {
    if (!S) return;
    const p = Input.local(ev);
    if (Input.drag) {
      const dx = p.x - Input.drag.x, dy = p.y - Input.drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) {
        Input.drag.moved = 1;
        Render.cv.classList.add('dragging');
        V.cam.x = Util.clamp(Input.drag.cx - dx / V.cam.z, -200, S.W + 200);
        V.cam.y = Util.clamp(Input.drag.cy - dy / V.cam.z, -200, S.H + 200);
        UI.tipHide();
      }
      return;
    }
    if (ev.target !== Render.cv) { if (V.hover !== null) { V.hover = null; } return; }
    const hit = Input.pick(p.x, p.y);
    V.hover = hit && hit.kind === 'sys' ? hit.id : (hit && hit.kind === 'fleet' ? (Sim.fleet(hit.id) || { sys: null }).sys : null);
    const key = hit ? hit.kind + hit.id : '';
    const now = performance.now();
    if (key !== Input.tipTarget || now - Input.lastTipT > 400) {
      Input.tipTarget = key; Input.lastTipT = now;
      if (!hit) UI.tipHide();
      else if (hit.kind === 'sys') UI.tip(UI.sysTip(S.sys[hit.id]), ev.clientX, ev.clientY);
      else {
        const f = Sim.fleet(hit.id);
        if (f) {
          const hp = Sim.fleetHp(f);
          UI.tip('<div class="hd">' + f.name + '</div><div class="tiny">' + (f.owner < 0 ? '掠夺者' : S.emp[f.owner].name) + '</div>' +
            '<div>' + UI.fleetComp(f) + '</div><div class="tiny">结构 ' + Math.round(hp.cur) + '/' + Math.round(hp.max) + ' · 战力 ' + Sim.power(f) + '</div>' +
            (f.owner === 0 ? '<div class="tiny" style="color:#5d7291">左键选中 · 选中后右键点击星系即可移动</div>' : ''), ev.clientX, ev.clientY);
        }
      }
    } else if (hit) UI.tip($('tip').innerHTML, ev.clientX, ev.clientY);
  },
  up(ev) {
    if (!Input.drag) return;
    const moved = Input.drag.moved;
    const p = Input.local(ev);
    Input.drag = null;
    Render.cv.classList.remove('dragging');
    if (moved || !S || ev.target !== Render.cv) return;
    const hit = Input.pick(p.x, p.y);
    if (!hit) { S.sel = null; V.needUI = true; return; }
    if (UI.moveMode) {
      const f = Sim.fleet(UI.moveMode);
      const target = hit.kind === 'sys' ? hit.id : (Sim.fleet(hit.id) || {}).sys;
      UI.moveMode = 0;
      if (f && target !== undefined) { Game.moveFleet(f, target); return; }
    }
    S.sel = hit;
    if (hit.kind === 'sys' && S.sys[hit.id].planets.length === 1 && State.known(0, hit.id) >= 2) { /* 单星球星系仍显示星系面板 */ }
    Sfx.play('click');
    V.needUI = true;
  },
  rclick(ev) {
    ev.preventDefault();
    if (!S) return;
    const p = Input.local(ev);
    const hit = Input.pick(p.x, p.y);
    if (!hit) return;
    const target = hit.kind === 'sys' ? hit.id : (Sim.fleet(hit.id) || {}).sys;
    if (target === undefined) return;
    let f = null;
    if (S.sel && S.sel.kind === 'fleet') f = Sim.fleet(S.sel.id);
    if (!f || f.owner !== 0) {
      const idle = S.fl.filter(x => x.owner === 0);
      if (!idle.length) { Toast.show('还没有任何舰队可供调动。', 'w', 'alert'); return; }
      f = idle[0];
      S.sel = { kind: 'fleet', id: f.id };
    }
    Game.moveFleet(f, target);
  },
  wheel(ev) {
    ev.preventDefault();
    if (!S) return;
    const p = Input.local(ev);
    const wx = Render.wx(p.x), wy = Render.wy(p.y);
    const f = ev.deltaY < 0 ? 1.14 : 1 / 1.14;
    V.cam.z = Util.clamp(V.cam.z * f, .34, 2.8);
    V.cam.x += wx - Render.wx(p.x);
    V.cam.y += wy - Render.wy(p.y);
  },
  click(ev) {
    let el = ev.target;
    while (el && el !== document.body) {
      if (el.getAttribute && el.getAttribute('data-act')) break;
      el = el.parentNode;
    }
    if (!el || !el.getAttribute || !el.getAttribute('data-act')) return;
    if (el.disabled) return;
    const act = el.getAttribute('data-act');
    ev.preventDefault();
    Game.act(act, el, ev);
  },
  over(ev) {
    const el = ev.target.closest ? ev.target.closest('[data-tip]') : null;
    if (!el) return;
    UI.tip(el.getAttribute('data-tip'), ev.clientX, ev.clientY);
  },
  out(ev) {
    const el = ev.target.closest ? ev.target.closest('[data-tip]') : null;
    if (el) UI.tipHide();
  },
  key(ev) {
    const tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
      if (ev.key === 'Enter' && V.modal === 'splash') Game.act('startGame');
      if (ev.key === 'Enter' && V.modal === 'rename') Game.act('renameOk', { getAttribute: () => String(UI.modalArg) });
      return;
    }
    if (!S) return;
    const k = ev.key;
    if (k === 'Escape') { if (UI.moveMode) { UI.moveMode = 0; V.needUI = true; } else UI.closeModal(); return; }
    if (V.modal === 'event') { const n = parseInt(k, 10); if (n >= 1 && n <= 3) Game.act('evtChoice', { getAttribute: () => String(n - 1) }); return; }
    if (k === ' ') { ev.preventDefault(); Game.setSpeed(S.speed > 0 ? 0 : (S.lastSpeed || 1)); return; }
    if (k === '1') return Game.setSpeed(1);
    if (k === '2') return Game.setSpeed(2);
    if (k === '3') return Game.setSpeed(4);
    const map = { t: 'tech', b: 'build', d: 'diplo', e: 'empire', s: 'save', h: 'help' };
    const low = k.toLowerCase();
    if (map[low]) { if (V.modal === map[low]) UI.closeModal(); else UI.openModal(map[low]); return; }
    if (low === 'f') return Game.focusHome();
    if (low === 'n') return Game.act('nextIdle');
    if (low === 'm') return Game.act('toggleSound');
  },
  change(ev) {
    if (ev.target && ev.target.id === 'impFile' && ev.target.files && ev.target.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        const r = SaveSys.loadText(String(fr.result));
        if (!r.ok) Toast.show(r.msg, 'e', 'alert');
      };
      fr.onerror = () => Toast.show('文件读取失败。', 'e', 'alert');
      fr.readAsText(ev.target.files[0]);
    }
  },
};

/* ================================================================================
   26) GAME —— 启动 / 主循环 / 行动派发
   ================================================================================ */
const Game = {
  started: false,
  boot() {
    Render.init();
    Minimap.init();
    Input.init();
    V.sound = true;
    UI.openModal('splash');
    requestAnimationFrame(Game.loop);
    if (String(location.hash || '').indexOf('selftest') >= 0) { setTimeout(SelfTest.run, 60); return; }
    if (String(location.hash || '').indexOf('audit') >= 0) { Audit.run(); return; }
    /* QA 截图钩子：#qa=map|tech|build|diplo|empire|save|help|event|over */
    const qa = /qa=([a-z]+)/.exec(String(location.hash || ''));
    if (qa) setTimeout(() => {
      if (qa[1] === 'loadauto') {
        const r = SaveSys.load('auto');
        document.title = 'LOADED ok=' + r.ok + (r.ok && S ? (' date=' + Util.date(S.month) + ' colonies=' + (S.emp[0].colonies || 0) +
          ' fleets=' + S.fl.filter(f => f.owner === 0).length + ' techs=' + S.emp[0].tech.done.length + ' sys=' + S.sys.length +
          ' emp=' + S.emp[0].name + ' seed=' + S.seed) : (' msg=' + r.msg));
        return;
      }
      Game.newGame({ seed: 20250821, size: 'medium', diff: 'normal', empName: '苍穹共治体' });
      const probe = S.fl.filter(f => f.owner === 0 && Sim.has(f, 'sci'))[0];
      if (probe) { probe.auto = 1; probe.task = 'survey'; }
      ['phy', 'soc', 'eng'].forEach(f => { if (S.emp[0].tech.choices[f].length) Tech.start(0, f, S.emp[0].tech.choices[f][0]); });
      for (let i = 0; i < 60; i++) { Sim.advance(1); Sim.month(); if (S.pending.length) EventSys.resolve(0); }
      const dock = AI.dockSys(0); if (dock >= 0) { Sim.queueShip(0, dock, 'colony'); Sim.queueShip(0, dock, 'dest'); }
      Game.setSpeed(0);
      S.sel = { kind: 'sys', id: S.emp[0].home };
      V.needUI = true; UI.renderAll();
      const k = qa[1];
      if (k === 'event') EventSys.fire('ev_ringwreck', { emp: 0, sysId: S.emp[0].home });
      else if (k === 'over') Victory.trigger('tech', 0);
      else if (k !== 'map') UI.openModal(k);
    }, 60);
  },
  parseSeed(txt) {
    const t = String(txt || '').trim();
    if (!t) return (Math.floor(Math.random() * 900000) + 100000);
    if (/^[0-9]{1,10}$/.test(t)) return (parseInt(t, 10) >>> 0) || 1;
    return Util.hash(t);
  },
  newGame(opts) {
    State.create(opts);
    S.frac = 0;
    Game.started = true;
    V.fx.length = 0; V.bgSeed = -1; V.logDirty = true;
    S.sel = { kind: 'sys', id: S.emp[0].home };
    UI.buildLegend();
    Render.resize();
    Game.focusHome();
    V.modal = null;
    $('modals').classList.remove('on');
    $('modalHost').innerHTML = '';
    UI.renderAll();
    Toast.show('远征开始！银河种子 ' + S.seed + '，请先派遣勘测舰探索周边星系。', 'g', 'play');
    Game.setSpeed(1);
    SaveSys.auto();
  },
  setSpeed(v) {
    if (!S) return;
    if (v > 0) S.lastSpeed = v;
    S.speed = v;
    V.needUI = true;
  },
  focusHome() {
    if (!S) return;
    const sy = S.sys[S.emp[0].home];
    V.cam.x = sy.x; V.cam.y = sy.y; V.cam.z = 1.05;
  },
  center(sysId) {
    const sy = S.sys[sysId];
    if (!sy) return;
    V.cam.x = sy.x; V.cam.y = sy.y;
    if (V.cam.z < .8) V.cam.z = 1;
  },
  moveFleet(f, target) {
    if (!f || f.owner !== 0) return;
    if (target === f.sys && !f.path.length) { Toast.show('舰队已在该星系。', 'w', 'info'); return; }
    const ok = Sim.order(f, target);
    if (!ok) { Toast.show('无法规划航线：目标星系不在航道网络中。', 'e', 'alert'); return; }
    V.laneHi = {};
    for (let i = 0; i + 1 < f.path.length; i++) V.laneHi[f.path[i] + '_' + f.path[i + 1]] = 1;
    setTimeout(() => { V.laneHi = {}; }, 1400);
    Toast.show(f.name + ' 前往 ' + S.sys[target].name + (State.known(0, target) ? '' : '（未知星域）'), '', 'fleet');
    Sfx.play('click2');
    V.needUI = true;
  },
  loop(now) {
    requestAnimationFrame(Game.loop);
    if (!V.lastFrame) V.lastFrame = now;
    let dtMs = now - V.lastFrame;
    V.lastFrame = now;
    if (!(dtMs > 0)) dtMs = 0;
    if (dtMs > 200) dtMs = 200;                    /* 后台标签页 / 卡顿保护：不产生时间跳跃 */
    if (S && Game.started && !S.over && S.speed > 0 && !S.pending.length) {
      if (S.frac === undefined) S.frac = 0;
      const perMonth = MONTH_MS / S.speed;
      let dtM = Math.min(.5, dtMs / perMonth);
      Sim.advance(dtM);
      S.frac += dtM;
      let guard = 0;
      while (S.frac >= 1 && guard < 3) { S.frac -= 1; Sim.month(); guard++; }
      if (S.frac >= 1) S.frac = 0;
    }
    Fx.step(dtMs / 1000);
    if (S) { Render.frame(now); Minimap.draw(); }
    if (S && (V.needUI || now - UI.lastUI > 720)) { UI.lastUI = now; UI.renderAll(); }
  },
  /* ---------- 行动派发（全部界面按钮的唯一入口） ---------- */
  act(name, el, ev) {
    const val = el && el.getAttribute ? el.getAttribute('data-v') : null;
    const num = val === null ? NaN : +val;
    switch (name) {
      case 'speed': Game.setSpeed(num); Sfx.play('click'); break;
      case 'zoom':
        if (num === 0) Game.focusHome();
        else V.cam.z = Util.clamp(V.cam.z * (num > 0 ? 1.25 : .8), .34, 2.8);
        break;
      case 'toggleLog': {
        const lb = $('logbar');
        lb.classList.toggle('min');
        $('logHint').textContent = lb.classList.contains('min') ? '点击展开' : '点击收起';
        break;
      }
      case 'toggleSound': {
        V.sound = !V.sound;
        Sfx.init();
        $('navSound').innerHTML = '<svg class="ic"><use href="#i-' + (V.sound ? 'sound' : 'mute') + '"/></svg>';
        Toast.show(V.sound ? '音效已开启' : '音效已静音', '', V.sound ? 'sound' : 'mute');
        if (V.sound) Sfx.play('ping');
        break;
      }
      case 'openTech': if (S.over) { UI.openModal('over'); break; } UI.openModal('tech'); break;
      case 'openBuild': UI.openModal('build'); break;
      case 'openBuildAt': UI.buildSys = num; UI.openModal('build'); break;
      case 'openDiplo': UI.openModal('diplo'); break;
      case 'openEmpire': if (S.over) UI.openModal('over'); else UI.openModal('empire'); break;
      case 'openSave': UI.openModal('save'); break;
      case 'openHelp': UI.openModal('help'); break;
      case 'close': UI.closeModal(); break;
      case 'scrim': UI.closeModal(); break;
      case 'viewGalaxy': UI.forceClose();
        Toast.show('点击右上角「帝国」可再次查看结算并重新开始。', '', 'info'); break;
      case 'restart': Game.started = false; UI.openModal('splash'); break;
      /* --- 新游戏设置 --- */
      case 'pickSize': UI.newOpts.size = val; UI.openModal('splash'); break;
      case 'pickDiff': UI.newOpts.diff = val; UI.openModal('splash'); break;
      case 'randomSeed': { const sd = $('inpSeed'); if (sd) sd.value = String(Math.floor(Math.random() * 900000) + 100000); break; }
      case 'startGame': {
        const nm = $('inpName'), sd = $('inpSeed');
        const name = nm && nm.value.trim() ? nm.value.trim().slice(0, 14) : '苍穹共治体';
        const seed = Game.parseSeed(sd ? sd.value : '');
        UI.newOpts.name = name;
        Sfx.init(); Sfx.play('done');
        Game.newGame({ seed: seed, size: UI.newOpts.size, diff: UI.newOpts.diff, empName: name });
        break;
      }
      /* --- 选择 --- */
      case 'selSys': S.sel = { kind: 'sys', id: num }; V.needUI = true; break;
      case 'selPlanet': S.sel = { kind: 'planet', id: num }; V.needUI = true; break;
      case 'selFleet': S.sel = { kind: 'fleet', id: num }; V.needUI = true; if (V.modal) UI.closeModal(); break;
      case 'centerSys': Game.center(num); S.sel = { kind: 'sys', id: num }; V.needUI = true; break;
      case 'focusHome': Game.focusHome(); S.sel = { kind: 'sys', id: S.emp[0].home }; V.needUI = true; break;
      case 'nextIdle': {
        const list = S.fl.filter(f => f.owner === 0 && !f.path.length);
        if (!list.length) { Toast.show('没有待命舰队。', 'w', 'info'); break; }
        UI.idleIdx = ((UI.idleIdx || 0) + 1) % list.length;
        const f = list[UI.idleIdx];
        S.sel = { kind: 'fleet', id: f.id };
        Game.center(f.sys);
        V.needUI = true;
        break;
      }
      /* --- 科研 --- */
      case 'techPick': {
        const f = el.getAttribute('data-f');
        const e = S.emp[0];
        if (e.tech.cur[f] && e.tech.cur[f] !== val) e.tech.prog[f] = 0;
        Tech.start(0, f, val);
        Sfx.play('click2');
        Toast.show('开始研究：' + TECHS[val].name, 'p', 'tech');
        Sim.recalcAll();
        UI.openModal('tech');
        break;
      }
      /* --- 建造 --- */
      case 'pickBuildSys': UI.buildSys = num; UI.openModal('build'); break;
      case 'buildShip': {
        const r = Sim.queueShip(0, UI.buildSys, val);
        if (!r.ok) Toast.show(r.msg, 'e', 'alert');
        Sim.recalcAll();
        UI.openModal('build');
        break;
      }
      case 'buildBld': {
        const pid = +el.getAttribute('data-pl');
        const r = Sim.queueBuilding(0, pid, val);
        if (!r.ok) Toast.show(r.msg, 'e', 'alert');
        Sim.recalcAll();
        V.needUI = true;
        if (V.modal) UI.openModal(V.modal);
        break;
      }
      case 'cancelQ': Sim.cancelQueue(num); Sim.recalcAll(); V.needUI = true; if (V.modal) UI.openModal(V.modal); break;
      /* --- 舰队 --- */
      case 'moveMode': UI.moveMode = UI.moveMode === num ? 0 : num; V.needUI = true;
        if (UI.moveMode) Toast.show('请点击目标星系下达移动命令（Esc 取消）。', '', 'fleet'); break;
      case 'survey': {
        const f = Sim.fleet(num);
        if (f) { f.task = 'survey'; Toast.show(f.name + ' 开始勘测 ' + S.sys[f.sys].name, '', 'eye'); V.needUI = true; }
        break;
      }
      case 'autoSurvey': {
        const f = Sim.fleet(num);
        if (f) {
          f.auto = f.auto ? 0 : 1;
          Toast.show(f.name + '：自动勘测' + (f.auto ? '已开启，将持续前往最近的未知星系' : '已关闭'), '', 'eye');
          if (f.auto && !f.path.length && State.known(0, f.sys) >= 2) Sim.autoNextSurvey(f);
          else if (f.auto && State.known(0, f.sys) < 2) f.task = 'survey';
          V.needUI = true;
        }
        break;
      }
      case 'colonize': {
        const fid = +el.getAttribute('data-f');
        const f = Sim.fleet(fid);
        if (!f) break;
        const r = Sim.colonize(f, num);
        if (!r.ok) Toast.show(r.msg, 'e', 'alert');
        else { S.sel = { kind: 'planet', id: num }; Fx.pulse(S.sys[S.pl[num].sys].x, S.sys[S.pl[num].sys].y, '#57e39b'); }
        V.needUI = true;
        break;
      }
      case 'mergeFleet': {
        const f = Sim.fleet(num);
        if (f) { const n = Sim.merge(f); Toast.show(n ? '已合并 ' + n + ' 艘舰船进入 ' + f.name : '附近没有可合并的舰队', n ? 'g' : 'w', 'fleet'); V.needUI = true; }
        break;
      }
      case 'splitFleet': {
        const f = Sim.fleet(num);
        if (f) { const nf = Sim.split(f); if (nf) { Toast.show('已分出新舰队：' + nf.name, 'g', 'fleet'); S.sel = { kind: 'fleet', id: nf.id }; } V.needUI = true; }
        break;
      }
      case 'homeFleet': { const f = Sim.fleet(num); if (f) Game.moveFleet(f, S.emp[0].home); break; }
      case 'renameFleet': UI.openModal('rename', num); break;
      case 'renameOk': {
        const f = Sim.fleet(+val);
        const inp = $('inpRename');
        if (f && inp && inp.value.trim()) f.name = inp.value.trim().slice(0, 16);
        V.modal = 'rename'; UI.closeModal(); V.needUI = true;
        break;
      }
      case 'sendNearest': {
        const list = S.fl.filter(f => f.owner === 0 && Sim.has(f, 'war'));
        const all = list.length ? list : S.fl.filter(f => f.owner === 0);
        if (!all.length) { Toast.show('没有可派遣的舰队。', 'w', 'alert'); break; }
        let best = null, bd = 1e9;
        all.forEach(f => {
          const d = Galaxy.bfs(f.path.length ? f.path[0] : f.sys, S.sys)[num];
          if (d >= 0 && d < bd) { bd = d; best = f; }
        });
        if (best) { S.sel = { kind: 'fleet', id: best.id }; Game.moveFleet(best, num); }
        break;
      }
      case 'sendProbe': {
        const probes = S.fl.filter(f => f.owner === 0 && Sim.has(f, 'sci'));
        if (!probes.length) { Toast.show('没有勘测舰。可在造舰面板建造「勘测舰」。', 'w', 'alert'); break; }
        let best = null, bd = 1e9;
        probes.forEach(f => {
          const d = Galaxy.bfs(f.path.length ? f.path[0] : f.sys, S.sys)[num];
          if (d >= 0 && d < bd) { bd = d; best = f; }
        });
        if (best) { S.sel = { kind: 'fleet', id: best.id }; best.surveyTarget = num; Game.moveFleet(best, num); }
        break;
      }
      /* --- 外交 --- */
      case 'diplo': {
        const t = el.getAttribute('data-t');
        const r = Diplo.act(t, num);
        Toast.show(r.msg || (r.ok ? '外交行动完成' : '外交行动失败'), r.ok ? 'g' : 'e', r.ok ? 'check' : 'alert');
        Sfx.play(r.ok ? (t === 'war' ? 'war' : 'done') : 'click2');
        Sim.recalcAll();
        UI.openModal('diplo');
        break;
      }
      case 'offerYes': Diplo.resolveOffer(num, true); UI.openModal('diplo'); V.needUI = true; break;
      case 'offerNo': Diplo.resolveOffer(num, false); UI.openModal('diplo'); V.needUI = true; break;
      /* --- 存档 --- */
      case 'saveSlot': SaveSys.save(val); UI.openModal('save'); break;
      case 'loadSlot': {
        const r = SaveSys.load(val);
        if (!r.ok) Toast.show(r.msg, 'e', 'alert');
        break;
      }
      case 'delSlot': SaveSys.del(val); UI.openModal('save'); break;
      case 'exportSave': SaveSys.exportFile(); break;
      case 'importText': {
        const t = $('impText');
        if (!t || !t.value.trim()) { Toast.show('请先粘贴存档 JSON 文本。', 'w', 'alert'); break; }
        const r = SaveSys.loadText(t.value.trim());
        if (!r.ok) Toast.show(r.msg, 'e', 'alert');
        break;
      }
      /* --- 事件 --- */
      case 'evtChoice': EventSys.resolve(num); break;
      default: break;
    }
  },
};

/* ================================================================================
   27) SELFTEST —— 内置无头自检（通过 #selftest 触发，用于验证核心系统）
   ================================================================================ */
const SelfTest = {
  out: [],
  log(name, ok, extra) { SelfTest.out.push((ok ? 'PASS' : 'FAIL') + ' · ' + name + (extra ? ' · ' + extra : '')); if (!ok) SelfTest.failed++; },
  run() {
    SelfTest.failed = 0;
    const hash = String(location.hash || '');
    const sd = /seed=([0-9]+)/.exec(hash), sz = /size=(small|medium|large)/.exec(hash), df = /diff=(easy|normal|hard)/.exec(hash);
    const months = (/months=([0-9]+)/.exec(hash) || [, '420'])[1] | 0;
    try {
      Game.newGame({ seed: sd ? (+sd[1]) : 424242, size: sz ? sz[1] : 'medium', diff: df ? df[1] : 'normal', empName: '自检联合体' });
      SelfTest.out.push('CONFIG seed=' + S.seed + ' size=' + S.size + ' diff=' + S.diff + ' months=' + months);
      SelfTest.log('银河生成 ' + S.sys.length + ' 星系 / ' + S.lanes.length + ' 航道', S.sys.length >= 28 && S.lanes.length >= S.sys.length - 1);
      const d = Galaxy.bfs(0, S.sys);
      SelfTest.log('星图连通性', d.every(x => x >= 0));
      SelfTest.log('宜居星球数量 ' + S.pl.filter(p => p.hab >= 40).length, S.pl.filter(p => p.hab >= 40).length >= 6);
      SelfTest.log('敌对据点 ' + S.sys.filter(s => s.hostile > 0).length + ' / 异常 ' + S.sys.filter(s => s.anomaly).length,
        S.sys.filter(s => s.hostile > 0).length > 0 && S.sys.filter(s => s.anomaly).length > 0);
      /* 快速模拟 240 个月 */
      const probe = S.fl.filter(f => f.owner === 0 && Sim.has(f, 'sci'))[0];
      if (probe) probe.auto = 1;
      Tech.start(0, 'phy', S.emp[0].tech.choices.phy[0]);
      Tech.start(0, 'soc', S.emp[0].tech.choices.soc[0]);
      Tech.start(0, 'eng', S.emp[0].tech.choices.eng[0]);
      let colonized = 0, built = 0;
      let colOrders = 0;
      for (let i = 0; i < months && !S.over; i++) {
        Sim.advance(1);
        Sim.month();
        if (S.pending.length) { EventSys.resolve(0); }
        /* 自动殖民 / 造船 / 建造，模拟玩家行为 */
        const colF = S.fl.filter(f => f.owner === 0 && Sim.has(f, 'col'))[0];
        if (colF && !colF.path.length) {
          const here = S.sys[colF.sys].planets.filter(pid => Sim.colonizable(S.pl[pid], S.emp[0]))[0];
          let done = false;
          if (here !== undefined) done = Sim.colonize(colF, here).ok;
          if (done) colonized++;
          else { const t = AI.bestColonyTarget(S.emp[0]); if (t >= 0 && S.pl[t].sys !== colF.sys) Sim.order(colF, S.pl[t].sys, true); }
        }
        if (i % 3 === 0) {
          const dock = AI.dockSys(S.emp[0]);
          if (dock >= 0) {
            const t = AI.bestColonyTarget(S.emp[0]);
            const hasCol = S.fl.some(f => f.owner === 0 && Sim.has(f, 'col')) || S.queue.some(q => q.emp === 0 && q.id === 'colony');
            if (t >= 0 && !hasCol) { if (Sim.queueShip(0, dock, 'colony').ok) colOrders++; }
            else if (i % 9 === 3) Sim.queueShip(0, dock, S.emp[0].res.minerals > 400 ? 'dest' : 'corv');
          }
        }
        /* 每 6 个月给现有殖民地补一栋经济建筑 */
        if (i % 6 === 2) {
          const mine = S.pl.filter(x => x.owner === 0);
          const p = mine[i % Math.max(1, mine.length)];
          if (p) ['habitat', 'mine', 'fusion', 'lab', 'dock'].some(bid => Sim.queueBuilding(0, p.id, bid).ok);
        }
        if (i % 7 === 5) { const p = S.pl.filter(x => x.owner === 0)[0]; if (p) { if (Sim.queueBuilding(0, p.id, i % 14 === 5 ? 'lab' : 'fusion').ok) built++; } }
        if (i === 14 || i === 40) { const cap = Sim.capital(0); if (cap) Sim.queueBuilding(0, cap.id, 'defense'); }
        if (i === 6 || i === 26) { const dk = AI.dockSys(S.emp[0]); if (dk >= 0) Sim.queueShip(0, dk, 'probe'); }
        S.fl.forEach(f => { if (f.owner === 0 && Sim.has(f, 'sci') && !f.auto) f.auto = 1; });
        /* 防守：把最强战斗舰队调往被围攻的星球 */
        if (i % 5 === 0) {
          const bes = S.pl.filter(p => p.owner === 0 && p.siege > 0)[0];
          const war = S.fl.filter(f => f.owner === 0 && Sim.has(f, 'war')).sort((a, b) => Sim.power(b) - Sim.power(a))[0];
          if (bes && war && !war.path.length && war.sys !== bes.sys) Sim.order(war, bes.sys);
          else if (war && !war.path.length && war.sys !== S.emp[0].home && !bes) Sim.order(war, S.emp[0].home);
        }
        ['phy', 'soc', 'eng'].forEach(f => { if (!S.emp[0].tech.cur[f] && S.emp[0].tech.choices[f].length) Tech.start(0, f, S.emp[0].tech.choices[f][0]); });
        if (i === 18 || i === 42 || i === 90) {
          const surveyed = S.sys.filter(s => State.known(0, s.id) >= 2).length;
          const tg = S.pl.filter(p => p.owner < 0 && State.known(0, p.sys) >= 2 && Sim.colonizable(p, S.emp[0]) && S.sys[p.sys].owner < 0 && !Sim.fleetsAt(p.sys, -1).length).length;
          SelfTest.out.push('DIAG m' + i + ' surveyed=' + surveyed + ' colonizableKnown=' + tg + ' best=' + AI.bestColonyTarget(S.emp[0]) +
            ' probes=' + S.fl.filter(f => f.owner === 0 && Sim.has(f, 'sci')).length + ' colFleets=' + S.fl.filter(f => f.owner === 0 && Sim.has(f, 'col')).length +
            ' colonies=' + S.pl.filter(p => p.owner === 0).length);
        }
      }
      const e = S.emp[0];
      SelfTest.log('时间推进至 ' + Util.date(S.month) + '（' + S.month + ' 月）', S.month >= 150 || !!S.over);
      SelfTest.log('资源结算（能源 ' + Math.round(e.res.energy) + ' 矿物 ' + Math.round(e.res.minerals) + '）', isFinite(e.res.energy) && isFinite(e.res.minerals) && e.res.energy >= 0);
      const knownTargets = S.pl.filter(p => p.owner < 0 && State.known(0, p.sys) >= 2 && Sim.colonizable(p, e) && S.sys[p.sys].owner < 0).length;
      SelfTest.log('殖民 ' + colonized + ' 次 / 殖民地 ' + e.colonies + '（殖民船下单 ' + colOrders + '，局末已知可殖民目标 ' + knownTargets + '）',
        colonized > 0 || (e.colonies || 0) > 1);
      SelfTest.log('科技完成 ' + e.tech.done.length + ' 项', e.tech.done.length >= 3);
      SelfTest.log('建造完成（建筑指令 ' + built + '）', built > 0);
      SelfTest.log('AI 扩张（对手殖民地 ' + S.emp.slice(1).map(x => x.colonies || 0).join('/') + '）', S.emp.slice(1).some(x => (x.colonies || 0) > 1 || x.dead));
      SelfTest.log('AI 科技（' + S.emp.slice(1).map(x => x.tech.done.length).join('/') + '）', S.emp.slice(1).some(x => x.tech.done.length >= 3));
      SelfTest.log('战斗系统（会战 ' + S.stats.battles + ' 次）', S.stats.battles > 0);
      SelfTest.log('事件系统（处理 ' + S.stats.evts + ' 次）', S.stats.evts > 0);
      SelfTest.log('外交接触 ' + S.emp.slice(1).filter(x => Diplo.met(0, x.id)).length + ' 个文明', S.emp.slice(1).some(x => Diplo.met(0, x.id)));
      /* 外交行动 */
      const target = S.emp.slice(1).filter(x => !x.dead && Diplo.met(0, x.id))[0];
      if (target) {
        const before = Diplo.get(0, target.id).rel;
        S.emp[0].res.influence += 500;
        const r = Diplo.act('improve', target.id);
        SelfTest.log('外交行动改善关系 ' + Math.round(before) + '→' + Math.round(Diplo.get(0, target.id).rel), r.ok && Diplo.get(0, target.id).rel > before);
        const wr = Diplo.act('war', target.id);
        SelfTest.log('宣战生效', Diplo.atWar(0, target.id));
        S.emp[0].res.influence += 500;
        Diplo.get(0, target.id).rel = 0;
        S.emp[target.id].warExh = 40;
        Diplo.act('peace', target.id);
        SelfTest.log('停战流程可执行', true, Diplo.atWar(0, target.id) ? '对方拒绝（合法结果）' : '已停战');
      }
      /* 战斗强制验证 */
      const enemy = S.emp.slice(1).filter(x => !x.dead)[0];
      if (enemy) {
        const g = Diplo.get(0, enemy.id); g.war = 1; g.met = 1;
        const sysId = S.emp[0].home;
        Sim.newFleet(enemy.id, sysId, [{ c: 'corv', hp: 62 }, { c: 'corv', hp: 62 }], '自检敌舰队');
        Sim.newFleet(0, sysId, [{ c: 'dest', hp: 140 }, { c: 'dest', hp: 140 }], '自检我方舰队');
        const b0 = S.stats.battles;
        Combat.check(sysId);
        SelfTest.log('强制交战解算', S.stats.battles > b0);
      }
      /* 航行与中途改道：位置必须连续（不能瞬移），且最终抵达目标 */
      const mv = Sim.newFleet(0, S.emp[0].home, [{ c: 'corv', hp: 62 }], '自检机动舰队');
      const far = (() => {
        const d = Galaxy.bfs(mv.sys, S.sys);
        let best = -1, bd = 0;
        for (let i = 0; i < S.sys.length; i++) if (d[i] > bd && d[i] < 90) { bd = d[i]; best = i; }
        return best;
      })();
      if (far >= 0) {
        SelfTest.log('长距离航线规划（' + Galaxy.bfs(mv.sys, S.sys)[far] + ' 跳）', Sim.order(mv, far) && mv.path.length > 1, '路径 ' + mv.path.length + ' 节点');
        for (let k = 0; k < 3; k++) Sim.advance(.35);
        const p1 = Sim.pos(mv);
        const alt = S.sys[mv.path[0]].lanes.filter(n => n !== (mv.path[1] === undefined ? -1 : mv.path[1]))[0];
        const target2 = alt !== undefined ? alt : far;
        Sim.order(mv, target2);
        const p2 = Sim.pos(mv);
        const jump = Util.dist(p1.x, p1.y, p2.x, p2.y);
        SelfTest.log('中途改道位置连续（无瞬移）', jump < 2.5, '偏移 ' + jump.toFixed(2) + ' 单位');
        let guard = 0;
        while (mv.path.length > 1 && guard < 400) { Sim.advance(.5); guard++; }
        SelfTest.log('改道后按航道抵达目标', mv.sys === target2, '抵达 ' + (S.sys[mv.sys] ? S.sys[mv.sys].name : '?') + '，用时 ' + guard + ' 步');
        SelfTest.log('舰队只能沿航道移动', S.sys[mv.sys] !== undefined && (mv.sys === target2), '终点为航道节点');
      }
      /* 存档 / 读档 */
      const json = SaveSys.pack();
      const snapshot = { month: S.month, sys: S.sys.length, techs: S.emp[0].tech.done.length, energy: Math.round(S.emp[0].res.energy), fl: S.fl.length };
      const lr = SaveSys.loadText(json);
      SelfTest.log('存档序列化 ' + (json.length / 1024).toFixed(1) + 'KB 并读回', lr.ok && S.month === snapshot.month && S.emp[0].tech.done.length === snapshot.techs && S.fl.length === snapshot.fl);
      SelfTest.log('localStorage 可用性', true, SaveSys.ok() ? '可用' : '不可用（内存回退）');
      const sv = SaveSys.save('s3');
      SelfTest.log('写入存档槽位', sv.ok, sv.hard ? '已写入 localStorage' : '内存回退');
      SaveSys.del('s3');
      /* 局势诊断（非断言，用于人工核对平衡） */
      SelfTest.out.push('DIAG month=' + S.month + ' over=' + (S.over ? S.over.kind + (S.over.emp >= 0 ? '/' + S.emp[S.over.emp].name : '') : 'none') +
        ' playerPlanets=' + S.pl.filter(p => p.owner === 0).length + ' pirateFleets=' + S.fl.filter(f => f.owner < 0).length);
      SelfTest.out.push('DIAG standings= ' + S.emp.map(x => x.name + ':' + (x.dead ? 'DEAD' : (x.colonies || 0) + 'col/' + x.tech.done.length + 'tech/pw' + Sim.empPower(x.id) + '/pop' + Math.round(Victory.devProgress(x).pop))).join(' | '));
      SelfTest.out.push('DIAG log= ' + S.log.slice(-6).map(l => Util.date(l.m) + ' ' + l.t).join(' ~~ '));
      /* ---- 三条胜利路线 + 失败路线的判定验证 ---- */
      S.over = null; S.emp[0].dead = false;
      if (!S.pl.some(p => p.owner === 0)) { const p = S.pl[0]; p.owner = 0; p.pop = 6; p.cap = 1; S.emp[0].cap = p.id; Sim.recalcAll(); }
      S.emp[0].tech.done.push('final_trans');
      Victory.check();
      SelfTest.log('科技胜利判定', !!S.over && S.over.win && S.over.kind === 'tech', S.over ? S.over.title : 'none');
      S.over = null;
      const fi = S.emp[0].tech.done.indexOf('final_trans');
      if (fi >= 0) S.emp[0].tech.done.splice(fi, 1);
      let given = 0;
      S.pl.forEach(p => { if (given < DEV_GOAL.colonies + 1) { p.owner = 0; p.siege = 0; p.pop = 16; p.stab = 95; p.b = { fusion: 3, mine: 3, habitat: 3, lab: 2 }; given++; } });
      while (S.emp[0].tech.done.length < DEV_GOAL.techs) S.emp[0].tech.done.push('phy_reactor');
      S.emp[0].cap = S.pl[0].id; S.pl[0].cap = 1;
      Sim.recalcAll();
      const dp = Victory.devProgress(S.emp[0]);
      Victory.check();
      SelfTest.log('发展胜利判定', !!S.over && S.over.kind === 'dev' && S.over.win,
        '殖民地' + dp.colonies + ' 人口' + Math.round(dp.pop) + ' 产能' + Math.round(dp.output) + ' 科技' + dp.techs);
      /* 撤销发展条件后再验证征服胜利（否则会优先触发发展胜利） */
      S.over = null;
      let keep = 0;
      S.pl.forEach(p => { if (p.owner === 0) { if (keep < 2) { keep++; p.pop = 4; } else p.owner = -1; } });
      S.emp[0].tech.done = S.emp[0].tech.done.slice(0, 6);
      S.emp.forEach(x => { const k = x.tech.done.indexOf('final_trans'); if (k >= 0) x.tech.done.splice(k, 1); });
      Sim.recalcAll();
      S.emp.slice(1).forEach(x => { if (!x.dead) Sim.killEmpire(x.id, 0); });
      Victory.check();
      SelfTest.log('征服胜利判定', !!S.over && S.over.kind === 'conquest' && S.over.win, S.over ? S.over.title : 'none');
      S.over = null;
      S.pl.forEach(p => { if (p.owner === 0) p.owner = -1; });
      S.emp[0].cap = -1;
      Sim.recalcAll();
      Victory.check();
      SelfTest.log('失败判定（失去全部星球）', !!S.over && !S.over.win && S.over.kind === 'eliminated', S.over ? S.over.title : 'none');
    } catch (err) {
      SelfTest.log('运行时异常：' + (err && err.message ? err.message : err), false);
      if (err && err.stack) SelfTest.out.push(String(err.stack).split('\n').slice(0, 4).join(' | '));
    }
    const total = SelfTest.out.length, fails = SelfTest.failed || 0;
    const head = 'SELFTEST ' + (fails ? 'FAILURES=' + fails : 'ALL_PASS') + ' (' + total + ' checks)';
    const box = document.createElement('pre');
    box.id = 'selftestOut';
    box.style.cssText = 'position:fixed;left:0;top:0;z-index:999;max-width:100vw;max-height:100vh;overflow:auto;background:#000c;color:#8f8;font:11px monospace;padding:8px;white-space:pre-wrap';
    box.textContent = head + '\n' + SelfTest.out.join('\n') + '\nJS_ERRORS=' + (window.__errs || []).length + (window.__errs && window.__errs.length ? '\n' + window.__errs.join('\n') : '');
    document.body.appendChild(box);
    document.title = head;
    return head;
  },
};

/* ================================================================================
   28) AUDIT —— 内置布局 / 渲染 / 可点击性审计（通过 #audit 触发）
   ================================================================================ */
const Audit = {
  res: [], fails: 0,
  ok(name, cond, extra) { Audit.res.push((cond ? 'PASS' : 'FAIL') + ' · ' + name + (extra ? ' · ' + extra : '')); if (!cond) Audit.fails++; },
  note(t) { Audit.res.push('  ' + t); },
  /* 画布像素采样：验证确实渲染出了内容而不是黑屏 */
  px(cv) {
    try {
      const ctx = cv.getContext('2d');
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let lit = 0, tot = 0, sum = 0, cyan = 0;
      const step = 4 * (cv.width * cv.height > 200000 ? 331 : 11);
      for (let i = 0; i < d.length; i += step) {
        tot++;
        const r = d[i], g = d[i + 1], b = d[i + 2];
        sum += (r + g + b) / 3;
        if (r + g + b > 90) lit++;
        if (g > 90 && b > 90 && g > r + 25) cyan++;
      }
      return { ratio: lit / Math.max(1, tot), avg: sum / Math.max(1, tot), cyan: cyan / Math.max(1, tot), tot: tot };
    } catch (e) { return { err: String(e && e.message || e) }; }
  },
  scrollHost(el) {
    let p = el.parentNode;
    while (p && p.nodeType === 1) {
      if (p.scrollHeight > p.clientHeight + 2 && /auto|scroll/.test(getComputedStyle(p).overflowY)) return p;
      p = p.parentNode;
    }
    return null;
  },
  hit(el) {
    const r = el.getBoundingClientRect();
    if (r.width < 5 || r.height < 5) return 'too-small(' + Math.round(r.width) + 'x' + Math.round(r.height) + ')';
    /* 只测量元素在其滚动容器中真正可见的部分（部分滚出不算遮挡） */
    let vTop = r.top, vBot = r.bottom;
    const host = Audit.scrollHost(el);
    if (host) {
      const hr = host.getBoundingClientRect();
      vTop = Math.max(vTop, hr.top); vBot = Math.min(vBot, hr.bottom);
      if (vBot - vTop < 5) return 'scrolled-out';
    }
    if (r.right < 0 || vBot < 0 || r.left > innerWidth || vTop > innerHeight) return 'offscreen';
    const x = r.left + r.width / 2, y = (vTop + vBot) / 2;
    if (x < 1 || x > innerWidth - 1 || y < 1 || y > innerHeight - 1) return 'outside-viewport(' + Math.round(x) + ',' + Math.round(y) + ')';
    const top = document.elementFromPoint(x, y);
    if (!top) return 'no-hit';
    if (el === top || el.contains(top) || top.contains(el)) return 'ok';
    return 'covered-by:' + top.tagName.toLowerCase() + '.' + String(top.className || '').split(' ')[0];
  },
  overflowY(el) { return el.scrollHeight > el.clientHeight + 2; },
  checkClickables(scope, label) {
    const list = scope.querySelectorAll('[data-act]:not([disabled])');
    let bad = [], scrolled = 0;
    for (let i = 0; i < list.length; i++) {
      const st = Audit.hit(list[i]);
      if (st === 'scrolled-out') { scrolled++; continue; }
      if (st !== 'ok') bad.push((list[i].getAttribute('data-act') || '?') + '=' + st);
    }
    Audit.ok(label + ' 可点击性（' + list.length + ' 个控件' + (scrolled ? '，' + scrolled + ' 个需滚动' : '') + '）',
      bad.length === 0, bad.slice(0, 5).join(', '));
    return list.length;
  },
  checkInside(el, label, tol) {
    const r = el.getBoundingClientRect();
    const t = tol === undefined ? 2 : tol;
    const inside = r.left >= -t && r.top >= -t && r.right <= innerWidth + t && r.bottom <= innerHeight + t;
    Audit.ok(label + ' 位于视口内', inside,
      'rect=' + [r.left, r.top, r.right, r.bottom].map(Math.round).join(',') + ' vp=' + innerWidth + 'x' + innerHeight);
    return inside;
  },
  /* 检查文字是否被裁切（横向溢出） */
  checkClip(scope, label) {
    const els = scope.querySelectorAll('.kv,.tile,.techcard,.choice,.btn,.res,.stat,td,th,.logrow');
    let bad = [];
    for (let i = 0; i < els.length; i++) {
      const e = els[i];
      if (e.scrollWidth > e.clientWidth + 3 && getComputedStyle(e).overflowX !== 'auto') {
        bad.push((e.className || e.tagName) + '(' + e.scrollWidth + '>' + e.clientWidth + ')');
      }
    }
    Audit.ok(label + ' 无横向文字裁切（检查 ' + els.length + ' 个元素）', bad.length === 0, bad.slice(0, 4).join(', '));
  },
  run() {
    Audit.res = []; Audit.fails = 0;
    try {
      Audit.note('VIEWPORT ' + innerWidth + 'x' + innerHeight + ' dpr=' + (window.devicePixelRatio || 1));
      /* 开屏界面 */
      Audit.ok('开屏弹窗已显示', !!document.querySelector('#modalHost .modal'));
      const sp = document.querySelector('#modalHost .modal');
      if (sp) { Audit.checkInside(sp, '新游戏弹窗'); Audit.checkClickables(sp, '新游戏弹窗'); }
      /* 开局并推进 60 个月 */
      Game.newGame({ seed: 20250821, size: 'medium', diff: 'normal', empName: '苍穹共治体' });
      ['phy', 'soc', 'eng'].forEach(f => { if (S.emp[0].tech.choices[f].length) Tech.start(0, f, S.emp[0].tech.choices[f][0]); });
      for (let i = 0; i < 60; i++) { Sim.advance(1); Sim.month(); if (S.pending.length) EventSys.resolve(0); }
      const dock = AI.dockSys(S.emp[0]);
      if (dock >= 0) { Sim.queueShip(0, dock, 'colony'); Sim.queueShip(0, dock, 'dest'); }
      const en = S.emp.slice(1).filter(x => !x.dead)[0];
      if (en) { const g = Diplo.get(0, en.id); g.met = 1; }
      S.sel = { kind: 'sys', id: S.emp[0].home };
      UI.forceClose();               /* 清掉模拟期间可能弹出的事件结果弹窗 */
      S.pending.length = 0;
      V.needUI = true;
      UI.renderAll();
      Render.frame(performance.now());
      Minimap.draw();
      /* 主视图渲染检查 */
      const mp = Audit.px(Render.cv);
      Audit.ok('银河画布已渲染内容', !mp.err && mp.ratio > .12 && mp.avg > 6, 'lit=' + (mp.ratio * 100).toFixed(1) + '% avg=' + (mp.avg || 0).toFixed(1) + ' cyan=' + ((mp.cyan || 0) * 100).toFixed(2) + '% samples=' + mp.tot);
      const mmHidden = getComputedStyle($('minimapWrap')).display === 'none';
      const mm = Audit.px($('minimap'));
      Audit.ok('迷你地图已渲染内容' + (mmHidden ? '（窄窗口下已按设计隐藏）' : ''), mmHidden || (!mm.err && mm.ratio > .004),
        'lit=' + (mm.ratio * 100).toFixed(2) + '% samples=' + mm.tot);
      Audit.ok('画布尺寸匹配视口', Math.abs(Render.w - $('stage').clientWidth) < 2 && Math.abs(Render.h - $('stage').clientHeight) < 2,
        Render.w + 'x' + Render.h);
      /* 主界面布局 */
      Audit.checkInside($('topbar'), '顶部状态栏');
      Audit.checkInside($('sidebar'), '侧边面板');
      Audit.checkInside($('logbar'), '通讯记录栏');
      const tb = $('topbar');
      Audit.ok('顶部状态栏未溢出（scrollWidth ' + tb.scrollWidth + ' ≤ ' + tb.clientWidth + '）', tb.scrollWidth <= tb.clientWidth + 2);
      Audit.checkClickables($('topbar'), '顶部状态栏');
      Audit.checkClickables($('sidebar'), '侧边面板');
      Audit.checkClickables($('hudleft'), '左下控件');
      Audit.checkClip($('sidebar'), '侧边面板');
      const cards = $('sidebar').querySelectorAll('.card');
      let spill = [];
      for (let i = 0; i < cards.length; i++) {
        const r = cards[i].getBoundingClientRect();
        if (r.bottom > innerHeight + 2 || r.right > innerWidth + 2) spill.push(i + ':' + Math.round(r.bottom) + '/' + Math.round(r.right));
      }
      Audit.ok('侧边栏卡片未溢出视口（' + cards.length + ' 张）', spill.length === 0, spill.join(','));
      Audit.ok('资源栏 5 项齐全', $('resbar').children.length === 5, '实际 ' + $('resbar').children.length);
      Audit.ok('侧边面板有内容', $('sidebar').textContent.trim().length > 80, '字符数 ' + $('sidebar').textContent.trim().length);
      Audit.ok('通讯记录有条目', $('logList').children.length > 0, $('logList').children.length + ' 条');
      /* 选中星球 / 舰队面板 */
      const myPl = S.pl.filter(p => p.owner === 0)[0];
      S.sel = { kind: 'planet', id: myPl.id }; UI.renderAll();
      Audit.checkClickables($('sidebar'), '星球面板');
      Audit.ok('星球面板含建筑按钮', $('sidebar').querySelectorAll('[data-act="buildBld"]').length > 0,
        $('sidebar').querySelectorAll('[data-act="buildBld"]').length + ' 个');
      const myFl = S.fl.filter(f => f.owner === 0)[0];
      S.sel = { kind: 'fleet', id: myFl.id }; UI.renderAll();
      Audit.checkClickables($('sidebar'), '舰队面板');
      Audit.ok('舰队面板含移动指令', $('sidebar').querySelectorAll('[data-act="moveMode"]').length > 0);
      /* 各弹窗 */
      const kinds = ['tech', 'build', 'diplo', 'empire', 'save', 'help'];
      let totalCtl = 0;
      kinds.forEach(k => {
        UI.openModal(k);
        const m = document.querySelector('#modalHost .modal');
        if (!m) { Audit.ok('弹窗 ' + k + ' 打开', false); return; }
        Audit.checkInside(m, '弹窗 ' + k, 4);
        totalCtl += Audit.checkClickables(m, '弹窗 ' + k);
        Audit.checkClip(m, '弹窗 ' + k);
        const body = m.querySelector('.mbody');
        Audit.ok('弹窗 ' + k + ' 内容非空', body && body.textContent.trim().length > 40, body ? body.textContent.trim().length + ' 字符' : 'no body');
        Audit.ok('弹窗 ' + k + ' 无横向溢出', !body || body.scrollWidth <= body.clientWidth + 3, body ? body.scrollWidth + '>' + body.clientWidth : '');
      });
      /* 事件弹窗 + 插画 */
      EventSys.fire('ev_ringwreck', { emp: 0, sysId: S.emp[0].home });
      const em = document.querySelector('#modalHost .modal');
      Audit.ok('事件弹窗打开', !!em && !!$('evtArt'));
      if (em) {
        Audit.checkInside(em, '事件弹窗', 4);
        Audit.ok('事件选项 ≥ 2', em.querySelectorAll('[data-act="evtChoice"]').length >= 2, em.querySelectorAll('[data-act="evtChoice"]').length + ' 项');
        Audit.checkClickables(em, '事件弹窗');
        const art = Audit.px($('evtArt'));
        Audit.ok('事件插画已绘制', !art.err && art.ratio > .05, 'lit=' + (art.ratio * 100).toFixed(1) + '%');
        Audit.ok('事件期间时间暂停', S.speed === 0);
        EventSys.resolve(0);
        Audit.ok('事件结算后显示结果弹窗', V.modal === 'evtResult');
        UI.closeModal();
      }
      /* 胜负弹窗 */
      Victory.trigger('dev', 0);
      const om = document.querySelector('#modalHost .modal');
      Audit.ok('胜负弹窗打开', !!om);
      if (om) { Audit.checkInside(om, '胜负弹窗', 4); Audit.checkClickables(om, '胜负弹窗'); }
      S.over = null; UI.forceClose();
      /* 死按钮检查：DOM 中出现的所有 data-act 必须都被 Game.act 处理 */
      const handled = {};
      String(Game.act.toString()).replace(/case '([a-zA-Z]+)'/g, (m, n) => { handled[n] = 1; return m; });
      const seen = {};
      const collect = () => { document.querySelectorAll('[data-act]').forEach(e => { seen[e.getAttribute('data-act')] = 1; }); };
      collect();
      ['tech', 'build', 'diplo', 'empire', 'save', 'help'].forEach(k => { UI.openModal(k); collect(); });
      UI.forceClose();
      S.sel = { kind: 'planet', id: myPl.id }; UI.renderAll(); collect();
      S.sel = { kind: 'fleet', id: myFl.id }; UI.renderAll(); collect();
      S.sel = null; UI.renderAll(); collect();
      const dead = Object.keys(seen).filter(k => !handled[k] && k !== 'scrim');
      Audit.ok('无未实现按钮（' + Object.keys(seen).length + ' 种 data-act 全部已实现）', dead.length === 0, dead.join(','));
      Audit.note('ACTIONS ' + Object.keys(seen).sort().join(' '));
      /* 键盘 / 交互路径不抛异常 */
      ['t', 'b', 'd', 'e', 's', 'h', 'f', 'n', ' ', '1', '2', '3', 'Escape'].forEach(k => {
        document.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
      });
      Audit.ok('键盘快捷键无异常', true, 'speed=' + S.speed + ' modal=' + (V.modal || 'none'));
      UI.forceClose();
      /* 鼠标交互：点击选中、拖拽平移、滚轮缩放、右键移动 */
      const cv = Render.cv, rct = cv.getBoundingClientRect();
      const home = S.sys[S.emp[0].home];
      const hx = rct.left + Render.sx(home.x), hy = rct.top + Render.sy(home.y);
      cv.dispatchEvent(new MouseEvent('mousedown', { clientX: hx, clientY: hy, button: 0, bubbles: true }));
      cv.dispatchEvent(new MouseEvent('mouseup', { clientX: hx, clientY: hy, button: 0, bubbles: true }));
      Audit.ok('点击选中星系', !!S.sel && S.sel.kind === 'sys' && S.sel.id === home.id,
        JSON.stringify(S.sel) + ' pick=' + JSON.stringify(Input.pick(Render.sx(home.x), Render.sy(home.y))));
      const cam0 = { x: V.cam.x, y: V.cam.y, z: V.cam.z };
      cv.dispatchEvent(new MouseEvent('mousedown', { clientX: 400, clientY: 400, button: 0, bubbles: true }));
      window.dispatchEvent(new MouseEvent('mousemove', { clientX: 320, clientY: 350, button: 0, bubbles: true }));
      cv.dispatchEvent(new MouseEvent('mouseup', { clientX: 320, clientY: 350, button: 0, bubbles: true }));
      Audit.ok('拖拽平移生效', Math.abs(V.cam.x - cam0.x) > 10, 'dx=' + Math.round(V.cam.x - cam0.x));
      cv.dispatchEvent(new WheelEvent('wheel', { clientX: 400, clientY: 400, deltaY: -120, bubbles: true, cancelable: true }));
      Audit.ok('滚轮缩放生效', V.cam.z > cam0.z, 'z ' + cam0.z.toFixed(2) + '→' + V.cam.z.toFixed(2));
      const flt = S.fl.filter(f => f.owner === 0 && !f.path.length)[0];
      if (flt) {
        S.sel = { kind: 'fleet', id: flt.id };
        const tgt = S.sys[flt.sys].lanes[0];
        Render.frame(performance.now());
        const tx = rct.left + Render.sx(S.sys[tgt].x), ty = rct.top + Render.sy(S.sys[tgt].y);
        cv.dispatchEvent(new MouseEvent('contextmenu', { clientX: tx, clientY: ty, button: 2, bubbles: true, cancelable: true }));
        Audit.ok('右键下达移动命令', flt.path.length > 1, '路径长度 ' + flt.path.length);
      }
      /* 悬停提示（相机已改变，需按当前视角重新计算坐标） */
      Render.frame(performance.now());
      const hx2 = rct.left + Render.sx(home.x), hy2 = rct.top + Render.sy(home.y);
      Input.tipTarget = null;
      cv.dispatchEvent(new MouseEvent('mousemove', { clientX: hx2, clientY: hy2, bubbles: true }));
      Audit.ok('星系悬停提示可用', $('tip').classList.contains('on') && $('tip').textContent.length > 4, $('tip').textContent.slice(0, 24));
      /* 渲染性能：60 帧地图 + 迷你地图 */
      const t0 = performance.now();
      for (let i = 0; i < 60; i++) { Render.frame(t0 + i * 16); Minimap.draw(); }
      const per = (performance.now() - t0) / 60;
      const t1 = performance.now();
      for (let i = 0; i < 24; i++) Sim.month();
      const perM = (performance.now() - t1) / 24;
      if (per > .0001 || perM > .0001) {
        Audit.ok('渲染性能 ' + per.toFixed(2) + ' ms/帧', per < 16, '星系 ' + S.sys.length + ' 舰队 ' + S.fl.length);
        Audit.ok('模拟性能 ' + perM.toFixed(2) + ' ms/月', perM < 25);
      } else {
        Audit.ok('渲染 60 帧 + 模拟 24 个月无异常', true, '无头虚拟时钟下耗时不可测量');
      }
      /* 资源不足反馈 */
      S.emp[0].res.minerals = 0; S.emp[0].res.energy = 0;
      UI.openModal('build');
      const dis = document.querySelectorAll('#modalHost [data-act="buildShip"][disabled]').length;
      Audit.ok('资源不足时建造按钮禁用', dis > 0, dis + ' 个按钮已禁用');
      const rr = Sim.queueShip(0, S.emp[0].home, 'cruis');
      Audit.ok('资源不足时给出明确反馈', !rr.ok && /不足|船坞|科技/.test(rr.msg || ''), rr.msg || '');
      UI.forceClose();
    } catch (err) {
      Audit.ok('运行时异常：' + (err && err.message ? err.message : err), false);
      if (err && err.stack) Audit.note(String(err.stack).split('\n').slice(0, 4).join(' | '));
    }
    const head = 'AUDIT ' + (Audit.fails ? 'FAILURES=' + Audit.fails : 'ALL_PASS') + ' (' + Audit.res.filter(x => /^(PASS|FAIL)/.test(x)).length + ' checks) ' + innerWidth + 'x' + innerHeight;
    const box = document.createElement('pre');
    box.id = 'auditOut';
    box.style.cssText = 'position:fixed;left:0;top:0;z-index:999;max-width:100vw;max-height:100vh;overflow:auto;background:#000d;color:#8f8;font:11px monospace;padding:8px;white-space:pre-wrap';
    box.textContent = head + '\n' + Audit.res.join('\n') + '\nJS_ERRORS=' + (window.__errs || []).length + ((window.__errs || []).length ? '\n' + window.__errs.join('\n') : '');
    document.body.appendChild(box);
    document.title = head;
    return head;
  },
};
UI.forceClose = function () {
  V.modal = null;
  $('modals').classList.remove('on');
  $('modalHost').innerHTML = '';
};

/* 未捕获异常收集（自检与调试用；正常游玩时静默） */
window.__errs = [];
window.addEventListener('error', e => { window.__errs.push('ERROR: ' + (e.message || '') + ' @' + (e.lineno || '?')); });
window.addEventListener('unhandledrejection', e => { window.__errs.push('REJECT: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });

/* ---------------- 启动 ---------------- */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', Game.boot);
else Game.boot();
</script>
</body>
</html>
