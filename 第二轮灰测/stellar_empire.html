    const involvesPlayer = A === 0 || sideB.indexOf(0) >= 0;
    if (involvesPlayer) {
      const mine = A === 0 ? lostA : lostB, theirs = A === 0 ? lostB : lostA;
      S.stats.shipsLost += mine; S.stats.shipsKilled += theirs;
      const win = winner === 0;
      Log.add('【' + sy.name + '会战】我方对' + nm(A === 0 ? sideB[0] : A) + '：损失 ' + mine + ' 艘，击毁 ' + theirs +
        ' 艘，' + (win ? '我方控制战场。' : '我方被击退。'), 'war');
      Toast.show(sy.name + '会战：' + (win ? '胜利' : '失利') + '（损失 ' + mine + ' / 击毁 ' + theirs + '）', win ? 'g' : 'e', 'war');
      Sfx.play(win ? 'battleWin' : 'battleLose');
    } else if (State.known(0, sysId) >= 1) {
      Log.add(nm(A) + '与' + nm(sideB[0]) + '在' + sy.name + '爆发交战。', 'war');
    }
    S.battles = S.battles || [];
    S.battles.unshift({ m: S.month, sys: sy.name, a: nm(A), b: nm(sideB[0]), la: lostA, lb: lostB, w: nm(winner), r: rounds });
    if (S.battles.length > 14) S.battles.pop();
    Fx.boom(sy.x, sy.y, Math.min(28, 8 + (lostA + lostB) * 3));
    Sim.recalcAll();
    return winner;
  },
  /* 围城：轨道被封锁且防御网清空后逐月推进，占领星球 */
  sieges() {
    S.pl.forEach(p => {
      if (p.owner < 0) { p.siege = 0; p.siegeBy = -1; return; }
      const enemies = Sim.fleetsAt(p.sys).filter(f => f.ships.length && Combat.hostile(f.owner, p.owner) && f.owner >= 0 && Sim.has(f, 'war'));
      const friends = Sim.fleetsAt(p.sys, p.owner).filter(f => f.ships.length);
      if (!enemies.length || friends.length || (p.dhp || 0) > 0) {
        if (p.siege > 0 && !enemies.length) { p.siege = 0; p.siegeBy = -1; }
        return;
      }
      const by = enemies[0].owner;
      p.siegeBy = by;
      const rate = 17 + enemies.reduce((s, f) => s + Sim.count(f, 'war'), 0) * 2.5;
      p.siege = (p.siege || 0) + rate;
      p.stab = Util.clamp(p.stab - 3, 0, 100);
      if (p.owner === 0 && p.siege < 100 && S.month % 2 === 0)
        Toast.show(p.name + ' 正被' + S.emp[by].name + '围攻！（' + Math.min(99, Math.round(p.siege)) + '%）', 'e', 'alert');
      if (p.siege >= 100) Combat.capture(p, by);
    });
  },
  capture(p, by) {
    const from = p.owner;
    const wasCap = p.cap;
    p.owner = by; p.siege = 0; p.siegeBy = -1;
    p.pop = Math.max(1, p.pop * .6); p.stab = 26; p.dhp = 0; p.autonomy = 0;
    for (const k in p.b) if (Rand.chance(.34)) { p.b[k] = Math.max(0, p.b[k] - 1); if (!p.b[k]) delete p.b[k]; }
    p.cap = 0;
    const sy = S.sys[p.sys];
    const stillOld = sy.planets.some(pid => S.pl[pid].owner === from);
    sy.owner = stillOld ? from : by;
    State.reveal(by, p.sys, 2);
    if (by === 0) { S.stats.planetsTaken++; Log.add('占领成功：' + p.name + ' 已并入我方版图！', 'good'); Toast.show('占领 ' + p.name, 'g', 'flag'); Sfx.play('capture'); }
    else if (from === 0) { Log.add('沦陷：' + p.name + ' 被' + S.emp[by].name + '占领！', 'war'); Toast.show(p.name + ' 已沦陷！', 'e', 'alert'); Sfx.play('lose'); }
    else Log.add(S.emp[by].name + '占领了' + S.emp[from].name + '的' + p.name + '。', 'war');
    /* 首都易手：重设或灭国 */
    if (wasCap) {
      const rest = S.pl.filter(x => x.owner === from);
      if (rest.length) {
        rest.sort((a, b) => b.pop - a.pop);
        rest[0].cap = 1; S.emp[from].cap = rest[0].id;
        Log.add(S.emp[from].name + '将首都迁往' + rest[0].name + '。', 'diplo');
      } else Sim.killEmpire(from, by);
    } else if (!S.pl.some(x => x.owner === from)) Sim.killEmpire(from, by);
    Sim.recalcAll();
    Victory.check();
  },
};
Sim.killEmpire = function (id, by) {
  const e = S.emp[id];
  if (!e || e.dead) return;
  e.dead = true; e.cap = -1;
  S.fl.slice().forEach(f => { if (f.owner === id) Sim.removeFleet(f); });
  S.queue = S.queue.filter(q => q.emp !== id);
  Log.add('★ ' + e.name + '已被彻底征服，其残余舰队于失去补给后瓦解。', 'war');
  if (id === 0) Toast.show('我方帝国已经灭亡……', 'e', 'alert');
  else Toast.show(e.name + ' 已灭亡', 'g', 'crown');
  Victory.check();
};

/* ================================================================================
   13) EVENTSYS —— 随机事件与异常现象
   ================================================================================ */
const EventSys = {
  fire(evId, ctx) {
    const def = EVENT_BY_ID[evId];
    if (!def) return;
    ctx = ctx || {};
    ctx.month = S.month;
    if (ctx.sysId !== undefined && S.sys[ctx.sysId]) ctx.sysName = S.sys[ctx.sysId].name;
    if (ctx.planetId !== undefined && S.pl[ctx.planetId]) ctx.planetName = S.pl[ctx.planetId].name;
    if (ctx.other !== undefined && S.emp[ctx.other]) ctx.otherName = S.emp[ctx.other].name;
    S.stats.evts++;
    if (ctx.emp === 0) {
      S.pending.push({ id: evId, ctx: ctx });
      if (S.speed > 0) { S.evtResume = S.speed; Game.setSpeed(0); }
      UI.refreshEvent();
    } else {
      /* AI 自动抉择：按性格倾向选择 */
      const w = PERSON[S.emp[ctx.emp].person];
      const i = def.choices.length > 1 && Rand.chance(w.warlike > 1.2 ? .62 : .45) ? 1 : 0;
      const idx = Math.min(i, def.choices.length - 1);
      try { def.choices[idx].run(ctx); } catch (err) { /* AI 事件失败不影响主流程 */ }
    }
  },
  resolve(idx) {
    const cur = S.pending[0];
    if (!cur) return;
    const def = EVENT_BY_ID[cur.id];
    const ch = def.choices[idx];
    if (!ch) return;
    let msg = '';
    try { msg = ch.run(cur.ctx) || ''; } catch (err) { msg = '（事件结算异常，已跳过）'; }
    S.pending.shift();
    Log.add('【' + def.title + '】' + ch.label + '：' + msg, 'evt');
    Sim.recalcAll();
    Sfx.play('click2');
    UI.lastEventResult = { title: def.title, choice: ch.label, msg: msg };
    if (!S.pending.length && S.evtResume) { const s = S.evtResume; S.evtResume = 0; Game.setSpeed(s); }
    UI.refreshEvent();
    V.needUI = true;
  },
  eligible(emp) {
    const cols = S.pl.filter(p => p.owner === emp.id);
    const out = [];
    EVENTS.forEach(e => {
      if (e.kind !== 'monthly') return;
      if (e.needColony && !cols.length) return;
      if (e.lowStab && !cols.some(p => p.stab < 62)) return;
      if (e.needWar && !Diplo.wars(emp.id).length) return;
      if (e.needPeace && !S.emp.some(o => !o.dead && o.id !== emp.id && Diplo.met(emp.id, o.id) && !Diplo.atWar(emp.id, o.id))) return;
      if (e.midGame && S.month < 48) return;
      out.push(e);
    });
    return out;
  },
  pickCtx(emp, ev) {
    const ctx = { emp: emp.id };
    const cols = S.pl.filter(p => p.owner === emp.id);
    if (ev.lowStab) {
      const bad = cols.filter(p => p.stab < 62);
      const p = bad.length ? bad[Math.floor(Rand.next() * bad.length)] : cols[0];
      if (p) { ctx.planetId = p.id; ctx.sysId = p.sys; }
    } else if (cols.length) {
      const p = cols[Math.floor(Rand.next() * cols.length)];
      ctx.planetId = p.id; ctx.sysId = p.sys;
    }
    if (ev.needWar) { const w = Diplo.wars(emp.id); if (w.length) ctx.other = w[0]; }
    if (ev.needPeace) {
      const ok = S.emp.filter(o => !o.dead && o.id !== emp.id && Diplo.met(emp.id, o.id) && !Diplo.atWar(emp.id, o.id));
      if (ok.length) ctx.other = ok[Math.floor(Rand.next() * ok.length)].id;
    }
    return ctx;
  },
  month() {
    S.evtCd = Math.max(0, (S.evtCd || 0) - 1);
    S.emp.forEach(emp => {
      if (emp.dead) return;
      if (emp.isPlayer) {
        if (S.evtCd > 0 || S.pending.length) return;
        if (!Rand.chance(.085)) return;
        const list = EventSys.eligible(emp);
        if (!list.length) return;
        const ev = list[Math.floor(Rand.next() * list.length)];
        S.evtCd = 7 + Math.floor(Rand.next() * 8);
        EventSys.fire(ev.id, EventSys.pickCtx(emp, ev));
      } else {
        if (!Rand.chance(.05)) return;
        const list = EventSys.eligible(emp);
        if (!list.length) return;
        const ev = list[Math.floor(Rand.next() * list.length)];
        EventSys.fire(ev.id, EventSys.pickCtx(emp, ev));
      }
    });
  },
};

/* ================================================================================
   14) DIPLO —— 关系 / 条约 / 战争
   ================================================================================ */
const Diplo = {
  key(a, b) { return Math.min(a, b) + '-' + Math.max(a, b); },
  get(a, b) {
    const k = Diplo.key(a, b);
    if (!S.diplo[k]) S.diplo[k] = { rel: 0, war: 0, nap: 0, trade: 0, truce: 0, met: 0, warStart: 0 };
    return S.diplo[k];
  },
  met(a, b) { return !!Diplo.get(a, b).met; },
  atWar(a, b) { return a >= 0 && b >= 0 && !!Diplo.get(a, b).war; },
  wars(id) {
    const out = [];
    S.emp.forEach(o => { if (o.id !== id && !o.dead && Diplo.atWar(id, o.id)) out.push(o.id); });
    return out;
  },
  rel(a, b, d) {
    const g = Diplo.get(a, b);
    const mul = 1 + (d > 0 ? ((S.emp[a] && S.emp[a].mods.diplo) || 0) : 0);
    g.rel = Util.clamp(g.rel + d * (d > 0 ? mul : 1), -100, 100);
    return g.rel;
  },
  allAiRelation(empId, d) { S.emp.forEach(o => { if (o.id !== empId && !o.dead) Diplo.rel(empId, o.id, d); }); },
  relWord(v) {
    if (v >= 60) return { t: '亲密盟友', c: 'gr' };
    if (v >= 30) return { t: '友好', c: 'gr' };
    if (v >= 10) return { t: '中立偏好', c: 'cy' };
    if (v > -10) return { t: '中立', c: 'dim' };
    if (v > -35) return { t: '冷淡', c: 'am' };
    if (v > -60) return { t: '敌意', c: 'ro' };
    return { t: '死敌', c: 'ro' };
  },
  firstContact(a, b) {
    const g = Diplo.get(a, b);
    if (g.met) return;
    g.met = 1;
    if (a === 0 || b === 0) {
      const o = S.emp[a === 0 ? b : a];
      Log.add('★ 首次接触：' + o.name + '（' + PERSON[o.person].name + '倾向）已进入我方通讯范围。', 'diplo');
      Toast.show('首次接触：' + o.name, 'p', 'diplo');
      Sfx.play('contact');
    }
  },
  borderFriction(empId) {
    S.emp.forEach(o => {
      if (o.id === empId || o.dead) return;
      let adj = false;
      S.sys.forEach(sy => {
        if (sy.owner !== empId) return;
        sy.lanes.forEach(n => { if (S.sys[n].owner === o.id) adj = true; });
      });
      if (adj) Diplo.rel(empId, o.id, -3);
    });
  },
  declareWar(a, b, reason) {
    const g = Diplo.get(a, b);
    if (g.war) return false;
    g.war = 1; g.nap = 0; g.trade = 0; g.warStart = S.month;
    g.rel = Math.min(g.rel, -55);
    Diplo.firstContact(a, b);
    if (a === 0 || b === 0) {
      const o = S.emp[a === 0 ? b : a];
      Log.add('⚔ 战争爆发：' + (a === 0 ? '我方向' + o.name + '宣战' : o.name + '向我方宣战') + '！' + (reason ? '（' + reason + '）' : ''), 'war');
      Toast.show((a === 0 ? '我方已向 ' + o.name + ' 宣战' : o.name + ' 向我方宣战！'), 'e', 'war');
      Sfx.play('war');
      /* 宣战会引起其他文明不安 */
      if (a === 0) S.emp.forEach(x => { if (x.id !== 0 && x.id !== b && !x.dead) Diplo.rel(0, x.id, -6); });
    } else Log.add(S.emp[a].name + '向' + S.emp[b].name + '宣战。', 'war');
    return true;
  },
  peace(a, b) {
    const g = Diplo.get(a, b);
    if (!g.war) return false;
    g.war = 0; g.truce = S.month + 36; g.rel = Math.max(g.rel, -18);
    S.pl.forEach(p => { if (p.siege > 0 && ((p.owner === a && p.siegeBy === b) || (p.owner === b && p.siegeBy === a))) { p.siege = 0; p.siegeBy = -1; } });
    if (a === 0 || b === 0) {
      const o = S.emp[a === 0 ? b : a];
      Log.add('✦ 停战协定生效：我方与' + o.name + '结束战争状态。', 'diplo');
      Toast.show('与 ' + o.name + ' 停战', 'g', 'check');
    } else Log.add(S.emp[a].name + '与' + S.emp[b].name + '缔结停战协定。', 'diplo');
    return true;
  },
  /* 玩家外交行动 */
  act(type, other) {
    const g = Diplo.get(0, other), o = S.emp[other], me = S.emp[0];
    if (o.dead) return { ok: false, msg: o.name + '已经灭亡。' };
    const pay = c => { if (!Econ.can(0, c)) return false; Econ.pay(0, c); return true; };
    if (type === 'improve') {
      const c = { influence: 45 };
      if (!pay(c)) return { ok: false, msg: '影响力不足（需要 45）。' };
      const d = 9 + Math.round(Rand.f(0, 4));
      Diplo.rel(0, other, d);
      Log.add('外交使团出访' + o.name + '，关系 ' + Util.sgn(d, 0) + '。', 'diplo');
      return { ok: true, msg: '关系改善 ' + Util.sgn(Math.round(d * (1 + me.mods.diplo)), 0) };
    }
    if (type === 'gift') {
      const c = { energy: 180, minerals: 120 };
      if (!pay(c)) return { ok: false, msg: '资源不足（需要 180 能源 / 120 矿物）。' };
      const d = 14;
      Diplo.rel(0, other, d);
      Log.add('我方向' + o.name + '赠送了物资援助，关系显著改善。', 'diplo');
      return { ok: true, msg: '关系 +' + Math.round(d * (1 + me.mods.diplo)) };
    }
    if (type === 'trade') {
      if (g.trade) return { ok: false, msg: '贸易协定已经生效。' };
      if (g.war) return { ok: false, msg: '战争状态下无法通商。' };
      if (g.rel < 8) return { ok: false, msg: '关系过低，' + o.name + '拒绝谈判（需要关系 ≥ 8）。' };
      if (!pay({ influence: 35 })) return { ok: false, msg: '影响力不足（需要 35）。' };
      if (!Diplo.aiAccept(other, 'trade')) { Diplo.rel(0, other, -2); return { ok: false, msg: o.name + '婉拒了贸易提案。' }; }
      g.trade = 1; Diplo.rel(0, other, 8);
      const amt = 3.2 * (1 + me.mods.trade);
      me.bonus.energy += amt; me.bonus.minerals += amt * .6;
      o.bonus.energy += 2; o.bonus.minerals += 1.4;
      Log.add('贸易协定生效：与' + o.name + '互通航道，能源 +' + Util.round(amt, 1) + ' / 月。', 'diplo');
      Sim.recalcAll();
      return { ok: true, msg: '贸易协定签署，每月 +' + Util.round(amt, 1) + ' 能源' };
    }
    if (type === 'nap') {
      if (g.nap) return { ok: false, msg: '互不侵犯条约已经生效。' };
      if (g.war) return { ok: false, msg: '请先达成停战。' };
      if (g.rel < 20) return { ok: false, msg: '关系不足（需要 ≥ 20），' + o.name + '不会考虑。' };
      if (!pay({ influence: 70 })) return { ok: false, msg: '影响力不足（需要 70）。' };
      if (!Diplo.aiAccept(other, 'nap')) { Diplo.rel(0, other, -3); return { ok: false, msg: o.name + '拒绝签署互不侵犯条约。' }; }
      g.nap = S.month + 180; Diplo.rel(0, other, 10);
      Log.add('互不侵犯条约签署：' + o.name + '在 15 年内不会向我方宣战。', 'diplo');
      return { ok: true, msg: '互不侵犯条约生效（15 年）' };
    }
    if (type === 'peace') {
      if (!g.war) return { ok: false, msg: '当前并未交战。' };
      if (!pay({ influence: 55 })) return { ok: false, msg: '影响力不足（需要 55）。' };
      if (!Diplo.aiAccept(other, 'peace')) { return { ok: false, msg: o.name + '拒绝停战，战争继续。' }; }
      Diplo.peace(0, other);
      return { ok: true, msg: '停战协定达成' };
    }
    if (type === 'war') {
      if (g.war) return { ok: false, msg: '已处于战争状态。' };
      if (g.nap > S.month) {
        Diplo.rel(0, other, -10);
        S.emp.forEach(x => { if (x.id !== 0 && !x.dead) Diplo.rel(0, x.id, -12); });
        g.nap = 0;
        Log.add('我方单方面撕毁与' + o.name + '的互不侵犯条约，银河舆论哗然。', 'war');
      }
      Diplo.declareWar(0, other, '玩家宣战');
      return { ok: true, msg: '已向 ' + o.name + ' 宣战' };
    }
    return { ok: false, msg: '未知外交行动。' };
  },
  aiAccept(other, type) {
    const g = Diplo.get(0, other), o = S.emp[other], w = PERSON[o.person];
    const pw = Sim.empPower(0) + 1, tw = Sim.empPower(other) + 1;
    let score = g.rel * .55 + w.diplo * 22 - 12;
    if (type === 'peace') {
      score = 8 + (o.warExh || 0) * 2.2 + (pw / tw - 1) * 40 - w.warlike * 12 + g.rel * .25;
      const lostRecently = S.battles ? S.battles.filter(b => b.m > S.month - 12 && b.w === S.emp[0].name).length : 0;
      score += lostRecently * 6;
    }
    if (type === 'nap') score += 6 - w.warlike * 10;
    if (type === 'trade') score += w.eco * 14;
    return score + Rand.f(-8, 8) > 0;
  },
  /* AI 主动提案（玩家可在外交面板接受 / 拒绝） */
  offer(from, type) {
    if (S.offers.some(o => o.from === from && o.type === type)) return;
    S.offers.push({ from: from, type: type, m: S.month, exp: S.month + 24 });
    const o = S.emp[from];
    const label = { trade: '贸易协定', nap: '互不侵犯条约', peace: '停战协定' }[type] || type;
    Log.add('外交提案：' + o.name + '提议签署' + label + '。', 'diplo');
    Toast.show(o.name + ' 提议：' + label, 'p', 'diplo');
    Sfx.play('contact');
  },
  resolveOffer(i, accept) {
    const of = S.offers[i];
    if (!of) return;
    S.offers.splice(i, 1);
    const g = Diplo.get(0, of.from), o = S.emp[of.from], me = S.emp[0];
    if (!accept) { Diplo.rel(0, of.from, -4); Log.add('我方拒绝了' + o.name + '的提案。', 'diplo'); return; }
    if (of.type === 'trade') {
      g.trade = 1; Diplo.rel(0, of.from, 10);
      const amt = 3 * (1 + me.mods.trade);
      me.bonus.energy += amt; me.bonus.minerals += amt * .6;
      o.bonus.energy += 2;
      Log.add('与' + o.name + '的贸易协定生效，每月 +' + Util.round(amt, 1) + ' 能源。', 'diplo');
    } else if (of.type === 'nap') {
      g.nap = S.month + 180; Diplo.rel(0, of.from, 12);
      Log.add('与' + o.name + '签署互不侵犯条约。', 'diplo');
    } else if (of.type === 'peace') {
      Diplo.peace(0, of.from);
    }
    Sim.recalcAll();
  },
  month() {
    /* 首次接触检测：共同已知星系 */
    for (let a = 0; a < S.emp.length; a++) for (let b = a + 1; b < S.emp.length; b++) {
      if (S.emp[a].dead || S.emp[b].dead) continue;
      const g = Diplo.get(a, b);
      if (g.met) continue;
      for (let i = 0; i < S.sys.length; i++) {
        if (State.known(a, i) >= 1 && State.known(b, i) >= 1) { Diplo.firstContact(a, b); break; }
      }
    }
    /* 关系漂移 + 条约到期 */
    for (const k in S.diplo) {
      const g = S.diplo[k];
      const ab = k.split('-'), a = +ab[0], b = +ab[1];
      if (!g.met || S.emp[a].dead || S.emp[b].dead) continue;
      if (g.nap && g.nap <= S.month) { g.nap = 0; if (a === 0 || b === 0) Log.add('与' + S.emp[a === 0 ? b : a].name + '的互不侵犯条约已到期。', 'diplo'); }
      if (g.war) continue;
      const wa = PERSON[S.emp[a].person], wb = PERSON[S.emp[b].person];
      let base = -6 + (wa.diplo + wb.diplo) * 9 + (g.nap ? 14 : 0) + (g.trade ? 12 : 0);
      base -= (S.emp[a].colonies + S.emp[b].colonies) * .6;
      const drift = Util.clamp(base - g.rel, -.9, .9) * .34;
      g.rel = Util.clamp(g.rel + drift, -100, 100);
    }
    /* AI 外交决策 */
    S.emp.forEach(e => {
      if (e.dead || e.isPlayer) return;
      const w = PERSON[e.person];
      S.emp.forEach(o => {
        if (o.id === e.id || o.dead) return;
        const g = Diplo.get(e.id, o.id);
        if (!g.met) return;
        const mine = Sim.empPower(e.id) + 40, his = Sim.empPower(o.id) + 40;
        /* 宣战判定 */
        if (!g.war && !g.nap && g.truce < S.month && S.month > 36) {
          const aggro = (mine / his - 1) * 46 + (-g.rel) * .5 + w.warlike * 20 - 50 + (DIFFS[S.diff].aiWar - 1) * 26;
          if (aggro > 0 && Rand.chance(.05 + w.warlike * .02)) {
            Diplo.declareWar(e.id, o.id, '边境摩擦与领土野心');
            e.ai.target = -1;
          }
        }
        /* 战争疲惫 -> 求和 */
        if (g.war && S.month - g.warStart > 18) {
          const losing = his > mine * 1.25;
          if ((e.warExh > 14 || losing) && Rand.chance(.16)) {
            if (o.isPlayer) Diplo.offer(e.id, 'peace');
            else Diplo.peace(e.id, o.id);
          }
        }
        /* 和平期提案 */
        if (!g.war && o.isPlayer && Rand.chance(.02 + w.diplo * .012)) {
          if (g.rel > 26 && !g.nap) Diplo.offer(e.id, 'nap');
          else if (g.rel > 12 && !g.trade && w.eco > .9) Diplo.offer(e.id, 'trade');
        }
      });
    });
    /* 提案过期 */
    S.offers = S.offers.filter(o => o.exp > S.month && !S.emp[o.from].dead);
  },
};

/* ================================================================================
   15) AI —— 电脑文明行为（勘测 / 殖民 / 建设 / 造舰 / 战争）
   ================================================================================ */
const AI = {
  month(e) {
    const w = PERSON[e.person];
    const d = DIFFS[S.diff];
    AI.explore(e, w);
    AI.expand(e, w);
    AI.build(e, w);
    AI.military(e, w, d);
    Tech.aiPick(e);
  },
  explore(e, w) {
    const probes = S.fl.filter(f => f.owner === e.id && Sim.has(f, 'sci'));
    probes.forEach(f => {
      if (f.path.length || f.task === 'survey') return;
      if (State.known(e.id, f.sys) < 2) { f.task = 'survey'; return; }
      const t = Sim.nearestUnknown(e.id, f.sys, true);
      if (t >= 0) { Sim.order(f, t, true); }
    });
    if (probes.length < (S.month < 40 ? 2 : 1) && e.res.minerals > 120 && !S.queue.some(q => q.emp === e.id && q.id === 'probe')) {
      const dock = AI.dockSys(e);
      if (dock >= 0) Sim.queueShip(e.id, dock, 'probe');
    }
  },
  dockSys(e) {
    let best = -1;
    S.sys.forEach(sy => {
      if (sy.owner !== e.id) return;
      if (sy.planets.some(pid => S.pl[pid].owner === e.id && (S.pl[pid].b.dock || 0) > 0)) best = sy.id;
    });
    return best;
  },
  bestColonyTarget(e) {
    let best = -1, bs = -1;
    S.pl.forEach(p => {
      if (p.owner >= 0) return;
      if (State.known(e.id, p.sys) < 2) return;
      if (!Sim.colonizable(p, e)) return;
      const sy = S.sys[p.sys];
      if (sy.owner >= 0 && sy.owner !== e.id) return;
      if (Sim.fleetsAt(p.sys, -1).length) return;
      const home = S.sys[e.home];
      const dd = Galaxy.bfs(e.home, S.sys)[p.sys];
      if (dd < 0) return;
      const s = (p.hab + e.mods.habit) * .8 + p.size * 1.2 + (sy.dep.energy + sy.dep.minerals) * 3 - dd * 7;
      if (s > bs) { bs = s; best = p.id; }
    });
    return best;
  },
  expand(e, w) {
    const cols = S.pl.filter(p => p.owner === e.id).length;
    const colFleets = S.fl.filter(f => f.owner === e.id && Sim.has(f, 'col'));
    /* 已有殖民船：派往目标并殖民 */
    colFleets.forEach(f => {
      if (f.path.length) return;
      const here = S.sys[f.sys].planets.filter(pid => Sim.colonizable(S.pl[pid], e))[0];
      if (here !== undefined && (S.sys[f.sys].owner < 0 || S.sys[f.sys].owner === e.id) && !Sim.fleetsAt(f.sys, -1).length) {
        Sim.colonize(f, here);
        return;
      }
      const t = AI.bestColonyTarget(e);
      if (t >= 0) Sim.order(f, S.pl[t].sys, true);
    });
    const want = S.month < 60 ? 1 : Math.min(2, Math.max(1, Math.round(w.expand)));
    const colCap = Math.min(13, 3 + Math.floor(S.month / 26));
    if (colFleets.length < want && cols < colCap && e.res.minerals > 150 && e.res.influence > 30 &&
        !S.queue.some(q => q.emp === e.id && q.id === 'colony')) {
      const t = AI.bestColonyTarget(e);
      const dock = AI.dockSys(e);
      if (t >= 0 && dock >= 0) Sim.queueShip(e.id, dock, 'colony');
    }
  },
  build(e, w) {
    const mine = S.pl.filter(p => p.owner === e.id);
    if (!mine.length) return;
    const q = S.queue.filter(x => x.emp === e.id && x.kind === 'bld').length;
    if (q >= 2) return;
    if (e.res.minerals < 110) return;
    /* 需求评分：能源赤字优先发电，其次按性格 */
    let bestP = null, bestB = null, bs = -1;
    mine.forEach(p => {
      BUILD_ORDER.forEach(bid => {
        const def = BUILDINGS[bid];
        if (!Econ.unlocked(e, bid)) return;
        const lv = p.b[bid] || 0;
        if (lv >= def.max) return;
        let s = 1 + Rand.next();
        if (bid === 'fusion') s += (e.inc.energy < 4 ? 9 : 2) + w.eco;
        if (bid === 'mine') s += 3 + w.eco * 1.6;
        if (bid === 'lab') s += 2 + w.sci * 3;
        if (bid === 'habitat') s += (p.pop > p.popCap - 1.5 ? 6 : 1) + w.expand;
        if (bid === 'admin') s += (p.stab < 55 ? 5 : .5);
        if (bid === 'dock') s += (mine.length > 2 && lv === 0 ? 3 + w.warlike : 0);
        if (bid === 'defense') s += (Diplo.wars(e.id).length ? 4 + w.warlike * 2 : .4) + (p.cap ? 1.5 : 0);
        if (bid === 'ring') s += 7 + w.eco * 2;
        s -= lv * 1.2;
        if (s > bs) { bs = s; bestP = p; bestB = bid; }
      });
    });
    if (bestP && bestB) Sim.queueBuilding(e.id, bestP.id, bestB);
  },
  military(e, w, d) {
    const wars = Diplo.wars(e.id);
    const warFleets = S.fl.filter(f => f.owner === e.id && Sim.has(f, 'war'));
    const power = Sim.empPower(e.id);
    /* 造舰：战争或性格驱动 */
    const shipQ = S.queue.filter(q => q.emp === e.id && q.kind === 'ship' && SHIPS[q.id].role === 'war').length;
    const wantShips = Math.round((wars.length ? 4 : 2) * w.warlike * d.aiWar) + Math.floor(S.month / 40);
    const have = warFleets.reduce((s, f) => s + Sim.count(f, 'war'), 0);
    if (shipQ < 2 && have < wantShips + 4 && e.res.minerals > 140) {
      const dock = AI.dockSys(e);
      if (dock >= 0) {
        let cls = 'corv';
        if (Econ.unlocked(e, 'dread') && e.res.minerals > 620 && S.month > 90) cls = 'dread';
        else if (e.res.minerals > 320 && S.month > 55) cls = 'cruis';
        else if (e.res.minerals > 180 && S.month > 24) cls = 'dest';
        Sim.queueShip(e.id, dock, cls);
      }
    }
    /* 舰队集结与出击 */
    const mainFleet = warFleets.sort((a, b) => Sim.power(b) - Sim.power(a))[0];
    if (!mainFleet) return;
    /* 合并零散舰队 */
    warFleets.forEach(f => {
      if (f === mainFleet || f.path.length) return;
      if (f.sys === mainFleet.sys && !mainFleet.path.length) { Sim.merge(mainFleet); return; }
      if (Sim.power(f) < Sim.power(mainFleet) * .6 && Rand.chance(.5)) Sim.order(f, mainFleet.path.length ? mainFleet.path[mainFleet.path.length - 1] : mainFleet.sys);
    });
    if (mainFleet.path.length) return;
    /* 防守：本土被围攻 */
    const besieged = S.pl.filter(p => p.owner === e.id && p.siege > 0);
    if (besieged.length && Rand.chance(.8)) { Sim.order(mainFleet, besieged[0].sys); return; }
    if (wars.length) {
      /* 进攻目标：敌方最弱的殖民星系 */
      let best = -1, bs = -1e9;
      wars.forEach(en => {
        S.pl.forEach(p => {
          if (p.owner !== en) return;
          if (State.known(e.id, p.sys) < 1) return;
          const def = Sim.fleetsAt(p.sys, en).reduce((s, f) => s + Sim.power(f), 0) + (p.dhp || 0) * .4;
          const dd = Galaxy.bfs(mainFleet.sys, S.sys)[p.sys];
          if (dd < 0) return;
          const s = (p.cap ? 30 : 0) + p.pop * 2 - def * .06 - dd * 5;
          if (s > bs) { bs = s; best = p.sys; }
        });
      });
      const myPower = Sim.power(mainFleet);
      if (best >= 0) {
        const defPow = Sim.fleetsAt(best).filter(f => Combat.hostile(f.owner, e.id)).reduce((s, f) => s + Sim.power(f), 0);
        if (myPower > defPow * .85 || Rand.chance(.15)) { Sim.order(mainFleet, best); return; }
      }
    }
    /* 清剿掠夺者，扩大疆域 */
    if (Rand.chance(.28)) {
      let best = -1, bs = -1e9;
      S.sys.forEach(sy => {
        if (State.known(e.id, sy.id) < 1) return;
        const pir = Sim.fleetsAt(sy.id, -1);
        if (!pir.length) return;
        const pw = pir.reduce((s, f) => s + Sim.power(f), 0);
        if (pw > Sim.power(mainFleet) * .75) return;
        const dd = Galaxy.bfs(mainFleet.sys, S.sys)[sy.id];
        if (dd < 0) return;
        const s = 10 - dd * 3 + (sy.dep.minerals + sy.dep.energy);
        if (s > bs) { bs = s; best = sy.id; }
      });
      if (best >= 0) { Sim.order(mainFleet, best); return; }
    }
    /* 巡逻回防首都 */
    if (mainFleet.sys !== e.home && Rand.chance(.1)) Sim.order(mainFleet, e.home);
  },
};

/* ================================================================================
   16) VICTORY —— 征服 / 科技 / 发展 三线胜负判定
   ================================================================================ */
const DEV_GOAL = { colonies: 10, pop: 130, output: 120, techs: 18 };
const Victory = {
  devProgress(e) {
    const pop = S.pl.filter(p => p.owner === e.id).reduce((s, p) => s + p.pop, 0);
    const out = Math.max(0, e.inc.energy + e.upkeepFleet + e.upkeepBld) + Math.max(0, e.inc.minerals);
    return {
      colonies: e.colonies || 0, pop: pop, output: out, techs: e.tech.done.length,
      pct: Math.min(1, ((e.colonies || 0) / DEV_GOAL.colonies) * .25 + (pop / DEV_GOAL.pop) * .25 +
        (out / DEV_GOAL.output) * .25 + (e.tech.done.length / DEV_GOAL.techs) * .25),
      done: (e.colonies || 0) >= DEV_GOAL.colonies && pop >= DEV_GOAL.pop && out >= DEV_GOAL.output && e.tech.done.length >= DEV_GOAL.techs,
    };
  },
  check() {
    if (S.over) return;
    const alive = S.emp.filter(e => !e.dead);
    const player = S.emp[0];
    if (player.dead || !S.pl.some(p => p.owner === 0)) { Victory.trigger('eliminated', -1); return; }
    if (alive.length === 1 && alive[0].id === 0) { Victory.trigger('conquest', 0); return; }
    /* AI 征服胜利：只剩一个非玩家文明且玩家已灭亡 —— 由上一条覆盖 */
    for (let i = 0; i < S.emp.length; i++) {
      const e = S.emp[i];
      if (e.dead) continue;
      if (e.tech.done.indexOf('final_trans') >= 0) { Victory.trigger('tech', e.id); return; }
      const d = Victory.devProgress(e);
      if (d.done) { Victory.trigger('dev', e.id); return; }
      if (!e.isPlayer) {
        const others = S.emp.filter(o => !o.dead && o.id !== e.id);
        if (!others.length) { Victory.trigger('conquest', e.id); return; }
      }
    }
  },
  trigger(kind, empId) {
    if (S.over) return;
    const win = empId === 0;
    const t = { conquest: '征服胜利', tech: '科技胜利', dev: '发展胜利', eliminated: '帝国覆灭' }[kind] || kind;
    S.over = { kind: kind, win: win, emp: empId, month: S.month, title: t };
    Game.setSpeed(0);
    Log.add('════ ' + (win ? '★ ' + t : (empId >= 0 ? S.emp[empId].name + ' 达成' + t : t)) + ' ════', win ? 'good' : 'war');
    Sfx.play(win ? 'victory' : 'lose');
    UI.openModal('over');
  },
};

/* ================================================================================
   17) SAVESYS —— localStorage 存档 / 自动存档 / JSON 导入导出
   ================================================================================ */
const SaveSys = {
  PRE: 'stellarEmpire.v4.',
  slots: ['auto', 's1', 's2', 's3'],
  mem: {},
  avail: null,
  ok() {
    if (SaveSys.avail !== null) return SaveSys.avail;
    try {
      window.localStorage.setItem(SaveSys.PRE + 'probe', '1');
      window.localStorage.removeItem(SaveSys.PRE + 'probe');
      SaveSys.avail = true;
    } catch (e) { SaveSys.avail = false; }
    return SaveSys.avail;
  },
  setRaw(k, v) { if (SaveSys.ok()) { try { window.localStorage.setItem(SaveSys.PRE + k, v); return true; } catch (e) { SaveSys.mem[k] = v; return false; } } SaveSys.mem[k] = v; return false; },
  getRaw(k) { if (SaveSys.ok()) { try { const v = window.localStorage.getItem(SaveSys.PRE + k); if (v !== null) return v; } catch (e) { } } return SaveSys.mem[k] || null; },
  delRaw(k) { if (SaveSys.ok()) { try { window.localStorage.removeItem(SaveSys.PRE + k); } catch (e) { } } delete SaveSys.mem[k]; },
  pack() {
    return JSON.stringify({
      magic: 'STELLAR_EMPIRE', ver: V.ver, at: Date.now(),
      meta: { emp: S.emp[0].name, month: S.month, date: Util.date(S.month), seed: S.seed, size: S.size, diff: S.diff, colonies: S.emp[0].colonies || 0, techs: S.emp[0].tech.done.length },
      cam: { x: V.cam.x, y: V.cam.y, z: V.cam.z },
      state: S,
    });
  },
  save(slot) {
    if (!S) return { ok: false, msg: '没有进行中的对局。' };
    const data = SaveSys.pack();
    const hard = SaveSys.setRaw(slot, data);
    if (slot !== 'auto') {
      Toast.show(hard ? '已保存到「' + SaveSys.label(slot) + '」' : '浏览器禁用了本地存储，已保存到内存（刷新会丢失）', hard ? 'g' : 'w', 'save');
      Sfx.play('done');
    }
    return { ok: true, hard: hard, bytes: data.length };
  },
  label(slot) { return { auto: '自动存档', s1: '存档 1', s2: '存档 2', s3: '存档 3' }[slot] || slot; },
  info(slot) {
    const raw = SaveSys.getRaw(slot);
    if (!raw) return null;
    try { const o = JSON.parse(raw); return { meta: o.meta, at: o.at, ver: o.ver, bytes: raw.length }; } catch (e) { return null; }
  },
  list() { return SaveSys.slots.map(s => ({ slot: s, label: SaveSys.label(s), info: SaveSys.info(s) })); },
  load(slot) {
    const raw = SaveSys.getRaw(slot);
    if (!raw) return { ok: false, msg: '该槽位没有存档。' };
    return SaveSys.loadText(raw);
  },
  loadText(raw) {
    let o;
    try { o = JSON.parse(raw); } catch (e) { return { ok: false, msg: '存档解析失败：不是有效的 JSON。' }; }
    if (!o || o.magic !== 'STELLAR_EMPIRE' || !o.state) return { ok: false, msg: '存档格式不匹配（缺少标识）。' };
    if (o.ver !== V.ver) return { ok: false, msg: '存档版本为 ' + o.ver + '，当前版本 ' + V.ver + '，无法读取。' };
    const st = o.state;
    if (!st.sys || !st.emp || !st.pl) return { ok: false, msg: '存档内容不完整。' };
    S = st;
    S.emp.forEach(e => { e.timed = e.timed || []; Econ.recalc(e); });
    Sim.recalcAll();
    if (o.cam) { V.cam.x = o.cam.x; V.cam.y = o.cam.y; V.cam.z = o.cam.z; }
    V.bgSeed = -1; V.fx.length = 0; V.logDirty = true; V.needUI = true;
    S.speed = 0;
    Game.started = true;
    UI.closeModal();
    UI.buildLegend();
    Render.resize();
    if (!o.cam) Game.focusHome();
    UI.renderAll();
    if (S.pending.length) UI.refreshEvent();
    if (S.over) UI.openModal('over');
    Toast.show('存档已载入：' + Util.date(S.month) + ' · ' + S.emp[0].name, 'g', 'save');
    return { ok: true };
  },
  del(slot) { SaveSys.delRaw(slot); Toast.show('已删除「' + SaveSys.label(slot) + '」', 'w', 'x'); },
  auto() { SaveSys.save('auto'); },
  hasAny() { return SaveSys.slots.some(s => !!SaveSys.getRaw(s)); },
  exportFile() {
    const data = SaveSys.pack();
    try {
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'stellar_empire_' + Util.date(S.month).replace('.', '_') + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 800);
      Toast.show('存档已导出为 JSON 文件', 'g', 'save');
    } catch (e) {
      UI.showText('导出失败，请手动复制下方 JSON：', data);
    }
    return data;
  },
};
/* ================================================================================
   18) FX —— 轻量视觉特效池（固定上限，避免每帧新建大量对象）
   ================================================================================ */
const Fx = {
  boom(x, y, size) { Fx.push({ t: 'boom', x: x, y: y, r: size || 14, a: 1, life: 1 }); },
  pulse(x, y, color) { Fx.push({ t: 'pulse', x: x, y: y, r: 6, a: 1, life: 1, c: color || '#3fe0e0' }); },
  push(o) { if (V.fx.length > 44) V.fx.shift(); V.fx.push(o); },
  step(dt) {
    for (let i = V.fx.length - 1; i >= 0; i--) {
      const f = V.fx[i];
      f.life -= dt * (f.t === 'boom' ? 1.5 : 1.1);
      if (f.life <= 0) V.fx.splice(i, 1);
    }
  },
};

/* ================================================================================
   19) RENDER —— Canvas 银河地图（程序化星云 / 战争迷雾 / 舰队 / 特效）
   ================================================================================ */
const Render = {
  cv: null, ctx: null, w: 0, h: 0, dpr: 1,
  init() {
    Render.cv = $('map');
    Render.ctx = Render.cv.getContext('2d');
    Render.resize();
  },
  resize() {
    const cv = Render.cv;
    if (!cv) return;
    const st = $('stage');
    const w = Math.max(320, st.clientWidth), h = Math.max(240, st.clientHeight);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    Render.w = w; Render.h = h; Render.dpr = dpr;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    Render.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },
  sx(wx) { return (wx - V.cam.x) * V.cam.z + Render.w / 2; },
  sy(wy) { return (wy - V.cam.y) * V.cam.z + Render.h / 2; },
  wx(sx) { return (sx - Render.w / 2) / V.cam.z + V.cam.x; },
  wy(sy) { return (sy - Render.h / 2) / V.cam.z + V.cam.y; },
  /* ---- 程序化星云背景（一次性生成，随后仅做变换绘制） ---- */
  makeBg() {
    const scale = .5;
    const bw = Math.round(S.W * scale), bh = Math.round(S.H * scale);
    const c = document.createElement('canvas');
    c.width = bw; c.height = bh;
    const x = c.getContext('2d');
    const rng = new RNG(Util.hash('bg' + S.seed));
    x.fillStyle = '#04070f';
    x.fillRect(0, 0, bw, bh);
    /* 星云团 */
    const pal = ['#1d4f8c', '#5b2f96', '#0f6d78', '#8c5a1f', '#2a2f7a', '#0d5a5f'];
    x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 34; i++) {
      const cx = rng.f(-.05, 1.05) * bw, cy = rng.f(-.05, 1.05) * bh;
      const r = rng.f(bw * .06, bw * .3);
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      const col = rng.pick(pal);
      g.addColorStop(0, col + '44');
      g.addColorStop(.45, col + '1c');
      g.addColorStop(1, col + '00');
      x.fillStyle = g;
      x.beginPath(); x.arc(cx, cy, r, 0, 6.2832); x.fill();
    }
    /* 星尘 */
    for (let i = 0; i < 2600; i++) {
      const px = rng.next() * bw, py = rng.next() * bh, s = rng.next();
      const a = s * s * .8 + .05;
      x.fillStyle = 'rgba(' + Math.round(190 + rng.next() * 65) + ',' + Math.round(205 + rng.next() * 50) + ',255,' + a.toFixed(2) + ')';
      const sz = s > .93 ? 1.6 : s > .7 ? 1.1 : .7;
      x.fillRect(px, py, sz, sz);
    }
    /* 亮星 + 十字光芒 */
    for (let i = 0; i < 46; i++) {
      const px = rng.next() * bw, py = rng.next() * bh, r = rng.f(1.6, 3.4);
      const g = x.createRadialGradient(px, py, 0, px, py, r * 7);
      g.addColorStop(0, 'rgba(255,255,255,.85)');
      g.addColorStop(.25, 'rgba(160,210,255,.28)');
      g.addColorStop(1, 'rgba(120,180,255,0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(px, py, r * 7, 0, 6.2832); x.fill();
      x.strokeStyle = 'rgba(190,225,255,.3)';
      x.lineWidth = .8;
      x.beginPath(); x.moveTo(px - r * 5, py); x.lineTo(px + r * 5, py); x.moveTo(px, py - r * 5); x.lineTo(px, py + r * 5); x.stroke();
    }
    x.globalCompositeOperation = 'source-over';
    V.bg = c; V.bgSeed = S.seed;
    /* 闪烁星（屏幕空间，少量） */
    V.twinkle = [];
    for (let i = 0; i < 70; i++) V.twinkle.push({ x: rng.next(), y: rng.next(), p: rng.f(0, 6.28), s: rng.f(.6, 2.2) });
  },
  frame(now) {
    const ctx = Render.ctx;
    if (!ctx || !S) return;
    if (V.bgSeed !== S.seed || !V.bg) Render.makeBg();
    const w = Render.w, h = Render.h, z = V.cam.z;
    ctx.clearRect(0, 0, w, h);
    /* 背景星云 */
    const bx = Render.sx(0), by = Render.sy(0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(V.bg, bx, by, S.W * z, S.H * z);
    /* 边界外的暗场 */
    ctx.fillStyle = 'rgba(2,4,9,.55)';
    if (bx > 0) ctx.fillRect(0, 0, bx, h);
    if (by > 0) ctx.fillRect(0, 0, w, by);
    const ex = bx + S.W * z, ey = by + S.H * z;
    if (ex < w) ctx.fillRect(ex, 0, w - ex, h);
    if (ey < h) ctx.fillRect(0, ey, w, h - ey);
    /* 闪烁前景星 */
    const t = now * .001;
    for (let i = 0; i < V.twinkle.length; i++) {
      const s = V.twinkle[i];
      const a = .18 + .3 * (.5 + .5 * Math.sin(t * 1.4 + s.p));
      ctx.fillStyle = 'rgba(210,235,255,' + a.toFixed(2) + ')';
      ctx.fillRect(s.x * w, s.y * h, s.s, s.s);
    }
    const P = 0;   /* 玩家帝国 id */
    /* ---------- 航道 ---------- */
    ctx.lineCap = 'round';
    for (let i = 0; i < S.lanes.length; i++) {
      const L = S.lanes[i], a = S.sys[L.a], b = S.sys[L.b];
      const ka = State.known(P, L.a), kb = State.known(P, L.b);
      if (!ka && !kb) continue;
      const x1 = Render.sx(a.x), y1 = Render.sy(a.y), x2 = Render.sx(b.x), y2 = Render.sy(b.y);
      if (Math.max(x1, x2) < -50 || Math.min(x1, x2) > w + 50 || Math.max(y1, y2) < -50 || Math.min(y1, y2) > h + 50) continue;
      const both = ka >= 1 && kb >= 1;
      const hi = V.laneHi[L.a + '_' + L.b] || V.laneHi[L.b + '_' + L.a];
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      if (hi) { ctx.strokeStyle = 'rgba(63,224,224,.85)'; ctx.lineWidth = 2.4; }
      else if (both) { ctx.strokeStyle = 'rgba(94,138,190,.42)'; ctx.lineWidth = 1.35; }
      else { ctx.strokeStyle = 'rgba(70,96,140,.2)'; ctx.lineWidth = 1; }
      ctx.stroke();
      /* 边境线：两端归属不同文明时着色 */
      if (both && a.owner >= 0 && b.owner >= 0 && a.owner !== b.owner && Diplo.atWar(a.owner, b.owner)) {
        ctx.strokeStyle = 'rgba(255,90,110,.3)'; ctx.lineWidth = 3.6; ctx.stroke();
      }
    }
    /* ---------- 星系 ---------- */
    for (let i = 0; i < S.sys.length; i++) {
      const sy = S.sys[i];
      const X = Render.sx(sy.x), Y = Render.sy(sy.y);
      if (X < -90 || X > w + 90 || Y < -90 || Y > h + 90) continue;
      const kn = State.known(P, i);
      if (kn === 0) { Render.fog(ctx, X, Y, z, t, i); continue; }
      Render.system(ctx, sy, X, Y, z, kn, t);
    }
    /* ---------- 舰队 ---------- */
    Sim.buildStacks();
    for (let i = 0; i < S.fl.length; i++) {
      const f = S.fl[i];
      const kn = State.known(P, f.sys);
      if (f.owner !== P && kn < 1) continue;
      if (f.owner !== P && f.path.length && State.known(P, f.path[0]) < 1) continue;
      Render.fleet(ctx, f, z, t);
    }
    /* ---------- 特效 ---------- */
    for (let i = 0; i < V.fx.length; i++) {
      const f = V.fx[i];
      const X = Render.sx(f.x), Y = Render.sy(f.y);
      if (f.t === 'boom') {
        const r = (1.15 - f.life) * f.r * z * 2.2 + 4;
        ctx.strokeStyle = 'rgba(255,' + Math.round(120 + f.life * 110) + ',80,' + (f.life * .85).toFixed(2) + ')';
        ctx.lineWidth = 2.4 * f.life + .6;
        ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.2832); ctx.stroke();
        ctx.fillStyle = 'rgba(255,190,120,' + (f.life * .22).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(X, Y, r * .6, 0, 6.2832); ctx.fill();
      } else {
        const r = (1.1 - f.life) * 46 * z + 3;
        ctx.strokeStyle = f.c + Math.round(f.life * 200).toString(16).padStart(2, '0');
        ctx.lineWidth = 2 * f.life + .5;
        ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.2832); ctx.stroke();
      }
    }
    /* ---------- 选中路径预览 ---------- */
    if (S.sel && S.sel.kind === 'fleet') {
      const f = Sim.fleet(S.sel.id);
      if (f && f.path.length > 1) {
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = 'rgba(63,224,224,.75)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        const p0 = Sim.pos(f);
        ctx.moveTo(Render.sx(p0.x), Render.sy(p0.y));
        for (let k = 1; k < f.path.length; k++) ctx.lineTo(Render.sx(S.sys[f.path[k]].x), Render.sy(S.sys[f.path[k]].y));
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    /* 悬停提示环 */
    if (V.hover !== null && V.hover >= 0) {
      const sy = S.sys[V.hover];
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(Render.sx(sy.x), Render.sy(sy.y), 15 * z + 6, 0, 6.2832); ctx.stroke();
    }
    /* 暗角 */
    if (!Render.vig || Render.vigW !== w || Render.vigH !== h) {
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .34, w / 2, h / 2, Math.max(w, h) * .78);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(2,4,10,.6)');
      Render.vig = g; Render.vigW = w; Render.vigH = h;
    }
    ctx.fillStyle = Render.vig;
    ctx.fillRect(0, 0, w, h);
  },
  fog(ctx, X, Y, z, t, id) {
    const r = 62 * z;
    const g = ctx.createRadialGradient(X, Y, 0, X, Y, r);
    g.addColorStop(0, 'rgba(30,40,70,.5)');
    g.addColorStop(.55, 'rgba(20,28,52,.34)');
    g.addColorStop(1, 'rgba(10,14,28,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.2832); ctx.fill();
    if (z > .45) {
      ctx.fillStyle = 'rgba(140,165,205,' + (.34 + .1 * Math.sin(t + id)).toFixed(2) + ')';
      ctx.font = Math.round(13 * Math.min(1.3, z)) + 'px var(--ffm),monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', X, Y);
    }
  },
  system(ctx, sy, X, Y, z, kn, t) {
    const st = ST(sy.star);
    const base = 6.2 * st.r;
    const r = base * Math.max(.55, Math.min(1.5, z));
    /* 光晕 */
    const g = ctx.createRadialGradient(X, Y, 0, X, Y, r * 5.2);
    g.addColorStop(0, st.col + 'cc');
    g.addColorStop(.22, st.col + '55');
    g.addColorStop(1, st.col + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(X, Y, r * 5.2, 0, 6.2832); ctx.fill();
    /* 恒星核心 */
    ctx.fillStyle = kn >= 2 ? st.col : 'rgba(150,170,200,.85)';
    ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.2832); ctx.fill();
    if (sy.star === 'binary' && kn >= 2) {
      ctx.beginPath(); ctx.arc(X + r * 1.9, Y - r * .7, r * .58, 0, 6.2832); ctx.fill();
    }
    /* 未勘测：问号环 */
    if (kn === 1) {
      ctx.strokeStyle = 'rgba(160,185,220,.5)';
      ctx.setLineDash([3, 4]);
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(X, Y, r + 5, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }
    /* 归属环 */
    if (sy.owner >= 0 && kn >= 1) {
      const e = S.emp[sy.owner];
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2.1;
      ctx.beginPath(); ctx.arc(X, Y, r + 7.5, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = e.color + '33';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(X, Y, r + 7.5, 0, 6.2832); ctx.stroke();
      /* 首都标记 */
      if (sy.planets.some(p => S.pl[p].cap && S.pl[p].owner === sy.owner)) {
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(X, Y, r + 11.5, 0, 6.2832); ctx.stroke();
      }
    }
    if (kn >= 2) {
      /* 资源矿藏标记 */
      const dep = sy.dep.energy + sy.dep.minerals;
      if (dep >= 4) {
        const n = Math.min(4, Math.round(dep / 3));
        for (let i = 0; i < n; i++) {
          const a = -1.15 + i * .42;
          const px = X + Math.cos(a) * (r + 15), py = Y + Math.sin(a) * (r + 15);
          ctx.fillStyle = sy.dep.minerals >= sy.dep.energy ? '#c8a2ff' : '#ffb44d';
          ctx.beginPath();
          ctx.moveTo(px, py - 2.6); ctx.lineTo(px + 2.4, py); ctx.lineTo(px, py + 2.6); ctx.lineTo(px - 2.4, py);
          ctx.closePath(); ctx.fill();
        }
      }
      /* 宜居星球标记 */
      const hab = sy.planets.filter(p => S.pl[p].owner < 0 && Sim.colonizable(S.pl[p], S.emp[0])).length;
      if (hab > 0) {
        ctx.strokeStyle = '#57e39b';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < Math.min(3, hab); i++) {
          ctx.beginPath();
          ctx.arc(X, Y, r + 13 + i * 3.2, 2.1, 3.5);
          ctx.stroke();
        }
      }
      /* 异常现象 */
      if (sy.anomaly) {
        const pr = .5 + .5 * Math.sin(t * 2.4 + sy.id);
        ctx.strokeStyle = 'rgba(63,224,224,' + (.5 + pr * .45).toFixed(2) + ')';
        ctx.lineWidth = 1.4;
        const rr = r + 9 + pr * 3;
        for (let i = 0; i < 4; i++) {
          const a = t * .6 + i * 1.5708;
          ctx.beginPath();
          ctx.moveTo(X + Math.cos(a) * rr, Y + Math.sin(a) * rr);
          ctx.lineTo(X + Math.cos(a) * (rr + 5), Y + Math.sin(a) * (rr + 5));
          ctx.stroke();
        }
      }
      /* 敌对据点 */
      if (sy.hostile > 0) {
        ctx.strokeStyle = 'rgba(255,90,110,.9)';
        ctx.lineWidth = 1.7;
        const rr = r + 10;
        ctx.beginPath();
        ctx.moveTo(X - rr, Y - rr); ctx.lineTo(X - rr + 6, Y - rr);
        ctx.moveTo(X - rr, Y - rr); ctx.lineTo(X - rr, Y - rr + 6);
        ctx.moveTo(X + rr, Y + rr); ctx.lineTo(X + rr - 6, Y + rr);
        ctx.moveTo(X + rr, Y + rr); ctx.lineTo(X + rr, Y + rr - 6);
        ctx.stroke();
      }
    }
    /* 围城指示 */
    const besieged = sy.planets.map(p => S.pl[p]).filter(p => p.siege > 0);
    if (besieged.length && kn >= 1) {
      const pr = Math.min(1, besieged[0].siege / 100);
      ctx.strokeStyle = 'rgba(255,80,100,.95)';
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(X, Y, r + 16, -1.5708, -1.5708 + 6.2832 * pr); ctx.stroke();
    }
    /* 选中 */
    if (S.sel && S.sel.kind === 'sys' && S.sel.id === sy.id) {
      ctx.strokeStyle = '#3fe0e0';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([5, 5]);
      ctx.save();
      ctx.translate(X, Y); ctx.rotate(t * .6);
      ctx.beginPath(); ctx.arc(0, 0, r + 19, 0, 6.2832); ctx.stroke();
      ctx.restore();
      ctx.setLineDash([]);
    }
    /* 名称 */
    if (z > .52 && kn >= 1) {
      ctx.font = (z > 1.1 ? 12 : 11) + 'px ' + Render.font;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const nm = sy.name;
      ctx.fillStyle = 'rgba(6,10,20,.65)';
      const tw = ctx.measureText(nm).width;
      ctx.fillRect(X - tw / 2 - 3, Y + r + 12, tw + 6, 14);
      ctx.fillStyle = sy.owner >= 0 ? S.emp[sy.owner].color : (kn >= 2 ? 'rgba(206,226,250,.92)' : 'rgba(150,172,205,.8)');
      ctx.fillText(nm, X, Y + r + 13);
    }
  },
  font: '"Segoe UI","Microsoft YaHei",sans-serif',
  fleet(ctx, f, z, t) {
    const p = Sim.pos(f);
    const X = Render.sx(p.x), Y = Render.sy(p.y);
    if (X < -40 || X > Render.w + 40 || Y < -40 || Y > Render.h + 40) return;
    const col = f.owner < 0 ? '#ff6b7d' : S.emp[f.owner].color;
    let ang = 0;
    if (f.path.length > 1) {
      const a = S.sys[f.path[0]], b = S.sys[f.path[1]];
      ang = Math.atan2(b.y - a.y, b.x - a.x);
    }
    const s = Util.clamp(z, .6, 1.5);
    const isWar = Sim.has(f, 'war');
    const io = Sim.iconOffset(f);
    const ox = io.x * s, oy = io.y * s;
    ctx.save();
    ctx.translate(X + ox, Y + oy);
    ctx.rotate(ang);
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(6,12,24,.85)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    if (!isWar) {
      const r = 4.6 * s;
      ctx.moveTo(r, 0); ctx.lineTo(0, r * .85); ctx.lineTo(-r, 0); ctx.lineTo(0, -r * .85);
    } else {
      const r = 6.2 * s;
      ctx.moveTo(r, 0); ctx.lineTo(-r * .75, r * .7); ctx.lineTo(-r * .35, 0); ctx.lineTo(-r * .75, -r * .7);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    /* 舰船数量 */
    if (z > .6 && f.ships.length > 1) {
      ctx.font = '9px ' + Render.font;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(4,8,16,.8)';
      const bx = X + ox + 8, by = Y + oy - 8;
      ctx.beginPath(); ctx.arc(bx, by, 7, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#dff';
      ctx.fillText(String(f.ships.length), bx, by + .5);
    }
    /* 选中舰队高亮 */
    if (S.sel && S.sel.kind === 'fleet' && S.sel.id === f.id) {
      ctx.strokeStyle = '#3fe0e0';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(X + ox, Y + oy, 13 * s, 0, 6.2832); ctx.stroke();
    }
    /* 勘测进度 */
    if (f.task === 'survey' && f.owner === 0) {
      ctx.strokeStyle = 'rgba(63,224,224,.9)';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(X + ox, Y + oy, 11 * s, -1.5708, -1.5708 + 6.2832 * Util.clamp(f.survey, 0, 1)); ctx.stroke();
    }
  },
};

/* ================================================================================
   20) MINIMAP —— 全银河缩略图与视口指示
   ================================================================================ */
const Minimap = {
  cv: null, ctx: null,
  init() {
    Minimap.cv = $('minimap');
    if (!Minimap.cv) return;
    Minimap.ctx = Minimap.cv.getContext('2d');
  },
  draw() {
    const ctx = Minimap.ctx;
    if (!ctx || !S) return;
    const w = Minimap.cv.width, h = Minimap.cv.height;
    const sc = Math.min(w / S.W, h / S.H) * .94;
    const ox = (w - S.W * sc) / 2, oy = (h - S.H * sc) / 2;
    V.mmScale = sc; V.mmOff.x = ox; V.mmOff.y = oy;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(4,8,16,.92)';
    ctx.fillRect(0, 0, w, h);
    /* 航道 */
    ctx.strokeStyle = 'rgba(80,110,160,.3)';
    ctx.lineWidth = .6;
    ctx.beginPath();
    S.lanes.forEach(L => {
      if (!State.known(0, L.a) && !State.known(0, L.b)) return;
      ctx.moveTo(ox + S.sys[L.a].x * sc, oy + S.sys[L.a].y * sc);
      ctx.lineTo(ox + S.sys[L.b].x * sc, oy + S.sys[L.b].y * sc);
    });
    ctx.stroke();
    /* 星系 */
    S.sys.forEach(sy => {
      const kn = State.known(0, sy.id);
      const x = ox + sy.x * sc, y = oy + sy.y * sc;
      if (!kn) { ctx.fillStyle = 'rgba(70,84,110,.55)'; ctx.fillRect(x - 1, y - 1, 2, 2); return; }
      if (sy.owner >= 0) { ctx.fillStyle = S.emp[sy.owner].color; ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 6.2832); ctx.fill(); }
      else if (sy.hostile > 0) { ctx.fillStyle = '#ff6b7d'; ctx.fillRect(x - 1.4, y - 1.4, 2.8, 2.8); }
      else { ctx.fillStyle = kn >= 2 ? 'rgba(190,215,245,.85)' : 'rgba(120,140,175,.7)'; ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 6.2832); ctx.fill(); }
    });
    /* 视口 */
    const vw = Render.w / V.cam.z * sc, vh = Render.h / V.cam.z * sc;
    ctx.strokeStyle = 'rgba(63,224,224,.85)';
    ctx.lineWidth = 1;
    ctx.strokeRect(ox + (V.cam.x) * sc - vw / 2, oy + (V.cam.y) * sc - vh / 2, vw, vh);
  },
  click(ev) {
    const r = Minimap.cv.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (Minimap.cv.width / r.width);
    const y = (ev.clientY - r.top) * (Minimap.cv.height / r.height);
    V.cam.x = Util.clamp((x - V.mmOff.x) / V.mmScale, 0, S.W);
    V.cam.y = Util.clamp((y - V.mmOff.y) / V.mmScale, 0, S.H);
  },
};

/* ================================================================================
   22) EVENTART —— 事件插画（程序化 Canvas，无外部图片）
   ================================================================================ */
const EventArt = {
  draw(cv, kind, seedStr) {
    const w = cv.width = cv.clientWidth || 640, h = cv.height = cv.clientHeight || 104;
    const x = cv.getContext('2d');
    const rng = new RNG(Util.hash('art' + kind + seedStr));
    const g = x.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#050a16'); g.addColorStop(.5, '#0a1428'); g.addColorStop(1, '#06101f');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 150; i++) {
      const px = rng.next() * w, py = rng.next() * h, s = rng.next();
      x.fillStyle = 'rgba(200,220,255,' + (s * .7 + .1).toFixed(2) + ')';
      x.fillRect(px, py, s > .9 ? 1.6 : .9, s > .9 ? 1.6 : .9);
    }
    const cx = w * .5, cy = h * .55;
    const glow = (col, r, a) => {
      const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      rg.addColorStop(0, col + a); rg.addColorStop(1, col + '00');
      x.fillStyle = rg; x.fillRect(0, 0, w, h);
    };
    if (kind === 'wreck') {
      glow('#3fe0e0', h * 1.1, '22');
      x.strokeStyle = 'rgba(150,190,220,.85)'; x.lineWidth = 3;
      x.beginPath(); x.ellipse(cx, cy, h * .42, h * .34, .4, .6, 5.4); x.stroke();
      x.lineWidth = 1.4; x.strokeStyle = 'rgba(110,150,185,.7)';
      x.beginPath(); x.ellipse(cx, cy, h * .3, h * .24, .4, 0, 6.28); x.stroke();
      for (let i = 0; i < 26; i++) {
        const a = rng.f(0, 6.28), r = rng.f(h * .45, h * .95);
        x.fillStyle = 'rgba(170,200,230,' + rng.f(.25, .8).toFixed(2) + ')';
        x.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r * .6, rng.f(1, 3.4), rng.f(1, 2.6));
      }
    } else if (kind === 'planet') {
      glow('#4aa8ff', h * 1.2, '1c');
      const r = h * .44;
      const pg = x.createRadialGradient(cx - r * .35, cy - r * .35, r * .1, cx, cy, r);
      pg.addColorStop(0, '#8fd7ff'); pg.addColorStop(.55, '#2e6fa8'); pg.addColorStop(1, '#0a1f38');
      x.fillStyle = pg; x.beginPath(); x.arc(cx, cy, r, 0, 6.28); x.fill();
      x.strokeStyle = 'rgba(140,210,255,.55)'; x.lineWidth = 1.2;
      for (let i = 0; i < 4; i++) { x.beginPath(); x.ellipse(cx, cy, r * (.9 - i * .16), r * (.28 - i * .05), .2, 0, 6.28); x.stroke(); }
    } else if (kind === 'signal') {
      glow('#9d7bff', h * 1.1, '20');
      x.strokeStyle = 'rgba(180,150,255,.8)';
      for (let i = 0; i < 5; i++) { x.lineWidth = 2 - i * .3; x.beginPath(); x.arc(cx, cy, h * (.16 + i * .16), -1.1, 1.1); x.stroke(); }
      x.fillStyle = '#e6dcff';
      x.beginPath(); x.moveTo(cx - h * .1, cy); x.lineTo(cx, cy - h * .18); x.lineTo(cx + h * .1, cy); x.lineTo(cx, cy + h * .18); x.closePath(); x.fill();
    } else if (kind === 'beast') {
      glow('#57e39b', h * 1.2, '1a');
      for (let i = 0; i < 5; i++) {
        const px = cx + rng.f(-w * .34, w * .34), py = cy + rng.f(-h * .3, h * .28), s = rng.f(.5, 1.25);
        x.strokeStyle = 'rgba(150,240,200,' + rng.f(.4, .9).toFixed(2) + ')'; x.lineWidth = 1.8 * s;
        x.beginPath();
        x.moveTo(px - 26 * s, py); x.quadraticCurveTo(px, py - 15 * s, px + 26 * s, py);
        x.quadraticCurveTo(px, py + 6 * s, px - 26 * s, py);
        x.stroke();
      }
    } else if (kind === 'rift') {
      glow('#c46bff', h * 1.3, '24');
      x.strokeStyle = 'rgba(230,200,255,.95)'; x.lineWidth = 2.2;
      x.beginPath();
      let px = cx, py = 4;
      x.moveTo(px, py);
      while (py < h - 4) { py += rng.f(6, 14); px += rng.f(-9, 9); x.lineTo(px, py); }
      x.stroke();
      x.strokeStyle = 'rgba(160,110,255,.4)'; x.lineWidth = 7; x.stroke();
    } else if (kind === 'ruin') {
      glow('#ffb44d', h * 1.1, '18');
      x.strokeStyle = 'rgba(255,215,160,.85)'; x.lineWidth = 2;
      x.beginPath(); x.arc(cx, cy + h * .3, h * .46, Math.PI * 1.15, Math.PI * 1.85); x.stroke();
      x.lineWidth = 1.2;
      for (let i = 0; i < 7; i++) {
        const a = Math.PI * (1.18 + i * .1);
        x.beginPath(); x.moveTo(cx, cy + h * .3); x.lineTo(cx + Math.cos(a) * h * .46, cy + h * .3 + Math.sin(a) * h * .46); x.stroke();
      }
      x.fillStyle = 'rgba(255,225,180,.9)';
      x.beginPath(); x.arc(cx, cy - h * .12, 3.4, 0, 6.28); x.fill();
    } else {
      glow('#ff6b7d', h * 1.2, '20');
      for (let i = 0; i < 7; i++) {
        const x1 = rng.f(0, w), y1 = rng.f(0, h), x2 = x1 + rng.f(-90, 90), y2 = y1 + rng.f(-40, 40);
        x.strokeStyle = 'rgba(255,' + Math.round(rng.f(120, 210)) + ',140,' + rng.f(.4, .9).toFixed(2) + ')';
        x.lineWidth = rng.f(.8, 2.4);
        x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke();
      }
      for (let i = 0; i < 4; i++) {
        const px = rng.f(w * .2, w * .8), py = rng.f(h * .2, h * .8), r = rng.f(6, 17);
        const rg = x.createRadialGradient(px, py, 0, px, py, r);
        rg.addColorStop(0, 'rgba(255,230,180,.95)'); rg.addColorStop(.4, 'rgba(255,140,90,.5)'); rg.addColorStop(1, 'rgba(255,90,60,0)');
        x.fillStyle = rg; x.beginPath(); x.arc(px, py, r, 0, 6.28); x.fill();
      }
    }
    x.fillStyle = 'rgba(4,8,16,.35)';
    x.fillRect(0, h - 14, w, 14);
  },
};

/* ================================================================================
   23) SFX —— Web Audio 程序化音效（无外部音频）
   ================================================================================ */
const Sfx = {
  ctx: null, gain: null,
  init() {
    if (Sfx.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      Sfx.ctx = new AC();
      Sfx.gain = Sfx.ctx.createGain();
      Sfx.gain.gain.value = .16;
      Sfx.gain.connect(Sfx.ctx.destination);
    } catch (e) { Sfx.ctx = null; }
  },
  tone(freq, dur, type, vol, slideTo) {
    if (!V.sound || !Sfx.ctx) return;
    try {
      const c = Sfx.ctx, t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol === undefined ? .5 : vol, t + Math.min(.02, dur * .2));
      g.gain.exponentialRampToValueAtTime(.0008, t + dur);
      o.connect(g); g.connect(Sfx.gain);
      o.start(t); o.stop(t + dur + .02);
    } catch (e) { }
  },
  noise(dur, vol, filterFreq) {
    if (!V.sound || !Sfx.ctx) return;
    try {
      const c = Sfx.ctx, t = c.currentTime;
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const bp = c.createBiquadFilter(); bp.type = 'lowpass'; bp.frequency.value = filterFreq || 900;
      const g = c.createGain(); g.gain.value = vol === undefined ? .4 : vol;
      src.connect(bp); bp.connect(g); g.connect(Sfx.gain);
      src.start(t);
    } catch (e) { }
  },
  play(name) {
    if (!V.sound) return;
    Sfx.init();
    if (!Sfx.ctx) return;
    switch (name) {
      case 'click': Sfx.tone(620, .05, 'triangle', .3); break;
      case 'click2': Sfx.tone(430, .08, 'square', .16, 700); break;
      case 'ping': Sfx.tone(880, .16, 'sine', .3, 1320); break;
      case 'done': Sfx.tone(560, .1, 'triangle', .3); setTimeout(() => Sfx.tone(840, .14, 'triangle', .26), 90); break;
      case 'tech': Sfx.tone(520, .12, 'sine', .3); setTimeout(() => Sfx.tone(780, .12, 'sine', .28), 100); setTimeout(() => Sfx.tone(1040, .2, 'sine', .24), 200); break;
      case 'arrive': Sfx.tone(340, .09, 'sine', .2, 480); break;
      case 'colony': Sfx.tone(300, .16, 'sine', .3, 620); setTimeout(() => Sfx.tone(760, .2, 'triangle', .2), 140); break;
      case 'contact': Sfx.tone(660, .1, 'sine', .26); setTimeout(() => Sfx.tone(520, .18, 'sine', .22), 110); break;
      case 'war': Sfx.tone(180, .5, 'sawtooth', .26, 90); Sfx.noise(.5, .3, 500); break;
      case 'battleWin': Sfx.noise(.32, .3, 1100); Sfx.tone(420, .22, 'triangle', .24, 640); break;
      case 'battleLose': Sfx.noise(.42, .34, 420); Sfx.tone(260, .3, 'sawtooth', .2, 120); break;
      case 'capture': Sfx.tone(400, .14, 'square', .2); setTimeout(() => Sfx.tone(600, .18, 'square', .18), 120); break;
      case 'victory': [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => Sfx.tone(f, .42, 'triangle', .3), i * 150)); break;
      case 'lose': [392, 330, 262, 196].forEach((f, i) => setTimeout(() => Sfx.tone(f, .5, 'sine', .3), i * 190)); break;
      default: Sfx.tone(500, .05, 'sine', .16);
    }
  },
};
