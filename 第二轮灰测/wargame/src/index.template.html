<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060810">
<title>抵抗之弧 2026 · 三维兵棋推演（美国 / 以色列 vs 伊朗与抵抗之弧）</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="labels"></div>
<div id="floats"></div>

<header class="topbar">
  <div class="brand">
    <span class="lg">WAR<br>GAME</span>
    <div><h1>抵抗之弧 2026</h1><span>三维兵棋推演 · 数据基准日 2026-08-20</span></div>
  </div>
  <div id="turnInfo"></div>
  <div id="sideTag">蓝方</div>
  <div class="tbtns">
    <button id="btnAuto" class="ghost" title="让参谋部为未下令单位拟定指令">参谋部代拟</button>
    <button id="btnClear" class="ghost" title="清空我方全部指令">清空指令</button>
    <button id="btnLog" class="ghost">战报</button>
    <button id="btnBrief" class="ghost">情报简报</button>
    <button id="btnNew" class="ghost">新对局</button>
  </div>
</header>

<section class="panel" id="pLeft">
  <h3>战略指标</h3>
  <div id="meters"></div>
  <div id="flags"></div>
  <div id="legend">
    <div class="lgd-h">图例</div>
    <div class="lgd"><span class="sw sea"></span>海域/海峡<span class="sw des"></span>荒漠<span class="sw mtn"></span>山地<span class="sw urb"></span>城区</div>
    <div class="lgd"><span class="mk cone"></span>核设施<span class="mk box"></span>基地<span class="mk cap"></span>首都<span class="mk chip b"></span>蓝方棋子<span class="mk chip r"></span>红方棋子</div>
  </div>
</section>

<section class="panel" id="pRight">
  <h3>指令与兵力</h3>
  <div id="orders"></div>
  <div id="force"></div>
</section>

<div class="panel" id="logWrap"><div id="log"></div></div>

<div class="bottom">
  <button id="btnResolve" class="primary">结算回合</button>
  <button id="btnSkip" class="ghost">跳过动画</button>
</div>
<div class="hintbar">左键拖动旋转视角 · 右键/Shift 拖动平移 · 滚轮缩放 · 点击棋子下达指令</div>

<div id="toast"></div>
<div id="modal" class="modal"></div>

<script>
/*__JS__*/
</script>
</body>
</html>
