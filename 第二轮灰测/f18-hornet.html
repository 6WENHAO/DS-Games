<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>F/A-18E 超级大黄蜂 · 交互式 3D 模型</title>
<style>
  :root {
    --bg: #070a0d;
    --panel: rgba(9, 14, 19, 0.74);
    --panel-solid: rgba(9, 14, 19, 0.92);
    --line: rgba(124, 166, 196, 0.2);
    --line-strong: rgba(124, 196, 226, 0.42);
    --txt: #d2dbe2;
    --dim: #7c8b98;
    --accent: #63d1ff;
    --amber: #ffb347;
    --mono: 'Cascadia Mono', Consolas, 'SF Mono', ui-monospace, monospace;
    --sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font-family: var(--sans); }
  #viewport { position: fixed; inset: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }

  #labels, #ui-layer { position: fixed; inset: 0; pointer-events: none; }
  #ui-layer > .ui-root { position: absolute; inset: 0; }

  /* ---------- cards ---------- */
  .card {
    position: absolute;
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    backdrop-filter: blur(14px) saturate(1.1);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .card::before, .card::after {
    content: ''; position: absolute; width: 9px; height: 9px; pointer-events: none;
    border: 1px solid var(--line-strong);
  }
  .card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* ---------- title ---------- */
  .title { top: 18px; left: 18px; padding: 13px 20px 12px; min-width: 268px; }
  .t-main { font-size: 21px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.1; }
  .t-main span { color: var(--accent); font-weight: 400; }
  .t-sub { margin-top: 5px; font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.14em; }
  .t-meta { margin-top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--dim); letter-spacing: 0.04em; }

  /* ---------- panels ---------- */
  .panel { top: 118px; left: 18px; width: 306px; max-height: calc(100vh - 250px); display: flex; flex-direction: column; }
  .specs { right: 18px; bottom: 18px; width: 320px; max-height: 62vh; display: flex; flex-direction: column; }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    color: var(--accent); border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .panel-head .collapse {
    background: none; border: 1px solid var(--line); color: var(--dim);
    width: 20px; height: 20px; line-height: 1; border-radius: 2px; cursor: pointer; font-family: var(--mono);
  }
  .panel-head .collapse:hover { color: var(--accent); border-color: var(--line-strong); }
  .panel-body { padding: 4px 12px 12px; overflow-y: auto; overscroll-behavior: contain; }
  .card.collapsed .panel-body { display: none; }
  .panel-body::-webkit-scrollbar { width: 7px; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(120, 170, 200, 0.28); border-radius: 4px; }

  .sec { padding: 9px 0 4px; border-top: 1px dashed rgba(124, 166, 196, 0.14); }
  .sec:first-child { border-top: 0; }
  .sec-title { font-family: var(--mono); font-size: 9.6px; letter-spacing: 0.2em; color: var(--dim); margin-bottom: 7px; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .btn, .tgl {
    font-family: var(--sans); font-size: 11.5px; padding: 5px 8px; cursor: pointer;
    background: rgba(255, 255, 255, 0.035); color: var(--txt);
    border: 1px solid var(--line); border-radius: 2px; transition: 0.14s;
  }
  .btn:hover, .tgl:hover { background: rgba(99, 209, 255, 0.12); border-color: var(--line-strong); }
  .btn.on { background: rgba(99, 209, 255, 0.2); border-color: var(--accent); color: #eaf7ff; }
  .btn.wide { width: 100%; }
  .tgl-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .tgl { font-size: 11px; }
  .tgl.on { background: rgba(255, 179, 71, 0.18); border-color: var(--amber); color: #ffe6c2; }

  .ctl { margin: 4px 0 9px; }
  .ctl-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .ctl-head label { font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }
  .ctl-head .val { font-family: var(--mono); font-size: 11px; color: var(--amber); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: rgba(124, 166, 196, 0.26); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid #0b1116; cursor: pointer; box-shadow: 0 0 8px rgba(99, 209, 255, 0.6);
  }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid #0b1116; cursor: pointer; }

  .manifest { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip {
    font-family: var(--mono); font-size: 10px; padding: 3px 6px; border-radius: 2px;
    background: rgba(99, 209, 255, 0.09); border: 1px solid rgba(99, 209, 255, 0.2); color: #bfe6f7;
  }
  .chip.dim { background: rgba(255, 255, 255, 0.03); border-color: var(--line); color: var(--dim); }

  .spec-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .spec-table th { text-align: left; font-weight: 400; color: var(--dim); padding: 3px 8px 3px 0; white-space: nowrap; vertical-align: top; }
  .spec-table td { text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--txt); padding: 3px 0; }
  .live { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
  .live-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11px; }
  .live-grid span { color: var(--dim); }
  .live-grid b { font-family: var(--mono); font-size: 10.5px; color: var(--amber); text-align: right; }

  .hints {
    left: 18px; bottom: 18px; padding: 8px 12px; max-width: 306px;
    display: flex; flex-wrap: wrap; gap: 4px 9px; align-items: center;
    font-size: 10.5px; color: var(--dim);
  }
  .hints b { font-family: var(--mono); font-size: 9.6px; letter-spacing: 0.18em; color: var(--accent); width: 100%; }
  kbd {
    font-family: var(--mono); font-size: 9.5px; padding: 1px 4px; border-radius: 2px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); color: var(--txt);
  }

  /* ---------- 3D labels ---------- */
  .label {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    padding: 3px 7px; border-radius: 2px;
    background: rgba(7, 12, 16, 0.7); border: 1px solid rgba(99, 209, 255, 0.28);
    border-left: 2px solid var(--accent);
    font-size: 10.5px; line-height: 1.25; color: #dcecf5;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .label b { display: block; font-weight: 600; }
  .label i { font-family: var(--mono); font-style: normal; font-size: 9px; color: var(--dim); letter-spacing: 0.05em; }

  /* ---------- boot overlay ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; gap: 14px;
    background: radial-gradient(60% 60% at 50% 45%, #0e161d, #05080a 80%);
    transition: opacity 0.6s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .bt { font-family: var(--mono); font-size: 12px; letter-spacing: 0.24em; color: var(--accent); text-align: center; }
  #boot .bar { width: 220px; height: 2px; background: rgba(99, 209, 255, 0.18); overflow: hidden; }
  #boot .bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  @media (max-width: 900px) {
    .panel { width: 262px; top: 104px; }
    .specs { width: 250px; max-height: 44vh; }
    .hints { display: none; }
    .t-main { font-size: 17px; }
  }
</style>
</head>

  <div id="viewport"></div>
  <div id="labels"></div>
  <div id="ui-layer"></div>
  <div id="boot">
    <div class="bt">生成机体几何 · BUILDING AIRFRAME</div>
    <div class="bar"><i></i></div>
  </div>
