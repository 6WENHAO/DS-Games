    var o = document.getElementById('overlay');
    if (o) o.classList.add('hidden');
  };
  window.addEventListener('error', function (ev) {
    if (window.__BR_READY) return;
    var t = ev && ev.target;
    if (t && t.tagName === 'SCRIPT') {
      window.__BR_FATAL('依赖加载失败', '无法从 CDN 载入 Three.js 模块，请检查网络连接后刷新页面。');

  }, true);
  setTimeout(function () {
    if (window.__BR_READY) return;
    var n = document.getElementById('loadNote');

  }, 9000);
})();

<script type="module">
/* ==========================================================================
   BACKROOMS · LEVEL 0  —  单文件 Three.js 场景
   --------------------------------------------------------------------------
   · 全部纹理 = 程序化生成（周期性 Perlin / Worley / 白噪声 → DataTexture）
   · 全部音频 = Web Audio API 实时合成（嗡鸣 / 电流 / 脚步 / 灯管故障）
   · 静态几何体 mergeGeometries 合并，重复物件 InstancedMesh + 分块距离剔除
   · 光照：AmbientLight + HemisphereLight + RectAreaLight 池 + 阴影 SpotLight 池
   主要入口：initScene / generateTextures / buildLevel / setupLights / setupAudio / animate
   ========================================================================== */

import * as THREE from 'three';
import { PointerLockControls }        from 'three/addons/controls/PointerLockControls.js';
import { RectAreaLightUniformsLib }   from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeGeometries }            from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer }             from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }                 from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }            from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }                 from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }                 from 'three/addons/postprocessing/OutputPass.js';

/* ============================ 0. 配置 ============================ */

const CFG = {
  seed:        20240715,   // 关卡种子（确定性随机）
  grid:        51,         // 模块数 / 轴 → 51*3 = 153m（雾气可视距 ≈35m，观感无限）
  cell:        3.0,        // 模块尺寸（宽 = 深）
  wallH:       3.0,        // 层高
  wallT:       0.2,        // 墙厚

  texWall:     512,        // 纹理分辨率（≤1024）
  texFloor:    512,
  texCeil:     512,
  texStain:    256,

  wallTile:    1.5,        // 墙纸一个纹理周期对应的世界尺寸（m）
  floorTile:   1.5,        // 地毯
  ceilTile:    1.2,        // 吊顶（2×2 块 → 0.6m 一块）

  fogColor:    0xc9b98a,
  fogDensity:  0.0285,

  eyeH:        1.7,        // 视高
  radius:      0.30,       // 碰撞半径
  walkSpeed:   3.0,
  runSpeed:    4.8,
  accel:       26,
  damping:     11,
  bobAmp:      0.03,       // 头部摆动幅度
  stepRate:    2.05,       // 步频（Hz）

  rectLights:  6,          // RectAreaLight 池大小
  spotLights:  2,          // 投影 SpotLight 池大小
  shadowRange: 5.0,        // 仅玩家 5m 内的灯投影
  shadowMap:   2048,

  rectIntensity: 95.0,     // 面光亮度（灯管面积很小，nits 需较高）
  spotIntensity: 8.5,      // 与面光大致等效，切换灯池时无跳变
  lampColor:   0xd0e8ff,   // 冷白荧光
  deadRatio:   0.08,       // 坏灯比例

  dust:        1200,
  maxPixelRatio: 1.5,
};

const DEAD_DIM = 0.03;

/* ============================ 1. 工具 ============================ */

const clamp   = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp    = (a, b, t) => a + (b - a) * t;
function smoothstep(a, b, x) { const t = clamp01((x - a) / (b - a || 1e-6)); return t * t * (3 - 2 * t); }

/** 确定性 PRNG */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 可平铺噪声：周期性 Perlin / Worley / 白噪声 */
class Noise {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  hash(ix, iy) {
    let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(this.s, 2246822519);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  hashw(ix, iy, p) { return this.hash(((ix % p) + p) % p, ((iy % p) + p) % p); }
  white(x, y) { return this.hash((x | 0) * 7919 + 13, (y | 0) * 104729 + 71); }
  /** 周期 p 的梯度噪声，返回约 [-1,1] */
  pnoise(x, y, p) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
    const v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    const g = (ix, iy, dx, dy) => {
      const a = this.hashw(ix, iy, p) * 6.283185307179586;
      return Math.cos(a) * dx + Math.sin(a) * dy;
    };
    const n00 = g(x0,     y0,     fx,     fy);
    const n10 = g(x0 + 1, y0,     fx - 1, fy);
    const n01 = g(x0,     y0 + 1, fx,     fy - 1);
    const n11 = g(x0 + 1, y0 + 1, fx - 1, fy - 1);
    const a0 = n00 + u * (n10 - n00);
    const a1 = n01 + u * (n11 - n01);
    return clamp((a0 + v * (a1 - a0)) * 1.45, -1, 1);
  }
  /** 分形噪声：坐标必须以 period 为尺度传入（fbm(u*P, v*P, P, oct)）才能平铺 */
  fbm(x, y, p, oct = 4, gain = 0.5) {
    let s = 0, amp = 0.5, f = 1, norm = 0;
    for (let i = 0; i < oct; i++) {
      s += amp * this.pnoise(x * f, y * f, p * f);
      norm += amp; amp *= gain; f *= 2;
    }
    return s / norm;
  }
  /** 周期 Worley，返回 F1 距离（0..~1.2） */
  worley(x, y, p) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let f1 = 9;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const cx = xi + dx, cy = yi + dy;
        const jx = this.hashw(cx, cy, p);
        const jy = this.hashw(cx + 733, cy + 1571, p);
        const ddx = cx + jx - x, ddy = cy + jy - y;
        const d = ddx * ddx + ddy * ddy;
        if (d < f1) f1 = d;
      }
    }
    return Math.sqrt(f1);
  }
}

/* --------- 纹理装配辅助 --------- */

let MAX_ANISO = 4;

function makeTex(size, data, srgb) {
  const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  t.anisotropy = MAX_ANISO;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.needsUpdate = true;
  return t;
}

/** 高度场 → 法线贴图 */
function normalFromHeight(h, S, strength) {
  const out = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) {
    const yp = ((y + 1) % S) * S, ym = ((y - 1 + S) % S) * S, y0 = y * S;
    for (let x = 0; x < S; x++) {
      const xp = (x + 1) % S, xm = (x - 1 + S) % S;
      const dx = (h[y0 + xp] - h[y0 + xm]) * strength;
      const dy = (h[yp + x] - h[ym + x]) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const len = Math.sqrt(nx * nx + ny * ny + 1) || 1;
      nx /= len; ny /= len; nz /= len;
      const i = (y0 + x) * 4;
      out[i]     = clamp01(nx * 0.5 + 0.5) * 255;
      out[i + 1] = clamp01(ny * 0.5 + 0.5) * 255;
      out[i + 2] = clamp01(nz * 0.5 + 0.5) * 255;
      out[i + 3] = 255;
    }
  }
  return out;
}

/** 环绕式可分离盒式模糊（用于从高度场推导 AO） */
function blurWrap(src, S, r) {
  const tmp = new Float32Array(S * S), out = new Float32Array(S * S);
  const inv = 1 / (r * 2 + 1);
  for (let y = 0; y < S; y++) {
    const row = y * S;
    for (let x = 0; x < S; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += src[row + ((x + k + S) % S)];
      tmp[row + x] = s * inv;
    }
  }
  for (let x = 0; x < S; x++) {
    for (let y = 0; y < S; y++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += tmp[((y + k + S) % S) * S + x];
      out[y * S + x] = s * inv;
    }
  }
  return out;
}

/** 高度场 → AO 贴图（凹处变暗） */
function aoFromHeight(h, S, amount, radius) {
  const b = blurWrap(h, S, radius);
  const out = new Uint8Array(S * S * 4);
  for (let i = 0; i < S * S; i++) {
    const cav = clamp01((b[i] - h[i]) * 3.2);
    const ao = clamp01(1 - cav * amount);
    const v = ao * 255;
    out[i * 4] = v; out[i * 4 + 1] = v; out[i * 4 + 2] = v; out[i * 4 + 3] = 255;
  }
  return out;
}

function grayTex(size, arr01) {          // Float32 → 灰度 DataTexture（粗糙度用）
  const out = new Uint8Array(size * size * 4);
  for (let i = 0; i < size * size; i++) {
    const v = clamp01(arr01[i]) * 255;
    out[i * 4] = v; out[i * 4 + 1] = v; out[i * 4 + 2] = v; out[i * 4 + 3] = 255;
  }
  return makeTex(size, out, false);
}

/* ============================ 2. 全局状态 ============================ */

const state = {
  half: (CFG.grid * CFG.cell) / 2,
  time: 0,
  lamps: [],
  lampOrder: [],
  nextFlicker: 6,
  rnd: mulberry32(CFG.seed ^ 0xbeef),
  chunks: [],
  postOn: true,
  hudOn: false,
  scale: 1,
  frames: 0, accum: 0, fps: 60, hudT: 0, scaleT: 0, poolT: 0,
  player: {
    pos: new THREE.Vector3(0, 0, 0),
    vel: new THREE.Vector3(),
    stepPhase: 0, lastStep: 0, speed: 0,
  },
  maze: null,
};

let renderer, scene, camera, controls, composer, bloomPass, gradePass;
let TEX = {};
let dust, dustPos, dustVel;
let tubeMesh, houseMesh;
const rectPool = [], spotPool = [];

/* ============================ 3. 渲染器 / 场景 ============================ */

function initScene() {
  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    stencil: false,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.maxPixelRatio));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.setClearColor(CFG.fogColor, 1);
  renderer.info.autoReset = false;
  document.body.appendChild(renderer.domElement);

  MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  RectAreaLightUniformsLib.init();       // RectAreaLight 必需

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CFG.fogColor);
  scene.fog = new THREE.FogExp2(CFG.fogColor, CFG.fogDensity);

  camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.04, 160);
  camera.position.set(0, CFG.eyeH, 0);
  scene.add(camera);

  controls = new PointerLockControls(camera, document.body);
  controls.pointerSpeed = 1.0;
  controls.minPolarAngle = 0.04;         // 避免 YXZ 万向锁（供机身侧倾使用）
  controls.maxPolarAngle = Math.PI - 0.04;

  window.addEventListener('resize', onResize);
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = Math.min(window.devicePixelRatio || 1, CFG.maxPixelRatio) * state.scale;
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  if (composer) { composer.setPixelRatio(pr); composer.setSize(w, h); }
  if (gradePass) gradePass.uniforms.uAspect.value = w / h;
}

/* ============================ 4. 程序化纹理 ============================ */

/* ---- 4.1 墙面：褪色黄墙纸 + 霉斑 + 水渍 ---- */
function buildWallTextures() {
  const S = CFG.texWall, n = new Noise(CFG.seed ^ 0x51ab);
  const col = new Uint8Array(S * S * 4);
  const hgt = new Float32Array(S * S);
  const rgh = new Float32Array(S * S);
  const P = 8, PF = 48, PS = 13, PW = 12;      // 各层整数周期（保证无缝）
  const seamStep = S / 4;                      // 墙纸拼缝：每 1/4 纹理一条
  const base = [0.805, 0.715, 0.462];

  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S, i = y * S + x;

      const blot = n.fbm(u * P,  v * P,  P,  5);                    // 大块褪色
      const fine = n.fbm(u * PF + 13.7, v * PF - 8.1, PF, 3);       // 细颗粒
      const wn   = n.white(x, y);
      const w1   = n.worley(u * PW, v * PW, PW);

      // 墙纸竖条纹（24 条/周期 ≈ 6.2cm）+ 拼缝凹槽
      const stripe = Math.sin(u * Math.PI * 2 * 24);
      const sx = x % seamStep, sd = Math.min(sx, seamStep - sx);
      const seam = Math.exp(-(sd * sd) / 6.0);

      // 潮湿水渍 / 霉斑（噪声阈值 + smoothstep 软边）
      const sN    = 0.5 + 0.5 * n.fbm(u * PS + 31.7, v * PS + 5.5, PS, 4);
      const stain = smoothstep(0.55, 0.79, sN + 0.14 * (1 - w1));
      const mold  = smoothstep(0.87, 0.98, sN * 0.72 + 0.30 * (1 - w1));

      let br = 1 + 0.11 * blot + 0.05 * fine + 0.026 * stripe + 0.022 * (wn - 0.5);
      br *= 1 - 0.20 * seam;
      let r = base[0] * br, g = base[1] * br, b = base[2] * br;

      r = lerp(r, 0.402, stain * 0.74); g = lerp(g, 0.310, stain * 0.78); b = lerp(b, 0.170, stain * 0.80);
      r = lerp(r, 0.243, mold * 0.60);  g = lerp(g, 0.252, mold * 0.60);  b = lerp(b, 0.196, mold * 0.60);
      if (wn > 0.9965) { r *= 0.34; g *= 0.34; b *= 0.31; }          // 黑色小斑点

      col[i * 4]     = clamp01(r) * 255;
      col[i * 4 + 1] = clamp01(g) * 255;
      col[i * 4 + 2] = clamp01(b) * 255;
      col[i * 4 + 3] = 255;

      hgt[i] = 0.5 + 0.20 * fine + 0.09 * (wn - 0.5) + 0.05 * stripe - 0.42 * seam - 0.16 * stain;
      rgh[i] = 0.90 - 0.30 * stain - 0.07 * mold + 0.05 * fine;
    }
  }
  return {
    map:          makeTex(S, col, true),
    normalMap:    makeTex(S, normalFromHeight(hgt, S, 2.2), false),
    aoMap:        makeTex(S, aoFromHeight(hgt, S, 0.75, 5), false),
    roughnessMap: grayTex(S, rgh),
  };
}

/* ---- 4.2 地面：潮湿旧地毯 ---- */
function buildCarpetTextures() {
  const S = CFG.texFloor, n = new Noise(CFG.seed ^ 0x77c1);
  const col = new Uint8Array(S * S * 4);
  const hgt = new Float32Array(S * S);
  const rgh = new Float32Array(S * S);
  const PL = 64, PC = 24, PS = 6, PB = 12;
  const base = [0.352, 0.292, 0.176];

  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S, i = y * S + x;

      const loop  = n.worley(u * PL, v * PL, PL);                   // 地毯绒圈
      const loop2 = n.worley(u * PC + 4.3, v * PC + 9.1, PC);       // 粗簇
      const wn    = n.white(x, y);
      const dirt  = 0.5 + 0.5 * n.fbm(u * PS, v * PS, PS, 5);       // 大面积脏污
      const wear  = 0.5 + 0.5 * n.fbm(u * PB + 21.3, v * PB - 3.7, PB, 3);

      const fiber = 1 - clamp01(loop * 1.35);
      const stain = smoothstep(0.60, 0.84, dirt + 0.10 * (1 - loop2));
      const damp  = smoothstep(0.72, 0.95, dirt * 0.8 + 0.2 * wear);

      let br = 1 + 0.30 * (dirt - 0.5) + 0.22 * (fiber - 0.5) + 0.10 * (wn - 0.5) + 0.12 * (wear - 0.5);
      let r = base[0] * br, g = base[1] * br, b = base[2] * br;

      r = lerp(r, 0.152, stain * 0.80); g = lerp(g, 0.122, stain * 0.82); b = lerp(b, 0.083, stain * 0.80);
      r = lerp(r, 0.093, damp * 0.55);  g = lerp(g, 0.083, damp * 0.55);  b = lerp(b, 0.068, damp * 0.50);
      if (wn > 0.994) { r += 0.10; g += 0.09; b += 0.06; }            // 浅色纤维亮点
      if (wn < 0.004) { r *= 0.5;  g *= 0.5;  b *= 0.5; }

      col[i * 4]     = clamp01(r) * 255;
      col[i * 4 + 1] = clamp01(g) * 255;
      col[i * 4 + 2] = clamp01(b) * 255;
      col[i * 4 + 3] = 255;

      hgt[i] = 0.5 + 0.42 * (fiber - 0.5) + 0.16 * (1 - clamp01(loop2)) + 0.12 * (wn - 0.5) - 0.10 * damp;
      rgh[i] = 0.97 - 0.26 * damp - 0.10 * stain + 0.03 * (wn - 0.5);
    }
  }
  return {
    map:          makeTex(S, col, true),
    normalMap:    makeTex(S, normalFromHeight(hgt, S, 3.4), false),
    aoMap:        makeTex(S, aoFromHeight(hgt, S, 0.9, 4), false),
    roughnessMap: grayTex(S, rgh),
  };
}

/* ---- 4.3 天花板：发黄矿棉吊顶（0.6m 一块 + 水渍环） ---- */
function buildCeilTextures() {
  const S = CFG.texCeil, n = new Noise(CFG.seed ^ 0x2d19);
  const col = new Uint8Array(S * S * 4);
  const hgt = new Float32Array(S * S);
  const rgh = new Float32Array(S * S);
  const P = 6, PF = 40, PD = 128;                 // PD: 针孔哈希格（S/4）
  const base = [0.712, 0.676, 0.552];
  const half = S / 2;

  // 3 处水渍环心（可平铺 → 环绕距离）
  const rr = mulberry32(CFG.seed ^ 0x991);
  const rings = [];
  for (let k = 0; k < 3; k++) rings.push([rr(), rr(), 0.10 + rr() * 0.14, 0.55 + rr() * 0.45]);

  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S, i = y * S + x;

      const grain = n.fbm(u * PF + 2.5, v * PF + 6.5, PF, 3);
      const soft  = n.fbm(u * P, v * P, P, 4);
      const wn    = n.white(x, y);

      // 吊顶板缝（每半张纹理一条，即 0.6m）
      const mx = Math.min(x % half, half - (x % half));
      const my = Math.min(y % half, half - (y % half));
      const gx = Math.exp(-(mx * mx) / 3.2), gy = Math.exp(-(my * my) / 3.2);
      const seam = clamp01(gx + gy);

      // 矿棉针孔（4px 哈希格，圆点）
      const hx = (x / 4) | 0, hy = (y / 4) | 0;
      const hp = n.hashw(hx, hy, PD);
      let hole = 0;
      if (hp > 0.62) {
        const cx = hx * 4 + 1.2 + n.hashw(hx + 91, hy + 17, PD) * 1.6;
        const cy = hy * 4 + 1.2 + n.hashw(hx + 51, hy + 73, PD) * 1.6;
        const dd = Math.hypot(x - cx, y - cy);
        hole = 1 - smoothstep(0.55, 1.45, dd);
      }

      // 水渍环（共用一份形状扰动，省两次 fbm）
      const warp = 1 + 0.35 * n.fbm(u * 10, v * 10, 10, 3);
      let ring = 0;
      for (let k = 0; k < rings.length; k++) {
        const R = rings[k];
        let du = Math.abs(u - R[0]); du = Math.min(du, 1 - du);
        let dv = Math.abs(v - R[1]); dv = Math.min(dv, 1 - dv);
        const d = Math.hypot(du, dv) * warp;
        const fill = smoothstep(R[2], R[2] * 0.55, d) * 0.55;
        const edge = Math.exp(-Math.pow((d - R[2]) / 0.016, 2)) * 0.75;
        ring = Math.max(ring, (fill + edge) * R[3]);
      }
      ring = clamp01(ring);

      let br = 1 + 0.075 * soft + 0.05 * grain + 0.02 * (wn - 0.5);
      br *= 1 - 0.34 * seam - 0.55 * hole;
      let r = base[0] * br, g = base[1] * br, b = base[2] * br;
      r = lerp(r, 0.470, ring * 0.85); g = lerp(g, 0.372, ring * 0.88); b = lerp(b, 0.196, ring * 0.90);

      col[i * 4]     = clamp01(r) * 255;
      col[i * 4 + 1] = clamp01(g) * 255;
      col[i * 4 + 2] = clamp01(b) * 255;
      col[i * 4 + 3] = 255;

      hgt[i] = 0.5 + 0.16 * grain + 0.07 * (wn - 0.5) - 0.62 * seam - 0.42 * hole;
      rgh[i] = 0.93 + 0.04 * grain - 0.22 * ring;
    }
  }
  return {
    map:          makeTex(S, col, true),
    normalMap:    makeTex(S, normalFromHeight(hgt, S, 2.0), false),
    aoMap:        makeTex(S, aoFromHeight(hgt, S, 0.85, 4), false),
    roughnessMap: grayTex(S, rgh),
  };
}

/* ---- 4.4 灯管 / 灯具 / 污渍贴花 / 灰尘精灵 ---- */
function buildSmallTextures() {
  // 灯管：细微纵向流痕 + 积灰
  const S = 128, n = new Noise(CFG.seed ^ 0x1f7);
  const col = new Uint8Array(S * S * 4), hgt = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = x / S, v = y / S, i = y * S + x;
      const streak = n.fbm(u * 4, v * 32, 32, 3);
      const wn = n.white(x, y);
      const dust = clamp01(0.5 + 0.5 * n.fbm(u * 8 + 3.3, v * 8, 8, 3));
      const br = 1 - 0.10 * dust + 0.04 * streak + 0.02 * (wn - 0.5);
      const r = 0.96 * br, g = 0.975 * br, b = 0.99 * br;
      col[i * 4] = clamp01(r) * 255; col[i * 4 + 1] = clamp01(g) * 255;
      col[i * 4 + 2] = clamp01(b) * 255; col[i * 4 + 3] = 255;
      hgt[i] = 0.5 + 0.2 * streak + 0.05 * (wn - 0.5);
    }
  }
  const tube = {
    map: makeTex(S, col, true),
    normalMap: makeTex(S, normalFromHeight(hgt, S, 1.1), false),
    aoMap: makeTex(S, aoFromHeight(hgt, S, 0.35, 3), false),
  };

  // 污渍贴花（带 alpha）
  const D = CFG.texStain, nd = new Noise(CFG.seed ^ 0x3a1);
  const dec = new Uint8Array(D * D * 4);
  for (let y = 0; y < D; y++) {
    for (let x = 0; x < D; x++) {
      const u = (x / D) * 2 - 1, v = (y / D) * 2 - 1, i = (y * D + x) * 4;
      const rad = Math.hypot(u, v);
      const edge = 0.70 + 0.26 * nd.fbm(u * 3 + 5.1, v * 3 + 2.7, 32, 4);
      const core = 1 - smoothstep(edge * 0.35, edge, rad);
      const mot  = 0.5 + 0.5 * nd.fbm(u * 9 - 1.7, v * 9 + 4.4, 32, 4);
      const a = clamp01(core * (0.35 + 0.85 * mot)) * 0.88;
      const r = lerp(0.115, 0.180, mot), g = lerp(0.092, 0.140, mot), b = lerp(0.062, 0.078, mot);
      dec[i] = r * 255; dec[i + 1] = g * 255; dec[i + 2] = b * 255; dec[i + 3] = a * 255;
    }
  }
  const stain = makeTex(D, dec, true);
  stain.wrapS = stain.wrapT = THREE.ClampToEdgeWrapping;

  // 灰尘：柔和圆点
  const G = 64, sp = new Uint8Array(G * G * 4);
  for (let y = 0; y < G; y++) {
    for (let x = 0; x < G; x++) {
      const dx = (x + 0.5) / G * 2 - 1, dy = (y + 0.5) / G * 2 - 1, i = (y * G + x) * 4;
      const a = Math.pow(1 - clamp01(Math.hypot(dx, dy)), 2.4);
      sp[i] = 255; sp[i + 1] = 250; sp[i + 2] = 225; sp[i + 3] = a * 255;
    }
  }
  const spr = makeTex(G, sp, true);
  spr.wrapS = spr.wrapT = THREE.ClampToEdgeWrapping;
  spr.generateMipmaps = false;
  spr.minFilter = THREE.LinearFilter;

  return { tube, stain, dust: spr };
}

/** 统一设置重复次数 */
function setRepeat(set, rx, ry) {
  for (const k in set) {
    const t = set[k];
    if (t && t.isTexture) { t.repeat.set(rx, ry); }
  }
}

/* ============================ 5. 关卡生成 ============================ */

function generateMaze() {
  const G = CFG.grid;
  const rnd = mulberry32(CFG.seed);
  const wallX = new Uint8Array((G + 1) * G);      // 垂直于 X 的墙（i:0..G, j:0..G-1）
  const wallZ = new Uint8Array(G * (G + 1));      // 垂直于 Z 的墙（i:0..G-1, j:0..G）
  const wxi = (i, j) => i * G + j;
  const wzi = (i, j) => i * (G + 1) + j;

  // 外围封闭
  for (let j = 0; j < G; j++) { wallX[wxi(0, j)] = 1; wallX[wxi(G, j)] = 1; }
  for (let i = 0; i < G; i++) { wallZ[wzi(i, 0)] = 1; wallZ[wzi(i, G)] = 1; }

  // 随机直线墙段（Backrooms 的长走廊感）
  const runs = Math.floor(G * G * 0.135);
  for (let k = 0; k < runs; k++) {
    const L = 2 + Math.floor(rnd() * 7);
    if (rnd() < 0.5) {
      const i = 1 + Math.floor(rnd() * (G - 1)), j0 = Math.floor(rnd() * G);
      for (let s = 0; s < L && j0 + s < G; s++) wallX[wxi(i, j0 + s)] = 1;
    } else {
      const j = 1 + Math.floor(rnd() * (G - 1)), i0 = Math.floor(rnd() * G);
      for (let s = 0; s < L && i0 + s < G; s++) wallZ[wzi(i0 + s, j)] = 1;
    }
  }

  const open = (i, j, d) => {                    // d: 0 西 1 东 2 北 3 南
    if (d === 0) return !wallX[wxi(i, j)];
    if (d === 1) return !wallX[wxi(i + 1, j)];
    if (d === 2) return !wallZ[wzi(i, j)];
    return !wallZ[wzi(i, j + 1)];
  };
  const carve = (i, j, d) => {
    if (d === 0) wallX[wxi(i, j)] = 0;
    else if (d === 1) wallX[wxi(i + 1, j)] = 0;
    else if (d === 2) wallZ[wzi(i, j)] = 0;
    else wallZ[wzi(i, j + 1)] = 0;
  };

  // 打开大部分四面封死的密室
  for (let i = 0; i < G; i++) {
    for (let j = 0; j < G; j++) {
      let c = 0;
      for (let d = 0; d < 4; d++) if (!open(i, j, d)) c++;
      if (c === 4 && rnd() < 0.85) {
        const dirs = [0, 1, 2, 3].filter((d) => {
          if (d === 0) return i > 0; if (d === 1) return i < G - 1;
          if (d === 2) return j > 0; return j < G - 1;
        });
        carve(i, j, dirs[Math.floor(rnd() * dirs.length)]);
      }
    }
  }

  // 连通性修复：从出生点洪水填充，必要时打通边界
  const si = G >> 1, sj = G >> 1;
  const reach = new Uint8Array(G * G);
  const queue = new Int32Array(G * G);
  const flood = () => {
    reach.fill(0);
    let head = 0, tail = 0;
    reach[si * G + sj] = 1; queue[tail++] = si * G + sj;
    let cnt = 1;
    while (head < tail) {
      const id = queue[head++], i = (id / G) | 0, j = id % G;
      for (let d = 0; d < 4; d++) {
        if (!open(i, j, d)) continue;
        const ni = i + (d === 1 ? 1 : d === 0 ? -1 : 0);
        const nj = j + (d === 3 ? 1 : d === 2 ? -1 : 0);
        if (ni < 0 || nj < 0 || ni >= G || nj >= G) continue;
        const nid = ni * G + nj;
        if (reach[nid]) continue;
        reach[nid] = 1; queue[tail++] = nid; cnt++;
      }
    }
    return cnt;
  };
  let cnt = flood();
  for (let pass = 0; pass < 10 && cnt < G * G * 0.5; pass++) {
    for (let i = 0; i < G; i++) {
      for (let j = 0; j < G; j++) {
        if (!reach[i * G + j]) continue;
        for (let d = 0; d < 4; d++) {
          const ni = i + (d === 1 ? 1 : d === 0 ? -1 : 0);
          const nj = j + (d === 3 ? 1 : d === 2 ? -1 : 0);
          if (ni < 0 || nj < 0 || ni >= G || nj >= G) continue;
          if (!reach[ni * G + nj] && rnd() < 0.4) carve(i, j, d);
        }
      }
    }
    cnt = flood();
  }

  return { wallX, wallZ, wxi, wzi, reach, open, cells: cnt };
}

/** 世界空间三平面 UV（保证长墙纹理连续、无缝） */
function worldUV(geo, scale) {
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k), y = pos.getY(k), z = pos.getZ(k);
    const nx = Math.abs(nor.getX(k)), ny = Math.abs(nor.getY(k)), nz = Math.abs(nor.getZ(k));
    let u, v;
    if (ny > nx && ny > nz) { u = x * scale; v = z * scale; }
    else if (nx >= nz)      { u = z * scale; v = y * scale; }
    else                    { u = x * scale; v = y * scale; }
    uv.setXY(k, u, v);
  }
}

/** 顶点色：底部潮气变暗 + 大尺度污渍（打散重复感，且几乎零成本） */
function tintGeometry(geo, noise, opts) {
  const pos = geo.attributes.position;
  const arr = new Float32Array(pos.count * 3);
  const floorMode = !!(opts && opts.flat);
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k), y = pos.getY(k), z = pos.getZ(k);
    let c;
    if (floorMode) {
      c = 1 + 0.16 * noise.fbm(x * 0.035, z * 0.035, 64, 3) + 0.08 * noise.fbm(x * 0.15 + 7.1, z * 0.15 - 2.3, 64, 2);
    } else {
      c = 0.60 + 0.40 * smoothstep(0.0, 1.30, y);            // 地脚潮气
      c *= 1 - 0.13 * smoothstep(2.45, 3.0, y);              // 靠天花稍暗
      c *= 1 + 0.10 * noise.fbm(x * 0.055, z * 0.055, 64, 3);
      c *= 1 + 0.05 * noise.fbm(x * 0.21 + 11.3, z * 0.21 - 4.2, 64, 2);
    }
    c = clamp(c, 0.25, 1.25);
    arr[k * 3] = c; arr[k * 3 + 1] = c * 0.994; arr[k * 3 + 2] = c * 0.965;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
}

function buildLevel() {
  const G = CFG.grid, C = CFG.cell, H = CFG.wallH, T = CFG.wallT, half = state.half;
  const size = G * C;
  const maze = state.maze = generateMaze();
  const { wallX, wallZ, wxi, wzi, reach } = maze;
  const tintNoise = new Noise(CFG.seed ^ 0x8811);
  const rnd = mulberry32(CFG.seed ^ 0x2222);

  /* ---------- 5.1 墙体（同向连续墙段合并为一条长盒，减少三角与接缝） ---------- */
  const wallGeos = [], baseGeos = [];
  const pushRun = (dirX, i, j, L) => {
    const len = L * C;
    const segs = Math.max(1, Math.round(len / 1.5));
    let g, bg, cx, cz;
    if (dirX) {                     // 垂直于 X：沿 Z 延伸
      g  = new THREE.BoxGeometry(T, H, len, 1, 4, segs);
      bg = new THREE.BoxGeometry(T + 0.05, 0.11, len, 1, 1, segs);
      cx = -half + C * i; cz = -half + C * j + len / 2;
    } else {                        // 垂直于 Z：沿 X 延伸
      g  = new THREE.BoxGeometry(len, H, T, segs, 4, 1);
      bg = new THREE.BoxGeometry(len, 0.11, T + 0.05, segs, 1, 1);
      cx = -half + C * i + len / 2; cz = -half + C * j;
    }
    g.translate(cx, H / 2, cz);   worldUV(g, 1 / CFG.wallTile);  tintGeometry(g, tintNoise);
    bg.translate(cx, 0.055, cz);  worldUV(bg, 1 / 0.5);          tintGeometry(bg, tintNoise);
    wallGeos.push(g); baseGeos.push(bg);
  };
  for (let i = 0; i <= G; i++) {
    let j = 0;
    while (j < G) {
      if (wallX[wxi(i, j)]) { let k = j; while (k < G && wallX[wxi(i, k)]) k++; pushRun(true, i, j, k - j); j = k; }
      else j++;
    }
  }
  for (let j = 0; j <= G; j++) {
    let i = 0;
    while (i < G) {
      if (wallZ[wzi(i, j)]) { let k = i; while (k < G && wallZ[wzi(k, j)]) k++; pushRun(false, i, j, k - i); i = k; }
      else i++;
    }
  }

  const wallMat = new THREE.MeshStandardMaterial({
    map: TEX.wall.map, normalMap: TEX.wall.normalMap, aoMap: TEX.wall.aoMap,
    roughnessMap: TEX.wall.roughnessMap,
    roughness: 0.92, metalness: 0.0, aoMapIntensity: 0.9,
    vertexColors: true, color: 0xffffff,
  });
  wallMat.normalScale.set(0.65, 0.65);

  const wallMesh = new THREE.Mesh(mergeGeometries(wallGeos, false), wallMat);
  wallMesh.castShadow = true; wallMesh.receiveShadow = true;
  wallMesh.name = 'walls';
  scene.add(wallMesh);
  wallGeos.forEach((g) => g.dispose());

  const baseMat = new THREE.MeshStandardMaterial({
    map: TEX.wall.map, normalMap: TEX.wall.normalMap, aoMap: TEX.wall.aoMap,
    color: 0x6a5b40, roughness: 0.55, metalness: 0.02, aoMapIntensity: 0.8, vertexColors: true,
  });
  baseMat.normalScale.set(0.4, 0.4);
  const baseMesh = new THREE.Mesh(mergeGeometries(baseGeos, false), baseMat);
  baseMesh.castShadow = true; baseMesh.receiveShadow = true;
  scene.add(baseMesh);
  baseGeos.forEach((g) => g.dispose());

  /* ---------- 5.2 地板 / 天花板（单张大网格，顶点色打散重复） ---------- */
  const floorGeo = new THREE.PlaneGeometry(size, size, G, G);
  floorGeo.rotateX(-Math.PI / 2);
  {   // 轻微起伏，模拟松动的旧地毯（幅度小于贴花离地高度，避免穿插）
    const p = floorGeo.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const x = p.getX(k), z = p.getZ(k);
      p.setY(k, tintNoise.fbm(x * 0.09, z * 0.09, 64, 2) * 0.009);
    }
    floorGeo.computeVertexNormals();
  }
  tintGeometry(floorGeo, tintNoise, { flat: true });
  setRepeat(TEX.floor, size / CFG.floorTile, size / CFG.floorTile);
  const floorMat = new THREE.MeshStandardMaterial({
    map: TEX.floor.map, normalMap: TEX.floor.normalMap, aoMap: TEX.floor.aoMap,
    roughnessMap: TEX.floor.roughnessMap,
    roughness: 0.98, metalness: 0.0, aoMapIntensity: 1.0, vertexColors: true,
  });
  floorMat.normalScale.set(1.25, 1.25);
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.receiveShadow = true;
  scene.add(floor);

  const ceilGeo = new THREE.PlaneGeometry(size, size, G, G);
  ceilGeo.rotateX(Math.PI / 2);
  ceilGeo.translate(0, H, 0);
  tintGeometry(ceilGeo, tintNoise, { flat: true });
  setRepeat(TEX.ceil, size / CFG.ceilTile, size / CFG.ceilTile);
  const ceilMat = new THREE.MeshStandardMaterial({
    map: TEX.ceil.map, normalMap: TEX.ceil.normalMap, aoMap: TEX.ceil.aoMap,
    roughnessMap: TEX.ceil.roughnessMap,
    roughness: 0.95, metalness: 0.0, aoMapIntensity: 0.9, vertexColors: true,
  });
  ceilMat.normalScale.set(0.85, 0.85);
  const ceil = new THREE.Mesh(ceilGeo, ceilMat);
  ceil.receiveShadow = false;
  scene.add(ceil);

  /* ---------- 5.3 荧光灯（InstancedMesh：灯管 + 灯槽） ---------- */
  const lampCells = new Uint8Array(G * G);
  const lamps = state.lamps;
  for (let j = 0; j < G; j++) {
    for (let i = 0; i < G; i++) {
      if (!reach[i * G + j]) continue;
      if (rnd() > 0.5) continue;
      let near = false;                                  // 最小间隔 2 格（≈6m，即每 2~4 个模块一根）
      for (let dj = -1; dj <= 1 && !near; dj++)
        for (let di = -1; di <= 1; di++) {
          const ni = i + di, nj = j + dj;
          if (ni < 0 || nj < 0 || ni >= G || nj >= G) continue;
          if (lampCells[ni * G + nj]) { near = true; break; }
        }
      if (near) continue;
      lampCells[i * G + j] = 1;

      const wWest = !maze.open(i, j, 0), wEast = !maze.open(i, j, 1);
      const wNor = !maze.open(i, j, 2), wSou = !maze.open(i, j, 3);
      let alongX = true;
      if (wWest && wEast && !(wNor && wSou)) alongX = false;       // 沿 Z 的走廊
      else if (wNor && wSou && !(wWest && wEast)) alongX = true;
      else alongX = rnd() < 0.5;

      lamps.push({
        x: -half + C * i + C / 2,
        y: H - 0.06,
        z: -half + C * j + C / 2,
        alongX,
        dead: rnd() < CFG.deadRatio,
        dim: 1, flick: false, flickEnd: 0, nextTog: 0, d2: 1e9,
      });
    }
  }
  for (const l of lamps) if (l.dead) l.dim = DEAD_DIM;
  state.lampOrder = lamps.map((_, k) => k);

  const tubeGeo = new THREE.BoxGeometry(1.2, 0.055, 0.1);
  const tubeMat = new THREE.MeshStandardMaterial({
    map: TEX.tube.map, normalMap: TEX.tube.normalMap, aoMap: TEX.tube.aoMap,
    color: 0xf7fbff, emissive: new THREE.Color(CFG.lampColor), emissiveIntensity: 2.6,
    roughness: 0.32, metalness: 0.0,
  });
  // 让每个实例的颜色同时调制自发光（闪烁 / 坏灯）
  tubeMat.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       #if defined( USE_COLOR ) || defined( USE_INSTANCING_COLOR )
         totalEmissiveRadiance *= vColor;
       #endif`
    );
  };
  const houseGeo = new THREE.BoxGeometry(1.34, 0.1, 0.36);
  const houseMat = new THREE.MeshStandardMaterial({
    map: TEX.tube.map, normalMap: TEX.tube.normalMap,
    color: 0xd6d0bc, roughness: 0.62, metalness: 0.06,
  });

  tubeMesh  = new THREE.InstancedMesh(tubeGeo, tubeMat, Math.max(1, lamps.length));
  houseMesh = new THREE.InstancedMesh(houseGeo, houseMat, Math.max(1, lamps.length));
  tubeMesh.count = houseMesh.count = lamps.length;
  tubeMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  houseMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  tubeMesh.castShadow = houseMesh.castShadow = false;
  tubeMesh.receiveShadow = houseMesh.receiveShadow = false;

  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const one = new THREE.Vector3(1, 1, 1), tv = new THREE.Vector3(), col = new THREE.Color();
  for (let k = 0; k < lamps.length; k++) {
    const l = lamps[k];
    e.set(0, l.alongX ? 0 : Math.PI / 2, 0); q.setFromEuler(e);
    tv.set(l.x, l.y, l.z); m4.compose(tv, q, one); tubeMesh.setMatrixAt(k, m4);
    tv.set(l.x, H - 0.045, l.z); m4.compose(tv, q, one); houseMesh.setMatrixAt(k, m4);
    tubeMesh.setColorAt(k, col.setScalar(l.dim));
  }
  tubeMesh.instanceMatrix.needsUpdate = true;
  houseMesh.instanceMatrix.needsUpdate = true;
  if (tubeMesh.instanceColor) tubeMesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
  scene.add(tubeMesh, houseMesh);

  /* ---------- 5.4 污渍贴花（分块 InstancedMesh + 距离剔除） ---------- */
  buildDecals(rnd);

  /* ---------- 5.5 空气中的浮尘 ---------- */
  buildDust();
}

/** 5×5 分块的贴花实例，超出 45m 的块直接隐藏 */
function buildDecals(rnd) {
  const G = CFG.grid, C = CFG.cell, half = state.half;
  const maze = state.maze;
  const CH = 5, chunkSpan = (G * C) / CH;
  const floorItems = [], wallItems = [];
  for (let c = 0; c < CH * CH; c++) { floorItems.push([]); wallItems.push([]); }
  const chunkOf = (x, z) => {
    const ci = clamp(Math.floor((x + half) / chunkSpan), 0, CH - 1);
    const cj = clamp(Math.floor((z + half) / chunkSpan), 0, CH - 1);
    return cj * CH + ci;
  };

  const mRot = new THREE.Matrix4(), mSpin = new THREE.Matrix4(), sv = new THREE.Vector3();

  // 地面污渍
  for (let k = 0; k < 900; k++) {
    const i = Math.floor(rnd() * G), j = Math.floor(rnd() * G);
    if (!maze.reach[i * G + j]) continue;
    const x = -half + C * i + 0.5 + rnd() * (C - 1);
    const z = -half + C * j + 0.5 + rnd() * (C - 1);
    const s = 0.45 + rnd() * 1.05;
    mRot.makeRotationX(-Math.PI / 2);
    mSpin.makeRotationZ(rnd() * Math.PI * 2);
    mRot.multiply(mSpin);
    mRot.scale(sv.set(s, s * (0.7 + rnd() * 0.6), 1));
    mRot.setPosition(x, 0.024 + rnd() * 0.006, z);
    floorItems[chunkOf(x, z)].push(mRot.clone());
  }

  // 墙面污渍（贴在开放侧）
  for (let k = 0; k < 700; k++) {
    const i = Math.floor(rnd() * G), j = Math.floor(rnd() * G);
    if (!maze.reach[i * G + j]) continue;
    const d = Math.floor(rnd() * 4);
    if (maze.open(i, j, d)) continue;                    // 该侧必须有墙
    const cx = -half + C * i + C / 2, cz = -half + C * j + C / 2;
    const off = C / 2 - CFG.wallT / 2 - 0.012;
    let x = cx, z = cz, rotY = 0;
    if (d === 0) { x = cx - off; rotY = Math.PI / 2; }
    else if (d === 1) { x = cx + off; rotY = -Math.PI / 2; }
    else if (d === 2) { z = cz - off; rotY = Math.PI; }
    else { z = cz + off; rotY = 0; }
    if (d === 0 || d === 1) z = cz + (rnd() - 0.5) * (C - 0.7);
    else x = cx + (rnd() - 0.5) * (C - 0.7);
    const y = 0.16 + rnd() * rnd() * 2.2;
    const s = 0.28 + rnd() * 0.9;
    mRot.makeRotationY(rotY);
    mSpin.makeRotationZ(rnd() * Math.PI * 2);
    mRot.multiply(mSpin);
    mRot.scale(sv.set(s, s * (0.8 + rnd() * 1.4), 1));
    mRot.setPosition(x, y, z);
    wallItems[chunkOf(x, z)].push(mRot.clone());
  }

  const decalMat = new THREE.MeshStandardMaterial({
    map: TEX.stain, transparent: true, opacity: 0.92,
    roughness: 0.82, metalness: 0.0, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    side: THREE.FrontSide, alphaTest: 0.02,
  });
  const planeGeo = new THREE.PlaneGeometry(1, 1);

  const addChunks = (items, tag) => {
    for (let c = 0; c < items.length; c++) {
      const list = items[c];
      if (!list.length) continue;
      const im = new THREE.InstancedMesh(planeGeo, decalMat, list.length);
      im.instanceMatrix.setUsage(THREE.StaticDrawUsage);
      im.castShadow = false; im.receiveShadow = false;
      const cx = -half + ((c % CH) + 0.5) * chunkSpan;
      const cz = -half + ((Math.floor(c / CH)) + 0.5) * chunkSpan;
      const cc = new THREE.Color();
      for (let n = 0; n < list.length; n++) {
        im.setMatrixAt(n, list[n]);
        const g = 0.7 + rnd() * 0.6;                     // 每实例颜色微差
        im.setColorAt(n, cc.setRGB(g, g * 0.96, g * 0.9));
      }
      im.instanceMatrix.needsUpdate = true;
      im.name = tag + c;
      im.frustumCulled = true;
      scene.add(im);
      const hs = chunkSpan / 2;
      state.chunks.push({ mesh: im, x0: cx - hs, z0: cz - hs, x1: cx + hs, z1: cz + hs });
    }
  };
  addChunks(floorItems, 'decalF');
  addChunks(wallItems, 'decalW');
}

/* ---------- 浮尘 ---------- */
function buildDust() {
  const N = CFG.dust, box = 26;
  dustPos = new Float32Array(N * 3);
  dustVel = new Float32Array(N * 3);
  const r = mulberry32(CFG.seed ^ 0x5151);
  for (let i = 0; i < N; i++) {
    dustPos[i * 3]     = (r() - 0.5) * box;
    dustPos[i * 3 + 1] = r() * (CFG.wallH - 0.15) + 0.05;
    dustPos[i * 3 + 2] = (r() - 0.5) * box;
    dustVel[i * 3]     = (r() - 0.5) * 0.055;
    dustVel[i * 3 + 1] = (r() - 0.5) * 0.035 - 0.008;
    dustVel[i * 3 + 2] = (r() - 0.5) * 0.055;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  g.attributes.position.setUsage(THREE.DynamicDrawUsage);
  const m = new THREE.PointsMaterial({
    map: TEX.dust, color: 0xe8dcae, size: 0.038, sizeAttenuation: true,
    transparent: true, opacity: 0.5, depthWrite: false, fog: true, alphaTest: 0.02,
  });
  dust = new THREE.Points(g, m);
  dust.frustumCulled = false;
  dust.userData.box = box;
  scene.add(dust);
}

/* ============================ 6. 光照 ============================ */

function setupLights() {
  scene.add(new THREE.AmbientLight(0xc9b98a, 0.28));
  scene.add(new THREE.HemisphereLight(0xd4c5a0, 0x3a3228, 0.34));

  // RectAreaLight 池（灯管面光）——数量恒定，避免运行时重编译着色器
  for (let i = 0; i < CFG.rectLights; i++) {
    const rl = new THREE.RectAreaLight(CFG.lampColor, 0, 1.2, 0.1);
    rl.position.set(0, CFG.wallH - 0.12, 0);
    rl.lookAt(0, 0, 0);                        // 面光朝下（局部 -Z 为出射方向）
    rl.visible = true;
    scene.add(rl);
    rectPool.push({ light: rl, lamp: -1 });
  }

  // 投影 SpotLight 池（仅玩家附近，产生真正的阴影与地面光斑）
  for (let i = 0; i < CFG.spotLights; i++) {
    const sl = new THREE.SpotLight(0xdff0ff, 0, 11, 1.16, 0.72, 1.9);
    sl.position.set(0, CFG.wallH - 0.1, 0);
    sl.target.position.set(0, 0, 0);
    sl.castShadow = true;
    sl.shadow.mapSize.set(CFG.shadowMap, CFG.shadowMap);
    sl.shadow.camera.near = 0.4;
    sl.shadow.camera.far = 9;
    sl.shadow.bias = -0.0006;
    sl.shadow.normalBias = 0.022;
    sl.shadow.autoUpdate = false;              // 静态场景：仅在换灯时刷新
    sl.shadow.needsUpdate = true;
    scene.add(sl, sl.target);
    spotPool.push({ light: sl, lamp: -1 });
  }
}

const spotTaken = [];
function updateLightPool() {
  const lamps = state.lamps;
  if (!lamps.length) return;
  const px = state.player.pos.x, pz = state.player.pos.z;
  for (let i = 0; i < lamps.length; i++) {
    const l = lamps[i];
    const dx = l.x - px, dz = l.z - pz;
    l.d2 = dx * dx + dz * dz;
  }
  const order = state.lampOrder;
  order.sort((a, b) => lamps[a].d2 - lamps[b].d2);

  // ① 阴影 SpotLight：仅玩家 shadowRange 以内的最近若干盏
  spotTaken.length = 0;
  const R2 = CFG.shadowRange * CFG.shadowRange;
  for (let i = 0; i < spotPool.length; i++) {
    const slot = spotPool[i];
    const cand = (i < order.length && lamps[order[i]].d2 < R2) ? order[i] : -1;
    if (cand >= 0) spotTaken.push(cand);
    if (slot.lamp !== cand) {
      slot.lamp = cand;
      if (cand >= 0) {
        const l = lamps[cand];
        slot.light.position.set(l.x, CFG.wallH - 0.1, l.z);
        slot.light.target.position.set(l.x, 0, l.z);
        slot.light.target.updateMatrixWorld();
        slot.light.shadow.needsUpdate = true;      // 换灯 → 重烘一次阴影
      }
    }
  }

  // ② RectAreaLight：其余最近的灯（跳过已由 SpotLight 覆盖的，避免重复照明）
  let cursor = 0;
  for (let i = 0; i < rectPool.length; i++) {
    let cand = -1;
    while (cursor < order.length) {
      const c = order[cursor++];
      if (spotTaken.indexOf(c) === -1) { cand = c; break; }
    }
    const slot = rectPool[i];
    if (slot.lamp !== cand) {
      slot.lamp = cand;
      if (cand >= 0) {
        const l = lamps[cand];
        slot.light.position.set(l.x, CFG.wallH - 0.12, l.z);
        slot.light.lookAt(l.x, 0, l.z);            // 面光朝下
        // lookAt(正下方) 之后：局部 X→世界 X，局部 Y→世界 Z
        slot.light.width  = l.alongX ? 1.2 : 0.1;
        slot.light.height = l.alongX ? 0.1 : 1.2;
      }
    }
  }
}

function updateLampIntensity(t) {
  const lamps = state.lamps;
  for (let i = 0; i < rectPool.length; i++) {
    const s = rectPool[i];
    if (s.lamp < 0) { s.light.intensity = 0; continue; }
    const l = lamps[s.lamp];
    const jitter = 1 + 0.022 * Math.sin(t * 11.3 + s.lamp * 2.1);
    s.light.intensity = CFG.rectIntensity * l.dim * jitter;
  }
  for (let i = 0; i < spotPool.length; i++) {
    const s = spotPool[i];
    if (s.lamp < 0) { s.light.intensity = 0; continue; }
    const l = lamps[s.lamp];
    s.light.intensity = CFG.spotIntensity * l.dim;
  }
}

/* ---------- 灯光故障（闪烁）控制器 ---------- */
const flickColor = new THREE.Color();
function forceFlicker() {
  const lamps = state.lamps;
  if (!lamps.length) return;
  let pick = -1, best = 1e9;
  const rnd = state.rnd;
  // 优先玩家附近 26m 内的灯
  for (let k = 0; k < 26; k++) {
    const i = Math.floor(rnd() * lamps.length);
    const d2 = lamps[i].d2;
    if (d2 < 26 * 26) { pick = i; break; }
    if (d2 < best) { best = d2; pick = i; }
  }
  if (pick < 0) return;
  const l = lamps[pick];
  l.flick = true;
  l.flickEnd = state.time + 0.1 + rnd() * 0.4;   // 0.1~0.5s
  l.nextTog = 0;
  SFX.buzz(clamp(1 - Math.sqrt(l.d2) / 24, 0.05, 1));
}

function updateFlicker(dt) {
  const t = state.time, rnd = state.rnd, lamps = state.lamps;
  if (t >= state.nextFlicker) {
    state.nextFlicker = t + 5 + rnd() * 10;      // 每 5~15s 一次
    forceFlicker();
  }
  let dirty = false;
  for (let i = 0; i < lamps.length; i++) {
    const l = lamps[i];
    if (!l.flick) continue;
    if (t >= l.flickEnd) {
      l.flick = false;
      l.dim = l.dead ? DEAD_DIM : 1;
      dirty = true;
    } else if (t >= l.nextTog) {
      l.nextTog = t + 0.02 + rnd() * 0.07;
      l.dim = 0.3 + rnd() * 0.7;                 // 0.3~1.0 倍突变
      dirty = true;
    }
  }
  if (dirty && tubeMesh) {
    for (let i = 0; i < lamps.length; i++) tubeMesh.setColorAt(i, flickColor.setScalar(lamps[i].dim));
    if (tubeMesh.instanceColor) tubeMesh.instanceColor.needsUpdate = true;
  }
}

/* ============================ 7. 后期处理 ============================ */

const GradeShader = {
  uniforms: {
    tDiffuse:   { value: null },
    uTime:      { value: 0 },
    uAspect:    { value: 1 },
    uVignette:  { value: 1.02 },
    uGrain:     { value: 0.048 },
    uChroma:    { value: 0.9 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uTime, uAspect, uVignette, uGrain, uChroma;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      vec2 c  = uv - 0.5;
      float r2 = dot(c, c);
      // 轻微色散
      vec2 d = c * (uChroma * 0.0035) * (r2 * 2.0 + 0.25);
      vec3 col;
      col.r = texture2D(tDiffuse, uv + d).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - d).b;
      // 暗角
      float vig = 1.0 - smoothstep(0.28, 0.98, length(c * vec2(uVignette, uVignette)));
      col *= mix(1.0, vig, 0.82);
      // 胶片颗粒
      float n = fract(sin(dot(uv * vec2(1234.5, 8765.4) + uTime * 1.7, vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - 0.5) * uGrain;
      // 极轻的调色：压一点饱和，暗部抬一点暖黄
      float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(lum), col, 1.05);
      col += vec3(0.014, 0.011, 0.004) * (1.0 - smoothstep(0.0, 0.34, lum));
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `,
};

function setupPost() {
  const dpr = renderer.getPixelRatio();
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  const rt = new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType,
    samples: dpr > 1.25 ? 2 : 4,      // WebGL2 MSAA：后期链路里保留抗锯齿
    depthBuffer: true, stencilBuffer: false,
  });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(dpr);
  composer.setSize(window.innerWidth, window.innerHeight);

  composer.addPass(new RenderPass(scene, camera));

  bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.28, 0.62, 0.86);
  composer.addPass(bloomPass);

  composer.addPass(new OutputPass());           // ACES + sRGB 编码

  gradePass = new ShaderPass(GradeShader);
  gradePass.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
  gradePass.renderToScreen = true;
  composer.addPass(gradePass);
}

/* ============================ 8. 音频（Web Audio 合成） ============================ */

const SFX = {
  ctx: null, master: null, hiss: null, noiseBuf: null, ready: false,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    let ctx;
    try { ctx = new AC(); } catch (e) { return; }
    this.ctx = ctx;

    const master = this.master = ctx.createGain();
    master.gain.value = 0.0001;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 3.2;
    master.connect(comp); comp.connect(ctx.destination);

    // 噪声缓冲（白噪 + 少量布朗噪）
    const len = Math.floor(ctx.sampleRate * 2);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = clamp(w * 0.72 + last * 5.5, -1, 1);
    }
    this.noiseBuf = buf;

    // --- 变压器嗡鸣：50Hz + 120Hz（+100Hz 谐波）---
    const hum = ctx.createGain(); hum.gain.value = 0.82;
    const humLP = ctx.createBiquadFilter(); humLP.type = 'lowpass'; humLP.frequency.value = 240;
    hum.connect(humLP); humLP.connect(master);
    [[50, 0.055], [120, 0.034], [100, 0.018], [240, 0.008]].forEach(([f, g]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const gg = ctx.createGain(); gg.gain.value = g;
      o.connect(gg); gg.connect(hum); o.start();
    });
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.11;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.22;
    lfo.connect(lfoG); lfoG.connect(hum.gain); lfo.start();

    // --- 电流声：白噪 → 带通 2~4kHz ---
    const ns = ctx.createBufferSource(); ns.buffer = buf; ns.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.9;
    const hg = ctx.createGain(); hg.gain.value = 0.02;
    ns.connect(bp); bp.connect(hg); hg.connect(master); ns.start();
    this.hiss = hg;

    // --- 空间底噪（低频送风感）---
    const ns2 = ctx.createBufferSource(); ns2.buffer = buf; ns2.loop = true;
    const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 380; lp2.Q.value = 0.6;
    const g2 = ctx.createGain(); g2.gain.value = 0.022;
    ns2.connect(lp2); lp2.connect(g2); g2.connect(master); ns2.start();

    this.ready = true;
    this.setLevel(0.9, 1.2);
  },

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setLevel(v, tc) {
    if (!this.ready) return;
    this.master.gain.setTargetAtTime(Math.max(0.0001, v), this.ctx.currentTime, tc || 0.25);
  },

  /** 脚步：低通噪声脉冲 + 衰减正弦，左右脚交替 */
  step(vol, pan) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime, v = clamp(vol, 0.05, 0.42);
    const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (p) p.pan.value = pan;
    const out = p || this.master;
    if (p) p.connect(this.master);

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.85 + Math.random() * 0.3;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 380 + Math.random() * 190; lp.Q.value = 0.9;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.007);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    src.connect(lp); lp.connect(g); g.connect(out);
    src.start(t, Math.random() * 1.5, 0.2);
    src.stop(t + 0.2);

    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(92, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.1);
    const og = ctx.createGain();
    og.gain.setValueAtTime(v * 0.85, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.connect(og); og.connect(out);
    o.start(t); o.stop(t + 0.15);
  },

  /** 灯管故障：短促电击 + 电流声瞬时增大 */
  buzz(strength) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime, s = clamp(strength, 0.05, 1);
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1200 + Math.random() * 1400; bp.Q.value = 5.5;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    for (let k = 0; k < 5; k++) {                       // 断续的“啪啪”声
      const tk = t + k * 0.045;
      g.gain.setValueAtTime(0.0001, tk);
      g.gain.exponentialRampToValueAtTime(0.055 * s * (0.5 + Math.random()), tk + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, tk + 0.035);
    }
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t, Math.random()); src.stop(t + 0.3);

    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 108;
    const of_ = ctx.createBiquadFilter(); of_.type = 'bandpass'; of_.frequency.value = 900; of_.Q.value = 3;
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.02 * s, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(of_); of_.connect(og); og.connect(this.master);
    o.start(t); o.stop(t + 0.24);

    this.hiss.gain.setTargetAtTime(0.02 + 0.06 * s, t, 0.02);
    this.hiss.gain.setTargetAtTime(0.02, t + 0.25, 0.12);
  },
};

function setupAudio() { SFX.init(); SFX.resume(); }

/* ============================ 9. 玩家：移动 / 碰撞 / 摆动 ============================ */

const keys = new Set();
const fwd = new THREE.Vector3(), rightV = new THREE.Vector3(), wish = new THREE.Vector3();
const tmpEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const BOX = new Float32Array(64 * 4);
let boxCount = 0;

function gatherWalls(px, pz) {
  const G = CFG.grid, C = CFG.cell, T = CFG.wallT, half = state.half;
  const { wallX, wallZ, wxi, wzi } = state.maze;
  const ci = Math.floor((px + half) / C), cj = Math.floor((pz + half) / C);
  boxCount = 0;
  for (let i = ci - 1; i <= ci + 2; i++) {
    if (i < 0 || i > G) continue;
    for (let j = cj - 1; j <= cj + 1; j++) {
      if (j < 0 || j >= G || !wallX[wxi(i, j)]) continue;
      const cx = -half + C * i, z0 = -half + C * j;
      const o = boxCount * 4;
      BOX[o] = cx - T / 2; BOX[o + 1] = z0; BOX[o + 2] = cx + T / 2; BOX[o + 3] = z0 + C;
      if (++boxCount >= 64) return;
    }
  }
  for (let j = cj - 1; j <= cj + 2; j++) {
    if (j < 0 || j > G) continue;
    for (let i = ci - 1; i <= ci + 1; i++) {
      if (i < 0 || i >= G || !wallZ[wzi(i, j)]) continue;
      const cz = -half + C * j, x0 = -half + C * i;
      const o = boxCount * 4;
      BOX[o] = x0; BOX[o + 1] = cz - T / 2; BOX[o + 2] = x0 + C; BOX[o + 3] = cz + T / 2;
      if (++boxCount >= 64) return;
    }
  }
}

/** 圆（半径 r）与 AABB 的推出式碰撞解算，两次迭代处理内角 */
function resolveCollision(p) {
  const r = CFG.radius, half = state.half;
  gatherWalls(p.x, p.z);
  for (let pass = 0; pass < 2; pass++) {
    for (let b = 0; b < boxCount; b++) {
      const o = b * 4;
      const minx = BOX[o], minz = BOX[o + 1], maxx = BOX[o + 2], maxz = BOX[o + 3];
      const nx = clamp(p.x, minx, maxx), nz = clamp(p.z, minz, maxz);
      let dx = p.x - nx, dz = p.z - nz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2), push = r - d;
        p.x += (dx / d) * push; p.z += (dz / d) * push;
      } else {
        const tl = p.x - minx, tr = maxx - p.x, tb = p.z - minz, tt = maxz - p.z;
        const m = Math.min(tl, tr, tb, tt);
        if (m === tl) p.x = minx - r; else if (m === tr) p.x = maxx + r;
        else if (m === tb) p.z = minz - r; else p.z = maxz + r;
      }
    }
  }
  const lim = half - CFG.wallT / 2 - r;
  p.x = clamp(p.x, -lim, lim); p.z = clamp(p.z, -lim, lim);
}

function updatePlayer(dt) {
  const p = state.player;
  const locked = controls.isLocked;
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight');
  const maxSpeed = run ? CFG.runSpeed : CFG.walkSpeed;

  camera.getWorldDirection(fwd);
  fwd.y = 0;
  if (fwd.lengthSq() < 1e-8) fwd.set(0, 0, -1); else fwd.normalize();
  rightV.set(-fwd.z, 0, fwd.x);

  let ix = 0, iz = 0;
  if (locked) {
    if (keys.has('KeyW') || keys.has('ArrowUp'))    iz += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  iz -= 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  ix -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  }
  wish.set(0, 0, 0);
  if (ix || iz) wish.addScaledVector(fwd, iz).addScaledVector(rightV, ix).normalize();

  p.vel.x += wish.x * CFG.accel * dt;
  p.vel.z += wish.z * CFG.accel * dt;
  const damp = Math.exp(-CFG.damping * dt);
  p.vel.x *= damp; p.vel.z *= damp;
  let sp = Math.hypot(p.vel.x, p.vel.z);
  if (sp > maxSpeed) { const k = maxSpeed / sp; p.vel.x *= k; p.vel.z *= k; sp = maxSpeed; }

  const ox = p.pos.x, oz = p.pos.z;
  p.pos.x += p.vel.x * dt; p.pos.z += p.vel.z * dt;
  resolveCollision(p.pos);
  if (dt > 1e-5) {                       // 碰撞后重算速度 → 自然贴墙滑动
    p.vel.x = clamp((p.pos.x - ox) / dt, -maxSpeed, maxSpeed);
    p.vel.z = clamp((p.pos.z - oz) / dt, -maxSpeed, maxSpeed);
  }
  sp = Math.hypot(p.vel.x, p.vel.z);
  p.speed = sp;

  // ---- 头部摆动 + 脚步 ----
  const ratio = clamp(sp / CFG.walkSpeed, 0, 1.7);
  const moving = sp > 0.32;
  if (moving) p.stepPhase += CFG.stepRate * (run ? 1.42 : 1.0) * Math.min(1.25, ratio) * dt;
  const amp = CFG.bobAmp * (run ? 1.85 : 1.0) * Math.min(1, ratio);
  const bobY = moving ? -Math.abs(Math.cos(p.stepPhase * Math.PI)) * amp
                      : Math.sin(state.time * 0.85) * 0.005;
  const sway = moving ? Math.sin(p.stepPhase * Math.PI) * amp * 0.6 : 0;
  const roll = moving ? Math.sin(p.stepPhase * Math.PI) * 0.008 * (run ? 1.5 : 1) : 0;

  camera.position.set(p.pos.x + rightV.x * sway, CFG.eyeH + bobY, p.pos.z + rightV.z * sway);
  tmpEuler.setFromQuaternion(camera.quaternion, 'YXZ');
  tmpEuler.z = roll;
  camera.quaternion.setFromEuler(tmpEuler);

  const stepIdx = Math.floor(p.stepPhase);
  if (moving && stepIdx !== p.lastStep) {
    p.lastStep = stepIdx;
    SFX.step(0.10 + 0.22 * Math.min(1, ratio), (stepIdx & 1) ? 0.26 : -0.26);
  }
}

/* ============================ 10. 每帧杂项 ============================ */

function updateDust(dt) {
  const N = CFG.dust, box = dust.userData.box, hb = box / 2;
  const px = camera.position.x, pz = camera.position.z;
  dust.position.set(0, 0, 0);
  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    dustPos[i3]     += dustVel[i3] * dt;
    dustPos[i3 + 1] += dustVel[i3 + 1] * dt;
    dustPos[i3 + 2] += dustVel[i3 + 2] * dt;
    // 相对玩家环绕（保持视野内始终有浮尘，不新建对象）
    let dx = dustPos[i3] - px;
    if (dx > hb) dustPos[i3] -= box; else if (dx < -hb) dustPos[i3] += box;
    let dz = dustPos[i3 + 2] - pz;
    if (dz > hb) dustPos[i3 + 2] -= box; else if (dz < -hb) dustPos[i3 + 2] += box;
    const y = dustPos[i3 + 1];
    if (y < 0.04) dustPos[i3 + 1] = CFG.wallH - 0.1;
    else if (y > CFG.wallH - 0.05) dustPos[i3 + 1] = 0.05;
  }
  dust.geometry.attributes.position.needsUpdate = true;
}

/** 距离剔除：贴花分块与玩家的 AABB 距离超过 30m 直接隐藏 */
function updateChunks() {
  const px = camera.position.x, pz = camera.position.z, R = 30;
  for (let i = 0; i < state.chunks.length; i++) {
    const c = state.chunks[i];
    const dx = px < c.x0 ? c.x0 - px : (px > c.x1 ? px - c.x1 : 0);
    const dz = pz < c.z0 ? c.z0 - pz : (pz > c.z1 ? pz - c.z1 : 0);
    c.mesh.visible = (dx * dx + dz * dz) < R * R;
  }
}

/** 自适应分辨率：保证 60fps */
function updateAdaptive(dt) {
  state.scaleT += dt;
  if (state.scaleT < 1.0) return;
  state.scaleT = 0;
  const fps = state.fps;
  let s = state.scale;
  if (fps < 52 && s > 0.68) s = Math.max(0.68, s - 0.1);
  else if (fps > 58.5 && s < 1) s = Math.min(1, s + 0.06);
  if (Math.abs(s - state.scale) > 0.005) { state.scale = s; onResize(); }
}

const hudEl = document.getElementById('hud');
function updateHUD(dt) {
  state.hudT += dt;
  if (!state.hudOn || state.hudT < 0.25) return;
  state.hudT = 0;
  const r = renderer.info.render;
  hudEl.textContent =
    `FPS       ${state.fps.toFixed(0)}\n` +
    `draw call ${r.calls}\n` +
    `triangles ${(r.triangles / 1000).toFixed(1)}k\n` +
    `res scale ${(state.scale * 100).toFixed(0)}%  (dpr ${renderer.getPixelRatio().toFixed(2)})\n` +
    `lamps     ${state.lamps.length}  (rect ${CFG.rectLights} / shadow ${CFG.spotLights})\n` +
    `cells     ${state.maze ? state.maze.cells : 0} 可达 / ${CFG.grid * CFG.grid}\n` +
    `post      ${state.postOn ? 'ON' : 'OFF'}   speed ${state.player.speed.toFixed(2)} m/s`;
}

/* ============================ 11. 输入 / UI ============================ */

const overlay  = document.getElementById('overlay');
const loadBox  = document.getElementById('loadBox');
const startBox = document.getElementById('startBox');
const barFill  = document.querySelector('#bar i');
const loadNote = document.getElementById('loadNote');
const tipEl    = document.getElementById('tip');
const dotEl    = document.getElementById('dot');
const ctaText  = document.getElementById('ctaText');
const startSub = document.getElementById('startSub');

function setProgress(p, note) {
  barFill.style.width = (clamp01(p) * 100).toFixed(0) + '%';
  if (note) loadNote.textContent = note;
}
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

function bindInput() {
  addEventListener('keydown', (e) => {
    keys.add(e.code);
    if (e.code === 'KeyH') { state.hudOn = !state.hudOn; hudEl.classList.toggle('hidden', !state.hudOn); }
    if (e.code === 'KeyP') { state.postOn = !state.postOn; }
    if (e.code === 'KeyF' && controls.isLocked) forceFlicker();
    if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  }, { passive: false });
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());

  overlay.addEventListener('click', () => {
    setupAudio();
    controls.lock();
  });
  controls.addEventListener('lock', () => {
    overlay.classList.add('hidden');
    tipEl.classList.remove('hidden');
    dotEl.classList.remove('hidden');
    SFX.resume(); SFX.setLevel(0.9, 0.4);
  });
  controls.addEventListener('unlock', () => {
    keys.clear();
    overlay.classList.remove('hidden');
    tipEl.classList.add('hidden');
    dotEl.classList.add('hidden');
    startSub.textContent = '已暂停';
    ctaText.textContent = '点击任意位置继续';
    SFX.setLevel(0.12, 0.3);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) SFX.setLevel(0.02, 0.2);
    else if (controls.isLocked) SFX.setLevel(0.9, 0.4);
  });
}

/* ============================ 12. 主循环 ============================ */

let prevT = 0;
function animate(now) {
  requestAnimationFrame(animate);
  if (!prevT) prevT = now;
  let dt = (now - prevT) / 1000;
  prevT = now;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.05);

  state.time += dt;
  state.frames++; state.accum += dt;
  if (state.accum >= 0.5) { state.fps = state.frames / state.accum; state.frames = 0; state.accum = 0; }

  updatePlayer(dt);
  state.poolT += dt;
  if (state.poolT >= 0.25) { state.poolT = 0; updateLightPool(); }   // 每 0.25s 重新分配灯池
  updateFlicker(dt);
  updateLampIntensity(state.time);
  updateDust(dt);
  updateChunks();
  updateAdaptive(dt);

  gradePass.uniforms.uTime.value = state.time;
  renderer.info.reset();
  if (state.postOn) composer.render(dt);
  else renderer.render(scene, camera);
  updateHUD(dt);
}

/* ============================ 13. 启动 ============================ */

function hasWebGL2() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
  } catch (e) { return false; }
}

async function generateTextures() {
  const steps = [
    ['生成墙面纹理（黄墙纸 / 霉斑 / 水渍）…', () => { TEX.wall  = buildWallTextures(); }],
    ['生成地毯纹理（绒圈 / 污渍 / 磨损）…',   () => { TEX.floor = buildCarpetTextures(); }],
    ['生成吊顶纹理（矿棉板 / 水渍环）…',      () => { TEX.ceil  = buildCeilTextures(); }],
    ['生成灯管 / 贴花 / 浮尘纹理…',           () => { const s = buildSmallTextures(); TEX.tube = s.tube; TEX.stain = s.stain; TEX.dust = s.dust; }],
  ];
  for (let i = 0; i < steps.length; i++) {
    setProgress(i / (steps.length + 2), steps[i][0]);
    await nextFrame();
    steps[i][1]();
  }
}

async function main() {
  if (!hasWebGL2()) {
    window.__BR_FATAL('WebGL 不可用',
      '当前浏览器 / 显卡驱动不支持 WebGL 2。请使用最新版 Chrome 或 Firefox 桌面端，并在设置中启用硬件加速。');
    return;
  }
  setProgress(0.02, '初始化渲染器…');
  await nextFrame();
  initScene();

  await generateTextures();

  setProgress(0.72, '构建无尽走廊…');
  await nextFrame();
  buildLevel();

  setProgress(0.88, '布置荧光灯与雾气…');
  await nextFrame();
  setupLights();
  updateLightPool();          // 首帧前完成灯池分配，避免开场全黑
  setupPost();
  bindInput();

  setProgress(1, '就绪');
  window.__BR_READY = true;
  await nextFrame();
  loadBox.classList.add('hidden');
  startBox.classList.remove('hidden');

  requestAnimationFrame(animate);
}

main().catch((err) => {
  console.error(err);
  window.__BR_FATAL('初始化失败', (err && (err.stack || err.message)) || String(err));
});
</script>
