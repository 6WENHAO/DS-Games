  }

  // 生成 2 秒白噪声 buffer（缓存复用，供所有噪声类音效使用）
  function makeNoiseBuffer(seconds) {
    var sr = ctx.sampleRate;
    var len = Math.floor(sr * seconds);
    var buf = ctx.createBuffer(2, len, sr);
    for (var ch = 0; ch < 2; ch++) {
      var data = buf.getChannelData(ch);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    return buf;
  }

  // 一次性“声部”：振荡器 + 指数包络；onended 里自动断开，防泄漏
  function voice(type, freq, when, dur, peak, dest) {
    var t = (when == null) ? now() : when;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.005);      // 快速起音
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);      // 指数衰减
    osc.connect(g);
    g.connect(dest || master);
    var done = false;
    function cleanup() {
      if (done) return;
      done = true;
      try { osc.disconnect(); } catch (e) {}
      try { g.disconnect(); } catch (e) {}
    }
    osc.onended = cleanup;
    osc.start(t);
    osc.stop(t + dur + 0.05);
    return { osc: osc, gain: g, cleanup: cleanup };
  }

  // 一次性“冲击组”：共享输出增益 + 整体包络；
  // 组内所有源结束后在 onended 里统一断开全部节点
  function beginShot(peak, dur) {
    var t = now();
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.002);      // 快速起音防咔哒
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);      // 整体衰减
    g.connect(master);
    var nodes = [g];
    var pending = 0, done = false;
    function release() {
      if (done) return;
      done = true;
      for (var i = 0; i < nodes.length; i++) {
        try { nodes[i].disconnect(); } catch (e) {}
      }
    }
    function reg(srcNode) {
      nodes.push(srcNode);
      pending++;
      srcNode.onended = function () {
        pending--;
        if (pending <= 0) release();
      };
    }
    // 兜底：即使 onended 异常未触发，也按时释放
    setTimeout(release, (dur + 0.3) * 1000);
    return { gain: g, reg: reg, release: release };
  }

  /* ================= 4. 解锁与主链路 ================= */
  // 首次用户手势调用：惰性创建 AudioContext 与主链路
  function unlock() {
    if (!AC) return false; // 环境不支持，整体降级
    if (ctx && ctx.state === 'closed') ctx = null; // 上下文被关闭则重建
    if (!ctx) {
      try {
        ctx = new AC();
      } catch (e) {
        ctx = null;
        return false;
      }
      master = ctx.createGain();
      master.gain.value = muted ? 0 : volume;
      comp = ctx.createDynamicsCompressor(); // 温和压缩，总输出峰值控制在 0.7 内
      comp.threshold.value = -14;
      comp.knee.value = 18;
      comp.ratio.value = 4;
      comp.attack.value = 0.004;
      comp.release.value = 0.24;
      master.connect(comp);
      comp.connect(ctx.destination);
      noiseBuf = makeNoiseBuffer(2); // 2 秒白噪声，全程复用
    }
    // Safari 等：suspended 状态需要 resume()
    if (ctx.state === 'suspended') {
      var p = ctx.resume();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    }
    return true;
  }

  /* ================= 5. 音量与静音 ================= */
  function setMuted(m) {
    muted = !!m;
    if (ctx && master) setP(master.gain, muted ? 0 : volume, 0.01);
  }
  function isMuted() { return muted; }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, +v || 0));
    if (ctx && master && !muted) setP(master.gain, volume, 0.01);
  }

  /* ================= 6. 滚动声（常驻节点链） ================= */
  // 惰性创建滚动节点链：只建一次，之后仅调参数，绝不每帧新建
  function ensureRolling() {
    if (roll.src) return;
    // 噪声 -> 带通(主) -> 带通(谐振峰) -> 增益 -> master
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 400;
    filter.Q.value = 1.0;
    var resFilter = ctx.createBiquadFilter();
    resFilter.type = 'bandpass';
    resFilter.frequency.value = 700;
    resFilter.Q.value = 2.6; // 轻微谐振峰，模拟木纹颗粒
    var gain = ctx.createGain();
    gain.gain.value = 0; // 初始静默
    src.connect(filter);
    filter.connect(resFilter);
    resFilter.connect(gain);
    gain.connect(master);
    src.start(0); // 常驻循环播放；增益为 0 时静默

    // 木纹颗粒层：低幅锯齿波，频率随速度调制
    var osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 80;
    var oscFilter = ctx.createBiquadFilter();
    oscFilter.type = 'lowpass';
    oscFilter.frequency.value = 900;
    var oscGain = ctx.createGain();
    oscGain.gain.value = 0;
    osc.connect(oscFilter);
    oscFilter.connect(oscGain);
    oscGain.connect(master);
    osc.start(0);

    roll.src = src; roll.filter = filter; roll.resFilter = resFilter;
    roll.gain = gain; roll.osc = osc; roll.oscFilter = oscFilter; roll.oscGain = oscGain;
  }

  // 每帧调用：speed 为 0..400（板单位/秒）。
  // 内部用 setTargetAtTime 平滑；speed≈0 时淡出到静音。
  function setRolling(speed, opts) {
    if (!ctx) return;
    opts = opts || {};
    var s = Math.max(0, Math.min(400, +speed || 0));
    roll.speed = s;

    if (s > 0.5) {
      ensureRolling();
      var k = s / 400;             // 归一化 0..1
      var center = 200 + k * 1600; // 带通中心频率 200 -> 1800Hz
      setP(roll.filter.frequency, center, 0.05);
      setP(roll.resFilter.frequency, center * 1.6, 0.05);
      setP(roll.filter.Q, opts.onWood ? 1.3 : 0.9, 0.1); // 木面共振微调
      // 增益非线性上升：低速几乎无声（平方律）
      setP(roll.gain.gain, 0.03 + 0.38 * k * k, 0.06);
      // 颗粒层频率与幅度随速度上升
      setP(roll.osc.frequency, 55 + k * 300, 0.08);
      setP(roll.oscGain.gain, 0.012 + 0.028 * k, 0.08);
      roll.active = true;
    } else if (roll.active) {
      // speed≈0：淡出到静音（不销毁节点，下次直接复用）
      setP(roll.gain.gain, 0, 0.12);
      setP(roll.oscGain.gain, 0, 0.12);
      roll.active = false;
    }
  }

  function stopRolling() {
    roll.speed = 0;
    roll.active = false;
    if (ctx && roll.gain) {
      setP(roll.gain.gain, 0, 0.1);
      setP(roll.oscGain.gain, 0, 0.1);
    }
  }

  /* ================= 7. 撞墙 ================= */
  // 短促冲击（<80ms）：噪声爆破 + 板腔共鸣分量；
  // impact≈8..400，越大越响越低沉；带 35ms 节流与随机音高抖动。
  function knock(impact) {
    if (!ctx) return;
    var t = now();
    // 节流：最小间隔 35ms（同一帧多次调用只发一次）
    if (t - lastKnock < 0.035) return;
    lastKnock = t;

    var k = Math.max(0, Math.min(1, ((+impact || 8) - 8) / 392)); // 归一化 0..1
    // 越大力越低沉：主频 900 -> 200Hz
    var base = 900 - k * 700;
    // 3~8ms 随机音高抖动：±3~8Hz 随机 detune（毫秒量级的噪声起点偏移已含在
    // nsrc.start 的随机 offset 里），让连续撞击不那么机械
    var jitterHz = (Math.random() < 0.5 ? -1 : 1) * (3 + Math.random() * 5);

    var shot = beginShot(0.28 + 0.32 * k, 0.08); // 整体 < 80ms

    // 噪声爆破：经带通滤波，模拟木头“咔哒”
    var nsrc = ctx.createBufferSource();
    nsrc.buffer = noiseBuf;
    var nf = ctx.createBiquadFilter();
    nf.type = 'bandpass';
    nf.frequency.value = base + jitterHz;
    nf.Q.value = 1.4;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.3 + 0.3 * k, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    nsrc.connect(nf);
    nf.connect(ng);
    ng.connect(shot.gain);
    nsrc.start(t, Math.random(), 0.05); // 随机起点 -> 每次音色略有差异
    shot.reg(nsrc);

    // 板腔共鸣：180 / 420 / 900Hz 三个快速衰减正弦分量
    var body = [
      { f: 180, w: 0.5 },
      { f: 420, w: 0.35 },
      { f: 900, w: 0.25 }
    ];
    for (var i = 0; i < body.length; i++) {
      var b = body[i];
      var freq = b.f * (1 - 0.25 * k) + jitterHz * (b.f / 900);
      var osc = ctx.createOscillator();
      var og = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.05 + 0.15 * k, t + 0.003);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      osc.connect(og);
      og.connect(shot.gain);
      osc.start(t);
      osc.stop(t + 0.09);
      shot.reg(osc);
    }
  }

  /* ================= 8. 掉洞 ================= */
  // 下滑扫频（500 -> 90Hz）+ 气流噪声 + 落底闷响，总时长 ≤ 700ms
  function holeFall() {
    if (!ctx) return;
    var t = now();
    var shot = beginShot(0.45, 0.6);

    // 下滑正弦：500Hz -> 90Hz 指数扫频（约 300ms）
    var osc = ctx.createOscillator();
    var og = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, t);
    osc.frequency.exponentialRampToValueAtTime(90, t + 0.3);
    og.gain.setValueAtTime(0.35, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.connect(og);
    og.connect(shot.gain);
    osc.start(t);
    osc.stop(t + 0.34);
    shot.reg(osc);

    // 气流噪声：带通中心频率同步下滑，增强“坠入空腔”感
    var nsrc = ctx.createBufferSource();
    nsrc.buffer = noiseBuf;
    nsrc.loop = true;
    nsrc.playbackRate.value = 0.6;
    var nf = ctx.createBiquadFilter();
    nf.type = 'bandpass';
    nf.Q.value = 2.2;
    nf.frequency.setValueAtTime(420, t);
    nf.frequency.exponentialRampToValueAtTime(110, t + 0.3);
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.12, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    nsrc.connect(nf);
    nf.connect(ng);
    ng.connect(shot.gain);
    nsrc.start(t, Math.random());
    nsrc.stop(t + 0.3);
    shot.reg(nsrc);

    // 落底闷响：低频正弦 + 快衰减
    voice('sine', 75, t + 0.3, 0.16, 0.5, shot.gain);
  }

  /* ================= 9. 通关 ================= */
  // C 大调上行琶音 C5-E5-G5-C6 + 轻微 delay/feedback 铃声尾音（≤ 1.5s）
  function win() {
    if (!ctx) return;
    var t = now();
    var notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6

    // 延迟反馈链：三角波送入后产生轻微回声，营造铃声感
    var delay = ctx.createDelay(0.6);
    delay.delayTime.value = 0.13;
    var fb = ctx.createGain();
    fb.gain.value = 0.3;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 2600;
    delay.connect(lp);
    lp.connect(fb);
    fb.connect(delay);
    delay.connect(master);

    for (var i = 0; i < notes.length; i++) {
      var v = voice('triangle', notes[i], t + i * 0.11, 0.55, 0.32, master);
      v.gain.connect(delay); // 湿声送进延迟反馈链
    }
    // 高八度泛音长衰减作为铃声尾音
    voice('triangle', 2093, t + 0.44, 0.8, 0.1, master);

    // 尾音结束后断开延迟链，防止泄漏
    setTimeout(function () {
      try { delay.disconnect(); } catch (e) {}
      try { lp.disconnect(); } catch (e) {}
      try { fb.disconnect(); } catch (e) {}
    }, 1700);
  }

  /* ================= 10. 失败 ================= */
  // 低沉的 buzz（双锯齿失谐拍频）+ 下行小二度（110 -> ~104Hz）
  function lose() {
    if (!ctx) return;
    var t = now();
    var shot = beginShot(0.5, 0.55);

    var o1 = ctx.createOscillator();
    var o2 = ctx.createOscillator();
    o1.type = 'sawtooth';
    o2.type = 'sawtooth';
    o1.frequency.setValueAtTime(110, t);
    o1.frequency.exponentialRampToValueAtTime(103.8, t + 0.5); // 下行小二度
    o2.frequency.setValueAtTime(110.7, t);
    o2.frequency.exponentialRampToValueAtTime(104.5, t + 0.5); // 轻微失谐 -> 嗡嗡拍频
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 380;
    var g = ctx.createGain();
    g.gain.value = 0.14;
    o1.connect(lp);
    o2.connect(lp);
    lp.connect(g);
    g.connect(shot.gain);
    o1.start(t); o1.stop(t + 0.55);
    o2.start(t); o2.stop(t + 0.55);
    shot.reg(o1);
    shot.reg(o2);
  }

  /* ================= 11. 计时 / 界面 ================= */
  // 计时 / 经过编号洞：轻快点击
  function tick() {
    if (!ctx) return;
    var t = now();
    var shot = beginShot(0.22, 0.06);
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1500 + Math.random() * 300, t);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    osc.connect(g);
    g.connect(shot.gain);
    osc.start(t);
    osc.stop(t + 0.06);
    shot.reg(osc);
  }

  // 界面按钮点击：短促上扬滴答
  function ui() {
    if (!ctx) return;
    var t = now();
    var shot = beginShot(0.25, 0.08);
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(680, t);
    osc.frequency.linearRampToValueAtTime(980, t + 0.05);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    osc.connect(g);
    g.connect(shot.gain);
    osc.start(t);
    osc.stop(t + 0.08);
    shot.reg(osc);
  }

  /* ================= 12. 环境底噪（可选） ================= */
  var amb = { src: null, gain: null };
  function setAmbient(on) {
    if (!ctx) return;
    on = !!on;
    if (on && !amb.src) {
      var src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 320;
      var g = ctx.createGain();
      g.gain.value = 0;
      src.connect(lp);
      lp.connect(g);
      g.connect(master);
      src.start(0);
      amb.src = src;
      amb.gain = g;
    }
    if (amb.gain) setP(amb.gain.gain, on ? 0.012 : 0, 0.5);
  }

  /* ================= 13. 暴露 API ================= */
  Sfx.unlock = unlock;
  Sfx.setMuted = setMuted;
  Sfx.isMuted = isMuted;
  Sfx.setVolume = setVolume;
  Sfx.setRolling = setRolling;
  Sfx.stopRolling = stopRolling;
  Sfx.knock = knock;
  Sfx.holeFall = holeFall;
  Sfx.win = win;
  Sfx.lose = lose;
  Sfx.tick = tick;
  Sfx.ui = ui;
  Sfx.ambient = setAmbient;

  // 辅助调试信息（试听页状态栏使用，非必需 API）
  Sfx.debug = function () {
    return {
      available: Sfx.available,
      state: ctx ? ctx.state : 'none',
      muted: muted,
      volume: volume,
      rolling: roll.speed
    };
  };

  root.Sfx = Sfx;
})();

</script>
<script>
/* =========================================================================
 * 迷宫球 Labyrinth —— 主程序
 * 负责：视图/渲染（木板、墙壁、洞、钢珠）、输入（鼠标/键盘/旋钮/陀螺仪）、
 *       HUD 与关卡流程。物理由 js/physics.js 负责，关卡由 js/mazes.js 负责。
 * ========================================================================= */
(function () {
  'use strict';

  /* ------------------------------ 小工具 ------------------------------ */
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var TAU = Math.PI * 2;

  function lerp(a, b, t) { return a + (b - a) * t; }

  /** 指数趋近（与帧率无关的平滑） */
  function approach(cur, target, rate, dt) {
    return target + (cur - target) * Math.exp(-rate * dt);
  }

  function fmtTime(ms) {
    if (ms == null || !isFinite(ms)) return '--:--.-';
    var t = Math.max(0, ms) / 1000;
    var m = Math.floor(t / 60);
    var s = t - m * 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }

  /** mulberry32：确定性随机，用于木纹等静态纹理（避免每次重绘抖动） */
  function rngOf(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function rrect(g, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  /* ------------------------------ 配置 ------------------------------ */
  var PAD = 6;              // 木框宽度（板单位）
  var WALL_H = 2.0;         // 墙的视觉高度（板单位）
  var BALL_R_FALLBACK = 1.7;

  /* 难度参数。注意 physics.js 的库仑摩擦为 coulombFactor*g*(rollingResistance/0.9)，
     所以 roll 越大必须把 coulomb 调小，否则会出现「满倾角也推不动球」的死区。
     coulomb 决定起步死区：起步所需倾角 ≈ coulombFactor*(roll/0.9)/rollFactor。 */
  var DIFF = {
    easy:   { label: '轻松', tiltMax: 0.100, roll: 1.45, rest: 0.26, gravity: 940,  drag: 0.030, coulomb: 0.010, rim: 0.055 },
    normal: { label: '标准', tiltMax: 0.128, roll: 1.00, rest: 0.32, gravity: 980,  drag: 0.020, coulomb: 0.012, rim: 0.070 },
    hard:   { label: '硬核', tiltMax: 0.165, roll: 0.62, rest: 0.40, gravity: 1040, drag: 0.015, coulomb: 0.014, rim: 0.085 }
  };

  var LS_KEY = 'mazeball.v1';

  /* ------------------------------ 状态 ------------------------------ */
  var S = {
    levels: [],
    levelIndex: 0,
    level: null,
    world: null,
    ballR: BALL_R_FALLBACK,

    running: false,     // 局内（未通关未暂停）
    paused: false,
    timing: false,      // 计时是否已启动（首次操作后）
    elapsed: 0,         // ms
    penalty: 0,         // ms（提示惩罚）
    falls: 0,
    passed: null,       // 编号洞是否已通过
    maxN: 0,
    numberedTotal: 0,
    respawn: null,      // 存档点
    startDist: 1,

    tilt: { x: 0, y: 0 },
    target: { x: 0, y: 0 },
    knob: { x: 0, y: 0 },   // 旋钮位置 -1..1（旋钮模式下保持）
    keys: {},
    ptr: { inside: false, nx: 0, ny: 0 },
    gyro: { on: false, base: null, gamma: 0, beta: 0 },

    hintLeft: 3,
    hintPath: null,
    hintUntil: 0,
    hintCache: {},

    shake: 0,

  /* ==================================================================

  function loadStore() {

  /* ==================================================================

  function levelDefs() {

  function buildLevel(def) {
    var lv = null;

      if (window.MazeLib && typeof window.MazeLib.getLevel === 'function') {

      }
      if (!lv && typeof def.build === 'function') {
        lv = def.build({ ballRadius: def.ballRadius || BALL_R_FALLBACK, seed: (Math.random() * 1e9) | 0 });
      }
    } catch (e) {

    lv.checkpoints = lv.checkpoints || [];
    lv.width = lv.width || 100;
    lv.height = lv.height || 100;

  function loadLevel(idx, opts) {

    var def = S.levels[S.levelIndex];
    S.level = buildLevel(def);
    S.ballR = S.level.ballRadius || BALL_R_FALLBACK;

    var d = DIFF[S.cfg.diff] || DIFF.normal;
    var params = {
      walls: S.level.walls,
      holes: S.level.holes,
      goal: S.level.goal,
      checkpoints: S.level.checkpoints,
      start: S.level.start,
      ballRadius: S.ballR,
      gravity: d.gravity,

    if (window.MazeBallPhysics && typeof window.MazeBallPhysics.create === 'function') {
      S.world = window.MazeBallPhysics.create(params);

    S.numberedTotal = 0;
    for (var i = 0; i < S.level.holes.length; i++) if (S.level.holes[i].n > 0) S.numberedTotal++;

    S.hintPath = null;
    S.hintUntil = 0;

    resetRound(true);

  function resetRound(full) {

    if (full) S.respawn = null;
    S.world.reset({ x: st.x, y: st.y });
    S.elapsed = full ? 0 : S.elapsed;
    S.penalty = full ? 0 : S.penalty;
    S.timing = false;
    S.paused = false;
    S.running = true;
    S.tilt.x = S.tilt.y = 0;
    S.target.x = S.target.y = 0;
    S.knob.x = S.knob.y = 0;
    S.trail.length = 0;
    S.puffs.length = 0;
    S.sparks.length = 0;
    S.shake = 0;
    if (full) {
      S.passed = {};
      S.maxN = 0;
    }
    var g = S.level.goal, s = S.level.start;
    S.startDist = Math.max(1, Math.hypot(g.x - s.x, g.y - s.y));

  }

  /* ==================================================================
   * 兜底物理（physics.js 未加载时的极简实现）
   * ================================================================== */
  function miniPhysics(p) {
    var w = {
      ball: { x: p.start.x, y: p.start.y, vx: 0, vy: 0, speed: 0, rot: 0, rotVel: 0 },
      state: 'rolling', fallInfo: null, stats: { time: 0, wallHits: 0, topSpeed: 0, distance: 0 },
      tilt: { x: 0, y: 0 },
      setTilt: function (x, y) { this.tilt.x = clamp(x, -0.35, 0.35); this.tilt.y = clamp(y, -0.35, 0.35); },
      getTilt: function () { return { x: this.tilt.x, y: this.tilt.y }; },
      reset: function (pos) {
        var s = pos || p.start;
        this.ball.x = s.x; this.ball.y = s.y; this.ball.vx = this.ball.vy = this.ball.speed = 0;
        this.state = 'rolling'; this.fallInfo = null;
      },
      step: function (dt) {
        var ev = [], b = this.ball, i;
        dt = Math.min(dt, 0.05);
        if (this.state === 'falling') {
          this.fallInfo.progress = Math.min(1, this.fallInfo.progress + dt / 0.45);
          b.x = lerp(b.x, this.fallInfo.hole.x, 0.25);
          b.y = lerp(b.y, this.fallInfo.hole.y, 0.25);
          if (this.fallInfo.progress >= 1) {
            this.state = this.fallInfo.isGoal ? 'won' : 'sunk';
            ev.push({ type: this.fallInfo.isGoal ? 'won' : 'sunk', hole: this.fallInfo.hole });
          }
          return ev;
        }
        if (this.state !== 'rolling') return ev;
        var acc = (5 / 7) * p.gravity;
        b.vx += acc * this.tilt.x * dt;
        b.vy += acc * this.tilt.y * dt;
        var damp = Math.exp(-(p.rollingResistance || 1) * dt);
        b.vx *= damp; b.vy *= damp;
        var steps = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy) * dt / (p.ballRadius * 0.3)));
        for (var s = 0; s < steps; s++) {
          var h = dt / steps;
          b.x += b.vx * h; b.y += b.vy * h;
          for (i = 0; i < p.walls.length; i++) {
            var r = p.walls[i];
            var cx = clamp(b.x, r.x, r.x + r.w), cy = clamp(b.y, r.y, r.y + r.h);
            var dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
            if (d < p.ballRadius && d > 1e-9) {
              var nx = dx / d, ny = dy / d, pen = p.ballRadius - d;
              b.x += nx * pen; b.y += ny * pen;
              var vn = b.vx * nx + b.vy * ny;
              if (vn < 0) {
                b.vx -= (1 + p.restitution) * vn * nx;
                b.vy -= (1 + p.restitution) * vn * ny;
                if (-vn > 8) ev.push({ type: 'wallHit', x: b.x, y: b.y, nx: nx, ny: ny, impact: -vn });
              }
            }
          }
        }
        b.speed = Math.hypot(b.vx, b.vy);
        b.rotVel = b.speed / p.ballRadius; b.rot += b.rotVel * dt;
        var all = p.holes.concat(p.goal ? [{ x: p.goal.x, y: p.goal.y, r: p.goal.r, n: 0, __goal: 1 }] : []);
        for (i = 0; i < all.length; i++) {
          var ho = all[i];
          if (Math.hypot(b.x - ho.x, b.y - ho.y) < 0.9 * ho.r) {
            this.state = 'falling';
            this.fallInfo = { hole: ho, progress: 0, isGoal: !!ho.__goal };
            ev.push({ type: 'holeEnter', hole: ho, isGoal: !!ho.__goal });
            break;
          }
        }
        return ev;
      }
    };
    return w;
  }

  /* ==================================================================
   * 视图与静态层渲染
   * ================================================================== */
  function layout() {
    var stage = el.stage, cv = el.canvas;
    var rect = stage.getBoundingClientRect();
    var size = Math.max(160, Math.min(rect.width, rect.height));
    S.dpr = Math.min(window.devicePixelRatio || 1, 2.25);
    var px = Math.round(size * S.dpr);
    if (cv.width !== px || cv.height !== px) {
      cv.width = px; cv.height = px;
      S.staticDirty = true;
    }
    S.view.size = size;
    S.view.span = Math.max(S.level ? S.level.width : 100, S.level ? S.level.height : 100) + PAD * 2;
    S.view.k = px / S.view.span;
    if (S.staticDirty) renderStatic();
  }

  /** 世界坐标 → 画布像素的变换 */
  function setWorldTransform(g, offx, offy) {
    var k = S.view.k;
    g.setTransform(k, 0, 0, k, k * (PAD + (offx || 0)), k * (PAD + (offy || 0)));
  }

  function renderStatic() {
    if (!S.level) return;
    var px = el.canvas.width;
    if (!S.staticCv) S.staticCv = document.createElement('canvas');
    if (S.staticCv.width !== px) { S.staticCv.width = px; S.staticCv.height = px; }
    var g = S.staticCv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, px, px);
    setWorldTransform(g);

    var L = S.level, W = L.width, H = L.height, i;
    var rnd = rngOf(1337 + (L.id ? L.id.length * 977 : 0));

    /* --- 外框（深色核桃木） --- */
    drawWood(g, -PAD, -PAD, W + PAD * 2, H + PAD * 2, rnd, ['#4a2d18', '#33200f', '#5b3a1f']);
    // 框内斜面
    g.save();
    g.beginPath();
    g.rect(-PAD, -PAD, W + PAD * 2, H + PAD * 2);
    g.rect(0, 0, W, H);
    g.clip('evenodd');
    var bev = g.createLinearGradient(-PAD, -PAD, PAD * 0.4, PAD * 0.4);
    bev.addColorStop(0, 'rgba(255,220,170,.18)');
    bev.addColorStop(.5, 'rgba(0,0,0,0)');
    bev.addColorStop(1, 'rgba(0,0,0,.32)');
    g.fillStyle = bev;
    g.fillRect(-PAD, -PAD, W + PAD * 2, H + PAD * 2);
    g.restore();

    /* --- 板面（浅色枫木） --- */
    drawWood(g, 0, 0, W, H, rngOf(90210), ['#d3a86e', '#c0925a', '#e0bd88']);

    // 板面四周内阴影
    var vg = g.createRadialGradient(W * .42, H * .38, W * .2, W * .5, H * .5, W * .8);
    vg.addColorStop(0, 'rgba(255,248,226,.13)');
    vg.addColorStop(.74, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(72,38,12,.19)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);

    /* --- 印刷引导线（先画，随后被划痕覆盖，显得是印在木头上的旧漆） --- */
    if (S.cfg.guide && L.guide && L.guide.length > 1) drawGuide(g, L.guide);

    /* --- 使用痕迹：划痕与水渍 --- */
    var wr = rngOf(4242);
    g.save();
    g.beginPath(); g.rect(0, 0, W, H); g.clip();
    for (i = 0; i < 46; i++) {
      var sx0 = wr() * W, sy0 = wr() * H, ln = 2 + wr() * 12, an = wr() * TAU;
      g.strokeStyle = wr() < .5 ? 'rgba(90,54,22,.1)' : 'rgba(255,240,215,.12)';
      g.lineWidth = .1 + wr() * .18;
      g.beginPath();
      g.moveTo(sx0, sy0);
      g.lineTo(sx0 + Math.cos(an) * ln, sy0 + Math.sin(an) * ln);
      g.stroke();
    }
    for (i = 0; i < 3; i++) {
      var rx = wr() * W, ry = wr() * H, rr2 = 3 + wr() * 7;
      var sg2 = g.createRadialGradient(rx, ry, rr2 * .7, rx, ry, rr2);
      sg2.addColorStop(0, 'rgba(120,74,30,0)');
      sg2.addColorStop(.8, 'rgba(120,74,30,.07)');
      sg2.addColorStop(1, 'rgba(120,74,30,0)');
      g.fillStyle = sg2;
      g.beginPath(); g.arc(rx, ry, rr2, 0, TAU); g.fill();
    }
    g.restore();

    /* --- 起点 / 终点 --- */
    drawStartMark(g, L.start);
    drawGoal(g, L.goal);

    /* --- 存档点 --- */
    for (var c = 0; c < L.checkpoints.length; c++) drawCheckpoint(g, L.checkpoints[c]);

    /* --- 洞 + 编号 --- */
    for (i = 0; i < L.holes.length; i++) drawHole(g, L.holes[i]);
    var labels = layoutLabels(L);
    for (i = 0; i < labels.length; i++) drawHoleNumber(g, labels[i]);

    /* --- 墙 --- */
    for (i = 0; i < L.walls.length; i++) drawWall(g, L.walls[i]);

    /* --- 铜螺丝 --- */
    var sp = PAD * 0.5;
    drawScrew(g, -sp, -sp); drawScrew(g, W + sp, -sp);
    drawScrew(g, -sp, H + sp); drawScrew(g, W + sp, H + sp);

    S.staticDirty = false;
  }

  /** 程序化木纹 */
  function drawWood(g, x, y, w, h, rnd, cols) {
    var base = g.createLinearGradient(x, y, x + w * .35, y + h);
    base.addColorStop(0, cols[2]);
    base.addColorStop(.45, cols[0]);
    base.addColorStop(1, cols[1]);
    g.fillStyle = base;
    g.fillRect(x, y, w, h);

    g.save();
    g.beginPath(); g.rect(x, y, w, h); g.clip();
    // 纹理线
    var lines = Math.round(h * 2.8);
    for (var i = 0; i < lines; i++) {
      var yy = y + rnd() * h;
      var amp = .5 + rnd() * 2.8;
      var alpha = .05 + rnd() * .14;
      g.strokeStyle = rnd() < .55 ? 'rgba(64,35,12,' + alpha + ')' : 'rgba(255,231,190,' + (alpha * .8) + ')';
      g.lineWidth = .16 + rnd() * .85;
      g.beginPath();
      g.moveTo(x - 1, yy);
      var segs = 4 + ((rnd() * 3) | 0);
      for (var s = 1; s <= segs; s++) {
        var px1 = x + (w + 2) * (s - .5) / segs, px2 = x + (w + 2) * s / segs;
        g.quadraticCurveTo(px1 - 1, yy + (rnd() - .5) * amp * 2, px2, yy + (rnd() - .5) * amp);
      }
      g.stroke();
    }
    // 木节
    var knots = 1 + ((rnd() * 3) | 0);
    for (var kk = 0; kk < knots; kk++) {
      var cx = x + w * (.12 + rnd() * .76), cy = y + h * (.12 + rnd() * .76);
      var rr = 1.6 + rnd() * 3.4;
      for (var ring = 0; ring < 5; ring++) {
        g.strokeStyle = 'rgba(80,45,18,' + (.1 - ring * .015) + ')';
        g.lineWidth = .35;
        g.beginPath();
        g.ellipse(cx, cy, rr * (1 + ring * .45), rr * (.6 + ring * .3), rnd() * TAU, 0, TAU);
        g.stroke();
      }
    }
    g.restore();
  }

  /** 印刷引导线：浅色底衬 + 红漆虚线，逐段随机化模拟旧漆磨损 */
  function drawGuide(g, pts) {
    var rnd = rngOf(5150);
    g.save();
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,250,236,.22)';
    g.lineWidth = 2.0;
    path(g, pts); g.stroke();
    g.setLineDash([2.8, 2.4]);
    for (var i = 1; i < pts.length; i++) {
      g.strokeStyle = 'rgba(' + (172 + ((rnd() * 22) | 0)) + ',' + (72 + ((rnd() * 18) | 0)) + ',52,' + (0.3 + rnd() * 0.26).toFixed(2) + ')';
      g.lineWidth = .8 + rnd() * .32;
      g.lineDashOffset = rnd() * 4;
      g.beginPath();
      g.moveTo(pts[i - 1].x, pts[i - 1].y);
      g.lineTo(pts[i].x, pts[i].y);
      g.stroke();
    }
    g.restore();
  }

  function path(g, pts) {
    g.beginPath();
    g.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  }

  function drawHole(g, h) {
    var r = h.r;
    g.save();
    // 外沿环境遮蔽
    g.beginPath(); g.arc(h.x, h.y, r * 1.16, 0, TAU);
    var ao = g.createRadialGradient(h.x, h.y, r * .9, h.x, h.y, r * 1.18);
    ao.addColorStop(0, 'rgba(58,32,10,.42)');
    ao.addColorStop(1, 'rgba(58,32,10,0)');
    g.fillStyle = ao; g.fill();

    // 洞内
    g.beginPath(); g.arc(h.x, h.y, r, 0, TAU);
    var gd = g.createRadialGradient(h.x + r * .22, h.y + r * .3, r * .1, h.x, h.y, r);
    gd.addColorStop(0, '#0a0705');
    gd.addColorStop(.55, '#150d07');
    gd.addColorStop(.87, '#2c1c0f');
    gd.addColorStop(1, '#4a2f18');
    g.fillStyle = gd; g.fill();

    // 远侧内壁受光
    g.beginPath();
    g.arc(h.x, h.y, r * .82, -0.16 * Math.PI, 0.62 * Math.PI);
    g.strokeStyle = 'rgba(163,113,64,.55)';
    g.lineWidth = r * .3;
    g.stroke();

    // 近侧倒角高光
    g.beginPath();
    g.arc(h.x, h.y, r * 1.02, 0.98 * Math.PI, 1.62 * Math.PI);
    g.strokeStyle = 'rgba(255,232,190,.34)';
    g.lineWidth = r * .16;
    g.stroke();
    g.restore();
  }

  function pointBlocked(x, y, L, rad) {
    var i;
    for (i = 0; i < L.walls.length; i++) {
      var w = L.walls[i];
      if (x > w.x - rad && x < w.x + w.w + rad && y > w.y - rad && y < w.y + w.h + rad) return true;
    }
    for (i = 0; i < L.holes.length; i++) {
      var h = L.holes[i];
      if (Math.hypot(x - h.x, y - h.y) < h.r + rad) return true;
    }
    if (x < rad || y < rad || x > L.width - rad || y > L.height - rad) return true;
    return false;
  }

  /** 某点到最近墙面 / 洞边缘的净空（板单位） */
  function clearanceAt(x, y, L) {
    var m = 1e9, i, w, h;
    for (i = 0; i < L.walls.length; i++) {
      w = L.walls[i];
      var cx = clamp(x, w.x, w.x + w.w), cy = clamp(y, w.y, w.y + w.h);
      var d = Math.hypot(x - cx, y - cy);
      if (d < m) m = d;
    }
    for (i = 0; i < L.holes.length; i++) {
      h = L.holes[i];
      var d2 = Math.hypot(x - h.x, y - h.y) - h.r;
      if (d2 < m) m = d2;
    }
    return m;
  }

  /** 点到线段距离 */
  function ptSegDist(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay;
    var len2 = dx * dx + dy * dy;
    var t = len2 > 0 ? clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1) : 0;
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  }

  /**
   * 编号排布：为每个编号洞挑一个「不压墙、不压洞、不压引导线、不和别的编号打架」的位置。
   * 候选点 = 两圈距离 × 8 个方向（外加生成器建议的 labelPos），按代价打分取最优。
   */
  function layoutLabels(L) {
    var list = [], i;
    for (i = 0; i < L.holes.length; i++) if (L.holes[i].n > 0) list.push(L.holes[i]);
    list.sort(function (a, b) { return a.n - b.n; });
    if (!list.length) return [];

    // 每个编号的候选位置：生成器建议位 + 3 圈 × 12 方向
    var slots = [];
    for (i = 0; i < list.length; i++) {
      var h = list[i];
      var size = Math.max(2.4, h.r * 1.18);
      var cands = [];
      if (h.labelPos && isFinite(h.labelPos.x)) cands.push({ x: h.labelPos.x, y: h.labelPos.y, bias: -2.5 });
      for (var ring = 0; ring < 4; ring++) {
        var dist = h.r + size * (.78 + ring * .42);
        for (var a = 0; a < 12; a++) {
          // 角度从正上方开始向两侧展开，偏好上方与内圈
          var idx = (a % 2 ? -1 : 1) * Math.ceil(a / 2);
          var ang = -Math.PI / 2 + idx * (Math.PI / 6);
          cands.push({
            x: h.x + Math.cos(ang) * dist,
            y: h.y + Math.sin(ang) * dist,
            bias: a * .3 + ring * 1.5
          });
        }
      }
      // 预先算好与地形相关的固定代价（与其它编号无关的部分）
      for (var c = 0; c < cands.length; c++) {
        var q = cands[c], cost = q.bias;
        if (q.x < size * .6 || q.y < size * .6 || q.x > L.width - size * .6 || q.y > L.height - size * .6) cost += 60;
        if (pointBlocked(q.x, q.y, L, size * .5)) cost += 40;
        var cl = clearanceAt(q.x, q.y, L);
        if (cl < size * .8) cost += (size * .8 - cl) * 16;
        if (L.guide && L.guide.length > 1) {
          for (var gi = 1; gi < L.guide.length; gi++) {
            if (ptSegDist(q.x, q.y, L.guide[gi - 1].x, L.guide[gi - 1].y, L.guide[gi].x, L.guide[gi].y) < size * .62) { cost += 9; break; }
          }
        }
        q.base = cost;
      }
      slots.push({ n: h.n, size: size, cands: cands, sel: 0 });
    }

    // 与其它编号的冲突代价
    function conflict(q, size, self) {
      var pen = 0, lim;
      for (var j = 0; j < slots.length; j++) {
        if (j === self) continue;
        var o = slots[j], oc = o.cands[o.sel];
        lim = (size + o.size) * .82;
        var d = Math.hypot(q.x - oc.x, q.y - oc.y);
        if (d < lim) pen += 52 * (1 - d / lim);
      }
      return pen;
    }

    // 贪心初始化 + 3 轮松弛：每轮让每个编号在已知邻居下重选最优位置
    for (var pass = 0; pass < 4; pass++) {
      var changed = 0;
      for (i = 0; i < slots.length; i++) {
        var sl = slots[i], bi = sl.sel, bc = Infinity;
        for (var ci = 0; ci < sl.cands.length; ci++) {
          var cq = sl.cands[ci];
          var total = cq.base + conflict(cq, sl.size, i);
          if (total < bc) { bc = total; bi = ci; }
        }
        if (bi !== sl.sel) { sl.sel = bi; changed++; }
        sl.cost = bc;
      }
      if (!changed) break;
    }

    var out = [];
    for (i = 0; i < slots.length; i++) {
      var s2 = slots[i], q2 = s2.cands[s2.sel];
      out.push({ n: s2.n, x: q2.x, y: q2.y, size: s2.size, plate: (s2.cost || 0) >= 30 });
    }
    return out;
  }

  function drawHoleNumber(g, lb) {
    var size = lb.size, bx = lb.x, by = lb.y, clear = !lb.plate;
    g.save();
    g.font = '700 ' + size.toFixed(2) + 'px "PingFang SC", "Helvetica Neue", Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    // 实在没有空位时给一块浅色底衬，保证数字始终可读
    if (!clear) {
      g.beginPath();
      g.arc(bx, by, size * .6, 0, TAU);
      g.fillStyle = 'rgba(238,212,170,.82)';
      g.fill();
    }
    g.lineWidth = size * .32;
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(255,248,228,.9)';
    g.strokeText(String(lb.n), bx, by);
    g.fillStyle = '#41240d';
    g.fillText(String(lb.n), bx, by);
    g.restore();
  }

  function drawWall(g, w) {
    var r = Math.min(0.5, Math.min(w.w, w.h) * .3);
    // 落在板面上的投影（光来自左上）
    g.fillStyle = 'rgba(26,11,2,.42)';
    rrect(g, w.x + WALL_H * .62, w.y + WALL_H * .9, w.w, w.h, r); g.fill();
    g.fillStyle = 'rgba(26,11,2,.2)';
    rrect(g, w.x + WALL_H * 1.05, w.y + WALL_H * 1.45, w.w, w.h, r); g.fill();
    // 挤出的侧面（暗）
    g.fillStyle = '#4b2c12';
    rrect(g, w.x + WALL_H * .3, w.y + WALL_H * .44, w.w, w.h, r); g.fill();
    // 顶面（亮木）——按位置做确定性色差，避免每面墙长得一样
    var TOPS = [
      ['#e6b87c', '#c28f53', '#96632f'],
      ['#dfae72', '#b9864b', '#8d5b2a'],
      ['#e9bd83', '#c79458', '#9b6833'],
      ['#dbaa6e', '#b58248', '#895727']
    ];
    var tp = TOPS[(Math.round(w.x * 3 + w.y * 7) % TOPS.length + TOPS.length) % TOPS.length];
    var gd = g.createLinearGradient(w.x, w.y, w.x + Math.min(w.w, 16), w.y + Math.min(w.h, 16));
    gd.addColorStop(0, tp[0]);
    gd.addColorStop(.45, tp[1]);
    gd.addColorStop(1, tp[2]);
    g.fillStyle = gd;
    rrect(g, w.x, w.y, w.w, w.h, r); g.fill();
    // 顶面木纹（短横纹）
    g.save();
    rrect(g, w.x, w.y, w.w, w.h, r); g.clip();
    g.strokeStyle = 'rgba(88,50,18,.16)';
    g.lineWidth = .16;
    for (var t = 1; t < Math.max(w.w, w.h) / 2.6; t++) {
      g.beginPath();
      if (w.w >= w.h) { g.moveTo(w.x + t * 2.6, w.y); g.lineTo(w.x + t * 2.6 - .6, w.y + w.h); }
      else { g.moveTo(w.x, w.y + t * 2.6); g.lineTo(w.x + w.w, w.y + t * 2.6 - .6); }
      g.stroke();
    }
    g.restore();
    // 顶面受光边 + 暗边轮廓，拉开与底板的层次
    g.strokeStyle = 'rgba(255,238,205,.6)';
    g.lineWidth = .26;
    g.beginPath();
    g.moveTo(w.x + r, w.y + .14);
    g.lineTo(w.x + w.w - r, w.y + .14);
    g.moveTo(w.x + .14, w.y + r);
    g.lineTo(w.x + .14, w.y + w.h - r);
    g.stroke();
    g.strokeStyle = 'rgba(48,25,6,.55)';
    g.lineWidth = .16;
    rrect(g, w.x, w.y, w.w, w.h, r); g.stroke();
  }

  function drawStartMark(g, s) {
    g.save();
    g.strokeStyle = 'rgba(70,44,20,.5)';
    g.lineWidth = .35;
    g.setLineDash([1.1, 1.1]);
    g.beginPath(); g.arc(s.x, s.y, 3.4, 0, TAU); g.stroke();
    g.setLineDash([]);
    g.fillStyle = 'rgba(70,44,20,.62)';
    g.font = '600 2.4px "PingFang SC", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('起', s.x, s.y);
    g.restore();
  }

  function drawGoal(g, go) {
    var r = go.r;
    g.save();
    // 金色光环
    var ring = g.createRadialGradient(go.x, go.y, r * .8, go.x, go.y, r * 1.9);
    ring.addColorStop(0, 'rgba(255,206,102,.3)');
    ring.addColorStop(1, 'rgba(255,206,102,0)');
    g.fillStyle = ring;
    g.beginPath(); g.arc(go.x, go.y, r * 2.1, 0, TAU); g.fill();

    drawHole(g, { x: go.x, y: go.y, r: r, n: 0 });

    // 黄铜圈
    g.beginPath(); g.arc(go.x, go.y, r * 1.08, 0, TAU);
    g.strokeStyle = '#d9a441'; g.lineWidth = .55; g.stroke();
    g.beginPath(); g.arc(go.x, go.y, r * 1.08, -0.9 * Math.PI, -0.15 * Math.PI);
    g.strokeStyle = 'rgba(255,238,190,.9)'; g.lineWidth = .3; g.stroke();

    // 放射线
    g.strokeStyle = 'rgba(214,164,74,.4)';
    g.lineWidth = .26;
    for (var i = 0; i < 16; i++) {
      var a2 = i / 16 * TAU + .1;
      g.beginPath();
      g.moveTo(go.x + Math.cos(a2) * r * 1.28, go.y + Math.sin(a2) * r * 1.28);
      g.lineTo(go.x + Math.cos(a2) * r * (i % 2 ? 1.55 : 1.85), go.y + Math.sin(a2) * r * (i % 2 ? 1.55 : 1.85));
      g.stroke();
    }
    // 星标 + 文字
    g.fillStyle = 'rgba(226,178,88,.85)';
    star(g, go.x, go.y - r * 2.6, 5, r * .8, r * .36);
    g.fill();
    g.font = '700 ' + (r * .95).toFixed(2) + 'px "PingFang SC", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = r * .3; g.lineJoin = 'round';
    g.strokeStyle = 'rgba(52,28,8,.75)';
    g.strokeText('终点', go.x, go.y + r * 2.1);
    g.fillStyle = '#ffd66b';
    g.fillText('终点', go.x, go.y + r * 2.1);
    g.restore();
  }

  function drawCheckpoint(g, c) {
    var r = (c.r || 3) * .62;
    g.save();
    // 雕刻在板面上的黄铜小标记（菱形 + 细环），像玩具上的印记而不是辅助线
    g.strokeStyle = 'rgba(96,62,26,.42)';
    g.lineWidth = .26;
    g.beginPath(); g.arc(c.x, c.y, r, 0, TAU); g.stroke();
    g.beginPath();
    g.moveTo(c.x, c.y - r * .58);
    g.lineTo(c.x + r * .5, c.y);
    g.lineTo(c.x, c.y + r * .58);
    g.lineTo(c.x - r * .5, c.y);
    g.closePath();
    g.fillStyle = 'rgba(196,150,74,.5)';
    g.fill();
    g.strokeStyle = 'rgba(255,240,200,.32)';
    g.lineWidth = .18;
    g.stroke();
    g.restore();
  }

  function star(g, cx, cy, spikes, outer, inner) {
    var rot = -Math.PI / 2, step = Math.PI / spikes;
    g.beginPath();
    g.moveTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    for (var i = 0; i < spikes; i++) {
      rot += step; g.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
      rot += step; g.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    }
    g.closePath();
  }

  function drawScrew(g, x, y) {
    var r = 1.5;
    g.save();
    g.beginPath(); g.arc(x, y, r, 0, TAU);
    var gd = g.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r);
    gd.addColorStop(0, '#f6e2ae');
    gd.addColorStop(.6, '#c39a48');
    gd.addColorStop(1, '#6f4f1c');
    g.fillStyle = gd; g.fill();
    g.strokeStyle = 'rgba(30,18,6,.6)'; g.lineWidth = .18; g.stroke();
    g.strokeStyle = 'rgba(40,24,8,.75)'; g.lineWidth = .32;
    g.beginPath(); g.moveTo(x - r * .55, y - r * .2); g.lineTo(x + r * .55, y + r * .2); g.stroke();
    g.restore();
  }

  /* ==================================================================
   * 动态层渲染
   * ================================================================== */
  function draw(dt) {
    var cv = el.canvas, g = cv.getContext('2d');
    var px = cv.width;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, px, px);

    // 抖动
    var sx = 0, sy = 0;
    if (S.shake > 0.01) {
      sx = (Math.random() - .5) * S.shake * 2.2;
      sy = (Math.random() - .5) * S.shake * 2.2;
    }
    if (S.staticCv) g.drawImage(S.staticCv, sx * S.view.k * .1, sy * S.view.k * .1);

    setWorldTransform(g, sx * .1, sy * .1);

    var L = S.level, w = S.world, b = w.ball;

    // 提示路线
    if (S.hintPath && performance.now() < S.hintUntil) drawHint(g, S.hintPath);

    // 终点脉冲
    var pulse = 0.5 + 0.5 * Math.sin(performance.now() / 420);
    g.save();
    g.beginPath(); g.arc(L.goal.x, L.goal.y, L.goal.r * (1.25 + pulse * .3), 0, TAU);
    g.strokeStyle = 'rgba(255,214,120,' + (.15 + pulse * .3) + ')';
    g.lineWidth = .5; g.stroke();
    g.restore();

    // 残影
    if (S.cfg.trail && S.trail.length > 1) {
      g.save();
      for (var i = 0; i < S.trail.length; i++) {
        var t = S.trail[i], a = (i / S.trail.length);
        g.beginPath();
        g.arc(t.x, t.y, S.ballR * (.35 + .45 * a), 0, TAU);
        g.fillStyle = 'rgba(210,220,230,' + (a * a * .22) + ')';
        g.fill();
      }
      g.restore();
    }

    // 尘土
    drawPuffs(g, dt);

    var falling = (w.state === 'falling');
    var fp = falling && w.fallInfo ? w.fallInfo.progress : 0;

    if (w.state !== 'sunk' && w.state !== 'won') {
      // 球影
      var shScale = 1 - fp * .8;
      g.save();
      var offx = S.tilt.x * 26, offy = S.tilt.y * 26 + S.ballR * .28;
      var sg = g.createRadialGradient(b.x + offx, b.y + offy, S.ballR * .2, b.x + offx, b.y + offy, S.ballR * 1.6);
      sg.addColorStop(0, 'rgba(28,14,4,' + (.32 * shScale) + ')');
      sg.addColorStop(1, 'rgba(28,14,4,0)');
      g.fillStyle = sg;
      g.beginPath(); g.arc(b.x + offx, b.y + offy, S.ballR * 1.6, 0, TAU); g.fill();
      // 紧贴球底的接触阴影：让球看起来落在板面上而不是飘着
      var cg = g.createRadialGradient(b.x, b.y + S.ballR * .12, S.ballR * .1, b.x, b.y + S.ballR * .12, S.ballR * .96);
      cg.addColorStop(0, 'rgba(20,10,2,' + (.5 * shScale) + ')');
      cg.addColorStop(.72, 'rgba(20,10,2,' + (.2 * shScale) + ')');
      cg.addColorStop(1, 'rgba(20,10,2,0)');
      g.fillStyle = cg;
      g.beginPath(); g.ellipse(b.x, b.y + S.ballR * .12, S.ballR * .96, S.ballR * .82, 0, 0, TAU); g.fill();
      g.restore();

      // 球（掉落时裁剪进洞里）
      g.save();
      if (falling && fp > .12) {
        var ho = w.fallInfo.hole;
        g.beginPath(); g.arc(ho.x, ho.y, ho.r * .99, 0, TAU); g.clip();
      }
      drawBall(g, b, 1 - fp * .45, fp);
      g.restore();
    }

    // 火花（通关）
    drawSparks(g, dt);

    // 倾斜受光提示
    var tl = Math.hypot(S.tilt.x, S.tilt.y);
    if (tl > 0.004) {
      var ang = Math.atan2(S.tilt.y, S.tilt.x);
      var lg = g.createLinearGradient(
        L.width / 2 - Math.cos(ang) * L.width * .7, L.height / 2 - Math.sin(ang) * L.height * .7,
        L.width / 2 + Math.cos(ang) * L.width * .7, L.height / 2 + Math.sin(ang) * L.height * .7);
      var amt = Math.min(.10, tl * .78);
      lg.addColorStop(0, 'rgba(255,240,210,' + (amt * .55) + ')');
      lg.addColorStop(.5, 'rgba(0,0,0,0)');
      lg.addColorStop(1, 'rgba(20,8,0,' + amt + ')');
      g.fillStyle = lg;
      g.fillRect(0, 0, L.width, L.height);
    }
  }

  function drawBall(g, b, scale, dark) {
    var r = S.ballR * Math.max(0.05, scale);
    var lx = b.x - r * .34, ly = b.y - r * .4;
    var gd = g.createRadialGradient(lx, ly, r * .06, b.x, b.y, r * 1.06);
    gd.addColorStop(0, '#ffffff');
    gd.addColorStop(.16, '#eef3f7');
    gd.addColorStop(.42, '#b9c3cc');
    gd.addColorStop(.72, '#78838d');
    gd.addColorStop(.92, '#414a52');
    gd.addColorStop(1, '#22282d');
    g.beginPath(); g.arc(b.x, b.y, r, 0, TAU);
    g.fillStyle = gd; g.fill();

    // 木板暖色反光
    g.save();
    g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.clip();
    var wg = g.createRadialGradient(b.x + r * .35, b.y + r * .55, r * .05, b.x + r * .3, b.y + r * .5, r * .8);
    wg.addColorStop(0, 'rgba(226,170,105,.5)');
    wg.addColorStop(1, 'rgba(226,170,105,0)');
    g.fillStyle = wg;
    g.fillRect(b.x - r, b.y - r, r * 2, r * 2);

    // 滚动标记（表现自转）
    var dir = (b.speed > 3) ? Math.atan2(b.vy, b.vx) : 0;
    var ca = Math.cos(dir), sa = Math.sin(dir);
    for (var k = 0; k < 3; k++) {
      var ph = (b.rot || 0) + k * 2.094;
      var along = Math.sin(ph) * r * .58;
      var vis = Math.cos(ph);
      if (vis <= 0.05) continue;
      var across = (k - 1) * r * .34;
      var mx = b.x + ca * along - sa * across;
      var my = b.y + sa * along + ca * across;
      g.beginPath();
      g.ellipse(mx, my, r * .13 * vis, r * .09 * vis, dir, 0, TAU);
      g.fillStyle = 'rgba(90,100,110,' + (.32 * vis) + ')';
      g.fill();
    }
    g.restore();

    // 下缘暖色反光（木板反射）
    g.beginPath();
    g.arc(b.x, b.y, r * .9, 0.14 * Math.PI, 0.74 * Math.PI);
    g.strokeStyle = 'rgba(255,222,172,.45)';
    g.lineWidth = r * .13;
    g.stroke();
    // 轮廓（与底板/洞口拉开层次）
    g.beginPath(); g.arc(b.x, b.y, r * .99, 0, TAU);
    g.strokeStyle = 'rgba(18,12,6,.5)';
    g.lineWidth = r * .09;
    g.stroke();
    // 外侧亮环（在浅色木板与深色洞口上都能拉开边界）
    g.beginPath(); g.arc(b.x, b.y, r * 1.1, 0, TAU);
    g.strokeStyle = 'rgba(255,255,255,.18)';
    g.lineWidth = r * .16;
    g.stroke();
    // 主高光
    g.beginPath();
    g.ellipse(lx, ly, r * .29, r * .21, -0.7, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.fill();
    // 次高光
    g.beginPath();
    g.ellipse(b.x + r * .34, b.y + r * .34, r * .12, r * .08, -0.7, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,.5)';
    g.fill();

    // 掉落变暗
    if (dark > 0) {
      g.beginPath(); g.arc(b.x, b.y, r, 0, TAU);
      g.fillStyle = 'rgba(6,4,2,' + (dark * .72) + ')';
      g.fill();
    }
  }

  function drawHint(g, pts) {
    var t = performance.now() / 90;
    g.save();
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,214,120,.28)';
    g.lineWidth = 3.2;
    path(g, pts); g.stroke();
    g.setLineDash([2.4, 3]);
    g.lineDashOffset = -t % 100;
    g.strokeStyle = 'rgba(255,236,180,.95)';
    g.lineWidth = 1;
    path(g, pts); g.stroke();
    g.restore();
  }

  function drawPuffs(g, dt) {
    for (var i = S.puffs.length - 1; i >= 0; i--) {
      var p = S.puffs[i];
      p.life -= dt;
      if (p.life <= 0) { S.puffs.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= .93; p.vy *= .93;
      var a = p.life / p.max;
      g.beginPath();
      g.arc(p.x, p.y, p.r * (1.6 - a * .6), 0, TAU);
      g.fillStyle = 'rgba(224,196,150,' + (a * .38) + ')';
      g.fill();
    }
  }

  function drawSparks(g, dt) {
    for (var i = S.sparks.length - 1; i >= 0; i--) {
      var p = S.sparks[i];
      p.life -= dt;
      if (p.life <= 0) { S.sparks.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 40 * dt;
      var a = p.life / p.max;
      g.beginPath();
      g.arc(p.x, p.y, .5 + a * .7, 0, TAU);
      g.fillStyle = 'rgba(255,' + (190 + ((1 - a) * 50) | 0) + ',110,' + a + ')';
      g.fill();
    }
  }

  function spawnPuff(x, y, nx, ny, impact) {
    var n = clamp(Math.round(impact / 40), 1, 5);
    for (var i = 0; i < n; i++) {
      var sp = 6 + Math.random() * impact * .12;
      var ang = Math.atan2(ny, nx) + (Math.random() - .5) * 1.5;
      S.puffs.push({
        x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        r: .35 + Math.random() * .5, life: .32 + Math.random() * .2, max: .5
      });
    }
  }

  function spawnSparks(x, y) {
    for (var i = 0; i < 40; i++) {
      var ang = Math.random() * TAU, sp = 12 + Math.random() * 46;
      S.sparks.push({
        x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 14,
        life: .5 + Math.random() * .8, max: 1.3
      });
    }
  }

  /* ==================================================================
   * 输入
   * ================================================================== */
  function updateInput(dt) {
    var d = DIFF[S.cfg.diff] || DIFF.normal;
    var max = d.tiltMax * S.cfg.sens;
    var tx = 0, ty = 0, mode = S.cfg.ctrl;

    if (mode === 'pointer' && S.ptr.inside) {
      var dz = 0.05;
      var nx = S.ptr.nx, ny = S.ptr.ny;
      nx = Math.abs(nx) < dz ? 0 : (nx - Math.sign(nx) * dz) / (1 - dz);
      ny = Math.abs(ny) < dz ? 0 : (ny - Math.sign(ny) * dz) / (1 - dz);
      tx = clamp(nx, -1, 1) * max;
      ty = clamp(ny, -1, 1) * max;
    } else if (mode === 'knob') {
      tx = S.knob.x * max;
      ty = S.knob.y * max;
    } else if (mode === 'tilt' && S.gyro.on && S.gyro.base) {
      var RANGE = 22;    // 度
      tx = clamp((S.gyro.gamma - S.gyro.base.gamma) / RANGE, -1, 1) * max;
      ty = clamp((S.gyro.beta - S.gyro.base.beta) / RANGE, -1, 1) * max;
    }

    // 键盘始终可叠加
    var kx = (S.keys.right ? 1 : 0) - (S.keys.left ? 1 : 0);
    var ky = (S.keys.down ? 1 : 0) - (S.keys.up ? 1 : 0);
    if (kx || ky) {
      tx = clamp(tx + kx * max, -max * 1.25, max * 1.25);
      ty = clamp(ty + ky * max, -max * 1.25, max * 1.25);
    }

    S.target.x = tx; S.target.y = ty;
    var rate = (mode === 'knob') ? 20 : 12;
    S.tilt.x = approach(S.tilt.x, tx, rate, dt);
    S.tilt.y = approach(S.tilt.y, ty, rate, dt);
    if (S.world.setTilt) S.world.setTilt(S.tilt.x, S.tilt.y);

    if (!S.timing && (Math.abs(S.tilt.x) > 0.004 || Math.abs(S.tilt.y) > 0.004)) S.timing = true;
  }

  function applyVisualTilt() {
    var deg = 64;
    var rx = (-S.tilt.y * deg).toFixed(2), ry = (S.tilt.x * deg).toFixed(2);
    el.board3d.style.transform = S.cfg.tilt3d
      ? 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)'
      : 'none';
    var kd = 145;
    el.knobX.querySelector('.knob-face').style.transform = 'rotate(' + (S.tilt.x / (DIFF[S.cfg.diff].tiltMax * S.cfg.sens || 1) * kd).toFixed(1) + 'deg)';
    el.knobY.querySelector('.knob-face').style.transform = 'rotate(' + (S.tilt.y / (DIFF[S.cfg.diff].tiltMax * S.cfg.sens || 1) * kd).toFixed(1) + 'deg)';
    var mx = clamp(S.tilt.x / 0.16, -1, 1) * 100, my = clamp(S.tilt.y / 0.16, -1, 1) * 100;
    el.bubble.style.transform = 'translate(' + mx.toFixed(1) + '%,' + my.toFixed(1) + '%)';
  }

  function bindInput() {
    // --- 指针（悬停即倾斜）---
    var stage = el.stage;
    function ptr(e) {
      var r = el.board3d.getBoundingClientRect();
      S.ptr.nx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      S.ptr.ny = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      S.ptr.inside = true;
      unlockAudio();
    }
    stage.addEventListener('pointermove', ptr);
    stage.addEventListener('pointerdown', function (e) {
      ptr(e);
      // 只在触摸拖动画布时捕获指针；不要在 stage 上捕获，否则覆盖层按钮收不到 click
      if (e.pointerType === 'touch' && e.target === el.canvas) {
        try { el.canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      }
    });
    stage.addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') S.ptr.inside = false; });
    stage.addEventListener('pointerleave', function () { S.ptr.inside = false; });

    // --- 旋钮拖动 ---
    [el.knobX, el.knobY].forEach(function (kn) {
      var axis = kn.dataset.axis;
      var dragging = false, startVal = 0, startPos = 0;
      kn.addEventListener('pointerdown', function (e) {
        dragging = true; startVal = S.knob[axis];
        startPos = (axis === 'x') ? e.clientX : e.clientY;
        kn.setPointerCapture(e.pointerId);
        if (S.cfg.ctrl !== 'knob') setCtrl('knob');
        unlockAudio();
        e.preventDefault();
      });
      kn.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var now = (axis === 'x') ? e.clientX : e.clientY;
        S.knob[axis] = clamp(startVal + (now - startPos) / 110, -1, 1);
      });
      function end() { dragging = false; }
      kn.addEventListener('pointerup', end);
      kn.addEventListener('pointercancel', end);
      kn.addEventListener('dblclick', function () { S.knob[axis] = 0; });
    });

    // --- 键盘 ---
    var KEYMAP = {
      ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
      a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down'
    };
    window.addEventListener('keydown', function (e) {
      var k = KEYMAP[e.key];
      if (k) { S.keys[k] = true; e.preventDefault(); unlockAudio(); return; }
      switch (e.key) {
        case 'r': case 'R': doRestart(); break;
        case 'p': case 'P': case 'Escape': togglePause(); break;
        case 'h': case 'H': doHint(); break;
        case 'm': case 'M': toggleSound(); break;
        case ' ': if (!S.running || S.paused) { hideOverlay(); resumeOrStart(); } e.preventDefault(); break;
        default:
          if (/^[1-9]$/.test(e.key)) {
            var i = parseInt(e.key, 10) - 1;
            if (i < S.levels.length) { loadLevel(i); hideOverlay(); }
          }
      }
    });
    window.addEventListener('keyup', function (e) {
      var k = KEYMAP[e.key];
      if (k) S.keys[k] = false;
    });

    window.addEventListener('blur', function () { S.keys = {}; });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && S.running && !S.paused) togglePause();
    });

    window.addEventListener('resize', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(el.stage);
  }

  /* --- 陀螺仪 --- */
  function enableGyro() {
    function attach() {
      window.addEventListener('deviceorientation', function (e) {
        S.gyro.gamma = e.gamma || 0;
        S.gyro.beta = e.beta || 0;
        if (!S.gyro.base) S.gyro.base = { gamma: S.gyro.gamma, beta: S.gyro.beta };
        S.gyro.on = true;
      });
      toast('已开启陀螺仪：请把设备当作迷宫板端平');
    }
    var DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      DOE.requestPermission().then(function (st) {
        if (st === 'granted') attach();
        else { toast('陀螺仪权限被拒绝，已切回鼠标'); setCtrl('pointer'); }
      }).catch(function () { toast('陀螺仪不可用，已切回鼠标'); setCtrl('pointer'); });
    } else if (DOE) {
      attach();
    } else {
      toast('此设备不支持陀螺仪，已切回鼠标');
      setCtrl('pointer');
    }
  }

  function unlockAudio() {
    if (Sfx && Sfx.unlock && !Sfx.__unlocked) {
      try { Sfx.unlock(); Sfx.__unlocked = true; if (Sfx.setVolume) Sfx.setVolume(S.cfg.vol); if (Sfx.setMuted) Sfx.setMuted(S.cfg.muted); } catch (e) { }
    }
  }

  /* ==================================================================
   * 事件处理 / 游戏流程
   * ================================================================== */
  function handleEvents(evts) {
    if (!evts || !evts.length) return;
    for (var i = 0; i < evts.length; i++) {
      var ev = evts[i];
      switch (ev.type) {
        case 'wallHit':
          S.shake = Math.min(1.6, S.shake + ev.impact / 260);
          spawnPuff(ev.x - (ev.nx || 0) * S.ballR, ev.y - (ev.ny || 0) * S.ballR, -(ev.nx || 0), -(ev.ny || 0), ev.impact);
          sfx('knock', ev.impact);
          break;
        case 'holeEnter':
          if (ev.isGoal) { sfx('stopRolling'); }
          else { sfx('holeFall'); S.shake = 1.2; }
          break;
        case 'checkpoint':
          S.respawn = { x: ev.cp.x, y: ev.cp.y };
          toast('存档点已记录');
          sfx('tick');
          break;
        case 'sunk':
          onFall(ev.hole);
          break;
        case 'won':
          onWin();
          break;
      }
    }
  }

  function trackProgress() {
    var b = S.world.ball, hs = S.level.holes, i;
    if (S.numberedTotal > 0) {
      for (i = 0; i < hs.length; i++) {
        var h = hs[i];
        if (h.n > 0 && !S.passed[h.n]) {
          if (Math.hypot(b.x - h.x, b.y - h.y) < h.r + S.ballR + 2.6) {
            S.passed[h.n] = 1;
            if (h.n > S.maxN) { S.maxN = h.n; sfx('tick'); }
          }
        }
      }
    }
  }

  function progressText() {
    if (S.numberedTotal > 0) return S.maxN + '/' + S.numberedTotal;
    var b = S.world.ball, g = S.level.goal;
    var pct = clamp(1 - Math.hypot(b.x - g.x, b.y - g.y) / S.startDist, 0, 1);
    return Math.round(pct * 100) + '%';
  }

  function onFall(hole) {
    S.running = false;
    S.falls++;
    sfx('stopRolling');
    sfx('lose');
    var msg = hole && hole.n > 0
      ? '钢珠掉进了 <b>' + hole.n + ' 号洞</b>。'
      : '钢珠掉进了洞里。';
    var canResume = !S.cfg.strict && S.respawn;
    showOverlay({
      title: '掉洞了！',
      text: msg + (canResume ? '可以从最近的存档点继续。' : '整局重来吧——真正的迷宫球就是这么残酷。'),
      stats: [
        { label: '用时', value: fmtTime(S.elapsed + S.penalty) },
        { label: '掉洞次数', value: S.falls },
        { label: '最远', value: progressText() }
      ],
      actions: (canResume ? [{ label: '回到存档点', cls: '', fn: function () { hideOverlay(); resetRound(false); } }] : [])
        .concat([
          { label: canResume ? '从头再来' : '再试一次', cls: canResume ? 'sec' : '', fn: function () { hideOverlay(); resetRound(true); } },
          { label: '换关卡', cls: 'sec', fn: function () { hideOverlay(); openDrawer(); } }
        ]),
      tip: '提示：小幅度、连续地调整倾角，比猛推更容易控制。'
    });
  }

  function onWin() {
    S.running = false;
    var total = S.elapsed + S.penalty;
    sfx('stopRolling');
    sfx('win');
    spawnSparks(S.level.goal.x, S.level.goal.y);
    var id = S.level.id, rec = S.best[id];
    var isNew = !rec || total < rec.ms;
    if (isNew) {
      S.best[id] = { ms: total, falls: S.falls, date: Date.now() };
      saveStore();
    }
    var hasNext = S.levelIndex < S.levels.length - 1;
    showOverlay({
      title: '通关！',
      text: isNew ? '新纪录！你把钢珠送到了终点。' : '钢珠安全抵达终点。',
      stats: [
        { label: '用时', value: fmtTime(total), hl: isNew },
        { label: '掉洞', value: S.falls },
        { label: '最佳', value: fmtTime(S.best[id] ? S.best[id].ms : total) }
      ],
      actions: (hasNext ? [{ label: '下一关 →', fn: function () { hideOverlay(); loadLevel(S.levelIndex + 1); } }] : [])
        .concat([
          { label: '再来一次', cls: hasNext ? 'sec' : '', fn: function () { hideOverlay(); loadLevel(S.levelIndex); } },
          { label: '选关卡', cls: 'sec', fn: function () { hideOverlay(); openDrawer(); } }
        ]),
      tip: S.penalty > 0 ? ('含提示惩罚 +' + (S.penalty / 1000).toFixed(0) + 's') : ''
    });
    renderLevelList();
    updateHudStatic();   // 刷新顶栏「最佳」，否则新纪录不会立刻显示
  }

  function doRestart() {
    hideOverlay();
    resetRound(true);
    S.falls = 0;
    sfx('ui');
  }

  function togglePause() {
    if (!S.running && !S.paused) return;
    S.paused = !S.paused;
    el.btnPause.classList.toggle('off', S.paused);
    if (S.paused) {
      sfx('stopRolling');
      showOverlay({
        title: '已暂停',
        text: '深呼吸，钢珠不会跑。',
        stats: [
          { label: '用时', value: fmtTime(S.elapsed + S.penalty) },
          { label: '进度', value: progressText() }
        ],
        actions: [
          { label: '继续 (P)', fn: function () { hideOverlay(); S.paused = false; el.btnPause.classList.remove('off'); } },
          { label: '重开 (R)', cls: 'sec', fn: doRestart },
          { label: '换关卡', cls: 'sec', fn: function () { hideOverlay(); openDrawer(); } }
        ]
      });
    } else hideOverlay();
  }

  function resumeOrStart() {
    if (!S.running) resetRound(true);
    S.paused = false;
  }

  function doHint() {
    if (S.hintLeft <= 0) { toast('提示次数已用完'); return; }
    var key = S.level.id + '@' + S.ballR;
    var p = S.hintCache[key];
    if (!p) {
      try {
        if (window.MazeLib && MazeLib.solve) p = MazeLib.solve(S.level, S.ballR);
      } catch (e) { p = null; }
      if (!p && S.level.guide && S.level.guide.length > 1) p = S.level.guide;
      S.hintCache[key] = p || null;
    }
    if (!p || p.length < 2) { toast('这一关没有可用的路线提示'); return; }
    S.hintLeft--;
    S.penalty += 5000;
    S.hintPath = p;
    S.hintUntil = performance.now() + 2500;
    el.hintCount.textContent = S.hintLeft;
    if (S.hintLeft === 0) el.btnHint.disabled = true;
    toast('显示路线 2.5 秒（+5 秒）');
    sfx('ui');
  }

  function toggleSound() {
    S.cfg.muted = !S.cfg.muted;
    el.btnSound.classList.toggle('off', S.cfg.muted);
    el.btnSound.querySelector('span').textContent = S.cfg.muted ? '🔇' : '🔊';
    if (Sfx && Sfx.setMuted) { try { Sfx.setMuted(S.cfg.muted); } catch (e) { } }
    if (S.cfg.muted && Sfx && Sfx.stopRolling) { try { Sfx.stopRolling(); } catch (e) { } }
    saveStore();
  }

  /* ==================================================================
   * UI
   * ================================================================== */
  function showOverlay(o) {
    el.ovTitle.textContent = o.title || '';
    el.ovText.innerHTML = o.text || '';
    el.ovStats.innerHTML = '';
    (o.stats || []).forEach(function (s) {
      var d = document.createElement('div');
      if (s.hl) d.className = 'hl';
      d.innerHTML = '<label>' + s.label + '</label><b>' + s.value + '</b>';
      el.ovStats.appendChild(d);
    });
    el.ovActions.innerHTML = '';
    (o.actions || []).forEach(function (a) {
      var b = document.createElement('button');
      b.textContent = a.label;
      if (a.cls) b.className = a.cls;
      b.addEventListener('click', function () { unlockAudio(); sfx('ui'); a.fn(); });
      el.ovActions.appendChild(b);
    });
    el.ovTip.textContent = o.tip || '';
    el.overlay.hidden = false;
  }

  function hideOverlay() { el.overlay.hidden = true; }

  var toastTimer = null;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.hidden = true; }, 2200);
  }

  function renderLevelList() {
    el.levelList.innerHTML = '';
    S.levels.forEach(function (def, i) {
      var b = document.createElement('button');
      b.className = 'level-card' + (i === S.levelIndex ? ' on' : '');
      var rec = S.best[def.id];
      var stars = '★'.repeat(def.difficulty || 1) + '☆'.repeat(Math.max(0, 5 - (def.difficulty || 1)));
      b.innerHTML =
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span><span class="nm">' + def.name + '</span><br><span class="ds">' + (def.desc || '') + '</span></span>' +
        '<span class="stars">' + stars + (rec ? '<br><span class="rec">' + fmtTime(rec.ms) + '</span>' : '') + '</span>';
      b.addEventListener('click', function () {
        sfx('ui');
        closeDrawer();
        hideOverlay();
        loadLevel(i);
      });
      el.levelList.appendChild(b);
    });
  }

  function openDrawer() {
    el.drawer.hidden = false;
    el.scrim.hidden = false;
    if (S.running && !S.paused) { S.paused = true; el.btnPause.classList.add('off'); }
  }

  function closeDrawer() {
    el.drawer.hidden = true;
    el.scrim.hidden = true;
    if (S.paused && el.overlay.hidden) { S.paused = false; el.btnPause.classList.remove('off'); }
  }

  function updateHudStatic() {
    el.hudLevel.textContent = S.level ? S.level.name : '--';
    var rec = S.best[S.level.id];
    el.hudBest.textContent = rec ? fmtTime(rec.ms) : '--:--.-';
    el.hintCount.textContent = S.hintLeft;
    el.btnHint.disabled = S.hintLeft <= 0;
  }

  function updateHud() {
    el.hudTime.textContent = fmtTime(S.elapsed + S.penalty);
    el.hudFalls.textContent = S.falls;
    el.hudProgress.textContent = progressText();
  }

  function setDiff(name) {
    S.cfg.diff = name;
    Array.prototype.forEach.call(el.segDiff.children, function (b) {
      b.classList.toggle('on', b.dataset.diff === name);
    });
    saveStore();
    // 难度会改变物理参数：重建 world（保留成绩）
    var keepFalls = S.falls, keepHints = S.hintLeft;
    loadLevel(S.levelIndex, { keepStats: true });
    S.falls = keepFalls; S.hintLeft = keepHints;
    updateHudStatic();
    toast('难度：' + DIFF[name].label);
  }

  function setCtrl(name) {
    S.cfg.ctrl = name;
    Array.prototype.forEach.call(el.segCtrl.children, function (b) {
      b.classList.toggle('on', b.dataset.ctrl === name);
    });
    saveStore();
    if (name === 'tilt') { S.gyro.base = null; enableGyro(); }
    else if (name === 'knob') toast('旋钮模式：拖动两侧旋钮（双击归零）');
    else toast('鼠标模式：移动指针即倾斜板面');
  }

  function bindUI() {
    el.btnRestart.addEventListener('click', doRestart);
    el.btnPause.addEventListener('click', function () { unlockAudio(); togglePause(); });
    el.btnHint.addEventListener('click', doHint);
    el.btnSound.addEventListener('click', function () { unlockAudio(); toggleSound(); });
    el.btnMenu.addEventListener('click', function () { unlockAudio(); sfx('ui'); openDrawer(); });
    el.btnDrawerClose.addEventListener('click', function () { sfx('ui'); closeDrawer(); });
    el.scrim.addEventListener('click', closeDrawer);

    Array.prototype.forEach.call(el.segDiff.children, function (b) {
      b.addEventListener('click', function () { sfx('ui'); setDiff(b.dataset.diff); });
    });
    Array.prototype.forEach.call(el.segCtrl.children, function (b) {
      b.addEventListener('click', function () { unlockAudio(); sfx('ui'); setCtrl(b.dataset.ctrl); });
    });

    el.rngSens.addEventListener('input', function () {
      S.cfg.sens = parseFloat(el.rngSens.value);
      el.sensVal.textContent = S.cfg.sens.toFixed(2);
      saveStore();
    });
    el.rngVol.addEventListener('input', function () {
      S.cfg.vol = parseInt(el.rngVol.value, 10) / 100;
      el.volVal.textContent = el.rngVol.value;
      if (Sfx && Sfx.setVolume) { try { Sfx.setVolume(S.cfg.vol); } catch (e) { } }
      saveStore();
    });

    el.chk3d.addEventListener('change', function () { S.cfg.tilt3d = el.chk3d.checked; saveStore(); });
    el.chkTrail.addEventListener('change', function () { S.cfg.trail = el.chkTrail.checked; saveStore(); });
    el.chkGuide.addEventListener('change', function () {
      S.cfg.guide = el.chkGuide.checked; S.staticDirty = true; renderStatic(); saveStore();
    });
    el.chkStrict.addEventListener('change', function () { S.cfg.strict = el.chkStrict.checked; saveStore(); });
    el.btnResetBest.addEventListener('click', function () {
      S.best = {}; saveStore(); renderLevelList(); updateHudStatic(); toast('本机记录已清除');
    });
  }

  function syncUIFromCfg() {
    Array.prototype.forEach.call(el.segDiff.children, function (b) { b.classList.toggle('on', b.dataset.diff === S.cfg.diff); });
    Array.prototype.forEach.call(el.segCtrl.children, function (b) { b.classList.toggle('on', b.dataset.ctrl === S.cfg.ctrl); });
    el.rngSens.value = S.cfg.sens; el.sensVal.textContent = (+S.cfg.sens).toFixed(2);
    el.rngVol.value = Math.round(S.cfg.vol * 100); el.volVal.textContent = Math.round(S.cfg.vol * 100);
    el.chk3d.checked = S.cfg.tilt3d;
    el.chkTrail.checked = S.cfg.trail;
    el.chkGuide.checked = S.cfg.guide;
    el.chkStrict.checked = S.cfg.strict;
    el.btnSound.classList.toggle('off', S.cfg.muted);
    el.btnSound.querySelector('span').textContent = S.cfg.muted ? '🔇' : '🔊';
  }

  /* ==================================================================
   * 主循环
   * ================================================================== */
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    if (!S.level) return;

    if (S.running && !S.paused) {
      updateInput(dt);
      if (S.timing) S.elapsed += dt * 1000;
      var evts = S.world.step(dt);
      handleEvents(evts);
      trackProgress();

      var b = S.world.ball;
      if (S.cfg.trail && b.speed > 26 && S.world.state === 'rolling') {
        S.trail.push({ x: b.x, y: b.y });
        if (S.trail.length > 16) S.trail.shift();
      } else if (S.trail.length) S.trail.shift();

      if (Sfx && !S.cfg.muted && Sfx.setRolling) {
        try { Sfx.setRolling(S.world.state === 'rolling' ? b.speed : 0); } catch (e) { }
      }
    } else if (S.world && S.world.state === 'falling') {
      // 掉落动画即使暂停也放完
      handleEvents(S.world.step(dt));
    }

    S.shake = Math.max(0, S.shake - dt * 4.2);
    applyVisualTilt();
    draw(dt);
    updateHud();
  }

  /* ==================================================================
   * 启动
   * ================================================================== */
  function cacheDom() {
    el = {
      stage: $('stage'), canvas: $('board'), board3d: $('board3d'),
      overlay: $('overlay'), ovTitle: $('ov-title'), ovText: $('ov-text'),
      ovStats: $('ov-stats'), ovActions: $('ov-actions'), ovTip: $('ov-tip'),
      toast: $('toast'),
      hudTime: $('hud-time'), hudBest: $('hud-best'), hudFalls: $('hud-falls'),
      hudProgress: $('hud-progress'), hudLevel: $('hud-level'),
      btnRestart: $('btn-restart'), btnHint: $('btn-hint'), btnPause: $('btn-pause'),
      btnSound: $('btn-sound'), btnMenu: $('btn-menu'), hintCount: $('hint-count'),
      drawer: $('drawer'), scrim: $('scrim'), btnDrawerClose: $('btn-drawer-close'),
      levelList: $('level-list'), segDiff: $('seg-diff'), segCtrl: $('seg-ctrl'),
      rngSens: $('rng-sens'), sensVal: $('sens-val'), rngVol: $('rng-vol'), volVal: $('vol-val'),
      chk3d: $('chk-3d'), chkTrail: $('chk-trail'), chkGuide: $('chk-guide'), chkStrict: $('chk-strict'),
      btnResetBest: $('btn-reset-best'),
      knobX: $('knob-x'), knobY: $('knob-y'), bubble: $('bubble')
    };
  }

  function init() {
    cacheDom();
    loadStore();
    // 尊重系统「减少动态效果」偏好：默认关掉 3D 倾斜与残影
    try {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          && localStorage.getItem(LS_KEY) === null) {
        S.cfg.tilt3d = false; S.cfg.trail = false;
      }
    } catch (e) { /* 忽略 */ }
    Sfx = window.Sfx || Sfx;
    S.levels = levelDefs();
    bindUI();
    bindInput();
    syncUIFromCfg();
    loadLevel(0);
    S.running = false;

    var missing = [];
    if (!window.MazeLib) missing.push('mazes.js');
    if (!window.MazeBallPhysics) missing.push('physics.js');

    showOverlay({
      title: '迷宫球',
      text: missing.length
        ? '缺少模块：' + missing.join('、') + '（正在使用兜底实现）。'
        : '转动旋钮让钢珠沿路线前进，<b>掉进任何一个洞就要重来</b>。<br>把钢珠送进金色终点洞即通关。',
      stats: [
        { label: '关卡', value: S.level.name },
        { label: '洞数', value: S.level.holes.length },
        { label: '难度', value: DIFF[S.cfg.diff].label }
      ],
      actions: [
        { label: '开始 (空格)', fn: function () { hideOverlay(); resetRound(true); } },
        { label: '选关卡', cls: 'sec', fn: function () { hideOverlay(); openDrawer(); } }
      ],
      tip: '移动鼠标倾斜板面 · WASD 微调 · R 重开 · H 提示'
    });

    requestAnimationFrame(frame);
    // 便于调试 / 自动化测试
    window.__MAZEBALL__ = S;
    window.__MAZEBALL_API__ = {
      loadLevel: loadLevel, resetRound: resetRound, hideOverlay: hideOverlay,
      toast: toast, renderStatic: function () { S.staticDirty = true; renderStatic(); },
      setTilt: function (x, y) { S.cfg.ctrl = 'knob'; S.knob.x = x; S.knob.y = y; }
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
