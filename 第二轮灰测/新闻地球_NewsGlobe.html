<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新闻地球 NewsGlobe · 分类新闻的球面时空可视化</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(12,18,28,.82); --panel2:rgba(16,24,36,.92);
    --line:rgba(120,160,210,.18); --text:#dce6f2; --dim:#8ea3bd; --dim2:#5f7794;
    --accent:#63e0ff; --accent2:#8b7cf8; --warn:#ffb545;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Segoe UI,system-ui,sans-serif;
    font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{display:grid;grid-template-columns:288px 1fr 372px;grid-template-rows:50px 1fr 138px;height:100%;gap:8px;padding:8px}
  header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 12px;
    background:linear-gradient(90deg,rgba(20,32,52,.9),rgba(10,16,26,.72));border:1px solid var(--line);border-radius:10px}
  header h1{font-size:15px;margin:0;letter-spacing:.5px;white-space:nowrap}
  header h1 b{color:var(--accent)}
  header .sub{color:var(--dim2);font-size:11px;white-space:nowrap}
  header .stat{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:11px;color:var(--dim)}
  header .stat b{color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .btn{border:1px solid var(--line);background:rgba(30,45,68,.55);color:var(--text);border-radius:7px;
    padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap;transition:.15s}
  .btn:hover{background:rgba(60,95,140,.6);border-color:var(--accent)}
  .btn.on{background:rgba(99,224,255,.16);border-color:var(--accent);color:#c9f5ff}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-y:auto;overflow-x:hidden;padding:10px}
  aside::-webkit-scrollbar,#relList::-webkit-scrollbar{width:7px}
  aside::-webkit-scrollbar-thumb,#relList::-webkit-scrollbar-thumb{background:rgba(120,160,210,.25);border-radius:4px}
  .sec{margin-bottom:14px}
  .sec>h3{margin:0 0 7px;font-size:11px;letter-spacing:1px;color:var(--dim2);font-weight:600;text-transform:uppercase;
    display:flex;align-items:center;gap:6px}
  .sec>h3:after{content:"";flex:1;height:1px;background:var(--line)}
  .row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12px}
  .row:hover{background:rgba(90,130,180,.14)}
  .row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 7px currentColor}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ct{color:var(--dim2);font-family:ui-monospace,monospace;font-size:11px}
  .row.off{opacity:.34}
  .row .box{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);flex:0 0 auto;position:relative}
  .row.on .box:after{content:"";position:absolute;inset:2px;background:var(--accent);border-radius:2px}
  #stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#0a1220 0%,#05070d 65%)}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #tip{position:absolute;pointer-events:none;max-width:330px;padding:8px 10px;border-radius:8px;
    background:rgba(6,12,20,.95);border:1px solid var(--line);font-size:12px;line-height:1.5;
    opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #tip .h{font-weight:600;margin-bottom:3px}
  #tip .m{color:var(--dim);font-size:11px}
  #legend{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;
    background:rgba(6,12,20,.6);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--dim);z-index:4}
  #legend .lg{display:flex;align-items:center;gap:6px}
  #legend .sw{width:22px;height:0;border-top-width:2px;border-top-style:solid}
  #hud{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:4}
  #hud .pill{background:rgba(6,12,20,.66);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--dim);
    font-family:ui-monospace,monospace}
  footer{grid-column:1/4;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative}
  #tlHead{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);margin-bottom:4px}
  #tlHead .win{font-family:ui-monospace,monospace;color:var(--accent)}
  #tl{width:100%;height:78px;display:block;cursor:ew-resize}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:10.5px;
    border:1px solid currentColor;line-height:1.5}
  #detail h2{font-size:14px;line-height:1.55;margin:2px 0 8px;font-weight:600}
  #detail .en{color:var(--dim);font-size:11.5px;line-height:1.6;margin-bottom:8px}
  .kv{display:grid;grid-template-columns:64px 1fr;gap:4px 8px;font-size:11.5px;margin-bottom:8px}
  .kv .k{color:var(--dim2)}
  .kv .v{color:var(--text);word-break:break-word}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .gauge{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
  .gauge .num{font-size:26px;font-family:ui-monospace,monospace;line-height:1}
  .gauge .lv{font-size:12px}
  .gauge .dsc{color:var(--dim2);font-size:10.5px;line-height:1.4}
  .bar{display:grid;grid-template-columns:66px 1fr 34px;gap:6px;align-items:center;font-size:11px;margin-bottom:3px}
  .bar .t{color:var(--dim)}
  .bar .track{height:7px;background:rgba(120,160,210,.14);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;border-radius:4px}
  .bar .s{text-align:right;font-family:ui-monospace,monospace;color:var(--dim)}
  .note{font-size:10.5px;color:var(--dim2);margin:-1px 0 5px 72px;line-height:1.4}
  .src{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px;font-size:11.5px}
  .src a{color:var(--accent);text-decoration:none;word-break:break-all}
  .src a:hover{text-decoration:underline}
  .chip{display:inline-block;padding:2px 7px;margin:0 4px 4px 0;border-radius:5px;background:rgba(90,130,180,.16);
    border:1px solid var(--line);font-size:10.5px;color:var(--dim);cursor:pointer}
  .chip:hover{color:var(--accent);border-color:var(--accent)}
  .relItem{border-left:2px solid;padding:5px 8px;margin-bottom:5px;background:rgba(90,130,180,.08);border-radius:0 6px 6px 0;cursor:pointer}
  .relItem:hover{background:rgba(90,130,180,.2)}
  .relItem .rt{font-size:10.5px;display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
  .relItem .rw{font-family:ui-monospace,monospace;color:var(--dim2)}
  .relItem .rr{color:var(--dim);font-size:10.5px;line-height:1.4}
  .relItem .rn{font-size:11.5px;line-height:1.45;margin-top:2px}
  #modal{position:fixed;inset:0;background:rgba(3,6,12,.78);z-index:20;display:none;padding:4vh 6vw;overflow:auto}
  #modal.on{display:block}
  #modalBox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:22px 26px;max-width:1020px;margin:0 auto;
    line-height:1.7;font-size:12.5px}
  #modalBox h2{margin:0 0 4px;font-size:17px}
  #modalBox h3{margin:20px 0 6px;font-size:13px;color:var(--accent)}
  #modalBox table{border-collapse:collapse;width:100%;margin:6px 0;font-size:11.5px}
  #modalBox td,#modalBox th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
  #modalBox th{color:var(--dim);font-weight:600;background:rgba(90,130,180,.1)}
  #modalBox code{background:rgba(90,130,180,.16);padding:1px 5px;border-radius:4px;font-size:11px}
  #modalBox .close{float:right}
  #toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:rgba(8,14,24,.95);
    border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:12px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
  #toast.on{opacity:1}
  #searchBox{width:100%;background:rgba(8,14,24,.8);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:6px 8px;font-size:12px;outline:none}
  #searchBox:focus{border-color:var(--accent)}
  #results .r{padding:4px 6px;border-radius:6px;cursor:pointer;font-size:11.5px;line-height:1.45;
    border-left:2px solid transparent;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #results .r:hover{background:rgba(90,130,180,.16)}
  #selftest{position:fixed;left:8px;top:56px;z-index:40;background:rgba(4,8,14,.96);border:1px solid var(--line);
    border-radius:8px;padding:10px 14px;font-family:ui-monospace,monospace;font-size:11.5px;max-height:80vh;overflow:auto;display:none;white-space:pre}
  @media (max-width:1280px){#app{grid-template-columns:250px 1fr 320px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>新闻<b>地球</b> · NewsGlobe</h1>
    <span class="sub" id="hdrSub">真实新闻的球面时空可视化</span>
    <div class="stat">
      <span>新闻 <b id="sN">0</b></span>
      <span>关联 <b id="sL">0</b></span>
      <span>事件线 <b id="sS">0</b></span>
      <span>窗口内 <b id="sW">0</b></span>
      <button class="btn" id="bAlgo">置信度算法</button>
      <button class="btn" id="bLive">实时刷新</button>
      <button class="btn" id="bHelp">操作说明</button>
    </div>
  </header>

  <aside id="left">
    <div class="sec">
      <h3>搜索</h3>
      <input id="searchBox" placeholder="标题 / 地点 / 实体关键词…">
      <div id="results"></div>
    </div>
    <div class="sec"><h3>新闻分类</h3><div id="catList"></div></div>
    <div class="sec"><h3>置信度等级</h3><div id="lvList"></div></div>
    <div class="sec"><h3>关联类型</h3><div id="linkList"></div></div>
    <div class="sec"><h3>数据来源</h3><div id="srcList"></div></div>
    <div class="sec"><h3>显示选项</h3><div id="optList"></div></div>
    <div class="sec"><h3>事件线 TOP</h3><div id="storyList"></div></div>
  </aside>

  <main id="stage">
    <canvas id="globe"></canvas>
    <canvas id="fx"></canvas>
    <div id="tip"></div>
    <div id="hud">
      <div class="pill" id="hudView">yaw 0° pitch 0° ×1.00</div>
      <div class="pill" id="hudTime">—</div>
      <div class="pill" id="hudFps">—</div>
    </div>
    <div id="legend"></div>
  </main>

  <aside id="right"><div id="detail"></div></aside>

  <footer>
    <div id="tlHead">
      <button class="btn" id="bPlay">▶ 播放</button>
      <button class="btn" id="bAll">全时段</button>
      <span>时间窗口 <span class="win" id="winTxt">—</span></span>
      <span id="tlHint" style="margin-left:auto;color:var(--dim2)">拖动选择时间窗口 · 滚轮缩放窗口 · 柱高=新闻数（按分类堆叠）</span>
    </div>
    <canvas id="tl"></canvas>
  </footer>
</div>
<div id="modal"><div id="modalBox"></div></div>
<div id="toast"></div>
<div id="selftest"></div>

<script>/* ============================================================================
 * NewsGlobe 核心算法（唯一真源）
 *   - 置信度评分：6 维加权，0~100 分，5 级
 *   - 关联推断：实体共享 / 持续事件线 / 时空邻近 / 地震序列 / 可能因果
 *   - 球面几何：经纬 -> 向量 -> 旋转 -> 正交投影 / 大圆插值 / 距离
 *   - 时间与精度：精度等级、格式化、太阳直射点（昼夜线）
 * 本文件同时被 node 测试 require、被构建脚本 require、被 index.html 内联。
 * ==========================================================================*/
var NGCore = (function () {
  'use strict';

  /* ---------------------------------------------------------------- 分类表 */
  var CATEGORIES = {
    conflict:  { zh: '武装冲突', color: '#ff5470', wiki: ['Armed conflicts and attacks'] },
    disaster:  { zh: '灾害事故', color: '#ff9f43', wiki: ['Disasters and accidents'] },
    quake:     { zh: '地震活动', color: '#ffd166', wiki: [] },
    politics:  { zh: '政治选举', color: '#4dabf7', wiki: ['Politics and elections'] },
    intl:      { zh: '国际关系', color: '#8b7cf8', wiki: ['International relations'] },
    law:       { zh: '法律犯罪', color: '#c084fc', wiki: ['Law and crime'] },
    economy:   { zh: '经济商业', color: '#2dd4bf', wiki: ['Business and economy', 'Business and economics'] },
    science:   { zh: '科学技术', color: '#38bdf8', wiki: ['Science and technology'] },
    health:    { zh: '健康环境', color: '#4ade80', wiki: ['Health and environment', 'Health', 'Environment'] },
    culture:   { zh: '文化体育', color: '#f472b6', wiki: ['Arts and culture', 'Sports', 'Sport'] }
  };
  function categoryFromWikiHeading(h) {
    if (!h) return 'politics';
    var norm = String(h).trim().replace(/\s+/g, ' ').toLowerCase();
    for (var key in CATEGORIES) {
      var list = CATEGORIES[key].wiki;
      for (var i = 0; i < list.length; i++) if (list[i].toLowerCase() === norm) return key;
    }
    if (/conflict|attack|war/.test(norm)) return 'conflict';
    if (/disaster|accident/.test(norm)) return 'disaster';
    if (/health|environment/.test(norm)) return 'health';
    if (/business|econom/.test(norm)) return 'economy';
    if (/science|technolog/.test(norm)) return 'science';
    if (/law|crime/.test(norm)) return 'law';
    if (/international|diplomat/.test(norm)) return 'intl';
    if (/art|culture|sport/.test(norm)) return 'culture';
    return 'politics';
  }

  /* ------------------------------------------------------- 信源分级（域名） */
  // 分档依据：是否为一手/官方机构、是否为独立通讯社、是否有编辑部与更正机制。
  var SOURCE_TIERS = [
    { tier: 'official', score: 30, zh: '官方/仪器一手源', test: function (d) {
        return /(^|\.)usgs\.gov$|(^|\.)nasa\.gov$|(^|\.)noaa\.gov$|(^|\.)who\.int$|(^|\.)un\.org$|(^|\.)europa\.eu$|(^|\.)iaea\.org$|(^|\.)imf\.org$|(^|\.)worldbank\.org$|(^|\.)gov$|\.gov$|(^|\.)gov\.[a-z]{2,3}$|\.mil$|(^|\.)inciweb\.[a-z.]+$|(^|\.)gdacs\.org$|(^|\.)emsc-csem\.org$|(^|\.)copernicus\.eu$/.test(d);
      } },
    { tier: 'agency', score: 27, zh: '国际通讯社', test: function (d) {
        return /(^|\.)reuters\.com$|(^|\.)apnews\.com$|(^|\.)afp\.com$|(^|\.)ap\.org$|(^|\.)bloomberg\.com$|(^|\.)dpa\.com$|(^|\.)efe\.com$|(^|\.)ansa\.it$|(^|\.)kyodonews\.net$|(^|\.)pap\.pl$|(^|\.)interfax\.com$/.test(d);
      } },
    { tier: 'major', score: 23, zh: '主流大报/公共广播', test: function (d) {
        return /(^|\.)bbc\.co\.uk$|(^|\.)bbc\.com$|(^|\.)nytimes\.com$|(^|\.)washingtonpost\.com$|(^|\.)theguardian\.com$|(^|\.)aljazeera\.com$|(^|\.)cnn\.com$|(^|\.)dw\.com$|(^|\.)nhk\.or\.jp$|(^|\.)ft\.com$|(^|\.)wsj\.com$|(^|\.)abc\.net\.au$|(^|\.)cbc\.ca$|(^|\.)npr\.org$|(^|\.)lemonde\.fr$|(^|\.)spiegel\.de$|(^|\.)elpais\.com$|(^|\.)cbsnews\.com$|(^|\.)nbcnews\.com$|(^|\.)abcnews\.go\.com$|(^|\.)france24\.com$|(^|\.)rfi\.fr$|(^|\.)economist\.com$|(^|\.)politico\.(com|eu)$|(^|\.)thetimes\.co\.uk$|(^|\.)telegraph\.co\.uk$|(^|\.)independent\.co\.uk$|(^|\.)scmp\.com$|(^|\.)japantimes\.co\.jp$|(^|\.)haaretz\.com$|(^|\.)timesofisrael\.com$|(^|\.)thehindu\.com$|(^|\.)straitstimes\.com$/.test(d);
      } },
    { tier: 'state', score: 18, zh: '国家背景媒体', test: function (d) {
        return /(^|\.)xinhuanet\.com$|(^|\.)news\.cn$|(^|\.)globaltimes\.cn$|(^|\.)cgtn\.com$|(^|\.)rt\.com$|(^|\.)tass\.com$|(^|\.)sputnik[a-z]*\.[a-z.]+$|(^|\.)presstv\.ir$|(^|\.)irna\.ir$|(^|\.)mehrnews\.com$|(^|\.)anadolu[a-z]*\.[a-z.]+$|(^|\.)aa\.com\.tr$|(^|\.)kcna\.kp$/.test(d);
      } },
    { tier: 'lowtrust', score: 6, zh: '低可信/无编辑部', test: function (d) {
        return /(^|\.)x\.com$|(^|\.)twitter\.com$|(^|\.)t\.me$|(^|\.)facebook\.com$|(^|\.)medium\.com$|(^|\.)blogspot\.[a-z.]+$|(^|\.)wordpress\.com$|(^|\.)substack\.com$|(^|\.)youtube\.com$|(^|\.)reddit\.com$/.test(d);
      } }
  ];
  var DEFAULT_TIER = { tier: 'regional', score: 17, zh: '区域/行业媒体' };

  function domainOf(url) {
    var m = String(url || '').match(/^https?:\/\/([^\/:?#]+)/i);
    if (!m) return '';
    return m[1].toLowerCase().replace(/^www\d?\./, '').replace(/^m\./, '').replace(/^amp\./, '');
  }
  function sourceTier(domain) {
    var d = String(domain || '').toLowerCase();
    if (!d) return { tier: 'unknown', score: 10, zh: '未知来源' };
    for (var i = 0; i < SOURCE_TIERS.length; i++) if (SOURCE_TIERS[i].test(d)) {
      return { tier: SOURCE_TIERS[i].tier, score: SOURCE_TIERS[i].score, zh: SOURCE_TIERS[i].zh };
    }
    return { tier: DEFAULT_TIER.tier, score: DEFAULT_TIER.score, zh: DEFAULT_TIER.zh };
  }
  // 同一集团/同一稿源视为非独立信源（避免"转载即多源"的假象）
  var SOURCE_GROUPS = [
    ['apnews.com', 'ap.org'], ['bbc.com', 'bbc.co.uk'], ['nbcnews.com', 'msnbc.com'],
    ['xinhuanet.com', 'news.cn'], ['abcnews.go.com', 'abc.net.au'] // 同名不同社，仍分开计权重但去重同域
  ];
  function independentSourceCount(domains) {
    var seen = {}, groups = {}, n = 0;
    for (var i = 0; i < domains.length; i++) {
      var d = domains[i];
      if (!d || seen[d]) continue;
      seen[d] = 1;
      var gid = d;
      for (var g = 0; g < SOURCE_GROUPS.length; g++) if (SOURCE_GROUPS[g].indexOf(d) >= 0) { gid = 'g' + g; break; }
      if (!groups[gid]) { groups[gid] = 1; n++; }
    }
    return n;
  }

  /* ------------------------------------------------------ 时间/位置精度分档 */
  var TIME_PRECISION = {
    second:   { zh: '秒级', score: 15 },
    minute:   { zh: '分钟级', score: 14 },
    hour:     { zh: '小时级', score: 12 },
    day:      { zh: '日级', score: 8 },
    multiday: { zh: '跨日/持续', score: 4 },
    month:    { zh: '仅月份', score: 1 }
  };
  function timePrecisionScore(p) { return (TIME_PRECISION[p] || TIME_PRECISION.month).score; }
  function timePrecisionLabel(p) { return (TIME_PRECISION[p] || TIME_PRECISION.month).zh; }

  // 位置精度：以不确定半径（km）分档
  function locationPrecisionScore(radiusKm) {
    var r = typeof radiusKm === 'number' && isFinite(radiusKm) ? radiusKm : 1e9;
    if (r <= 5) return 20;      // 仪器/坐标级（含 USGS 震中）
    if (r <= 15) return 17;     // 城市级
    if (r <= 40) return 14;     // 都会区级
    if (r <= 120) return 10;    // 地区级
    if (r <= 350) return 6;     // 省州级
    if (r <= 900) return 3;     // 国家级
    return 1;                   // 更粗的区域级
  }
  function locationPrecisionLabel(radiusKm) {
    var r = typeof radiusKm === 'number' && isFinite(radiusKm) ? radiusKm : 1e9;
    if (r <= 5) return '坐标级 (±' + (r < 1 ? r.toFixed(1) : Math.round(r)) + 'km)';
    if (r <= 15) return '城市级 (±' + Math.round(r) + 'km)';
    if (r <= 40) return '都会区级 (±' + Math.round(r) + 'km)';
    if (r <= 120) return '地区级 (±' + Math.round(r) + 'km)';
    if (r <= 350) return '省州级 (±' + Math.round(r) + 'km)';
    if (r <= 900) return '国家级 (±' + Math.round(r) + 'km)';
    return '区域级 (>±900km)';
  }
  // 维基坐标 API 的 type/dim -> 不确定半径（km）

    else if ((rs.entity || 0) >= 2) { xs = 5; xnote = '与 ' + rs.entity + ' 条新闻共享关键实体'; }
    else if ((rs.entity || 0) === 1 || (rs.chain || 0) > 0) { xs = 4; xnote = '有 1 条实体/事件线关联'; }

        } else if (chainShared.length && dtH <= 24 * 30) {

/* ==================================================== 几何解码（折线串） */
var ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-';
var CODEMAP={};for(var ci=0;ci<ALPHA.length;ci++)CODEMAP[ALPHA.charAt(ci)]=ci;
function decodeLines(str,q){
  if(!str)return [];

    while(i<s.length){

    }
    if(pts.length>1)out.push(pts);
  }
  return out;
}

function invRotate(x,y,z,yaw,pitch){
  var cp=Math.cos(pitch),sp=Math.sin(pitch);
  var y1=y*cp+z*sp, z1=-y*sp+z*cp, x1=x;
  var cy=Math.cos(yaw),sy=Math.sin(yaw);
  return {x:x1*cy+z1*sy,y:y1,z:-x1*sy+z1*cy};

function renderSphere(){

      var v=NG.rotateVec(NG.latLonToVec(pts[i][1],pts[i][0]),ST.yaw,ST.pitch);
      if(v.z<=minZ){pen=false;continue;}
      var x=CX+v.x*R,y=CY-v.y*R;
      if(!pen){fx.moveTo(x,y);pen=true;}else fx.lineTo(x,y);
    }
  }
  fx.stroke();
}
function drawTerminator(){
  var sun=NG.subsolarPoint(hudTimeMs());
  var s=NG.latLonToVec(sun.lat,sun.lon);
  var up={x:0,y:1,z:0};
  var ux=up.y*s.z-up.z*s.y,uy=up.z*s.x-up.x*s.z,uz=up.x*s.y-up.y*s.x;
  var ul=Math.sqrt(ux*ux+uy*uy+uz*uz)||1;ux/=ul;uy/=ul;uz/=ul;
  var vx=s.y*uz-s.z*uy,vy=s.z*ux-s.x*uz,vz=s.x*uy-s.y*ux;
  fx.strokeStyle='rgba(255,200,120,.5)';fx.lineWidth=1.1;fx.setLineDash([5,4]);fx.beginPath();
  var pen=false;
  for(var a=0;a<=360;a+=2){
    var t=a*D2R,cx2=Math.cos(t),sx2=Math.sin(t);
    var p={x:ux*cx2+vx*sx2,y:uy*cx2+vy*sx2,z:uz*cx2+vz*sx2};
    var v=NG.rotateVec(p,ST.yaw,ST.pitch);
    if(v.z<=0){pen=false;continue;}
    var X=CX+v.x*R,Y=CY-v.y*R;
    if(!pen){fx.moveTo(X,Y);pen=true;}else fx.lineTo(X,Y);
  }
  fx.stroke();fx.setLineDash([]);
  // 太阳直射点
  var sp2=proj(sun.lat,sun.lon,0);
  if(sp2.z>0){
    fx.fillStyle='rgba(255,225,150,.9)';fx.beginPath();fx.arc(sp2.x,sp2.y,3,0,6.2832);fx.fill();
    fx.strokeStyle='rgba(255,220,140,.45)';fx.lineWidth=1;fx.beginPath();fx.arc(sp2.x,sp2.y,8,0,6.2832);fx.stroke();
  }
}

function inWindow(it){return it.tEnd>=ST.win.a&&it.tStart<=ST.win.b}
function passFilter(it){
  if(!ST.cats[it.cat])return false;
  if(!ST.levels[it.conf.lv])return false;
  if(!ST.origins[it.origin])return false;
  if(ST.story){var m=ST.story.members;if(m.indexOf(it.id)<0)return false;}
  if(ST.search){
    var q=ST.search.toLowerCase();
    var hay=(it.title+' '+(it.zh||'')+' '+(it.place||'')+' '+(it.entities||[]).join(' ')+' '+(it.chain||[]).join(' ')).toLowerCase();
    if(hay.indexOf(q)<0)return false;
  }
  return true;
}
function visibleItems(){
  var out=[];
  for(var i=0;i<ST.items.length;i++){
    var it=ST.items[i];
    if(!inWindow(it)||!passFilter(it))continue;
    out.push(it);
  }
  return out;
}
function markerSize(it){
  var base=3.0;
  if(it.cat==='quake'&&it.mag)base=2.0+Math.max(0,(it.mag-4))*1.5;
  else base=3.0+Math.min(2.6,(it.srcs?it.srcs.length:1)*0.75);
  base*=(0.82+0.4*(it.conf.total/100));
  return Math.max(2.2,Math.min(11,base))*(0.72+0.34*Math.min(2,ST.zoom));
}
function drawMarkers(){
  var vis=visibleItems(),drawn=[];
  var now=Date.now(),pulse=(Date.now()%2000)/2000;
  for(var i=0;i<vis.length;i++){
    var it=vis[i],p=proj(it.lat,it.lon,0);
    if(p.z<=0.02)continue;
    drawn.push({it:it,x:p.x,y:p.y,z:p.z});
  }
  drawn.sort(function(a,b){return a.z-b.z});
  // 不确定半径圈
  if(ST.opts.uncert){
    for(var u=0;u<drawn.length;u++){
      var d0=drawn[u],rk=d0.it.rKm||0;
      var rad=R*Math.sin(Math.min(1.2,rk/6371));
      if(rad<3)continue;
      var col=NG.CATEGORIES[d0.it.cat].color;
      fx.strokeStyle=hexA(col,.30);fx.lineWidth=1;fx.setLineDash([3,3]);
      fx.beginPath();fx.ellipse(d0.x,d0.y,rad,rad*Math.max(.25,d0.z),0,0,6.2832);fx.stroke();
      fx.setLineDash([]);
    }
  }
  for(var m=0;m<drawn.length;m++){
    var d=drawn[m],it2=d.it,col2=NG.CATEGORIES[it2.cat].color;
    var sz=markerSize(it2), lv=levelObj(it2.conf.lv);
    var fade=0.35+0.65*d.z;
    var isSel=ST.sel&&ST.sel.id===it2.id, isHov=ST.hover&&ST.hover.id===it2.id;
    // 新鲜事件脉冲
    var age=(now-it2.t)/3600000;
    if(age<36&&age>-24){
      var pr=sz+3+pulse*16;
      fx.strokeStyle=hexA(col2,(1-pulse)*0.5*fade);fx.lineWidth=1.4;
      fx.beginPath();fx.arc(d.x,d.y,pr,0,6.2832);fx.stroke();
    }
    if(isSel||isHov){
      fx.strokeStyle=isSel?'#ffffff':hexA('#ffffff',.6);fx.lineWidth=isSel?2:1.2;
      fx.beginPath();fx.arc(d.x,d.y,sz+6,0,6.2832);fx.stroke();
    }
    // 置信度外环：A/B 实线，C 虚线，D/E 点线
    var dash=it2.conf.lv==='A'?[]:it2.conf.lv==='B'?[]:it2.conf.lv==='C'?[5,3]:[2,3];
    fx.setLineDash(dash);
    fx.strokeStyle=hexA(lv.color,.85*fade);fx.lineWidth=it2.conf.lv==='A'?2:1.3;
    fx.beginPath();fx.arc(d.x,d.y,sz+2.6,0,6.2832);fx.stroke();
    fx.setLineDash([]);
    // 主体
    var gl=fx.createRadialGradient(d.x,d.y,0,d.x,d.y,sz*2.2);
    gl.addColorStop(0,hexA(col2,.95*fade));gl.addColorStop(.45,hexA(col2,.5*fade));gl.addColorStop(1,hexA(col2,0));
    fx.fillStyle=gl;fx.beginPath();fx.arc(d.x,d.y,sz*2.2,0,6.2832);fx.fill();
    fx.fillStyle=hexA(col2,Math.min(1,.75+.25*fade));
    fx.beginPath();fx.arc(d.x,d.y,sz,0,6.2832);fx.fill();
    fx.fillStyle='rgba(255,255,255,'+(0.55*fade).toFixed(2)+')';
    fx.beginPath();fx.arc(d.x-sz*.28,d.y-sz*.28,sz*.34,0,6.2832);fx.fill();
  }
  ST.drawn=drawn;
  if(ST.opts.labels)drawLabels(drawn);
  return drawn;
}
function drawLabels(drawn){
  var occ=[],placed=0;
  var cand=drawn.slice().sort(function(a,b){
    var sa=(ST.sel&&ST.sel.id===a.it.id?1e6:0)+a.it.conf.total+(a.it.mag||0)*8+a.z*20;
    var sb=(ST.sel&&ST.sel.id===b.it.id?1e6:0)+b.it.conf.total+(b.it.mag||0)*8+b.z*20;
    return sb-sa;
  });
  fx.font='500 11px ui-monospace,Menlo,Consolas,monospace';
  fx.textBaseline='middle';
  var limit=ST.zoom>1.6?26:16;
  for(var i=0;i<cand.length&&placed<limit;i++){
    var d=cand[i],it=d.it;
    var txt=shortLabel(it);
    if(!txt)continue;
    var w=fx.measureText(txt).width+8,h=14;
    var x=d.x+markerSize(it)+7,y=d.y;
    var box=[x,y-h/2,w,h],ok=true;
    for(var o=0;o<occ.length;o++){
      var b=occ[o];
      if(box[0]<b[0]+b[2]&&box[0]+box[2]>b[0]&&box[1]<b[1]+b[3]&&box[1]+box[3]>b[1]){ok=false;break;}
    }
    if(!ok)continue;
    occ.push(box);placed++;
    fx.fillStyle='rgba(5,10,18,.62)';
    roundRect(fx,x-3,y-h/2,w,h,4);fx.fill();
    fx.fillStyle=hexA(NG.CATEGORIES[it.cat].color,.95);
    fx.fillText(txt,x+1,y+.5);
  }
}
function shortLabel(it){
  var s='';
  if(it.origin==='usgs'){
    // 震中描述形如 "35 km SSW of Otura, Spain"，标签用"震级+区域"更可读
    var tail=String(it.place||'').split(/,\s*/).pop();
    s='M'+(it.mag?it.mag.toFixed(1):'?')+(tail?' '+tail:'');
  } else if(it.origin==='eonet'){
    var seg=String((it.entities&&it.entities[0])||'').split(/,\s*/);
    s=seg.length>1?seg[seg.length-1]:seg[0];
  } else {
    s=String(it.place||(it.entities&&it.entities[0])||'').split(/,\s*/)[0];
  }
  s=s.replace(/\s+/g,' ').trim();
  if(s.length>18)s=s.slice(0,17)+'…';
  return s;
}
function drawArcs(){
  if(!ST.opts.arcs)return 0;
  var vis={},n=0;
  var va=visibleItems();
  for(var i=0;i<va.length;i++)vis[va[i].id]=va[i];
  var sel=ST.sel;
  for(var l=0;l<ST.links.length;l++){
    var L=ST.links[l];
    if(!ST.linkTypes[L.type])continue;
    var A=vis[L.a],B=vis[L.b];
    if(!A||!B)continue;
    var stl=LINK_STYLE[L.type];
    var focus=sel&&(sel.id===L.a||sel.id===L.b);
    var alpha=(focus?0.95:(sel?0.12:0.34))*(0.5+0.5*L.weight);
    var pts=NG.greatCircle(A.lat,A.lon,B.lat,B.lon,42);
    var ang=Math.acos(Math.max(-1,Math.min(1,Math.cos((90-A.lat)*D2R)*Math.cos((90-B.lat)*D2R)+
      Math.sin((90-A.lat)*D2R)*Math.sin((90-B.lat)*D2R)*Math.cos((A.lon-B.lon)*D2R))));
    var maxLift=0.045+0.20*(ang/Math.PI);
    fx.strokeStyle=hexA(stl.c,alpha);fx.lineWidth=focus?stl.w+.7:stl.w;fx.setLineDash(stl.d);
    fx.beginPath();
    var pen=false,lastX=0,lastY=0,pen2=false;
    for(var p=0;p<pts.length;p++){
      var t=pts[p].t,lift=maxLift*Math.sin(Math.PI*t);
      var q=proj(pts[p].lat,pts[p].lon,lift);
      var dx=q.x-CX,dy=q.y-CY;
      var outside=Math.sqrt(dx*dx+dy*dy)>R;
      if(q.z<=0&&!outside){pen=false;continue;}
      if(!pen){fx.moveTo(q.x,q.y);pen=true;}else{fx.lineTo(q.x,q.y);}
      lastX=q.x;lastY=q.y;pen2=pen;
    }
    fx.stroke();fx.setLineDash([]);
    // 因果/序列箭头
    if((L.type==='causal'||L.type==='sequence')&&pen2&&focus){
      var pe=proj(pts[pts.length-1].lat,pts[pts.length-1].lon,0);
      if(pe.z>0){
        fx.fillStyle=hexA(stl.c,alpha);
        fx.beginPath();fx.arc(pe.x,pe.y,2.6,0,6.2832);fx.fill();
      }
    }
    n++;
  }
  return n;
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function hexA(hex,a){
  var h=String(hex).replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n=parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+Math.max(0,Math.min(1,a)).toFixed(3)+')';
}
function levelObj(k){
  for(var i=0;i<NG.LEVELS.length;i++)if(NG.LEVELS[i].key===k)return NG.LEVELS[i];
  return NG.LEVELS[NG.LEVELS.length-1];
}

/* ==================================================== 主循环 */
var dirty=true,lastFrame=0,frames=0,fpsT=0,arcCount=0;
function hudTimeMs(){return ST.playing?ST.win.b:(ST.win.b>T1?T1:ST.win.b)}
function frame(ts){
  requestAnimationFrame(frame);
  var dt=ts-lastFrame;lastFrame=ts;
  if(ST.autoRotate&&!dragging){ST.yaw+=0.00012*Math.min(60,dt||16);dirty=true;}
  if(ST.playing){
    var span=ST.win.b-ST.win.a;
    var step=(T1-T0)/900*ST.speed*Math.min(3,(dt||16)/16);
    ST.win.a+=step;ST.win.b+=step;
    if(ST.win.b>T1+span*0.1){ST.win.a=T0;ST.win.b=T0+span;}
    updateWinText();drawTimeline();dirty=true;
  }
  frames++;fpsT+=dt||16;
  if(fpsT>500){ST.fps=Math.round(frames*1000/fpsT);frames=0;fpsT=0;qs('#hudFps').textContent=ST.fps+' fps · '+ST.drawn.length+' 标记 / '+arcCount+' 弧';}
  if(!dirty)return;
  dirty=false;
  renderAll();
}
function renderAll(){
  renderSphere();
  fx.clearRect(0,0,W,H);
  if(ST.opts.borders){
    strokeLines(COAST,'rgba(110,195,255,.28)',3.2,0.012);      // 外侧柔光
    strokeLines(COAST,'rgba(224,244,255,.96)',1.45,0.012);      // 海岸线主线
    strokeLines(BORDERS,'rgba(215,230,252,.5)',1.05,0.02);      // 国界
  }
  if(ST.opts.night)drawTerminator();
  arcCount=drawArcs();
  drawMarkers();
  qs('#hudView').textContent='yaw '+Math.round(((ST.yaw/D2R)%360+360)%360)+'° pitch '+Math.round(ST.pitch/D2R)+'° ×'+ST.zoom.toFixed(2);
  qs('#hudTime').textContent=NG.formatUTC(hudTimeMs(),'hour');
  qs('#sW').textContent=String(visibleItems().length);
}

/* ==================================================== 交互 */
var dragging=false,dragMoved=0,lastX=0,lastY=0,vYaw=0,vPitch=0,idleTimer=null;
fxCv.addEventListener('pointerdown',function(e){
  dragging=true;dragMoved=0;lastX=e.clientX;lastY=e.clientY;fxCv.setPointerCapture(e.pointerId);
  sphereQ=2;ST.autoRotate=false;syncOpts();
});
fxCv.addEventListener('pointermove',function(e){
  var rc=fxCv.getBoundingClientRect(),mx=e.clientX-rc.left,my=e.clientY-rc.top;
  if(dragging){
    var dx=e.clientX-lastX,dy=e.clientY-lastY;
    dragMoved+=Math.abs(dx)+Math.abs(dy);
    lastX=e.clientX;lastY=e.clientY;
    ST.yaw-=dx*0.0045/Math.max(.6,ST.zoom*0.75);
    ST.pitch+=dy*0.0045/Math.max(.6,ST.zoom*0.75);
    ST.pitch=Math.max(-85*D2R,Math.min(85*D2R,ST.pitch));
    dirty=true;
  } else {
    var hit=hitTest(mx,my);
    if((hit&&(!ST.hover||ST.hover.id!==hit.id))||(!hit&&ST.hover)){ST.hover=hit;dirty=true;}
    showTip(hit,mx,my);
  }
});
fxCv.addEventListener('pointerup',function(e){
  dragging=false;sphereQ=1;dirty=true;
  if(dragMoved<5){
    var rc=fxCv.getBoundingClientRect();
    var hit=hitTest(e.clientX-rc.left,e.clientY-rc.top);
    select(hit?hit.id:null);
  }
});
fxCv.addEventListener('pointerleave',function(){ST.hover=null;qs('#tip').style.opacity=0;dirty=true});
fxCv.addEventListener('wheel',function(e){
  e.preventDefault();
  ST.zoom=Math.max(0.65,Math.min(6,ST.zoom*(e.deltaY<0?1.12:1/1.12)));
  R=Math.min(W,H)*0.43*ST.zoom;sphereImg=null;dirty=true;
},{passive:false});
fxCv.addEventListener('dblclick',function(e){
  var rc=fxCv.getBoundingClientRect();
  var hit=hitTest(e.clientX-rc.left,e.clientY-rc.top);
  if(hit)flyTo(hit);
});
window.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){select(null);qs('#modal').classList.remove('on');}
  else if(e.key==='ArrowLeft'){ST.yaw-=0.06;dirty=true}
  else if(e.key==='ArrowRight'){ST.yaw+=0.06;dirty=true}
  else if(e.key==='ArrowUp'){ST.pitch=Math.min(85*D2R,ST.pitch+0.05);dirty=true}
  else if(e.key==='ArrowDown'){ST.pitch=Math.max(-85*D2R,ST.pitch-0.05);dirty=true}
  else if(e.key==='+'||e.key==='='){ST.zoom=Math.min(6,ST.zoom*1.15);R=Math.min(W,H)*0.43*ST.zoom;sphereImg=null;dirty=true}
  else if(e.key==='-'){ST.zoom=Math.max(.65,ST.zoom/1.15);R=Math.min(W,H)*0.43*ST.zoom;sphereImg=null;dirty=true}
  else if(e.key===' '){ST.playing=!ST.playing;qs('#bPlay').textContent=ST.playing?'❚❚ 暂停':'▶ 播放';qs('#bPlay').classList.toggle('on',ST.playing);e.preventDefault()}
  else if(e.key==='r'||e.key==='R'){ST.autoRotate=!ST.autoRotate;syncOpts()}
});
function hitTest(mx,my){
  var best=null,bd=16*16;
  for(var i=ST.drawn.length-1;i>=0;i--){
    var d=ST.drawn[i],dx=d.x-mx,dy=d.y-my,dd=dx*dx+dy*dy;
    var rr=Math.max(9,markerSize(d.it)+7);
    if(dd<rr*rr&&dd<bd){bd=dd;best=d.it;}
  }
  return best;
}
function showTip(it,mx,my){
  var tip=qs('#tip');
  if(!it){tip.style.opacity=0;return}
  var lv=levelObj(it.conf.lv);
  tip.innerHTML='<div class="h" style="color:'+NG.CATEGORIES[it.cat].color+'">'+esc(NG.CATEGORIES[it.cat].zh)+
    ' · <span style="color:'+lv.color+'">'+lv.key+' '+esc(lv.zh)+' '+it.conf.total+'</span></div>'+
    '<div>'+esc(trunc(disp(it),120))+'</div>'+
    '<div class="m">'+esc(NG.formatUTC(it.t,it.tp))+' · '+esc(it.place||NG.formatLatLon(it.lat,it.lon))+
    ' · ±'+Math.round(it.rKm)+'km</div>';
  tip.style.opacity=1;
  var tw=tip.offsetWidth,th=tip.offsetHeight;
  tip.style.left=Math.min(W-tw-8,Math.max(6,mx+14))+'px';
  tip.style.top=Math.min(H-th-8,Math.max(6,my+14))+'px';
}
function flyTo(it){
  var y0=ST.yaw,p0=ST.pitch,y1=it.lon*D2R,p1=it.lat*D2R;
  while(y1-y0>Math.PI)y1-=2*Math.PI;
  while(y0-y1>Math.PI)y1+=2*Math.PI;
  var z0=ST.zoom,z1=Math.max(ST.zoom,1.7),t0=performance.now(),dur=760;
  ST.autoRotate=false;syncOpts();
  (function anim(){
    var k=Math.min(1,(performance.now()-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    ST.yaw=y0+(y1-y0)*e;ST.pitch=p0+(p1-p0)*e;ST.zoom=z0+(z1-z0)*e;
    R=Math.min(W,H)*0.43*ST.zoom;sphereImg=null;dirty=true;
    if(k<1)requestAnimationFrame(anim);
  })();
}
function select(id){
  ST.sel=id?ST.byId[id]:null;
  renderDetail();dirty=true;
}

/* ==================================================== 左侧面板 */

var tlCv=qs('#tl'),tlx=tlCv.getContext('2d'),BUCKET=6*3600000;
function drawTimeline(){
  var w=tlCv.width/DPR,h=tlCv.height/DPR;
  tlx.setTransform(DPR,0,0,DPR,0,0);
  tlx.clearRect(0,0,w,h);
  var pad=6,gw2=w-pad*2,gh2=h-22;
  var span=T1-T0||1;
  var nb=Math.max(12,Math.ceil(span/BUCKET));
  var buckets=[],maxv=1;
  for(var i=0;i<nb;i++)buckets.push({});
  var pf=ST.items.filter(passFilter);
  for(var k=0;k<pf.length;k++){
    var bi=Math.min(nb-1,Math.max(0,Math.floor((pf[k].t-T0)/span*nb)));
    buckets[bi][pf[k].cat]=(buckets[bi][pf[k].cat]||0)+1;
  }
  for(var b=0;b<nb;b++){
    var tot=0;for(var c in buckets[b])tot+=buckets[b][c];
    if(tot>maxv)maxv=tot;
  }
  // 窗口高亮
  var xa=pad+(ST.win.a-T0)/span*gw2,xb=pad+(ST.win.b-T0)/span*gw2;
  tlx.fillStyle='rgba(99,224,255,.09)';tlx.fillRect(xa,0,Math.max(2,xb-xa),gh2+6);
  tlx.strokeStyle='rgba(99,224,255,.55)';tlx.lineWidth=1;
  tlx.beginPath();tlx.moveTo(xa,0);tlx.lineTo(xa,gh2+6);tlx.moveTo(xb,0);tlx.lineTo(xb,gh2+6);tlx.stroke();
  // 柱状堆叠
  var bw=gw2/nb;
  for(var b2=0;b2<nb;b2++){
    var x=pad+b2*bw,y=gh2;
    var inWin=(T0+(b2+.5)/nb*span)>=ST.win.a&&(T0+(b2+.5)/nb*span)<=ST.win.b;
    for(var cat in NG.CATEGORIES){
      var v=buckets[b2][cat];if(!v)continue;
      var hh=v/maxv*(gh2-4);
      tlx.fillStyle=hexA(NG.CATEGORIES[cat].color,inWin?.92:.32);
      tlx.fillRect(x+.6,y-hh,Math.max(1,bw-1.2),hh);
      y-=hh;
    }
  }
  // 时间刻度
  tlx.fillStyle='rgba(140,165,195,.75)';tlx.font='10px ui-monospace,monospace';tlx.textBaseline='top';
  var days=Math.ceil(span/86400000),stepD=days>20?3:days>10?2:1;
  for(var d=0;d<=days;d+=stepD){
    var tt=T0+d*86400000;if(tt>T1)break;
    var xx=pad+(tt-T0)/span*gw2;
    tlx.strokeStyle='rgba(120,160,210,.22)';tlx.beginPath();tlx.moveTo(xx,gh2+2);tlx.lineTo(xx,gh2+7);tlx.stroke();
    tlx.fillText(new Date(tt).toISOString().slice(5,10),xx+2,gh2+8);
  }
  tlx.fillStyle='rgba(99,224,255,.9)';
  tlx.fillText('◀ '+new Date(ST.win.a).toISOString().slice(5,16).replace('T',' '),Math.max(pad,xa-2),gh2+8);
}
var tlDrag=null;
tlCv.addEventListener('pointerdown',function(e){
  var rc=tlCv.getBoundingClientRect(),w=rc.width,pad=6,gw2=w-pad*2;
  var t=T0+Math.max(0,Math.min(1,(e.clientX-rc.left-pad)/gw2))*(T1-T0);
  var xa=pad+(ST.win.a-T0)/(T1-T0)*gw2,xb=pad+(ST.win.b-T0)/(T1-T0)*gw2,mx=e.clientX-rc.left;
  tlDrag=Math.abs(mx-xa)<7?'a':Math.abs(mx-xb)<7?'b':(mx>xa&&mx<xb?'mid':'new');
  if(tlDrag==='new'){ST.win.a=t;ST.win.b=t+(T1-T0)*0.06;tlDrag='b'}
  tlCv.setPointerCapture(e.pointerId);
  tlDragT=t;drawTimeline();updateWinText();dirty=true;
});
var tlDragT=0;
tlCv.addEventListener('pointermove',function(e){
  if(!tlDrag)return;
  var rc=tlCv.getBoundingClientRect(),pad=6,gw2=rc.width-pad*2;
  var t=T0+Math.max(0,Math.min(1,(e.clientX-rc.left-pad)/gw2))*(T1-T0);
  if(tlDrag==='a')ST.win.a=Math.min(t,ST.win.b-3600000);
  else if(tlDrag==='b')ST.win.b=Math.max(t,ST.win.a+3600000);
  else if(tlDrag==='mid'){var d=t-tlDragT;ST.win.a+=d;ST.win.b+=d;tlDragT=t}
  drawTimeline();updateWinText();dirty=true;
});
window.addEventListener('pointerup',function(){tlDrag=null});
tlCv.addEventListener('wheel',function(e){
  e.preventDefault();
  var c=(ST.win.a+ST.win.b)/2,half=(ST.win.b-ST.win.a)/2*(e.deltaY<0?1/1.2:1.2);
  half=Math.max(1800000,Math.min((T1-T0)/2*1.2,half));
  ST.win.a=c-half;ST.win.b=c+half;
  drawTimeline();updateWinText();dirty=true;
},{passive:false});

}

   '<tr><td>结构一致性</td><td>5</td><td>该新闻能否被关联网络印证：嵌入事件线且有实体级关联 5｜≥2 条实体关联 5｜1 条 4｜仅时空弱关联 3｜孤立事件 2｜与同时空报道冲突 0</td></tr>'+
   '</table>'+
   '<h3>二、等级划分</h3><table><tr><th>等级</th><th>分数区间</th><th>含义</th></tr>';
  NG.LEVELS.forEach(function(l,i){
    var hi=i===0?100:NG.LEVELS[i-1].min-1;
    h+='<tr><td style="color:'+l.color+'">'+l.key+' · '+l.zh+'</td><td>'+(l.min<0?0:l.min)+' – '+hi+'</td><td>'+l.desc+'</td></tr>';
  });
  h+='</table>'+
   '<h3>三、关联推断规则（按优先级）</h3><table><tr><th>类型</th><th>触发条件</th><th>含义</th></tr>'+
   '<tr><td style="color:'+LINK_STYLE.chain.c+'">同一事件线</td><td>两条新闻共享同一母事件（维基每日时事页的话题层级），且相隔 ≤30 天</td><td>同一持续事件的连续进展，权重 0.90+</td></tr>'+
   '<tr><td style="color:'+LINK_STYLE.entity.c+'">实体关联</td><td>共享关键实体的 IDF 权重和 ≥1.2（剔除 United States/UN 等泛实体）</td><td>涉及同一人物、组织、地点或议题</td></tr>'+
   '<tr><td style="color:'+LINK_STYLE.causal.c+'">可能因果/后续</td><td>实体关联 + 时间先后（0.5h~14d）+ 类别符合因果模式（如 灾害→健康、冲突→外交、政策→经济）</td><td>后一条可能是前一条的反应或后果，仅作提示</td></tr>'+
   '<tr><td style="color:'+LINK_STYLE.contradiction.c+'">相互矛盾</td><td>同一议题（共享实体）、间隔 ≤72h、相距 ≤300km 或同一事件线，且<b>只有一方</b>出现 denies/rejects/disputes/no evidence 等否认措辞</td><td>报道互相打架：双方"结构一致性"直接归零（-5 分），提示需人工核实</td></tr>'+
   '<tr><td style="color:'+LINK_STYLE.sequence.c+'">地震序列</td><td>两次地震相距 ≤300km 且 ≤7 天</td><td>同一地震序列/余震</td></tr>'+
   '<tr><td style="color:'+LINK_STYLE.proximity.c+'">时空邻近</td><td>同类事件相距 ≤250km 且 ≤48h</td><td>弱关联，可能同源也可能巧合</td></tr>'+
   '</table>'+
   '<div style="color:var(--dim2)">判定优先级：相互矛盾 &gt; 同一事件线 &gt; 实体/因果 &gt; 地震序列 &gt; 时空邻近。每对新闻只保留权重最高的一条关联；每条新闻最多保留 6 条关联以避免图形过载。事件线聚类只使用"同一事件线"边做连通分量。</div>'+
   '<h3>四、数据来源与已知局限</h3><ul style="color:var(--dim);line-height:1.8">'+
   '<li><b>维基百科每日时事页</b>（'+(DATA.stats.byOrigin.wikipedia||0)+' 条）：提供分类、母事件层级、关键实体与原始报道链接；<b>时间只到"日"</b>，位置由条目内维基实体的地理坐标推导，取最精确者。</li>'+
   '<li><b>USGS 地震目录</b>（'+(DATA.stats.byOrigin.usgs||0)+' 条）：秒级发震时刻 + 震中经纬度，仅收录 M≥5.0 或显著性较高的事件。</li>'+
   '<li><b>NASA EONET</b>（'+(DATA.stats.byOrigin.eonet||0)+' 条）：卫星观测的野火/风暴/火山等自然事件，坐标为观测点，日级时间。</li>'+
   '<li>局限：位置来自"新闻中被提到的地点"，当报道只提到国家时精度只能到国家级（会如实标注 ±600km）；"可能因果"仅是模式提示，<b>不是事实断言</b>；置信度衡量的是<b>可核查性</b>，不等于对报道内容的价值判断。</li>'+
   '</ul>';
  return h;
}

  return '<button class="btn close" onclick="document.getElementById(\'modal\').classList.remove(\'on\')">关闭 ✕</button>'+
   '<h2>操作说明</h2><table><tr><th>操作</th><th>效果</th></tr>'+

   '<tr><td>单击标记</td><td>右侧显示详情、置信度分解与关联</td></tr>'+
   '<tr><td>双击标记</td><td>飞抵该地点</td></tr>'+
   '<tr><td>空格</td><td>播放/暂停时间轴动画</td></tr>'+

   '<tr><td>Esc</td><td>取消选中 / 关闭弹窗</td></tr>'+

   '</table><div style="color:var(--dim2)">本页为纯静态单文件，无后端、无追踪；所有新闻均链接到原始报道，请以原始来源为准。</div>';
}
qs('#bAlgo').onclick=function(){qs('#modalBox').innerHTML=algoHtml();qs('#modal').classList.add('on')};
qs('#bHelp').onclick=function(){qs('#modalBox').innerHTML=helpHtml();qs('#modal').classList.add('on')};
qs('#modal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('on')});

/* ==================================================== 实时刷新（USGS） */
function toast(msg,ms){
  var t=qs('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},ms||3200);
}
qs('#bLive').onclick=function(){
  var btn=this;btn.textContent='刷新中…';btn.disabled=true;
  var since=new Date(Date.now()-3*86400000).toISOString().slice(0,10);
  fetch('https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=4.5&starttime='+since+'&orderby=time&limit=200')
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(j){
      var added=0;
      (j.features||[]).forEach(function(f){
        var p=f.properties,g=f.geometry;
        if(!p||!g||!(p.mag>=5.0||(p.sig||0)>=500||(p.felt||0)>=20))return;
        var id='q'+String(p.ids||p.code||'').replace(/[^a-z0-9]/gi,'').slice(0,18);
        if(ST.byId[id])return;
        var reviewed=p.status==='reviewed';
        var it={id:id,origin:'usgs',cat:'quake',t:p.time,tStart:p.time,tEnd:p.time,tp:'second',
          lat:g.coordinates[1],lon:g.coordinates[0],rKm:reviewed?3:8,place:p.place||'',locType:'epicentre',
          title:'M '+p.mag.toFixed(1)+' earthquake'+(p.place?' - '+p.place:'')+' (depth '+Math.round(g.coordinates[2])+' km)'+(reviewed?', reviewed solution':', automatic solution'),
          entities:[String(p.place||'').split(/,\s*/).pop(),'Earthquake'],chain:[],
          srcs:[{u:p.url,d:'earthquake.usgs.gov',l:'USGS '+String(p.net||'').toUpperCase()}],
          mag:p.mag,depth:g.coordinates[2],live:true};
        var c=NG.scoreConfidence({sources:it.srcs.map(function(s){return{url:s.u,domain:s.d}}),
          text:it.title,timePrecision:it.tp,locationRadiusKm:it.rKm,relationSupport:{entity:0,chain:0,weak:0,conflict:0}});
        it.conf={total:c.total,lv:c.level,parts:c.parts.map(function(p2){return{k:p2.key,l:p2.label,s:p2.score,m:p2.max,n:p2.note}})};
        ST.items.push(it);ST.byId[it.id]=it;added++;
      });
      if(added){
        ST.items.sort(function(a,b){return a.t-b.t});
        T1=Math.max(T1,ST.items[ST.items.length-1].t);
        if(ST.win.b>=T1-3600000)ST.win.b=T1;
        recomputeRelations();
        buildPanels();syncOpts();drawTimeline();updateWinText();dirty=true;
        toast('实时刷新完成：新增 '+added+' 条 USGS 地震，并已重算关联与置信度');
      } else toast('实时刷新完成：没有新的地震事件（内置快照已是最新）');
    })
    .catch(function(e){toast('实时源不可用（'+e.message+'）：仍在使用内置离线快照',4200)})
    .then(function(){btn.textContent='实时刷新';btn.disabled=false});
};
function recomputeRelations(){
  var rel=NG.inferRelations(ST.items.map(function(it){
    return {id:it.id,t:it.t,lat:it.lat,lon:it.lon,category:it.cat,
      entities:(it.entities||[]).concat(it.chain||[]),chain:it.chain||[],title:it.title};
  }),{maxPerNode:6});
  ST.links=rel.links;
  ST.items.forEach(function(it){
    var c=NG.scoreConfidence({sources:it.srcs.map(function(s){return{url:s.u,domain:s.d}}),
      text:it.title,timePrecision:it.tp,locationRadiusKm:it.rKm,relationSupport:rel.support[it.id]});
    it.conf={total:c.total,lv:c.level,parts:c.parts.map(function(p){return{k:p.key,l:p.label,s:p.score,m:p.max,n:p.note}})};
  });
  if(ST.sel)renderDetail();
}

/* ==================================================== 自检 / 探针 */
function selfTest(){
  renderAll();
  var out=[],pass=0,fail=0;
  function ok(name,cond,extra){
    if(cond){pass++;out.push('PASS  '+name)}else{fail++;out.push('FAIL  '+name+(extra?'  <'+extra+'>':''))}
  }
  ok('geo: 陆地环 >200',LAND.length>200,'rings='+LAND.length);
  ok('geo: 海岸线点 >2000',COAST.reduce(function(s,l){return s+l.length},0)>2000);
  var p0=NG.projectLatLon(0,0,0,0,100,100,50);
  ok('proj: (0,0) 居中且可见',Math.abs(p0.x-100)<.01&&Math.abs(p0.y-100)<.01&&p0.visible);
  var p1=NG.projectLatLon(0,180,0,0,100,100,50);
  ok('proj: 对面点不可见',!p1.visible);
  var p2=NG.projectLatLon(35,139,139*D2R,35*D2R,100,100,50);
  ok('proj: yaw=lon,pitch=lat 使目标居中',Math.abs(p2.x-100)<.5&&Math.abs(p2.y-100)<.5);
  ok('data: 新闻 >=100',ST.items.length>=100,'n='+ST.items.length);
  ok('data: 关联 >=30',ST.links.length>=30,'n='+ST.links.length);
  var badCoord=ST.items.filter(function(it){return !(Math.abs(it.lat)<=90&&Math.abs(it.lon)<=180)});
  ok('data: 坐标全部合法',badCoord.length===0,'bad='+badCoord.length);
  var recomputeOk=0,recomputeBad=[];
  ST.items.slice(0,60).forEach(function(it){
    if(!it.rsup)return;
    var c=NG.scoreConfidence({sources:it.srcs.map(function(s){return{url:s.u,domain:s.d}}),
      text:it.title,timePrecision:it.tp,locationRadiusKm:it.rKm,relationSupport:it.rsup});
    if(c.total===it.conf.total&&c.level===it.conf.lv)recomputeOk++;else recomputeBad.push(it.id+':'+c.total+'!='+it.conf.total);
  });
  ok('conf: 页面复算与构建期一致',recomputeBad.length===0&&recomputeOk>20,'ok='+recomputeOk+' bad='+recomputeBad.slice(0,3).join(','));
  var drawn=ST.drawn.length;
  ok('render: 标记已绘制 >20',drawn>20,'drawn='+drawn);
  if(drawn){
    var d0=ST.drawn[drawn-1];
    ok('hit: 命中测试可定位标记',hitTest(d0.x,d0.y)!==null);
  }
  var before=visibleItems().length;
  var saved=ST.cats.conflict;ST.cats.conflict=false;
  var after=visibleItems().length;ST.cats.conflict=saved;
  ok('filter: 关闭分类后数量下降',after<before,before+'->'+after);
  var lum=meanLum();
  ok('canvas: 球体非空白',lum>6,'lum='+lum.toFixed(1));
  var el=qs('#selftest');
  el.style.display='block';
  el.textContent='NEWSGLOBE SELFTEST  '+(fail?'FAIL':'PASS')+'  '+pass+'/'+(pass+fail)+'\n'+out.join('\n');
  document.title=(fail?'SELFTEST FAIL ':'SELFTEST PASS ')+pass+'/'+(pass+fail);
  return {pass:pass,fail:fail};
}
function meanLum(){
  try{
    var d=gctx.getImageData(Math.max(0,Math.floor(CX-R*.6)),Math.max(0,Math.floor(CY-R*.6)),
      Math.min(W,Math.floor(R*1.2))||1,Math.min(H,Math.floor(R*1.2))||1).data;
    var s=0;for(var i=0;i<d.length;i+=4)s+=(d[i]+d[i+1]+d[i+2])/3;
    return s/(d.length/4);
  }catch(e){return -1}
}
function probe(){
  renderAll();
  var info={items:ST.items.length,links:ST.links.length,drawn:ST.drawn.length,arcs:arcCount,
    win:visibleItems().length,lum:Number(meanLum().toFixed(1)),sel:ST.sel?ST.sel.id:null,
    yaw:Math.round(ST.yaw/D2R),pitch:Math.round(ST.pitch/D2R),zoom:Number(ST.zoom.toFixed(2))};
  window.__NG_PROBE__=info;
  document.title='NGPROBE '+JSON.stringify(info);
  return info;
}
window.__NG__={ST:ST,probe:probe,selfTest:selfTest,NG:NG,select:select,flyTo:flyTo,hitTest:hitTest,visibleItems:visibleItems};

/* ==================================================== 工具 */
function disp(it){return (ST.opts.zh&&it&&it.zh)?it.zh:(it?it.title:'')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function trunc(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n-1)+'…':s}

/* ==================================================== 启动 */
window.addEventListener('resize',function(){layout();drawTimeline();dirty=true});
buildTexture();
layout();
buildPanels();
syncOpts();
updateWinText();
drawTimeline();
renderDetail();
if(params.get('sel')&&ST.byId[params.get('sel')]){select(params.get('sel'));}
if(params.has('t')){var tt=Number(params.get('t'));ST.win.a=tt-43200000;ST.win.b=tt+43200000;updateWinText();drawTimeline();}
renderAll();
if(params.get('selftest')==='1')selfTest();
if(params.get('probe')==='1')probe();
if(params.get('live')==='1'){
  var _t=qs('#toast');
  qs('#bLive').click();
  var _n=0,_iv=setInterval(function(){
    _n++;
    if(_t.classList.contains('on')||_n>60){clearInterval(_iv);document.title='LIVE '+_t.textContent;}
  },250);
}
requestAnimationFrame(frame);
})();
</script>
