<script>

/* =============================================================================
 * 00-math.js — 自研线性代数 / 噪声内核（零第三方依赖）
 * 3D 脑功能网络仿真与成瘾病变脑区展示
 * 坐标系：近似 MNI152 解剖坐标（单位 mm；+x 右、+y 前、+z 上）
 * ========================================================================== */
window.AUD = window.AUD || {};
(function (NS) {
  'use strict';

  /* ---------------------------------------------------------------- scalars */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function mix(a, b, t) { return a + (b - a) * t; }
  function smoothstep(e0, e1, x) {
    var t = clamp((x - e0) / (e1 - e0 || 1e-9), 0, 1);
    return t * t * (3 - 2 * t);
  }
  var DEG = Math.PI / 180;

  /* ------------------------------------------------------------------- vec3 */
  var V = {
    add: function (a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; },
    sub: function (a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; },
    scale: function (a, s) { return [a[0] * s, a[1] * s, a[2] * s]; },
    mulv: function (a, b) { return [a[0] * b[0], a[1] * b[1], a[2] * b[2]]; },
    dot: function (a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; },
    cross: function (a, b) {
      return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    },
    len: function (a) { return Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]); },
    dist: function (a, b) {
      var dx = a[0] - b[0], dy = a[1] - b[1], dz = a[2] - b[2];
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    },
    norm: function (a) {
      var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1;
      return [a[0] / l, a[1] / l, a[2] / l];
    },
    lerp: function (a, b, t) { return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]; },

  /* ------------------------------------------------------------------- mat4
   * 列主序（与 WebGL uniformMatrix4fv 直接兼容）
   */

    out = out || new Float32Array(16);
    out[0] = 1; out[1] = 0; out[2] = 0; out[3] = 0;
    out[4] = 0; out[5] = 1; out[6] = 0; out[7] = 0;
    out[8] = 0; out[9] = 0; out[10] = 1; out[11] = 0;

  function m4multiply(a, b, out) {
    out = out || new Float32Array(16);
    var a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3],

      a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

/* =============================================================================
 * 70-main.js — 应用装配：资源上传、逐帧视觉参数解析、拾取、标签、遥测
 * ========================================================================== */
(function (NS) {
  'use strict';
  var M = NS.math, G = NS.geom, A = NS.atlas, C = NS.controls;

  var BG_TOP = M.hexToRgb('#f3f5f7');
  var BG_BOTTOM = M.hexToRgb('#e2e7ec');
  var SHELL_COLOR = M.hexToRgb('#c7d2db');
  var CUBE_COLOR = M.hexToRgb('#7f8c99');
  var GRID_COLOR = M.hexToRgb('#9aa6b2');
  var TARGET_COLOR = M.hexToRgb('#0e7c86');
  var STRUCT_COLORS = {
    cerebellum: M.hexToRgb('#9db0bd'),
    brainstem: M.hexToRgb('#93a3af'),
    callosum: M.hexToRgb('#c4ccd4')
  };

  var CUBE_HALF = 90;

  function showError(msg) {
    var box = document.getElementById('errbox');
    if (!box) { return; }
    box.textContent = '运行时错误：' + msg;
    box.classList.add('on');
  }

  window.addEventListener('error', function (e) {
    showError((e && e.message) ? e.message : '未知错误');
  });

  /* ------------------------------------------------------ 立方体与网格几何 */
  function cubeGeometry(center, half) {
    var c = center, h = half;
    var v = [];
    for (var i = 0; i < 8; i++) {
      v.push([
        c[0] + ((i & 1) ? h : -h),
        c[1] + ((i & 2) ? h : -h),
        c[2] + ((i & 4) ? h : -h)
      ]);
    }
    var e = [
      [0, 1], [2, 3], [4, 5], [6, 7],
      [0, 2], [1, 3], [4, 6], [5, 7],
      [0, 4], [1, 5], [2, 6], [3, 7]
    ];
    var polylines = e.map(function (pair) { return [v[pair[0]], v[pair[1]]]; });
    /* 角标：每个顶点向三个轴方向的短线，强化技术制图观感 */
    var brackets = [];
    var L = h * 0.22;
    for (var k = 0; k < 8; k++) {
      var p = v[k];
      var sx = (k & 1) ? -1 : 1, sy = (k & 2) ? -1 : 1, sz = (k & 4) ? -1 : 1;
      brackets.push([p, [p[0] + sx * L, p[1], p[2]]]);
      brackets.push([p, [p[0], p[1] + sy * L, p[2]]]);
      brackets.push([p, [p[0], p[1], p[2] + sz * L]]);
    }
    return { polylines: polylines, brackets: brackets, corners: v };
  }

  /* 六个面的刻度网格：返回 polylines 与每面的范围索引、面法线 */
  function faceGrids(center, half, divisions) {
    var faces = [], polylines = [], ranges = [];
    var axes = [
      { n: [1, 0, 0], u: [0, 1, 0], w: [0, 0, 1] },
      { n: [0, 1, 0], u: [1, 0, 0], w: [0, 0, 1] },
      { n: [0, 0, 1], u: [1, 0, 0], w: [0, 1, 0] }
    ];
    for (var a = 0; a < 3; a++) {
      for (var s = -1; s <= 1; s += 2) {
        var ax = axes[a];
        var normal = [ax.n[0] * s, ax.n[1] * s, ax.n[2] * s];
        var origin = [
          center[0] + normal[0] * half,
          center[1] + normal[1] * half,
          center[2] + normal[2] * half
        ];
        var start = polylines.length;
        for (var i = 0; i <= divisions; i++) {
          var t = (i / divisions) * 2 - 1;
          /* 沿 u 方向的线 */
          polylines.push([
            [origin[0] + ax.u[0] * t * half - ax.w[0] * half,
              origin[1] + ax.u[1] * t * half - ax.w[1] * half,
              origin[2] + ax.u[2] * t * half - ax.w[2] * half],
            [origin[0] + ax.u[0] * t * half + ax.w[0] * half,
              origin[1] + ax.u[1] * t * half + ax.w[1] * half,
              origin[2] + ax.u[2] * t * half + ax.w[2] * half]
          ]);
          /* 沿 w 方向的线 */
          polylines.push([
            [origin[0] + ax.w[0] * t * half - ax.u[0] * half,
              origin[1] + ax.w[1] * t * half - ax.u[1] * half,
              origin[2] + ax.w[2] * t * half - ax.u[2] * half],
            [origin[0] + ax.w[0] * t * half + ax.u[0] * half,
              origin[1] + ax.w[1] * t * half + ax.u[1] * half,
              origin[2] + ax.w[2] * t * half + ax.u[2] * half]
          ]);
        }
        faces.push({ normal: normal, rangeIdx: ranges.length });
        ranges.push({ start: start, end: polylines.length });
      }
    }
    return { polylines: polylines, faces: faces, ranges: ranges };
  }

  /* ------------------------------------------------------ 视图预设（URL 哈希）
   * 支持把当前视图写成可分享 / 可复现的链接，例如：
   *   #lock=nac_R&networks=1&isolate=1&labels=1&az=118&el=12&zoom=140
   * 键：lock(脑区键或脑区 id)、networks、isolate、labels、all、craving、control、
   *     assoc、shell、cube、grid、flow、nodes、targets、zoom、az、el
   */
  function applyHash(state, cam, ui, model) {
    var h = (window.location.hash || '').replace(/^#/, '');
    if (!h) { return false; }
    var q = {};
    h.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) { q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); }
    });
    function bool(k, target) {
      if (q[k] === undefined) { return; }
      state[target] = (q[k] === '1' || q[k] === 'true');
    }
    bool('networks', 'showNetworks');
    bool('isolate', 'hoverNetworks');
    bool('labels', 'showLabels');
    bool('all', 'showRegionsAll');
    bool('craving', 'groupCraving');
    bool('control', 'groupControl');
    bool('assoc', 'groupAssociated');
    bool('shell', 'showShell');
    bool('cube', 'showCube');
    bool('grid', 'showGrid');
    bool('flow', 'flowAnim');
    bool('nodes', 'showNodes');
    bool('targets', 'showTargets');
    if (q.zoom) { state.zoom = M.clamp(parseFloat(q.zoom) || 100, 25, 300); }
    if (q.az !== undefined) { cam.az = (parseFloat(q.az) || 0) * M.DEG; }
    if (q.el !== undefined) { cam.el = M.clamp((parseFloat(q.el) || 0) * M.DEG, -1.45, 1.45); }
    if (q.lock) {
      var key = q.lock.indexOf('_') > 0 ? q.lock : q.lock + '_R';
      if (model.instances[key]) { state.lockKey = key; }
    }
    ui.syncAll();
    return true;
  }

  /* =============================================================== 启动 */
  function boot() {
    var canvas = document.getElementById('gl');
    var bootEl = document.getElementById('boot');
    var bootMsg = document.getElementById('boot-msg');
    var labelLayer = document.getElementById('labels');

    function setBootMsg(t) { if (bootMsg) { bootMsg.textContent = t; } }

    var renderer;
    try {
      renderer = NS.renderer.create(canvas);
    } catch (e) {
      setBootMsg(e.message);
      showError(e.message);
      return;
    }

    setBootMsg('正在构建解剖网格（脑壳形变 / 皮层分区 / 深部核团）…');

    /* 让浏览器先绘制启动界面，再进行重计算 */
    setTimeout(function () {
      var model;
      try {
        model = NS.model.build(A);
      } catch (e) {
        setBootMsg('模型构建失败：' + e.message);
        showError(e.message);
        return;
      }
      setBootMsg('正在上传 GPU 缓冲…');
      setTimeout(function () {
        try {
          run(canvas, renderer, model, bootEl, labelLayer);
        } catch (e) {
          setBootMsg('初始化失败：' + e.message);
          showError(e.message + (e.stack ? '\n' + e.stack.split('\n')[1] : ''));
        }
      }, 16);
    }, 32);
  }

  /* ============================================================ 主循环 */
  function run(canvas, renderer, model, bootEl, labelLayer) {
    var state = NS.ui.createState();
    var cam = C.createCamera();
    var brainCenter = model.brain.center;

    renderer.uploadSurface('shell', model.shell.packed);
    model.structures.forEach(function (s) { renderer.uploadSurface('st_' + s.id, s.packed); });

    model.order.forEach(function (key) {
      var inst = model.instances[key];
      renderer.uploadSurface('r_' + key, inst.packed);
      if (inst.outline) {
        renderer.uploadLines('o_' + key, NS.renderer.segmentsToPolylines(inst.outline.segments, inst.outline.count));
      }
    });

    /* 网络连线：合并为单一缓冲，逐边索引范围 */
    var edgeLines = renderer.uploadLines('edges', model.edges.map(function (e) { return e.points; }));

    /* 立方体 / 角标 / 网格 */
    var cube = cubeGeometry(brainCenter, CUBE_HALF);
    renderer.uploadLines('cube', cube.polylines);
    renderer.uploadLines('brackets', cube.brackets);
    var grids = faceGrids(brainCenter, CUBE_HALF, 6);
    var gridBuf = renderer.uploadLines('grid', grids.polylines);

    /* 节点与靶区精灵 */

      var inst = model.instances[key];

    });

    nodeList.forEach(function (n, i) { nodeIndex[n.key] = i; });

    var targetList = [], targetIndex = {};
    model.order.forEach(function (key) {
      var inst = model.instances[key];
      if (inst.region.target && inst.region.target.is) {
        targetIndex[key] = targetList.length;
        targetList.push({ p: inst.anchor || inst.centroid, size: 12.5, kind: 1, key: key });
      }

    renderer.uploadSprites('targets', targetList);

    /* ---------------- UI ---------------- */
    var ui = NS.ui.build({
      state: state,
      model: model,
      onChange: function () { dirty = true; },
      onViewPreset: function (p) {

      },
      onResetView: function () { C.resetCamera(cam); dirty = true; },

    /* ---------------- 视口 ---------------- */
    function resize() {

    }
    window.addEventListener('resize', resize);
    resize();

    /* ---------------- 交互绑定 ---------------- */
    C.bindControls(canvas, cam, {

    var lastVisible = {};
    function instanceVisibleForPick(inst) {
      if (!state.regionEnabled[inst.regionId]) { return false; }
      return lastVisible[inst.key] !== undefined ? lastVisible[inst.key] : true;

      var hit = C.pick(model, ray, instanceVisibleForPick);

        labelLayer.appendChild(d);
        labelPool.push(d);
      }
      return labelPool[i];
    }

    function currentRegionId() {
      var key = state.lockKey || (state.hoverHighlight ? state.hoverKey : null) || rowHoverRegion;
      if (!key) { return null; }
      if (model.instances[key]) { return model.instances[key].regionId; }
      return A.regionById[key] ? key : null;   // 来自右侧清单的悬停（传的是 regionId）
    }

    function groupHighlighted(group) {
      if (group === 'craving') { return state.groupCraving; }
      if (group === 'control') { return state.groupControl; }
      return state.groupAssociated;
    }

    function groupSliders(group) {
      if (group === 'craving') { return { a: state.cravingAlpha, b: state.cravingBright }; }
      if (group === 'control') { return { a: state.controlAlpha, b: state.controlBright }; }
      return { a: state.regionAlpha, b: state.regionBright };
    }

    function buildFrame() {
      var curRegion = currentRegionId();
      var curNets = {};
      var coRegions = {};
      if (curRegion) {
        A.regionById[curRegion].networks.forEach(function (nid) {
          if (!state.networkEnabled[nid]) { return; }
          curNets[nid] = true;
          A.networkById[nid].nodes.forEach(function (rid) { coRegions[rid] = true; });
        });
      }

      var items = [];
      var visibleCount = 0;

      /* 脑区实例 */
      for (var i = 0; i < model.order.length; i++) {
        var key = model.order[i];
        var inst = model.instances[key];
        var region = inst.region;
        if (!state.regionEnabled[region.id]) { continue; }
        var gHi = groupHighlighted(region.group);
        var isCur = !!curRegion && region.id === curRegion;
        var inCo = !!coRegions[region.id] && !isCur;
        var visible = state.showRegionsAll || gHi || isCur || inCo;
        if (!visible) { continue; }

        var color = gHi ? M.hexToRgb(A.GROUPS[region.group].color) : M.hexToRgb(region.color);
        var alpha, bright, rim;
        if (isCur && state.hoverHighlight) {
          alpha = state.currentAlpha; bright = state.currentBright; rim = 1.55;
        } else if (gHi) {
          var gs = groupSliders(region.group);
          alpha = gs.a; bright = gs.b; rim = 1.15;
        } else if (inCo) {
          alpha = M.clamp(state.regionAlpha * 1.42 + 0.10, 0, 1);
          bright = state.regionBright * 1.10; rim = 1.30;
        } else {
          alpha = state.regionAlpha; bright = state.regionBright; rim = 0.95;
        }

        /* 解剖深度的不透明度编码：浅层皮层更透，深部核团更实 */
        var layerMul = {
          'cortex-lateral': 0.88, 'cortex-medial': 0.94,
          'cortex-insular': 1.00, 'deep': 1.12, 'brainstem': 1.12
        }[region.layer] || 1.0;
        alpha = M.clamp(alpha * layerMul, 0.02, 1);

        /* 深部核团略降菲涅尔透明度权重，使其看起来更"实"；皮层片层双面渲染 */
        var deep = (region.layer === 'deep' || region.layer === 'brainstem');
        items.push({
          type: 'region', key: key, inst: inst, region: region,
          depth: C.viewDepth(mtx, inst.bsphere.center),
          color: color, alpha: alpha, bright: bright, rim: rim,
          doubleSided: !!inst.doubleSided,
          cull: deep ? 'sorted' : 'both',
          frost: deep ? 0.35 : 0.62,
          fresnelAlpha: deep ? 0.10 : 0.30,
          isCurrent: isCur, groupHi: gHi
        });
        visibleCount++;
      }

      /* 网络连线 */
      var drawAllEdges = state.showNetworks && !(state.hoverNetworks && curRegion);
      var drawCurEdges = (state.showNetworks || state.hoverNetworks) && !!curRegion;
      var curColor = null;
      if (curRegion) {
        var cr = A.regionById[curRegion];
        curColor = groupHighlighted(cr.group) ? M.hexToRgb(A.GROUPS[cr.group].color) : M.hexToRgb(cr.color);
      }
      /* 连线按"当前脑区网络"与"各网络"分组批处理：把 92 次绘制降到 ≤9 次，
       * 组内平均深度用于与脑区一起参与透明排序。 */
      var linkCount = 0;
      var curGroup = { ranges: [], depth: 0, n: 0 };
      var netGroups = {};
      for (var e = 0; e < model.edges.length; e++) {
        var edge = model.edges[e];
        if (!state.networkEnabled[edge.network]) { continue; }
        if (!state.regionEnabled[edge.regionA] || !state.regionEnabled[edge.regionB]) { continue; }
        var isCurEdge = !!curNets[edge.network];
        var d = C.viewDepth(mtx, edge.points[11]);
        if (isCurEdge && drawCurEdges) {
          curGroup.ranges.push(edgeLines.ranges[e]);
          curGroup.depth += d; curGroup.n++;
          linkCount++;
        } else if (drawAllEdges) {
          var gk = edge.network;
          if (!netGroups[gk]) { netGroups[gk] = { ranges: [], depth: 0, n: 0 }; }
          netGroups[gk].ranges.push(edgeLines.ranges[e]);
          netGroups[gk].depth += d; netGroups[gk].n++;
          linkCount++;
        }
      }
      if (curGroup.n) {
        items.push({
          type: 'edgeGroup', ranges: curGroup.ranges, depth: curGroup.depth / curGroup.n,
          color: curColor, alpha: state.currentNetAlpha, bright: state.currentNetBright,
          width: state.lineWidth * 1.30, flow: state.flowAnim ? 1.0 : 0.0, repeat: 1.8
        });
      }
      for (var gid in netGroups) {
        if (!netGroups.hasOwnProperty(gid)) { continue; }
        var grp = netGroups[gid];
        items.push({
          type: 'edgeGroup', ranges: grp.ranges, depth: grp.depth / grp.n,
          color: M.hexToRgb(A.networkById[gid].color),
          alpha: state.netAlpha, bright: state.netBright,
          width: state.lineWidth, flow: state.flowAnim ? 0.55 : 0.0, repeat: 1.5
        });
      }

      /* 解剖参照结构 */
      if (state.showStructures) {
        model.structures.forEach(function (s) {
          items.push({
            type: 'struct', id: s.id, depth: C.viewDepth(mtx, s.bsphere.center),
            color: STRUCT_COLORS[s.id] || [0.65, 0.7, 0.75],
            alpha: 0.30, bright: 1.0, rim: 0.85
          });
        });
      }

      /* 记录本帧可见实例，供拾取过滤使用 */
      lastVisible = {};
      for (var vi = 0; vi < items.length; vi++) {
        if (items[vi].type === 'region') { lastVisible[items[vi].key] = true; }
      }
      for (var oi = 0; oi < model.order.length; oi++) {
        if (lastVisible[model.order[oi]] === undefined) { lastVisible[model.order[oi]] = false; }
      }

      /* 从远到近排序（视空间 z 越小越远） */
      items.sort(function (p, q) { return p.depth - q.depth; });

      return {
        items: items, visibleCount: visibleCount, linkCount: linkCount,
        curRegion: curRegion, coRegions: coRegions,
        isolated: state.showNetworks && state.hoverNetworks && !!curRegion
      };
    }

    /* ---------------- 绘制 ---------------- */
    var time = 0, lastT = 0, fps = 60, fpsAcc = 0, fpsN = 0, lastTelemetry = 0;

    function draw(ts) {
      var dt = lastT ? Math.min(0.1, (ts - lastT) / 1000) : 0.016;
      lastT = ts;
      time += dt;
      if (dt > 0) {
        fpsAcc += 1 / dt; fpsN++;
      }

      if (state.autoRotate) { cam.az += dt * 0.18; dirty = true; }
      if (state.flowAnim && state.showNetworks) { dirty = true; }

      var cssW = window.innerWidth, cssH = window.innerHeight;
      var scale = state.zoom / 100;
      mtx = C.computeMatrices(cam, brainCenter, scale, cssW / cssH, 0);

      var frame = buildFrame();

      renderer.beginFrame();
      renderer.drawBackground(BG_TOP, BG_BOTTOM, 0.42);
      /* 景深范围随缩放联动：脑体前后各留过渡带，恢复远近层次 */
      var radius = 105 * scale;
      renderer.setEnv({
        fogColor: [0.885, 0.905, 0.925],
        fogNear: cam.dist - radius * 0.35,
        fogFar: cam.dist + radius * 1.45
      });

      var base = { mvp: mtx.mvp, model: mtx.model, normalMat: mtx.normalMat, camPos: mtx.camPos };

      /* 立方体框架（远侧） */
      if (state.showCube) {
        renderer.drawLines('cube', {
          mvp: mtx.mvp, color: CUBE_COLOR, alpha: 0.30, bright: 1.0,
          width: 1.0, flow: 0, time: 0
        });
        renderer.drawLines('brackets', {
          mvp: mtx.mvp, color: CUBE_COLOR, alpha: 0.55, bright: 1.0,
          width: 1.6, flow: 0, time: 0
        });
      }

      /* 背面朝向的立方体面网格 */
      if (state.showGrid) {
        var rangesToDraw = [];
        for (var f = 0; f < grids.faces.length; f++) {
          var nw = M.m4transformDir(mtx.model, grids.faces[f].normal);
          if (M.V.dot(M.V.norm(nw), mtx.viewDir) > 0.02) {
            var rg = grids.ranges[grids.faces[f].rangeIdx];
            for (var k = rg.start; k < rg.end; k++) { rangesToDraw.push(gridBuf.ranges[k]); }
          }
        }
        if (rangesToDraw.length) {
          renderer.drawLines('grid', {
            mvp: mtx.mvp, color: GRID_COLOR, alpha: 0.17, bright: 1.0,
            width: 0.8, flow: 0, time: 0, ranges: rangesToDraw
          });
        }
      }

      /* 脑壳背面 */
      if (state.showShell) {
        renderer.drawSurface('shell', {
          mvp: base.mvp, model: base.model, normalMat: base.normalMat, camPos: base.camPos,
          color: SHELL_COLOR, alpha: state.shellAlpha * 0.75, bright: 1.0,
          rim: 1.10, specular: 0.35, fresnelAlpha: 0.62, frost: 0.9,
          doubleSided: false, cull: 'front'
        });
      }

      /* 主体：按深度排序的物件 */
      for (var i = 0; i < frame.items.length; i++) {
        var it = frame.items[i];
        if (it.type === 'region') {
          renderer.drawSurface('r_' + it.key, {
            mvp: base.mvp, model: base.model, normalMat: base.normalMat, camPos: base.camPos,
            color: it.color, alpha: it.alpha, bright: it.bright, rim: it.rim,
            specular: 0.75, fresnelAlpha: it.fresnelAlpha, frost: it.frost,
            doubleSided: it.doubleSided, cull: it.cull
          });
          if (it.inst.outline) {
            renderer.drawLines('o_' + it.key, {
              mvp: mtx.mvp,
              color: [
                Math.min(1, it.color[0] * 1.18 + 0.06),
                Math.min(1, it.color[1] * 1.18 + 0.06),
                Math.min(1, it.color[2] * 1.18 + 0.06)
              ],
              alpha: M.clamp(it.alpha * 1.15 + 0.22, 0, 1),
              bright: it.bright,
              width: it.isCurrent ? state.lineWidth * 1.7 : state.lineWidth * 0.95,
              flow: 0, time: 0
            });
          }
        } else if (it.type === 'edgeGroup') {
          renderer.drawLines('edges', {
            mvp: mtx.mvp, color: it.color, alpha: it.alpha, bright: it.bright,
            width: it.width, flow: it.flow, time: time,
            repeat: it.repeat, ranges: it.ranges
          });
        } else if (it.type === 'struct') {
          renderer.drawSurface('st_' + it.id, {
            mvp: base.mvp, model: base.model, normalMat: base.normalMat, camPos: base.camPos,
            color: it.color, alpha: it.alpha, bright: it.bright, rim: it.rim,
            specular: 0.40, fresnelAlpha: 0.30, frost: 0.55,
            doubleSided: false, cull: 'sorted'
          });
        }
      }

      /* 脑壳正面 */
      if (state.showShell) {
        renderer.drawSurface('shell', {
          mvp: base.mvp, model: base.model, normalMat: base.normalMat, camPos: base.camPos,
          color: SHELL_COLOR, alpha: state.shellAlpha, bright: 1.05,
          rim: 1.45, specular: 1.0, fresnelAlpha: 0.70, frost: 0.9,
          doubleSided: false, cull: 'back'
        });
      }

      /* 立方体近侧描边（叠加一层极淡线条，形成"玻璃箱"包裹感） */
      if (state.showCube) {
        renderer.drawLines('cube', {
          mvp: mtx.mvp, color: CUBE_COLOR, alpha: 0.12, bright: 1.2,
          width: 1.6, flow: 0, time: 0
        });
      }

      /* 网络节点 */
      if (state.showNodes) {
        for (var n = 0; n < frame.items.length; n++) {
          var itn = frame.items[n];
          if (itn.type !== 'region') { continue; }
          var ni = nodeIndex[itn.key];
          if (ni === undefined) { continue; }
          renderer.drawSprites('nodes', {
            mvp: mtx.mvp, color: itn.color,
            alpha: M.clamp(itn.alpha * 0.9 + 0.12, 0, 1),
            scale: itn.isCurrent ? 1.35 : 1.0,
            first: ni, pointCount: 1
          });
        }
      }

      /* 刺激靶区导航标记 */
      if (state.showTargets) {
        for (var t2 = 0; t2 < frame.items.length; t2++) {
          var itt = frame.items[t2];
          if (itt.type !== 'region') { continue; }
          var ti = targetIndex[itt.key];
          if (ti === undefined) { continue; }
          renderer.drawSprites('targets', {
            mvp: mtx.mvp, color: TARGET_COLOR,
            alpha: itt.isCurrent ? 0.95 : 0.62,
            scale: itt.isCurrent ? 1.25 : 1.0,
            first: ti, pointCount: 1
          });
        }
      }

      /* ---------------- 标签 ---------------- */
      var labelN = 0;
      var placed = [];
      var labelCandidates = [];
      for (var L = 0; L < frame.items.length; L++) {
        var it0 = frame.items[L];
        if (it0.type !== 'region') { continue; }
        if (!(state.showLabels || it0.isCurrent)) { continue; }
        labelCandidates.push(it0);
      }
      /* 当前脑区最高优先，其余按近→远（depth 越大越近） */
      labelCandidates.sort(function (p, q) {
        if (p.isCurrent !== q.isCurrent) { return p.isCurrent ? -1 : 1; }
        return q.depth - p.depth;
      });
      for (var L2 = 0; L2 < labelCandidates.length; L2++) {
        var itl = labelCandidates[L2];
        var sp = C.projectToScreen(mtx, itl.inst.anchor || itl.inst.centroid, cssW, cssH);
        if (!sp) { continue; }
        var txt = itl.region.abbr + (itl.inst.side === 'M' ? '' : (itl.inst.side === 'L' ? ' 左' : ' 右'));
        /* 中日韩字符按 12px 估宽、拉丁按 6.8px，避免低估宽度导致标签压叠 */
        var wPx = 24, hPx = 18;
        for (var ci = 0; ci < txt.length; ci++) {
          wPx += /[\u2e80-\u9fff\uff00-\uffef]/.test(txt.charAt(ci)) ? 12.0 : 6.8;
        }
        var x1 = sp.x - wPx / 2, y1 = sp.y - 14 - hPx / 2, x2 = x1 + wPx, y2 = y1 + hPx;
        var clash = false;
        if (!itl.isCurrent) {
          for (var pz = 0; pz < placed.length; pz++) {
            var r0 = placed[pz];
            if (x1 < r0[2] && x2 > r0[0] && y1 < r0[3] && y2 > r0[1]) { clash = true; break; }
          }
        }
        if (clash) { continue; }
        placed.push([x1, y1, x2, y2]);
        var d = getLabel(labelN++);
        d.className = 'lab' + (itl.isCurrent ? ' cur' : '');
        d.style.left = sp.x.toFixed(1) + 'px';
        d.style.top = (sp.y - 14).toFixed(1) + 'px';
        d.innerHTML = '';
        var dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = M.rgbToHex(itl.color);
        d.appendChild(dot);
        d.appendChild(document.createTextNode(txt));
        d.style.display = '';
      }
      for (var q = labelN; q < labelPool.length; q++) { labelPool[q].style.display = 'none'; }

      /* ---------------- 面板同步 ---------------- */
      var curKey = state.lockKey || state.hoverKey;
      var curInst = curKey ? model.instances[curKey] : null;
      if (!curInst && frame.curRegion) {
        curInst = model.instances[frame.curRegion + '_R'] || model.instances[frame.curRegion + '_M'];
      }
      if (curInst) {
        ui.updateCurrent({
          region: curInst.region, side: curInst.side, centroid: curInst.centroid,
          area: curInst.area, volume: curInst.volume,
          locked: !!state.lockKey
        });
        ui.markCurrentRow(curInst.regionId);
      } else {
        ui.updateCurrent(null);
        ui.markCurrentRow(null);
      }

      if (ts - lastTelemetry > 220) {
        lastTelemetry = ts;
        fps = fpsN ? fpsAcc / fpsN : 60;
        fpsAcc = 0; fpsN = 0;
        ui.updateTelemetry({
          az: ((cam.az / M.DEG) % 360 + 360) % 360,
          el: cam.el / M.DEG,
          zoom: state.zoom,
          dist: cam.dist / (state.zoom / 100),
          visibleRegions: frame.visibleCount,
          totalRegions: model.order.length,
          links: frame.linkCount,
          isolated: frame.isolated,
          triangles: renderer.stats.triangles,
          drawCalls: renderer.stats.drawCalls,
          fps: fps
        });
      }

      requestAnimationFrame(draw);
    }

    /* ---------------- 拾取管线自检（#selftest=1） ----------------
     * 对每个脑区实例：质心投影到屏幕 → 由该像素反投射射线 → 检查是否命中几何。
     * 用于在无法交互的环境（如无头截图）中验证矩阵、反投影与三角求交的正确性。
     */
    function runPickSelfTest() {
      var cw = window.innerWidth, ch = window.innerHeight;
      var total = 0, hits = 0, exact = 0, offscreen = 0, missed = [];
      for (var i = 0; i < model.order.length; i++) {
        var inst = model.instances[model.order[i]];
        var sp = C.projectToScreen(mtx, inst.anchor || inst.centroid, cw, ch);
        if (!sp || sp.x < 0 || sp.y < 0 || sp.x > cw || sp.y > ch) { offscreen++; continue; }
        total++;
        var ray = C.screenRay(mtx, sp.x, sp.y, cw, ch);
        var hit = C.pick(model, ray, function () { return true; });
        if (hit) {
          hits++;
          if (hit.regionId === inst.regionId) { exact++; }
        } else {
          missed.push(inst.key);
        }
      }
      var box = document.getElementById('errbox');
      if (box) {
        box.className = 'on diag';
        box.textContent = '拾取自检 · 参与实例 ' + total + '（视野外 ' + offscreen + '）'
          + ' · 命中几何 ' + hits + ' · 与质心同脑区 ' + exact
          + ' · 结论 ' + (hits === total ? '通过' : '未命中 ' + missed.join(','))
          + '（"同脑区"计数偏低属正常：拾取按最前表面返回，深部核团常被半透明皮层面片遮在其后）';
      }
    }

    /* 首帧后隐藏启动遮罩 */
    requestAnimationFrame(function (ts) {
      draw(ts);
      if (/(^|&)selftest=1/.test((window.location.hash || '').replace(/^#/, ''))) {
        setTimeout(runPickSelfTest, 80);
      }
      if (bootEl) {
        bootEl.classList.add('done');
        setTimeout(function () { bootEl.style.display = 'none'; }, 400);
      }
    });

    NS.app = {
      state: state, cam: cam, model: model, renderer: renderer, ui: ui,
      onContextLost: function () { showError('WebGL 上下文丢失，请刷新页面。'); }
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.AUD);

</script>
</body>
</html>
