    depth: Game.depth || 0, biome: (Game.biome && Game.biome.name) || "海面",
    inside: !!Game.P.inside, temp: Math.round(M.lerp(21, 4, M.sat((Game.depth || 0) / 90)) + ((Game.biome && Game.biome.key === "rift") ? 28 : 0)),
    pressureLimit: Game.depthLimit(), overPressure: !!Game.overPressure,
    hotbar: hot, sel: P0.sel, inv,
    suits: { name: P0.equip.suit ? C.item(P0.equip.suit).name : "无防护服", list: suitList },
    target: tgt, scan: { active: Game.scan.active, progress: Game.scan.progress, name: Game.scan.name },
    recipes: recipeViews(Boot.machine), blueprints: bps, databank: bank,
    objective: objectiveState(), warn, msgs: Game.msgs,
    seaglide: !!(Game.held() && Game.held().glide), light: !!P0.light, hint,
  };
}

// ---------------- 界面钩子 ----------------
const hooks = {
  newGame(seed) {
    const s = (typeof seed === "string" && seed.trim()) ? hashStr(seed.trim()) : (Math.random() * 1e9) | 0;
    startWorld(s, null);
  },
  resume() { if (Game.P) { Boot.screen = "playing"; G.UI.screen("playing"); lock(); } else if (!load()) hooks.newGame(""); },
  toTitle() { Boot.screen = "title"; G.UI.screen("title", { canResume: !!Game.P || hasSave() }); unlock(); },
  craft(id) { Game.craft(id, Boot.machine); },
  selectSlot(i) { Game.P.sel = M.clamp(i | 0, 0, 8); },
  swapSlots(a, b) { Game.swapSlots(a | 0, b | 0); },
  dropSlot(i) { Game.dropSlot(i | 0); },
  eat(i) { Game.eat(i | 0); },
  equip(i) { Game.equipItem(i | 0); },
  closePanel() { Boot.machine = null; Game.uiOpen = false; G.UI.closePanel(); if (Boot.screen === "playing") lock(); },
  option(k, v) {
    if (k === "volume" || k === "master") { Boot.volume = +v; if (G.Audio.setMaster) G.Audio.setMaster(+v); }
    else if (k === "sens" || k === "sensitivity") Boot.sens = 0.0008 + (+v) * 0.004;
    else if (k === "invert" || k === "invertY") Boot.invertY = !!v;
    else if (k === "distance" || k === "radius") Boot.radius = M.clamp(+v | 0, 4, 12);
    else if (k === "quality" || k === "scale") { R.scale = M.clamp(+v || 1, 0.5, 1.5); R.resize(); }
    else if (k === "save") save();
  },
  scan() { input.scan = 1; setTimeout(() => { input.scan = 0; }, 1800); },
  respawn() {
    Game.respawn();
    Boot.screen = "playing"; G.UI.screen("playing"); lock();
    G.UI.subtitle("你在救生舱中醒来。装备还在，深海也还在。", 4200);
  },
  help() { Game.uiOpen = true; G.UI.openPanel("help"); },
  transfer(idx) {
    const m = Boot.lockerPos;
    if (!m) return;
    const box = W.meta_get(m.x, m.y, m.z) || W.meta_set(m.x, m.y, m.z, { items: new Array(27).fill(null) });
    if (!box.items) box.items = new Array(27).fill(null);
    const cell = box.items[idx];
    if (cell) {
      const left = Game.give(cell.id, cell.count);
      if (left <= 0) box.items[idx] = null;
      else cell.count = left;
      Game.sfx("pickup");
    } else {
      const s = Game.P.inv[Game.P.sel];
      if (!s) { G.Ev.emit("toast", { text: "手上没有东西可放入（先用 1-9 选中）", kind: "info" }); return; }
      box.items[idx] = { id: s.id, count: s.count };
      Game.P.inv[Game.P.sel] = null;
      Game.sfx("place");
    }
    G.UI.openPanel("locker", lockerPayload());
  },
};
function lockerPayload() {
  const m = Boot.lockerPos;
  const box = m ? (W.meta_get(m.x, m.y, m.z) || { items: [] }) : { items: [] };
  return { items: (box.items || []).map((s) => slotView(s)), title: "点击柜内物品取出 · 点击空格存入当前选中物品" };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 1;
}

// ---------------- 世界启动 ----------------
function startWorld(seed, data) {
  Game.demo = false;
  Game.godMode = new URLSearchParams(location.search).has("god");
  M.setSeed(seed);
  W.init(seed);
  for (const id in C.BLUEPRINTS) { C.BLUEPRINTS[id].have = 0; C.BLUEPRINTS[id].known = false; }
  Game.ents.length = 0;
  Game.pt.n = 0;
  Game.databank = [];
  Game.dexScanned = {};
  Game.flags = {};
  Game.stats = { mined: 0, crafted: 0, scanned: 0, killed: 0, deepest: 0 };
  Game.won = false; Game.over = false;
  Game.t = 0; Game.dayT = K.DAY * 0.34; Game.day = 1;
  if (data) {
    for (const kv of data.edits || []) W.edits.set(kv[0], kv[1]);
    for (const kv of data.meta || []) W.meta.set(kv[0], kv[1]);
  }
  const sp = G.Struct.spawn;
  Game.newPlayer(sp);
  if (data) {
    const p = data.p, P0 = Game.P;
    P0.x = p.x; P0.y = p.y; P0.z = p.z; P0.yaw = p.yaw; P0.pitch = p.pitch;
    P0.hp = p.hp; P0.o2 = p.o2; P0.food = p.food; P0.hydra = p.hydra;
    P0.inv = (p.inv || []).slice(0, 36); while (P0.inv.length < 36) P0.inv.push(null);
    P0.equip = p.equip || P0.equip; P0.sel = p.sel | 0; P0.light = !!p.light;
    if (p.respawn) P0.respawn = p.respawn;
    Game.dayT = data.dayT || Game.dayT; Game.day = data.day || 1; Game.t = data.t || 0;
    for (const id in data.bps || {}) if (C.BLUEPRINTS[id]) { C.BLUEPRINTS[id].have = data.bps[id].have | 0; C.BLUEPRINTS[id].known = !!data.bps[id].known; }
    Game.dexScanned = data.dex || {}; Game.databank = data.bank || []; Game.stats = data.stats || Game.stats;
    Game.flags = data.flags || {};
  }
  Boot.screen = "loading";
  G.UI.screen("loading");
  G.UI.setProgress(0, "正在生成 4546-B 的海床…");
  loading = { i: 0, total: 0, list: [] };
  const r = 4;
  const ccx = Math.floor(Game.P.x / K.CH), ccz = Math.floor(Game.P.z / K.CH);
  for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) loading.list.push([ccx + dx, ccz + dz, dx * dx + dz * dz]);
  loading.list.sort((a, b) => a[2] - b[2]);
  loading.total = loading.list.length;
  if (!data) {
    introQ = C.STORY.intro.map((t, i) => ({ t: 1.2 + i * 4.4, text: t }));
    introT = 0;
  } else introQ = [];
}
function finishLoading() {
  loading = null;
  // 站到实地上
  const P0 = Game.P;
  let y = Math.floor(P0.y);
  for (let k = 0; k < 26; k++) {
    if (!C.isSolid(W.get(P0.x | 0, y, P0.z | 0)) && !C.isSolid(W.get(P0.x | 0, y + 1, P0.z | 0))) break;
    y++;
  }
  P0.y = y + 0.04;
  Game.updateRoom(true);
  Boot.screen = "playing";
  G.UI.screen("playing");
  Game.fade = 0;
  lock();
  if (G.Audio && G.Audio.init) { G.Audio.init(); G.Audio.setMaster(Boot.volume); }
}

// 标题界面的演示世界（后台静默流式加载，摄影机环绕）
function startDemo() {
  const seed = (Math.random() * 1e9) | 0;
  M.setSeed(seed); W.init(seed);
  Game.ents.length = 0; Game.pt.n = 0;
  Game.databank = []; Game.dexScanned = {}; Game.flags = {};
  Game.demo = true; Game.godMode = true;
  Game.t = 0; Game.dayT = K.DAY * 0.32; Game.day = 1;
  Game.newPlayer(G.Struct.spawn);
  Game.P.y = SEA - 7.5;
  Game.updateRoom(true);
  Boot.demoT = 0;
}

// ---------------- 输入 ----------------
function lock() {
  if (!canvas || !canvas.requestPointerLock || document.pointerLockElement === canvas) return;
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* 需要用户手势，忽略 */ }
}
function unlock() { if (document.exitPointerLock && document.pointerLockElement) document.exitPointerLock(); }
const KEYMAP = {
  KeyW: "forward", ArrowUp: "forward", KeyS: "back", ArrowDown: "back",
  KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right",
  Space: "up", ShiftLeft: "down", ShiftRight: "down", ControlLeft: "sprintKey",
};
function bindInput() {
  window.addEventListener("keydown", (e) => {
    if (e.code === "F5" || e.code === "F12") return;
    const m = KEYMAP[e.code];
    if (m) { input[m] = 1; if (m === "down") input.sprintKey = 1; e.preventDefault(); }
    if (Boot.screen !== "playing") {
      if (e.code === "Escape" && Boot.screen === "paused") hooks.resume();
      return;
    }
    if (e.code === "Escape") {
      if (G.UI.isPanelOpen()) { hooks.closePanel(); return; }
      Boot.screen = "paused"; G.UI.screen("paused"); unlock();
      if (G.Audio.play) G.Audio.play("ui_close");
      return;
    }
    if (e.code === "KeyE") { togglePanel("inventory"); return; }
    if (e.code === "Tab") { e.preventDefault(); togglePanel("pda"); return; }
    if (e.code === "KeyF") { Game.P.light = !Game.P.light; Game.sfx("ui_click"); G.Ev.emit("toast", { text: Game.P.light ? "头灯 开" : "头灯 关", kind: "info" }); return; }
    if (e.code === "KeyR") { input.scan = 1; return; }
    if (e.code === "KeyQ") { Game.dropSlot(Game.P.sel); return; }
    if (e.code === "KeyH") { hooks.help(); return; }
    if (e.code === "F2") { save(); return; }
    if (e.code === "KeyG" && e.altKey) { Boot.debug = !Boot.debug; return; }
    if (e.code.indexOf("Digit") === 0) {
      const n = +e.code.slice(5);
      if (n >= 1 && n <= 9) Game.P.sel = n - 1;
    }
  });
  window.addEventListener("keyup", (e) => {
    const m = KEYMAP[e.code];
    if (m) { input[m] = 0; if (m === "down") input.sprintKey = 0; }
    if (e.code === "KeyR") input.scan = 0;
  });
  window.addEventListener("blur", () => {
    for (const k in input) input[k] = 0;
  });
  document.addEventListener("mousemove", (e) => {
    if (document.pointerLockElement !== canvas || Boot.screen !== "playing") return;
    const P0 = Game.P;
    P0.yaw -= e.movementX * Boot.sens;
    P0.pitch -= (Boot.invertY ? -1 : 1) * e.movementY * Boot.sens;
    P0.pitch = M.clamp(P0.pitch, -1.53, 1.53);
    P0.yaw = M.wrapAngle(P0.yaw);
  });
  canvas.addEventListener("mousedown", (e) => {
    if (Boot.screen !== "playing") return;
    if (document.pointerLockElement !== canvas) { lock(); return; }
    if (e.button === 0) input.mine = 1;
    if (e.button === 2) { useAction(); }
  });
  window.addEventListener("mouseup", (e) => { if (e.button === 0) input.mine = 0; });
  window.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("wheel", (e) => {
    if (Boot.screen !== "playing" || G.UI.isPanelOpen()) return;
    const d = e.deltaY > 0 ? 1 : -1;
    Game.P.sel = (Game.P.sel + d + 9) % 9;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("pointerlockchange", () => {
    if (Boot.screen === "playing" && !document.pointerLockElement && !G.UI.isPanelOpen()) {
      Boot.screen = "paused"; G.UI.screen("paused");
    }
  });
  window.addEventListener("resize", () => R.resize());
}
function togglePanel(name) {
  if (G.UI.isPanelOpen()) { hooks.closePanel(); return; }
  Game.uiOpen = true;
  Boot.machine = null;
  G.UI.openPanel(name, name === "pda" ? { tab: "bp" } : {});
  unlock();
}
function useAction() {
  const it = Game.held();
  if (Game.interact()) return;
  if (it && it.block) { Game.place(); return; }
  if (it && it.scan) { input.scan = 1; setTimeout(() => { input.scan = 0; }, 1500); return; }
  if (it && it.kind === "food") { Game.eat(Game.P.sel); return; }
  Game.swing = 1;
}

// ---------------- 事件 ----------------
G.Ev.on("toast", (m) => { if (G.UI.toast) G.UI.toast(m.text, m.kind || "info"); });
G.Ev.on("unlock", (bp) => {
  G.UI.toast("蓝图解锁：" + bp.name, "good");
  G.UI.subtitle("PDA：已录入新蓝图「" + bp.name + "」，前往制造机查看。", 4200);
});
G.Ev.on("death", (reason) => {
  Boot.screen = "dead";
  G.UI.screen("dead", { reason, stats: Game.stats });
  unlock();
});
G.Ev.on("machine", (m) => {
  const b = C.BLOCKS[W.get(m.x, m.y, m.z)];
  if (!b) return;
  if (b.machine === "bunk") {
    Game.P.respawn = { x: m.x + 0.5, y: m.y + 1.1, z: m.z + 0.5 };
    Game.sleeping = 1.2;
    Game.sfx("machine");
    G.UI.toast("重生点已设定", "good");
    return;
  }
  if (b.machine === "beacon") {
    if (Game.won) return;
    Game.won = true;
    Game.sfx("win");
    Boot.screen = "win";
    G.UI.screen("win", { stats: Game.stats });
    unlock();
    return;
  }
  Game.uiOpen = true;
  Boot.machine = b.machine === "smelter" ? "smelter" : (b.machine === "fabricator" ? "fabricator" : null);
  if (b.machine === "locker") {
    Boot.lockerPos = { x: m.x, y: m.y, z: m.z };
    G.UI.openPanel("locker", lockerPayload());
  } else {
    G.UI.openPanel(b.machine === "smelter" ? "smelter" : "fabricator", { title: b.name });
  }
  unlock();
  Game.sfx("ui_open");
});
G.Ev.on("placed", (key) => {
  if (key === "beacon") { Game.flags.beacon = true; G.UI.subtitle("信标已就位。启动它，让整个星系听见这片海。", 5200); }
});

// ---------------- 主循环 ----------------
function loop(now) {
  requestAnimationFrame(loop);
  const t = now * 0.001;
  let dt = lastT ? t - lastT : 0.016;
  lastT = t;
  if (dt > 0.1) dt = 0.1;
  frames++; fpsT += dt;
  if (fpsT > 0.5) { Boot.fps = frames / fpsT; frames = 0; fpsT = 0; }

  if (loading) {
    const t0 = performance.now();
    while (loading.i < loading.list.length && performance.now() - t0 < 22) {
      const c = loading.list[loading.i++];
      W.ensure(c[0], c[1]);
    }
    G.UI.setProgress(loading.i / loading.total, loading.i < loading.total ? "正在生成 4546-B 的海床…" : "正在校准生命维持系统…");
    if (loading.i >= loading.list.length) {
      R.stream(Game.P.x, Game.P.z, 3, 60);
      finishLoading();
    }
    return;
  }
  if (!Game.P) return;

  // 标题/暂停界面：演示镜头
  if (Game.demo && Boot.screen !== "playing") {
    Boot.demoT = (Boot.demoT || 0) + dt;
    R.stream(Game.P.x, Game.P.z, 4, 9);
    Game.update(dt * 0.6, {});
    const c = G.Struct.spawn, a = Boot.demoT * 0.055;
    const P0 = Game.P;
    P0.x = c.x + Math.cos(a) * 15; P0.z = c.z + Math.sin(a) * 15;
    P0.y = SEA - 6.5 + Math.sin(Boot.demoT * 0.14) * 1.6;
    P0.vx = P0.vy = P0.vz = 0;
    P0.yaw = -a + Math.PI * 0.5; P0.pitch = -0.16;
    const scene0 = Game.buildScene();
    scene0.sel = null;
    R.render(scene0);
    if (G.UI.update) G.UI.update(buildState());
    return;
  }
  Game.uiOpen = G.UI.isPanelOpen();
  const playing = Boot.screen === "playing";
  if (playing) {
    if (Game.sleeping) {
      Game.sleeping -= dt;
      Game.fade = M.clamp(Game.sleeping > 0.6 ? (1.2 - Game.sleeping) / 0.6 : Game.sleeping / 0.6, 0, 1);
      Game.fade = 1 - Game.fade;
      if (Game.sleeping <= 0) {
        Game.sleeping = 0; Game.fade = 1;
        Game.dayT = K.DAY * 0.2; Game.day++;
        Game.P.hp = Math.min(Game.P.hpMax, Game.P.hp + 45);
        Game.P.o2 = Game.o2Max();
        G.UI.subtitle("新的一天。海面上有光。", 3800);
        save();
      }
    } else Game.fade = M.damp(Game.fade, 1, 3, dt);
    Game.update(dt, Game.uiOpen ? {} : input);
    // 目标里程碑
    if (Game.room.sealed) {
      Game.flags.sealed = true;
      if (!Game.P.headUnder && Game.P.y < SEA) Game.flags.breathed = true;
      if (Game.P.o2 >= Game.o2Max() - 0.5) Game.flags.breathed = true;
    }
    Boot.saveT = (Boot.saveT || 0) + dt;
    if (Boot.saveT > 45) { Boot.saveT = 0; save(); }
    // 剧情字幕
    if (introQ.length) {
      introT += dt;
      while (introQ.length && introT >= introQ[0].t) { G.UI.subtitle(introQ.shift().text, 4200); }
    }
  }

  // 环境音
  Boot.envT = (Boot.envT || 0) + dt;
  if (Boot.envT > 0.2 && G.Audio.setEnv) {
    Boot.envT = 0;
    G.Audio.setEnv({
      depth: Game.depth || 0, inside: !!Game.P.inside, night: Game.night || 0,
      biome: (Game.biome && Game.biome.key) || "shallow",
      speed: Math.hypot(Game.P.vx, Game.P.vy, Game.P.vz),
    });
  }
  if (G.Audio.tick) G.Audio.tick(dt);
  if (G.Audio.loop) G.Audio.loop("seaglide", Game.P.glide > 0.45, { vol: 0.5 });

  // 自适应画质：一次性降档，保证弱机也能玩（设置面板可再手调）
  if (playing && !Boot.perfDone && !Boot.diagMode) {
    Boot.perfT = (Boot.perfT || 0) + dt;
    if (Boot.perfT > 5) {
      Boot.perfT = 0;
      if (Boot.fps < 26) {
        Boot.perfDone = true;
        R.scale = 0.74; R.resize();
        Boot.radius = Math.max(5, Boot.radius - 2);
        G.UI.toast("检测到帧率偏低，已自动降低渲染精度（设置里可调回）", "info");
      } else if (Boot.fps > 50) Boot.perfDone = true;
    }
  }
  R.stream(Game.P.x, Game.P.z, Boot.radius, playing ? 6 : 12);
  const scene = Game.buildScene();
  R.render(scene);
  if (G.UI.update) G.UI.update(buildState());
}

// ---------------- 启动 ----------------
function main() {
  canvas = document.getElementById("gl");
  try {
    R.init(canvas);
  } catch (e) {
    document.body.innerHTML = '<div style="color:#cfe;font:16px system-ui;padding:40px;line-height:1.8">' +
      "无法启动渲染器：" + e.message + "<br>请使用支持 WebGL2 的浏览器（Chrome / Edge / Firefox 新版）。</div>";
    return;
  }
  const atlas = G.Atlas.build(C.TILES);
  R.setAtlas(atlas);
  G.UI.init(hooks);
  bindInput();
  G.UI.screen("title", { canResume: hasSave() });
  Boot.screen = "title";
  startDemo();
  const kick = () => { if (G.Audio.init) { G.Audio.init(); G.Audio.setMaster(Boot.volume); } window.removeEventListener("pointerdown", kick); };
  window.addEventListener("pointerdown", kick);
  requestAnimationFrame(loop);

  // 无头自检通道：?auto=<seed>&god&dive=<米>&diag
  const q = new URLSearchParams(location.search);
  if (q.has("god")) Game.godMode = true;
  if (q.has("diag")) Boot.diagMode = true;
  if (q.has("auto")) {
    setTimeout(() => {
      hooks.newGame(q.get("auto") || "abyss");
      const dive = +(q.get("dive") || 0);
      if (dive > 0) {
        const iv = setInterval(() => {
          if (!Game.P || loading) return;
          clearInterval(iv);
          const P0 = Game.P;
          let y = SEA - dive;
          for (let k = 0; k < 240; k++) { if (!C.isSolid(W.get(P0.x | 0, y | 0, P0.z | 0))) break; y++; }
          P0.y = y; P0.pitch = -0.12;
          W.ensure(P0.x >> 4, P0.z >> 4);
        }, 120);
      }
    }, 80);
  }
  if (q.has("diag")) {
    setInterval(() => {
      const d = G.Boot.diag();
      document.title = "DIAG " + d;
      let el = document.getElementById("diag");
      if (!el) { el = document.createElement("pre"); el.id = "diag"; el.style.cssText = "position:fixed;left:0;top:0;color:#0f0;font:10px monospace;z-index:99;opacity:.01"; document.body.appendChild(el); }
      el.textContent = d;
    }, 500);
  }
}
Boot.hooks = hooks;   // 供调试/自动化调用
Boot.save = save;
Boot.diag = function () {
  const P0 = Game.P;
  return JSON.stringify({
    screen: Boot.screen, fps: +(Boot.fps || 0).toFixed(1), loading: !!loading,
    pos: P0 ? [+P0.x.toFixed(1), +P0.y.toFixed(1), +P0.z.toFixed(1)] : null,
    depth: P0 ? +(Game.depth || 0).toFixed(1) : null,
    biome: Game.biome ? Game.biome.name : "-",
    hp: P0 ? +P0.hp.toFixed(0) : null, o2: P0 ? +P0.o2.toFixed(0) : null,
    room: Game.room ? { sealed: Game.room.sealed, open: Game.room.open, n: Game.room.n } : null,
    chunks: R.meshes.size, quads: R.stats.quads, ents: Game.ents.length, pt: Game.pt.n, boxN: Game.boxN,
    lights: Game.env.lights.n, errs: (window.__ERRS || []).slice(0, 6),
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", main);
else main();

})();

</script>
