/** 生物 loot 引用到的物品 id 词表（供父模块与 G.Content.ITEMS 对齐）。 */
const lootIds = ['fish_raw', 'meat_raw', 'shell', 'carapace', 'bio_gel', 'glow_gland', 'sulfur', 'leviathan_plate'];

const FALLBACK_ID = 'silverlamp';
const DEFAULT_STATE = {
  school: 'swim', grazer: 'graze', ambush: 'lurk', crawler: 'walk', floater: 'drift', leviathan: 'patrol'
};

// ───────────────────────── 刷怪表 ─────────────────────────
/** 该环境可刷的生物；权重按深度带中心度与昼夜偏好加权。 */
function spawnTable(depth, biome, night) {
  const bk = biomeKey(biome);
  const nf = typeof night === 'number' ? clamp(night, 0, 1) : (night ? 1 : 0);
  const out = [];
  for (const id in defs) {
    const d = defs[id];
    if (depth < d.depth[0] || depth > d.depth[1]) continue;
    if (d.biomes && bk) {
      let ok = false;
      for (let i = 0; i < d.biomes.length; i++) if (biomeKey(d.biomes[i]) === bk) { ok = true; break; }
      if (!ok) continue;
    }
    if (d.night === 0 && nf > 0.6) continue;          // 昼行：深夜不刷
    if (d.night === 2 && nf < 0.4) continue;          // 夜行：白天不刷
    // 深度带中心权重更高，边缘衰减到 0.35
    const mid = (d.depth[0] + d.depth[1]) * 0.5, half = Math.max(1, (d.depth[1] - d.depth[0]) * 0.5);
    let w = d.weight * (1 - 0.65 * Math.abs(depth - mid) / half);
    if (d.glow > 0.3) w *= 1 + 0.7 * nf;              // 冷光生物夜间更活跃
    if (d.night === 2) w *= 1 + nf;
    if (w > 0.01) out.push({ id: id, weight: +w.toFixed(3) });
  }
  return out;
}

// ───────────────────────── 实体构造 ─────────────────────────
/** 同种 + 同 24m 网格 → 同一鱼群，保证成批 make 出来的个体天然合群。 */
function flockOf(id, x, z) {
  let h = 2166136261;
  for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = (h * 16777619) >>> 0; }
  h ^= ((Math.floor(x / 24) & 1023) << 10) ^ (Math.floor(z / 24) & 1023);
  return (h >>> 0) % 100000;
}

function make(id, x, y, z, rng) {
  const def = defs[id] || defs[FALLBACK_ID];
  const R = typeof rng === 'function' ? rng : Math.random;
  const yaw = R() * TAU;
  const ent = {
    id: def.id, def: def,
    x: x, y: y, z: z, vx: 0, vy: 0, vz: 0,
    yaw: yaw, pitch: 0, roll: 0, turn: 0,
    hp: def.hp, hpLast: def.hp, state: DEFAULT_STATE[def.behavior] || 'swim',
    t: R() * 60, tSt: 0, target: null,
    home: { x: x, y: y, z: z }, flockId: flockOf(def.id, x, z), scanned: false, dead: false,
    // 个体差异 / 动画驱动
    scale: 0.86 + R() * 0.28, phase: R() * TAU, seed: R(),
    gait: 0.5, jaw: 0, jawT: 0, bite: 0, bell: 0, glowK: 1,
    // 决策缓存
    think: R() * 0.12, dvx: 0, dvy: 0, dvz: 0, spdMul: 1,
    atkCd: 0, stingCd: 0, hurtT: 0, pulse: R() * 1.6, pulseT: 9,
    roarT: 3 + R() * 12, orbit: R() * TAU, spotX: x, spotZ: z, aim: { x: x, y: y, z: z }
  };
  ent.vx = Math.sin(yaw) * def.speed * 0.35;
  ent.vz = Math.cos(yaw) * def.speed * 0.35;
  return ent;
}

// ───────────────────────── ctx 安全包装 ─────────────────────────
const rnd = (ctx) => (typeof ctx.rng === 'function' ? ctx.rng() : Math.random());
const seaOf = (ctx) => (typeof ctx.SEA === 'number' ? ctx.SEA : 118);
function isSolid(ctx, x, y, z) {
  return ctx.solid ? !!ctx.solid(Math.floor(x), Math.floor(y), Math.floor(z)) : false;
}
/** 该列可站立的脚底 y（地面上一格，必要时向上找出实心堆） */
function footY(ctx, x, z) {
  let fy = (ctx.surfaceY ? ctx.surfaceY(Math.floor(x), Math.floor(z)) : 0) + 1;
  for (let i = 0; i < 4 && isSolid(ctx, x, fy, z); i++) fy++;
  return fy;
}
function part(ctx, kind, ent, n) { if (ctx.particle) ctx.particle(kind, ent.x, ent.y, ent.z, n); }
function snd(ctx, name, ent, opt) { if (ctx.sound) ctx.sound(name, ent.x, ent.y, ent.z, opt); }
const radiusOf = (ent) => clamp(ent.def.len * 0.32 * ent.scale, 0.3, 2.6);
const heightOf = (ent) => clamp(ent.def.len * 0.22 * ent.scale, 0.25, 2.0);

function setState(ent, s) { if (ent.state !== s) { ent.state = s; ent.tSt = 0; } }
/** 决策节流：行为只在 period 秒粒度上重算转向，其余帧沿用缓存。 */
function wantThink(ent, dt, ctx, period) {
  ent.think -= dt;
  if (ent.think > 0) return false;
  ent.think = period * (0.7 + rnd(ctx) * 0.6);
  return true;
}
/** 把期望速度写进缓存（方向 + 目标速率）。 */
function desire(ent, dx, dy, dz, spd) {
  const m = hyp3(dx, dy, dz);
  if (m < 1e-5) { ent.dvx = 0; ent.dvy = 0; ent.dvz = 0; return; }
  const k = spd / m;
  ent.dvx = dx * k; ent.dvy = dy * k; ent.dvz = dz * k;
}
/** 每帧把当前速度逼近期望速度。 */
function applyDesire(ent, dt, rate) {
  const k = ease(dt, rate);
  ent.vx += (ent.dvx - ent.vx) * k;
  ent.vy += (ent.dvy - ent.vy) * k;
  ent.vz += (ent.dvz - ent.vz) * k;
}
function playerDist(ent, ctx) {
  const p = ctx.player;
  if (!p) return 1e9;
  return hyp3(p.x - ent.x, p.y - ent.y, p.z - ent.z);
}
const playerVisible = (ctx) => !!(ctx.player && ctx.player.alive !== false && !ctx.player.inside);

/** 前方探路：撞墙前给一个横向 + 竖向的躲避向量（写入 out）。 */
function avoidAhead(ent, ctx, out) {
  out.x = 0; out.y = 0; out.z = 0;
  const s = Math.max(0.25, hyp3(ent.vx, ent.vy, ent.vz));
  const fx = ent.vx / s, fy = ent.vy / s, fz = ent.vz / s;
  const reach = 1.2 + ent.def.len * 0.55;
  if (!isSolid(ctx, ent.x + fx * reach, ent.y + fy * reach, ent.z + fz * reach)) return false;
  // 侧向绕行（右手方向），并优先上抬
  out.x = -fz; out.z = fx; out.y = 0.7;
  if (isSolid(ctx, ent.x + out.x * reach, ent.y + 1, ent.z + out.z * reach)) { out.x = fz; out.z = -fx; }
  return true;
}

// ───────────────────────── 行为：鱼群 boids ─────────────────────────
const AV = { x: 0, y: 0, z: 0 };

function beSchool(ent, dt, ctx) {
  const def = ent.def, sea = seaOf(ctx);
  const radius = def.school ? def.school.radius : 8;
  if (wantThink(ent, dt, ctx, 0.13)) {
    let cx = 0, cy = 0, cz = 0, ax = 0, ay = 0, az = 0, n = 0;
    let sx = 0, sy = 0, sz = 0, tx = 0, ty = 0, tz = 0, threat = 0;
    const list = ctx.nearby ? (ctx.nearby(ent.x, ent.y, ent.z, radius) || []) : [];
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      if (o === ent || o.dead) continue;
      const dx = o.x - ent.x, dy = o.y - ent.y, dz = o.z - ent.z;
      const d = hyp3(dx, dy, dz) + 1e-4;
      if (d > radius) continue;
      if (o.id === ent.id) {
        // 同种即视为同群，同 flockId 权重更高：分批刷出的小群会自然并流
        const wt = o.flockId === ent.flockId ? 1 : 0.5;
        n += wt; cx += dx * wt; cy += dy * wt; cz += dz * wt;
        ax += o.vx * wt; ay += o.vy * wt; az += o.vz * wt;
        const sep = def.len * 2.8;
        if (d < sep) { const k = (sep - d) / (sep * d); sx -= dx * k; sy -= dy * k; sz -= dz * k; }
      } else if (o.def && (o.def.behavior === 'ambush' || o.def.behavior === 'leviathan')) {
        const k = (1 - d / radius) / d; tx -= dx * k; ty -= dy * k; tz -= dz * k;
        threat = Math.max(threat, 1 - d / radius);
      }
    }
    let dx = 0, dy = 0, dz = 0;
    if (n > 0) {
      const inv = 1 / n;
      dx += cx * inv * 0.42; dy += cy * inv * 0.42; dz += cz * inv * 0.42;              // 聚集
      dx += (ax * inv - ent.vx) * 0.30; dy += (ay * inv - ent.vy) * 0.30; dz += (az * inv - ent.vz) * 0.30; // 对齐
    }
    dx += sx * 6.0; dy += sy * 6.0; dz += sz * 6.0;                                     // 分离
    dx += tx * 14; dy += ty * 14; dz += tz * 14;                                        // 躲捕食者
    // 巡游噪声：正弦游走，让每条鱼的航迹不重合
    dx += Math.sin(ent.t * 0.7 + ent.phase) * 0.9;
    dz += Math.cos(ent.t * 0.55 + ent.phase * 1.7) * 0.9;
    dy += Math.sin(ent.t * 0.4 + ent.seed * 6.2) * 0.35;
    // 回巢
    const hx = ent.home.x - ent.x, hz = ent.home.z - ent.z, hd = hyp2(hx, hz);
    if (hd > 16) { const k = clamp((hd - 16) / 20, 0, 1.4); dx += hx / hd * 3 * k; dz += hz / hd * 3 * k; }
    // 躲玩家：动静越大越怕
    const p = ctx.player;
    if (p && playerVisible(ctx)) {
      const px = ent.x - p.x, py = ent.y - p.y, pz = ent.z - p.z, pd = hyp3(px, py, pz) + 1e-4;
      const fear = 6 + 5 * (p.noise || 0) + (p.light ? 1.5 : 0);
      if (pd < fear) {
        const k = (fear - pd) / fear * 9;
        dx += px / pd * k; dy += py / pd * k * 0.6; dz += pz / pd * k;
        threat = Math.max(threat, (fear - pd) / fear);
      }
    }
    if (avoidAhead(ent, ctx, AV)) { dx += AV.x * 6; dy += AV.y * 6; dz += AV.z * 6; }
    ent.spdMul = 1 + threat * 0.9;
    if (threat > 0.55 && rnd(ctx) < 0.25) snd(ctx, 'fish_dart', ent, { vol: 0.35 });
    desire(ent, dx, dy, dz, def.speed * ent.spdMul);
  }
  applyDesire(ent, dt, 3.2);
  if (ent.y > sea - 1.2) ent.vy -= 6 * dt;
  ent.jawT = 0;
}

// ───────────────────────── 行为：贴地食草 ─────────────────────────
function beGrazer(ent, dt, ctx) {
  const def = ent.def;
  const p = ctx.player;
  if (p && playerVisible(ctx) && ent.state !== 'flee' && playerDist(ent, ctx) < 6) {
    setState(ent, 'flee'); ent.hurtT = Math.max(ent.hurtT, 2.6);
  }
  if (ent.state === 'flee') { fleeStep(ent, dt, ctx); return; }

  if (ent.state === 'graze') {
    ent.jawT = 0.55 + 0.45 * Math.sin(ent.t * 7 + ent.phase);   // 啃食：颌部持续开合
    ent.spdMul = 0.25;
    if (wantThink(ent, dt, ctx, 0.4)) {
      desire(ent, Math.sin(ent.t * 0.3 + ent.phase) * 0.6, 0, Math.cos(ent.t * 0.27) * 0.6, def.speed * 0.25);
      if (rnd(ctx) < 0.35) { part(ctx, 'sand', ent, 2); snd(ctx, 'eat', ent, { vol: 0.3 }); }
    }
    if (ent.tSt > 3 + ent.seed * 4) {
      const a = rnd(ctx) * TAU, r = 4 + rnd(ctx) * 8;
      ent.spotX = ent.home.x + Math.cos(a) * r;
      ent.spotZ = ent.home.z + Math.sin(a) * r;
      setState(ent, 'move');
    }
  } else {
    ent.jawT = 0; ent.spdMul = 1;
    const dx = ent.spotX - ent.x, dz = ent.spotZ - ent.z, d = hyp2(dx, dz);
    if (wantThink(ent, dt, ctx, 0.25)) {
      let ax = dx, az = dz, ay = 0;
      if (avoidAhead(ent, ctx, AV)) { ax += AV.x * 8; az += AV.z * 8; ay += AV.y * 4; }
      desire(ent, ax, ay, az, def.speed);
    }
    if (d < 1.6 || ent.tSt > 8) setState(ent, 'graze');
  }
  applyDesire(ent, dt, 2.6);
  hugGround(ent, dt, ctx, 0.35 + heightOf(ent));
}

/** 贴地：把 y 吸附到地面上方 off 米。会预判前方一格台阶提前抬身（否则会被自己的碰撞盒挡住），
 *  抬升幅度封顶一格、升降有速率上限，因此陡壁只会挡住去路而不会引起上下抽动。 */
function hugGround(ent, dt, ctx, off) {
  const sp = hyp2(ent.vx, ent.vz);
  const g0 = footY(ctx, ent.x, ent.z);
  let g = g0;
  if (sp > 0.05) {
    const ahead = footY(ctx, ent.x + ent.vx / sp * 1.2, ent.z + ent.vz / sp * 1.2);
    if (ahead > g0) g = Math.min(ahead, g0 + 1);
  }
  let target = Math.min(g + off, seaOf(ctx) - 0.8);
  if (target > ent.y + 1.6) target = ent.y;
  ent.y += clamp((target - ent.y) * ease(dt, 7), -7 * dt, 2.5 * dt);
  ent.vy = 0;
}

// ───────────────────────── 行为：伏击捕食者 ─────────────────────────
function beAmbush(ent, dt, ctx) {
  const def = ent.def, p = ctx.player;
  const see = playerVisible(ctx);
  const d = playerDist(ent, ctx);
  const detect = (6 + def.len * 2.2) * (p && p.light ? 1.4 : 1) * (0.75 + 0.7 * (p ? (p.noise || 0) : 0));
  // 追击态依赖 player：父若中途撤掉引用（死亡/进舱）就退回冷却
  if (!p && (ent.state === 'telegraph' || ent.state === 'charge')) setState(ent, 'cool');

  switch (ent.state) {
    case 'lurk': {
      ent.spdMul = 0.3; ent.jawT = 0.06;
      if (wantThink(ent, dt, ctx, 0.5)) {
        const drift = def.lurk === 'bottom' ? 0.12 : 0.5;
        desire(ent, Math.sin(ent.t * 0.2 + ent.phase), 0, Math.cos(ent.t * 0.17 + ent.phase), def.speed * drift);
      }
      applyDesire(ent, dt, 1.6);
      if (def.lurk === 'bottom') hugGround(ent, dt, ctx, 0.2 + heightOf(ent));
      if (see && d < detect && ent.atkCd <= 0) {
        setState(ent, 'telegraph');
        snd(ctx, 'fish_dart', ent, { vol: 0.7 });
      }
      break;
    }
    case 'telegraph': {                                  // 后仰蓄势 0.4s：明确的攻击预告
      ent.spdMul = 0.5; ent.jawT = 1;
      const ax = ent.x - p.x, ay = ent.y - p.y, az = ent.z - p.z, m = hyp3(ax, ay, az) + 1e-4;
      desire(ent, ax / m, ay / m * 0.4, az / m, def.speed * 0.45);
      applyDesire(ent, dt, 4);
      // 冲刺目标带一点预判提前量
      ent.aim.x = p.x + (p.vx || 0) * 0.35;
      ent.aim.y = p.y + (p.vy || 0) * 0.35;
      ent.aim.z = p.z + (p.vz || 0) * 0.35;
      if (ent.tSt > 0.4) setState(ent, 'charge');
      break;
    }
    case 'charge': {
      ent.spdMul = 2.6; ent.jawT = 0.85;
      const tgt = see ? p : ent.aim;
      const dx = tgt.x - ent.x, dy = tgt.y - ent.y, dz = tgt.z - ent.z;
      desire(ent, dx, dy, dz, def.speed * 2.6);
      applyDesire(ent, dt, 6);
      if (see && d < 1.0 + def.len * 0.4) bite(ent, ctx, 'bite', 3.0 + rnd(ctx) * 1.5, 6);
      else if (ent.tSt > 1.4 || !see) { ent.atkCd = Math.max(ent.atkCd, 1.6); setState(ent, 'cool'); }
      break;
    }
    default: {                                            // cool：转身离开，进入攻击冷却
      ent.spdMul = 0.8; ent.jawT = 0;
      if (wantThink(ent, dt, ctx, 0.35)) {
        let ax = Math.sin(ent.t + ent.phase), ay = 0.1, az = Math.cos(ent.t * 0.8 + ent.phase);
        if (see) { ax += (ent.x - p.x) * 0.3; az += (ent.z - p.z) * 0.3; }
        desire(ent, ax, ay, az, def.speed * 0.8);
      }
      applyDesire(ent, dt, 2.4);
      if (ent.tSt > 2.2) setState(ent, 'lurk');
      break;
    }
  }
  ent.atkCd -= dt;
}

/** 命中玩家：伤害 + 击退 + 血雾 + 冷却。 */
function bite(ent, ctx, kind, cd, knock) {
  const def = ent.def, p = ctx.player;
  if (ctx.hurtPlayer) ctx.hurtPlayer(def.dmg, kind);
  if (ctx.knockPlayer && p) {
    const dx = p.x - ent.x, dy = p.y - ent.y + 0.3, dz = p.z - ent.z, m = hyp3(dx, dy, dz) + 1e-4;
    ctx.knockPlayer(dx / m * knock, dy / m * knock * 0.6 + 1, dz / m * knock);
  }
  if (ctx.particle && p) ctx.particle('blood', p.x, p.y, p.z, 8);
  snd(ctx, kind === 'ram' ? 'leviathan_roar' : 'hurt', ent, { vol: 0.9 });
  ent.bite = 1; ent.atkCd = cd;
  setState(ent, 'cool');
}

// ───────────────────────── 行为：甲壳爬行 ─────────────────────────
function beCrawler(ent, dt, ctx) {
  const def = ent.def, p = ctx.player;
  const d = playerDist(ent, ctx);
  const see = playerVisible(ctx);

  if (ent.state === 'flee') { fleeStep(ent, dt, ctx); hugGround(ent, dt, ctx, heightOf(ent) + 0.1); return; }

  if (see && d < 1.2 + def.len * 0.5 && ent.atkCd <= 0) {   // 逼太近就夹一下
    ent.jawT = 1;
    bite(ent, ctx, 'pinch', 2.4, 3);
    setState(ent, 'skitter');
  }
  switch (ent.state) {
    case 'skitter': {                                       // 横向快步逃开
      ent.spdMul = 1.8; ent.jawT = 0.7;
      if (wantThink(ent, dt, ctx, 0.3) && p) {
        const dx = ent.x - p.x, dz = ent.z - p.z, m = hyp2(dx, dz) + 1e-4;
        desire(ent, dx / m - dz / m * 0.8, 0, dz / m + dx / m * 0.8, def.speed * 1.8);
      }
      applyDesire(ent, dt, 4);
      if (ent.tSt > 2 && (!see || d > 4)) setState(ent, 'walk');
      break;
    }
    case 'pause': {
      ent.spdMul = 0; ent.jawT = 0.3 + 0.3 * Math.sin(ent.t * 4);
      desire(ent, 0, 0, 0, 0);
      applyDesire(ent, dt, 3);
      if (ent.tSt > 1.2 + ent.seed * 2) setState(ent, 'walk');
      break;
    }
    default: {                                              // walk：沿海底缓行，遇障转向
      ent.spdMul = 1; ent.jawT = 0.1;
      if (wantThink(ent, dt, ctx, 0.45)) {
        let ax = ent.spotX - ent.x, az = ent.spotZ - ent.z;
        if (hyp2(ax, az) < 1.2) {
          const a = rnd(ctx) * TAU, r = 3 + rnd(ctx) * 7;
          ent.spotX = ent.home.x + Math.cos(a) * r;
          ent.spotZ = ent.home.z + Math.sin(a) * r;
          ax = ent.spotX - ent.x; az = ent.spotZ - ent.z;
        }
        if (avoidAhead(ent, ctx, AV)) { ax += AV.x * 9; az += AV.z * 9; }
        if (see && d < 5) { ax += (ent.x - p.x) * 0.5; az += (ent.z - p.z) * 0.5; }
        desire(ent, ax, 0, az, def.speed);
        if (rnd(ctx) < 0.12) setState(ent, 'pause');
      }
      applyDesire(ent, dt, 3);
      break;
    }
  }
  ent.atkCd -= dt;
  hugGround(ent, dt, ctx, heightOf(ent) + 0.1);
}

// ───────────────────────── 行为：冷光漂浮水母 ─────────────────────────
function beFloater(ent, dt, ctx) {
  const def = ent.def, sea = seaOf(ctx);
  const band = def.depth;
  const mid = (band[0] + band[1]) * 0.5;
  const amp = Math.min(7, (band[1] - band[0]) * 0.3);
  const targetY = sea - (mid + Math.sin(ent.t * 0.22 + ent.phase) * amp);   // 缓慢上下起伏

  // 钟体脉动：每次收缩给一次向上/向前的推力
  ent.pulse -= dt; ent.pulseT += dt;
  if (ent.pulse <= 0) {
    ent.pulse = 1.7 + rnd(ctx) * 1.1; ent.pulseT = 0;
    ent.vy += 0.9 + rnd(ctx) * 0.5;
    ent.vx += Math.sin(ent.yaw) * def.speed * 0.7;
    ent.vz += Math.cos(ent.yaw) * def.speed * 0.7;
    if (rnd(ctx) < 0.2) part(ctx, 'bubble', ent, 1);
  }
  ent.bell = Math.max(0, 1 - ent.pulseT / 0.5);
  ent.bell *= ent.bell * (3 - 2 * ent.bell);
  ent.yaw += dt * (0.12 + ent.seed * 0.2);                                  // 缓慢自转

  if (wantThink(ent, dt, ctx, 0.5)) {
    const dy = targetY - ent.y;
    desire(ent,
      Math.sin(ent.t * 0.15 + ent.phase) * 0.7,
      clamp(dy * 0.4, -1, 1),
      Math.cos(ent.t * 0.13 + ent.phase) * 0.7,
      def.speed);
  }
  applyDesire(ent, dt, 0.9);
  ent.vy += (targetY - ent.y) * 0.25 * dt;

  // 触手蜇刺
  ent.stingCd -= dt;
  if (playerVisible(ctx) && ent.stingCd <= 0) {
    const reach = 0.9 + def.len * 0.55;
    if (playerDist(ent, ctx) < reach) {
      if (ctx.hurtPlayer) ctx.hurtPlayer(def.dmg, 'sting');
      const p = ctx.player;
      if (ctx.knockPlayer) ctx.knockPlayer((p.x - ent.x) * 0.6, 0.8, (p.z - ent.z) * 0.6);
      part(ctx, 'spark', ent, 6);
      snd(ctx, 'hurt', ent, { vol: 0.6 });
      ent.stingCd = 2.2;
    }
  }
}

// ───────────────────────── 行为：深渊巨兽 ─────────────────────────
function beLeviathan(ent, dt, ctx) {
  const def = ent.def, p = ctx.player;
  const see = playerVisible(ctx);
  const d = playerDist(ent, ctx);
  ent.atkCd -= dt;
  ent.roarT -= dt;
  if (ent.roarT <= 0) {                                     // 远处低吼，宣示领域
    ent.roarT = 13 + rnd(ctx) * 15;
    snd(ctx, 'leviathan_roar', ent, { vol: ent.state === 'patrol' ? 0.7 : 1 });
  }
  // 同伏击者：锁定态一旦失去 player 引用就脱离
  if (!p && (ent.state === 'hunt' || ent.state === 'wind')) setState(ent, 'cool');

  switch (ent.state) {
    case 'hunt': {
      ent.spdMul = 0.9; ent.jawT = 0.35;
      if (wantThink(ent, dt, ctx, 0.3)) {
        let ax = p.x - ent.x, ay = p.y - ent.y, az = p.z - ent.z;
        if (avoidAhead(ent, ctx, AV)) { ax += AV.x * 24; ay += AV.y * 18; az += AV.z * 24; }
        desire(ent, ax, ay, az, def.speed * 0.9);
      }
      applyDesire(ent, dt, 1.6);
      if (!see || d > 72) setState(ent, 'patrol');
      else if (d < 20 && ent.atkCd <= 0) { setState(ent, 'wind'); snd(ctx, 'leviathan_roar', ent, { vol: 1 }); }
      break;
    }
    case 'wind': {                                          // 蓄势后仰 0.6s，张开外颌
      ent.spdMul = 0.4; ent.jawT = 1;
      const ax = ent.x - p.x, ay = ent.y - p.y, az = ent.z - p.z, m = hyp3(ax, ay, az) + 1e-4;
      desire(ent, ax / m, ay / m * 0.3, az / m, def.speed * 0.35);
      applyDesire(ent, dt, 3);
      ent.aim.x = p.x + (p.vx || 0) * 0.6;
      ent.aim.y = p.y + (p.vy || 0) * 0.6;
      ent.aim.z = p.z + (p.vz || 0) * 0.6;
      if (ent.tSt > 0.6) setState(ent, 'ram');
      break;
    }
    case 'ram': {
      ent.spdMul = 2.2; ent.jawT = 0.9;
      const tgt = see ? p : ent.aim;
      desire(ent, tgt.x - ent.x, tgt.y - ent.y, tgt.z - ent.z, def.speed * 2.2);
      applyDesire(ent, dt, 3.5);
      if (see && d < 3.0 + def.len * 0.22) { bite(ent, ctx, 'ram', 9, 22); ent.state = 'cool'; ent.tSt = 0; }
      else if (ent.tSt > 2.6) { ent.atkCd = Math.max(ent.atkCd, 5); setState(ent, 'cool'); }
      break;
    }
    case 'cool': {
      ent.spdMul = 1; ent.jawT = 0.1;
      if (wantThink(ent, dt, ctx, 0.4)) {
        const ax = ent.x - (p ? p.x : ent.x), az = ent.z - (p ? p.z : ent.z);
        desire(ent, ax + Math.sin(ent.t * 0.3) * 6, -0.2, az + Math.cos(ent.t * 0.3) * 6, def.speed * 0.8);
      }
      applyDesire(ent, dt, 1.2);
      if (ent.tSt > 7) setState(ent, 'patrol');
      break;
    }
    default: {                                              // patrol：绕巢大回旋
      ent.spdMul = 0.6; ent.jawT = 0.05;
      ent.orbit += dt * 0.09;
      if (wantThink(ent, dt, ctx, 0.4)) {
        const r = 34 + Math.sin(ent.t * 0.05 + ent.seed * 5) * 14;
        const tx = ent.home.x + Math.cos(ent.orbit) * r;
        const tz = ent.home.z + Math.sin(ent.orbit) * r;
        const ty = seaOf(ctx) - (def.depth[0] + 12 + Math.sin(ent.t * 0.07) * 8);
        let ax = tx - ent.x, ay = ty - ent.y, az = tz - ent.z;
        if (avoidAhead(ent, ctx, AV)) { ax += AV.x * 26; ay += AV.y * 20; az += AV.z * 26; }
        desire(ent, ax, ay, az, def.speed * 0.6);
      }
      applyDesire(ent, dt, 1.1);
      if (see && d < 46 && ent.atkCd <= 0) setState(ent, 'hunt');
      break;
    }
  }
}

// ───────────────────────── 逃逸 / 受伤 ─────────────────────────
function fleeStep(ent, dt, ctx) {
  const def = ent.def, p = ctx.player;
  ent.spdMul = 1.8; ent.jawT = 0;
  if (wantThink(ent, dt, ctx, 0.2)) {
    let ax = Math.sin(ent.yaw), ay = 0.15, az = Math.cos(ent.yaw);
    if (p) {
      const dx = ent.x - p.x, dy = ent.y - p.y, dz = ent.z - p.z, m = hyp3(dx, dy, dz) + 1e-4;
      ax = dx / m; ay = dy / m * 0.5 + 0.1; az = dz / m;
    }
    if (avoidAhead(ent, ctx, AV)) { ax += AV.x * 8; ay += AV.y * 5; az += AV.z * 8; }
    desire(ent, ax, ay, az, def.speed * 1.8);
  }
  applyDesire(ent, dt, 4.5);
  ent.hurtT -= dt;
  if (ent.hurtT <= 0) setState(ent, DEFAULT_STATE[def.behavior] || 'swim');
}

function onHurt(ent, ctx) {
  const def = ent.def;
  part(ctx, 'blood', ent, 5);
  snd(ctx, 'hurt', ent, { vol: 0.5 });
  ent.hurtT = 3 + rnd(ctx) * 2.5;
  if (def.behavior === 'leviathan') { ent.atkCd = Math.min(ent.atkCd, 0.5); setState(ent, 'hunt'); }
  else if (def.behavior === 'ambush') setState(ent, ent.hp > def.hp * 0.4 ? 'charge' : 'flee');
  else setState(ent, 'flee');
}

/** 供父模块调用的统一伤害入口（直接改 ent.hp 同样有效，update 会补偿反应）。 */
function hurt(ent, dmg, ctx) {
  if (!ent || ent.dead) return false;
  ent.hp -= dmg;
  ent.hpLast = ent.hp;
  const c = ctx || {};
  if (ent.hp <= 0) { ent.hp = 0; ent.dead = true; part(c, 'blood', ent, 14); snd(c, 'hurt', ent, { vol: 0.8 }); return true; }

function injectStyle() {
  if (D.getElementById('ab-ui-css')) return;
  const s = h('style');
  s.id = 'ab-ui-css';
  s.textContent = CSS;
  (D.head || D.documentElement).appendChild(s);
}

/* ---------------------------------------------------------------- 图标 */

function atlasOk() { return !!(G.Atlas && typeof G.Atlas.icon === 'function'); }

function iconNode(it, size) {
  if (it.tile && atlasOk()) {
    try {
      const c = G.Atlas.icon(it.tile, size);
      if (c && c.nodeType === 1) {
        c.classList.add('ab-icv');
        c.style.width = size + 'px';
        c.style.height = size + 'px';
        return c;
      }
    } catch (e) { /* 贴图集未就绪 → 回退 */ }
  }
  const col = str(it.color) || '#7fe9ff';
  const d = h('div', 'ab-icf');
  d.style.width = Math.round(size * 0.82) + 'px';
  d.style.height = Math.round(size * 0.82) + 'px';
  d.style.fontSize = Math.round(size * 0.42) + 'px';
  d.style.background = 'linear-gradient(150deg,' + shade(col, 0.18) + ',' + shade(col, -0.5) + ')';
  d.style.color = lum(col) > 0.58 ? '#08202c' : '#eaf7ff';
  d.textContent = str(it.glyph).slice(0, 1) || str(it.name).slice(0, 1) || '·';
  return d;
}

function itemSig(it, size) {
  if (!it) return 'e';
  return (it.id != null ? it.id : str(it.name)) + '|' + str(it.tile) + '|' + str(it.color) + '|' +
    str(it.glyph) + '|' + size + '|' + (atlasOk() ? 1 : 0);
}

// 把 item 画进一个"图标容器"（带 diff，避免每帧重建 canvas）
function paintIcon(box, it, size) {
  const sig = itemSig(it, size);
  if (box.__sig === sig) return;
  box.__sig = sig;
  box.textContent = '';
  if (it) box.appendChild(iconNode(it, size));
}

function makeSlot(size, keyLabel) {
  const n = h('div', 'ab-slot empty');
  if (size !== 54) { n.style.width = size + 'px'; n.style.height = size + 'px'; }
  n.__ic = h('div', 'ab-ic', n);
  n.__kn = h('div', 'ab-kn', n, keyLabel || '');
  n.__ct = h('div', 'ab-ct', n, '');
  n.__duw = h('div', 'ab-duw', n);
  n.__du = h('div', 'ab-du', n.__duw);
  n.__duw.style.display = 'none';
  n.__size = size;
  return n;
}

function paintSlot(n, it) {
  paintIcon(n.__ic, it, n.__size);
  const c = it ? num(it.count, 1) : 0;
  setTxt(n.__ct, c > 1 ? String(c) : '');
  const d = it && typeof it.dur === 'number' ? clamp01(it.dur) : null;
  setSty(n.__duw, 'display', d == null ? 'none' : 'block');
  if (d != null) {
    setSty(n.__du, 'transform', 'scaleX(' + d.toFixed(3) + ')');
    setSty(n.__du, 'background', d > 0.5 ? '#7ff2b0' : d > 0.22 ? '#ffb454' : '#ff5a6a');
  }
  setCls(n, 'empty', !it);
}

function buildHud() {
  const hud = R.hud = h('div', 'ab-hud', root);
  R.vig = h('div', 'ab-vig', hud);

  // 氧气弧
  const o2 = h('div', 'ab-o2', hud);
  const s = sv('svg', { viewBox: '0 0 420 86', preserveAspectRatio: 'none' }, o2);
  sv('path', { d: O2_ARC, class: 'ab-o2sh' }, s);   // 暗底轨：亮背景下弧线也不会消失
  sv('path', { d: O2_ARC, class: 'ab-o2trk' }, s);
  R.o2f = sv('path', { d: O2_ARC, class: 'ab-o2fill' }, s);
  R.o2ticks = sv('g', null, s);
  const rd = h('div', 'ab-o2rd', o2);
  const pill = h('div', 'ab-o2pill', rd);       // 读数暗底
  R.o2v = h('b', null, pill, '--');
  R.o2m = h('i', null, pill, '');
  h('div', 'ab-o2lb', o2, 'OXYGEN 氧气');

  R.warns = h('div', 'ab-warns', hud);

  // 目标（objective）
  const ob = R.obj = h('div', 'ab-obj ab-glass', hud);
  R.objT = h('h4', null, ob, '');
  R.objS = h('div', null, ob);

  // 状态栏
  const st = h('div', 'ab-stat', hud);
  R.day = h('b', null, st, '第 1 天');
  R.time = h('span', 'dim', st, '06:00');

function vitRow(parent, label, color) {
  const row = h('div', 'ab-vrow', parent);
  h('em', null, row, label);
  const bar = h('div', 'ab-bar', row);
  const bf = h('div', 'ab-bf', bar);
  bf.style.background = 'linear-gradient(90deg,' + shade(color, -0.25) + ',' + color + ')';
  bf.style.boxShadow = '0 0 12px -2px ' + rgba(color, 0.9);
  const val = h('u', null, row, '0');
  return { row: row, fill: bf, val: val };
}

// 弧长需要布局后才能取；首帧起持续尝试，成功后补刻度
function ensureArc() {
  if (o2Ready || !R.o2f) return;
  let L = 0;
  try { L = R.o2f.getTotalLength(); } catch (e) { L = 0; }
  if (!L || !isFinite(L)) return;
  o2Len = L;
  o2Ready = true;
  R.o2f.setAttribute('stroke-dasharray', L.toFixed(2));
  R.o2f.setAttribute('stroke-dashoffset', L.toFixed(2));
  try {
    [0.25, 0.5, 0.75].forEach(function (f) {
      const p = R.o2f.getPointAtLength(L * f);
      sv('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: 1.9, class: 'ab-o2tick' }, R.o2ticks);
    });
  } catch (e) { /* 无 getPointAtLength 就不画刻度 */ }
}

/* ---------------------------------------------------------------- HUD 同步 */

function syncHud(st, now) {
  ensureArc();
  const slow = now - tSlow > 200;
  if (slow) tSlow = now;

  // 氧气
  const o2 = frac(st.o2);
  if (o2Ready) setSty(R.o2f, 'strokeDashoffset', (o2Len * (1 - o2)).toFixed(1));
  setCls(R.o2f, 'lo', o2 < 0.25 && o2 >= 0.1);
  setCls(R.o2f, 'crit', o2 < 0.1);
  setTxt(R.o2v, String(Math.ceil(num(st.o2 && st.o2.cur, 0))));
  setTxt(R.o2m, '/ ' + Math.round(num(st.o2 && st.o2.max, 0)));

  // 生命 / 食物 / 水分
  vitSet(R.rHp, st.hp, 0.25);
  vitSet(R.rFd, st.food, 0.2);
  vitSet(R.rHy, st.hydra, 0.2);

  if (slow) {
    setTxt(R.temp, '温度 ' + Math.round(num(st.temp, 0)) + '°C');
    const suit = st.suits && str(st.suits.name);
    setTxt(R.place, (st.inside ? '气密舱内' : '水下') + ' · ' + Math.round(num(st.pressureLimit, 0)) + 'm' +
      (suit ? ' · ' + suit : ''));
    setTxt(R.day, '第 ' + Math.max(1, Math.round(num(st.day, 1))) + ' 天');
    setTxt(R.time, clock(num(st.timeOfDay, 0)));
    setCls(R.moon, 'on', num(st.night, 0) > 0.5);
    setCls(R.bgL, 'on', !!st.light);
    setCls(R.bgS, 'on', !!st.seaglide);
    setTxt(R.dbi, str(st.biome) || '未知海域');
    syncObjective(st.objective);
    syncWarns(st);
  }
  if (now - tFps > 400) { tFps = now; setTxt(R.fps, Math.round(num(st.fps, 0)) + ' FPS'); }

  // 深度表
  const depth = num(st.depth, 0);
  setSty(R.cur, 'transform', 'translateY(' + (dpct(depth) * DGH).toFixed(1) + 'px)');
  setTxt(R.curV, Math.round(depth) + 'm');
  setCls(R.dep, 'over', !!st.overPressure);
  const pl = num(st.pressureLimit, 0);
  setSty(R.lim, 'display', pl > 0 ? 'block' : 'none');
  if (pl > 0) setSty(R.lim, 'transform', 'translateY(' + (dpct(pl) * DGH).toFixed(1) + 'px)');

  // 准星 / 目标
  const tg = st.target || null;
  const kind = tg && tg.kind ? tg.kind : null;
  setCls(R.br, 'on', !!kind);
  setSty(R.br, 'color', kind === 'creature' ? '#ffb454' : kind === 'machine' ? '#7ff2b0' : '#7fe9ff');
  setCls(R.tgt, 'on', !!kind);
  if (kind) {
    setTxt(R.tgtN, str(tg.name) || '未知目标');
    const hp = typeof tg.hp === 'number' ? clamp01(tg.hp) : null;
    setSty(R.tgtBar, 'display', hp == null ? 'none' : 'block');
    if (hp != null) setSty(R.tgtBf, 'transform', 'scaleX(' + hp.toFixed(3) + ')');
    setTxt(R.tgtS, tg.scannable ? '按 R 扫描' : '');
    setSty(R.tgtS, 'display', tg.scannable ? 'block' : 'none');
  }

  // 扫描进度
  const sc = st.scan || null;
  const on = !!(sc && sc.active);
  setCls(R.scan, 'on', on);
  if (on) {
    const p = clamp01(sc.progress);
    setSty(R.scArc, 'strokeDashoffset', (R.scCirc * (1 - p)).toFixed(1));
    setTxt(R.scPct, Math.round(p * 100) + '%');
    setTxt(R.scNm, '扫描中 · ' + (str(sc.name) || '未知样本'));
  }

  // 交互提示
  const hint = str(st.hint);
  setCls(R.hint, 'on', !!hint);
  if (hint) setTxt(R.hint, hint);

  // 快捷栏
  const hbA = arr(st.hotbar), sel = num(st.sel, 0) | 0;
  if (sel !== R.selLast) { R.selLast = sel; tAct = now; }
  for (let i = 0; i < 9; i++) {
    paintSlot(R.slots[i], hbA[i] || null);
    setCls(R.slots[i], 'sel', i === sel);
  }

  // 亮度：深海里 HUD 不该是画面最亮的东西——常态 .88，告警/目标/交互时才到 1
  setCls(R.hud, 'act', !!R.warnAct || !!cur.panel || !!kind || on || !!hint ||
    !!st.overPressure || o2 < 0.25 || now - tAct < 2400);
}

function vitSet(row, o, lowAt) {
  const f = frac(o);
  setSty(row.fill, 'transform', 'scaleX(' + f.toFixed(3) + ')');
  setTxt(row.val, String(Math.ceil(num(o && o.cur, 0))));
  setCls(row.row, 'low', f > 0 && f < lowAt);
}

function syncObjective(ob) {
  const steps = arr(ob && ob.steps);
  let sig = str(ob && ob.title) + '#';
  for (let i = 0; i < steps.length; i++) sig += str(steps[i] && steps[i].text) + (steps[i] && steps[i].done ? '1' : '0') + '|';
  if (R.objSig === sig) return;
  R.objSig = sig;
  const has = !!(str(ob && ob.title) || steps.length);
  setSty(R.obj, 'display', has ? 'block' : 'none');
  if (!has) return;
  setTxt(R.objT, str(ob.title) || '当前目标');
  R.objS.textContent = '';
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i] || {};
    const row = h('div', 'ab-step' + (s.done ? ' done' : ''), R.objS);
    h('s', null, row, s.done ? '✓' : '○');
    h('span', null, row, str(s.text));
  }
}

function syncWarns(st) {
  const list = arr(st.warn).filter(function (k) { return !!WARNS[k]; });
  if (st.overPressure && list.indexOf('depth') < 0) list.push('depth');
  const sig = list.join(',');
  if (R.warnSig !== sig) {
    R.warnSig = sig;
    R.warns.textContent = '';
    for (let i = 0; i < list.length; i++) {
      const w = WARNS[list[i]];
      h('div', 'ab-chip ' + w[1], R.warns, w[0]);
    }
  }
  // 暗角：取最高优先级
  const bad = list.indexOf('o2') >= 0 || list.indexOf('hp') >= 0;
  const warn = !bad && (list.indexOf('depth') >= 0 || list.indexOf('food') >= 0 || list.indexOf('hydra') >= 0);
  const cool = !bad && !warn && list.indexOf('cold') >= 0;
  R.warnAct = bad || warn || cool;
  setCls(R.vig, 'warn', warn);
  setCls(R.vig, 'cool', cool);
  setCls(R.vig, 'on', bad || warn || cool);
}

/* ---------------------------------------------------------------- 面板框架 */

function makePanel(name) {
  const meta = PANEL_META[name] || [name, ''];
  const m = h('div', 'ab-modal ab-glass');
  m.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  const hd = h('div', 'ab-mhd', m);
  h('h3', null, hd, meta[0]);
  h('span', 'ab-cap', hd, meta[1]);
  const x = h('button', 'ab-x', hd, '✕');
  x.type = 'button';
  x.title = '关闭 (Esc)';
  x.addEventListener('click', requestClose);
  const bd = h('div', 'ab-mbd', m);
  const ft = h('div', 'ab-mft', m);
  const ftL = h('span', null, ft, 'Esc 或点击外部区域关闭');
  const ftR = h('span', null, ft, '');
  R.stage.appendChild(m);
  return { root: m, body: bd, footL: ftL, footR: ftR };
}

function requestClose() {
  if (!cur.panel) return;
  closeInternal();
  call(hooks.closePanel);
}

function closeInternal() {
  for (const k in panels) setCls(panels[k].root, 'on', false);
  if (cur.panel) sfx('ui_close');
  cur.panel = null;
  cur.payload = null;
  pick = -1;
  setCls(R.play, 'on', false);
}

function invSlot(parent, gi) {
  const sl = makeSlot(54, '');
  sl.addEventListener('mousedown', function (e) {
    e.preventDefault();
    if (e.button === 2) { call(hooks.dropSlot, gi); sfx('ui_click'); return; }
    invSel = gi;
    if (pick < 0) { pick = gi; }
    else if (pick === gi) { pick = -1; }
    else { call(hooks.swapSlots, pick, gi); pick = -1; }
    sfx('ui_click');
  });
  sl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  parent.appendChild(sl);
  return sl;
}

function itemAt(st, gi) {
  if (gi < 0) return null;
  return gi < 9 ? (arr(st.hotbar)[gi] || null) : (arr(st.inv)[gi - 9] || null);
}

  const P = panels.inventory;

    paintSlot(P.inv[i], inv[i] || null);

  return P;

function recipesFor(name, st, pl) {
  let list = arr(pl.recipes).length ? arr(pl.recipes) : arr(st.recipes);
  if (name === 'smelter') {
    const f = list.filter(function (r) { return /熔|冶|smelt/i.test(str(r && r.group)); });
    if (f.length) list = f;
  }
  return list;
}

function syncCraft(name, st, pl) {
  const P = panels[name];
  const all = recipesFor(name, st, pl);

  // 分类按钮（集合变化才重建）
  const groups = [];
  for (let i = 0; i < all.length; i++) {
    const g = str(all[i] && all[i].group) || '其他';
    if (groups.indexOf(g) < 0) groups.push(g);
  }
  const gsig = groups.join('|');
  if (P.gsig !== gsig) {
    P.gsig = gsig;
    P.cats.textContent = '';
    P.catBtn = Object.create(null);
    if (groups.indexOf(P.cat) < 0) P.cat = '__all';
    mkCat(P, '__all', '全部配方');
    for (let i = 0; i < groups.length; i++) mkCat(P, groups[i], groups[i]);
  }
  for (const key in P.catBtn) setCls(P.catBtn[key], 'on', key === P.cat);

  const items = all.filter(function (r) { return P.cat === '__all' || (str(r.group) || '其他') === P.cat; });
  setSty(P.emptyMsg, 'display', items.length ? 'none' : 'block');

  let sig = '';
  for (let i = 0; i < items.length; i++) sig += str(items[i].id) + ',';
  if (P.sig !== sig) {
    P.sig = sig;
    P.recs.textContent = '';
    for (let i = 0; i < items.length; i++) {
      const id = str(items[i].id);
      let card = P.cards[id];
      if (!card) card = P.cards[id] = mkCard(P, items[i]);
      P.recs.appendChild(card.root);
    }
  }
  for (let i = 0; i < items.length; i++) updCard(P.cards[str(items[i].id)], items[i]);
  setTxt(P.footR, '共 ' + items.length + ' 项配方');
}

function mkCat(P, key, label) {
  const b = h('button', 'ab-cat', P.cats, label);
  b.type = 'button';
  b.addEventListener('click', function () { P.cat = key; P.sig = null; sfx('ui_click'); if (last) syncPanel(last); });
  P.catBtn[key] = b;
}

function mkCard(P, r) {
  const n = h('button', 'ab-rec');
  n.type = 'button';
  const ic = h('div', 'ab-ic2', n);
  const main = h('div', null, n);
  main.style.flex = '1';
  main.style.minWidth = '0';
  const nm = h('div', 'ab-rnm', main);
  const t = h('span', null, nm, '');
  const badge = h('i', null, nm, '');
  const ds = h('div', 'ab-rds', main, '');
  const costs = h('div', 'ab-costs', main);
  const card = { root: n, ic: ic, t: t, badge: badge, ds: ds, costs: costs, chips: [], r: r };
  n.addEventListener('click', function () {
    const rr = card.r;
    if (!rr) return;
    if (rr.known === false) { toast('尚未解锁该蓝图', 'warn'); sfx('ui_click'); return; }
    if (!rr.craftable) { toast('材料不足：' + missText(rr), 'bad'); sfx('ui_click'); return; }
    call(hooks.craft, rr.id);
    sfx('craft');
  });
  return card;
}

function missText(r) {
  const out = [];
  const cs = arr(r.cost);
  for (let i = 0; i < cs.length; i++) {
    const c = cs[i] || {};
    const need = num(c.count, 0) - num(c.have, 0);
    if (need > 0) out.push((str(c.name) || str(c.id)) + ' ×' + need);
  }
  return out.length ? out.join('、') : '未知材料';
}

function updCard(card, r) {
  if (!card) return;
  card.r = r;
  const out = r.out || {};
  paintIcon(card.ic, { id: out.id, name: str(out.name) || str(r.name), tile: out.tile || r.tile, color: out.color || r.color, glyph: out.glyph }, 40);
  const cnt = num(out.count, 1);
  setTxt(card.t, (str(r.name) || str(out.name) || str(r.id)) + (cnt > 1 ? ' ×' + cnt : ''));
  setTxt(card.ds, str(r.desc));
  setSty(card.ds, 'display', str(r.desc) ? 'block' : 'none');
  const locked = r.known === false;
  setCls(card.root, 'lock', locked);
  setCls(card.root, 'ok', !locked && !!r.craftable);
  setCls(card.root, 'no', !locked && !r.craftable);
  setTxt(card.badge, locked ? '未解锁' : r.craftable ? '可制造' : '缺料');

  const cs = arr(r.cost);
  if (card.chips.length !== cs.length) {
    card.costs.textContent = '';
    card.chips = [];
    for (let i = 0; i < cs.length; i++) card.chips.push(h('span', 'ab-cst', card.costs, ''));
  }
  for (let i = 0; i < cs.length; i++) {
    const c = cs[i] || {}, need = num(c.count, 0), have = num(c.have, 0);
    setTxt(card.chips[i], (str(c.name) || str(c.id)) + ' ' + Math.min(have, need) + '/' + need +
      (have < need ? '（缺' + (need - have) + '）' : ''));
    setCls(card.chips[i], 'miss', have < need);
  }
}

function syncPda(st, pl) {
  const P = panels.pda;
  // 蓝图
  const bps = arr(pl.blueprints).length ? arr(pl.blueprints) : arr(st.blueprints);
  let sig = '';
  for (let i = 0; i < bps.length; i++) sig += str(bps[i] && bps[i].id) + ',';
  if (P.bpSig !== sig) {
    P.bpSig = sig;
    P.bpList.textContent = '';
    if (!bps.length) h('div', 'ab-dms', P.bpList, '还没有任何蓝图碎片，去扫描海底残骸。');
    for (let i = 0; i < bps.length; i++) {
      const id = str(bps[i].id);
      let row = P.bpRows[id];
      if (!row) {
        const n = h('div', 'ab-bp');
        const hh = h('h6', null, n);
        const t = h('span', null, hh, '');
        const badge = h('i', null, hh, '');
        const p = h('p', null, n, '');
        const bar = h('div', 'ab-bar', n);
        const bf = h('div', 'ab-bf', bar);
        bf.style.background = 'linear-gradient(90deg,#2fb4c8,#7fe9ff)';
        const fr = h('div', 'ab-dms', n, '');
        fr.style.textAlign = 'left';
        fr.style.marginTop = '6px';
        row = P.bpRows[id] = { root: n, t: t, badge: badge, p: p, bf: bf, fr: fr };
      }
      P.bpList.appendChild(row.root);
    }
  }
  for (let i = 0; i < bps.length; i++) {
    const b = bps[i] || {}, row = P.bpRows[str(b.id)];
    if (!row) continue;
    setTxt(row.t, str(b.name) || str(b.id));
    setTxt(row.badge, b.known ? '已解锁' : '碎片收集中');
    setCls(row.root, 'known', !!b.known);
    setTxt(row.p, str(b.desc));
    setSty(row.p, 'display', str(b.desc) ? 'block' : 'none');
    const f = b.frag || {}, need = num(f.need, 0), have = num(f.have, 0);
    const pr = b.known ? 1 : need > 0 ? clamp01(have / need) : 0;
    setSty(row.bf, 'transform', 'scaleX(' + pr.toFixed(3) + ')');
    setTxt(row.fr, need > 0 ? '碎片 ' + Math.min(have, need) + ' / ' + need : b.known ? '资料完整' : '尚无碎片');
  }

  // 数据库
  const docs = arr(pl.databank).length ? arr(pl.databank) : arr(st.databank);
  let dsig = '';
  for (let i = 0; i < docs.length; i++) dsig += str(docs[i] && docs[i].id) + ',';
  if (P.dbSig !== dsig) {
    P.dbSig = dsig;
    P.dbList.textContent = '';
    if (!docs.length) h('div', 'ab-dms', P.dbList, '数据库为空。');
    for (let i = 0; i < docs.length; i++) {
      const id = str(docs[i].id);
      let row = P.dbRows[id];
      if (!row) {
        const n = h('button', 'ab-doc');
        n.type = 'button';
        const t = h('span', null, n, '');
        const dot = h('s', null, n);
        n.addEventListener('click', function () { pdaDoc = id; sfx('ui_click'); if (last) syncPda(last, cur.payload || {}); });
        row = P.dbRows[id] = { root: n, t: t, dot: dot };
      }
      P.dbList.appendChild(row.root);
    }
    if (docs.length && (!pdaDoc || !P.dbRows[pdaDoc])) pdaDoc = str(docs[0].id);
  }
  let show = null;
  for (let i = 0; i < docs.length; i++) {
    const d = docs[i] || {}, row = P.dbRows[str(d.id)];
    if (!row) continue;
    setTxt(row.t, str(d.title) || str(d.id));
    setSty(row.dot, 'display', d.unread ? 'block' : 'none');
    setCls(row.root, 'on', str(d.id) === pdaDoc);
    if (str(d.id) === pdaDoc) show = d;
  }
  if (show) {
    setTxt(P.docT, str(show.title) || '未命名条目');
    setTxt(P.docB, str(show.body) || '（无正文）');
  }
  P.bScan.disabled = !(st.target && st.target.scannable) || !!(st.scan && st.scan.active);
  setTxt(P.footR, '蓝图 ' + bps.length + ' · 条目 ' + docs.length);
}

function optRange(P, host, key, label, min, max, step, fmt) {
  const row = h('div', 'ab-orow', host);
  h('label', null, row, label);
  const inp = h('input', null, row);
  inp.type = 'range';
  inp.min = String(min);
  inp.max = String(max);
  inp.step = String(step);
  inp.value = String(opts[key]);
  const out = h('span', 'ab-ov', row, fmt(opts[key]));
  inp.addEventListener('input', function () {
    const v = parseFloat(inp.value);
    opts[key] = v;
    setTxt(out, fmt(v));
    call(hooks.option, key, v);
  });
  inp.addEventListener('keydown', function (e) { e.stopPropagation(); });
  P.ctl[key] = { kind: 'range', inp: inp, out: out, fmt: fmt };
}

function optToggle(P, host, key, label) {
  const row = h('div', 'ab-orow', host);
  h('label', null, row, label);
  const tg = h('div', 'ab-tg' + (opts[key] ? ' on' : ''), row);
  h('s', null, tg);
  tg.addEventListener('click', function () {
    opts[key] = !opts[key];
    tg.classList.toggle('on', opts[key]);
    sfx('ui_click');
    call(hooks.option, key, opts[key]);
  });
  P.ctl[key] = { kind: 'toggle', el: tg };
}

// 打开设置时用宿主给的值刷新控件
function applyOptions(src) {
  const P = panels.options;
  if (!P || !src) return;
  for (const k in P.ctl) {
    if (!(k in src)) continue;
    const c = P.ctl[k];
    if (c.kind === 'range') {
      const v = num(src[k], opts[k]);
      opts[k] = v;
      c.inp.value = String(v);
      setTxt(c.out, c.fmt(v));
    } else {
      opts[k] = !!src[k];
      c.el.classList.toggle('on', opts[k]);
    }
  }
}

function mkScreen(name) {

// 底部小字：外层负责定位，内层 span 是暗底 pill（返回 span，供 setTxt 写文本）
function footNote(host, text) {
  return h('span', null, h('div', 'ab-foot', host), text);
}

// 「继续」的启用/禁用：canResume === false → 禁用；true / 未提供 → 可点
function setResume(on) {
  const b = R.bRes;
  if (!b) return;
  const off = !on;
  if (b.disabled !== off) b.disabled = off;
  b.setAttribute('aria-disabled', off ? 'true' : 'false');
  b.title = off ? '没有可继续的下潜' : '回到上一次的下潜';
}

function seedValue() {
  const v = str(R.seed && R.seed.value).trim();
  if (!v) return undefined;
  const n = Number(v);
  return isFinite(n) && v.length < 16 && /^-?\d+$/.test(v) ? n : v;
}

function statRows(host, data) {
  host.textContent = '';
  if (!data) return;
  const keys = Object.keys(data);
  for (let i = 0; i < keys.length; i++) {
    h('span', null, host, keys[i]);
    h('b', null, host, String(data[keys[i]]));
  }
}

function applyScreen(name, payload) {
  const known = R.scr[name] ? name : (name === 'playing' ? 'playing' : 'title');
  cur.screen = known;
  cur.sPayload = payload || null;
  for (const k in R.scr) setCls(R.scr[k], 'on', k === known);
  setCls(R.hud, 'on', known === 'playing' || known === 'paused');
  if (known !== 'playing' && known !== 'paused') closeInternal();

  const pl = payload || {};
  if (known === 'title') {
    setResume(pl.canResume !== false);
  } else if (known === 'paused') {
    const st = last || {};
    setTxt(R.pauseInfo, '深度 ' + Math.round(num(st.depth, 0)) + ' 米 · ' + (str(st.biome) || '未知海域') +
      ' · 第 ' + Math.max(1, Math.round(num(st.day, 1))) + ' 天');
  } else if (known === 'dead') {
    const st = last || {};
    const reason = str(pl.reason) || (frac(st.o2) <= 0.001 ? '氧气耗尽' : '重伤');
    setTxt(R.deadT, reason);
    setTxt(R.deadS, str(pl.detail) || '黑暗合拢。救生舱的信标仍在闪烁。');
    statRows(R.deadStats, pl.stats || {
      '生存天数': Math.max(1, Math.round(num(st.day, 1))),
      '最深深度': Math.round(num(pl.maxDepth, num(st.depth, 0))) + ' 米',
      '最后海域': str(st.biome) || '未知'
    });
    sfx('drown_warn');
  } else if (known === 'win') {
    setTxt(R.winT, str(pl.title) || '重返海面');
    setTxt(R.winS, str(pl.detail) || '你带着深渊的回声离开了这片海。');
    statRows(R.winStats, pl.stats || null);

  // 环境浮游：在玩家周围维持一层缓慢漂移的微粒
  if (P0 && P0.y < SEA + 2) {
    const want = 190;
    let snow = 0;
    for (let i = 0; i < PT.n; i++) if (PT.kind[i] === PKIND.snow) snow++;
    for (let i = snow; i < want && PT.n < PT.cap; i++) {
      const r = 4 + Math.random() * 26, a = Math.random() * M.TAU;
      Game.particle("snow", P0.x + Math.cos(a) * r, Math.min(SEA - 0.5, P0.y + (Math.random() - 0.4) * 22), P0.z + Math.sin(a) * r, 1, 0.2);
    }
    for (let i = 0; i < PT.n; i++) {
      if (PT.kind[i] !== PKIND.snow) continue;
      const dx = PT.pos[i * 3] - P0.x, dz = PT.pos[i * 3 + 2] - P0.z, dy = PT.pos[i * 3 + 1] - P0.y;

    }

}

const SPAWN_CAP = 64;
function makeCtx(dt) {
  const P0 = Game.P;
  return {
    dt, time: Game.t, night: Game.night, SEA,
    solid: (x, y, z) => solidAt(x, y, z),
    surfaceY: (x, z) => W.surfaceY(x | 0, z | 0),
    player: {
      x: P0.x, y: P0.y + EYE, z: P0.z, vx: P0.vx, vy: P0.vy, vz: P0.vz,
      noise: P0.noise, inside: Game.room.sealed, light: P0.light, alive: !P0.dead,
    },
    hurtPlayer: (d, kind) => { if (!Game.room.sealed) Game.hurt(d, kind || "bite"); },
    knockPlayer: (dx, dy, dz) => { const p = Game.P; p.vx += dx; p.vy += dy; p.vz += dz; Game.shake = Math.min(1, Game.shake + 0.5); },
    particle: (kind, x, y, z, n) => Game.particle(kind === "blood" ? "blood" : kind, x, y, z, n || 3),
    sound: (name, x, y, z, opt) => {
      const P1 = Game.P;
      const o = opt || {};
      if (x !== undefined) {
        const d = M.dist(x - P1.x, y - P1.y, z - P1.z);
        if (d > 60) return;
        o.vol = (o.vol === undefined ? 1 : o.vol) * Math.max(0.05, 1 - d / 60);
      }
      Game.sfx(name, o);
    },
    rng: Math.random,
    nearby: (x, y, z, r) => {
      const out = [], r2 = r * r;
      for (const e of Game.ents) {
        const dx = e.x - x, dy = e.y - y, dz = e.z - z;
        if (dx * dx + dy * dy + dz * dz <= r2) out.push(e);
      }
      return out;
    },
  };
}
function spawnWave() {
  const Cr = G.Creatures;
  if (!Cr || !Cr.spawnTable) return;
  const P0 = Game.P;
  if (Game.ents.length >= SPAWN_CAP) return;
  for (let attempt = 0; attempt < 9 && Game.ents.length < SPAWN_CAP; attempt++) {
    const a = Math.random() * M.TAU, r = 10 + Math.random() * 30;
    const x = P0.x + Math.cos(a) * r, z = P0.z + Math.sin(a) * r;
    const ground = W.surfaceY(x | 0, z | 0);
    if (!ground) continue;
    const top = Math.min(SEA - 1.2, ground + 1 + Math.random() * 16);
    if (top <= ground + 0.6) continue;
    const y = M.lerp(ground + 1.2, top, Math.random());
    if (solidAt(x | 0, y | 0, z | 0)) continue;
    const depth = SEA - y;
    if (depth < 0.5) continue;
    const biome = C.biomeAt(SEA - ground).name;   // 生物模块按中文分区名过滤
    const table = Cr.spawnTable(depth, biome, Game.night);
    if (!table || !table.length) continue;
    const pickItem = M.weighted(table.map((t) => ({ weight: t.weight === undefined ? 1 : t.weight, id: t.id })), Math.random);
    if (!pickItem) continue;
    const def = Cr.defs[pickItem.id];
    if (!def) continue;
    const n = def.school ? M.rangeI(def.school.n[0], def.school.n[1], Math.random) : 1;
    const floorDweller = def.behavior === "crawler" || def.behavior === "grazer";
    for (let i = 0; i < n && Game.ents.length < SPAWN_CAP; i++) {
      const ex = x + (Math.random() - 0.5) * 5, ez = z + (Math.random() - 0.5) * 5;
      const gy = W.surfaceY(ex | 0, ez | 0) || ground;
      const ey = floorDweller ? gy + 1.05
        : M.clamp(y + (Math.random() - 0.5) * 3, ground + 1.1, SEA - 1);
      if (solidAt(ex | 0, ey | 0, ez | 0)) continue;
      const e = Cr.make(pickItem.id, ex, ey, ez, Math.random);
      if (!e) continue;
      Game.ents.push(e);
    }
  }
}
function updateEnts(dt) {
  const Cr = G.Creatures, P0 = Game.P;
  if (!Cr) return;
  const ctx = makeCtx(dt);
  for (let i = Game.ents.length - 1; i >= 0; i--) {
    const e = Game.ents[i];
    const dx = e.x - P0.x, dz = e.z - P0.z, dy = e.y - P0.y;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (e.dead || e.hp <= 0) {
      if (e.killedByPlayer) {
        const loot = e.def.loot || [];
        for (const l of loot) if (Math.random() < (l.p === undefined ? 1 : l.p)) { C.ensureItem(l.id, e.def.name); Game.give(l.id, l.n || 1); }
        Game.particle("blood", e.x, e.y, e.z, 12, 0.8);
        Game.stats.killed++;
      }
      Game.ents.splice(i, 1);
      continue;
    }
    if (d2 > 96 * 96) { Game.ents.splice(i, 1); continue; }
    try { Cr.update(e, dt, ctx); } catch (err) { e.dead = true; }
    // 兜底约束
    if (e.y > SEA - 0.4) { e.y = SEA - 0.4; if (e.vy > 0) e.vy = -0.3; }
    if (e.y < 2) e.y = 2;
  }
}
function pickEntity(ox, oy, oz, dx, dy, dz, maxD) {
  let best = null, bestT = maxD;
  for (const e of Game.ents) {
    const rx = e.x - ox, ry = e.y - oy, rz = e.z - oz;
    const t = rx * dx + ry * dy + rz * dz;
    if (t < 0 || t > bestT) continue;
    const px = rx - dx * t, py = ry - dy * t, pz = rz - dz * t;
    const rad = Math.max(0.45, (e.def.len || 1) * 0.42);
    if (px * px + py * py + pz * pz <= rad * rad) { best = e; bestT = t; }
  }
  return best;
}

const env = {
  time: 0, night: 0,
  sunDir: new Float32Array([0, -1, 0]), sunCol: new Float32Array([1, 1, 1]), skyCol: new Float32Array([0.4, 0.6, 0.8]),
  waterCol: new Float32Array([0.18, 0.7, 0.78]), ext: new Float32Array([0.055, 0.019, 0.012]),
  murk: 1, grade: new Float32Array([1, 1, 1]), indoorAmb: new Float32Array([0.105, 0.088, 0.070]),
  hazeCol: new Float32Array([0.6, 0.78, 0.9]),
  airMin: new Float32Array(3), airMax: new Float32Array(3), airOn: 0,
  lights: { n: 0, pos: new Float32Array(20 * 4), col: new Float32Array(20 * 4) },

Game.env = env;

function lerpArr(out, a, b, t) { for (let i = 0; i < out.length; i++) out[i] = M.lerp(a[i], b[i], t); }
const BIOME_COL = {};
for (const b of C.BIOMES) BIOME_COL[b.key] = { water: M.hex(b.water), amb: M.hex(b.amb) };

function updateEnv(dt) {
  const P0 = Game.P;
  env.time = Game.t;
  const f = (Game.dayT / K.DAY) % 1;
  const a = f * M.TAU - Math.PI * 0.5;
  const sy = Math.sin(a);
  const sx = Math.cos(a) * 0.72, sz = Math.cos(a) * 0.42 + 0.18;
  const L = Math.hypot(sx, sy, sz) || 1;
  env.sunDir[0] = -sx / L; env.sunDir[1] = -sy / L; env.sunDir[2] = -sz / L;
  const night = 1 - M.smoothstep(-0.16, 0.22, sy);
  env.night = night; Game.night = night;
  const dawn = M.smoothstep(0.34, 0.0, Math.abs(sy)) * (1 - night * 0.4);
  const sunI = M.lerp(0.10, 1.25, M.sat(sy * 1.6 + 0.18));
  env.sunCol[0] = sunI * M.lerp(1.0, 1.15, dawn);
  env.sunCol[1] = sunI * M.lerp(0.97, 0.66, dawn);
  env.sunCol[2] = sunI * M.lerp(0.92, 0.42, dawn);
  if (night > 0.5) { env.sunCol[0] = 0.10; env.sunCol[1] = 0.13; env.sunCol[2] = 0.22; }
  const depth = Math.max(0, SEA - (P0.y + EYE));
  Game.depth = depth;
  if (depth > Game.stats.deepest) Game.stats.deepest = depth;
  // 生物群系插值
  const bs = C.BIOMES;
  let bi = 0;
  for (let i = 0; i < bs.length; i++) if (depth >= bs[i].min) bi = i;
  const cur = bs[bi], nxt = bs[Math.min(bs.length - 1, bi + 1)];
  const span = Math.max(1, cur.max - cur.min);
  const t = M.sat((depth - cur.min) / span);
  Game.biome = cur;
  const c1 = BIOME_COL[cur.key], c2 = BIOME_COL[nxt.key];
  lerpArr(env.waterCol, c1.water, c2.water, t * 0.85);
  // 大气霾色：白天偏天空蓝白、黄昏偏暖、夜里压暗
  const hz = M.sat(sy * 1.4 + 0.25);
  env.hazeCol[0] = M.lerp(0.04, M.lerp(0.86, 0.62, hz), M.sat(hz * 1.6 + 0.12));
  env.hazeCol[1] = M.lerp(0.06, M.lerp(0.62, 0.79, hz), M.sat(hz * 1.6 + 0.12));
  env.hazeCol[2] = M.lerp(0.11, M.lerp(0.48, 0.92, hz), M.sat(hz * 1.6 + 0.12));
  const dim = M.lerp(1, 0.28, night);
  for (let i = 0; i < 3; i++) env.waterCol[i] *= dim;
  const amb = [0, 0, 0];
  lerpArr(amb, c1.amb, c2.amb, t * 0.85);
  const ambI = M.lerp(0.16, 0.62, M.sat(sy + 0.25)) * M.lerp(1, 0.66, M.sat(depth / 90)) + 0.075;
  env.skyCol[0] = amb[0] * ambI; env.skyCol[1] = amb[1] * ambI; env.skyCol[2] = amb[2] * ambI;
  const fogD = M.lerp(cur.fog, nxt.fog, t);
  env.murk = M.clamp(62 / fogD, 0.55, 2.6);
  const g = cur.key === "rift" ? [1.28, 1.04, 0.92] : cur.key === "abyss" ? [1.12, 1.2, 1.38]
    : cur.key === "reef" ? [1.02, 0.99, 1.06] : [1.02, 1.01, 0.99];
  lerpArr(env.grade, env.grade, g, M.sat(dt * 2.5));
  // 气密舱
  const room = Game.room;
  const inRoom = room.sealed || room.open;
  env.airOn = inRoom ? 1 : 0;
  if (inRoom) { for (let i = 0; i < 3; i++) { env.airMin[i] = room.min[i]; env.airMax[i] = room.max[i]; } }
  // 点光源
  collectLights();
}
function collectLights() {
  const P0 = Game.P, L = env.lights;
  const cand = [];
  const cx = Math.floor(P0.x / K.CH), cz = Math.floor(P0.z / K.CH);
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const c = W.chunk(cx + dx, cz + dz);
    if (!c || !c.lights) continue;
    const arr = c.lights;
    for (let i = 0; i < arr.length; i += 4) {
      const x = arr[i], y = arr[i + 1], z = arr[i + 2], lv = arr[i + 3];
      const d2 = (x - P0.x) ** 2 + (y - P0.y - EYE) ** 2 + (z - P0.z) ** 2;
      if (d2 > 40 * 40) continue;
      cand.push([d2, x, y, z, lv]);
    }
  }
  cand.sort((a, b) => a[0] - b[0]);
  let n = 0;
  const headOn = P0.light || (Game.held() && Game.held().light && P0.glide > 0.2);
  if (headOn) {
    const e = Game.eye(), d = Game.lookAt();
    const beam = [[0.9, 30, 2.7], [5.5, 22, 1.55], [12.0, 16, 0.75]];   // 三段叠加 = 光锥感
    for (const bm of beam) {
      L.pos[n * 4] = e.x + d[0] * bm[0]; L.pos[n * 4 + 1] = e.y + d[1] * bm[0]; L.pos[n * 4 + 2] = e.z + d[2] * bm[0];
      L.pos[n * 4 + 3] = bm[1];
      L.col[n * 4] = 0.8; L.col[n * 4 + 1] = 0.93; L.col[n * 4 + 2] = 1.0; L.col[n * 4 + 3] = bm[2];
      n++;
    }
  }
  for (let i = 0; i < cand.length && n < 20; i++, n++) {
    const c = cand[i];
    const id = W.get(c[1] | 0, c[2] | 0, c[3] | 0);
    const b = id ? C.BLOCKS[id] : null;
    const tint = b ? M.hex(b.tint) : [1, 1, 1];
    const warm = b && (b.key === "magma" || b.key === "lamp" || b.key === "panel_light" || b.key === "smelter" || b.key === "fabricator");
    L.pos[n * 4] = c[1]; L.pos[n * 4 + 1] = c[2]; L.pos[n * 4 + 2] = c[3];
    L.pos[n * 4 + 3] = 2.8 + c[4] * (warm ? 0.72 : 0.62);
    L.col[n * 4] = warm ? 1.0 : tint[0] * 0.8 + 0.2;
    L.col[n * 4 + 1] = warm ? 0.71 : tint[1] * 0.9 + 0.1;
    L.col[n * 4 + 2] = warm ? 0.42 : 1.0;
    L.col[n * 4 + 3] = (0.12 + (c[4] / 15) * 0.36) * (warm ? 2.1 : 1.0);   // 暖光实体灯是舱内主光
  }
  L.n = n;
}

// ================= 主更新 =================
Game.update = function (dt, input) {
  const P0 = Game.P;
  if (!P0) return;
  Game.t += dt;
  Game.dayT += dt;
  if (Game.dayT > K.DAY) { Game.dayT -= K.DAY; Game.day++; }
  Game.atkCd = Math.max(0, (Game.atkCd || 0) - dt);
  P0.iFrame = Math.max(0, P0.iFrame - dt);
  Game.hurtFx = Math.max(0, Game.hurtFx - dt * 1.6);
  Game.shake = Math.max(0, Game.shake - dt * 2.4);
  Game.swing = Math.max(0, Game.swing - dt * 3.4);
  P0.eatT = Math.max(0, P0.eatT - dt);

  const room = Game.room;
  Game.roomT += dt;
  if (Game.roomT > 0.2) { Game.roomT = 0; Game.updateRoom(false); }

  const feetUnder = P0.y < SEA - 0.02;
  const headUnder = (P0.y + EYE) < SEA - 0.02;
  const dry = room.sealed || room.open;
  P0.inside = room.sealed;
  const swimming = feetUnder && !dry;
  P0.inWater = swimming;
  P0.headUnder = headUnder && !dry;

  // ---- 移动 ----
  const it = Game.held();
  const gliding = !!(it && it.glide) && input.forward && swimming;
  P0.glide = M.damp(P0.glide, gliding ? 1 : 0, 6, dt);
  const onLadder = nearBlock(P0, "ladder");
  let ax = 0, az = 0;
  const cy = Math.cos(P0.yaw), sy2 = Math.sin(P0.yaw);
  if (input.forward) { ax -= sy2; az -= cy; }
  if (input.back) { ax += sy2; az += cy; }
  if (input.left) { ax -= cy; az += sy2; }
  if (input.right) { ax += cy; az -= sy2; }
  const aL = Math.hypot(ax, az);
  if (aL > 0) { ax /= aL; az /= aL; }
  const moving = aL > 0;
  P0.noise = M.damp(P0.noise, moving ? (gliding ? 1 : 0.55) : 0.08, 3, dt);

  if (swimming) {
    let sp = 3.15 * Game.speedMul();
    if (gliding) sp = 8.6;
    const pitchDrive = gliding ? Math.sin(P0.pitch) : 0;
    const dirv = G.Mat4.lookDir(P0.yaw, P0.pitch);
    if (gliding) {
      P0.vx = M.damp(P0.vx, dirv[0] * sp, 3.2, dt);
      P0.vy = M.damp(P0.vy, dirv[1] * sp, 3.2, dt);
      P0.vz = M.damp(P0.vz, dirv[2] * sp, 3.2, dt);
    } else {
      P0.vx = M.damp(P0.vx, ax * sp, 4.5, dt);
      P0.vz = M.damp(P0.vz, az * sp, 4.5, dt);
      let vy = 0;
      const head = P0.y + EYE;
      if (input.up) vy = 3.0 * Game.speedMul();
      else if (input.down) vy = -3.0 * Game.speedMul();
      else if (head > SEA - 1.7) vy = M.clamp((SEA + 0.10 - head) * 2.4, -0.55, 1.5);  // 浮出水面换气
      else vy = -0.24;                                 // 轻微负浮力，静止缓慢下沉
      P0.vy = M.damp(P0.vy, vy + pitchDrive, 3.4, dt);
    }
    if (P0.y + EYE > SEA + 0.45 && P0.vy > 0) P0.vy *= 0.4;   // 不要飞出水面
    if (moving && Math.random() < dt * 0.7) Game.particle("bubble", P0.x, P0.y + 0.9, P0.z, 1, 0.5);
  } else if (onLadder) {
    P0.vx = M.damp(P0.vx, ax * 2.4, 8, dt);
    P0.vz = M.damp(P0.vz, az * 2.4, 8, dt);
    P0.vy = input.up ? 3.4 : (input.down ? -3.4 : (moving ? 2.2 : -0.4));
  } else {
    const sp = input.sprintKey && moving ? 5.9 : 4.35;
    P0.vx = M.damp(P0.vx, ax * sp, 11, dt);
    P0.vz = M.damp(P0.vz, az * sp, 11, dt);
    P0.vy -= 21.5 * dt;
    if (input.up && P0.onGround) { P0.vy = 7.4; P0.onGround = false; Game.sfx("step", { rate: 0.8, vol: 0.4 }); }
  }
  const step = Math.min(dt, 0.05);
  let rem = dt;
  while (rem > 0) {
    const h = Math.min(step, rem); rem -= h;
    moveAxis(P0, P0.vx * h, P0.vy * h, P0.vz * h);
  }
  if (P0.y < 1) { P0.y = 1; P0.vy = 0; }
  if (P0.y > WH - 3) { P0.y = WH - 3; P0.vy = Math.min(0, P0.vy); }
  const spd = Math.hypot(P0.vx, P0.vz);
  P0.bob += dt * (swimming ? 1.6 : spd * 2.4);
  if (!swimming && P0.onGround && spd > 1.4) {
    Game.stepT = (Game.stepT || 0) + dt * spd;
    if (Game.stepT > 2.2) { Game.stepT = 0; Game.sfx("step", { vol: 0.5, rate: 0.9 + Math.random() * 0.25 }); }
  }
  // 出入水面
  const wasUnder = Game.wasUnder;
  if (headUnder !== wasUnder) {
    Game.wasUnder = headUnder;
    if (!dry) {
      Game.sfx(headUnder ? "splash_in" : "splash_out");
      Game.particle("bubble", P0.x, SEA - 0.4, P0.z, 12, 1.2);
    }
  }

  // ---- 生存数值 ----
  const o2max = Game.o2Max();
  if (Game.demo) { P0.o2 = o2max; P0.hp = P0.hpMax; }
  if (P0.headUnder) {
    const deep = Game.depth > 14;
    const save = P0.equip.head ? (C.item(P0.equip.head).o2save || 1) : 1;
    let drain = 1;
    if (deep) drain = 1.32 * save;
    if (P0.glide > 0.5) drain *= 1.18;
    P0.o2 -= drain * dt;
    if (P0.o2 <= 0) { P0.o2 = 0; Game.hurt(9 * dt, "drown"); }
    else if (P0.o2 < o2max * 0.22 && Math.random() < dt * 0.7) Game.sfx("drown_warn", { vol: 0.5 });
  } else {
    if (P0.o2 < o2max) {
      P0.o2 = Math.min(o2max, P0.o2 + 12 * dt);
      if (Math.random() < dt * 2) Game.particle("bubble", P0.x, P0.y + 1.2, P0.z, 1, 0.4);
    }
  }
  P0.food = M.clamp(P0.food - dt * 0.155, 0, 100);
  P0.hydra = M.clamp(P0.hydra - dt * 0.21, 0, 100);
  if (P0.food <= 0 || P0.hydra <= 0) Game.hurt(dt * 1.9, "starve");
  else if (P0.hp < P0.hpMax && P0.food > 55 && P0.hydra > 45) P0.hp = Math.min(P0.hpMax, P0.hp + dt * 1.05);
  // 水压
  const lim = Game.depthLimit();
  Game.overPressure = Game.depth > lim && !dry;
  if (Game.overPressure) {
    Game.hurt(dt * (2.4 + (Game.depth - lim) * 0.18), "pressure");
    if (Math.random() < dt * 0.6) Game.sfx("alarm", { vol: 0.35 });
  }
  // 高温 / 熔岩
  const heat = touchesHurt(P0);
  if (heat > 0) {
    const prot = P0.equip.suit && C.item(P0.equip.suit).heat ? 0.25 : 1;
    Game.hurt(heat * dt * 2.2 * prot, "heat");
    Game.particle("spark", P0.x, P0.y + 0.4, P0.z, 2, 0.6);
  }
  Game.cold = Game.biome && Game.biome.key === "rift" && !dry
    ? (P0.equip.suit && C.item(P0.equip.suit).heat ? 0.06 : 0.3) : (Game.depth > 60 && !dry ? 0.14 : 0);

  // ---- 交互 ----
  Game.updateTarget();
  if (input.mine && !Game.uiOpen) Game.mine(dt);
  else { Game.mineProg = 0; Game.mineKey = ""; }
  if (input.scan && !Game.uiOpen) Game.scanTick(dt);
  else { Game.scan.active = false; Game.scan.progress = 0; Game.scan.key = ""; }

  // ---- 世界 ----
  updateEnts(dt);
  Game.spawnT = (Game.spawnT || 0) + dt;
  if (Game.spawnT > 1.4) { Game.spawnT = 0; spawnWave(); }
  updateParticles(dt);
  updateEnv(dt);
  if (P0.dead && !Game.over) { Game.over = true; }
};

function pushBox(x, y, z, sx, sy, sz, rx, ry, rz, r, g, b, e) {
  if (Game.boxN >= 5900) return;
  const o = Game.boxN * 13, A = Game.boxes;
  A[o] = x; A[o + 1] = y; A[o + 2] = z;
  A[o + 3] = sx; A[o + 4] = sy; A[o + 5] = sz;
  A[o + 6] = rx; A[o + 7] = ry; A[o + 8] = rz;
  A[o + 9] = r; A[o + 10] = g; A[o + 11] = b; A[o + 12] = e;
  Game.boxN++;
}
Game.buildScene = function () {
  const P0 = Game.P, Cr = G.Creatures;
  Game.boxN = 0;
  // 生物
  if (Cr && Cr.parts) {
    for (const e of Game.ents) {
      const dx = e.x - P0.x, dy = e.y - P0.y, dz = e.z - P0.z;
      if (dx * dx + dy * dy + dz * dz > 72 * 72) continue;
      let ps = null;
      try { ps = Cr.parts(e, Game.t); } catch (err) { continue; }
      if (!ps) continue;
      for (const p of ps) {
        const col = M.hex(p.color || "#ffffff");
        let em = p.emissive || 0;
        if (e.def && e.def.glow) em = Math.max(em, e.def.glow * (0.35 + 0.65 * Game.night));
        pushBox(p.px, p.py, p.pz, p.sx, p.sy, p.sz, p.rx || 0, p.ry || 0, p.rz || 0, col[0], col[1], col[2], em);
      }
    }
  }
  // 手持视图模型
  const it = Game.held();
  if (it) {
    const e = Game.eye(), d = G.Mat4.lookDir(P0.yaw, P0.pitch);
    const rgt = [Math.cos(P0.yaw), 0, -Math.sin(P0.yaw)];
    const upv = [rgt[1] * d[2] - rgt[2] * d[1], rgt[2] * d[0] - rgt[0] * d[2], rgt[0] * d[1] - rgt[1] * d[0]];
    const sw = Math.sin(Game.swing * Math.PI) * 0.30;
    const bobx = Math.sin(P0.bob) * 0.02, boby = Math.cos(P0.bob * 2) * 0.014;
    const fwd = 0.74 - sw * 0.32, side = 0.34 + bobx, dn = -0.27 + boby - sw * 0.16;
    const px = e.x + d[0] * fwd + rgt[0] * side + upv[0] * dn;
    const py = e.y + d[1] * fwd + rgt[1] * side + upv[1] * dn;
    const pz = e.z + d[2] * fwd + rgt[2] * side + upv[2] * dn;
    const col = M.hex(it.color || "#cccccc");
    const isBlock = it.kind === "block";
    const s = isBlock ? 0.17 : 0.115;
    pushBox(px, py, pz, s, s, isBlock ? s : s * 2.1,
      P0.pitch + sw * 1.2, P0.yaw + 0.45, sw * 0.6,
      col[0], col[1], col[2], it.glow ? 0.85 : (it.id === "thermoblade" ? 0.5 : 0.06));
    if (it.glow || it.id === "thermoblade") {
      if (Math.random() < 0.15) Game.particle("glow", px, py, pz, 1, 0.1);
    }
  }
  const sel = Game.target && !Game.uiOpen ? { x: Game.target.x, y: Game.target.y, z: Game.target.z, progress: Game.mineProg } : null;
  const shake = Game.shake * 0.035;
  const eye = Game.eye();
  const cam = {
    x: eye.x + (Math.random() - 0.5) * shake,
    y: eye.y + (Math.random() - 0.5) * shake,
    z: eye.z + (Math.random() - 0.5) * shake,
    yaw: P0.yaw, pitch: P0.pitch,
    fov: 72 + P0.glide * 8 + (Game.overPressure ? 3 : 0),
  };
  return {
    cam, env,
    boxes: Game.boxes, boxN: Game.boxN,
    pt: { pos: PT.pos, col: PT.col, n: PT.n },
    sel,
    post: {
      oxy: 1 - M.sat(Game.P.o2 / Math.max(1, Game.o2Max() * 0.32)),
      hurt: Game.hurtFx, cold: Game.cold || 0, fade: Game.fade,
    },
  };
};
