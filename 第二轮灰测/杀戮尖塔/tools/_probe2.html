<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>杀戮尖塔 · 铁甲战士 —— 网页复刻版</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="bg-layer"></div>

    <!-- ======== 顶部持久信息栏 ======== -->
    <div id="topbar" class="hidden">
      <div id="top-left">
        <div id="char-panel">
          <div id="char-portrait"></div>
          <div id="char-info">
            <div id="char-name">铁甲战士</div>
            <div id="hp-bar" class="hpbar" data-tip-key="hp">
              <div class="hp-fill"></div>
              <div class="hp-text"></div>
            </div>
          </div>
        </div>
        <div id="relic-bar"></div>
      </div>
      <div id="top-mid">
        <div id="gold-panel" data-tip-key="gold"><span class="gold-icon"></span><span id="gold-text">99</span></div>
        <div id="floor-panel">第 <span id="floor-text">0</span> 层</div>
        <div id="ascension-panel"></div>
      </div>
      <div id="top-right">
        <div id="potion-bar"></div>
        <div id="top-buttons">
          <button class="tbtn" id="btn-deck">牌组</button>
          <button class="tbtn" id="btn-map-view">地图</button>
          <button class="tbtn" id="btn-menu">菜单</button>
        </div>
      </div>
    </div>

    <!-- ======== 屏幕容器 ======== -->
    <div id="screens">
      <section class="screen" id="screen-title"></section>
      <section class="screen" id="screen-map"></section>
      <section class="screen" id="screen-combat">
        <div id="battlefield">
          <div id="player-slot"></div>
          <div id="enemy-slots"></div>
        </div>
        <div id="combat-hud">
          <div id="energy-panel" data-tip-key="energy">
            <div id="energy-orb"></div>
            <div id="energy-text">3/3</div>
          </div>
          <div class="pile-btn" id="pile-draw" data-tip-key="draw"><span class="pile-count">0</span><span class="pile-label">抽牌堆</span></div>
          <div class="pile-btn" id="pile-discard" data-tip-key="discard"><span class="pile-count">0</span><span class="pile-label">弃牌堆</span></div>
          <div class="pile-btn" id="pile-exhaust" data-tip-key="exhaust"><span class="pile-count">0</span><span class="pile-label">消耗堆</span></div>
          <button id="btn-end-turn"><span class="et-label">结束回合</span><span class="et-sub"></span></button>
          <div id="turn-banner"></div>
        </div>
        <div id="hand-area"><div id="hand"></div></div>
        <svg id="target-arrow" viewBox="0 0 1600 900" preserveAspectRatio="none"></svg>
      </section>
      <section class="screen" id="screen-reward"></section>
      <section class="screen" id="screen-shop"></section>
      <section class="screen" id="screen-rest"></section>
      <section class="screen" id="screen-event"></section>
      <section class="screen" id="screen-chest"></section>
      <section class="screen" id="screen-end"></section>
    </div>

    <!-- ======== 浮层 ======== -->
    <div id="fx-layer"></div>
    <div id="overlay-layer"></div>
    <div id="hover-preview"></div>
    <div id="tooltip"></div>
    <div id="toast-layer"></div>
  </div>
</div>

<script src="../js/util.js"></script>
<script src="../js/svg.js"></script>
<script src="../js/data-powers.js"></script>
<script src="../js/data-cards.js"></script>
<script src="../js/data-relics.js"></script>
<script src="../js/data-potions.js"></script>
<script src="../js/data-enemies.js"></script>
<script src="../js/data-events.js"></script>
<script src="../js/map.js"></script>
<script src="../js/combat.js"></script>
<script src="../js/render-combat.js"></script>
<script src="../js/screens.js"></script>
<script src="../js/game.js"></script>

<script>
(function () {
  const REP = { events: [], hp: [] };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  /* 包装 markDead */
  const _markDead = markDead;
  markDead = function (en) {
    const node = EL.entities[en && en.uid];
    const isPlayer = node && node.parentNode && node.parentNode.id === 'player-slot';
    REP.events.push({
      fn: 'markDead', uid: String(en && en.uid), name: (en && en.name) || '?',
      hp: en && en.hp, isPlayer: !!isPlayer,
      stack: (new Error().stack || '').split('\n').slice(1, 7).join(' | ')
    });
    return _markDead(en);
  };
  /* 包装 updateCombatant */
  const _upd = updateCombatant;
  updateCombatant = function (d, en, opts) {
    const isPlayer = d && d.parentNode && d.parentNode.id === 'player-slot';
    if (isPlayer && (en.hp <= 0 || en.escaped)) {
      REP.events.push({
        fn: 'updateCombatant(dead=true)', uid: String(en.uid), name: en.name,
        hp: en.hp, isPlayer: true, optsPlayer: !!(opts && opts.player),
        stack: (new Error().stack || '').split('\n').slice(1, 7).join(' | ')
      });
    }
    if (isPlayer && !(opts && opts.player)) {
      REP.events.push({
        fn: '!!! 用敌人数据更新了主角节点', uid: String(en.uid), name: en.name, hp: en.hp,
        stack: (new Error().stack || '').split('\n').slice(1, 7).join(' | ')
      });
    }
    return _upd(d, en, opts);
  };

  async function run() {
    Game.newRun();
    const node = S.map.grid[0].filter(Boolean)[0];
    Game.enterNode(node);
    for (let i = 0; i < 16; i++) {
      await sleep(100);
      const pn = document.querySelector('#player-slot .combatant');
      REP.hp.push('T+' + ((i + 1) * 100) + ' cls=' + (pn ? pn.className : '无') +
        ' playerHp=' + (CB ? CB.player.hp : '-') + ' uid=' + (CB ? CB.player.uid : '-') +
        ' entKeys=' + Object.keys(EL.entities).join('/') +
        ' enemies=' + (CB ? CB.enemies.map(e => e.uid + ':' + e.name + ':' + e.hp).join(',') : '-'));
    }
    REP.finalCls = (document.querySelector('#player-slot .combatant') || {}).className;
  }

  setTimeout(() => {
    run().catch(e => { REP.error = (e && e.stack) || String(e); }).then(() => {
      const txt = JSON.stringify(REP, null, 1);
      document.documentElement.innerHTML = '<head><meta charset="utf-8"></head><body><pre id="__report">'
        + txt.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>';
    });
  }, 250);
})();
</script>

</body>
</html>
