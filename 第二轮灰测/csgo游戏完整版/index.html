<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CS:GO Web — 网页版反恐精英（完整版）</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ===================== 游戏内 HUD ===================== -->
  <div id="overlay">
    <div id="flash-overlay"></div>
    <div id="hurt-vignette"></div>
    <div id="scope"><div class="scope-h"></div><div class="scope-v"></div><div class="scope-ring"></div></div>

    <div id="crosshair">
      <i class="ch ch-t"></i><i class="ch ch-b"></i><i class="ch ch-l"></i><i class="ch ch-r"></i>
      <i class="ch-dot"></i>
    </div>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>

    <div id="hud">
      <!-- 顶部比分 -->
      <div id="hud-top">
        <div class="side t"><span class="score" id="score-t">0</span><span class="label">T</span><span class="alive" id="alive-t"></span></div>
        <div class="mid">
          <div id="timer">1:55</div>
          <div id="round-info">第 1 回合</div>
        </div>
        <div class="side ct"><span class="alive" id="alive-ct"></span><span class="label">CT</span><span class="score" id="score-ct">0</span></div>
      </div>

      <!-- 左下：血量护甲钱 -->
      <div id="hud-left">
        <div class="stat-row">
          <div class="stat hp"><svg viewBox="0 0 24 24" class="ico"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.8-8 11-8 11z"/></svg><span id="health">100</span></div>
          <div class="stat armor"><svg viewBox="0 0 24 24" class="ico"><path d="M12 2l8 3v7c0 5-3.5 8.6-8 10-4.5-1.4-8-5-8-10V5l8-3z"/></svg><span id="armor">0</span><i id="helmet-ico">▲</i></div>
        </div>
        <div id="money"><span class="cur">$</span><span id="money-val">800</span><span id="money-delta"></span></div>
        <div id="objective"></div>
      </div>

      <!-- 右下：武器与弹药 -->
      <div id="hud-right">
        <div id="weapon-name">USP-S</div>
        <div id="ammo"><span id="ammo-mag">12</span><span class="sep">/</span><span id="ammo-res">24</span></div>
        <div id="inventory"></div>
        <div id="grenade-row"></div>
      </div>

      <!-- 雷达 -->
      <div id="radar-wrap">
        <canvas id="radar" width="360" height="360"></canvas>
        <div id="location">出生点</div>
      </div>

      <div id="killfeed"></div>
      <div id="notify-wrap"></div>
      <div id="center-msg"></div>

      <div id="progress-wrap" class="hidden">
        <div id="progress-label">正在安放炸弹</div>
        <div id="progress-bar"><i></i></div>
      </div>

      <div id="hint" class="hidden"></div>
      <div id="bomb-status" class="hidden"><i class="dot"></i><span>炸弹已安放</span></div>
      <div id="spectate" class="hidden"></div>
      <div id="damage-dirs"></div>
      <div id="round-banner" class="hidden"></div>
      <div id="perf"></div>
    </div>

    <!-- ===================== 面板 ===================== -->
    <div id="buymenu" class="panel hidden">
      <div class="panel-head"><h2>购买菜单</h2><div class="buy-money">$<span id="buy-money">800</span></div>
        <div class="panel-hint">数字键选择 · 鼠标点击购买 · B 关闭</div></div>
      <div id="buy-body"></div>
    </div>

    <div id="scoreboard" class="panel hidden">
      <div class="panel-head"><h2 id="sb-title">记分板</h2><div class="panel-hint">按住 Tab 查看</div></div>
      <div id="sb-body"></div>
    </div>

    <div id="menu" class="panel">
      <div class="brand">
        <div class="logo">CS<span>:</span>GO<em>WEB</em></div>
        <div class="tagline">纯网页 · 零依赖 · 自研 WebGL2 引擎</div>
      </div>
      <div id="menu-body"></div>
    </div>

    <div id="settings" class="panel hidden">
      <div class="panel-head"><h2>设置</h2><div class="panel-hint">Esc 返回</div></div>
      <div id="settings-body"></div>
    </div>

    <div id="loading">
      <div class="load-box">
        <div class="logo">CS<span>:</span>GO<em>WEB</em></div>
        <div class="bar"><i id="load-bar"></i></div>
        <div id="load-text">正在初始化…</div>
      </div>
    </div>

    <div id="pause-hint" class="hidden">点击画面继续游戏</div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
