<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Terrafall — single file build</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23243'/%3E%3Crect x='3' y='8' width='10' height='5' fill='%238a5a33'/%3E%3Crect x='3' y='7' width='10' height='2' fill='%2359a52f'/%3E%3C/svg%3E" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
body {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #cfd6ff;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
#wrap { position: fixed; inset: 0; }
canvas#game {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: none;
  background: #0a0d18;
}

/* ---------- boot splash ---------- */
#boot {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 42%, #16203f 0%, #080a14 70%);
  transition: opacity .45s ease;
}
#boot.done { opacity: 0; pointer-events: none; }
.boot-inner { text-align: center; }
.boot-title {
  font-size: 42px; letter-spacing: .34em; font-weight: 700;
  color: #f0e4c0; text-shadow: 0 3px 0 #6b4d1f, 0 0 26px rgba(255,210,140,.35);
}
.boot-sub { margin-top: 10px; font-size: 12px; letter-spacing: .22em; color: #7d89bd; }
.boot-bar {
  margin: 26px auto 0; width: 260px; height: 8px;
  border: 2px solid #39406e; background: #10142a;
}
.boot-bar i { display: block; height: 100%; width: 4%; background: linear-gradient(90deg, #4f7be0, #86e0ff); transition: width .2s ease; }
.boot-step { margin-top: 10px; font-size: 11px; letter-spacing: .16em; color: #5c6699; height: 14px; }

/* ---------- crash overlay ---------- */
#crash {
  position: fixed; inset: 0; z-index: 40; overflow: auto;
  background: rgba(10,4,6,.94); padding: 28px;
}
#crash h2 { color: #ff7b6b; font-size: 20px; letter-spacing: .18em; margin-bottom: 12px; }
#crash pre { white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: #ffd9cf; }
#crash button {
  margin-top: 18px; font-family: inherit; font-size: 13px; letter-spacing: .16em;
  color: #fff; background: #7a2a20; border: 1px solid #c96a58; padding: 8px 18px; cursor: pointer;
}

</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
  </div>

  <div id="boot">
    <div class="boot-inner">
      <div class="boot-title">TERRAFALL</div>
      <div class="boot-sub">a hand-made tribute to Terraria</div>
      <div class="boot-bar"><i id="bootbar"></i></div>
      <div class="boot-step" id="bootstep">loading…</div>
    </div>
  </div>

  <div id="crash" hidden>
    <h2>☠ crash</h2>
    <pre id="crashmsg"></pre>
    <button onclick="location.reload()">reload</button>
  </div>

<script>
  // 早期错误捕获：任何启动阶段异常都直接显示在屏幕上，避免"黑屏无提示"
  window.__errors = [];
  function showCrash(text){
    var c = document.getElementById('crash');
    var m = document.getElementById('crashmsg');
    if (!c || !m) return;
    m.textContent = (m.textContent ? m.textContent + '\n\n' : '') + text;
    c.hidden = false;
    var b = document.getElementById('boot'); if (b) b.style.display = 'none';
  }
  window.addEventListener('error', function (e) {
    var t = (e.message || 'error') + '\n' + (e.filename || '') + ':' + (e.lineno || 0);
    if (e.error && e.error.stack) t = e.error.stack;
    window.__errors.push(t); showCrash(t);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    var t = 'unhandled rejection: ' + ((r && (r.stack || r.message)) || String(r));
    window.__errors.push(t); showCrash(t);
  });
</script>
<script type="module">
const __M = Object.create(null);

/* ==================== src/core/sfx.js ==================== */
__M["src/core/sfx.js"] = (function(){
/* Terrafall — fully procedural WebAudio SFX + ambient music engine.
 * No audio files. Every sound is synthesized at runtime from noise buffers,
 * oscillators, filter sweeps, gain envelopes, short FM and a feedback-delay
 * reverb bus. Everything is defensive: if WebAudio is unavailable (or any
 * call fails) the engine degrades to silent no-ops and never throws.
 *
 * Public API:
 *   SFX.init() | SFX.ready | SFX.setMasterVolume(v) | SFX.setSfxVolume(v)
 *   SFX.setMusicVolume(v) | SFX.play(name, opts) | SFX.setMusic(track)
 *   SFX.stopAll() | SFX.muted | SFX.toggleMute()
 */

const clamp = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));
const rand = (a, b) => a + Math.random() * (b - a);

/* ------------------------------------------------------------------ state */
let ctx = null;
let masterGain = null, muteGain = null, comp = null, sfxBus = null, musicBus = null;
let reverbIn = null, reverbDelay = null, reverbFeedback = null, reverbWet = null;
let whiteNoise = null, pinkNoise = null;

let masterVol = 0.8, sfxVol = 0.9, musicVol = 0.35;
let _muted = false;
let activeVoices = 0, activeMusicVoices = 0;
const MAX_VOICES = 24, MAX_MUSIC_VOICES = 64;
const COALESCE_MS = 30;
const liveSources = new Set();
const lastPlay = Object.create(null);

let warnedUnavailable = false;
const warnOnce = () => {
  if (warnedUnavailable) return;
  warnedUnavailable = true;
  try { console.warn('[SFX] WebAudio unavailable — degrading to silent no-op.'); } catch (e) {}
};
const guard = (fn) => { try { return fn(); } catch (e) { warnOnce(); return undefined; } };

/* ------------------------------------------------------------------ graph */
function buildGraph() {
  masterGain = ctx.createGain();
  masterGain.gain.value = masterVol;
  muteGain = ctx.createGain();
  muteGain.gain.value = _muted ? 0 : 1;
  comp = ctx.createDynamicsCompressor();
  try {
    comp.threshold.value = -14;
    comp.knee.value = 22;
    comp.ratio.value = 5;
    comp.attack.value = 0.004;
    comp.release.value = 0.22;
  } catch (e) {}
  sfxBus = ctx.createGain();
  sfxBus.gain.value = sfxVol;
  musicBus = ctx.createGain();
  musicBus.gain.value = musicVol;

  // Feedback-delay "cave reverb" bus (cheap, ConvolverNode-free).
  reverbIn = ctx.createGain();
  reverbIn.gain.value = 1;
  reverbDelay = ctx.createDelay(1.5);
  reverbDelay.delayTime.value = 0.21;
  reverbFeedback = ctx.createGain();
  reverbFeedback.gain.value = 0.34;
  reverbWet = ctx.createGain();
  reverbWet.gain.value = 0.3;
  reverbIn.connect(reverbDelay);
  reverbDelay.connect(reverbFeedback);
  reverbFeedback.connect(reverbDelay);
  reverbDelay.connect(reverbWet);
  reverbWet.connect(sfxBus);

  sfxBus.connect(masterGain);
  musicBus.connect(masterGain);
  masterGain.connect(muteGain);
  muteGain.connect(comp);
  comp.connect(ctx.destination);

  whiteNoise = makeNoiseBuffer('white');
  pinkNoise = makeNoiseBuffer('pink');
}

function makeNoiseBuffer(kind) {
  const len = Math.max(2, Math.floor(ctx.sampleRate * 2));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  if (kind === 'pink') {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
  } else {
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return buf;
}

/* ------------------------------------------------------------------ voices */
function panNode(pan) {
  if (ctx.createStereoPanner) {
    const p = ctx.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    return p;
  }
  return null;
}

function sendReverb(node, amount, nodes) {
  if (!(amount > 0) || !reverbIn) return;
  const s = ctx.createGain();
  s.gain.value = amount;
  node.connect(s);
  s.connect(reverbIn);
  nodes.push(s);
}

function finish(src, nodes, music) {
  if (music) activeMusicVoices++;
  else activeVoices++;
  liveSources.add(src);
  const done = () => {
    if (music) activeMusicVoices = Math.max(0, activeMusicVoices - 1);
    else activeVoices = Math.max(0, activeVoices - 1);
    liveSources.delete(src);
    try { src.onended = null; } catch (e) {}
    for (const n of nodes) { try { n.disconnect(); } catch (e) {} }
  };
  try { src.onended = done; } catch (e) { done(); }
}

/* Builds a full oscillator voice (envelope, optional glide/vibrato/filter,
 * pan, reverb send) routed to `dest`. Returns {src, nodes}. */
function buildTone(t, rate, vol, pan, o, dest) {
  const type = o.type || 'sine';
  const dur = Math.max(0.02, o.dur || 0.2);
  const attack = Math.min(dur, o.attack != null ? o.attack : 0.005);
  const osc = ctx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime((o.f != null ? o.f : 440) * rate, t);
  if (o.f2 != null) {
    osc.frequency.exponentialRampToValueAtTime(
      Math.max(1, o.f2 * rate), t + (o.glide != null ? o.glide : dur));
  }
  if (o.detune) osc.detune.setValueAtTime(o.detune, t);

  const nodes = [osc];
  let prev = osc;

  if (o.vib) {
    const lfo = ctx.createOscillator();
    lfo.frequency.value = o.vib.f || 5;
    const lg = ctx.createGain();
    lg.gain.value = o.vib.d || 0;
    lfo.connect(lg);
    lg.connect(osc.detune);
    lfo.start(t);
    lfo.stop(t + dur + 0.1);
    nodes.push(lfo, lg);
  }
  if (o.filter) {
    const bq = ctx.createBiquadFilter();
    bq.type = o.filter.type || 'lowpass';
    bq.frequency.setValueAtTime(o.filter.f || 2000, t);
    if (o.filter.f2 != null) {
      bq.frequency.exponentialRampToValueAtTime(
        Math.max(10, o.filter.f2), t + (o.filter.ft || dur));
    }
    bq.Q.value = o.filter.Q || 0.7;
    prev.connect(bq);
    prev = bq;
    nodes.push(bq);
  }
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(Math.max(0.0001, vol), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  prev.connect(g);
  prev = g;
  nodes.push(g);

  const p = panNode(pan);
  if (p) { prev.connect(p); prev = p; nodes.push(p); }
  prev.connect(dest);
  if (o.reverb) sendReverb(prev, o.reverb, nodes);

  osc.start(t);
  osc.stop(t + dur + 0.1);
  return { src: osc, nodes };
}

function tone(t, rate, vol, pan, o) {
  const v = buildTone(t, rate, vol, pan, o, sfxBus);
  finish(v.src, v.nodes, false);
}

function mtone(mt, t, freq, o) {
  if (activeMusicVoices >= MAX_MUSIC_VOICES) return;
  const v = buildTone(t, 1, o.vol != null ? o.vol : 0.08, o.pan != null ? o.pan : 0, {
    type: o.type, f: freq, f2: o.f2, dur: o.dur, attack: o.attack,
    detune: o.detune, filter: o.filter, reverb: o.reverb
  }, mt.gain);
  finish(v.src, v.nodes, true);
}

function noise(t, rate, vol, pan, o) {
  const src = ctx.createBufferSource();
  src.buffer = (o.kind === 'pink' ? pinkNoise : whiteNoise) || whiteNoise;
  src.playbackRate.value = rate;
  const dur = Math.max(0.02, o.dur || 0.2);
  const attack = Math.min(dur, o.attack != null ? o.attack : 0.003);
  const nodes = [src];
  let prev = src;

  const bq = ctx.createBiquadFilter();
  bq.type = o.filter || 'lowpass';
  bq.frequency.setValueAtTime(o.f || 1200, t);
  if (o.f2 != null) {
    bq.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.ft || dur));
  }
  bq.Q.value = o.Q || 0.8;
  prev.connect(bq);
  prev = bq;
  nodes.push(bq);

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(Math.max(0.0001, vol), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  prev.connect(g);
  prev = g;
  nodes.push(g);

  const p = panNode(pan);
  if (p) { prev.connect(p); prev = p; nodes.push(p); }
  prev.connect(sfxBus);
  if (o.reverb) sendReverb(prev, o.reverb, nodes);

  src.start(t);
  src.stop(t + dur + 0.1);
  finish(src, nodes, false);
}

/* Inharmonic FM "metal" ping: modulator drives the carrier frequency. */
function fmPing(t, rate, vol, pan, o) {
  const dur = Math.max(0.02, o.dur || 0.3);
  const attack = Math.min(dur, o.attack != null ? o.attack : 0.002);
  const f0 = (o.f || 880) * rate;

  const car = ctx.createOscillator();
  car.type = o.carType || 'sine';
  car.frequency.setValueAtTime(f0, t);
  if (o.f2 != null) {
    car.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2 * rate), t + (o.glide || dur));
  }
  const mod = ctx.createOscillator();
  mod.type = 'sine';
  mod.frequency.setValueAtTime(f0 * (o.ratio || 2.7), t);
  if (o.ratio2 != null) {
    mod.frequency.exponentialRampToValueAtTime(f0 * o.ratio2, t + (o.glide || dur));
  }
  const mg = ctx.createGain();
  mg.gain.setValueAtTime(f0 * (o.index || 5), t);
  mg.gain.exponentialRampToValueAtTime(
    Math.max(0.0001, f0 * (o.indexEnd != null ? o.indexEnd : 0.3)), t + (o.glide || dur));
  mod.connect(mg);
  mg.connect(car.frequency);

  const nodes = [car, mod, mg];
  let prev = car;
  if (o.filter) {
    const bq = ctx.createBiquadFilter();
    bq.type = o.filter.type || 'highpass';
    bq.frequency.value = o.filter.f || 600;
    bq.Q.value = o.filter.Q || 0.8;
    prev.connect(bq);
    prev = bq;
    nodes.push(bq);
  }
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(Math.max(0.0001, vol), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  prev.connect(g);
  prev = g;
  nodes.push(g);

  const p = panNode(pan);
  if (p) { prev.connect(p); prev = p; nodes.push(p); }
  prev.connect(sfxBus);
  if (o.reverb) sendReverb(prev, o.reverb, nodes);

  car.start(t);
  car.stop(t + dur + 0.1);
  mod.start(t);
  mod.stop(t + dur + 0.1);
  finish(car, nodes, false);
}

/* ------------------------------------------------------------------ sounds */
const SOUNDS = {
  /* digging */
  dig_dirt: (t, r, v, p) => {
    noise(t, r, v * 0.7, p, { kind: 'pink', filter: 'lowpass', f: rand(380, 520), f2: 180, Q: 0.8, dur: 0.12, attack: 0.002 });
    tone(t, r, v * 0.6, p, { type: 'sine', f: rand(140, 165), f2: 75, dur: 0.14, attack: 0.002, reverb: 0.15 });
  },
  dig_stone: (t, r, v, p) => {
    noise(t, r, v * 0.8, p, { kind: 'white', filter: 'bandpass', f: rand(1600, 2100), f2: 700, Q: 1.5, dur: 0.09, attack: 0.001 });
    noise(t, r, v * 0.35, p, { kind: 'white', filter: 'highpass', f: 2500, dur: 0.06 });
    tone(t, r, v * 0.55, p, { type: 'triangle', f: rand(300, 340), f2: 140, dur: 0.1, attack: 0.001, reverb: 0.1 });
  },
  dig_wood: (t, r, v, p) => {
    tone(t, r, v * 0.7, p, { type: 'sine', f: rand(180, 205), dur: 0.07, attack: 0.001, reverb: 0.2 });
    tone(t, r, v * 0.45, p, { type: 'sine', f: rand(370, 400), dur: 0.06, attack: 0.001, reverb: 0.2 });
    noise(t, r, v * 0.35, p, { kind: 'white', filter: 'bandpass', f: 900, f2: 400, Q: 3, dur: 0.05, attack: 0.001 });
  },
  dig_metal: (t, r, v, p) => {
    fmPing(t, r, v * 0.8, p, { f: rand(700, 950), ratio: 2.7, index: 7, dur: 0.35, attack: 0.002, reverb: 0.3 });
    noise(t, r, v * 0.25, p, { kind: 'white', filter: 'highpass', f: 3000, dur: 0.05 });
  },
  tile_break: (t, r, v, p) => {
    noise(t, r, v * 0.9, p, { kind: 'white', filter: 'bandpass', f: 2000, f2: 600, Q: 0.9, dur: 0.16, attack: 0.001, reverb: 0.2 });
    tone(t, r, v * 0.5, p, { type: 'sine', f: 120, f2: 60, dur: 0.18, attack: 0.002, reverb: 0.15 });
  },
  tile_place: (t, r, v, p) => {
    tone(t, r, v * 0.6, p, { type: 'sine', f: 180, f2: 90, dur: 0.1, attack: 0.002, reverb: 0.2 });
    noise(t, r, v * 0.3, p, { kind: 'white', filter: 'lowpass', f: 800, f2: 300, dur: 0.06 });
  },
  torch_place: (t, r, v, p) => {
    noise(t, r, v * 0.4, p, { kind: 'white', filter: 'highpass', f: 2500, dur: 0.12, attack: 0.004, reverb: 0.1 });
    tone(t, r, v * 0.3, p, { type: 'square', f: 1200, f2: 900, dur: 0.05 });
  },

  /* movement */
  step_soft: (t, r, v, p) => {
    noise(t, r, v * 0.35, p, { kind: 'pink', filter: 'lowpass', f: 500, f2: 200, dur: 0.06, attack: 0.002 });
  },
  jump: (t, r, v, p) => {
    tone(t, r, v * 0.4, p, { type: 'sine', f: 300, f2: 620, dur: 0.14, glide: 0.12, attack: 0.005, reverb: 0.1 });
  },
  land: (t, r, v, p) => {
    tone(t, r, v * 0.5, p, { type: 'sine', f: 130, f2: 60, dur: 0.12, attack: 0.002, reverb: 0.2 });
    noise(t, r, v * 0.3, p, { kind: 'pink', filter: 'lowpass', f: 400, f2: 150, dur: 0.08 });
  },
  double_jump: (t, r, v, p) => {
    tone(t, r, v * 0.45, p, { type: 'sine', f: 350, f2: 780, dur: 0.12, glide: 0.1, attack: 0.004, reverb: 0.1 });
    noise(t, r, v * 0.3, p, { kind: 'white', filter: 'bandpass', f: 1500, f2: 3000, dur: 0.14, attack: 0.02 });
  },

  /* combat */
  sword_swing: (t, r, v, p) => {
    const dur = 0.18;
    const src = ctx.createBufferSource();
    src.buffer = whiteNoise;
    src.playbackRate.value = r;
    const bq = ctx.createBiquadFilter();
    bq.type = 'bandpass';
    bq.Q.value = 1.2;
    bq.frequency.setValueAtTime(350, t);
    bq.frequency.exponentialRampToValueAtTime(2400, t + dur * 0.5);
    bq.frequency.exponentialRampToValueAtTime(350, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v * 0.7, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bq);
    bq.connect(g);
    const nodes = [src, bq, g];
    let prev = g;
    const pn = panNode(p);
    if (pn) { prev.connect(pn); prev = pn; nodes.push(pn); }
    prev.connect(sfxBus);
    src.start(t);
    src.stop(t + dur + 0.05);
    finish(src, nodes, false);
  },
  sword_hit: (t, r, v, p) => {
    fmPing(t, r, v * 0.6, p, { f: rand(1200, 1600), ratio: 1.4, index: 4, dur: 0.12, attack: 0.001, reverb: 0.15 });
    noise(t, r, v * 0.4, p, { kind: 'white', filter: 'highpass', f: 1800, dur: 0.05 });
  },
  bow_shoot: (t, r, v, p) => {
    tone(t, r, v * 0.5, p, { type: 'sawtooth', f: 700, f2: 300, dur: 0.08, attack: 0.001, filter: { type: 'lowpass', f: 2500, Q: 1 } });
    noise(t, r, v * 0.3, p, { kind: 'white', filter: 'highpass', f: 3000, dur: 0.04 });
  },
  arrow_hit: (t, r, v, p) => {
    tone(t, r, v * 0.5, p, { type: 'triangle', f: 200, f2: 90, dur: 0.08, attack: 0.001, reverb: 0.1 });
    noise(t, r, v * 0.4, p, { kind: 'white', filter: 'bandpass', f: 1200, f2: 400, Q: 1.5, dur: 0.06 });
  },
  arrow_stick: (t, r, v, p) => {
    tone(t, r, v * 0.5, p, { type: 'sine', f: 320, f2: 180, dur: 0.06, attack: 0.001 });
    noise(t, r, v * 0.3, p, { kind: 'white', filter: 'bandpass', f: 1600, f2: 700, Q: 2, dur: 0.04 });
  },

/* ------------------------------------------------------------------ music */
const noteFreq = (root, semi) => root * Math.pow(2, semi / 12);
const makeRng = (seed) => {
  let s = (seed >>> 0) || 1;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
};

const TICK_MS = 200, LOOKAHEAD = 1.0, FADE = 1.5;
let musicObj = null;
let currentMusicKey = null;
let gestureBound = false;

function dayStep(mt, step, t) {
  const cfg = mt.cfg;
  const s = step % 16;
  const bar = Math.floor(step / 16) % cfg.chords.length;
  const chord = cfg.chords[bar];
  if (s % 2 === 0) {
    const idx = (s / 2) % chord.length;
    const semi = chord[idx] + (mt.rng() < 0.2 ? 12 : 0);
    mtone(mt, t, noteFreq(cfg.root, semi), { type: cfg.padType, dur: cfg.stepDur * 4, vol: cfg.padVol, attack: 0.03, pan: (semi % 2 ? -0.25 : 0.25), reverb: 0.35 });
  }
  if (s === 0 || s === 8) {
    const semi = chord[s === 0 ? 2 : 0] + 12;
    mtone(mt, t, noteFreq(cfg.root, semi), { type: cfg.leadType, dur: cfg.stepDur * 3, vol: cfg.leadVol, attack: 0.02, pan: -0.2, reverb: 0.4 });
  } else if (mt.rng() < 0.12) {
    const semi = cfg.scale[(mt.rng() * cfg.scale.length) | 0] + 12;
    mtone(mt, t, noteFreq(cfg.root, semi), { type: cfg.leadType, dur: cfg.stepDur * 2, vol: cfg.leadVol * 0.7, attack: 0.02, pan: 0.2, reverb: 0.4 });
  }
}

function nightStep(mt, step, t) {
  const cfg = mt.cfg;
  const s = step % 16;
  const bar = Math.floor(step / 16) % cfg.chords.length;
  const chord = cfg.chords[bar];
  if (s % 4 === 0) {
    const idx = (s / 4) % chord.length;
    mtone(mt, t, noteFreq(cfg.root, chord[idx]), { type: cfg.padType, dur: cfg.stepDur * 8, vol: cfg.padVol, attack: 0.06, pan: 0, reverb: 0.5 });
  }
  if (mt.rng() < 0.08) {
    const semi = cfg.scale[(mt.rng() * cfg.scale.length) | 0] + 12;
    mtone(mt, t, noteFreq(cfg.root, semi), { type: cfg.leadType, dur: cfg.stepDur * 3, vol: cfg.leadVol, attack: 0.03, pan: (semi % 2 ? 0.2 : -0.2), reverb: 0.5 });
  }
}

function underStep(mt, step, t) {
  const cfg = mt.cfg;
  const s = step % 16;
  const bar = Math.floor(step / 16) % cfg.chords.length;
  const chord = cfg.chords[bar];
  if (s === 0) {
    mtone(mt, t, noteFreq(cfg.root, chord[0]), { type: 'triangle', dur: cfg.stepDur * 32, vol: cfg.padVol, attack: 0.4, reverb: 0.5 });
    mtone(mt, t, noteFreq(cfg.root, chord[1]), { type: 'sine', dur: cfg.stepDur * 32, vol: cfg.padVol * 0.8, attack: 0.4, reverb: 0.5 });
  }
  if (mt.rng() < 0.09) {
    const semi = cfg.scale[(mt.rng() * cfg.scale.length) | 0] + 24;
    mtone(mt, t, noteFreq(cfg.root, semi), { type: 'sine', dur: cfg.stepDur * 2, vol: cfg.leadVol, attack: 0.01, pan: 0, reverb: 0.8 });
  }
}

function bossStep(mt, step, t) {
  const cfg = mt.cfg;
  const s = step % 16;
  const bar = Math.floor(step / 16) % cfg.chords.length;
  const chord = cfg.chords[bar];
  const motif = [0, 1, 3, 1, 0, 1, 4, 3];
  if (s % 2 === 0) {
    mtone(mt, t, noteFreq(cfg.root, 0), { type: 'square', dur: cfg.stepDur * 1.4, vol: cfg.padVol, attack: 0.005, filter: { type: 'lowpass', f: 300 }, reverb: 0.1 });
    const semi = motif[(s / 2) % motif.length] + 12;
    mtone(mt, t, noteFreq(cfg.root, semi), { type: cfg.leadType, dur: cfg.stepDur * 1.5, vol: cfg.leadVol, attack: 0.01, pan: 0.2, reverb: 0.2 });
  }
  if (s === 0) {
    mtone(mt, t, noteFreq(cfg.root, chord[0]), { type: 'sawtooth', dur: cfg.stepDur * 16, vol: cfg.padVol * 0.6, attack: 0.1, filter: { type: 'lowpass', f: 200 }, reverb: 0.2 });
  }
}

function scheduleStep(mt, step, t) {
  switch (mt.key) {
    case 'day': dayStep(mt, step, t); break;
    case 'night': nightStep(mt, step, t); break;
    case 'underground': underStep(mt, step, t); break;
    case 'boss': bossStep(mt, step, t); break;
  }
}

function musicTick() {
  const mt = musicObj;
  if (!mt || !ctx || mt.stopped) return;
  if (typeof document !== 'undefined' && document.visibilityState === 'hidden') return;
  const horizon = ctx.currentTime + LOOKAHEAD;
  let guard = 0;
  while (mt.nextTime < horizon && guard++ < 64) {
    scheduleStep(mt, mt.step, mt.nextTime);
    mt.step = (mt.step + 1) % 64;
    mt.nextTime += mt.stepDur;
  }
  if (guard >= 64) mt.nextTime = horizon;
}

function startTrack(key) {
  const cfg = TRACKS[key];

  const { canvas, ctx } = (() => { const b = buf(1, 1); void b; const c = document.createElement('canvas'); c.width = 24; c.height = 24; return { canvas: c, ctx: c.getContext('2d') }; })();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(src, 4, 4, 16, 16);

}

/* ===================== 我的世界风格模板（45° 斜向、扁平色阶） ===================== */

/** 斜向粗棒：沿 (x0,y0)->(x1,y1) 铺 w 像素宽，左上受光、右下压暗，两端可收尖 */
function mcBar(b, x0, y0, x1, y1, w, tone, opt = {}) {
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  const steps = Math.ceil(len);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    let half = w / 2;
    if (opt.taperEnd) half *= Math.min(1, (1 - t) * 3.2 + 0.18);      // 末端收尖
    if (opt.taperStart) half *= Math.min(1, t * 3.2 + 0.18);
    const cx = x0 + dx * t, cy = y0 + dy * t;
    for (let k = -half; k <= half; k += 0.5) {
      const x = Math.round(cx + nx * k), y = Math.round(cy + ny * k);
      const edge = k <= -half + 1 ? 'l' : k >= half - 1 ? 'd' : 'm';
      put(b, x, y, C(tone, edge === 'l' ? 4 : edge === 'd' ? 1 : 3));
    }
  }
}
/** 木柄：MC 里就是一根 2~3px 的斜棒 */
function mcHandle(b, x0, y0, x1, y1, w = 3) { mcBar(b, x0, y0, x1, y1, w, 'wood'); }

  vein: ramp('#a8342c'), iris: ramp('#3a1420'),
  chitin: ramp('#6b5a86', { dark: '#140e1e' }),         // 蠕虫甲壳
  fang: ramp('#e8e0cc'), heart: ramp('#e2452e'), star: ramp('#6f8ff0'),
  copper: ramp('#c07a48'), sky: ramp('#9fd8ff')
});
const PAL = G.pal;
const C = (n, l) => G.at(n, l);

/* ================================================================ 史莱姆 */
function slimeFrame(fw, fh, tone, sx, sy, mood) {
  const b = buf(fw, fh);
  const cx = fw / 2, base = fh - 3;
  const rx = 12.5 * sx, ry = 9.5 * sy;
  const cy = base - ry;
  // 果冻本体：上圆下平
  ellipse(b, cx, cy, rx, ry, C(tone, 2), (x, y) => y <= base);
  ellipse(b, cx, cy - 0.5, rx - 1, ry - 1, C(tone, 3), (x, y) => y <= base - 1);
  // 内部核（更深，隔着半透明body能看到）
  ellipse(b, cx + 1, cy + ry * 0.35, rx * 0.5, ry * 0.42, C(tone, 1));
  // 高光：左上一块 + 顶部一条
  ellipse(b, cx - rx * 0.42, cy - ry * 0.45, rx * 0.3, ry * 0.26, C(tone, 5));
  dither(b, Math.round(cx - rx * 0.7), Math.round(cy - ry * 0.8), Math.round(rx * 1.1), 3, C(tone, 4));
  // 底部压暗
  for (let x = Math.round(cx - rx); x <= cx + rx; x++) {
    if (get(b, x, base) >= 0) put(b, x, base, C(tone, 1));
    if (get(b, x, base - 1) >= 0 && (x % 3)) put(b, x, base - 1, C(tone, 2));
  }
  // 眼睛
  const ey = cy + (mood === 'hurt' ? 1 : 0);
  for (const dx of [-4, 4]) {
    rect(b, cx + dx - 1, ey - 2, 3, 4, C('ninja', 0));
    if (mood !== 'hurt') put(b, cx + dx, ey - 2, C('bone', 5));
  }
  // 嘴
  if (mood === 'jump') { rect(b, cx - 2, ey + 4, 5, 2, C('ninja', 0)); put(b, cx - 1, ey + 5, C('vein', 2)); }
  else line(b, cx - 2, ey + 4, cx + 2, ey + 4, C('ninja', 0));
  outline(b, C(tone, 0));
  return b;
}
function slimeSet(tone) {
  const fw = 30, fh = 26;
  const idle = [[1, 1], [1.04, 0.94], [1, 1], [0.96, 1.05]];
  const frames = idle.map(([sx, sy]) => slimeFrame(fw, fh, tone, sx, sy, 'idle'));
  frames.push(slimeFrame(fw, fh, tone, 0.86, 1.22, 'jump'));   // 起跳拉长
  frames.push(slimeFrame(fw, fh, tone, 1.18, 0.78, 'idle'));   // 落地压扁
  return sheet(frames, PAL,
    { idle: { frames: [0, 1, 2, 3], fps: 6, loop: true }, jump: { frames: [4, 5], fps: 8, loop: false } },
    { x: fw / 2, y: fh - 2 });
}

/* ================================================================== 僵尸 */
function humanoidFrame(fw, fh, kind, phase, mood) {
  const b = buf(fw, fh);
  const cx = fw / 2, feet = fh - 2;
  const isBone = kind === 'bone';
  const skin = isBone ? 'bone' : 'skin';
  const swing = Math.sin(phase * Math.PI * 2);
  const bob = mood === 'walk' ? Math.round(Math.abs(Math.cos(phase * Math.PI * 2)) * -1) : 0;

  /* 腿 */
  const legs = [[swing * 4, Math.max(0, -Math.cos(phase * Math.PI * 2)) * -2],
                [-swing * 4, Math.max(0, Math.cos(phase * Math.PI * 2)) * -2]];
  legs.forEach(([dx, lift], i) => {
    const c = i === 0 ? (isBone ? C('bone', 2) : C('pants', 2)) : (isBone ? C('bone', 3) : C('pants', 3));
    const hx = cx + dx * 0.5, hy = feet - 14 + bob;
    line(b, hx, hy, cx + dx, feet - 6 + lift, c, isBone ? 2 : 4);
    line(b, cx + dx, feet - 6 + lift, cx + dx * 1.1, feet - 1 + lift, c, isBone ? 2 : 4);
    if (!isBone) rect(b, cx + dx * 1.1 - 2, feet - 2 + lift, 5, 3, C('cloth', 1));   // 鞋
  });

  /* 躯干 */
  const ty = feet - 30 + bob;
  if (isBone) {
    rect(b, cx - 4, ty + 2, 9, 14, C('bone', 2));
    rect(b, cx - 3, ty + 3, 7, 12, C('bone', 3));
    for (let i = 0; i < 4; i++) { line(b, cx - 4, ty + 4 + i * 3, cx + 4, ty + 4 + i * 3, C('bone', 1)); }
    line(b, cx, ty + 3, cx, ty + 15, C('bone', 4));                                   // 脊柱
    rect(b, cx - 4, ty + 16, 9, 3, C('bone', 2));                                     // 骨盆
  } else {
    rect(b, cx - 5, ty, 11, 18, C('cloth', 2));
    rect(b, cx - 4, ty + 1, 9, 16, C('cloth', 3));
    rect(b, cx - 4, ty + 1, 3, 16, C('cloth', 4));
    // 破洞露肉
    rect(b, cx + 1, ty + 8, 3, 4, C('skin', 2));
    line(b, cx - 4, ty + 17, cx + 5, ty + 17, C('cloth', 1));
  }

  /* 双臂：僵尸前伸，骷髅微摆 */
  const armY = ty + 4;
  const reach = isBone ? 6 : 10;
  const armSwing = isBone ? swing * 3 : 1.5;
  for (const side of [1, -1]) {
    const c = side > 0 ? (isBone ? C('bone', 3) : C('skin', 3)) : (isBone ? C('bone', 2) : C('skin', 2));
    const ex = cx + side * 3 + reach, ey = armY + 5 + (side > 0 ? armSwing : -armSwing);
    line(b, cx + side * 4, armY, ex - 3, ey - 2, side > 0 ? (isBone ? C('bone', 2) : C('cloth', 2)) : (isBone ? C('bone', 1) : C('cloth', 1)), isBone ? 2 : 4);
    line(b, ex - 3, ey - 2, ex, ey, c, isBone ? 2 : 4);
    rect(b, ex - 1, ey - 1, 3, 3, c);
  }

  /* 头 */
  const hy = ty - 11;
  if (isBone) {
    rect(b, cx - 5, hy, 11, 10, C('bone', 2));
    rect(b, cx - 4, hy + 1, 9, 8, C('bone', 3));
    rect(b, cx - 4, hy + 1, 9, 2, C('bone', 4));
    rect(b, cx - 3, hy + 4, 3, 3, C('ninja', 0));      // 眼窝
    rect(b, cx + 1, hy + 4, 3, 3, C('ninja', 0));
    rect(b, cx - 2, hy + 8, 6, 2, C('bone', 1));       // 牙
    for (let i = 0; i < 3; i++) put(b, cx - 1 + i * 2, hy + 9, C('bone', 4));
  } else {
    rect(b, cx - 5, hy, 11, 11, C('skin', 2));
    rect(b, cx - 4, hy + 1, 9, 9, C('skin', 3));
    rect(b, cx - 4, hy + 1, 4, 9, C('skin', 4));
    rect(b, cx - 3, hy + 4, 3, 2, C('ninja', 0));      // 眼
    rect(b, cx + 1, hy + 4, 3, 2, C('ninja', 0));
    put(b, cx - 3, hy + 4, C('vein', 3));
    line(b, cx - 2, hy + 8, cx + 3, hy + 8, C('vein', 1));   // 咧开的嘴
    rect(b, cx - 5, hy, 11, 2, C('skin', 1));                 // 额头阴影
    if (mood === 'hurt') { rect(b, cx - 2, hy + 6, 5, 2, C('vein', 2)); }
  }
  innerShade(b, isBone ? C('bone', 1) : C('cloth', 1), 'br');
  outline(b, isBone ? C('bone', 0) : C('skin', 0));
  return b;
}
function humanoidSet(kind) {
  const fw = 24, fh = 46;
  const frames = [];
  for (let i = 0; i < 8; i++) frames.push(humanoidFrame(fw, fh, kind, i / 8, 'walk'));
  frames.push(humanoidFrame(fw, fh, kind, 0, 'idle'));
  const anims = { walk: { frames: [0, 1, 2, 3, 4, 5, 6, 7], fps: 10, loop: true }, idle: { frames: [8], fps: 1, loop: true } };
  if (kind !== 'bone') {
    frames.push(humanoidFrame(fw, fh, kind, 0, 'hurt'));
    anims.hurt = { frames: [9], fps: 1, loop: false };
  }
  return sheet(frames, PAL, anims, { x: fw / 2, y: fh - 3 });
}

/* ================================================================== 蝙蝠 */
function batFrame(fw, fh, flap) {
  const b = buf(fw, fh);
  const cx = fw / 2, cy = fh / 2 + 1;
  // 翅膜
  for (const side of [-1, 1]) {
    const tipY = cy - 6 - flap * 5, midY = cy + 2 - flap * 2;
    poly(b, [[cx, cy - 1], [cx - side * 9, tipY], [cx - side * 10, tipY + 4], [cx - side * 4, midY]],
      side < 0 ? C('batWing', 3) : C('batWing', 2));
    line(b, cx, cy - 1, cx - side * 9, tipY, C('batWing', 1));
    line(b, cx - side * 9, tipY, cx - side * 4, midY, C('batWing', 1));
  }
  // 身体
  ellipse(b, cx, cy, 3.6, 4.4, C('bat', 2));
  ellipse(b, cx - 0.6, cy - 0.6, 2.8, 3.4, C('bat', 3));
  ellipse(b, cx - 1, cy - 1.6, 1.4, 1.4, C('bat', 4));
  // 耳朵
  tri(b, cx - 3, cy - 4, cx - 4, cy - 8, cx - 1, cy - 5, C('bat', 2));
  tri(b, cx + 3, cy - 4, cx + 4, cy - 8, cx + 1, cy - 5, C('bat', 2));
  // 眼睛
  put(b, cx - 2, cy - 1, C('vein', 4)); put(b, cx + 1, cy - 1, C('vein', 4));
  put(b, cx - 2, cy, C('vein', 2)); put(b, cx + 1, cy, C('vein', 2));
  // 尖牙
  put(b, cx - 1, cy + 3, C('bone', 5)); put(b, cx + 1, cy + 3, C('bone', 5));
  outline(b, C('bat', 0));
  return b;
}

/* ============================================================ 史莱姆王 */
function kingSlimeFrame(fw, fh, sx, sy, mood) {
  const b = buf(fw, fh);
  const cx = fw / 2, base = fh - 4;
  const rx = 46 * sx, ry = 36 * sy, cy = base - ry;
  ellipse(b, cx, cy, rx, ry, C('king', 2), (x, y) => y <= base);
  ellipse(b, cx, cy - 1, rx - 3, ry - 3, C('king', 3), (x, y) => y <= base - 2);
  // 半透明感：棋盘高光带
  dither(b, Math.round(cx - rx * 0.75), Math.round(cy - ry * 0.7), Math.round(rx * 1.5), 6, C('king', 4));
  ellipse(b, cx - rx * 0.4, cy - ry * 0.45, rx * 0.26, ry * 0.22, C('king', 5));
  // 体内忍者剪影
  const nx = cx + 2, ny = cy + ry * 0.15;
  ellipse(b, nx, ny - 9, 5, 5.5, C('ninja', 1));                 // 头
  rect(b, nx - 5, ny - 4, 11, 13, C('ninja', 1));                // 身
  line(b, nx - 5, ny + 9, nx - 8, ny + 17, C('ninja', 1), 3);    // 腿
  line(b, nx + 5, ny + 9, nx + 8, ny + 17, C('ninja', 1), 3);
  line(b, nx - 5, ny - 2, nx - 12, ny + 3, C('ninja', 1), 3);    // 臂
  line(b, nx + 5, ny - 2, nx + 12, ny + 3, C('ninja', 1), 3);
  rect(b, nx - 6, ny - 8, 13, 2, C('ninja', 2));                 // 头巾
  // 眼睛
  for (const dx of [-15, 15]) {
    rect(b, cx + dx - 3, cy - 4, 7, 9, C('ninja', 0));
    rect(b, cx + dx - 1, cy - 3, 3, 4, C('bone', 5));
  }
  // 嘴
  if (mood === 'jump') { rect(b, cx - 8, cy + 12, 17, 5, C('ninja', 0)); rect(b, cx - 5, cy + 13, 11, 2, C('vein', 2)); }
  else line(b, cx - 8, cy + 13, cx + 8, cy + 13, C('ninja', 0), 2);
  // 王冠
  const crownY = cy - ry - 2;
  rect(b, cx - 16, crownY + 4, 33, 7, C('gold', 2));
  rect(b, cx - 16, crownY + 4, 33, 3, C('gold', 4));
  for (let i = 0; i < 5; i++) {
    const px2 = cx - 14 + i * 7;
    tri(b, px2, crownY + 4, px2 + 3, crownY - 4, px2 + 6, crownY + 4, C('gold', 3));
    put(b, px2 + 3, crownY - 3, C('gold', 5));
  }
  rect(b, cx - 2, crownY + 6, 4, 3, C('vein', 3));
  for (let x = cx - 16; x < cx + 17; x += 8) put(b, x, crownY + 9, C('gold', 1));
  innerShade(b, C('king', 1), 'br');
  outline(b, C('king', 0));
  return b;
}

/* ========================================================= 克苏鲁之眼 */
function eocFrame(fw, fh, phase2, pupilDx, pupilDy, open, blink) {
  const b = buf(fw, fh);
  const cx = fw / 2, cy = fh / 2 + 4;
  const R = 52;
  // 顶部触须冠
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI / 2 + (i - 4) * 0.26;
    const sx = cx + Math.cos(a) * R * 0.86, sy = cy + Math.sin(a) * R * 0.86;
    const len = 16 + (i % 3) * 6;
    const ex = cx + Math.cos(a - 0.12) * (R + len), ey = cy + Math.sin(a - 0.12) * (R + len);
    line(b, sx, sy, (sx + ex) / 2, (sy + ey) / 2 - 3, C('flesh', 1), 5);
    line(b, (sx + ex) / 2, (sy + ey) / 2 - 3, ex, ey, C('flesh', 2), 3);
  }
  // 巩膜球体
  ellipse(b, cx, cy, R, R * 0.98, C('flesh', 1));
  ellipse(b, cx, cy, R - 3, R * 0.98 - 3, C('flesh', 2));
  ellipse(b, cx - R * 0.28, cy - R * 0.3, R * 0.5, R * 0.46, C('flesh', 3));
  ellipse(b, cx - R * 0.42, cy - R * 0.44, R * 0.2, R * 0.17, C('flesh', 4));
  // 血丝
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + 0.3;
    const sx = cx + Math.cos(a) * (R - 4), sy = cy + Math.sin(a) * (R * 0.98 - 4);
    const ex = cx + Math.cos(a) * R * 0.42, ey = cy + Math.sin(a) * R * 0.42;
    line(b, sx, sy, (sx + ex) / 2 + (i % 2 ? 3 : -3), (sy + ey) / 2, C('vein', 2), 2);
    line(b, (sx + ex) / 2 + (i % 2 ? 3 : -3), (sy + ey) / 2, ex, ey, C('vein', 1));
  }

  if (!phase2) {
    // 一阶段：完整虹膜 + 瞳孔
    const ix = cx + pupilDx, iy = cy + pupilDy;
    ellipse(b, ix, iy, 22, 22, C('iris', 2));
    ellipse(b, ix, iy, 22, 22, C('iris', 3), (x, y, nx, ny) => nx * nx + ny * ny > 0.6);
    ellipse(b, ix, iy, 11, 11, C('iris', 0));
    ellipse(b, ix, iy, 11, 11, C('vein', 2), (x, y, nx, ny) => nx * nx + ny * ny > 0.72);
    rect(b, ix - 6, iy - 7, 4, 4, C('bone', 5));
    put(b, ix + 4, iy + 5, C('bone', 4));
    if (blink) {
      for (let y = cy - R; y < cy - R + R * 1.2 * blink; y++)
        for (let x = cx - R; x <= cx + R; x++) if (get(b, x, y) >= 0) put(b, x, y, y % 2 ? C('flesh', 1) : C('flesh', 2));
    }
  } else {
    // 二阶段：裂开的巨口 + 獠牙
    const half = Math.round(18 + open * 16);
    poly(b, [[cx - 44, cy], [cx - 12, cy - half], [cx + 14, cy - half + 4], [cx + 44, cy],
             [cx + 14, cy + half - 4], [cx - 12, cy + half]], C('iris', 0));
    poly(b, [[cx - 34, cy], [cx - 8, cy - half + 8], [cx + 26, cy], [cx - 8, cy + half - 8]], C('vein', 1));
    for (let i = 0; i < 7; i++) {
      const fx = cx - 32 + i * 11;
      tri(b, fx, cy - half + 6, fx + 4, cy - 2, fx + 8, cy - half + 6, C('fang', 4));
      tri(b, fx + 2, cy + half - 6, fx + 6, cy + 2, fx + 10, cy + half - 6, C('fang', 3));
    }
    // 口水
    for (let i = 0; i < 4; i++) line(b, cx - 20 + i * 13, cy + half - 8, cx - 20 + i * 13, cy + half + 4 + i * 2, C('flesh', 4));
  }
  innerShade(b, C('flesh', 1), 'br');
  outline(b, C('iris', 0));
  return b;
}

/* ============================================================ 世界吞噬者 */
function eaterFrame(kind, fw, fh, chomp) {
  const b = buf(fw, fh);
  const cx = fw / 2, cy = fh / 2;
  const r = kind === 'head' ? 11 : kind === 'body' ? 10 : 9.5;
  ellipse(b, cx, cy, r, r * (kind === 'tail' ? 0.8 : 0.95), C('chitin', 2));
  ellipse(b, cx - 0.6, cy - 0.8, r - 1.6, r * 0.85 - 1.6, C('chitin', 3));
  ellipse(b, cx - r * 0.35, cy - r * 0.4, r * 0.4, r * 0.34, C('chitin', 4));
  // 环节甲片
  for (let i = -2; i <= 2; i++) {
    line(b, cx - r * 0.9, cy + i * 3.2, cx + r * 0.9, cy + i * 3.2, C('chitin', 1));
  }
  if (kind === 'head') {
    // 口器：上下颚 + 獠牙
    const g2 = 2 + chomp * 3;
    poly(b, [[cx + 3, cy - g2], [cx + 12, cy - 8], [cx + 13, cy - 3], [cx + 6, cy - 1]], C('chitin', 1));
    poly(b, [[cx + 3, cy + g2], [cx + 12, cy + 8], [cx + 13, cy + 3], [cx + 6, cy + 1]], C('chitin', 1));
    line(b, cx + 4, cy - g2, cx + 12, cy - 7, C('fang', 4), 2);
    line(b, cx + 4, cy + g2, cx + 12, cy + 7, C('fang', 4), 2);
    // 眼
    put(b, cx - 2, cy - 4, C('vein', 4)); put(b, cx - 2, cy + 3, C('vein', 4));
    put(b, cx - 3, cy - 4, C('vein', 2)); put(b, cx - 3, cy + 3, C('vein', 2));
  } else if (kind === 'tail') {
    tri(b, cx - r, cy - 4, cx - r - 6, cy, cx - r, cy + 4, C('chitin', 2));
  }
  outline(b, C('chitin', 0));
  return b;
}

/* ============================================================== 拾取物 */
function heartFrame(size, pulse) {
  const b = buf(size, size);
  const cx = size / 2, cy = size / 2 + 1, s = 1 + pulse * 0.12;
  ellipse(b, cx - 2.6 * s, cy - 2.2 * s, 3.2 * s, 3 * s, C('heart', 3));
  ellipse(b, cx + 2.6 * s, cy - 2.2 * s, 3.2 * s, 3 * s, C('heart', 3));
  tri(b, cx - 5.4 * s, cy - 1.4 * s, cx, cy + 5.4 * s, cx + 5.4 * s, cy - 1.4 * s, C('heart', 3));
  ellipse(b, cx - 2.6 * s, cy - 2.6 * s, 1.6 * s, 1.4 * s, C('heart', 5));
  innerShade(b, C('heart', 1), 'br');
  outline(b, C('heart', 0));
  return b;
}
function starFrame(size, pulse) {
  const b = buf(size, size);
  const cx = size / 2, cy = size / 2, R = 6.4 + pulse * 1.2;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
    const a2 = a + Math.PI * 2 / 10;
    tri(b, cx, cy, cx + Math.cos(a) * R, cy + Math.sin(a) * R, cx + Math.cos(a2) * R * 0.44, cy + Math.sin(a2) * R * 0.44, C('star', 3));
    const a3 = a - Math.PI * 2 / 10;
    tri(b, cx, cy, cx + Math.cos(a) * R, cy + Math.sin(a) * R, cx + Math.cos(a3) * R * 0.44, cy + Math.sin(a3) * R * 0.44, C('star', 3));
  }
  ellipse(b, cx, cy, 2.6, 2.6, C('star', 4));
  ellipse(b, cx - 0.6, cy - 0.8, 1.3, 1.2, C('star', 5));
  outline(b, C('star', 0));
  return b;
}
function coinFrame(size, tone, t) {
  const b = buf(size, size);
  const cx = size / 2, cy = size / 2;
  const w = Math.max(1.2, Math.abs(Math.cos(t * Math.PI)) * 4.6);
  ellipse(b, cx, cy, w, 4.6, C(tone, 2));
  ellipse(b, cx, cy, Math.max(0.6, w - 1), 3.6, C(tone, 3));
  if (w > 2.4) { ellipse(b, cx - w * 0.3, cy - 1.2, w * 0.34, 1.4, C(tone, 5)); }
  outline(b, C(tone, 0));
  return b;
}

/* ================================================================= 出口 */

    if (this.mirrorT > 0) {
      this.mirrorT--;
      game.fx.sparkle(this.cx, this.cy, 2, '#9fd8ff');
      if (this.mirrorT === 0) {
        this.x = game.world.spawn.x - this.w / 2; this.y = game.world.spawn.y - this.h;
        this.vx = this.vy = 0;
        game.fx.puff(this.cx, this.cy, 20, '#9fd8ff');
        game.sfx('magic_cast');
      }
    }
  }

  /* ------------------------------------------------ 碰撞：水平 */
  moveX(world, dx) {
    if (dx === 0) return;
    const steps = Math.ceil(Math.abs(dx) / 6);
    const d = dx / steps;
    for (let s = 0; s < steps; s++) {
      const nx = this.x + d;
      if (!world.rectSolid(nx, this.y, this.w, this.h)) { this.x = nx; continue; }
      // 自动上台阶（最多 1 格）
      let stepped = false;
      if (this.onGround || this.vy >= 0) {
        for (let up = 2; up <= TILE; up += 2) {
          if (!world.rectSolid(nx, this.y - up, this.w, this.h)) {
            this.y -= up; this.x = nx; this.stepOffset += up; stepped = true; break;
          }
        }
      }
      if (!stepped) { this.vx = 0; break; }
    }
  }

  /* ------------------------------------------------ 碰撞：垂直 */
  moveY(world, dy, dropThrough, game) {
    const wasGround = this.onGround;
    this.onGround = false;
    if (dy !== 0) {
      const steps = Math.ceil(Math.abs(dy) / 6);
      const d = dy / steps;
      for (let s = 0; s < steps; s++) {
        const ny = this.y + d;
        if (d > 0) {
          // 落地：实体方块
          if (world.rectSolid(this.x, ny, this.w, this.h)) {
            this.y = Math.floor((ny + this.h) / TILE) * TILE - this.h;
            this.land(game); break;
          }
          // 平台（仅从上方）
          if (!dropThrough) {
            const feetOld = this.y + this.h, feetNew = ny + this.h;
            const tyP = Math.floor(feetNew / TILE);
            let hit = false;
            for (let tx = Math.floor(this.x / TILE); tx <= Math.floor((this.x + this.w - 1) / TILE); tx++) {
              if (isPlatformId(world.get(tx, tyP)) && feetOld <= tyP * TILE + 2) { hit = true; break; }
            }
            if (hit) { this.y = tyP * TILE - this.h; this.land(game); break; }
          }
          this.y = ny;
        } else {
          if (world.rectSolid(this.x, ny, this.w, this.h)) {
            this.y = Math.floor(ny / TILE + 1) * TILE;
            this.vy = 0; this.jumping = false; break;
          }
          this.y = ny;
        }
      }
    }
    // 站立检测
    if (!this.onGround) {
      if (world.rectSolid(this.x, this.y + 1, this.w, this.h)) this.onGround = true;
      else {
        const ty = Math.floor((this.y + this.h + 1) / TILE);
        for (let tx = Math.floor(this.x / TILE); tx <= Math.floor((this.x + this.w - 1) / TILE); tx++) {
          if (isPlatformId(world.get(tx, ty)) && !dropThrough && Math.abs((this.y + this.h) - ty * TILE) <= 2) { this.onGround = true; break; }
        }
      }
    }
    if (this.onGround) {
      this.djUsed = false;
      if (this.vy > 0) this.vy = 0;
      if (this.fallStart !== null) {
        const fall = this.y + this.h - this.fallStart;
        if (fall > SAFE_FALL) {
          const dmg = Math.round((fall - SAFE_FALL) / TILE * 10) + 1;
          this.takeDamage(game, dmg, 0, true);
          game.fx.puff(this.cx, this.feetY, 14, '#c8bba8');
        } else if (fall > TILE * 4 && !wasGround) {
          game.sfx('land', { vol: 0.5 });
          game.fx.dust(this.cx, this.feetY, 4, T.DIRT);
        }
        this.fallStart = null;
      }
    } else if (this.vy > 0 && this.fallStart === null) this.fallStart = this.y + this.h;
  }

  land(game) {
    this.onGround = true;
    this.vy = 0;
  }

  /* ------------------------------------------------ 手臂动画 */
  updateArm() {
    if (this.swingT > 0 && this.swingMax > 0) {
      const p = 1 - this.swingT / this.swingMax;
      // 从举高到斩下的圆弧（原版挥剑感）
      const a = -2.1 + p * 3.0;
      this.armAngle = a;
      this.itemUseAnim = p;
    } else {
      this.itemUseAnim = 0;
      const aimA = this.facing > 0 ? this.aim : Math.PI - this.aim;
      this.armAngle = clamp(-aimA, -1.4, 1.2) * 0.55 + 0.25;
    }
  }

  /* ================================================== 使用物品 */
  useItem(game, def, stack) {
    const { world, inv } = game;
    if (!def) { // 空手：轻轻拳击 + 也能挖植物
      this.swingT = this.swingMax = 14;
      this.useCd = 16;
      this.mineOrHit(game, 0, 0, 6);
      return;
    }
    this.useCd = def.useTime || 20;

    switch (def.type) {
      case 'tool': {
        this.swingT = this.swingMax = def.useTime;
        this.mineOrHit(game, def.pick || 0, def.axe || 0, def.dmg || 3, def.hammer || 0);
        break;
      }
      case 'sword': {
        this.swingT = this.swingMax = def.useTime;
        this.swingHits = new Set();
        game.sfx('sword_swing');
        break;
      }
      case 'spear': {
        this.swingT = this.swingMax = def.useTime;
        this.swingHits = new Set();
        game.sfx('sword_swing', { rate: 0.85 });
        break;
      }
      case 'block': {
        if (this.placeBlock(game, def)) inv.consumeSelected(1);
        break;
      }
      case 'wall': {
        if (this.placeWall(game, def)) inv.consumeSelected(1);
        break;
      }
      case 'obj': {
        if (this.placeObject(game, def)) inv.consumeSelected(1);
        break;
      }
      case 'bow': {
        const ammo = inv.findAmmo(def.ammo);
        if (!ammo) { game.toast('No ammo!'); this.useCd = 20; break; }
        this.swingT = this.swingMax = def.useTime;
        const spd = def.shootSpeed || 9;
        const a = this.aim + (Math.random() - 0.5) * 0.04;
        game.spawnProjectile({
          kind: ammo.def.fire ? 'flameArrow' : 'arrow', x: this.hand().x, y: this.hand().y,
          vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
          dmg: (def.dmg || 0) + (ammo.def.dmg || 0), kb: def.knockback || 2, friendly: true,
          item: ammo.stack.item
        });
        if (!this.god) inv.consumeAmmo(ammo);
        game.sfx('bow_shoot');
        break;
      }
      case 'thrown': {
        this.swingT = this.swingMax = def.useTime;
        const spd = def.shootSpeed || 10;
        const a = this.aim;
        game.spawnProjectile({
          kind: stack.item === 'shurikenStack' ? 'shuriken' : 'knife', x: this.hand().x, y: this.hand().y,
          vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, dmg: def.dmg, kb: def.knockback, friendly: true, spin: true
        });
        inv.consumeSelected(1);
        game.sfx('bow_shoot', { rate: 1.2 });
        break;
      }
      case 'boomerang': {
        if (this.boomerangOut > 0) { this.useCd = 4; break; }
        this.swingT = this.swingMax = def.useTime;
        const spd = def.shootSpeed || 8.5;
        const a = this.aim;
        this.boomerangOut = 1;
        game.spawnProjectile({
          kind: 'boomerang', x: this.hand().x, y: this.hand().y,
          vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, dmg: def.dmg, kb: def.knockback,
          friendly: true, spin: true, owner: this
        });
        game.sfx('sword_swing', { rate: 1.15 });
        break;
      }
      case 'magic': {
        if (!this.god && this.mana < (def.mana || 0)) { game.toast('Not enough mana'); this.useCd = 20; game.sfx('ui_error'); break; }
        if (!this.god) this.mana -= def.mana || 0;
        this.swingT = this.swingMax = def.useTime;
        const a = this.aim;
        if (def.vilethorn) {
          game.spawnVilethorn(game.mouseWorld.x, game.mouseWorld.y, def.dmg);
        } else {
          const spd = def.shootSpeed || 9;
          game.spawnProjectile({
            kind: 'magicBolt', x: this.hand().x, y: this.hand().y,
            vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, dmg: def.dmg, kb: def.knockback,
            friendly: true, color: def.color || '#a05ae0', light: true
          });
        }
        game.sfx('magic_cast');
        break;
      }
      case 'potion': {
        if (def.heal) {
          if (this.hp >= this.maxHp) { this.useCd = 10; break; }
          this.hp = Math.min(this.maxHp, this.hp + def.heal);
          game.fx.heal(this.cx, this.cy);
          game.sfx('heal');
        }
        if (def.manaRestore) {
          this.mana = Math.min(this.maxMana, this.mana + def.manaRestore);
          game.fx.sparkle(this.cx, this.cy, 8, '#7f9fff');
          game.sfx('pickup_mana');
        }
        game.inv.consumeSelected(1);
        break;
      }
      case 'consumable': {
        if (def.maxHp) {
          if (this.maxHp >= 400) { game.toast('Life is at maximum'); break; }
          this.maxHp += def.maxHp; this.hp += def.maxHp;
          game.fx.heal(this.cx, this.cy);
          game.sfx('level_up_heart');
          game.toast('Life increased!');
          inv.consumeSelected(1);
        } else if (def.maxMana) {
          if (this.maxMana >= 200) { game.toast('Mana is at maximum'); break; }
          this.maxMana += def.maxMana; this.mana += def.maxMana;
          game.fx.sparkle(this.cx, this.cy, 14, '#7f9fff');
          game.sfx('level_up_heart', { rate: 1.25 });
          game.toast('Mana increased!');
          inv.consumeSelected(1);
        } else if (def.heal) {
          this.hp = Math.min(this.maxHp, this.hp + def.heal);
          game.sfx('heal'); inv.consumeSelected(1);
        }
        break;
      }
      case 'mirror': {
        if (this.mirrorT === 0) { this.mirrorT = 60; game.sfx('magic_cast', { rate: 0.7 }); }
        break;
      }
      case 'summon': {
        game.summonBoss(def.boss, this);
        break;
      }
      case 'armor': {
        const idx = def.slot === 'head' ? 0 : def.slot === 'body' ? 1 : 2;
        const prev = inv.armor[idx];
        inv.armor[idx] = { item: stack.item, count: 1 };
        inv.consumeSelected(1);
        if (prev) inv.add(prev.item, prev.count);
        game.sfx('craft', { vol: 0.5 });
        game.toast('Equipped ' + def.name);
        break;
      }
      case 'accessory': {
        // 左键点击饰品：自动装备到空位
        for (let i = 0; i < inv.acc.length; i++) {
          if (!inv.acc[i]) { inv.acc[i] = { item: stack.item, count: 1 }; inv.consumeSelected(1); game.sfx('ui_click'); break; }
        }
        break;
      }
      default:
        this.swingT = this.swingMax = def.useTime || 20;
    }
  }

  /** 右键：交互（箱子、生命水晶等） */
  rightClick(game) {
    const { world } = game;
    const tx = Math.floor(game.mouseWorld.x / TILE), ty = Math.floor(game.mouseWorld.y / TILE);
    if (!this.inRange(tx, ty)) return;
    const id = world.get(tx, ty);
    // 门：右键开/关
    if (id === T.DOOR_CLOSED || id === T.DOOR_OPEN) {
      const o = world.objOrigin(tx, ty);
      if (!o) return;
      const next = id === T.DOOR_CLOSED ? T.DOOR_OPEN : T.DOOR_CLOSED;
      if (next === T.DOOR_CLOSED) {
        // 关门时不能把玩家或敌人夹在门里
        const dx = o.x * TILE, dy = o.y * TILE;
        if (dx < this.x + this.w && dx + TILE > this.x && dy < this.y + this.h && dy + TILE * 3 > this.y) {
          game.toast("Can't close the door"); return;
        }
        for (const e of game.enemies.list) {
          if (e.dead) continue;
          if (dx < e.x + e.w && dx + TILE > e.x && dy < e.y + e.h && dy + TILE * 3 > e.y) {
            game.toast("Something is blocking the door"); return;
          }
        }
      }
      for (let j = 0; j < 3; j++) world.set(o.x, o.y + j, next, (j << 4));
      game.sfx(next === T.DOOR_OPEN ? 'chest_open' : 'chest_close', { rate: 1.15 });
      game.fx.dust(o.x * TILE + 8, (o.y + 1) * TILE + 8, 3, T.PLANK);
      return;
    }
    if (id === T.CHEST) {
      const o = world.objOrigin(tx, ty);
      if (o) {
        const key = world.idx(o.x, o.y);
        let items = world.chests.get(key);
        if (!items) { items = new Array(20).fill(null); world.chests.set(key, items); }
        game.openChest({ key, items, x: o.x, y: o.y });
      }
    }
  }

  hand() {
    const a = this.armAngle;
    const fx = this.facing;
    return { x: this.cx + fx * (6 + Math.cos(a) * 8), y: this.y + 14 + Math.sin(a) * 6 };
  }

  inRange(tx, ty) {
    const px = this.cx / TILE, py = this.cy / TILE;
    const rx = this.god ? 30 : 6.2, ry = this.god ? 20 : 5.6;
    return Math.abs(tx + 0.5 - px) <= rx && Math.abs(ty + 0.5 - py) <= ry;
  }

  /* ============================================ 挖掘 / 近战判定 */
  mineOrHit(game, pickPower, axePower, dmg, hammerPower = 0) {
    const { world } = game;
    const tx = Math.floor(game.mouseWorld.x / TILE), ty = Math.floor(game.mouseWorld.y / TILE);
    this.mineTarget = null;
    if (!this.inRange(tx, ty)) return;
    const id = world.get(tx, ty);

    const tdef = id !== T.AIR ? tileDef(id) : null;
    const allowed = tdef ? (tdef.tools || [tdef.tool]) : [];
    const powerFor = (t) => t === 'pick' ? pickPower : t === 'axe' ? axePower : t === 'hammer' ? hammerPower
      : Math.max(pickPower, axePower, 12);
    const tilePower = tdef ? Math.max(0, ...allowed.map(powerFor)) : 0;

    // 敲墙（锤子）：空气处，或者前面只有平台/装饰物且当前工具挖不动它时，都敲后面的墙
    const wallReachable = id === T.AIR || (!isSolidId(id) && tilePower <= 0);
    if (wallReachable && hammerPower > 0) {
      const wl = world.wall(tx, ty);
      if (wl) {
        this.mineTarget = { x: tx, y: ty };
        if (world.damageTile(tx, ty, hammerPower)) {
          const wd = (game.wallDefs && game.wallDefs[wl]) || null;
          world.setWall(tx, ty, 0);
          if (wd && wd.drop) game.spawnDrop(tx * TILE + 8, ty * TILE + 8, wd.drop, 1);
          game.fx.tileBreak(tx, ty, T.STONE);
          game.sfx('tile_break');
        } else game.sfx('dig_stone', { vol: 0.5 });
        return;
      }
    }
    if (id === T.AIR) return;

    const def = tdef;
    const power = tilePower;
    if (power <= 0) {
      if (game.tick % 20 === 0) {
        const names = { pick: 'a pickaxe', axe: 'an axe', hammer: 'a hammer', hand: 'nothing' };
        game.toast('Need ' + (names[allowed[0]] || 'a tool'));
      }
      return;
    }
    if (def.pick > 0 && allowed.includes('pick') && pickPower < def.pick) {
      if (game.tick % 20 === 0) game.toast('Your pickaxe is too weak');
      game.sfx('ui_error', { vol: 0.4 });
      return;
    }
    this.mineTarget = { x: tx, y: ty };
    const broke = world.damageTile(tx, ty, this.god ? 99999 : power);
    if (broke) game.breakTile(tx, ty, this);
    else {
      const s = allowed.includes('axe') && !allowed.includes('pick') ? 'dig_wood'
        : (id === T.STONE || (def.pal && def.pal.base === '#6e6e78')) ? 'dig_stone' : 'dig_dirt';
      game.sfx(s, { vol: 0.55 });
      game.fx.dust(tx * TILE + 8, ty * TILE + 8, 2, id);
    }
  }

  /* ============================================ 放置 */
  canPlaceAt(world, tx, ty, solid) {
    if (!world.inB(tx, ty)) return false;
    if (!this.inRange(tx, ty)) return false;
    const cur = world.get(tx, ty);
    if (cur !== T.AIR && !tileDef(cur).plantLike) return false;
    // 需要有依附：四邻有方块或有墙
    const near = world.get(tx - 1, ty) !== T.AIR || world.get(tx + 1, ty) !== T.AIR ||
      world.get(tx, ty - 1) !== T.AIR || world.get(tx, ty + 1) !== T.AIR || world.wall(tx, ty) !== 0;
    if (!near) return false;
    if (solid) {
      // 不能把自己卡住
      const px = tx * TILE, py = ty * TILE;
      if (px < this.x + this.w && px + TILE > this.x && py < this.y + this.h && py + TILE > this.y) return false;
      for (const e of world._entitiesHint || []) { /* 由 game 注入的敌人列表，可选 */ }
    }
    return true;
  }

  placeBlock(game, def) {
    const { world } = game;
    const tx = Math.floor(game.mouseWorld.x / TILE), ty = Math.floor(game.mouseWorld.y / TILE);
    const solid = isSolidId(def.tile);
    if (!this.canPlaceAt(world, tx, ty, solid)) return false;
    if (def.tile === T.TORCH) {
      // 火把要贴墙或地面
      const support = world.get(tx, ty + 1) !== T.AIR || world.get(tx - 1, ty) !== T.AIR ||
        world.get(tx + 1, ty) !== T.AIR || world.wall(tx, ty) !== 0;
      if (!support) return false;
      world.set(tx, ty, T.TORCH);
      game.sfx('torch_place');
      game.fx.sparkle(tx * TILE + 8, ty * TILE + 8, 4, '#ffd479');
      return true;
    }
    world.set(tx, ty, def.tile);
    game.sfx('tile_place');
    game.fx.placePuff(tx, ty, def.tile);
    return true;
  }

  placeWall(game, def) {
    const { world } = game;
    const tx = Math.floor(game.mouseWorld.x / TILE), ty = Math.floor(game.mouseWorld.y / TILE);
    if (!world.inB(tx, ty) || !this.inRange(tx, ty)) return false;
    // 原版：墙可以贴在平台、火把、草丛这类非实体方块后面，只有实体方块处不行
    if (world.wall(tx, ty) !== 0 || isSolidId(world.get(tx, ty))) return false;
    const near = world.wall(tx - 1, ty) || world.wall(tx + 1, ty) || world.wall(tx, ty - 1) || world.wall(tx, ty + 1) ||
      world.get(tx - 1, ty) !== T.AIR || world.get(tx + 1, ty) !== T.AIR || world.get(tx, ty - 1) !== T.AIR || world.get(tx, ty + 1) !== T.AIR;
    if (!near) return false;
    world.setWall(tx, ty, def.wall);
    game.sfx('tile_place', { rate: 0.85 });
    return true;
  }

  placeObject(game, def) {
    const { world } = game;
    const d = tileDef(def.tile);
    const ow = d.obj ? d.obj.w : 1, oh = d.obj ? d.obj.h : 1;
    const tx = Math.floor(game.mouseWorld.x / TILE) - ((ow - 1) >> 1);
    const ty = Math.floor(game.mouseWorld.y / TILE) - (oh - 1);
    if (!this.inRange(tx, ty)) return false;
    if (!world.canPlaceObj(tx, ty, ow, oh, true)) return false;
    // 不能压到玩家
    const px = tx * TILE, py = ty * TILE;
    if (px < this.x + this.w && px + ow * TILE > this.x && py < this.y + this.h && py + oh * TILE > this.y) return false;
    world.placeObj(tx, ty, def.tile);
    game.sfx('tile_place');
    game.fx.placePuff(tx, ty, def.tile);
    return true;
  }

  /* ============================================ 受伤 / 死亡 */
  takeDamage(game, amount, kbDir = 0, ignoreDefense = false) {
    if (this.god) return;                       // 上帝模式：完全免伤
    if (this.immune > 0 || this.dead) return;
    const B = game.inv.accBonus();
    const def = ignoreDefense ? 0 : (this.defense + B.defense);
    const dmg = Math.max(1, Math.round(amount - def / 2));
    this.hp -= dmg;
    this.immune = IFRAMES;
    this.hurtFlash = 18;
    this.noRegen = 300;
    game.fx.damageNumber(this.cx, this.y, dmg, '#ff8a6a');
    game.fx.blood(this.cx, this.cy, 10);
    game.shake(4);
    game.sfx('hurt_player');
    if (kbDir !== 0) { this.vx = kbDir * 3.2; this.vy = -2.4; }
    if (this.hp <= 0) this.die(game);
  }

  heal(n, game) {
    this.hp = Math.min(this.maxHp, this.hp + n);
    if (game) { game.fx.heal(this.cx, this.cy); game.fx.damageNumber(this.cx, this.y, n, '#7ff08a'); }
  }

  die(game) {
    this.hp = 0; this.dead = true; this.respawnT = 240; this.deathCount++;
    // 原版惩罚：死亡掉落一半金币
    for (const coin of ['goldCoin', 'silverCoin', 'copperCoin']) {
      const n = game.inv.count(coin);
      if (n > 0) {
        const drop = Math.max(1, Math.floor(n / 2));
        game.inv.consume(coin, drop);
        game.drops.spawn(this.cx, this.cy, coin, drop, { vx: (Math.random() - 0.5) * 3, vy: -3, pickDelay: 60 });
      }
    }
    game.fx.blood(this.cx, this.cy, 40);
    game.sfx('death_player');
    game.toast('You were slain...');
    game.shake(10);
  }

  respawn(game) {
    this.dead = false;
    this.hp = this.maxHp; this.mana = this.maxMana;
    this.x = game.world.spawn.x - this.w / 2;
    this.y = game.world.spawn.y - this.h;
    this.vx = this.vy = 0;
    this.immune = 90;
    this.breath = this.breathMax;
    game.fx.puff(this.cx, this.cy, 20, '#9fd8ff');
  }

  /* ============================================ 绘制 */
  draw(ctx, cam, game) {
    if (this.dead) return;
    const blinkHide = this.immune > 0 && (game.tick % 8) < 4;
    if (blinkHide && this.immune > 10) ctx.globalAlpha = 0.5;
