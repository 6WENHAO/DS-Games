<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: linear-gradient(160deg, #1b2735 0%, #090a0f 100%);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    width: min(92vw, 900px); border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
  }
  .stage svg { display: block; width: 100%; height: auto; }
  p { color: #9fb3c8; margin: 0; font-size: 14px; letter-spacing: .18em; }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车">
  <title>鹈鹕骑自行车</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ED6F8"/>
      <stop offset="1" stop-color="#DFF3FB"/>
    </linearGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="500" fill="url(#sky)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <g>
    <g stroke="#FFC93C" stroke-width="5" stroke-linecap="round">
      <line x1="722" y1="90" x2="858" y2="90"/>
      <line x1="790" y1="22" x2="790" y2="158"/>
      <line x1="741.9" y1="41.9" x2="838.1" y2="138.1"/>
      <line x1="741.9" y1="138.1" x2="838.1" y2="41.9"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 790 90" to="360 790 90" dur="24s" repeatCount="indefinite"/>
    </g>
    <circle cx="790" cy="90" r="45" fill="url(#sunG)"/>
  </g>

  <!-- 云朵（飘过） -->
  <g fill="#FFFFFF" opacity="0.92">
    <g transform="translate(0 96)">
      <g>
        <ellipse cx="0" cy="0" rx="58" ry="20"/>
        <circle cx="-26" cy="-12" r="18"/>
        <circle cx="4" cy="-20" r="23"/>
        <circle cx="36" cy="-8" r="16"/>
        <animateTransform attributeName="transform" type="translate"
          values="-260 0; 1160 0" dur="20s" begin="-6s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(0 170) scale(0.7)">
      <g>
        <ellipse cx="0" cy="0" rx="58" ry="20"/>
        <circle cx="-26" cy="-12" r="18"/>
        <circle cx="4" cy="-20" r="23"/>
        <circle cx="36" cy="-8" r="16"/>
        <animateTransform attributeName="transform" type="translate"
          values="-380 0; 1660 0" dur="30s" begin="-18s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- 远山与草地 -->
  <ellipse cx="150" cy="405" rx="230" ry="75" fill="#79C07A"/>
  <ellipse cx="690" cy="405" rx="270" ry="95" fill="#67B06D"/>
  <rect y="400" width="900" height="100" fill="#8BC34A"/>

  <!-- 公路（虚线向后滚动，营造前进感） -->
  <rect y="440" width="900" height="60" fill="#4B4B55"/>
  <rect y="440" width="900" height="4" fill="#3C3C45"/>
  <path d="M-40,472 H940" stroke="#F6C445" stroke-width="5" stroke-dasharray="45 35" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;160" dur="0.55s" repeatCount="indefinite"/>
  </path>

  <!-- 速度线 -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M90,210 H200" stroke-dasharray="34 46">
      <animate attributeName="stroke-dashoffset" values="0;160" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M110,242 H210" stroke-dasharray="34 46">
      <animate attributeName="stroke-dashoffset" values="0;160" dur="0.62s" repeatCount="indefinite"/>
    </path>
    <path d="M80,274 H190" stroke-dasharray="34 46">
      <animate attributeName="stroke-dashoffset" values="0;160" dur="0.56s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="420" cy="452" rx="215" ry="10" fill="#000000" opacity="0.18"/>

  <!-- 远侧腿（相位差 180°，跟随踏板） -->
  <path fill="none" stroke="#D97E5F" stroke-width="11" stroke-linecap="round"
        d="M358,262 Q380,324 355,380">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
      values="M358,262 Q380,324 355,380;
              M358,262 Q405,289 400,335;
              M358,262 Q415,310 445,380;
              M358,262 Q402,341 400,425;
              M358,262 Q380,324 355,380"/>
  </path>
  <ellipse cx="355" cy="380" rx="11" ry="6" fill="#C96A45" stroke="#B85C3B" stroke-width="1.5">
    <animate attributeName="cx" values="355;400;445;400;355" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;335;380;425;380" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 自行车 -->
  <!-- 后轮 -->
  <g>
    <circle cx="280" cy="380" r="70" fill="none" stroke="#2B2D42" stroke-width="11"/>
    <circle cx="280" cy="380" r="57" fill="none" stroke="#ADB5BD" stroke-width="3"/>
    <g stroke="#CED4DA" stroke-width="3">
      <line x1="223" y1="380" x2="337" y2="380"/>
      <line x1="280" y1="323" x2="280" y2="437"/>
      <line x1="239.7" y1="339.7" x2="320.3" y2="420.3"/>
      <line x1="239.7" y1="420.3" x2="320.3" y2="339.7"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 280 380" to="360 280 380" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="280" cy="380" r="9" fill="#495057"/>
  </g>
  <!-- 前轮 -->
  <g>
    <circle cx="560" cy="380" r="70" fill="none" stroke="#2B2D42" stroke-width="11"/>
    <circle cx="560" cy="380" r="57" fill="none" stroke="#ADB5BD" stroke-width="3"/>
    <g stroke="#CED4DA" stroke-width="3">
      <line x1="503" y1="380" x2="617" y2="380"/>
      <line x1="560" y1="323" x2="560" y2="437"/>
      <line x1="519.7" y1="339.7" x2="600.3" y2="420.3"/>
      <line x1="519.7" y1="420.3" x2="600.3" y2="339.7"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 560 380" to="360 560 380" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="560" cy="380" r="9" fill="#495057"/>
  </g>

  <!-- 链条与齿盘 -->
  <circle cx="400" cy="380" r="17" fill="none" stroke="#343A40" stroke-width="4"/>
  <circle cx="280" cy="380" r="7" fill="none" stroke="#343A40" stroke-width="3"/>
  <path d="M280,373 L400,363" stroke="#343A40" stroke-width="2.5" stroke-dasharray="5 3" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="0.4s" repeatCount="indefinite"/>
  </path>
  <path d="M400,397 L280,387" stroke="#343A40" stroke-width="2.5" stroke-dasharray="5 3" fill="none">
    <animate attributeName="stroke-dashoffset" values="32;0" dur="0.4s" repeatCount="indefinite"/>
  </path>

  <!-- 车架 / 前叉 / 车把 / 车座 -->
  <g stroke="#E63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M280,380 L400,380 L368,258 Z"/>
    <path d="M368,258 L545,272"/>
    <path d="M400,380 L550,296"/>
    <path d="M548,268 L552,296" stroke-width="9"/>
  </g>
  <path d="M552,296 L560,380" stroke="#343A40" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M548,268 L544,246" stroke="#343A40" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M544,246 C536,237 526,237 520,243" stroke="#343A40" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="520" cy="243" r="4.5" fill="#212529"/>
  <rect x="346" y="248" width="46" height="11" rx="5" fill="#212529"/>

  <!-- 曲柄与踏板（踏板保持水平） -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 400 380" to="360 400 380" dur="1.2s" repeatCount="indefinite"/>
    <line x1="400" y1="380" x2="445" y2="380" stroke="#343A40" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="380" x2="355" y2="380" stroke="#343A40" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(445 380)">
      <rect x="-14" y="-5" width="28" height="10" rx="4" fill="#212529"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(355 380)">
      <rect x="-14" y="-5" width="28" height="10" rx="4" fill="#212529"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 近侧腿（跟随踏板） -->
  <path fill="none" stroke="#F4A261" stroke-width="12" stroke-linecap="round"
        d="M372,266 Q415,310 445,380">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
      values="M372,266 Q415,310 445,380;
              M372,266 Q402,341 400,425;
              M372,266 Q380,324 355,380;
              M372,266 Q405,289 400,335;
              M372,266 Q415,310 445,380"/>
  </path>
  <ellipse cx="445" cy="380" rx="12" ry="6.5" fill="#E76F51" stroke="#D45B3E" stroke-width="1.5">
    <animate attributeName="cx" values="445;400;355;400;445" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;425;380;335;380" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 鹈鹕（身体随蹬踏轻微起伏） -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 3; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M300,190 L252,166 L266,196 L240,196 L268,214 L252,230 L298,224 Z"
          fill="#EDEFF2" stroke="#D6DBE0" stroke-width="2" stroke-linejoin="round"/>

    <!-- 身体 -->
    <ellipse cx="358" cy="206" rx="86" ry="56" fill="#F8F9FA" stroke="#D6DBE0"
             stroke-width="2.5" transform="rotate(-10 358 206)"/>
    <path d="M290,238 Q358,268 428,224" stroke="#E3E7EB" stroke-width="6"
          fill="none" stroke-linecap="round"/>

    <!-- 翅膀（搭在车把上，轻微扇动） -->
    <path d="M382,186 C424,172 482,196 524,240 C494,254 432,242 388,216 Z"
          fill="#E9ECEF" stroke="#D0D6DC" stroke-width="2.5" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate"
        values="0 388 196; 3 388 196; 0 388 196; -2 388 196; 0 388 196"
        dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M418,204 Q458,214 498,234" stroke="#D0D6DC" stroke-width="2" fill="none"/>

    <!-- 脖子（先描边后填充，形成轮廓） -->
    <path d="M408,176 C446,168 460,146 452,112" stroke="#D6DBE0" stroke-width="28"
          fill="none" stroke-linecap="round"/>
    <path d="M408,176 C446,168 460,146 452,112" stroke="#F8F9FA" stroke-width="24"
          fill="none" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="452" cy="106" r="21" fill="#F8F9FA" stroke="#D6DBE0" stroke-width="2"/>
    <path d="M438,90 Q430,80 436,72 Q440,82 446,86 Z" fill="#E9ECEF"/>

    <!-- 大嘴与喉囊 -->
    <path d="M464,94 L562,110 L466,120 Z" fill="#F6BD60" stroke="#E29940"
          stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="470" y1="106" x2="546" y2="110" stroke="#E29940" stroke-width="1.5"/>
    <path d="M466,118 C470,148 506,152 540,127 L562,111 C528,132 492,132 466,118 Z"
          fill="#F28C50" stroke="#E29940" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 喉囊里的小鱼 -->
    <g>
      <ellipse cx="500" cy="134" rx="10" ry="5" fill="#8FC1DD"/>
      <path d="M508,134 l8,-5 v10 z" fill="#8FC1DD"/>
      <circle cx="494" cy="133" r="1.2" fill="#2B2D42"/>
    </g>

    <!-- 眼睛 -->
    <circle cx="458" cy="99" r="4" fill="#2B2D42"/>
    <circle cx="459.5" cy="97.5" r="1.4" fill="#FFFFFF"/>
  </g>
</svg>
</div>

<p>鹈鹕骑士 · SVG + SMIL 2D 动画</p>

</body>
</html>
