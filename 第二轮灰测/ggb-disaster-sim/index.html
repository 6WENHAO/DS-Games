<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金门大桥电影级灾难模拟器 · Golden Gate Cinematic Disaster Simulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080c; overflow: hidden; }
  #viewport { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #boot-status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #cfe0ee; font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace; z-index: 50;
    background: radial-gradient(circle at 50% 45%, #12202c 0%, #05080c 70%); text-align: center;
    padding: 0 24px; }
  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ffb38a; font: 13px/1.7 ui-monospace, monospace; padding: 0 32px; text-align: center; z-index: 60;
    background: #05080c; }
  #gpu-note { position: fixed; bottom: 10px; left: 12px; z-index: 20;
    font: 10px/1.5 ui-monospace, monospace; color: #5d7488; }
  #gpu-note a { color: #8fb8d8; }
</style>

<!--
  Bare-specifier resolution. Everything in src/ imports 'three',
  'three/addons/…' and 'rapier'; the mapping lives here and only here, so
  swapping a CDN, pinning a different revision or moving to a local
  node_modules install is a one-file change.

  three 0.180.0 — chosen because it is the first well-settled line that ships
  BOTH the classic WebGL2 addons (EffectComposer/ShaderPass/UnrealBloomPass,
  used by the cinematic chain) and the standalone `three/tsl` build used by the
  optional WebGPU ocean demo.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
    "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="boot-status">启动中 / booting…</div>
  <div id="nogl">
    此浏览器不支持 WebGL2，无法运行本模拟器。<br>
    WebGL2 is required and is not available in this browser.
  </div>
  <div id="gpu-note"></div>

  <script>
    // Fail fast and legibly rather than throwing from deep inside three.
    (function () {
      var c = document.createElement('canvas');
      var ok = !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
      if (!ok) {
        document.getElementById('nogl').style.display = 'flex';
        document.getElementById('boot-status').remove();
        return;
      }
      var note = document.getElementById('gpu-note');
      if ('gpu' in navigator) {
        note.innerHTML = 'WebGPU detected · TSL ocean demo: <a href="./webgpu-ocean.html">webgpu-ocean.html</a>';
      } else {
        note.textContent = 'WebGL2 path (WebGPU unavailable in this browser)';
      }
    })();
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
