<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁幕1994 · IRON CURTAIN 1994</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<!-- ============ 启动错误面板（任何脚本异常都会显示在这里，方便排查） ============ -->
<div id="fatal" style="display:none;position:fixed;inset:0;z-index:9999;background:#12161c;color:#e0c8c2;padding:26px;overflow:auto;font-family:Consolas,monospace;font-size:13px">
  <h2 style="color:#c25b52;font-family:Georgia,serif">⚠ 运行时错误</h2>
  <div id="fatal-body"></div>
  <p style="color:#8d97a3">请把上面的文字反馈给开发者。刷新页面可重试。</p>
</div>

<!-- ============ 主菜单 ============ -->
<div id="screen-menu" class="screen on">
  <div class="menu-wrap">
    <div class="title-block">
      <h1 id="m-title">铁幕1994</h1>
      <div class="en">IRON CURTAIN 1994</div>
      <div class="title-rule"></div>
      <div class="tagline" id="m-tagline"></div>
    </div>

    <div class="menu-grid">
      <div>
        <div class="panel">
          <div class="panel-h"><span>作战模式</span><span class="dim" style="font-size:11px">MODE OF ENGAGEMENT</span></div>
          <div class="panel-b" id="m-modes"></div>
        </div>
        <div class="panel" style="margin-top:14px">
          <div class="panel-h"><span>战役阵营</span><span class="dim" style="font-size:11px">THEATER COMMAND</span></div>
          <div class="panel-b">
            <div class="side-pick" id="m-sides"></div>
            <div class="hr"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
              <button class="btn primary" id="btn-campaign">进入战役</button>
              <button class="btn" id="btn-skirmish">自由遭遇战</button>
              <button class="btn" id="btn-lore">设定集 · 时间线</button>
              <button class="btn" id="btn-help">规则与操作</button>
            </div>
            <div class="hr"></div>
            <div style="display:flex;gap:8px;align-items:center">
              <button class="btn sm" id="btn-wipe">清除存档</button>
              <span class="dim" id="m-save-info" style="font-size:11px"></span>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-h"><span>1994 年 · 战局态势</span></div>
          <div class="panel-b scroll" id="m-intro" style="max-height:46vh"></div>
        </div>
        <div class="panel" style="margin-top:14px">
          <div class="panel-h"><span>超限战 · 混合战争</span></div>
          <div class="panel-b" id="m-doctrine" style="font-size:12px;line-height:1.7"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 战役 / 战略层 ============ -->
<div id="screen-campaign" class="screen">
  <div class="camp-layout">
    <div class="panel" style="display:flex;flex-direction:column">
      <div class="panel-h"><span id="c-name">战役</span><button class="btn sm" id="c-back">返回</button></div>
      <div class="tab-body" id="c-missions"></div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column">
      <div class="panel-h"><span>超限战战略层 · 非常规作战资源分配</span><span class="dim" id="c-sp" style="font-size:12px"></span></div>
      <div class="tab-body">
        <div class="dim" style="font-size:12px;margin-bottom:8px" id="c-strat-hint"></div>
        <div class="strat-grid" id="c-strat"></div>
      </div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column">
      <div class="panel-h"><span>战区态势</span></div>
      <div class="tab-body" id="c-status"></div>
    </div>
  </div>
</div>

<!-- ============ 任务简报 ============ -->
<div id="screen-briefing" class="screen">
  <div class="brief-wrap">
    <div class="brief-doc" id="b-doc"></div>
    <div class="brief-actions">
      <button class="btn" id="b-back">返回战役</button>
      <button class="btn" id="b-deck">编辑卡组</button>
      <button class="btn primary" id="b-start">开始作战</button>
    </div>
  </div>
</div>

<!-- ============ 卡组编辑器 ============ -->
<div id="screen-deck" class="screen">
  <div class="deck-layout">
    <div class="panel" style="display:flex;flex-direction:column;overflow:hidden">
      <div class="panel-h">
        <span>可用装备库 · <span id="d-side-name"></span></span>
        <span class="dim" id="d-mode-name" style="font-size:11px"></span>
      </div>
      <div class="filters" id="d-filters"></div>
      <div class="pool" id="d-pool"></div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column;overflow:hidden">
      <div class="panel-h">
        <span>作战卡组</span>
        <span id="d-slots" class="tag gold"></span>
      </div>
      <div class="tabs" id="d-tabs">
        <div class="tab on" data-t="units">部队</div>
        <div class="tab" data-t="support">支援打击</div>
        <div class="tab" data-t="ops">超限战指令</div>
      </div>
      <div class="tab-body" id="d-deck"></div>
      <div style="padding:8px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button class="btn sm" id="d-auto">自动配卡</button>
        <button class="btn sm" id="d-clear">清空</button>
        <button class="btn sm" id="d-back">返回</button>
        <button class="btn sm primary" id="d-save">保存卡组</button>
      </div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column;overflow:hidden">
      <div class="panel-h"><span>装备详情 / 改装挂载</span></div>
      <div class="tab-body" id="d-detail"><div class="dim">从左侧选择一件装备。</div></div>
    </div>
  </div>
</div>

<!-- ============ 战斗 ============ -->
<div id="screen-battle" class="screen">
  <div class="panel b-top" id="b-hud"></div>

  <div class="panel b-left">
    <div id="u-panel" style="display:flex;flex-direction:column;height:100%"></div>
  </div>

  <div class="b-map">
    <canvas id="map-canvas"></canvas>
    <div id="map-overlay"></div>
  </div>

  <div class="panel b-right" style="overflow:hidden">
    <div class="tabs" id="r-tabs">
      <div class="tab on" data-t="reserve">预备队</div>
      <div class="tab" data-t="support">支援</div>
      <div class="tab" data-t="ops">超限战</div>
      <div class="tab" data-t="intel">情报</div>
    </div>
    <div class="tab-body" id="r-body"></div>
  </div>

  <div class="b-bottom">
    <div class="panel log-box" id="b-log"></div>
    <div class="panel chatter" id="b-chatter"></div>
  </div>
</div>

<!-- ============ 战斗结果 ============ -->
<div id="screen-result" class="screen">
  <div class="brief-wrap">
    <div class="brief-doc" id="r-doc"></div>
    <div class="brief-actions" id="r-actions"></div>
  </div>
</div>

<!-- ============ 设定集 / 帮助 ============ -->
<div id="screen-lore" class="screen">
  <div class="lore-wrap">
    <div class="panel">
      <div class="panel-h"><span id="l-title">设定集</span><button class="btn sm" id="l-back">返回</button></div>
      <div class="panel-b" id="l-body"></div>
    </div>
  </div>
</div>

<div id="tip"></div>
<div id="modal-root"></div>

<!-- ============ 脚本（经典脚本，按依赖顺序；可 file:// 直接打开） ============ -->
<script>
window.addEventListener('error', function (e) {
  var f = document.getElementById('fatal'), b = document.getElementById('fatal-body');
  if (!f || !b) return;
  f.style.display = 'block';
  b.innerHTML += '<p>' + (e.message || 'unknown') + '<br>@ ' + (e.filename || '') + ':' + (e.lineno || 0) + '</p>';
});
</script>
<script src="js/core/core.js"></script>
<script src="js/engine/rules.js"></script>
<script src="js/data/loadouts.js"></script>
<script src="js/data/units_wp.js"></script>
<script src="js/data/units_nato.js"></script>
<script src="js/data/hybrid.js"></script>
<script src="js/data/lore.js"></script>
<script src="js/data/campaign.js"></script>
<script src="js/data/maps.js"></script>
<script src="js/engine/battle.js"></script>
<script src="js/engine/ai.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/ui/deck.js"></script>
<script src="js/ui/battleui.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
