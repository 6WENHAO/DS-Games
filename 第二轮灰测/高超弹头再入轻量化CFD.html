<script>
/* ============================================================================
   高超声速 CFD 演示 —— 二维可压缩 Euler 方程 / HLLC + MUSCL / 浸没边界
   ========================================================================== */
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const f1=v=>v.toFixed(1),f2=v=>v.toFixed(2),f3=v=>v.toFixed(3);
const ERR=[];
function fail(m){ ERR.push(m); const e=$('#err'); e.style.display='block'; e.textContent=ERR.join('\n'); }
window.addEventListener('error',ev=>fail('运行时错误: '+ev.message+' @'+(ev.lineno||'?')));
const GAM=1.4, RGAS=287.053;
const eng=v=>{ const a=Math.abs(v);
  if(a===0) return '0';
  if(a>=1e6) return (v/1e6).toFixed(2)+'M';
  if(a>=1e3) return (v/1e3).toFixed(2)+'k';
  if(a>=1) return v.toFixed(2);
  if(a>=1e-3) return (v*1e3).toFixed(2)+'m';
  return v.toExponential(2);
};

/* ---------------- 标准大气 (ISA, 0–71 km) ---------------- */
const ISA=[[0,288.15,-6.5,101325],[11,216.65,0,22632.06],[20,216.65,1.0,5474.889],
           [32,228.65,2.8,868.0187],[47,270.65,0,110.9063],[51,270.65,-2.8,66.93887],
           [71,214.65,-2.0,3.956420]];
function atmos(hkm){
  let i=0; while(i<ISA.length-1&&hkm>=ISA[i+1][0]) i++;
  const [hb,Tb,L,pb]=ISA[i], dh=hkm-hb;
  const T=Tb+L*dh;
  const g0=9.80665;
  let p;
  if(Math.abs(L)<1e-9) p=pb*Math.exp(-g0*1000*dh/(RGAS*Tb));
  else p=pb*Math.pow(T/Tb,-g0*1000/(RGAS*L));
  const rho=p/(RGAS*T);
  return {T,p,rho,a:Math.sqrt(GAM*RGAS*T),mu:1.458e-6*Math.pow(T,1.5)/(T+110.4)};
}
/* ---------------- 解析气动关系（用于校验） ---------------- */
function normalShock(M){
  const M2=M*M;
  const pr=1+2*GAM/(GAM+1)*(M2-1);
  const rr=(GAM+1)*M2/((GAM-1)*M2+2);
  const Tr=pr/rr;
  const M2n=Math.sqrt((1+(GAM-1)/2*M2)/(GAM*M2-(GAM-1)/2));
  return {pr,rr,Tr,M2:M2n};
}
function pitot(M){   // 正激波后总压 / 来流静压 (Rayleigh)
  const M2=M*M;
  return Math.pow((GAM+1)*(GAM+1)*M2/(4*GAM*M2-2*(GAM-1)),GAM/(GAM-1))*((1-GAM+2*GAM*M2)/(GAM+1));
}
function thetaOfBeta(beta,M){
  const s=Math.sin(beta),M2=M*M;
  const num=2/Math.tan(beta)*(M2*s*s-1);
  const den=M2*(GAM+Math.cos(2*beta))+2;
  return Math.atan(num/den);
}
function betaWeak(thetaDeg,M){        // θ-β-M 弱解，二分法
  const th=thetaDeg*Math.PI/180;
  if(M<=1.0001) return NaN;
  let lo=Math.asin(1/M)+1e-6, hi=Math.PI/2-1e-6;
  // 找最大偏转角
  let bMax=lo,tMax=-1;
  for(let k=0;k<=90;k++){ const b=lo+(hi-lo)*k/90, t=thetaOfBeta(b,M); if(t>tMax){tMax=t;bMax=b;} }
  if(th>tMax) return NaN;             // 激波脱体
  hi=bMax;
  for(let k=0;k<70;k++){ const m=(lo+hi)/2; if(thetaOfBeta(m,M)<th) lo=m; else hi=m; }
  return (lo+hi)/2*180/Math.PI;
}
function obliqueSolve(thetaDeg,M){
  const bd=betaWeak(thetaDeg,M);
  if(!isFinite(bd)) return null;
  const b=bd*Math.PI/180, Mn=M*Math.sin(b), ns=normalShock(Mn);
  return {beta:bd,pr:ns.pr,rr:ns.rr,Tr:ns.Tr,
    M2:ns.M2/Math.sin(b-thetaDeg*Math.PI/180),
    cp:(ns.pr-1)/(0.5*GAM*M*M)};
}
function prandtlMeyer(M){
  const m=Math.sqrt((GAM+1)/(GAM-1));
  return (m*Math.atan(Math.sqrt((M*M-1)/(GAM+1)*(GAM-1)))-Math.atan(Math.sqrt(M*M-1)))*180/Math.PI;
}

/* ---------------- 状态 ---------------- */
const S={ma:6, alt:30, aoa:6, geo:'wr', rn:12, del:9, len:2.4,
  grid:1, cfl:0.42, iters:4, muscl:true, local:false,
  field:'p', cmap:'inferno', part:true, stream:true, cp:true, shock:true, gridOn:false, auto:true,
  run:true, turbo:false};
try{ new URLSearchParams(location.search).forEach((v,k)=>{
  if(!(k in S)) return;
  if(v==='true'||v==='false'){S[k]=(v==='true');return;}
  S[k]=/^-?\d+(\.\d+)?$/.test(v)?parseFloat(v):v;
}); }catch(e){}

/* ---------------- 几何（物理坐标，米） ---------------- */
let BODY=[],CHORD=1,NOSE=[0,0],SEG=[];
function buildGeom(){
  const L=S.len, del=S.del*Math.PI/180, rn=S.rn/1000;
  const P=[];
  if(S.geo==='wd'){                       // 纯楔（校验用）
    const t=15*Math.PI/180;
    P.push([0,0],[L,-L*Math.tan(t)],[L,L*Math.tan(t)*0.25],[0.02,0.004]);
  }else if(S.geo==='wr'){                 // 乘波体：尖前缘 + 平压缩下表面 + 膨胀上表面
    const hL=L*Math.tan(del), hu=L*Math.tan(2.2*Math.PI/180);
    P.push([0,0]);
    P.push([L*0.42,-hL*0.42],[L,-hL]);             // 下压缩面
    P.push([L,-hL+0.10*L]);                        // 底部
    P.push([L*0.62,hu*0.78],[L*0.24,hu*0.34]);     // 上膨胀面（微凸）
  }else if(S.geo==='bi'){                 // 双锥
    const t1=14*Math.PI/180,t2=6.5*Math.PI/180;
    const x1=L*0.34;
    P.push([0,0],[x1,-x1*Math.tan(t1)],[L,-x1*Math.tan(t1)-(L-x1)*Math.tan(t2)],
           [L,x1*Math.tan(t1)+(L-x1)*Math.tan(t2)],[x1,x1*Math.tan(t1)]);
  }else{                                  // 球锥（球头 + 直锥，按边界顺序构成简单多边形）
    const t=11*Math.PI/180, R=Math.max(0.02,rn);
    const xt=R-R*Math.sin(t), yb=R*Math.cos(t);
    const yBase=yb+(L-xt)*Math.tan(t);
    P.push([L,-yBase],[xt,-yb]);
    for(let i=0;i<=14;i++){ const ps=-(Math.PI/2-t)+(Math.PI-2*t)*i/14;
      P.push([R-R*Math.cos(ps),R*Math.sin(ps)]); }
    P.push([xt,yb],[L,yBase]);
  }
  // 头部钝化（对尖前缘外形做圆角）
  if(rn>0.002&&S.geo!=='sc'){
    const k=Math.min(0.28*L,rn*6);
    const pts=[];
    for(let i=0;i<P.length;i++){
      const p=P[i];
      if(i===0){
        const a=P[P.length-1],b=P[1];
        const d1=Math.hypot(b[0]-p[0],b[1]-p[1]),d2=Math.hypot(a[0]-p[0],a[1]-p[1]);
        const t1=[p[0]+(b[0]-p[0])/d1*k,p[1]+(b[1]-p[1])/d1*k];
        const t2=[p[0]+(a[0]-p[0])/d2*k,p[1]+(a[1]-p[1])/d2*k];
        const n=6;
        for(let j=0;j<=n;j++){
          const u=j/n, w=(1-u)*(1-u), w2=2*u*(1-u), w3=u*u;
          pts.push([w*t2[0]+w2*p[0]*0.62+w2*((t1[0]+t2[0])/2)*0.38+w3*t1[0],
                    w*t2[1]+w2*p[1]*0.62+w2*((t1[1]+t2[1])/2)*0.38+w3*t1[1]]);
        }
      }else pts.push(p);
    }
    P.length=0; P.push(...pts);
  }
  // 攻角旋转（绕头部）
  const ca=Math.cos(-S.aoa*Math.PI/180), sa=Math.sin(-S.aoa*Math.PI/180);
  BODY=P.map(p=>[p[0]*ca-p[1]*sa, p[0]*sa+p[1]*ca]);
  CHORD=L;
  // 段中点 + 外法线 + 长度
  SEG=[];
  for(let i=0;i<BODY.length;i++){
    const a=BODY[i],b=BODY[(i+1)%BODY.length];
    const ex=b[0]-a[0],ey=b[1]-a[1],len=Math.hypot(ex,ey);
    if(len<1e-9) continue;
    let nx=ey/len,ny=-ex/len;
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    if(inPoly(mx+nx*1e-4,my+ny*1e-4)){ nx=-nx; ny=-ny; }
    SEG.push({mx,my,nx,ny,len,s:0});
  }
  let acc=0; for(const g of SEG){ g.s=acc+g.len/2; acc+=g.len; }
  for(const g of SEG) g.sn=g.s/acc;
}
function inPoly(x,y){
  let c=false;
  for(let i=0,j=BODY.length-1;i<BODY.length;j=i++){
    const a=BODY[i],b=BODY[j];
    if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) c=!c;
  }
  return c;
}
function distPoly(x,y){
  let d=1e9;
  for(let i=0;i<BODY.length;i++){
    const a=BODY[i],b=BODY[(i+1)%BODY.length];
    const ex=b[0]-a[0],ey=b[1]-a[1];
    const L2=ex*ex+ey*ey||1e-12;
    let t=((x-a[0])*ex+(y-a[1])*ey)/L2; t=t<0?0:(t>1?1:t);
    const dx=x-(a[0]+t*ex),dy=y-(a[1]+t*ey);
    const dd=dx*dx+dy*dy;
    if(dd<d) d=dd;
  }
  return Math.sqrt(d);
}

/* ---------------- 网格与场 ---------------- */
const GRIDS=[[240,120],[320,160],[420,210],[520,260]];
let NX=0,NY=0,nx=0,ny=0,dx=0,dy=0,x0=0,y0=0,N=0;
let ro,mx,my,En, pr_,ur_,vr_,pp_, R0,R1,R2,R3, phi,solid,ghost=[],dtl;
let FS={};                                     // 来流
let iter=0,simT=0,res0=0,resNow=1,RESH=[];
function allocate(){
  [nx,ny]=GRIDS[S.grid|0];
  const Lx=Math.max(3.2,S.len*2.6), Ly=Lx*ny/nx;
  dx=Lx/nx; dy=Ly/ny;
  NX=nx+4; NY=ny+4; N=NX*NY;
  x0=-S.len*0.55-2*dx; y0=-Ly/2-2*dy;         // 头部位于 (0,0)
  ro=new Float64Array(N); mx=new Float64Array(N); my=new Float64Array(N); En=new Float64Array(N);
  pr_=new Float64Array(N); ur_=new Float64Array(N); vr_=new Float64Array(N); pp_=new Float64Array(N);
  R0=new Float64Array(N); R1=new Float64Array(N); R2=new Float64Array(N); R3=new Float64Array(N);
  phi=new Float64Array(N); solid=new Uint8Array(N); dtl=new Float64Array(N);
}
const IX=(i,j)=>i+j*NX;
const cellX=i=>x0+(i+0.5)*dx, cellY=j=>y0+(j+0.5)*dy;
function markSolid(){
  ghost=[];
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    const x=cellX(i),y=cellY(j);
    let d=distPoly(x,y);
    if(inPoly(x,y)) d=-d;
    const k=IX(i,j);
    phi[k]=d; solid[k]=d<0?1:0;
  }
  const band=2.2*Math.max(dx,dy);
  for(let j=1;j<NY-1;j++)for(let i=1;i<NX-1;i++){
    const k=IX(i,j);
    if(!solid[k]||phi[k]<-band) continue;
    // 法线 = ∇φ
    let gx=(phi[k+1]-phi[k-1])/(2*dx), gy=(phi[k+NX]-phi[k-NX])/(2*dy);
    let gl=Math.hypot(gx,gy)||1; gx/=gl; gy/=gl;
    const d=-phi[k];
    const px=cellX(i)+2*d*gx, py=cellY(j)+2*d*gy;
    // 双线性权（仅取流体点）
    const fi=(px-x0)/dx-0.5, fj=(py-y0)/dy-0.5;
    const i0=Math.floor(fi),j0=Math.floor(fj), tx=fi-i0, ty=fj-j0;
    const idx=[],wt=[];
    let sw=0;
    for(let b=0;b<2;b++)for(let a=0;a<2;a++){
      const ii=clamp(i0+a,0,NX-1), jj=clamp(j0+b,0,NY-1), kk=IX(ii,jj);
      if(solid[kk]) continue;
      const w=(a?tx:1-tx)*(b?ty:1-ty);
      if(w<=0) continue;
      idx.push(kk); wt.push(w); sw+=w;
    }
    if(sw<1e-6){ // 退化：找最近流体格
      let best=-1,bd=1e9;
      for(let b=-2;b<=2;b++)for(let a=-2;a<=2;a++){
        const ii=clamp(i+a,0,NX-1),jj=clamp(j+b,0,NY-1),kk=IX(ii,jj);
        if(solid[kk]) continue;
        const dd=a*a+b*b; if(dd<bd){bd=dd;best=kk;}
      }
      if(best<0) continue;
      idx.length=0; wt.length=0; idx.push(best); wt.push(1); sw=1;
    }
    for(let t=0;t<wt.length;t++) wt[t]/=sw;
    ghost.push({k,nx:gx,ny:gy,idx:Int32Array.from(idx),wt:Float64Array.from(wt)});
  }
}
function setFreestream(){
  const A=atmos(S.alt);
  const M=Math.max(1.1,S.ma);
  const V=M*A.a;
  FS={M,T:A.T,p:A.p,rho:A.rho,a:A.a,V,u:V,v:0,q:0.5*A.rho*V*V,mu:A.mu,
      Re:A.rho*V*S.len/A.mu, T0:A.T*(1+0.2*M*M), p0:A.p*pitot(M),
      alt:S.alt};
}
function initField(){
  setFreestream();
  const E=FS.p/(GAM-1)+0.5*FS.rho*FS.V*FS.V;
  for(let k=0;k<N;k++){ ro[k]=FS.rho; mx[k]=FS.rho*FS.V; my[k]=0; En[k]=E; }
  iter=0; simT=0; res0=0; resNow=1; RESH=[];
}
function rebuild(){ allocate(); buildGeom(); markSolid(); initField(); resizeCv(); }

/* ---------------- 原始量 / 边界 / 鬼点 ---------------- */
function toPrim(){
  for(let k=0;k<N;k++){
    let r=ro[k]; if(r<1e-8) r=1e-8;
    const u=mx[k]/r, v=my[k]/r;
    let p=(GAM-1)*(En[k]-0.5*r*(u*u+v*v));
    if(p<1e-3) p=1e-3;
    pr_[k]=r; ur_[k]=u; vr_[k]=v; pp_[k]=p;
  }
}
function applyBC(){
  // 左：超声速入口；右：外推；上下：外推
  for(let j=0;j<NY;j++){
    for(let i=0;i<2;i++){ const k=IX(i,j);
      pr_[k]=FS.rho; ur_[k]=FS.V; vr_[k]=0; pp_[k]=FS.p; }
    const s=IX(NX-3,j);
    for(let i=NX-2;i<NX;i++){ const k=IX(i,j);
      pr_[k]=pr_[s]; ur_[k]=ur_[s]; vr_[k]=vr_[s]; pp_[k]=pp_[s]; }
  }
  for(let i=0;i<NX;i++){
    const sb=IX(i,2), st=IX(i,NY-3);
    for(let j=0;j<2;j++){ const k=IX(i,j);
      pr_[k]=pr_[sb]; ur_[k]=ur_[sb]; vr_[k]=vr_[sb]; pp_[k]=pp_[sb]; }
    for(let j=NY-2;j<NY;j++){ const k=IX(i,j);
      pr_[k]=pr_[st]; ur_[k]=ur_[st]; vr_[k]=vr_[st]; pp_[k]=pp_[st]; }
  }
  // 浸没边界鬼点：镜像速度 + 零法向梯度
  for(let g=0;g<ghost.length;g++){
    const G=ghost[g], id=G.idx, w=G.wt;
    let r=0,u=0,v=0,p=0;
    for(let t=0;t<id.length;t++){ const kk=id[t],ww=w[t];
      r+=pr_[kk]*ww; u+=ur_[kk]*ww; v+=vr_[kk]*ww; p+=pp_[kk]*ww; }
    const un=u*G.nx+v*G.ny;
    const k=G.k;
    pr_[k]=r; pp_[k]=p; ur_[k]=u-2*un*G.nx; vr_[k]=v-2*un*G.ny;
  }
}
/* ---------------- HLLC 通量 ---------------- */
const FX=new Float64Array(4);
function hllc(rL,uL,vL,pL,rR,uR,vR,pR){
  const aL=Math.sqrt(GAM*pL/rL), aR=Math.sqrt(GAM*pR/rR);
  const EL=pL/(GAM-1)+0.5*rL*(uL*uL+vL*vL), ER=pR/(GAM-1)+0.5*rR*(uR*uR+vR*vR);
  const SL=Math.min(uL-aL,uR-aR), SR=Math.max(uL+aL,uR+aR);
  if(SL>=0){ FX[0]=rL*uL; FX[1]=rL*uL*uL+pL; FX[2]=rL*uL*vL; FX[3]=uL*(EL+pL); return; }
  if(SR<=0){ FX[0]=rR*uR; FX[1]=rR*uR*uR+pR; FX[2]=rR*uR*vR; FX[3]=uR*(ER+pR); return; }
  const den=rL*(SL-uL)-rR*(SR-uR);
  const SM=(pR-pL+rL*uL*(SL-uL)-rR*uR*(SR-uR))/(Math.abs(den)<1e-12?1e-12:den);
  if(SM>=0){
    const rs=rL*(SL-uL)/(SL-SM);
    const Es=rs*(EL/rL+(SM-uL)*(SM-pL/(rL*(SL-uL))));
    FX[0]=rL*uL+SL*(rs-rL);
    FX[1]=rL*uL*uL+pL+SL*(rs*SM-rL*uL);
    FX[2]=rL*uL*vL+SL*(rs*vL-rL*vL);
    FX[3]=uL*(EL+pL)+SL*(Es-EL);
  }else{
    const rs=rR*(SR-uR)/(SR-SM);
    const Es=rs*(ER/rR+(SM-uR)*(SM-pR/(rR*(SR-uR))));
    FX[0]=rR*uR+SR*(rs-rR);
    FX[1]=rR*uR*uR+pR+SR*(rs*SM-rR*uR);
    FX[2]=rR*uR*vR+SR*(rs*vR-rR*vR);
    FX[3]=uR*(ER+pR)+SR*(Es-ER);
  }
}
const mm=(a,b)=>(a*b<=0)?0:(Math.abs(a)<Math.abs(b)?a:b);
/* ---------------- 单步推进 ---------------- */
function computeDt(){
  let smax=1e-9, sx=1e-9, sy=1e-9;
  for(let j=2;j<NY-2;j++)for(let i=2;i<NX-2;i++){
    const k=IX(i,j); if(solid[k]) continue;
    const a=Math.sqrt(GAM*pp_[k]/pr_[k]);
    const cx=Math.abs(ur_[k])+a, cy=Math.abs(vr_[k])+a;
    dtl[k]=S.cfl/(cx/dx+cy/dy);
    if(cx/dx+cy/dy>smax) smax=cx/dx+cy/dy;
  }
  return S.cfl/smax;
}
function step(){
  toPrim(); applyBC();
  const dt=computeDt();
  R0.fill(0); R1.fill(0); R2.fill(0); R3.fill(0);
  const useM=S.muscl;
  // x 方向
  for(let j=2;j<NY-2;j++){
    const b=j*NX;
    for(let i=1;i<NX-2;i++){
      const kL=b+i,kR=b+i+1;
      let rL=pr_[kL],uL=ur_[kL],vL=vr_[kL],pL=pp_[kL];
      let rR=pr_[kR],uR=ur_[kR],vR=vr_[kR],pR=pp_[kR];
      if(useM){
        const km=b+i-1,kp=b+i+2;
        rL+=0.5*mm(pr_[kL]-pr_[km],pr_[kR]-pr_[kL]); uL+=0.5*mm(ur_[kL]-ur_[km],ur_[kR]-ur_[kL]);
        vL+=0.5*mm(vr_[kL]-vr_[km],vr_[kR]-vr_[kL]); pL+=0.5*mm(pp_[kL]-pp_[km],pp_[kR]-pp_[kL]);
        rR-=0.5*mm(pr_[kR]-pr_[kL],pr_[kp]-pr_[kR]); uR-=0.5*mm(ur_[kR]-ur_[kL],ur_[kp]-ur_[kR]);
        vR-=0.5*mm(vr_[kR]-vr_[kL],vr_[kp]-vr_[kR]); pR-=0.5*mm(pp_[kR]-pp_[kL],pp_[kp]-pp_[kR]);
        if(rL<1e-7||pL<1e-4){rL=pr_[kL];uL=ur_[kL];vL=vr_[kL];pL=pp_[kL];}
        if(rR<1e-7||pR<1e-4){rR=pr_[kR];uR=ur_[kR];vR=vr_[kR];pR=pp_[kR];}
      }
      hllc(rL,uL,vL,pL,rR,uR,vR,pR);
      const f0=FX[0]/dx,f1=FX[1]/dx,f2=FX[2]/dx,f3=FX[3]/dx;
      R0[kL]-=f0; R1[kL]-=f1; R2[kL]-=f2; R3[kL]-=f3;
      R0[kR]+=f0; R1[kR]+=f1; R2[kR]+=f2; R3[kR]+=f3;
    }
  }
  // y 方向（交换 u,v）
  for(let i=2;i<NX-2;i++){
    for(let j=1;j<NY-2;j++){
      const kL=IX(i,j),kR=kL+NX;
      let rL=pr_[kL],uL=vr_[kL],vL=ur_[kL],pL=pp_[kL];
      let rR=pr_[kR],uR=vr_[kR],vR=ur_[kR],pR=pp_[kR];
      if(useM){
        const km=kL-NX,kp=kR+NX;
        rL+=0.5*mm(pr_[kL]-pr_[km],pr_[kR]-pr_[kL]); uL+=0.5*mm(vr_[kL]-vr_[km],vr_[kR]-vr_[kL]);
        vL+=0.5*mm(ur_[kL]-ur_[km],ur_[kR]-ur_[kL]); pL+=0.5*mm(pp_[kL]-pp_[km],pp_[kR]-pp_[kL]);
        rR-=0.5*mm(pr_[kR]-pr_[kL],pr_[kp]-pr_[kR]); uR-=0.5*mm(vr_[kR]-vr_[kL],vr_[kp]-vr_[kR]);
        vR-=0.5*mm(ur_[kR]-ur_[kL],ur_[kp]-ur_[kR]); pR-=0.5*mm(pp_[kR]-pp_[kL],pp_[kp]-pp_[kR]);
        if(rL<1e-7||pL<1e-4){rL=pr_[kL];uL=vr_[kL];vL=ur_[kL];pL=pp_[kL];}
        if(rR<1e-7||pR<1e-4){rR=pr_[kR];uR=vr_[kR];vR=ur_[kR];pR=pp_[kR];}
      }
      hllc(rL,uL,vL,pL,rR,uR,vR,pR);
      const f0=FX[0]/dy,f1=FX[2]/dy,f2=FX[1]/dy,f3=FX[3]/dy;   // 注意换回 x,y 动量
      R0[kL]-=f0; R1[kL]-=f1; R2[kL]-=f2; R3[kL]-=f3;
      R0[kR]+=f0; R1[kR]+=f1; R2[kR]+=f2; R3[kR]+=f3;
    }
  }
  // 更新
  let sum=0,cnt=0;
  const glob=dt;
  for(let j=2;j<NY-2;j++)for(let i=2;i<NX-2;i++){
    const k=IX(i,j); if(solid[k]) continue;
    const h=S.local?dtl[k]:glob;
    ro[k]+=h*R0[k]; mx[k]+=h*R1[k]; my[k]+=h*R2[k]; En[k]+=h*R3[k];
    if(ro[k]<1e-7) ro[k]=1e-7;
    const ke=0.5*(mx[k]*mx[k]+my[k]*my[k])/ro[k];
    if(En[k]-ke<1e-4) En[k]=ke+1e-4;
    sum+=R0[k]*R0[k]; cnt++;
  }
  resNow=Math.sqrt(sum/Math.max(1,cnt))/FS.rho;
  if(!res0&&iter>4) res0=resNow;
  iter++; simT+=dt;
  if(iter%8===0){ RESH.push(resNow); if(RESH.length>620) RESH.shift(); }
}

/* ---------------- 采样与诊断 ---------------- */
function sample(x,y,arr){
  const fi=clamp((x-x0)/dx-0.5,0,NX-1.001), fj=clamp((y-y0)/dy-0.5,0,NY-1.001);
  const i=fi|0,j=fj|0,tx=fi-i,ty=fj-j;
  const k=IX(i,j);
  return arr[k]*(1-tx)*(1-ty)+arr[k+1]*tx*(1-ty)+arr[k+NX]*(1-tx)*ty+arr[k+NX+1]*tx*ty;
}
/* 激波角：在下游段用压强中值跨越点做亚格定位 + 最小二乘斜率拟合，
   避免近前缘（网格钝化引起的弓形段）污染，可直接与 θ-β-M 精确解比较 */
function surfAngle(){ return S.geo==='wd'?15:(S.geo==='sc'?11:(S.geo==='bi'?14:S.del)); }
function measureBeta(thr){
  const pt=thr||2.0;
  const P=[];
  for(let f=0.45;f<=0.96;f+=0.035){
    const xs=CHORD*f, ii=clamp(Math.round((xs-x0)/dx-0.5),2,NX-3);
    let yv=NaN;
    for(let j=3;j<NY-4;j++){
      const k=IX(ii,j),k2=IX(ii,j+1);
      if(solid[k]||solid[k2]) break;
      const a=pp_[k]/FS.p, b=pp_[k2]/FS.p;
      if(a<pt&&b>=pt){ const t=(pt-a)/(b-a); yv=cellY(j)+t*dy; break; }
    }
    if(isFinite(yv)&&yv<0) P.push([xs,yv]);
  }
  if(P.length<4) return NaN;
  let sx=0,sy=0,sxx=0,sxy=0;
  const n=P.length;
  for(const [x,y] of P){ sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
  const k=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  if(!(k<0)) return NaN;
  return Math.atan(-k)*180/Math.PI;
}
const DIAG={cd:0,cl:0,ld:0,cm:0,pmax:0,tmax:0,qs:0,beta:0,betaT:NaN,prW:0,prT:NaN,
  p0:0,p0T:0,cdf:0,shockIn:false,cpArr:[]};
function diagnose(){
  const off=1.6*Math.max(dx,dy);
  let fx=0,fy=0,mzz=0,pmax=0,cps=[];
  for(const g of SEG){
    const p=sample(g.mx+g.nx*off,g.my+g.ny*off,pp_);
    const cp=(p-FS.p)/FS.q;
    cps.push({s:g.sn,cp,x:g.mx,y:g.my,nx:g.nx,ny:g.ny,p});
    fx+=-(p-FS.p)*g.nx*g.len; fy+=-(p-FS.p)*g.ny*g.len;
    mzz+=(-(p-FS.p)*g.ny*g.len)*(g.mx)-(-(p-FS.p)*g.nx*g.len)*(g.my);
    if(p>pmax) pmax=p;
  }
  DIAG.cpArr=cps;
  const qA=FS.q*CHORD;
  DIAG.cd=fx/qA; DIAG.cl=fy/qA; DIAG.cm=mzz/(qA*CHORD);
  DIAG.ld=Math.abs(DIAG.cd)>1e-9?DIAG.cl/DIAG.cd:0;
  DIAG.pmax=pmax;
  // 摩擦阻力估算（湍流平板 + 参考温度法，仅作量级参考）
  const cf=0.074/Math.pow(Math.max(1e4,FS.Re),0.2)/Math.pow(1+0.18*FS.M*FS.M,0.55);
  DIAG.cdf=cf*2.0;
  // 驻点：取头部前方压强峰值
  let p0m=0;
  for(let j=2;j<NY-2;j++)for(let i=2;i<NX-2;i++){
    const k=IX(i,j); if(solid[k]) continue;
    if(pp_[k]>p0m) p0m=pp_[k];
  }
  DIAG.p0=p0m; DIAG.p0T=FS.p*pitot(FS.M);
  // 温度峰值
  let tm=0;
  for(let j=2;j<NY-2;j++)for(let i=2;i<NX-2;i++){
    const k=IX(i,j);
    if(solid[k]||phi[k]<2.2*dx||pr_[k]<0.25*FS.rho) continue;  // 排除壁面浸没层与膨胀真空区伪值
    const T=pp_[k]/(pr_[k]*RGAS); if(T>tm) tm=T;
  }
  DIAG.tmax=tm;
  let twm=0;
  for(const c of DIAG.cpArr){ const rr2=sample(c.x+c.nx*off,c.y+c.ny*off,pr_);
    const T=c.p/(Math.max(1e-9,rr2)*RGAS); if(T>twm&&T<FS.T0*1.3) twm=T; }
  DIAG.twall=twm;
  // Sutton–Graves 驻点热流
  const Rn=Math.max(0.002,S.geo==='sc'?Math.max(0.03,S.rn/1000):S.rn/1000||0.002);
  DIAG.qs=1.7415e-4*Math.sqrt(FS.rho/Rn)*Math.pow(FS.V,3);
  DIAG.Rn=Rn;
  // 激波角（下压缩面侧）
  const thW=surfAngle()+S.aoa;
  DIAG.betaT=betaWeak(thW,FS.M);
  DIAG.prT=DIAG.betaT?(function(){const o=obliqueSolve(thW,FS.M);return o?o.pr:NaN;})():NaN;
  DIAG.beta=measureBeta();
  // 下表面壁面压比
  let acc=0,n2=0;
  for(const c of cps){ if(c.ny<-0.2&&c.x>CHORD*0.25&&c.x<CHORD*0.8){ acc+=c.p; n2++; } }
  DIAG.prW=n2?acc/n2/FS.p:NaN;
  // 入口是否被激波污染
  let sh=false;
  for(let j=2;j<NY-2;j++) if(pp_[IX(3,j)]>FS.p*1.05) sh=true;
  DIAG.shockIn=sh;
}

/* ---------------- 色表 ---------------- */
function mkCmap(stops){
  const L=new Uint8Array(256*3);
  for(let i=0;i<256;i++){
    const u=i/255; let a=stops[0],b=stops[stops.length-1];
    for(let k=0;k<stops.length-1;k++) if(u>=stops[k][0]&&u<=stops[k+1][0]){a=stops[k];b=stops[k+1];break;}
    const t=(u-a[0])/Math.max(1e-6,b[0]-a[0]);
    L[i*3]=a[1]+(b[1]-a[1])*t; L[i*3+1]=a[2]+(b[2]-a[2])*t; L[i*3+2]=a[3]+(b[3]-a[3])*t;
  }
  return L;
}
const CMAPS={
  inferno:mkCmap([[0,0,0,4],[0.15,22,11,57],[0.3,66,10,104],[0.45,106,23,110],[0.6,147,38,103],
                  [0.72,188,55,84],[0.84,221,81,58],[0.92,243,120,25],[0.97,252,165,10],[1,252,255,164]]),
  viridis:mkCmap([[0,68,1,84],[0.2,59,82,139],[0.4,33,145,140],[0.6,94,201,98],[0.8,170,220,50],[1,253,231,37]]),
  jet:mkCmap([[0,0,0,131],[0.12,0,60,170],[0.25,0,140,255],[0.4,0,225,225],[0.55,120,255,120],
              [0.7,255,225,0],[0.85,255,110,0],[1,140,0,0]]),
  gray:mkCmap([[0,8,10,14],[0.5,128,132,138],[1,252,252,255]])

/* ---------------- 渲染 ---------------- */
const cv=$('#cv'),ctx=cv.getContext('2d',{alpha:false});
let CW=0,CH=0,img=null,ibuf=null,fcv=document.createElement('canvas'),fctx=fcv.getContext('2d');
let VIEW={sx:1,ox:0,oy:0};
function resizeCv(){
  const r=cv.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  CW=cv.width=Math.max(64,Math.round(r.width*dpr));
  CH=cv.height=Math.max(64,Math.round(r.height*dpr));
  fcv.width=nx; fcv.height=ny;
  img=fctx.createImageData(nx,ny); ibuf=img.data;
  for(let i=3;i<ibuf.length;i+=4) ibuf[i]=255;
  const Lx=nx*dx,Ly=ny*dy;
  const xa=x0+2*dx, ya=y0+2*dy;              // 计算域（内点区）左下角
  const s=Math.min(CW/Lx,CH/Ly);
  VIEW.sx=s;
  VIEW.ox=(CW-Lx*s)/2-xa*s;                  // PX(xa) = 左边距
  VIEW.oy=(CH-Ly*s)/2+(ya+Ly)*s;             // 物理 +y 朝屏幕上方（升力向上）
}
const PX=x=>VIEW.ox+x*VIEW.sx, PY=y=>VIEW.oy-y*VIEW.sx;
let RANGE={lo:0,hi:1,name:'',unit:''};
function fieldValue(k){
  switch(S.field){
    case 'p': return pp_[k];
    case 'rho': return pr_[k];
    case 'mach': return Math.hypot(ur_[k],vr_[k])/Math.sqrt(GAM*pp_[k]/pr_[k]);
    case 'T': return pp_[k]/(pr_[k]*RGAS);
    case 'q': return 0.5*pr_[k]*(ur_[k]*ur_[k]+vr_[k]*vr_[k]);
    case 'V': return Math.hypot(ur_[k],vr_[k]);
    case 's': return Math.log(pp_[k]/Math.pow(pr_[k],GAM)/(FS.p/Math.pow(FS.rho,GAM)))/(GAM-1);
    case 'schl': {
      const gx=(pr_[k+1]-pr_[k-1])/(2*dx), gy=(pr_[k+NX]-pr_[k-NX])/(2*dy);
      return Math.hypot(gx,gy);
    }
  }
  return 0;
}
const FNAME={p:['压强 p','Pa'],rho:['密度 ρ','kg/m³'],mach:['马赫数 Ma',''],T:['温度 T','K'],
  q:['动压 q','Pa'],V:['速度 |V|','m/s'],s:['熵增 Δs/R',''],schl:['数值纹影 |∇ρ|','']};
function renderField(){
  let lo=1e30,hi=-1e30;
  const cm=CMAPS[S.cmap]||CMAPS.inferno;
  const schl=S.field==='schl';
  if(S.auto){
    for(let j=2;j<NY-2;j+=2)for(let i=2;i<NX-2;i+=2){
      const k=IX(i,j); if(solid[k]) continue;
      const v=fieldValue(k); if(v<lo) lo=v; if(v>hi) hi=v;
    }
    if(schl){ lo=0; hi*=0.55; }
    if(S.field==='p'||S.field==='q'){ lo=Math.min(lo,FS.p*0.6); }
  }else{
    if(S.field==='p'){lo=0;hi=FS.p*pitot(FS.M)*0.85;}
    else if(S.field==='mach'){lo=0;hi=FS.M*1.15;}
    else if(S.field==='T'){lo=FS.T*0.8;hi=FS.T0*1.05;}
    else if(S.field==='q'){lo=0;hi=FS.q*1.6;}
    else if(S.field==='rho'){lo=0;hi=FS.rho*6;}
    else if(S.field==='V'){lo=0;hi=FS.V*1.25;}
    else {lo=0;hi=1;}
  }
  if(!(hi>lo)) hi=lo+1e-9;
  RANGE.lo=lo; RANGE.hi=hi;
  const inv=1/(hi-lo), gam=schl?0.55:1;
  for(let j=0;j<ny;j++){
    const jj=j+2, row=(ny-1-j)*nx*4;
    for(let i=0;i<nx;i++){
      const k=IX(i+2,jj), o=row+i*4;
      if(solid[k]){ ibuf[o]=26; ibuf[o+1]=30; ibuf[o+2]=36; continue; }
      let t=(fieldValue(k)-lo)*inv;
      t=t<0?0:(t>1?1:t);
      if(gam!==1) t=Math.pow(t,gam);
      const c=((t*255)|0)*3;
      ibuf[o]=cm[c]; ibuf[o+1]=cm[c+1]; ibuf[o+2]=cm[c+2];
    }
  }
  fctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(fcv,PX(x0+2*dx),PY(y0+(NY-2)*dy),nx*dx*VIEW.sx,ny*dy*VIEW.sx);
}
/* 粒子 */
const PN=2600, PXA=new Float64Array(PN),PYA=new Float64Array(PN),PL=new Float64Array(PN);
let pInit=false;
function seedP(i){ PXA[i]=x0+2*dx+Math.random()*dx*3; PYA[i]=y0+2*dy+Math.random()*(ny-4)*dy; PL[i]=0; }
function stepParticles(dt){
  if(!pInit){ for(let i=0;i<PN;i++){ seedP(i); PXA[i]=x0+2*dx+Math.random()*nx*dx; } pInit=true; }
  const xe=x0+(NX-3)*dx, ye0=y0+2*dy, ye1=y0+(NY-3)*dy;
  for(let i=0;i<PN;i++){
    const u=sample(PXA[i],PYA[i],ur_), v=sample(PXA[i],PYA[i],vr_);
    PXA[i]+=u*dt; PYA[i]+=v*dt; PL[i]=Math.hypot(u,v);
    const fi=clamp((PXA[i]-x0)/dx-0.5,0,NX-1)|0, fj=clamp((PYA[i]-y0)/dy-0.5,0,NY-1)|0;
    if(PXA[i]>xe||PYA[i]<ye0||PYA[i]>ye1||solid[IX(fi,fj)]) seedP(i);
  }
}
function drawParticles(){
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineWidth=Math.max(1,VIEW.sx*0.004);
  const cm=CMAPS.gray;
  for(let i=0;i<PN;i++){
    const u=sample(PXA[i],PYA[i],ur_), v=sample(PXA[i],PYA[i],vr_);
    const L=Math.hypot(u,v)/Math.max(1,FS.V*1.1);
    const a=0.10+0.5*L;
    ctx.strokeStyle='rgba(210,240,255,'+a.toFixed(3)+')';
    ctx.beginPath();
    ctx.moveTo(PX(PXA[i]),PY(PYA[i]));
    ctx.lineTo(PX(PXA[i]-u*0.00022*CHORD*6),PY(PYA[i]-v*0.00022*CHORD*6));
    ctx.stroke();
  }
  ctx.restore();
}
/* 流线 */
let STREAM=[],streamAge=0;
function buildStreams(){
  STREAM=[];
  const n=26;
  for(let s=0;s<n;s++){
    let x=x0+2.2*dx, y=y0+2*dy+(ny-4)*dy*(s+0.5)/n;
    const pts=[[x,y]];
    const h=dx*0.55;
    for(let k=0;k<1400;k++){
      const u=sample(x,y,ur_),v=sample(x,y,vr_);
      const sp=Math.hypot(u,v)||1;
      const nx2=x+u/sp*h, ny2=y+v/sp*h;
      const u2=sample(nx2,ny2,ur_),v2=sample(nx2,ny2,vr_);
      const sp2=Math.hypot(u2,v2)||1;
      x+=0.5*(u/sp+u2/sp2)*h; y+=0.5*(v/sp+v2/sp2)*h;
      const fi=clamp((x-x0)/dx-0.5,0,NX-1)|0, fj=clamp((y-y0)/dy-0.5,0,NY-1)|0;
      if(x>x0+(NX-3)*dx||y<y0+2*dy||y>y0+(NY-3)*dy||solid[IX(fi,fj)]) break;
      if(k%2===0) pts.push([x,y]);
    }
    if(pts.length>3) STREAM.push(pts);
  }
}
function drawStreams(){
  ctx.save();
  ctx.strokeStyle='rgba(180,225,255,.34)'; ctx.lineWidth=Math.max(1,VIEW.sx*0.0028);
  ctx.setLineDash([VIEW.sx*0.06,VIEW.sx*0.045]);
  ctx.lineDashOffset=-streamAge;
  for(const s of STREAM){
    ctx.beginPath(); ctx.moveTo(PX(s[0][0]),PY(s[0][1]));
    for(let i=1;i<s.length;i++) ctx.lineTo(PX(s[i][0]),PY(s[i][1]));
    ctx.stroke();
  }
  ctx.setLineDash([]); ctx.restore();
}
function drawBody(){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(PX(BODY[0][0]),PY(BODY[0][1]));
  for(let i=1;i<BODY.length;i++) ctx.lineTo(PX(BODY[i][0]),PY(BODY[i][1]));
  ctx.closePath();
  const g=ctx.createLinearGradient(PX(0),PY(-0.2),PX(CHORD),PY(0.2));
  g.addColorStop(0,'#2b3440'); g.addColorStop(1,'#171d26');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#8fd8ff'; ctx.lineWidth=Math.max(1.2,VIEW.sx*0.004); ctx.stroke();
  ctx.restore();
}
function drawCp(){
  if(!DIAG.cpArr.length) return;
  ctx.save();
  ctx.lineWidth=Math.max(1,VIEW.sx*0.003);
  const sc=0.16*CHORD;
  ctx.beginPath();
  for(const c of DIAG.cpArr){
    const L=clamp(c.cp,-0.4,2.2)*sc;
    ctx.moveTo(PX(c.x),PY(c.y));
    ctx.lineTo(PX(c.x+c.nx*L),PY(c.y+c.ny*L));
  }
  ctx.strokeStyle='rgba(255,196,120,.75)'; ctx.stroke();
  ctx.beginPath();
  let first=true;
  for(const c of DIAG.cpArr){
    const L=clamp(c.cp,-0.4,2.2)*sc;
    const X=PX(c.x+c.nx*L),Y=PY(c.y+c.ny*L);
    if(first){ctx.moveTo(X,Y);first=false;} else ctx.lineTo(X,Y);
  }
  ctx.strokeStyle='rgba(255,150,60,.95)'; ctx.lineWidth=Math.max(1.2,VIEW.sx*0.0035); ctx.stroke();
  ctx.restore();
}
function drawShockMark(){
  if(!isFinite(DIAG.beta)) return;
  ctx.save();
  const b=DIAG.beta*Math.PI/180, R=CHORD*1.5;
  ctx.strokeStyle='rgba(120,255,220,.55)'; ctx.setLineDash([6,5]); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(PX(0),PY(0));
  ctx.lineTo(PX(R*Math.cos(b)),PY(-R*Math.sin(b))); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(PX(0),PY(0)); ctx.lineTo(PX(R*0.5),PY(0)); ctx.stroke();
  ctx.fillStyle='rgba(160,255,235,.95)'; ctx.font='600 '+Math.max(11,VIEW.sx*0.02)+'px Consolas';
  ctx.fillText('β='+DIAG.beta.toFixed(1)+'°',PX(CHORD*0.34),PY(-CHORD*0.20));
  if(isFinite(DIAG.betaT)){
    ctx.strokeStyle='rgba(255,235,140,.5)'; ctx.setLineDash([3,4]);
    const bt=DIAG.betaT*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(PX(0),PY(0));
    ctx.lineTo(PX(R*Math.cos(bt)),PY(-R*Math.sin(bt))); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
}
function drawGridLines(){
  ctx.save();
  ctx.strokeStyle='rgba(120,180,220,.12)'; ctx.lineWidth=1;
  const st=Math.max(1,Math.round(nx/40));
  ctx.beginPath();
  for(let i=2;i<NX-2;i+=st){ const X=PX(x0+i*dx); ctx.moveTo(X,PY(y0+2*dy)); ctx.lineTo(X,PY(y0+(NY-2)*dy)); }
  for(let j=2;j<NY-2;j+=st){ const Y=PY(y0+j*dy); ctx.moveTo(PX(x0+2*dx),Y); ctx.lineTo(PX(x0+(NX-2)*dx),Y); }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,120,80,.55)'; ctx.lineWidth=1.4;
  ctx.beginPath();
  for(const G of ghost){ const j=(G.k/NX)|0,i=G.k-j*NX;
    ctx.rect(PX(x0+i*dx),PY(y0+(j+1)*dy),dx*VIEW.sx,dy*VIEW.sx); }
  ctx.stroke();
  ctx.restore();
}
function drawColorbar(){
  const c=$('#cbar').getContext('2d');
  const cm=CMAPS[S.cmap]||CMAPS.inferno;
  const im=c.createImageData(256,12);
  for(let x=0;x<256;x++)for(let y=0;y<12;y++){
    const o=(y*256+x)*4, k=x*3;
    im.data[o]=cm[k]; im.data[o+1]=cm[k+1]; im.data[o+2]=cm[k+2]; im.data[o+3]=255;
  }
  c.putImageData(im,0,0);
  const fn=FNAME[S.field]||['',''];
  $('#cbName').textContent=fn[0];
  $('#cbMin').textContent=eng(RANGE.lo)+(fn[1]?' '+fn[1]:'');
  $('#cbMax').textContent=eng(RANGE.hi)+(fn[1]?' '+fn[1]:'');
}
function render(){
  ctx.fillStyle='#03070b'; ctx.fillRect(0,0,CW,CH);
  renderField();
  if(S.gridOn) drawGridLines();
  if(S.stream) drawStreams();
  if(S.part) drawParticles();
  drawBody();
  if(S.cp) drawCp();
  if(S.shock) drawShockMark();
  drawColorbar();
}

function plotCp(){
  const cvv=$('#cpc'),c=cvv.getContext('2d');
  const r=cvv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cvv.width=Math.round(r.width*dpr), h=cvv.height=Math.round(r.height*dpr);
  c.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height;
  c.clearRect(0,0,W,H); c.fillStyle='#040a10'; c.fillRect(0,0,W,H);
  if(!DIAG.cpArr.length) return;
  let lo=0,hi=0.1;
  for(const p of DIAG.cpArr){ if(p.cp<lo) lo=p.cp; if(p.cp>hi) hi=p.cp; }
  lo=Math.min(lo,-0.2); hi=Math.max(hi,0.3);
  const X=s=>26+(W-34)*s, Y=v=>H-16-(H-26)*(v-lo)/(hi-lo);
  c.strokeStyle='rgba(120,180,220,.14)'; c.lineWidth=1;
  c.font='9px Consolas'; c.fillStyle='rgba(140,190,215,.6)'; c.textAlign='right';
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4, y=Y(v);
    c.beginPath(); c.moveTo(26,y); c.lineTo(W-8,y); c.stroke();
    c.fillText(v.toFixed(1),23,y+3);
  }
  c.strokeStyle='rgba(255,255,255,.22)';
  c.beginPath(); c.moveTo(26,Y(0)); c.lineTo(W-8,Y(0)); c.stroke();
  // 上下表面分开画
  for(const side of [-1,1]){
    c.beginPath(); let first=true;
    for(const p of DIAG.cpArr){
      if(Math.sign(p.ny||1)!==side) continue;
      const x=X(clamp(p.x/CHORD,0,1)), y=Y(p.cp);
      if(first){c.moveTo(x,y);first=false;} else c.lineTo(x,y);
    }
    c.strokeStyle=side<0?'#ff9d4d':'#5fd8ff'; c.lineWidth=1.6; c.stroke();
  }
  if(isFinite(DIAG.prT)){
    const cpT=(DIAG.prT-1)/(0.5*GAM*FS.M*FS.M);
    c.setLineDash([4,3]); c.strokeStyle='rgba(255,230,140,.75)'; c.lineWidth=1.2;
    c.beginPath(); c.moveTo(26,Y(cpT)); c.lineTo(W-8,Y(cpT)); c.stroke(); c.setLineDash([]);
    c.fillStyle='rgba(255,230,140,.9)'; c.textAlign='left';
    c.fillText('斜激波理论 Cp='+cpT.toFixed(3),30,Y(cpT)-3);
  }
  c.fillStyle='#ff9d4d'; c.textAlign='left'; c.fillText('下表面(压缩)',30,H-4);
  c.fillStyle='#5fd8ff'; c.fillText('上表面(膨胀)',110,H-4);
  c.fillStyle='rgba(140,190,215,.6)'; c.textAlign='right'; c.fillText('x/L',W-10,H-4);
}
function plotRes(){
  const cvv=$('#rsc'),c=cvv.getContext('2d');
  const r=cvv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  cvv.width=Math.round(r.width*dpr); cvv.height=Math.round(r.height*dpr);

  let lo=1e30,hi=-1e30;

  if(hi-lo<1){ hi=lo+1; }
  const X=i=>26+(W-34)*i/(RESH.length-1), Y=v=>H-14-(H-24)*(Math.log10(Math.max(1e-12,v))-lo)/(hi-lo);

    c.fillText('1e'+L.toFixed(0),23,y+3);

  const e0=DIAG.p0T>0?(DIAG.p0-DIAG.p0T)/DIAG.p0T*100:0;
  setV('p0e',f1(e0)+' %',Math.abs(e0)<8?'ok':(Math.abs(e0)<20?'wn':'bd'));
  setV('tmax',f1(DIAG.tmax)+' K'+(DIAG.tmax>FS.T0*1.06?' (>T₀，界面伪值)':''),DIAG.tmax>FS.T0*1.06?'wn':'');
  setV('twall',f1(DIAG.twall||0)+' K  (T₀理论 '+f1(FS.T0)+' K)','hi');
  setV('qs',(DIAG.qs/1e6).toFixed(2)+' MW/m²','hi');
  setV('rn',(DIAG.Rn*1000).toFixed(1)+' mm');
  setV('cd',f3(DIAG.cd));
  setV('cdf',f3(DIAG.cdf));
  setV('cdt',f3(DIAG.cd+DIAG.cdf));
  setV('cl',f3(DIAG.cl));
  setV('ld',f2(DIAG.ld),Math.abs(DIAG.ld)>2.5?'ok':'');
  setV('cm',f3(DIAG.cm));
  setV('pmax',eng(DIAG.pmax)+' Pa');
  setV('fq',(DIAG.pmax/FS.q).toFixed(2)+' ×q∞');
  setV('betaC',isFinite(DIAG.beta)?f2(DIAG.beta)+'°':'未检出','hi');
  setV('betaT',isFinite(DIAG.betaT)?f2(DIAG.betaT)+'°':'脱体（无解）');
  if(isFinite(DIAG.beta)&&isFinite(DIAG.betaT)){
    const e=(DIAG.beta-DIAG.betaT)/DIAG.betaT*100;
    setV('betaE',f1(e)+' %',Math.abs(e)<4?'ok':(Math.abs(e)<10?'wn':'bd'));
  } else setV('betaE','—');
  setV('prC',isFinite(DIAG.prW)?f2(DIAG.prW):'—');
  setV('prT',isFinite(DIAG.prT)?f2(DIAG.prT):'—');
  if(isFinite(DIAG.prW)&&isFinite(DIAG.prT)){
    const e=(DIAG.prW-DIAG.prT)/DIAG.prT*100;
    setV('prE',f1(e)+' %',Math.abs(e)<6?'ok':(Math.abs(e)<15?'wn':'bd'));
  } else setV('prE','—');
  setV('pm',FS.M>1?f1(prandtlMeyer(FS.M))+'°':'—');
  setV('det',isFinite(DIAG.betaT)?'附体斜激波':'脱体弓形激波',isFinite(DIAG.betaT)?'ok':'wn');
  setV('it',iter+'');
  setV('tt',(simT*1000).toFixed(3)+' ms');
  setV('res',resNow.toExponential(2));
  setV('drop',res0?((Math.log10(resNow/res0)).toFixed(2)+' 量级'):'—',
    res0&&resNow/res0<0.01?'ok':'');
  setV('grid',nx+'×'+ny);
  setV('cells',(nx*ny/1000).toFixed(1)+'k');
  setV('gh',ghost.length+'');
  setV('dt',(computeDtCached*1e9).toFixed(0)+' ns');
  setV('fps',Math.round(fps)+' fps / '+S.iters*(S.turbo?4:1)+' 步 ('+stepMs.toFixed(1)+' ms)');
  setV('warn',DIAG.shockIn?'激波触及入口，建议降低攻角或缩短弹体':'正常',DIAG.shockIn?'bd':'ok');
  $('#ovL').innerHTML='Ma∞ '+f2(FS.M)+'　H '+f1(S.alt)+' km　α '+f1(S.aoa)+'°<br>'+
    'q∞ '+f1(FS.q/1000)+' kPa　V∞ '+f1(FS.V)+' m/s<br>'+
    '迭代 '+iter+'　残差 '+resNow.toExponential(1);
  $('#ovR').innerHTML=(FNAME[S.field]||[''])[0]+'<br>'+
    'β '+(isFinite(DIAG.beta)?f1(DIAG.beta)+'°':'—')+' / 理论 '+(isFinite(DIAG.betaT)?f1(DIAG.betaT)+'°':'—')+'<br>'+
    'Cd '+f3(DIAG.cd)+'　Cl '+f3(DIAG.cl)+'　L/D '+f2(DIAG.ld);
  $('#ovB').textContent='二维可压缩 Euler / HLLC / MUSCL-minmod / 浸没边界镜像鬼点　·　'+nx+'×'+ny+' 网格';
  $('#h1').textContent='Cd '+f3(DIAG.cd)+' · Cl '+f3(DIAG.cl);
  $('#h2').textContent=iter+' 步 · '+resNow.toExponential(1);
}
let computeDtCached=0;

/* ---------------- 主循环 ---------------- */
let last=performance.now(),acc=99;   /* 首帧即刷新面板 */
function loop(){
  const t0=performance.now();
  const dt=Math.min(0.05,(t0-last)/1000); last=t0;
  fps=fps*0.9+(1/Math.max(1e-3,dt))*0.1;
  if(S.run){
    const ns=S.iters*(S.turbo?4:1);
    const s0=performance.now();
    for(let s=0;s<ns;s++) step();
    stepMs=(performance.now()-s0)/ns;
    computeDtCached=computeDt();
  }else{ toPrim(); applyBC(); }
  streamAge+=dt*90;
  if(S.part) stepParticles(Math.min(dt,0.04)*(nx*dx)/Math.max(1,FS.V)/2.8);
  acc+=dt;
  if(acc>0.18){ acc=0; diagnose(); buildStreams(); plotCp(); plotRes(); updateSide(); }
  render();
  frameMs=frameMs*0.9+(performance.now()-t0)*0.1;
  requestAnimationFrame(loop);
}

/* ---------------- 自检 (?selftest=1) ---------------- */
function ascii(cols,rows){
  const px=ctx.getImageData(0,0,CW,CH).data;
  const ramp=' .:-=+*#%@';
  let out='';
  for(let r=0;r<rows;r++){
    let line='';
    for(let c=0;c<cols;c++){
      const xa=Math.floor(c/cols*CW),xb=Math.max(xa+1,Math.floor((c+1)/cols*CW));
      const ya=Math.floor(r/rows*CH),yb=Math.max(ya+1,Math.floor((r+1)/rows*CH));
      let s=0,n=0;
      for(let y=ya;y<yb;y+=2)for(let x=xa;x<xb;x+=2){
        const o=(y*CW+x)*4; s+=px[o]*0.3+px[o+1]*0.59+px[o+2]*0.11; n++;
      }
      line+=ramp[clamp(Math.round(s/n/255*9),0,9)];
    }
    out+=line+'\n';
  }
  return out;
}
function profile(xf){
  const xs=CHORD*xf, ii=clamp(Math.round((xs-x0)/dx-0.5),2,NX-3);
  let o='  y/L @x='+xf.toFixed(2)+'L : ';
  for(let j=NY-3;j>=2;j-=Math.max(1,Math.round((NY-4)/22))){
    const k=IX(ii,j);
    o+=(solid[k]?'[body]':(cellY(j)/CHORD).toFixed(2)+':'+(pp_[k]/FS.p).toFixed(2))+' ';
  }
  return o;
}
function shockFit(){
  const pts=[];
  for(let f=0.45;f<=0.96;f+=0.035){
    const xs=CHORD*f, ii=clamp(Math.round((xs-x0)/dx-0.5),2,NX-3);
    let yv=NaN;
    for(let j=2;j<NY-3;j++){
      const k=IX(ii,j),k2=IX(ii,j+1);
      if(solid[k]) break;
      if(pp_[k]<FS.p*2.2&&pp_[k2]>=FS.p*2.2){ yv=cellY(j)+dy*0.5; break; }
    }
    if(isFinite(yv)) pts.push([xs,yv]);
  }
  if(pts.length<3) return '  激波拟合: 点太少';
  let sx=0,sy=0,sxx=0,sxy=0,n=pts.length;
  for(const [x,y] of pts){ sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
  const a=(n*sxy-sx*sy)/(n*sxx-sx*sx), b=(sy-a*sx)/n;
  let o='  激波点(x,y): '+pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(3)).join(' ')+'\n';
  o+='  最小二乘: dy/dx='+a.toFixed(4)+' → β='+(Math.atan(-a)*180/Math.PI).toFixed(2)+
     '°  在x=0处截距 y0='+b.toFixed(3)+'m (应≈0)\n';
  // 壁面位置对照
  let wy=NaN; const ii=clamp(Math.round((CHORD*0.5-x0)/dx-0.5),2,NX-3);
  for(let j=NY-3;j>=2;j--){ if(solid[IX(ii,j)]){ } }
  for(let j=2;j<NY-3;j++){ if(solid[IX(ii,j)]){ wy=cellY(j); break; } }
  o+='  x=0.5L 处：壁面最低点 y='+wy.toFixed(3)+'m  理论激波 y='+(-CHORD*0.5*Math.tan(24.32*Math.PI/180)).toFixed(3)+'m';
  return o;
}
function probe2(){
  let o='';
  // p 峰值位置
  let pm=0,pi=0,pj=0;
  for(let j=2;j<NY-2;j++)for(let i=2;i<NX-2;i++){ const k=IX(i,j);
    if(solid[k])continue; if(pp_[k]>pm){pm=pp_[k];pi=i;pj=j;} }
  o+='  p峰值='+(pm/FS.p).toFixed(1)+'p∞ 位于 x='+cellX(pi).toFixed(3)+' y='+cellY(pj).toFixed(3)+
     ' (前缘在 0,0)\n';
  // y≈0 上游水平剖面
  const j0=clamp(Math.round((0.004-y0)/dy-0.5),2,NY-3);
  o+='  y=0 水平剖面 p/p∞: ';
  for(let i=2;i<NX-2;i+=Math.max(1,Math.round(nx/26))){ const k=IX(i,j0);
    o+=cellX(i).toFixed(2)+':'+(solid[k]?'B':(pp_[k]/FS.p).toFixed(1))+' '; }
  o+='\n';
  // 逐格竖向剖面（激波附近）
  const ii=clamp(Math.round((CHORD*0.5-x0)/dx-0.5),2,NX-3);
  o+='  x=0.5L 逐格 p/p∞ (自下而上): ';
  let started=false,cnt=0;
  for(let j=2;j<NY-3;j++){ const k=IX(ii,j);
    if(solid[k]) break;
    const r=pp_[k]/FS.p;
    if(!started&&r<1.02) continue;
    started=true; cnt++;
    o+=cellY(j).toFixed(3)+':'+r.toFixed(2)+' ';
    if(cnt>26) break;
  }
  return o;
}
/* 渲染方向一致性检查：把物理点的场值经色表算出期望 RGB，与该点屏幕坐标处的实测像素比对；
   同时给出 y 镜像点的期望 RGB，用于判定是否出现上下翻转 */
function checkOrient(){
  const sv={part:S.part,stream:S.stream,cp:S.cp,shock:S.shock,gridOn:S.gridOn};
  S.part=S.stream=S.cp=S.shock=S.gridOn=false;
  render();
  const cm=CMAPS[S.cmap]||CMAPS.inferno;
  const xs=CHORD*0.5, ii=clamp(Math.round((xs-x0)/dx-0.5),2,NX-3);
  let jlo=-1,jhi=-1;
  for(let j=2;j<NY-2;j++){ if(solid[IX(ii,j)]){ if(jlo<0) jlo=j; jhi=j; } }
  const P=[['下方压缩区',xs,cellY(jlo)-7*dy],['上方膨胀区',xs,cellY(jhi)+7*dy],
           ['上游自由流',x0+10*dx,y0+dy*(NY*0.28)],['下游尾迹',CHORD*1.2,0]];
  const rgbAt=(px,py)=>{
    const k=IX(clamp(Math.round((px-x0)/dx-0.5),2,NX-3),clamp(Math.round((py-y0)/dy-0.5),2,NY-3));
    let t=clamp((fieldValue(k)-RANGE.lo)/Math.max(1e-12,RANGE.hi-RANGE.lo),0,1);
    if(S.field==='schl') t=Math.pow(t,0.55);
    const c=((t*255)|0)*3;
    return [cm[c],cm[c+1],cm[c+2],fieldValue(k)];
  };
  let bad=0,mir=0,o='';
  for(const [n,px,py] of P){
    const e=rgbAt(px,py), em=rgbAt(px,-py);
    const sx=Math.round(PX(px)), sy=Math.round(PY(py));
    const d=ctx.getImageData(clamp(sx,0,CW-1),clamp(sy,0,CH-1),1,1).data;
    const er=Math.abs(d[0]-e[0])+Math.abs(d[1]-e[1])+Math.abs(d[2]-e[2]);
    const erm=Math.abs(d[0]-em[0])+Math.abs(d[1]-em[1])+Math.abs(d[2]-em[2]);
    if(er>26) bad++;
    if(er>26&&erm<=26) mir++;
    o+='  '+n+' y='+py.toFixed(3)+' 场值='+e[3].toPrecision(4)+
       ' 期望RGB('+e[0]+','+e[1]+','+e[2]+') 实测('+d[0]+','+d[1]+','+d[2]+
       ') 偏差='+er+(er>26?(erm<=26?'  ✗镜像!':'  ✗'):'  ✓')+'\n';
  }
  Object.assign(S,sv);
  // 机体内部：应为固壁填充色（几何与固体掩膜在屏幕上须重合）
  let cx2=0,cy2=0;
  for(const b of BODY){ cx2+=b[0]/BODY.length; cy2+=b[1]/BODY.length; }
  const db=ctx.getImageData(clamp(Math.round(PX(cx2)),0,CW-1),clamp(Math.round(PY(cy2)),0,CH-1),1,1).data;
  const isBody=(db[0]>18&&db[0]<70&&db[2]>20&&db[2]<80&&Math.abs(db[2]-db[0])<40);
  o+='  机体内部 ('+cx2.toFixed(2)+','+cy2.toFixed(2)+') 实测('+db[0]+','+db[1]+','+db[2]+') '+
     (isBody?'✓ 固壁色':'✗ 非固壁色（几何与掩膜错位）')+'\n';
  if(!isBody) bad++;
  return '  渲染方向: '+(bad?('❌ '+bad+' 处不符'+(mir?'（其中 '+mir+' 处与 y 镜像点吻合 → 上下翻转）':'')):'✅ 全部与色表/几何一致')+'\n'+o;
}
function selftest(){
  const Q=new URLSearchParams(location.search);
  const SIT=parseInt(Q.get('sit')||'2000',10), ONLY=Q.get('only')||'', SG=Q.get('sgrid');
  let txt='SELFTEST 高超声速 CFD | err='+ERR.length+' | sit='+SIT+' only='+ONLY+'\n';
  const cases=[
    {n:'15°楔 Ma5',geo:'wd',ma:5,aoa:0,rn:0,it:2000},
    {n:'15°楔 Ma3',geo:'wd',ma:3,aoa:0,rn:0,it:2000},
    {n:'乘波体 Ma8 α6',geo:'wr',ma:8,aoa:6,rn:0,it:2000},
    {n:'球锥 Ma6',geo:'sc',ma:6,aoa:0,rn:40,it:2000}
  ];
  for(const c of cases){
    if(ONLY&&c.geo!==ONLY) continue;
    c.it=SIT;
    if(Q.get('ma')) c.ma=parseFloat(Q.get('ma'));
    if(Q.get('aoa')) c.aoa=parseFloat(Q.get('aoa'));
    S.geo=c.geo; S.ma=c.ma; S.aoa=c.aoa; S.rn=c.rn; S.grid=SG?parseInt(SG,10):0; S.muscl=true; allocate(); resizeCv();
    buildGeom(); markSolid(); initField();
    const t0=performance.now();
    for(let i=0;i<c.it;i++) step();
    const ms=(performance.now()-t0)/c.it;
    diagnose();
    const thW=surfAngle()+c.aoa;
    txt+='\n=== '+c.n+' ===\n';
    txt+='迭代'+c.it+' 残差='+resNow.toExponential(2)+' 下降='+(res0?Math.log10(resNow/res0).toFixed(2):'-')+'量级'+
         ' 单步='+ms.toFixed(2)+'ms\n';
    txt+='β计算='+(isFinite(DIAG.beta)?DIAG.beta.toFixed(2):'NaN')+'° β理论='+
         (isFinite(DIAG.betaT)?DIAG.betaT.toFixed(2):'脱体')+'°';
    if(isFinite(DIAG.beta)&&isFinite(DIAG.betaT))
      txt+=' 误差='+((DIAG.beta-DIAG.betaT)/DIAG.betaT*100).toFixed(2)+'%';
    txt+='\n壁面压比计算='+(isFinite(DIAG.prW)?DIAG.prW.toFixed(3):'-')+' 理论='+
         (isFinite(DIAG.prT)?DIAG.prT.toFixed(3):'-');
    if(isFinite(DIAG.prW)&&isFinite(DIAG.prT))
      txt+=' 误差='+((DIAG.prW-DIAG.prT)/DIAG.prT*100).toFixed(2)+'%';
    txt+='\n驻点压强计算='+DIAG.p0.toExponential(3)+' Pitot理论='+DIAG.p0T.toExponential(3)+
         ' 误差='+((DIAG.p0-DIAG.p0T)/DIAG.p0T*100).toFixed(2)+'%\n';
    txt+='Cd='+DIAG.cd.toFixed(4)+' Cl='+DIAG.cl.toFixed(4)+' L/D='+DIAG.ld.toFixed(3)+
         ' q∞='+(FS.q/1000).toFixed(2)+'kPa Tmax='+DIAG.tmax.toFixed(0)+'K qs='+(DIAG.qs/1e6).toFixed(2)+'MW/m²\n';
    buildStreams(); render();
    txt+=checkOrient();
    txt+=shockFit()+'\n'+probe2()+'\n';
    txt+=ascii(104,30);
  }
  const d=$('#diag'); d.style.display='block'; d.textContent=txt;
}

/* ---------------- 启动 ---------------- */
buildSide();
rebuild();
diagnose(); buildStreams();
if(/selftest=1/.test(location.search)){
  requestAnimationFrame(()=>{ resizeCv(); selftest(); });
}else{
  requestAnimationFrame(loop);
}
