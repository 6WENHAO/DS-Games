<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>绿色末世 · 蔓生废都（手工编排大地图）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f0c}
  body{
    font:12px/1.55 "JetBrains Mono",Consolas,"SF Mono",Menlo,"Sarasa Mono SC","Microsoft YaHei",monospace;
    color:#cfe0cd;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  }
  #gl{position:fixed;inset:0;display:block}
  #stage{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
  #stage.drag{cursor:grabbing}
  .panel{
    position:fixed;background:rgba(10,18,13,.66);border:1px solid rgba(180,220,170,.14);
    border-radius:10px;backdrop-filter:blur(10px) saturate(1.25);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.5);padding:9px 12px;
  }
  #topbar{left:14px;top:14px;min-width:280px;max-width:min(430px,calc(100vw - 28px))}
  #topbar .ttl{font-size:14.5px;letter-spacing:.05em;color:#e8f2d8}
  #topbar .ttl span{color:#7f9a80;font-size:11px;letter-spacing:0}
  #topbar .meta{margin-top:5px;color:#83a084;font-size:10.5px}
  #topbar .meta b{color:#bcd98a;font-weight:400}
  #marks{left:14px;top:88px;width:170px;padding:8px 9px}
  #marks h4{font-size:10.5px;color:#7f9a80;font-weight:400;letter-spacing:.14em;margin-bottom:6px}
  #marks button{
    display:block;width:100%;text-align:left;font:inherit;font-size:11px;color:#cfe0cd;
    background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;cursor:pointer;
  }
  #marks button:hover{background:rgba(160,210,140,.14);border-color:rgba(160,210,140,.24);color:#eaf6dd}
  #marks button i{color:#6f8a70;font-style:normal;margin-right:6px}
  #dock{left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:min(600px,calc(100vw - 28px))}
  #dock button{
    font:inherit;font-size:11px;color:#d6e6d2;background:rgba(190,230,170,.07);
    border:1px solid rgba(190,230,170,.16);border-radius:7px;padding:6px 9px;cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,transform .1s;
  }
  #dock button:hover{background:rgba(190,230,170,.16);border-color:rgba(190,230,170,.32)}
  #dock button:active{transform:translateY(1px)}
  #dock button.on{background:rgba(168,212,122,.26);border-color:rgba(168,212,122,.6);color:#f2ffe4}
  #hud{
    position:fixed;left:50%;bottom:74px;transform:translateX(-50%);text-align:center;
    background:rgba(10,18,13,.6);border:1px solid rgba(180,220,170,.14);border-radius:9px;
    padding:6px 12px;font-size:11px;color:#cfe0cd;display:none;backdrop-filter:blur(8px);
  }
  #hud b{color:#bcd98a;font-weight:400}
  #hud span{color:#7f9a80;font-size:10px}
  #nogl{
    position:fixed;right:14px;top:150px;display:none;max-width:230px;padding:8px 10px;
    background:rgba(40,20,12,.7);border:1px solid rgba(220,150,90,.3);border-radius:8px;
    color:#e0b08a;font-size:10.5px;line-height:1.6;
  }
  #dock kbd{font:inherit;font-size:9px;color:#7f9a80;border:1px solid rgba(190,230,170,.2);border-radius:4px;padding:0 3px;margin-left:5px}
  #dock .sep{width:1px;height:18px;background:rgba(190,230,170,.16);margin:0 2px}
  #hint{right:14px;bottom:14px;color:#6f8a70;font-size:10.5px;text-align:right}
  #legend{right:14px;top:14px;font-size:10.5px;color:#83a084;line-height:1.8}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b0f0c;color:#a8c49a;letter-spacing:.24em;font-size:12px;z-index:50;transition:opacity .4s}
  #boot.off{opacity:0;pointer-events:none}
  #boot .sp{width:11px;height:11px;margin-right:12px;border:1.5px solid #46603f;border-top-color:#a8d47a;
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:760px){#legend,#hint,#marks{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="stage"></canvas>

<div class="panel" id="topbar">
  <div class="ttl">蔓生废都 <span>/ THE OVERGROWN · 绿色末世 · 手工编排</span></div>
  <div class="meta" id="meta">初始化…</div>
</div>

<div class="panel" id="marks">
  <h4>户外片段 / 地标</h4>
  <div id="markList"></div>
</div>

<div class="panel" id="legend">
  <div><i style="background:#4c7331"></i>接管一切的植被</div>
  <div><i style="background:#6d7a58"></i>覆苔混凝土残骸</div>
  <div><i style="background:#3b5a4e"></i>浑绿河道 / 湿地</div>
  <div><i style="background:#8a5a44"></i>住宅瓦顶 / 老城石构</div>
  <div><i style="background:#b9bcb4"></i>坠机残骸</div>
  <div><i style="background:#d8b06a"></i>幸存者营火</div>
</div>

<div class="panel" id="dock">
  <button data-mode="0" title="正交微缩，可自由旋转">微缩</button>
  <button data-mode="1" title="透视自由环绕观察">观察</button>
  <button data-mode="2" title="进入街道行走">第一人称</button>
  <kbd style="color:#7f9a80;border:1px solid rgba(190,230,170,.2);border-radius:4px;padding:0 3px;font-size:9px">M 切换</kbd>
  <span class="sep"></span>
  <button data-act="rl" title="左转 15°">⟲</button>
  <button data-act="rr" title="右转 15°">⟳ <kbd>Q/E</kbd></button>
  <span class="sep"></span>
  <button data-act="tod">时段：湿雾正午<kbd>T</kbd></button>
  <button data-act="fx">特效：开<kbd>F</kbd></button>
  <span class="sep"></span>
  <button data-act="fit">全景<kbd>0</kbd></button>
  <button data-act="zin">放大<kbd>+</kbd></button>
  <button data-act="zout">缩小<kbd>-</kbd></button>
  <button data-act="shot">保存 PNG<kbd>P</kbd></button>
</div>

<div id="hud"></div>
<div id="nogl">未检测到 WebGL：已回退为 2D 等距烘焙模式（仅四向视角，无第一人称）。</div>

<div class="panel" id="hint">
  微缩/观察：拖拽旋转 · Shift+拖拽或右键平移 · 滚轮缩放<br>
  第一人称：点击画面锁定鼠标 · WASD 走 · 空格跳 · Shift 疾走 · G 飞行<br>
  数字键 1-9 巡览地标 · R 复位角度
</div>
<div id="boot"><span class="sp"></span>正在装配手工地图…</div>

<script>
'use strict';
(function(){
/* ══════════════════════════════════════════════════════════════════════════════
   绿色末世 · 蔓生废都
   · 112×112×40 体素等距透视（真等距 painter 排序 + AO + 平行光投影 + 空气透视）
   · 地图内容 100% 手工编排：街道/河道/林地/每一栋废楼/每一处户外片段都是手写记录
   · 全场景确定性：不使用 Math.random、不使用噪声函数，每次打开完全一致
   ══════════════════════════════════════════════════════════════════════════════ */

var NX = 112, NY = 112, NZ = 48;   // 网格（NX 必须等于 NY：旋转依赖此前提）
var GT = 8;                        // 标准地表高度（路面 GT-1，河面 GT-1，河床 GT-3）
var S  = 8;                        // 体素半宽 px（真等距下体素高 = S）
var RS = 2, MG = 18, SHMAX = 26, ND = 6;

/* ══════════ 1. 材质 ══════════ */
var MATDEF = [
  ['EMPTY',null],
  ['ROCK','#4e4a42',.06], ['SUBSOIL','#5b4b39',.07], ['SOIL','#5f4b35',.07],
  ['MUD','#4a4030',.08],  ['SAND','#9c8f6a',.07],     ['GRAVEL','#6f6c66',.09],
  ['GRASS','#4e6b34',.10],['GRASS2','#3d5a2b',.10],   ['GRASS_DRY','#7d7a44',.10],
  ['MOSS','#48622f',.10], ['WEED','#5d7a35',.12],     ['REED','#7b8a49',.12],
  ['FLOWER','#b9c46a',.10],
  ['LEAF_L','#6a8f3c',.11],['LEAF','#4c7331',.11],    ['LEAF_D','#375726',.11],
  ['TRUNK','#4a3a28',.09], ['TRUNK_D','#33271b',.09], ['IVY','#3f6b2e',.12],
  ['ASPHALT','#43464a',.06],['ASPH_CRK','#4d5046',.09],
  ['PAVE','#8b8778',.07],  ['SIDEWALK','#8f8b7e',.06],
  ['CONCRETE','#a3a094',.06],['CONC_D','#7a786e',.08], ['CONC_MOSS','#6d7a58',.10],
  ['BRICK','#8a5343',.09], ['BRICK_MOSS','#6e6647',.10],['PLASTER','#b0a996',.06],
  ['STONE','#9a9384',.07], ['STONE_MOSS','#7e8560',.09],
  ['RUST','#8a5734',.10],  ['METAL','#6e7378',.08],    ['STEEL_B','#46606e',.08],
  ['WIN','#2c343a',.09],   ['GLASS_G','#7fa08a',.09],
  ['WOOD','#6b5334',.10],  ['WOOD_ROT','#4f4530',.10],
  ['TILE_ROOF','#8a5a44',.09],['SHINGLE','#6a5340',.09],
  ['RUBBLE','#96907f',.13],['RUBBLE_MOSS','#7b8055',.13],['CHARRED','#34302b',.10],
  ['WATER','#3b5a4e',.05], ['WATER_D','#2c463e',.05],  ['ALGAE','#5e7a45',.10],
  ['CLOTH_R','#9a5548',.08],['CLOTH_B','#4a6b7a',.08],
  ['RAIL','#5a5550',.07],  ['PLANE','#b9bcb4',.06],    ['FARM','#5a4a30',.10],
  ['LAMPGLASS','#cbd8b0',.05],['LIT','#ffe2a8',.05,true]
];
var M = {}, MATS = [];
for(var _i = 0; _i < MATDEF.length; _i++){
  var _d = MATDEF[_i]; M[_d[0]] = _i;
  MATS[_i] = _d[1] ? { c:_d[1], n:_d[2] === undefined ? .06 : _d[2], e:!!_d[3] } : null;
}

/* ══════════ 2. 时段调色 ══════════ */
var GRADES = [
  { key:'noon', name:'湿雾正午', light:'#fff3cf', lightI:.92, amb:'#93b08a', ambI:.56,
    haze:'#a3bb98', hazeI:.40, win:.04, rays:.55,
    sky:[[0,'#7d9ea8'],[.45,'#a8bfae'],[.78,'#c6cfae'],[1,'#d8d9b4']], sun:[.34,.14,'#fff6d0',.30], stars:0 },
  { key:'dusk', name:'金绿黄昏', light:'#ffc879', lightI:.95, amb:'#61897a', ambI:.44,
    haze:'#8a9a6e', hazeI:.36, win:.55, rays:.85,
    sky:[[0,'#243544'],[.40,'#4d5c52'],[.72,'#93885a'],[1,'#d8a860']], sun:[.28,.72,'#ffd894',.52], stars:0 },
  { key:'rain', name:'雨后阴绿', light:'#d6e4d2', lightI:.34, amb:'#a6bcae', ambI:.92,
    haze:'#adc0b2', hazeI:.44, win:.12, rays:.14,
    sky:[[0,'#5c6a6a'],[.5,'#7f8c84'],[.82,'#a2ab9c'],[1,'#b8bcaa']], sun:[.5,.2,'#e6ece2',.12], stars:0 },
  { key:'night', name:'萤火夜', light:'#8fb4d8', lightI:.12, amb:'#22382e', ambI:.36,
    haze:'#16261f', hazeI:.50, win:1, rays:.10,
    sky:[[0,'#04070a'],[.5,'#08100f'],[.84,'#122019'],[1,'#1c2c22']], sun:[.24,.18,'#cfe0ff',.16], stars:260 }
];
var FACE_D = [1.00, .05, .80, .15];   /* 直射：顶 / 顶(阴影) / 左(+y 受光) / 右(+x 背光) */
var FACE_A = [1.00, .90, .62, .46];   /* 天光 */
var AOK    = [1.00, .86, .72];
function PK(f,v,ao,dl){ return ((f * 3 + v) * 3 + ao) * ND + dl; }
function hx(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function cl(v){ return v < 0 ? 0 : v > 255 ? 255 : v | 0; }
function toCss(r,g,b){ return 'rgb(' + cl(r) + ',' + cl(g) + ',' + cl(b) + ')'; }

function buildPalette(g){
  var L = hx(g.light), A = hx(g.amb), Hz = hx(g.haze), W = hx('#2c343a'), pal = [];
  for(var m = 0; m < MATS.length; m++){
    var def = MATS[m];
    if(!def){ pal.push(null); continue; }
    var base = hx(def.c), arr = new Array(4 * 3 * 3 * ND);
    for(var f = 0; f < 4; f++) for(var v = 0; v < 3; v++) for(var ao = 0; ao < 3; ao++) for(var dl = 0; dl < ND; dl++){
      var vk = 1 + (v - 1) * def.n, k = AOK[ao], sb = def.e ? W : base;
      var ir = (A[0]/255*g.ambI*FACE_A[f] + L[0]/255*g.lightI*FACE_D[f]) * k;
      var ig = (A[1]/255*g.ambI*FACE_A[f] + L[1]/255*g.lightI*FACE_D[f]) * k;
      var ib = (A[2]/255*g.ambI*FACE_A[f] + L[2]/255*g.lightI*FACE_D[f]) * k;
      var r = sb[0]*vk*ir, gg = sb[1]*vk*ig, b = sb[2]*vk*ib;
      if(def.e){ var wn = g.win; r = r*(1-wn) + base[0]*1.05*vk*wn; gg = gg*(1-wn) + base[1]*1.05*vk*wn; b = b*(1-wn) + base[2]*1.05*vk*wn; }
      var hzt = g.hazeI * Math.pow(dl / (ND - 1), 1.12) * (def.e ? .3 : 1);
      r += (Hz[0]-r)*hzt; gg += (Hz[1]-gg)*hzt; b += (Hz[2]-b)*hzt;
      arr[PK(f,v,ao,dl)] = toCss(r, gg, b);
    }
    pal.push(arr);
  }
  return pal;
}

/* 手写颗粒图案（16×16，值 0/1/2）——替代随机抖动，保证画面确定性 */
var DITHER = [
  '0112001210021120','1201120021120102','0210021102001211','2100211200120021',
  '0021120021102110','1102001211002012','2010211002110201','0121002110021120',
  '1002112002011210','0211021120120021','2120010211002112','1001211002210120',
  '0112002110120211','2011201021002110','1200112002112001','0121021100211202'
];
var DTAB = new Uint8Array(256);
for(var _y = 0; _y < 16; _y++) for(var _x = 0; _x < 16; _x++) DTAB[_y * 16 + _x] = DITHER[_y].charCodeAt(_x) - 48;

/* ══════════ 3. 世界容器 ══════════ */
var vox  = new Uint8Array(NX * NY * NZ);
var mats = new Uint8Array(NX * NY);      // 地表材质（手工绘制）
var hoff = new Int8Array(NX * NY);       // 地表高度偏移
var landM = new Uint8Array(NX * NY);     // 地块掩码
var edist = new Int16Array(NX * NY);     // 到地块外缘距离（削薄地基用）
var emit = [], lits = [], shimmer = [], rays = [];

function ID(x,y,z){ return (z * NY + y) * NX + x; }
function inb(x,y){ return x >= 0 && y >= 0 && x < NX && y < NY; }
function land(x,y){ return inb(x,y) && landM[y * NX + x] === 1; }
function set(x,y,z,m){ if(x<0||y<0||z<0||x>=NX||y>=NY||z>=NZ) return; vox[ID(x,y,z)] = m; }
function get(x,y,z){ return (x<0||y<0||z<0||x>=NX||y>=NY||z>=NZ) ? 0 : vox[ID(x,y,z)]; }
function gtop(x,y){ return GT + (inb(x,y) ? hoff[y * NX + x] : 0); }          /* 地表顶面 z */
function topOf(x,y){ if(!inb(x,y)) return -1; for(var z = NZ-1; z >= 0; z--) if(vox[ID(x,y,z)]) return z; return -1; }
function isWater(m){ return m === M.WATER || m === M.WATER_D || m === M.ALGAE; }

/* ── 地表绘制原语（全部手工调用） ──
   PASS=1 只画地表；terrain() 铺完地基后 BUILT=true，PASS=2 再走一遍立体构件。
   surf() 在 BUILT 后会直接改写地表体素，因此两遍执行结果一致（幂等）。 */
var PASS = 1, BUILT = false;
function surf(x,y,m,ho){
  if(!inb(x,y) || m === undefined) return;
  var i = y*NX+x;
  if(BUILT && ho !== undefined && ho !== hoff[i]) set(x, y, GT + hoff[i], 0);   /* 高度变了先清旧地表 */
  mats[i] = m;
  if(ho !== undefined) hoff[i] = ho;
  if(BUILT && landM[i]) set(x, y, GT + hoff[i], m);
}
function solid(){ return PASS === 2; }          /* 立体构件只在第二遍生效 */
function ground(){ return PASS === 1; }         /* 地表原语只在第一遍生效（避免二次覆盖） */
function rect(x,y,w,h,m,ho){ if(!ground()) return; for(var j=0;j<h;j++) for(var i=0;i<w;i++) surf(x+i,y+j,m,ho); }
function poly(pts,m,ho){
  if(!ground()) return;
  var minY=1e9,maxY=-1e9,i;
  for(i=0;i<pts.length;i++){ if(pts[i][1]<minY)minY=pts[i][1]; if(pts[i][1]>maxY)maxY=pts[i][1]; }
  for(var y=Math.max(0,Math.floor(minY)); y<=Math.min(NY-1,Math.ceil(maxY)); y++){
    var xs=[];
    for(i=0;i<pts.length;i++){
      var a=pts[i], b=pts[(i+1)%pts.length];
      if((a[1]<=y && b[1]>y) || (b[1]<=y && a[1]>y)) xs.push(a[0] + (y-a[1])/(b[1]-a[1])*(b[0]-a[0]));
    }
    xs.sort(function(p,q){ return p-q; });
    for(var k=0;k+1<xs.length;k+=2)
      for(var x=Math.max(0,Math.ceil(xs[k])); x<=Math.min(NX-1,Math.floor(xs[k+1])); x++) surf(x,y,m,ho);
  }
}
function maskPoly(pts,val){                      /* 只改地块掩码 */
  if(!ground()) return;
  var minY=1e9,maxY=-1e9,i;
  for(i=0;i<pts.length;i++){ if(pts[i][1]<minY)minY=pts[i][1]; if(pts[i][1]>maxY)maxY=pts[i][1]; }
  for(var y=Math.max(0,Math.floor(minY)); y<=Math.min(NY-1,Math.ceil(maxY)); y++){
    var xs=[];
    for(i=0;i<pts.length;i++){
      var a=pts[i], b=pts[(i+1)%pts.length];
      if((a[1]<=y && b[1]>y) || (b[1]<=y && a[1]>y)) xs.push(a[0] + (y-a[1])/(b[1]-a[1])*(b[0]-a[0]));
    }
    xs.sort(function(p,q){ return p-q; });
    for(var k=0;k+1<xs.length;k+=2)
      for(var x=Math.max(0,Math.ceil(xs[k])); x<=Math.min(NX-1,Math.floor(xs[k+1])); x++) landM[y*NX+x]=val;
  }
}
/* 沿手绘折线铺一条带（河道 / 小径 / 铁轨） */
function band(pts,w,m,ho){
  if(!ground()) return;
  var r = w/2;
  for(var s=0;s+1<pts.length;s++){
    var ax=pts[s][0], ay=pts[s][1], bx=pts[s+1][0], by=pts[s+1][1];
    var len = Math.max(Math.abs(bx-ax), Math.abs(by-ay)) * 2 + 1;
    for(var t=0;t<=len;t++){
      var px = ax + (bx-ax)*t/len, py = ay + (by-ay)*t/len;
      for(var dy=-Math.ceil(r);dy<=Math.ceil(r);dy++) for(var dx=-Math.ceil(r);dx<=Math.ceil(r);dx++)
        if(dx*dx + dy*dy <= r*r) surf(Math.round(px)+dx, Math.round(py)+dy, m, ho);
    }
  }
}
/* 街道：车行道下沉一格，两侧人行道 */
function road(x,y,w,h,withWalk){
  if(!ground()) return;
  rect(x,y,w,h,M.ASPHALT,-1);
  if(withWalk !== false){
    if(w < h){ rect(x-1,y,1,h,M.SIDEWALK,0); rect(x+w,y,1,h,M.SIDEWALK,0); }
    else      { rect(x,y-1,w,1,M.SIDEWALK,0); rect(x,y+h,w,1,M.SIDEWALK,0); }
  }
}
/* 小图案（手绘 ASCII，用于农田/铺装/裂缝等重复细节） */
var PLEG = {
  '.':M.GRASS, ',':M.GRASS2, '`':M.GRASS_DRY, 'm':M.MOSS, 'p':M.SOIL, 'g':M.GRAVEL,
  '=':M.PAVE, '_':M.SIDEWALK, '%':M.FARM, 'D':M.RUBBLE, 'd':M.RUBBLE_MOSS,
  ':':M.ASPH_CRK, '#':M.ASPHALT, '~':M.WATER, '-':M.ALGAE, 's':M.MUD, '^':M.ROCK,
  'c':M.CONC_D, 'C':M.CONCRETE, 'S':M.STONE, 'M':M.STONE_MOSS, 'w':M.WOOD
};
function stamp(x0,y0,rows,ho){
  if(!ground()) return;
  for(var j=0;j<rows.length;j++) for(var i=0;i<rows[j].length;i++){
    var ch = rows[j].charAt(i);
    if(ch === ' ') continue;
    var m = PLEG[ch];
    if(m !== undefined) surf(x0+i, y0+j, m, ho);
  }
}

/* ══════════ 4. 预制件（每次调用都由手写参数驱动） ══════════ */
/* 4.1 植被 ---------------------------------------------------------------- */
function tree(x,y,kind){
  if(!solid() || !land(x,y)) return;
  var b = gtop(x,y), h, r, lm, i, j, k, par = (x + y) % 3;
  if(kind === 'Y'){ h = 11 + (par === 1 ? 2 : 0); r = 3; lm = M.LEAF; }
  else if(kind === 'T'){ h = 8 + par; r = 2; lm = M.LEAF; }
  else if(kind === 't'){ h = 5 + (par === 2 ? 1 : 0); r = 1; lm = M.LEAF_L; }
  else if(kind === 'b'){ h = 1; r = 1; lm = M.LEAF_L; }
  else if(kind === 'F'){ h = 6 + par; r = 0; lm = 0; }          /* 枯树 */
  else if(kind === 'V'){ h = 7 + par; r = 2; lm = M.IVY; }      /* 藤缠树 */
  else { h = 6; r = 2; lm = M.LEAF; }
  for(k = 1; k <= h; k++) set(x, y, b + k, kind === 'F' ? M.TRUNK_D : M.TRUNK);
  if(kind === 'F'){                                             /* 枯枝 */
    set(x+1, y, b+h-1, M.TRUNK_D); set(x, y-1, b+h-2, M.TRUNK_D); set(x-1, y, b+h, M.TRUNK_D);
    return;
  }
  if(r === 0) return;
  var cz = b + h, sh = [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
  var k0 = (kind === 'b') ? 0 : -1, k1 = (r >= 3 ? 2 : 1);
  for(k = k0; k <= k1; k++){
    var rr = (k === k0 || k === k1) ? r - 1 : r;
    if(rr < 0) rr = 0;
    for(j = -rr; j <= rr; j++) for(i = -rr; i <= rr; i++){
      if(i*i + j*j > rr*rr + (rr > 1 ? 1 : 0)) continue;
      var d = Math.abs(i) + Math.abs(j);
      var mm = (k >= 1 || d === 0) ? (par === 0 ? M.LEAF_L : lm) : (d >= rr ? M.LEAF_D : lm);
      set(x+i, y+j, cz+k, mm);
    }
  }
  for(i = 0; i < sh.length; i++) if((i + par) % 2 === 0 && h > 3) set(x + sh[i][0], y + sh[i][1], cz - 2, M.LEAF_D);
}
function trees(kind, list){ for(var i = 0; i + 1 < list.length; i += 2) tree(list[i], list[i+1], kind); }
function grass(kind, list){                              /* 高草 / 芦苇 / 花簇 */
  if(!solid()) return;
  var m = kind === 'r' ? M.REED : kind === '*' ? M.FLOWER : M.WEED;
  for(var i = 0; i + 1 < list.length; i += 2){
    var x = list[i], y = list[i+1];
    if(!land(x,y)) continue;
    var t = topOf(x,y); if(t < 0) t = gtop(x,y);
    set(x, y, t + 1, m);
    if(kind === 'r' && (x + y) % 3 === 0) set(x, y, t + 2, m);
  }
}
function ivyPatch(x,y,w,h){                              /* 地面藤蔓 */
  if(!solid()) return;
  for(var j=0;j<h;j++) for(var i=0;i<w;i++){
    if(DTAB[((y+j)&15)*16 + ((x+i)&15)] === 0) continue;
    if(!land(x+i,y+j)) continue;
    var t = topOf(x+i, y+j); if(t < 0) t = gtop(x+i, y+j);
    set(x+i, y+j, t + 1, M.IVY);
  }
}
/* 4.2 手工废楼：top 为手绘顶面轮廓（数字 0-9 = 该列保留高度的十分比） */
function build(o){
  if(!solid()) return;
  var x0=o.x, y0=o.y, w=o.w, d=o.d, h=o.h, wall=o.wall||M.CONCRETE, fl=o.fl||3;
  var base = gtop(x0, y0), i, j, k, z;
  var top = o.top || null, cuts = o.cuts || [], vines = o.vines || [], balc = o.balc || [];
  function colh(i,j){
    if(!top) return h;
    var row = top[Math.min(top.length-1, j)];
    var ch = row.charAt(Math.min(row.length-1, i));
    if(ch === ' ') return h;
    return Math.round(h * (ch.charCodeAt(0) - 48) / 9);
  }
  function cut(x,y,z){
    for(var c=0;c<cuts.length;c++){
      var q=cuts[c];
      if(x>=x0+q[0] && x<x0+q[0]+q[3] && y>=y0+q[1] && y<y0+q[1]+q[4] && z>=base+q[2] && z<base+q[2]+q[5]) return true;
    }
    return false;
  }
  for(i=0;i<w;i++) for(j=0;j<d;j++){
    var gx=x0+i, gy=y0+j;
    if(!land(gx,gy)) continue;
    surf(gx, gy, o.floor === undefined ? M.CONC_D : o.floor, 0);
    var per = i===0||j===0||i===w-1||j===d-1;
    var hh = colh(i,j);
    var core = o.core && i>=o.core[0] && i<o.core[0]+o.core[2] && j>=o.core[1] && j<o.core[1]+o.core[3];
    for(k=1;k<=hh;k++){
      z = base + k; if(z >= NZ) break;
      if(cut(gx,gy,z)) continue;
      var m = 0;
      if(per){
        var along = (j===0||j===d-1) ? i : j;
        var lvl = (k-1) % fl;
        if(k > 1 && lvl === 1 && along % 3 !== 0) m = (o.openWin && (along + k) % 5 === 0) ? 0 : M.WIN;
        else m = wall;
        if(k === hh) m = o.mossTop === false ? wall : M.CONC_MOSS;
      } else if(core){
        m = (i===o.core[0]||j===o.core[1]||i===o.core[0]+o.core[2]-1||j===o.core[1]+o.core[3]-1) ? M.CONC_D : 0;
      } else if((k-1) % fl === 0){
        m = M.CONC_D;                                  /* 楼板 */
      }
      if(m) set(gx, gy, z, m);
    }
    /* 断口处的覆苔与残植 */
    if(hh > 0 && per && (i + j) % 4 === 0 && !cut(gx,gy,base+hh+1)) set(gx, gy, base + hh + 1, M.RUBBLE_MOSS);
  }
  /* 手写垂藤：[side,pos,自顶向下长度] */
  for(i=0;i<vines.length;i++){
    var v = vines[i], sd = v[0], ps = v[1], ln = v[2], vx, vy;
    for(k=0;k<ln;k++){
      if(sd === 'n'){ vx = x0 + ps; vy = y0; }
      else if(sd === 's'){ vx = x0 + ps; vy = y0 + d - 1; }
      else if(sd === 'w'){ vx = x0; vy = y0 + ps; }
      else { vx = x0 + w - 1; vy = y0 + ps; }
      var hv = colh(vx - x0, vy - y0) - k;
      if(hv < 1) break;
      if(get(vx, vy, base + hv)) set(vx, vy, base + hv, M.IVY);
    }
  }
  /* 手写阳台：[side,pos,层] */
  for(i=0;i<balc.length;i++){
    var bq = balc[i], bs = bq[0], bp = bq[1], bk = bq[2], ox = 0, oy = 0, bx, by;
    if(bs === 'n'){ bx = x0 + bp; by = y0; oy = -1; }
    else if(bs === 's'){ bx = x0 + bp; by = y0 + d - 1; oy = 1; }
    else if(bs === 'w'){ bx = x0; by = y0 + bp; ox = -1; }
    else { bx = x0 + w - 1; by = y0 + bp; ox = 1; }
    for(j = -1; j <= 1; j++){
      var px = bx + (ox ? ox : j), py = by + (oy ? oy : j);
      set(px, py, base + bk, M.CONC_D);
      if((j + bp) % 2 === 0) set(px, py, base + bk + 1, M.METAL);
      if((j + bp) % 3 === 0) set(px, py, base + bk + 1, M.IVY);
    }
  }
  /* 屋顶：手写位置的树 / 水箱 / 天线 */
  if(o.roofTrees) for(i=0;i<o.roofTrees.length;i+=2){
    var rx = x0 + o.roofTrees[i], ry = y0 + o.roofTrees[i+1];
    var rh = colh(rx - x0, ry - y0);
    if(rh < 2) continue;
    var rz = base + rh;
    for(k=1;k<=3;k++) set(rx, ry, rz+k, M.TRUNK);
    for(j=-1;j<=1;j++) for(var q=-1;q<=1;q++) set(rx+q, ry+j, rz+4, (q||j) ? M.LEAF : M.LEAF_L);
    set(rx, ry, rz+5, M.LEAF_L);
  }
  if(o.tank){
    var tx = x0 + o.tank[0], ty = y0 + o.tank[1], tz = base + colh(o.tank[0], o.tank[1]);
    for(i=0;i<2;i++) for(j=0;j<2;j++) for(k=1;k<=3;k++) set(tx+i, ty+j, tz+k, k===3 ? M.RUST : M.METAL);
  }
  if(o.mast){
    var mx = x0 + o.mast[0], my = y0 + o.mast[1], mz = base + colh(o.mast[0], o.mast[1]), ml = o.mast[2] || 6;
    for(k=1;k<=ml;k++) set(mx + ((o.mast[3] && k > ml/2) ? 1 : 0), my, mz+k, M.METAL);
    set(mx+1, my, mz + Math.round(ml*.6), M.METAL); set(mx-1, my, mz + Math.round(ml*.6), M.METAL);
  }
  /* 底部瓦砾（手写量） */
  if(o.debris) for(i = -1; i <= w; i++) for(j = -1; j <= d; j++){
    if(i>=0 && i<w && j>=0 && j<d) continue;
    if(!land(x0+i, y0+j)) continue;
    if(DTAB[((y0+j)&15)*16 + ((x0+i)&15)] < (o.debris > 1 ? 1 : 2)) continue;
    var t2 = topOf(x0+i, y0+j); if(t2 < 0 || t2 > base + 1) continue;
    set(x0+i, y0+j, t2+1, (i+j) % 3 === 0 ? M.RUBBLE_MOSS : M.RUBBLE);
    if(o.debris > 1 && (i*j) % 5 === 0) set(x0+i, y0+j, t2+2, M.RUBBLE_MOSS);
  }
}
/* 4.3 坡屋顶小住宅 */
function house(o){
  if(!solid()) return;
  var x0=o.x, y0=o.y, w=o.w, d=o.d, h=o.h || 3, wall=o.wall || M.PLASTER, base=gtop(x0,y0);
  var i,j,k,z, ruin = o.ruin || 0;   /* 0 完好 1 屋顶破 2 半塌 */
  for(i=0;i<w;i++) for(j=0;j<d;j++){
    var gx=x0+i, gy=y0+j; if(!land(gx,gy)) continue;
    surf(gx,gy,M.CONC_D,0);
    var per = i===0||j===0||i===w-1||j===d-1;
    var hh = h;
    if(ruin === 2 && i > w/2) hh = Math.max(0, h - 2 - ((i+j)%2));
    for(k=1;k<=hh;k++){
      z = base+k;
      var m = 0;
      if(per){
        var along = (j===0||j===d-1)? i : j;
        m = (k === 2 && along % 2 === 1) ? M.WIN : wall;
        if(k === 1 && along === Math.floor((j===0||j===d-1?w:d)/2) && (j===0)) m = M.WOOD;   /* 门 */
      }
      if(m) set(gx,gy,z,m);
    }
  }
  /* 双坡瓦顶（沿 x 起脊） */
  var rm = o.roofMat || M.TILE_ROOF, cy = (d-1)/2;
  for(i=-1;i<=w;i++) for(j=-1;j<=d;j++){
    var ry = Math.round(cy - Math.abs(j - cy));
    var rz = base + h + Math.max(0, ry);
    if(ruin >= 1 && ((i + j) % 5 === 0 || (ruin === 2 && i > w/2))) continue;
    if(!land(x0+i, y0+j)) continue;
    set(x0+i, y0+j, rz, (i+j) % 7 === 0 ? M.RUBBLE_MOSS : rm);
    if(ruin >= 1 && (i+j) % 4 === 0) set(x0+i, y0+j, rz+1, M.MOSS);
  }
  if(o.chimney !== false){ var cx2 = x0 + (o.cpos === undefined ? 1 : o.cpos);
    for(k=0;k<3;k++) set(cx2, y0 + Math.round(cy), base + h + Math.round(cy) + k, M.BRICK); }
  if(o.vine) for(k=0;k<o.vine.length;k+=2) for(var q=1;q<=h;q++) set(x0+o.vine[k], y0+o.vine[k+1], base+q, M.IVY);
}
/* 4.4 工业厂房（锯齿顶 + 手写缺口） */
function hall(o){
  if(!solid()) return;
  var x0=o.x,y0=o.y,w=o.w,d=o.d,h=o.h||8, base=gtop(x0,y0), i,j,k;
  var miss = o.miss || [];         /* 手写缺失的屋面开间 */
  function gone(bay){ for(var q=0;q<miss.length;q++) if(miss[q] === bay) return true; return false; }
  for(i=0;i<w;i++) for(j=0;j<d;j++){
    var gx=x0+i, gy=y0+j; if(!land(gx,gy)) continue;
    surf(gx,gy,M.CONC_D,0);
    var per = i===0||j===0||i===w-1||j===d-1;
    if(!per) continue;
    var hh = (o.broken && i > w*0.6 && (i+j)%3===0) ? h-3 : h;
    for(k=1;k<=hh;k++){
      var m = o.wall || M.CONC_D;
      if(k > 2 && k < h-1 && ((j===0||j===d-1) ? i : j) % 4 === 2) m = M.WIN;
      if(k === hh) m = M.CONC_MOSS;
      set(gx,gy,base+k,m);
    }
  }
  /* 门洞 */
  if(o.door) for(i=0;i<o.door.length;i+=2){
    var dx = x0 + o.door[i], dy = y0 + o.door[i+1];
    for(k=1;k<=4;k++){ set(dx,dy,base+k,0); set(dx+1,dy,base+k,0); }
  }
  /* 锯齿屋面：每 4 格一个开间，北坡玻璃 */
  for(i=0;i<w;i++){
    var bay = Math.floor(i/4);
    for(j=0;j<d;j++){
      if(!land(x0+i,y0+j)) continue;
      var st = i % 4, z = base + h + st;
      if(gone(bay)){ if((i+j)%3===0) set(x0+i,y0+j, base+1, M.RUBBLE_MOSS); continue; }
      set(x0+i, y0+j, z, st === 3 ? M.GLASS_G : (o.roof || M.METAL));
      if(st === 3 && (i+j)%5===0) set(x0+i,y0+j,z+1,M.MOSS);
    }
  }
}
/* 4.5 圆柱体（筒仓 / 烟囱 / 水塔柱） */
function cyl(cx,cy,r,z0,z1,m,capm){
  for(var z=z0; z<=z1; z++) for(var j=-r;j<=r;j++) for(var i=-r;i<=r;i++){
    var dd = i*i + j*j;
    if(dd > r*r) continue;
    var shell = dd > (r-1)*(r-1);
    if(z === z1 && capm !== undefined){ set(cx+i, cy+j, z, capm); continue; }
    if(shell) set(cx+i, cy+j, z, m);
  }
}
function silo(o){
  if(!solid()) return;
  var base = gtop(o.x,o.y), t = base + o.h;
  cyl(o.x, o.y, o.r, base+1, t, o.mat || M.CONCRETE, o.cap === false ? undefined : (o.capMat || M.RUST));
  /* 手写破口 */
  if(o.hole) for(var q=0;q<o.hole.length;q+=3)
    for(var k=0;k<o.hole[q+2];k++) set(o.x + o.hole[q], o.y + o.hole[q+1], t - k, 0);
  for(var j=-o.r;j<=o.r;j++) for(var i=-o.r;i<=o.r;i++)
    if(i*i+j*j <= o.r*o.r && DTAB[((o.y+j)&15)*16+((o.x+i)&15)] === 2) set(o.x+i, o.y+j, t, M.MOSS);
}
function chimney(o){
  if(!solid()) return;
  var base = gtop(o.x,o.y);
  cyl(o.x, o.y, 2, base+1, base + o.h, M.BRICK);      /* cyl 只填壳层，内部天然中空 */
  /* 手写顶部残缺 */
  var jag = o.jag || [0,0,1, 1,0,2, -1,1,1, 0,-1,3];
  for(var q=0;q<jag.length;q+=3) for(var k=0;k<jag[q+2];k++) set(o.x+jag[q], o.y+jag[q+1], base+o.h-k, 0);
  for(var i=-2;i<=2;i++) for(var j=-2;j<=2;j++)
    if(i*i+j*j<=4 && (i+j)%2===0) set(o.x+i, o.y+j, base+o.h-4, M.IVY);
}
/* 4.6 桥 / 高架 */
function archBridge(o){          /* 石拱桥：沿 y 跨越 */
  if(!solid()) return;
  var x0=o.x, y0=o.y, w=o.w, len=o.len, dz = gtop(x0,y0-1) + 2, i, j, k;
  for(j=0;j<len;j++){
    var t = j/(len-1), rise = Math.round(Math.sin(Math.PI*t) * 2);
    for(i=0;i<w;i++){
      set(x0+i, y0+j, dz + rise, M.STONE);
      if(i===0 || i===w-1){ set(x0+i, y0+j, dz+rise+1, (j%3===0)? M.STONE_MOSS : M.STONE); }
      else if(j%4===0) surf(x0+i, y0+j, M.PAVE, 0);
    }
    /* 桥墩与拱腹 */
    if(j > 1 && j < len-2){
      var arc = Math.round(Math.sin(Math.PI*t) * 3);
      for(i=0;i<w;i++) for(k=1;k<=2;k++){
        var zz = dz + rise - k;
        if(k > (2 - Math.min(2, arc))) continue;
        if(i===0||i===w-1) set(x0+i, y0+j, zz, M.STONE);
      }
    }
    if(j === 3 || j === len-4) for(i=0;i<w;i++) for(k = dz + rise - 1; k > GT - 4; k--) set(x0+i, y0+j, k, M.STONE_MOSS);
  }
  /* 垂藤 */
  for(j=2;j<len-2;j+=3) for(k=0;k<3;k++) set(x0, y0+j, dz - k, M.IVY);
}
function brokenBridge(o){        /* 断桥：沿 y，中段坠落 */
  if(!solid()) return;
  var x0=o.x, y0=o.y, w=o.w, len=o.len, dz = gtop(x0,y0-1) + 2;
  var g0 = o.gap[0], g1 = o.gap[1], i, j, k;
  for(j=0;j<len;j++){
    var inGap = j >= g0 && j <= g1;
    for(i=0;i<w;i++){
      if(inGap) continue;
      var edge = (j === g0-1 || j === g1+1);
      if(edge && (i % 3 === 1)) continue;                       /* 断口锯齿 */
      set(x0+i, y0+j, dz, (j % 5 === 0 || edge) ? M.RUBBLE : M.CONCRETE);
      if(i===0 || i===w-1) set(x0+i, y0+j, dz+1, (j%3===0) ? M.RUBBLE_MOSS : M.METAL);
      if(!edge && i>0 && i<w-1 && j%6 < 2) set(x0+i, y0+j, dz, M.ASPH_CRK);
    }
    if((j === 2 || j === len-3) && !inGap)
      for(i=0;i<w;i+=w-1) for(k=dz-1;k>GT-4;k--) set(x0+i, y0+j, k, M.CONCRETE);
  }
  /* 坠入水中的桥面板（手写三块） */
  var slabs = o.slabs || [[0,1,-2],[2,3,-3],[1,5,-1]];
  for(var q=0;q<slabs.length;q++){
    var sx = x0 + slabs[q][0], sy = y0 + g0 + slabs[q][1], sz = dz + slabs[q][2];
    for(i=0;i<3;i++) for(j=0;j<2;j++) set(sx+i, sy+j, sz - Math.floor(i/2), M.CONCRETE);
    set(sx, sy, sz+1, M.METAL); set(sx+2, sy+1, sz, M.RUBBLE);
  }
  /* 露出的钢筋 */
  for(i=0;i<w;i+=2){ set(x0+i, y0+g0-1, dz+1, M.METAL); set(x0+i, y0+g1+1, dz+1, M.METAL); }
}
function overpass(o){            /* 高架高速：沿 x，手写断口 */
  if(!solid()) return;
  var y0=o.y, w=o.w, x0=o.x, x1=o.x1, dz = GT + (o.z || 9), i, j, k;
  var g0 = o.gap[0], g1 = o.gap[1];
  for(i=x0;i<=x1;i++){
    var inGap = i >= g0 && i <= g1;
    for(j=0;j<w;j++){
      if(!land(i, y0+j)) continue;
      if(inGap){
        /* 塌落段：桥面斜插入地 */
        var t = (i - g0) / Math.max(1, g1 - g0);
        var drop = Math.round(Math.sin(Math.PI * t) * (dz - GT - 1));
        if(drop > 2) set(i, y0+j, dz - drop, (i+j)%4===0 ? M.RUBBLE : M.CONCRETE);
        continue;
      }
      var edge = (i === g0-1 || i === g1+1);
      if(edge && j % 3 === 2) continue;
      set(i, y0+j, dz, (j===0||j===w-1) ? M.CONCRETE : ((i%7 < 2 && j===Math.floor(w/2)) ? M.ASPH_CRK : M.ASPHALT));
      if(j===0 || j===w-1) if(i % 5 !== 3) set(i, y0+j, dz+1, M.METAL);
      if((i % 11 === 0) && j > 0 && j < w-1) set(i, y0+j, dz+1, M.RUBBLE_MOSS);
    }
    /* 桥墩 */
    if(i % 7 === 0 && !inGap){
      for(j=1;j<w-1;j+=w-3){
        if(!land(i, y0+j)) continue;
        for(k = gtop(i, y0+j) + 1; k < dz; k++) set(i, y0+j, k, (k > dz-4 && (k+i)%3===0) ? M.IVY : M.CONCRETE);
        set(i, y0+j, dz-1, M.CONC_MOSS);
      }
    }
  }
  /* 桥面上长出的树（手写位置） */
  if(o.deckTrees) for(i=0;i<o.deckTrees.length;i+=2){
    var tx = o.deckTrees[i], ty = y0 + o.deckTrees[i+1];
    for(k=1;k<=4;k++) set(tx, ty, dz+k, M.TRUNK);
    for(j=-1;j<=1;j++) for(var q2=-1;q2<=1;q2++) set(tx+q2, ty+j, dz+5, (q2||j)? M.LEAF : M.LEAF_L);
  }
}
/* 4.7 铁路与列车 */
function tracks(y, x0, x1, n, gapEvery){
  for(var q=0;q<n;q++){
    var yy = y + q*2;
    for(var x=x0;x<=x1;x++){
      if(!land(x,yy)) continue;
      surf(x, yy, M.RAIL, 0); surf(x, yy-1, M.GRAVEL, 0); surf(x, yy+1, M.GRAVEL, 0);
      if(gapEvery && x % gapEvery === 0) surf(x, yy, M.WEED, 0);
    }
  }
}
function train(o){               /* 手写车厢序列 */
  if(!solid()) return;
  var x = o.x, y = o.y, base = gtop(x,y), i, j, k, c;
  for(c=0;c<o.cars.length;c++){
    var car = o.cars[c], len = car.len || 6, tilt = car.tilt || 0;
    var m = car.type === 'loco' ? M.STEEL_B : car.type === 'tank' ? M.RUST : car.type === 'box' ? M.CLOTH_R : M.METAL;
    for(i=0;i<len;i++){
      var cx = x + i, cy = y + (tilt && i > len/2 ? tilt : 0);
      if(!land(cx,cy)) continue;
      var hgt = car.type === 'flat' ? 1 : (car.type === 'loco' ? 4 : 3);
      for(k=1;k<=hgt;k++){
        var mm = m;
        if(car.type === 'tank' && k === hgt) mm = M.RUST;
        if(k === hgt && car.type === 'box' && (i % 3 === 0)) mm = M.RUBBLE_MOSS;
        if(car.type === 'loco' && k === 4 && (i < 2 || i > len-3)) mm = 0;
        if(mm) set(cx, cy, base+k, mm);
        if(k === 2 && i % 2 === 1 && car.type !== 'flat') set(cx, cy, base+k, M.WIN);
      }
      /* 车顶植被 */
      if((i + c) % 4 === 0) set(cx, cy, base + (car.type === 'flat' ? 1 : 3) + 1, M.MOSS);
    }
    x += len + 1;
  }
}
/* 4.8 其他手工构件 */
function waterTower(o){

  for(k=1;k<=3;k++) set(o.x+1, o.y+1, base + Math.round(h*0.5) + k, M.RUST);  /* 爬梯 */
  cyl(o.x+1, o.y+1, 3, base+h, base+h+4, M.RUST, M.RUST);
  for(i=-3;i<=3;i++) for(j=-3;j<=3;j++) if(i*i+j*j<=9 && (i+j)%3===0) set(o.x+1+i, o.y+1+j, base+h+4, M.MOSS);

function lookout(o){             /* 林中木哨塔 */

  }
  for(i=-1;i<=4;i++) for(j=-1;j<=4;j++) set(o.x+i, o.y+j, base+h+4, M.WOOD_ROT);

function monument(o){             /* 倾倒的纪念柱 */
  if(!solid()) return;
  var base = gtop(o.x,o.y), i, j, k;
  for(i=0;i<5;i++) for(j=0;j<5;j++) for(k=1;k<=2;k++) set(o.x+i, o.y+j, base+k, (i===0||j===0||i===4||j===4)? M.STONE_MOSS : M.STONE);
  /* 柱身断成三截，横躺向东 */
  var segs = [[6,1,3],[11,2,3],[16,1,2]];
  for(var q=0;q<segs.length;q++){
    var sx = o.x + segs[q][0], sy = o.y + segs[q][1], ln = segs[q][2] + 3;
    for(i=0;i<ln;i++) for(j=0;j<3;j++) for(k=1;k<=2;k++){
      if((j===0||j===2) && (k===2)) continue;
      set(sx+i, sy+j, base+k, ((i+j+q)%4===0) ? M.STONE_MOSS : M.STONE);
    }
  }
  for(i=0;i<3;i++) set(o.x+3+i, o.y+2, base+1, M.RUBBLE);

function bellTower(o){            /* 倾斜的钟楼：每 6 层向东偏 1 */
  if(!solid()) return;
  var base = gtop(o.x,o.y), i, j, k, h = o.h || 22, lean = 0;
  for(k=1;k<=h;k++){
    lean = Math.floor(k/6);

      var per = i===0||j===0||i===4||j===4;
      if(!per) continue;
      var m = M.STONE;
      if(k > h-6 && ((i===2&&(j===0||j===4)) || (j===2&&(i===0||i===4)))) m = 0;   /* 拱窗 */
      else if(k % 7 === 0) m = M.STONE_MOSS;
      else if(k < h*0.6 && (i+j+k)%9===0) m = M.IVY;
      if(m) set(o.x+i+lean, o.y+j, base+k, m);
    }
  }
  for(i=1;i<4;i++) for(j=1;j<4;j++) set(o.x+i+lean, o.y+j, base+h, M.STONE_MOSS);
  set(o.x+2+lean, o.y+2, base+h-3, M.RUST);                             /* 铜钟 */
  for(k=1;k<=3;k++) set(o.x+2+lean, o.y+2, base+h+k, M.WOOD_ROT);
}
function greenhouse(o){
  if(!solid()) return;
  var base = gtop(o.x,o.y), i, j, k, w=o.w, d=o.d, h=o.h||4;
  var broken = o.broken || [];
  function brk(i,j){ for(var q=0;q<broken.length;q+=2) if(broken[q]===i && broken[q+1]===j) return true; return false; }
  for(i=0;i<w;i++) for(j=0;j<d;j++){
    var per = i===0||j===0||i===w-1||j===d-1;
    if(per){
      for(k=1;k<=h;k++){
        var m = ((i%3===0)||(j%3===0)) ? M.METAL : M.GLASS_G;
        if(brk(i,j) && k > 1) m = 0;
        if(m) set(o.x+i, o.y+j, base+k, m);
      }
    } else {
      surf(o.x+i, o.y+j, M.FARM, 0);
      if((i+j)%2===0) set(o.x+i, o.y+j, base+1, M.LEAF_L);
      if((i*j)%7===0) set(o.x+i, o.y+j, base+2, M.LEAF);
    }
  }
  /* 双坡玻璃顶，手写破洞 */
  var cyy = (d-1)/2;
  for(i=0;i<w;i++) for(j=0;j<d;j++){
    var rise = Math.round(cyy - Math.abs(j - cyy));
    if(brk(i,j)) continue;
    set(o.x+i, o.y+j, base+h+Math.max(0,rise), ((i%3===0)||(j===Math.round(cyy))) ? M.METAL : M.GLASS_G);
  }
}
function plane(o){                /* 坠落的客机残骸（手写航线两端） */
  if(!solid()) return;
  var p0 = o.from, p1 = o.to, i, j, k, t, a;
  var dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  var steps = Math.max(Math.abs(dx), Math.abs(dy));
  var ln = Math.sqrt(dx*dx + dy*dy) || 1;
  var pxn = -dy/ln, pyn = dx/ln;                      /* 航向的水平法向 */
  for(t = 0; t <= steps; t++){
    if(t > steps*0.42 && t < steps*0.55) continue;     /* 机身断成两截 */
    var cx = p0[0] + dx*t/steps, cy = p0[1] + dy*t/steps;
    var r = (t < steps*0.14) ? 2 : (t > steps*0.88 ? 1 : 3);   /* 机首/机尾收细 */
    var base = gtop(Math.round(cx), Math.round(cy));
    for(a = -r; a <= r; a++) for(k = 0; k <= 2*r; k++){
      var dd = a*a + (k-r)*(k-r);
      if(dd > r*r) continue;
      var shell = dd > (r-1.2)*(r-1.2);
      if(!shell) continue;
      var m = M.PLANE;
      if((t + k*3) % 17 === 0) continue;                              /* 蒙皮破口 */
      if(k === 0) m = M.RUBBLE;
      else if(k >= r-1 && k <= r && (t % 5 === 0)) m = M.WIN;         /* 舷窗带 */
      else if((t + a) % 11 === 0) m = M.RUBBLE_MOSS;                  /* 苔痕 */
      set(Math.round(cx + pxn*a), Math.round(cy + pyn*a), base + 1 + k, m);
    }
  }
  /* 断裂机翼：一片斜插入地的板 */
  var wx = Math.round(p0[0] + dx*0.34), wy = Math.round(p0[1] + dy*0.34);
  for(i = 0; i < 13; i++) for(j = 0; j < 3; j++){
    var lx = wx + Math.round(pxn*(4+i)) + j, ly = wy + Math.round(pyn*(4+i));
    set(lx, ly, gtop(lx,ly) + 1 + Math.floor(i/3), (i+j) % 5 === 0 ? M.RUBBLE : M.PLANE);
  }
  /* 尾翼（起点一侧竖起） */
  for(k = 1; k <= 8; k++) for(i = 0; i < 3; i++)
    if(k > i*2) set(Math.round(p0[0] - dx/steps*i), Math.round(p0[1] - dy/steps*i), gtop(p0[0],p0[1]) + 4 + k, M.PLANE);
  /* 犁沟与抛散的残片 */
  for(t = 0; t <= steps; t++){
    var gx = Math.round(p0[0] + dx*t/steps), gy = Math.round(p0[1] + dy*t/steps);
    for(a = -5; a <= 5; a++){
      var ax = Math.round(gx + pxn*a), ay = Math.round(gy + pyn*a);
      if(!land(ax,ay)) continue;
      if(Math.abs(a) > 3){
        if(DTAB[(ay&15)*16 + (ax&15)] === 2 && t % 4 === 0) set(ax, ay, gtop(ax,ay)+1, (t%3) ? M.RUBBLE : M.PLANE);
        continue;
      }
      surf(ax, ay, Math.abs(a) > 2 ? M.SOIL : M.CHARRED, 0);
      if(Math.abs(a) === 3 && t % 5 === 0) set(ax, ay, gtop(ax,ay)+1, M.RUBBLE);
    }
  }
}
function stadium(o){              /* 体育场：椭圆看台环 + 手写塌陷段 */
  if(!solid()) return;
  var cx=o.x, cy=o.y, rx=o.rx, ry=o.ry, i, j, k;
  var gates = o.gates || [];      /* 手写入口角度段 [起,止] 单位度 */
  var falls = o.falls || [];
  function inRange(list, a){ for(var q=0;q<list.length;q++) if(a >= list[q][0] && a <= list[q][1]) return true; return false; }
  for(j=-ry-3;j<=ry+3;j++) for(i=-rx-3;i<=rx+3;i++){
    var u = i/rx, v = j/ry, rr = Math.sqrt(u*u + v*v);
    var x = cx+i, y = cy+j;
    if(!land(x,y)) continue;
    if(rr < 0.72){ surf(x, y, ((i+j)%5===0) ? M.GRASS2 : M.GRASS, 0); continue; }   /* 草皮 */
    if(rr > 1.04) continue;
    var ang = (Math.atan2(j, i) * 180 / Math.PI + 360) % 360;
    var seat = Math.round((rr - 0.72) / 0.32 * 7);                                   /* 看台阶高 */
    if(inRange(gates, ang)){                                                          /* 入口通道 */
      surf(x, y, M.PAVE, 0);
      if(rr > 0.98) for(k=1;k<=6;k++) set(x,y,gtop(x,y)+k, M.CONC_D);
      continue;
    }
    var damaged = inRange(falls, ang);
    var hh = damaged ? Math.max(0, seat - 4 - ((i+j)%3)) : seat;
    for(k=1;k<=hh;k++) set(x, y, gtop(x,y)+k, (k===hh) ? ((i+j)%4===0 ? M.RUBBLE_MOSS : M.CONC_MOSS) : M.CONCRETE);
    if(!damaged && rr > 0.99) for(k=hh+1;k<=hh+3;k++) set(x,y,gtop(x,y)+k, ((i+j)%6===0) ? M.IVY : M.CONC_D);
    if(damaged && (i+j)%4===0) set(x, y, gtop(x,y)+Math.max(1,hh)+1, M.RUBBLE_MOSS);
  }
  /* 倒下的灯塔 */
  if(o.mast) for(i=0;i<o.mast.length;i+=4){
    var mx=o.mast[i], my=o.mast[i+1], ln=o.mast[i+2], dir=o.mast[i+3];
    for(k=0;k<ln;k++){
      var px = mx + (dir===0? k : 0), py = my + (dir===1? k : 0);
      set(px, py, gtop(px,py)+1+(k<3?1:0), M.METAL);
      if(k%4===0) set(px, py, gtop(px,py)+2, M.RUST);
    }
    for(j=0;j<3;j++) for(k=0;k<3;k++) set(mx+(dir===0?ln:j), my+(dir===1?ln:j), gtop(mx,my)+2+k, M.LAMPGLASS);
  }
}

function terrain(){
  var x, y, z, i;
  /* 地块边缘距离场（两遍扫描，确定性） */
  for(i = 0; i < NX*NY; i++) edist[i] = landM[i] ? 999 : 0;
  for(y = 0; y < NY; y++) for(x = 0; x < NX; x++){
    i = y*NX+x; if(!edist[i]) continue;
    var mn = 999;
    if(x > 0) mn = Math.min(mn, edist[i-1]); else mn = 0;
    if(y > 0) mn = Math.min(mn, edist[i-NX]); else mn = 0;
    if(x > 0 && y > 0) mn = Math.min(mn, edist[i-NX-1]);
    edist[i] = Math.min(edist[i], mn + 1);
  }
  for(y = NY-1; y >= 0; y--) for(x = NX-1; x >= 0; x--){
    i = y*NX+x; if(!edist[i]) continue;
    var m2 = edist[i];
    if(x < NX-1) m2 = Math.min(m2, edist[i+1] + 1); else m2 = 1;
    if(y < NY-1) m2 = Math.min(m2, edist[i+NX] + 1); else m2 = 1;
    if(x < NX-1 && y < NY-1) m2 = Math.min(m2, edist[i+NX+1] + 1);
    edist[i] = m2;
  }
  for(y = 0; y < NY; y++) for(x = 0; x < NX; x++){
    i = y*NX+x;
    if(!landM[i]) continue;
    var sm = mats[i] || M.GRASS, top = GT + hoff[i];
    var th = 3 + Math.min(edist[i], 6);                 /* 边缘削薄 → 撕裂的地块 */
    var z0 = Math.max(0, top - th);
    if(isWater(sm)){
      set(x, y, top, sm);
      set(x, y, top-1, sm === M.ALGAE ? M.WATER : M.WATER_D);
      set(x, y, top-2, M.MUD);
      for(z = z0; z <= top-3; z++) set(x, y, z, (z % 6 < 2) ? M.SUBSOIL : M.ROCK);
      continue;
    }
    for(z = z0; z <= top; z++){
      if(z === top) set(x, y, z, sm);
      else if(z === top-1) set(x, y, z, (sm === M.MUD || sm === M.SAND) ? M.MUD : M.SOIL);
      else if(z === top-2) set(x, y, z, M.SUBSOIL);
      else set(x, y, z, (z % 6 < 2) ? M.SUBSOIL : M.ROCK);
    }
  }
}

    i = y*NX+x;
    if(!landM[i] || !isWater(mats[i])) continue;
    if(((x/3|0) + (y/2|0)) % 3 !== 0) continue;

}

var NOCLIP = {};
(function(){

  var x = Math.floor(gx), y = Math.floor(gy);

  var x = Math.floor(gx), y = Math.floor(gy);

function standZ(gx,gy){
  var x = Math.floor(gx), y = Math.floor(gy);
  if(x < 0 || y < 0 || x >= NX || y >= NY) return GT + 1;
  var best = -1;
  for(var z = 1; z < NZ - 3; z++){
    if(!blocked(x, y, z-1)) continue;

    /* 头部不能泡在水里 */

    return z;

function buildMesh(keepCPU){
  if(!GL) return;

  var hmap = new Int16Array(NX*NY);
  for(y = 0; y < NY; y++) for(x = 0; x < NX; x++){
    var h = 0;
    for(z = NZ-1; z >= 0; z--) if(vox[(z*NY+y)*NX+x]){ h = z+1; break; }
    hmap[y*NX+x] = h;
  }
  function occ(x,y,z){
    if(x<0||y<0||z<0||x>=NX||y>=NY||z>=NZ) return 0;
    return vox[(z*NY+y)*NX+x];
  }
  function shadowed(x,y,z){
    for(var k = 1; k <= SHMAX; k++){
      var xx = x - k, yy = y + k;
      if(xx < 0 || yy >= NY) return 0;
      if(hmap[yy*NX+xx] > z + 1 + k) return 1;
    }
    return 0;
  }
  /* 材质基色（预乘手绘颗粒的三档变体） */

    MC[m] = null;
    if(!MATS[m]) continue;
    var b = hx(MATS[m].c), v3 = [];
    for(var v = 0; v < 3; v++){
      var k2 = 1 + (v-1)*MATS[m].n;
      v3.push([cl(b[0]*k2), cl(b[1]*k2), cl(b[2]*k2)]);
    }
    MC[m] = v3;
  }

  var nMain = 0, nEmis = 0;
  for(z = 0; z < NZ; z++) for(y = 0; y < NY; y++) for(x = 0; x < NX; x++){
    m = vox[(z*NY+y)*NX+x];
    if(!m) continue;
    for(f = 0; f < 6; f++){
      nb = occ(x+FN[f][0], y+FN[f][1], z+FN[f][2]);
      if(nb) continue;
      if(m === EMIS) nEmis++; else nMain++;

  }

    if(!m || !MC[m]) continue;

    var em = (m === EMIS);

      var nx = FN[f][0], ny = FN[f][1], nz = FN[f][2];
      if(occ(x+nx, y+ny, z+nz)) continue;

      var ao = 0, ax = x+nx, ay = y+ny, az = z+nz;
      if(f < 2){
        if(occ(ax+1,ay,az)) ao++; if(occ(ax-1,ay,az)) ao++;
        if(occ(ax,ay+1,az)) ao++; if(occ(ax,ay-1,az)) ao++;
      } else if(f < 4){
        if(occ(ax,ay+1,az)) ao++; if(occ(ax,ay-1,az)) ao++;
        if(occ(ax,ay,az+1)) ao++; if(occ(ax,ay,az-1)) ao++;
      } else {
        if(occ(ax+1,ay,az)) ao++; if(occ(ax-1,ay,az)) ao++;
        if(occ(ax,ay,az+1)) ao++; if(occ(ax,ay,az-1)) ao++;
      }

      var aoB = AOK3[ao];
      /* 只有受光面需要投影测试；dMul=0 表示"在阴影中"，由 uShK 决定压暗程度 */
      var dirLit = (f === 0 || f === 4 || f === 3);
      var dMul = dirLit ? (shadowed(x,y,z) ? 0 : aoB) : 0;
      var q = FV[f], base, fb, ub;
      if(em){ fb = fE; ub = uE; base = oE; oE += 6*VB; } else { fb = fM; ub = uM; base = oM; oM += 6*VB; }

      for(i = 0; i < 6; i++){
        var c = q[order[i]], off = base + i*VB;

        ub[off+12] = col[0]; ub[off+13] = col[1]; ub[off+14] = col[2]; ub[off+15] = dMul;

        ub[off+18] = Math.round((nz+1)*127.5); ub[off+19] = aoB;
      }
    }
  }
  function upload(buf, n){
    if(!n) return null;
    var b = GL.createBuffer();
    GL.bindBuffer(GL.ARRAY_BUFFER, b);
    GL.bufferData(GL.ARRAY_BUFFER, buf, GL.STATIC_DRAW);
    return { buf:b, n:n*6 };
  }
  meshMain = upload(bufM, nMain);
  meshEmis = upload(bufE, nEmis);
  meshCPU = keepCPU ? { main:bufM, emis:bufE, nMain:nMain, nEmis:nEmis, stride:VB } : null;

               bytes:(nMain+nEmis)*6*VB };
}

    arr.f[k+1] = p[1] + arr.ry*hw*sx + uy*hh*sy;
    arr.f[k+2] = p[2] + uz*hh*sy;
    arr.f[k+3] = sx;
    arr.f[k+4] = shape ? (0.5 - sy*0.5) : sy;      /* 光柱：顶端为 0（最亮） */

  if(stuck || bodyFreeAt(nx, ny, P.z)){ P.x = nx; P.y = ny; return; }
  /* ② 否则尝试上台阶：抬到能容身且有支撑的最低整数高度（不超过 STEP）
        —— 关键：碰撞（bodyFreeAt）与台阶（floorAround）必须分开判断，
        否则身体只是"擦到"一堆高瓦砾就会被整体挡死。 */
  var top = P.z + STEP;
  for(var fz = Math.ceil(P.z + 0.001); fz <= top + 0.001; fz++){
    if(!bodyFreeAt(nx, ny, fz)) continue;
    if(floorAround(nx, ny, fz + 0.05) !== fz) continue;      /* 需要正好踩在实体上 */
    P.x = nx; P.y = ny; P.z = fz; P.vz = 0; P.onGround = true;
    return;
  }
  /* ③ 挡住 */
}
/* ── 2D 覆盖层：暗角 / 准星 / 抬头信息 ── */
function drawOverlay(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if(vig) ctx.drawImage(vig, 0, 0, VW, VH);
  if(CAM.mode === 2){
    ctx.strokeStyle = 'rgba(226,240,214,0.55)'; ctx.lineWidth = 1;
    var cx = VW/2, cy = VH/2;
    ctx.beginPath();
    ctx.moveTo(cx-7, cy); ctx.lineTo(cx-2, cy); ctx.moveTo(cx+2, cy); ctx.lineTo(cx+7, cy);
    ctx.moveTo(cx, cy-7); ctx.lineTo(cx, cy-2); ctx.moveTo(cx, cy+2); ctx.lineTo(cx, cy+7);
    ctx.stroke();
  }
}
function hud(){
  if(!elHud) return;
  if(CAM.mode !== 2){ elHud.style.display = 'none'; return; }
  elHud.style.display = 'block';
  elHud.innerHTML = '坐标 <b>' + P.x.toFixed(1) + ', ' + P.y.toFixed(1) + '</b> · 高度 <b>' + P.z.toFixed(1) +
    '</b> · 朝向 <b>' + (((-P.yaw*180/Math.PI + 450) % 360) | 0) + '°</b>' +
    (P.fly ? ' · <b>飞行</b>' : (P.onGround ? '' : ' · 下落')) +
    '<br><span>WASD 走 · 空格跳 · Shift 疾走 · G 飞行 · 鼠标看 · Esc 退出锁定</span>';
}
/* ── 2D 回退路径（无 WebGL 时） ── */
function fit2D(){
  if(!stat) return;
  var cw = stat.maxPX - stat.minPX, ch = stat.maxPY - stat.minPY;
  cam.z = Math.max(0.12, Math.min(3, Math.min(VW*0.9/cw, VH*0.84/ch)));
  cam.x = (stat.minPX + stat.maxPX)/2; cam.y = (stat.minPY + stat.maxPY)/2;
}
function draw2D(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if(sky) ctx.drawImage(sky, 0, 0, sky.width, sky.height, 0, 0, VW, VH);
  if(SP.skyfx){ ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(SP.skyfx, 0, 0, VW, VH); ctx.globalCompositeOperation = 'source-over'; }
  if(stat){
    ctx.setTransform(DPR*cam.z, 0, 0, DPR*cam.z, DPR*(VW/2 - cam.x*cam.z), DPR*(VH/2 - cam.y*cam.z));
    var sx = projX(NX/2, NY/2), sy = projY(NX/2, NY/2, 0) + S*3;
    ga(0.4);
    ctx.drawImage(SP.shad, sx - (NX+NY)*S*0.44, sy - (NX+NY)*S*0.21, (NX+NY)*S*0.88, (NX+NY)*S*0.42);
    ctx.globalAlpha = 1;
    ctx.drawImage(stat.bmp, 0, 0, stat.bmp.width, stat.bmp.height, -stat.ox, -stat.oy, stat.w, stat.h);
    if(fxOn) drawFX();
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(vig){ ctx.globalAlpha = 1; ctx.drawImage(vig, 0, 0, VW, VH); }
}
function frame(t){
  if(!lastT) lastT = t;
  var dt = (t - lastT)/1000;
  if(!(dt > 0)) dt = 0; else if(dt > 0.05) dt = 0.05;
  lastT = t; tsec += dt;
  if(fxOn) updateFX(dt);
  if(GL){
    if(CAM.mode === 2) walk(dt);
    if(meshMain) drawGL();
    drawOverlay();
    hud();
  } else draw2D(dt);
  requestAnimationFrame(frame);
}
function meta(){
  var extra = GL
    ? ('三角面 <b>' + (meshInfo.faces/1000).toFixed(1) + 'k</b> · 建网格 <b>' + meshInfo.ms +
       'ms</b> · <b>' + MODES[CAM.mode] + '</b>')
    : ('可见体素 <b>' + (stat ? (stat.count/1000).toFixed(1) : 0) + 'k</b> · 烘焙 <b>' + (stat ? stat.ms : 0) +
       'ms</b> · 视角 <b>' + (rot+1) + '/4</b>（无 WebGL，2D 回退）');
  elMeta.innerHTML = '手工地图 <b>' + NX + '×' + NY + '×' + NZ + '</b> · 装配 <b>' + buildMs + 'ms</b> · ' +
    extra + ' · ' + grade().name;
}
function refresh(fit){
  if(GL){ if(fit) fitAll(); }
  else { stat = renderStatic(rotVox(vox, rot), grade()); if(fit) fit2D(); }
  meta();
}
function boot(){
  elBoot.classList.remove('off');
  setTimeout(function(){
    buildMs = buildWorld();
    initFX();
    if(GL) buildMesh();
    refresh(true);
    elBoot.classList.add('off');
  }, 30);
}
/* ══════════ 10. 交互 ══════════ */
function setMode(m){
  var was = CAM.mode;
  CAM.mode = m;
  if(m === 2){
    if(was !== 2){
      var tx = Math.max(2, Math.min(NX-3, CAM.tgt[0])), ty = Math.max(2, Math.min(NY-3, CAM.tgt[1]));
      if(!P.spawned){ tx = 96.5; ty = 64.5; P.yaw = -2.18; P.spawned = true; }   /* 体育场荒草球场，正对倒塌灯塔 */
      else { P.yaw = CAM.yaw + Math.PI; }
      P.x = tx; P.y = ty;
      P.z = standZ(tx, ty);
      P.pitch = -0.08; P.vz = 0;
    }
  } else if(was === 2){
    CAM.tgt = [P.x, P.y, P.z + 2];
    CAM.yaw = P.yaw + Math.PI; CAM.pitch = -0.55;
    if(m === 1) CAM.dist = 46;
    exitLock();
  }
  if(m === 0) fitAll();
  syncDock(); meta();
}
function exitLock(){ if(locked && document.exitPointerLock) try{ document.exitPointerLock(); }catch(e){} }
function focusOn(gx, gy, k){
  if(CAM.mode === 2){
    P.x = gx + 0.5; P.y = gy + 0.5;
    P.z = standZ(P.x, P.y); P.vz = 0;
    return;
  }
  CAM.tgt = [gx, gy, GT + 5];
  if(CAM.mode === 0) CAM.ortho = Math.max(14, 62/(k || 1.6));
  else CAM.dist = Math.max(18, 90/(k || 1.6));
  if(!GL){ var rc = rotC(gx, gy, rot); cam.x = projX(rc[0], rc[1]); cam.y = projY(rc[0], rc[1], GT+4); cam.z = k || 1.6; }
}
var drag = null, pts = {}, pinch = null;
cvs.addEventListener('pointerdown', function(ev){
  if(CAM.mode === 2 && GL){
    if(cvs.requestPointerLock) try{ cvs.requestPointerLock(); }catch(e){}
    drag = { x:ev.clientX, y:ev.clientY, look:true };
    return;
  }
  drag = { x:ev.clientX, y:ev.clientY, pan:ev.shiftKey || ev.button === 2 || ev.button === 1 };
  pts[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
  cvs.classList.add('drag');
  if(cvs.setPointerCapture) try{ cvs.setPointerCapture(ev.pointerId); }catch(e){}
});
cvs.addEventListener('pointermove', function(ev){
  if(CAM.mode === 2 && GL){
    if(locked){ look(ev.movementX || 0, ev.movementY || 0); }
    else if(drag){ look((ev.clientX - drag.x)*1.4, (ev.clientY - drag.y)*1.4); drag.x = ev.clientX; drag.y = ev.clientY; }
    return;
  }
  if(pts[ev.pointerId]){ pts[ev.pointerId].x = ev.clientX; pts[ev.pointerId].y = ev.clientY; }
  var ks = Object.keys(pts);
  if(ks.length === 2){
    drag = null;
    var a = pts[ks[0]], b = pts[ks[1]], dd = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinch) zoom(dd/pinch);
    pinch = dd; return;
  }
  pinch = null;
  if(!drag) return;
  var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  drag.x = ev.clientX; drag.y = ev.clientY;
  if(!GL){ cam.x -= dx/cam.z; cam.y -= dy/cam.z; return; }
  if(drag.pan){
    var d = camDir(CAM.yaw, CAM.pitch), sc = (CAM.mode === 0 ? CAM.ortho : CAM.dist)/Math.max(200, VH) * 2.2;
    var rx = d[1], ry = -d[0], rl = Math.hypot(rx, ry) || 1;
    CAM.tgt[0] -= (rx/rl*dx + d[0]*-dy*0.9)*sc;
    CAM.tgt[1] -= (ry/rl*dx + d[1]*-dy*0.9)*sc;
  } else {
    CAM.yaw -= dx*0.0062;                          /* 自由旋转（与第一人称同向：拖拽跟手） */
    CAM.pitch -= dy*0.0055;
    CAM.pitch = Math.max(-1.52, Math.min(1.35, CAM.pitch));
  }
});
function look(dx, dy){
  /* 屏幕右方向 = cross(forward, up) = (f.y, -f.x)，而 d/dyaw·f = -该向量，
     所以"向右看"必须让 yaw 减小（此前写成 += 导致左右相反）。 */
  P.yaw -= dx*0.0026; P.pitch -= dy*0.0024;
  P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch));
}
function zoom(f){
  if(!GL){ cam.z = Math.max(0.12, Math.min(6, cam.z*f)); return; }
  if(CAM.mode === 0) CAM.ortho = Math.max(6, Math.min(200, CAM.ortho/f));
  else if(CAM.mode === 1) CAM.dist = Math.max(6, Math.min(420, CAM.dist/f));
  else CAM.fov = Math.max(0.5, Math.min(1.5, CAM.fov/f));
}
function endDrag(ev){ drag = null; if(ev && ev.pointerId !== undefined) delete pts[ev.pointerId]; cvs.classList.remove('drag'); }
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);
cvs.addEventListener('pointerleave', function(ev){ if(CAM.mode !== 2) endDrag(ev); });
cvs.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
cvs.addEventListener('wheel', function(ev){
  ev.preventDefault();
  zoom(Math.pow(1.0018, -ev.deltaY));
}, { passive:false });
cvs.addEventListener('dblclick', function(){ if(CAM.mode !== 2) zoom(1.8); });
document.addEventListener('pointerlockchange', function(){
  locked = (document.pointerLockElement === cvs);
});
function rotate(d){
  if(GL){ CAM.yaw -= d*Math.PI/12; return; }        /* 每次 15°，与拖拽同向 */
  rot = (rot + d + 4) % 4; refresh(false);
}
function cycleTod(){
  gi = (gi + 1) % GRADES.length;
  buildSky();
  if(!GL) refresh(false); else meta();               /* WebGL 下切时段只改 uniform，无需重建 */
  syncDock();
}
function toggleFx(){ fxOn = !fxOn; syncDock(); }
function syncDock(){
  var b = elDock.querySelector('[data-act=tod]');
  if(b) b.innerHTML = '时段：' + grade().name + '<kbd>T</kbd>';
  b = elDock.querySelector('[data-act=fx]');
  if(b) b.innerHTML = '特效：' + (fxOn ? '开' : '关') + '<kbd>F</kbd>';
  var all = elDock.querySelectorAll('[data-mode]');
  for(var i = 0; i < all.length; i++)
    all[i].className = (parseInt(all[i].getAttribute('data-mode'), 10) === CAM.mode) ? 'on' : '';
}
function shot(){
  try{
    var a = document.createElement('a');
    a.download = 'overgrown-' + MODES[CAM.mode] + '.png';
    if(GL){
      var tmp = document.createElement('canvas');
      tmp.width = glc.width; tmp.height = glc.height;
      var tc = tmp.getContext('2d');
      tc.drawImage(glc, 0, 0); tc.drawImage(cvs, 0, 0);
      a.href = tmp.toDataURL('image/png');
    } else a.href = cvs.toDataURL('image/png');
    a.click();
  }catch(e){}
}
elDock.addEventListener('click', function(ev){
  var t = ev.target;
  while(t && t !== elDock && !t.getAttribute('data-act') && !t.getAttribute('data-mode')) t = t.parentNode;
  if(!t || t === elDock) return;
  var md = t.getAttribute('data-mode');
  if(md !== null && md !== undefined){ setMode(parseInt(md, 10)); return; }
  var a = t.getAttribute('data-act');
  if(a === 'rl') rotate(-1);
  else if(a === 'rr') rotate(1);
  else if(a === 'tod') cycleTod();
  else if(a === 'fx') toggleFx();
  else if(a === 'fit'){ if(GL){ CAM.mode = CAM.mode === 2 ? 1 : CAM.mode; fitAll(); syncDock(); } else fit2D(); }
  else if(a === 'zin') zoom(1.35);
  else if(a === 'zout') zoom(1/1.35);
  else if(a === 'shot') shot();
});
(function(){
  var html = '';
  for(var i = 0; i < MARKS.length; i++)
    html += '<button data-mk="' + i + '"><i>' + (i+1) + '</i>' + MARKS[i][0] + '</button>';
  elMarks.innerHTML = html;
  elMarks.addEventListener('click', function(ev){
    var t = ev.target;
    while(t && t !== elMarks && !t.getAttribute('data-mk')) t = t.parentNode;
    if(!t || t === elMarks) return;
    var m = MARKS[parseInt(t.getAttribute('data-mk'), 10)];
    focusOn(m[1], m[2], m[3]);
  });
})();
var KMAP = { w:'w', a:'a', s:'s', d:'d', arrowup:'w', arrowleft:'a', arrowdown:'s', arrowright:'d' };
window.addEventListener('keydown', function(ev){
  var k = ev.key.toLowerCase();
  if(CAM.mode === 2 && KMAP[k]){ keys[KMAP[k]] = 1; ev.preventDefault(); return; }
  if(k === ' '){ keys.space = 1; if(CAM.mode === 2) ev.preventDefault(); return; }
  if(k === 'shift'){ keys.shift = 1; return; }
  if(k === 'control'){ keys.ctrl = 1; return; }
  if(k === 'q') rotate(-1);
  else if(k === 'e') rotate(1);
  else if(k === 't') cycleTod();
  else if(k === 'f') toggleFx();
  else if(k === 'm') setMode((CAM.mode + 1) % 3);
  else if(k === 'g' && CAM.mode === 2) P.fly = !P.fly;
  else if(k === 'r'){ CAM.yaw = Math.PI*1.25; CAM.pitch = -0.6155; if(GL && CAM.mode === 0) fitAll(); }
  else if(k === 'p') shot();
  else if(k === '0'){ if(GL){ if(CAM.mode === 2) setMode(0); fitAll(); } else fit2D(); }
  else if(k === '+' || k === '=') zoom(1.3);
  else if(k === '-') zoom(1/1.3);
  else if(k >= '1' && k <= '9'){ var m = MARKS[parseInt(k,10)-1]; if(m) focusOn(m[1], m[2], m[3]); }
  else if(k === 'escape') exitLock();
});
window.addEventListener('keyup', function(ev){
  var k = ev.key.toLowerCase();
  if(KMAP[k]) keys[KMAP[k]] = 0;
  else if(k === ' ') keys.space = 0;
  else if(k === 'shift') keys.shift = 0;
  else if(k === 'control') keys.ctrl = 0;
});
window.addEventListener('blur', function(){ keys = {}; });
window.addEventListener('resize', function(){ resize(); if(GL){ if(CAM.mode === 0) fitAll(); } else fit2D(); });

var hasGL = initGL();
resize();
buildSprites2();
if(!hasGL){
  var w = document.getElementById('nogl');
  if(w) w.style.display = 'block';
}
syncDock();
boot();
requestAnimationFrame(frame);

if(typeof window !== 'undefined') window.__vox = {
  buildWorld: buildWorld, renderStatic: renderStatic, rotVox: rotVox, GRADES: GRADES, M: M, MATS: MATS,
  buildMesh: buildMesh, meshInfo: function(){ return meshInfo; }, hasGL: function(){ return !!GL; },
  meshCPU: function(){ return meshCPU; },
  dims: function(){ return { NX:NX, NY:NY, NZ:NZ, GT:GT, S:S }; },
  data: function(){ return { vox: vox, mats: mats, hoff: hoff, land: landM, emit: emit, marks: MARKS }; },
  cam: function(){ return { CAM:CAM, P:P, VP:VPM, VM:VM, PM:PM, eye:eyePos(), mode:CAM.mode }; },
  setMode: function(m){ setMode(m); }, setYawPitch: function(y,p){ CAM.yaw = y; CAM.pitch = p; },
  buildVP: function(){ return buildVP(); }, fitAll: fitAll, focusOn: focusOn,
  walk: function(dt){ walk(dt); }, look: function(dx,dy){ look(dx,dy); }, keys: keys, LDIR: LDIR,
  floorUnder: floorUnder, bodyFree: bodyFree, blocked: blocked, standZ: standZ,
  bodyFreeAt: bodyFreeAt, floorAround: floorAround, PR: PR, camDir: camDir,
  grade: function(){ return grade(); }, setGrade: function(i){ gi = i % GRADES.length; buildSky(); }
};
})();
</script>
<noscript><p style="padding:24px;color:#a8c49a">需要启用 JavaScript 才能渲染这张手工体素地图。</p></noscript>
