[package]
name = "ice_cave_rt"
version = "1.0.0"
edition = "2021"
description = "Polar ice cave path tracer: participating media, subsurface scattering, multi-layer refraction (Vulkan compute via ash + naga)"
license = "MIT"

[dependencies]
# Thin, unsafe, complete Vulkan bindings (loaded at runtime through libloading).
ash = "0.38"
# Pure-Rust WGSL front end + SPIR-V back end: no glslc / shaderc / cmake needed.
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
panic = "unwind"
