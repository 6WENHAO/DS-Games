<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   AQUA LUMEN — Frutiger Aero 光之水客厅
   单文件 WebGL Demo / 防池核（Anti-Poolcore）美学约束：
   高调明亮 · 暖白+天青+薄荷+浅金 · 通透玻璃 · 清澈见底的水 · 鲜活绿植
   ===================================================================== */

/* ------------------------- 0. 全局配置与调色板 ------------------------- */
const PAL = {
  porcelain : 0xf2fbff,  // 高光泽白瓷砖
  porcelain2: 0xe2f4fb,
  mintTile  : 0xc9f0e4,  // 池壁薄荷瓷砖
  mintTile2 : 0xa9e6d6,
  poolFloor : 0xdff8f2,
  grout     : 0xcfe8f2,
  marble    : 0xfbfeff,
  wood      : 0xf0dcc0,
  wall      : 0xf7fdff,
  glassTint : 0xd9f6ff,
  metal     : 0xeaf6fb,
  gold      : 0xffd9a2,
  mint      : 0x8fe6cd,
  aqua      : 0x86dcf4,
  sky       : 0x9fe0ff,
  leafA     : 0x8ade72,  // 鲜活明亮的叶片绿（高调、有光泽，绝非哑光死绿）
  leafB     : 0x62cf92,
  leafC     : 0xbaee78,
  waterA    : 0xbdf3ef,  // 浅水（薄荷）
  waterB    : 0x37bcd8,  // 深水（天青）
  fog       : 0xe6f7ff,  // 暖白偏浅蓝薄雾
  fogUnder  : 0x9fe8f0,  // 水下亮青雾
  emiWhite  : 0xfffaf0,
};

const WATER_Y = -0.06;          // 全场统一水面高度（一次反射通道服务所有水池）
const EYE     = 1.66;           // 眼高
const SPAWN   = new THREE.Vector3(0, 0, 52.5);

/* 6 个水体（矩形足迹 + 池底高度）：用于焦散遮罩、水下判定、地面高度 */
const POOLS = [
  { name:'中庭主水池',  x0:-14,  z0: -6,   x1: 14,   z1: 18,   by:-1.90 },
  { name:'水乐园大池',  x0:-16,  z0:-40,   x1:  6,   z1:-20,   by:-1.70 },
  { name:'水乐园小池',  x0:  9,  z0:-37,   x1: 18,   z1:-24,   by:-0.95 },
  { name:'连通浅水道',  x0:  6,  z0:-37,   x1:  9,   z1:-24,   by:-0.95 },
  { name:'球体厅浅水',  x0: 23.2,z0:-42.8, x1: 48.8, z1:-17.2, by:-0.50, circle:{cx:36,cz:-30,r:13.0} },
  { name:'迎宾镜面池',  x0: -6,  z0: 40,   x1:  6,   z1: 48,   by:-0.36 },
];

/* 确定性随机（保证每次生成同一张地图） */
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const RND = mulberry32(20051129);
const rr  = (a,b)=>a+(b-a)*RND();
const ri  = (a,b)=>Math.floor(rr(a,b+1));
const pick= (arr)=>arr[Math.floor(RND()*arr.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp =(a,b,t)=>a+(b-a)*t;

/* 共享 uniform（所有注入式材质与自定义着色器共用同一时间源）
   fogCol / fogDens 保存的是“当前生效值”，水上/水下之间平滑过渡 */
const AIR_FOG = new THREE.Color(PAL.fog), UND_FOG = new THREE.Color(PAL.fogUnder);
const AIR_DENS = 0.0095, UND_DENS = 0.060;
const U = {
  time    : { value: 0 },
  under   : { value: 0 },                              // 0=水上 1=水下
  fogCol  : { value: AIR_FOG.clone() },
  fogDens : { value: AIR_DENS },
  causCol : { value: new THREE.Color(0xd9fff4) },
  poolRect: { value: POOLS.map(p=>new THREE.Vector4(p.x0,p.z0,p.x1,p.z1)) },
  poolBot : { value: POOLS.map(p=>p.by) },
  waterY  : { value: WATER_Y },
  sunDir  : { value: new THREE.Vector3(0.42, 0.78, 0.46).normalize() },
};
const TIMED = [];   // 需要每帧推进 uTime 的自定义材质

/* ------------------------- 1. 程序化贴图工厂 ------------------------- */
/* 全部用 Canvas 现场绘制：无外部资源依赖，双击即可运行 */
function cvs(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h||w; return c; }
function hex(n){ return '#'+n.toString(16).padStart(6,'0'); }
function mix(c1,c2,t){
  const r=Math.round(lerp((c1>>16)&255,(c2>>16)&255,t)),
        g=Math.round(lerp((c1>>8)&255,(c2>>8)&255,t)),
        b=Math.round(lerp(c1&255,c2&255,t));
  return 'rgb('+r+','+g+','+b+')';
}
function roundRect(x,px,py,w,h,r){
  x.beginPath();
  x.moveTo(px+r,py); x.lineTo(px+w-r,py); x.quadraticCurveTo(px+w,py,px+w,py+r);
  x.lineTo(px+w,py+h-r); x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);
  x.lineTo(px+r,py+h); x.quadraticCurveTo(px,py+h,px,py+h-r);
  x.lineTo(px,py+r); x.quadraticCurveTo(px,py,px+r,py); x.closePath();
}
function toTex(canvas,{srgb=false,rep=1,repY=null}={}){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8;
  t.repeat.set(rep, repY==null?rep:repY);
  t.needsUpdate = true;
  return t;
}
/* 高度图 → 法线图（Sobel），用于瓷砖分缝倒角与水面波纹 */
function heightToNormal(hc, strength){
  const s = hc.width, src = hc.getContext('2d').getImageData(0,0,s,s).data;
  const out = cvs(s,s), ox = out.getContext('2d'), img = ox.createImageData(s,s);
  const at=(i,j)=>src[((((j%s)+s)%s)*s + (((i%s)+s)%s))*4]/255;
  for(let j=0;j<s;j++) for(let i=0;i<s;i++){
    const dx=(at(i+1,j)-at(i-1,j))*strength, dy=(at(i,j+1)-at(i,j-1))*strength;
    let nx=-dx, ny=-dy, nz=1; const l=Math.hypot(nx,ny,nz);
    const k=(j*s+i)*4;
    img.data[k  ]=(nx/l*.5+.5)*255;
    img.data[k+1]=(ny/l*.5+.5)*255;
    img.data[k+2]=(nz/l*.5+.5)*255;
    img.data[k+3]=255;
  }
  ox.putImageData(img,0,0); return out;
}

/* 瓷砖：干净锐利的规律分缝 + 每片轻微色差 + 斜向高光条 */
function tileSet(n, cA, cB, groutCol, glossiness){
  const S=512, g=Math.max(2, S/n*0.052), s=S/n;
  const alb=cvs(S), a=alb.getContext('2d');
  const hgt=cvs(S), h=hgt.getContext('2d');
  const rgh=cvs(S), q=rgh.getContext('2d');
  a.fillStyle=hex(groutCol); a.fillRect(0,0,S,S);
  h.fillStyle='#000';        h.fillRect(0,0,S,S);
  q.fillStyle='#c8c8c8';     q.fillRect(0,0,S,S);           // 分缝更粗糙
  const rd = mulberry32(n*7717+3);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    const t = rd()*0.85, px=i*s+g/2, py=j*s+g/2, w=s-g, rad=s*0.055;
    a.fillStyle = mix(cA,cB,t*0.75); roundRect(a,px,py,w,w,rad); a.fill();
    const grd=a.createLinearGradient(px,py,px+w,py+w);
    grd.addColorStop(0,'rgba(255,255,255,'+(0.20*glossiness)+')');
    grd.addColorStop(.42,'rgba(255,255,255,0.02)');
    grd.addColorStop(.68,'rgba(255,255,255,'+(0.13*glossiness)+')');
    grd.addColorStop(1,'rgba(255,255,255,0.01)');
    a.fillStyle=grd; roundRect(a,px,py,w,w,rad); a.fill();
    h.fillStyle='#fff'; roundRect(h,px,py,w,w,rad); h.fill();
    const rv = Math.round(28 + rd()*10);
    q.fillStyle='rgb('+rv+','+rv+','+rv+')'; roundRect(q,px,py,w,w,rad); q.fill();
  }
  return { map:alb, normal:heightToNormal(hgt, 2.6), rough:rgh };
}

/* 抛光大理石：柔和白底 + 淡青/浅金纹脉 */
function marbleTex(){
  const S=512, c=cvs(S), x=c.getContext('2d');
  x.fillStyle=hex(PAL.marble); x.fillRect(0,0,S,S);
  const rd=mulberry32(99);
  for(let k=0;k<46;k++){
    x.beginPath();
    let px=rd()*S, py=rd()*S;
    x.moveTo(px,py);
    for(let s=0;s<5;s++){ px+=(rd()-.5)*260; py+=(rd()-.5)*260; x.quadraticCurveTo(px+(rd()-.5)*90,py+(rd()-.5)*90,px,py); }
    x.lineWidth=rd()*2.4+0.4;
    x.strokeStyle = rd()<0.72 ? 'rgba(150,205,225,'+(0.05+rd()*0.13)+')' : 'rgba(240,205,150,'+(0.05+rd()*0.11)+')';
    x.stroke();
  }
  /* 干净的大格分缝 */
  x.strokeStyle='rgba(196,226,238,.85)'; x.lineWidth=2.5;
  for(let i=1;i<4;i++){ x.beginPath(); x.moveTo(i*S/4,0); x.lineTo(i*S/4,S); x.moveTo(0,i*S/4); x.lineTo(S,i*S/4); x.stroke(); }
  return c;
}

/* 浅色木纹砖（植物穹顶地面） */
function woodTex(){
  const S=512, c=cvs(S), x=c.getContext('2d');
  const rd=mulberry32(451), rows=6, hh=S/rows;
  for(let r=0;r<rows;r++){
    const base = mix(PAL.wood, 0xfff4e2, rd()*0.9);
    x.fillStyle=base; x.fillRect(0,r*hh,S,hh-2);
    for(let k=0;k<70;k++){
      x.strokeStyle='rgba(190,150,110,'+(0.03+rd()*0.09)+')'; x.lineWidth=rd()*1.6+.3;
      const y=r*hh+rd()*hh; x.beginPath(); x.moveTo(0,y);
      for(let sx=0;sx<S;sx+=48) x.quadraticCurveTo(sx+24,y+(rd()-.5)*5,sx+48,y+(rd()-.5)*3);
      x.stroke();
    }
    x.fillStyle='rgba(255,255,255,.20)'; x.fillRect(0,r*hh,S,3);
    x.fillStyle='rgba(205,175,140,.35)'; x.fillRect(0,r*hh+hh-2,S,2);
  }
  return c;
}

/* 叶片：饱满绿色 + 中脉 + 光泽高光，alpha 通道给出叶形轮廓 */
function leafTex(){
  const W=192,H=256, c=cvs(W,H), x=c.getContext('2d');
  x.clearRect(0,0,W,H);
  const grd=x.createLinearGradient(0,H,W*0.2,0);
  grd.addColorStop(0,  hex(PAL.leafB));
  grd.addColorStop(.45,hex(PAL.leafA));
  grd.addColorStop(1,  hex(PAL.leafC));
  x.fillStyle=grd;
  x.beginPath();
  x.moveTo(W*.5,H*.99);
  x.bezierCurveTo(W*.02,H*.72, W*.06,H*.16, W*.5,H*.01);
  x.bezierCurveTo(W*.94,H*.16, W*.98,H*.72, W*.5,H*.99);
  x.closePath(); x.fill();
  x.save(); x.clip();
  x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=4;
  x.beginPath(); x.moveTo(W*.5,H*.97); x.lineTo(W*.5,H*.05); x.stroke();
  x.lineWidth=2; x.strokeStyle='rgba(255,255,255,.32)';
  for(let i=1;i<11;i++){
    const y=H*(0.08+i*0.082);
    x.beginPath(); x.moveTo(W*.5,y); x.quadraticCurveTo(W*.78,y-16,W*.9,y-34); x.stroke();
    x.beginPath(); x.moveTo(W*.5,y); x.quadraticCurveTo(W*.22,y-16,W*.1,y-34); x.stroke();
  }
  const gl=x.createLinearGradient(W*.15,H*.1,W*.62,H*.6);
  gl.addColorStop(0,'rgba(255,255,255,.46)'); gl.addColorStop(.55,'rgba(255,255,255,.06)');
  gl.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gl; x.fillRect(0,0,W,H);
  x.restore();
  return c;
}

/* 水面法线：多层可平铺正弦丘 → 法线（波光粼粼的来源） */
function waterNormalTex(seed){
  const S=256, c=cvs(S), x=c.getContext('2d'), img=x.createImageData(S,S);
  const rd=mulberry32(seed), waves=[];
  for(let k=0;k<14;k++) waves.push([ri(1,4), ri(1,4), rd()*Math.PI*2, 1/(1+k*0.55)]);
  for(let j=0;j<S;j++) for(let i=0;i<S;i++){
    let v=0, n=0;
    for(const w of waves){ v += Math.sin((i/S*w[0]+j/S*w[1])*Math.PI*2 + w[2])*w[3]; n+=w[3]; }
    const g=Math.round((v/n*0.5+0.5)*255), k=(j*S+i)*4;
    img.data[k]=img.data[k+1]=img.data[k+2]=g; img.data[k+3]=255;
  }
  x.putImageData(img,0,0);
  return heightToNormal(c, 1.55);
}

/* 圆形柔和光晕（灯盘落地光斑 / 气泡高光 / 洒水雾） */
function radialTex(inner,outer,pow){
  const S=128,c=cvs(S),x=c.getContext('2d');
  const g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  for(let i=0;i<=10;i++){
    const t=i/10, a=Math.pow(1-t,pow);
    g.addColorStop(t,'rgba('+inner+','+(a*outer).toFixed(3)+')');
  }
  x.fillStyle=g; x.fillRect(0,0,S,S);
  return c;
}
/* 接触阴影贴图（乘算混合专用：整幅不透明，仅中心略暗，边缘纯白 → 绝不产生黑斑） */
function radialShadeTex(){
  const S=128,c=cvs(S),x=c.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,S,S);
  const g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0.0,'rgba(212,227,236,1)');
  g.addColorStop(0.45,'rgba(233,242,247,1)');
  g.addColorStop(0.8,'rgba(250,252,254,1)');
  g.addColorStop(1.0,'rgba(255,255,255,1)');
  x.fillStyle=g; x.fillRect(0,0,S,S);
  return c;
}

/* 出口指示牌（青绿发光） */
function exitSignTex(){
  const W=256,H=96,c=cvs(W,H),x=c.getContext('2d');
  x.fillStyle='#0e4f52'; roundRect(x,0,0,W,H,22); x.fill();
  x.fillStyle='#2ff0c0'; roundRect(x,5,5,W-10,H-10,18); x.fill();
  x.fillStyle='#e9fffb'; x.font='700 52px "Segoe UI",sans-serif'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('EXIT', W*0.62, H*0.52);
  x.beginPath(); x.moveTo(46,H*.5-22); x.lineTo(46,H*.5+22); x.lineTo(84,H*.5); x.closePath(); x.fill();
  return c;
}

const TEX = {};
function buildTextures(){

/* ------------------------- 3. 天空穹顶（明亮高调） ------------------------- */
const SKY_GLSL = /* glsl */`
  uniform vec3 uZenith, uHorizon, uSun; uniform float uTime;
  varying vec3 vDir;
  void main(){
    vec3 d = normalize(vDir);
    float up = max(d.y, 0.0);
    vec3 c = mix(uHorizon, uZenith, pow(up, 0.62));
    c = mix(c, vec3(1.02,1.0,0.98), pow(1.0 - clamp(abs(d.y),0.0,1.0), 7.0) * 0.62);
    float n = sin(d.x*6.0 + uTime*0.021) * sin(d.z*5.2 - uTime*0.017) * sin(d.y*8.0 + 1.3)
            + 0.55*sin(d.x*13.0 - uTime*0.03) * sin(d.z*11.0 + uTime*0.024);
    float cloud = smoothstep(0.18, 0.86, n*0.5+0.5) * smoothstep(0.015, 0.30, d.y);
    c = mix(c, vec3(1.10,1.09,1.06), cloud*0.60);
    float sd = max(dot(d, normalize(uSun)), 0.0);
    c += vec3(1.0,0.95,0.86) * pow(sd, 18.0) * 0.55;
    c += vec3(1.0,0.97,0.92) * pow(sd, 1200.0) * 9.0;
    gl_FragColor = vec4(c, 1.0);
  }`;
function skyMaterial(){
  const m = new THREE.ShaderMaterial({
    uniforms:{
      uZenith :{ value:new THREE.Color(0x63c2f0) },
      uHorizon:{ value:new THREE.Color(0xe4f8ff) },
      uSun    :{ value:U.sunDir.value.clone() },
      uTime   :U.time,
    },
    vertexShader:`varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:SKY_GLSL,
    side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false,
  });
  return m;
}
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 40, 24), skyMaterial());

/* 反射内容 = 明亮天光 + 白色顶棚 + 薄荷/天青灯带 + 绿植色带，绝不给出黑洞反射 */
function buildEnvironment(){
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const es = new THREE.Scene();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(60, 24, 16), skyMaterial());
  es.add(dome);
  const em = (c,i)=> new THREE.MeshBasicMaterial({ color:new THREE.Color(c).multiplyScalar(i) });
  const box = (w,h,d,x,y,z,mat)=>{ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); b.position.set(x,y,z); es.add(b); };
  box(60,1,60,  0, 16,  0, em(0xffffff, 1.00));       // 顶棚整体亮
  box(58,1,58,  0,-10,  0, em(PAL.porcelain, 0.50));  // 地面浅色反弹
  box(1,16,44, -26, 5,  0, em(PAL.mint, 0.70));       // 薄荷灯墙
  box(1,16,44,  26, 5,  0, em(PAL.aqua, 0.70));       // 天青灯墙
  box(44,10,1,  0,  3,-26, em(PAL.gold, 0.60));       // 浅金
  box(44, 8,1,  0, -3, 26, em(PAL.leafA, 0.50));      // 绿植色带
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    box(6,0.6,6, Math.cos(a)*17, 13.5, Math.sin(a)*17, em(PAL.emiWhite, 2.2)); // 灯盘阵列
  }
  const rt = pmrem.fromScene(es, 0.035, 0.1, 120);
  scene.environment = rt.texture;
  es.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  pmrem.dispose();
}

/* ------------------------- 6. 材质体系 ------------------------- */
/* 6.1 三平面世界坐标瓷砖材质：全场分缝尺寸绝对统一、网格严格对齐
       同时注入水下焦散（欢快舞动的光斑）与水线以上的水面反光带         */
const CAUSTIC_GLSL = /* glsl */`
  #define NPOOL 6
  uniform float uTime;
  uniform float uTS;
  uniform vec4  uPoolRect[NPOOL];
  uniform float uPoolBot[NPOOL];
  uniform float uWaterY;
  uniform vec3  uCausCol;
  varying vec3  vWPosX;
  varying vec3  vNWX;
  float poolMask(vec2 p, float f){
    float m = 0.0;
    for(int i=0;i<NPOOL;i++){
      vec4 r = uPoolRect[i];
      vec2 a = smoothstep(vec2(r.x-f, r.y-f), vec2(r.x+f, r.y+f), p);
      vec2 b = 1.0 - smoothstep(vec2(r.z-f, r.w-f), vec2(r.z+f, r.w+f), p);
      m = max(m, a.x*a.y*b.x*b.y);
    }
    return m;
  }
  float caustic(vec2 p, float t){
    vec2 q = p * 0.44;
    float v = 0.0, amp = 1.0, tot = 0.0;
    for(int i=0;i<3;i++){
      float fi = float(i);
      float a = sin(q.x*1.90 + t*0.62 + fi*1.7) + sin(q.y*2.30 - t*0.51 + fi*2.3);
      float b = sin((q.x+q.y)*1.55 - t*0.44 + fi) + sin((q.x-q.y)*2.05 + t*0.39 - fi);
      v   += pow(max(1.0 - abs(a*b)*0.34, 0.0), 4.0) * amp;
      tot += amp; amp *= 0.55; q *= 1.85;
    }
    return v / tot;
  }`;

function tileMaterial(o){
  const m = new THREE.MeshStandardMaterial({
    color      : o.color ?? 0xffffff,
    map        : o.map,
    normalMap  : o.normal || null,
    roughnessMap:o.rough  || null,
    roughness  : o.roughness ?? 0.30,
    metalness  : o.metalness ?? 0.02,
    envMapIntensity: o.env ?? 1.2,
  });
  if(o.normal) m.normalScale.set(o.nscale ?? 0.6, o.nscale ?? 0.6);
  const uTS = { value: 1/(o.tile || 2.6) };
  m.userData.uTS = uTS;
  m.customProgramCacheKey = ()=> 'aeroTile';
  m.onBeforeCompile = (sh)=>{
    sh.uniforms.uTime = U.time;
    sh.uniforms.uTS = uTS;
    sh.uniforms.uPoolRect = U.poolRect;
    sh.uniforms.uPoolBot  = U.poolBot;
    sh.uniforms.uWaterY   = U.waterY;
    sh.uniforms.uCausCol  = U.causCol;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPosX; varying vec3 vNWX;`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        #ifdef USE_INSTANCING
          vWPosX = (modelMatrix * instanceMatrix * vec4(transformed,1.0)).xyz;
          vNWX   = normalize(mat3(modelMatrix) * (mat3(instanceMatrix) * objectNormal));
        #else
          vWPosX = (modelMatrix * vec4(transformed,1.0)).xyz;
          vNWX   = normalize(mat3(modelMatrix) * objectNormal);
        #endif`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + CAUSTIC_GLSL)
      /* 三平面：轴对齐几何体上直接取世界坐标做 UV —— 分缝永不拉伸 */
      .replace('#include <map_fragment>', `
        vec3 nAbsX = abs(vNWX);
        float axisX; vec2 tuv;
        if(nAbsX.y >= nAbsX.x && nAbsX.y >= nAbsX.z){ tuv = vWPosX.xz; axisX = 1.0; }
        else if(nAbsX.x >= nAbsX.z){ tuv = vWPosX.zy; axisX = 0.0; }
        else { tuv = vWPosX.xy; axisX = 2.0; }
        tuv *= uTS;
        #ifdef USE_MAP
          diffuseColor *= texture2D(map, tuv);
        #endif`)
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = roughness;
        #ifdef USE_ROUGHNESSMAP
          roughnessFactor *= texture2D(roughnessMap, tuv).g;
        #endif`)
      .replace('#include <normal_fragment_maps>', `
        #ifdef USE_NORMALMAP
          vec3 mapNX = texture2D(normalMap, tuv).xyz * 2.0 - 1.0;
          mapNX.xy *= normalScale;
          vec3 tX, bX;
          if(axisX == 1.0){ tX = vec3(1.0,0.0,0.0); bX = vec3(0.0,0.0,1.0); }
          else if(axisX == 0.0){ tX = vec3(0.0,0.0,1.0); bX = vec3(0.0,1.0,0.0); }
          else { tX = vec3(1.0,0.0,0.0); bX = vec3(0.0,1.0,0.0); }
          vec3 pnX = normalize(vNWX + (tX*mapNX.x + bX*mapNX.y));
          normal = normalize((viewMatrix * vec4(pnX, 0.0)).xyz);
        #endif`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          float m = poolMask(vWPosX.xz, 0.30);
          if(m > 0.002){
            if(vWPosX.y < uWaterY + 0.03){
              float c  = caustic(vWPosX.xz, uTime);
              float up = clamp(vNWX.y*0.5 + 0.5, 0.0, 1.0);
              float dp = clamp((uWaterY - vWPosX.y)*0.45, 0.0, 1.0);
              totalEmissiveRadiance += uCausCol * c * (0.26 + 0.52*up) * m * (0.62 + 0.38*(1.0-dp));
              diffuseColor.rgb *= mix(vec3(1.0), vec3(0.90,1.03,1.04), 0.35);
            } else {
              float h = clamp(1.0 - (vWPosX.y - uWaterY)/3.0, 0.0, 1.0);
              float c = caustic(vWPosX.xz*0.75 + vec2(uTime*0.05, 0.0), uTime*0.85);
              totalEmissiveRadiance += uCausCol * c * m * h * h * 0.20;
            }
          }
        }`);
  };
  return m;
}

/* 6.2 自发光灯盘：逐实例色调 + 呼吸式明暗（顶点属性 aPhase/aTint 驱动） */
function pulseMaterial(intensity){
  const m = new THREE.MeshStandardMaterial({
    color:0xffffff, emissive:new THREE.Color(PAL.emiWhite), emissiveIntensity:intensity,
    roughness:0.34, metalness:0.0, envMapIntensity:0.7,
  });
  m.customProgramCacheKey = ()=> 'aeroPulse';
  m.onBeforeCompile = (sh)=>{
    sh.uniforms.uTime = U.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aPhase; attribute vec3 aTint;
        varying float vPh; varying vec3 vTint;`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        vPh = aPhase; vTint = aTint;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; varying float vPh; varying vec3 vTint;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float pulseX = 0.84 + 0.16*sin(uTime*0.85 + vPh*6.2831) + 0.045*sin(uTime*2.35 + vPh*11.7);
        totalEmissiveRadiance *= vTint * pulseX;
        diffuseColor.rgb *= mix(vec3(1.0), vTint, 0.45);`);
  };
  return m;
}

  fabric    : new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.72, metalness:0.0, envMapIntensity:0.18 }),
  glass     : new THREE.MeshPhysicalMaterial({
                color:PAL.glassTint, transparent:true, opacity:0.17, roughness:0.03, metalness:0.0,
                ior:1.46, envMapIntensity:1.70, clearcoat:1.0, clearcoatRoughness:0.02,

  glassMint : new THREE.MeshPhysicalMaterial({

  leaf      : new THREE.MeshStandardMaterial({

  softAO    : new THREE.MeshBasicMaterial({ map:TEX.shade, transparent:true, blending:THREE.MultiplyBlending,

/* ------------------------- 7. 体积光 / 屏幕装饰用自定义着色器 ------------------------- */
/* 7.1 柔和体积光束（God Rays）：空心圆锥壳 + 弦长解析式，明亮通透不脏 */
const shaftMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:U.time, uFogC:U.fogCol, uFogD:U.fogDens },
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  side:THREE.DoubleSide, fog:false,
  vertexShader:/* glsl */`
    attribute float aPhase; attribute vec3 aTint;
    varying vec3 vN; varying vec3 vW; varying vec2 vUvS; varying float vPh; varying vec3 vT;
    void main(){
      vUvS = uv; vPh = aPhase; vT = aTint;
      vec4 wp = vec4(position, 1.0);
      mat3 nm = mat3(1.0);
      #ifdef USE_INSTANCING
        wp = instanceMatrix * wp;
        nm = mat3(instanceMatrix);
      #endif
      wp = modelMatrix * wp;
      vW = wp.xyz;
      vN = normalize(mat3(modelMatrix) * (nm * normal));
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader:/* glsl */`
    uniform float uTime; uniform vec3 uFogC; uniform float uFogD;
    varying vec3 vN; varying vec3 vW; varying vec2 vUvS; varying float vPh; varying vec3 vT;
    void main(){
      vec3 vd = normalize(cameraPosition - vW);
      float chord = abs(dot(normalize(vN), vd));       // 圆柱壳弦长 ≈ |N·V|
      float body  = pow(chord, 1.35);
      float top   = smoothstep(0.0, 0.42, vUvS.y);      // 顶部（灯口）更亮
      float bot   = smoothstep(0.0, 0.30, 1.0 - vUvS.y) * 0.55 + 0.45;
      float flick = 0.86 + 0.14 * sin(uTime*0.55 + vPh*6.283) + 0.06*sin(uTime*1.7 + vUvS.y*4.0);
      float d     = length(cameraPosition - vW);
      float near  = smoothstep(0.0, 3.2, d);            // 贴脸时淡出，避免硬面片
      float far   = exp(-uFogD * d * 0.85);
      float a = body * top * bot * flick * near * far * 0.30;
      gl_FragColor = vec4(vT * a, a);
    }`,
});
TIMED.push(shaftMat);

/* 7.2 数字水族箱（动态鱼群影像）：全程序化，科技与自然融合的点缀 */
const aquariumMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:U.time },
  side:THREE.FrontSide, fog:false, toneMapped:true,
  vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:/* glsl */`
    uniform float uTime; varying vec2 vU;
    float fish(vec2 p, vec2 c, float s, float dir){
      vec2 q = (p - c) / s;
      q.x *= dir;
      float tail = sin(q.x*7.0 - uTime*7.0) * 0.16 * clamp(-q.x,0.0,1.0);
      q.y -= tail;
      float body = 1.0 - smoothstep(0.28, 0.62, length(q*vec2(0.55,1.55)));
      float fin  = 1.0 - smoothstep(0.10, 0.42, length((q - vec2(-0.62,0.0))*vec2(1.6,0.85)));
      return clamp(body + fin*0.75, 0.0, 1.0);
    }
    void main(){
      vec3 col = mix(vec3(0.42,0.86,0.96), vec3(0.80,0.98,1.0), pow(vU.y,1.4));
      col += vec3(0.10,0.16,0.10) * (0.5 + 0.5*sin(vU.x*24.0 + uTime*0.6)) * (1.0-vU.y) * 0.35;
      for(int i=0;i<7;i++){
        float fi = float(i);
        float dir = mod(fi, 2.0) < 0.5 ? 1.0 : -1.0;
        float sp  = 0.055 + 0.03*fract(fi*0.37);
        float x   = fract(fi*0.271 + uTime*sp*dir*0.6);
        float y   = 0.18 + 0.66*fract(fi*0.613) + 0.045*sin(uTime*0.9 + fi*2.1);
        float m   = fish(vU, vec2(x,y), 0.052 + 0.02*fract(fi*0.71), dir);
        vec3 fc   = mix(vec3(1.0,0.78,0.34), vec3(0.55,1.0,0.86), fract(fi*0.43));
        col = mix(col, fc*1.35, m*0.92);
      }
      /* 水草 + 气泡柱 */
      float weed = smoothstep(0.02, 0.0, abs(fract(vU.x*7.0)-0.5)*0.34 - vU.y*0.22 + 0.02);
      col = mix(col, vec3(0.30,0.88,0.52), weed*0.55);
      float bub = 0.0;
      for(int i=0;i<4;i++){
        float fi=float(i);
        vec2 bp = vec2(0.14 + 0.24*fi + 0.02*sin(uTime + fi), fract(uTime*0.16 + fi*0.31));
        bub += 1.0 - smoothstep(0.006, 0.016, length((vU-bp)*vec2(1.0,0.7)));
      }
      col += bub*0.55;
      col *= 1.0 + 0.10*sin(vU.y*260.0);   // 极轻微扫描线（数字感）
      gl_FragColor = vec4(col*1.25, 1.0);
    }`,
});
TIMED.push(aquariumMat);

/* 7.3 瀑布水幕 / 气泡墙（uSpeed 取负即为上升气泡） */
function fallMaterial(speed, tint, scale){
  const m = new THREE.ShaderMaterial({
    uniforms:{ uTime:U.time, uSpeed:{value:speed}, uTint:{value:new THREE.Color(tint)}, uSc:{value:scale||1} },
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
    side:THREE.DoubleSide, fog:false,
    vertexShader:`varying vec2 vU; varying vec3 vW;
      void main(){ vU=uv; vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:/* glsl */`
      uniform float uTime, uSpeed, uSc; uniform vec3 uTint; varying vec2 vU; varying vec3 vW;
      float h(vec2 p){ return fract(sin(dot(p, vec2(41.7, 78.3)))*43758.5453); }
      float streak(vec2 uv, float sc, float sp){
        float col = floor(uv.x*sc);
        float o = h(vec2(col, 3.0));
        float y = fract(uv.y + uTime*sp*(0.6 + o*0.8) + o);
        float w = smoothstep(0.0, 0.42, y) * smoothstep(1.0, 0.55, y);
        float lat = smoothstep(0.5, 0.16, abs(fract(uv.x*sc)-0.5));
        return w * lat;
      }
      void main(){
        float s = streak(vU, 26.0*uSc, uSpeed) * 0.65 + streak(vU*vec2(1.7,1.0), 47.0*uSc, uSpeed*1.35) * 0.45;
        float fade = smoothstep(0.0, 0.14, vU.y) * smoothstep(1.0, 0.72, vU.y) * 1.15;
        float a = clamp(s*fade, 0.0, 1.0) * 0.72;
        gl_FragColor = vec4(uTint * (a*1.5 + 0.12*fade), a);
      }`,
  });
  TIMED.push(m);
  return m;
}
const fallMat   = fallMaterial( 0.85, 0xdcfcff, 1.0);   // 下落水幕

/* ------------------------- 8. 几何体库（全部共享，供实例化使用） ------------------------- */
function archPath(hw, sh){
  const p = new THREE.Path();
  p.moveTo(-hw,0); p.lineTo(-hw,sh); p.absarc(0,sh,hw,Math.PI,0,true); p.lineTo(hw,0); p.lineTo(-hw,0);
  return p;
}
function archShapeS(hw, sh){
  const s = new THREE.Shape();
  s.moveTo(-hw,0); s.lineTo(-hw,sh); s.absarc(0,sh,hw,Math.PI,0,true); s.lineTo(hw,0); s.lineTo(-hw,0);
  return s;
}
const GEO = {};
(function buildGeo(){
  GEO.box    = new THREE.BoxGeometry(1,1,1);
  GEO.cyl    = new THREE.CylinderGeometry(0.5,0.5,1,18,1);

  GEO.sph    = new THREE.SphereGeometry(0.5,18,12);
  GEO.sphLow = new THREE.SphereGeometry(0.5,10,7);
  GEO.hemi   = new THREE.SphereGeometry(1,34,18,0,Math.PI*2,0,Math.PI*0.5);
  GEO.ring   = new THREE.TorusGeometry(1,0.055,6,26);
  GEO.plane  = new THREE.PlaneGeometry(1,1);
  GEO.tube   = new THREE.CylinderGeometry(0.5,0.5,1,18,1,true);
  /* 体积光壳：下方更宽的空心圆锥，UV.y 0→1 自下而上 */
  GEO.shaft  = new THREE.CylinderGeometry(0.55,1.0,1,24,1,true);
  /* 叶片：带弯曲与折角，基部在 y=0（便于绕基部旋转） */
  const lg = new THREE.PlaneGeometry(0.82,1.28,2,4), lp = lg.attributes.position;
  for(let i=0;i<lp.count;i++){
    const x=lp.getX(i), y=lp.getY(i);
    lp.setZ(i, -0.20*(x*x*5.5) + 0.09*Math.sin((y+0.64)*2.1));

  const ws = new THREE.Shape();

  ws.holes.push(archPath(1.6,1.7));
  GEO.archWall = new THREE.ExtrudeGeometry(ws,{depth:0.4,bevelEnabled:false,curveSegments:26});

  /* 门框比墙体更厚，两侧各凸出 8cm → 形成环绕门洞的柔和发光边 */
  GEO.archFrame = new THREE.ExtrudeGeometry(fs,{depth:0.56,bevelEnabled:false,curveSegments:30});
  GEO.archFrame.translate(0,0,-0.28);

/* ------------------------- 9. 实例化注册表 ------------------------- */
/* 所有重复元素（瓷砖板、栏杆、灯盘、门洞、管道、盆栽、叶片、卵石…）
   按 “几何体 | 材质 | 区域” 归并为一个 InstancedMesh：
   既只有极少的 draw call，又按区域分块保留视锥剔除收益。                */
const REG = new Map();
const PULSE_SET = new Set(['lamp','lampStrip','pebble','shaftM']);
const PULSE_DEF = { lamp:0xfff8ec, lampStrip:0xdcfff4, pebble:0xd6fff0, shaftM:0xfff3dd };
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
function TRS(px,py,pz, rx,ry,rz, sx,sy,sz){
  _e.set(rx||0, ry||0, rz||0, 'YXZ'); _q.setFromEuler(_e);
  _v.set(px,py,pz); _s.set(sx, sy==null?sx:sy, sz==null?(sy==null?sx:sy):sz);
  return new THREE.Matrix4().compose(_v,_q,_s);
}
function put(g, m, region, mat4, extra){
  /* 呼吸型自发光材质必须带逐实例属性，这里统一兜底，避免属性缺失 */
  if(!extra && PULSE_SET.has(m)) extra = { phase:RND(), tint:new THREE.Color(PULSE_DEF[m]) };
  const key = g+'|'+m+'|'+region;
  let e = REG.get(key);
  if(!e){ e = { g, m, region, list:[], extra:[] }; REG.set(key, e); }
  e.list.push(mat4);
  if(extra) e.extra.push(extra);
  return e;
}
/* 便捷包装 */
const R = {
  box (reg,mat,cx,cy,cz,w,h,d,ry){ put('box',mat,reg,TRS(cx,cy,cz,0,ry||0,0,w,h,d)); },
  cyl (reg,mat,cx,cy,cz,r,h,ry,rx){ put('cyl',mat,reg,TRS(cx,cy,cz,rx||0,ry||0,0,r*2,h,r*2)); },
  cylL(reg,mat,cx,cy,cz,r,h,rx,rz){ put('cylLow',mat,reg,TRS(cx,cy,cz,rx||0,0,rz||0,r*2,h,r*2)); },
  sph (reg,mat,cx,cy,cz,r,sy){ put('sph',mat,reg,TRS(cx,cy,cz,0,0,0,r*2,(sy||r)*2,r*2)); },
  sphL(reg,mat,cx,cy,cz,r,sy){ put('sphLow',mat,reg,TRS(cx,cy,cz,0,0,0,r*2,(sy||r)*2,r*2)); },
  cone(reg,mat,cx,cy,cz,r,h){ put('cone',mat,reg,TRS(cx,cy,cz,0,0,0,r*2,h,r*2)); },
  ring(reg,mat,cx,cy,cz,r,rx,ry){ put('ring',mat,reg,TRS(cx,cy,cz,rx||0,ry||0,0,r,r,r)); },
  quadY(reg,mat,cx,cy,cz,w,d,rot){ put('plane',mat,reg,TRS(cx,cy,cz,-Math.PI/2,rot||0,0,w,d,1)); },
  quadV(reg,mat,cx,cy,cz,w,h,ry){ put('plane',mat,reg,TRS(cx,cy,cz,0,ry||0,0,w,h,1)); },
  lamp(reg,cx,cy,cz,r,tint,phase,mat){
    put('disc', mat||'lamp', reg, TRS(cx,cy,cz,0,0,0,r*2,0.14,r*2), { phase, tint:new THREE.Color(tint) });
  },
  strip(reg,cx,cy,cz,w,h,d,tint,phase,ry){
    put('box','lampStrip',reg,TRS(cx,cy,cz,0,ry||0,0,w,h,d), { phase, tint:new THREE.Color(tint) });
  },
  shaft(reg,cx,cy,cz,rTop,len,tint,phase){
    put('shaft','shaftM',reg,TRS(cx,cy-len/2,cz,0,0,0,rTop*2,len,rTop*2), { phase, tint:new THREE.Color(tint) });
  },
  glowDecal(reg,cx,cy,cz,r){ put('plane','glow',reg,TRS(cx,cy,cz,-Math.PI/2,RND()*3.14,0,r*2,r*2,1)); },
  aoDecal(reg,cx,cz,r){ put('plane','softAO',reg,TRS(cx,0.012,cz,-Math.PI/2,0,0,r*2,r*2,1)); },
};
MAT.shaftM = shaftMat;

const INSTANCED = [];
function realize(){
  const NOSHADOW = new Set(['glow','softAO','glass','glassMint','lamp','lampStrip','pebble','exitSign','shaftM']);
  for(const e of REG.values()){
    let geo = GEO[e.g]; const mat = MAT[e.m]; const n = e.list.length;
    if(!geo || !mat || n===0) continue;
    const hasAttr = e.extra.length === n;
    if(hasAttr) geo = geo.clone();     // 逐实例属性需要独立几何体
    const mesh = new THREE.InstancedMesh(geo, mat, n);
    for(let i=0;i<n;i++) mesh.setMatrixAt(i, e.list[i]);
    mesh.instanceMatrix.needsUpdate = true;
    if(hasAttr){
      const ph = new Float32Array(n), ti = new Float32Array(n*3);
      for(let i=0;i<n;i++){
        ph[i] = e.extra[i].phase || 0;
        const c = e.extra[i].tint || new THREE.Color(0xffffff);
        ti[i*3]=c.r; ti[i*3+1]=c.g; ti[i*3+2]=c.b;
      }
      geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph,1));
      geo.setAttribute('aTint',  new THREE.InstancedBufferAttribute(ti,3));
    }
    const noSh = NOSHADOW.has(e.m);
    mesh.castShadow = !noSh; mesh.receiveShadow = !noSh;
    if(e.m==='glow'||e.m==='shaftM') mesh.renderOrder = 6;
    if(e.m==='softAO') mesh.renderOrder = 2;
    if(e.region.endsWith(':uw')) mesh.layers.enable(LAYER_UNDER);
    try { mesh.computeBoundingSphere(); } catch(err){}
    mesh.name = e.g+'/'+e.m+'/'+e.region;
    scene.add(mesh); INSTANCED.push(mesh);
  }
}

/* ------------------------- 10. 碰撞 / 地面高度 ------------------------- */
const COLL = [];       // 实心体（XZ 推出）
const WALKS = [];      // 可行走台面（台阶 / 平台 / 汀步）
function solid(x0,z0,x1,z1,y0,y1){
  COLL.push({ x0:Math.min(x0,x1), x1:Math.max(x0,x1), z0:Math.min(z0,z1), z1:Math.max(z0,z1),
              y0:y0==null?-3:y0, y1:y1==null?14:y1 });
}
function walkTop(x0,z0,x1,z1,y){
  WALKS.push({ x0:Math.min(x0,x1), x1:Math.max(x0,x1), z0:Math.min(z0,z1), z1:Math.max(z0,z1), y });
}
function insideRect(r,x,z){ return x>r.x0 && x<r.x1 && z>r.z0 && z<r.z1; }
function groundAt(x,z){
  let g = null;
  for(const p of POOLS) if(x>p.x0&&x<p.x1&&z>p.z0&&z<p.z1){ g = g==null ? p.by : Math.max(g,p.by); }
  if(g==null) g = 0;
  for(const w of WALKS) if(insideRect(w,x,z) && w.y>g) g = w.y;
  return g;
}
function waterDepthAt(x,z){
  for(const p of POOLS) if(x>p.x0&&x<p.x1&&z>p.z0&&z<p.z1) return WATER_Y - groundAt(x,z);
  return -1;
}

/* ------------------------- 11. 建造工具（模块化拼装） ------------------------- */
function floorSlab(reg, mat, x0,z0,x1,z1, y){
  const w=x1-x0, d=z1-z0;
  R.box(reg, mat, (x0+x1)/2, (y||0)-0.25, (z0+z1)/2, w, 0.5, d);
}
function ceilSlab(reg, mat, x0,z0,x1,z1, y){
  const w=x1-x0, d=z1-z0;
  R.box(reg, mat, (x0+x1)/2, y+0.25, (z0+z1)/2, w, 0.5, d);
}
/* 直墙 + 圆拱门洞（doors:[{at}]，at 为沿墙轴的世界坐标） */
function wall(reg, ax,az,bx,bz, h, o){
  o = o || {};
  const mat = o.mat || 'tileWhite', t = o.t ?? 0.36;
  const alongX = Math.abs(bx-ax) >= Math.abs(bz-az);
  const a0 = alongX ? Math.min(ax,bx) : Math.min(az,bz);
  const a1 = alongX ? Math.max(ax,bx) : Math.max(az,bz);
  const fix = alongX ? az : ax;
  const doors = (o.doors||[]).slice().sort((p,q)=>p.at-q.at);
  const cuts = doors.map(d=>[d.at-2.6, d.at+2.6, d]);
  const segs = []; let cur = a0;
  for(const c of cuts){ if(c[0]>cur) segs.push([cur,c[0]]); cur = Math.max(cur,c[1]); }
  if(cur < a1) segs.push([cur,a1]);
  for(const s of segs){
    const L = s[1]-s[0], c = (s[0]+s[1])/2;
    if(L<=0.001) continue;
    if(alongX){ R.box(reg,mat,c,h/2,fix,L,h,t); solid(s[0],fix-t/2,s[1],fix+t/2,-2.6,h); }
    else      { R.box(reg,mat,fix,h/2,c,t,h,L); solid(fix-t/2,s[0],fix+t/2,s[1],-2.6,h); }
  }
  for(const c of cuts){
    const at = c[2].at, ry = alongX ? 0 : Math.PI/2;
    const px = alongX ? at : fix, pz = alongX ? fix : at;
    put('archWall', mat, reg, TRS(px,0,pz, 0,ry,0, 1,1,1));
    put('archFrame','lampStrip', reg, TRS(px,0,pz, 0,ry,0, 1.0,1.0,1.0),
        { phase:RND(), tint:new THREE.Color(c[2].tint||PAL.mint) });
    if(h>4.4){
      if(alongX){ R.box(reg,mat,at,(4.4+h)/2,fix,5.2,h-4.4,t); solid(at-2.6,fix-t/2,at+2.6,fix+t/2,4.4,h); }
      else      { R.box(reg,mat,fix,(4.4+h)/2,at,t,h-4.4,5.2); solid(fix-t/2,at-2.6,fix+t/2,at+2.6,4.4,h); }
    }
    /* 门洞两侧实心部分的碰撞 */
    if(alongX){ solid(at-2.6,fix-t/2,at-1.62,fix+t/2,-2.6,h); solid(at+1.62,fix-t/2,at+2.6,fix+t/2,-2.6,h); }
    else      { solid(fix-t/2,at-2.6,fix+t/2,at-1.62,-2.6,h); solid(fix-t/2,at+1.62,fix+t/2,at+2.6,-2.6,h); }
  }
}
/* 落地玻璃幕墙：竖框 + 上下横梁 + 洁净玻璃（无水渍、无冷凝） */
function glassWall(reg, ax,az,bx,bz, h, o){
  o = o || {};
  const alongX = Math.abs(bx-ax) >= Math.abs(bz-az);
  const a0 = alongX ? Math.min(ax,bx) : Math.min(az,bz);
  const a1 = alongX ? Math.max(ax,bx) : Math.max(az,bz);
  const fix = alongX ? az : ax;
  const L = a1-a0, span = o.span || 3.2, n = Math.max(1, Math.round(L/span)), w = L/n;
  const gm = o.mat || 'glass';
  for(let i=0;i<n;i++){
    const c = a0 + w*(i+0.5);
    const px = alongX ? c : fix, pz = alongX ? fix : c;
    put('plane', gm, reg, TRS(px, h/2, pz, 0, alongX?0:Math.PI/2, 0, w-0.12, h-0.22, 1));
  }
  for(let i=0;i<=n;i++){
    const c = a0 + w*i;
    const px = alongX ? c : fix, pz = alongX ? fix : c;
    R.box(reg,'metal',px,h/2,pz, alongX?0.13:0.16, h, alongX?0.16:0.13);
  }
  const cc = (a0+a1)/2;
  if(alongX){
    R.box(reg,'metal',cc,0.10,fix,L,0.20,0.22); R.box(reg,'metal',cc,h-0.10,fix,L,0.20,0.22);
    if(!o.noCollide) solid(a0,fix-0.14,a1,fix+0.14,-2.6,h);
  } else {

/* 生态绿墙（边界美化：叶片阵列 + 发光格栅，杜绝生硬收边） */
function greenWall(reg, ax,az,bx,bz, h, o){
  o=o||{};
  const alongX = Math.abs(bx-ax) >= Math.abs(bz-az);
  const L = alongX ? Math.abs(bx-ax) : Math.abs(bz-az);
  const a0 = alongX ? Math.min(ax,bx) : Math.min(az,bz);
  const fix = alongX ? az : ax;
  const nx = Math.max(2, Math.round(L/0.78)), ny = Math.max(2, Math.round((h-0.5)/0.62));
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
    const a = a0 + (i+0.5)*L/nx + rr(-0.16,0.16);
    const y = 0.45 + (j+0.5)*(h-0.9)/ny + rr(-0.12,0.12);
    const px = alongX ? a : fix + rr(-0.1,0.1);
    const pz = alongX ? fix + rr(-0.1,0.1) : a;
    const s  = rr(0.62,1.05);
    put('leaf','leaf',reg,TRS(px,y,pz, rr(0.9,2.2), (alongX?0:Math.PI/2)+rr(-0.6,0.6), rr(-0.4,0.4), s,s,s));
  }

function inArc(a,a0,a1){
  const T=(x)=>{ let v=x%(Math.PI*2); if(v<0) v+=Math.PI*2; return v; };
  a=T(a); a0=T(a0); a1=T(a1);
  return a0<=a1 ? (a>=a0&&a<=a1) : (a>=a0||a<=a1);
}
/* 圆形空间（穹顶房）：环形墙 + 半球玻璃穹顶 + 环形灯 */
function rotunda(reg, cx,cz, radius, h, o){
  o=o||{};
  const seg = o.seg || 26, gaps = o.gaps || [];
  for(let i=0;i<seg;i++){
    const a0 = i/seg*Math.PI*2, a1 = (i+1)/seg*Math.PI*2, am = (a0+a1)/2;
    let open = false;
    for(const g of gaps) if(inArc(am,g.a0,g.a1)) open = true;
    const px = cx + Math.cos(am)*radius, pz = cz + Math.sin(am)*radius;
    const w = radius*Math.PI*2/seg + 0.06;
    put('cyl','metal',reg,TRS(cx+Math.cos(a0)*radius, h/2, cz+Math.sin(a0)*radius, 0,0,0, 0.13,h,0.13));
    if(open) continue;
    put('plane', o.glass||'glass', reg, TRS(px, h*0.5, pz, 0, -am+Math.PI/2, 0, w-0.10, h-0.2, 1));
    solid(px - Math.abs(Math.sin(am))*w/2 - 0.22, pz - Math.abs(Math.cos(am))*w/2 - 0.22,
          px + Math.abs(Math.sin(am))*w/2 + 0.22, pz + Math.abs(Math.cos(am))*w/2 + 0.22, -2.6, h);
  }
  put('hemi', o.dome||'glass', reg, TRS(cx, h-0.05, cz, 0,0,0, radius+0.15, radius*(o.domeH||0.52), radius+0.15));
  /* 穹顶经线肋条：从基座精确指向顶点 */
  const dh = radius*(o.domeH||0.52), rl = Math.hypot(radius, dh), rth = Math.atan2(radius, dh);
  for(let i=0;i<seg;i++){
    const a = i/seg*Math.PI*2;
    const bx = cx+Math.cos(a)*radius, bz = cz+Math.sin(a)*radius;
    put('cyl','metal',reg,TRS((bx+cx)/2, h + dh/2, (bz+cz)/2,
        rth, Math.atan2(-Math.cos(a), -Math.sin(a)), 0, 0.075, rl, 0.075));
  }
  put('ring','gold',reg,TRS(cx,h,cz,Math.PI/2,0,0,radius+0.2,radius+0.2,radius+0.2));
  const nl = o.lamps ?? Math.round(radius*1.4);
  for(let i=0;i<nl;i++){
    const a = i/nl*Math.PI*2;
    R.lamp(reg, cx+Math.cos(a)*radius*0.62, h-0.42, cz+Math.sin(a)*radius*0.62, 0.7, LAMP_TINTS[i%LAMP_TINTS.length], RND());
    put('ring','metal',reg,TRS(cx+Math.cos(a)*radius*0.62,h-0.42,cz+Math.sin(a)*radius*0.62,Math.PI/2,0,0,0.78,0.78,0.78));
  }
  R.shaft(reg, cx, h-0.2, cz, radius*0.5, h-0.4, 0xfff4e0, RND());
  R.glowDecal(reg,cx,0.04,cz,radius*0.9);
}

/* ------------------------- 12. 楼板/顶板的矩形布尔运算 ------------------------- */
function subRects(rects, h){
  const out=[];
  for(const r of rects){
    if(h.x1<=r.x0||h.x0>=r.x1||h.z1<=r.z0||h.z0>=r.z1){ out.push(r); continue; }
    if(h.z0>r.z0) out.push({x0:r.x0,z0:r.z0,x1:r.x1,z1:h.z0});
    if(h.z1<r.z1) out.push({x0:r.x0,z0:h.z1,x1:r.x1,z1:r.z1});
    const a=Math.max(r.z0,h.z0), b=Math.min(r.z1,h.z1);
    if(h.x0>r.x0) out.push({x0:r.x0,z0:a,x1:h.x0,z1:b});
    if(h.x1<r.x1) out.push({x0:h.x1,z0:a,x1:r.x1,z1:b});
  }
  return out;
}
function slabArea(reg,mat,x0,z0,x1,z1,y,holes,thick,up){
  let rects=[{x0,z0,x1,z1}];
  for(const h of holes||[]) rects = subRects(rects,h);
  for(const r of rects){
    const w=r.x1-r.x0, d=r.z1-r.z0;
    if(w<=0.02||d<=0.02) continue;
    R.box(reg,mat,(r.x0+r.x1)/2, up? y+thick/2 : y-thick/2, (r.z0+r.z1)/2, w, thick, d);
  }
}
function stairs(reg,mat,x0,x1,zStart,dir,steps,rise,run,y0){
  y0 = y0||0;
  for(let i=0;i<steps;i++){
    const y  = y0 + rise*(i+1);
    const za = zStart + run*i*(dir<0?-1:1), zb = za + run*(dir<0?-1:1);
    put('box',mat,reg,TRS((x0+x1)/2, y-1.2, (Math.min(za,zb)+Math.max(za,zb))/2, 0,0,0, x1-x0, 2.4, run));
    walkTop(x0,Math.min(za,zb),x1,Math.max(za,zb),y);
  }
}

/* ============================ 14. 水体系统 ============================ */
/* 平面反射（镜像相机）+ 屏幕空间折射（水下专用层）+ 菲涅尔 + 色散 + 吸收 */
const RTOPT = { type:THREE.HalfFloatType, minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
                format:THREE.RGBAFormat, depthBuffer:true, samples:0 };
function rtSize(){ const s = Math.min(1024, Math.max(512, Math.floor(innerWidth*0.5))); return [s, s]; }
let [RTW,RTH] = rtSize();
const reflRT = new THREE.WebGLRenderTarget(RTW, RTH, RTOPT);
const refrRT = new THREE.WebGLRenderTarget(RTW, RTH, RTOPT);
const reflCam = new THREE.PerspectiveCamera(64,1,0.08,620);
const textureMatrix = new THREE.Matrix4();
const clipAbove = new THREE.Plane(new THREE.Vector3(0, 1,0), -WATER_Y + 0.02);
const clipBelow = new THREE.Plane(new THREE.Vector3(0,-1,0),  WATER_Y + 0.05);
const underFog  = new THREE.FogExp2(PAL.fogUnder, 0.055);
const _dir = new THREE.Vector3(), _tgt = new THREE.Vector3(), _upv = new THREE.Vector3();

const WATER_VS = /* glsl */`
  uniform float uTime; uniform mat4 uTexMat;
  varying vec3 vW; varying vec4 vRefl; varying vec4 vClip;
  void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    wp.y += sin(wp.x*0.21 + uTime*0.55)*0.030 + sin(wp.z*0.29 - uTime*0.44)*0.026
          + sin((wp.x+wp.z)*0.55 + uTime*0.9)*0.012;
    vW = wp.xyz;
    vRefl = uTexMat * vec4(wp.xyz, 1.0);
    vClip = projectionMatrix * viewMatrix * wp;
    gl_Position = vClip;
  }`;
const WATER_FS = /* glsl */`
  uniform sampler2D uRefl, uRefr, uNrm1, uNrm2;
  uniform float uTime, uBottomY, uWaterY, uFogD, uUnder;
  uniform vec3 uShallow, uDeep, uFogC, uSun;
  varying vec3 vW; varying vec4 vRefl; varying vec4 vClip;
  void main(){
    vec2 p = vW.xz;
    /* 三层流动法线扰动 → 波光粼粼 */
    vec3 nA = texture2D(uNrm1, p*0.047 + vec2( uTime*0.0115, uTime*0.0082)).xyz*2.0-1.0;
    vec3 nB = texture2D(uNrm2, p*0.019 - vec2( uTime*0.0068, uTime*0.0100)).xyz*2.0-1.0;
    vec3 nC = texture2D(uNrm1, p*0.112 + vec2(-uTime*0.0190, uTime*0.0150)).xyz*2.0-1.0;
    vec2 nn = nA.xy*0.85 + nB.xy*0.75 + nC.xy*0.40;
    vec3 N  = normalize(vec3(nn.x*0.52, 1.0, nn.y*0.52));
    vec3 V  = normalize(cameraPosition - vW);
    float facing = dot(N, V);
    vec3 Nf = facing < 0.0 ? -N : N;
    /* 反射（镜像相机 RT，按法线扰动偏移） */
    vec2 ruv = vRefl.xy / max(vRefl.w, 1e-4) + nn*0.020;
    vec3 refl = texture2D(uRefl, clamp(ruv, 0.002, 0.998)).rgb;
    /* 折射（屏幕空间 + RGB 三通道错位 → 轻微色散） */
    float depth = max(0.06, uWaterY - uBottomY);
    vec2 suv = (vClip.xy / max(vClip.w, 1e-4)) * 0.5 + 0.5;
    vec2 off = nn * (0.026 * clamp(depth, 0.25, 2.2));
    vec3 refr;
    refr.r = texture2D(uRefr, clamp(suv + off*1.10, 0.002, 0.998)).r;
    refr.g = texture2D(uRefr, clamp(suv + off*1.00, 0.002, 0.998)).g;
    refr.b = texture2D(uRefr, clamp(suv + off*0.90, 0.002, 0.998)).b;
    /* 清澈见底：短光程几乎无衰减，长光程渐染天青 */
    float path = depth / max(0.28, abs(V.y));
    float k    = clamp(path/5.2, 0.0, 1.0);
    vec3 tint  = mix(uShallow, uDeep, k);
    vec3 under = mix(refr, tint*1.06, clamp(k*0.72, 0.0, 0.62));
    under += tint * 0.10;
    /* 菲涅尔 */
    float F = 0.022 + 0.978*pow(1.0 - clamp(abs(facing), 0.0, 1.0), 5.0);
    vec3 col = mix(under, refl, clamp(F, 0.02, 0.90));
    /* 阳光镜面高光 + 细密星芒 */
    vec3 H = normalize(normalize(uSun) + V);
    col += vec3(1.0,0.965,0.90) * pow(max(dot(Nf,H),0.0), 380.0) * 4.0;
    col += vec3(0.86,0.98,1.0) * pow(max(dot(Nf, normalize(vec3(0.0,1.0,0.0)+V*0.35)),0.0), 64.0) * 0.22;
    /* 浅水区更亮的柔白边 */
    col += vec3(0.06,0.09,0.09) * (1.0 - smoothstep(0.0, 0.62, depth));
    /* 水下向上看：明亮的全反射水镜 */
    if(facing < 0.0) col = mix(refl, uShallow*1.30, 0.32) + vec3(0.05,0.07,0.07);
    float d = length(cameraPosition - vW);
    float fogF = 1.0 - exp(-uFogD*uFogD*d*d);
    col = mix(col, uFogC, clamp(fogF, 0.0, 1.0));
    gl_FragColor = vec4(col, 1.0);
  }`;
const WATERS = [];
function addWater(pool){
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      uRefl:{value:reflRT.texture}, uRefr:{value:refrRT.texture},
      uNrm1:{value:TEX.wnrm1}, uNrm2:{value:TEX.wnrm2},
      uTexMat:{value:textureMatrix}, uTime:U.time, uUnder:U.under,
      uShallow:{value:new THREE.Color(PAL.waterA)}, uDeep:{value:new THREE.Color(PAL.waterB)},
      uBottomY:{value:pool.by}, uWaterY:U.waterY,
      uFogC:U.fogCol, uFogD:U.fogDens, uSun:U.sunDir,
    },
    vertexShader:WATER_VS, fragmentShader:WATER_FS,
    side:THREE.DoubleSide, transparent:false, fog:false,
  });
  let geo, cx, cz;
  if(pool.circle){
    geo = new THREE.CircleGeometry(pool.circle.r, 64, 0, Math.PI*2);
    cx = pool.circle.cx; cz = pool.circle.cz;
  } else {
    const w = pool.x1-pool.x0, d = pool.z1-pool.z0;
    geo = new THREE.PlaneGeometry(w, d, Math.max(2,Math.round(w/2)), Math.max(2,Math.round(d/2)));
    cx = (pool.x0+pool.x1)/2; cz = (pool.z0+pool.z1)/2;
  }
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2; m.position.set(cx, WATER_Y, cz);
  m.renderOrder = 1; scene.add(m);
  WATERS.push(m);
  return m;
}
POOLS.forEach(addWater);

function renderWaterRT(){
  const cp = camera.position;
  /* --- 镜像相机 --- */
  camera.getWorldDirection(_dir);
  reflCam.position.set(cp.x, 2*WATER_Y - cp.y, cp.z);
  _tgt.set(cp.x + _dir.x, 2*WATER_Y - (cp.y + _dir.y), cp.z + _dir.z);
  _upv.set(0,1,0).applyQuaternion(camera.quaternion);
  reflCam.up.set(_upv.x, -_upv.y, _upv.z);
  reflCam.lookAt(_tgt);
  reflCam.fov = camera.fov; reflCam.aspect = camera.aspect;
  reflCam.near = camera.near; reflCam.far = camera.far;
  reflCam.updateProjectionMatrix(); reflCam.updateMatrixWorld();
  textureMatrix.set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1);
  textureMatrix.multiply(reflCam.projectionMatrix);
  textureMatrix.multiply(reflCam.matrixWorldInverse);
  /* --- 反射通道：只渲染水面以上 --- */
  for(const w of WATERS) w.visible = false;
  sky.position.copy(reflCam.position);
  renderer.clippingPlanes = [clipAbove];
  renderer.setRenderTarget(reflRT);
  renderer.clear();
  renderer.render(scene, reflCam);
  /* --- 折射通道：只渲染水下层，雾切换为明亮青雾 --- */
  const maskSave = camera.layers.mask, fogSave = scene.fog;
  camera.layers.mask = (1 << LAYER_UNDER);
  scene.fog = underFog;
  renderer.clippingPlanes = [clipBelow];
  renderer.setClearColor(0x7fd8dd, 1);
  renderer.setRenderTarget(refrRT);
  renderer.clear();
  renderer.render(scene, camera);
  /* --- 复原 --- */
  renderer.clippingPlanes = [];
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 0);
  camera.layers.mask = maskSave;
  scene.fog = fogSave;
  sky.position.copy(camera.position);
  for(const w of WATERS) w.visible = true;
}

/* ============================ 15. 粒子：气泡 / 空气微光 ============================ */
function instancedParticles(base, count, mat, fill){
  const g = new THREE.InstancedBufferGeometry();
  g.index = base.index;
  g.attributes.position = base.attributes.position;
  g.attributes.normal   = base.attributes.normal;
  g.attributes.uv       = base.attributes.uv;
  const off = new Float32Array(count*3), par = new Float32Array(count*3);
  fill(off, par);
  g.setAttribute('aOff', new THREE.InstancedBufferAttribute(off,3));
  g.setAttribute('aPar', new THREE.InstancedBufferAttribute(par,3));
  g.instanceCount = count;
  const m = new THREE.Mesh(g, mat);
  m.frustumCulled = false;
  scene.add(m);
  return m;
}
const BUBBLE_VS = /* glsl */`
  attribute vec3 aOff; attribute vec3 aPar;
  uniform float uTime, uTop, uBot;
  varying float vF, vK;
  void main(){
    float r = aPar.x, sp = aPar.y, ph = aPar.z;
    float t = uTime*sp + ph*17.0;
    float k = fract(t*0.11);
    vec3 c = aOff;
    c.y = mix(uBot, uTop, k);
    c.x += sin(t*1.25 + ph*6.0)*0.32;
    c.z += cos(t*1.05 + ph*4.4)*0.32;
    float grow = 0.55 + 0.55*k;
    vec4 mv = modelViewMatrix * vec4(position*r*grow + c, 1.0);
    vec3 nrm = normalize(normalMatrix * normal);
    vF = pow(1.0 - max(dot(nrm, normalize(-mv.xyz)), 0.0), 2.1);
    vK = k;
    gl_Position = projectionMatrix * mv;
  }`;
const BUBBLE_FS = /* glsl */`
  uniform vec3 uTint; varying float vF, vK;
  void main(){
    float a = clamp(vF*0.92 + 0.05, 0.0, 1.0) * (1.0 - vK*0.22) * 0.8;
    vec3 c = uTint*(0.55 + vF*1.7) + vec3(1.0,0.98,0.92)*pow(vF, 7.0)*1.4;
    gl_FragColor = vec4(c, a);
  }`;
function addBubbles(pool, count, spread){
  const mat = new THREE.ShaderMaterial({
    uniforms:{ uTime:U.time, uTop:{value:WATER_Y-0.05}, uBot:{value:pool.by+0.1},
               uTint:{value:new THREE.Color(0xd8fbff)} },
    vertexShader:BUBBLE_VS, fragmentShader:BUBBLE_FS,
    transparent:true, depthWrite:false, side:THREE.FrontSide, fog:false,
  });
  const cx=(pool.x0+pool.x1)/2, cz=(pool.z0+pool.z1)/2, sp=spread||0.44;
  const rx=(pool.x1-pool.x0)*sp, rz=(pool.z1-pool.z0)*sp;
  const m = instancedParticles(GEO.sphLow, count, mat, (off,par)=>{
    for(let i=0;i<count;i++){
      off[i*3  ] = cx + rr(-rx,rx);
      off[i*3+1] = 0;
      off[i*3+2] = cz + rr(-rz,rz);
      par[i*3  ] = rr(0.035,0.115);
      par[i*3+1] = rr(0.55,1.5);
      par[i*3+2] = RND();
    }
  });
  m.layers.set(0); m.layers.enable(LAYER_UNDER);   // 折射通道中可见
  m.renderOrder = 2;
  return m;
}
addBubbles(POOLS[0], 220);
addBubbles(POOLS[1], 180);
addBubbles(POOLS[2],  90);

const moteMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:U.time, uMap:{value:TEX.soft} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
  vertexShader:/* glsl */`
    attribute vec3 aOff; attribute vec3 aPar;
    uniform float uTime; varying vec2 vU; varying float vA;
    void main(){
      float sp = aPar.y, ph = aPar.z, sz = aPar.x;
      vec3 c = aOff;
      c.y += mod(uTime*sp*0.35 + ph*40.0, 26.0);
      c.x += sin(uTime*0.22*sp + ph*6.28)*1.6;
      c.z += cos(uTime*0.19*sp + ph*4.71)*1.6;
      vec4 mv = viewMatrix * vec4(c, 1.0);
      mv.xy += position.xy * sz;
      vU = uv; vA = 0.35 + 0.65*abs(sin(uTime*0.7 + ph*9.0));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:/* glsl */`
    uniform sampler2D uMap; varying vec2 vU; varying float vA;
    void main(){
      float a = texture2D(uMap, vU).a * vA * 0.5;
      gl_FragColor = vec4(vec3(1.0,0.99,0.94)*a, a);
    }`,
});

/* ============================ 16. 后处理链 ============================ */
/* 雾（材质内） → SSAO（深度重建，极柔和） → Bloom → ACES/sRGB → 暖调 + 微暗角 */
const SSAO_SHADER = {
  uniforms:{
    tDiffuse:{value:null}, tDepth:{value:null},
    uRes:{value:new THREE.Vector2(1,1)}, uNear:{value:0.1}, uFar:{value:600},
    uProj:{value:new THREE.Vector2(1,1)}, uStrength:{value:0.68}, uRadius:{value:0.60},
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:/* glsl */`
    uniform sampler2D tDiffuse, tDepth;
    uniform vec2 uRes, uProj; uniform float uNear, uFar, uStrength, uRadius;
    varying vec2 vUv;
    float vz(vec2 uv){
      float d = texture2D(tDepth, uv).x;
      if(d >= 0.9999) return -1e6;
      return (uNear*uFar) / ((uFar-uNear)*d - uFar);      // 负值，越远越小
    }
    vec3 vpos(vec2 uv, float z){ return vec3((uv*2.0-1.0)*uProj*(-z), z); }
    void main(){
      vec4 src = texture2D(tDiffuse, vUv);
      float z0 = vz(vUv);
      if(z0 < -1e5){ gl_FragColor = src; return; }
      vec3 p0 = vpos(vUv, z0);
      vec2 px = 1.0/uRes;
      vec3 pX = vpos(vUv+vec2(px.x,0.0), vz(vUv+vec2(px.x,0.0)));
      vec3 pY = vpos(vUv+vec2(0.0,px.y), vz(vUv+vec2(0.0,px.y)));
      vec3 n  = normalize(cross(pX-p0, pY-p0));
      if(n.z < 0.0) n = -n;
      float ang = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453)*6.2831;
      float occ = 0.0;
      const int NS = 12;
      for(int i=0;i<NS;i++){
        float fi = float(i);
        float a  = ang + fi*2.399963;
        float rad = uRadius * (0.25 + 0.75*fi/float(NS));
        vec3 dir = vec3(cos(a), sin(a), 0.0);
        vec3 sp  = p0 + (dir + n*0.55) * rad;
        vec4 cp  = vec4(sp, 1.0);
        vec2 suv = ((cp.xy / uProj) / (-cp.z)) * 0.5 + 0.5;
        float sz = vz(clamp(suv, 0.001, 0.999));
        if(sz < -1e5) continue;
        float dz = sz - sp.z;
        if(dz > 0.022 && dz < 1.6) occ += smoothstep(1.6, 0.10, dz);
      }
      float ao = 1.0 - (occ/float(NS)) * uStrength;
      ao = clamp(ao, 0.50, 1.0);                       // 硬性下限：绝不制造阴森暗角
      gl_FragColor = vec4(src.rgb * ao, src.a);
    }`,
};
const GRADE_SHADER = {
  uniforms:{
    tDiffuse:{value:null}, uTime:U.time, uUnder:U.under,
    uVig:{value:0.16}, uSat:{value:1.14},
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:/* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime, uUnder, uVig, uSat;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      /* 水下：轻微折射晃动（明亮，不阴绿） */
      if(uUnder > 0.001){
        uv += vec2(sin(uv.y*26.0 + uTime*1.6), cos(uv.x*22.0 + uTime*1.35)) * 0.0026 * uUnder;
      }
      vec3 c = texture2D(tDiffuse, uv).rgb;
      c = pow(max(c, 0.0), vec3(0.955));                        // 抬升中间调
      c = mix(c, c*c*(3.0 - 2.0*c), 0.26);                      // 轻微 S 曲线：保住高调又给出层次
      float l = dot(c, vec3(0.2126,0.7152,0.0722));
      c = mix(vec3(l), c, uSat);                                 // 提升饱和度
      c *= vec3(1.020, 1.006, 0.988);                            // 暖白平衡
      c += vec3(0.012, 0.020, 0.026) * (1.0 - l);                // 暗部微微偏天青
      c += vec3(0.020, 0.014, 0.000) * l;                        // 高光偏浅金
      /* 水下滤镜：亮青，保持通透 */
      if(uUnder > 0.001){
        vec3 w = c * vec3(0.72, 1.06, 1.10) + vec3(0.02, 0.10, 0.12);
        c = mix(c, w, uUnder);
      }
      float r = length((uv - 0.5) * vec2(1.06, 1.0)) * 1.414;
      c *= 1.0 - uVig * smoothstep(0.88, 1.16, r);                // 仅最外缘轻微压暗
      gl_FragColor = vec4(c, 1.0);
    }`,
};
let composer, ssaoPass, bloomPass, gradePass, outputPass, renderPass;
function buildComposer(){
  const w = Math.floor(innerWidth * renderer.getPixelRatio());
  const h = Math.floor(innerHeight * renderer.getPixelRatio());
  const dt = new THREE.DepthTexture(w, h);
  /* HDR 帧缓冲：优先 HalfFloat（配合 ACES 保留高光余量），不可用时降级为 8bit */
  const hdrOK = renderer.extensions.has('EXT_color_buffer_float') ||
                renderer.extensions.has('EXT_color_buffer_half_float');
  const rt = new THREE.WebGLRenderTarget(w, h, {
    type: hdrOK ? THREE.HalfFloatType : THREE.UnsignedByteType,
    format:THREE.RGBAFormat,
    minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
    depthBuffer:true, depthTexture:dt, samples:4,
  });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(1);
  /* 两个 ping-pong buffer 必须持有各自独立的深度纹理，避免“采样与写入同一附件”的反馈环 */
  if(composer.renderTarget2.depthTexture === composer.renderTarget1.depthTexture){
    composer.renderTarget2.depthTexture = new THREE.DepthTexture(w, h);
  }
  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  ssaoPass = new ShaderPass(SSAO_SHADER);
  ssaoPass.material.depthTest = false; ssaoPass.material.depthWrite = false;
  composer.addPass(ssaoPass);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(w,h), 0.62, 0.80, 1.05);
  composer.addPass(bloomPass);
  outputPass = new OutputPass();
  composer.addPass(outputPass);
  gradePass = new ShaderPass(GRADE_SHADER);
  /* ShaderPass 会克隆 uniforms —— 重新指回共享对象，时间与水下系数才会真正推进 */
  gradePass.uniforms.uTime  = U.time;
  gradePass.uniforms.uUnder = U.under;
  gradePass.material.uniforms = gradePass.uniforms;
  gradePass.material.depthTest = false; gradePass.material.depthWrite = false;
  gradePass.renderToScreen = true;
  composer.addPass(gradePass);
  syncPassUniforms(w,h);
}
function syncPassUniforms(w,h){
  ssaoPass.uniforms.uRes.value.set(w,h);
  ssaoPass.uniforms.uNear.value = camera.near;
  ssaoPass.uniforms.uFar.value  = camera.far;
  const ty = Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5));
  ssaoPass.uniforms.uProj.value.set(ty*camera.aspect, ty);
}
buildComposer();

/* ============================ 17. 第一人称控制 ============================ */
const player = {
  pos:new THREE.Vector3(SPAWN.x, 0, SPAWN.z),
  vel:new THREE.Vector3(), yaw:0, pitch:-0.05, roll:0,
  fly:false, onGround:true, swim:false, under:false,
  bobT:0, bob:0, sway:0, moveAmt:0,
};
const keys = Object.create(null);
const _eu = new THREE.Euler(0,0,0,'YXZ');
let locked = false;

addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code==='KeyF'){ player.fly = !player.fly; player.vel.set(0,0,0); toast(player.fly?'观赏模式：自由飞行（可穿墙）':'第一人称步行模式'); }
  if(e.code==='KeyM'){ toggleAudio(); }
  if(e.code==='KeyN'){ ssaoPass.enabled = !ssaoPass.enabled; toast('SSAO 环境光遮蔽：'+(ssaoPass.enabled?'开':'关')); }
  if(e.code==='KeyB'){ bloomPass.enabled = !bloomPass.enabled; toast('泛光 Bloom：'+(bloomPass.enabled?'开':'关')); }
  if(e.code==='KeyG'){ toggleShafts(); }
  if(e.code==='KeyH'){ sun.castShadow = !sun.castShadow; toast('日光阴影：'+(sun.castShadow?'开':'关')); }
  if(e.code==='KeyR'){ player.pos.set(SPAWN.x,0,SPAWN.z); player.vel.set(0,0,0); player.yaw=0; player.pitch=-0.05; toast('已回到入口迎宾厅'); }
  if(['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ControlLeft'].includes(e.code)) e.preventDefault();
}, {passive:false});
addEventListener('keyup', e=>{ keys[e.code] = false; });
addEventListener('mousemove', e=>{
  if(!locked) return;
  player.yaw   -= e.movementX * 0.0021;
  player.pitch -= e.movementY * 0.0021;
  player.pitch  = clamp(player.pitch, -1.44, 1.44);
});
document.addEventListener('pointerlockchange', ()=>{
  locked = (document.pointerLockElement === renderer.domElement || document.pointerLockElement === document.body);
  document.getElementById('cross').classList.toggle('on', locked);
});
function lockPointer(){
  try{
    const p = renderer.domElement.requestPointerLock();
    if(p && typeof p.catch === 'function') p.catch(()=>{});
  }catch(e){}
}
renderer.domElement.addEventListener('click', ()=>{ if(!locked) lockPointer(); });

function toggleShafts(){
  let on = true;
  for(const m of INSTANCED) if(m.material === shaftMat){ on = !m.visible; break; }
  for(const m of INSTANCED) if(m.material === shaftMat) m.visible = on;
  toast('体积光束：'+(on?'开':'关'));
}
function insidePool(x,z){
  for(const p of POOLS){
    if(x>p.x0 && x<p.x1 && z>p.z0 && z<p.z1){
      if(p.circle){
        const dx=x-p.circle.cx, dz=z-p.circle.cz;
        if(dx*dx+dz*dz > p.circle.r*p.circle.r) continue;
      }
      return p;
    }
  }
  return null;
}
function collide(){
  const r = 0.38, bot = player.pos.y + 0.16, top = player.pos.y + 1.70;
  for(let pass=0; pass<2; pass++){
    for(const c of COLL){
      if(c.y1 <= bot || c.y0 >= top) continue;
      if(player.pos.x < c.x0-2 || player.pos.x > c.x1+2 || player.pos.z < c.z0-2 || player.pos.z > c.z1+2) continue;
      const nx = clamp(player.pos.x, c.x0, c.x1), nz = clamp(player.pos.z, c.z0, c.z1);
      const dx = player.pos.x - nx, dz = player.pos.z - nz, d2 = dx*dx + dz*dz;
      if(d2 > r*r) continue;
      if(d2 > 1e-7){
        const d = Math.sqrt(d2), push = r - d;
        player.pos.x += dx/d*push; player.pos.z += dz/d*push;
      } else {
        const a=player.pos.x-c.x0, b=c.x1-player.pos.x, e=player.pos.z-c.z0, f=c.z1-player.pos.z;
        const m=Math.min(a,b,e,f);
        if(m===a) player.pos.x = c.x0 - r; else if(m===b) player.pos.x = c.x1 + r;
        else if(m===e) player.pos.z = c.z0 - r; else player.pos.z = c.z1 + r;
      }
    }
  }
}
function updatePlayer(dt){
  const sprint = !!keys['ShiftLeft'] || !!keys['ShiftRight'];
  let ix = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
  let iz = (keys['KeyW']?1:0) - (keys['KeyS']?1:0);
  const len = Math.hypot(ix,iz); if(len>1){ ix/=len; iz/=len; }
  const cy = Math.cos(player.yaw), sy = Math.sin(player.yaw);

  if(player.fly){
    const sp = sprint ? 34 : 15;
    const cp = Math.cos(player.pitch), spp = Math.sin(player.pitch);
    const fx = -sy*cp, fy = spp, fz = -cy*cp;
    player.pos.x += (fx*iz + cy*ix) * sp * dt;
    player.pos.y += (fy*iz) * sp * dt;
    player.pos.z += (fz*iz - sy*ix) * sp * dt;
    if(keys['Space'])       player.pos.y += sp*0.7*dt;
    if(keys['ControlLeft']) player.pos.y -= sp*0.7*dt;
    player.pos.y = clamp(player.pos.y, -2.2, 150);
    player.moveAmt = 0;
  } else {
    const pool = insidePool(player.pos.x, player.pos.z);
    const gY   = groundAt(player.pos.x, player.pos.z);
    const feetUnder = pool && player.pos.y < WATER_Y - 0.02;
    const deep = pool ? (WATER_Y - gY) : 0;
    player.swim = !!(feetUnder && deep > 1.05);
    const base = player.swim ? 2.5 : (sprint ? 6.6 : 3.5);
    const wet  = (feetUnder && !player.swim) ? 0.62 : 1.0;   // 浅水中涉水减速
    const sp   = base * wet;
    const vx = (-sy*iz + cy*ix) * sp, vz = (-cy*iz - sy*ix) * sp;
    player.pos.x += vx*dt; player.pos.z += vz*dt;
    player.moveAmt = Math.hypot(vx,vz)/6.6;
    collide();
    /* 垂直运动 */
    if(player.swim){
      const sub = clamp((WATER_Y - player.pos.y)/1.5, 0, 1);
      player.vel.y += (4.6*sub - 2.2) * dt;                  // 浮力 vs 重力
      if(keys['Space'])       player.vel.y += 7.0*dt;
      if(keys['ControlLeft']) player.vel.y -= 7.0*dt;
      player.vel.y *= Math.pow(0.16, dt);
      player.vel.y = clamp(player.vel.y, -2.6, 2.6);
    } else {
      player.vel.y -= 19.0*dt;
      if(keys['Space'] && player.onGround){ player.vel.y = 5.6; player.onGround = false; }
    }
    player.pos.y += player.vel.y*dt;
    /* 落地 / 上台阶 */
    const g2 = groundAt(player.pos.x, player.pos.z);
    if(player.pos.y <= g2 + 0.001){
      player.pos.y = g2; player.vel.y = 0; player.onGround = true;
    } else if(player.onGround && g2 > player.pos.y && g2 - player.pos.y < 0.46){
      player.pos.y = g2; player.vel.y = 0;
    } else if(player.pos.y > g2 + 0.02){
      player.onGround = false;
    }
    if(player.pos.y < -3.4){ player.pos.set(SPAWN.x,0,SPAWN.z); player.vel.set(0,0,0); }
  }
  /* 呼吸式相机浮动 */
  const targetBob = player.onGround ? player.moveAmt : 0;
  player.bobT += dt * (2.0 + player.moveAmt*11.0);
  const idle = Math.sin(U.time.value*1.05)*0.013 + Math.sin(U.time.value*0.63)*0.008;
  player.bob  = lerp(player.bob, Math.sin(player.bobT)*0.052*targetBob + idle, 1-Math.pow(0.002,dt));
  player.sway = lerp(player.sway, Math.sin(player.bobT*0.5)*0.030*targetBob, 1-Math.pow(0.002,dt));
  player.roll = lerp(player.roll, Math.sin(player.bobT*0.5)*0.0085*targetBob, 1-Math.pow(0.01,dt));
  /* 相机姿态 */
  const eyeY = player.pos.y + EYE + player.bob;
  camera.position.set(player.pos.x + player.sway*Math.cos(player.yaw),
                      eyeY, player.pos.z - player.sway*Math.sin(player.yaw));
  _eu.set(player.pitch, player.yaw, player.roll);
  camera.quaternion.setFromEuler(_eu);
  /* 水下状态：雾色/密度与后处理滤镜平滑过渡（水下依然明亮通透） */
  const camPool = insidePool(camera.position.x, camera.position.z);
  const isUnder = !!camPool && camera.position.y < WATER_Y - 0.035;
  const k = 1-Math.pow(0.0008, dt);
  U.under.value = lerp(U.under.value, isUnder?1:0, k);
  player.under = isUnder;
  U.fogCol.value.lerp(isUnder? UND_FOG : AIR_FOG, k);
  U.fogDens.value = lerp(U.fogDens.value, isUnder? UND_DENS : AIR_DENS, k);
  scene.fog.color.copy(U.fogCol.value);
  scene.fog.density = U.fogDens.value;
  if(AC && master && lp) lp.frequency.setTargetAtTime(isUnder? 620 : 15000, AC.currentTime, 0.22);
}

/* ============================ 18. 程序化环境音（WebAudio） ============================ */
let AC=null, master=null, lp=null, audioOn=true;
let tDrop=0, tBird=0, tBub=0;
function initAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value = 0.0001;
  lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 15000;
  master.connect(lp); lp.connect(AC.destination);
  /* 明亮和声垫：E4 / G#4 / B4 / E5，全部在中高频，绝无低频 drone */
  [329.63, 415.30, 493.88, 659.25].forEach((f,i)=>{
    const o = AC.createOscillator(); o.type = (i%2)? 'triangle' : 'sine';
    o.frequency.value = f * (1 + (i-1.5)*0.0009);
    const g = AC.createGain(); g.gain.value = 0.0085/(1+i*0.35);
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.055 + i*0.019;
    const lg  = AC.createGain(); lg.gain.value = 0.0055/(1+i*0.3);
    lfo.connect(lg); lg.connect(g.gain);
    const hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 260;
    o.connect(g); g.connect(hp); hp.connect(master);
    o.start(); lfo.start();
  });
  master.gain.linearRampToValueAtTime(audioOn?0.9:0.0001, AC.currentTime + 2.2);
}
function toggleAudio(){
  if(!AC){ initAudio(); audioOn = true; toast('环境音：开'); return; }
  audioOn = !audioOn;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(audioOn?0.9:0.0001, AC.currentTime, 0.25);
  toast('环境音：'+(audioOn?'开':'关'));
}
function envSine(f0,f1,t0,t1,vol,type){
  if(!AC || !audioOn) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(f0, t+t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+t1);
  g.gain.setValueAtTime(0.0001, t+t0);
  g.gain.exponentialRampToValueAtTime(vol, t+t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+t1+0.05);
  o.connect(g); g.connect(master);
  o.start(t+t0); o.stop(t+t1+0.10);
}
function sfxDrop(){ envSine(1250+RND()*1000, 420+RND()*260, 0, 0.20+RND()*0.12, 0.11); }
function sfxBubble(){ envSine(320+RND()*160, 900+RND()*500, 0, 0.11+RND()*0.07, 0.07); }
function sfxBird(){
  const n = 2+Math.floor(RND()*2);
  for(let i=0;i<n;i++){
    const f = 2300+RND()*1500, s = i*0.105;
    envSine(f, f*(1.45+RND()*0.5), s, s+0.045, 0.045);
    envSine(f*1.4, f*0.9, s+0.05, s+0.10, 0.030);
  }
}
function audioTick(dt){
  if(!AC || !audioOn) return;
  tDrop -= dt; tBird -= dt; tBub -= dt;
  if(tDrop<=0){ tDrop = rr(1.1,3.4); sfxDrop(); }
  if(tBird<=0){ tBird = rr(4.5,11.0); if(!player.under) sfxBird(); }
  if(tBub<=0){ tBub = player.under? rr(0.25,0.9) : rr(2.4,6.0); sfxBubble(); }
}

/* ============================ 19. HUD ============================ */
const elStats = document.getElementById('stats');
const elZone  = document.getElementById('zone');
const elToast = document.getElementById('toast');
let toastT = 0;
function toast(msg){
  elToast.innerHTML = '<span class="dot" style="color:#38d6b4"></span>'+msg;
  elToast.classList.add('on'); toastT = 2.4;
}
let curZone = '入口迎宾厅', curSub = 'ENTRANCE ATRIUM';
function zoneAt(x,z){
  for(const zz of ZONES) if(x>zz.x0 && x<zz.x1 && z>zz.z0 && z<zz.z1) return zz;
  return null;
}
let fpsAvg = 60, hudT = 0;
function updateHUD(dt){
  if(toastT>0){ toastT-=dt; if(toastT<=0) elToast.classList.remove('on'); }
  const z = zoneAt(player.pos.x, player.pos.z);
  if(z && z.name!==curZone){ curZone=z.name; curSub=z.sub; }
  hudT -= dt; if(hudT>0) return; hudT = 0.22;
  elZone.innerHTML = curZone + '<small>'+curSub+'</small>';
  const info = renderer.info;
  elStats.innerHTML =
    '<div><b>FPS</b> '+fpsAvg.toFixed(0)+'　<b>DPR</b> '+renderer.getPixelRatio().toFixed(2)+'</div>'+
    '<div><b>Draw</b> '+info.render.calls+'　<b>Tri</b> '+(info.render.triangles/1000).toFixed(0)+'k</div>'+
    '<div><b>Inst</b> '+INSTANCED.length+' 批　<b>Pool</b> '+POOLS.length+'</div>'+
    '<div><b>Pos</b> '+player.pos.x.toFixed(1)+', '+player.pos.y.toFixed(1)+', '+player.pos.z.toFixed(1)+'</div>'+
    '<div><b>Mode</b> '+(player.fly?'自由飞行':(player.swim?'游泳':(player.under?'水下':'步行')))+'</div>';
}

/* ============================ 20. 自适应画质 / 尺寸 ============================ */
let qStep = 0, lowT = 0;
function applyPixelRatio(pr){
  renderer.setPixelRatio(pr);
  onResize();
}
function degrade(){
  if(qStep>=2) return;
  qStep++;
  if(qStep===1){ applyPixelRatio(1.0); toast('性能优化：分辨率 1.0x'); }
  else { ssaoPass.enabled = false; applyPixelRatio(0.85); toast('性能优化：关闭 SSAO'); }
}
function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  const pw = Math.floor(w*renderer.getPixelRatio()), ph = Math.floor(h*renderer.getPixelRatio());
  composer.setSize(pw, ph);
  bloomPass.setSize(pw, ph);
  syncPassUniforms(pw, ph);
  const s = rtSize();
  reflRT.setSize(s[0], s[1]); refrRT.setSize(s[0], s[1]);
}
addEventListener('resize', onResize);

/* ============================ 21. 主循环 ============================ */
const clock = new THREE.Clock();
const _m4 = new THREE.Matrix4(), _sv = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  U.time.value += dt;
  fpsAvg = lerp(fpsAvg, 1/Math.max(dt,1e-4), 0.06);
  if(fpsAvg < 44){ lowT += dt; if(lowT>2.5){ lowT=0; degrade(); } } else lowT = Math.max(0, lowT-dt*0.5);

  updatePlayer(dt);
  audioTick(dt);

  /* 悬浮植物球体：缓慢浮沉 + 自转 */
  if(sphereMesh){
    for(let i=0;i<FLOAT_SPHERES.length;i++){
      const s = FLOAT_SPHERES[i];
      const y = s.y + Math.sin(U.time.value*s.sp*0.6 + s.ph)*0.085;
      _m4.makeRotationY(U.time.value*0.09*s.sp + s.ph);
      _m4.scale(_sv.set(s.s*2, s.s*2, s.s*2));
      _m4.setPosition(s.x, y, s.z);
      sphereMesh.setMatrixAt(i, _m4);
    }
    sphereMesh.instanceMatrix.needsUpdate = true;
  }
  /* 日光跟随玩家（阴影范围始终覆盖视野） */
  sun.position.set(player.pos.x + U.sunDir.value.x*72, U.sunDir.value.y*72, player.pos.z + U.sunDir.value.z*72);
  sun.target.position.set(player.pos.x, 0, player.pos.z);
  sun.target.updateMatrixWorld();
  /* 海面法线缓慢流动 */
  if(MAT.sea){ MAT.sea.normalMap.offset.x = U.time.value*0.0022; MAT.sea.normalMap.offset.y = U.time.value*0.0016; }

  renderer.info.reset();
  renderer.shadowMap.needsUpdate = sun.castShadow;   // 本帧只渲染一次阴影贴图
  renderWaterRT();
  ssaoPass.uniforms.tDepth.value = composer.readBuffer.depthTexture;
  composer.render(dt);
  updateHUD(dt);
}

/* ============================ 22. 启动 ============================ */
const bar = document.querySelector('#bar i');
const boot = document.getElementById('boot');
bar.style.width = '46%';
requestAnimationFrame(()=>{
  /* 预编译所有材质，避免进入后第一帧卡顿 */
  camera.position.set(SPAWN.x, EYE, SPAWN.z);
  try{ renderer.compile(scene, camera); }catch(e){}
  bar.style.width = '100%';
  document.getElementById('enter').textContent = '点 击 进 入';
});
document.getElementById('enter').addEventListener('click', ()=>{
  initAudio();
  boot.classList.add('gone');
  document.getElementById('hud').classList.add('on');
  setTimeout(()=>{ boot.style.display='none'; }, 1000);
  lockPointer();
  toast('欢迎来到 AQUA LUMEN · 向前走入水景中庭');
});
animate();
