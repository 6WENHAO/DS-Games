const ROT_SHAPES = new Set(['capsule', 'needle', 'lance', 'diamond', 'missile', 'blade', 'flame', 'bolt']);
function shapeRotates(shape) { return ROT_SHAPES.has(shape); }

const BSHAPES = {
  orb(p, w, h, cx, cy) {
    p.ellipse(cx, cy, w / 2, h / 2, M.HULL);
    p.ellipse(cx, cy - h * 0.08, w / 2 - 1, h / 2 - 1, M.LIGHT);
    p.ellipse(cx, cy - h * 0.12, Math.max(1, w / 4), Math.max(1, h / 4), M.HOT);
  },
  ball(p, w, h, cx, cy) {
    p.ellipse(cx, cy, w / 2, h / 2, M.HULL);
    p.ring(cx, cy, w / 2, h / 2, 1, M.LIGHT);
    p.ellipse(cx - w * 0.12, cy - h * 0.15, Math.max(1, w / 4), Math.max(1, h / 4), M.HOT);
  },
  dot(p, w, h, cx, cy) {
    p.ellipse(cx, cy, w / 2, h / 2, M.LIGHT);
    p.set(Math.round(cx), Math.round(cy), M.HOT);
  },
  capsule(p, w, h, cx, cy) {
    p.rect(cx - w / 2, cy - h / 2 + 1, w, h - 2, M.HULL);
    p.ellipse(cx, cy - h / 2 + 1, w / 2, w / 2, M.LIGHT);
    p.ellipse(cx, cy + h / 2 - 1, w / 2, w / 2, M.HULL);
    p.rect(cx - Math.max(1, w / 4), cy - h / 2 + 1, Math.max(1, w / 2), h - 3, M.HOT);
  },
  needle(p, w, h, cx, cy) {
    p.taper(cx, cy - h / 2, cy + h / 2, 1, w, M.HULL);
    p.taper(cx, cy - h / 2, cy + h / 4, 1, Math.max(1, w - 2), M.HOT);
  },
  lance(p, w, h, cx, cy) {
    p.taper(cx, cy - h / 2, cy - h / 6, 1, w, M.LIGHT);
    p.rect(cx - w / 2, cy - h / 6, w, h * 0.66, M.HULL);
    p.rect(cx - Math.max(1, w / 4), cy - h / 2 + 1, Math.max(1, w / 2), h * 0.8, M.HOT);
  },
  diamond(p, w, h, cx, cy) {
    p.poly([[cx, cy - h / 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy]], M.HULL);
    p.poly([[cx, cy - h / 2 + 1], [cx + w / 2 - 1, cy], [cx, cy + h / 2 - 1], [cx - w / 2 + 1, cy]], M.LIGHT);
    p.ellipse(cx, cy, Math.max(1, w / 5), Math.max(1, h / 5), M.HOT);
  },
  missile(p, w, h, cx, cy) {
    p.taper(cx, cy - h / 2, cy - h / 5, 1, w, M.LIGHT);
    p.rect(cx - w / 2, cy - h / 5, w, h * 0.5, M.HULL);
    p.rect(cx - w / 2 - 1, cy + h * 0.18, 2, 3, M.DARK);
    p.rect(cx + w / 2 - 1, cy + h * 0.18, 2, 3, M.DARK);
    p.rect(cx - Math.max(1, w / 4), cy + h * 0.3, Math.max(1, w / 2), 3, M.HOT);
  },
  mine(p, w, h, cx, cy) {
    p.ellipse(cx, cy, w / 2 - 1, h / 2 - 1, M.HULL);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      p.line(cx + Math.cos(a) * (w / 2 - 1), cy + Math.sin(a) * (h / 2 - 1),
        cx + Math.cos(a) * (w / 2 + 1), cy + Math.sin(a) * (h / 2 + 1), M.DARK);
    }
    p.ellipse(cx, cy, Math.max(1, w / 5), Math.max(1, h / 5), M.HOT);
  },
  bolt(p, w, h, cx, cy) {
    p.line(cx, cy - h / 2, cx - w / 3, cy - h / 6, M.HOT);
    p.line(cx - w / 3, cy - h / 6, cx + w / 3, cy + h / 6, M.LIGHT);
    p.line(cx + w / 3, cy + h / 6, cx, cy + h / 2, M.HOT);
    p.line(cx - 1, cy - h / 2, cx - w / 3 - 1, cy - h / 6, M.HULL);
  },
  flame(p, w, h, cx, cy) {
    p.ellipse(cx, cy + h * 0.1, w / 2, h * 0.38, M.HULL);
    p.taper(cx, cy - h / 2, cy, 1, w, M.LIGHT);
    p.ellipse(cx, cy + h * 0.05, Math.max(1, w / 4), Math.max(1, h / 5), M.HOT);
  },
  blade(p, w, h, cx, cy) {
    p.ellipse(cx, cy, w / 2, h / 2, M.HULL);

      ctx.fillRect(n.x - 12, n.y - 15, 24 * clamp(n.hp / n.maxHp, 0, 1), 3);
    }
  }

  drawLasers(ctx, world) {
    for (const l of world.lasers.active) {
      const st = laserStyle(l.style);
      const dx = Math.sin(l.angle), dy = Math.cos(l.angle);
      const len = 1200;
      const x2 = l.x + dx * len, y2 = l.y + dy * len;
      if (l.t < l.charge) {
        // 蓄力预警
        const k = l.t / l.charge;
        ctx.globalAlpha = 0.2 + 0.35 * k;
        ctx.strokeStyle = st.glow;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.setLineDash([]);
        // 蓄力光球
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.5 + 0.5 * k;
        const r = l.width * 0.3 * (0.4 + k);
        const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, r);
        g.addColorStop(0, st.core);
        g.addColorStop(0.5, st.mid);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(l.x - r, l.y - r, r * 2, r * 2);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      } else {
        const p = (l.t - l.charge) / l.duration;
        const w = l.width * (p < 0.1 ? p / 0.1 : p > 0.85 ? (1 - p) / 0.15 : 1);
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(-l.angle + Math.PI);
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.22, st.glow);
        g.addColorStop(0.5, st.core);
        g.addColorStop(0.78, st.glow);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(-w / 2, -len, w, len);
        ctx.fillStyle = st.core;
        ctx.globalAlpha = 0.9;
        ctx.fillRect(-w * 0.14, -len, w * 0.28, len);
        ctx.restore();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }
    }
  }

  drawPlayer(ctx, world) {
    const p = world.player;
    const st = world.stats;
    const ship = st.shipDef;
    // 僚机（在飞机之下）
    for (const dr of p.drones) {
      this.drawDrone(ctx, world, dr);
    }
    if (!p.alive && p.respawnT <= 0) return;
    const spr = shipSprite(ship);
    const blink = p.invul > 0 && Math.floor(this.time * 18) % 2 === 0;
    const x = Math.round(p.x), y = Math.round(p.y);

    // 尾焰
    const frame = Math.floor(this.time * 24) % 3;
    const thr = thrusterSprite(ship.palette, frame, p.od > 0);
    ctx.globalAlpha = 0.9;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(thr, Math.round(x - thr.width / 2), Math.round(y + spr.height / 2 - 6));
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // 暴走光环
    if (p.od > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const pulse = 0.35 + 0.2 * Math.sin(this.time * 12);
      ctx.globalAlpha = pulse;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 46);
      g.addColorStop(0, '#fff2c0');
      g.addColorStop(0.4, ship.palette.glow);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - 46, y - 46, 92, 92);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.tilt * 0.12);
    ctx.globalAlpha = blink ? 0.4 : 1;
    if (p.hurtFlash > 0) ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(spr, -Math.round(spr.width / 2), -Math.round(spr.height / 2));
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.restore();

    // 护盾罩
    if (p.shieldHp > 0) {
      const k = clamp(p.shieldHp / Math.max(1, p.maxHp * 0.6), 0.2, 1);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.22 + 0.16 * Math.sin(this.time * 5) + (p.shieldFlash > 0 ? 0.4 : 0);
      const r = 28 + k * 6;
      const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.7, '#6fd8ff');
      g.addColorStop(1, 'rgba(120,220,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#bff0ff';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 光束
    for (const bm of p.beams) {
      const stl = bulletStyle(bm.style === 'beamThin' ? 'plasma' : 'plasmaBig');
      ctx.save();
      ctx.translate(bm.x, bm.y);
      ctx.rotate(bm.angle);
      ctx.globalCompositeOperation = 'lighter';
      const w = bm.width;
      const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.25, ship.palette.glow);
      g.addColorStop(0.5, '#ffffff');
      g.addColorStop(0.75, ship.palette.glow);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(-w / 2, -900, w, 900);
      ctx.globalAlpha = 0.8 + 0.2 * Math.sin(this.time * 40);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-w * 0.16, -900, w * 0.32, 900);
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // 核心判定点
    const showCore = world.god.showCore || p.danger > 0 || world.input?.focus;
    if (showCore) {
      const a = p.danger > 0 || world.input?.focus ? 0.95 : 0.4;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, p.hitR, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff5a7a';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, p.hitR + 1.5, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  drawDrone(ctx, world, dr) {
    const d = dr.def;
    const col = d.color;
    const x = Math.round(dr.x), y = Math.round(dr.y);
    // 机体
    ctx.fillStyle = '#2a3340';
    ctx.fillRect(x - 6, y - 5, 12, 10);
    ctx.fillStyle = col;
    ctx.fillRect(x - 5, y - 4, 10, 5);
    ctx.fillStyle = '#101820';
    ctx.fillRect(x - 5, y + 1, 10, 3);
    ctx.fillStyle = dr.flash > 0 ? '#ffffff' : col;
    ctx.fillRect(x - 2, y - 7, 4, 3);
    if (d.behavior === 'orbit') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4 + 0.25 * Math.sin(this.time * 9);
      const g = ctx.createRadialGradient(x, y, 0, x, y, d.params.eatRadius);
      g.addColorStop(0, col);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - d.params.eatRadius, y - d.params.eatRadius, d.params.eatRadius * 2, d.params.eatRadius * 2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    if (d.behavior === 'beam' && dr.beamOn) {
      const w = d.params.width;
      ctx.save();
      ctx.translate(x, y - 6);
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.4, col);
      g.addColorStop(0.5, '#ffffff');
      g.addColorStop(0.6, col);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(-w / 2, -820, w, 820);
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
      dr.beamOn = false;
    }
  }

  drawPBullets(ctx, world) {
    ctx.globalCompositeOperation = 'lighter';
    for (const b of world.pBullets.active) {
      if (b.__dead) continue;
      const spr = bulletSprite(b.style);
      if (spr.rotates) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot + Math.PI / 2);
        ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
        ctx.restore();
      } else {
        ctx.drawImage(spr, Math.round(b.x - spr.width / 2), Math.round(b.y - spr.height / 2));
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  drawEBullets(ctx, world) {
    const arr = world.eBullets.active;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < arr.length; i++) {
      const b = arr[i];
      if (b.__dead || b.delay > 0) continue;
      const spr = bulletSprite(b.style);
      if (b.isMine && b.fuse > 0 && b.fuse < 0.5 && Math.floor(b.fuse * 24) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }
      if (spr.rotates) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot - Math.PI / 2);
        ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
        ctx.restore();
      } else {
        ctx.drawImage(spr, Math.round(b.x - spr.width / 2), Math.round(b.y - spr.height / 2));
      }
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';
    if (world.god.enabled && world.god.showBulletPath) {
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const b of arr) {
        if (b.__dead) continue;
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + b.vx * 0.4, b.y + b.vy * 0.4);
      }
      ctx.stroke();
    }
  }

  drawParticles(ctx, world) {
    const q = this.settings.particles;
    ctx.globalCompositeOperation = 'lighter';
    for (const p of world.particles.active) {
      const k = p.life / p.maxLife;
      switch (p.kind) {
        case 'shock': {
          const r = p.size * (1 - k) * 1.6;
          ctx.globalAlpha = k * 0.55;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2 + 4 * k;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
          break;
        }
        case 'bombwave': {
          const r = p.size * (1 - k);
          ctx.globalAlpha = k * 0.4;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 8 * k + 2;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
          ctx.globalAlpha = k * 0.12;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
          break;
        }
        case 'ring': {
          const r = p.size * (1 - k * 0.6);
          ctx.globalAlpha = k * 0.7;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
          break;
        }
        case 'shard': {
          ctx.globalAlpha = k;
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.spin);
          ctx.fillRect(-p.size, -1, p.size * 2, 2);
          ctx.restore();
          break;
        }
        case 'trail': {
          ctx.globalAlpha = k * 0.5;
          ctx.fillStyle = p.color;
          const s = p.size * k;
          ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
          break;
        }
        default: {
          ctx.globalAlpha = k;
          ctx.fillStyle = p.color;
          const s = Math.max(1, p.size * (p.kind === 'flame' ? k : 1));
          ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), Math.ceil(s), Math.ceil(s));
        }
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  drawFloaters(ctx, world) {
    ctx.textAlign = 'center';
    for (const f of world.floaters.active) {
      const k = f.life / f.maxLife;
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.font = `bold ${f.size}px "DINAlternate-Bold", "Menlo", monospace`;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillText(f.text, f.x + 1, f.y + 1);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  drawHitboxes(ctx, world) {
    ctx.strokeStyle = 'rgba(255,90,120,0.7)';
    ctx.lineWidth = 1;
    for (const e of world.enemies.active) {
      if (!e.alive) continue;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.stroke();
    }
    const b = world.boss;
    if (b && !b.dead) {
      ctx.strokeStyle = 'rgba(255,210,90,0.8)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.86, 0, TAU); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(120,255,140,0.8)';
    for (const bl of world.eBullets.active) {
      if (bl.__dead) continue;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r * 0.82, 0, TAU); ctx.stroke();
    }
  }

  // ========================================================
  // HUD
  // ========================================================
  drawHud(ctx, world, hud) {
    const p = world.player;
    const st = world.stats;
    ctx.save();
    ctx.textBaseline = 'middle';

    // ---- 顶部条 ----
    const topH = 46;
    ctx.fillStyle = 'rgba(6,10,20,0.72)';
    ctx.fillRect(0, 0, W, topH);
    ctx.fillStyle = 'rgba(120,190,255,0.28)';
    ctx.fillRect(0, topH - 1, W, 1);

    // 分数
    ctx.font = 'bold 11px "Menlo", monospace';
    ctx.fillStyle = '#7fa8c8';
    ctx.fillText('SCORE', 10, 12);
    ctx.font = 'bold 19px "DINAlternate-Bold","Menlo",monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(fmt(world.score), 10, 30);

    // 关卡 / 波次
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px "Menlo", monospace';
    ctx.fillStyle = '#cfe4ff';
    const label = world.mode === 'endless' ? `无尽 · WAVE ${world.endless?.wave || 0}`
      : world.mode === 'bossrush' ? 'BOSS 挑战'
        : world.mode === 'training' ? '训练模式'
          : world.level ? world.level.name : '';
    ctx.fillText(label, W / 2, 13);
    // 进度条
    const pbW = 150;
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(W / 2 - pbW / 2, 24, pbW, 5);
    ctx.fillStyle = world.state === 'boss' ? '#ff6b7a' : '#5fd0ff';
    ctx.fillRect(W / 2 - pbW / 2, 24, pbW * clamp(world.progress, 0, 1), 5);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(W / 2 - pbW / 2, 24, pbW, 5);
    // 连击
    if (p.combo > 3) {
      ctx.font = 'bold 13px "DINAlternate-Bold","Menlo",monospace';
      ctx.fillStyle = '#ffd45a';
      ctx.fillText(`${p.combo} COMBO`, W / 2, 38);
    }
    ctx.textAlign = 'left';

    // 炸弹
    ctx.textAlign = 'right';
    ctx.font = 'bold 11px "Menlo", monospace';
    ctx.fillStyle = '#7fa8c8';
    ctx.fillText('BOMB', W - 10, 12);
    ctx.textAlign = 'left';
    for (let i = 0; i < Math.min(6, Math.max(0, p.bombs)); i++) {
      const bx = W - 14 - i * 13;
      ctx.fillStyle = '#ffb545';
      ctx.fillRect(bx - 5, 24, 9, 9);
      ctx.fillStyle = '#3a2408';
      ctx.fillRect(bx - 3, 26, 5, 5);
    }
    if (p.bombs > 6) {
      ctx.textAlign = 'right';
      ctx.font = 'bold 10px "Menlo",monospace';
      ctx.fillStyle = '#ffd45a';
      ctx.fillText('x' + p.bombs, W - 92, 29);
      ctx.textAlign = 'left';
    }

    // ---- Boss 血条 ----
    const b = world.boss;
    if (b && !b.dead && b.state !== 'entrance') {
      const bx = 26, by = topH + 10, bw = W - 52, bh = 11;
      const shake = b.hpBarShake > 0 ? (Math.random() - 0.5) * 3 : 0;
      ctx.save();
      ctx.translate(shake, 0);
      // 名称
      ctx.font = 'bold 12px "PingFang SC","Menlo",monospace';
      ctx.fillStyle = b.def.theme.light;
      ctx.fillText(b.name + (b.variant > 1 ? ` · MK${b.variant}` : ''), bx, by - 7);
      ctx.textAlign = 'right';
      ctx.font = 'bold 10px "Menlo",monospace';
      ctx.fillStyle = '#cfe4ff';
      ctx.fillText(`${b.phase.name}  ${Math.ceil(b.hp)}/${b.maxHp}`, bx + bw, by - 7);
      ctx.textAlign = 'left';
      // 底槽
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(bx, by, bw, bh);
      // 阶段分段
      const frac = clamp(b.hp / b.maxHp, 0, 1);
      const g = ctx.createLinearGradient(bx, by, bx, by + bh);
      g.addColorStop(0, '#ff9a8a');
      g.addColorStop(0.5, '#ff4a5a');
      g.addColorStop(1, '#c01a2a');
      ctx.fillStyle = g;
      ctx.fillRect(bx, by, bw * frac, bh);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(bx, by, bw * frac, 2);
      // 阈值刻度
      for (const ph of b.def.phases) {
        if (ph.at >= 1) continue;
        const lx = bx + bw * ph.at;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillRect(lx, by - 2, 1, bh + 4);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
      // 第二个精英 Boss 血条（英雄模式双精英）
      if (world.boss2 && !world.boss2.dead && world.boss2.state !== 'entrance') {
        const b2 = world.boss2;
        ctx.font = 'bold 10px "PingFang SC","Menlo",monospace';
        ctx.fillStyle = b2.def.theme.light;
        ctx.fillText(b2.name, bx, by + bh + 20);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(bx, by + bh + 24, bw, 6);
        ctx.fillStyle = '#ff8a5a';
        ctx.fillRect(bx, by + bh + 24, bw * clamp(b2.hp / b2.maxHp, 0, 1), 6);
      }
      // 部件指示
      let px2 = bx;
      for (const part of b.parts) {
        if (part.isShell) continue;
        ctx.fillStyle = part.alive ? (part.isCore ? '#ffd45a' : '#8fd8ff') : 'rgba(255,255,255,0.16)';
        ctx.fillRect(px2, by + bh + 4, 22, 3);
        px2 += 26;
      }
      ctx.restore();
    }

    // ---- 底部：生命 / 暴走 / 装备 ----
    const bottomY = H - 44;
    ctx.fillStyle = 'rgba(6,10,20,0.72)';
    ctx.fillRect(0, bottomY, W, 44);
    ctx.fillStyle = 'rgba(120,190,255,0.28)';
    ctx.fillRect(0, bottomY, W, 1);

    // 生命条
    const hx = 10, hy = bottomY + 9, hw = 190, hh = 12;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(hx - 2, hy - 2, hw + 4, hh + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(hx, hy, hw, hh);
    const hf = clamp(p.hp / p.maxHp, 0, 1);
    const hg = ctx.createLinearGradient(hx, hy, hx, hy + hh);
    hg.addColorStop(0, hf > 0.35 ? '#8bff9a' : '#ff9a8a');
    hg.addColorStop(1, hf > 0.35 ? '#2fa84a' : '#c01a2a');
    ctx.fillStyle = hg;
    ctx.fillRect(hx, hy, hw * hf, hh);
    // 护盾覆盖
    if (p.shieldHp > 0) {
      const sf = clamp(p.shieldHp / (p.maxHp * 0.6), 0, 1);
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = '#6fd8ff';
      ctx.fillRect(hx, hy, hw * sf, 4);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.strokeRect(hx, hy, hw, hh);
    ctx.font = 'bold 10px "Menlo",monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, hx + 4, hy + hh / 2 + 1);

    // 武器等级 / 暴走
    const wx = hx, wy = bottomY + 28;
    ctx.font = 'bold 10px "Menlo",monospace';
    ctx.fillStyle = '#7fa8c8';
    ctx.fillText('POWER', wx, wy + 4);
    for (let i = 0; i < 3; i++) {
      const on = p.weaponLevel > i;
      ctx.fillStyle = on ? '#7dff86' : 'rgba(255,255,255,0.16)';
      ctx.fillRect(wx + 44 + i * 14, wy, 11, 8);
    }
    if (p.od > 0) {
      const odMax = 12 + st.odBonus;
      const k = clamp(p.od / odMax, 0, 1);

            onClick: () => { if (lk) { this.toast('需要先通关前面的关卡', 'bad'); return; } this.app.sfx('ui'); this.show('prebattle', { mode: 'campaign', level: l.index }); },
          },
            l.boss ? h('div', { class: 'tag ' + (l.boss.node === 'final' ? 'f' : l.boss.node === 'big' ? 'b' : '') }, l.boss.node === 'final' ? 'F' : l.boss.node === 'big' ? 'B' : 'E') : null,
            h('div', { class: 'n' }, l.pos),
            h('div', { class: 't' }, l.title.slice(0, 5)),
            h('div', { class: 'st' }, rec ? STAR(rec.stars) : ''),
          ));
        }
        card.appendChild(grid);
      }
      body.appendChild(card);
    }
    return h('div', { class: 'screen' }, this.head('章节地图', '12 星座 · 96 关 · 48 BOSS 节点', this.resBar()), body);
  }

  // ========================================================
  // 战前准备
  // ========================================================
  screen_prebattle(pm) {
    const st = this.game.stats();
    const lv = pm.mode === 'campaign' || pm.mode === 'material' || pm.mode === 'daily' ? LEVEL_MAP.get(pm.level) : null;
    const hero = pm.mode === 'hero' ? HERO_LEVELS[pm.heroIndex - 1] : null;
    const body = h('div', { class: 'sc-body' });

    // 标题信息
    let title = '出击准备', sub = '';
    if (lv && pm.mode === 'campaign') { title = lv.name; sub = `${lv.chapterName} · ${lv.roleName} · ${lv.roleDesc}`; }
    if (hero) { title = hero.name; sub = `英雄模式 · 规则：${hero.rules.map((r) => HERO_RULES.find((x) => x.id === r).name).join('、')}`; }
    if (pm.mode === 'endless') { title = '无尽模式'; sub = '无限波次 · 周期性随机 Boss'; }
    if (pm.mode === 'bossrush') { title = 'BOSS 挑战 · ' + (BOSS_RUSH_PRESETS.find((p) => p.id === pm.presetId)?.name || ''); sub = `难度：${BOSS_RUSH_DIFF[pm.difficulty].name} · ${pm.bossQueue.length} 个 Boss`; }
    if (pm.mode === 'material') { title = pm.matName; sub = `材料挑战 Tier ${pm.tier}`; }
    if (pm.mode === 'daily') { title = '每日挑战 · ' + pm.daily.bossName; sub = `规则：${pm.daily.ruleNames.join('、')}`; }
    if (pm.mode === 'training') { title = '训练模式'; sub = '不消耗资源，不记录成绩'; }

    // 战机预览
    body.appendChild(h('div', { class: 'pre-hero' },
      spriteBox(shipSprite(st.shipDef), 70),
      h('div', { style: { flex: '1' } },
        h('div', { style: { fontSize: '15px', fontWeight: '700' } }, st.shipDef.name, ' ', qBadge(st.parts.ship.quality)),
        h('div', { style: { fontSize: '10px', color: 'var(--tx2)', marginTop: '2px' } }, st.shipDef.playstyle),
        h('div', { class: 'res-bar', style: { marginTop: '5px' } },
          h('div', { class: 'res' }, '战力 ', h('b', {}, fmt(st.power))),
          h('div', { class: 'res' }, 'ATK ', h('b', {}, fmt(st.atk))),
          h('div', { class: 'res' }, 'HP ', h('b', {}, fmt(st.maxHp))),
          h('div', { class: 'res' }, 'DEF ', h('b', {}, st.def)),
        ),
      ),
    ));

    // 四装备
    const slotGrid = h('div', { class: 'slot4' });
    for (const sl of SLOTS) {
      const inst = this.game.loadoutInsts()[sl];
      const d = inst ? defOf(sl, inst.id) : null;
      slotGrid.appendChild(h('div', {
        class: 'slotcard',
        onClick: () => { this.app.sfx('ui'); this.hangarSlot = sl; this.hangarSel = inst?.id; this.show('hangar', { from: 'prebattle', pm }); },
      },
        h('div', { class: 'lb' }, SLOT_NAMES[sl]),
        h('div', { class: 'nm' }, d ? d.name : '未装备'),
        h('div', { class: 'lv' }, inst ? `Lv.${inst.level} ${QUALITY[inst.quality]?.key || ''}` : '—'),
      ));
    }
    body.appendChild(slotGrid);

    // 技能与特性
    body.appendChild(h('div', { class: 'trait' }, `【${st.skill.name}】${st.skill.desc}`));
    if (st.trait) body.appendChild(h('div', { class: 'trait' }, `【${st.trait.name}】${st.trait.desc}`));
    if (st.secDef) body.appendChild(h('div', { class: 'trait' }, `【副武器 ${st.secDef.name}】${st.secDef.focus} · 伤害 ${fmt(st.secDmg)}`));
    if (st.droneDef) body.appendChild(h('div', { class: 'trait' }, `【僚机 ${st.droneDef.name}】${st.droneDef.focus} · 伤害 ${fmt(st.droneDmg)}`));

    // Boss 情报
    if (lv?.boss) {
      const bd = BOSSES[lv.boss.id];
      body.appendChild(h('div', { class: 'detail', style: { marginTop: '8px' } },
        h('h3', {}, `BOSS · ${bd.name}`, lv.boss.variant > 1 ? h('span', { style: { color: 'var(--gd)', fontSize: '11px' } }, ` MK${lv.boss.variant}`) : null),
        h('div', { class: 'sub' }, `${lv.boss.node === 'final' ? '章节最终 Boss' : lv.boss.node === 'big' ? '普通大 Boss' : '精英小 Boss'} · ${bd.phases.length} 阶段 · ${Object.keys(bd.moves).length} 招式 · 生命 ${fmtShort(lv.boss.hp)}`),
        h('div', { class: 'desc' }, bd.intro),
        h('div', { class: 'trait' }, '战术：' + bd.tactic),
        lv.boss.variantNote ? h('div', { class: 'trait', style: { borderLeftColor: 'var(--gd)', color: 'var(--gd)' } }, '本次强化：' + lv.boss.variantNote) : null,
        bd.parts.length ? h('div', { class: 'cost' }, '可破坏部件：', h('b', {}, bd.parts.map((p) => p.name).join('、'))) : null,
      ));
    }

    // 挑战条件
    if (lv && pm.mode === 'campaign') {
      const rec = this.save.levels[String(lv.index)];
      body.appendChild(h('div', { style: { marginTop: '8px', fontSize: '11px', color: 'var(--tx2)' } }, '可选挑战（不影响主线推进）'));
      const cl = h('div', { class: 'chal' });
      for (const c of lv.challenges) {
        const done = rec?.challenges?.[c.id];
        cl.appendChild(h('div', { class: done ? 'done' : '' }, (done ? '✔ ' : '○ ') + c.name + '  →  ' + Object.entries(c.reward).map(([k, v]) => `${k} +${v}`).join(' ')));
      }
      body.appendChild(cl);
      body.appendChild(h('div', { class: 'cost', style: { marginTop: '6px' } },
        `三星条件：通关 + 分数 ≥ ${fmt(lv.stars.score)} + 无复活且剩余生命 ≥ ${Math.round(lv.stars.hpKeep * 100)}%（或全程无伤）`));
      body.appendChild(h('div', { class: 'cost' }, `预计时长：波次 ${lv.duration}s${lv.boss ? ` + Boss ≈ ${Math.round(lv.boss.ttk)}s` : ''} · 敌人 ${lv.totalEnemies} · 波次事件 ${lv.waves.length}`));
    }
    if (pm.mode === 'bossrush') {
      const list = h('div', { class: 'chal' });
      pm.bossQueue.forEach((b, i) => list.appendChild(h('div', {}, `${i + 1}. ${b.name}  (第${b.level}关 · ${b.node === 'final' ? '章节' : b.node === 'big' ? '大' : '精英'})`)));
      body.appendChild(h('div', { style: { marginTop: '8px', fontSize: '11px', color: 'var(--tx2)' } }, 'Boss 序列'));
      body.appendChild(list);
    }
    if (hero) {
      const list = h('div', { class: 'chal' });
      for (const r of hero.rules) {
        const rr = HERO_RULES.find((x) => x.id === r);
        list.appendChild(h('div', {}, `● ${rr.name} — ${rr.desc}`));
      }
      body.appendChild(list);
      body.appendChild(h('div', { class: 'cost' }, `奖励：金币 ${fmt(hero.reward.coin)} · 钻石 ${hero.reward.gem} · 碎片 ${hero.reward.frag}${hero.reward.core ? ' · 核心 ' + hero.reward.core : ''}`));
    }

    return h('div', { class: 'screen' },
      this.head(title, sub, this.resBar()),
      body,
      h('div', { class: 'sc-foot' },
        h('button', { class: 'btn', onClick: () => { this.app.sfx('ui'); this.hangarSlot = 'ship'; this.show('hangar', { from: 'prebattle', pm }); } }, '机库'),
        h('div', { class: 'spacer' }),
        h('button', { class: 'btn primary lg', onClick: () => { this.app.sfx('uiConfirm'); this.app.startBattle(pm); } }, '出 击 ▶'),
      ),
    );
  }

  // ========================================================
  // 机库
  // ========================================================
  screen_hangar(pm) {
    const body = h('div', { class: 'sc-body' });
    const slot = this.hangarSlot;
    const tabs = h('div', { class: 'tabs' });
    for (const sl of SLOTS) {
      tabs.appendChild(h('button', {
        class: 'btn sm' + (sl === slot ? ' sel' : ''),
        onClick: () => { this.app.sfx('ui'); this.hangarSlot = sl; this.hangarSel = null; this.refresh(); },
      }, SLOT_NAMES[sl]));
    }
    body.appendChild(tabs);

    // 当前装备总览
    const st = this.game.stats();
    body.appendChild(h('div', { class: 'detail', style: { padding: '7px 9px' } },
      h('div', { class: 'statgrid' },
        h('div', {}, '战力', h('b', {}, fmt(st.power))),
        h('div', {}, '攻击', h('b', {}, fmt(st.atk))),
        h('div', {}, '生命', h('b', {}, fmt(st.maxHp))),
        h('div', {}, '防御', h('b', {}, st.def)),
      )));

    const all = ALL_BY_SLOT[slot];
    const sel = this.hangarSel || this.save.loadout[slot];
    // 详情
    if (sel) body.appendChild(this.equipDetail(slot, sel));

    // 列表（按系列/阶排序）
    const list = h('div', { class: 'eq-list' });
    const sorted = all.slice().sort((a, b) => (a.series === b.series ? a.tier - b.tier : a.series.localeCompare(b.series)));
    for (const d of sorted) {
      const owned = this.game.isOwned(slot, d.id);
      const inst = owned ? this.game.inst(slot, d.id) : null;
      const equipped = this.save.loadout[slot] === d.id;
      const cls = ['eq-row'];
      if (!owned) cls.push('locked');
      if (equipped) cls.push('equipped');
      let art = null;
      if (slot === 'ship') art = spriteBox(shipSprite(d), 32);
      list.appendChild(h('div', {
        class: cls.join(' '),
        onClick: () => { this.app.sfx('ui'); this.hangarSel = d.id; this.refresh(); },
      },
        art || h('div', { class: 'eq-ic', style: { background: (d.color || d.palette?.main || '#555') + '33', borderColor: d.color || d.palette?.main } }),
        h('div', { class: 'eq-main' },
          h('b', {}, d.name, ' ', qBadge(inst?.quality || d.quality)),
          h('span', {}, owned ? `${d.seriesName} · ${d.focus || d.playstyle || ''}` : '未获得 · ' + (d.unlock?.text || '')),
        ),
        h('div', { class: 'eq-side' },
          owned ? h('div', {}, 'Lv.' + inst.level + '/' + maxLevelOf(d, inst.quality)) : h('div', { style: { color: 'var(--tx3)' } }, '🔒'),
          h('div', { class: 'stars' }, STAR(inst?.stars ?? d.stars, 6)),
          equipped ? h('div', { style: { color: 'var(--gd)', fontSize: '9px' } }, '已装备') : null,
        ),
      ));
    }
    body.appendChild(list);

    return h('div', { class: 'screen' },
      this.head('机库', '战机 / 装甲 / 副武器 / 僚机 —— 四槽位同时生效', this.resBar()),
      body,
      pm?.from === 'prebattle' ? h('div', { class: 'sc-foot' },
        h('div', { class: 'spacer' }),
        h('button', { class: 'btn primary', onClick: () => { this.app.sfx('uiConfirm'); this.replace('prebattle', pm.pm); } }, '返回出击 ▶'),
      ) : null,
    );
  }

  equipDetail(slot, id) {
    const d = defOf(slot, id);
    const owned = this.game.isOwned(slot, id);
    const inst = owned ? this.game.inst(slot, id) : { id, level: 1, quality: d.quality, stars: d.stars };
    const cur = instStats(slot, inst);
    const box = h('div', { class: 'detail' });
    box.appendChild(h('h3', {}, d.name, ' ', qBadge(inst.quality), ' ', h('span', { class: 'stars' }, STAR(inst.stars, 6))));
    box.appendChild(h('div', { class: 'sub' }, `${d.seriesName}系列 · 第 ${d.tier} 阶 · ${d.focus || d.playstyle || ''}`));
    box.appendChild(h('div', { class: 'desc' }, d.desc));

    // 属性
    const sg = h('div', { class: 'statgrid' });
    if (slot === 'ship') {
      sg.appendChild(h('div', {}, '攻击', h('b', {}, fmt(Math.round(cur.atk)))));
      sg.appendChild(h('div', {}, '生命', h('b', {}, fmt(Math.round(cur.hp)))));
      sg.appendChild(h('div', {}, '速度', h('b', {}, Math.round(cur.speed))));
      sg.appendChild(h('div', {}, '判定半径', h('b', {}, cur.hitR.toFixed(1))));
    } else if (slot === 'armor') {
      sg.appendChild(h('div', {}, '生命加成', h('b', {}, '+' + fmt(Math.round(cur.hp)))));
      sg.appendChild(h('div', {}, '防御', h('b', {}, cur.defv.toFixed(1))));
    } else if (slot === 'secondary') {
      sg.appendChild(h('div', {}, '伤害', h('b', {}, fmt(Math.round(cur.dmg)))));
      sg.appendChild(h('div', {}, '频率', h('b', {}, cur.rate.toFixed(2) + '/s')));
      sg.appendChild(h('div', {}, '弹数', h('b', {}, cur.count)));
      sg.appendChild(h('div', {}, '行为', h('b', {}, d.behavior)));
    } else {
      sg.appendChild(h('div', {}, '伤害', h('b', {}, fmt(Math.round(cur.dmg)))));
      sg.appendChild(h('div', {}, '行为', h('b', {}, d.behavior)));
    }
    box.appendChild(sg);
    if (d.trait) box.appendChild(h('div', { class: 'trait' }, `【${d.trait.name}】${d.trait.desc}`));
    if (d.skill) box.appendChild(h('div', { class: 'trait' }, `【${d.skill.name}】${d.skill.desc}`));

    if (!owned) {
      box.appendChild(h('div', { class: 'cost bad' }, '未获得 · ', h('b', {}, d.unlock?.text || '通过关卡掉落获得')));
      return box;
    }

    // 换装对比
    const equipped = this.save.loadout[slot] === id;
    if (!equipped) {
      const now = this.game.stats();
      const nxt = this.game.previewStats(slot, id);
      const cmp = h('div', { class: 'statgrid' });
      const row = (k, a, b, f = (v) => fmt(Math.round(v))) => {
        const cls = b > a ? 'up' : b < a ? 'dn' : '';
        cmp.appendChild(h('div', { class: cls }, k, h('b', {}, `${f(a)} → ${f(b)}`)));
      };
      row('战力', now.power, nxt.power);
      row('攻击', now.atk, nxt.atk);
      row('生命', now.maxHp, nxt.maxHp);
      row('防御', now.def, nxt.def, (v) => v.toFixed(1));
      box.appendChild(h('div', { style: { fontSize: '10px', color: 'var(--tx2)', marginTop: '4px' } }, '换装后变化'));
      box.appendChild(cmp);
    }

    // 操作
    const cap = maxLevelOf(d, inst.quality);
    const lc = levelCost(slot, inst);
    const ar = advanceReq(slot, inst);
    const sr = starReq(slot, inst);
    const canLv = inst.level < cap;
    const costOk = this.game.isGod || (this.save.resources.coin >= lc.coin && this.save.resources[lc.matKey] >= lc.mat);
    box.appendChild(h('div', { class: 'cost' + (costOk ? '' : ' bad') },
      `升级消耗：金币 `, h('b', {}, fmt(lc.coin)), ` · ${matLabel(lc.matKey)} `, h('b', {}, lc.mat)));
    const btns = h('div', { style: { display: 'flex', gap: '5px', flexWrap: 'wrap', marginTop: '6px' } },
      h('button', { class: 'btn sm primary', disabled: !canLv, onClick: () => this.doUpgrade(slot, id, 1) }, canLv ? '升级 +1' : '等级已满'),
      h('button', { class: 'btn sm', disabled: !canLv, onClick: () => this.doUpgrade(slot, id, 10) }, '+10'),
      h('button', { class: 'btn sm', disabled: !canLv, onClick: () => this.doUpgradeMax(slot, id) }, '升到上限'),
      ar ? h('button', {
        class: 'btn sm gold', disabled: inst.level < ar.needLevel,
        onClick: () => this.doAdvance(slot, id),
      }, `进阶 → ${ar.to}`) : h('button', { class: 'btn sm', disabled: true }, '品质已满'),
      sr ? h('button', { class: 'btn sm', onClick: () => this.doStar(slot, id) }, `升星 ★${sr.to}`) : null,
      equipped ? h('button', { class: 'btn sm', disabled: true }, '已装备') :
        h('button', { class: 'btn sm gold', onClick: () => { this.app.sfx('uiConfirm'); this.game.equip(slot, id); this.toast('已装备 ' + d.name, 'gold'); this.refresh(); } }, '装备'),
    );
    box.appendChild(btns);
    if (ar) {
      box.appendChild(h('div', { class: 'cost' }, `进阶需求：Lv.${ar.needLevel} · 金币 `, h('b', {}, fmt(ar.coin)), ` · 碎片 `, h('b', {}, ar.frag), ` · 钻石 `, h('b', {}, ar.gem), ar.core ? h('span', {}, ` · 核心 `, h('b', {}, ar.core)) : null));
    }
    if (sr) box.appendChild(h('div', { class: 'cost' }, `升星需求：碎片 `, h('b', {}, sr.frag), ` · 金币 `, h('b', {}, fmt(sr.coin))));
    return box;
  }

  doUpgrade(slot, id, n) {
    const r = this.game.upgrade(slot, id, n);
    if (r.ok) { this.app.sfx('upgrade'); this.toast(`升级成功 +${r.done}`, 'good'); }
    else this.toast(r.err || '升级失败', 'bad');
    this.refresh();
  }
  doUpgradeMax(slot, id) {
    const r = this.game.upgradeMax(slot, id);
    if (r.done) { this.app.sfx('upgrade'); this.toast(`连续升级 +${r.done}`, 'good'); }
    else this.toast('资源不足或已满级', 'bad');
    this.refresh();
  }
  doAdvance(slot, id) {
    const r = this.game.advance(slot, id);
    if (r.ok) { this.app.sfx('unlock'); this.toast(`进阶成功 → ${r.to}`, 'gold'); }
    else this.toast(r.err, 'bad');
    this.refresh();
  }
  doStar(slot, id) {
    const r = this.game.addStar(slot, id);
    if (r.ok) { this.app.sfx('unlock'); this.toast(`升星成功 ★${r.to}`, 'gold'); }
    else this.toast(r.err, 'bad');
    this.refresh();
  }

  // ========================================================
  // 无尽 / Boss挑战 / 英雄 / 材料 / 每日 / 训练
  // ========================================================
  screen_endless() {
    const e = this.save.modes.endless;
    const body = h('div', { class: 'sc-body' },
      h('div', { class: 'detail' },
        h('h3', {}, '无尽模式'),
        h('div', { class: 'sub' }, '无限波次 · 每 6 波出现随机 Boss · 敌人组合与速度随波数提升'),
        h('div', { class: 'statgrid' },
          h('div', {}, '最高分', h('b', {}, fmt(e.bestScore))),
          h('div', {}, '评级', h('b', {}, endlessScoreTier(e.bestScore))),
          h('div', {}, '最远波次', h('b', {}, e.bestWave)),
          h('div', {}, '最高击杀', h('b', {}, e.bestKills)),
          h('div', {}, '游玩次数', h('b', {}, e.runs)),
        ),
        h('div', { class: 'desc' }, '奖励按分数与波次结算金币与碎片，可无限次挑战。'),
      ),
    );
    return h('div', { class: 'screen' }, this.head('无尽模式', '本地记录最高分 / 最远波次', this.resBar()), body,
      h('div', { class: 'sc-foot' }, h('div', { class: 'spacer' }),
        h('button', { class: 'btn primary lg', onClick: () => { this.app.sfx('uiConfirm'); this.show('prebattle', { mode: 'endless' }); } }, '开始 ▶')));
  }

  screen_bossrush(pm = {}) {
    const diff = pm.difficulty || 'normal';
    const seen = new Set(Object.keys(this.save.dex.bosses));
    const maxLevel = Math.max(2, this.save.unlockedLevel);
    const body = h('div', { class: 'sc-body' });
    body.appendChild(h('div', { style: { display: 'flex', gap: '5px', marginBottom: '8px' } },
      ...Object.entries(BOSS_RUSH_DIFF).map(([k, v]) => h('button', {
        class: 'btn sm' + (k === diff ? ' sel' : ''),
        onClick: () => { this.app.sfx('ui'); this.replace('bossrush', { ...pm, difficulty: k }); },
      }, `${v.name} ×${v.hpMul}HP`)),
    ));
    for (const p of BOSS_RUSH_PRESETS) {
      const rec = this.save.modes.bossrush.records[p.id + '_' + diff];
      const locked = p.id === 'all' ? this.save.unlockedLevel <= 96 && !this.save.finale.morganDefeated : false;
      body.appendChild(h('div', {
        class: 'modecard' + (locked ? ' locked' : ''),
        onClick: () => {
          if (locked) { this.toast('需要先通关主线 96 关', 'bad'); return; }
          this.app.sfx('ui');
          if (p.id === 'single') this.show('bossPick', { difficulty: diff });
          else this.app.prepareBossRush(p.id, diff);
        },
      },
        h('b', {}, p.name, h('span', { style: { color: 'var(--tx3)', fontSize: '10px' } }, ` · ${p.count} Boss`)),
        h('span', {}, p.desc),
        rec ? h('div', { class: 'rec' }, `最高分 ${fmt(rec.bestScore)} · 最快 ${fmtTime(rec.bestTime)} · 通关 ${rec.clears} 次${rec.noHit ? ' · 已无伤' : ''}`) : null,
      ));
    }
    body.appendChild(h('div', { class: 'desc' }, `已解锁可挑战 Boss：${BOSS_SCHEDULE.filter((s) => s.level <= maxLevel).length} / 48（已见过 ${seen.size} / 29 种）`));
    return h('div', { class: 'screen' }, this.head('BOSS 挑战', '重战主线见过的 Boss · 单体 / 连战 / Rush', this.resBar()), body);
  }

  screen_bossPick(pm) {
    const maxLevel = Math.max(2, this.save.unlockedLevel);

      list.appendChild(h('div', {

      },

  screen_material() {
    const body = h('div', { class: 'sc-body' });
    body.appendChild(h('div', { class: 'desc' }, `每日次数在本地日期变化时重置（今天：${todayStr()}）。上帝模式可忽略次数限制。`));
    for (const ch of MATERIAL_CHALLENGES) {
      const card = h('div', { class: 'detail', style: { padding: '8px 9px' } });
      card.appendChild(h('h3', {}, ch.name, h('span', { style: { fontSize: '10px', color: 'var(--tx2)' } }, ' · ' + ch.desc)));
      const row = h('div', { style: { display: 'flex', gap: '5px', marginTop: '5px', flexWrap: 'wrap' } });
      for (const t of ch.tiers) {
        const lvIdx = materialLevel(ch, t);
        const used = this.game.materialUsed(ch.id, t);
        const locked = this.save.unlockedLevel < lvIdx && !this.save.god;
        const out = used >= ch.dailyLimit && !this.save.god;
        row.appendChild(h('button', {
          class: 'btn sm' + (locked || out ? '' : ' primary'), disabled: locked || out,
          onClick: () => {
            this.app.sfx('uiConfirm');
            this.show('prebattle', {
              mode: 'material', level: lvIdx, matChallenge: ch.id, tier: t,
              matName: `${ch.name} T${t}`, matAmount: materialReward(ch, t),
            });
          },
        }, `T${t} · 第${lvIdx}关 · +${fmtShort(materialReward(ch, t))} (${used}/${ch.dailyLimit})`));
      }
      card.appendChild(row);
      body.appendChild(card);

    return h('div', { class: 'screen' }, this.head('材料挑战', '金币 / 经验 / 各类强化材料 · 每日轮换', this.resBar()), body);

  screen_dex(pm = {}) {
    const tab = pm.tab || 'ship';
    const body = h('div', { class: 'sc-body' });
    const dp = this.game.dexProgress();
    const tabs = h('div', { class: 'tabs' });
    for (const [k, n] of [['ship', '战机'], ['armor', '装甲'], ['secondary', '副武器'], ['drone', '僚机'], ['boss', 'BOSS'], ['enemy', '敌人']]) {
      tabs.appendChild(h('button', { class: 'btn sm' + (k === tab ? ' sel' : ''), onClick: () => { this.app.sfx('ui'); this.replace('dex', { tab: k }); } }, n));
    }
    body.appendChild(tabs);
    body.appendChild(h('div', { class: 'res-bar', style: { marginBottom: '8px' } },
      h('div', { class: 'res' }, '战机 ', h('b', {}, `${dp.ships.have}/${dp.ships.total}`)),
      h('div', { class: 'res' }, '装甲 ', h('b', {}, `${dp.armors.have}/${dp.armors.total}`)),
      h('div', { class: 'res' }, '副武 ', h('b', {}, `${dp.secondaries.have}/${dp.secondaries.total}`)),
      h('div', { class: 'res' }, '僚机 ', h('b', {}, `${dp.drones.have}/${dp.drones.total}`)),
      h('div', { class: 'res' }, 'BOSS ', h('b', {}, `${dp.bosses.have}/${dp.bosses.total}`)),
      h('div', { class: 'res' }, '敌人 ', h('b', {}, `${dp.enemies.have}/${dp.enemies.total}`)),
    ));

    if (tab === 'boss') {
      const grid = h('div', { class: 'dexgrid' });
      for (const key in BOSSES) {
        const b = BOSSES[key];
        const seen = this.save.dex.bosses[key];
        const levels = BOSS_SCHEDULE.filter((s) => s.boss === key).map((s) => s.level);
        grid.appendChild(h('div', { class: 'dexcard' + (seen ? '' : ' locked'), onClick: () => { this.app.sfx('ui'); this.show('bossInfo', { id: key }); } },
          h('div', { class: 'art' }, spriteBox(bossSprite(b), 50).firstChild || h('span')),
          h('b', {}, seen ? b.name : '？？？'),
          h('span', {}, seen ? `关卡 ${levels.join('/')}` : '未遭遇'),
        ));
      }
      body.appendChild(grid);
    } else if (tab === 'enemy') {
      const grid = h('div', { class: 'dexgrid' });
      for (const e of ENEMIES) {
        const seen = this.save.dex.enemies[e.id];
        grid.appendChild(h('div', { class: 'dexcard' + (seen ? '' : ' locked') },
          h('div', { class: 'art' }, spriteBox(enemySprite(e), 46).firstChild || h('span')),
          h('b', {}, seen ? e.name : '？？？'),
          h('span', {}, seen ? e.role : '未遭遇'),
        ));
      }
      body.appendChild(grid);
    } else {
      const list = h('div', { class: 'eq-list' });
      for (const d of ALL_BY_SLOT[tab]) {
        const owned = this.game.isOwned(tab, d.id);
        list.appendChild(h('div', { class: 'eq-row' + (owned ? '' : ' locked'), onClick: () => { this.app.sfx('ui'); this.hangarSlot = tab; this.hangarSel = d.id; this.show('hangar'); } },
          tab === 'ship' ? spriteBox(shipSprite(d), 32) : h('div', { class: 'eq-ic', style: { background: (d.color || '#555') + '33', borderColor: d.color } }),
          h('div', { class: 'eq-main' }, h('b', {}, owned ? d.name : '？？？', ' ', qBadge(d.quality)), h('span', {}, owned ? d.desc : d.unlock?.text || '未获得')),
          h('div', { class: 'eq-side' }, h('div', { class: 'stars' }, STAR(d.stars, 6))),
        ));
      }
      body.appendChild(list);
    }
    return h('div', { class: 'screen' }, this.head('图鉴', '收集进度与详细资料', this.resBar()), body);
  }

      body.appendChild(prt);
    }
    body.appendChild(h('div', { style: { fontSize: '11px', color: 'var(--tx2)', marginTop: '6px' } }, `全部招式（${Object.keys(b.moves).length}）`));
    const ml = h('div', { class: 'chal' });

  // ========================================================
  // 设置 / 存档
  // ========================================================
  screen_settings() {
    const s = this.save.settings;
    const body = h('div', { class: 'sc-body' });
    const slider = (label, key, min, max, step, fmtv = (v) => Math.round(v * 100) + '%') => {
      const val = h('span', { class: 'val' }, fmtv(s[key]));
      return h('div', { class: 'setrow' }, h('label', {}, label),
        h('input', {
          type: 'range', min, max, step, value: s[key],
          onInput: (e) => { s[key] = parseFloat(e.target.value); val.textContent = fmtv(s[key]); this.app.applySettings(); this.game.markDirty(); },
        }), val);
    };
    const toggle = (label, key, onChange) => {
      const sw = h('div', { class: 'switch' + (s[key] ? ' on' : '') }, h('i'));
      sw.addEventListener('click', () => {
        s[key] = !s[key];
        sw.className = 'switch' + (s[key] ? ' on' : '');
        this.app.sfx('ui'); this.app.applySettings(); this.game.markDirty();
        if (onChange) onChange();
      });
      return h('div', { class: 'setrow' }, h('label', {}, label), h('div', { class: 'spacer' }), sw);
    };
    body.appendChild(h('div', { class: 'detail' }, h('h3', {}, '音频'),
      slider('总音量', 'master', 0, 1, 0.05),
      slider('音乐', 'music', 0, 1, 0.05),
      slider('音效', 'sfx', 0, 1, 0.05),
      toggle('静音', 'muted'),
    ));
    const ctlSeg = h('div', { class: 'seg' });
    for (const [k, n, d] of [['pointer', '鼠标锁定', '像我的世界一样把鼠标吸入画面，移动即操控'], ['drag', '鼠标拖拽', '按住左键拖动战机'], ['keyboard', '纯键盘', 'WASD / 方向键']]) {
      ctlSeg.appendChild(h('button', {
        class: 'btn sm' + (s.control === k ? ' sel' : ''), title: d,
        onClick: () => { s.control = k; this.app.sfx('ui'); this.app.applySettings(); this.game.markDirty(); this.refresh(); },
      }, n));
    }
    body.appendChild(h('div', { class: 'detail' }, h('h3', {}, '操作'),
      h('div', { class: 'setrow' }, h('label', {}, '控制方式'), h('div', { class: 'spacer' }), ctlSeg),
      h('div', { class: 'desc' }, s.control === 'pointer' ? '鼠标锁定：进入战斗后点击画面即可锁定指针，移动鼠标直接操控战机，ESC 释放并暂停。'
        : s.control === 'drag' ? '鼠标拖拽：按住左键拖动战机，松开停止。' : '纯键盘：WASD 或方向键移动，Shift 精确移动。'),
      slider('鼠标灵敏度', 'sensitivity', 0.3, 2.5, 0.05, (v) => v.toFixed(2) + '×'),
      slider('战机纵向偏移', 'offsetY', 0, 60, 2, (v) => Math.round(v) + 'px'),
      h('div', { class: 'desc' }, '偏移让战机显示在指针上方，避免指针遮挡核心判定点。'),
    ));
    body.appendChild(h('div', { class: 'detail' }, h('h3', {}, '画面'),
      toggle('屏幕震动', 'shake'),
      slider('粒子数量', 'particles', 0.3, 1.5, 0.1, (v) => Math.round(v * 100) + '%'),
      toggle('始终显示核心判定点', 'showCore'),
      toggle('显示帧率', 'showFps'),
    ));
    body.appendChild(h('div', { class: 'detail' }, h('h3', {}, '开发者'),
      h('div', { class: 'desc' }, '上帝模式使用完全独立的测试存档，不会污染普通进度。快捷键 F1 打开面板。'),
      h('button', { class: 'btn sm', onClick: () => this.app.toggleGod() }, this.save.god ? '切回普通存档' : '切到上帝模式存档'),
    ));
    return h('div', { class: 'screen' }, this.head('设置', '所有设置立即生效并自动保存'), body);
  }

      setTimeout(() => this.ui.toast(`此环境无法长期保存（${how}）：请用「设置 → 存档管理」导出/导入存档`, 'bad'), 1600);
      console.warn('[save] 存储后端 =', saveStore.kind, '（file:// 直接打开时常见；用 npm start 或导出存档可解决）');
    }
    console.log('%c⚡ THUNDER REFORGED 已启动', 'color:#5fd0ff;font-weight:bold',
      `\n关卡 ${LEVELS.length} / 章节 ${CHAPTERS.length} / Boss 节点 ${BOSS_SCHEDULE.length} / Boss 原型 ${BOSS_LIST.length}`,
      `\n战机 ${SHIPS.length} / 装甲 ${ARMORS.length} / 副武器 ${SECONDARIES.length} / 僚机 ${DRONES.length} / 敌人 ${ENEMIES.length}`);
  }

  sfx(n, v) { this.audio.play(n, v); }

  /** 把运行状态写进 DOM，便于无 CDP 环境（file://、--dump-dom）做自检 */
  writeStatus(state) {
    let el = document.getElementById('tf-status');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tf-status';
      el.style.display = 'none';
      document.body.appendChild(el);
    }
    const errs = (window.__ERRORS__ || []).length;
    const cerr = (window.__CONSOLE_ERRORS__ || []).length;
    const d = document.documentElement.dataset;
    d.tfBoot = state;
    d.tfErrors = String(errs);
    d.tfConsoleErrors = String(cerr);
    d.tfStorage = saveStore.kind;
    d.tfScreen = this.ui?.cur?.name || '';
    d.tfFps = this.renderer ? this.renderer.fps.toFixed(0) : '0';
    el.textContent = `boot=${state} errors=${errs} consoleErrors=${cerr} storage=${saveStore.kind} screen=${d.tfScreen} fps=${d.tfFps} bundle=${window.__TF_BUNDLE__ ? 'single-file' : 'modules'}`;
  }

  applySettings() {
    const s = this.game.save.settings;
    this.audio.applySettings(s);
    if (this.renderer) {
      this.renderer.settings.shake = s.shake;
      this.renderer.settings.particles = s.particles;
      this.renderer.showFps = s.showFps;
    }
    this.input.offsetY = s.offsetY || 0;
    if (this.world) {
      this.world.god.showCore = s.showCore || this.godFlags.showCore;
      this.world.settings = s;
      this.world.particleQuality = Math.min(1, s.particles ?? 1);
    }
  }

  syncGod() {
    if (this.world) Object.assign(this.world.god, this.godFlags);
    if (this.renderer) this.renderer.settings.shake = this.game.save.settings.shake;
  }
  godRebuild() {
    if (!this.world) return;
    this.world.stats = this.game.stats();
    this.world.applyStats();
    this.ui.toast('已重新计算属性并重载武器', 'good');
  }

  // ==========================================================
  // 输入
  // ==========================================================
  /** 把 UI 覆盖层 / 提示层精确对齐到画布的屏幕矩形（含 letterbox 偏移） */
  syncOverlay() {
    const r = this.canvas.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    for (const el of [this.overlay, document.getElementById('toast'), this.hint]) {
      if (!el) continue;
      if (el === this.overlay) {
        el.style.left = r.left + 'px';
        el.style.top = r.top + 'px';
        el.style.width = r.width + 'px';
        el.style.height = r.height + 'px';
      } else if (el.id === 'toast') {
        el.style.left = (r.left + r.width / 2) + 'px';
        el.style.top = (r.top + 56 * (r.height / 800)) + 'px';
      } else {
        el.style.left = (r.left + r.width / 2) + 'px';
        el.style.bottom = (window.innerHeight - r.bottom + 60) + 'px';
      }
    }
  }

  bindInput() {
    const cv = this.canvas;
    window.addEventListener('resize', () => { this.renderer.resize(); this.syncOverlay(); });

    // 指针锁定
    cv.addEventListener('click', () => {
      const mode = this.game.save.settings.control;
      if (this.inBattle && !this.paused && mode === 'pointer' && !this.locked) {
        cv.requestPointerLock?.();
      }
    });
    document.addEventListener('pointerlockchange', () => {
      const was = this.locked;
      this.locked = document.pointerLockElement === cv;
      this.updateHint();
      // 用户按 ESC 释放指针 -> 自动暂停，避免战机失控
      if (was && !this.locked && this.inBattle && !this.paused) this.pauseGame();
    });
    document.addEventListener('pointerlockerror', () => { this.locked = false; this.updateHint(); });

    window.addEventListener('mousemove', (e) => {
      if (!this.inBattle || this.paused) return;
      const s = this.game.save.settings;
      const k = this.renderer.logicalPerPixel * (s.sensitivity || 1);
      if (this.locked) {
        this.input.dx += (e.movementX || 0) * k;
        this.input.dy += (e.movementY || 0) * k;
        this.input.useAbs = false;
      } else if (s.control === 'drag' && this.dragging) {
        const p = this.renderer.toLogical(e.clientX, e.clientY);
        this.input.absX = p.x; this.input.absY = p.y; this.input.useAbs = true;
      }
    });
    cv.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        this.dragging = true;
        if (this.game.save.settings.control === 'drag' && this.inBattle && !this.paused) {
          const p = this.renderer.toLogical(e.clientX, e.clientY);
          this.input.absX = p.x; this.input.absY = p.y; this.input.useAbs = true;
        }
      }
      if (e.button === 2 && this.inBattle && !this.paused) this.input.bomb = true;
    });
    window.addEventListener('mouseup', () => { this.dragging = false; this.input.useAbs = false; });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());

    // 键盘
    const keyMap = {
      ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
      ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    };
    window.addEventListener('keydown', (e) => {
      if (e.repeat) {
        if (keyMap[e.code]) e.preventDefault();
        return;
      }
      const k = keyMap[e.code];
      if (k) { this.input[k] = true; e.preventDefault(); return; }
      switch (e.code) {
        case 'ShiftLeft': case 'ShiftRight': this.input.focus = true; break;
        case 'Space': case 'KeyJ': case 'KeyK':
          if (this.inBattle && !this.paused) this.input.bomb = true;
          e.preventDefault();
          break;
        case 'Escape': case 'KeyP':
          if (this.inBattle) { this.paused ? this.resumeGame() : this.pauseGame(); }
          e.preventDefault();
          break;
        case 'F1':
          this.toggleGodPanel();
          e.preventDefault();
          break;
        case 'F2':
          this.godFlags.enabled = !this.godFlags.enabled;
          this.syncGod();
          this.ui.toast('上帝模式 ' + (this.godFlags.enabled ? '已启用' : '已停用'), this.godFlags.enabled ? 'good' : '');
          break;
        case 'F3':
          this.renderer.showFps = !this.renderer.showFps;
          break;
        case 'Backquote':
          if (this.inBattle) this.godStepOnce();
          break;
      }
    });
    window.addEventListener('keyup', (e) => {
      const k = keyMap[e.code];
      if (k) this.input[k] = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') this.input.focus = false;
    });

    // 失焦自动暂停
    window.addEventListener('blur', () => { if (this.inBattle && !this.paused) this.pauseGame(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.inBattle && !this.paused) this.pauseGame();
    });
    window.addEventListener('beforeunload', () => this.game.flush());
  }

  clearInputMotion() {
    this.input.dx = 0; this.input.dy = 0;
    this.input.useAbs = false;
    this.input.left = this.input.right = this.input.up = this.input.down = false;
    this.input.bomb = false;
  }

  updateHint() {
    const need = this.inBattle && !this.paused && this.game.save.settings.control === 'pointer' && !this.locked;
    this.hint.classList.toggle('hidden', !need);
  }

  // ==========================================================
  // 主循环
  // ==========================================================
  frame(t) {
    const raw = Math.min(0.1, (t - this.lastT) / 1000);
    this.lastT = t;
    const t0 = performance.now();

    // FPS
    this.fpsAcc += raw; this.fpsFrames++;
    if (this.fpsAcc >= 0.5) {
      this.renderer.fps = this.fpsFrames / this.fpsAcc;
      this.fpsAcc = 0; this.fpsFrames = 0;
    }

    if (this.world && !this.paused) {
      this.acc += raw;
      let steps = 0;
      while (this.acc >= DT && steps < 5) {
        this.world.step(DT);
        this.acc -= DT;
        steps++;
      }
      if (this.acc > DT * 6) this.acc = 0;
    } else if (this.stepQueue > 0 && this.world) {
      this.world.step(DT);
      this.stepQueue--;
    }

    if (this.world) {
      for (const s of this.world.drainSfx()) this.audio.play(s.name, s.vol);
      if (this.world.bgShift && this.world.bgShift !== this._bgShift) {
        this._bgShift = this.world.bgShift;
        this.applyBgShift(this.world.bgShift);
      }
      this.trainingTick(raw);
    }

    if (this._ovW !== this.renderer.rect?.w || this._ovH !== this.renderer.rect?.h) {
      this._ovW = this.renderer.rect?.w; this._ovH = this.renderer.rect?.h;
      this.syncOverlay();
    }
    this.renderer.update(raw, this.world);
    this.renderer.render(this.world, null);
    this.renderer.frameMs = performance.now() - t0;
    if (this.godPanel?.open) { /* 状态由定时器刷新 */ }
    requestAnimationFrame((tt) => this.frame(tt));
  }

  applyBgShift(kind) {
    const map = {
      usurper: { sky: ['#0a0a14', '#1a1a2e', '#2e2e4a'], nebula: '#4a4a7a', nebula2: '#2e2e52', star: '#d0d4ff', accent: '#8b8bff', fog: '#0a0a14', planet: '#4a4a7a', props: ['fortress'] },
      hera: { sky: ['#12081c', '#28123c', '#42205c'], nebula: '#7a3ac0', nebula2: '#4a2080', star: '#f0e0ff', accent: '#e0a8ff', fog: '#150a20', planet: '#6a34a0', props: ['node'] },
      morgan2: { sky: ['#18040a', '#38080e', '#561018'], nebula: '#a01a30', nebula2: '#6a0e20', star: '#ffd0d8', accent: '#ff5a4a', fog: '#200408', planet: '#a01a30', props: ['inferno'] },
      morgan3: { sky: ['#200004', '#500008', '#7a0212'], nebula: '#c8003a', nebula2: '#80001e', star: '#ffe0e8', accent: '#ff2a4a', fog: '#28000a', planet: '#c8003a', props: ['inferno', 'rift'] },
    };
    const th = map[kind];
    if (th) this.renderer.setTheme(th, 42);
  }

  onScreenChange(name) {
    if (name === 'menu') this.audio.playMusic('menu');
    if (name === 'ending') this.audio.playMusic('victory');
  }

  // ==========================================================
  // 战斗生命周期
  // ==========================================================
  startBattle(pm) {
    const s = this.game.save;
    const stats = this.game.stats();
    const cfg = {
      mode: pm.mode, level: pm.level || 1, stats,
      god: this.godFlags,
      revives: pm.mode === 'training' ? 999 : 2,
      particleQuality: Math.min(1, s.settings.particles ?? 1),
    };

    let rules = [];
    if (pm.mode === 'hero') {
      const hv = HERO_LEVELS[pm.heroIndex - 1];
      cfg.level = hv.baseLevel;
      cfg.hpMul = hv.hpMul;
      cfg.dmgMul = hv.dmgMul;
      rules = hv.rules;
      cfg.heroIndex = pm.heroIndex;
      cfg.extraBoss = hv.extraBoss;
    } else if (pm.mode === 'bossrush') {
      cfg.bossQueue = pm.bossQueue;
      cfg.level = pm.bossQueue[0]?.level || 1;
      cfg.dmgMul = BOSS_RUSH_DIFF[pm.difficulty].dmgMul;
      cfg.revives = 1;
    } else if (pm.mode === 'daily') {
      cfg.hpMul = pm.daily.hpMul;
      cfg.dmgMul = pm.daily.dmgMul;
      rules = pm.daily.rules;
    } else if (pm.mode === 'material') {
      cfg.hpMul = 0.9;
    }
    cfg.rules = rules;

    this.world = new World(cfg);
    this.world.settings = s.settings;
    this.world.input = this.input;
    this.world.god.showCore = s.settings.showCore;
    this.applyRules(rules);
    this.clearInputMotion();
    this.battleParams = pm;
    this.inBattle = true;
    this.paused = false;
    this.acc = 0;
    this._bgShift = null;
    this.ui.clear();

    // 背景主题
    const lv = LEVEL_MAP.get(cfg.level);
    this.renderer.setTheme(lv ? lv.theme : CHAPTERS[0].theme, cfg.level * 13 + 7);

    // 音乐
    const bossId = lv?.boss?.id || pm.bossQueue?.[0]?.boss;
    const music = pm.mode === 'bossrush' ? 'boss'
      : bossId === 'morgan' ? 'morgan'
        : bossId && BOSSES[bossId]?.music === 'bossFinal' ? 'bossFinal'
          : 'level';
    this.audio.playMusic(music);

    // 事件
    const w = this.world;
    w.bus.on('bossStart', ({ boss }) => {
      const m = boss.id === 'morgan' ? 'morgan' : boss.def.music === 'bossFinal' ? 'bossFinal' : 'boss';
      this.audio.playMusic(m);
    });
    w.bus.on('levelClear', (r) => this.onBattleEnd(r));
    w.bus.on('levelFailed', (r) => this.onBattleEnd(r));

    // 训练模式
    this.trainTarget = pm.mode === 'training' ? (pm.trainTarget || 'turret') : null;
    this.trainTimer = 0;

    this.updateHint();
    // 指针模式：提示点击锁定
    if (s.settings.control === 'pointer') this.hint.classList.remove('hidden');
  }

  applyRules(rules) {
    const w = this.world;
    if (!w) return;
    w.rules = new Set(rules || []);
    if (w.rules.has('noBomb')) w.player.bombs = 0;
    if (w.rules.has('lowHp')) { w.player.maxHp = Math.round(w.player.maxHp * 0.65); w.player.hp = w.player.maxHp; }
    if (w.rules.has('fastBullets')) w.god.bulletSpeedMul = Math.max(w.god.bulletSpeedMul, 1.25);
    if (w.rules.has('armorUp')) w.enemyDefBonus = 12;
    if (w.rules.has('bossRage')) w.bossCdScale = 0.7;
    if (w.rules.has('swarm')) w.swarmMul = 1.6;
  }

  trainingTick(dt) {
    if (!this.trainTarget || !this.world || this.world.mode !== 'training') return;
    this.trainTimer -= dt;
    if (this.trainTimer <= 0) {
      this.trainTimer = 4.0;
      if (this.world.enemies.count < 8) {
        this.world.spawnEnemy(this.trainTarget, FIELD_W * (0.25 + Math.random() * 0.5), -20, {});
      }
    }
  }

  onBattleEnd(result) {
    const pm = this.battleParams;
    this.releaseLock();
    this.audio.playMusic(result.win ? 'victory' : 'menu');
    this.audio.play(result.win ? 'levelClear' : 'levelFail', 1);
    let outcome = { rewards: {}, drops: [], unlocked: [], achievements: [] };
    if (pm.mode !== 'training') {
      outcome = this.game.recordResult(this.world.levelIndex, result, pm.mode, {
        heroIndex: pm.heroIndex, presetId: pm.presetId, difficulty: pm.difficulty,
        rewardMul: pm.difficulty ? BOSS_RUSH_DIFF[pm.difficulty].reward : 1,
        matChallenge: pm.matChallenge, matAmount: pm.matAmount, tier: pm.tier, daily: pm.daily,
      });
      this.game.flush();
    }
    this.inBattle = false;
    this.paused = true;
    this.updateHint();
    this.ui.show('result', { result, outcome, mode: pm.mode, level: this.world.levelIndex }, true);
  }

  pauseGame() {
    if (!this.inBattle) return;
    this.paused = true;
    this.clearInputMotion();
    this.releaseLock();
    this.updateHint();
    this.ui.show('pause', {}, true);
  }
  resumeGame() {
    if (!this.inBattle) return;
    this.paused = false;
    this.acc = 0;
    this.clearInputMotion();
    // 恢复后给短暂无敌，避免立即受击
    if (this.world?.player) this.world.player.invul = Math.max(this.world.player.invul, 0.9);
    this.ui.clear();
    this.updateHint();
    if (this.game.save.settings.control === 'pointer') this.canvas.requestPointerLock?.();
  }
  releaseLock() {
    if (document.pointerLockElement) document.exitPointerLock?.();
    this.locked = false;
  }
  restartBattle() {
    const pm = this.battleParams;
    if (!pm) { this.quitToMenu(); return; }
    this.startBattle(pm);
  }
  quitToMenu() {
    this.releaseLock();
    this.inBattle = false;
    this.paused = false;
    this.world = null;
    this.game.flush();
    this.renderer.setTheme(CHAPTERS[0].theme, 7);
    this.audio.playMusic('menu');
    this.ui.stack.length = 0;
    this.ui.show('menu', {}, true);
    this.updateHint();
  }
  reviveAndContinue() {
    if (!this.world) return;
    if (this.world.revives - this.world.revivesUsed <= 0) { this.ui.toast('没有复活次数', 'bad'); return; }
    this.world.revivePlayer();
    this.inBattle = true;
    this.paused = false;
    this.acc = 0;
    this.ui.clear();
    this.audio.playMusic(this.world.boss ? (this.world.boss.id === 'morgan' ? 'morgan' : 'boss') : 'level');
    this.updateHint();
    if (this.game.save.settings.control === 'pointer') this.canvas.requestPointerLock?.();
  }

  toggleGodPanel() {
    const open = this.godPanel.toggle();
    if (open) {
      this.godFlags.enabled = true;
      this.syncGod();
      if (this.inBattle && !this.paused) this.releaseLock();
    }
  }

  toggleGod() {
    const to = !this.game.save.god;
    this.game.switchProfile(to);
    this.applySettings();
    this.godFlags.enabled = to;
    this.syncGod();
    this.ui.stack.length = 0;
    this.ui.show('menu', {}, true);
    this.ui.toast(to ? '已切换到上帝模式独立存档（不影响普通进度）' : '已切回普通存档', to ? 'good' : '');
  }

  prepareBossRush(presetId, difficulty, bossLevel) {
    const q = buildBossQueue(presetId, { difficulty, maxLevel: Math.max(2, this.game.save.unlockedLevel), bossLevel });
    if (!q.length) { this.ui.toast('没有可挑战的 Boss', 'bad'); return; }
    this.ui.show('prebattle', { mode: 'bossrush', presetId, difficulty, bossQueue: q, level: q[0].level });
  }

  // ==========================================================
  // 上帝模式动作
  // ==========================================================
  godJumpLevel(n) {
    this.godFlags.enabled = true;
    const lv = LEVEL_MAP.get(clamp(n, 1, 96));
    this.startBattle({ mode: 'campaign', level: lv.index });
    this.ui.toast(`已跳转到 ${lv.name}`, 'good');
  }
  ensureWorld() {
    if (!this.world) {
      this.startBattle({ mode: 'training', level: 40, trainTarget: 'turret' });
    }
    return this.world;
  }
  godSpawnBoss(bossId) {
    const w = this.ensureWorld();
    const b = w.debugSpawnBoss(bossId, w.levelIndex);
    this.audio.playMusic(bossId === 'morgan' ? 'morgan' : BOSSES[bossId].music === 'bossFinal' ? 'bossFinal' : 'boss');
    this.ui.toast(`已生成 ${b.name}`, 'good');
    return b;
  }
  godSetBossPhase(i) {
    const w = this.world;
    if (!w?.boss) { this.ui.toast('当前没有 Boss', 'bad'); return; }
    const b = w.boss;
    const ph = b.def.phases[i];
    if (!ph) return;
    b.hp = Math.max(1, b.maxHp * Math.max(0.02, ph.at - 0.01));
    b.phaseIdx = Math.max(0, i - 1);
    // 触发正常的阶段切换流程
    w.debugKillBossTo ? null : null;
    b.hp = Math.max(1, b.maxHp * (ph.at - 0.005));
    const target = i;
    b.phaseIdx = target - 1 >= 0 ? target - 1 : 0;
    if (target === 0) { b.phaseIdx = 0; b.phase = b.def.phases[0]; }
    else {
      // 让 boss.js 的 checkPhase 自然触发
      w.damageBossFrom(1, null, b.x, b.y, 'debug');
    }
    this.ui.toast(`Boss 阶段 → P${i} ${ph.name}`, 'good');
  }
  godSetBossHp(frac) {
    const w = this.world;
    if (!w?.boss) { this.ui.toast('当前没有 Boss', 'bad'); return; }
    w.boss.hp = Math.max(1, Math.round(w.boss.maxHp * frac));
    w.damageBossFrom(1, null, w.boss.x, w.boss.y, 'debug');
    this.ui.toast(`Boss 生命 → ${(frac * 100).toFixed(0)}%`);
  }
  godForceMove(id) {
    const w = this.world;
    if (!w?.boss) { this.ui.toast('当前没有 Boss', 'bad'); return; }
    const ok = w.debugForceMove(id);
    this.ui.toast(ok ? `强制执行招式：${w.boss.def.moves[id].name}` : '该 Boss 没有此招式', ok ? 'good' : 'bad');
  }
  godKillBoss() {
    const w = this.world;
    if (!w?.boss) { this.ui.toast('当前没有 Boss', 'bad'); return; }
    w.debugKillBoss();
    this.ui.toast('Boss 已击破');
  }
  godResetBoss() {
    const w = this.world;
    if (!w?.boss) { this.ui.toast('当前没有 Boss', 'bad'); return; }
    const id = w.boss.id;
    w.boss = null;
    this.godSpawnBoss(id);
  }
  godBreakParts() {
    const w = this.world;
    if (!w?.boss) return;
    for (const p of w.boss.parts) {
      if (p.alive) { p.hp = 0; p.alive = false; p.deadT = 0; w.onBossPartDead(w.boss, p); }
    }
    this.ui.toast('已摧毁全部部件');
  }
  godRepairParts() {
    const w = this.world;
    if (!w?.boss) return;
    for (const p of w.boss.parts) { p.alive = true; p.hp = p.maxHp; p.deadT = 0; }
    w.boss.killOrder.length = 0;
    w.boss.partsKilled.length = 0;
    this.ui.toast('已修复全部部件');
  }
  godSpawnEnemy(id, n) {
    const w = this.ensureWorld();
    for (let i = 0; i < n; i++) {
      w.spawnEnemy(id, FIELD_W * (0.15 + 0.7 * Math.random()), -20 - i * 26, {});
    }
    this.ui.toast(`已生成 ${n} × ${ENEMIES.find((e) => e.id === id)?.name || id}`);
  }
  godClearEnemies() {
    const w = this.world;
    if (!w) return;
    let n = 0;
    for (const e of w.enemies.active) { if (e.alive) { w.despawnEnemy(e); n++; } }
    this.ui.toast(`已清除 ${n} 个敌人`);
  }
  godTogglePause() {
    if (!this.inBattle) return;
    this.paused = !this.paused;
    if (!this.paused) this.acc = 0;
    this.ui.toast(this.paused ? '已暂停（单步可用）' : '已恢复');
  }
  godStepOnce() {
    if (!this.world) return;
    this.paused = true;
    this.world.step(DT);
    for (const s of this.world.drainSfx()) this.audio.play(s.name, s.vol);
  }
  godSimulate(win, keepWorld) {
    const w = this.ensureWorld();
    if (win) {
      w.finish(true);
    } else {
      w.player.hp = 0;
      w.killPlayer();
    }
  }
  godSimulateDrops() {
    const w = this.ensureWorld();
    const types = ['power', 'shield', 'bomb', 'heal', 'coin'];
    types.forEach((t, i) => w.spawnItem(t, FIELD_W * (0.2 + i * 0.15), 200));
    this.ui.toast('已生成全部类型道具');
  }
  godSimulateEnding() {
    const s = this.game.save;
    s.finale.morganDefeated = true;
    s.finale.clearCount = (s.finale.clearCount || 0) + 1;
    s.levels['96'] = { stars: 3, bestScore: 9999999, boss: true, clears: 1, challenges: {} };
    s.unlockedLevel = 96;
    this.game.checkShipUnlocks();
    this.game.checkAchievements();
    this.game.flush();
    this.inBattle = false;
    this.paused = false;
    this.world = null;
    this.ui.show('ending', {}, true);
  }

  // ---------- 内置自检 ----------
  godVerifyStructure() {
    const errs = [];
    if (LEVELS.length !== 96) errs.push(`关卡总数 ${LEVELS.length} ≠ 96`);
    if (CHAPTERS.length !== 12) errs.push(`章节总数 ${CHAPTERS.length} ≠ 12`);
    for (const c of CHAPTERS) {
      const n = LEVELS.filter((l) => l.chapter === c.idx).length;
      if (n !== 8) errs.push(`${c.name} 关卡数 ${n} ≠ 8`);
    }
    const nodes = LEVELS.filter((l) => l.boss);
    if (nodes.length !== 48) errs.push(`Boss 节点 ${nodes.length} ≠ 48`);
    const cnt = { elite: 0, big: 0, final: 0 };
    for (const n of nodes) cnt[n.boss.node]++;
    if (cnt.elite !== 24) errs.push(`精英 ${cnt.elite} ≠ 24`);
    if (cnt.big !== 12) errs.push(`大 Boss ${cnt.big} ≠ 12`);
    if (cnt.final !== 12) errs.push(`章节 Boss ${cnt.final} ≠ 12`);
    if (LEVEL_MAP.get(80).boss.id !== 'usurperX') errs.push('第 80 关不是夺权者X');
    if (LEVEL_MAP.get(88).boss.id !== 'hera') errs.push('第 88 关不是赫拉之神');
    if (LEVEL_MAP.get(96).boss.id !== 'morgan') errs.push('第 96 关不是炼狱魔神摩根');
    for (const l of LEVELS) {
      if (l.waves.filter((wv) => wv.kind === 'formation').length < 4) errs.push(`第 ${l.index} 关波次过少`);
    }
    console.log('%c[自检] 关卡结构', 'color:#7dff86', errs.length ? errs : '全部通过', { levels: LEVELS.length, chapters: CHAPTERS.length, bossNodes: nodes.length, ...cnt });
    this.ui.toast(errs.length ? `关卡结构 ${errs.length} 项失败（见控制台）` : '关卡结构自检全部通过 ✔', errs.length ? 'bad' : 'good');
    return errs;
  }
  godVerifyBosses() {
    const errs = [];
    const stats = this.game.stats();
    let phasesOk = 0;
    for (const s of BOSS_SCHEDULE) {
      try {
        const w = new World({ level: s.level, stats, seed: 7, god: { ...this.godFlags, enabled: true, invincible: true, noBossIntro: true } });
        w.input = {};
        w.state = 'bossWarn'; w.bossWarnT = 0.02;
        w.runner.wi = w.runner.waves.length; w.runner.pending.length = 0; w.runner.done = true;
        const seen = new Set();
        w.bus.on('bossPhase', (e) => seen.add(e.phase));
        let dead = false;
        for (let i = 0; i < 60 * 90; i++) {
          w.step(DT);
          if (w.boss && !w.boss.dead) w.boss.hp = Math.max(1, w.boss.hp - w.boss.maxHp / (60 * 18));
          if (w.state === 'clear') { dead = true; break; }
        }
        const def = BOSSES[s.boss];
        if (!dead) errs.push(`L${s.level} ${def.name}: 未能击破`);
        if (seen.size < def.phases.length - 1) errs.push(`L${s.level} ${def.name}: 阶段 ${seen.size}/${def.phases.length - 1}`);
        else phasesOk++;
      } catch (e) {
        errs.push(`L${s.level} ${s.boss}: ${e.message}`);
      }
    }
    console.log('%c[自检] 48 Boss 节点', 'color:#7dff86', errs.length ? errs : '全部通过', `阶段完整 ${phasesOk}/48`);
    this.ui.toast(errs.length ? `Boss 自检 ${errs.length} 项失败（见控制台）` : '48 个 Boss 全部生成/换阶/击破 ✔', errs.length ? 'bad' : 'good');
    return errs;
  }
  godVerifyEquip() {
    const errs = [];
    const snapshot = JSON.stringify(this.game.save);
    try {
      this.game.godUnlockAll();
      // 每条战机线弹道不同
      const scripts = new Set();
      for (const sh of SHIPS) scripts.add(sh.script);
      if (scripts.size < 5) errs.push(`战机武器脚本仅 ${scripts.size} 种`);
      // 副武器行为不同
      const secB = new Set(SECONDARIES.map((s) => s.behavior));
      if (secB.size < 5) errs.push(`副武器行为仅 ${secB.size} 种`);
      const drB = new Set(DRONES.map((s) => s.behavior));
      if (drB.size < 5) errs.push(`僚机行为仅 ${drB.size} 种`);
      // 四槽位同时生效
      const st = this.game.stats();
      if (!(st.atk > 0 && st.maxHp > 0 && st.secDmg > 0 && st.droneDmg > 0)) errs.push('四槽位未同时生效');
      // 升级/进阶
      for (const slot of SLOTS) {
        const id = Object.keys(this.game.save.owned[slot])[0];
        const before = this.game.inst(slot, id).level;
        this.game.upgrade(slot, id, 3);
        if (this.game.inst(slot, id).level <= before) errs.push(`${slot} 升级无效`);
        this.game.upgradeMax(slot, id);
        const r = this.game.advance(slot, id);
        if (!r.ok) errs.push(`${slot} 进阶失败: ${r.err}`);
      }
    } catch (e) { errs.push(e.message); }
    console.log('%c[自检] 装备系统', 'color:#7dff86', errs.length ? errs : '全部通过');
    // 恢复
    this.game.sm.import(snapshot);
    this.game.save = this.game.sm.data;
    this.ui.toast(errs.length ? `装备自检 ${errs.length} 项失败` : '装备系统自检通过 ✔（已恢复存档）', errs.length ? 'bad' : 'good');
    return errs;
  }
  godVerifyPools() {
    const stats = this.game.stats();
    const w = new World({ level: 60, stats, seed: 3, god: { enabled: true, invincible: true } });
    w.input = {};
    const marks = [];
    for (let r = 0; r < 3; r++) {
      for (let i = 0; i < 60 * 40; i++) w.step(DT);
      marks.push(w.entityCounts().total);
    }
    const ps = w.poolStats();
    const grow = marks[2] - marks[0];
    const errs = [];
    if (grow > 300) errs.push(`实体数持续增长 ${marks.join(' → ')}`);
    for (const k in ps) if (ps[k].created > 4000) errs.push(`${k} 池创建过多 ${ps[k].created}`);
    if (w.bus.listenerCount() > 20) errs.push(`事件监听过多 ${w.bus.listenerCount()}`);
    console.log('%c[自检] 对象池/内存', 'color:#7dff86', errs.length ? errs : '全部通过', { marks, pools: ps });
    this.ui.toast(errs.length ? `池检查 ${errs.length} 项异常` : `对象池稳定 ✔ 实体 ${marks.join('/')}`, errs.length ? 'bad' : 'good');
    return errs;
  }
}

const app = new App();
window.__APP__ = app;
app.boot().catch((e) => {
  console.error('[boot] 启动失败', e);
  const st = document.getElementById('bootStatus');
  if (st) { st.textContent = '启动失败：' + e.message; st.style.color = '#ff6b7a'; }
});

};
