<!DOCTYPE html>
<html lang="zh-CN" data-standalone="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- 单文件构建：双击即可运行，无需服务器。存档见「设置 → 存档管理」可导出/导入。 -->
<title>雷霆战机 · 复刻 THUNDER REFORGED</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070c18'/%3E%3Cpath d='M16 3l4 9h-3l3 8h-3l3 9-8-11h3l-3-7h3z' fill='%235fd0ff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   雷霆战机复刻 —— UI 样式（科幻街机风，深底 + 青金强调色）
   ============================================================ */
:root {
  --bg0: #04060c;
  --bg1: #080d18;
  --bg2: #0e1626;
  --panel: rgba(12, 20, 34, 0.94);
  --panel2: rgba(18, 28, 46, 0.92);
  --line: rgba(110, 180, 255, 0.28);
  --line2: rgba(110, 180, 255, 0.14);
  --cy: #5fd0ff;
  --cy2: #9fe4ff;
  --gd: #ffd45a;
  --rd: #ff5a7a;
  --gn: #7dff86;
  --pu: #c48bff;
  --tx: #dce8f8;
  --tx2: #8fa8c8;
  --tx3: #5f7391;
  --mono: "DINAlternate-Bold", "SF Mono", Menlo, Consolas, monospace;
  --cn: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, #0d1830 0%, #04060c 70%);
  color: var(--tx); font-family: var(--cn); user-select: none;
}
#app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage {
  position: relative; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
#game {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  box-shadow: 0 0 0 1px rgba(110, 180, 255, 0.2), 0 0 60px rgba(30, 90, 180, 0.28);
  background: #04060c; cursor: crosshair;
}
/* UI 覆盖层：由 App.syncOverlay() 精确同步到画布的屏幕矩形上。
   注意必须给出明确的 left/top/width/height，否则内部 .screen 的 inset:0
   会相对一个 0×0 的容器定位，界面将完全不可见。 */
#overlay {
  position: fixed; pointer-events: none;
  left: 0; top: 0; width: 100%; height: 100%;
  display: block; z-index: 40;
}
#overlay > * { pointer-events: auto; }
.hidden { display: none !important; }

/* ---------- 启动画面 ---------- */
#boot {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #0e1c38 0%, #04060c 70%);
  transition: opacity 0.5s;
}
#boot.done { opacity: 0; pointer-events: none; }
.boot-inner { text-align: center; }
.boot-logo { font-family: var(--mono); font-size: 44px; font-weight: 800; letter-spacing: 6px; color: #fff; text-shadow: 0 0 24px rgba(95, 208, 255, 0.7); }
.boot-logo span { display: block; font-size: 20px; letter-spacing: 12px; color: var(--cy); margin-top: 4px; }
.boot-sub { margin-top: 12px; font-size: 13px; color: var(--tx2); letter-spacing: 2px; }
.boot-bar { width: 260px; height: 4px; margin: 26px auto 10px; background: rgba(255, 255, 255, 0.1); }
.boot-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cy), var(--gd)); transition: width 0.2s; }
.boot-status { font-size: 11px; color: var(--tx3); font-family: var(--mono); }

/* ---------- 通用面板 ---------- */
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(4, 8, 16, 0.96) 0%, rgba(6, 12, 24, 0.99) 100%);
  overflow: hidden;
}
.screen.sheet { background: rgba(4, 8, 16, 0.9); backdrop-filter: blur(3px); }
/* alive：让画布上的视差星空透过界面（主菜单更有原版氛围） */
.screen.alive { background: linear-gradient(180deg, rgba(4, 8, 16, 0.52) 0%, rgba(5, 10, 20, 0.74) 42%, rgba(4, 8, 16, 0.9) 100%); }
.sc-head {
  flex: 0 0 auto; padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(20, 36, 62, 0.9), rgba(8, 14, 26, 0.6));
}
.sc-title { font-family: var(--mono); font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #fff; }
.sc-title small { display: block; font-size: 10px; letter-spacing: 1px; color: var(--tx2); font-weight: 400; margin-top: 2px; }
.sc-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 16px; }
.sc-body::-webkit-scrollbar { width: 5px; }
.sc-body::-webkit-scrollbar-thumb { background: rgba(110, 180, 255, 0.3); }
.sc-foot { flex: 0 0 auto; padding: 8px 12px 10px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.spacer { flex: 1 1 auto; }

/* ---------- 按钮 ---------- */
.btn {
  position: relative; font-family: var(--cn); font-size: 13px; font-weight: 600;
  color: var(--tx); background: linear-gradient(180deg, rgba(38, 62, 100, 0.9), rgba(18, 30, 52, 0.9));
  border: 1px solid var(--line); padding: 9px 14px; cursor: pointer;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  transition: all 0.12s; letter-spacing: 1px; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: linear-gradient(180deg, rgba(60, 100, 160, 0.95), rgba(28, 48, 82, 0.95)); border-color: var(--cy); color: #fff; transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #2a7fbf, #12405f); border-color: var(--cy2); color: #fff; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #3fa0e8, #1a5a86); box-shadow: 0 0 18px rgba(95, 208, 255, 0.4); }
.btn.gold { background: linear-gradient(180deg, #b8862a, #6a4a10); border-color: var(--gd); color: #fff; }
.btn.gold:hover:not(:disabled) { background: linear-gradient(180deg, #e0a83a, #8a6018); box-shadow: 0 0 18px rgba(255, 212, 90, 0.4); }
.btn.danger { background: linear-gradient(180deg, #a02a44, #5a1024); border-color: var(--rd); }
.btn.ghost { background: rgba(255, 255, 255, 0.04); }
.btn.sm { font-size: 11px; padding: 6px 10px; }
.btn.lg { font-size: 15px; padding: 12px 20px; }
.btn.wide { width: 100%; }
.btn.sel { border-color: var(--gd); background: linear-gradient(180deg, rgba(120, 90, 20, 0.9), rgba(60, 44, 8, 0.9)); color: #fff; }

/* ---------- 主菜单 ---------- */
.menu-wrap { display: flex; flex-direction: column; height: 100%; }
.menu-logo { text-align: center; padding: 26px 0 8px; }
.menu-logo .t1 { font-family: var(--mono); font-size: 34px; font-weight: 800; letter-spacing: 4px; color: #fff; text-shadow: 0 0 22px rgba(95, 208, 255, 0.65); }
.menu-logo .t2 { font-size: 12px; letter-spacing: 8px; color: var(--cy); margin-top: 2px; }
.menu-logo .t3 { font-size: 10px; letter-spacing: 2px; color: var(--tx3); margin-top: 6px; font-family: var(--mono); }
.menu-pilot {
  margin: 6px 14px 10px; padding: 8px 10px; border: 1px solid var(--line2); background: var(--panel);
  display: flex; align-items: center; gap: 10px; font-size: 11px;
}
.menu-pilot .lv { font-family: var(--mono); font-size: 18px; color: var(--gd); font-weight: 800; }
.menu-pilot .bar { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.1); }
.menu-pilot .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cy), var(--gd)); }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 0 14px; }
.menu-grid .btn { padding: 11px 8px; font-size: 12.5px; }
.menu-grid .full { grid-column: 1 / -1; }
.menu-foot { margin-top: auto; padding: 10px 14px 12px; font-size: 9.5px; color: var(--tx3); text-align: center; line-height: 1.7; font-family: var(--mono); }

/* ---------- 资源条 ---------- */
.res-bar { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; }
.res { display: flex; align-items: center; gap: 3px; padding: 3px 7px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line2); }
.res b { color: #fff; font-weight: 700; }
.res.coin i { color: var(--gd); }
.res.gem i { color: var(--cy); }
.res.frag i { color: var(--pu); }
.res.core i { color: var(--rd); }
.res i { font-style: normal; }

/* ---------- 章节地图 ---------- */
.chapter {
  margin-bottom: 8px; border: 1px solid var(--line2); background: var(--panel);
  overflow: hidden; transition: border-color 0.15s;
}
.chapter.locked { opacity: 0.42; }
.chapter.open { border-color: var(--cy); }
.ch-head { display: flex; align-items: center; gap: 9px; padding: 9px 11px; cursor: pointer; }
.ch-head:hover { background: rgba(95, 208, 255, 0.06); }
.ch-rom { font-family: var(--mono); font-size: 19px; font-weight: 800; width: 30px; text-align: center; }
.ch-name { flex: 1; }
.ch-name b { font-size: 13.5px; display: block; }
.ch-name span { font-size: 10px; color: var(--tx2); }
.ch-stars { font-family: var(--mono); font-size: 11px; color: var(--gd); }
.ch-levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 0 9px 9px; }
.lvcard {
  border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.035); padding: 6px 4px;
  cursor: pointer; text-align: center; transition: all 0.12s; position: relative;
}
.lvcard:hover { border-color: var(--cy); background: rgba(95, 208, 255, 0.1); }
.lvcard.locked { opacity: 0.3; cursor: not-allowed; }
.lvcard.boss { border-color: rgba(255, 90, 122, 0.5); }
.lvcard.boss.final { border-color: rgba(255, 212, 90, 0.65); background: rgba(255, 212, 90, 0.07); }
.lvcard .n { font-family: var(--mono); font-size: 13px; font-weight: 800; }
.lvcard .t { font-size: 8.5px; color: var(--tx2); margin-top: 1px; height: 11px; overflow: hidden; }
.lvcard .st { font-size: 9px; color: var(--gd); letter-spacing: -1px; margin-top: 1px; height: 11px; }
.lvcard .tag { position: absolute; top: -1px; right: -1px; font-size: 7px; padding: 1px 3px; background: var(--rd); color: #fff; font-family: var(--mono); }
.lvcard .tag.f { background: var(--gd); color: #2a1a00; }
.lvcard .tag.b { background: #c07bff; }

/* ---------- 机库 ---------- */
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tabs .btn { flex: 1; }
.eq-list { display: grid; grid-template-columns: 1fr; gap: 5px; }
.eq-row {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px;
  border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.035); cursor: pointer;
}
.eq-row:hover { border-color: var(--cy); background: rgba(95, 208, 255, 0.08); }
.eq-row.equipped { border-color: var(--gd); background: rgba(255, 212, 90, 0.08); }
.eq-row.locked { opacity: 0.38; }
.eq-ic { width: 34px; height: 34px; flex: 0 0 auto; border: 1px solid var(--line2); position: relative; }
.eq-ic canvas { position: absolute; inset: 0; margin: auto; image-rendering: pixelated; }
.eq-main { flex: 1; min-width: 0; }
.eq-main b { font-size: 12.5px; display: block; }
.eq-main span { font-size: 9.5px; color: var(--tx2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eq-side { text-align: right; font-family: var(--mono); font-size: 10px; }
.q { font-family: var(--mono); font-size: 9px; padding: 1px 4px; border: 1px solid; display: inline-block; }
.stars { color: var(--gd); font-size: 9px; letter-spacing: -1px; }
.detail { border: 1px solid var(--line); background: var(--panel2); padding: 10px; margin-bottom: 8px; }
.detail h3 { font-size: 15px; margin-bottom: 2px; }
.detail .sub { font-size: 10px; color: var(--tx2); margin-bottom: 8px; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 11px; margin: 8px 0; }
.statgrid div { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line2); padding-bottom: 2px; }
.statgrid b { font-family: var(--mono); color: #fff; }
.statgrid .up b { color: var(--gn); }
.statgrid .dn b { color: var(--rd); }
.desc { font-size: 10.5px; color: var(--tx2); line-height: 1.6; margin: 6px 0; }
.trait { font-size: 10.5px; color: var(--cy2); background: rgba(95, 208, 255, 0.08); border-left: 2px solid var(--cy); padding: 5px 7px; margin: 5px 0; line-height: 1.5; }
.cost { font-family: var(--mono); font-size: 10.5px; color: var(--tx2); margin: 5px 0; }
.cost b { color: #fff; }
.cost.bad b { color: var(--rd); }

/* ---------- 战前 ---------- */
.pre-hero { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.pre-hero .art { width: 74px; height: 74px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.4); position: relative; flex: 0 0 auto; }
.pre-hero .art canvas { position: absolute; inset: 0; margin: auto; image-rendering: pixelated; }
.slot4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 8px 0; }
.slotcard { border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.04); padding: 5px; text-align: center; cursor: pointer; }
.slotcard:hover { border-color: var(--cy); }
.slotcard .lb { font-size: 9px; color: var(--tx3); }
.slotcard .nm { font-size: 10px; margin-top: 2px; height: 26px; overflow: hidden; line-height: 1.3; }
.slotcard .lv { font-family: var(--mono); font-size: 9px; color: var(--gd); }
.chal { display: flex; flex-direction: column; gap: 4px; }
.chal div { font-size: 10.5px; padding: 4px 7px; background: rgba(255, 255, 255, 0.04); border-left: 2px solid var(--tx3); }
.chal div.done { border-left-color: var(--gn); color: var(--gn); }

/* ---------- 结算 ---------- */
.result-wrap { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; padding: 20px; }
.res-title { font-family: var(--mono); font-size: 40px; font-weight: 800; letter-spacing: 4px; }
.res-title.win { color: var(--gd); text-shadow: 0 0 26px rgba(255, 212, 90, 0.6); }
.res-title.lose { color: var(--rd); text-shadow: 0 0 26px rgba(255, 90, 122, 0.6); }
.res-stars { font-size: 34px; color: var(--gd); letter-spacing: 6px; margin: 6px 0 4px; height: 42px; }
.res-stars .off { color: rgba(255, 255, 255, 0.16); }
.res-table { width: 100%; max-width: 340px; margin: 10px 0; font-size: 11.5px; }
.res-table div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted var(--line2); }
.res-table b { font-family: var(--mono); color: #fff; }
.rewards { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.rw { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border: 1px solid var(--line); background: rgba(95, 208, 255, 0.08); }
.rw.gold { border-color: var(--gd); background: rgba(255, 212, 90, 0.1); color: var(--gd); }
.drops { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 340px; margin: 6px 0; }
.drop { font-size: 11px; padding: 5px 8px; border-left: 2px solid var(--pu); background: rgba(196, 139, 255, 0.08); }
.drop.dup { border-left-color: var(--tx3); color: var(--tx2); }

/* ---------- 暂停 ---------- */
.pause-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; padding: 24px; }
.pause-wrap h2 { font-family: var(--mono); font-size: 26px; letter-spacing: 5px; margin-bottom: 6px; }
.pause-wrap .btn { width: 210px; }

/* ---------- 设置 ---------- */
.setrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dotted var(--line2); font-size: 12px; }
.setrow label { flex: 0 0 96px; color: var(--tx2); font-size: 11px; }
.setrow input[type=range] { flex: 1; accent-color: #5fd0ff; }
.setrow .val { font-family: var(--mono); font-size: 10px; width: 38px; text-align: right; color: var(--gd); }
.seg { display: flex; gap: 3px; }
.seg .btn { padding: 5px 9px; font-size: 10.5px; }
.switch { width: 40px; height: 20px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.4); position: relative; cursor: pointer; }
.switch i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--tx3); transition: all 0.15s; }
.switch.on { border-color: var(--gn); }
.switch.on i { left: 22px; background: var(--gn); }

/* ---------- 图鉴 / 成就 ---------- */
.dexgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.dexcard { border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.035); padding: 6px 4px; text-align: center; position: relative; cursor: pointer; }
.dexcard.locked { opacity: 0.3; }
.dexcard .art { height: 52px; position: relative; }
.dexcard .art canvas { position: absolute; inset: 0; margin: auto; image-rendering: pixelated; max-width: 100%; max-height: 52px; }
.dexcard b { font-size: 9.5px; display: block; margin-top: 3px; }
.dexcard span { font-size: 8px; color: var(--tx2); }
.ach { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.035); margin-bottom: 4px; }
.ach.done { border-color: var(--gn); background: rgba(125, 255, 134, 0.07); }
.ach .ic { font-family: var(--mono); font-size: 15px; width: 22px; text-align: center; color: var(--tx3); }
.ach.done .ic { color: var(--gn); }
.ach b { font-size: 12px; display: block; }
.ach span { font-size: 9.5px; color: var(--tx2); }
.ach .rw2 { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--gd); text-align: right; }

/* ---------- 模式列表 ---------- */
.modecard { border: 1px solid var(--line2); background: var(--panel); padding: 9px 11px; margin-bottom: 6px; cursor: pointer; }
.modecard:hover { border-color: var(--cy); }
.modecard.locked { opacity: 0.4; cursor: not-allowed; }
.modecard b { font-size: 13px; display: block; }
.modecard span { font-size: 10px; color: var(--tx2); display: block; margin-top: 2px; line-height: 1.5; }
.modecard .rec { font-family: var(--mono); font-size: 9.5px; color: var(--gd); margin-top: 3px; }

/* ---------- Toast ---------- */
#toast { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
.toast {
  font-size: 11.5px; padding: 6px 12px; background: rgba(8, 16, 30, 0.95);
  border: 1px solid var(--cy); color: var(--cy2); font-family: var(--cn);
  animation: tin 0.25s ease-out; max-width: 300px; text-align: center;
}
.toast.good { border-color: var(--gn); color: var(--gn); }
.toast.bad { border-color: var(--rd); color: #ff9fb0; }
.toast.gold { border-color: var(--gd); color: var(--gd); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ---------- 指针提示 ---------- */
#pointerHint {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--cy2); background: rgba(6, 12, 24, 0.85);
  border: 1px solid var(--line); padding: 5px 12px; z-index: 30; pointer-events: none;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

/* ---------- 上帝模式面板 ---------- */
#godPanel {
  position: fixed; top: 0; right: 0; width: 336px; height: 100%; z-index: 150;
  background: rgba(4, 10, 6, 0.96); border-left: 2px solid #7dff86;
  font-family: var(--mono); font-size: 10.5px; color: #bfffc8;
  display: flex; flex-direction: column; overflow: hidden;
}
#godPanel .gp-head { padding: 8px 10px; border-bottom: 1px solid rgba(125, 255, 134, 0.3); display: flex; align-items: center; gap: 8px; }
#godPanel .gp-head b { font-size: 13px; color: #7dff86; letter-spacing: 2px; }
#godPanel .gp-body { flex: 1; overflow-y: auto; padding: 8px 10px 20px; }
#godPanel .gp-body::-webkit-scrollbar { width: 4px; }
#godPanel .gp-body::-webkit-scrollbar-thumb { background: rgba(125, 255, 134, 0.4); }
.gsec { margin-bottom: 10px; border: 1px solid rgba(125, 255, 134, 0.18); }
.gsec > h4 { font-size: 10.5px; padding: 4px 7px; background: rgba(125, 255, 134, 0.1); color: #7dff86; letter-spacing: 1px; cursor: pointer; display: flex; justify-content: space-between; }
.gsec > div { padding: 6px 7px; display: flex; flex-wrap: wrap; gap: 4px; }
.gsec.collapsed > div { display: none; }
.gbtn {
  font-family: var(--mono); font-size: 10px; padding: 3px 7px; cursor: pointer;
  background: rgba(125, 255, 134, 0.08); border: 1px solid rgba(125, 255, 134, 0.3); color: #bfffc8;
}
.gbtn:hover { background: rgba(125, 255, 134, 0.22); color: #fff; }
.gbtn.on { background: #2a7a34; border-color: #7dff86; color: #fff; }
.gbtn.wide { width: 100%; }

  fig8: (y = 150, ax = 140, ay = 46, freq = 0.32) => ({ type: 'fig8', y, ax, ay, freq }),
  chase: (y = 130, sp = 130, lag = 0.6) => ({ type: 'chase', y, speed: sp, lag }),
  orbit: (y = 170, r = 130, sp = 1.05) => ({ type: 'orbit', y, r, speed: sp }),
  blink: (y = 140, every = 2.0, range = 170) => ({ type: 'blink', y, every, range }),
  dive: (y = 120) => ({ type: 'dive', y }),
};

function B(cfg) {
  return {
    id: cfg.id,
    name: cfg.name,
    cls: cfg.cls, // elite | big | final
    hpBase: cfg.hpBase,
    def: cfg.def ?? 0,

    r: cfg.r,
    sprite: cfg.sprite,
    entrance: cfg.entrance ?? { type: 'descend', dur: 1.8 },

    move: cfg.move ?? MV.sway(),
    theme: cfg.theme,
    parts: cfg.parts ?? [],
    moves: cfg.moves,
    phases: cfg.phases,
    variants: cfg.variants ?? [],
    intro: cfg.intro ?? '',
    tactic: cfg.tactic ?? '',
    music: cfg.music ?? 'boss',
  };
}

class EndlessRunner {
  constructor(world) {
    this.world = world;
    this.t = 0;
    this.wave = 0;

      this.nextWaveT = 4;

      this.runner.waves.push({

    this.mode = cfg.mode || 'campaign';
    this.levelIndex = cfg.level || 1;
    this.level = LEVEL_MAP.get(this.levelIndex) || LEVEL_MAP.get(1);
    this.stats = cfg.stats;
    this.rng = new RNG(cfg.seed ?? ((Date.now() ^ 0x5f3759df) & 0x7fffffff));
    this.bus = new Bus();
    this.time = 0;
    this.frame = 0;
    this.timeScale = 1;
    this.paused = false;
    this.difficulty = cfg.difficulty || 1;

    // ---- 上帝模式开关（真实连接内部状态） ----
    this.god = Object.assign({
      enabled: false, invincible: false, oneHitKill: false, infiniteBomb: false,
      infiniteOd: false, infiniteShield: false, lockHp: false, showHitbox: false,
      showCore: true, showBulletPath: false, showParts: false, showPhaseVars: false,
      atkMul: 1, speedMul: 1, hitRMul: 1, enemyAtkMul: 1, enemyHpMul: 1,
      bulletSpeedMul: 1, enemySpeedMul: 1, gameSpeed: 1, dropMul: 1, waveMul: 1,
      fireMul: 1, noBossIntro: false,
    }, cfg.god || {});

    // ---- 对象池 ----
    this.pBullets = new Pool(newPBullet, resetPBullet, 256, 1400);
    this.eBullets = new Pool(newEBullet, resetEBullet, 512, 2600);
    this.enemies = new Pool(newEnemy, resetEnemyObj, 64, 220);
    this.items = new Pool(newItem, resetItem, 48, 260);
    this.particles = new Pool(newParticle, resetParticle, 512, 2200);
    this.floaters = new Pool(newFloater, resetFloater, 64, 260);
    this.lasers = new Pool(newLaser, resetLaser, 16, 64);
    this.columns = new Pool(newColumn, resetColumn, 16, 48);
    this.rows = new Pool(newRow, resetRow, 8, 24);
    this.zones = new Pool(newZone, resetZone, 16, 48);
    this.nodes = new Pool(newNode, resetNode, 12, 40);
    this.afterimages = new Pool(newAfterimage, resetAfterimage, 8, 24);
    this.warnLines = new Pool(newWarnLine, resetWarnLine, 8, 40);
    this.allPools = [this.pBullets, this.eBullets, this.enemies, this.items, this.particles,
      this.floaters, this.lasers, this.columns, this.rows, this.zones, this.nodes,
      this.afterimages, this.warnLines];

    this.rules = new Set(cfg.rules || []);
    this.enemyDefBonus = 0;
    this.bossCdScale = 1;
    this.swarmMul = 1;
    this.extraBossId = cfg.extraBoss || null;
    this.boss2 = null;
    this.nodeLinks = [];
    this.streamers = [];
    this.absorbField = null;
    this.wallLaneSeed = this.rng.int(0, 8);

    // ---- 数值缩放 ----
    const lv = this.levelIndex;
    this.hpScale = (this.level?.hpScale ?? 1) * (cfg.hpMul || 1) * this.difficulty;
    this.enemyBulletDamage = BASE_BULLET_DMG * (this.level?.dmgScale ?? 1) * (cfg.dmgMul || 1) * Math.sqrt(this.difficulty);
    this.nodeHpScale = enemyHpScale(lv) * 0.9;
    this.scoreScale = 1 + (lv - 1) * 0.06;

    // ---- 玩家 ----
    this.particleQuality = cfg.particleQuality ?? 1;
    this.player = makePlayer(this);
    this.applyStats();

    // ---- 关卡状态 ----
    this.state = 'ready';
    this.stateT = 0;
    this.score = 0;
    this.kills = 0;
    this.totalSpawned = 0;
    this.shotsFired = 0;
    this.bombsUsed = 0;
    this.damageTaken = 0;
    this.hitCount = 0;
    this.maxCombo = 0;
    this.itemsPicked = 0;
    this.odTimeTotal = 0;
    this.odMaxStreak = 0;
    this.odStreak = 0;
    this.revives = cfg.revives ?? 2;
    this.revivesUsed = 0;
    this.elapsed = 0;
    this.boss = null;
    this.bossQueue = (cfg.bossQueue || []).slice();
    this.bossesDefeated = 0;
    this.partsDestroyed = 0;
    this.result = null;
    this.screenShake = 0;
    this.flash = 0;
    this.hitStop = 0;
    this.slowMo = 0;
    this.bgShift = null;
    this.tint = null;
    this.announce = null;
    this.announceT = 0;
    this.eventText = null;
    this.eventT = 0;
    this.progress = 0;
    this.bossWarnT = 0;
    this.sfxQueue = [];
    this.perf = { steps: 0 };

    this.setupMode();
  }

  // ==========================================================
  // 模式初始化
  // ==========================================================
  setupMode() {
    const cfg = this.cfg;
    if (this.mode === 'endless') {
      this.endless = new EndlessRunner(this);
      this.runner = this.endless.runner;
      this.state = 'waves';
    } else if (this.mode === 'bossrush') {
      this.runner = new WaveRunner(this, []);
      this.state = 'bossWarn';
      this.bossWarnT = 1.6;
    } else if (this.mode === 'training') {
      this.runner = new WaveRunner(this, []);
      this.state = 'waves';
    } else {
      // campaign / hero / material
      const waves = this.level.waves;
      const opts = {
        hpMul: 1, speedMul: cfg.enemySpeedMul || 1, dmgMul: 1,
        countMul: 1 + (Math.ceil(this.levelIndex / 8) - 1) * 0.1,
      };
      if (this.mode === 'hero') { opts.hpMul = 1.45; opts.speedMul = 1.18; }
      if (this.rules.has('swarm')) { this.swarmMul = 1.6; }
      if (this.mode === 'material') { opts.hpMul = 0.85; }
      this.runner = new WaveRunner(this, waves, opts);
      this.state = 'waves';
      this.announceLevel();
    }
  }

  announceLevel() {
    this.announce = this.level ? this.level.name : '';
    this.announceT = 2.6;
  }

  applyStats() {
    const p = this.player;
    const st = this.stats;
    p.maxHp = Math.round(st.maxHp);
    p.hp = p.maxHp;
    p.speed = st.speed;
    p.hitR = st.hitR * this.god.hitRMul;
    rebuildWeapons(this);
    initDrones(this);
  }

  get godAtkMul() { return this.god.enabled ? this.god.atkMul : 1; }
  get godFireMul() { return this.god.enabled ? this.god.fireMul : 1; }

  // ==========================================================
  // 主循环
  // ==========================================================
  step(dt = DT) {
    if (this.paused) return;
    const gs = this.god.enabled ? this.god.gameSpeed : 1;
    let scale = this.timeScale * gs;
    if (this.hitStop > 0) { this.hitStop -= dt; scale *= 0.12; }
    if (this.slowMo > 0) { this.slowMo -= dt; scale *= 0.35; }
    const d = dt * scale;
    this.time += d;
    this.elapsed += d;
    this.frame++;
    this.perf.steps++;

    if (this.announceT > 0) this.announceT -= d;
    if (this.eventT > 0) this.eventT -= d;
    if (this.screenShake > 0) this.screenShake = Math.max(0, this.screenShake - d * 3.2);
    if (this.flash > 0) this.flash = Math.max(0, this.flash - d * 4);

    // 完成/失败态仍推进特效
    if (this.state === 'clear' || this.state === 'failed') {
      this.stateT += d;
      this.stepParticles(d);
      this.stepFloaters(d);
      this.sweep();
      return;
    }

    this.stateT += d;
    this.stepPlayer(d);
    if (this.player.alive) {
      stepPlayerWeapons(this, d);
      stepSecondary(this, d);
    }
    stepDrones(this, d);
    this.stepLevelFlow(d);
    this.stepEnemies(d);
    if (this.boss) stepBoss(this, this.boss, d);
    if (this.boss2) stepBoss(this, this.boss2, d);
    this.stepAfterimages(d);
    stepStreamers(this, d);
    this.stepPBullets(d);
    this.stepEBullets(d);
    this.stepLasers(d);
    this.stepColumns(d);
    this.stepRows(d);
    this.stepZones(d);
    this.stepNodes(d);
    this.stepWarnLines(d);
    this.stepItems(d);
    this.stepParticles(d);
    this.stepFloaters(d);
    this.stepAbsorb(d);
    this.sweep();
  }

  sweep() {
    for (const p of this.allPools) p.sweep();
  }

  // ==========================================================
  // 关卡流程
  // ==========================================================
  stepLevelFlow(dt) {
    if (this.mode === 'endless') {
      this.endless.step(dt);
      this.progress = clamp(this.endless.wave / 60, 0, 1);
      return;
    }
    if (this.mode === 'training') { this.runner.step(dt); return; }

    if (this.state === 'waves') {
      this.runner.step(dt);
      const total = Math.max(1, this.runner.waves.length);
      this.progress = clamp(this.runner.wi / total, 0, 0.999) * (this.level?.boss ? 0.4 : 1);
      const cleared = this.runner.done && this.enemies.count <= 1;
      if (this.runner.done && (cleared || this.runner.t > (this.level?.duration ?? 90) + 12)) {
        if (this.mode === 'bossrush' || this.level?.boss) {
          this.state = 'bossWarn';
          this.bossWarnT = this.god.noBossIntro ? 0.2 : 2.4;
          this.sfx('bossWarn', 1);
          this.bus.emit('bossWarn', {});
        } else {
          this.finish(true);
        }
      }
    } else if (this.state === 'bossWarn') {
      this.bossWarnT -= dt;
      if (this.bossWarnT <= 0) this.startBoss();
    } else if (this.state === 'boss') {
      this.runner.step(dt);
      if (this.boss) {
        this.progress = this.level?.boss
          ? 0.4 + 0.6 * (1 - this.boss.hp / this.boss.maxHp)
          : 1 - this.boss.hp / this.boss.maxHp;
      }
    }
  }

  startBoss() {
    let bossId, hp, variant;
    if (this.mode === 'bossrush') {
      const nxt = this.bossQueue.shift();
      if (!nxt) { this.finish(true); return; }
      bossId = nxt.boss;
      variant = nxt.variant;
      hp = nxt.hp;
      this.announce = BOSSES[bossId].name;
      this.announceT = 2.4;
    } else {
      const b = this.level.boss;
      if (!b) { this.finish(true); return; }
      bossId = b.id;
      variant = b.variant;
      hp = b.hp;
      if (this.mode === 'hero') hp = Math.round(hp * 1.5);
    }
    hp = Math.round(hp * (this.god.enabled ? this.god.enemyHpMul : 1) * this.difficulty);
    this.boss = createBoss(this, bossId, this.levelIndex, { variant, hp });
    if (this.bossCdScale !== 1) this.boss.cdMulVariant = (this.boss.cdMulVariant || 1) * this.bossCdScale;
    // 英雄模式「双精英」：同时出现第二个精英 Boss
    if (this.extraBossId && this.mode === 'hero') {
      this.boss2 = createBoss(this, this.extraBossId, this.levelIndex, { variant: 1, hp: Math.round(hp * 0.55) });
      this.boss2.homeX = this.W * 0.26;
      this.boss2.entranceDur += 0.8;
      this.boss.homeX = this.W * 0.74;
      if (this.bossCdScale !== 1) this.boss2.cdMulVariant = (this.boss2.cdMulVariant || 1) * this.bossCdScale;
    }
    if (this.god.enabled && this.god.noBossIntro) {
      this.boss.state = 'idle';
      this.boss.x = this.boss.homeX;
      this.boss.y = this.boss.homeY;
      this.boss.entranceAlpha = 1;
    }
    this.state = 'boss';
    this.stateT = 0;
    this.bus.emit('bossStart', { boss: this.boss });
  }

  spawnEndlessBoss(wave) {
    const pool = BOSS_SCHEDULE.filter((s) => s.level <= Math.min(96, 8 + wave * 2));
    const pick = this.rng.pick(pool.length ? pool : BOSS_SCHEDULE.slice(0, 4));
    const hp = Math.round(refDps(Math.min(96, wave * 2 + 4)) * (pick.node === 'final' ? 30 : pick.node === 'big' ? 22 : 15) * (1 + wave * 0.05));
    this.boss = createBoss(this, pick.boss, Math.min(96, wave * 2 + 4), { hp, variant: 1 });
    this.announce = 'WARNING · ' + this.boss.name;
    this.announceT = 2.4;
    this.sfx('bossWarn', 1);
    this.bus.emit('bossStart', { boss: this.boss });
  }

  finish(win) {
    if (this.state === 'clear' || this.state === 'failed') return;
    this.state = win ? 'clear' : 'failed';
    this.stateT = 0;
    this.result = this.buildResult(win);
    this.bus.emit(win ? 'levelClear' : 'levelFailed', this.result);
  }

  buildResult(win) {
    const lv = this.level;
    const killRate = this.totalSpawned ? this.kills / this.totalSpawned : 1;
    let stars = 0;
    if (win) {
      stars = 1;
      if (lv && this.score >= lv.stars.score) stars++;
      else if (killRate >= 0.9) stars++;
      const hpFrac = this.player.maxHp ? this.player.hp / this.player.maxHp : 0;
      if (this.revivesUsed === 0 && (hpFrac >= (lv?.stars.hpKeep ?? 0.6) || this.hitCount === 0)) stars++;
      stars = clamp(stars, 1, 3);
    }
    return {
      win, mode: this.mode, level: this.levelIndex,
      score: Math.round(this.score), kills: this.kills, totalSpawned: this.totalSpawned,
      killRate, stars, time: this.elapsed, maxCombo: this.maxCombo,
      hitCount: this.hitCount, damageTaken: Math.round(this.damageTaken),
      bombsUsed: this.bombsUsed, revivesUsed: this.revivesUsed,
      itemsPicked: this.itemsPicked, partsDestroyed: this.partsDestroyed,
      bossesDefeated: this.bossesDefeated,
      odTime: this.odTimeTotal, odMaxStreak: this.odMaxStreak,
      hpLeft: this.player.hp, maxHp: this.player.maxHp,
      endlessWave: this.endless?.wave || 0,
      noHit: this.hitCount === 0, noBomb: this.bombsUsed === 0,
    };
  }

  // ==========================================================
  // 玩家
  // ==========================================================
  stepPlayer(dt) {
    const p = this.player;
    const st = this.stats;
    if (p.respawnT > 0) {
      p.respawnT -= dt;
      p.y = lerp(this.H + 40, this.H - 130, clamp(1 - p.respawnT / 1.2, 0, 1));
      p.invul = Math.max(p.invul, 0.4);
      if (p.respawnT <= 0) p.alive = true;
    }
    if (p.invul > 0) p.invul -= dt;
    if (p.hurtFlash > 0) p.hurtFlash -= dt;
    if (p.shieldFlash > 0) p.shieldFlash -= dt;

    // ---- 暴走 ----
    if (p.od > 0) {
      if (!(this.god.enabled && this.god.infiniteOd)) p.od -= dt;
      this.odTimeTotal += dt;
      this.odStreak += dt;
      this.odMaxStreak = Math.max(this.odMaxStreak, this.odStreak);
      if (p.od <= 0) {
        p.od = 0;
        rebuildWeapons(this);
        this.bus.emit('odEnd', {});
        this.sfx('odEnd', 0.9);
        this.flash = Math.max(this.flash, 0.3);
      }
    } else {
      this.odStreak = 0;
      if (this.god.enabled && this.god.infiniteOd) this.activateOverdrive(true);
    }
    if (this.god.enabled && this.god.infiniteBomb) p.bombs = Math.max(p.bombs, 9);
    if (this.god.enabled && this.god.infiniteShield) p.shieldHp = Math.max(p.shieldHp, p.maxHp * 0.4);
    if (this.god.enabled && this.god.lockHp) p.hp = p.maxHp;

    // ---- 恢复 ----
    if (st.regen > 0 && p.alive && p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + st.regen * dt);
    // 金刚之盾：周期护盾
    if (st.contactShield) {
      p.autoShieldT -= dt;
      if (p.autoShieldT <= 0) {
        p.autoShieldT = 25;
        this.grantShield(0.22);
      }
    }

    // ---- 连击窗口 ----
    if (p.comboT > 0) {
      p.comboT -= dt;
      if (p.comboT <= 0) p.combo = 0;
    }

    // ---- 移动 ----
    const inp = this.input || {};
    const spd = p.speed * (this.god.enabled ? this.god.speedMul : 1);
    let dx = 0, dy = 0;
    // 指针锁定 / 拖拽增量
    if (inp.dx || inp.dy) {
      dx += inp.dx || 0;
      dy += inp.dy || 0;
      inp.dx = 0; inp.dy = 0;
    }
    // 绝对目标（非锁定拖拽）
    if (inp.useAbs && inp.absX != null) {
      const tx = inp.absX, ty = inp.absY - (inp.offsetY || 0);
      const k = Math.min(1, dt * 22);
      dx += (tx - p.x) * k;
      dy += (ty - p.y) * k;
    }
    // 键盘
    let kx = 0, ky = 0;
    if (inp.left) kx -= 1;
    if (inp.right) kx += 1;
    if (inp.up) ky -= 1;
    if (inp.down) ky += 1;
    if (kx || ky) {
      const len = Math.hypot(kx, ky) || 1;
      dx += (kx / len) * spd * dt;
      dy += (ky / len) * spd * dt;
    }
    if (inp.focus) { dx *= 0.45; dy *= 0.45; }

    // 吸引场
    if (this.absorbField) {
      const f = this.absorbField;
      const ax = f.x - p.x, ay = f.y - p.y;
      const len = Math.hypot(ax, ay) || 1;
      if (len < f.radius) {
        const k = (1 - len / f.radius) * f.strength * dt * (f.invert ? -1 : 1);
        dx += (ax / len) * k;
        dy += (ay / len) * k;
      }
    }

    p.px = p.x; p.py = p.y;
    p.x = clamp(p.x + dx, 14, this.W - 14);
    p.y = clamp(p.y + dy, 56, this.H - 18);
    p.vx = (p.x - p.px) / Math.max(1e-5, dt);
    p.vy = (p.y - p.py) / Math.max(1e-5, dt);
    p.tilt = lerp(p.tilt, clamp(p.vx / 420, -1, 1), Math.min(1, dt * 9));
    p.engineT += dt;

    // ---- 炸弹 ----
    if (inp.bomb) {
      inp.bomb = false;
      this.useBomb();
    }

    // ---- 接触伤害（敌人机体） ----
    if (p.alive && p.invul <= 0) {
      for (const e of this.enemies.active) {
        if (!e.alive) continue;
        const rr = e.r * 0.72 + p.hitR + 2;
        if (dist2(p.x, p.y, e.x, e.y) < rr * rr) {
          this.hurtPlayer(this.enemyBulletDamage * (e.def.contact || 1) * 1.4, 'contact');
          if (e.def.role === '自杀冲撞') this.damageEnemy(e, e.maxHp * 2, e.x, e.y, 'contact');
          break;
        }
      }
      for (const b of [this.boss, this.boss2]) {
        if (!b || b.dead || b.dying > 0 || b.state === 'entrance') continue;
        const rr = b.r * 0.62 + p.hitR;
        if (dist2(p.x, p.y, b.x, b.y) < rr * rr) { this.hurtPlayer(this.enemyBulletDamage * 1.8, 'contact'); break; }
      }
    }
  }

  hurtPlayer(dmg, src) {
    const p = this.player;
    const st = this.stats;
    if (!p.alive || p.respawnT > 0) return;
    if (p.invul > 0) return;
    if (this.god.enabled && this.god.invincible) { this.fxShieldPing(); return; }
    if (p.od > 0 && st.odIframe > 0 && p.odIframeLeft > 0) {
      p.odIframeLeft--;
      p.invul = 0.8;
      this.fxShieldPing();
      return;
    }

    // 护盾优先吸收
    if (p.shieldHp > 0) {
      p.shieldHp -= dmg;
      p.shieldFlash = 0.3;
      p.invul = 0.7 + st.invulBonus;
      this.screenShake = Math.max(this.screenShake, 0.35);
      this.sfx('shieldHit', 0.8);
      if (p.shieldHp <= 0) {
        p.shieldHp = 0;
        this.fxShieldBreak();
        this.sfx('shieldBreak', 1);
        this.bus.emit('shieldBreak', {});
      }
      return;
    }

    let d = dmg;
    d *= 1 - st.hitReduce;
    d *= 100 / (100 + st.def * 1.7);
    const frac = p.hp / p.maxHp;
    if (st.lowHpReduce > 0 && frac < 0.3) d *= 1 - st.lowHpReduce;
    if (this.god.enabled) d *= this.god.enemyAtkMul;
    d = Math.max(1, d);

    // 免死
    if (p.hp - d <= 0 && st.lastStand > 0 && !p.lastStandUsed) {
      p.lastStandUsed = true;
      p.hp = Math.max(1, Math.round(p.maxHp * (st.lastStandHeal || 0.01)));
      p.invul = 2.2 + st.invulBonus;
      this.flash = 1;
      this.screenShake = 0.8;
      this.floater(p.x, p.y - 30, '免死', '#ffe98a', 16);
      this.sfx('lastStand', 1);
      this.bus.emit('lastStand', {});
      return;
    }

    p.hp -= d;
    this.damageTaken += d;
    this.hitCount++;
    p.hurtFlash = 0.4;
    p.invul = 1.0 + st.invulBonus;
    this.screenShake = Math.max(this.screenShake, 0.6);
    this.flash = Math.max(this.flash, 0.35);
    this.hitStop = 0.06;
    this.fxPlayerHit();
    this.sfx('playerHit', 1);
    this.floater(p.x, p.y - 26, '-' + Math.round(d), '#ff6b7a', 14);
    this.bus.emit('playerHit', { dmg: d });

    if (p.od > 0 && !st.keepOdOnHit) {
      p.od *= 0.6;
    }

    if (p.hp <= 0) {
      p.hp = 0;
      // 凤凰复燃
      if (st.phoenix > 0 && !p.phoenixUsed) {
        p.phoenixUsed = true;
        p.hp = Math.round(p.maxHp * st.phoenix);
        p.invul = 2.6;
        this.flash = 1;
        this.floater(p.x, p.y - 40, '凤凰复燃', '#ffb545', 18);
        this.fxPhoenix();
        this.sfx('phoenix', 1);
        return;
      }
      this.killPlayer();
    }
  }

  killPlayer() {
    const p = this.player;
    p.alive = false;
    p.hp = 0;
    p.od = 0;
    this.screenShake = 1.2;
    this.flash = 1;
    this.slowMo = 0.7;
    this.fxPlayerDeath();
    this.sfx('playerDeath', 1);
    this.bus.emit('playerDead', { revives: this.revives - this.revivesUsed });
    this.finish(false);
  }

  revivePlayer() {
    const p = this.player;
    this.revivesUsed++;
    p.alive = true;
    p.hp = p.maxHp;
    p.shieldHp = p.maxHp * 0.3;
    p.invul = 3.0;
    p.respawnT = 1.2;
    p.weaponLevel = Math.max(1, p.weaponLevel - 1);
    p.od = 0;
    p.lastStandUsed = false;
    p.phoenixUsed = false;
    rebuildWeapons(this);
    this.clearEnemyBullets(true);
    this.state = this.boss && !this.boss.dead ? 'boss' : (this.level?.boss && this.runner.done ? 'bossWarn' : 'waves');
    if (this.state === 'bossWarn') this.bossWarnT = 1.2;
    this.result = null;
    this.bus.emit('revived', {});
  }

  useBomb() {
    const p = this.player;
    if (!p.alive || p.respawnT > 0) return false;
    if (this.rules.has('noBomb')) { this.sfx('deny', 0.5); this.floater(p.x, p.y - 34, '本关禁用炸弹', '#ff6b7a', 12); return false; }
    if (p.bombs <= 0) { this.sfx('deny', 0.5); return false; }
    if (!(this.god.enabled && this.god.infiniteBomb)) p.bombs--;
    this.bombsUsed++;
    p.invul = Math.max(p.invul, 1.4);
    this.flash = 1;
    this.screenShake = 1.0;
    this.slowMo = 0.35;
    this.sfx('bomb', 1);
    this.bus.emit('bomb', {});
    // 清弹
    this.clearEnemyBullets(false);
    // 大范围毁灭普通敌人
    const dmg = this.stats.atk * 46 * this.godAtkMul;
    for (const e of this.enemies.active) {
      if (!e.alive) continue;
      this.damageEnemy(e, dmg, e.x, e.y, 'bomb');
    }
    for (const nd of this.nodes.active) this.damageNode(nd, dmg);
    // Boss 有限伤害
    for (const b of [this.boss, this.boss2]) {
      if (b && !b.dead && b.dying <= 0 && b.state !== 'entrance') {
        const bd = this.stats.atk * 16 * this.stats.bossDmgMul * this.godAtkMul;
        const applied = damageBoss(this, b, bd, null, true);
        if (applied > 0) this.floater(b.x, b.y - b.r - 12, '-' + Math.round(applied), '#ffd45a', 15);
      }
    }
    this.fxBombWave();
    return true;
  }

  clearEnemyBullets(silent) {
    let n = 0;
    for (const b of this.eBullets.active) {
      if (b.__dead) continue;
      this.killEBullet(b, !silent);
      n++;
    }
    for (const l of this.lasers.active) l.__dead = true;
    this.eBullets.sweep();
    this.lasers.sweep();
    if (!silent && n > 0) this.addScore(n * 12);
    return n;
  }

  grantShield(frac) {
    const p = this.player;
    p.shieldHp = Math.min(p.maxHp * 0.6, p.shieldHp + p.maxHp * (frac || 0.25));
    p.shieldMax = Math.max(p.shieldMax, p.shieldHp);
    p.shieldFlash = 0.4;
    this.sfx('shieldGain', 0.9);
    this.bus.emit('shieldGain', {});
  }

  activateOverdrive(silent) {
    const p = this.player;
    const base = 12 + this.stats.odBonus;
    if (p.od > 0) p.od = Math.min(base * 1.8, p.od + base * 0.45);
    else {
      p.od = base;
      p.odIframeLeft = this.stats.odIframe || 0;
      rebuildWeapons(this);
      if (!silent) {
        this.flash = Math.max(this.flash, 0.6);
        this.sfx('overdrive', 1);
        this.floater(p.x, p.y - 40, 'OVERDRIVE!', '#ffd45a', 20);
        this.bus.emit('odStart', {});
      }
    }
  }

  pickPower() {
    const p = this.player;
    if (p.weaponLevel < 3) {
      p.weaponLevel++;
      rebuildWeapons(this);
      this.floater(p.x, p.y - 36, 'POWER ' + p.weaponLevel, '#7dff86', 16);
      this.sfx('powerUp', 0.9);
      this.bus.emit('powerUp', { level: p.weaponLevel });
    } else {
      this.activateOverdrive(false);
    }
  }

  // ==========================================================
  // 敌人
  // ==========================================================
  spawnEnemy(id, x, y, opt = {}) {
    const def = ENEMY_MAP.get(id);
    if (!def) { console.warn('[world] unknown enemy', id); return null; }
    const e = this.enemies.get();
    e.uid = uidCounter++;
    e.def = def;
    e.x = x; e.y = y; e.px = x; e.py = y;
    e.r = def.r;
    const hpMul = (opt.hpMul || 1) * this.hpScale * (this.god.enabled ? this.god.enemyHpMul : 1);
    e.maxHp = Math.max(1, Math.round(def.hp * hpMul));
    e.hp = e.maxHp;
    e.shieldMax = def.shield ? Math.round(def.shield * hpMul) : 0;
    e.shield = e.shieldMax;
    e.speedMul = (opt.speedMul || 1) * (this.god.enabled ? this.god.enemySpeedMul : 1);
    e.dmgMul = opt.dmgMul || 1;
    e.side = opt.side || null;
    e.alive = true;
    e.guaranteed = opt.guaranteed || null;
    e.elite = !!opt.elite;
    e.fromBoss = !!opt.fromBoss;
    e.hitFlash = 0;
    e.fadeT = 0;
    e.buffed = 0;
    e.defBonus = 0;
    e.parts = def.parts
      ? def.parts.map((p) => ({
        id: p.id, name: p.name, ox: p.ox, oy: p.oy, r: p.r,
        maxHp: Math.max(1, Math.round(p.hp * hpMul)), hp: Math.max(1, Math.round(p.hp * hpMul)),
        alive: true, x: x + p.ox, y: y + p.oy, hitFlash: 0,
        timers: (p.fire || []).map((f) => ({ t: (f.every ?? 2) * this.rng.float(0.3, 1), spec: f })),
      }))
      : null;
    initEnemy(this, e);
    this.totalSpawned++;
    return e;
  }

  despawnEnemy(e) {
    e.alive = false;
    e.__dead = true;
  }

  stepEnemies(dt) {
    const arr = this.enemies.active;
    for (let i = 0; i < arr.length; i++) {
      const e = arr[i];
      if (!e.alive) continue;
      e.px = e.x; e.py = e.y;
      if (e.hitFlash > 0) e.hitFlash -= dt;
      stepEnemy(this, e, dt);
    }
  }

  damageEnemy(e, dmg, hx, hy, src) {
    if (!e.alive) return 0;
    if (this.god.enabled && this.god.oneHitKill) dmg = e.maxHp * 10 + (e.shield || 0) * 10;
    let d = dmg * (100 / (100 + (e.def.def + (e.defBonus || 0) + this.enemyDefBonus) * 1.5));
    if (this.stats.vsDefBonus > 1 && e.def.def > 0) d *= this.stats.vsDefBonus;
    // 部件
    if (e.parts) {
      let hit = null;
      for (const p of e.parts) {
        if (!p.alive) continue;
        if (dist2(hx, hy, p.x, p.y) < p.r * p.r * 1.3) { hit = p; break; }
      }
      if (hit) {
        hit.hp -= d;
        hit.hitFlash = 0.1;
        if (hit.hp <= 0) {
          hit.alive = false;
          this.partsDestroyed++;
          this.fxExplosion(hit.x, hit.y, 20, e.def.sprite?.pal);
          this.addScore(120 * this.scoreScale);
          this.sfx('partBreak', 0.7);
        }
        d *= 0.4;
      }
    }
    if (e.shield > 0) {
      e.shield -= d;
      e.hitFlash = 0.08;
      this.fxHit(hx, hy, false);
      if (e.shield <= 0) {
        e.shield = 0;
        this.fxShieldPop(e);
        this.sfx('shieldBreak', 0.5);
      }
      return d;
    }
    e.hp -= d;
    e.hitFlash = 0.1;
    if (src !== 'beam' || this.frame % 3 === 0) this.fxHit(hx, hy, true);
    if (e.hp <= 0) this.killEnemy(e, src);
    return d;
  }

  killEnemy(e, src) {
    if (!e.alive) return;
    e.alive = false;
    e.__dead = true;
    this.kills++;
    const p = this.player;
    p.combo++;
    p.comboT = 2.6;
    this.maxCombo = Math.max(this.maxCombo, p.combo);
    const comboMul = 1 + Math.min(1.5, p.combo * 0.015);
    this.addScore(e.def.score * this.scoreScale * comboMul);
    this.fxExplosion(e.x, e.y, e.def.big ? 40 : 22, e.def.sprite?.pal);
    this.sfx(e.def.big ? 'explodeBig' : 'explode', e.def.big ? 0.85 : 0.5);
    if (e.def.big) { this.screenShake = Math.max(this.screenShake, 0.3); }
    // 恢复
    if (this.stats.killHeal > 0 && p.alive) p.hp = Math.min(p.maxHp, p.hp + this.stats.killHeal);
    // 分裂
    if (e.def.id === 'splitter') {
      for (let i = 0; i < 3; i++) {
        const sp = this.spawnEnemy('spawnling', e.x + this.rng.float(-16, 16), e.y, { hpMul: 1 });
        if (sp) sp.vy = 180;
      }
    }
    // 掉落
    this.rollDrop(e);
    this.bus.emit('enemyKilled', { enemy: e, src });
  }

  rollDrop(e) {
    const dropMul = this.stats.dropMul * (this.god.enabled ? this.god.dropMul : 1);
    if (e.guaranteed) {
      const gt = (e.guaranteed === 'power' && this.rules.has('noPower')) || (e.guaranteed === 'shield' && this.rules.has('noShield')) ? 'coin' : e.guaranteed;
      this.spawnItem(gt, e.x, e.y);
      this.spawnItem('coin', e.x + 14, e.y + 6);
      return;
    }
    if (e.def.id === 'supply') {
      let t = this.rng.pick(['power', 'power', 'shield', 'bomb']);
      if ((t === 'power' && this.rules.has('noPower')) || (t === 'shield' && this.rules.has('noShield'))) t = 'bomb';
      this.spawnItem(t, e.x, e.y);
      return;
    }
    const w = (e.def.dropW || 1) * dropMul;
    const r = this.rng.next();
    if (r < 0.028 * w) { if (!this.rules.has('noPower')) this.spawnItem('power', e.x, e.y); else this.spawnItem('coin', e.x, e.y); }
    else if (r < 0.045 * w) { if (!this.rules.has('noShield')) this.spawnItem('shield', e.x, e.y); else this.spawnItem('coin', e.x, e.y); }
    else if (r < 0.055 * w) this.spawnItem('bomb', e.x, e.y);
    else if (r < 0.075 * w) this.spawnItem('heal', e.x, e.y);
    else if (r < 0.34 * w) this.spawnItem('coin', e.x, e.y);
  }

  addScore(v) {
    this.score += v * this.stats.scoreMul;
  }

  // ==========================================================
  // Boss 回调
  // ==========================================================
  onBossReady(boss) { this.bus.emit('bossReady', { boss }); }
  onBossWarn(boss, md) {
    this.bus.emit('bossWarnMove', { boss, move: md.name });
    this.sfx('warn', 0.5);
  }
  onBossMove(boss, md) {
    if (this.god.enabled && this.god.showPhaseVars) this.floater(boss.x, boss.y - boss.r - 20, md.name, '#ffd45a', 12);
    this.bus.emit('bossMove', { boss, move: md.name });
  }
  onBossPhase(boss, idx) {
    this.announce = boss.phase.name;
    this.announceT = 2.4;
    this.flash = Math.max(this.flash, 0.55);
    this.screenShake = Math.max(this.screenShake, 0.7);
    this.slowMo = 0.3;
    this.sfx('bossPhase', 1);
    if (boss.bgShift) this.bgShift = boss.bgShift;
    if (boss.tint) this.tint = boss.tint;
    if (this.stats.bossHeal > 0) this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.stats.bossHeal);
    this.bus.emit('bossPhase', { boss, phase: idx, name: boss.phase.name });
  }
  onBossPartDead(boss, part) {
    this.partsDestroyed++;
    this.fxPartBreak(part, boss);
    this.addScore(600 * this.scoreScale);
    this.sfx('partBreak', 0.9);
    this.screenShake = Math.max(this.screenShake, 0.5);
    if (this.stats.bombOnPart) this.player.bombs = Math.min(9, this.player.bombs + 1);
    if (part.onDeath === 'spawnBurst') {
      for (let i = 0; i < 3; i++) this.spawnEnemy('spawnling', part.x + this.rng.float(-20, 20), part.y, {});
    }
    this.bus.emit('bossPartDead', { boss, part: part.id });
  }
  onBossDying(boss) {
    this.clearEnemyBullets(true);
    this.screenShake = 1.2;
    this.flash = 0.8;
    this.slowMo = 0.9;
    this.sfx('bossDying', 1);
    this.bus.emit('bossDying', { boss });
  }
  onBossDead(boss) {
    this.bossesDefeated++;
    if (this.boss2 && boss === this.boss2) {
      this.addScore(boss.scoreValue);
      this.screenShake = 1.2; this.flash = 0.9; this.sfx('bossDead', 1);
      for (let i = 0; i < 3; i++) this.spawnItem(i === 0 ? 'power' : 'coin', boss.x + this.rng.float(-40, 40), boss.y);
      this.bus.emit('bossDead', { boss });
      this.boss2 = null;
      return;
    }
    if (this.boss2 && !this.boss2.dead) {
      // 主 Boss 先死：等第二个精英被击破再结算
      this.addScore(boss.scoreValue);
      this.screenShake = 1.2; this.flash = 1; this.sfx('bossDead', 1);
      this.bus.emit('bossDead', { boss });
      this.boss = this.boss2;
      this.boss2 = null;
      return;
    }
    this.addScore(boss.scoreValue);
    this.screenShake = 1.4;
    this.flash = 1;
    this.sfx('bossDead', 1);
    for (let i = 0; i < 5; i++) this.spawnItem(i === 0 ? 'power' : i === 1 ? 'shield' : 'coin', boss.x + this.rng.float(-50, 50), boss.y);
    this.bus.emit('bossDead', { boss });
    if (this.mode === 'bossrush') {
      this.boss = null;
      if (this.bossQueue.length) { this.state = 'bossWarn'; this.bossWarnT = 2.0; }
      else this.finish(true);
    } else if (this.mode === 'endless') {
      this.boss = null;
    } else {
      this.finish(true);
    }
  }

  damageBossFrom(dmg, part, hx, hy, src, target) {
    const b = target || this.boss;
    if (!b) return 0;
    if (this.god.enabled && this.god.oneHitKill) dmg = b.maxHp * 2;
    const applied = damageBoss(this, b, dmg, part, false);
    if (applied > 0 && (src !== 'beam' || this.frame % 4 === 0)) {
      this.fxHit(hx, hy, true);
    }
    return applied;
  }

  bossDash(spec, who) {
    const b = who || this.boss;
    if (!b) return;
    b.dash = { ...spec, t: 0, dir: null };
  }
  bossReposition(spec, who) {
    const b = who || this.boss;
    if (!b) return;
    let tx, ty;
    if (spec.nearPlayer) {
      const p = this.player;
      tx = clamp(p.x + this.rng.float(-90, 90), b.r * 0.6, this.W - b.r * 0.6);
      ty = clamp(p.y - this.rng.float(180, 280), 60, this.H * 0.5);
    } else if (spec.side) {
      tx = this.rng.bool() ? b.r * 0.7 : this.W - b.r * 0.7;
      ty = b.homeY + this.rng.float(-20, 40);
    } else {
      tx = this.rng.float(b.r, this.W - b.r);
      ty = b.homeY;
    }
    b.repos = { tx, ty, speed: spec.speed ?? 700 };
    this.fxBlink(b.x, b.y, b.def.theme.glow);
  }
  bossRebootParts(ids, frac, who) {
    const b = who || this.boss;
    if (!b) return;
    for (const p of b.parts) {
      if (ids && !ids.includes(p.id)) continue;
      if (!p.alive) {
        p.alive = true;
        p.hp = p.maxHp * frac;
        p.deadT = 0;
        this.fxPartReboot(p, b);
      }
    }
  }
  spawnAfterimages(spec, ctx, who) {
    const b = who || this.boss;
    if (!b) return;
    const n = spec.n || 2;
    for (let i = 0; i < n; i++) {
      const ai = this.afterimages.get();
      ai.life = ai.maxLife = spec.life ?? 2.2;
      if (spec.spread) {
        ai.x = clamp(this.W * ((i + 1) / (n + 1)) + this.rng.float(-30, 30), 40, this.W - 40);
        ai.y = b.homeY + this.rng.float(-30, 50);
      } else if (spec.mirror) {
        ai.x = this.W - b.x;
        ai.y = b.y + this.rng.float(-10, 10);
      } else {
        ai.x = clamp(b.x + this.rng.float(-140, 140), 40, this.W - 40);
        ai.y = b.y + this.rng.float(-30, 30);
      }
      ai.fireSpec = spec.fire || null;
      ai.fireT = spec.sync ? 0.35 : this.rng.float(0.2, 0.9);
      ai.sync = !!spec.sync;
      ai.bossRef = b;
      ai.dmgMul = ctx?.dmgMul || 1;
      ai.swap = !!spec.swap;
    }
  }

  stepAfterimages(dt) {
    for (const ai of this.afterimages.active) {
      ai.life -= dt;
      if (ai.life <= 0) { ai.__dead = true; continue; }
      ai.pulse = (ai.pulse || 0) + dt;
      if (ai.fireSpec) {
        ai.fireT -= dt;
        if (ai.fireT <= 0) {
          ai.fireT += ai.sync ? 0.85 : this.rng.float(0.6, 1.1);
          emit(this, ai.fireSpec, { x: ai.x, y: ai.y, parts: [] }, { dmgMul: ai.dmgMul * 0.8 });
        }
      }
    }
  }

  // ==========================================================
  // 玩家子弹
  // ==========================================================
  spawnPBullet(x, y, vx, vy, r, dmg, style, kind) {
    const b = this.pBullets.get();
    b.x = x; b.y = y; b.px = x; b.py = y;
    b.vx = vx; b.vy = vy;
    b.r = r; b.dmg = dmg; b.style = style; b.kind = kind || 'shot';
    b.life = kind === 'blade' ? 0.24 : 3.2;
    b.pierce = 0; b.hits = 0; b.hitIds = b.hitIds || [];
    b.hitIds.length = 0;
    b.homing = false; b.target = null; b.turn = 0; b.maxSpeed = 0;
    b.splash = 0; b.splashR = 0; b.chain = 0; b.chainRange = 0;
    b.cluster = 0; b.bossBonus = 1; b.splitFrags = 0; b.blade = false; b.orb = false; b.heavy = false;
    b.rot = Math.atan2(vy, vx);
    b.t = 0;
    this.shotsFired++;
    return b;
  }

  stepPBullets(dt) {
    const arr = this.pBullets.active;
    const bossDmgMul = this.stats.bossDmgMul;
    for (let i = 0; i < arr.length; i++) {
      const b = arr[i];
      if (b.__dead) continue;
      b.t += dt;
      b.life -= dt;
      if (b.life <= 0) {
        if (b.splitFrags > 0) this.splitPBullet(b);
        else if (b.cluster > 0) this.clusterPBullet(b);
        b.__dead = true;
        continue;
      }
      // 追踪
      if (b.homing) {
        let t = b.target;
        if (!t || t.__dead || (t.alive === false) || (t.dead)) {
          t = findTarget(this, b.x, b.y, null);
          b.target = t;
        }
        if (t) {
          const want = Math.atan2(t.y - b.y, t.x - b.x);
          let cur = Math.atan2(b.vy, b.vx);
          let diff = want - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          const maxTurn = b.turn * dt;
          cur += clamp(diff, -maxTurn, maxTurn);
          const sp = b.maxSpeed || Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(cur) * sp;
          b.vy = Math.sin(cur) * sp;
        }
      }
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot = Math.atan2(b.vy, b.vx);
      if (b.kind === 'secondary' || b.kind === 'drone' || b.homing) {
        if (this.frame % 2 === 0) this.fxTrail(b);
      }
      const outOfBounds = b.y < -40 || b.y > this.H + 40 || b.x < -40 || b.x > this.W + 40;
      // ---- 碰撞（扫掠，先判定再回收） ----
      let consumed = false;
      const es = this.enemies.active;
      for (let j = 0; j < es.length; j++) {
        const e = es[j];
        if (!e.alive) continue;
        if (b.hitIds.includes(e.uid)) continue;
        const rr = e.r + b.r;
        if (pointSegDist2(e.x, e.y, b.px, b.py, b.x, b.y) > rr * rr) continue;
        this.onPBulletHit(b, e, null);
        if (b.pierce > 0) { b.pierce--; b.hitIds.push(e.uid); }
        else { consumed = true; break; }
      }
      if (consumed) continue;
      // 节点
      for (const nd of this.nodes.active) {
        if (nd.hp <= 0) continue;
        const rr = nd.r + b.r;
        if (pointSegDist2(nd.x, nd.y, b.px, b.py, b.x, b.y) > rr * rr) continue;
        this.damageNode(nd, b.dmg);
        this.fxHit(nd.x, nd.y, true);
        if (b.pierce > 0) b.pierce--;
        else { consumed = true; }
        break;
      }
      if (consumed) continue;
      // Boss（含英雄模式第二个精英）
      for (const bs of [this.boss, this.boss2]) {
        if (!bs || bs.dead || bs.dying > 0 || bs.state === 'entrance') continue;
        if (b.__dead) break;
        let part = null;
        for (const p of bs.parts) {
          if (!p.alive) continue;
          if (p.isCore && !p.exposed) continue;
          const rr = p.r + b.r;
          if (pointSegDist2(p.x, p.y, b.px, b.py, b.x, b.y) <= rr * rr) { part = p; break; }
        }
        const rrB = bs.r * 0.86 + b.r;
        const hitBody = pointSegDist2(bs.x, bs.y, b.px, b.py, b.x, b.y) <= rrB * rrB;
        if (part || hitBody) {
          const dmg = b.dmg * bossDmgMul * (b.bossBonus || 1);
          const applied = this.damageBossFrom(dmg, part, b.x, b.y, b.kind, bs);
          if (applied > 0.5 && this.frame % 2 === 0) {
            this.floater(b.x + this.rng.float(-6, 6), b.y, String(Math.round(applied)), part ? '#ffd45a' : '#ffffff', 11);
          }
          if (b.splash > 0) this.splashDamage(b, true);
          if (b.pierce > 0) b.pierce--;
          else { b.__dead = true; if (b.cluster > 0) this.clusterPBullet(b); }
        }
      }
      if (!b.__dead && outOfBounds) b.__dead = true;
    }
  }

  onPBulletHit(b, e, part) {
    let dmg = b.dmg;
    this.damageEnemy(e, dmg, b.x, b.y, b.kind);
    if (b.splash > 0) this.splashDamage(b, false, e);
    if (b.chain > 0) this.chainDamage(b, e);
    if (b.cluster > 0 && b.pierce <= 0) this.clusterPBullet(b);
    if (b.style === 'nuke' || b.style === 'plasma') this.fxExplosion(b.x, b.y, b.splashR || 20, 'blast');
  }

  splashDamage(b, isBoss, skip) {
    const r = b.splashR || 30;
    const dmg = b.dmg * (b.splash || 0.5);
    for (const e of this.enemies.active) {
      if (!e.alive || e === skip) continue;
      if (dist2(b.x, b.y, e.x, e.y) < (r + e.r) * (r + e.r)) this.damageEnemy(e, dmg, e.x, e.y, 'splash');
    }
    this.fxExplosion(b.x, b.y, r, 'blast');
  }

  chainDamage(b, from) {
    let cur = from;
    const hit = new Set([from.uid]);
    for (let i = 0; i < b.chain; i++) {
      let best = null, bd = Infinity;
      for (const e of this.enemies.active) {
        if (!e.alive || hit.has(e.uid)) continue;
        const d = dist2(cur.x, cur.y, e.x, e.y);
        if (d < bd && d < b.chainRange * b.chainRange) { bd = d; best = e; }
      }
      if (!best) break;
      this.fxLightning(cur.x, cur.y, best.x, best.y);
      this.damageEnemy(best, b.dmg * 0.75, best.x, best.y, 'chain');
      hit.add(best.uid);
      cur = best;
    }
    this.sfx('chain', 0.4);
  }

  splitPBullet(b) {
    const n = b.splitFrags;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const nb = this.spawnPBullet(b.x, b.y, Math.cos(a) * 380, Math.sin(a) * 380, b.r * 0.5, b.dmg * 0.4, 'orb', 'shot');
      nb.pierce = 2;
      nb.life = 0.9;
    }
    this.fxExplosion(b.x, b.y, 26, 'blast');
  }

  clusterPBullet(b) {
    const n = b.cluster;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.34;
      const nb = this.spawnPBullet(b.x, b.y, Math.cos(a) * 420, Math.sin(a) * 420, b.r * 0.6, b.dmg * 0.45, 'demoFrag', 'shot');
      nb.splashR = (b.splashR || 30) * 0.6;
      nb.splash = 0.5;
      nb.life = 1.2;
    }
    this.fxExplosion(b.x, b.y, b.splashR || 30, 'blast');
  }

  // ==========================================================
  // 敌弹
  // ==========================================================
  spawnEBullet(x, y, vx, vy, r, dmg, style, spec, delay) {
    const b = this.eBullets.get();
    const sm = this.god.enabled ? this.god.bulletSpeedMul : 1;
    b.x = x; b.y = y; b.px = x; b.py = y;
    b.vx = vx * sm; b.vy = vy * sm;
    b.r = r || 6; b.dmg = dmg; b.style = style || 'eBullet';
    b.life = 12; b.t = 0;
    b.av = 0; b.homing = false; b.turn = 0; b.maxSpeed = 0;
    b.fuse = 0; b.frags = 0; b.fragSpeed = 0; b.isMine = false;
    b.splitAfter = 0; b.splitFrags = 0; b.splitSpeed = 0;
    b.decel = 0; b.boomerang = false; b.parasite = false;
    b.delay = delay || 0;
    b.noEat = !!(spec && spec.noEat);
    b.rot = Math.atan2(vy, vx);
    b.spin = this.rng.float(0, TAU);
    return b;
  }

  killEBullet(b, score) {
    if (b.__dead) return;
    b.__dead = true;
    this.fxBulletPop(b, score);
  }

  stepEBullets(dt) {
    const arr = this.eBullets.active;
    const p = this.player;
    const canHit = p.alive && p.invul <= 0 && p.respawnT <= 0;
    const hr = p.hitR;
    for (let i = 0; i < arr.length; i++) {
      const b = arr[i];
      if (b.__dead) continue;
      if (b.delay > 0) { b.delay -= dt; continue; }
      b.t += dt;
      b.life -= dt;
      if (b.life <= 0) { b.__dead = true; continue; }
      // 行为
      if (b.av) {
        const c = Math.cos(b.av * dt), s = Math.sin(b.av * dt);
        const nx = b.vx * c - b.vy * s;
        const ny = b.vx * s + b.vy * c;
        b.vx = nx; b.vy = ny;
      }
      if (b.decel) {
        const k = 1 - b.decel * dt;
        b.vx *= k; b.vy *= k;
        if (b.boomerang && b.t > 1.2) {
          const a = angleTo(b.x, b.y, this.player.x, this.player.y);
          const sp = 170;
          b.vx = lerp(b.vx, Math.cos(a) * sp, dt * 2.2);
          b.vy = lerp(b.vy, Math.sin(a) * sp, dt * 2.2);
        }
      }
      if (b.homing) {
        const want = Math.atan2(p.y - b.y, p.x - b.x);
        let cur = Math.atan2(b.vy, b.vx);
        let diff = want - cur;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        cur += clamp(diff, -b.turn * dt, b.turn * dt);
        const sp = Math.min(b.maxSpeed, Math.hypot(b.vx, b.vy) + 160 * dt);
        b.vx = Math.cos(cur) * sp;
        b.vy = Math.sin(cur) * sp;
      }
      if (b.isMine && b.fuse > 0) {
        b.fuse -= dt;
        if (b.fuse <= 0) { this.explodeMine(b); continue; }
      }
      if (b.splitAfter > 0) {
        b.splitAfter -= dt;
        if (b.splitAfter <= 0) { this.splitEBullet(b); continue; }
      }
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot = Math.atan2(b.vy, b.vx);
      // 扫掠命中玩家核心判定点（先判定再回收，避免单帧跨越整屏时漏判）
      if (canHit) {
        const rr = b.r * 0.82 + hr;
        if (pointSegDist2(p.x, p.y, b.px, b.py, b.x, b.y) <= rr * rr) {
          b.__dead = true;
          this.hurtPlayer(b.dmg, 'bullet');
          this.fxBulletPop(b, false);
          continue;
        }
      }
      // 越界回收
      const m = 40 + b.r;
      if (b.x < -m || b.x > this.W + m || b.y < -m * 2 || b.y > this.H + m) { b.__dead = true; continue; }
      // 近弹提示（判定点淡显）
      if (p.alive && dist2(p.x, p.y, b.x, b.y) < 3600) p.danger = 0.5;
    }
    if (p.danger > 0) p.danger -= dt;
  }

  explodeMine(b) {
    b.__dead = true;
    const n = b.frags || 8;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + this.rng.float(-0.1, 0.1);
      this.spawnEBullet(b.x, b.y, Math.cos(a) * b.fragSpeed, Math.sin(a) * b.fragSpeed, b.r * 0.72, b.dmg * 0.85, b.style === 'eFlameMine' ? 'eFlame' : b.style === 'eSoulMine' ? 'eSoul' : b.style === 'eSpiritMine' ? 'eSpirit' : 'eBullet', null);
    }
    this.fxExplosion(b.x, b.y, 26, 'eblast');
    this.sfx('mine', 0.4);
  }

  splitEBullet(b) {
    b.__dead = true;
    const n = b.splitFrags || 5;
    const base = Math.atan2(b.vy, b.vx);
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * 0.36;
      this.spawnEBullet(b.x, b.y, Math.cos(a) * b.splitSpeed, Math.sin(a) * b.splitSpeed, b.r * 0.7, b.dmg * 0.8, b.style, null);
    }
    this.fxExplosion(b.x, b.y, 18, 'eblast');
  }

  // ==========================================================
  // 激光 / 雷柱 / 电网 / 危险区 / 节点
  // ==========================================================
  spawnLaser(o) {
    const l = this.lasers.get();
    Object.assign(l, o);
    l.t = 0;
    l.total = (o.charge || 0) + (o.duration || 0);
    l.__dead = false;
    l.hitT = 0;
    return l;
  }

  stepLasers(dt) {
    const p = this.player;
    for (const l of this.lasers.active) {
      l.t += dt;
      if (l.owner && l.follow) {
        const o = l.owner;
        if (o && !o.dead) { l.x = o.x; l.y = o.y + (o.r ? o.r * 0.3 : 0); }
      }
      if (l.rotate) l.angle += l.rotate * dt;
      if (l.t >= l.total) { l.__dead = true; continue; }
      if (l.t < l.charge) continue;
      // 激光激活：线段判定
      const len = 1400;
      const dx = Math.sin(l.angle), dy = Math.cos(l.angle);
      const x2 = l.x + dx * len, y2 = l.y + dy * len;
      l.hitT -= dt;
      if (p.alive && p.invul <= 0 && p.respawnT <= 0 && l.hitT <= 0) {
        const rr = l.width * 0.42 + p.hitR;
        if (pointSegDist2(p.x, p.y, l.x, l.y, x2, y2) <= rr * rr) {
          l.hitT = 0.35;
          this.hurtPlayer(l.dmg * 1.35, 'laser');
        }
      }
      if (this.frame % 3 === 0) this.fxLaserSpark(l);
    }
  }

  spawnColumn(x, w, warn, dur, dmg, style) {
    const c = this.columns.get();
    c.x = x; c.w = w; c.warn = warn; c.dur = dur; c.dmg = dmg; c.style = style;
    c.t = 0; c.hitDone = false;
    return c;
  }
  stepColumns(dt) {
    const p = this.player;
    for (const c of this.columns.active) {
      c.t += dt;
      if (c.t > c.warn + c.dur) { c.__dead = true; continue; }
      if (c.t > c.warn && !c.hitDone) {
        if (p.alive && p.invul <= 0 && Math.abs(p.x - c.x) < c.w * 0.42 + p.hitR) {
          c.hitDone = true;
          this.hurtPlayer(c.dmg * 1.5, 'column');
        }
        if (c.t > c.warn + 0.1 && !c.sfxDone) { c.sfxDone = true; this.sfx('thunder', 0.7); this.screenShake = Math.max(this.screenShake, 0.4); }
      }
    }
  }

  spawnRow(y, h, warn, dur, dmg, style) {
    const r = this.rows.get();
    r.y = y; r.h = h; r.warn = warn; r.dur = dur; r.dmg = dmg; r.style = style;
    r.t = 0; r.hitDone = false;
    return r;
  }
  stepRows(dt) {
    const p = this.player;
    for (const r of this.rows.active) {
      r.t += dt;
      if (r.t > r.warn + r.dur) { r.__dead = true; continue; }
      if (r.t > r.warn && !r.hitDone) {
        if (p.alive && p.invul <= 0 && Math.abs(p.y - r.y) < r.h * 0.5 + p.hitR) {
          r.hitDone = true;
          this.hurtPlayer(r.dmg * 1.4, 'row');
        }
      }
    }
  }

  spawnZone(x, y, r, warn, dur, dmg, style, track) {
    const z = this.zones.get();
    z.x = x; z.y = y; z.r = r; z.warn = warn; z.dur = dur; z.dmg = dmg; z.style = style;
    z.track = track || 0; z.t = 0; z.hitT = 0;
    return z;
  }
  stepZones(dt) {
    const p = this.player;
    for (const z of this.zones.active) {
      z.t += dt;
      if (z.track > 0 && z.t < z.warn) {
        z.x = lerp(z.x, p.x, dt * z.track * 3);
        z.y = lerp(z.y, p.y, dt * z.track * 3);
      }
      if (z.t > z.warn + z.dur) { z.__dead = true; continue; }
      if (z.t > z.warn) {
        if (!z.boomed) {
          z.boomed = true;
          this.fxExplosion(z.x, z.y, z.r, z.style === 'fire' ? 'fire' : z.style === 'divine' ? 'divine' : 'eblast');
          this.sfx('zoneBoom', 0.6);
        }
        z.hitT -= dt;
        if (p.alive && p.invul <= 0 && z.hitT <= 0) {
          if (dist2(p.x, p.y, z.x, z.y) < (z.r + p.hitR) * (z.r + p.hitR)) {
            z.hitT = 0.4;
            this.hurtPlayer(z.dmg * 1.2, 'zone');
          }
        }
      }
    }
  }

  spawnNode(x, y, hp, life, dmg, style) {
    const n = this.nodes.get();
    n.x = x; n.y = y; n.hp = n.maxHp = Math.max(1, hp); n.life = life; n.dmg = dmg;
    n.style = style; n.r = 14; n.t = 0; n.hitFlash = 0;
    return n;
  }
  linkNodes(a, b, delay, dmg, arcs) {
    this.nodeLinks.push({ a, b, delay, t: 0, dmg, active: false, arcs: !!arcs, hitT: 0 });
  }
  damageNode(nd, dmg) {
    nd.hp -= dmg;
    nd.hitFlash = 0.1;
    if (nd.hp <= 0) {
      nd.hp = 0;
      nd.__dead = true;
      this.fxExplosion(nd.x, nd.y, 24, 'eblast');
      this.addScore(160 * this.scoreScale);
      this.sfx('nodeBreak', 0.6);
    }
  }
  stepNodes(dt) {
    const p = this.player;
    for (const n of this.nodes.active) {
      n.t += dt;
      n.life -= dt;
      if (n.hitFlash > 0) n.hitFlash -= dt;
      if (n.life <= 0) { n.__dead = true; }
    }
    for (let i = this.nodeLinks.length - 1; i >= 0; i--) {
      const L = this.nodeLinks[i];
      if (L.a.__dead || L.b.__dead || L.a.hp <= 0 || L.b.hp <= 0) { this.nodeLinks.splice(i, 1); continue; }
      L.t += dt;
      if (L.t < L.delay) continue;
      L.active = true;
      L.hitT -= dt;
      if (p.alive && p.invul <= 0 && L.hitT <= 0) {
        const rr = 8 + p.hitR;
        if (pointSegDist2(p.x, p.y, L.a.x, L.a.y, L.b.x, L.b.y) <= rr * rr) {
          L.hitT = 0.4;
          this.hurtPlayer(L.dmg * 1.2, 'link');
        }
      }
    }
  }

  spawnWarnLine(x, y, angle, dur) {
    const w = this.warnLines.get();
    w.x = x; w.y = y; w.angle = angle; w.t = 0; w.dur = dur;
    return w;
  }
  stepWarnLines(dt) {
    for (const w of this.warnLines.active) {
      w.t += dt;
      if (w.t >= w.dur) w.__dead = true;
    }
  }

  stepAbsorb(dt) {
    if (!this.absorbField) return;
    this.absorbField.t -= dt;
    if (this.absorbField.t <= 0) this.absorbField = null;
  }

  // ==========================================================
  // 道具
  // ==========================================================
  spawnItem(type, x, y) {
    const it = this.items.get();
    it.type = type;
    it.x = x; it.y = y;
    it.vx = this.rng.float(-40, 40);
    it.vy = type === 'coin' ? this.rng.float(30, 70) : 58;
    it.t = 0;
    it.life = 14;
    it.mag = false;
    return it;
  }

  stepItems(dt) {
    const p = this.player;
    for (const it of this.items.active) {
      it.t += dt;
      it.life -= dt;
      if (it.life <= 0) { it.__dead = true; continue; }
      const d2 = dist2(p.x, p.y, it.x, it.y);
      if (p.alive && d2 < 130 * 130) it.mag = true;
      if (it.mag && p.alive) {
        const a = angleTo(it.x, it.y, p.x, p.y);
        const sp = 260 + (1 - Math.min(1, Math.sqrt(d2) / 130)) * 340;
        it.vx = lerp(it.vx, Math.cos(a) * sp, dt * 7);
        it.vy = lerp(it.vy, Math.sin(a) * sp, dt * 7);
      } else {
        it.vy = lerp(it.vy, 62, dt * 2);
        it.vx = lerp(it.vx, Math.sin(it.t * 2.4) * 26, dt * 2);
      }
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      if (it.x < 12 || it.x > this.W - 12) it.vx *= -1;
      if (it.y > this.H + 30) { it.__dead = true; continue; }
      if (p.alive && d2 < (p.hitR + 22) * (p.hitR + 22)) {
        it.__dead = true;
        this.pickItem(it);
      }
    }
  }

  pickItem(it) {
    const p = this.player;
    this.itemsPicked++;
    switch (it.type) {
      case 'power': this.pickPower(); break;
      case 'shield': this.grantShield(0.3); this.floater(p.x, p.y - 32, 'SHIELD', '#6fd8ff', 15); break;
      case 'bomb':
        p.bombs = Math.min(9, p.bombs + 1);
        this.floater(p.x, p.y - 32, 'BOMB +1', '#ffb545', 15);
        this.sfx('itemBomb', 0.8);
        break;
      case 'heal':
        p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.22);
        this.floater(p.x, p.y - 32, '+HP', '#7dff86', 15);
        this.sfx('itemHeal', 0.7);
        break;
      case 'coin':
        this.coins = (this.coins || 0) + 1;
        this.addScore(80 * this.scoreScale);
        this.sfx('coin', 0.32);
        break;
      default:
        this.addScore(150);
    }
    this.fxPickup(it);
    this.bus.emit('itemPicked', { type: it.type });
  }

  // ==========================================================
  // 特效（纯数据，渲染层消费）
  // ==========================================================
  particle(x, y, vx, vy, life, size, color, kind) {
    // 画质设置：低画质时按比例丢弃装饰性粒子（冲击波/护盾等关键反馈不丢）
    const q = this.particleQuality ?? 1;
    if (q < 1 && kind !== 'shock' && kind !== 'bombwave' && kind !== 'ring' && this.rng.next() > q) {
      return DUMMY_PARTICLE;
    }
    const p = this.particles.get();
    p.x = x; p.y = y; p.vx = vx; p.vy = vy;
    p.life = p.maxLife = life;
    p.size = size; p.color = color; p.kind = kind || 'dot';
    p.spin = this.rng.float(0, TAU);
    p.drag = kind === 'spark' ? 3.2 : 1.4;
    return p;
  }
  stepParticles(dt) {
    for (const p of this.particles.active) {
      p.life -= dt;
      if (p.life <= 0) { p.__dead = true; continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const k = 1 - p.drag * dt;
      p.vx *= k; p.vy *= k;
      if (p.kind === 'debris') p.vy += 220 * dt;
      p.spin += dt * 4;
    }
  }
  floater(x, y, text, color, size) {
    const f = this.floaters.get();
    f.x = x; f.y = y; f.text = text; f.color = color; f.size = size || 12;
    f.life = f.maxLife = 0.85;
    f.vy = -60;
    return f;
  }
  stepFloaters(dt) {
    for (const f of this.floaters.active) {
      f.life -= dt;
      if (f.life <= 0) { f.__dead = true; continue; }
      f.y += f.vy * dt;
      f.vy *= 1 - 2.2 * dt;
    }
  }

  fxHit(x, y, real) {
    const n = real ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const a = this.rng.float(0, TAU);
      const s = this.rng.float(60, 200);
      this.particle(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.22, this.rng.float(1.5, 3), real ? '#fff2c0' : '#9fd8ff', 'spark');
    }
  }
  fxExplosion(x, y, r, pal) {
    const n = clamp(Math.round(r * 0.55), 6, 34);
    const colors = EXPLOSION_PAL[pal] || EXPLOSION_PAL.default;
    for (let i = 0; i < n; i++) {
      const a = this.rng.float(0, TAU);
      const s = this.rng.float(40, r * 7);
      this.particle(x, y, Math.cos(a) * s, Math.sin(a) * s, this.rng.float(0.22, 0.55), this.rng.float(2, r * 0.22 + 3), this.rng.pick(colors), 'flame');
    }
    for (let i = 0; i < Math.max(2, n / 4); i++) {
      const a = this.rng.float(0, TAU);
      const s = this.rng.float(80, r * 9);
      this.particle(x, y, Math.cos(a) * s, Math.sin(a) * s, this.rng.float(0.4, 0.9), this.rng.float(1.5, 3.5), '#ffffff', 'debris');
    }
    this.particle(x, y, 0, 0, 0.3, r, colors[0], 'shock');
  }
  fxBulletPop(b, score) {
    for (let i = 0; i < 3; i++) {
      const a = this.rng.float(0, TAU);
      this.particle(b.x, b.y, Math.cos(a) * 90, Math.sin(a) * 90, 0.2, 2, score ? '#ffe98a' : '#ff9fb0', 'spark');
    }

  fxTrail(b) {

  boss.speedMul = (ph.speedMul || 1) * boss.baseSpeedMul;
  boss.tint = ph.tint || null;
  boss.bgShift = ph.bgShift || null;
  if (ph.move) boss.moveScript = ph.move;
  if (ph.breakShell) for (const p of boss.parts) if (p.isShell) { p.alive = false; p.hp = 0; }
  if (ph.exposeCore) { boss.exposeCore = true; for (const p of boss.parts) if (p.isCore) p.exposed = true; }
}

function enemySprite(def) {
  return cached('enemy:' + def.id, () => {
    const aw = Math.max(6, Math.round((def.sprite.w || 24) / PX));
    const ah = Math.max(6, Math.round((def.sprite.h || 22) / PX));
    const p = new Px(aw + 2, ah + 2);
    const cx = Math.floor((aw + 2 - 1) / 2);
    const form = ENEMY_FORMS[def.sprite.form] || ENEMY_FORMS.scout;
    form(p, aw, ah, cx);
    p.mirror(cx);
    p.outline(M.LINE);
    p.autoShade();
    return toCanvas(p, buildPalette(PALS[def.sprite.pal] || PALS.steel), PX, { glowMat: true });
  });
}

function bossSprite(def) {
  return cached('boss:' + def.id, () => {
    const aw = Math.max(20, Math.round(def.sprite.w / PX));
    const ah = Math.max(20, Math.round(def.sprite.h / PX));
    const p = new Px(aw + 4, ah + 4);
    const cx = Math.floor((aw + 4 - 1) / 2);
    const form = BOSS_FORMS[def.sprite.form] || BOSS_FORMS.destroyer;
    form(p, aw, ah, cx, def.sprite.mark);
    p.mirror(cx);
    p.outline(M.LINE);
    p.autoShade();
    return toCanvas(p, buildPalette(def.theme), PX, { glowMat: true });
  });
}

/** Boss 部件（炮塔/舱/核心）小图 */
function bossPartSprite(def, part) {
  const key = `bpart:${def.id}:${part.id}`;
  return cached(key, () => {
    const r = Math.max(5, Math.round(part.r / PX));
    const s = r * 2 + 4;
    const p = new Px(s, s);
    const c = (s - 1) / 2;
    if (part.isCore) {
      p.ellipse(c, c, r, r, M.METAL);
      p.ring(c, c, r, r, 2, M.DARK);
      p.ellipse(c, c, r * 0.6, r * 0.6, M.GLOW);
      p.ellipse(c, c, r * 0.28, r * 0.28, M.HOT);
    } else if (part.isShell) {
      p.ring(c, c, r, r, 3, M.METAL);
      p.ring(c, c, r - 3, r - 3, 1, M.ACCENT);
    } else {
      p.ellipse(c, c, r, r * 0.9, M.HULL);
      p.rect(c - r * 0.5, c - r * 0.2, r, r * 1.2, M.METAL);
      p.rect(c - 1, c - r, 3, r, M.DARK);
      p.ellipse(c, c, r * 0.32, r * 0.32, M.ACCENT);
    }
    p.outline(M.LINE);
    p.autoShade();
    return toCanvas(p, buildPalette(def.theme), PX, { glowMat: true });
  });
}

function itemSprite(type) {
  return cached('item:' + type, () => {
    const cfg = ITEM_ART[type] || ITEM_ART.coin;
    const s = 13;
    const p = new Px(s, s);
    const c = (s - 1) / 2;
    if (type === 'coin') {
      p.ellipse(c, c, 5, 5, M.HULL);
      p.ring(c, c, 5, 5, 1, M.DARK);
      p.ellipse(c, c, 3, 3, M.LIGHT);
    } else {
      p.rect(1, 1, s - 2, s - 2, M.DARK);
      p.rect(2, 2, s - 4, s - 4, M.HULL);
      p.rect(2, 2, s - 4, 2, M.LIGHT);
      p.rect(2, s - 4, s - 4, 2, M.DARK);
    }
    const glyph = GLYPHS[cfg.glyph];
    if (glyph) for (const [gx, gy] of glyph) p.set(4 + gx, 4 + gy, M.ACCENT);
    p.outline(M.LINE);
    p.autoShade();
    return toCanvas(p, buildPalette(cfg.pal), PX, { glowMat: true });
  });
}

// 朝向类形状在渲染时旋转（默认美术朝上）
