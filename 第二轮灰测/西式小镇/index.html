<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altbrücken · 西式小镇模型</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23191720'/%3E%3Cpath d='M6 22h20M9 22V13l7-5 7 5v9M14 22v-6h4v6' stroke='%23e9c46a' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- 标题 -->
    <header id="hud">
      <h1>ALTBRÜCKEN</h1>
      <p class="sub">西式小镇模型 · 8 个片区 · 程序化生成</p>
      <div id="stats"></div>
    </header>

    <!-- 片区导览 -->
    <nav id="panel" aria-label="片区导览"></nav>

    <!-- 片区详情浮层 -->
    <section id="detail">
      <h2 id="detail-title"></h2>
      <p id="detail-desc"></p>
      <ul id="detail-list"></ul>
    </section>

    <!-- 控制台 -->
    <section id="dock"></section>

    <!-- 小地图 -->
    <aside id="minimap">
      <canvas id="minimap-canvas"></canvas>
      <div class="mm-cap">镇域图 · 点击名牌可飞抵</div>
    </aside>

    <!-- 操作提示 -->
    <footer id="hint">
      <span><kbd>拖拽</kbd> 环视</span>
      <span><kbd>滚轮</kbd> 缩放</span>
      <span><kbd>右键</kbd> 平移</span>
      <span><kbd>1</kbd>–<kbd>8</kbd> 片区</span>
      <span><kbd>0</kbd> 全景</span>
      <span><kbd>空格</kbd> 昼夜</span>
      <span><kbd>N</kbd>/<kbd>M</kbd> 夜/昼</span>
      <span><kbd>L</kbd> 名牌</span>
      <span><kbd>H</kbd> 隐藏界面</span>
    </footer>

    <!-- 加载遮罩 -->
    <div id="loading">
      <div class="l-inner">
        <div class="l-crest">⚜</div>
        <h2>ALTBRÜCKEN</h2>
        <p id="loading-text">准备石料与木材…</p>
        <div class="l-track"><div id="loading-bar"></div></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
