<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AURORA 纯白三角钢琴 · 3D 精细模型</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="backdrop"></div>
<div id="stage"></div>
<div id="vignette"></div>

<div id="brand">
  <h1>A U R O R A</h1>
  <p>Concert Grand · Pure White</p>
  <div class="zh">纯白三角钢琴 · 可弹奏 3D 模型</div>
</div>

<button id="btn-collapse" title="收起 / 展开面板">≡</button>

<div id="panel">
  <h2>视角</h2>
  <div class="row">
    <button class="half on" data-view="front">正面</button>
    <button class="half" data-view="player">演奏位</button>
    <button class="half" data-view="top">俯视</button>
    <button class="half" data-view="side">侧面</button>
    <button class="half" data-view="tail">琴尾</button>
    <button class="half" data-view="detail">键盘特写</button>
  </div>

  <h2>琴体</h2>
  <div class="row">
    <button class="wide on" id="btn-lid">琴盖：全开</button>
    <button class="wide on" id="btn-fallboard">键盘盖：打开</button>
    <button class="half" id="btn-rotate">自动旋转：关</button>
    <button class="half" id="btn-contrast">半音键：纯白</button>
  </div>

  <h2>演奏</h2>
  <div class="row">
    <button class="wide" id="btn-demo">演奏《致爱丽丝》</button>
    <button class="wide" id="btn-reset">重置视角与琴音</button>
  </div>

  <div class="slider">
    <label><span>音量</span><span>VOL</span></label>
    <input type="range" id="vol" min="0" max="1.4" step="0.01" value="0.85">
  </div>
  <div class="slider">
    <label><span>混响</span><span>REVERB</span></label>
    <input type="range" id="rev" min="0" max="0.8" step="0.01" value="0.26">
  </div>
</div>

<div id="pedals">
  <button data-pedal="0">弱音踏板</button>
  <button data-pedal="1">选择延音</button>
  <button data-pedal="2" id="pedal-ind">延音踏板</button>
</div>

<div id="note-read"></div>
<div id="stat"></div>

<div id="hint">
  拖动旋转 · 滚轮缩放 · <kbd>Shift</kbd>+拖动平移 · 点击琴键或按住滑动可滑奏<br>
  电脑键盘弹奏：<kbd>Z</kbd><kbd>S</kbd><kbd>X</kbd><kbd>D</kbd><kbd>C</kbd> … <kbd>Q</kbd><kbd>2</kbd><kbd>W</kbd><kbd>3</kbd><kbd>E</kbd> ·
  <kbd>空格</kbd> 延音踏板 · <kbd>←</kbd><kbd>→</kbd> 移八度
</div>

<div id="toast"></div>

<div id="loading">
  <div class="ring"></div>
  <p>Crafting the grand piano</p>
</div>

<script src="js/three.min.js"></script>
<script src="js/geom.js"></script>
<script src="js/orbit.js"></script>
<script src="js/audio.js"></script>
<script src="js/piano.js"></script>
<script src="js/app.js"></script>
</body>
</html>
