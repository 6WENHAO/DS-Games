<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a4d"/>
      <stop offset="0.55" stop-color="#2f3a32"/>
      <stop offset="1" stop-color="#1f2722"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b24"/>
      <stop offset="1" stop-color="#141a16"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d110e"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="640" cy="90" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="640" cy="90" r="90" fill="#ffffff" opacity="0.06"/>

  <rect y="358" width="800" height="92" fill="url(#ground)"/>
  <line x1="0" y1="358" x2="800" y2="358" stroke="#0d120e" stroke-width="2"/>

  <g>
    <!-- tracks -->
    <rect x="96" y="330" width="444" height="36" rx="15" fill="#0a0d0b"/>
    <!-- road wheels -->
    <g fill="#0d110e" stroke="#2a332c" stroke-width="2">
      <circle cx="136" cy="348" r="16"/>
      <circle cx="196" cy="348" r="16"/>
      <circle cx="256" cy="348" r="16"/>
      <circle cx="316" cy="348" r="16"/>
      <circle cx="376" cy="348" r="16"/>
      <circle cx="436" cy="348" r="16"/>
      <circle cx="496" cy="348" r="16"/>
    </g>
    <!-- hull -->
    <path d="M112 330 L112 304 L452 304 L536 330 Z" fill="#111613"/>
    <!-- glacis highlight -->
    <path d="M452 304 L536 330 L452 330 Z" fill="#1c241e"/>
    <!-- turret -->
    <path d="M244 304 L432 304 L428 256 L268 250 Z" fill="#141a16"/>
    <path d="M268 250 L428 256 L422 266 L268 258 Z" fill="#1d251f"/>
    <!-- barrel -->
    <rect x="432" y="272" width="248" height="12" fill="url(#barrel)"/>
    <!-- muzzle brake -->
    <rect x="676" y="267" width="26" height="22" rx="3" fill="#0b0e0c"/>
    <rect x="692" y="270" width="12" height="16" rx="2" fill="#1a221c"/>
    <!-- fume extractor -->
    <rect x="516" y="268" width="26" height="20" rx="4" fill="#0b0e0c"/>
    <!-- roof devices -->
    <rect x="304" y="240" width="26" height="12" rx="3" fill="#0d110e"/>
    <rect x="356" y="236" width="34" height="16" rx="4" fill="#0d110e"/>
  </g>

  <rect x="120" y="70" width="10" height="120" fill="#c8322a"/>
  <path d="M116 70 L134 70 L125 92 Z" fill="#c8322a"/>

  <text x="116" y="150" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="72" font-weight="800" fill="#e8efe8" letter-spacing="2">ZTZ-99A</text>
  <text x="120" y="196" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="30" font-weight="600" fill="#b9c6bc" letter-spacing="6">主战坦克 · 结构演示</text>
  <text x="120" y="228" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#7f8f83" letter-spacing="3">MAIN BATTLE TANK — EXPLODED STRUCTURE VIEWER</text>
</svg>
