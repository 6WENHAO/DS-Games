                        {id:'diary2',x:0.22,y:0.48,icon:'📔',label:'工作日志',room:'tower'}
                    ]
                }
            };

            // ==================== 关卡列表信息 ====================
            var levelCards = [
                {id:1,num:'01',title:'午夜失窃案',desc:'入门·珠宝失窃',cls:'easy'},
                {id:2,num:'02',title:'八点整',desc:'进阶·完美犯罪',cls:'medium'},
                {id:3,num:'03',title:'庄园血案',desc:'困难·4房间5嫌疑人',cls:'hard'},
                {id:4,num:'04',title:'血色晚宴',desc:'困难·密室毒杀',cls:'hard'},
                {id:5,num:'05',title:'幽灵画廊',desc:'极难·红外线谜题',cls:'extreme'},
                {id:6,num:'06',title:'钟楼谜影',desc:'极难·10条线索',cls:'extreme'}
            ];

            // ==================== 渲染关卡选择界面 ====================
            function renderLevelSelect(){
                var cont=$('level-cards-container');cont.innerHTML='';
                for(var i=0;i<levelCards.length;i++){
                    var lc=levelCards[i];var div=document.createElement('div');
                    div.className='level-card';
                    if(lc.id>gameState.maxUnlocked)div.classList.add('locked');
                    if(gameState.completed[lc.id])div.classList.add('completed');
                    var tagCls=lc.cls;
                    div.innerHTML='<div class="level-num">'+lc.num+'</div>'+
                        '<span class="level-tag '+tagCls+'">'+LEVELS[lc.id].difficulty+'</span>'+
                        '<div class="level-title">'+lc.title+'</div>'+
                        '<div class="level-desc">'+lc.desc+'</div>'+
                        (gameState.completed[lc.id]?'<div class="level-desc" style="color:#2ecc71;">✅ 已完成 · 评级：'+gameState.completed[lc.id]+'</div>':'')+
                        (lc.id>gameState.maxUnlocked?'<div class="level-desc" style="color:#e94560;">🔒 未解锁</div>':'');
                    (function(lid){
                        div.addEventListener('click',function(){
                            if(lid>gameState.maxUnlocked){showToast('🔒 请先完成前序案件');playFail();return;}
                            initAudio();startLevel(lid);
                        });
                    })(lc.id);
                    cont.appendChild(div);
                }
                $('unlock-count').textContent=gameState.maxUnlocked;
                $('total-score').textContent=gameState.totalScore;
            }

            // ==================== 开始关卡 ====================
            function startLevel(levelId){
                gameState.currentLevel=levelId;var L=LEVELS[levelId];
                gameState.collectedClues={};
                gameState.hintsUsed=0;
                gameState.pressureCount=0;
                gameState.totalClueCount=L.totalClues;
                gameState.currentRoom=L.rooms[0];
                gameState.cluesByRoom={};
                for(var i=0;i<L.rooms.length;i++){gameState.cluesByRoom[L.rooms[i]]=[];}
                $('case-name').textContent=L.caseName;
                $('clue-counter').textContent='线索：0/'+L.totalClues;
                $('clue-progress').style.width='0%';
                $('clue-list').innerHTML='<p style="color:#555;font-size:10px;text-align:center;padding-top:16px;">点击场景中的闪光点<br>进行调查...</p>';
                showScene('game-scene');
                renderSuspects();
                renderRoomTabs();
                switchRoom(L.rooms[0]);
                startTimer();
                showToast('🔍 '+L.title+' · '+L.difficulty+' · 共'+L.totalClues+'条线索',2800);
            }

            // ==================== 渲染嫌疑人列表 ====================
            function renderSuspects(){
                var L=LEVELS[gameState.currentLevel];
                var list=$('suspect-list');list.innerHTML='';
                var ids=Object.keys(L.suspects);
                for(var i=0;i<ids.length;i++){
                    var s=L.suspects[ids[i]];
                    var div=document.createElement('div');
                    div.className='suspect-item';
                    div.innerHTML='<div class="suspect-avatar">'+s.avatar+'</div><div><div class="suspect-name">'+s.name+'</div><div class="suspect-role">'+s.role+'</div></div>';
                    (function(sid){
                        div.addEventListener('click',function(){initAudio();startDialogue(sid);});
                    })(ids[i]);
                    list.appendChild(div);
                }
            }

            // ==================== 对话系统 ====================
            function startDialogue(suspectId){
                var L=LEVELS[gameState.currentLevel];
                var s=L.suspects[suspectId];
                gameState.currentDialogueSuspect=suspectId;
                gameState.currentDialogueState=0;
                showScene('dialogue-scene');
                $('dialogue-avatar').textContent=s.avatar;
                setDialogue(s.name,'intro');
            }

            function setDialogue(speaker,key){
                var L=LEVELS[gameState.currentLevel];
                var s=L.suspects[gameState.currentDialogueSuspect];
                $('dialogue-speaker').textContent=speaker;
                var choicesDiv=$('dialogue-choices');choicesDiv.innerHTML='';
                if(key==='intro'){
                    $('dialogue-text').textContent=s.dialogue.intro;
                    addChoice('🗣 询问不在场证明',function(){setDialogue(speaker,'alibi');});
                    addChoice('👀 询问是否看到异常',function(){setDialogue(speaker,'saw');});
                    addChoice('🤔 询问可疑人选',function(){setDialogue(speaker,'suspect');});
                    var collectedCount=0;
                    var ck=Object.keys(gameState.collectedClues);
                    for(var i=0;i<ck.length;i++){if(gameState.collectedClues[ck[i]])collectedCount++;}
                    if(collectedCount>=3){
                        addChoice('⚡ 施压审问',function(){
                            initAudio();playPressure();
                            gameState.pressureCount++;
                            triggerBloodBurst(200+Math.random()*500,100+Math.random()*300);
                            startPressure();
                        },'pressure');
                    }
                }else if(key==='alibi'){$('dialogue-text').textContent=s.dialogue.alibi;
                    addChoice('← 返回',function(){setDialogue(speaker,'intro');});}
                else if(key==='saw'){$('dialogue-text').textContent=s.dialogue.saw;
                    addChoice('← 返回',function(){setDialogue(speaker,'intro');});}
                else if(key==='suspect'){$('dialogue-text').textContent=s.dialogue.suspect;
                    addChoice('← 返回',function(){setDialogue(speaker,'intro');});}
            }

            function addChoice(text,cb,cls){
                var b=document.createElement('button');
                b.className='dialogue-choice'+(cls?' '+cls:'');
                b.textContent=text;
                b.addEventListener('click',function(){initAudio();playClick();cb();});
                $('dialogue-choices').appendChild(b);
            }

            function startPressure(){
                var L=LEVELS[gameState.currentLevel];
                var s=L.suspects[gameState.currentDialogueSuspect];
                var p=s.dialogue.pressure;
                gameState.currentDialogueState=1;
                var steps=Math.min(p.length/2,3);
                var idx=0;
                function nextRound(){
                    if(idx>=steps*2){
                        setDialogue(s.name,'intro');
                        gameState.currentDialogueState=0;
                        showToast('💬 审讯结束，嫌疑人心理防线已被动摇',2000);
                        return;
                    }
                    $('dialogue-text').textContent=p[idx];
                    $('dialogue-choices').innerHTML='';
                    var respondText=p[idx+1];
                    var b=document.createElement('button');
                    b.className='dialogue-choice';
                    b.textContent='👉 听取回应';
                    b.addEventListener('click',function(){
                        initAudio();playClick();
                        $('dialogue-text').textContent=respondText;
                        $('dialogue-choices').innerHTML='';
                        var next=document.createElement('button');
                        next.className='dialogue-choice pressure';
                        next.textContent=(idx+2>=steps*2)?'🔚 结束审讯':'⚡ 继续施压';
                        next.addEventListener('click',function(){initAudio();playPressure();
                            triggerBloodBurst(200+Math.random()*500,150+Math.random()*250);
                            idx+=2;nextRound();});
                        $('dialogue-choices').appendChild(next);
                    });
                    $('dialogue-choices').appendChild(b);
                }
                nextRound();
            }

            // ==================== 场景渲染 ====================
            function switchRoom(roomId){
                gameState.currentRoom=roomId;
                renderScene();
                renderRoomTabs();
            }

            function renderScene(){
                var L=LEVELS[gameState.currentLevel];
                var c=$('scene-canvas');
                var rect=c.getBoundingClientRect();
                c.width=rect.width;c.height=rect.height;
                var ctx=c.getContext('2d');
                var w=rect.width,h=rect.height;
                if(L.roomDraws&&L.roomDraws[gameState.currentRoom]){
                    L.roomDraws[gameState.currentRoom](ctx,w,h);
                }else{
                    L.sceneDraw(ctx,w,h);
                }
                ctx.fillStyle='#aaccff';ctx.font='12px monospace';
                var hs=L.hotspots;
                for(var i=0;i<hs.length;i++){
                    if(hs[i].room!==gameState.currentRoom)continue;
                    var hx=hs[i].x*w,hy=hs[i].y*h;
                    if(!gameState.collectedClues[hs[i].id]){
                        var pulse=Math.sin(Date.now()/400)*0.3+0.7;
                        ctx.globalAlpha=pulse;
                        ctx.fillStyle='#ffdd00';ctx.beginPath();
                        ctx.arc(hx,hy,10,0,Math.PI*2);ctx.fill();
                        ctx.fillStyle='#ffffff';ctx.beginPath();
                        ctx.arc(hx,hy,5,0,Math.PI*2);ctx.fill();
                        ctx.globalAlpha=1;
                        ctx.fillStyle='#000';ctx.font='16px sans-serif';
                        ctx.fillText(hs[i].icon,hx-10,hy+6);
                    }else{
                        ctx.fillStyle='#555';ctx.font='14px sans-serif';
                        ctx.fillText('✓',hx-6,hy+5);
                    }
                }
            }

            // ==================== Canvas点击 ====================
            $('scene-canvas').addEventListener('click',function(e){
                initAudio();
                var L=LEVELS[gameState.currentLevel];
                var rect=$('scene-canvas').getBoundingClientRect();
                var mx=e.clientX-rect.left,my=e.clientY-rect.top;
                var w=rect.width,h=rect.height;
                var hs=L.hotspots;
                for(var i=0;i<hs.length;i++){
                    if(hs[i].room!==gameState.currentRoom)continue;
                    var hx=hs[i].x*w,hy=hs[i].y*h;
                    var dx=mx-hx,dy=my-hy;
                    if(Math.sqrt(dx*dx+dy*dy)<25){
                        if(gameState.collectedClues[hs[i].id]){
                            showToast('⚠️ 已经调查过这个线索了');
                            playClick();
                            return;
                        }
                        collectClue(hs[i].id);
                        return;
                    }
                }
            });

            function collectClue(clueId){
                var L=LEVELS[gameState.currentLevel];
                var clue=L.clues[clueId];
                gameState.collectedClues[clueId]=true;
                var room=L.hotspots.find(function(h){return h.id===clueId;}).room;
                if(!gameState.cluesByRoom[room])gameState.cluesByRoom[room]=[];
                gameState.cluesByRoom[room].push(clueId);
                playReveal();
                var collectedCount=0;
                var ck=Object.keys(gameState.collectedClues);
                for(var i=0;i<ck.length;i++){if(gameState.collectedClues[ck[i]])collectedCount++;}
                $('clue-counter').textContent='线索：'+collectedCount+'/'+L.totalClues;
                $('clue-progress').style.width=(collectedCount/L.totalClues*100)+'%';
                updateClueList();
                showModal('🔍 '+clue.title,clue.desc);
                triggerBloodBurst(100+Math.random()*600,80+Math.random()*300);
                renderScene();
                if(collectedCount>=L.totalClues){
                    setTimeout(function(){showToast('🎯 所有线索已收集！是时候做出结论了！',3000);playSuccess();},1500);
                }
            }

            function updateClueList(){
                var L=LEVELS[gameState.currentLevel];
                var div=$('clue-list');div.innerHTML='';
                var ck=Object.keys(gameState.collectedClues);
                var count=0;
                for(var i=0;i<ck.length;i++){
                    if(!gameState.collectedClues[ck[i]])continue;
                    count++;
                    var clue=L.clues[ck[i]];
                    var e=document.createElement('div');
                    e.className='clue-entry';
                    e.innerHTML='<div class="c-title">🔍 '+clue.title+'</div><div>'+clue.desc.substring(0,60)+'...</div>';
                    div.appendChild(e);
                }
                if(count===0){
                    div.innerHTML='<p style="color:#555;font-size:10px;text-align:center;padding-top:16px;">点击场景中的闪光点<br>进行调查...</p>';
                }
            }

            // ==================== 房间标签 ====================
            function renderRoomTabs(){
                var L=LEVELS[gameState.currentLevel];
                var tabs=$('scene-tabs-row');tabs.innerHTML='';
                if(L.rooms.length<=1){tabs.style.display='none';return;}
                tabs.style.display='flex';
                for(var i=0;i<L.rooms.length;i++){
                    var r=L.rooms[i];
                    var b=document.createElement('button');
                    b.className='scene-tab-btn'+(r===gameState.currentRoom?' active':'');
                    b.textContent=L.roomNames[r]||r;
                    (function(rid){
                        b.addEventListener('click',function(){initAudio();playClick();switchRoom(rid);});
                    })(r);
                    tabs.appendChild(b);
                }
            }

            // ==================== 证据分析板 ====================
            function openAnalysis(){
                var L=LEVELS[gameState.currentLevel];
                showScene('analysis-scene');
                $('analysis-subtitle').textContent='案件：'+L.title+' · 已收集线索分析';
                var grid=$('analysis-grid');grid.innerHTML='';
                var ck=Object.keys(gameState.collectedClues);
                var collected=[];
                for(var i=0;i<ck.length;i++){if(gameState.collectedClues[ck[i]])collected.push(ck[i]);}
                if(collected.length===0){
                    grid.innerHTML='<div class="analysis-card" style="grid-column:1/-1;text-align:center;color:#888;">🔍 请先收集线索后再进行分析</div>';
                    return;
                }
                for(var j=0;j<collected.length;j++){
                    var clue=L.clues[collected[j]];
                    var card=document.createElement('div');
                    card.className='analysis-card highlight';
                    card.innerHTML='<div class="a-label">🔍 '+clue.title+'</div><div>'+clue.desc+'</div>';
                    grid.appendChild(card);
                }
                var missing=L.totalClues-collected.length;
                if(missing>0){
                    var missCard=document.createElement('div');
                    missCard.className='analysis-card';
                    missCard.style.gridColumn='1/-1';
                    missCard.innerHTML='<div class="a-label" style="color:#e74c3c;">⚠️ 尚有'+missing+'条线索未收集</div><div style="color:#888;">建议继续调查后再做最终结论</div>';
                    grid.appendChild(missCard);
                }
            }

            // ==================== 指控系统 ====================
            function openAccuse(){
                var collectedCount=0;
                var ck=Object.keys(gameState.collectedClues);
                for(var i=0;i<ck.length;i++){if(gameState.collectedClues[ck[i]])collectedCount++;}
                if(collectedCount<3){showToast('⚠️ 至少需要收集3条线索才能做出结论',2500);
                    playFail();return;}
                var L=LEVELS[gameState.currentLevel];
                showScene('accuse-scene');
                $('accuse-title').textContent='你的结论是什么？';
                $('accuse-desc').textContent='已收集 '+collectedCount+'/'+L.totalClues+' 条线索';
                var grid=$('accuse-grid');grid.innerHTML='';
                for(var j=0;j<L.accuseOptions.length;j++){
                    var opt=L.accuseOptions[j];
                    var card=document.createElement('div');
                    card.className='accuse-card';
                    card.innerHTML='<div class="a-avatar">'+opt.avatar+'</div><div class="a-name">'+opt.name+'</div>';
                    (function(oid){
                        card.addEventListener('click',function(){initAudio();resolveCase(oid);});
                    })(opt.id);
                    grid.appendChild(card);
                }
            }

            function resolveCase(accusedId){
                stopTimer();
                var L=LEVELS[gameState.currentLevel];
                var isCorrect=(accusedId===L.correctKiller);
                var timeRating=getTimeRating();
                var collectedCount=0;
                var ck=Object.keys(gameState.collectedClues);
                for(var i=0;i<ck.length;i++){if(gameState.collectedClues[ck[i]])collectedCount++;}
                var clueRating=getClueRating(collectedCount,L.totalClues);
                var overall=calculateOverallGrade(timeRating,clueRating,isCorrect);
                var ending=L.endings[accusedId]||L.endings['default'];
                showScene('ending-scene');
                var ec=$('ending-content');
                ec.className=ending.cls||'';
                $('ending-title').textContent=ending.title;
                $('ending-text').innerHTML=ending.text+
                    '<hr style="border-color:#333;margin:10px 0;">'+
                    '<p style="font-size:11px;color:#888;">⏱ '+timeRating.label+'（'+gameState.elapsedSeconds+'秒） | '+
                    '🔍 '+clueRating.label+'（'+collectedCount+'/'+L.totalClues+'） | '+
                    '💡 使用提示：'+gameState.hintsUsed+'次 | ⚡ 施压：'+gameState.pressureCount+'次</p>';
                $('ending-badge').textContent=ending.badge+' | 综合评级：'+overall;
                if(isCorrect){
                    playSuccess();
                    triggerBloodBurst(400,300);
                    if(!gameState.completed[gameState.currentLevel]||gameState.completed[gameState.currentLevel]!=='S'){
                        gameState.completed[gameState.currentLevel]=overall;
                    }
                    var total=0;var ckeys=Object.keys(gameState.completed);
                    for(var i=0;i<ckeys.length;i++){
                        var g=gameState.completed[ckeys[i]];
                        total+=(g==='S'?4:g==='A'?3:g==='B'?2:1);
                    }
                    gameState.totalScore=total;
                    if(gameState.currentLevel>=gameState.maxUnlocked&&gameState.currentLevel<6){
                        gameState.maxUnlocked=gameState.currentLevel+1;
                    }
                }else{
                    playFail();
                    playDramatic();
                    triggerBloodBurst(400,300);
                    setTimeout(function(){triggerBloodBurst(300,350);},600);
                }
                saveProgress();
            }

            // ==================== 提示系统 ====================
            function giveHint(){
                var L=LEVELS[gameState.currentLevel];
                var ck=Object.keys(L.clues);
                var uncollected=[];
                for(var i=0;i<ck.length;i++){if(!gameState.collectedClues[ck[i]])uncollected.push(ck[i]);}
                if(uncollected.length===0){showToast('🎯 所有线索已收集完毕！');return;}
                gameState.hintsUsed++;
                var rnd=uncollected[Math.floor(Math.random()*uncollected.length)];
                var hs=L.hotspots.find(function(h){return h.id===rnd;});
                if(hs){
                    showToast('💡 提示：查看 "'+hs.label+'" 附近 · 剩余未收集：'+uncollected.length+'条',3500);
                    if(hs.room!==gameState.currentRoom){switchRoom(hs.room);}
                }
            }

            // ==================== 进度保存 ====================
            function saveProgress(){
                try{
                    var data={
                        maxUnlocked:gameState.maxUnlocked,
                        completed:gameState.completed,
                        totalScore:gameState.totalScore
                    };
                    localStorage.setItem('pixel_detective_v7',JSON.stringify(data));
                }catch(e){}
            }

            function loadProgress(){
                try{
                    var raw=localStorage.getItem('pixel_detective_v7');
                    if(raw){
                        var data=JSON.parse(raw);
                        gameState.maxUnlocked=data.maxUnlocked||1;
                        gameState.completed=data.completed||{};
                        gameState.totalScore=data.totalScore||0;
                    }
                }catch(e){}
            }

            // ==================== 事件绑定 ====================
            $('btn-start-game').addEventListener('click',function(){initAudio();
                playClick();
                loadProgress();
                renderLevelSelect();
                showScene('level-scene');});
            $('btn-back-title').addEventListener('click',function(){initAudio();
                playClick();
                showScene('title-scene');});
            $('btn-back-level').addEventListener('click',function(){initAudio();
                playClick();
                stopTimer();
                renderLevelSelect();
                showScene('level-scene');});
            $('btn-hint').addEventListener('click',function(){initAudio();
                playClick();
                giveHint();});
            $('btn-analysis').addEventListener('click',function(){initAudio();
                playClick();
                openAnalysis();});
            $('btn-analysis-back').addEventListener('click',function(){initAudio();
                playClick();
                showScene('game-scene');
                renderScene();
                renderRoomTabs();});
            $('btn-accuse-open').addEventListener('click',function(){initAudio();
                playClick();
                openAccuse();});
            $('btn-accuse-cancel').addEventListener('click',function(){initAudio();
                playClick();
                showScene('game-scene');
                renderScene();
                renderRoomTabs();});
            $('btn-dialogue-back').addEventListener('click',function(){initAudio();
                playClick();
                showScene('game-scene');
                renderScene();
                renderRoomTabs();});
            $('btn-restart').addEventListener('click',function(){initAudio();
                playClick();
                startLevel(gameState.currentLevel);});
            $('btn-ending-menu').addEventListener('click',function(){initAudio();
                playClick();
                renderLevelSelect();
                showScene('level-scene');});

            // ==================== 窗口resize ====================
            var resizeTimeout;
            window.addEventListener('resize',function(){
                clearTimeout(resizeTimeout);
                resizeTimeout=setTimeout(function(){
                    if(gameState.currentLevel&&$('game-scene').classList.contains('active')){
                        renderScene();
                    }
                },300);
            });

            // ==================== 动画循环 ====================
            function animationLoop(){
                if(gameState.currentLevel&&$('game-scene').classList.contains('active')){
                    renderScene();
                }
                requestAnimationFrame(animationLoop);
            }
            requestAnimationFrame(animationLoop);

            // ==================== 初始化 ====================
            loadProgress();
            console.log('🕵️ 像素侦探：六重谜案 v7.0 增强版');
            console.log('📋 6个完整案件 | ⏱ 计时评分 | 📊 证据分析 | 💬 审讯施压 | 🩸 血液特效');
            console.log('🔓 已解锁：'+gameState.maxUnlocked+'/6 | 总评分：'+gameState.totalScore);
        })();
    </script>
